map:
  id: race-166-randow-maps
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: 16 mm sensors, 0.04 m gap
    notes: 'Keeps the baseline 0.16 m sensor spread and weights (25 times x) and changes
      only sensor size to 16 mm, so the 24 mm gap between footprints is narrower than
      the 25 mm tape. Narrowing the spread in iteration 1 lowered progress on every
      track, so this tests line-loss coverage without that cost.


      ### Rationale


      The race evidence rejects the narrower spread. Iteration 1 (x = ±0.06, 0.03
      m spacing) cut oval line losses from 2.15 to 0.0, but progress fell on every
      track: oval 0.19 to 0.115, s-bend 0.068 to 0.04, and slalom 0.03 to 0.107 with
      one line loss per run. Score fell from 38.87 to 36.73. So coverage was not the
      only limit, and narrowing the spread also reduced the corrective signal the
      robot needs. Max_error stayed at the 0.06 m off-track floor in both races, so
      the robot still drifts off the line.


      The oval line losses in the baseline most likely came from gaps between 12 mm
      footprints. At 0.04 m spacing the gap is 28 mm, wider than the 25 mm tape, so
      the tape can fall between sensors and the sum of readings drops below 0.05.
      I will keep the baseline 0.16 m spread and 0.04 m spacing, and enlarge the footprint
      from 12 mm to 16 mm. The gap between 16 mm footprints is 24 mm, which is narrower
      than the tape, so at least one sensor should always see the tape. This targets
      the line-loss cause without narrowing the steering authority that the narrow-spread
      test lost.


      To keep steering gain unchanged, sensor_weights stay at 25 times each sensor''s
      x (-2, -1, 0, 1, 2), the same as the baseline, so the Integrator needs no rescaling.
      Wheel track 0.12, mass 0.8, radius 0.03, body dimensions and sensor lead y =
      0.04 are unchanged, so this race isolates the sensor-size change against the
      baseline.


      Expected result: oval line losses fall from about 2.15 toward zero and progress
      rises above the baseline 0.19. Risk: the larger footprint reduces edge sensitivity
      at the outer sensors and may soften the signal. If progress does not rise, the
      limit is steering lag or base speed, and the next move is to the Integrator''s
      gains, not the sensors.


      - [Open this output](iteration-2/entity0/versions/80f75fc6685b41d98a356c754ee6b2e0/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-edf7292b9249bb45/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-e4479111ee96bcac/payload.json)'
  - id: entity1
    label: Narrow 0.03 m sensor
    notes: 'Adopts the Builder''s 0.03 m spacing over ±0.06 m, with weights rescaled
      to ±1.5/±0.75 to keep 25 per metre of steering gain. Controller gains and base
      speed are held constant to isolate coverage, based on the baseline''s 2.15 oval
      line losses.


      ### Rationale


      The baseline (entityR2B, iteration 0 geometry) finished no trials on any track.
      On the oval, line_loss_events averaged 2.15 and max_error sat at the 0.06 m
      off-track floor. On the s-bend, line_loss_events was only 0.15, yet all 20 trials
      still ended off track with progress 0.068. Line loss is therefore not the only
      failure mode. The s-bend needs a different fix, most likely in the controller
      or base speed. On the slalom, progress was 0.03 with no line losses, so the
      robot left the line through steering error rather than losing it.


      The Builder''s geometry change is applied as proposed: five 12 mm sensors at
      x = -0.06, -0.03, 0, 0.03, 0.06 with y = 0.04. The 18 mm gap between footprints
      is smaller than the 25 mm tape, so the line should be seen by at least one sensor
      across the spread. Wheel track (0.12), mass (0.8), radius (0.03) and body dimensions
      are unchanged, so this race isolates the spacing change.


      The weights are rescaled to keep the same signal gain per metre of lateral offset
      as the baseline. The baseline used x/0.04 (25 per metre). The new weights are
      x/0.04 at the new spread, giving (-1.5, -0.75, 0, 0.75, 1.5), which is 25 per
      metre again. With kp, ki and kd unchanged, the steering response to a given
      offset should match the baseline, so any change in results comes from sensor
      coverage. The gains stay at kp 3.0, ki 0.1, kd 0.2. base_speed stays at 2.0
      because the course must be covered in under 3 s. line_loss stays ''last_direction'',
      which worked as the recovery path in the baseline.


      Expected result: fewer oval and s-bend line losses and more progress. This is
      a hypothesis, not a measured outcome. If line losses fall but progress does
      not, the next limit is steering or speed.


      - [Open this output](iteration-1/entity1/versions/84902651445643939ee2d743e3a77956/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/660712b1c3f645c99184e3fbaec1e7ec/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-1e8cb46499b9e494/payload.json)'
  - id: entityR1
    label: Coverage vs steering
    notes: 'Pre-race feedback citing iteration 0: baseline s-bend lost the line only
      0.15 times yet still ended at 0.068 progress, so coverage alone may not fix
      it. Requests three conditional changes (base speed or kd, wheel track or mass,
      forward lead y=0.06).


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. Evidence
      from iteration 0 (entityR2B): every trial on all three tracks ended off track,
      with no completions. On the oval, line_loss_events averaged 2.15 and max_error
      sat at the 0.06 m floor. On the s-bend, line_loss_events was only 0.15, but
      progress was 0.068. So on the s-bend the robot left the line without losing
      it. Coverage alone will not fix that track. On the slalom, progress was 0.03
      with zero line losses, so steering error, not coverage, is the limit there.


      What I had to compensate for in the controller: the sensor weights had to be
      rescaled to the new spread so the steering gain per metre of offset stays at
      25. I did this without changing kp, ki or kd. I kept base_speed at 2.0 because
      the course needs about 1.5 m/s average. I kept last_direction recovery, which
      the baseline used without visible failure. If your next geometry changes the
      spread again, the weights must be rescaled the same way or the steering gain
      will shift.


      What to change depending on the next race: (1) If oval line_loss_events fall
      but s-bend progress stays near 0.07, the limit is not coverage. Keep the geometry
      and ask the Integrator for a lower base speed or higher kd before changing the
      sensors again. (2) If steering_oscillation is high with completion intact, reduce
      wheel_track to 0.10 or raise mass to 1.0. (3) If the slalom rms_error stays
      high with few line losses, test a forward sensor lead at y = 0.06.


      ### Requested changes


      - If the next race shows that line_loss_events fall on the oval but s-bend progress
      stays near the baseline 0.068, keep this sensor spread and change the geometry
      only after the Integrator tests base speed or derivative gain. Baseline s-bend
      evidence: 0.15 line losses, but every trial ended off track at progress 0.068.

      - If the next race shows high steering_oscillation with completion intact, reduce
      wheel_track from 0.12 to 0.10, or raise mass from 0.8 to 1.0, to lower turn
      authority or raise yaw inertia. Baseline oscillation was 0.10 on the oval and
      0.08 on the s-bend, so check whether the new spread raises it.

      - If the slalom rms_error stays high with few line losses after this spacing
      change, move the sensors forward to y = 0.06 while keeping x = -0.06, -0.03,
      0, 0.03, 0.06. Baseline slalom evidence: max_error 0.060 and progress 0.033
      with zero line losses, which points to steering lead rather than coverage.


      - [Open this output](iteration-1/entityR1/versions/84902651445643939ee2d743e3a77956/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/660712b1c3f645c99184e3fbaec1e7ec/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-1e8cb46499b9e494/payload.json)'
