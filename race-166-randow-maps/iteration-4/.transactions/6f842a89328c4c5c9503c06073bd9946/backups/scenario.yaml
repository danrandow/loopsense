  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 3 (16 mm sensors, y = 0.07 m, 0.16 m spread) is the best result so
      far at 54.90, up from 26.64. The gain came from the s-bend (progress 0.04 to
      0.165) and the slalom (0.03 to 0.1075), and the oval line losses stayed at zero.
      Oval progress did not move, though: 0.115 in iteration 2, 0.1175 in iteration
      3. max_error sits at the 0.06 m off-track floor on every track, and the floor
      cannot be raised by body width, because even at 0.18 m the limit is only 0.0575
      m. The Integrator''s pre-race feedback set a rule for this case: if oval progress
      stays flat near 0.115 with max_error still about 0.06 at y = 0.07, test wheel_track
      0.10. That condition now holds. Oval steering_oscillation is 0.074, well below
      the 0.10 limit that would call for pulling the lead back, so the forward lead
      is not causing jitter there. The s-bend oscillation did rise to 0.144, which
      I will watch but do not treat as a reason to revert. Narrowing the track to
      0.10 m, with mass and sensors unchanged, raises turn rate per unit of wheel-speed
      difference (turn rate = wheel speed difference / wheel_track), so the robot
      can correct harder at the same controller output. Sensor geometry and the 25-per-metre
      weights stay fixed, so this race isolates turn authority.


      - [Open this output](iteration-4/entity0/versions/c8c93e4c36674d4abc87e307d37976e6/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-444aeaa9b8079e14/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-ebba98117ce8d53f/payload.json)'
  - id: entity1
    label: Complete Robot Package
    notes: 'Complete Robot Package. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 3 is the best result so far (54.90). Its gain came from the s-bend
      and slalom, while oval progress stayed flat at 0.1175 with max_error at the
      0.06 m off-track floor. The Builder''s iteration 4 proposal changes one thing:
      wheel_track from 0.12 to 0.10 m. Geometry is otherwise unchanged from iteration
      3: 16 mm sensors, x = -0.08 to 0.08 at 0.04 m spacing, y = 0.07, wheel radius
      0.03, mass 0.8, body 0.16 by 0.14. The controller is also unchanged from iteration
      3 (kp 3.0, ki 0.1, kd 0.2, base_speed 2.0, sensor_weights -2, -1, 0, 1, 2, line_loss
      last_direction), so the race isolates the track change. Turn rate per unit of
      wheel-speed difference rises by about 0.12/0.10 = 1.2x, so the same kp produces
      about 20% more yaw. I am not adding a gain change to keep the test clean, and
      I expect the s-bend oscillation to rise (iteration 3 was 0.144). I am keeping
      the existing controller because no telemetry from this geometry exists yet.
      Expected: oval progress above 0.1175 with max_error below 0.06, s-bend and slalom
      progress at or above iteration 3, and s-bend steering_oscillation below about
      0.15.


      - [Open this output](iteration-4/entity1/versions/65d6d7288da54ee781e5aaf20c0dd674/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/c8c93e4c36674d4abc87e307d37976e6/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-ebba98117ce8d53f/payload.json)'
  - id: entityR1
    label: Integration Feedback
    notes: 'Integration Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. Evidence:
      iteration 3 (y = 0.07, 16 mm, wheel_track 0.12) gave 54.90, with oval progress
      flat at 0.1175 and max_error at the 0.06 floor, while the s-bend reached 0.165
      with oscillation 0.144 and the slalom had one line loss at 0.1075 progress.
      Iteration 2 (y = 0.04, same footprint) left oval progress at 0.115, so the lead,
      not the footprint, moved the s-bend and slalom. Integration note: I kept the
      controller unchanged, so the same kp now produces about 20% more yaw (0.12/0.10).
      That is the effect you want on the oval, but it is also the main risk on the
      s-bend. Decide the next step from the race telemetry: if the oval rises above
      0.1175 with max_error below 0.06 and the s-bend oscillation stays at or below
      0.15, the turn-authority hypothesis holds and the next test is the lead. If
      the s-bend oscillation exceeds 0.15 or the slalom loses the line again, the
      track is over-responding and you should return to 0.12. If oval progress stays
      flat at 0.1175 with max_error still at the floor, turn authority is not the
      limit, and the next test is lower mass.


      ### Requested changes


      - If the next race shows oval progress above 0.1175 and max_error below 0.06
      with s-bend steering_oscillation at or below 0.15, keep wheel_track 0.10 and
      test the forward lead at y = 0.08 (the contract maximum) with the same spread
      and weights. Evidence: iteration 3 showed the lead moved s-bend progress from
      0.04 to 0.165 and slalom from 0.03 to 0.1075.

      - If the next race shows s-bend steering_oscillation above 0.15 with completion
      still zero, or any slalom line loss, return wheel_track to 0.12 and set the
      lead to y = 0.06. Evidence: iteration 3 s-bend oscillation was 0.144 and slalom
      had one line loss at y = 0.07, so a narrower track is the likely cause of further
      jitter.

      - If oval progress stays at 0.1175 with max_error at about 0.06 at wheel_track
      0.10, set mass to 0.6 to lower yaw inertia (mass times (body_length² + body_width²)/12)
      and make turn response quicker, keeping the other fields fixed. Evidence: oval
      steering_oscillation was only 0.074 in iteration 3, well below the 0.10 limit,
      so there is room for a more responsive robot on that track.


      - [Open this output](iteration-4/entityR1/versions/65d6d7288da54ee781e5aaf20c0dd674/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/c8c93e4c36674d4abc87e307d37976e6/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-ebba98117ce8d53f/payload.json)'
