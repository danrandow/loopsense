map:
  id: race-166-randow-maps
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 5 (wheel_track 0.12, y = 0.06) scored 36.76, the worst result since
      iteration 1. Its s-bend progress fell from 0.165 at y = 0.07 to 0.04, the same
      as the y = 0.04 baseline, so the forward lead is what carries the s-bend gain.
      Slalom still lost the line once per run. The Integrator''s rule applies: at
      y = 0.06 the s-bend progress is below 0.12, so the lead returns to y = 0.07
      at wheel_track 0.12. That is the iteration 3 design, which scored 54.90 with
      s-bend progress 0.165, s-bend steering_oscillation 0.144 (under the 0.15 limit),
      and oval steering_oscillation 0.074. Iteration 4 (wheel_track 0.10) scored 56.50,
      but its s-bend oscillation rose to 0.164, so narrowing the track is over-responding.
      Oval progress has been flat at 0.1175 across every test of track width and lead,
      so turn authority and lead are not the oval lever. The Integrator''s rule for
      this case is to test one oval lever, mass, while the s-bend oscillation is at
      or below 0.15. The iteration 3 design meets that condition (0.144), so I restore
      y = 0.07 and wheel_track 0.12 and change only mass, from 0.8 to 0.6 kg. Lower
      mass lowers yaw inertia (mass times (body_length squared plus body_width squared)
      over 12), so the robot should respond more quickly on the oval. Sensor footprint
      (16 mm), spread (x = -0.08 to 0.08), body, wheel radius and the 25-per-metre
      weights are unchanged, so this race isolates the mass change against iteration
      3. Expected result: oval progress rises above 0.1175, and s-bend progress stays
      near 0.165. The risk is that the quicker turn response pushes s-bend steering_oscillation
      above 0.15, which would mean mass 0.8 should be restored.


      - [Open this output](iteration-6/entity0/versions/028402317c0b46c0b883c235b266fcf4/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-e574eb22589c9ed2/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-48df655857328444/payload.json)'
  - id: entity1
    label: Track 0.12, lead y=0.06
    notes: 'Applies the Builder''s proposal: wheel_track back to 0.12 and sensor lead
      to y = 0.06, with the unchanged controller. Chosen because iteration 4 (wheel_track
      0.10) pushed s-bend oscillation to 0.164 and slalom line losses to 0.95, above
      the limits.


      ### Rationale


      Race evidence. Iteration 3 (wheel_track 0.12, y = 0.07) scored 54.90, with s-bend
      progress 0.165, s-bend steering_oscillation 0.144, slalom line losses 1.0 per
      run, and oval progress flat at 0.1175 with max_error at the 0.06 floor. Iteration
      4 (wheel_track 0.10, y = 0.07) scored 56.50, the best so far, but its telemetry
      crosses both Integrator rules: s-bend steering_oscillation rose to 0.164 (above
      the 0.15 limit), and slalom line losses rose to 0.95 per run. Oval progress
      stayed at 0.1175 and max_error stayed at the floor, so the narrower track did
      not add useful oval turn authority. The Builder''s iteration 5 proposal returns
      wheel_track to 0.12 and moves the sensor lead from y = 0.07 to y = 0.06. I am
      applying that geometry as proposed. The Integrator''s second rule takes priority,
      so the mass 0.6 change from the iteration 4 feedback is not applied, because
      it only applies at wheel_track 0.10.


      Controller decision. The controller is unchanged from iterations 3 and 4 (kp
      3.0, ki 0.1, kd 0.2, base_speed 2.0, sensor_weights -2, -1, 0, 1, 2, line_loss
      last_direction). The sensor weights stay at 25 per metre of x, so steering gain
      per metre is the same as in the earlier races. Keeping the controller fixed
      means this race isolates the track and lead change. Shortening the lead reduces
      the phase lead that drove s-bend oscillation, and returning the track to 0.12
      lowers turn rate per unit of wheel-speed difference, which should reduce both
      s-bend and slalom oscillation.


      Expected result (not measured): s-bend steering_oscillation at or below 0.15,
      slalom line_loss_events near zero, oval progress near 0.1175, and s-bend progress
      somewhat below 0.165, perhaps in the 0.13 to 0.16 range. Score is expected to
      stay near the 54 to 57 level. If s-bend progress drops below about 0.12, the
      lead is too short, and the next design should restore y = 0.07 at wheel_track
      0.12, which is the iteration 3 design.


      - [Open this output](iteration-5/entity1/versions/161bb9e7fab94c7f9211e881813addc6/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/9e712627649c42f0928316ebd54da80f/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-28cdcb7eb2e9711d/payload.json)'
  - id: entityR1
    label: Lead and mass branches
    notes: 'Gives pre-race branches: restore y = 0.07 if s-bend progress falls below
      0.12, test mass 0.6 if oscillation clears, and pull the lead to y = 0.05 if
      oscillation stays above 0.15. Evidence is iterations 3 and 4 telemetry.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. Evidence:
      iteration 3 (wheel_track 0.12, y = 0.07) scored 54.90, with s-bend progress
      0.165, s-bend steering_oscillation 0.144, slalom line losses 1.0 per run, and
      oval progress flat at 0.1175 with max_error at the 0.06 floor. Iteration 4 (wheel_track
      0.10, y = 0.07) scored 56.50, the best so far, but s-bend steering_oscillation
      rose to 0.164 (above the 0.15 limit) and slalom line losses rose to 0.95 per
      run. Oval progress stayed at 0.1175 and max_error stayed at the floor, so narrowing
      the track did not help the oval. The controller is unchanged (kp 3.0, ki 0.1,
      kd 0.2, base_speed 2.0, last_direction), so the race isolates your geometry
      change. Integration note: the lead reduction and track return should reduce
      the over-response. The main trade-off is that a shorter lead may reduce s-bend
      progress. Decide the next step from the next race''s telemetry, reported per
      track: if s-bend steering_oscillation is at or below 0.15 with slalom line losses
      near zero and s-bend progress at or above 0.12, keep y = 0.06 and use the next
      iteration to test a single oval lever. If s-bend progress falls below about
      0.12, the forward lead was providing the s-bend gain, so restore y = 0.07 at
      wheel_track 0.12. If oscillation is still above 0.15 with completion still zero,
      the track or lead is still too strong, and the next step is to test the mass
      change.


      ### Requested changes


      - If the next race shows s-bend progress below about 0.12 at wheel_track 0.12
      and y = 0.06, restore the sensor lead to y = 0.07 and keep wheel_track 0.12.
      Evidence: iteration 3 at y = 0.07 gave s-bend progress 0.165, versus the 0.04
      baseline at y = 0.04, so the lead carries the s-bend gain.

      - If the next race shows s-bend steering_oscillation at or below 0.15 and slalom
      line losses near zero at y = 0.06, keep wheel_track 0.12 and test mass 0.6 at
      the same spread and lead to test whether a quicker robot lifts oval progress.
      Evidence: oval steering_oscillation was 0.074 in iterations 3 and 4, well below
      the 0.10 limit, and oval progress stayed flat at 0.1175 across both track widths,
      so oval turn authority is not the lever.

      - If the next race still shows s-bend steering_oscillation above 0.15 with slalom
      line losses at y = 0.06 and wheel_track 0.12, reduce the sensor lead to y =
      0.05 at wheel_track 0.12 and keep the spread at x = -0.08 to 0.08. Evidence:
      iteration 4 showed that a narrower track raised s-bend oscillation to 0.164
      and slalom line losses to 0.95, so over-response is the likely cause.


      - [Open this output](iteration-5/entityR1/versions/161bb9e7fab94c7f9211e881813addc6/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/9e712627649c42f0928316ebd54da80f/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-28cdcb7eb2e9711d/payload.json)'
