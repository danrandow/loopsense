  entities:
  - id: entity0
    label: Radius 0.035, lighter
    notes: 'Moderate wheel-radius increase (0.03 to 0.035 m) for more ground speed,
      with kp scaled down to keep the effective turn gain at the stable iteration-5
      level (about 1.40). Mass is lowered to 0.40 kg. Evidence: iteration 5 times
      out on the slalom at 0.87 progress with no off-track endings, while iteration
      7 (radius 0.04, higher effective gain) went off track in every slalom trial.


      ### Rationale


      Evidence: iteration 5 (wheel_radius 0.03, mass 0.45, kp 4.2, kd 1.2, base 1.15)
      is the best raced design at 746. Oval and s-bend finish with margin (2.19 s,
      2.50 s). The slalom times out in 20 of 20 trials at 0.87 progress, with almost
      no line loss (0 events) and max_error 0.033 m. So the robot tracks the line
      but is too slow for the 3 s limit. Iteration 6 showed base_speed is not the
      limit: raising it from 1.15 to 1.28 left slalom progress unchanged (0.872 to
      0.868). Iteration 7 raised wheel_radius to 0.04 for about 33% more ground speed
      per PWM count, with kp 3.4 and kd 1.0. Oval and s-bend improved (945 and 940
      mean), but the slalom failed early by going off track in 20 of 20 trials (progress
      0.42, max_error 0.063). Turn gain per unit signal scales roughly as kp*wheel_radius/wheel_track.
      Iteration 5 gives 4.2*0.03/0.09 = 1.40. Iteration 7 gives 3.4*0.04/0.09 = 1.51,
      which is higher, and the extra speed and gain together pushed the robot off
      the line.


      Changes: (1) wheel_radius 0.03 to 0.035 m, a smaller step (about 17% more ground
      speed) than iteration 7. (2) kp 4.2 to 3.6, so the effective turn gain is 3.6*0.035/0.09
      = 1.40, the same as the stable iteration 5. (3) kd 1.2 to 1.1, scaled with kp
      to keep damping in proportion. (4) mass 0.45 to 0.40 (the contract minimum)
      for faster acceleration and quicker yaw response, since lower mass removed the
      off-track endings in iteration 5. (5) base_speed 1.15 to 1.25 to add some command
      headroom. Sensors, sensor size, ki and line_loss are unchanged.


      Expected result: slalom progress rises from 0.87 toward 0.95 or more, with the
      first slalom completions possible. Oval and s-bend still finish with lower completion_time.
      Risks: the faster robot may leave the line on tight bends (off-track endings
      above about 4 of 20 would indicate this), and a smaller gain margin may increase
      the max_error on the slalom.


      Hypotheses: H1, if the slalom still times out near 0.87 progress, the speed
      limit comes from turning losses, so the next test is kp about 3.2 with base
      1.35. H2, if off-track endings rise above about 4 of 20, the speed is too high
      for the gain, so set base to 1.15 and kd to 1.3. H3, if steering_oscillation
      on the slalom exceeds about 0.5, kd is too low for this speed, so raise kd toward
      1.3.


      Measurements wanted: slalom progress and completion_time for speed margin, slalom
      max_error and line_loss_events for steering margin, and steering_oscillation
      with control_effort for damping.


