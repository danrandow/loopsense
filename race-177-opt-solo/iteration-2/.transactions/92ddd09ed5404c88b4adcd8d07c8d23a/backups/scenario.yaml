  entities:
  - id: entity0
    label: Sharper steering, wider
    notes: 'Raises kp from 2.5 to 3.5 and kd to 0.6, moves sensors to y 0.08, narrows
      the track to 0.10 m, and lowers mass to 0.5 kg. Iteration 1 showed max error
      at the 0.06 m off-track limit on the s-bend and slalom, so the goal is stronger
      steering with more lead distance.


      ### Rationale


      Evidence from iteration 1 (kp 2.5, kd 0.4, ki 0, base 1.3, 16 mm sensors at
      y 0.06, mass 0.6): the oval finished in 10 of 20 trials, but the s-bend (mean
      progress 0.47) and slalom (mean progress 0.17) always ended off track. Max error
      was 0.055 to 0.062 m against an off-track limit of 0.06 m. Body width cannot
      help, because the limit is max(0.06, 0.0125 + body_width/4), which is 0.06 at
      every allowed width. So the robot must keep its lateral error below 0.06 m by
      steering better. Line loss still occurred about once per run, and steering oscillation
      was moderate (0.37 on the oval). The failure is on the sharper bends, where
      steering response is too slow.


      Changes: (1) kp 2.5 to 3.5, for about 40 percent more steering per unit of signal
      on sharp bends. (2) kd 0.4 to 0.6 to damp the faster response; the oscillation
      (0.37) suggests some margin remains. (3) Sensors moved forward to y 0.08 (the
      contract maximum), so the steering command leads the wheels by more distance
      and reaches sharp bends earlier. (4) wheel_track 0.12 to 0.10, so the same PWM
      difference produces a higher turn rate (turn rate is the wheel speed difference
      divided by track). (5) Mass 0.6 to 0.5 kg for lower yaw inertia and quicker
      turn response. (6) base_speed 1.3 to 1.2 to give steering more time per bend,
      at some cost in completion time. Sensor spacing stays at 0.02 m, sensor size
      16 mm and line_loss last_direction are unchanged, because they were not the
      cause of the failures.


      Expected result: the s-bend and slalom should lose the line less often and progress
      further, with max_error lower than 0.055 m. The oval should finish more reliably.
      Risk: kp 3.5 may cause oscillation on the oval. Hypotheses to test: H1, if steering_oscillation
      rises above about 0.6 with few line losses, the controller is now too aggressive,
      so back kp off to about 3.0 and raise kd. H2, if max_error stays near 0.06 on
      the slalom while line_loss is 0, the steering authority is still too low, so
      raise kp further or reduce base_speed. H3, if line_loss_events stay near 1 per
      run at a fixed track position, the line-loss search direction is the problem,
      so test search_right. Measurements wanted: progress and completion_time for
      the speed margin, max_error and line_loss_events for steering margin, and steering_oscillation
      and control_effort for damping.


