  entities:
  - id: entity0
    label: Stabler steering, 16mm
    notes: 'Raises kp to 2.5 and kd to 0.4, drops ki and base_speed to 1.3, and enlarges
      sensors to 16 mm placed further forward. Baseline runs all left the line by
      off_track (max_error about 0.06) with 1 line loss each, so this targets steering
      margin before speed.


      ### Rationale


      Evidence from R2A: all 60 development trials ended off_track with no completions.
      Progress was only 0.04 to 0.11, rms_error about 0.03 m, max_error about 0.06
      m (the off-track limit is 0.06 m for this body), and line_loss_events averaged
      1.0 per run. The robot leaves the line early, not late, and the failure is steering,
      not speed. The baseline''s kp of 1.5 with coarse weights [-2,-1,0,1,2] gives
      a weak steering response, so the robot drifts outward on bends until it loses
      the tape, then the last_direction search at 0.35 throttle carries it off. Changes:
      (1) kp raised from 1.5 to 2.5 for stronger correction on bends; (2) kd raised
      from 0.1 to 0.4 to damp the faster response and limit overshoot; (3) ki set
      to 0 to avoid integral windup on curves where the signal stays one-sided; (4)
      base_speed lowered from 1.6 to 1.3 so the robot has time to correct at each
      bend, since finishing time is secondary until it stays on the line; (5) sensor_size
      raised from 12 mm to 16 mm so at least one sensor keeps reading tape through
      small lateral offsets and line loss becomes rarer; (6) sensors moved forward
      to y = 0.06 so they see the line earlier and the steering command leads the
      wheels; (7) mass lowered to 0.6 kg to reduce yaw inertia and speed up turn response.
      Expected result: fewer line-loss events, lower max_error, and the first completions
      on the oval and s-bend; the slalom is the most likely to still fail. Hypotheses
      to test: H1, if max_error stays near 0.06 with few line losses, steering gain
      is still too low, so raise kp toward 3.5. H2, if steering_oscillation is high
      with kp 2.5, kd is too low or the sensors are too far ahead, so raise kd or
      move sensors back. H3, if line_loss_events are still 1 per run at a fixed track
      position, the search mode is the issue, so test search_right or stop. Measurements
      wanted next: progress and completion_time for speed headroom, max_error and
      line_loss_events for steering margin, and steering_oscillation for damping.


