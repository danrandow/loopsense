  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence: iteration 9 (mass 0.40, base 1.20, kp 4.2, kd 1.2, ki 0.05, radius
      0.03, track 0.09, 16 mm sensors at 0.025 m spacing, y 0.08) scored 745.6, matching
      the plateau at about 746. The oval (100% finish, 2.20 s) and s-bend (100% finish,
      2.56 s) pass with margin. The slalom times out in 20 of 20 trials at 0.87 progress,
      with almost no line loss (0 events) and max_error 0.031 m, so the robot stays
      on the line but covers the course too slowly. Earlier evidence: base_speed alone
      does not move slalom progress (iteration 6, 1.15 to 1.28 gave 0.872 to 0.868).
      Raising wheel_radius (iterations 7 and 8) added speed but also pushed the robot
      off track on the slalom (16 to 20 of 20). Lowering mass to 0.40 kept the line.
      The untested hypothesis H1 from iteration 9 is that the turn gain, not top speed,
      is limiting: a lower kp reduces the differential on each bend and may keep more
      forward speed through the alternations.


      Changes: (1) kp 4.2 to 3.8, a moderate drop in turn gain (effective gain about
      1.27 versus 1.40). (2) base_speed 1.20 to 1.30, to use the speed headroom that
      the lower kp should allow. (3) kd kept at 1.2 so damping stays in proportion
      to the steering response. Geometry, ki and line_loss are unchanged, so the effect
      of the kp and speed change can be read directly.


      Expected result: slalom progress rises above 0.90, with the first slalom completions
      possible. Oval and s-bend still finish, with s-bend time near 2.4 s. Risk: the
      robot leaves the line on the tight bends if the lower kp loses correction. Off-track
      endings above about 6 of 20 on the slalom would indicate this.


      Hypotheses: H1, if the slalom still times out near 0.87 with few off-track endings,
      the limit is not turn gain, so next test kp 3.4 with base 1.35. H2, if off-track
      endings exceed about 6 of 20 on the slalom, the speed is too high for the gain,
      so return base to 1.20 and raise kd to about 1.4. H3, if line_loss_events on
      the s-bend stay near 1 per run at one fixed position, the last_direction search
      is the limit, so test search_right.


      Measurements wanted: slalom progress and completion_time for speed margin, slalom
      max_error and line_loss_events for steering margin, and steering_oscillation
      with control_effort for damping.


