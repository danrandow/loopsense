  entities:
  - id: entity0
    label: Lighter mass, base 1.2
    notes: 'Keeps the iteration 5 geometry and steering gains, which were the best
      raced design (746), and lowers mass to 0.40 kg with base speed 1.20. Aimed at
      the slalom timeouts at about 0.87 progress, since wheel-radius increases drove
      off-track endings in iterations 7 and 8.


      ### Rationale


      Best raced design is iteration 5 (746). Oval and s-bend finish with margin,
      and the slalom times out at about 0.87 progress with almost no line loss (0
      to 0.1 events) and max_error 0.033 m. The robot stays on the line but is too
      slow for the 3 s limit. Iteration 6 showed base_speed alone does not move slalom
      progress (0.872 to 0.868). Iterations 7 and 8 raised wheel_radius, which adds
      ground speed and turn gain together, and both pushed the slalom off track (16
      to 20 of 20). So the trade-off is between speed and line-keeping, and radius
      is the wrong lever. Iteration 5 also showed that lowering mass from 0.5 to 0.45
      removed off-track endings. Change: keep iteration 5 geometry and steering gains
      (wheel_radius 0.03, wheel_track 0.09, kp 4.2, kd 1.2, ki 0.05, 16 mm sensors
      at 0.025 m spacing), lower mass from 0.45 to 0.40 kg for faster acceleration
      and quicker yaw response on the alternating bends, and raise base_speed from
      1.15 to 1.20 for a small speed gain. Expected result: slalom progress rises
      above 0.87, with a chance of first completions; oval and s-bend still finish.
      Risk: off-track endings return if speed or lighter mass destabilises the bends
      (watch for more than about 6 of 20). Hypotheses: H1, if slalom still times out
      near 0.87 progress with few off-track endings, the limit is turning losses,
      so next test a lower kp (about 3.8) with base 1.3. H2, if off-track endings
      exceed about 6 of 20, the speed is too high for the gains, so return to base
      1.15 and raise kd to about 1.4. H3, if slalom steering_oscillation exceeds about
      0.5, kd is too low. Measurements wanted: slalom progress and completion_time
      for speed margin, slalom max_error and line_loss_events for steering margin,
      and steering_oscillation with control_effort for damping.


