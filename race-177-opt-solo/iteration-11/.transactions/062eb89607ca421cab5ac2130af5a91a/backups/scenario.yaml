  - id: entity0
    label: 'Final: proven iter-5'
    notes: 'Resubmits the iteration 5 design, the best raced score (746.0), because
      no later change lifted the slalom ceiling of about 0.87 progress and the speed
      or radius changes caused off-track endings. Oval and s-bend finish with margin
      in the development data.


      ### Rationale


      Final iteration, so the priority is a robust design for the unseen-track race
      rather than further exploration. Across iterations 5, 6, 9 and 10, the stable
      line-keeping configuration scores 745 to 746. Oval and s-bend finish in every
      trial with margin (about 2.2 s and 2.5 s). The slalom times out at about 0.87
      progress with almost no line loss, and that ceiling did not move when base_speed
      changed (iteration 6) or when kp was lowered (iteration 10). Iterations 7 and
      8 showed that raising wheel_radius adds speed but pushes the robot off the line,
      so that lever is unsafe. I therefore resubmit the iteration 5 design, the best
      raced result at 746.02. It uses wheel_radius 0.03, wheel_track 0.09, kp 4.2,
      kd 1.2, ki 0.05, base_speed 1.15, mass 0.45, and 16 mm sensors at y 0.08 spaced
      0.025 m apart. Expected result: about 745 on the development tracks, with oval
      and s-bend finishing. A completed slalom would add roughly 500 or more, but
      no tested change has moved the slalom ceiling, and the next change risks reintroducing
      off-track endings. Hypotheses I would test with more iterations: H1, the slalom
      ceiling comes from a wheel or motor saturation limit that needs a different
      gearing or mass, not from steering gains. H2, a shorter sensor baseline or a
      more forward sensor row may help the robot anticipate the tight alternations.
      Measurements wanted: slalom progress and completion_time for the speed ceiling,
      max_error and line_loss_events for steering margin, and steering_oscillation
      with control_effort for damping.


