  entities:
  - id: entity0
    label: Faster base, slalom push
    notes: 'Raises base_speed from 1.15 to 1.28 with all other values unchanged, because
      iteration 5 showed zero slalom off-track endings but 20 of 20 timeouts at 0.87
      progress. Evidence is the iteration 5 slalom and the oval and s-bend finish
      margins.


      ### Rationale


      Evidence from iteration 5 (base 1.15, mass 0.45, kp 4.2, kd 1.2, ki 0.05, 16
      mm sensors at 0.025 m spacing, y 0.08, wheel_track 0.09): the oval (100% finish,
      2.19 s, max_error 0.019) and s-bend (100% finish, 2.50 s, max_error 0.030) pass
      with margin. The slalom now fails in a different way: 20 of 20 trials time out
      at 0.87 progress, with zero line-loss events, max_error 0.033 and oscillation
      0.35. The robot is stable on the line but too slow to cover the 4 to 5 m course
      in 3 s. Lowering mass from 0.5 to 0.45 (with base 1.1 to 1.15) removed every
      off-track ending (6 of 20 at iteration 4), so the lighter robot tracks the bends
      well at this speed. The remaining gap is speed. Changes: (1) base_speed 1.15
      to 1.28, a moderate step that keeps the average speed high enough to finish
      the slalom inside 3 s; (2) all steering gains, geometry, sensors and line_loss
      unchanged, so the speed change can be read directly. Expected result: slalom
      progress rising to about 0.95 or above, with the first completions and completion_time
      near 2.7 to 2.9 s; oval and s-bend still finish. Risk: off-track endings return
      at higher speed, since iteration 3 at base 1.2 with lower kd produced 17 off-track
      endings on the slalom. Hypotheses: H1, if slalom off-track endings rise above
      about 8 of 20 with line_loss_events near 1, the bends are too fast for kp 4.2
      and kd 1.2, so return to base 1.2 and raise kd to about 1.4. H2, if slalom still
      times out with progress near 0.9 and few off-track endings, raise base further
      toward 1.35 or lower mass to 0.4. H3, if oscillation on the slalom rises above
      about 0.6, kd is too low for this speed. Measurements wanted: slalom progress
      and completion_time for speed margin, slalom max_error and line_loss_events
      for steering margin, and steering_oscillation with control_effort for damping.


