map:
  id: race-15-opt-eval
  schema: v0.2
  title: Robot Race 15 — Optimizer Evaluator
  scenario: Moving Parts
  is_moo: true
  notes: 'The optimizer–evaluator entrant: complete candidates cycle through critique
    and approval before one unchanged build races and produces addressed evidence.'
  dimension_axes:
  - time_horizon
  - iteration
actors:
- id: actor0
  label: Robot Optimizer
  notes: Produces complete candidates and revises them from evaluation and race evidence.
- id: actor1
  label: Evaluator
  notes: Critiques the current candidate or approves it unchanged for racing.
- id: actor2
  label: Race Simulator
  notes: Deterministic software actor that races and records evidence.
actions:
- id: action0
  label: Optimize Robot
  actor: actor0
  notes: Produces or revises a complete geometry-controller candidate.
  measures:
  - id: input_tokens
    name: Model input tokens
    unit: tokens
  - id: output_tokens
    name: Model output tokens
    unit: tokens
  - id: repair_calls
    name: Format repair calls
    unit: calls
    better: lower
  - id: invalid_artifacts
    name: Invalid model artifacts
    unit: artifacts
    better: lower
- id: action1
  label: Evaluate and Gate
  actor: actor1
  notes: Returns critique for another cycle or approves a recorded candidate unchanged.
  measures:
  - id: input_tokens
    name: Model input tokens
    unit: tokens
  - id: output_tokens
    name: Model output tokens
    unit: tokens
  - id: repair_calls
    name: Format repair calls
    unit: calls
    better: lower
  - id: invalid_artifacts
    name: Invalid model artifacts
    unit: artifacts
    better: lower
- id: action2
  label: Race and Measure
  actor: actor2
  notes: Runs development trials and produces an outcome and addressed evidence.
entities:
- id: entity0
  label: Robot Candidate
  system_boundary: internal
  notes: Complete geometry, controller, rationale, hypotheses, and measurement request.
  measures:
  - id: requested_measurements
    name: Requested measurements
    unit: measurements
- id: entity1
  label: Approved Robot Build
  system_boundary: internal
  notes: The identified candidate selected and passed to the simulator unchanged.
- id: entity2
  label: Race Outcome
  system_boundary: internal
  notes: Human-facing result; upstream learning uses addressed returns.
  measures:
  - id: score
    name: Composite race score
    unit: points
    better: higher
  - id: completion
    name: Completed trial proportion
    unit: proportion
    better: higher
  - id: progress
    name: Normalized track progress
    unit: proportion
    better: higher
  - id: completion_time
    name: Completion time
    unit: seconds
    better: lower
  - id: rms_error
    name: RMS centre-line error
    unit: metres
    better: lower
  - id: max_error
    name: Maximum centre-line error
    unit: metres
    better: lower
  - id: line_loss_events
    name: Line-loss events
    unit: events
    better: lower
  - id: steering_oscillation
    name: Steering oscillation
    unit: index
    better: lower
  - id: control_effort
    name: Controller effort
    unit: index
    better: lower
  - id: controller_errors
    name: Controller errors
    unit: errors
    better: lower
  - id: noise_robustness
    name: Noise robustness
    unit: proportion
    better: higher
  - id: held_out_gap
    name: Development held-out gap
    unit: points
    better: lower
- id: entityR1
  label: Evaluator Feedback
  notes: Critique, uncertainties, and requested changes for another candidate cycle.
  measures:
  - id: revision_cycles
    name: Critique revision cycles
    unit: cycles
- id: entityR2A
  label: Optimizer Race Data
  notes: Measurement-only evidence addressed to the Robot Optimizer.
  measures:
  - id: supplied_requests
    name: Supplied requested measures
    unit: measurements
    better: higher
- id: entityR2B
  label: Evaluator Race Data
  notes: Measurement-only evidence addressed to the Evaluator.
  measures:
  - id: supplied_requests
    name: Supplied requested measures
    unit: measurements
    better: higher
- id: entity3
  label: Shared Blackboard
  system_boundary: private
  notes: Candidate history, evaluations, rationale, coordination notes, and budget
    state.
- id: entityPrv0
  label: Optimizer Expertise
  system_boundary: private
  notes: Private robot-design knowledge and judgement.
- id: entityPrv1
  label: Evaluator Expertise
  system_boundary: private
  notes: Private evaluation knowledge and judgement.
- id: entityPub0
  label: Design Constraints
  system_boundary: public
  notes: Permitted robot bounds, scoring criteria, and measurement vocabulary. Its
    contract is the exact shape of a design (geometry and controller).
- id: entityPub2
  label: Track Conditions
  system_boundary: public
  notes: Tracks, seeds, noise, trial order, and held-out configuration.
