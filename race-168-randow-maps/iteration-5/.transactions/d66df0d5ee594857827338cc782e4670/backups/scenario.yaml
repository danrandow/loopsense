overrides:
  entities:
  - id: entity0
    label: Mass 0.6 kg test
    notes: 'Single-lever test: iteration 4 geometry with mass cut from 0.8 to 0.6
      kg, since max_error stayed pinned near 0.061 after the radius and span changes.
      Evidence is the per-track results from iterations 0 to 4, which rule out span,
      footprint, lookahead, track and radius as the floor.


      ### Rationale


      Iteration 4 (±0.05 span, wheel_radius 0.035, wheel_track 0.12) kept line losses
      at 0 and moved max_error only slightly: oval 0.0601 (from 0.0614), s-bend 0.062
      and slalom 0.0621 (no change). Max_error is still pinned near 0.061 on every
      track in every design, so the wheel_radius lever did not move the floor. Span,
      footprint, lookahead and wheel_track have also been ruled out (iterations 0
      to 4). The Integrator''s rule for this case is to test mass 0.6 kg next. I keep
      the ±0.05 span, which gave no line losses, and the 0.035 radius, which did not
      hurt. I change only mass, from 0.8 to 0.6 kg, so any shift in the floor can
      be attributed to mass. Lower mass reduces yaw inertia, which may let the robot
      correct a steady drift faster. Expected result: if max_error on oval and s-bend
      falls below about 0.058 with line_loss_events still 0, mass is a real lever
      and I will tune it next. If it stays at about 0.060 to 0.062, the floor is not
      a body-geometry effect, and I will move to sensor_size or a larger wheel_radius
      (0.04). Slalom progress is still at 0.035 and is not the focus of this test.


      - [Open this output](iteration-5/entity0/versions/a16279c0909c46c6bebda87c479d89a8/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-6896c4d622c40284/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-782069e9a9d93674/payload.json)'
  - id: entity1
    label: Complete Robot Package
    notes: 'Complete Robot Package. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Integrates the Builder''s iteration-4 proposal (outer sensors at ±0.05 m, y
      = 0.03, 16 mm footprints, wheel_track 0.12, wheel_radius 0.035, mass 0.8, body
      unchanged) with the controller that has held up across iterations 1 to 3. Iteration
      2 showed that the ±0.06 span removed line losses (0 on all tracks), but slalom
      progress fell to 0.035. The ±0.05 span should keep the line covered to about
      0.07 m: the outer footprint reaches about 0.058 m, plus the 0.0125 m half-tape.
      Sensor weights stay [-2,-1,0,1,2] because the signal has been smooth across
      the span in every race. The wider wheel_radius raises ground speed per wheel
      revolution, so I keep base_speed at 1.6 rather than raising it, to avoid overshooting
      bends faster than the 0.6 m reach allows. kp 2.5 and kd 0.15 are kept from the
      last race. ki stays at 0.5 because iteration 3 changed ki and wheel_track together
      and the results matched iteration 2 to four decimals, so this race does not
      isolate ki and I do not treat it as a proven lever. line_loss stays last_direction.
      Expected: line_loss_events remain 0, and max_error on oval and s-bend moves
      measurably from 0.061. This is a hypothesis, not a result.


      - [Open this output](iteration-4/entity1/versions/88d96a2203bc4e6db40342dc335bb338/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/b70ecc10d8ba494dabdb2c150cbd2686/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-942faa5dcc2afd0e/payload.json)'
  - id: entityR1
    label: Integration Feedback
    notes: 'Integration Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Written before this geometry has raced. Iterations 0 to 3 show that max_error
      sat at 0.0609 to 0.0618 on every track in every design, and oval progress stayed
      at 0.115 whatever the span, footprint, lookahead, or wheel_track (iteration
      3 matched iteration 2 exactly). Line losses went from 1 to 0 when the span moved
      from ±0.04 to ±0.06 (iteration 2), so the span controls sensing. Slalom progress
      fell from 0.105 to 0.035 over the same change. I kept the controller stable
      across these runs, so the only things that moved the result were sensing span
      and track, and neither moved the floor. What I had to do in the controller:
      keep the sign-proportional weights [-2,-1,0,1,2] because the signal stayed smooth
      across every span, and hold base_speed at 1.6 because a wider wheel radius speeds
      the robot up. Next race: if line_loss_events stay at 0 and max_error on oval
      and s-bend falls below about 0.058, keep wheel_radius 0.035 and try span ±0.055
      to recover more slalom progress. If line_loss_events rise above 0 with ±0.05,
      go back to ±0.06 and accept the slalom cost. If max_error stays at about 0.061
      with wheel_radius 0.035, the floor is not a radius effect, so test mass 0.6
      next, as the Integrator''s learning note suggests.


      ### Requested changes


      - If line_loss_events stay at 0 with ±0.05 and max_error on oval and s-bend
      drops below about 0.058, keep wheel_radius 0.035 and try outer sensors at ±0.055,
      because iteration 2 (±0.06) had 0 line losses and iteration 1 (±0.04) reached
      slalom progress 0.110.

      - If line_loss_events rise above 0 with ±0.05, return the outer sensors to ±0.06
      at y = 0.03 with wheel_radius 0.035, since iteration 1 showed a loss at ±0.04
      and iteration 2 showed none at ±0.06.

      - If max_error stays at about 0.061 with wheel_radius 0.035, keep the span and
      try mass 0.6 kg, because iterations 0 to 3 show that span, track and lookahead
      did not move the floor and mass is the untested geometry lever.


      - [Open this output](iteration-4/entityR1/versions/88d96a2203bc4e6db40342dc335bb338/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/b70ecc10d8ba494dabdb2c150cbd2686/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-942faa5dcc2afd0e/payload.json)'
