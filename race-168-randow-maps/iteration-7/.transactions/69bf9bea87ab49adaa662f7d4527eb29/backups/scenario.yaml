map:
  id: race-168-randow-maps
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Span ±0.055 at forward
    notes: 'Widens the outer sensors from ±0.05 to ±0.055 at y=0.06, the forward row
      that raised the score to 51.67 by improving bend progress. The change targets
      the single line loss each on s-bend and slalom that came with the forward row,
      following the Integrator''s stated rule.


      ### Rationale


      Iteration 6 (outer sensors at y=0.06, span ±0.05, 16 mm, 0.12 m track, 0.035
      m radius, 0.6 kg) is the best result so far at 51.67, up from 26.99. The gain
      came from progress, not from the floor: s-bend progress rose from 0.040 to 0.157
      and slalom from 0.035 to 0.100. Oval was unchanged (progress 0.115, max_error
      0.0612), and max_error rose slightly on s-bend (0.0628 to 0.0637). Forward sensing
      is therefore the first lever that has moved progress on the bends. The price
      is that line losses returned: s-bend and slalom each logged one loss, while
      iteration 5 at y=0.03 had none. Slalom steering_oscillation rose to 0.133, below
      the 0.15 threshold the Integrator set. The Integrator''s rule for this case
      is to keep y=0.06 and widen the span toward ±0.055 if line losses appear. Iteration
      2 showed that a ±0.06 span removed losses at y=0.03, and iteration 4 showed
      ±0.05 did too at that row, so the loss at y=0.06 points to the outer sensors
      losing the tape on a curve before the robot can recover. I change one thing:
      the outer sensors go from ±0.05 to ±0.055 at y=0.06, keeping 16 mm footprints
      and the 0.0275 m spacing, which still covers the 25 mm tape with no gaps. Everything
      else is held fixed so the change isolates span at the forward row. I expect
      line_loss_events to fall to 0 on s-bend and slalom, slalom progress to stay
      near or above 0.10, and the score to rise as loss penalties go. The oval floor
      at about 0.061 is likely unchanged, and I do not expect a finish yet.


      - [Open this output](iteration-7/entity0/versions/bd3963e042714c9b8e0743afa5d25bad/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-5924dcc19fca7dc8/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-6a17b355f9584e05/payload.json)'
  - id: entity1
    label: Lookahead test y=0.06
    notes: 'Moves the sensor row from y=0.03 to y=0.06 with iteration 5''s controller
      held fixed, so the race isolates lookahead. Rests on iterations 2 and 4, which
      showed line losses are removed by a ±0.05 span and max_error stays pinned near
      0.061.


      ### Rationale


      Iterations 0 to 5 show a stable floor: max_error sits at 0.0601 to 0.0628 on
      every track whatever the span, footprint, wheel_track, wheel_radius, ki or mass
      (iteration 3 matched iteration 2 exactly, and iteration 5 at 0.6 kg moved nothing
      material). Line losses were removed by a span of ±0.05 or wider (iterations
      2 and 4), so sensing coverage is no longer the limit. The Builder''s proposal
      moves the sensor row from y=0.03 to y=0.06 with span ±0.05, 16 mm footprints,
      wheel_track 0.12, wheel_radius 0.035, body and mass 0.6 kg unchanged. I accept
      it as a single-lever test. The controller is kept exactly as in iteration 5
      (base_speed 1.6, kp 2.5, ki 0.5, kd 0.15, weights [-2,-1,0,1,2], last_direction),
      so the result isolates lookahead. I do not retune kp or kd before the race:
      the Builder''s expected effect is earlier warning, which should reduce the need
      for damping, and I have no evidence yet that the longer lookahead changes the
      loop gain. Sensor weights stay proportional to x, which has been smooth across
      every span tested. Expected: if max_error falls below about 0.058 with 0 line
      losses, lookahead is real; if it stays at 0.060 to 0.062, it is ruled out.


      - [Open this output](iteration-6/entity1/versions/a866596f9b93413ca7cbbcc490b9e8b9/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/5eb5bb96a9114afda1f4f946a36fccf5/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-688e40e6ae1a0b37/payload.json)'
  - id: entityR1
    label: Lookahead and footprint
    notes: 'Gives the Builder the next footprint and span steps depending on whether
      the y=0.06 race lowers the 0.061 floor. Cites iterations 0 to 5, where span,
      track, radius, ki and mass all failed to move max_error.


      ### Feedback


      Written before this candidate has raced. Iterations 0 to 5 show max_error pinned
      at 0.0601 to 0.0628 on every track (iteration 0 at 0.0618 to 0.0691, with line
      losses). Line losses were removed by a span of ±0.05 or wider (iterations 2
      and 4), so sensing coverage is fixed. wheel_track 0.10 vs 0.12 (iteration 3
      vs 2) and ki 0.05 vs 0.5 gave identical metrics, and wheel_radius 0.035 moved
      only oval max_error (0.0614 to 0.0601, iteration 4). Mass 0.6 (iteration 5)
      also left the floor unchanged. What I had to do in the controller: nothing changed
      in the gains, so the lookahead test is not confounded. The main risk is that
      the longer lookahead adds phase lag on slalom; slalom steering_oscillation was
      0.159 at y=0.03 with ±0.04 (iteration 1), so watch it. Next race: if max_error
      on oval and s-bend falls below about 0.058 with line_loss_events at 0, keep
      y=0.06 and tune the span toward ±0.055. If the floor stays at 0.060 to 0.062,
      lookahead is ruled out and the next geometry test should change the footprint
      or width.


      ### Requested changes


      - If max_error stays at 0.060 to 0.062 with y=0.06 and no line losses, lookahead
      is ruled out: try sensor_size 0.008 with span ±0.05 and y=0.06, because the
      16 mm footprint has not been compared with a smaller one and the 25 mm tape
      still spans a 25 mm pitch at this size.

      - If max_error on oval and s-bend falls below about 0.058 with line_loss_events
      at 0, keep y=0.06 and try outer sensors at x = ±0.055, because iteration 2 (±0.06)
      removed line losses and iteration 4 (±0.05) did too, so the span can move between
      them to recover slalom progress.

      - If slalom steering_oscillation rises above about 0.15 at y=0.06, move the
      row to y=0.045 as an intermediate step, because iteration 1 at y=0.03 showed
      0.159 oscillation and iteration 0 at y=0.05 showed 0.148, so the oscillation
      rises with lookahead.


      - [Open this output](iteration-6/entityR1/versions/a866596f9b93413ca7cbbcc490b9e8b9/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/5eb5bb96a9114afda1f4f946a36fccf5/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-688e40e6ae1a0b37/payload.json)'
