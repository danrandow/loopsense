map:
  id: race-168-randow-maps
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Span ±0.055 at forward
    notes: 'Widens the outer sensors from ±0.05 to ±0.055 at y=0.06, the forward row
      that raised the score to 51.67 by improving bend progress. The change targets
      the single line loss each on s-bend and slalom that came with the forward row,
      following the Integrator''s stated rule.


      ### Rationale


      Iteration 6 (outer sensors at y=0.06, span ±0.05, 16 mm, 0.12 m track, 0.035
      m radius, 0.6 kg) is the best result so far at 51.67, up from 26.99. The gain
      came from progress, not from the floor: s-bend progress rose from 0.040 to 0.157
      and slalom from 0.035 to 0.100. Oval was unchanged (progress 0.115, max_error
      0.0612), and max_error rose slightly on s-bend (0.0628 to 0.0637). Forward sensing
      is therefore the first lever that has moved progress on the bends. The price
      is that line losses returned: s-bend and slalom each logged one loss, while
      iteration 5 at y=0.03 had none. Slalom steering_oscillation rose to 0.133, below
      the 0.15 threshold the Integrator set. The Integrator''s rule for this case
      is to keep y=0.06 and widen the span toward ±0.055 if line losses appear. Iteration
      2 showed that a ±0.06 span removed losses at y=0.03, and iteration 4 showed
      ±0.05 did too at that row, so the loss at y=0.06 points to the outer sensors
      losing the tape on a curve before the robot can recover. I change one thing:
      the outer sensors go from ±0.05 to ±0.055 at y=0.06, keeping 16 mm footprints
      and the 0.0275 m spacing, which still covers the 25 mm tape with no gaps. Everything
      else is held fixed so the change isolates span at the forward row. I expect
      line_loss_events to fall to 0 on s-bend and slalom, slalom progress to stay
      near or above 0.10, and the score to rise as loss penalties go. The oval floor
      at about 0.061 is likely unchanged, and I do not expect a finish yet.


      - [Open this output](iteration-7/entity0/versions/bd3963e042714c9b8e0743afa5d25bad/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-5924dcc19fca7dc8/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-6a17b355f9584e05/payload.json)'
  - id: entity1
    label: Wider outer span at
    notes: 'Keeps the iteration 6 controller and moves only the outer sensors from
      ±0.05 to ±0.055 at y=0.06, to test whether this removes the s-bend and slalom
      line losses while holding progress. Based on iteration 6 (score 51.67) and iterations
      2 and 4 showing span controls line loss.


      ### Rationale


      Iteration 6 (outer sensors at y=0.06, span ±0.05) is the best result so far
      at 51.67. Its gain came from progress on the bends (s-bend 0.157, slalom 0.100),
      but it cost one line loss each on s-bend and slalom, and slalom steering_oscillation
      rose to 0.133. The Builder proposes widening only the outer span to ±0.055 at
      y=0.06, keeping 16 mm footprints and 0.0275 m spacing. I accept that geometry
      unchanged: 0.06 m was the only lever that moved bend progress, and ±0.055 is
      the single change that tests whether the losses come from edge coverage. The
      controller is kept exactly as in iteration 6 (base_speed 1.6, kp 2.5, ki 0.5,
      kd 0.15, weights [-2,-1,0,1,2], last_direction) so the race isolates span. Iteration
      2 showed ±0.06 removes losses at y=0.03, and iteration 4 showed ±0.05 did too,
      so ±0.055 should cover the 25 mm tape without a gap. I expect line losses to
      fall toward 0 and progress to hold, with no finish yet. The oval floor is likely
      still near 0.061.


      - [Open this output](iteration-7/entity1/versions/69bf9bea87ab49adaa662f7d4527eb29/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/bd3963e042714c9b8e0743afa5d25bad/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-6a17b355f9584e05/payload.json)'
  - id: entityR1
    label: Next steps for the span
    notes: 'Feedback written before the race: if line losses persist, move the row
      to y=0.045; if they clear, test the 0.012 m footprint at y=0.06. Each step is
      tied to iteration 6 losses and the unchanged oval floor at about 0.061.


      ### Feedback


      Written before this candidate has raced. Iteration 6 (±0.05 span, y=0.06, 16
      mm, 0.12 m track, 0.035 m wheels, 0.6 kg) scored 51.67 with progress up on s-bend
      (0.157) and slalom (0.100), but it logged one line loss each on s-bend and slalom,
      and slalom steering_oscillation rose to 0.133. Iterations 0 to 5 show max_error
      pinned at 0.060 to 0.063 on every track whatever the span, footprint, track,
      radius, ki or mass, so the oval floor has not moved. I kept your controller
      unchanged so the span is the only variable. What to change next: if line_loss_events
      stay above 0 on s-bend or slalom at ±0.055, move the forward row back to y=0.045
      with the same span, because the loss appeared only at y=0.06 and not at y=0.03
      in iteration 5. If line losses clear and progress holds, try sensor_size 0.012
      at y=0.06 with ±0.055 to test whether a smaller footprint moves the oval floor,
      since iteration 6 changed the footprint nowhere. If slalom steering_oscillation
      rises above about 0.15, do not change geometry first; the Integrator will retune
      kd.


      ### Requested changes


      - If line_loss_events remain above 0 on s-bend or slalom with outer sensors
      at x=±0.055 and y=0.06, move the row to y=0.045 with the same span, because
      iteration 6 (y=0.06, ±0.05) logged one loss on each of those tracks while iteration
      5 (y=0.03, ±0.05) logged none.

      - If line losses clear and progress holds at ±0.055, set sensor_size to 0.012
      at y=0.06, because the oval max_error has stayed at 0.060 to 0.063 across every
      geometry change so far and this is the untested footprint lever.

      - If progress on s-bend or slalom falls below iteration 6 values (0.157 and
      0.100), return the outer sensors to ±0.05 at y=0.06, because iteration 6 showed
      that this forward row is the lever that moved bend progress.


      - [Open this output](iteration-7/entityR1/versions/69bf9bea87ab49adaa662f7d4527eb29/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/bd3963e042714c9b8e0743afa5d25bad/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-6a17b355f9584e05/payload.json)'
