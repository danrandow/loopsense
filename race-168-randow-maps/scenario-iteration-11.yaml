  entities:
  - id: entity0
    label: 'Final: hold iteration 9'
    notes: 'Keeps the best-measured geometry (iteration 9, score 67.70: y=0.045, ±0.055,
      16 mm, 0.12 m track, 0.035 m wheels, 0.6 kg) unchanged for the final race. Iteration
      10''s wider span and forward row scored lower (60.55), and no geometry lever
      has moved the max_error floor.


      ### Rationale


      Iteration 9 is the best-scoring geometry so far (67.70). It uses y=0.045 with
      outer sensors at x=±0.055, 16 mm footprints, a 0.12 m track, 0.035 m wheels
      and 0.6 kg mass. Its controller change (base_speed 1.4) lifted oval progress
      to 0.242 and the score, but its line losses persisted at 0.9 on s-bend and 1.0
      on slalom. Iteration 10 (y=0.05, ±0.06) scored lower (60.55), with slalom progress
      down to 0.103 and a slalom loss, so widening the span and moving the row did
      not help. The max_error floor near 0.060 to 0.063 has not moved under any geometry
      change (span, track, radius, mass, lookahead, ki), and body width cannot raise
      the off-track limit within range. So no geometry lever I can test is likely
      to change the outcome on an unseen track. This is the final iteration and the
      final race runs on unseen tracks, so I am choosing the best-measured geometry
      rather than an untested one. I keep iteration 9''s geometry exactly, so any
      difference in the race comes from the Integrator''s controller alone. I expect
      a score near 65 to 68 on the development tracks, and the unseen track is uncertain.


      - [Open this output](iteration-11/entity0/versions/bcce9768f0d843938baf81b4e7cc48ee/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-42548bc7ed091b74/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-1f0af22d1576c6ac/payload.json)'
  - id: entity1
    label: Complete Robot Package
    notes: 'Complete Robot Package. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      This is the final iteration, so I keep the Builder''s geometry exactly as proposed,
      which matches iteration 9: sensors at y=0.045 with x=±0.055 and 16 mm footprints,
      a 0.12 m track, 0.035 m wheels, 0.6 kg, and a 0.16 x 0.12 m body. Iteration
      9 is the best measured platform (score 67.70). Its controller (base_speed 1.4,
      kp 2.5, ki 0.5, kd 0.15, weights [-2,-1,0,1,2], last_direction) is kept unchanged,
      so the race measures this controller on this platform. The remaining line losses
      (0.9 on s-bend, 1.0 on slalom) did not clear when base_speed went from 1.6 to
      1.4 in iteration 9, so speed is not their cause. Iteration 6 showed that the
      forward row is the source, and every gain change tried has left the max_error
      floor near 0.060 to 0.063. Any new untested gain would be a gamble on the final
      race, so I make no change. I expect results near iteration 9 on the development
      tracks, with the unseen track uncertain.


      - [Open this output](iteration-11/entity1/versions/e12cd6d716874f3fbf9e62252b2df905/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/bcce9768f0d843938baf81b4e7cc48ee/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-1f0af22d1576c6ac/payload.json)'
  - id: entityR1
    label: Integration Feedback
    notes: 'Integration Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Written before this candidate has raced. Evidence: iteration 9 (y=0.045, ±0.055,
      base_speed 1.4) scored 67.70, the best so far. It had 0.9 line losses on s-bend
      and 1.0 on slalom, with oval progress of 0.242. Iteration 8 (same geometry at
      base_speed 1.6) had 0.95 and 1.0 losses, so cutting speed did not clear the
      losses. Iteration 5 (y=0.03, ±0.05) had zero losses but only 0.040 s-bend progress,
      and iterations 6 to 9 showed that forward rows at y=0.045 to 0.06 always lost
      the line about once per trial. Iterations 0 to 9 show the max_error floor at
      about 0.060 to 0.063 under every span, track, radius, mass, lookahead and ki
      change, so I do not expect geometry to move it. The Integrator kept the iteration
      9 controller unchanged. This is the final iteration, so no later Builder iteration
      will use these changes. The requested changes below are for reference only.


      ### Requested changes


      - If line losses stay near 1 per trial on s-bend and slalom with this row, the
      forward row itself is the cause. The next test would be y=0.03 with ±0.055,
      because iteration 5 (y=0.03, ±0.05) had zero losses while y=0.045 to 0.06 always
      lost the line.

      - If progress on s-bend stays near 0.14 but losses persist, keep y=0.045 and
      try sensor_size 0.012 to test whether a smaller footprint reduces edge losses,
      since the 16 mm footprint has not been compared at this row.

      - If oval progress is high but max_error stays at about 0.061, do not chase
      the floor with span, track, radius or mass, because iterations 0 to 9 show none
      of these moved it.


      - [Open this output](iteration-11/entityR1/versions/e12cd6d716874f3fbf9e62252b2df905/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/bcce9768f0d843938baf81b4e7cc48ee/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-1f0af22d1576c6ac/payload.json)'
