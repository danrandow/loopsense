overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 8 moved the forward row from y=0.06 to y=0.045 and kept the ±0.055
      span. Its score was 50.36, with s-bend progress 0.147 and 0.95 line losses per
      trial, and slalom at 1.0 loss. Losses did not clear at the intermediate row,
      so the Integrator''s rule applies: keep the geometry unchanged and let the controller''s
      base_speed be the lever. Forward sensing is still the only lever that has moved
      bend progress (s-bend 0.040 at y=0.03, 0.146 to 0.157 at y=0.045 to 0.06). The
      max_error floor near 0.061 to 0.063 has not moved under any geometry change,
      and span, track, radius, mass and lookahead have all been tested. I considered
      shrinking the footprint to 0.012 m, but a smaller footprint reads less tape
      per sensor and could push the summed reading below the 0.05 line-loss threshold
      on curves, so I did not make that change now. Holding the geometry identical
      to iteration 8 means any change in the next race comes from the Integrator''s
      controller change, which keeps the attribution clean. Expected result: line
      losses fall toward 0 on s-bend and slalom with base_speed reduced, and progress
      stays near 0.14 on s-bend. If losses persist at reduced speed, the geometry
      has no remaining sensing lever for losses and the next test is y=0.03 with ±0.055.


      - [Open this output](iteration-9/entity0/versions/e38d1997fb8c4947914f3feb4a7e01c0/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-77d15ea3ad4324f5/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-5874f081593dfd12/payload.json)'
  - id: entity1
    label: Slower base_speed 1.4
    notes: 'Iteration 8 geometry held exactly, with base_speed cut from 1.6 to 1.4
      as the only change. Tests whether curve speed, not sensing, causes the 0.95
      and 1.0 s-bend and slalom line losses seen in iteration 8.


      ### Rationale


      Iteration 8 (y=0.045, ±0.055 span, 16 mm, 0.12 m track, 0.035 m wheels, 0.6
      kg) kept the iteration 7 controller at base_speed 1.6. Its s-bend line losses
      were 0.95 per trial and slalom 1.0, against 0 at y=0.03 (iteration 5). Its s-bend
      progress was 0.147 and slalom 0.100. Losses persisted at the intermediate row,
      so the Builder''s hypothesis is that curve speed causes them, not sensing coverage.
      I test that with a single controller change: base_speed 1.6 to 1.4. This cuts
      PWM from about 3276 to about 2867, which should reduce lateral slip and overshoot
      on curves. I stop at 1.4 rather than going lower because the 3 s limit needs
      an average of about 1.5 m/s, and a larger cut risks stalls or missing progress.
      The geometry is held exactly at iteration 8, so the speed change is the only
      variable. kp 2.5, ki 0.5, kd 0.15, weights [-2,-1,0,1,2] and last_direction
      are unchanged. ki and kd have shown no measurable effect, so retuning them now
      would confound the test. Expected: line losses fall toward 0 on s-bend and slalom,
      and s-bend progress stays near 0.14 or above. If losses persist at 1.4, speed
      is ruled out as the cause. The Builder''s next step is then a geometry change,
      not a controller change.


      - [Open this output](iteration-9/entity1/versions/ad624fe774324fd08aacbc81d0b6130e/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/e38d1997fb8c4947914f3feb4a7e01c0/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-5874f081593dfd12/payload.json)'
  - id: entityR1
    label: Speed-first, then
    notes: 'Feedback uses iteration 8''s line losses (0.95 and 1.0) and iteration
      7''s unchanged losses to decide whether to test speed or geometry next. Each
      branch names the geometry values to try and the evidence behind them.


      ### Feedback


      Written before this candidate has raced. Iteration 8 (y=0.045, ±0.055, base_speed
      1.6) had 0.95 line losses on s-bend and 1.0 on slalom, with s-bend progress
      0.147 and slalom 0.100. Iteration 7 (y=0.06, ±0.055) had 0.9 and 1.0 losses,
      so the losses did not clear with the forward row moved back. Iteration 5 (y=0.03,
      ±0.05) had zero losses but only 0.040 s-bend progress. I changed only base_speed,
      to 1.4, and kept the iteration 8 geometry. If losses clear and s-bend progress
      holds near 0.14, keep the geometry and test the footprint next. If losses persist
      at 1.4, speed is not the cause and the geometry must change. The oval max_error
      floor (0.060 to 0.063 in every design) has not moved under any change so far,
      so I do not expect the speed change to move it.


      ### Requested changes


      - If line_loss_events fall to 0 on s-bend and slalom at base_speed 1.4 and s-bend
      progress stays at or above 0.14, keep y=0.045 and ±0.055, and set sensor_size
      to 0.012 to test whether the oval max_error floor moves. Iteration 8 showed
      the footprint has not been isolated at a forward row.

      - If line losses persist at base_speed 1.4, keep the controller and try y=0.05
      with the outer sensors widened to ±0.06. Iteration 2 showed ±0.06 removed losses
      at y=0.03, and iteration 0 used y=0.05, so the intermediate row has only been
      tested under a different span.

      - If losses clear but s-bend progress falls below 0.14, return the row to y=0.06
      with ±0.05 and keep base_speed 1.4. Iteration 6 (y=0.06, ±0.05, base_speed 1.6)
      gave the best progress so far, at 0.157 on s-bend, so that row is the progress
      reference.


      - [Open this output](iteration-9/entityR1/versions/ad624fe774324fd08aacbc81d0b6130e/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/e38d1997fb8c4947914f3feb4a7e01c0/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-5874f081593dfd12/payload.json)'
