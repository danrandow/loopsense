  id: race-168-randow-maps
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Row to y=0.045, ±0.055
    notes: 'Moves the forward sensor row from y=0.06 back to y=0.045 with the ±0.055
      span kept, as the Integrator requested. Iteration 7 showed that widening the
      span did not clear the line losses at y=0.06 (s-bend 0.9, slalom 1.0), so the
      forward row is the cause; y=0.03 had no losses but low bend progress.


      ### Rationale


      Iteration 7 widened the outer sensors from ±0.05 to ±0.055 at the forward row
      (y=0.06). Its score was 50.25, slightly below iteration 6''s 51.67. The span
      change did not remove the line losses: s-bend averaged 0.9 losses per trial
      and slalom 1.0, with progress down on s-bend (0.157 to 0.146) and unchanged
      on slalom (0.100). So span is not the cause of the losses at this row. Iteration
      5 (y=0.03, ±0.05) had zero losses, and iterations 2 and 4 showed ±0.05 or wider
      removes losses at y=0.03. The loss appears when the row moves forward, which
      points to the forward row itself, consistent with the Integrator''s rule. Forward
      sensing is the only lever that has moved bend progress (s-bend 0.040 to 0.157
      from y=0.03 to y=0.06). The oval floor (max_error 0.061 to 0.063, progress 0.115)
      has not moved under any geometry change, and I am not chasing it further in
      this step. The next change is the Integrator''s requested intermediate step:
      move the row to y=0.045 and keep the ±0.055 span from iteration 7. I expect
      this to clear the line losses on s-bend and slalom while keeping part of the
      forward-sensing progress gain. If it works, the score should rise above 50 because
      the loss penalty goes away. If progress falls below iteration 6 values with
      no losses, the robot needs more forward reach, not less, and the next step is
      to return to y=0.06 with ±0.05.


      - [Open this output](iteration-8/entity0/versions/5b0946b151e6455e83631e63b412bdd5/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-abecff2b6e8c1118/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-2fe14b107cf17966/payload.json)'
  - id: entity1
    label: Forward row y=0.045 test
    notes: 'Integrated the Builder''s y=0.045, ±0.055 geometry with the iteration
      7 controller unchanged, so only the row position changes. Losses appeared only
      at the y=0.06 row in iterations 6 and 7, so this tests whether a closer row
      clears them while keeping bend progress.


      ### Rationale


      The Builder''s proposal moves the sensor row from y=0.06 to y=0.045 and keeps
      the ±0.055 span from iteration 7. Iteration 7 (y=0.06) logged 0.9 line losses
      per trial on s-bend and 1.0 on slalom, while iteration 5 (y=0.03, ±0.05) logged
      none, so the forward row is the source of the losses. Iteration 6 showed that
      forward sensing is the only lever that has moved bend progress (s-bend 0.040
      to 0.157). Iteration 8 keeps the iteration 7 controller unchanged (base_speed
      1.6, kp 2.5, ki 0.5, kd 0.15, weights [-2,-1,0,1,2], last_direction). Changing
      base_speed now would confound the single-lever geometry test, and the Builder''s
      stated rule is that base_speed is the next lever only if losses persist at y=0.045.
      Oval max_error has sat at 0.060 to 0.063 through every change, and no controller
      gain has moved it, so I expect no oval change. I expect line losses to fall
      toward 0 on s-bend and slalom with s-bend progress staying above 0.04.


      - [Open this output](iteration-8/entity1/versions/24424e87d30c4f37a27dc82739e43137/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/5b0946b151e6455e83631e63b412bdd5/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-2fe14b107cf17966/payload.json)'
  - id: entityR1
    label: Next steps from row test
    notes: 'Feedback gives three outcome-dependent next steps: footprint test if losses
      clear, base_speed if losses persist, and y=0.05 if bend progress drops. Each
      rests on the iteration 5 to 7 line-loss and progress results.


      ### Feedback


      Written before this candidate has raced. Iteration 7 (y=0.06, ±0.055) scored
      50.25 with 0.9 line losses per trial on s-bend and 1.0 on slalom, and iteration
      6 (y=0.06, ±0.05) scored 51.67 with one loss on each of those tracks. Iteration
      5 (y=0.03, ±0.05) had zero losses but progress of only 0.040 on s-bend. So span
      is not the cause of the losses (iteration 7 changed span with no effect on losses),
      and the forward row is the source. I kept the iteration 7 controller unchanged,
      so the result isolates the row position. If line losses clear at y=0.045 and
      s-bend progress stays above 0.04, keep this row and test sensor_size 0.012 at
      this row to see whether the oval floor (0.060 to 0.063 in every design so far)
      moves. If losses persist at y=0.045, the controller''s base_speed is the lever
      (the Integrator will drop it), and the geometry should stay at this row. If
      s-bend progress falls below 0.04 with no losses, the row is too close to the
      axle, so move forward to y=0.05 next, which iteration 0 suggested but with a
      different footprint and span.


      ### Requested changes


      - If line_loss_events fall to 0 on s-bend and slalom at y=0.045 and s-bend progress
      stays above 0.04, keep this row and set sensor_size to 0.012 at y=0.045, because
      the oval max_error has stayed at 0.060 to 0.063 across every geometry change
      and the footprint has not been isolated at a forward row.

      - If line losses persist at y=0.045 with ±0.055, keep the geometry unchanged
      and let the Integrator reduce base_speed, because losses appeared at y=0.06
      (iteration 7) with the same span and not at y=0.03 (iteration 5), pointing to
      curve speed rather than sensing.

      - If s-bend progress falls below 0.04 with no losses at y=0.045, move the row
      to y=0.05 with ±0.055, because iteration 5 (y=0.03) gave progress 0.040 and
      iteration 6 (y=0.06) gave 0.157, so the lookahead between those rows should
      recover some progress.


      - [Open this output](iteration-8/entityR1/versions/24424e87d30c4f37a27dc82739e43137/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/5b0946b151e6455e83631e63b412bdd5/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-2fe14b107cf17966/payload.json)'
