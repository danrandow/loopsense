  id: race-102-opt-eval
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence from the last race (iteration 1, ki 0.4, kp 2.5, kd 0.2, base_speed
      1.4). No run finished on any track, and all 60 trials ended off track. Progress
      improved modestly against the baseline: oval 0.105 to 0.168, s-bend 0.148 to
      0.172, slalom 0.105 to 0.113. max_error still sits at about 0.061 on every track,
      which is the 0.06 m off-track limit. rms_error fell slightly (oval 0.028 to
      0.022). Line_loss_events remain at 1 per run. steering_oscillation rose on oval
      (0.075 to 0.104) but stayed under 0.15 on all tracks, so there is no jitter
      sign. The integral term helped a little, which is consistent with a steady offset,
      but it did not remove it. The evaluator''s feedback sets the next step: if progress
      stays near 0.1 to 0.2 with a constant-sign drift and max_error near 0.06, raise
      ki to about 1.0 and keep kp at 2.5. Oscillation is below the 0.15 threshold,
      so kp stays where it is. The integral is still clamped at +/-2 (a maximum contribution
      of 2 to turn at ki 1.0), which limits windup. I am changing only ki (0.4 to
      1.0) so the result isolates the integral hypothesis. base_speed stays at 1.4
      and kd at 0.2, because no run has finished yet, so there is no completion_time
      evidence to justify a speed change. Geometry is unchanged. Expected result:
      a larger share of the course covered before the off-track limit (progress above
      about 0.3), with max_error below 0.06 on at least some seeds and fewer early
      departures. The main risk is that a higher ki causes slow overshoot, which would
      show as a rise in steering_oscillation or a sign-alternating error. Next race
      I want per-track progress, max_error, rms_error, line_loss_events, steering_oscillation
      and completion_time. If progress is still stuck near 0.17 with a constant-sign
      error, the offset is not the main cause, and I would look at sensor placement
      or the line-loss behaviour instead. If the robot finishes, completion_time decides
      whether base_speed should go back toward 1.5.


      - [Open this output](iteration-2/entity0/versions/fa6c12b8d88e428e87d0741cf89c50e4/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-4fafe761c28b5d3c/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-84a7d4ac45506b8f/payload.json)'
  - id: entityR1
    label: Approve ki 1.0 test
    notes: 'Approved to race because only one run remains, so a revision could not
      be raced. The candidate changes only ki (0.4 to 1.0), following the iteration
      1 evidence of partial progress gain with a constant-sign offset. Feedback states
      no outcome and gives next-race checks.


      ### Feedback


      Approved, because only one run remains this iteration. A revise decision would
      need a review and a revision before the race, so the iteration would end unscored.


      The candidate is a single-parameter change from the last race (iteration 1:
      ki 0.4, kp 2.5, kd 0.2, base_speed 1.4). It raises ki to 1.0 and keeps geometry,
      kp, kd, base_speed and line_loss the same. Iteration 1 showed progress moving
      modestly (oval 0.105 to 0.168, s-bend 0.148 to 0.172, slalom 0.105 to 0.113),
      with max_error still at the 0.06 off-track limit on every track and rms_error
      down slightly. That is consistent with a steady offset that the integral only
      partly removes, so a larger ki is the sensible next test. The stated 2.0 clamp
      on the integral limits windup. Steering_oscillation stayed below 0.15 on all
      tracks, so kp and kd have no jitter evidence against them.


      No outcome is stated for this candidate. The main risks, judged from the earlier
      races and the candidate''s contents alone, are slow overshoot from the larger
      ki and base_speed 1.4, which is below the roughly 1.5 m/s average the contract
      implies for a sub-3 s finish. Read the next race per track: progress, max_error,
      rms_error, line_loss_events, steering_oscillation and completion_time. If progress
      stays near 0.17 with a constant-sign error, the offset is not the main cause,
      so look at sensor placement or line-loss behaviour rather than gains. If steering_oscillation
      rises with a sign-alternating error, reduce ki or kp before touching kd.


      ### Requested changes


      - If progress is still near 0.17 with a constant-sign error and max_error near
      0.06, keep ki at about 1.0 and test sensor placement (for example wider x spacing
      of the outer sensors) or line_loss as last_direction versus search_left, since
      the offset hypothesis would then be only partly right.

      - If steering_oscillation rises above about 0.15 with a sign-alternating error,
      reduce ki toward 0.7 and keep kp at 2.5, because the integral is then overshooting.

      - If any run finishes, read completion_time: if it is at or above about 2.8
      s, raise base_speed from 1.4 toward 1.5 to 1.6, since 1.4 is slower than the
      roughly 1.5 m/s the contract requires for a sub-3 s finish.


      - [Open this output](iteration-2/entityR1/versions/4c1870280e9c490ea0feef3eb32a9985/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/fa6c12b8d88e428e87d0741cf89c50e4/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-84a7d4ac45506b8f/payload.json)'
