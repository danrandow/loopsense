map:
  id: race-102-opt-eval
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence from the last race (iteration 1, ki 0.4, kp 2.5, kd 0.2, base_speed
      1.4). No run finished on any track, and all 60 trials ended off track. Progress
      improved modestly against the baseline: oval 0.105 to 0.168, s-bend 0.148 to
      0.172, slalom 0.105 to 0.113. max_error still sits at about 0.061 on every track,
      which is the 0.06 m off-track limit. rms_error fell slightly (oval 0.028 to
      0.022). Line_loss_events remain at 1 per run. steering_oscillation rose on oval
      (0.075 to 0.104) but stayed under 0.15 on all tracks, so there is no jitter
      sign. The integral term helped a little, which is consistent with a steady offset,
      but it did not remove it. The evaluator''s feedback sets the next step: if progress
      stays near 0.1 to 0.2 with a constant-sign drift and max_error near 0.06, raise
      ki to about 1.0 and keep kp at 2.5. Oscillation is below the 0.15 threshold,
      so kp stays where it is. The integral is still clamped at +/-2 (a maximum contribution
      of 2 to turn at ki 1.0), which limits windup. I am changing only ki (0.4 to
      1.0) so the result isolates the integral hypothesis. base_speed stays at 1.4
      and kd at 0.2, because no run has finished yet, so there is no completion_time
      evidence to justify a speed change. Geometry is unchanged. Expected result:
      a larger share of the course covered before the off-track limit (progress above
      about 0.3), with max_error below 0.06 on at least some seeds and fewer early
      departures. The main risk is that a higher ki causes slow overshoot, which would
      show as a rise in steering_oscillation or a sign-alternating error. Next race
      I want per-track progress, max_error, rms_error, line_loss_events, steering_oscillation
      and completion_time. If progress is still stuck near 0.17 with a constant-sign
      error, the offset is not the main cause, and I would look at sensor placement
      or the line-loss behaviour instead. If the robot finishes, completion_time decides
      whether base_speed should go back toward 1.5.


      - [Open this output](iteration-2/entity0/versions/fa6c12b8d88e428e87d0741cf89c50e4/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-4fafe761c28b5d3c/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-84a7d4ac45506b8f/payload.json)'
  - id: entityR1
    label: 'Approved: ki and kp'
    notes: 'Approved because only one run remains, so a revision would leave the iteration
      unscored. The baseline failed early with constant offset-like error (rms about
      0.027, max at the 0.06 limit, 0 finishes in 60 trials), which supports adding
      integral action and a slightly higher kp and kd. The base_speed cut to 1.4 is
      flagged as the main risk to completion time.


      ### Feedback


      Approved, because only one run remains this iteration. A revise decision would
      need a review and a revision, two runs, so it would leave the iteration unscored.


      Evidence from the baseline (iteration 0, 60 trials across oval, s-bend and slalom):
      no run finished, every run ended off track, and progress was about 0.105 on
      oval and slalom. That points to an early failure rather than a failure at a
      specific bend. rms_error (about 0.025 to 0.029) and max_error (about 0.06, the
      off-track limit) match a steady offset. Oscillation was low (0.07 to 0.15).
      The motor mismatch in the contract would produce such an offset under a purely
      proportional controller with ki = 0.


      What this candidate changes: ki 0 to 0.4, kp 2.0 to 2.5, kd 0.1 to 0.2 and base_speed
      1.5 to 1.4. Geometry is unchanged. The ki change directly targets the offset
      hypothesis. The kp and kd changes are reasonable, but kd 0.2 is only a guess
      and has no oscillation evidence behind it. The base_speed cut is the main risk.
      At 1.4 the robot needs a higher average speed than the 1.5 m/s the contract
      implies for a sub-3 s finish, so this change could cost completion even if the
      robot stays on the line. The completion bonus (500) outweighs the time term,
      so a slower but finishing robot is worth more than a fast one that leaves the
      track.


      What to do with the next race: read per-track completion, progress, completion_time,
      rms_error, max_error, line_loss_events and steering_oscillation. If the robot
      still drifts with a constant sign early in the run, the offset is not being
      removed, and ki should be raised. If the robot finishes but completion_time
      is near or above 3 s, base_speed should go back toward 1.5 or 1.6. If steering_oscillation
      rises above about 0.15 while the robot stays on track, kp should come down toward
      2.2 before kd is changed.


      ### Requested changes


      - If progress is still about 0.1 with a constant-sign drift and max_error near
      0.06, raise ki from 0.4 to about 1.0 (the integral is still clamped at +/-2)
      and keep kp at 2.5.

      - If the robot finishes on some tracks but completion_time is at or above about
      2.8 s, raise base_speed back to about 1.5 to 1.6, since 1.4 is slower than the
      roughly 1.5 m/s the contract needs for a sub-3 s finish.

      - If steering_oscillation rises above about 0.15 while max_error stays under
      0.06, lower kp from 2.5 toward 2.2 before changing kd, because the baseline
      showed low jitter and the added gain is the most likely source.


      - [Open this output](iteration-1/entityR1/versions/d5cdd6fc1ebf4390bc1419b5a285738f/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/7f80b8ca0b324974af6d97416d1c685b/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-bc63198ba72f8d02/payload.json)'
