map:
  schema: "v0.2"
  id: "control-robotrace"
  title: "Control Robot Race agent team – Evaluator-optimizer learning loop"
  scenario: "Moving parts"
  is_moo: true
  notes: |
    The conventional comparison condition for the LoopSense Robot Race. Two AI
    agents act once each before every test. The Evaluator reads the previous race
    measurements and produces an evaluation brief. The Robot Optimizer reads the
    same measurements plus that brief, then produces the only robot design that
    goes onto the track. The Evaluator's opinion travels forward but cannot itself
    alter the tested artifact.

    Both AI agents receive independently addressed copies of the same race
    measurements. They may improve their working agreement during retrospectives,
    but cannot change the fixed evaluator-to-optimizer topology, budgets, or
    evaluation rules. Actor 2 is deterministic software, not an AI agent.
  iteration_definition: |
    An iteration starts when actor0 consumes its independently addressed race data
    from the preceding iteration and generates entity0, an evaluation brief. Actor1
    consumes the same preceding race data plus entity0 and generates entity1, one
    complete robot package. Actor2 immediately races every valid entity1 and
    generates entity2 plus independently addressed measurement returns for both AI
    agents. The iteration ends there. Only after it ends do actor0 and actor1 run a
    retrospective and, if they agree, revise their working agreement for the next
    iteration.
  dimension_axes: [condition, iteration]

actors:
  - id: actor0
    label: Evaluator
    notes: |
      AI agent. Independently interprets the previous race measurements and produces
      an evaluation brief for actor1. It does not own or edit geometry or controller
      files. Its opinion is not fresh world evidence and is not separately tested.

  - id: actor1
    label: Robot Optimizer
    notes: |
      AI agent. Owns and modifies the complete robot design: geometry and
      controller. It exercises its own judgement over the same race measurements
      available to actor0 and decides how much of actor0's evaluation to use.

  - id: actor2
    label: Robot on Track
    notes: |
      Deterministic software actor instantiated from entity1. It cannot interpret
      results. It pursues the race outcome, records evidence, and supplies supported
      measurements in two addressed return-flow entities.

actions:
  - id: action0
    actor: actor0
    label: Evaluate evidence
    notes: |
      Uses the preceding race data, its expertise, and the current working agreement
      to evaluate the robot and recommend what actor1 should preserve or change.

  - id: action1
    actor: actor1
    label: Optimize robot
    notes: |
      Uses the same preceding race data plus entity0 to produce one complete
      geometry-controller package. Every technically valid package proceeds to the
      track before actor1 can act again.

  - id: action2
    actor: actor2
    label: Race track
    notes: |
      Executes the robot package on the same configured track and seed batch used by
      the LoopSense condition. Generates outcomes, telemetry, scores, and trajectory
      images. It supplies data, not interpretation.

entities:
  - id: entity0
    label: Evaluation Brief
    system_boundary: internal
    notes: |
      Actor0's interpretation of the preceding race measurements: diagnosis,
      recommendations, uncertainties, and requested supported measurements. It is
      advice, not a robot component and not empirical evidence from a new test.

  - id: entity1
    label: Complete Robot Package
    system_boundary: internal
    notes: |
      Actor1's one tested product per iteration: geometry, controller, rationale,
      and consolidated observation request. It records how entity0 was considered
      without requiring actor1 to accept its recommendations.

  - id: entity2
    label: Race Outcome
    system_boundary: internal
    notes: |
      The outcome actor2 pursues by racing. It has no used-by edge to either AI
      agent; upstream learning occurs through addressed return-flow entities.

  - id: entityR2A
    label: Race Data for Evaluator
    direction: return
    notes: |
      Measurement-only evidence generated by actor2 and independently addressed to
      actor0. Initially it contains the same standard race dataset as entityR2B.

  - id: entityR2B
    label: Race Data for Optimizer
    direction: return
    notes: |
      Measurement-only evidence generated by actor2 and independently addressed to
      actor1. Initially it contains the same standard race dataset as entityR2A.

  - id: entityTeam0
    label: Working Agreement
    system_boundary: private
    notes: |
      Shared evaluation conventions, handoff expectations, feedback practice, and
      measurement requests. Both agents may agree changes only in the retrospective
      after an iteration. Revisions cannot change role order, artifact ownership,
      budgets, or evaluation rules.

  - id: entityPub0
    label: Track Conditions
    system_boundary: public
    notes: |
      The same versioned tracks, seeds, noise, design constraints, scoring rules,
      model configuration, and total budget used by the LoopSense condition.

  - id: entityPrv0
    label: Evaluator Expertise
    system_boundary: private
    notes: Actor0's evolving evaluation knowledge and judgement.

  - id: entityPrv1
    label: Optimizer Expertise
    system_boundary: private
    notes: Actor1's evolving robot-design knowledge and judgement.

edges:
  - id: edge0G
    type: generates
    from: action0
    to: entity0
  - id: edge0U
    type: used by
    from: entity0
    to: action1
  - id: edge1G
    type: generates
    from: action1
    to: entity1
  - id: edge1U
    type: used by
    from: entity1
    to: action2
  - id: edge2G
    type: generates
    from: action2
    to: entity2

  - id: edgeR2AG
    type: generates
    from: action2
    to: entityR2A
    direction: return
  - id: edgeR2AU
    type: used by
    from: entityR2A
    to: action0
    direction: return
  - id: edgeR2BG
    type: generates
    from: action2
    to: entityR2B
    direction: return
  - id: edgeR2BU
    type: used by
    from: entityR2B
    to: action1
    direction: return

  - id: edgeTeam0U0
    type: used by
    from: entityTeam0
    to: action0
  - id: edgeTeam0U1
    type: used by
    from: entityTeam0
    to: action1

  - id: edgePub0U2
    type: used by
    from: entityPub0
    to: action2

  - id: edgePrv0U
    type: used by
    from: entityPrv0
    to: action0
  - id: edgePrv0G
    type: generates
    from: action0
    to: entityPrv0
  - id: edgePrv1U
    type: used by
    from: entityPrv1
    to: action1
  - id: edgePrv1G
    type: generates
    from: action1
    to: entityPrv1
