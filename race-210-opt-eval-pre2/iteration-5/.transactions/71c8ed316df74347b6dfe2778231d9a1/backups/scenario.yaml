map:
  id: race-210-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: 7-sensor wider array
    notes: 'Extends iteration 4''s best design with a 7-sensor array at the maximum
      forward position (y = 0.08) and finer spacing, plus kd raised to 1.5 for damping.
      Evidence: all 240 trials ended off track with max_error about 0.064 m, and widening
      the array was the only change that clearly helped (score 65 to 81.6).


      ### Rationale


      Evidence: 240 development trials across five designs, and none finished. Every
      run ended off track. Max error sits at about 0.063 to 0.064 m, just above the
      0.06 m limit, while rms error stays at 0.025 to 0.036 m. Iteration 4 was the
      best (81.56, from 65.2). Its gains came from widening the sensors to x = ±0.06
      and moving them forward to y = 0.07, together with lower speed (1.3) and lower
      kp (2.5). Oval progress rose from 0.25 to 0.33, and s-bend progress rose from
      0.13 to 0.17.


      The off-track limit is max(0.06, 0.0125 + body_width/4). Even the widest allowed
      body (0.18 m) gives only 0.0575, so the limit stays at 0.06 m. The controller
      has to keep the robot inside that band. Widening the array helped, so the line-detection
      geometry is still the most useful lever. The outer sensors at ±0.06 are the
      widest I can place within the 0.08 m limit, and I can''t push them further.
      I can add sensors between them instead. A 7-sensor array at x = -0.06, -0.04,
      -0.02, 0, 0.02, 0.04, 0.06 keeps the same outer reach while giving finer, overlapping
      coverage of the 25 mm tape, so the signal changes more smoothly as the robot
      drifts.


      I also move the sensor row forward to y = 0.08, the maximum allowed. More lookahead
      lets the controller react earlier at bends, which is where the excursions happen.
      Weights scale as offset/0.06 (about 1 unit per 0.06 m), the same scale that
      iteration 4 used. This keeps kp near its tested value and avoids a new gain
      change.


      Controller: keep base_speed 1.3, kp 2.5 and ki 0.2, since these are the values
      that produced the best result. Raise kd from 1.2 to 1.5 to damp the steering
      oscillation (0.15 to 0.21 so far) that comes with the denser sensor array. Keep
      last_direction line loss.


      Expected result: fewer off-track excursions at bends, max_error nearer 0.055
      to 0.06, and oval and s-bend progress above 0.35. Completion on any track is
      still unlikely at this speed, but the score should rise above 81.6 if the lower
      max error holds. The main risk is that the extra sensors add noise or raise
      the signal sensitivity, so the next revision should check the oscillation and
      line-loss numbers before changing kd or kp again.


      - [Open this output](iteration-5/entity0/versions/71848d81d6fd448aa85c85deb5784c38/payload.json)

      - Based on: [entityR2A](iteration-5/entityR2A/versions/carried-c42500c4daca1aee/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Flags the false ''overlapping sensor'' and reach claims, the unsupported
      kd rise and the confounded multi-variable change. Evidence is the iteration
      0 to 4 race tables, where kd and kp changes did not move oscillation or max_error.


      - [Open this output](iteration-5/entityC1/versions/3e5664a0a39046c2ac42debd0529f6e1/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/71848d81d6fd448aa85c85deb5784c38/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-c42500c4daca1aee/payload.json)'
  - id: entity1
    label: Sensor row forward to
    notes: 'Keeps the raced iteration-4 design (best score 81.56) and moves only the
      sensor row forward from y=0.05 to y=0.07 for earlier steering at bends. The
      draft''s 7-sensor array, kd increase and speed cut were rejected or left out,
      as the critique showed they were unsupported or confounded.


      ### Rationale


      Evidence: iteration 4 is the best raced design (81.56). Its sensors sat at x
      = -0.06 to 0.06 with 0.016 m footprints at y = 0.05, with kp 7.0, ki 0.1, kd
      0.3, base_speed 1.4 and last_direction. It scored 135.7 on the oval (progress
      0.33), 67.9 on the s-bend (progress 0.17) and 41.1 on the slalom (progress 0.10).
      Every one of 60 trials ended off track. Max error stayed at 0.063 m, just above
      the 0.06 m limit, and each run had about one line loss.


      Accepted from the round-1 critique: (a) I drop the draft''s 7-sensor array and
      y = 0.08 row. Its ''overlapping coverage'' claim was false, and it changed several
      things at once. (b) I keep kd at 0.3. Iterations 1 and 2 showed that raising
      kd did not reduce steering_oscillation, so the draft''s kd 1.5 is unsupported.
      (c) I keep kp 7.0, ki 0.1 and base_speed 1.4. Iteration 4 is the raced controller,
      and the critique is right that speed was never isolated, but cutting speed would
      reduce progress, which is worth 250 points directly. (d) I accept the point
      that the outer-reach argument must use the engagement figure. A sensor at x
      = 0.06 begins to see tape at about 0.04 m offset, and x = 0.08 would engage
      only at about 0.06 m, which is too late. So I keep x = ±0.06.


      Rejected: the draft''s claim that offset/0.06 weighting keeps kp ''near its
      tested value'' is not a reason to change anything, so I keep the iteration-4
      weights.


      Change (single variable): sensor row moved forward from y = 0.05 to y = 0.07,
      with everything else identical to iteration 4. Forward lookahead lets the steering
      loop react earlier at bends, where the excursions occur. Because only geometry
      changes, any shift in max_error, line_loss_events or progress can be attributed
      to this change.


      Hypotheses on the development tracks: max_error falls below 0.06 m on the oval
      and s-bend; line_loss_events are 1 or fewer per run; oval progress stays at
      or above 0.33. If steering_oscillation rises by more than 30 percent, the next
      test is y = 0.06 rather than a kd change. If max_error gets worse, revert to
      y = 0.05. The slalom remains the weakest track, and completion at base_speed
      1.4 is still untested, so completion_time and progress are requested.


      - [Open this output](iteration-5/entity1/versions/dd0d5a7664994479b8709def0c2ea4bb/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/71848d81d6fd448aa85c85deb5784c38/payload.json),
      [entityC1](iteration-5/entityC1/versions/3e5664a0a39046c2ac42debd0529f6e1/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-c42500c4daca1aee/payload.json)'
  - id: entityC2
    label: Round-2 critique
    notes: 'Critique of the forward-sensor revision (y 0.07). It questions the lookahead
      mechanism, the unsupported line-loss hypothesis, and the inherited low centre-line
      gain, and notes that completion still has no plan. It rests on the iteration-4
      and iteration-2 race summaries.


      - [Open this output](iteration-5/entityC2/versions/c5380bf28c7b4df29b1ec0d4c2304b1f/payload.json)

      - Based on: [entity1](iteration-5/entity1/versions/dd0d5a7664994479b8709def0c2ea4bb/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-c42500c4daca1aee/payload.json)'
  - id: entity2
    label: Outer sensors at ±0.045
    notes: 'Moves outer sensors from ±0.024 to ±0.045 to cover the 0.044 to 0.060
      m band, with gains held at the best-raced values, so the change tests sensor
      layout. Compromise chosen because the round-2 critique showed that ±0.06 cuts
      near-centre gain about 2.5 times and confounds the result.


      ### Rationale


      Evidence: the best raced design is iteration 2 (score 65.2489): sensors at x
      = ±0.024, kp 7.0, ki 0.1, kd 0.3, base_speed 1.4, last_direction. All 60 trials
      ended off track with no finishes. Max error is 0.0677 (oval), 0.0614 (s-bend)
      and 0.0645 (slalom), so every track exceeds the 0.06 m limit. rms error is 0.024
      to 0.028 m, so the failures are peak excursions. Line losses run 1 to 2 per
      run. Across iterations 0 to 2, max_error on the oval moved only between 0.064
      and 0.068 while the gains changed, so the gains are not the main limit on peaks.
      The sensing span is the main untested lever.


      Review of the round-2 critique. I accept point 1: widening the sensors to x
      = ±0.06 cuts the near-centre slope of the steering signal by about 2.5 times,
      which acts like a much lower kp and confounds the sensor test. I accept point
      4 and the kill-rule concern, since coarser signal may raise oscillation for
      reasons unrelated to edge coverage. I accept point 5: the sensors at ±0.06 cover
      offsets 0.044 to 0.060 m only in the outer band, so the benefit is real but
      narrow. I reject the critique''s suggestion to add a kp rescale (kp about 13
      to 16). That would also multiply turn authority at the edges by about 2 times,
      which is a second large change with its own oscillation risk. I also reject
      returning to the raced layout, since no test would then be learned.


      Change: sensor x set to ±0.045 with inner sensors at ±0.0225 and centre at 0
      (positions -0.045, -0.0225, 0, 0.0225, 0.045; y = 0.05). Under the engagement
      rule (about 0.02 m beyond each sensor''s x), the outer sensors see tape to roughly
      0.065 m offset, which covers the 0.044 to 0.060 m band the current layout misses.
      The near-centre slope falls by about 0.53 times rather than 0.4 times, so the
      confound is halved. Gains are kept at the best-raced values (kp 7.0, ki 0.1,
      kd 0.3, base_speed 1.4, last_direction). I do not change ki, kd or speed, because
      the critique gives no evidence that ki 0.2 helped (iteration 3 scored lower
      at 65.0106), and completion is not reachable without a separate speed test.


      Hypotheses: max_error falls below 0.0614 m on the oval and slalom; line_loss_events
      fall to 1 or fewer per run; oval progress rises above 0.25. The result is not
      expected to finish any run. Kill rule: if steering_oscillation rises by more
      than 30 percent, or max_error does not fall on at least two tracks, the next
      race returns to x = ±0.024 and tests kp alone. If runs stay on track with completion_time
      above 3 s, base_speed rises by 0.1 in a single-change test.


      - [Open this output](iteration-4/entity2/versions/ee1aa6cdceab496e87e0d2022fa1be9a/payload.json)

      - Based on: [entity1](iteration-4/entity1/versions/40a2cd35d88448a6b2a89ac2bff95c47/payload.json),
