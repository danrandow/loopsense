map:
  id: race-210-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Restore best geometry, kd
    notes: 'Reverts to the iteration-4 sensor layout (best score 81.56) after the
      7-sensor, y=0.08 change dropped the score to 61.46. Raises kd to 1.8 alone to
      damp the 0.15 to 0.19 steering oscillation, so the race isolates that one change.


      ### Rationale


      Evidence: the best result so far is iteration 4 (81.56), with five sensors at
      x = -0.06 to 0.06, y = 0.07, sensor_size 0.016, base_speed 1.3, kp 2.5, ki 0.2,
      kd 1.2 and last_direction line loss. Iteration 5 scored 61.46 after changing
      three things at once: the sensor count (5 to 7), the forward row (y 0.07 to
      0.08), and kd (1.2 to 1.5). The oval progress fell from 0.33 to 0.18, and the
      oval score fell from 135.7 to 76.4. Because these changes were confounded, I
      cannot tell which one caused the drop. The safest reading is that the 7-sensor,
      y = 0.08 layout is worse, so I revert to the iteration 4 geometry.


      Across all 300 development trials, no run finished, and every run ended off
      track with max_error around 0.063 to 0.064 m, just above the 0.06 m limit. rms_error
      stays near 0.03 m. Oscillation was 0.15 to 0.19 in the best run, and the line
      was lost about once per run. The off-track limit cannot be raised by body width
      (it stays at 0.06 m), so the controller has to hold the robot tighter.


      Change: restore the iteration 4 geometry exactly (5 sensors, x = -0.06 to 0.06,
      y = 0.07, size 0.016, same wheels and body). Keep base_speed 1.3, kp 2.5 and
      ki 0.2, since these produced the best score. Raise kd from 1.2 to 1.8 to damp
      the 0.15 to 0.19 steering jitter that drives the peak excursions. kd is the
      only controller value changed, so this race isolates it. Keep last_direction
      line loss and the same weights.


      Expected result: lower steering oscillation and fewer line-loss events, with
      max_error nearer 0.06 and oval progress around 0.33 or higher. The score should
      land near 82 to 88, with a small chance of a first finish on the oval. The main
      risk is that kd of 1.8 amplifies sensor noise on the 16 mm footprints. If oscillation
      rises, the next revision should lower kd back toward 1.2 rather than change
      geometry.


      - [Open this output](iteration-6/entity0/versions/4fc7b6e74bc44c6fbb8c28d2565be391/payload.json)

      - Based on: [entityR2A](iteration-6/entityR2A/versions/carried-a2d4893514bc2ebb/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Round-1 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-6/entityC1/versions/c2a7014f38d6451e84fa9cc0aabfa6cd/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/4fc7b6e74bc44c6fbb8c28d2565be391/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-a2d4893514bc2ebb/payload.json)'
  - id: entity1
    label: Iter-4 base, kd 0.6 test
    notes: 'Reverts to the raced iteration 4 design (y 0.05, kp 7, base 1.4), which
      scored 81.56, and changes only kd from 0.3 to 0.6. The draft misread the raced
      values and the iteration 5 result shows y 0.07 hurts, so both are rejected.


      ### Rationale


      What the evidence shows. The draft''s rationale misidentifies the best design.
      Iteration 4''s raced design (score 81.56, from the outcome table) was sensors
      at x = -0.06 to 0.06 with y = 0.05, kp 7.0, ki 0.1, kd 0.3, base_speed 1.4,
      last_direction. The draft''s ''restore iteration 4'' used y = 0.07, kp 2.5,
      base_speed 1.3 and kd 1.2, which are the iteration 3 and 4 ''received'' values,
      not the raced design. Iteration 5 changed only y (0.05 to 0.07) from the iteration
      4 design and fell from 81.56 to 61.46. So the 0.07 row is the most clearly harmful
      change measured, and it must not be carried forward. All 300 development trials
      ended off track with max_error about 0.063 m, just over the 0.06 m limit. Off-track
      exits, not the course, end every run.


      What I kept, changed and rejected. Kept: the iteration 4 raced design as the
      base (x = -0.06 to 0.06, y = 0.05, 16 mm footprints, kp 7.0, ki 0.1, base_speed
      1.4, last_direction, same wheels, body and mass). The critique is right that
      the 0.07 row, kp 2.5 and base_speed 1.3 were confounded and that no run shows
      them helping, so I do not use them. Rejected: the draft''s kd 1.8 jump. The
      critique notes that iteration 1 raised kd from 0.3 to 0.8 without lowering oscillation,
      and the draft''s mechanism is asserted. A jump to 1.8 also risks saturation
      on tape-edge steps. Changed: kd 0.3 to 0.6, one variable only. This is a small
      test of whether damping lowers steering_oscillation and max_error from the best
      base. The step is deliberately modest so the change is readable and the saturation
      risk is low. Speed and kp are not changed, because their effect was never isolated
      and changing them would confound the race.


      Expected result and pass or fail rules. Expected: max_error at or below about
      0.062 on the oval and s-bend, steering_oscillation at or below 0.19 on the oval,
      line_loss_events at or below 1 per run, and oval progress at or above 0.33.
      Keep kd 0.6 only if max_error falls and oscillation does not rise by more than
      20 percent. If oscillation rises by more than 20 percent, return kd to 0.3,
      since the raced best is then the baseline. If max_error is unchanged within
      0.001 m, kd is not the lever, and the next test is base_speed alone. Completion
      is still not reached; completion_time is requested so the next race shows whether
      the robot is slow or stopped.


      - [Open this output](iteration-6/entity1/versions/63c090c94ab14812843e64a90d866efb/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/4fc7b6e74bc44c6fbb8c28d2565be391/payload.json),
      [entityC1](iteration-6/entityC1/versions/c2a7014f38d6451e84fa9cc0aabfa6cd/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-a2d4893514bc2ebb/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Critiques the kd 0.3 to 0.6 candidate on the iteration-4 base. Main points:
      the rationale cites an iteration-1 kd 0.8 run that the history does not contain,
      the oscillation pass limit sits almost on the baseline, and completion is still
      unaddressed. Evidence is the outcome table and the iteration 4 per-track metrics.


      - [Open this output](iteration-6/entityC2/versions/ced45aed63dc4fbc8593253c76ab7857/payload.json)

      - Based on: [entity1](iteration-6/entity1/versions/63c090c94ab14812843e64a90d866efb/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-a2d4893514bc2ebb/payload.json)'
  - id: entity2
    label: Forward row y=0.07 test
    notes: 'Single change from the best raced design (iteration 4, 81.56): sensor
      row moved forward from y=0.05 to y=0.07, with x spread ±0.045 and all gains
      unchanged. Rests on the iteration-4 outcome table, and corrects the authorised
      rationale''s ±0.06 baseline error. Kill rule reverts to y=0.05 if steering oscillation
      rises over 30% or max_error worsens on two tracks.


      ### Rationale


      Evidence: iteration 4 is the best raced design (81.56). Its sensors were at
      x = -0.045, -0.0225, 0, 0.0225, 0.045 with y = 0.05, kp 7.0, ki 0.1, kd 0.3,
      base_speed 1.4 and last_direction. It scored 135.7 on the oval (progress 0.33),
      67.9 on the s-bend (progress 0.17) and 41.1 on the slalom (progress 0.10). All
      60 trials ended off track, max_error was 0.063 m on each track, and there was
      about one line loss per run.


      Correction: the authorised entity1 rationale says iteration 4 had x = ±0.06.
      The outcome table and the iteration-4 design both show ±0.045, so I use ±0.045
      as the baseline. The ±0.06 layout was never raced, and the outer-sensor engagement
      figure was taken from the wrong baseline.


      Review of the round-2 critique. I accept point 1: moving the row forward raises
      the effective heading gain (about 40 percent at y = 0.07 against 0.05), so steering_oscillation
      may rise, and I keep the oscillation kill rule. I accept point 2: forward position
      does not widen lateral reach, so I do not claim that line_loss_events will fall
      for geometric reasons. I accept point 5 and the completion concern as open issues,
      but I do not change speed in this race. I reject the critique''s suggestion
      to fall back to x = ±0.06 now. That layout cuts the near-centre slope by about
      2.5 times and was never validated, so it would confound this test. I also reject
      any kp change, because the kp evidence is confounded and any change would be
      a second variable.


      Change: one variable from iteration 4. The sensor row moves from y = 0.05 to
      y = 0.07, with x, sensor size, controller and body all unchanged. The aim is
      earlier steering reaction at bends, where the excursions occur. The test isolates
      forward lookahead on the best-raced layout. Engagement at x = 0.045 reaches
      roughly 0.065 m offset, which covers the band where the peaks sit.


      Hypotheses: max_error falls below 0.0629 m on at least two tracks; progress
      on the oval stays at or above 0.33; line_loss_events are 1 or fewer per run.
      These are predictions, not derived values. Kill rule: if steering_oscillation
      rises by more than 30 percent, or max_error gets worse on two or more tracks,
      revert to y = 0.05 and do not raise kd. Completion at base_speed 1.4 remains
      untested, so completion_time is requested. If runs stay on track with completion_time
      above 3 s, the next single test is base_speed plus 0.1.


      - [Open this output](iteration-5/entity2/versions/71c8ed316df74347b6dfe2778231d9a1/payload.json)

