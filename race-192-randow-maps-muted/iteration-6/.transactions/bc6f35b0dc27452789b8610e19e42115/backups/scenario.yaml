map:
  id: race-192-randow-maps-muted
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Baseline + 8mm sensors
    notes: 'Keeps the best-scoring baseline (356.6) and changes only the sensor footprint
      from 12 mm to 8 mm, to test finer edge resolution on the s-bend and slalom.
      Iterations 1 to 4 showed that changing lead, spread, mass or drivetrain hurt
      the oval, so this isolates one variable.


      ### Rationale


      Race evidence: the iteration-0 baseline (0.6 kg, 0.12 m track, 0.03 m radius,
      five sensors at ±0.024 m on a 12 mm pitch, y=0.05 m, 12 mm footprint) is still
      the best design at 356.6. It finishes the oval 20/20 in about 1.65 s but goes
      off track on the s-bend (progress 0.17) and slalom (progress 0.12). Every change
      since then has hurt. Widening the array and narrowing the track or lightening
      the robot (iterations 1 and 2) cut oval finishes to 17/20 and 15/20. Moving
      the sensors forward to y=0.07 m (iteration 3) collapsed the oval to 0/20. Moving
      them back to y=0.03 m (iteration 4) also collapsed the oval to 0/20 and scored
      only 118.9. So the oval is very sensitive to sensor lead, and y=0.05 m is a
      tight optimum. Iteration 4 also shows that the bend failures were not fixed
      by a shorter lead, so the remaining untested lever on the bends is sensor sensing
      resolution. This iteration therefore returns to the baseline body, drivetrain,
      array spread, pitch and lead exactly, and changes only the sensor footprint
      from 12 mm to 8 mm. Each sensor then sees a smaller patch, so the edge of the
      tape is resolved more sharply and the signal may track the line more precisely
      at the bends. Coverage is not lost: with the 12 mm pitch, the 25 mm tape always
      covers at least one sensor, so gaps between footprints do not drop the sum below
      0.05. Expected result: the oval stays near 20/20 at about 1.65 s, and s-bend
      and slalom progress rises above 0.17 and 0.12. Risk: smaller footprints give
      a more binary, noisier signal, so steering oscillation may rise. If the oval
      falls, the 12 mm footprint stays the better choice and the next test should
      be a larger footprint (16 mm) with the same spread.


      - [Open this output](iteration-5/entity0/versions/4522f049d78e4b6aa82cdb2bc916648b/payload.json)

      - Based on: [entityR2A](iteration-5/entityR2A/versions/carried-13ba5d01b1d28c96/payload.json)'
  - id: entity1
    label: 8 mm footprint test
    notes: 'Single-variable change from the iteration-0 baseline: sensor_size 0.012
      to 0.008, with geometry and controller otherwise identical. The oval held 20/20
      in iteration 0, and y=0.05 is the only lead that did not collapse it (iterations
      3 and 4).


      ### Rationale


      The Builder''s entity0 is a single-variable test against the iteration-0 baseline:
      the sensor footprint changes from 12 mm to 8 mm, and every other geometry value
      is unchanged. The baseline controller is kept exactly, so the footprint is the
      only variable. Iteration 0 is still the best design (356.6), with the oval at
      20/20 in 1.65 s and oscillation 0.15. Its s-bend (0.17) and slalom (0.12) failures
      are at max_error of about 0.061 m, at the 0.06 m limit. Iterations 3 and 4 show
      the sensor row is very sensitive to lead: y=0.07 and y=0.03 both collapsed the
      oval to 0/20, so y=0.05 stays. Iterations 1 and 2 showed that the 0.5 kg mass
      and the wide array hurt the oval, so the drivetrain stays at 0.6 kg, 0.12 m
      track and 0.03 m radius. The 8 mm footprint leaves 4 mm gaps between sensors
      at 12 mm pitch. The 25 mm tape still covers at least one sensor at any offset,
      so the summed reading should not fall below 0.05 from gaps alone. Controller:
      kp 2.5, ki 0.05, kd 0.3, base_speed 1.8, weights [2,1,0,-1,-2], last_direction,
      unchanged. I expect the oval to stay near 20/20 at about 1.65 s, and the bends
      to improve only if finer edge resolution helps. Steering oscillation may rise
      with a more binary signal, and this is untested.


      - [Open this output](iteration-5/entity1/versions/42413611f30d4e8d8d0f273048cfcc06/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/4522f049d78e4b6aa82cdb2bc916648b/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-13ba5d01b1d28c96/payload.json)'
  - id: entityR1
    label: Spread or footprint next
    notes: 'Pre-race feedback that keeps y=0.05 fixed and sets the next step by the
      8 mm result: widen spread if the oval holds and bends gain, or return to 12
      mm and try 16 mm if the oval falls. Based on iterations 0 to 4.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Evidence:
      iteration 0 (12 mm footprint, y=0.05, 0.6 kg, baseline controller) is the only
      stable design, finishing the oval 20/20 in 1.65 s with oscillation 0.15 but
      failing the s-bend at 0.17 and the slalom at 0.12 with max_error near 0.061
      m. Iterations 3 and 4 showed that moving the sensor row to y=0.07 or y=0.03
      collapsed the oval to 0/20, so y=0.05 should stay fixed for any further test.
      Iterations 1 and 2 showed that the 0.5 kg mass and the wide array both cost
      oval finishes, and the bend gain from the wider array was small (0.17 to 0.24).
      I kept the controller at baseline so only the footprint changes. Next race:
      if the oval holds at 19/20 or better near 1.65 s and bend progress rises above
      0.17 and 0.12, keep the 8 mm footprint and test a modest spread increase at
      0.6 kg. If the oval drops or steering oscillation rises above about 0.2, return
      to 12 mm and test a 16 mm footprint at the same spread. If bend progress is
      unchanged with max_error still near 0.06, the footprint is not the bend limit,
      so the next test should change spread alone.


      ### Requested changes


      - If the oval finishes at least 19/20 near 1.65 s and s-bend or slalom progress
      rises above 0.17 or 0.12, keep sensor_size 0.008 and widen sensor x to plus
      or minus 0.028 m (pitch 14 mm) with mass held at 0.6 kg, since iteration 1 gave
      a partial bend gain from the wider array.

      - If the oval falls below 19/20 or steering_oscillation rises above about 0.2
      (baseline 0.15), return sensor_size to 0.012 and test sensor_size 0.016 at x
      plus or minus 0.024 and y 0.05, since iteration 0 showed the bends fail at max_error
      0.061 with a 12 mm footprint.

      - Keep sensor y at 0.05 m for every next test, since iteration 3 (y=0.07) and
      iteration 4 (y=0.03) both collapsed the oval to 0/20 while the baseline at y=0.05
      finished 20/20.


      - [Open this output](iteration-5/entityR1/versions/42413611f30d4e8d8d0f273048cfcc06/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/4522f049d78e4b6aa82cdb2bc916648b/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-13ba5d01b1d28c96/payload.json)'
