map:
  id: race-192-randow-maps-muted
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Baseline + forward
    notes: 'Reverts the drivetrain to the stable 0.6 kg, 0.12 m track, 0.03 m radius
      baseline and moves only the sensor array forward from y=0.05 to y=0.07 m. Evidence:
      the baseline finished the oval 20/20 but went off track on the s-bend and slalom,
      and the iteration 1 and 2 changes to mass, track and spread degraded the oval
      without fixing the bends.


      ### Rationale


      Evidence across three races: (0) baseline 0.6 kg, 0.12 m track, 0.03 m radius,
      array at ±0.024 m, sensors at y=0.05 m: oval 20/20 finished (mean 950), s-bend
      progress 0.17, slalom 0.12, both off track. (1) Three changes at once (wide
      ±0.032 array, 0.10 m track, 0.5 kg, 0.033 m radius): oval fell to 17/20 with
      oscillation up from 0.15 to 0.26, s-bend 0.24, slalom 0.19. (2) Wide array with
      baseline drivetrain at 0.5 kg: oval 15/20 with oscillation 0.21, s-bend 0.20,
      slalom 0.12. The oval loss in iteration 2 is most likely from the lighter 0.5
      kg mass or the wider array, and the evidence cannot separate these. The wider
      array only gave a small gain on the bends, so its benefit is modest. The bend
      failures persist in every design, which points away from track width and toward
      the sensing lead.


      Decision: return to the proven 0.6 kg, 0.12 m track, 0.03 m radius drivetrain
      and the ±0.024 m array at 12 mm pitch, which finished the oval reliably. Change
      only the forward position of the sensors, from y=0.05 to y=0.07 m, to give about
      2 cm more look-ahead on the s-bend and slalom. A longer lead should let the
      controller respond before the robot drifts off the 25 mm tape, while the array
      shape stays fixed so the oval should be unaffected. The off-track limit is 0.06
      m regardless of body width here, since the body only adds width/4 and widening
      it to 0.18 gives max(0.06, 0.0575), so body width is not a lever. I expect the
      oval to stay near 950 and the s-bend and slalom progress to rise above 0.17
      and 0.12. A completed s-bend would be the main sign that lead, not spread or
      drivetrain, is the limit. If progress does not move, the next lever is the sensor
      footprint (8 mm for finer edge resolution) or a larger array spread with the
      mass kept at 0.6 kg.


      - [Open this output](iteration-3/entity0/versions/04a6d6391b874df69524d202e42a24d6/payload.json)

      - Based on: [entityR2A](iteration-3/entityR2A/versions/carried-7264ea940fafaa4a/payload.json)'
  - id: entity1
    label: Wide array, baseline
    notes: 'Keeps the ±0.032 m array that gave partial bend gains in iteration 1,
      restores the 0.12 m track and 0.03 m radius that kept the oval stable, and returns
      kp/kd to baseline. Tests whether the array alone helps the bends.


      ### Rationale


      Iteration 1 changed three things at once: the array (to ±0.032 m), the wheel
      track (0.12 to 0.10 m), and the drivetrain (0.5 kg, 0.033 m radius). The score
      fell from 356.6 to 341.7. The oval dropped from 20/20 finishes to 17/20, mean
      time slowed from 1.65 s to 1.84 s, and oval steering oscillation rose from 0.15
      to 0.26. The wider array did help the bends somewhat: s-bend progress rose from
      0.17 to 0.24 and slalom from 0.12 to 0.19. Both still end off track, and the
      slalom gained a line-loss event. The evidence therefore points to the narrower
      track and changed drivetrain as the cause of the oval regression, with the array
      as the partial gain. This iteration keeps the wider ±0.032 m array at 16 mm
      pitch, which is the change with evidence behind it, and restores the baseline
      wheel_track (0.12 m) and wheel_radius (0.03 m) that gave the stable oval. Mass
      is kept at 0.5 kg so the array and the drivetrain are tested separately from
      iteration 0 and iteration 1. Controller: the signal scale depends only on the
      weights and the reading-weighted average, so the wider spacing does not require
      new weights. I return kp to the baseline 2.5 and kd to 0.3, because iteration
      1''s kp 2.8 and kd 0.4 were tuned to a narrower track that is no longer present,
      and the baseline kp/kd gave the most stable oval (oscillation 0.15). base_speed
      stays at 1.8 and line_loss stays ''last_direction'', since no race has shown
      a wrong search direction. Expected result: oval back to near-complete finishes
      at about 1.65 s, and s-bend and slalom progress above the baseline''s 0.17 and
      0.12, though they may still go off track. This is untested.


      - [Open this output](iteration-2/entity1/versions/25dcbb27a2714bf2bdc8b53122169a24/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/457a6b7645d5474190b9e06917f5c102/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-7286fda3b762a160/payload.json)'
  - id: entityR1
    label: Sensor size and mass next
    notes: 'Feedback is written before the race and cites iteration 0 and 1 outcomes.
      It proposes sensor_size 0.016, mass 0.6 kg, or sensor y 0.03 depending on what
      the next race shows on the bends and the oval.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Evidence
      so far: iteration 0 (baseline, 0.12 m track, ±0.024 m array, 0.6 kg) finished
      the oval 20/20 at 1.65 s with oscillation 0.15, but the s-bend and slalom went
      off track at progress 0.17 and 0.12 with max_error about 0.061 m, at the 0.06
      m limit. Iteration 1 (±0.032 m array, 0.10 m track, 0.033 m radius, 0.5 kg,
      kp 2.8, kd 0.4) finished only 17/20 on the oval, slowed to 1.84 s, raised oscillation
      to 0.26, and improved the bends only partly (s-bend 0.24, slalom 0.19). The
      array widening looks useful; the narrower track and drivetrain change look harmful.
      For the controller I kept the weights in sensor order and returned kp and kd
      to the baseline values, because the higher gains were tied to the narrower track.
      Next race decides the next change. If the s-bend or slalom still go off track
      with max_error near 0.06 m and the oval finishes, the limit is likely sensor
      lead or footprint: try sensor y 0.03 or sensor_size 0.016. If the oval finishes
      but steering_oscillation rises well above 0.15 on the oval, the 0.5 kg mass
      is probably too light for this controller: return to 0.6 kg. If the oval stops
      finishing, return the drivetrain fully to baseline and keep the wider array.


      ### Requested changes


      - If the s-bend or slalom still end off track with line_loss_events of 1 or
      more and max_error near 0.06 m, change sensor_size from 0.012 to 0.016 so the
      16 mm pitch leaves no gaps across the 25 mm tape. Iteration 0 gave max_error
      0.061 on both bends, and iteration 1 showed the wider array helps progress (0.17
      to 0.24), so coverage is the open question.

      - If the oval steering_oscillation rises above about 0.2 (baseline 0.15, iteration
      1 0.26) while the array is wide, change mass from 0.5 back to 0.6 kg. Iteration
      1 used 0.5 kg with the narrower track, so the mass effect was never isolated.

      - If sensor coverage is confirmed but the bends still fail, move the sensor
      row from y 0.05 to y 0.03 to reduce the forward lead. Iteration 0''s 50 mm lead
      gave bends with max_error at the limit, but no run has yet tested the lead on
      its own.


      - [Open this output](iteration-2/entityR1/versions/25dcbb27a2714bf2bdc8b53122169a24/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/457a6b7645d5474190b9e06917f5c102/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-7286fda3b762a160/payload.json)'
