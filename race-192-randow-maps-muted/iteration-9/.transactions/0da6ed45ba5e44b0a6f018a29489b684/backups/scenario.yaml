  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Baseline restored (iter
    notes: 'Reverts all geometry to the iteration-0 baseline, the only design that
      finishes the oval (356.6). Every deviation since (lead, footprint, spread, body
      length, track, mass) collapsed the oval or cut its finish rate, so the baseline
      is kept to secure a stable platform. Requests per-bend line-loss diagnostics
      from the Integrator.


      ### Rationale


      The evidence across nine iterations points to a sharp local optimum at the iteration-0
      baseline. It is the only design that finishes any track: 20/20 on the oval at
      about 1.65 s, scoring 356.6 overall. Every single-variable or combined change
      since then has either collapsed the oval to 0/20 or cut finishes (iteration
      1 to 17/20, iteration 2 to 15/20). That covers the sensor lead at y=0.03 and
      y=0.07 m, footprints of 8 and 16 mm, the wider ±0.032 m array (iteration 7 collapsed
      the oval, which overturns the iteration-2 bend-gain reading), and body length
      0.12 m (iteration 8, scored 78.4, oval 0/20). The s-bend and slalom have never
      moved meaningfully above progress 0.28 and 0.12, so no geometry tested so far
      fixes them. The remaining levers are small, and any change risks the one stable
      configuration. The final evaluation runs on an unseen track of a different shape,
      so a reproducible, robust platform is worth more than a speculative bend gain.
      I therefore revert to the iteration-0 baseline exactly. This secures the proven
      oval finish and the best known score, and it gives the Integrator a fixed platform
      to diagnose where the s-bend and slalom fail (the step and lateral error at
      first line loss, and the sensor readings at that step). I expect a score near
      356, matching the baseline''s seed-stable oval result. No bend completion is
      expected from geometry alone.


      - [Open this output](iteration-9/entity0/versions/8ea139700dd24181b04d248abcac6a13/payload.json)

      - Based on: [entityR2A](iteration-9/entityR2A/versions/carried-54d8c9bc3ed7547e/payload.json)'
  - id: entity1
    label: Shorter body, 0.12 m
    notes: 'Single-variable test: body_length 0.16 to 0.12 m with the baseline controller
      unchanged, cutting yaw inertia by about 25 percent. Based on iteration 0 being
      the best design and all other geometry deviations collapsing the oval.


      ### Rationale


      The Builder''s entity0 is a single-variable test: body_length goes from 0.16
      to 0.12 m, which cuts yaw inertia by about 25 percent (0.0452 to 0.0340 kg m^2
      with 0.6 kg and 0.14 m width). Nothing else changes. Body length does not enter
      the off-track limit or the sensing, so the only physical effect is turn response.
      Race evidence: iteration 0 is still the best design (356.6). Its oval finishes
      20/20 at 1.65 s with oscillation 0.15, and its s-bend (0.17) and slalom (0.12)
      fail at max_error about 0.061 m. Sensor lead (y 0.03 and 0.07), footprint (8
      mm), spread with a lighter drivetrain, and lighter mass all collapsed or degraded
      the oval, so the controller appears tuned to the baseline. The controller therefore
      stays exactly at the iteration-0 baseline (kp 2.5, ki 0.05, kd 0.3, base_speed
      1.8, weights [2,1,0,-1,-2], last_direction), so the geometry is the only variable.
      I expect the oval to stay near 20/20 at about 1.65 s, with steering oscillation
      at or below 0.15 because the shorter body reduces yaw response. Bend progress
      may rise slightly. This is untested, and if the oval falls, the baseline body
      length remains the reference.


      - [Open this output](iteration-8/entity1/versions/7e2be16536a14668b9f8203eb5205cf2/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/75c4407dd05d4431a57b2b3e45370e3b/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-385e1f80155ae98f/payload.json)'
  - id: entityR1
    label: Shorter-body feedback
    notes: 'Conditional guidance for the next race: keep the shorter body and test
      a modest spread if the oval holds and bends improve, otherwise revert to 0.16
      m. Grounded in iterations 0 to 6, where lead, footprint, mass and drivetrain
      each degraded the oval.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Evidence:
      iteration 0 (baseline, body 0.16 m) is the best design at 356.6. It finishes
      the oval 20/20 at 1.65 s with oscillation 0.15, but its s-bend (0.17) and slalom
      (0.12) fail at max_error about 0.061 m. Iterations 3 to 6 show the baseline
      is a sharp local optimum: sensor y at 0.07 or 0.03, footprint 8 mm, and footprint
      16 mm each cost the oval, and iteration 6 scored 78.8 with the oval at 0/20.
      Iterations 1 and 2 show that the wider array gives a partial bend gain (s-bend
      0.17 to 0.24, slalom 0.12 to 0.19), but the oval loss was confounded with the
      lighter mass and narrower track. I kept the controller at baseline so the body
      length is the only variable. Next race: if the oval stays at 20/20 near 1.65
      s with oscillation at or below 0.15 and bend progress rises slightly above 0.17
      and 0.12, keep body_length 0.12 m and test a modest spread change (x plus or
      minus 0.028 m). If the oval drops or oscillation rises above about 0.2, return
      to body_length 0.16 m, since yaw inertia is damping the controller. If the bends
      do not move with the oval held, the bend limit is controller-side and geometry
      cannot fix it alone.


      ### Requested changes


      - If the oval holds at 20/20 near 1.65 s and s-bend or slalom progress rises
      above 0.17 or 0.12, keep body_length 0.12 m and widen sensor x to plus or minus
      0.028 m at 14 mm pitch, with mass 0.6 kg. Iterations 1 and 2 gave a partial
      bend gain from the wider array.

      - If the oval falls below 20/20 or steering_oscillation rises above about 0.2
      (baseline 0.15), return body_length to 0.16 m, because iteration 0 is the reference
      and the controller appears tuned to the baseline yaw inertia.

      - Keep sensor y at 0.05 m, sensor_size at 0.012 m and mass at 0.6 kg for the
      next test. Iterations 3 to 6 show the oval collapses when any of these moves
      alone.


      - [Open this output](iteration-8/entityR1/versions/7e2be16536a14668b9f8203eb5205cf2/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/75c4407dd05d4431a57b2b3e45370e3b/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-385e1f80155ae98f/payload.json)'
