map:
  id: race-192-randow-maps-muted
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Baseline + forward
    notes: 'Reverts the drivetrain to the stable 0.6 kg, 0.12 m track, 0.03 m radius
      baseline and moves only the sensor array forward from y=0.05 to y=0.07 m. Evidence:
      the baseline finished the oval 20/20 but went off track on the s-bend and slalom,
      and the iteration 1 and 2 changes to mass, track and spread degraded the oval
      without fixing the bends.


      ### Rationale


      Evidence across three races: (0) baseline 0.6 kg, 0.12 m track, 0.03 m radius,
      array at ±0.024 m, sensors at y=0.05 m: oval 20/20 finished (mean 950), s-bend
      progress 0.17, slalom 0.12, both off track. (1) Three changes at once (wide
      ±0.032 array, 0.10 m track, 0.5 kg, 0.033 m radius): oval fell to 17/20 with
      oscillation up from 0.15 to 0.26, s-bend 0.24, slalom 0.19. (2) Wide array with
      baseline drivetrain at 0.5 kg: oval 15/20 with oscillation 0.21, s-bend 0.20,
      slalom 0.12. The oval loss in iteration 2 is most likely from the lighter 0.5
      kg mass or the wider array, and the evidence cannot separate these. The wider
      array only gave a small gain on the bends, so its benefit is modest. The bend
      failures persist in every design, which points away from track width and toward
      the sensing lead.


      Decision: return to the proven 0.6 kg, 0.12 m track, 0.03 m radius drivetrain
      and the ±0.024 m array at 12 mm pitch, which finished the oval reliably. Change
      only the forward position of the sensors, from y=0.05 to y=0.07 m, to give about
      2 cm more look-ahead on the s-bend and slalom. A longer lead should let the
      controller respond before the robot drifts off the 25 mm tape, while the array
      shape stays fixed so the oval should be unaffected. The off-track limit is 0.06
      m regardless of body width here, since the body only adds width/4 and widening
      it to 0.18 gives max(0.06, 0.0575), so body width is not a lever. I expect the
      oval to stay near 950 and the s-bend and slalom progress to rise above 0.17
      and 0.12. A completed s-bend would be the main sign that lead, not spread or
      drivetrain, is the limit. If progress does not move, the next lever is the sensor
      footprint (8 mm for finer edge resolution) or a larger array spread with the
      mass kept at 0.6 kg.


      - [Open this output](iteration-3/entity0/versions/04a6d6391b874df69524d202e42a24d6/payload.json)

      - Based on: [entityR2A](iteration-3/entityR2A/versions/carried-7264ea940fafaa4a/payload.json)'
  - id: entity1
    label: Sensors forward to y=0.07
    notes: 'Baseline drivetrain, controller and array, with only the sensor row moved
      from y=0.05 to y=0.07 m to test look-ahead. Based on iteration 0 bend failures
      at max_error about 0.061 and the wider-array runs in iterations 1 and 2 that
      did not clearly help.


      ### Rationale


      Iteration 0 (baseline: 0.6 kg, 0.12 m track, 0.03 m radius, array at ±0.024
      m, sensors at y=0.05) finished the oval 20/20 at 1.65 s with oscillation 0.15.
      Its s-bend and slalom runs went off track at progress 0.17 and 0.12, with max_error
      about 0.061 m at the 0.06 m limit. Iteration 1 (wider ±0.032 array with 0.10
      m track, 0.5 kg, 0.033 m radius) dropped the oval to 17/20 and raised oscillation
      to 0.26, while the bends gained only partly (0.24, 0.19). Iteration 2 (wide
      array with baseline drivetrain at 0.5 kg) gave oval 15/20 with oscillation 0.21
      and no bend gain beyond iteration 1. The oval losses in iterations 1 and 2 are
      shared by the 0.5 kg mass and the wide array, so the evidence cannot separate
      them. Iteration 2 also showed the wider array does not reliably improve the
      bends. The bend failures persist across all designs, which points toward look-ahead
      as the untested lever. This iteration returns to the proven 0.6 kg, 0.12 m track
      and 0.03 m radius drivetrain, keeps the baseline controller (kp 2.5, ki 0.05,
      kd 0.3, base_speed 1.8, weights [2,1,0,-1,-2], last_direction), and moves only
      the sensor row forward from y=0.05 to y=0.07 m. The ±0.024 m 12 mm-pitch array
      stays fixed so the oval should be unaffected. I expect the oval to stay near
      20/20 and 950, and the s-bend and slalom progress to rise above 0.17 and 0.12.
      This is untested.


      - [Open this output](iteration-3/entity1/versions/abdb4fc5edee4a20b183956d94675ca5/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/04a6d6391b874df69524d202e42a24d6/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-7264ea940fafaa4a/payload.json)'
  - id: entityR1
    label: Lead test and next steps
    notes: 'Feedback states no outcome for this candidate. It sets out what to change
      depending on whether bend progress rises, footprint is the limit, or the oval
      destabilises, each tied to iterations 0 to 2.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Iteration
      0 (baseline) finished the oval 20/20 but went off track on the s-bend (0.17)
      and slalom (0.12) at max_error about 0.061 m. Iteration 1 (wide array, 0.10
      m track, 0.5 kg, 0.033 m radius) dropped the oval to 17/20 and raised oscillation
      to 0.26, while bends gained only to 0.24 and 0.19. Iteration 2 (wide array,
      baseline drivetrain, 0.5 kg) gave oval 15/20 with oscillation 0.21 and bends
      of 0.20 and 0.12, so the wide array alone did not clearly help. I kept the baseline
      controller so that only geometry changes, and I moved the sensors forward to
      test look-ahead. Next race: if the oval finishes near 20/20 and bend progress
      rises above 0.17 and 0.12, keep y=0.07 and then test a modest spread increase.
      If progress is unchanged with max_error still near 0.06, change the footprint
      rather than the lead. If the oval loses finishes, the lead is adding lag, so
      return y toward 0.06.


      ### Requested changes


      - If the s-bend or slalom still end off track with line_loss_events of 1 or
      more and max_error near 0.06 m, change sensor_size from 0.012 to 0.016 with
      the y=0.07 row unchanged. Iterations 0 and 2 both show bend failure at the limit,
      so footprint coverage is the next untested lever.

      - If bend progress rises clearly above 0.17 and 0.12 while the oval stays at
      20/20, change x to plus or minus 0.032 m at 16 mm pitch and keep mass at 0.6
      kg. Iteration 1 gave a partial bend gain from the wider array, and the mass
      was never isolated from the 0.5 kg drivetrain.

      - If the oval stops finishing (below 18/20) with oscillation above 0.2, move
      the sensor row back to y=0.06 to cut lag. Iteration 2 showed the wide array
      with lighter drivetrain hurt oval stability, so lead may add the same kind of
      lag.


      - [Open this output](iteration-3/entityR1/versions/abdb4fc5edee4a20b183956d94675ca5/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/04a6d6391b874df69524d202e42a24d6/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-7264ea940fafaa4a/payload.json)'
