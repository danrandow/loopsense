map:
  id: race-192-randow-maps-muted
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Wider array, baseline
    notes: 'Changes only the outer sensors from ±0.024 m to ±0.032 m, keeping the
      0.6 kg, 0.12 m track and 0.03 m radius that gave the only reliable oval finish.
      Iteration 1 and 2 showed a bend gain from the wider array, but iteration 2 confounded
      it with a 0.5 kg mass change, so this run tests spread alone.


      ### Rationale


      Race evidence: the iteration-0 baseline (0.6 kg, 0.12 m track, 0.03 m radius,
      five sensors at x = ±0.024 m on a 12 mm pitch, y = 0.05 m, 12 mm footprint)
      is still the best design at 356.6. It finishes the oval 20/20 in about 1.65
      s but leaves the track on the s-bend (progress 0.17) and slalom (progress 0.12).
      Every single deviation since then has hurt the oval. Iteration 1 changed four
      things at once (wider array, 0.10 m track, 0.5 kg, 0.033 m radius) and fell
      to 17/20. Iteration 2 kept the baseline drivetrain but kept 0.5 kg and the wider
      array, and fell to 15/20. Lead at y = 0.03 m and y = 0.07 m each collapsed the
      oval to 0/20, and footprint 8 mm did the same. Footprint 16 mm (iteration 6)
      was also off the oval. Only the 16 mm footprint result is not yet in the scoreboard
      as an improvement, and it scored 78.8.


      The one clear positive signal on the bends is iteration 1 and 2: the wider ±0.032
      m array raised s-bend progress from 0.17 to 0.20 to 0.24 and slalom from 0.12
      to 0.19. That suggests line visibility at larger offsets helps the bends. But
      iteration 2 confounded spread with a 0.5 kg mass change, and mass is the most
      likely cause of the oval regression (lighter robot, more oscillation: 0.15 to
      0.21 to 0.26). So the wider array has never been tested with the proven 0.6
      kg drivetrain.


      Decision: isolate spread. Return to the baseline exactly on mass (0.6 kg), track
      (0.12 m), radius (0.03 m), footprint (12 mm) and lead (y = 0.05 m), and change
      only the outer sensors from ±0.024 m to ±0.032 m, keeping 16 mm pitch as in
      iteration 1. This is the single untested combination that might improve the
      bends without touching the oval-critical settings. Expected result: the oval
      holds at or near 20/20 near 1.65 s, and s-bend and slalom progress rises modestly
      above 0.17 and 0.12, perhaps to around 0.2 to 0.25. I do not expect a bend completion
      from geometry alone. If the oval drops, mass or drivetrain is confirmed as the
      oval''s sensitive axis and the baseline stays the reference.


      - [Open this output](iteration-7/entity0/versions/bad246623d71492f85e5722f02c445c8/payload.json)

      - Based on: [entityR2A](iteration-7/entityR2A/versions/carried-39398bd68f32403f/payload.json)'
  - id: entity1
    label: Wider spread ±0.032 m
    notes: 'Baseline 0.6 kg drivetrain, lead and footprint held, with only the outer
      sensors moved to ±0.032 m at 16 mm pitch. The controller is unchanged so that
      spread is the only variable, based on the partial bend gain in iterations 1
      and 2.


      ### Rationale


      The geometry follows the Builder''s intent: the baseline 0.6 kg, 0.12 m track,
      0.03 m radius and 12 mm footprint, with only the outer sensors moved from x=±0.024
      m to ±0.032 m (16 mm pitch). Iteration 0 is the only design that finishes the
      oval (20/20 at 1.65 s, oscillation 0.15). Iterations 1 and 2 showed that the
      wide array gave a partial bend gain (s-bend progress 0.17 to 0.24 and 0.20,
      slalom 0.12 to 0.19 and 0.12). Their oval losses are confounded with the 0.5
      kg mass and the narrower track, so this test keeps the drivetrain fixed. Lead
      (y=0.05) and footprint (12 mm) are also held at the values that worked, since
      iterations 3 to 5 showed both are sharp optima. The controller is the iteration-0
      baseline unchanged: kp 2.5, ki 0.05, kd 0.3, base_speed 1.8, weights [2,1,0,-1,-2]
      and last_direction. The signal scale depends only on the weights, so the wider
      spacing needs no new weights, and any change to the controller would confound
      the spread test. Expected result: the oval stays near 20/20 at about 1.65 s,
      and bend progress rises modestly above 0.17 and 0.12. This is untested.


      - [Open this output](iteration-7/entity1/versions/5d239204ba1047b09630d04338e1555b/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/bad246623d71492f85e5722f02c445c8/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-39398bd68f32403f/payload.json)'
  - id: entityR1
    label: Spread test, then track
    notes: 'Tells the Builder to keep the spread if the oval holds and bends improve,
      and to isolate track width if the oval fails. Evidence comes from iterations
      0 to 5, with lead and footprint kept fixed.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Evidence:
      iteration 0 (baseline, ±0.024 m, 0.6 kg, 0.12 m track, 0.03 m radius) is the
      best design at 356.6. It finishes the oval 20/20 at 1.65 s with oscillation
      0.15, but its s-bend (0.17) and slalom (0.12) fail at max_error about 0.061
      m. Iterations 1 and 2 show that the wider array gives a partial bend gain (s-bend
      0.17 to 0.24 and 0.20; slalom 0.12 to 0.19 and 0.12). However, both lost oval
      finishes (17/20 and 15/20), and the 0.5 kg mass and narrower track were confounded
      with the spread. Iterations 3 to 5 show that lead and footprint are sharp optima:
      y=0.07, y=0.03 and an 8 mm footprint each collapsed the oval to 0/20. I kept
      the iteration-0 controller so that only the spread changes. Interpret the next
      race as follows. If the oval finishes at 20/20 near 1.65 s and bend progress
      rises above 0.17 and 0.12, keep ±0.032 m and consider a modest further widening.
      If the oval drops below 20/20 or oscillation rises above about 0.2, the wide
      array is not the cure. Then return to ±0.024 m and test the drivetrain alone.


      ### Requested changes


      - If the oval holds at 20/20 and s-bend or slalom progress rises above 0.17
      or 0.12, keep x at ±0.032 m and test x at ±0.040 m at 20 mm pitch, with mass
      0.6 kg, since iterations 1 and 2 showed a partial bend gain from spread.

      - If the oval falls below 20/20 or steering_oscillation rises above about 0.2
      (baseline 0.15), return x to ±0.024 m and test wheel_track 0.11 m alone at 0.6
      kg, because the track effect was never isolated from the 0.5 kg mass in iteration
      1.

      - Keep sensor y at 0.05 m, sensor_size at 0.012 m and mass at 0.6 kg for the
      next test, since iterations 3 to 5 showed the oval collapses when any of these
      moves alone.


      - [Open this output](iteration-7/entityR1/versions/5d239204ba1047b09630d04338e1555b/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/bad246623d71492f85e5722f02c445c8/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-39398bd68f32403f/payload.json)'
