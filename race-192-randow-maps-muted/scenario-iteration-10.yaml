overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Race evidence across nine iterations points to a sharp local optimum at the
      iteration-0 baseline (0.6 kg, 0.12 m track, 0.03 m radius, five sensors at x
      = 0, +/-0.012, +/-0.024 m, y = 0.05 m, 12 mm footprint). Iteration 9 reproduced
      it exactly (score 356.57), so the platform is repeatable. It is the only design
      that finishes any track: 20/20 on the oval at about 1.65 s. Every change since
      has either collapsed the oval or cut its finish rate. That covers lead at y
      = 0.03 and 0.07 m, footprints of 8 and 16 mm, the wider +/-0.032 m array (iteration
      7 showed the earlier bend gain was not real), body length 0.12 m (iteration
      8), and the combined track, radius and mass change (iteration 1). The s-bend
      and slalom have never progressed beyond about 0.28 and 0.12, so no geometry
      tested so far fixes them. Final evaluation runs on an unseen track, so a robust
      platform matters more than a speculative gain. Mass is the one single-variable
      lever not yet tested alone. Iteration 2 showed that 0.5 kg with a wide array
      cut oval finishes to 15/20 and raised steering oscillation from 0.15 to 0.21,
      which suggests the lighter robot is under-damped. My hypothesis is that raising
      mass to 0.7 kg, with all else at baseline, adds inertia and damps the oscillation,
      which may help the bends. The cost is slower acceleration, but the oval has
      a large time margin (1.65 s against the 3 s limit). Expected result: oval finishes
      stay at or near 20/20 with steering oscillation at or below 0.15, and bend progress
      is equal or higher. If the oval falls, mass is confirmed as an oval-sensitive
      axis and the baseline (0.6 kg) becomes the final geometry.


      - [Open this output](iteration-10/entity0/versions/2df89cb1b444482f9910dc2f1d7379d2/payload.json)

      - Based on: [entityR2A](iteration-10/entityR2A/versions/carried-c1a95fb07b581086/payload.json)'
  - id: entity1
    label: Mass 0.7 kg single test
    notes: 'Baseline geometry and controller with mass raised from 0.6 to 0.7 kg,
      the only variable. Mass alone at baseline has never been tested, and the iteration-0
      platform is the only stable design.


      ### Rationale


      The Builder''s proposal is a single-variable test of mass (0.6 to 0.7 kg) against
      the iteration-0 baseline. Iteration 0 is the only stable design: 20/20 oval
      finishes at 1.65 s, oscillation 0.15, score 356.6, and iteration 9 reproduced
      it exactly. Iteration 7 showed the wider +/-0.032 m array collapses the oval
      even at 0.6 kg, so the iteration-2 oval loss cannot be put down to mass alone.
      Mass alone at baseline geometry has never been tested, which makes this the
      one clean test left. The controller stays exactly at the iteration-0 baseline
      (kp 2.5, ki 0.05, kd 0.3, base_speed 1.8, weights [2,1,0,-1,-2], last_direction).
      Changing gains here would confound the mass effect, and iteration 1 showed that
      gain changes tuned to a different geometry do not transfer. Expected: the oval
      holds near 20/20 at about 1.65 to 1.7 s, with oscillation at or below 0.15.
      The extra inertia should slow acceleration slightly, and the oval has time margin
      under the 3 s limit. Bend progress is uncertain and is not expected to pass
      the baseline''s 0.17 and 0.12 by much. Measurements cover every signal the Builder
      asked for, plus controller_errors and noise_robustness.


      - [Open this output](iteration-10/entity1/versions/50c6460cce664fb4920fed047a2be5b0/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/2df89cb1b444482f9910dc2f1d7379d2/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-c1a95fb07b581086/payload.json)'
  - id: entityR1
    label: Mass test feedback
    notes: 'Feedback ties the mass test to iteration 0 and the confounded 0.5 kg runs
      (iterations 1 and 2). It gives two decision branches on oval finish and oscillation,
      and states that the baseline controller was kept unchanged.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Evidence:
      iteration 0 (0.6 kg, baseline geometry) is the only stable design, with the
      oval at 20/20 in 1.65 s, oscillation 0.15 and score 356.6, and iteration 9 reproduced
      it. Mass has never been tested alone at baseline geometry. Iteration 1 (0.5
      kg with a 0.10 m track, 0.033 m radius and wide array) and iteration 2 (0.5
      kg with the wide array) both lost oval finishes and raised oscillation to 0.26
      and 0.21, but iteration 7 showed the wide array alone collapses the oval at
      0.6 kg, so the 0.5 kg effect is confounded. For the controller I kept the iteration-0
      baseline exactly, so the mass is the only variable. Interpret the next race
      as follows. If the oval holds at 20/20 near 1.65 s and oscillation falls below
      0.15, mass is damping the controller and a small further increase is worth testing.
      If the oval falls below 20/20 or oscillation rises above about 0.2, mass is
      an oval-sensitive axis and the 0.6 kg baseline should be the final geometry.
      If the bends stay near progress 0.17 (s-bend) and 0.12 (slalom) under any geometry,
      the bend limit is probably controller-side and should not be chased with further
      geometry changes.


      ### Requested changes


      - If the oval holds at 20/20 near 1.65 s and steering_oscillation falls below
      0.15, test mass 0.8 kg alone at baseline geometry and controller, to see whether
      damping keeps improving or starts to cost the oval finish.

      - If the oval falls below 20/20 or steering_oscillation rises above about 0.2,
      return to mass 0.6 kg and treat the iteration-0 platform as the final geometry,
      since mass is the oval-sensitive axis.

      - Keep sensor_positions at x = +/-0.024 m with y = 0.05 m, sensor_size 0.012
      m, wheel_track 0.12 m and wheel_radius 0.03 m for the next test. Iterations
      3 to 8 show each of these collapses the oval when changed alone, so the bends
      should not be pursued through them.


      - [Open this output](iteration-10/entityR1/versions/50c6460cce664fb4920fed047a2be5b0/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/2df89cb1b444482f9910dc2f1d7379d2/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-c1a95fb07b581086/payload.json)'
