  entities:
  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'Baseline candidate with no prior race data: five 12 mm sensors at 8 mm
      spacing, proportional weights, kp 3.0, kd 0.3, base speed 1.3, last-direction
      line recovery. It is meant to establish completion, speed and oscillation before
      tuning.


      ### Rationale


      Iteration 0 has no race telemetry, so this is a conservative baseline meant
      to get a finishing run and measurements. Geometry: five line sensors spaced
      8 mm apart across the body (x = -0.02 to +0.02 m) at y = 0.05 m ahead of the
      axle. A 12 mm footprint is narrower than the 25 mm tape, so the tape always
      covers at least one sensor. Wheel track 0.12 m, wheel radius 0.03 m, body 0.10
      x 0.16 m, mass 0.8 kg are mid-range values that keep yaw inertia moderate. Controller:
      sensor weights are proportional to sensor x (-1, -0.5, 0, 0.5, 1), so a positive
      signal (line to the left) steers left. kp = 3.0 gives roughly 500 PWM of wheel
      differential for a 1 cm offset. ki = 0.1 is small to avoid integral windup on
      curves. kd = 0.3 damps oscillation. base_speed = 1.3 (about 65% of full PWM)
      is a moderate start, since finishing in 3 s needs about 1.5 m/s average and
      the first run will show whether this is enough. line_loss = last_direction,
      so the robot recovers toward the side it was last on. Expected result: completion
      on the oval and s-bend, with some weaving on the slalom. Hypotheses to test:
      (1) the speed is too low to finish in 3 s; (2) kp is too high, causing oscillation
      (steering_oscillation high); (3) kd is too low for the slalom. Next measurements:
      completion_time and progress to judge speed, steering_oscillation and max_error
      to judge gains, line_loss_events to judge sensor coverage.


      - [Open this output](iteration-0/entity0/versions/d3ecc2bbaa6f469a9274b99ca00ec5d9/payload.json)'
  actions:
