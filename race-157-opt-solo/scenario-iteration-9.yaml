  entities:
  - id: entity0
    label: kd 1.8, speed 0.95
    notes: 'Raises derivative damping from kd 1.5 to 1.8 and trims base speed to 0.95
      to target slalom line loss, keeping geometry fixed. Based on the kd sweep (slalom
      progress 0.23, 0.42, 0.47), which shows diminishing but still positive returns
      from kd.


      ### Rationale


      Evidence from iteration 8 (score 701.3, best so far): the oval (20/20, 1.82
      s, max_error 0.012 m) and s-bend (20/20, steering_oscillation 0.29) now finish
      reliably. The slalom still fails 20/20 with progress 0.47 and about 1.05 line-loss
      events per run. The kd sweep on the slalom gave 0.23 (kd 0.8), 0.42 (kd 1.1),
      0.47 (kd 1.5), so the gains are diminishing. Earlier geometry changes (wider
      array, forward sensors, higher kp) all hurt, so geometry stays fixed. Changes:
      kd 1.5 to 1.8 to add damping at sharp left-right alternations, and base_speed
      1.0 to 0.95 to give the loop more time to correct on the slalom. The s-bend
      has margin (20/20, progress 0.997), so a small speed cut should cost little
      there and only a few tenths of a second on the oval. Hypotheses: H1, the slalom
      is still limited by lag at alternations, so kd 1.8 pushes progress toward 0.55
      or more. H2, the speed cut lowers the lateral excursions that cause line loss,
      so line_loss_events fall below about 0.8. H3 (risk), kd 1.8 amplifies sensor
      noise, so steering_oscillation on the s-bend rises above about 0.4 and noise_robustness
      drops. If that happens, kd should return to about 1.4 and the next test is sensor_size
      0.012. Expected result: slalom progress 0.55 or more, s-bend still 18/20 or
      better, oval completion_time about 1.85 s. Next measurements: slalom progress
      and line_loss_events, s-bend completion and off-track count, steering_oscillation
      and max_error on all tracks, and noise_robustness to check whether noise is
      becoming the limit.


