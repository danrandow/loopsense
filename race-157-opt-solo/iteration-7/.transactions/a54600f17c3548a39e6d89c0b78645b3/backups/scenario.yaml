  entities:
  - id: entity0
    label: Wider array, speed 1.0
    notes: 'Widens the seven-sensor array to ±0.04 m at the same y=0.05 m and restores
      base_speed 1.0, testing whether lateral reach limits the slalom (progress stuck
      near 0.25). Iteration 3 is the baseline; iteration 4''s collapse came from several
      changes at once, so only the span changes here.


      ### Rationale


      Evidence. Iteration 3 (score 600.4, best) used seven 16 mm sensors spanning
      ±0.03 m at y=0.05 m, kp 2.2, ki 0.15, kd 0.8, base_speed 1.0. It finished the
      oval 20/20 and the s-bend 14/20. The slalom failed 20/20 at progress 0.23 with
      about 1.8 line-loss events per run. Iteration 5 (base_speed 0.9) gave a similar
      score (590). Its slalom progress was 0.25 and the s-bend fell to 12/20, so lowering
      speed alone does not fix the slalom. Iteration 4 changed three things at once
      (wider span to ±0.04 m, sensors moved to y=0.07 m, kp 2.6). Its score fell to
      412 and the s-bend dropped to 0/20, so that combination is harmful, though it
      is unclear which change caused the drop.


      Diagnosis. The slalom fails at a consistent progress of about 0.25 with repeated
      line loss, which points to lateral reach: during sharp left-right alternations
      the robot drifts beyond ±0.03 m, all sensors go blank, and the line is lost.
      This is the H2 case set out in iteration 5.


      Change. Widen the array to ±0.04 m (seven sensors at x = -0.04, -0.0267, -0.0133,
      0, 0.0133, 0.0267, 0.04) and keep y=0.05 m, so only lateral reach changes. Keep
      the weights proportional to x and scaled to ±1 (-1, -0.67, -0.33, 0, 0.33, 0.67,
      1). Restore base_speed to 1.0, the best-scoring speed on the s-bend. Keep kp
      2.2, ki 0.15, kd 0.8, and last_direction line-loss handling, so the widening
      is the only variable against iteration 3.


      Expected result. Slalom line-loss events fall from about 1.8 to 1.0 or below
      and slalom progress rises above 0.35. The s-bend should hold at 14/20 or better.
      Oval time should stay near 1.7 s.


      Hypotheses for next race. H1: lateral reach limits the slalom, so the wider
      unshifted array raises slalom progress. H2: if slalom progress stays near 0.25
      with the wider array, the limit is steering lag or gain, not reach, and kd or
      kp needs changing next. H3: the iteration 4 collapse came mainly from the y=0.07
      shift or the kp rise, not from the wider span.


      Measurements wanted: slalom progress and line_loss_events, s-bend completion
      and off-track count, oval completion_time, and steering_oscillation and max_error
      on all tracks.


