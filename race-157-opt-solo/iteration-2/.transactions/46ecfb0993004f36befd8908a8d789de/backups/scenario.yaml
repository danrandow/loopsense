  entities:
  - id: entity0
    label: Lower kp, higher kd
    notes: 'Cuts proportional gain from 3.0 to 2.2 and raises kd to 0.8 to reduce
      the overshoot and jitter (steering_oscillation 0.21 to 0.27) that push max_error
      past the 0.06 m limit. Geometry and base speed are unchanged so the controller
      effect is isolated; the iteration 1 race data supports this.


      ### Rationale


      Evidence from iteration 1 (score 118.5, 0 of 60 trials finished): every run
      ended off track at progress 0.16 to 0.49. rms_error stayed low (0.026 to 0.031
      m), but max_error reached about 0.063 m, just past the 0.06 m off-track limit,
      and each run logged about 2 line-loss events. The robot tracks the line well
      on average and then makes a short transient excursion. Steering_oscillation
      is high (0.21 to 0.27), which points to over-reaction: kp = 3.0 gives up to
      about 1050 PWM of wheel differential at full signal, so the loop likely overshoots
      and rings after each bend. Iteration 1 also raised kd (0.3 to 0.5) and lowered
      mass, but the oscillation did not fall much.


      Changes (geometry kept fixed so the effect is isolated to the controller): kp
      3.0 to 2.2 to reduce overshoot and oscillation; kd 0.5 to 0.8 to damp the faster
      signal changes; ki 0.1 to 0.15 to help cancel the fixed left/right motor mismatch,
      which should reduce a steady drift offset. base_speed stays at 1.2 so that speed
      is not a confound. Expected result: steering_oscillation down by roughly 20
      to 30 percent, max_error below 0.055 m on the s-bend and oval, and progress
      above 0.5 on the s-bend. Finishing in 3 s still needs about 1.5 m/s, so speed
      comes after stability is fixed.


      Hypotheses for the next race: H1, kp is too high and drives the oscillation
      and off-track excursions; H2, kd 0.8 reduces the overshoot without slowing the
      response; H3, line-loss events come from sharp curves and will fall once max_error
      drops. Next measurements: max_error, steering_oscillation, line_loss_events
      and progress, to see whether the gain reduction helped, plus completion_time
      to gauge how much speed is left to add.


