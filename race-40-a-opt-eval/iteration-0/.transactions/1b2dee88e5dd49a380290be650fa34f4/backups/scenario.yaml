  entities:
  - id: entity0
    label: Initial balanced robot
    notes: 'Created a stable, responsive robot with 5 sensors and moderate PID gains
      to maximize track completion and minimize line loss, providing a solid baseline
      for future tuning.


      ### Rationale


      Starting from scratch, I designed a balanced robot geometry with 5 sensors spread
      evenly across the front to detect the tape line effectively. I chose a medium
      sensor size (0.012 m) to balance resolution and coverage. The wheel track and
      body width are set to 0.12 m to allow stable turning without excessive width
      that would increase off-track risk. The wheel radius is 0.035 m for a good compromise
      between speed and torque, and the mass is 0.8 kg to keep inertia manageable.
      The controller uses a moderate base speed of 1.2 to encourage fast progress
      without risking instability. PID gains are set to moderate values (kp=8, ki=0.5,
      kd=3) to provide responsive but stable steering. Sensor weights are arranged
      to steer left when the left sensors detect the line and right when the right
      sensors do, with the center sensor weighted highest for strong centering. The
      line loss strategy is ''last_direction'' to continue turning in the last known
      direction to recover the line. I request a broad set of observations including
      completion, progress, errors, line loss events, and control effort to understand
      performance and guide future tuning. This initial design aims for a stable,
      responsive robot that can complete the track with minimal line loss and error,
      providing a solid baseline for iterative improvement.


