  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence. Iteration 4 (sensors at ±0.03 m, y 0.06, kp 3.8, kd 0.8, base_speed
      1.3) is still the best raced design at 653.0. Iteration 6 widened the array
      to ±0.045 m and scored 633.0. Slalom line_loss_events fell from 1.4 to 1.0,
      but slalom progress fell from 0.46 to 0.31 and the s-bend steering_oscillation
      rose from 0.33 to 0.37. So the wider array did not fix the slalom. Iteration
      5 (kp 4.0) confirmed that more kp no longer helps the slalom. Iteration 2 confirmed
      that base_speed 1.2 costs more than it gains. kd is not a slalom lever (iteration
      4 kd 0.8 cut slalom progress from 0.49 to 0.46 while helping the s-bend).


      Decision. Return to the iteration 4 geometry and gains (kp 3.8, kd 0.8, ki 0,
      base_speed 1.3, line_loss last_direction, sensor_size 0.012, lateral spacing
      ±0.03 m). Change one variable: move the sensor row forward from y = 0.06 to
      y = 0.08 m (the contract maximum). Sensing the tape about 20 mm earlier gives
      the controller more lead on the slalom''s sign changes, which should reduce
      the overshoot that pushes max_error to about 0.063. This is a lateral-sensing-unchanged
      test, so it does not repeat the failed widening. The sensor weights are unchanged,
      so the signal scale is unchanged.


      Expected result: slalom progress above 0.49 and max_error at or below 0.06,
      with the oval still 20/20 and s-bend steering_oscillation at or below about
      0.35. Risks: the forward row may reduce the signal''s responsiveness on the
      oval, or change how the controller acts at the tape''s edge. Fallback: if the
      oval drops to 18/20 or below, or slalom progress falls below 0.46, return to
      the iteration 4 design exactly (y 0.06, kp 3.8, kd 0.8, score 653.0).


      Hypotheses: (a) slalom failure comes partly from late sensing (lag), so forward
      placement raises slalom progress; (b) the forward row leaves oval finishes unchanged.
      Measurements requested: all metrics, with per-track progress, max_error, line_loss_events
      and steering_oscillation compared against iteration 4.


      - [Open this output](iteration-7/entity0/versions/062eb2b2b02d401f8c3eb254e24ab701/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-6423b9541747ef54/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-4bfe3426dd94df16/payload.json)'
  - id: entityR1
    label: Approve forward sensor
    notes: 'Approved the iteration 4 design with the sensor row moved forward to y
      0.08 m, a single-variable test. It rests on iteration 4 (653.0) as the baseline,
      the slalom stalling at progress about 0.46 across iterations 3 to 5, and iteration
      6 showing lateral widening trades line loss against progress.


      ### Feedback


      Approved to race. The candidate is valid and changes one variable from the best
      raced design (iteration 4, score 653.0): sensor row y moves from 0.06 to 0.08
      m, the contract maximum. Sensor x positions, sensor_size 0.012, sensor_weights,
      kp 3.8, kd 0.8, ki 0, base_speed 1.3 and line_loss last_direction are all unchanged.
      Iteration 6 showed that widening the array to ±0.045 m cut slalom line_loss_events
      from 1.4 to 1.0 but lowered slalom progress from 0.46 to 0.31, so lateral sensing
      is not the lever to pull again. Iteration 5 showed that raising kp to 4.0 no
      longer helps the slalom (progress 0.46 to 0.44), so gain alone is exhausted.
      Iteration 2 showed that base_speed 1.2 costs more than it gains, so speed stays
      at 1.3. Forward placement is the one untested sensing change that leaves lateral
      coverage alone, and the slalom has stayed stuck near 0.46 for three iterations,
      so this race is worth running. Read the result against iteration 4 per track:
      slalom progress and max_error, the oval finish count, and s-bend steering_oscillation
      (iteration 4: 0.33). The forward row changes the signal''s timing, so watch
      for oval or s-bend oscillation rising.


      ### Requested changes


      - After the race: if the oval stays at 20/20 (or 19/20), slalom progress rises
      above 0.46 and slalom max_error falls to 0.06 or below, keep sensor y at 0.08
      and re-check kp at 3.8 with kd 0.8 before any other change, since the forward
      row is the new baseline.

      - After the race: if the oval drops to 18/20 or below, slalom progress falls
      below 0.46, or s-bend steering_oscillation rises above 0.37, return to the iteration
      4 design exactly (sensor y 0.06, kp 3.8, kd 0.8, score 653.0) rather than adjusting
      gains.

      - After the race: if the result is neutral (within about 5 points of 653.0),
      try sensor_size 0.016 at y 0.08 to widen each footprint''s coverage without
      changing lateral spacing, because iteration 6 showed that lateral coverage changes
      trade slalom line loss against progress. Keep ki at 0 and base_speed at 1.3.


      - [Open this output](iteration-7/entityR1/versions/cbfde47cad424f6eb259b807a102e928/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/062eb2b2b02d401f8c3eb254e24ab701/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-4bfe3426dd94df16/payload.json)'
