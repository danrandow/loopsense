map:
  id: race-138-opt-eval
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Narrower sensor spacing
    notes: 'Reverts the 16 mm footprint to 12 mm and narrows lateral spacing to ±0.02
      m at y 0.08, the reverse of the iteration 6 widening. Iteration 7 (687.1) is
      the base and iteration 8 (685.5, neutral) showed footprint size does not lift
      slalom progress. Falls back to iteration 7 if the oval drops below 19/20 or
      the score falls below 687.


      ### Rationale


      Evidence. Iteration 7 (sensor row at y 0.08 m, x spacing ±0.03 m, 12 mm footprints,
      kp 3.8, kd 0.8, base_speed 1.3, ki 0, last_direction) is the best raced design
      at 687.06. Iteration 8 enlarged the footprints to 16 mm and scored 685.5, which
      is neutral (within 5 points). Its oval stayed 20/20 with max_error 0.0095 and
      s-bend steering_oscillation fell to 0.28. Slalom line_loss_events fell from
      1.4 to 1.25, but slalom progress also fell from 0.449 to 0.430, so the footprint
      change did not help the binding track. The Evaluator''s neutral-branch option
      is therefore spent. The 16 mm footprint is not kept, because 687.1 is the higher
      score.


      What the earlier races rule out. Gain changes no longer move the slalom: kp
      4.0 cut slalom progress (0.46 to 0.44), and kd 0.8 cut it from 0.49 to 0.46
      while helping the s-bend. Base speed 1.2 costs more on the oval and s-bend than
      it gains (iteration 2). Lateral widening to ±0.045 m (iteration 6, at y 0.06)
      cut slalom line-loss events from 1.4 to 1.0 but dropped slalom progress from
      0.46 to 0.31. The score is driven mainly by slalom progress: on that track the
      score is about 250*progress plus a term scaled by progress, so a progress gain
      outweighs a small line-loss change.


      Decision. Revert the footprint to 12 mm and keep the iteration 7 controller
      and forward row (y 0.08). Test the opposite direction to iteration 6: narrow
      the lateral spacing from ±0.03 m to ±0.02 m (x = -0.02, -0.01, 0, 0.01, 0.02).
      Iteration 6 suggests that a wider array trades line loss for progress, so a
      narrower array should raise progress at the cost of more line loss. The 12 mm
      footprints at 10 mm spacing touch with no gaps. Sensor weights, kp, kd, ki,
      base_speed and line_loss are unchanged.


      Expected result: slalom progress above 0.45 (ideally 0.5 or more) with slalom
      line_loss_events possibly rising toward 1.5. The oval should stay 19/20 or better,
      and s-bend steering_oscillation should stay at or below about 0.33.


      Fallback: if the oval drops to 18/20 or below, or the score falls below 687,
      revert to the iteration 7 design exactly (x ±0.03, y 0.08, 12 mm, kp 3.8, kd
      0.8). Do not adjust gains to rescue it.


      Hypotheses: (a) slalom progress is limited by how far the array reaches laterally,
      so a narrower array raises progress; (b) the narrower array keeps oval finishes
      unchanged, because the oval''s line loss is already low.


      Measurements requested: all metrics, with per-track slalom progress, line_loss_events
      and max_error, and oval finish count and s-bend steering_oscillation, compared
      against iteration 7.


      - [Open this output](iteration-9/entity0/versions/35912c021c694bddaa500fcff14ec6f5/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-3367d9915bd18fd8/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-3efcf285f2351a11/payload.json)'
  - id: entityR1
    label: 'Approve: narrower sensor'
    notes: 'Approved a single-variable test that narrows the lateral sensor spacing
      from ±0.03 m to ±0.02 m, keeping iteration 7 otherwise. Iteration 6 showed that
      widening cut slalom progress, so narrowing is the opposite test, and iteration
      7 (687.1) remains the fallback.


      ### Feedback


      Approved to race. This candidate changes one geometry variable from the best
      raced design (iteration 7, score 687.1): the lateral spacing of the sensor row
      narrows from x = ±0.03 m to ±0.02 m. Sensor y (0.08), sensor_size (0.012), sensor_weights,
      kp 3.8, kd 0.8, ki 0, base_speed 1.3 and line_loss ''last_direction'' are unchanged,
      so the result isolates lateral spacing. The design is valid: all x and y values
      are inside the contract limits, and 12 mm footprints at 10 mm spacing overlap
      with no gaps.


      The evidence supporting the test is iteration 6, where widening the array to
      ±0.045 m cut slalom line_loss_events from 1.4 to 1.0 but dropped slalom progress
      from 0.46 to 0.31, and raised s-bend steering_oscillation. That pattern suggests
      the slalom progress limit moves in the opposite direction when the array narrows.
      The cost is the other side of that trade: a narrower array should lose the tape
      at a smaller lateral offset, so slalom line_loss_events may rise. Because the
      score averages the three development tracks, a slalom progress gain is worth
      about a third of its size, while an oval or s-bend loss is worth about 600 points
      on that track. So the oval and s-bend finishes matter more than the slalom gain.


      Gain and speed are not the levers to pull now: kp 4.0 cut slalom progress (iteration
      5), kd 0.8 cut it while helping the s-bend (iteration 4), and base_speed 1.2
      cost more than it gained (iteration 2).


      After the race, compare per track against iteration 7: oval finish count and
      max_error, s-bend finish count and steering_oscillation, and slalom progress,
      max_error and line_loss_events. Decide the next step from those numbers. Iteration
      7 remains the fallback if this design loses ground.


      ### Requested changes


      - After the race: if the oval stays at 20/20 or 19/20, the s-bend stays at 19/20
      or better with steering_oscillation at or below about 0.33, and slalom progress
      rises above 0.46, keep lateral spacing at ±0.02 m and test ±0.015 m only if
      the score is still above 687.

      - After the race: if the oval drops to 18/20 or below, the s-bend drops below
      19/20, or the score falls below 687, revert to the iteration 7 design exactly
      (x ±0.03 m, y 0.08, 12 mm, kp 3.8, kd 0.8). Do not adjust gains to rescue it,
      because gain changes have not moved the slalom since iteration 4.

      - After the race: if slalom progress rises but slalom line_loss_events climb
      well above 1.5 with the oval intact, keep the narrow array and test sensor_size
      0.016 at ±0.02 m to widen each footprint''s coverage without changing spacing.
      Keep ki at 0 and base_speed at 1.3.


      - [Open this output](iteration-9/entityR1/versions/42af7f5c449b49788c717be4fed191b5/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/35912c021c694bddaa500fcff14ec6f5/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-3efcf285f2351a11/payload.json)'
