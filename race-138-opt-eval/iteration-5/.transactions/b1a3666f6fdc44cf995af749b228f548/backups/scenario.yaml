map:
  id: race-138-opt-eval
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: kp 4.0 on best kd 0.8
    notes: 'Raises kp from 3.8 to 4.0 while holding kd 0.8 and the other settings
      of the best raced design (652.99). Slalom progress is the binding limit, and
      kp was the lever that previously raised it (0.30 to 0.49), while the oval has
      margin.


      ### Rationale


      Evidence. Iteration 4 (kp 3.8, kd 0.8) is the best raced design at 652.99. The
      oval finished 20/20 with max_error 0.011, and the s-bend improved to 16/20 with
      steering_oscillation down to 0.33. The slalom did not improve: progress fell
      from 0.49 to 0.46 and it still ended off track in 20/20 runs. Iteration 3 showed
      that raising kp (3.5 to 3.8, with kd 0.6 to 0.7) lifted slalom progress from
      0.30 to 0.49, and the oval shows clear margin (max_error 0.011, 20/20 finishes).
      Iteration 2 showed that lowering speed hurts more than it helps, so base_speed
      stays at 1.3. Per the Evaluator''s plan, I am not returning kd to 0.7, which
      scored lower (634.7) and gave no slalom gain. I am also not switching line_loss
      to a search mode, because no per-step telemetry shows a consistent one-sided
      exit to justify it.


      Change: kp 3.8 to 4.0, with kd 0.8, base_speed 1.3, ki 0, line_loss ''last_direction''
      and geometry unchanged. The stronger proportional correction is the lever that
      has moved slalom progress most. kd 0.8 is kept because it gave the best s-bend
      result.


      Expected result: slalom progress above 0.49, oval still 19 or 20 of 20, and
      s-bend steering_oscillation at or below about 0.35. Risk: kp 4.0 may push s-bend
      oscillation back above 0.37, or the oval may start to exit. If the oval drops
      to 18/20 or below, or steering_oscillation rises above 0.37, return to kp 3.8
      with kd 0.8 (the best raced design).


      Hypotheses: (a) slalom progress is still limited by steering authority, so progress
      rises with kp; (b) kd 0.8 keeps s-bend oscillation under control at the higher
      kp. Measurements requested: all metrics, with per-track max_error, line_loss_events
      and steering_oscillation compared against iteration 4.


      - [Open this output](iteration-5/entity0/versions/f047ad7fc979409d85da6982e294ff6b/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-003ec1c932d09b1a/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-f75b67d0c53b4c52/payload.json)'
  - id: entityR1
    label: Approve kd 0.8 test
    notes: 'Approved a small damping step (kd 0.7 to 0.8, kp 3.8, base_speed 1.3)
      that stays one change from the best raced design (634.7, iteration 3). The feedback
      names what to do next depending on how the s-bend oscillation and slalom progress
      move in the race.


      ### Feedback


      I reviewed the candidate against the race history. It has not raced, so I state
      no outcome for it. The candidate is valid: all values are inside the contract
      ranges, and the sensor layout, base_speed 1.3, ki 0 and line_loss ''last_direction''
      match iteration 3, the best raced design (score 634.7). The only change is kd
      0.7 to 0.8 with kp 3.8 held. Iteration 3 showed that raising kp from 3.5 to
      3.8 (with kd 0.6 to 0.7) lifted the score from 556.7 to 634.7. The oval finished
      19/20 (max_error 0.018) and the s-bend finished 15/20 (up from 9/20, oscillation
      0.37). The slalom still ended off track in 20/20 runs, at progress 0.49, with
      max_error 0.063 and 1.05 line-loss events. Iteration 2 showed that cutting base_speed
      to 1.2 lost 113 points, so speed stays at 1.3. A small kd step is a low-risk
      test of damping, and the race will show whether it helps. Approve it now: the
      candidate is a close, well-isolated step from the best design, and the telemetry
      will sharpen the next critique. After the race, read per-track finish rates,
      steering_oscillation and the slalom max_error and line_loss_events together.
      If the s-bend oscillation falls and the slalom progress rises, the next step
      is a further small change in the same direction. If the oval starts to exit
      or the slalom max_error stays above 0.06, the next test is line_loss ''search_left''
      or ''search_right'', but only if the last valid signal shows a consistent one-sided
      exit. Keep ki at 0.


      ### Requested changes


      - After the race: if the s-bend steering_oscillation falls below 0.37 and the
      slalom progress rises above 0.49, keep kp 3.8 and try kd 0.9 to see whether
      more damping keeps helping, since kd 0.6 to 0.7 gave the best score so far.

      - After the race: if the oval drops to 18/20 or below, or the slalom progress
      does not improve over 0.49, return to kd 0.7 and change line_loss rather than
      gain, testing ''search_left'' or ''search_right'' only if the last valid signal
      shows a consistent one-sided exit on the slalom (iteration 3 showed max_error
      0.063 and 1.05 line-loss events there).

      - Keep base_speed at 1.3 and ki at 0, because iteration 2 showed that base_speed
      1.2 cost more on the s-bend and oval (score 521.7) than it gained on the slalom.


      - [Open this output](iteration-4/entityR1/versions/b8aa3b2608e44c329a1c03678cc101fb/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/30f828ce18b64b00bfe432d442013325/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-94172ade7fb6dbf9/payload.json)'
