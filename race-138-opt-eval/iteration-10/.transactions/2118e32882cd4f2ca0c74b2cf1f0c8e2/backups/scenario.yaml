map:
  id: race-138-opt-eval
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Lighter robot, mass 0.6
    notes: 'Keeps the iteration 7 best design (score 687.1) and changes only mass
      from 0.8 to 0.6 kg to test whether lower yaw inertia helps the slalom. Iteration
      9 narrowed the array and fell to 676.7 on slalom progress, so the fallback is
      iteration 7.


      ### Rationale


      Evidence. Iteration 7 (sensors at x ±0.03 m, y 0.08 m, 12 mm footprints, kp
      3.8, kd 0.8, ki 0, base_speed 1.3, last_direction) is the best raced design
      at 687.06. Iteration 9 narrowed the spacing to ±0.02 m and scored 676.7. The
      oval and s-bend still finished 20/20, but slalom progress fell from 0.449 to
      0.365 and line-loss events rose to 1.4. That falls below the 687 threshold the
      Evaluator set, so the fallback rule applies. Narrow spacing is ruled out. Widening
      (iteration 6) and narrowing (iteration 9) both lowered slalom progress, so ±0.03
      m is the best lateral spacing found so far.


      What is ruled out: kp 4.0 (slalom progress 0.46 to 0.44), kd 0.8 vs 0.7 (kd
      helps the s-bend but cuts slalom progress), base_speed 1.2 (cost more on the
      oval and s-bend than it gained), y 0.06 vs 0.08 (y 0.08 helped overall), a 16
      mm footprint (neutral, 685.5, with slalom progress down). The gain and sensor-geometry
      levers have been tried around this design.


      Change (one variable from iteration 7): mass 0.8 kg to 0.6 kg. The yaw inertia
      is mass*(L^2+W^2)/12, so a lighter robot turns faster for the same steering
      command. The slalom has sign changes that the robot cannot follow in time, and
      the lower inertia may reduce overshoot past the 0.06 m off-track limit. Lower
      mass should also reduce slip and rolling resistance. Everything else is held
      at iteration 7: geometry (x ±0.03, y 0.08, 12 mm, wheel_track 0.12, wheel_radius
      0.03, body 0.12 x 0.18), and the controller (base_speed 1.3, kp 3.8, ki 0, kd
      0.8, weights [-2,-1,0,1,2], last_direction).


      Expected result: slalom progress above 0.45 and max_error at or below 0.06,
      with the oval and s-bend still 19/20 or better. Risk: the lighter robot may
      change the effective gain, so the oval or s-bend oscillation could rise. Fallback:
      if the score falls below 687, or the oval drops to 18/20 or below, or s-bend
      steering_oscillation exceeds about 0.37, iteration 11 reverts to the iteration
      7 design exactly (mass 0.8). Do not adjust gains to rescue it.


      Hypotheses: (a) slalom failure is partly yaw-inertia lag, so lower mass raises
      slalom progress; (b) the oval finish is unaffected because its curvature is
      gentle. Measurements requested: all metrics, with per-track slalom progress,
      max_error and line_loss_events, and s-bend steering_oscillation, compared against
      iteration 7.


      - [Open this output](iteration-10/entity0/versions/cce2c296f2884659bd6cde8870160f4d/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-cc8dbdf939e81546/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-bfaa3734fd1ddacf/payload.json)'
  - id: entityR1
    label: Approve mass 0.6 test
    notes: 'Approved the iteration 7 design with mass reduced from 0.8 to 0.6 kg,
      the one lever never tested before. Earlier races on gains, speed, spacing and
      footprint (iterations 2, 5, 8, 9) had stopped lifting the score, so this is
      the next untested change; the fallback to mass 0.8 is set if the score drops
      below 687.


      ### Feedback


      Approve. The candidate is valid: mass 0.6 is inside the 0.4 to 1.5 contract
      range, and every other field matches the best raced design (iteration 7, score
      687.06). It changes one variable that no earlier iteration has tested, since
      mass has been 0.8 in every raced design. The yaw-inertia reasoning is sound
      (inertia = mass*(L^2+W^2)/12), and the slalom''s sign changes are where lag
      matters most. Gain and geometry levers are already exhausted: kp 4.0 cut slalom
      progress (iteration 5), kd 0.8 cut it while helping the s-bend (iteration 4),
      narrowing spacing to ±0.02 m lost ground (iteration 9, 676.7), and the 16 mm
      footprint was neutral (iteration 8, 685.5). Approving now gives the team a race
      on a new lever, and a result either way sharpens iteration 11. Compare the result
      with iteration 7 per track: slalom progress and max_error first, then oval finish
      count and s-bend steering_oscillation. Next step, depending on the result: if
      the score is at or above 687 with the oval at 19/20 or better, keep mass 0.6
      and test mass 0.5 as the single change, since lower inertia is the direction
      that helped. If the score falls below 687, or the oval drops to 18/20 or below,
      or s-bend steering_oscillation exceeds about 0.37, revert to the iteration 7
      design exactly (mass 0.8) and do not adjust gains to rescue it. Keep ki at 0,
      base_speed at 1.3 and line_loss at last_direction.


      ### Requested changes


      - After the race: if the score is at or above 687 and the oval stays at 19/20
      or better, keep mass 0.6 and try mass 0.5 as the only change, because lower
      yaw inertia is the lever being tested.

      - After the race: if the score falls below 687, the oval drops to 18/20 or below,
      or s-bend steering_oscillation exceeds about 0.37, revert exactly to the iteration
      7 design (mass 0.8, all else unchanged) rather than adjusting gains.

      - Hold kp 3.8, kd 0.8, ki 0, base_speed 1.3, line_loss last_direction and the
      ±0.03 m, y 0.08, 12 mm geometry while testing mass, since iterations 2, 5, 8
      and 9 showed those levers are exhausted.


      - [Open this output](iteration-10/entityR1/versions/7d03e0d6fa744afea0381c083da9f0c4/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/cce2c296f2884659bd6cde8870160f4d/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-bfaa3734fd1ddacf/payload.json)'
