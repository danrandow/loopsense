overrides:
  entities:
  - id: entity0
    label: Stronger steer, kd 0.6
    notes: 'Raised kp 2.5 to 3.5 and kd 0.3 to 0.6, and lowered base_speed 1.4 to
      1.3, to fix the s-bend and slalom off-track exits seen in the development sim
      (max_error about 0.061 vs the 0.06 limit). Geometry is unchanged to isolate
      the controller effect.


      ### Rationale


      Evidence from the development simulator (entityR2A, iteration 0): the oval finished
      in 75% of trials (mean 1.91 s), but the s-bend and slalom ended off track in
      every trial, at progress 0.29 and 0.12. The off-track limit is max(0.06 m, 0.0125
      + body_width/4) = 0.06 m for this body, and max_error on the failing tracks
      was about 0.061 to 0.062 m, so the robot is leaving the tape at the first sharp
      bend. Line-loss events averaged about 1.05 on those tracks, which means the
      line is lost during the bend and last_direction does not bring it back. Steering
      oscillation is low (0.15 to 0.21), so the problem is not jitter. The response
      is too weak and too late for the tighter curves. Changes: (1) raise kp from
      2.5 to 3.5 so the robot corrects harder for a given offset; (2) raise kd from
      0.3 to 0.6 to damp the stronger correction and limit overshoot; (3) lower base_speed
      from 1.4 to 1.3, a smaller cut than the Evaluator''s 1.2 suggestion, because
      1.2 would probably leave the average speed too low to finish the 3.0 s limit
      (about 1.5 m/s is needed). Geometry and sensor weights are unchanged so the
      controller effect can be isolated, and ki stays at 0 because no one-sided offset
      is visible in the data. Expected result: fewer off-track exits on the s-bend
      and slalom, with max_error below 0.06 and at least one completed slalom or s-bend
      run; finish time should stay under 3 s on the oval (about 2.0 s). Risk: kp 3.5
      with kd 0.6 may cause oscillation on straights. Hypotheses to test: (a) the
      slalom fails because of too little steering authority, so higher kp should raise
      progress; (b) base_speed 1.3 still gives finish times under 3 s. Measurements
      requested: all metrics, so I can see the per-track max_error, line_loss_events
      and completion_time trade-off.


      - [Open this output](iteration-1/entity0/versions/2ff5b52ea9614302b75a521a43f817ae/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-d81a3048eec6bd23/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-464302171516e25b/payload.json)'
  - id: entityR1
    label: 'Baseline review: approve'
    notes: 'Approved the iteration 0 baseline because no race data exists yet and
      it passes every public contract range check. Feedback sets conditional tuning
      steps for after the first race, which is the only source of evidence available.


      ### Feedback


      Iteration 0 has no race telemetry yet, so there is no earlier outcome to cite
      for or against this candidate. I checked it against the public contract and
      it is valid: all five sensor positions are inside the allowed x and y ranges,
      sensor_size 0.012 is an allowed option, the five sensor_weights are inside [-2,
      2] and antisymmetric, base_speed 1.4 is inside [0.05, 2], and line_loss ''last_direction''
      is an allowed option. Nothing in the file is obviously broken. This is the first
      race, so its main value is telemetry. Once the race reports back, the Optimizer
      should treat the results as the basis for the next revision. If max_error or
      line_loss_events are high on the slalom, lower base_speed (for example to 1.2)
      before changing the controller. If steering_oscillation is high, raise kd (for
      example to 0.5). If rms_error is high with few line losses, raise kp (for example
      to 3.0). Keep ki at 0 unless the telemetry shows a steady offset on one side
      of the course.


      ### Requested changes


      - After the race: if line_loss_events or max_error are high on the slalom, reduce
      controller.base_speed (e.g. 1.4 to 1.2) and re-check completion_time, since
      the 3.0 s limit needs an average near 1.5 m/s.

      - After the race: if steering_oscillation is high, increase controller.kd (e.g.
      0.3 to 0.5) before changing kp.

      - After the race: if rms_error is high without line losses, increase controller.kp
      (e.g. 2.5 to 3.0) and keep ki at 0 unless a one-sided offset appears.


      - [Open this output](iteration-0/entityR1/versions/12c27bd6859c4724a5f4753329a03189/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/58bf0190b26940128f6167feb0992ecb/payload.json)'
