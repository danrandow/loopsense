map:
  id: race-138-opt-eval
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Wider sensor array
    notes: 'Widens the sensor span from ±0.03 to ±0.045 m with kp 3.8 and kd 0.8 held
      at the best raced design. The slalom loses the line about 1.4 times per run,
      and the current sensors go blind before the 0.06 m off-track limit, which gain
      changes have not fixed. Falls back to the iteration 4 design if the oval or
      s-bend regresses.


      ### Rationale


      Evidence. Iteration 4 (kp 3.8, kd 0.8, score 653.0) is the best raced design.
      Iteration 5 (kp 4.0, same kd) scored 650.6. Its oval still finished 20/20, and
      s-bend steering_oscillation improved to 0.317. But slalom progress fell (0.46
      to 0.44), slalom line_loss_events rose (1.4 to 1.5), and the slalom still ends
      off track in 20/20 runs. Raising kp has stopped paying off, so I am not raising
      kp again. Iteration 2 showed that lowering base_speed costs more on the oval
      and s-bend than it gains on the slalom, so speed stays at 1.3. kd 0.8 stays
      because it gave the best s-bend result.


      What the telemetry points to. Slalom max_error is about 0.063, just over the
      0.06 m off-track limit, and the robot loses the line about 1.4 times per run.
      My geometry reading: the outer sensors sit at x = ±0.03 with 12 mm footprints.
      With a 25 mm tape (half-width 12.5 mm), all sensors read background once the
      line centre is roughly 48 mm off the robot centre line. The robot can therefore
      drift to the edge of its safe zone (60 mm) without any sensor seeing tape, and
      that is when line_loss fires and steering stops being informative. Gain changes
      cannot fix this because the sensors are blind in the region where the slalom
      fails.


      Change: widen the sensor array from ±0.03 m to ±0.045 m (spacing 22.5 mm, 12
      mm footprint, so there are no gaps wider than the tape). Sensor weights, kp
      3.8, kd 0.8, ki 0, base_speed 1.3, line_loss ''last_direction'' and all other
      geometry are unchanged. This is a single geometry variable against the best
      raced design.


      Expected result: slalom line_loss_events fall below 1.0 and slalom max_error
      falls to about 0.055 to 0.06, so more slalom runs survive. Oval should stay
      19 to 20 of 20. Risk: a wider array gives a coarser signal on straights, which
      could raise oval or s-bend steering_oscillation above 0.35, and kp may need
      re-tuning if the signal scale changes. Fallback: if the oval drops to 18/20
      or below, or s-bend steering_oscillation exceeds about 0.37, return to the iteration
      4 design (kp 3.8, kd 0.8, ±0.03 sensors, score 653.0).


      Hypotheses: (a) slalom failure is line loss at the edge of sensor coverage,
      not steering authority, so widening the array reduces line_loss_events and raises
      slalom progress above 0.46; (b) the wider array does not hurt oval finishes.
      Measurements requested: all metrics, with per-track line_loss_events, max_error
      and progress compared against iteration 4.


      - [Open this output](iteration-6/entity0/versions/07e29ff494aa437caa6bd9aa07c0cda2/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-8c86a5a5be02f293/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-14a315a9bdcd673a/payload.json)'
  - id: entityR1
    label: Approve kp 4.0 test
    notes: 'Approved the kp 3.8 to 4.0 step on top of the best raced design (kp 3.8,
      kd 0.8, score 653.0), since iterations 1 to 4 showed that higher kp lifted slalom
      progress and the oval stayed 20/20. The feedback sets revert and continue rules
      tied to oval finishes, s-bend oscillation and slalom progress.


      ### Feedback


      Approved for the race. This candidate changes one variable from the best raced
      design: kp 3.8 to 4.0, with kd 0.8, base_speed 1.3, ki 0, line_loss ''last_direction''
      and geometry unchanged. Iteration 3 showed that raising kp from 3.5 to 3.8 (with
      kd 0.6 to 0.7) lifted the score from 556.7 to 634.7 and slalom progress from
      0.30 to 0.49. Iteration 4 (kp 3.8, kd 0.8, score 653.0, the best so far) kept
      the oval at 20/20 with max_error 0.011 and reduced s-bend steering_oscillation
      to 0.33. Iteration 2 showed that base_speed 1.2 cost more on the oval and s-bend
      (score 521.7) than it gained on the slalom, so speed stays at 1.3. The step
      is small and well isolated, so it is a cheap test of whether steering authority
      still limits the slalom. Its main risk is that kp 4.0 pushes s-bend steering_oscillation
      back above the 0.33 to 0.37 range, or starts oval exits. The slalom still ends
      off track in every run, so the telemetry is needed before further change. Read
      per-track finish counts, max_error, steering_oscillation and slalom progress
      against iteration 4. Note that kd 0.7 to 0.8 lowered slalom progress (0.49 to
      0.46) while it helped the s-bend, so do not treat kd as a slalom lever.


      ### Requested changes


      - After the race: if the oval holds at 19/20 or better, s-bend steering_oscillation
      stays at or below about 0.35, and slalom progress rises above 0.49, keep kp
      4.0 with kd 0.8 and try kp 4.2 to see whether steering authority is still the
      limit.

      - After the race: if the oval drops to 18/20 or below, or s-bend steering_oscillation
      rises above about 0.37, return to the best raced design (kp 3.8, kd 0.8, score
      653.0) rather than adjusting kd, since kd 0.8 gave the best s-bend result so
      far.

      - After the race: if slalom max_error stays above 0.06 with line_loss_events
      near 1.0 while the oval still finishes, test line_loss ''search_left'' or ''search_right''
      only if the last valid signal shows a consistent one-sided exit; keep ki at
      0 and base_speed at 1.3.


      - [Open this output](iteration-5/entityR1/versions/b1a3666f6fdc44cf995af749b228f548/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/f047ad7fc979409d85da6982e294ff6b/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-f75b67d0c53b4c52/payload.json)'
