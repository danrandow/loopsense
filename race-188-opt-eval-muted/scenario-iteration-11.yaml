overrides:
  entities:
  - id: entity0
    label: 'Final: iteration-10'
    notes: 'Keeps the best validated design (score 700.19) unchanged, because this
      is the last iteration and an untested change could lose the 20/20 oval and s-bend
      completions. Oval and s-bend both finished 20/20 at iteration 10; slalom still
      never completes, as the rationale explains.


      ### Rationale


      Final iteration, so this candidate is both the last development race and the
      design that will face the unseen final track. I am keeping the iteration-10
      design unchanged because it is the best evidence available (score 700.19, the
      best so far). It finishes 20/20 on oval (1.97 s) and 20/20 on s-bend (2.32 s),
      with max_error 0.0096 and 0.0205. Slalom still never finishes (0/20, progress
      0.53, 1.35 line-loss events per run, off track in every run).


      Why no change: the last several single-variable steps moved the score by only
      about 3 points (iteration 9 to 10: +3.0), and each gain was paid for by a small
      rise in line losses on slalom. Iteration 7 (kp 5.0) and iteration 8 (16 mm sensors,
      +/-4 cm) both lost s-bend finishes and scored lower. Any untested change now
      carries real risk of losing the 20/20 completions on oval and s-bend, which
      are worth far more than the slalom progress gained. Because no iteration follows
      this one, a regression could not be corrected, so the safe choice is the validated
      design.


      Expected result: about the same as iteration 10 on the development tracks (about
      700), with oval and s-bend completing. Slalom probably stays at 0 completions.
      Hypotheses: (a) the final unseen track will behave like oval and s-bend more
      than slalom, so completion there is likely; (b) the slalom loss is driven by
      line loss at the sharp alternations, and it would need a sensing or gain change
      that I cannot validate in this iteration. Measurements wanted from the race:
      completion and completion_time for each track, progress, max_error and line_loss_events
      on slalom (location of the loss), and steering_oscillation on s-bend.


      - [Open this output](iteration-11/entity0/versions/0a72e5630c42452394365f40aebbdd74/payload.json)

      - Based on: [entityR2A](iteration-11/entityR2A/versions/carried-0412451d0224c181/payload.json)'
  - id: entityR1
    label: Approve final design
    notes: 'Approved the iteration-10 design unchanged for the final race, since it
      is the best raced design (score 700.19, 20/20 on oval and s-bend). Any untested
      change risked losing those completions, and no later iteration could correct
      a regression.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      candidate is the iteration-10 design (score 700.19, best raced so far), unchanged
      in every field. Its evidence is from iteration 10: oval 20/20 (mean 1.97 s,
      max_error 0.0096), s-bend 20/20 (mean 2.32 s, max_error 0.0205), and slalom
      0/20 (progress 0.53, 1.35 line-loss events per run, off track in every run).
      Iterations 7 (kp 5.0, kd 1.0) and 8 (16 mm sensors at +/-4 cm) each lost s-bend
      finishes and scored lower, so both are past their useful range. Iterations 9
      and 10 showed that moving the sensors forward (y 0.06 to 0.07 to 0.075) gave
      small gains with no completion loss. Because no iteration follows this one,
      a regression could not be corrected, and the candidate is the only validated
      design that keeps 20/20 completions on both development tracks. The slalom gap
      is the main lost score, but it cannot be closed with an untested change at this
      point. Decision: approve, so the race runs the validated design. If the race
      shows the expected 20/20 on oval and s-bend, no further change is needed. Measurements
      to read from the race are the slalom loss location (max_error and line_loss_events)
      and steering_oscillation on s-bend, which together would have guided the next
      iteration had one existed.


      ### Requested changes


      - No change requested. Race the iteration-10 design unchanged, since it is the
      best validated design (score 700.19) and no later iteration exists to correct
      a regression.

      - Contingency for the record only: if s-bend completions were to fall below
      20/20 in the race, the iteration-9 sensor position (y 0.07) with the same controller
      is the next-best validated fallback, since iteration 10 differs only by the
      y step.


      - [Open this output](iteration-11/entityR1/versions/5ec0e9b56cd84cd684ae180522c91dc7/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/0a72e5630c42452394365f40aebbdd74/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-0412451d0224c181/payload.json)'
