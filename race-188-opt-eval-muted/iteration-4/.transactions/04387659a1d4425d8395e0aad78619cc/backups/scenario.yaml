  id: race-188-opt-eval-muted
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Integral + damping retune
    notes: 'Lowers kp from 5 to 4, raises kd to 0.5 and ki to 0.3, and moves sensors
      to y=0.06, to cancel the steady motor-mismatch drift and damp the jitter seen
      in iteration 2 (max_error about 0.065 m, off-track on every run). Expected to
      cut max_error below the 0.06 m limit and yield first completions.


      ### Rationale


      Evidence: iteration 2 (kp 5, kd 0.3, ki 0.02, base 1.4, seven 12 mm sensors
      at ±3 cm) ran 60 development trials with no finishes. Every run ended off_track,
      with progress 0.12 to 0.28 (best on oval) and max_error about 0.065 m, just
      past the 0.06 m limit. Steering oscillation rose from 0.08-0.15 to 0.15-0.24
      when kp went to 5, so the extra gain is adding overshoot rather than fixing
      the drift. Line losses were 1.0 to 1.75 per run. Score rose from 50 to 76 mainly
      through oval progress.


      Diagnosis: the robot drifts steadily off the line. A fixed left/right motor
      mismatch (the same for every design on a given seed) creates a steady bias.
      With ki at 0.02, the controller cannot cancel that bias, so the offset settles
      at a level that eventually crosses the limit. Higher kp alone causes overshoot
      and jitter. The off-track limit cannot be widened: max(0.06, 0.0125 + body_width/4)
      stays at 0.06 for every allowed body_width (the largest gives 0.0575).


      Changes: (1) kp 5 to 4 to cut overshoot. (2) kd 0.3 to 0.5 to damp the oscillation
      the higher kp was causing. (3) ki 0.02 to 0.3 so the integral cancels the constant
      motor-mismatch bias. The integral is clamped at ±2, which limits windup on bends.
      (4) base_speed 1.4 to 1.3, a small cut to reduce slip while keeping pace for
      the 3 s finish. (5) Sensors moved forward from y 0.05 to 0.06 for more look-ahead,
      so steering responds earlier at speed. Sensor layout, footprint, weights and
      line_loss policy are unchanged to isolate the controller effect.


      Expected result: lower max_error (target below 0.05 m), fewer line-loss events,
      and progress above 0.4 on oval and s-bend, which would bring the first completions.
      Hypotheses: (a) the drift is a bias that ki removes, so rms_error should fall
      and steady offset should vanish on straights; (b) kd 0.5 damps the jitter, so
      steering_oscillation should drop below 0.15. Measurements to check next: completion
      and completion_time (is 1.3 fast enough?), progress and max_error (where the
      robot leaves the line), rms_error and line_loss_events (does the integral help?),
      steering_oscillation (is kd damping or adding lag?), and controller_errors.


      - [Open this output](iteration-3/entity0/versions/a6132915c15a4ba38331049390b27ae3/payload.json)

      - Based on: [entityR2A](iteration-3/entityR2A/versions/carried-4e8e84aa76bd5d25/payload.json)'
  - id: entityR1
    label: 'Approve: integral-bias'
    notes: 'Approved the candidate that adds ki 0.3 to cancel the steady motor-mismatch
      drift, with kp lowered to 4 and kd raised to 0.5, because iteration 2 (score
      75.6) showed a steady off-line bias that higher kp only made oscillate. Feedback
      gives contingent next steps on speed, ki and oscillation depending on the race
      result.


      ### Feedback


      Judged before racing, so I state no outcome for this candidate. The evidence
      is the iteration-2 race (score 75.6, best so far): 60 trials, 0 finishes, every
      run off_track, progress 0.12 to 0.28 (best on oval), max_error about 0.065 m
      just past the 0.06 m limit, steering_oscillation rising to 0.15 to 0.24 when
      kp went to 5, and 1.0 to 1.75 line-loss events per run. That supports the diagnosis
      of a steady drift that kp alone cannot fix. The candidate changes the controller
      in a way that targets this: ki goes from 0.02 to 0.3 so the integral can cancel
      a constant motor-mismatch bias, kp drops from 5 to 4 to reduce overshoot, and
      kd rises to 0.5 to damp the jitter. The integral clamp of plus or minus 2 limits
      windup. All values are inside the contract limits. Sensor weights, footprint
      and line_loss policy are unchanged, so any change in result can be attributed
      to the controller. The main risk is speed. base_speed drops from 1.4 to 1.3,
      and the 3.0 s limit needs about 1.5 m/s average, so a finish may be out of reach
      even if the line is held. Approval is justified because this is early exploration
      with 8 iterations left, the change is a clear, testable response to the bias
      evidence, and a race is the only way to measure the integral effect. Interpreting
      the next race: if max_error falls below about 0.05 m and line_loss_events drops
      with progress near 1 but completion_time above 3.0 s, the line is being held
      and the speed is the limit, so raise base_speed to about 1.5 while keeping ki
      0.3. If max_error still reaches 0.06 m with ki 0.3, the integral is too slow
      or too small, so raise ki to about 0.6 before touching kp. If steering_oscillation
      rises above about 0.25 with ki high, the integral is causing overshoot, so lower
      ki to about 0.15 and keep kd at 0.5.


      ### Requested changes


      - If the next race keeps the robot on the line (max_error below about 0.05 m)
      but completion_time is above 3.0 s or progress stalls short of 1, raise controller.base_speed
      to about 1.5 and keep ki at 0.3, since 1.3 is probably too slow for the 500-point
      completion bonus.

      - If max_error still reaches about 0.06 m with ki at 0.3, raise controller.ki
      to about 0.6 (the only change to the controller gains) before touching kp, since
      the iteration-2 drift was a steady bias that ki is meant to cancel.

      - If steering_oscillation rises above about 0.25 after the ki increase, lower
      controller.ki to about 0.15 and keep kd at 0.5, since the iteration-2 data showed
      that extra steering gain added overshoot.


      - [Open this output](iteration-3/entityR1/versions/e9ad2c6261554da7b5b9c8da0b183514/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/a6132915c15a4ba38331049390b27ae3/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-4e8e84aa76bd5d25/payload.json)'
