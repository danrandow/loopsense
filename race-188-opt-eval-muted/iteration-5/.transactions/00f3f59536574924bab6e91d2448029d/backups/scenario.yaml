map:
  id: race-188-opt-eval-muted
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: kp 4.5, kd 0.8 for slalom
    notes: 'Keeps the iteration-4 geometry and integral gain, raising kp to 4.5 for
      faster response and kd to 0.8 to damp it. Slalom never finished (progress 0.32)
      and s-bend oscillated most (0.41), so the change targets fast alternating bends.
      Oval finished 20 of 20 in iteration 4, so it is the regression check.


      ### Rationale


      Evidence: iteration 4 is the best design so far (score 483.7). Oval finished
      20 of 20 runs (mean 1.99 s, progress 0.997), so the 1.3 base speed and the current
      gains work on gentle bends. S-bend finished 3 of 20 (progress 0.71, steering_oscillation
      0.41, the highest so far), and slalom never finished (progress 0.32, off track
      in all 20 runs). The weak point is fast alternating bends, where the loop is
      still underdamped and responds too slowly to direction changes. Iteration 4
      also showed that ki (0.02 to 0.5) and kd (0.3 to 0.6) together cut max_error
      and line losses, so the integral and derivative terms are doing useful work.


      Changes, all in the controller: (1) kp 4.0 to 4.5 for more steering authority
      on rapid direction changes, since slalom progress is limited by slow response
      rather than by jitter. (2) kd 0.6 to 0.8 to damp the extra proportional gain,
      because s-bend oscillation is already high and kp 5 with kd 0.3 previously caused
      overshoot. (3) ki stays at 0.5, which iteration 4 showed is helping. base_speed
      stays at 1.3, because s-bend needs about 2.8 s and a lower speed would push
      it past the 3 s limit. Geometry is unchanged, so the effect of the controller
      change can be read directly.


      Expected result: slalom progress rises above 0.5 and some slalom runs complete,
      s-bend completions increase, and oval stays at 20 of 20. Hypotheses: (a) with
      kd 0.8, steering_oscillation on s-bend falls back below 0.4 even with the higher
      kp, so kd is damping rather than adding lag; (b) if oval steering_oscillation
      rises above 0.35 or oval completions drop, kp 4.5 is too aggressive and should
      return to 4.0 with kd kept at 0.8. Measurements wanted next: completion and
      completion_time by track, progress and max_error on slalom and s-bend (to see
      where the robot leaves the line), rms_error and line_loss_events (to judge the
      effect of kp), and steering_oscillation (to judge kd).


      - [Open this output](iteration-5/entity0/versions/8874026c5b884a32bcdd6d544e169766/payload.json)

      - Based on: [entityR2A](iteration-5/entityR2A/versions/carried-5438f6c876243359/payload.json)'
  - id: entityR1
    label: 'Approve: ki 0.5, kd 0.6'
    notes: 'Approved the iteration-4 candidate, which raises ki from 0.3 to 0.5 and
      kd from 0.5 to 0.6 on top of the best raced design (score 335.3). The change
      is small, isolated to the integral and derivative terms, and aimed at the constant
      motor-mismatch bias that iteration 3 showed the integral was partly cancelling.


      ### Feedback


      Judged before racing, so I state no outcome for this candidate. The evidence
      is the iteration-3 race (score 335.3, best so far): oval finished 9 of 20 runs
      with mean progress 0.94, while s-bend (progress 0.61) and slalom (progress 0.31)
      still ended off track in every run. Iteration 3 cut max_error and line losses
      relative to iteration 2, and the ki rise from 0.02 to 0.3 coincided with the
      largest gain, which supports the idea that a constant motor-mismatch bias is
      being partly cancelled by the integral. The candidate changes only ki (0.3 to
      0.5) and kd (0.5 to 0.6). Kp, base_speed, geometry, sensor weights and line_loss
      are unchanged, so any change in result can be attributed to the integral and
      derivative terms. The integral stays clamped at plus or minus 2, which bounds
      windup. The change is small and tied to clear evidence, the candidate is valid
      and not obviously broken, and it is a sensible next test rather than a random
      one. Approve so the race gives per-track telemetry. Interpreting the next race:
      if rms_error and line_loss_events fall and oval completions hold, while s-bend
      or slalom progress rises, keep ki at 0.5. If steering_oscillation rises above
      about 0.4 on slalom with max_error not improving, kd is adding noise rather
      than damping, so bring kd back toward 0.5. If max_error on s-bend or slalom
      still reaches the 0.06 m limit with ki at 0.5, the slow response on tight alternating
      bends is the limit, and the next step is a modest kp increase or a small base_speed
      reduction, not further integral gain.


      ### Requested changes


      - If the race keeps oval completions and lowers rms_error and line_loss_events,
      hold ki at 0.5 and raise controller.base_speed slightly (for example to 1.4),
      since iteration 3 showed the bias is now handled and speed is the next limit
      on finishing.

      - If steering_oscillation rises above about 0.4 on slalom while max_error does
      not improve, set controller.kd back to about 0.5, since iteration 3 already
      showed steering_oscillation rising on s-bend (0.37) and extra damping needs
      to be checked against noise.

      - If s-bend or slalom still reach max_error near 0.06 m with ki at 0.5, change
      controller.kp by a small step (for example to 4.5) before further raising ki,
      since slalom progress (0.31) points to slow response on rapid direction changes.


      - [Open this output](iteration-4/entityR1/versions/210eaa9792d5444eb2a29129a54d3442/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/04387659a1d4425d8395e0aad78619cc/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-4c4bf8f7823ae45d/payload.json)'
