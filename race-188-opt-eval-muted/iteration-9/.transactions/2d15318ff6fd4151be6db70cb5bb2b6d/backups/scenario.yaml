  id: race-188-opt-eval-muted
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Iter6 base, sensors
    notes: 'Reverts to the best-scoring iteration 6 design (696.6) and moves the 12
      mm sensor array 1 cm further forward for earlier steering on slalom. Iteration
      8''s wider 16 mm array lost s-bend finishes, and kp 5 in iteration 7 did not
      help.


      ### Rationale


      Evidence. Iteration 6 (12 mm sensors at +/-3 cm, y 0.06, kp 4.8, kd 0.9, ki
      0.5, base 1.3) is the best design so far at 696.6. It finished 20/20 on oval
      and 20/20 on s-bend. Slalom was 0/20 with progress 0.47 and 1.25 line-loss events
      per run. Iteration 7 (kp 5.0, kd 1.0) lost s-bend finishes (17/20) and scored
      675, so kp 5 is past the useful range. Iteration 8 widened the sensors to 16
      mm at +/-4 cm and reverted the controller to iteration 6 values. Slalom progress
      fell to 0.37 and s-bend finishes fell to 14/20, so the wider, larger footprint
      hurt. Its score of 622 is below iteration 6.


      Diagnosis. The controller is near its useful limit at kp 4.8. Slalom is limited
      by response lag on fast direction changes, not by jitter, and the 16 mm footprint
      blurs the centroid on tight bends. The 12 mm, +/-3 cm array is the better sensing
      layout.


      Changes. (1) Geometry reverts to the iteration 6 sensing: 12 mm footprints at
      +/-3 cm, 1 cm spacing, seven sensors. (2) The only change is moving the sensors
      forward from y 0.06 to 0.07 m, giving more look-ahead so steering responds earlier
      at speed. This targets the lag that limits slalom, and it stays inside the allowed
      y range (max 0.08). (3) Controller is unchanged from iteration 6 (kp 4.8, kd
      0.9, ki 0.5, base 1.3, last_direction, same weights), so the effect of the look-ahead
      change can be read directly against the 696.6 baseline.


      Expected result. Oval and s-bend hold near iteration 6 (20/20 each). Slalom
      progress rises modestly, toward 0.55 or more, with a small chance of a first
      slalom completion. Risk: moving the sensors forward adds lag in the signal at
      low speed, which could raise max_error on s-bend.


      Hypotheses. (a) Extra look-ahead reduces the slalom off-track rate and line
      losses, because the line is seen before the wheels reach it. (b) If s-bend finishes
      drop below 18/20, the forward shift is hurting and y should return to 0.06.


      Measurements wanted: completion and completion_time by track; progress and max_error
      on slalom (where the line is lost); line_loss_events and rms_error on s-bend
      and slalom (effect of look-ahead); steering_oscillation on oval (confirms no
      added jitter).


      - [Open this output](iteration-9/entity0/versions/02ba85a682c7454b8ebae11be5c257df/payload.json)

      - Based on: [entityR2A](iteration-9/entityR2A/versions/carried-8ddb0bdd18a2be95/payload.json)'
  - id: entityR1
    label: 'Look-ahead test: y 0.07'
    notes: 'Approved a single-variable change from the best raced design (iteration
      6, 696.6): sensors moved forward to y 0.07 with all controller values unchanged.
      Evidence is iteration 6''s slalom shortfall (0/20, progress 0.47) and the iteration
      7 and 8 failures of gain and footprint changes.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      candidate is the iteration-6 design (score 696.6, best so far) with one geometry
      change: the seven sensors move forward from y 0.06 to y 0.07 m. The controller
      is the iteration-6 set (kp 4.8, kd 0.9, ki 0.5, base_speed 1.3, last_direction,
      same weights), and the sensor footprint (12 mm) and lateral span (±3 cm, 1 cm
      spacing) are unchanged. The y value is inside the allowed range (max 0.08).


      The evidence supports a single, isolated test. Iteration 6 finished 20/20 on
      oval and 20/20 on s-bend, but slalom finished 0/20 with progress 0.47 and 1.25
      line-loss events per run. Iteration 7 showed that raising kp to 5.0 and kd to
      1.0 gave little slalom gain (progress 0.53) and cost s-bend finishes (17/20),
      so the controller is near its useful limit. Iteration 8 showed that widening
      the array to 16 mm at ±4 cm hurt s-bend (14/20) and slalom progress (0.37),
      so the sensing layout should stay at iteration 6. That leaves look-ahead as
      the untested lever. Iteration 6 is the only raced design at y 0.06, and the
      iteration-3 move from y 0.05 to 0.06 came with improved oval and s-bend results,
      although that change was confounded with controller changes.


      Caution: moving the sensors further ahead adds sensing lag at low speed and
      could raise max_error on s-bend. Oval has a large margin (steering_oscillation
      0.232, max_error 0.0095), so an oval regression would be a signal of the forward
      shift, not of the gains.


      How to read the next race: if s-bend finishes hold at 18/20 or better and slalom
      progress rises above 0.47 with line_loss_events falling, keep y 0.07 and consider
      y 0.08 (the allowed maximum) as the next single step. If s-bend finishes fall
      below 18/20 or s-bend max_error rises above about 0.02, the forward shift is
      hurting, so return y to 0.06 and treat iteration 6 as the baseline. If slalom
      progress is flat near 0.47 with line_loss_events still above 1 per run, sensing
      position is not the limit, and the next test should change controller.sensor_weights
      scaling, not gains or geometry size.


      ### Requested changes


      - If s-bend finishes stay at 18/20 or better and slalom progress rises above
      0.47 with fewer line-loss events, keep geometry.sensor_positions at y 0.07 and
      try y 0.08 (the allowed maximum) as the next single step, since iteration 6
      showed the sensing layout is the cleaner lever than gain.

      - If s-bend finishes drop below 18/20 or s-bend max_error rises above about
      0.02, return geometry.sensor_positions y to 0.06 with all other iteration-6
      values, because iteration 8 showed the wider or larger footprint hurt s-bend
      and the forward shift may add the same kind of lag.

      - If slalom progress stays near 0.47 with line_loss_events still above 1 per
      run at y 0.07, leave the gains and geometry size alone and test controller.sensor_weights
      with a smaller outer-weight magnitude (for example [-1.5, -1.0, -0.5, 0, 0.5,
      1.0, 1.5]), keeping the sign convention, to check whether the signal saturates
      at the outer sensors on tight bends.


      - [Open this output](iteration-9/entityR1/versions/30b3a3381e144fee8d1fc980853cc68e/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/02ba85a682c7454b8ebae11be5c257df/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-8ddb0bdd18a2be95/payload.json)'
