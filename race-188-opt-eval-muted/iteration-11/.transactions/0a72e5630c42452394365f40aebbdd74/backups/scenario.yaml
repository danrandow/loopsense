overrides:
  entities:
  - id: entity0
    label: Look-ahead y 0.075 step
    notes: 'Iteration 9 controller and 12 mm sensors kept, with sensors moved forward
      from y 0.07 to 0.075 to test whether more look-ahead cuts slalom line losses.
      Iteration 9 (697.2) improved on iteration 6 with the same forward shift, and
      slalom progress is the main remaining loss.


      ### Rationale


      Evidence: iteration 9 is the best design so far (697.2). It is iteration 6 with
      the sensors moved forward from y 0.06 to 0.07. Oval finished 20/20 (1.96 s),
      s-bend finished 20/20 and was faster than iteration 6 (2.33 s vs 2.42 s), and
      slalom progress rose slightly (0.494 vs 0.474). Forward look-ahead therefore
      helped marginally with no completion loss. Slalom remains 0/20: it leaves the
      line in about 19 of 20 runs at roughly half the course, with about 1.3 line-loss
      events per run. Iteration 7 (kp 5, kd 1.0) and iteration 8 (16 mm sensors, +/-4
      cm) both lost s-bend finishes, so the controller gain and the wide-footprint
      sensing are both near their limits.


      Changes (small, one-variable step): sensors moved forward again from y 0.07
      to 0.075, the largest step that stays well inside the allowed y range and keeps
      the sensor footprints clear of the axle. Geometry otherwise matches iteration
      9 (12 mm footprints, +/-3 cm, 1 cm spacing, seven sensors). Controller is identical
      to iteration 9 (base 1.3, kp 4.8, ki 0.5, kd 0.9, same weights, last_direction),
      so the score change can be attributed to the look-ahead alone.


      Expected result: slalom progress rises modestly, toward 0.5 to 0.55, with a
      small chance of a first slalom completion; oval and s-bend hold at 20/20. Risk:
      more look-ahead adds phase lead at low speed, which could raise s-bend max_error.
      Hypotheses: (a) additional look-ahead reduces slalom line losses (target about
      1.0 per run or fewer); (b) if s-bend finishes drop below 18/20 or max_error
      exceeds 0.02 on s-bend, the forward shift has passed its useful point and y
      should return to 0.07. Measurements wanted: completion and completion_time by
      track; progress, max_error and line_loss_events on slalom (location of the line
      loss); s-bend finish count and steering_oscillation (to check lag).


      - [Open this output](iteration-10/entity0/versions/992ee00f650e464db4d342aed0abde9a/payload.json)

      - Based on: [entityR2A](iteration-10/entityR2A/versions/carried-e808c8e480ca9c7e/payload.json)'
  - id: entityR1
    label: Approve y 0.075
    notes: 'Approves the iteration-9 design with sensors moved forward from y 0.07
      to 0.075, a single isolated step. Iteration 9 kept oval and s-bend at 20/20
      and nudged slalom progress up, and the feedback sets the follow-up rules for
      the next race.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      candidate is the iteration-9 design (score 697.2, best so far) with one geometry
      change: the seven sensors move forward from y 0.07 to y 0.075. The controller
      (kp 4.8, kd 0.9, ki 0.5, base_speed 1.3, last_direction, same weights), the
      12 mm footprint and the ±3 cm span are unchanged, so any difference can be attributed
      to look-ahead. The value is inside the contract limit (y max 0.08).


      The evidence: iteration 9 kept oval at 20/20 and s-bend at 20/20 after the move
      from y 0.06 to 0.07, with s-bend faster than iteration 6 (2.33 s vs 2.42 s)
      and slalom progress up slightly (0.494 vs 0.474). Iterations 7 and 8 showed
      that the controller gain (kp 5.0) and the 16 mm, ±4 cm footprint each lost s-bend
      finishes, so the controller and sensing layout are near their limits. Slalom
      has stayed at 0/20 in every design, with about 1.3 line-loss events per run.
      The forward-shift trend is the only lever tested that improved results without
      a completion loss, so a further small step is a reasonable test. The main risk
      is that extra look-ahead adds phase lead at low speed, which could raise s-bend
      max_error.


      How to read the next race: if s-bend finishes stay at 18/20 or better, s-bend
      max_error stays at or below about 0.02, and slalom progress rises above 0.494
      with fewer line-loss events, keep y 0.075 and consider y 0.08 (the allowed maximum)
      as the final sensor step. If s-bend finishes fall below 18/20 or s-bend max_error
      exceeds about 0.02, the forward shift has passed its useful point, so return
      y to 0.07 with all other values unchanged. If slalom progress stays flat near
      0.49 with line-loss events still above 1 per run, sensor position is not the
      limit, and the next test should change only the outer sensor weights.


      Decision: approve. The candidate is the best known design with one small, isolated,
      valid change. A revision would cost two action runs for a marginal expected
      gain, and the race gives per-track telemetry for the final iteration.


      ### Requested changes


      - If s-bend finishes stay at 18/20 or better, s-bend max_error stays at or below
      about 0.02, and slalom progress rises above 0.494 with fewer line-loss events,
      keep geometry.sensor_positions at y 0.075 and try y 0.08 as the last single
      step, since the forward shift helped without a completion loss in iteration
      9.

      - If s-bend finishes drop below 18/20 or s-bend max_error exceeds about 0.02,
      return geometry.sensor_positions to y 0.07 with all other values unchanged,
      because the extra look-ahead is adding phase lead at low speed.

      - If slalom progress stays near 0.49 with line_loss_events still above 1 per
      run at y 0.075, leave gains and geometry alone and test controller.sensor_weights
      with smaller outer magnitudes (for example [-1.5, -1.0, -0.5, 0, 0.5, 1.0, 1.5]),
      since the signal may saturate at the outer sensors on tight alternating bends.


      - [Open this output](iteration-10/entityR1/versions/7687f59a89554358a8fb0cd4b0b4511a/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/992ee00f650e464db4d342aed0abde9a/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-e808c8e480ca9c7e/payload.json)'
