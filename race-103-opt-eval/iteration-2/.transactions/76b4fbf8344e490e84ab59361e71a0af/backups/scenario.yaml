map:
  id: race-103-opt-eval
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Stronger steer, slower
    notes: 'Raises kp to 3.5 and kd to 0.4 and lowers base_speed to 1.4, keeping geometry
      fixed to isolate the controller. The baseline left the line on all 60 development
      trials with max_error about 0.062, just past the 0.06 m off-track limit, so
      the aim is to recover at the edge and survive bends. Evidence is the baseline
      race summary, which showed low rms_error but off-track endings on every track.


      ### Rationale


      Evidence: the baseline (iteration 0 design, which the Evaluator''s feedback
      describes as the current candidate) left the line on every development track.
      All 60 trials ended off_track with zero finishes. Oval progress was 0.20, s-bend
      0.17 and slalom 0.12. max_error was about 0.062 to 0.064 on every track, just
      past the 0.06 m off-track limit, while rms_error stayed low at 0.02 to 0.03.
      So the robot tracks the line well on average but is knocked off by occasional
      large excursions on bends, and the 1.5 to 2 line-loss events per run show it
      losing the tape at the edge. The failure is recovery at the edge, not average
      tracking. Speed is the likely driver: at base_speed 1.6 the robot carries too
      much momentum into bends, and kp 2.5 gives too little corrective turn once it
      drifts. Changes (controller only, geometry held fixed so the race isolates the
      controller): (1) kp 2.5 to 3.5, a stronger corrective turn on bends, which is
      the main lever for max_error; (2) base_speed 1.6 to 1.4, less momentum into
      bends, so the robot can stay on the tape. This will lengthen completion time,
      which I accept because surviving to finish is worth 500 points and time is only
      worth 60 at most; (3) kd 0.2 to 0.4 to damp the extra gain so kp 3.5 does not
      add jitter. Geometry is unchanged because a wider sensor spread would change
      the signal gain and confound the test. Expected result: fewer off_track endings,
      max_error below 0.06 on the oval and s-bend, and line_loss_events near zero.
      Completion may still be marginal on the slalom. Hypotheses to test next: (a)
      if max_error is still near 0.06 with kp 3.5, the limit is speed, so drop base_speed
      further; (b) if steering_oscillation rises sharply, kd is too low for kp 3.5;
      (c) if the robot is stable but completion_time exceeds 3 s, raise base_speed
      in small steps (about 0.1) while watching max_error.


      - [Open this output](iteration-1/entity0/versions/dc8f8b4330a24457aebe71a006d0fa11/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-1437b56316d02efc/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-22fa00f726ad5776/payload.json)'
  - id: entityR1
    label: Approve kp/speed/kd
    notes: 'Approved as the last available action, since a revise round could not
      race this iteration. Rests on iteration 0: all 60 trials ended off_track with
      max_error about 0.063 and rms_error about 0.025, so the proposed kp 3.5 and
      kd 0.4 target edge recovery, while base_speed 1.4 risks missing the 3 s finish.


      ### Feedback


      Approved because this is the last action run this iteration, so a revise round
      cannot be raced. Iteration 0 is the only evidence: all 60 trials went off_track
      with zero finishes, max_error sat at 0.062 to 0.064 (just past the 0.06 m limit)
      while rms_error stayed at 0.02 to 0.03, and line_loss_events were 1 to 2 per
      run. The failure is edge recovery on bends, not average tracking, and the proposed
      kp 2.5 to 3.5 targets that directly. The candidate''s controller-only change
      keeps geometry fixed, which isolates the controller effect. I cannot say how
      it will perform; the race will show it.


      Risk to watch: base_speed 1.6 to 1.4 lowers average speed. The contract needs
      roughly 1.5 m/s to finish in 3 s, so completion may become impossible even if
      the robot stays on the line. Judge the next iteration from the telemetry as
      follows. If max_error is still at or above 0.06 with the robot leaving the line,
      the limit is speed or recovery, so drop base_speed further in small steps. If
      the robot stays on the line (max_error below 0.06, line_loss_events near 0)
      but completion_time exceeds 3 s, raise base_speed in steps of about 0.1 while
      watching max_error. If steering_oscillation rises sharply with kp 3.5, kd is
      too low for the gain, so raise kd from 0.4 toward 0.6.


      ### Requested changes


      - If the next race shows max_error still at or above 0.06 with off_track endings,
      reduce controller.base_speed below 1.4 (for example 1.2) to test whether speed
      is the limit, since iteration 0 max_error sat at 0.062 to 0.064 at base_speed
      1.6.

      - If the robot stays on the line (max_error below 0.06, line_loss_events near
      0) but completion_time exceeds 3 s, raise controller.base_speed in steps of
      about 0.1 (1.4 to 1.5 to 1.6), because the contract needs about 1.5 m/s average
      to finish.

      - If steering_oscillation rises sharply with kp 3.5 (iteration 0 was 0.11 to
      0.15), raise controller.kd from 0.4 toward 0.6 to damp the higher gain, keeping
      kp at 3.5.


      - [Open this output](iteration-1/entityR1/versions/9bbdadd296aa4cac95960a95aa259d79/payload.json)

