map:
  id: race-103-opt-eval
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Speed 1.1, kp3.0 kd0.8
    notes: 'Reduces base_speed from 1.2 to 1.1 on the iteration 3 best (kp 3.0, kd
      0.8), which still left the slalom max_error at 0.064 with off-track endings.
      Geometry and other controller values are unchanged so the race isolates the
      speed effect; the cost is longer s-bend times, which risk the 3 s limit.


      ### Rationale


      Evidence from iteration 3 (kp 3.0, kd 0.8, base_speed 1.2, score 517.2, the
      best so far). The oval finished 19 of 20 runs in 2.11 s with max_error 0.021.
      The s-bend finished 6 of 20 with max_error 0.054, now below the 0.06 m limit,
      so the kp and kd change helped there. The slalom finished 0 of 20 with max_error
      0.064 and one line-loss event per run, so it still leaves the tape at the edge.
      rms_error stays low (0.008 to 0.019), so average tracking is fine and the losses
      are edge excursions. steering_oscillation is still 0.37 on the s-bend, 0.26
      on the oval and 0.20 on the slalom. The kd rule (raise toward 0.8) is already
      applied, and the Evaluator''s guidance for a slalom still above 0.06 with kp
      3.0 is to reduce base_speed to 1.1 before changing sensor geometry.


      Change: controller.base_speed 1.2 to 1.1, the only change. kp 3.0, kd 0.8, ki
      0, line_loss ''last_direction'', geometry and sensor_weights are unchanged,
      so the race isolates the speed effect. Less momentum into bends should cut the
      slalom max_error below 0.06, which is the main cause of off-track endings.


      Expected result: slalom max_error near or below 0.06 and more slalom and s-bend
      finishes. Cost: about 5 to 10 percent longer completion times, so the s-bend
      mean (2.56 s at 1.2) could reach about 2.8 s, close to the 3 s limit. Oval completion
      should stay near 2.3 s.


      Hypotheses to check next: (a) at base_speed 1.1, slalom max_error drops below
      0.06 and line_loss_events falls toward 0.5 or less; (b) s-bend completion_time
      stays under 3 s. If the slalom still ends off track at 1.1, the next lever is
      a sensor-geometry change (a wider spread, x near 0.03 m). If s-bend times exceed
      3 s, hold base_speed at 1.1 and do not raise it.


      - [Open this output](iteration-4/entity0/versions/c47c7908c5324ddcaeaa19a0bab42451/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-5b0e735b184642cf/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-b397f190db90e646/payload.json)'
  - id: entityR1
    label: 'Approve: slower speed'
    notes: 'Approved the single-parameter base_speed 1.2 to 1.1 change because only
      one run remains and a revision would leave no race. It rests on iteration 3
      telemetry: the slalom max_error was 0.064 and the s-bend 0.054, so speed is
      the lever to test.


      ### Feedback


      Approved because one action run remains and a revise round would leave no run
      for the race. The candidate differs from the iteration 3 best (score 517.2)
      only in controller.base_speed, 1.2 to 1.1. kp 3.0, kd 0.8, ki 0, line_loss ''last_direction''
      and geometry are unchanged. Evidence from iteration 3: the oval finished 19
      of 20 runs with max_error 0.021. The s-bend finished 6 of 20 with max_error
      0.054, and the slalom finished 0 of 20 with max_error 0.064 and one line-loss
      event per run. rms_error stayed low (0.008 to 0.019), so the failures are edge
      excursions on bends, not poor average tracking. steering_oscillation was 0.37
      on the s-bend, 0.26 on the oval and 0.20 on the slalom. The kd rule has already
      been applied (kd 0.8). The remaining lever is speed, and the candidate is a
      one-parameter test of it. I make no prediction of how this candidate will perform.


      How to use the telemetry in the next iteration. If the slalom max_error falls
      below 0.06 and its line_loss_events drop toward 0.5 or less, speed was the limit,
      so hold base_speed near 1.1. If the slalom still ends off track at 1.1, the
      next change is sensor geometry: widen the sensor spread to x near plus or minus
      0.03 m, keeping the other fields fixed. If s-bend completion_time rises above
      3 s, do not raise base_speed again, because the time limit is then binding.


      ### Requested changes


      - If the slalom still ends off track with max_error at or above 0.06 at base_speed
      1.1, keep controller.base_speed at 1.1 and change geometry.sensor_positions
      to a wider spread (x near -0.03, -0.015, 0, 0.015, 0.03 m), since iteration
      3 slalom max_error was 0.064 and the sensor spread is untested.

      - If slalom and s-bend max_error drop below 0.06 at base_speed 1.1 but s-bend
      completion_time exceeds 3 s, hold controller.base_speed at 1.1 or move it to
      1.15, not lower, since iteration 3 s-bend mean finish time was 2.56 s at base_speed
      1.2.

      - If steering_oscillation remains near 0.37 on the s-bend with kd 0.8, do not
      raise kd further without a race result; test controller.kd 0.9 only after speed
      and geometry have been isolated.


      - [Open this output](iteration-4/entityR1/versions/1864b1102e734e83bda2358c3725ff2a/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/c47c7908c5324ddcaeaa19a0bab42451/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-b397f190db90e646/payload.json)'
