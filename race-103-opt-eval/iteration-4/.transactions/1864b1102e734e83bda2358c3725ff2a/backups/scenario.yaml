map:
  id: race-103-opt-eval
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Speed 1.1, kp3.0 kd0.8
    notes: 'Reduces base_speed from 1.2 to 1.1 on the iteration 3 best (kp 3.0, kd
      0.8), which still left the slalom max_error at 0.064 with off-track endings.
      Geometry and other controller values are unchanged so the race isolates the
      speed effect; the cost is longer s-bend times, which risk the 3 s limit.


      ### Rationale


      Evidence from iteration 3 (kp 3.0, kd 0.8, base_speed 1.2, score 517.2, the
      best so far). The oval finished 19 of 20 runs in 2.11 s with max_error 0.021.
      The s-bend finished 6 of 20 with max_error 0.054, now below the 0.06 m limit,
      so the kp and kd change helped there. The slalom finished 0 of 20 with max_error
      0.064 and one line-loss event per run, so it still leaves the tape at the edge.
      rms_error stays low (0.008 to 0.019), so average tracking is fine and the losses
      are edge excursions. steering_oscillation is still 0.37 on the s-bend, 0.26
      on the oval and 0.20 on the slalom. The kd rule (raise toward 0.8) is already
      applied, and the Evaluator''s guidance for a slalom still above 0.06 with kp
      3.0 is to reduce base_speed to 1.1 before changing sensor geometry.


      Change: controller.base_speed 1.2 to 1.1, the only change. kp 3.0, kd 0.8, ki
      0, line_loss ''last_direction'', geometry and sensor_weights are unchanged,
      so the race isolates the speed effect. Less momentum into bends should cut the
      slalom max_error below 0.06, which is the main cause of off-track endings.


      Expected result: slalom max_error near or below 0.06 and more slalom and s-bend
      finishes. Cost: about 5 to 10 percent longer completion times, so the s-bend
      mean (2.56 s at 1.2) could reach about 2.8 s, close to the 3 s limit. Oval completion
      should stay near 2.3 s.


      Hypotheses to check next: (a) at base_speed 1.1, slalom max_error drops below
      0.06 and line_loss_events falls toward 0.5 or less; (b) s-bend completion_time
      stays under 3 s. If the slalom still ends off track at 1.1, the next lever is
      a sensor-geometry change (a wider spread, x near 0.03 m). If s-bend times exceed
      3 s, hold base_speed at 1.1 and do not raise it.


      - [Open this output](iteration-4/entity0/versions/c47c7908c5324ddcaeaa19a0bab42451/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-5b0e735b184642cf/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-b397f190db90e646/payload.json)'
  - id: entityR1
    label: Approve kp 3.0, kd 0.8
    notes: 'Approved the controller-only change (kp 3.5 to 3.0, kd 0.6 to 0.8) because
      only one action run remained, so a revise round could not be raced. It applies
      both conditional rules from iteration 2: max_error at or above 0.06 on the s-bend
      and slalom, and steering_oscillation above 0.2.


      ### Feedback


      Approved because this is the last action run this iteration. A revise would
      need a review, a revision and then a race, and only one run remains, so approving
      is the only way to get a scored race.


      The candidate changes only the controller from the iteration 2 best (score 422.3):
      kp 3.5 to 3.0 and kd 0.6 to 0.8. base_speed 1.2, geometry and sensor_weights
      are unchanged. The evidence is iteration 2''s per-track metrics. max_error was
      0.0612 on the s-bend and 0.0631 on the slalom, both at or above the 0.06 m limit,
      while the oval was 0.034. rms_error stayed low (0.010 to 0.019), so the failures
      are edge excursions on bends, not poor average tracking. steering_oscillation
      was 0.27, 0.32 and 0.25, all above 0.2 with kd 0.6. The two conditional rules
      from the earlier Evaluator feedback therefore both apply: lower kp toward 3.0
      and raise kd toward 0.8. Nothing here predicts how the candidate will perform;
      the race will show it.


      What to do with the telemetry, if a later iteration is available. If max_error
      is still at or above 0.06 on the s-bend or slalom, test a sensor-geometry change
      (wider sensor spread, for example x of about plus or minus 0.03) or a small
      base_speed reduction to 1.1. If completion_time on the oval rises above 2.5
      s, hold base_speed and do not raise it. If steering_oscillation falls clearly
      while completion stays up, damping is working and speed is the next lever.


      ### Requested changes


      - If max_error on the s-bend or slalom is still at or above 0.06 with kp 3.0
      and kd 0.8, change controller.base_speed from 1.2 to 1.1 to test whether speed
      is the limit, since iteration 2 max_error was 0.0612 and 0.0631 at base_speed
      1.2.

      - If completion_time on the oval rises above 2.5 s after the kp and kd change,
      hold controller.base_speed at 1.2 rather than raising it, because the oval finished
      in about 2.06 s in iteration 2 and speed is not the constraint there.

      - If steering_oscillation stays above 0.2 with kd 0.8, or the slalom still ends
      off track, try a sensor-geometry change such as a wider sensor spread (x near
      plus or minus 0.03 m), since iteration 2 steering_oscillation was 0.25 to 0.32
      and the sensor spread has not been tested.


      - [Open this output](iteration-3/entityR1/versions/bab96cb97b484df6a06f985af33abba9/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/894657d02c5a4f1ab2964926c71421a2/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-9b995d388174609a/payload.json)'
