overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'A conservative first candidate: five evenly spaced 12 mm sensors, signed
      weights matching their x positions, base_speed 1.6, kp 2.5, kd 0.2, ki 0. No
      race data exists yet, so values come from the contract''s ranges and its speed
      requirement.


      ### Rationale


      Iteration 0 has no race data, so this is a conservative baseline built from
      the contract rather than tuned values. Geometry: five sensors spread evenly
      across the 25 mm tape (x = -0.024 to +0.024 m, step 0.012 m), all 0.04 m ahead
      of the axle, so they see the line before the wheels reach it. Sensor size 0.012
      m is about half the tape width, which gives a usable gradient as the line moves
      under the array. Wheel track 0.12 m, wheel radius 0.03 m, body 0.12 x 0.18 m
      and mass 0.8 kg are mid-range values that keep the yaw inertia moderate. Off-track
      limit with these values is 0.06 m, which is ample for a line follower. Controller:
      sensor_weights [-2, -1, 0, 1, 2] match the sensor x positions, so signal is
      positive when the line is left of centre and steers left, as specified. base_speed
      1.6 (about 80 percent of full PWM) is chosen to aim for the ~1.5 m/s average
      needed to finish in 3 s while leaving margin for speed loss in corners. kp 2.5
      gives a moderate steering response (turn is 2.5 times the signal). ki is 0 to
      avoid integral windup on curves. kd 0.2 damps oscillation at this speed. line_loss
      ''last_direction'' lets the robot recover from the tape edge in the direction
      it was last heading. Expected result: a completed run on the oval and s-bend
      tracks with low rms_error; the slalom may show oscillation or line loss. Hypotheses
      to test next: (1) base_speed can be raised toward 2.0 if rms_error stays low,
      reducing completion_time; (2) kp may be too low on tight bends, causing progress
      to stall; (3) kd affects jitter (steering_oscillation). Measurements requested
      are chosen to test these.


      - [Open this output](iteration-0/entity0/versions/f07e5ed37d784c9eabf45729c958f3b6/payload.json)'
  actions:
  - id: action0
measurements: {}
