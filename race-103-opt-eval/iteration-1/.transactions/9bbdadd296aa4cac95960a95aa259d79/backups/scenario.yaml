map:
  id: race-103-opt-eval
  schema: v0.2
  scenario: Iteration 1
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 0.
dimensions:
  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Stronger steer, slower
    notes: 'Raises kp to 3.5 and kd to 0.4 and lowers base_speed to 1.4, keeping geometry
      fixed to isolate the controller. The baseline left the line on all 60 development
      trials with max_error about 0.062, just past the 0.06 m off-track limit, so
      the aim is to recover at the edge and survive bends. Evidence is the baseline
      race summary, which showed low rms_error but off-track endings on every track.


      ### Rationale


      Evidence: the baseline (iteration 0 design, which the Evaluator''s feedback
      describes as the current candidate) left the line on every development track.
      All 60 trials ended off_track with zero finishes. Oval progress was 0.20, s-bend
      0.17 and slalom 0.12. max_error was about 0.062 to 0.064 on every track, just
      past the 0.06 m off-track limit, while rms_error stayed low at 0.02 to 0.03.
      So the robot tracks the line well on average but is knocked off by occasional
      large excursions on bends, and the 1.5 to 2 line-loss events per run show it
      losing the tape at the edge. The failure is recovery at the edge, not average
      tracking. Speed is the likely driver: at base_speed 1.6 the robot carries too
      much momentum into bends, and kp 2.5 gives too little corrective turn once it
      drifts. Changes (controller only, geometry held fixed so the race isolates the
      controller): (1) kp 2.5 to 3.5, a stronger corrective turn on bends, which is
      the main lever for max_error; (2) base_speed 1.6 to 1.4, less momentum into
      bends, so the robot can stay on the tape. This will lengthen completion time,
      which I accept because surviving to finish is worth 500 points and time is only
      worth 60 at most; (3) kd 0.2 to 0.4 to damp the extra gain so kp 3.5 does not
      add jitter. Geometry is unchanged because a wider sensor spread would change
      the signal gain and confound the test. Expected result: fewer off_track endings,
      max_error below 0.06 on the oval and s-bend, and line_loss_events near zero.
      Completion may still be marginal on the slalom. Hypotheses to test next: (a)
      if max_error is still near 0.06 with kp 3.5, the limit is speed, so drop base_speed
      further; (b) if steering_oscillation rises sharply, kd is too low for kp 3.5;
      (c) if the robot is stable but completion_time exceeds 3 s, raise base_speed
      in small steps (about 0.1) while watching max_error.


      - [Open this output](iteration-1/entity0/versions/dc8f8b4330a24457aebe71a006d0fa11/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-1437b56316d02efc/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-22fa00f726ad5776/payload.json)'
  - id: entityR1
    label: Approve baseline, no race
    notes: 'Approved the iteration 0 baseline because only one action run remains,
      so a revise cycle could not finish and an unscored iteration is worse. All fields
      are checked against the public contract ranges, and the feedback gives telemetry-driven
      changes for base_speed, kp and kd. No race data yet supports any performance
      claim.


      ### Feedback


      Approved for the first race. No race has run yet, so there is no telemetry for
      this candidate or any earlier one, and nothing here predicts its performance.
      The evidence is the public contract. Every field is inside its stated range:
      sensor x values are within ±0.08 m, sensor_size 0.012 is an allowed option,
      wheel_track 0.12, wheel_radius 0.03, body_width 0.12, body_length 0.18 and mass
      0.8 are in range, and sensor_weights has five entries matching the five sensor
      positions. base_speed 1.6 is below the cap of 2, and line_loss ''last_direction''
      is valid. The only remaining budget is one action run, so a revise round cannot
      be completed within this iteration. Approving lets the candidate race and produce
      the telemetry needed to sharpen the next critique.


      What to change after the race, depending on what it shows: if completion_time
      is above 3 s with progress below 0.995, the contract needs an average speed
      of about 1.5 m/s, so raise base_speed toward 1.8 to 2.0 provided rms_error stays
      low. If rms_error or max_error rises on tight bends, raise kp toward 3.0 to
      3.5, since the turn is kp times the signal and this candidate uses kp 2.5. If
      steering_oscillation is high, raise kd toward 0.4 to 0.6 to damp jitter. Change
      one parameter at a time so each race isolates its effect.


      ### Requested changes


      - If completion_time exceeds about 3 s without completion, raise controller.base_speed
      from 1.6 toward 1.8 to 2.0, but only if rms_error and max_error remain low on
      the development tracks.

      - If rms_error or max_error is high on the s-bend or slalom, raise controller.kp
      from 2.5 toward 3.0 to 3.5 to steer harder through tight bends.

      - If steering_oscillation is high, raise controller.kd from 0.2 toward 0.4 to
      0.6 to damp jitter, keeping kp unchanged.


      - [Open this output](iteration-0/entityR1/versions/1a26fc1da0e24d3392b7ef97359615d5/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/f07e5ed37d784c9eabf45729c958f3b6/payload.json)'
