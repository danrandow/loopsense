map:
  id: race-103-opt-eval
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: kp 3.0, kd 0.8 damping
    notes: 'Lowers kp from 3.5 to 3.0 and raises kd from 0.6 to 0.8, applying both
      of the Evaluator''s conditional rules. The last race still showed max_error
      at or above 0.06 on the s-bend and slalom, and steering_oscillation above 0.2
      on all tracks. Geometry and base_speed 1.2 are unchanged so the controller effect
      is isolated.


      ### Rationale


      Evidence from the last race (iteration 2, score 422.3, the best so far): the
      robot finished 16 of 20 oval runs with a mean finish time of 2.06 s, but the
      s-bend (2 of 20 finished, progress 0.60) and slalom (0 of 20, progress 0.31)
      still ended off track. max_error is 0.0612 on the s-bend and 0.0631 on the slalom,
      both at or above the 0.06 m limit. rms_error stays low (0.010 to 0.019), so
      average tracking is fine and the failures are edge excursions on bends. steering_oscillation
      is 0.27 (oval), 0.32 (s-bend) and 0.25 (slalom), all above 0.2 even with kd
      0.6. The Evaluator''s two conditional rules both apply: max_error is still at
      or above 0.06 with kd 0.6, so reduce kp toward 3.0; and steering_oscillation
      is still above 0.2 with kd 0.6, so raise kd to 0.8.


      Changes: controller.kp 3.5 to 3.0 and controller.kd 0.6 to 0.8. base_speed stays
      at 1.2, since the oval already finishes in about 2.1 s and speed is not the
      constraint now. Geometry and sensor_weights are unchanged so that the race isolates
      the controller effect. The ratio of damping to proportional gain rises from
      about 0.17 to 0.27, which should cut the jitter that builds up on bends.


      Expected result: steering_oscillation falls from about 0.3 toward 0.2 or below,
      and max_error on the s-bend and slalom drops below 0.06, which would give more
      s-bend and slalom finishes. The main risk is that kp 3.0 gives less corrective
      turn on tight bends, so the slalom could still lose the tape, or completion
      could fall on the oval if damping slows the response too much. Hypotheses to
      check next: (a) kd 0.8 reduces steering_oscillation without a large rise in
      completion_time; (b) lower kp cuts max_error on the s-bend. If max_error stays
      at or above 0.06 with kp 3.0, the next step is either a sensor-geometry change
      (wider sensor spread for better bend detection) or a small base_speed reduction
      to 1.1. If completion_time rises above 2.5 s on the oval, base_speed should
      be held and not raised.


      - [Open this output](iteration-3/entity0/versions/894657d02c5a4f1ab2964926c71421a2/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-a3ddeec52beba0d0/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-9b995d388174609a/payload.json)'
  - id: entityR1
    label: Approve kd 0.6, speed 1.2
    notes: 'Approved as the only scored path, since one run remains and a revise round
      cannot race. The candidate raises kd to damp kp 3.5 and lowers base_speed to
      1.2, which targets the max_error at 0.06 and steering_oscillation of about 0.3
      seen in iteration 1 (score 170.1).


      ### Feedback


      Approved because only one action run remains this iteration. A revise round
      would need a review and a revision, and the race would then have no run left,
      so approving is the only way to get a scored race. The candidate is a controller-only
      change from the iteration 1 best (score 170.1): kd 0.4 to 0.6 and base_speed
      1.4 to 1.2, with kp 3.5, line_loss ''last_direction'' and geometry unchanged.
      Evidence: in iteration 1, max_error stayed at or just above 0.06 on all tracks
      (oval 0.063, s-bend 0.0672, slalom 0.0614) while rms_error stayed low (0.017
      to 0.025), so the failure is edge excursions on bends. steering_oscillation
      rose from 0.10 to 0.15 at iteration 0 to 0.28 to 0.31 on the oval and s-bend
      after kp went to 3.5 with kd 0.4, which supports raising kd to damp that gain.
      Iteration 0 showed that base_speed 1.6 with kp 2.5 also left the line on every
      run. Nothing here predicts how this candidate will perform. The next race will
      show whether the robot stays on the tape. Use the telemetry as follows. If max_error
      is below 0.06 with line_loss_events near 0 but completion_time exceeds 3 s,
      raise base_speed in steps of 0.1. If max_error is still at or above 0.06 with
      kd 0.6, the next step is a lower kp (around 3.0), not further speed reduction.
      If steering_oscillation falls clearly while completion stays at 0, the damping
      is working and the speed limit should be the next lever.


      ### Requested changes


      - If completion_time is over 3 s with max_error below 0.06 and line_loss_events
      near 0, raise controller.base_speed from 1.2 in steps of 0.1 (for example 1.3),
      since iteration 1 max_error was at the 0.06 limit and the contract needs about
      1.5 m/s average.

      - If max_error is still at or above 0.06 with kd 0.6, reduce controller.kp from
      3.5 to about 3.0 while keeping kd 0.6, since iteration 1 steering_oscillation
      of 0.28 to 0.31 at kp 3.5 suggests the gain is high relative to damping.

      - If steering_oscillation stays above 0.2 with kd 0.6, try controller.kd of
      0.8, since iteration 1 values of 0.28 to 0.31 at kd 0.4 show damping is still
      short at kp 3.5.


      - [Open this output](iteration-2/entityR1/versions/2fcae7fe14bd4378b78c8d9452ac61d9/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/76b4fbf8344e490e84ab59361e71a0af/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-34493695f77a7d24/payload.json)'
