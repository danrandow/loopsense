map:
  id: race-103-opt-eval
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: kp 3.0, kd 0.8 damping
    notes: 'Lowers kp from 3.5 to 3.0 and raises kd from 0.6 to 0.8, applying both
      of the Evaluator''s conditional rules. The last race still showed max_error
      at or above 0.06 on the s-bend and slalom, and steering_oscillation above 0.2
      on all tracks. Geometry and base_speed 1.2 are unchanged so the controller effect
      is isolated.


      ### Rationale


      Evidence from the last race (iteration 2, score 422.3, the best so far): the
      robot finished 16 of 20 oval runs with a mean finish time of 2.06 s, but the
      s-bend (2 of 20 finished, progress 0.60) and slalom (0 of 20, progress 0.31)
      still ended off track. max_error is 0.0612 on the s-bend and 0.0631 on the slalom,
      both at or above the 0.06 m limit. rms_error stays low (0.010 to 0.019), so
      average tracking is fine and the failures are edge excursions on bends. steering_oscillation
      is 0.27 (oval), 0.32 (s-bend) and 0.25 (slalom), all above 0.2 even with kd
      0.6. The Evaluator''s two conditional rules both apply: max_error is still at
      or above 0.06 with kd 0.6, so reduce kp toward 3.0; and steering_oscillation
      is still above 0.2 with kd 0.6, so raise kd to 0.8.


      Changes: controller.kp 3.5 to 3.0 and controller.kd 0.6 to 0.8. base_speed stays
      at 1.2, since the oval already finishes in about 2.1 s and speed is not the
      constraint now. Geometry and sensor_weights are unchanged so that the race isolates
      the controller effect. The ratio of damping to proportional gain rises from
      about 0.17 to 0.27, which should cut the jitter that builds up on bends.


      Expected result: steering_oscillation falls from about 0.3 toward 0.2 or below,
      and max_error on the s-bend and slalom drops below 0.06, which would give more
      s-bend and slalom finishes. The main risk is that kp 3.0 gives less corrective
      turn on tight bends, so the slalom could still lose the tape, or completion
      could fall on the oval if damping slows the response too much. Hypotheses to
      check next: (a) kd 0.8 reduces steering_oscillation without a large rise in
      completion_time; (b) lower kp cuts max_error on the s-bend. If max_error stays
      at or above 0.06 with kp 3.0, the next step is either a sensor-geometry change
      (wider sensor spread for better bend detection) or a small base_speed reduction
      to 1.1. If completion_time rises above 2.5 s on the oval, base_speed should
      be held and not raised.


      - [Open this output](iteration-3/entity0/versions/894657d02c5a4f1ab2964926c71421a2/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-a3ddeec52beba0d0/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-9b995d388174609a/payload.json)'
  - id: entityR1
    label: Approve kp 3.0, kd 0.8
    notes: 'Approved the controller-only change (kp 3.5 to 3.0, kd 0.6 to 0.8) because
      only one action run remained, so a revise round could not be raced. It applies
      both conditional rules from iteration 2: max_error at or above 0.06 on the s-bend
      and slalom, and steering_oscillation above 0.2.


      ### Feedback


      Approved because this is the last action run this iteration. A revise would
      need a review, a revision and then a race, and only one run remains, so approving
      is the only way to get a scored race.


      The candidate changes only the controller from the iteration 2 best (score 422.3):
      kp 3.5 to 3.0 and kd 0.6 to 0.8. base_speed 1.2, geometry and sensor_weights
      are unchanged. The evidence is iteration 2''s per-track metrics. max_error was
      0.0612 on the s-bend and 0.0631 on the slalom, both at or above the 0.06 m limit,
      while the oval was 0.034. rms_error stayed low (0.010 to 0.019), so the failures
      are edge excursions on bends, not poor average tracking. steering_oscillation
      was 0.27, 0.32 and 0.25, all above 0.2 with kd 0.6. The two conditional rules
      from the earlier Evaluator feedback therefore both apply: lower kp toward 3.0
      and raise kd toward 0.8. Nothing here predicts how the candidate will perform;
      the race will show it.


      What to do with the telemetry, if a later iteration is available. If max_error
      is still at or above 0.06 on the s-bend or slalom, test a sensor-geometry change
      (wider sensor spread, for example x of about plus or minus 0.03) or a small
      base_speed reduction to 1.1. If completion_time on the oval rises above 2.5
      s, hold base_speed and do not raise it. If steering_oscillation falls clearly
      while completion stays up, damping is working and speed is the next lever.


      ### Requested changes


      - If max_error on the s-bend or slalom is still at or above 0.06 with kp 3.0
      and kd 0.8, change controller.base_speed from 1.2 to 1.1 to test whether speed
      is the limit, since iteration 2 max_error was 0.0612 and 0.0631 at base_speed
      1.2.

      - If completion_time on the oval rises above 2.5 s after the kp and kd change,
      hold controller.base_speed at 1.2 rather than raising it, because the oval finished
      in about 2.06 s in iteration 2 and speed is not the constraint there.

      - If steering_oscillation stays above 0.2 with kd 0.8, or the slalom still ends
      off track, try a sensor-geometry change such as a wider sensor spread (x near
      plus or minus 0.03 m), since iteration 2 steering_oscillation was 0.25 to 0.32
      and the sensor spread has not been tested.


      - [Open this output](iteration-3/entityR1/versions/bab96cb97b484df6a06f985af33abba9/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/894657d02c5a4f1ab2964926c71421a2/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-9b995d388174609a/payload.json)'
