map:
  id: race-103-opt-eval
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Wider sensor spread
    notes: 'Keeps the iteration 4 best controller (base_speed 1.1, kp 3.0, kd 0.8)
      and widens the sensor array to x = ±0.03 m, because the slalom still left the
      tape at 1.1 with max_error 0.0613. The change is geometry only, so the race
      isolates the sensor spread.


      ### Rationale


      Evidence from iteration 4 (base_speed 1.1, kp 3.0, kd 0.8, score 554.98, the
      best so far). The oval finished 20 of 20 runs with max_error 0.014. The s-bend
      finished 9 of 20 with max_error 0.053 and a mean finish time of 2.56 s, well
      inside the 3 s limit. The slalom still finished 0 of 20, with max_error 0.0613
      and one line-loss event per run. Reducing speed from 1.2 to 1.1 therefore did
      not clear the slalom. Its max_error is still at or above 0.06 and its line-loss
      count did not drop, so speed is no longer the binding lever there. rms_error
      stays low (0.006 to 0.017), so average tracking is fine and the slalom failures
      are edge excursions.


      The Evaluator''s requested rule applies: keep base_speed at 1.1 and change geometry
      if the slalom still ends off track. I change only geometry.sensor_positions,
      widening the array from x = ±0.024 m to x = -0.03, -0.015, 0, 0.015, 0.03 m.
      Y stays at 0.04 m, and sensor_size (0.012), sensor_weights [-2,-1,0,1,2], kp
      3.0, ki 0, kd 0.8, base_speed 1.1, line_loss ''last_direction'', and the body
      and wheel geometry are all unchanged. Weights are kept because the signal is
      a weighted average, so its scale is unchanged. The wider spread gives the outer
      sensors more lead over the tape at the edge, so the controller should see the
      line sooner in the slalom''s sharp alternating bends.


      Expected result: slalom max_error below 0.06, fewer slalom line-loss events
      (toward 0.5 or less) and some slalom finishes. The oval should stay near 2.1
      s and at or near full completion. Risk: a wider spread may make the signal noisier
      on straights, which could raise steering_oscillation (currently 0.20 to 0.37).
      Next measurements: slalom max_error and line_loss_events, s-bend completion_time,
      and oval completion_time and steering_oscillation. If the slalom still fails
      with the wider spread, the next lever is controller.kd (0.9) or kp, not further
      speed reduction.


      - [Open this output](iteration-5/entity0/versions/c3e17d4c181a4f3db3de0c09440f112a/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-ea285647918f396a/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-872e5de3a5980e09/payload.json)'
  - id: entityR1
    label: 'Approve: slower speed'
    notes: 'Approved the single-parameter base_speed 1.2 to 1.1 change because only
      one run remains and a revision would leave no race. It rests on iteration 3
      telemetry: the slalom max_error was 0.064 and the s-bend 0.054, so speed is
      the lever to test.


      ### Feedback


      Approved because one action run remains and a revise round would leave no run
      for the race. The candidate differs from the iteration 3 best (score 517.2)
      only in controller.base_speed, 1.2 to 1.1. kp 3.0, kd 0.8, ki 0, line_loss ''last_direction''
      and geometry are unchanged. Evidence from iteration 3: the oval finished 19
      of 20 runs with max_error 0.021. The s-bend finished 6 of 20 with max_error
      0.054, and the slalom finished 0 of 20 with max_error 0.064 and one line-loss
      event per run. rms_error stayed low (0.008 to 0.019), so the failures are edge
      excursions on bends, not poor average tracking. steering_oscillation was 0.37
      on the s-bend, 0.26 on the oval and 0.20 on the slalom. The kd rule has already
      been applied (kd 0.8). The remaining lever is speed, and the candidate is a
      one-parameter test of it. I make no prediction of how this candidate will perform.


      How to use the telemetry in the next iteration. If the slalom max_error falls
      below 0.06 and its line_loss_events drop toward 0.5 or less, speed was the limit,
      so hold base_speed near 1.1. If the slalom still ends off track at 1.1, the
      next change is sensor geometry: widen the sensor spread to x near plus or minus
      0.03 m, keeping the other fields fixed. If s-bend completion_time rises above
      3 s, do not raise base_speed again, because the time limit is then binding.


      ### Requested changes


      - If the slalom still ends off track with max_error at or above 0.06 at base_speed
      1.1, keep controller.base_speed at 1.1 and change geometry.sensor_positions
      to a wider spread (x near -0.03, -0.015, 0, 0.015, 0.03 m), since iteration
      3 slalom max_error was 0.064 and the sensor spread is untested.

      - If slalom and s-bend max_error drop below 0.06 at base_speed 1.1 but s-bend
      completion_time exceeds 3 s, hold controller.base_speed at 1.1 or move it to
      1.15, not lower, since iteration 3 s-bend mean finish time was 2.56 s at base_speed
      1.2.

      - If steering_oscillation remains near 0.37 on the s-bend with kd 0.8, do not
      raise kd further without a race result; test controller.kd 0.9 only after speed
      and geometry have been isolated.


      - [Open this output](iteration-4/entityR1/versions/1864b1102e734e83bda2358c3725ff2a/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/c47c7908c5324ddcaeaa19a0bab42451/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-b397f190db90e646/payload.json)'
