overrides:
  entities:
  - id: entity0
    label: Iter 7 best, resubmitted
    notes: 'Unchanged resubmission of the iteration 7 best (688.5), the only design
      the Evaluator approved, since no revision could be raced this iteration. Its
      oval and s-bend both finished 20 of 20, and the slalom is still 0 of 20 at max_error
      0.0618.


      ### Rationale


      Iteration 9''s Evaluator approved an exact resubmission of the iteration 7 best
      (688.5), and that is the only design it approved. Its feedback says no model
      actions remain for a revision, so any change would be unreviewed and could not
      race. I therefore resubmit the approved design unchanged: kp 2.8, kd 0.9, ki
      0, base_speed 1.1, sensor_weights [-2,-1,0,1,2], line_loss ''last_direction'',
      sensor_size 0.012, and the iteration 4 spread (x = -0.024, -0.012, 0, 0.012,
      0.024 m at y = 0.04 m). Body, wheel and mass values are unchanged. Evidence:
      this design gave oval 20/20, s-bend 20/20 and slalom 0/20 (max_error 0.0618,
      1.05 line-loss events per run). Speed, spread, kd, kp and sensor_size have each
      been tested with the slalom max_error held between 0.061 and 0.064. Iteration
      8 (sensor_size 0.016) and iteration 5 (wider spread) both lowered the score,
      so they are ruled out. Expected result: about 688 on the development tracks.
      The slalom is still the blocker. The hypotheses for the next iteration are that
      a forward sensor offset (y 0.04 to 0.06) or sensor_size 0.008 would sharpen
      slalom edge detection, and that ki or sensor_weights scale are untested. The
      requested measurements are slalom max_error and line_loss_events, which would
      show whether a new lever helps, plus s-bend and oval completion to confirm the
      baseline holds.


      - [Open this output](iteration-10/entity0/versions/81c138e30de34100be84d1ef3834aa4a/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-8fa1b66ce563681d/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-838d6107f6de8ef7/payload.json)'
  - id: entityR1
    label: Approve iter-7 best
    notes: 'No revision can run this iteration, so I approved the 688.5 iteration
      7 design unchanged to secure a scored race. Feedback targets the untested slalom
      levers (sensor y offset, sensor_size 0.008) for the final iteration, based on
      the 0-of-20 slalom results across iterations 0 to 8.


      ### Feedback


      Approved. This is the only review round left in this iteration (remaining_budget
      shows one run, and no model actions remain for a revision), so a revise decision
      could not race. The candidate is the iteration 7 best (688.5) resubmitted unchanged:
      kp 2.8, kd 0.9, ki 0, base_speed 1.1, sensor_weights [-2,-1,0,1,2], line_loss
      ''last_direction'', sensor_size 0.012, and the iteration 4 spread (x = -0.024
      to 0.024 m at y = 0.04 m). Every field is inside its contract range. Iteration
      7 is the only raced design that has finished the oval and s-bend 20 of 20, so
      this is the baseline to beat. I make no prediction of its performance on this
      race.


      What the earlier evidence shows: the slalom has finished 0 of 20 in every iteration.
      Its max_error has stayed between 0.061 and 0.064 across base_speed (iteration
      4), sensor spread (iteration 5), kd (iteration 6), kp (iteration 7) and sensor_size
      0.016 (iteration 8, which also cut s-bend completion to 13 of 20 and scored
      610.4). rms_error is low on every track, so the slalom losses are edge excursions,
      not poor average tracking.


      For the next iteration, the Optimizer should change one untested lever at a
      time from this design, and only if the race shows the slalom still off track.
      Keep the oval and s-bend at 20 of 20 as the constraint. Revert to this design
      if a change drops either below that.


      ### Requested changes


      - If slalom max_error is still at or above 0.06 with line_loss_events near 1,
      test a forward sensor offset: set geometry.sensor_positions y from 0.04 to 0.06
      for all five sensors, keeping the iteration 7 x values and sensor_weights, because
      the y position has never been tested and gives more lead time on the tape.

      - Alternatively, or if the forward offset fails, test geometry.sensor_size 0.008
      with the iteration 7 spread, since the 0.016 footprint hurt the s-bend (iteration
      8, 13 of 20) and the smaller footprint is the remaining edge-sharpness test.

      - Keep geometry.sensor_positions x at -0.024 to 0.024 m and base_speed at 1.1.
      Iteration 5 widened the spread to ±0.03 m and cut the score from 555.0 to 513.3,
      so do not return to the wider array without new evidence.


      - [Open this output](iteration-10/entityR1/versions/12d6c669c67845f8a872562f8f40005d/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/81c138e30de34100be84d1ef3834aa4a/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-838d6107f6de8ef7/payload.json)'
