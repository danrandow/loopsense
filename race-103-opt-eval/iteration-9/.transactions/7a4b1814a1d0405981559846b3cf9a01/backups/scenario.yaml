map:
  id: race-103-opt-eval
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Revert sensor 0.016 to
    notes: 'Resubmits the iteration 7 best (688.5) with sensor_size reverted from
      0.016, which cut s-bend completion to 13 of 20 in iteration 8 (score 610.4).
      The slalom is still 0 of 20 at max_error about 0.062, so no untested lever is
      added to the final scored race.


      ### Rationale


      Iteration 8 raced sensor_size 0.016 on top of the iteration 7 best. It scored
      610.4, below the 688.5 best. The oval held at 20 of 20, but s-bend completion
      fell from 20 of 20 to 13 of 20, with 7 off-track endings and steering_oscillation
      at 0.38. The slalom stayed at 0 of 20 with max_error 0.0625 and 1.05 line-loss
      events. The Evaluator''s own rule applies: the s-bend fell below 18 of 20, so
      sensor_size reverts to 0.012. The larger footprint smooths the s-bend signal
      and costs it completions without fixing the slalom.


      The slalom is still blocked. Speed, sensor spread, kd, kp and sensor_size have
      each been tried, and max_error has stayed at 0.061 to 0.064. rms_error is low
      on every track, so the slalom losses are edge excursions on its alternating
      bends. With one action run left, I will not risk an untested slalom lever (sensor_size
      0.008, ki, or sensor weights) on the scored race. I resubmit the iteration 7
      best unchanged: kp 2.8, kd 0.9, ki 0, base_speed 1.1, the iteration 4 spread
      (x = -0.024 to 0.024 m), sensor_size 0.012, sensor_weights [-2,-1,0,1,2] and
      line_loss ''last_direction''. Expected result: about 688 on the development
      tracks, with oval 20 of 20, s-bend 20 of 20 and slalom 0 of 20.


      Hypotheses for the next iteration: the slalom needs a lever other than speed,
      spread, kd, kp or sensor_size, such as ki, a sensor y offset, or the sensor_weights
      scale. The measurements requested are the slalom max_error and line_loss_events,
      which are the signals that would show whether a new lever helps.


      - [Open this output](iteration-9/entity0/versions/d3934e6079d94c28be26ccdf500de88a/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-51e5ed876e3e9a12/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-b24a7439a3f18a84/payload.json)'
  - id: entityR1
    label: 'Approve: sensor_size'
    notes: 'Approved as the only route to a scored race with one run left: the candidate
      is the iteration 7 best with sensor_size raised from 0.012 to 0.016, the one
      untested lever after speed, spread, kd and kp failed to clear the slalom (max_error
      0.061 to 0.064, 0 of 20 finishes). Feedback sets conditional revert and follow-up
      rules based on s-bend and oval completion.


      ### Feedback


      Approved because one action run remains. A revise round would need a revision,
      a review and then a race, so approving is the only way this iteration gets a
      scored race. Nothing here predicts how the candidate will perform.


      What the candidate changes: geometry.sensor_size goes from 0.012 to 0.016 m.
      Everything else matches the iteration 7 best (score 688.5): kp 2.8, kd 0.9,
      ki 0, base_speed 1.1, the iteration 4 spread (x = -0.024 to 0.024 m), sensor_weights
      [-2,-1,0,1,2] and line_loss ''last_direction''. The value 0.016 is an allowed
      option.


      Earlier evidence behind the change: the slalom has finished 0 of 20 in every
      iteration. Its max_error has stayed at 0.061 to 0.064 across speed (iteration
      4), sensor spread (iteration 5), kd (iteration 6) and kp (iteration 7). rms_error
      is low on every track (0.006 to 0.018), so the slalom losses are edge excursions,
      not poor average tracking. Sensor_size is the one lever not yet tried, and it
      changes edge detection without changing the signal scale. The rationale''s geometry
      point checks out: with a 0.016 m footprint at x = 0.024 m, the sensor starts
      to read tape when the tape edge is about 0.02 m away.


      Risk to weigh: the larger footprint averages over more of the tape edge, so
      the signal may be smoother and less sharp on the s-bend, which is the track
      most likely to lose completions. The oval and s-bend are the tracks to protect.


      How the next iteration should read the race: if s-bend completion falls below
      18 of 20 or the oval completion drops below 20 of 20, revert sensor_size to
      0.012, since that is the best raced design (688.5). If the slalom max_error
      is still at or above 0.06 with sensor_size 0.016 and the oval and s-bend hold,
      the next test is sensor_size 0.008 with the same spread, to check whether sharper
      edge detection helps. If slalom max_error falls below 0.06 and line_loss_events
      drop toward 0.5, keep sensor_size 0.016 and consider a small further step.


      ### Requested changes


      - If s-bend completion falls below 18 of 20 or the oval completion drops below
      20 of 20 with sensor_size 0.016, revert geometry.sensor_size to 0.012, the iteration
      7 best (688.5), keeping kp 2.8, kd 0.9 and base_speed 1.1.

      - If the slalom max_error is still at or above 0.06 with sensor_size 0.016 while
      the oval and s-bend hold, test geometry.sensor_size 0.008 with the iteration
      4 spread, since the slalom has not responded to speed, spread, kd or kp changes
      and edge sharpness is the untested lever.

      - If slalom max_error falls below 0.06 and line_loss_events drop toward 0.5
      with sensor_size 0.016, keep sensor_size 0.016 and hold base_speed at 1.1 and
      the iteration 4 spread, since iteration 5 showed the wider spread hurt the s-bend
      and oval.


      - [Open this output](iteration-8/entityR1/versions/df5bf50de3cd42a39208d2a3ccfcabc3/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/e0aad9a1e1a643e5b8800f76975001f5/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-838d6107f6de8ef7/payload.json)'
