map:
  id: race-103-opt-eval
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Revert sensor 0.016 to
    notes: 'Resubmits the iteration 7 best (688.5) with sensor_size reverted from
      0.016, which cut s-bend completion to 13 of 20 in iteration 8 (score 610.4).
      The slalom is still 0 of 20 at max_error about 0.062, so no untested lever is
      added to the final scored race.


      ### Rationale


      Iteration 8 raced sensor_size 0.016 on top of the iteration 7 best. It scored
      610.4, below the 688.5 best. The oval held at 20 of 20, but s-bend completion
      fell from 20 of 20 to 13 of 20, with 7 off-track endings and steering_oscillation
      at 0.38. The slalom stayed at 0 of 20 with max_error 0.0625 and 1.05 line-loss
      events. The Evaluator''s own rule applies: the s-bend fell below 18 of 20, so
      sensor_size reverts to 0.012. The larger footprint smooths the s-bend signal
      and costs it completions without fixing the slalom.


      The slalom is still blocked. Speed, sensor spread, kd, kp and sensor_size have
      each been tried, and max_error has stayed at 0.061 to 0.064. rms_error is low
      on every track, so the slalom losses are edge excursions on its alternating
      bends. With one action run left, I will not risk an untested slalom lever (sensor_size
      0.008, ki, or sensor weights) on the scored race. I resubmit the iteration 7
      best unchanged: kp 2.8, kd 0.9, ki 0, base_speed 1.1, the iteration 4 spread
      (x = -0.024 to 0.024 m), sensor_size 0.012, sensor_weights [-2,-1,0,1,2] and
      line_loss ''last_direction''. Expected result: about 688 on the development
      tracks, with oval 20 of 20, s-bend 20 of 20 and slalom 0 of 20.


      Hypotheses for the next iteration: the slalom needs a lever other than speed,
      spread, kd, kp or sensor_size, such as ki, a sensor y offset, or the sensor_weights
      scale. The measurements requested are the slalom max_error and line_loss_events,
      which are the signals that would show whether a new lever helps.


      - [Open this output](iteration-9/entity0/versions/d3934e6079d94c28be26ccdf500de88a/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-51e5ed876e3e9a12/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-b24a7439a3f18a84/payload.json)'
  - id: entityR1
    label: Approve iter-7 best
    notes: 'Approved the iteration 7 best (score 688.5) unchanged because no model
      actions remain for a revise round. Feedback names the untested slalom levers
      (sensor_size 0.008, forward sensor y offset) to try next, based on iterations
      5, 7 and 8 telemetry.


      ### Feedback


      Approved because no model actions remain this iteration, so a revision could
      not be reviewed and then raced. The candidate matches the iteration 7 best (688.5)
      on every field: kp 2.8, kd 0.9, ki 0, base_speed 1.1, sensor_weights [-2,-1,0,1,2],
      line_loss ''last_direction'', sensor_size 0.012 and the iteration 4 spread (x
      = -0.024 to 0.024 m). All values are inside the contract. This nothing-new resubmission
      is the only way this iteration gets a scored race. Nothing here predicts how
      it will perform.


      Evidence behind the approval: iteration 7 was the best raced design. Its oval
      finished 20 of 20 and its s-bend 20 of 20. Its slalom still finished 0 of 20,
      with max_error 0.0618 and 1.05 line-loss events per run. Iteration 8, which
      changed only sensor_size to 0.016, fell to 610.4, with s-bend completion dropping
      to 13 of 20 and the slalom unchanged. So the wider footprint is ruled out as
      a slalom fix. Speed, spread, kd, kp and sensor_size have each been tested, and
      slalom max_error has stayed between 0.061 and 0.064.


      What to do with the next iteration, depending on the race. Test one untested
      slalom lever at a time, starting from this design. Hold the oval and s-bend
      completions (20 of 20 and 20 of 20 at iteration 7) as the constraint. If the
      slalom max_error is still at or above 0.06 and its line_loss_events stay near
      1, try the remaining untested options below.


      ### Requested changes


      - If the slalom max_error is still at or above 0.06 with line_loss_events near
      1, test geometry.sensor_size 0.008 with the iteration 7 spread and the other
      fields held. The 0.016 footprint was tested in iteration 8 and hurt the s-bend
      (13 of 20), so the smaller footprint is the remaining edge-sharpness test.

      - If the slalom still fails with sensor_size 0.012 or 0.008, test a forward
      sensor offset by changing geometry.sensor_positions y from 0.04 to 0.06 for
      all sensors, keeping the x values and sensor_weights. Forward position gives
      the robot more lead time on the tape, and the y position has not been tested
      in any iteration. Spread changes (iteration 5) and sensor_size changes (iteration
      8) did not clear the slalom.

      - Keep geometry.sensor_positions at x = -0.024, -0.012, 0, 0.012, 0.024 m and
      base_speed at 1.1 unless a race shows a clear reason to change them. Iteration
      5 widened the spread to ±0.03 m and cut the score from 555.0 to 513.3, so do
      not return to the wider array without new evidence.


      - [Open this output](iteration-9/entityR1/versions/7a4b1814a1d0405981559846b3cf9a01/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/d3934e6079d94c28be26ccdf500de88a/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-b24a7439a3f18a84/payload.json)'
