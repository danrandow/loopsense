map:
  id: race-214-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: kp 2.2 on iter-8 base
    notes: 'Keeps the best-scoring iteration 8 design (473.6) and raises kp from 2.0
      to 2.2 with kd 1.5 as damping, aiming to lift s-bend finishes. Evidence: kp
      2.4 with kd 1.0 overshot, and kd 2.0 gave no change over kd 1.5.


      ### Rationale


      Evidence: iteration 8 (kp 2.0, kd 1.5, base_speed 0.9, sensors at y=0.08, 16
      mm footprint, mass 0.6 kg) is the best design so far at 473.6. Its oval finishes
      18 of 20 (mean 1.91 s), its s-bend finishes 6 of 20 (progress 0.74), and its
      slalom always ends off track at progress about 0.15. Each finished run is worth
      roughly 900 points, so converting s-bend runs is the main lever. Iteration 7
      (kp 2.4, kd 1.0) overshot on the s-bend and scored 431. Iteration 9 (base_speed
      0.85) lost s-bend finishes and scored 429, so 0.9 stays. Iteration 10 (kd 2.0)
      returned metrics identical to iteration 8, so kd above 1.5 showed no measurable
      effect and the kd 1.5 point is the best-supported. Sensors are already at the
      forward limit (y=0.08), and the off-track floor of 0.06 m cannot be widened
      by body width.


      Change: kp raised from 2.0 to 2.2, with kd held at 1.5 and everything else unchanged
      from iteration 8. The kd 1.5 damping should absorb part of the extra proportional
      gain that overshot at kp 2.4 with kd 1.0. The step is small, so it tests whether
      a firmer correction helps the s-bend without the oscillation seen at 2.4. At
      a full edge signal of 2, turn is 4.4, giving about 1540 PWM of differential,
      which stays below the base PWM of about 1843 at speed 0.9, so the wheels do
      not reverse.


      Expected result: oval completion stays at about 90 percent or better, s-bend
      finishes hold at 6 or more of 20, and steering oscillation stays near 0.37.
      Score target is about 475 to 520. Main risk: kp 2.2 overshoots on the s-bend
      as kp 2.4 did, in which case the revision should revert to kp 2.0.


      - [Open this output](iteration-11/entity0/versions/dc57d36a1371440b8362ac9779ae876a/payload.json)

      - Based on: [entityR2A](iteration-11/entityR2A/versions/carried-42a1afaa25cdf85a/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critiques the kp 2.2 draft as an untested point in a final iteration with
      no later race to correct it. Evidence: kp 2.0 vs 2.4 s-bend finishes (4/20 vs
      1/20) are near seed noise, and iteration 10 kd 2.0 metrics are identical to
      iteration 8.


      - [Open this output](iteration-11/entityC1/versions/f4b383e585224eb29fab4a14c24bd4cd/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/dc57d36a1371440b8362ac9779ae876a/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-42a1afaa25cdf85a/payload.json)'
  - id: entity1
    label: Verified best, unchanged
    notes: 'Resubmits the raced best design (base 1.6, kp 2.5, ki 0.5, kd 0.8, scored
      473.6 in iteration 8 and identically in iteration 10). The draft''s kp 2.2 and
      kd 1.5 values were never raced, so I rejected them as untested for the final
      unseen-track run.


      ### Rationale


      Decision: I reject the draft''s untested change and resubmit the best verified
      design, unchanged. This is the final iteration, so no later race can correct
      a design that is worse than its record.


      Evidence check. The outcome table is the authoritative record. The draft''s
      entity0 values (base 0.9, kp 2.0, kd 1.5, sensors at y 0.08, mass 0.6, body
      length 0.16) were never raced, and the draft''s claim that iteration 8 used
      those values is wrong. The best raced design is base 1.6, kp 2.5, ki 0.5, kd
      0.8, 16 mm sensors at x = -0.04 to +0.04 (0.02 m pitch) at y = 0.04, mass 0.8,
      body 0.18 x 0.12 m, last_direction line loss. It scored 473.60 in iteration
      8, and the identical design re-raced in iteration 10 returned the same metrics
      to four decimal places. Its per-track results are oval 18/20 finished (mean
      891), s-bend 6/20 (mean 466), slalom 0/20 (mean 63).


      What I accepted from the critique. (a) The final iteration has no later race,
      so an untested point carries the full risk. (b) The draft''s wheel-limit argument
      counted only the proportional term, and the derivative term was never bounded.
      (c) The kp 2.2 step is an untested variant between two points whose difference
      (4/20 vs 1/20 s-bend finishes) is within seed noise, so it has no evidence that
      it helps.


      What I rejected. The kp 2.2 change on the draft''s base is not supported: no
      race exists at that combination, and the draft''s expected score (475 to 520)
      is an unsupported prediction. The kd 1.5 damping mechanism is also unproven,
      since the kd series (iterations 4 to 10) showed no reliable kd gain above 0.8,
      and iteration 9''s kd 0.9 change fell by 45 points.


      Hypotheses, labelled as such: the verified design should behave the same on
      the development tracks (score about 474, within seed noise of about 10 points).
      On the unseen track the s-bend-like failure mode is the main risk, and I cannot
      predict its transfer. Rejecting measurement: if the replayed development race
      differs from 473.6 by more than about 10 points, the difference comes from seed
      or track variation and not from a design change, so no change should be made
      on that basis.


      Slalom is not targeted. It has 0 finishes in every design, and nothing here
      changes that.


      - [Open this output](iteration-11/entity1/versions/7155bed7d8804c8fbdd7c6a4dc0ccc18/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/dc57d36a1371440b8362ac9779ae876a/payload.json),
      [entityC1](iteration-11/entityC1/versions/f4b383e585224eb29fab4a14c24bd4cd/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-42a1afaa25cdf85a/payload.json)'
  - id: entityC2
    label: Round-2 critique
    notes: 'Critiques the unchanged iteration-8 resubmission. Main points: the replay
      shows the simulator is deterministic, so the seed-noise reasoning and rejection
      rule are inconsistent; the kp 2.4 and sensor-limit claims are unsupported; and
      the ki 0.5 gain is mixed. Evidence is the outcome table.


      - [Open this output](iteration-11/entityC2/versions/e7b1a71b5b8b4b8292085e6728ffd9e1/payload.json)

      - Based on: [entity1](iteration-11/entity1/versions/7155bed7d8804c8fbdd7c6a4dc0ccc18/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-42a1afaa25cdf85a/payload.json)'
  - id: entity2
    label: Verified design, ki 0.4
    notes: 'Resubmits the raced best design (iteration 8, replayed in 10 at 473.60)
      with ki 0.4, as the outcome table records; the draft and critique cite ki 0.5,
      which was never raced. Chosen because the final iteration has no later race
      to correct an untested change.


      ### Rationale


      Decision: resubmit the best verified design unchanged, with one correction.
      The outcome table is the authoritative record, and it shows ki 0.4 for iterations
      8 and 10, not ki 0.5 as the draft and critique state. The design that scored
      473.60 and replayed identically in iteration 10 is therefore base 1.6, kp 2.5,
      ki 0.4, kd 0.8, last_direction line loss, with 16 mm sensors at x = -0.04 to
      +0.04 (0.02 m pitch) at y = 0.04, mass 0.8, body 0.18 x 0.12 m, wheel track
      0.12 m, wheel radius 0.03 m. Using ki 0.5 would race an untested point, and
      the final iteration has no later race to correct it.


      What I kept: the verified geometry and controller, and the last_direction line-loss
      rule. Per-track evidence: oval 18/20 finished (mean 891), s-bend 6/20 (mean
      466), slalom 0/20 (mean 63).


      What I rejected: the draft''s kp 2.2 and kd 1.5 changes, which have no race
      behind them. I also rejected the critique''s kp 2.4 claim, since no raced design
      uses that value. The critique''s point that the sensor row is at a forward limit
      is also incorrect, because the row sits at y 0.04 against a limit of 0.08, so
      I did not move the sensors.


      What I accepted from the critique: the final iteration cannot absorb an untested
      risk, and the ki 0.5 versus 0.4 discrepancy must be resolved against the record.
      I did not adopt the critique''s ki 0.5 either, because the record shows that
      value was not raced.


      Expectation: the development replay should return about 473.6, matching iteration
      10. Any replay differing from that points to a simulator or submission change,
      not to seed noise, since the simulator was deterministic on replay. Oval finishes
      should stay near 18 of 20. The unseen track is uncertain, and slalom remains
      unaddressed (0 finishes in every design).


      - [Open this output](iteration-11/entity2/versions/4a16912a74c84cf68e8b360249e42ed6/payload.json)

      - Based on: [entity1](iteration-11/entity1/versions/7155bed7d8804c8fbdd7c6a4dc0ccc18/payload.json),
