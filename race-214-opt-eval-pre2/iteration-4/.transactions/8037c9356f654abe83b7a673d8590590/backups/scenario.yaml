map:
  id: race-214-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Slower, more damped draft
    notes: 'Lower base speed (1.0), kp 2.0, kd 1.0, ki 0 and a 5-sensor 16 mm array
      at y=0.05 m, aimed at fewer line losses and longer progress. Based on all 60
      trials going off track at progress 0.11-0.16 with max_error just over 0.06 m,
      and on the score being driven by progress.


      ### Rationale


      Evidence: all 60 development trials on the three tracks went off track with
      zero completions. Progress was only 0.11 to 0.16, each run had one line-loss
      event, and max_error (0.061 to 0.068 m) passed the 0.06 m off-track floor, while
      rms_error stayed near 0.03 m and steering oscillation was low (0.07 to 0.16).
      The robot tracks reasonably on average, then makes one large excursion, loses
      the tape, and the 0.35-throttle last_direction search carries it off. Base speed
      did not change the outcome: 1.2 to 1.8 all gave similar progress, so speed is
      not the main cause. The score is dominated by progress (250*progress plus a
      progress-weighted term), so staying on the line longer matters more than finish
      time, which is out of reach at this stage.


      Changes: (1) Base speed lowered from 1.2 to 1.0 to reduce lateral drift in the
      fast bends. Even this is a modest cut, since a clean run at a slower speed is
      worth more than a fast run that leaves the track. (2) kp set to 2.0 and kd raised
      to 1.0 for stronger damping of overshoot at the edge. With edge signal of 2,
      turn is 4, which gives about 1400 PWM of differential, below the 2047 base PWM
      at speed 1.0, so the wheels do not reverse. (3) ki set to 0 to remove integrator
      windup on the bends. (4) Sensors moved to y = 0.05 m, 16 mm footprint kept,
      spacing 0.02 m across x = -0.04 to +0.04, so the array covers the tape at larger
      offsets while staying close to the axle for quicker reaction. (5) Mass reduced
      to 0.6 kg to lower yaw inertia so the body turns more readily. Geometry otherwise
      unchanged; line_loss stays last_direction.


      Expected result: fewer line-loss events, max_error under 0.06 m on most seeds,
      and progress above 0.3 on the development tracks. Completion remains unlikely.
      The main risk is that the lower speed and extra damping slow the response enough
      to hurt rms_error; the revision round should check this.


      - [Open this output](iteration-4/entity0/versions/e2d3961c8f4c4967947079667df6b0ac/payload.json)

      - Based on: [entityR2A](iteration-4/entityR2A/versions/carried-22596f928a458be0/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Round-1 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-4/entityC1/versions/d236309136ce4d55bac623307dacbff2/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/e2d3961c8f4c4967947079667df6b0ac/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-22596f928a458be0/payload.json)'
  - id: entity1
    label: 'Revised: span, kp matched'
    notes: 'Keeps the wider 0.03 m sensor pitch and restores kp to 3.5 so effective
      steering gain matches the raced iteration 2, rejecting the critique''s gap concern.
      Speed is 1.5 (not 1.2), with ki 0.1 and kd 0.3, and the untested mass, body
      and y changes are reverted to isolate the sensor-span effect.


      ### Rationale


      Response to the round-1 critique. I accept most of it and partly reject one
      point.


      Evidence: 60 trials of the raced iteration-2 design (16 mm sensors, x = -0.04..+0.04
      at 0.02 m pitch, y = 0.04, kp 2.5, kd 0.2, ki 0.2, base 1.6, body 0.18, mass
      0.8) all went off track at progress 0.11 to 0.16, with one line-loss event each
      and max_error 0.061 to 0.068 m. rms_error stayed near 0.03 m and steering oscillation
      was low (0.07 to 0.16). The failures are at the excursion peak, so the robot
      is under-correcting there, not oscillating. Iteration 0 (kp 3.0, 12 mm sensors)
      failed the same way, so the failure has persisted across a range of gains. The
      data does not isolate the cause.


      Accepted from the critique: (a) my draft''s kp cut to 2.0 reduced effective
      steering gain without evidence, so I restore it. Effective gain per metre scales
      as kp/spacing. Iteration 2 gave about 125 per m (2.5/0.02). Keeping that with
      0.03 m spacing needs kp near 3.75, so I use kp 3.5 as a slightly conservative
      match. (b) base_speed 1.2 cost too much progress, so I use 1.5, not 1.2. (c)
      The kd statement was wrong, and kd is now set explicitly to 0.3, a moderate
      value that avoids the unbounded 0.6 noise risk. (d) ki 0.02 is too small to
      cancel the fixed motor mismatch, so I raise it to 0.1 (integral maximum about
      0.2 turn, roughly 70 PWM). (e) The draft''s mass 0.7 kg, body_length 0.16 m
      and y 0.06 m changes had no evidence, so I restore mass 0.8, body_length 0.18
      and y 0.04 to isolate the sensor and gain changes.


      Rejected from the critique: I keep the wider span (-0.06..+0.06). The critique''s
      gap concern is weak: a 16 mm footprint at 30 mm pitch leaves 14 mm gaps, which
      is less than the 25 mm tape width, so the tape always covers at least one sensor.


      Changes relative to iteration 2, and why: sensor span widened and pitch raised
      to 0.03 m (line visible at larger offsets); kp 2.5 to 3.5 (matches iteration-2
      effective gain); kd 0.2 to 0.3; ki 0.2 to 0.1; base_speed 1.6 to 1.5. Geometry
      other than the sensor array is as raced.


      Hypotheses, not data: fewer line-loss events than iteration 2, max_error nearer
      0.06 m, and progress above 0.16. Completion remains uncertain at 1.5 base speed.
      Main risk: the wider span flattens the signal near centre, which could raise
      rms_error. Test: compare progress, line_loss_events and max_error on the s-bend
      track against iteration 2 to see whether the span change alone helps.


      - [Open this output](iteration-3/entity1/versions/312c73a5138a4c1d8ecd5cc6f38794ef/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/c40b7cf0d08c4df189cd096264d4aa6a/payload.json),
      [entityC1](iteration-3/entityC1/versions/2ff97fd5866046b1a9bf191d777fd565/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-22596f928a458be0/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Round-2 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-2/entityC2/versions/5b18716c0bb64fb1a11cd0feb10febd5/payload.json)

