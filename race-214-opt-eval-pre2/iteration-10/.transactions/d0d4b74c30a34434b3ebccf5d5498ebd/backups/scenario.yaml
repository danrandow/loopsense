  - id: entity2
    label: kd 0.9 test, ki 0.4 fixed
    notes: 'Iteration 8 (score 473.6, ki 0.4 per the outcome table) with kd raised
      to 0.9 alone. Adopt only if oval finishes are at least 17 of 20 and the score
      is at least 483.6; otherwise keep kd 0.8. The ki 0.5 figure in earlier notes
      is corrected to 0.4.


      ### Rationale


      Final design: iteration 8 with kd raised from 0.8 to 0.9. Everything else is
      unchanged.


      Correction to the base. The outcome table records iteration 8 as ki 0.4, not
      0.5 as the earlier rationale and critique state. I use ki 0.4 so the race differs
      from the best raced design (score 473.60) by kd alone. I do not raise ki, because
      the integral is only bounded at 2*ki and the ki effect is not isolated.


      What I kept from the critique. Point 3 is accepted: 0.9 is an interpolated point
      between the raced kd 0.8 (465 at ki 0.2, 473.6 at ki 0.4) and kd 1.0 (431 at
      ki 0.2), not a measured peak. The race tests whether the optimum lies between
      0.8 and 1.0. Point 4 is accepted: kd 1.0 lost most of its score on the s-bend,
      so s-bend control effort and steering oscillation are recorded and watched.
      Point 2 is accepted: the oval gate is applied first.


      What I changed in the rule. The critique''s conflicting rules are replaced with
      one ordered decision. (1) If oval finishes are below 17 of 20, reject kd 0.9.
      (2) Otherwise adopt kd 0.9 only if the score is at least 483.6, which is 10
      points above the base. (3) Otherwise, including any result inside the plus or
      minus 10 band, keep kd 0.8, the raced iteration 8 design. Within-band results
      are treated as no real change.


      What I did not change. Speed, sensor geometry, mass, body and line-loss handling
      stay as raced. The race is paired by seed and track with iteration 8, so the
      comparison is between matched disturbances.


      Expectation, stated as a hypothesis. Oval finishes stay at 17 or more of 20,
      s-bend finishes stay near 6 of 20 or better, and the score is about 470 to 490.
      The noise-bound estimate is assumed, not measured: about 630 PWM from kd and
      about 350 from ki, against a base of about 3276. Slalom is not expected to change,
      since it has 0 finishes in every design; its progress and max_error are still
      recorded in case the final track resembles it.


      - [Open this output](iteration-9/entity2/versions/4685ce3d2ade4f62942032904693c0a5/payload.json)

