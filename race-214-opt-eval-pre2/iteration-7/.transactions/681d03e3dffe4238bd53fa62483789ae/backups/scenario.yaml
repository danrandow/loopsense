map:
  id: race-214-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Sensors forward to y=0.08
    notes: 'Moves the sensor row from y=0.07 to the 0.08 m limit to see the line earlier,
      changing nothing else from the best race (356.6). The move from y=0.05 to 0.07
      was the largest gain so far, and the oval still finishes at 0.9 speed.


      ### Rationale


      Evidence: iteration 5 is the best design so far (356.57). Its oval track finished
      in 17 of 20 trials (mean 1.88 s), so the robot can complete the course within
      the 3 s limit at speed 0.9. The s-bend (progress 0.38) and slalom (progress
      0.12) still end off track, with max_error about 0.063 to 0.065 m just past the
      0.06 m floor and one line-loss event per run. Steering oscillation (0.16 to
      0.28) is moderate, so the failure is lateral excursion on the bends rather than
      jitter. The off-track limit is max(0.06, 0.0125 + body_width/4), which stays
      at 0.06 for every allowed body width, so geometry cannot widen it.


      The move from y = 0.05 to y = 0.07 m, together with the speed drop, gave the
      largest gain across iterations. The sensor row is now close to the forward limit
      of 0.08 m. Iteration 5 changed both the sensor row and the speed, so I cannot
      separate their effects. I keep the speed and controller gains fixed and move
      only the sensor row forward to y = 0.08 m. This tests whether more lead on the
      bends further reduces the s-bend and slalom excursions while the oval still
      finishes.


      Changes: (1) sensor row moved from y = 0.07 to 0.08 m, the top of the allowed
      range, for earlier sight of the line. (2) Everything else is unchanged from
      iteration 5: five sensors at x = -0.04 to +0.04 m in 0.02 m steps, 16 mm footprint,
      wheel track 0.12 m, wheel radius 0.03 m, body 0.16 x 0.12 m, mass 0.6 kg, base_speed
      0.9, kp 2.0, ki 0, kd 1.0, weights [-2,-1,0,1,2], last_direction line loss.


      Expected result: oval completion stays near 85 percent, and s-bend and slalom
      progress rises from 0.38 and 0.12 toward roughly 0.45 and 0.2. The score should
      improve modestly, to about 370 to 420. The main risk is that the extra lead
      adds phase error and raises rms_error or oscillation, which the revision rounds
      should check.


      - [Open this output](iteration-6/entity0/versions/b4f77e376bfc4c5881650a517e15b3ed/payload.json)

      - Based on: [entityR2A](iteration-6/entityR2A/versions/carried-fb8b4d8a0529af11/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critique of the draft that moves the sensor row from 0.07 to 0.08 m. The
      main points are that a 1 cm shift is about one control step at this speed, so
      the predicted gain is implausible, and that the forward move does not affect
      the lateral line-loss threshold. The critique also asks for a diagnostic test
      of the transient and states the required hypothesis labels.


      - [Open this output](iteration-6/entityC1/versions/e8323781b06741f7b4ed23758f23c775/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/b4f77e376bfc4c5881650a517e15b3ed/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-fb8b4d8a0529af11/payload.json)'
  - id: entity1
    label: kd 0.8 single-variable
    notes: 'Keeps the iteration 5 design (score 356.57) and changes only kd from 0.6
      to 0.8, extending the monotonic kd trend seen across iterations 2, 4 and 5.
      Rejects the critique''s 1 cm sensor shift as too small to detect and corrects
      the draft''s mislabelled baseline.


      ### Rationale


      Response to the round-1 critique. I partly accept it and reject its main proposal.


      Evidence check. The outcome table is the authoritative record. Iteration 5 (score
      356.57) ran base 1.6, kp 2.5, ki 0.2, kd 0.6, 16 mm sensors at x = -0.04..+0.04
      (0.02 m pitch), y = 0.04, mass 0.8, body 0.18 x 0.12 m. My draft (entity0) describes
      iteration 5 as base 0.9, kp 2.0, kd 1.0, ki 0, y 0.08, mass 0.6 and body 0.16.
      Those values are the draft''s own untested proposal, not the raced design, so
      its ''unchanged from iteration 5'' claim is wrong. I use the outcome table.


      The clean trend in the raced data is kd alone. Iteration 2 (kd 0.2) scored 52.11,
      iteration 4 (kd 0.4) scored 220.09, and iteration 5 (kd 0.6) scored 356.57.
      Each step changed only kd, and oval finish rate rose from 0 to 30 to 85 percent.
      Steering oscillation rose with kd (0.07 to 0.27 to 0.25 on oval, 0.28 on s-bend),
      but scores still rose. The data therefore favour damping over the noise-amplification
      reading in the critique.


      Accepted from the critique: (a) the draft bundled too many changes, so the next
      race should move one controller variable; (b) the draft''s kp cut and ki removal
      lack support, so I keep kp 2.5 and ki 0.2; (c) the draft''s mislabelled baseline
      should be corrected, as above.


      Rejected from the critique: (a) the 1 cm sensor shift (y 0.07 to 0.08) is too
      small to test over 20 trials per track and is not the most informative single
      change, so I drop it; (b) testing kd alone at 0.6 is already done (iteration
      5), so I extend the kd trend instead.


      Change: kd 0.6 to 0.8, and nothing else. Geometry, base_speed, kp, ki and line_loss
      are exactly as iteration 5, so any score change is attributable to kd.


      Expected results (hypotheses, not data): oval finish rate holds at or above
      85 percent, and s-bend and slalom progress rise above 0.38 and 0.12. Main risk:
      steering oscillation keeps rising and adds control effort or rms_error, pushing
      the failing tracks off the line earlier. Decision rule for the next round: if
      the score exceeds 356.57, kd 0.8 is the new base; if it falls, kd 0.6 is the
      ceiling and the next single-variable test should be the motor-mismatch offset
      via ki.


      - [Open this output](iteration-6/entity1/versions/de228c4cc645468485e1f99eda10bfe8/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/b4f77e376bfc4c5881650a517e15b3ed/payload.json),
      [entityC1](iteration-6/entityC1/versions/e8323781b06741f7b4ed23758f23c775/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-fb8b4d8a0529af11/payload.json)'
  - id: entityC2
    label: Round-2 critique of kd
    notes: 'Critiques the kd 0.6 to 0.8 revision: the diminishing kd gain, the slalom
      progress drop from 0.173 to 0.120 that the rationale does not address, and a
      decision rule that does not check per-track results. Evidence is the outcome
      table for iterations 2, 4 and 5.


      - [Open this output](iteration-6/entityC2/versions/6def9ffec0fd4f2c9a6bbdb91709ae58/payload.json)

      - Based on: [entity1](iteration-6/entity1/versions/de228c4cc645468485e1f99eda10bfe8/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-fb8b4d8a0529af11/payload.json)'
  - id: entity2
    label: kd 0.8, one-factor step
    notes: 'Single change from the best raced design (kd 0.6, score 356.57) to kd
      0.8, with per-track acceptance limits added because slalom progress fell as
      kd rose. The critique''s noise estimate (about 560 PWM, below base PWM) and
      the oscillation plateau from the 0.4 to 0.6 data are the basis for the risk
      statement.


      ### Rationale


      Final design: kd 0.8, with every other value as in the raced iteration-5 design.
      The critique is partly accepted and the one-factor test is kept.


      Evidence. The raced iteration-5 design (kd 0.6) scored 356.57, the best so far.
      Holding geometry, base_speed, kp, ki and line_loss fixed while kd moved 0.2
      to 0.4 to 0.6 gave scores of 52.11, 220.09 and 356.57. Oval finish rate rose
      0, 30, 85 percent. Between kd 0.4 and 0.6, oval steering oscillation fell slightly
      (0.265 to 0.253) and control effort fell (7.6 to 5.7). The critique is right
      that the gain is diminishing (+168, then +136), so extrapolating to 0.8 does
      not establish a further rise.


      Accepted from the critique: (a) Per-track acceptance is needed. Slalom progress
      fell from 0.173 at kd 0.4 to 0.120 at kd 0.6, so a higher total score could
      hide a slalom loss. (b) The oscillation risk should be stated from the data:
      the rise was sharp from 0.2 to 0.4 and has plateaued or fallen since. (c) Noise
      bound: at the assumed signal-rate noise of about 2 units/s, kd 0.8 gives about
      1.6 turn, about 560 PWM. This is an assumption, not a measurement, and it is
      below base PWM of about 3276. (d) The non-oval tracks still end at max_error
      of about 0.065 m with one line-loss event each, and kd alone does not address
      that mechanism. I do not claim kd fixes those tracks.


      Rejected from the critique: I do not switch line_loss mode or change kp, ki
      or geometry in this race. Those are separate factors and would break the one-factor
      test. Line-loss recovery is the next candidate if kd 0.8 does not help the non-oval
      tracks.


      Decision rule (per track, not total score alone). Accept kd 0.8 as the new base
      only if all three hold: oval finish rate is at least 85 percent with oval mean
      score at least 863; s-bend progress is above 0.379; slalom progress is at least
      0.12. If the total rises but slalom progress falls below 0.12, treat the result
      as mixed and keep kd 0.6 as the base. If oval finish rate falls below 85 percent
      or oscillation rises enough to hurt the oval, kd 0.6 is the ceiling and the
      next single-variable test is line-loss recovery.


      Expected results (hypotheses, not data): oval finish rate holds at or above
      85 percent; s-bend progress is at or above about 0.38; slalom progress is at
      or above 0.12. A flat result is plausible and would not clearly separate kd
      0.6 from 0.8 within seed noise. Completion on s-bend and slalom remains unlikely
      at this speed.


      - [Open this output](iteration-6/entity2/versions/2333eb3a0c374f98b18f3434f9051db7/payload.json)

      - Based on: [entity1](iteration-6/entity1/versions/de228c4cc645468485e1f99eda10bfe8/payload.json),
