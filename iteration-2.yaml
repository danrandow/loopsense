map:
  id: loopsense-iteration-2
  schema: v0.2
  title: Loopsense Agent Team
  scenario: 'Can a system without a continuous human close the verification gap by learning
    from how the world responds to its work?'
  inherits: base.yaml
  notes: |
    Skeleton created 2026-09-24 by Loopy under workflows/start-next-iteration.md (owner approved
    the direction and plan 2026-09-24). The scenario line is provisional; PM sets the actual
    iteration question.

    **Owner direction (2026-09-24):**
    - Use-case catalogue: representative problems not well solved by current agent harnesses,
      loop engineering or graph engineering — ground the work and identify groups who have those
      problems (potential ICPs to listen to).
    - Repository credibility: by the end of the iteration, the README tells the complete product
      story, explains the repository, and gives practical guidance for replicating or adapting
      LoopSense.
    - GTM is the primary market researcher / practitioner listener: actively seek the likely ICP
      and listen in their own words. Directions Dan sends GTM are raw leads to filter and test —
      not findings and not instructions bypassing PM; synthesized insights reach PM through
      entityR3.
    - Delivery investigates the central technical question — can we actually solve the
      verification gap, and what is the mechanism? Do not assume topology is the answer: a system
      without a continuous human must sense its environment, observe how participants respond to
      what it produces, interpret those responses and learn from them. Dan's seven sub-questions
      (which human-judgment functions the system could perform; where humans remain necessary;
      instrumentation a PM would need; what exists versus must be built; analytical tools;
      sense-making from natural, human and organizational complex systems; feeding insight back
      through the loops) are inputs to PM's framing, not a prescribed solution.
    - Routing: PM decides how to turn this into a coherent iteration question and aligned bet,
      bringing the proposed framing to Dan wherever owner approval is required. No downstream
      execution (Exec, Delivery, GTM) until that framing and required owner decisions are settled.
      Dan will normally give feedback between iterations, routed through Loopy to PM. This does
      not grant unrestricted autonomy; Dan retains approval over consequential decisions.

    **Owner decisions (2026-09-24, see decisions/2026-09-24-posting-gate-and-account.md):**
    - The evidence run may proceed at Low-Medium confidence; it need not wait for Medium.
    - @loopsense is confirmed as the posting account; the iteration-1 "account handle
      unconfirmed" flag is cleared as stale.

    **Owner answers at the checkpoint (2026-09-24 11:06 UTC, see
    decisions/2026-09-24-iteration-2-checkpoint-answers.md):**
    - The ten-post evidence run is sequenced AFTER Delivery's mechanism analysis (overrules the
      parallel call).
    - Root README: Delivery authors it under Dan's direction; public scope is everything needed
      for someone else to get Loopsense working, subject to our rules (standing rule 8 review
      before publication).
    - No strict stop framing: one failed test is evidence, not a claim-killer; if external
      evidence cannot be obtained, iteration 2 does other learning before it stops. PM revises
      the question (keep it short) and the thresholds accordingly.

    **Carried forward from iteration 1 (kept distinct: workflow complete; experiment not run;
    hypothesis unchanged — zero direct mechanism signal; closure was the retro):**
    - The ten-post loop (D1-D3) was never executed — zero posts, zero ledger rows. Whether it is
      iteration 2's shape is PM's call. Per the retro addendum's primary lesson: design around
      obtaining real external evidence, or explicitly stop when that cannot happen — not merely
      completing another artifact loop.
    - entityR2A (Delivery cost & risk to Exec) never produced; entityR3B (pipeline to Exec) stale
      at v0 (iteration 0).
    - entity3 (market offer) not made — the posting gate was unmet at iteration-1 close.
    - entityR4 / practitioner contact: zero ICP matches across seven listening cycles.
    - entityPrv3 (community map): X only; other channels not yet listened to.
    - Correction carried from the frozen iteration-1.yaml: its "manufactured referee" phrasing is
      superseded by entity0-v1 — the consideration mechanism (the knowledge-file read) is input
      quality, not verification; the environment is the verifier. PM words the bet as it sees fit.

    **State & inputs — last verified 2026-09-24**

    Live external state:
    - Account identity: @loopsense, live, confirmed 2026-09-24 by Dan as the posting account
    - Posting gate: original posts normally require PM Medium confidence (GTM SKILL.md); owner
      decision 2026-09-24: the evidence run may proceed at Low-Medium. PM sets the confidence
      figure; GTM keeps this line current.
    - Open owner-only decisions: none open

    Required inputs (freshness bound: one iteration):
    - entityR2A (Delivery cost & risk to Exec): missing, never produced — flagged; the consumer
      states whether it proceeds on partial inputs
    - entityR3B (GTM pipeline to Exec): stale (v0, one iteration old) — flagged as above
dimensions:
  time_horizon: 2026-09
  iteration: '2'
overrides:
  actors: []
  entities:
    - id: entity0
      label: "Continue: real external evidence, fallback first"
      notes: 'PM decision (revised 2026-09-24 after owner feedback and checkpoint answers):
        continue. The question: can a system without a continuous human close the verification
        gap by learning from how the world responds to its work? Delivery''s mechanism analysis
        runs first; the ten-post evidence run is sequenced after it. The grounded use-case
        catalogue and the root README (Delivery, under Dan''s direction) complete the iteration.
        One failed test is evidence, not a claim-killer: if external evidence cannot be obtained,
        scoped fallback learnings run before any stop question is revisited. Full entity:
        agents/pm/generates/entity0-v2.md'
    - id: entity1
      label: "Iteration 2 brief — evidence run viability"
      notes: 'Exec certified 2026-09-24 at Low-Medium, on partial inputs explicitly (entityR2A
        never produced, entityR3B stale at v0; no cost & risk case behind the certification).
        Provisional customer frame — buyer unidentified after seven cycles, the grounded
        catalogue firms or replaces it before any offer. Positioning must rest on demonstrated
        mechanism, not vocabulary (commoditisation caution). Fresh business-model read: the run
        also tests the monetisation substrate (readable environmental signal at small scale).
        Constraints: no revenue targets, no unreviewed public claims, no fabricated catalogue,
        no run before Delivery''s mechanism analysis. Full entity:
        agents/exec/generates/entity1-v2.md'
    - id: entityR1
      label: "Viability signal: certified, partial inputs"
      notes: 'Exec return to PM, 2026-09-24: certified on partial inputs; missing/stale bypass
        inputs named (entityR2A missing, entityR3B stale, entityR4 absent). What would return
        the bet: mechanism unavailable and unbuildable with humans necessary at the claimed
        points; no reachable problem groups; process failures (fabricated catalogue, unreviewed
        public claims, run ahead of analysis). Single failed tests lower confidence only, per
        the owner''s one-test rule. Confidence: problem Low-Medium, mechanism Low, business
        model Low. Full entity: agents/exec/generates/entityR1-v2.md'
