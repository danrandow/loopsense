  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Iteration 4 (base_speed 1.1, kp 4.5, kd 0.6, ki 0.3) is the best design so far
      at 147.1. Lowering speed from 1.4 to 1.1 more than doubled oval progress and
      tripled s-bend progress. Iteration 5 then changed three controller values at
      once (base 1.0, kp 5.0, kd 0.7) and fell to 95.1. Oval progress dropped from
      0.67 to 0.33 and the oval completion was lost, so the kp increase or the further
      speed drop hurt. Because the cause is confounded, I revert to the iteration
      4 controller and change one variable. Every design still ends at max_error of
      about 0.060 to 0.064 m, the off-track limit, which points to overshoot on bends
      rather than slow drift. I raise kd from 0.6 to 0.9 to add damping against that
      overshoot. Speed (1.1), kp (4.5), ki (0.3) and all geometry stay as in iteration
      4 so the kd effect can be read cleanly. Expected result: max_error falls below
      0.06 on at least some bends, s-bend progress rises above 0.19, and oval progress
      holds at or above 0.6 with a chance of more completions. Hypotheses: (H1) if
      steering_oscillation rises above 0.4 on oval, the derivative is amplifying sensor
      noise and kd should return to about 0.6 with a different lever. (H2) If max_error
      is unchanged at about 0.063 on the same bend, the limit is steering authority,
      and kp or the wheel_track should change next. (H3) If the robot survives all
      three tracks but does not finish, base_speed should rise to about 1.2 with this
      kd. Measurements wanted per track: completion, progress, completion_time, max_error,
      rms_error, line_loss_events, steering_oscillation, control_effort and noise_robustness.


      - [Open this output](iteration-6/entity0/versions/2ec46cd102d2464d9fcb04cec18bfe60/payload.json)

      - Based on: [entityR2A](iteration-6/entityR2A/versions/carried-44efac44c8eed1bc/payload.json)'
