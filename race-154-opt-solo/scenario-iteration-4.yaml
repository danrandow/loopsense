  entities:
  - id: entity0
    label: Slower base speed 1.1
    notes: 'Keeps iteration 3 geometry and gains but lowers base_speed from 1.4 to
      1.1 to test whether the robot leaves the tape on curvature. Evidence: every
      run hits the 0.06 m off-track limit, and the s-bend fails at about 4% progress
      regardless of gain.


      ### Rationale


      Evidence: iteration 3 is the best so far (score 68.4). Oval progress rose to
      0.32, but no track finishes. Every design, including iteration 0, leaves the
      tape at max_error 0.060 to 0.064 m, the off-track limit. With body_width 0.12
      the limit is max(0.06, 0.0125 + 0.03) = 0.06 m, and no allowed body width raises
      it above 0.06. The s-bend fails at progress 0.04 to 0.045 on every design, so
      it fails early and regardless of gain, which points to speed-to-curvature on
      its first bend rather than gain tuning. Raising kp from 4.0 to 4.5 and adding
      ki 0.3 gave the best oval and slalom progress, so I keep those.


      Change: base_speed 1.4 to 1.1. Prior hypotheses (H2 in iteration 3) say the
      robot leaves the line because it is too fast for the curvature. Lower speed
      gives the steering loop more time per sensor crossing and less lateral slide,
      so I expect the s-bend to survive past 0.1 progress and max_error to drop below
      0.06 on at least one track. I expect oval progress to fall slightly, around
      0.25 to 0.3, and completions to stay at zero. Geometry and the other gains are
      kept so the effect of speed can be read cleanly.


      Hypotheses for next race: (H1) if max_error still reaches 0.06 at the same point
      on each track, the cause is the controller''s response (kd or kp), not speed,
      and kd should move toward 0.8 to 1.0. (H2) if s-bend progress rises clearly
      above 0.05, the first bend is speed-limited and a later race should test base_speed
      0.9 with a higher kp. (H3) if steering_oscillation rises above 0.25, the integral
      or kd is driving chatter and ki should drop to 0.1. Completion is unlikely while
      speed is this low, so the scoring focus stays on progress and survival. The
      next step is to find a survival setting that keeps progress rising, then raise
      speed.


