  entities:
  - id: entity0
    label: kp 5.0 on wide sensor row
    notes: 'Keeps iteration 8''s ±0.08 m sensor row, which removed slalom line loss
      and lifted oval completions to 9/20, and raises kp 4.5 to 5.0 to restore the
      steering gain lost when the row was widened. The aim is to recover s-bend and
      slalom progress without giving back the oval gains.


      ### Rationale


      Evidence from iteration 8 (score 218.1, best so far). Widening the sensor row
      from ±0.06 m to ±0.08 m fixed slalom line loss (0.9 events down to 0) and raised
      oval completions to 9 of 20, with oval oscillation down to 0.20. But s-bend
      progress fell from 0.30 to 0.11, and slalom progress stayed at about 0.08. Every
      track still ends at max_error of about 0.06 m, the off-track limit, so the robot
      overshoots on bends rather than losing the line.


      The wider row also lowers the steering signal per unit of lateral offset. The
      weights run from -1 to +1 over ±0.08 m, a slope of 12.5 per metre, versus 16.7
      per metre at ±0.06 m. That is about 25 percent less effective steering gain,
      which fits the s-bend collapse and the stalled slalom. Iteration 8 H1 predicted
      this: the excursion is steering lag, not sensor coverage.


      Change: kp 4.5 to 5.0, the only change. This restores about 11 percent of the
      lost steering authority while keeping the ±0.08 m coverage that fixed line loss.
      kd stays at 0.9 and oscillation has margin (0.20 on oval). The wider row, weights,
      wheel_track, mass and base_speed are unchanged so the effect of gain can be
      read cleanly.


      Expected result: s-bend progress back toward 0.2 or more, slalom progress above
      0.1, oval completions holding at 8 or more, and oval steering_oscillation below
      about 0.3. Hypotheses: (H1) if oval oscillation rises above 0.35, kp is too
      high for kd, so kd should drop to 0.7. (H2) if s-bend and slalom still stall
      near 0.1 progress with max_error at 0.06, the limit is speed on the tighter
      bends, so base_speed should drop to about 1.0. (H3) if all tracks survive but
      do not finish, base_speed should rise to about 1.2. Measurements wanted per
      track: completion, progress, completion_time, max_error, rms_error, line_loss_events,
      steering_oscillation, control_effort and noise_robustness.


