  entities:
  - id: entity0
    label: Stronger kp, lower speed
    notes: 'Lowers base speed to 1.0 and raises kp to 5.0 with kd 0.7 to tighten bend
      tracking, building on iteration 4 where dropping speed lifted oval and s-bend
      progress. Expected to raise s-bend and slalom progress while keeping oscillation
      in check.


      ### Rationale


      Evidence from iteration 4 (score 147.1, best so far): lowering base_speed from
      1.4 to 1.1 more than doubled oval progress (0.32 to 0.67, one completion in
      20 trials), and s-bend progress rose from 0.045 to 0.19. Speed is the main limit
      on the bends. Max error still sits at about 0.06 m on every track, which is
      the off-track limit, so the robot leaves the tape by overshoot on bends, not
      slow drift. Slalom is still weak at 0.11 progress with zero line losses, which
      points to a slow steering response on alternating bends rather than sensor dropout.
      Sensor geometry (spread ±0.06 m, 16 mm sensors, y 0.03 m) is working: line-loss
      events are near zero, so I keep it.


      Changes: (1) base_speed 1.1 to 1.0, a further step down to give the bends more
      margin, since the speed trend is clearly positive; (2) kp 4.5 to 5.0 for a firmer
      correction per unit of offset, to address the slow response on slalom and the
      0.06 m overshoot; (3) kd 0.6 to 0.7, a small damping increase to offset the
      stronger kp, kept modest because oscillation rose to 0.32 on oval; (4) ki stays
      at 0.3 to keep cancelling the motor mismatch. Mass, wheel track and radius are
      unchanged so the controller effect can be read.


      Expected result: s-bend progress above 0.25, slalom progress above 0.15, and
      more oval completions, with max_error reaching the off-track limit less often.
      Oval completion time may rise slightly, but survival is worth more than speed
      right now.


      Hypotheses for next race: (H1) if max_error still reaches 0.06 at the same bend
      on every trial, the steering authority is still too low and kp should go to
      about 6, with kd to 0.9. (H2) if steering_oscillation rises above 0.4 with kp
      5.0, kd is driving chatter and should drop back to 0.5. (H3) if the robot survives
      on all tracks but does not finish, base_speed should rise to about 1.2 with
      the new gains, since finishing needs roughly 1.5 m/s average. Measurements wanted
      per track: completion, progress, completion_time, max_error, rms_error, line_loss_events,
      steering_oscillation, control_effort and noise_robustness.


