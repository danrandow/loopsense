  entities:
  - id: entity0
    label: Slower base speed 1.0
    notes: 'Single change from the best design (iteration 9): base_speed 1.1 to 1.0,
      to test whether speed is what stops s-bend and slalom at about 0.1 progress.
      Earlier speed cuts from 1.4 to 1.1 gave the largest gains on those tracks, and
      oval has time margin to absorb a small slowdown.


      ### Rationale


      Evidence from iteration 9 (score 237.3, best so far): oval finishes 11 of 20
      with progress 0.80, but s-bend (progress 0.105) and slalom (0.078) still stall
      at about 0.1 progress and end off track, with max_error at the 0.06 m limit.
      Raising kp from 4.5 to 5.0 barely moved s-bend (0.110 to 0.105) and slalom was
      unchanged, so steering gain is not the binding limit on those tracks. Earlier
      evidence says speed is: dropping base_speed from 1.4 to 1.1 raised s-bend progress
      from 0.045 to 0.19 and oval progress from 0.32 to 0.67. Iteration 5 (base 1.0)
      was confounded with kp and kd changes and regressed, so the speed trend is not
      yet fully tested below 1.1. Oval has time margin (mean finish 1.72 s against
      a 3 s limit), so a modest speed cut should cost little there. Change: base_speed
      1.1 to 1.0, the only change from iteration 9. Geometry and gains are unchanged
      so the speed effect can be read cleanly. Expected result: s-bend progress rises
      clearly above 0.15 and slalom above 0.1, with oval completions holding near
      9 to 11 of 20 and completion_time rising only slightly. Hypotheses: (H1) if
      s-bend and slalom still stall at about 0.1 with max_error at 0.06, the failure
      is not speed-limited and the next step is sensor placement (y) or kd. (H2) If
      oval completions drop below 8 of 20, the speed cut is too costly for finishing
      and base_speed should return to 1.1 with a different lever. (H3) If all tracks
      survive but none finish, base_speed should be raised slightly, to about 1.05.
      Measurements wanted per track: completion, progress, completion_time, max_error,
      rms_error, line_loss_events, steering_oscillation, control_effort and noise_robustness.


