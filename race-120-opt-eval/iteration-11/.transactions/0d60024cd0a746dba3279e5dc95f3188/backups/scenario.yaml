overrides:
  entities:
  - id: entity0
    label: Speed 1.7 test on iter 7
    notes: 'Iteration 7''s design (score 216.97, reproduced in iteration 9) with base_speed
      raised from 1.6 to 1.7 as the one narrow test. Oval completion time should stay
      well under 3 s, and the fallback is base_speed 1.6 if the score drops or steering
      oscillation rises.


      ### Rationale


      Evidence: iteration 7 (kp 3.0, ki 1.0, kd 0.5, base_speed 1.6, outer sensors
      at x = ±0.04, sensor_size 0.016, last_direction) scored 216.97. Iteration 9
      reproduced that exact design at 216.97 under the same seeds, so the result is
      confirmed. The ki series (0.8 → 184.93, 1.0 → 216.97, 1.2 → 187.18) peaks near
      1.0. Earlier races rule out wider outer sensors (iteration 3), higher kp (iteration
      4) and lower base_speed (iteration 2). Max_error stays near 0.06 m on every
      track, and the oval finish rate is only 0.2, so the open problems are the residual
      drift and the oval finish rate.


      Change: base_speed 1.6 → 1.7, with every other field as in iteration 7. Iteration
      2 showed that cutting speed to 1.2 removed oval finishes, so a modest rise is
      the more plausible direction. Oval mean finish time was 1.93 s at 1.6, which
      scales to about 1.82 s at 1.7 and stays well under the 3.0 s limit. Only one
      variable changes, so the race isolates speed.


      Expected result: oval finish rate at or above 0.2 and a score at or above about
      217. Hypothesis H7: the oval finishes are limited by time, and a small speed
      rise improves them without pushing the bends off track. Risk: higher speed may
      increase bend drift, so s-bend progress (0.462) and max_error are the watch
      items.


      Fallback: if the score falls below 216.97, or s-bend or slalom progress drops
      with max_error above 0.063 m, return base_speed to 1.6 and submit the iteration
      7 design unchanged. If steering_oscillation exceeds about 0.35, that also favours
      the fallback.


      Measurements wanted: per-track completion, progress, completion_time, max_error,
      rms_error, line_loss_events and steering_oscillation, so the speed effect can
      be judged per track.


      - [Open this output](iteration-10/entity0/versions/d5b1f68594d44d96830f63701800029f/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-8683b12dd329ca58/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-8ba6bc59234dbb76/payload.json)'
  - id: entityR1
    label: Approve base_speed 1.7
    notes: 'Approved the iteration 7 design with base_speed raised from 1.6 to 1.7,
      since the 216.97 result was reproduced in iteration 9 and speed is the one untested
      lever with oval finish time margin. Fallback to base_speed 1.6 is specified
      if the race scores lower or bends degrade.


      ### Feedback


      Written before this candidate has raced, so no result is stated for it. The
      candidate is the iteration 7 design, which iteration 9 reproduced at 216.97
      under the same seeds, so that result is confirmed. The one change is base_speed
      1.6 to 1.7, with every other field as in iteration 7 (kp 3.0, ki 1.0, kd 0.5,
      outer sensors at x = ±0.04, sensor_size 0.016, last_direction). Iteration 2
      showed that lowering base_speed to 1.2 cut oval finishes from 5/20 to 0/20 and
      lowered the score, so a modest rise is the more plausible direction. Oval mean
      finish time was 1.93 s at 1.6 in iteration 7, which leaves ample margin under
      the 3.0 s limit at 1.7. Earlier races rule out wider outer sensors (iteration
      3), higher kp (iteration 4) and higher ki (iteration 8, which scored 187.18
      at ki 1.2). The main risk is bend drift at higher speed, so s-bend progress
      and max_error are the watch items. This is approved because it is a single-variable
      test of the one lever not yet tried, and the iteration 7 design is a known fallback.
      After the race, compare the score with 216.97. If the score is at or above 216.97
      with s-bend progress at or above 0.46 and max_error at or below about 0.063
      m, the next iteration may try base_speed 1.8 as a single further step, while
      checking that oval completion_time stays well under 3.0 s. If the score falls
      below 216.97, or s-bend or slalom progress drops, or steering_oscillation exceeds
      about 0.35, return base_speed to 1.6 and submit the iteration 7 design unchanged.
      Do not change kd or ki in that next step, since kd 0.5 and ki 1.0 are the current
      best values.


      ### Requested changes


      - If the race scores at or above 216.97 with s-bend progress at or above 0.46
      and max_error at or below about 0.063 m: try base_speed 1.8 with all other fields
      as in this candidate, and confirm oval completion_time stays well under 3.0
      s.

      - If the race scores below 216.97, or s-bend or slalom progress falls, or steering_oscillation
      exceeds about 0.35: return base_speed to 1.6 and submit the iteration 7 design
      (kp 3.0, ki 1.0, kd 0.5, base_speed 1.6, outer sensors at x = ±0.04, sensor_size
      0.016, last_direction) unchanged.

      - Do not change kd above 0.5 or ki above 1.0 without new evidence, since iteration
      8 showed ki 1.2 lowered the score and iteration 5 showed kd 0.5 is the best
      damping tested.


      - [Open this output](iteration-10/entityR1/versions/37400f1523d142bcbf69262d712bcbe7/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/d5b1f68594d44d96830f63701800029f/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-8ba6bc59234dbb76/payload.json)'
