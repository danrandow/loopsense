map:
  id: race-120-opt-eval
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Wider outer sensors ±0.06
    notes: 'Restores base_speed 1.6 (the best raced value) and widens the outer sensors
      to x = ±0.06 to test whether the outer sensors lose the tape on sharp bends.
      Iteration 2 showed that cutting speed to 1.2 lowered the score to 115.67, so
      speed is not the main cause.


      ### Rationale


      Evidence: iteration 1 (score 158.144) is the best raced design. Iteration 2
      cut base_speed to 1.2 and scored 115.67. The oval finish rate fell from 5/20
      to 0/20, and slalom progress fell from 0.11 to 0.087. Slowing down therefore
      did not fix the bends and hurt the oval, so H1 (speed as the main cause) is
      rejected. Every track still leaves the line at max_error about 0.061 to 0.063
      m, with steering oscillation low (0.12 to 0.28), so the failure is early drift
      off the outer bends, not jitter. Change: restore base_speed to 1.6 (the best
      raced value) and widen the outer sensors from x = ±0.04 to x = ±0.06, keeping
      the inner sensors at -0.02, 0.0, +0.02 and all other fields from iteration 1.
      This tests H2: the outer sensors lose the tape on sharp bends, so pushing them
      outward lets the controller see the line earlier and turn in sooner. Expected
      result: fewer line_loss_events and higher progress on s-bend and slalom (target
      above 0.3), and the oval keeps its iteration 1 finish rate or better. Next measurements:
      progress, max_error and line_loss_events per track, and whether the oval still
      finishes near 1.87 s. If the outer sensors do not help, the next hypothesis
      is that kp is too low for the bend curvature (try kp 3.5), or that the sensor
      spacing is too coarse (add sensors at ±0.04 to make seven in total).


      - [Open this output](iteration-3/entity0/versions/6f9d2733b3b6435cb40c7240b36b84dd/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-1ea9d92eabda3b52/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-8669d2932fa7b167/payload.json)'
  - id: entityR1
    label: 'Approve: slower'
    notes: 'Approved the single-variable change base_speed 1.6 to 1.2, since iteration
      1 showed s-bend and slalom leaving the line early at progress 0.11 to 0.17 while
      the oval finished 5 of 20 runs. The feedback sets the next steps (widen outer
      sensors or raise speed to 1.4) depending on what this race shows.


      ### Feedback


      Written before this candidate has raced. This review uses only the iteration
      0 and 1 outcomes and the candidate''s contents. Iteration 1 (score 158.144)
      is the best raced design: the oval finished 5 of 20 trials at mean 1.87 s with
      progress 0.55, while s-bend and slalom went off track in all 40 trials with
      progress 0.11 to 0.17 and max_error about 0.061 to 0.062 m. Steering oscillation
      was low (0.15 to 0.22), so the failure is early drift into bends at speed, not
      jitter. The candidate changes only base_speed (1.6 to 1.2) and keeps every other
      field from iteration 1, so the race isolates speed. The 2.5 s oval estimate
      is a scaling guess from 1.87 s × 1.6/1.2, not a measurement, and it leaves limited
      margin under the 3.0 s limit. It is a valid, single-variable test of the main
      hypothesis, so it is worth racing now. What to do next depends on the race.
      If s-bend and slalom still leave the line early (progress still well below 0.5,
      max_error near 0.06 m), speed is not the main cause: next widen the outer sensors
      to x = ±0.06 with all other values as in this candidate (H2). If the oval no
      longer finishes or completion_time is near 3.0 s, raise base_speed to about
      1.4 as a compromise. If the oval finishes comfortably under 2.5 s and s-bend
      or slalom progress rises above 0.5, keep base_speed near 1.2 and tune kp or
      kd for the remaining bends.


      ### Requested changes


      - If s-bend and slalom still go off track with progress below 0.5: keep base_speed
      at 1.2 and widen the outer sensors to x = -0.06 and +0.06 (the inner three stay
      at -0.02, 0.0, +0.02), per hypothesis H2 from iteration 1''s max_error and line_loss_events.

      - If the oval fails to finish or completion_time approaches 3.0 s: raise base_speed
      to about 1.4 (not above 1.6) and keep all other fields fixed, since the iteration
      1 oval finish time was 1.87 s at speed 1.6.

      - If s-bend and slalom progress rises above 0.5 at base_speed 1.2 without a
      finish: retune kp in the 3.0 to 3.5 range with kd kept at 0.3, using max_error
      and steering_oscillation from this race as the guide.


      - [Open this output](iteration-2/entityR1/versions/10b1aeda63a848d9844b8eb07fed09d1/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/682589d7174b4797b185b5a0cbf3123e/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-036fa935be0df632/payload.json)'
