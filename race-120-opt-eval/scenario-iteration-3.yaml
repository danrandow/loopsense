  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Wider outer sensors ±0.06
    notes: 'Restores base_speed 1.6 (the best raced value) and widens the outer sensors
      to x = ±0.06 to test whether the outer sensors lose the tape on sharp bends.
      Iteration 2 showed that cutting speed to 1.2 lowered the score to 115.67, so
      speed is not the main cause.


      ### Rationale


      Evidence: iteration 1 (score 158.144) is the best raced design. Iteration 2
      cut base_speed to 1.2 and scored 115.67. The oval finish rate fell from 5/20
      to 0/20, and slalom progress fell from 0.11 to 0.087. Slowing down therefore
      did not fix the bends and hurt the oval, so H1 (speed as the main cause) is
      rejected. Every track still leaves the line at max_error about 0.061 to 0.063
      m, with steering oscillation low (0.12 to 0.28), so the failure is early drift
      off the outer bends, not jitter. Change: restore base_speed to 1.6 (the best
      raced value) and widen the outer sensors from x = ±0.04 to x = ±0.06, keeping
      the inner sensors at -0.02, 0.0, +0.02 and all other fields from iteration 1.
      This tests H2: the outer sensors lose the tape on sharp bends, so pushing them
      outward lets the controller see the line earlier and turn in sooner. Expected
      result: fewer line_loss_events and higher progress on s-bend and slalom (target
      above 0.3), and the oval keeps its iteration 1 finish rate or better. Next measurements:
      progress, max_error and line_loss_events per track, and whether the oval still
      finishes near 1.87 s. If the outer sensors do not help, the next hypothesis
      is that kp is too low for the bend curvature (try kp 3.5), or that the sensor
      spacing is too coarse (add sensors at ±0.04 to make seven in total).


      - [Open this output](iteration-3/entity0/versions/6f9d2733b3b6435cb40c7240b36b84dd/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-1ea9d92eabda3b52/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-8669d2932fa7b167/payload.json)'
  - id: entityR1
    label: 'Approve: wider outer'
    notes: 'Approves iteration 1''s best design with outer sensors moved to x = ±0.06
      and base_speed back at 1.6. Iteration 2 showed slower speed cuts oval finishes,
      and iteration 1 shows drift at max_error about 0.06 m, so this single change
      tests the sensor-span hypothesis at low risk.


      ### Feedback


      Written before this candidate has raced. The candidate is iteration 1, the best
      raced design (158.144), with one change: the outer sensors move from x = ±0.04
      to x = ±0.06, and base_speed returns to 1.6. Iteration 2 showed that cutting
      base_speed to 1.2 lowered the score to 115.67 and reduced oval finishes from
      5/20 to 0/20, so speed is not the main fix. Iteration 1 showed max_error of
      about 0.061 to 0.063 m on every track, with low steering oscillation (0.15 to
      0.22). That points to drift off the outer bends, not jitter, which makes the
      sensor-span hypothesis (H2) the sensible next test. The candidate is valid:
      all values are inside the contract ranges, and ±0.06 is within ±0.08 and does
      not change the off-track limit of 0.06 m. Because it changes only the outer
      sensor positions from the best raced design, it isolates H2 at low risk. Approve
      it so the race can test it. After the race: if s-bend and slalom progress rises
      and line_loss_events falls, keep the wider span. If the oval finish rate drops
      below iteration 1 (0.25) or the outer sensors no longer help, next try kp 3.5
      with the wider span, or add sensors at x = ±0.04 to make seven in total, as
      the rationale suggests.


      ### Requested changes


      - If the race shows no gain on s-bend and slalom (progress still below 0.2,
      max_error near 0.06 m): try kp 3.5 with the wider outer sensors (x = ±0.06)
      and all other fields fixed, since the drift may need stronger correction.

      - If the oval finish rate falls below the iteration 1 value of 0.25 while s-bend
      or slalom improves: keep x = ±0.06 and raise base_speed only slightly (to about
      1.4), not back to 1.2, because iteration 2 showed that low speed costs oval
      finishes.

      - If line_loss_events drops but completion_time on the oval rises: try sensor_size
      0.012 with the wider span, to check whether a larger footprint is causing the
      slower response.


      - [Open this output](iteration-3/entityR1/versions/55668f4743984847bb5d9fedb4199fed/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/6f9d2733b3b6435cb40c7240b36b84dd/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-8669d2932fa7b167/payload.json)'
