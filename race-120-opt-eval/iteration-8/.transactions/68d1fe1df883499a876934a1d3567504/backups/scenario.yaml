map:
  id: race-120-opt-eval
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: ki 1.2 integral step
    notes: 'Single-variable step from the best raced design (iteration 7, score 216.97),
      raising ki from 1.0 to 1.2 with all else unchanged. Integral gain has raised
      bend progress at each step, and s-bend oscillation (0.329) is still under the
      0.35 limit.


      ### Rationale


      Evidence: iteration 7 (ki 1.0, otherwise iteration 6) is the best raced design
      at 216.97, up from 184.93 at ki 0.8. Its s-bend progress is 0.462 and slalom
      progress 0.1235, both at or above the thresholds the Evaluator set (0.45 and
      0.12). Steering oscillation fell on the s-bend (0.337 to 0.329) and on the oval
      (0.304 to 0.331, roughly flat), and stays below the 0.35 fallback limit. Max_error
      is still about 0.059 to 0.063 m, so a residual steady offset remains. Integral
      gain has improved progress at every step (0.4 to 0.8 gave +9.2, 0.8 to 1.0 gave
      +32.0), and oscillation has not risen with it.


      Decision: follow the Evaluator''s requested next step and raise ki from 1.0
      to 1.2, changing nothing else. Geometry, kp 3.0, kd 0.5, base_speed 1.6, outer
      sensors at x = ±0.04, sensor_size 0.016 and last_direction line loss all stay
      as in iteration 7. The Evaluator also asked that sensor positions, kp and base_speed
      stay fixed, and iterations 2 to 4 confirmed that moving them lowered the score.
      The integral is clamped to ±2, which limits windup at this gain.


      Expected result: a score at or above 216.97, with s-bend progress at or above
      0.46, slalom progress at or above 0.12, and max_error slightly lower. Hypothesis
      H6: the steady offset is still shrinking with integral action, and the clamp
      is not yet binding.


      Fallback rule: if steering_oscillation on the s-bend or oval exceeds about 0.35,
      return ki to 1.0 (the iteration 7 best, score 216.97). If the score falls below
      216.97 with progress unchanged, keep ki 1.0.


      Measurements wanted: per-track progress, max_error, steering_oscillation, line_loss_events,
      and oval completion_time, so the next step can be judged against the integral
      trend.


      - [Open this output](iteration-8/entity0/versions/bcff11e96548401e8aa9b176cbf8ae52/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-b54da5215b7d6836/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-8ba6bc59234dbb76/payload.json)'
  - id: entityR1
    label: Approve ki 1.2 step
    notes: 'Approved the single-variable step ki 1.0 to 1.2 on the best raced design
      (216.97). Integral gain has raised the score at every step (iterations 6 and
      7), and steering oscillation has not risen with it, so the next race is a low-risk
      test with a clear ki 1.0 fallback.


      ### Feedback


      Written before this candidate has raced, so no result is stated for it. The
      candidate is the iteration 7 design (best raced score 216.97: kp 3.0, ki 1.0,
      kd 0.5, base_speed 1.6, outer sensors at x = ±0.04, sensor_size 0.016, last_direction)
      with one change, ki from 1.0 to 1.2. All values are inside the contract limits.
      Integral gain is the one lever that has improved the score at every step: ki
      0.4 to 0.8 gave 175.70 to 184.93 (iteration 6), and 0.8 to 1.0 gave 184.93 to
      216.97 (iteration 7). Oscillation has not risen with it: s-bend steering_oscillation
      fell from 0.337 (iteration 6) to 0.329 (iteration 7), and the oval was 0.331,
      so the 0.35 limit still has some margin. Max_error stays near 0.059 to 0.063
      m on every track, which fits a residual steady offset that integral action is
      still shrinking. Earlier evidence still argues against changing the other fields:
      wider outer sensors (iteration 3, 54.87), higher kp (iteration 4, 108.24) and
      lower base_speed (iteration 2, 115.67) all lowered the score. The main risk
      is integral windup: the integral is clamped at ±2, so the clamp may start to
      bind at this gain, and the oval finish rate (4/20 at iteration 7) could move
      either way. Approving this is a single-variable test with a clear fallback,
      and the race will show whether the trend holds. After the race, compare against
      216.97 and check progress on the s-bend (target 0.46 or higher) and slalom (0.12
      or higher), max_error, steering_oscillation, line_loss_events and oval completion_time.
      If the score falls below 216.97 with progress unchanged, keep ki 1.0 as the
      fallback.


      ### Requested changes


      - If steering_oscillation on the s-bend or oval exceeds about 0.35 in the race,
      return ki to 1.0 (the iteration 7 value, score 216.97) and keep kp 3.0, kd 0.5
      and base_speed 1.6, since the oscillation trend is the main risk at higher ki.

      - If the score is at or above 216.97 with s-bend progress at or above 0.46 and
      slalom progress at or above 0.12, consider ki 1.4 as the next single step, with
      all other fields unchanged, to test whether the steady offset keeps shrinking
      before the integral clamp (±2) binds.

      - Do not change sensor positions, kp, kd or base_speed in this step. Iterations
      2, 3 and 4 each lowered the score when those fields moved, and iteration 5 confirmed
      kd 0.5 as the best damping.


      - [Open this output](iteration-8/entityR1/versions/26562e2991af4710acaef5327be166f8/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/bcff11e96548401e8aa9b176cbf8ae52/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-8ba6bc59234dbb76/payload.json)'
