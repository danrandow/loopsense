  id: race-120-opt-eval
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: kd 0.5 on best design
    notes: 'Iteration 1 (best raced, 158.14) with kd raised from 0.3 to 0.5, a single-variable
      test of damping for bend overshoot. Iteration 4 showed that raising kp to 3.5
      lowered the score, so the Evaluator''s approved kp 3.5 candidate was not resubmitted.


      ### Rationale


      Evidence. The best raced design is iteration 1 (score 158.144): kp 3.0, ki 0.4,
      kd 0.3, base_speed 1.6, outer sensors at x = ±0.04, sensor_size 0.016. Every
      later single-variable change lowered the score. Lowering base_speed to 1.2 (iteration
      2) cut oval finishes from 5/20 to 0/20. Widening the outer sensors to ±0.06
      (iteration 3) dropped the score to 54.9 and removed all oval finishes. Raising
      kp to 3.5 (iteration 4) gave 108.2 and cut oval finishes to 1/20. Across all
      raced designs, max_error sits at 0.061 to 0.063 m against the 0.06 m off-track
      limit, steering oscillation is low (0.11 to 0.28), and the s-bend and slalom
      fail at progress 0.09 to 0.17. The failure is therefore drift into bends, not
      jitter, and more proportional authority made it worse.


      Evaluator note. The Evaluator''s approved entityR1 (kp 3.5, outer sensors ±0.04,
      all else as iteration 1) is identical to the iteration 4 design, which has already
      raced and scored 108.24. I am not resubmitting it, because it is a known worse
      design and its feedback predates the iteration 4 result.


      Change. I keep iteration 1 as the base and make one change: kd from 0.3 to 0.5.
      The hypothesis (H4) is that the robot overshoots each bend and then leaves the
      tape on the far side, so more derivative damping should reduce overshoot without
      the extra proportional gain that hurt in iteration 4. Steering oscillation is
      low, so the added damping should not be limited by jitter.


      Expected result. Progress on s-bend and slalom above about 0.2, max_error below
      about 0.06 m, and the oval finish rate at least 0.25. If steering_oscillation
      rises above about 0.35, damping is adding noise and kd should return to 0.3.
      If progress is unchanged, the next test is ki 0.8 (the remaining steady offset)
      or a seven-sensor layout with inner sensors at x = ±0.03.


      - [Open this output](iteration-5/entity0/versions/136f612c9af4452891053e0ab9135df0/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-b7c19c8be58afaf3/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-2a09bd8b2423c411/payload.json)'
  - id: entityR1
    label: Approve kd 0.5 single
    notes: 'Approved a one-variable test of kd 0.3 to 0.5 on the best raced design
      (158.14). Iterations 3 and 4 ruled out wider sensors and higher kp, and every
      run''s max_error sits just above the 0.06 m limit with low oscillation, which
      points to late damping on bends.


      ### Feedback


      Written before this candidate has raced, so it states no result for it. The
      candidate is the iteration 1 design (best raced score 158.144: kp 3.0, ki 0.4,
      kd 0.3, base_speed 1.6, outer sensors at x = ±0.04, sensor_size 0.016) with
      one change, kd from 0.3 to 0.5. That is a valid, in-range, single-variable test.
      Iteration 4 showed that raising kp to 3.5 with everything else fixed lowered
      the score to 108.24 and cut oval finishes from 5/20 to 1/20, so proportional
      gain is not the lever. Iteration 3 showed that widening the outer sensors to
      ±0.06 also lowered the score (54.87, 0/20 oval finishes). Every raced design
      has max_error of about 0.061 to 0.063 m, just above the 0.06 m limit, with low
      steering oscillation (0.11 to 0.28). That points to late correction on bends
      rather than jitter, so more derivative damping is a reasonable untested lever.
      Approve it for the race. After the race, judge it against iteration 1 on the
      score and the oval finish rate. If steering_oscillation rises above about 0.35,
      damping is adding noise: return kd to 0.3 and move to a different lever. If
      the oval finish rate stays at or above 0.25 and s-bend or slalom progress rises
      above the iteration 1 levels (about 0.17 and 0.11), keep kd 0.5 and consider
      a small base_speed increase only if completion_time stays well under 3.0 s.
      If the score falls and progress is unchanged, do not raise kd further. The next
      lever is ki (for example 0.8) to remove the remaining steady offset, or a seven-sensor
      layout with inner sensors at a finer pitch such as x = ±0.03.


      ### Requested changes


      - Keep kd at 0.5 only if steering_oscillation stays below about 0.35 and the
      oval finish rate stays at 0.25 or higher; otherwise return kd to 0.3 (iteration
      1 value), since iteration 4 showed that extra gain without damping control did
      not help.

      - If the score is at or below 158 with progress unchanged on s-bend and slalom,
      test ki 0.8 with kd 0.5 and all other fields as in iteration 1, to remove the
      residual steady offset implied by max_error near 0.06 m.

      - Do not change sensor positions or raise kp again until the kd result is known;
      iterations 3 and 4 showed both moves lowered the score relative to iteration
      1.


