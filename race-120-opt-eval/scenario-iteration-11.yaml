overrides:
  entities:
  - id: entity0
    label: Iter 10 design, unchanged
    notes: 'Resubmits the iteration 10 design (base_speed 1.7, all else as iteration
      7), which scored 299.69, the best raced result. Oval finishes rose to 14/20,
      but s-bend progress fell to 0.26, so no further speed step is made in this final
      iteration.


      ### Rationale


      Evidence: iteration 10 (base_speed 1.7, kp 3.0, ki 1.0, kd 0.5, outer sensors
      at x = ±0.04, sensor_size 0.016, last_direction) is the best raced design at
      299.69. Oval finishes rose from 4/20 to 14/20, mean oval finish time was 1.90
      s, and oval progress reached 0.91. The iteration 9 reproduction confirmed that
      the iteration 7 base (216.97) is stable under the same seeds, so the gain is
      attributable to the speed change.


      The Evaluator''s conditional rule for trying base_speed 1.8 is not met. s-bend
      progress fell from 0.462 to 0.264 with all 20 runs off track, slalom progress
      fell from 0.124 to 0.102, and the s-bend steering_oscillation was 0.214. So
      the bends are weaker at 1.7 even though the oval is better. The rule''s fallback
      (return base_speed to 1.6) applies only if the score falls below 216.97, which
      it did not.


      Decision: submit the iteration 10 design unchanged. It is the best confirmed
      result, and this is the final iteration with no later race to check any new
      change. A further step to 1.8 would be an untested change that also risks the
      bends, which already regressed at 1.7. The Evaluator''s R1 entity is identical
      to this design and its ''written before raced'' feedback is stale, so I treat
      its approval as applying to a known candidate.


      Expected result: about 300 on the development tracks, with oval finish rate
      near 0.7. Watch item for the unseen final track: bend progress, since s-bend
      progress dropped at 1.7. Measurements wanted: per-track completion, progress,
      completion_time, max_error, line_loss_events and steering_oscillation.


      - [Open this output](iteration-11/entity0/versions/0d60024cd0a746dba3279e5dc95f3188/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-5958f2c8dd543552/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-5d79c6bc8de7e3ce/payload.json)'
  - id: entityR1
    label: Approve best design
    notes: 'Approved the iteration 10 design unchanged: it is the best raced result
      (299.69), with oval finishes up from 4/20 to 14/20 at base_speed 1.7. The s-bend
      regression at 1.7 (progress 0.462 to 0.264) is noted as a risk for the unseen
      track, but this is the final iteration, so no untested change is made.


      ### Feedback


      Written before this candidate has raced. The candidate is the iteration 10 design
      (base_speed 1.7, kp 3.0, ki 1.0, kd 0.5, outer sensors at x = ±0.04, sensor_size
      0.016, last_direction). It is the best raced design so far at 299.69, up from
      216.97 in iterations 7 and 9. The gain came from base_speed: oval finishes rose
      from 4/20 to 14/20, with mean oval finish time 1.90 s and oval progress 0.91.
      The candidate is valid and inside every contract limit. Its one open weakness
      is the bends: s-bend progress fell from 0.462 (1.6) to 0.264 at 1.7, and all
      20 s-bend runs went off track. Slalom progress also fell slightly (0.124 to
      0.102). Those regressions were already in the iteration 10 race data, so they
      are known and do not change the decision. Further revision would need a race
      to check, and this is the final iteration with no later race to confirm a change.
      The rational choice is to race the best known design unchanged. Approve. The
      requested changes below are watch items for the record and are not to be applied
      in this run.


      ### Requested changes


      - Keep base_speed at 1.7. Do not raise it to 1.8 without fresh evidence, because
      s-bend progress already dropped from 0.462 to 0.264 when base_speed went from
      1.6 to 1.7 (iteration 10).

      - Keep kp 3.0, ki 1.0, kd 0.5 and sensor_size 0.016. Iterations 4, 5 and 8 each
      lowered the score when these moved, and iteration 10 is the best tested combination.

      - For the unseen final track, bend-heavy courses are the main risk. Track bend
      progress and max_error, since s-bend results at 1.7 show the design can leave
      the line on tight curves.


      - [Open this output](iteration-11/entityR1/versions/15a046335d08483ea1a26e876cfdb4b9/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/0d60024cd0a746dba3279e5dc95f3188/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-5d79c6bc8de7e3ce/payload.json)'
