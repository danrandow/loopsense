map:
  id: race-120-opt-eval
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Slower base speed 1.2
    notes: 'Keeps iteration 1 geometry and steering (ki 0.4, kp 3.0, kd 0.3, sensor
      0.016) and lowers base_speed to 1.2. Iteration 1 showed s-bend and slalom leaving
      the line at progress 0.11 to 0.17, while the oval finished in 1.87 s, so about
      2.5 s at this speed should still finish in time.


      ### Rationale


      Evidence from iteration 1 (score 158.144, up from 53.26): the oval now finishes
      5 of 20 trials (mean finish 1.87 s, progress 0.55), so ki=0.4 and the wider
      sensors helped there. The s-bend and slalom still go off track in all 40 trials.
      Progress is only 0.11 to 0.17, so the robot leaves the line early on the tighter
      bends. Each run logs about one line-loss event, max_error sits at about 0.061
      to 0.062 m against the 0.06 m limit, and steering oscillation is low (0.15 to
      0.22). The failure is therefore an early overshoot or drift into a bend at speed,
      not jitter. The evaluator''s conditional rule applies: progress is well below
      0.5 on the failing tracks. Change: lower base_speed from 1.6 to 1.2 and keep
      every other value fixed, so the effect of speed is isolated. The scaling from
      oval finish times suggests about 2.5 s at 1.2 (1.87 s × 1.6/1.2), which stays
      under the 3.0 s limit. Expected result: fewer off-track exits on s-bend and
      slalom, max_error below 0.05 m, progress above 0.5 on those tracks, and more
      oval finishes. Hypotheses: (H1) speed is the main cause of early departure on
      bends; (H2) if speed alone does not fix s-bend and slalom, the outer sensors
      (x=±0.04) are losing the line on the sharp bends, and widening them (x=±0.06)
      is the next step. Measurements to check next: completion_time on the oval (should
      stay under 3.0 s), progress and max_error on s-bend and slalom, and line_loss_events
      per track.


      - [Open this output](iteration-2/entity0/versions/682589d7174b4797b185b5a0cbf3123e/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-abc04aa7b0975352/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-036fa935be0df632/payload.json)'
  - id: entityR1
    label: Approve integral and
    notes: 'Approved the candidate with ki 0.4, sensor_size 0.016, kp 3.0 and kd 0.3,
      because the iteration 0 race showed a steady drift toward the off-track limit
      (max_error about 0.06 m, one line loss per run, 0 finishes). The candidate targets
      that drift directly, and it is valid and not obviously broken, so racing it
      is the most useful next step.


      ### Feedback


      Written before this candidate has raced. Iteration 0 had 60 trials with 0 finishes.
      Every run went off track with progress of only 0.11 to 0.16, one line-loss event
      each, and max_error of about 0.06 to 0.063 m against the 0.06 m limit. Steering
      oscillation was low (0.07 to 0.16), so the failure looks like steady drift rather
      than jitter. The candidate changes the parts that target that drift. ki goes
      from 0 to 0.4 to cancel the fixed motor-mismatch bias, which is a constant offset
      that ki=0 cannot remove. sensor_size goes from 0.012 to 0.016 so the 20 mm sensor
      pitch overlaps and the line is less likely to drop out at moderate offsets.
      kp rises from 2.5 to 3.0 and kd from 0.15 to 0.3 to correct drift faster with
      more damping. base_speed stays at 1.6, which isolates the steering and sensing
      changes. The change is well reasoned and consistent with the iteration 0 evidence,
      and nothing in the geometry or controller is out of range. The iteration 0 baseline
      scored 53.26, so this candidate is judged on whether it is valid and plausibly
      better, not on any measured result. Approve it so the race can show whether
      the offset and line-loss diagnosis is right. After the race: if the run still
      goes off track early (progress well below 0.5), lower base_speed (for example
      to 1.2) and re-check max_error. If it completes but completion_time is near
      3.0 s, raise base_speed by about 0.2. If line_loss_events is still high with
      rms_error low, try widening the sensor spread rather than adding more gain.


      ### Requested changes


      - If the next race goes off track before progress 0.5: lower base_speed to about
      1.2 and keep the other fields, since the iteration 0 failures happened with
      max_error already at the 0.06 m limit.

      - If the next race completes with completion_time near 3.0 s: raise base_speed
      in steps of about 0.2 (up to 1.8), keeping ki=0.4 and sensor_size=0.016 fixed
      so the speed effect is isolated.

      - If rms_error stays above 0.03 while line_loss_events is low: try ki around
      0.8 to remove the remaining steady offset; if line_loss_events stays above 0
      with rms_error low, widen the outer sensor positions (for example x = ±0.06)
      before raising gains again.


      - [Open this output](iteration-1/entityR1/versions/c4166687ed654a29a8eaa07e33e99503/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/dedbee0ec8f441d58500e975b4b40cf1/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-a224040eb7ff863a/payload.json)'
