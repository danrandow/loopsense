map:
  id: race-120-opt-eval
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: ki 0.8 with kd 0.5
    notes: 'Keeps the best raced geometry and kd 0.5 (score 175.7, bend progress up),
      and raises ki from 0.4 to 0.8 to remove the steady offset implied by max_error
      near 0.06 m. Watch steering_oscillation (fall back to ki 0.4 if above 0.35)
      and the oval finish rate, which fell to 0.05 in iteration 5.


      ### Rationale


      Evidence. Iteration 5 (kd 0.5, otherwise iteration 1) is the best raced design
      at 175.70, up from 158.14. Progress rose on the bends: s-bend went from about
      0.17 to 0.40 and slalom from 0.11 to 0.12. Oval progress rose from 0.55 to 0.69,
      but the oval finish rate fell from 0.25 to 0.05. Steering oscillation is 0.33
      on the oval and s-bend, just under the Evaluator''s 0.35 threshold. Max_error
      is still about 0.062 m on every track, so the robot still drifts to the edge
      of the tape and is not jittering. Derivative damping therefore helped the bends
      but not the finish. Iteration 4 showed that more kp hurts, and iteration 3 showed
      that widening the outer sensors hurts, so I keep both fixed.


      Decision. Keep kd at 0.5, since the score improved and steering oscillation
      is still under 0.35. The Evaluator''s rule to return kd to 0.3 is only partly
      met, because the oval finish rate fell. I judge that the score gain on the bends
      outweighs that, and I accept kd 0.5 as the base. The next lever is ki. Max_error
      sits about 0.06 m with a steady offset, so I raise ki from 0.4 to 0.8 to remove
      the residual bias that integral action should cancel. Everything else stays
      as in iteration 5: kp 3.0, kd 0.5, base_speed 1.6, outer sensors at ±0.04, sensor_size
      0.016, and last_direction line loss.


      Expected result. Lower steady offset (rms_error below about 0.022 and max_error
      below about 0.06 m), more progress on s-bend and slalom, and a higher oval finish
      rate. Hypothesis H5: the remaining drift is a steady bias that integral action
      removes. Watch steering_oscillation: if it rises above 0.35, integral windup
      or noise is the cause, and ki should return to 0.4. If the score falls below
      175.7 with progress unchanged, the best fallback remains iteration 5.


      Measurements wanted next: progress, max_error, steering_oscillation and line_loss_events
      per track, plus completion_time on the oval.


      - [Open this output](iteration-6/entity0/versions/313500e772e34823852cbf0c5b352674/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-14b4a176116c3d08/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-226e6ac112e36d5b/payload.json)'
  - id: entityR1
    label: Approve kd 0.5 single
    notes: 'Approved a one-variable test of kd 0.3 to 0.5 on the best raced design
      (158.14). Iterations 3 and 4 ruled out wider sensors and higher kp, and every
      run''s max_error sits just above the 0.06 m limit with low oscillation, which
      points to late damping on bends.


      ### Feedback


      Written before this candidate has raced, so it states no result for it. The
      candidate is the iteration 1 design (best raced score 158.144: kp 3.0, ki 0.4,
      kd 0.3, base_speed 1.6, outer sensors at x = ±0.04, sensor_size 0.016) with
      one change, kd from 0.3 to 0.5. That is a valid, in-range, single-variable test.
      Iteration 4 showed that raising kp to 3.5 with everything else fixed lowered
      the score to 108.24 and cut oval finishes from 5/20 to 1/20, so proportional
      gain is not the lever. Iteration 3 showed that widening the outer sensors to
      ±0.06 also lowered the score (54.87, 0/20 oval finishes). Every raced design
      has max_error of about 0.061 to 0.063 m, just above the 0.06 m limit, with low
      steering oscillation (0.11 to 0.28). That points to late correction on bends
      rather than jitter, so more derivative damping is a reasonable untested lever.
      Approve it for the race. After the race, judge it against iteration 1 on the
      score and the oval finish rate. If steering_oscillation rises above about 0.35,
      damping is adding noise: return kd to 0.3 and move to a different lever. If
      the oval finish rate stays at or above 0.25 and s-bend or slalom progress rises
      above the iteration 1 levels (about 0.17 and 0.11), keep kd 0.5 and consider
      a small base_speed increase only if completion_time stays well under 3.0 s.
      If the score falls and progress is unchanged, do not raise kd further. The next
      lever is ki (for example 0.8) to remove the remaining steady offset, or a seven-sensor
      layout with inner sensors at a finer pitch such as x = ±0.03.


      ### Requested changes


      - Keep kd at 0.5 only if steering_oscillation stays below about 0.35 and the
      oval finish rate stays at 0.25 or higher; otherwise return kd to 0.3 (iteration
      1 value), since iteration 4 showed that extra gain without damping control did
      not help.

      - If the score is at or below 158 with progress unchanged on s-bend and slalom,
      test ki 0.8 with kd 0.5 and all other fields as in iteration 1, to remove the
      residual steady offset implied by max_error near 0.06 m.

      - Do not change sensor positions or raise kp again until the kd result is known;
      iterations 3 and 4 showed both moves lowered the score relative to iteration
      1.


