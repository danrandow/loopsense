map:
  id: race-120-opt-eval
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Reverted to ki 1.0 best
    notes: 'Reverts to the iteration 7 design (ki 1.0, score 216.97), since ki 1.2
      scored 187.18 and a parabola through the ki 0.8, 1.0 and 1.2 results peaks near
      1.0. Other fields are unchanged because kd 0.6 risks pushing s-bend oscillation
      past 0.35.


      ### Rationale


      Iteration 8 raced ki 1.2 and scored 187.18, below the iteration 7 best of 216.97
      at ki 1.0. Oval progress fell (0.728 to 0.633) and finish rate dropped (4/20
      to 2/20). S-bend steering_oscillation rose to 0.339, close to the 0.35 limit,
      and s-bend progress fell (0.462 to 0.472, roughly flat). The ki curve is 184.93
      at 0.8, 216.97 at 1.0 and 187.18 at 1.2. A parabola through those three points
      peaks at about ki 1.00, so further ki changes are unlikely to help. I therefore
      return to the iteration 7 design exactly (ki 1.0, kp 3.0, kd 0.5, base_speed
      1.6, outer sensors at x = ±0.04, sensor_size 0.016, last_direction). It is the
      only raced design that scored above 200, and its s-bend progress (0.462) and
      slalom progress (0.1235) meet the thresholds. Residual max_error (about 0.06
      m) and the oval finish rate (0.2) remain the open problems. I did not test kd
      0.6 because kd 0.3 to 0.5 already raised s-bend oscillation from 0.15 to 0.33,
      so a further step risks crossing the 0.35 limit. Expected result: a score of
      about 217, matching the iteration 7 race under the same seeds. Measurements
      wanted: per-track progress, max_error, steering_oscillation, line_loss_events
      and oval completion_time, to confirm the reproduced result and to give a baseline
      for any kd or base_speed test in a later iteration.


      - [Open this output](iteration-9/entity0/versions/32c9a0710a264d3dab2aeb5c3cae9e56/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-fc176ec26ce97c33/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-749f511d4c741445/payload.json)'
  - id: entityR1
    label: Approve iter-7 best
    notes: 'Approves the iteration 7 design unchanged (ki 1.0, kd 0.5, kp 3.0), the
      best raced score at 216.97, since the ki 1.2 step in iteration 8 fell to 187.18.
      The race is a reproduction, so the next revision round can test base_speed 1.7.


      ### Feedback


      The candidate matches the iteration 7 design exactly: kp 3.0, ki 1.0, kd 0.5,
      base_speed 1.6, outer sensors at x = ±0.04, sensor_size 0.016, last_direction.
      That design raced in iteration 7 and scored 216.97, the best so far. Its oval
      finish rate was 4/20, s-bend progress 0.462 and slalom progress 0.1235. Iteration
      8, which changed only ki to 1.2, scored 187.18, with oval finish rate 2/20 and
      s-bend steering_oscillation 0.339. The ki series (0.8 to 184.93, 1.0 to 216.97,
      1.2 to 187.18) peaks near 1.0. Earlier races rule out wider outer sensors (iteration
      3), higher kp (iteration 4) and lower base_speed (iteration 2). Approving this
      unchanged design gives the team its best known result, but it is a reproduction,
      not new information. Max_error stays near 0.06 m, which is still the open problem.
      After the race, if the score reproduces near 217, use the next revision round
      for one narrow test: base_speed 1.7 with everything else fixed, which may help
      oval finishes if completion_time stays well under 3 s. If the score falls well
      below 217, the seeds or simulator may differ from the earlier race, so re-check
      per-track progress before changing any field.


      ### Requested changes


      - If the race reproduces about 217, test base_speed 1.7 with all other fields
      as in iteration 7. Iteration 2 showed that lowering base_speed to 1.2 removed
      oval finishes, so a small rise is the more plausible direction, and oval completion_time
      (1.93 s at 1.6) must stay well under 3.0 s.

      - Do not raise kd above 0.5 or ki above 1.0 without new evidence. Iteration
      5 showed kd 0.5 raised s-bend progress, and iteration 8 showed ki 1.2 lowered
      the score, with s-bend oscillation near the 0.35 limit.


      - [Open this output](iteration-9/entityR1/versions/6b0c1ddb4bbe46b3a32da915ab32ed98/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/32c9a0710a264d3dab2aeb5c3cae9e56/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-749f511d4c741445/payload.json)'
