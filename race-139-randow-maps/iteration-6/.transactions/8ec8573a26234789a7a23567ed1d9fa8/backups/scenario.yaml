  id: race-139-randow-maps
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Sensor row back to y=0.05
    notes: 'Moves the sensor row from y=0.06 m back to y=0.05 m, following the Integrator''s
      rule for oscillation above 0.10 at y=0.06 m. Iteration 4 (36.81) showed s-bend
      line loss and slalom oscillation of 0.14 at that lead, so only the lead changes.


      ### Rationale


      Iteration 4 scored 36.81, below iteration 3''s 51.31. The s-bend progress fell
      back to 0.0495 with 0.9 line-loss events per run, which is close to the iteration
      0 to 2 level of 0.04. Slalom progress held at 0.0995, so the lead still helps
      the slalom. Slalom steering_oscillation stayed at 0.141, above the 0.10 threshold
      the Integrator set. The oval is unchanged at progress 0.115 and max_error 0.061
      m across iterations 1 to 4, so sensing, mass, track width and lead do not move
      it. That points to a fixed feature of that track, not something I can fix in
      geometry.


      The Integrator''s rule says that if oscillation stays above 0.10 at y=0.06 m,
      return the sensor row to y=0.05 m with wheel_track 0.09 m. The oscillation condition
      is met, and the s-bend line losses came back at y=0.06 m, so I follow that rule.
      I change only the sensor row, from y=0.06 m to y=0.05 m. Spread (+/-0.05 m),
      16 mm footprints, wheel_track 0.09 m, wheel_radius 0.03 m, body and mass stay
      as they were, so the race isolates the lead change.


      Expected result: steering_oscillation falls below 0.10 on the slalom and s-bend,
      line_loss_events on the s-bend drops toward 0, and the score recovers toward
      the iteration 3 level or a little under it, because some bend progress may be
      lost with less lead. I do not expect the oval to change. Wheel_radius 0.04 m,
      the speed lever the Integrator proposed, stays untested for now so it does not
      confound this change.


      - [Open this output](iteration-5/entity0/versions/304efb716302491f99bd16b3d7b716f9/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-1bbbf8c0593c840b/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-197ff81d5b816373/payload.json)'
  - id: entity1
    label: Sensor row back to y=0.05
    notes: 'Applies the pre-agreed rule: sensor row returned from y=0.06 to 0.05 m,
      controller held at iteration 3/4 settings so only the lead changes. Based on
      iteration 3 (51.31) and iteration 4 (36.81) showing 0.14 oscillation and s-bend
      line loss at y=0.06 m.


      ### Rationale


      Iteration 4 (y=0.06 m, 36.81) brought back s-bend line loss (0.9 per run) and
      slalom steering_oscillation of 0.141, both above the 0.10 threshold. Iteration
      3 (y=0.07 m, 51.31) gave the best s-bend progress (0.155). The oval has been
      fixed at progress 0.115 and max_error 0.061 m since iteration 1, so it does
      not respond to sensor row position, mass, track width or lead. Following the
      pre-agreed rule (oscillation above 0.10 at a lead of 0.06 m, return the row
      to 0.05 m), I accept the Builder''s geometry unchanged: sensor row y=0.05 m,
      x = -0.05 to 0.05 m, 16 mm footprints, wheel_track 0.09 m, wheel_radius 0.03
      m, mass 0.5 kg, body 0.12 x 0.12 m. The controller is kept at iteration 3/4
      settings (kp 2.0, ki 0, kd 0.10, base_speed 1.6, last_direction, weights [-2,-1,0,1,2]),
      so this race isolates the lead change. The sensor count and spread match the
      weights, so the signal stays within about +/-2. Expected: steering_oscillation
      falls below 0.10 on slalom and s-bend, line_loss_events trends to 0, and the
      s-bend keeps some progress gain, with the score near or a little below 51. The
      oval should stay near progress 0.115. wheel_radius is not changed, so the speed
      test does not confound the lead test.


      - [Open this output](iteration-5/entity1/versions/8decefe6e1994404a42aa19e58431d1d/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/304efb716302491f99bd16b3d7b716f9/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-197ff81d5b816373/payload.json)'
  - id: entityR1
    label: Lead test feedback
    notes: 'Pre-race feedback: the lead above about 0.06 m is too aggressive for this
      controller, and the oval is fixed at 0.115 progress across iterations. Three
      conditional changes are tied to the next race result: wheel_radius 0.04, y=0.055,
      or kd 0.15 at y=0.06.


      ### Feedback


      Written before this candidate has raced, so no outcome is claimed for it. Evidence:
      iteration 3 (y=0.07 m, 51.31) raised s-bend progress to 0.155 but gave steering_oscillation
      0.127 (s-bend) and 0.138 (slalom), with one line loss per run on those tracks.
      Iteration 4 (y=0.06 m, 36.81) still had oscillation 0.141 on slalom and s-bend
      line loss of 0.9, and its s-bend progress fell back to 0.0495. So the lead above
      about 0.06 m is too aggressive for this controller, and the lead gain on bends
      is partly lost when it is pulled back. The oval is fixed at progress 0.115 and
      max_error 0.061 m across iterations 1 to 4 whatever sensing, mass or track width
      was tried, so geometry alone is unlikely to fix it. What I had to compensate
      for: I held kp 2.0 and kd 0.10 unchanged, because lead changes already moved
      the signal''s timing; I kept ki 0 to avoid windup on bends. Next race: if steering_oscillation
      is below 0.10 on slalom and s-bend with line_loss_events 0 and the score at
      or above 51, keep y=0.05 m and test y=0.055 m. If oscillation is still above
      0.10 at y=0.05 m, the lead is not the cause, so tell me and I will change wheel_radius
      to 0.04 m next. If the s-bend progress falls to the 0.04 level, the lead is
      not helping at this row, so return to y=0.06 m and change nothing else.


      ### Requested changes


      - If steering_oscillation is still above 0.10 on slalom and s-bend at sensor
      y=0.05 m (iteration 4 gave 0.141 at y=0.06 m), keep the row at y=0.05 m and
      set wheel_radius to 0.04 m to test whether ground speed, not lead, is the cause.

      - If the score is above 51.3 with zero line loss on s-bend and slalom (iteration
      3 had one loss per run on each), keep y=0.05 m and test y=0.055 m, a midpoint
      between 0.05 and 0.06 m, changing nothing else.

      - If s-bend progress falls back to the 0.04 level (iterations 0 to 2 and 4 show
      about 0.04 to 0.05), the lead is not helping, so return the row to y=0.06 m
      and change only kd, from 0.10 to 0.15, to damp the jitter at that lead (iteration
      4 showed 0.141 oscillation).


      - [Open this output](iteration-5/entityR1/versions/8decefe6e1994404a42aa19e58431d1d/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/304efb716302491f99bd16b3d7b716f9/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-197ff81d5b816373/payload.json)'
