map:
  id: race-139-randow-maps
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Lighter, narrower body
    notes: 'Keeps the ±0.05 m, 16 mm sensing that gave zero line loss in iteration
      1, and cuts mass to 0.5 kg, body length to 0.12 m and wheel track to 0.10 m
      to make the robot turn faster. The aim is to reduce the 0.06 m max_error that
      still ends every run off track, based on the iteration 1 race telemetry.


      ### Rationale


      The iteration 1 race (entityR2A, 26.64) removed line loss: line_loss_events
      is now 0 on all three tracks, down from 1 per run. Every run still ends off_track,
      with max_error about 0.06 m (the off-track limit) and progress of only 0.035
      to 0.11. So the line is no longer lost. The robot drifts off while the tape
      is still under the sensors, which points to a tracking response problem, not
      a sensing-coverage problem. Steering oscillation is unchanged at about 0.07,
      so the 16 mm footprint is not causing jitter and the ±0.05 m spread is not the
      limiting factor. The off-track limit is max(0.06, 0.0125 + body_width/4). Body
      width 0.18 would only give 0.0575, below the 0.06 floor, so body width cannot
      buy margin and I keep 0.12. What remains is how quickly the body turns and how
      much inertia it has. Yaw inertia is mass*(L²+W²)/12. I lower it by reducing
      mass from 0.7 to 0.5 kg and body length from 0.16 to 0.12 m, so the same wheel
      difference turns the robot faster and it can correct drift before reaching 0.06
      m. I narrow wheel_track from 0.12 to 0.10 m, which raises turn rate per unit
      of wheel difference by about 20%, so the controller''s fixed 350 PWM per turn
      unit has more effect. Sensors stay at ±0.05 m, y = 0.04, 16 mm, which the feedback
      shows is giving zero line loss. Wheel radius stays 0.03 m to keep the speed
      needed for a 3 s finish. Expected result: max_error falls below 0.06 m, progress
      rises above 0.11, and some runs reach progress above 0.5. Risk: a narrower track
      and lighter body may increase oscillation, which I will check against the 0.07
      baseline.


      - [Open this output](iteration-2/entity0/versions/67ffdf62bfb74631a154c24a19fdce5b/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-8b722f533ef8770e/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-f208c0698a5c1abe/payload.json)'
  - id: entity1
    label: Wider spread, 16 mm
    notes: 'Applies the Builder''s ±0.05 m sensor spread and 16 mm footprint with
      the controller unchanged, so the race change reflects sensing only. The baseline
      lost the line at about 0.05 m offset in all 60 trials, which this layout is
      meant to fix.


      ### Rationale


      The baseline race (entityR2A, iteration 0, 60 trials) ended every run off_track
      with one line_loss_event each, max_error about 0.06 m, and progress of only
      0.035 to 0.11. Tracking was not the main problem. The robot lost the tape at
      about 0.045 to 0.05 m offset, then fell back to a fixed search and drifted out.
      I take the Builder''s proposed sensing change as given: sensor spread widens
      to x = -0.05, -0.025, 0, 0.025, 0.05 at y = 0.04, and footprints grow to 16
      mm. I keep the controller unchanged so the race result is attributable to the
      sensing layout. Sensor weights stay [-2, -1, 0, 1, 2]. The signal is a reading-weighted
      average of these weights, so it stays within about ±2 at the wider spread, and
      the same kp and kd keep the response comparable to the baseline. line_loss stays
      ''last_direction'', which still turns the robot toward the side it last saw
      the tape, and this now matters less because the line should stay visible out
      to about 0.07 m. base_speed stays at 1.6, and ki stays at 0 to avoid windup
      on bends. I measure line_loss_events, max_error and rms_error, plus progress
      and completion, so the next iteration can tell whether the spread fixed the
      failure or whether the controller now needs tuning.


      - [Open this output](iteration-1/entity1/versions/3bcc5c4db483458487806adc57c45b48/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/6cfa4b70b8574f8abb44e13fffffbeb1/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-7dc29c06d4a3e8ae/payload.json)'
  - id: entityR1
    label: Spread and footprint next
    notes: 'Feedback written before racing, citing the baseline (all 60 runs ended
      off_track with one line loss at about 0.05 m offset). It gives three conditional
      changes: widen spread to ±0.065 m if losses persist, revert to 12 mm if oscillation
      rises, and test a smaller forward offset if progress is high.


      ### Feedback


      Written before this candidate has raced, so no result is claimed for it. Evidence
      from iteration 0 (entityR2A, 60 trials): every run ended off_track, with one
      line_loss_event per run, max_error about 0.06 m, and progress 0.035 to 0.11.
      The line was lost at about 0.045 to 0.05 m offset, which the 0.03 m spread and
      12 mm footprint could not cover. The controller therefore needed no tuning for
      tracking yet; I kept kp 2.0, ki 0, kd 0.05 and base_speed 1.6 unchanged so the
      race reflects the sensing change alone. A consequence for you: the signal is
      a weighted average of sensor x-weights, so a wider spread does not change its
      scale, and the signal range stays at about ±2 on this geometry. Next race: if
      line_loss_events is still above 0 with max_error near 0.06 m, widen the spread
      further to ±0.065 m (sensor x at -0.065, -0.0325, 0, 0.0325, 0.065) while keeping
      16 mm, since the maximum allowed is ±0.08 m. If line_loss_events is 0 but steering_oscillation
      rises sharply above the baseline 0.07, revert sensor_size to 0.012 m with the
      same spread to test whether the larger footprint is causing the jitter. If the
      robot completes or reaches progress above 0.5 with few losses, keep the geometry
      and let me tune kp between 1.5 and 2.5.


      ### Requested changes


      - If line_loss_events is still above 0 with max_error near 0.06 m (baseline
      showed this in all 60 trials), widen sensor x to ±0.065 m (x = -0.065, -0.0325,
      0, 0.0325, 0.065 at y = 0.04) and keep sensor_size 0.016, then compare line_loss_events
      and max_error.

      - If line_loss_events drops to 0 but steering_oscillation rises above the baseline
      0.07, revert sensor_size to 0.012 m with the same spread, to test whether the
      16 mm footprint causes the signal jitter.

      - If the robot reaches progress above 0.5 without losses, keep the spread and
      footprint fixed and ask for a moderate forward offset change to y = 0.03 m,
      to check whether the 0.04 m lead is causing signal lag on the tightest bends.


      - [Open this output](iteration-1/entityR1/versions/3bcc5c4db483458487806adc57c45b48/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/6cfa4b70b8574f8abb44e13fffffbeb1/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-7dc29c06d4a3e8ae/payload.json)'
