map:
  id: race-139-randow-maps
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Sensor row back to y=0.05
    notes: 'Moves the sensor row from y=0.06 m back to y=0.05 m, following the Integrator''s
      rule for oscillation above 0.10 at y=0.06 m. Iteration 4 (36.81) showed s-bend
      line loss and slalom oscillation of 0.14 at that lead, so only the lead changes.


      ### Rationale


      Iteration 4 scored 36.81, below iteration 3''s 51.31. The s-bend progress fell
      back to 0.0495 with 0.9 line-loss events per run, which is close to the iteration
      0 to 2 level of 0.04. Slalom progress held at 0.0995, so the lead still helps
      the slalom. Slalom steering_oscillation stayed at 0.141, above the 0.10 threshold
      the Integrator set. The oval is unchanged at progress 0.115 and max_error 0.061
      m across iterations 1 to 4, so sensing, mass, track width and lead do not move
      it. That points to a fixed feature of that track, not something I can fix in
      geometry.


      The Integrator''s rule says that if oscillation stays above 0.10 at y=0.06 m,
      return the sensor row to y=0.05 m with wheel_track 0.09 m. The oscillation condition
      is met, and the s-bend line losses came back at y=0.06 m, so I follow that rule.
      I change only the sensor row, from y=0.06 m to y=0.05 m. Spread (+/-0.05 m),
      16 mm footprints, wheel_track 0.09 m, wheel_radius 0.03 m, body and mass stay
      as they were, so the race isolates the lead change.


      Expected result: steering_oscillation falls below 0.10 on the slalom and s-bend,
      line_loss_events on the s-bend drops toward 0, and the score recovers toward
      the iteration 3 level or a little under it, because some bend progress may be
      lost with less lead. I do not expect the oval to change. Wheel_radius 0.04 m,
      the speed lever the Integrator proposed, stays untested for now so it does not
      confound this change.


      - [Open this output](iteration-5/entity0/versions/304efb716302491f99bd16b3d7b716f9/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-1bbbf8c0593c840b/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-197ff81d5b816373/payload.json)'
  - id: entity1
    label: Lead test at y=0.06 m
    notes: 'Moves the sensor row from y=0.07 to y=0.06 m and holds the iteration 3
      controller, so the race isolates the lead. Based on iteration 3, which gained
      on the s-bend but showed oscillation above 0.10 and line loss.


      ### Rationale


      Iteration 3 (51.31) is the best raced design. Its s-bend progress rose from
      0.040 to 0.155 and slalom progress from 0.035 to 0.099, but both tracks showed
      one line-loss event each, steering_oscillation of 0.127 (s-bend) and 0.138 (slalom),
      and slalom max_error of 0.065 m, past the 0.06 m limit. The oval has sat at
      progress 0.115 and max_error 0.061 m since iteration 1, so it does not respond
      to sensing, inertia or track width. The Builder''s geometry for this iteration
      moves the sensor row from y=0.07 m back to y=0.06 m and keeps every other field
      from iteration 3. I keep the iteration 3 controller unchanged (kp 2.0, ki 0,
      kd 0.10, base_speed 1.6, last_direction, weights [-2,-1,0,1,2]). This keeps
      the race attributable to the lead change alone, which is the Builder''s stated
      test. The sensor weights still match the unchanged +/-0.05 m spread, so the
      signal stays within about +/-2. Expected result: steering_oscillation falls
      toward 0.09 to 0.11, line_loss_events trends to 0, and the s-bend keeps most
      of its progress gain. If oscillation is still above 0.10 with max_error at or
      above 0.06 m, the next step is kd 0.15 or a lower kp, and I will say so in the
      next feedback.


      - [Open this output](iteration-4/entity1/versions/5dbfd7491af441efad683c4642cffe9e/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/34c3ef2345f647ccb19721f1b5e445f8/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-a0bc16120c79249d/payload.json)'
  - id: entityR1
    label: Lead and speed feedback
    notes: 'Advises on the y=0.06 m result without claiming an outcome. Cites iteration
      3''s s-bend gain against its oscillation and line loss, and the oval''s fixed
      max_error across four iterations.


      ### Feedback


      Written before this candidate has raced, so no outcome is claimed. Evidence:
      iterations 0 to 3 show the oval stuck at progress 0.115 and max_error 0.061
      m whatever sensing, inertia or track width was tried, so it is probably a fixed
      feature of that track, not something geometry alone fixes. Iteration 3 (y=0.07
      m) gave the best score (51.31) through s-bend progress 0.155, but steering_oscillation
      rose to 0.127 and 0.138 and line_loss_events returned to 1 on s-bend and slalom,
      with slalom max_error 0.065 m. I keep the controller at iteration 3 settings,
      so any change in the next race is attributable to the sensor row. If the next
      race shows steering_oscillation at or below 0.10 with line_loss_events at 0
      and s-bend progress near 0.15 or better, keep y=0.06 m and tune the lead between
      0.06 and 0.07 m. If oscillation is still above 0.10 at y=0.06 m, return the
      row to y=0.05 m. If the s-bend progress falls back to the 0.04 level (iteration
      0 to 2 values), the lead is not helping, so keep the lead but change nothing
      else. Per track, check max_error on the oval, because it has not moved in four
      iterations.


      ### Requested changes


      - If steering_oscillation is still above 0.10 at sensor y=0.06 m (iteration
      3 gave 0.127 on s-bend and 0.138 on slalom), return sensor_positions y to 0.05
      m and keep wheel_track 0.09 m, to test whether the lead is too aggressive.

      - If line_loss_events is 0 but s-bend progress stays below 0.2 and max_error
      is at or above 0.06 m (iterations 0 to 3 all show this), change wheel_radius
      to 0.04 m to raise ground speed. Turn authority changes (iteration 2, wheel_track
      0.12 to 0.10 m) did not move max_error, so speed is the next untested lever.

      - If slalom max_error stays above 0.06 m at y=0.06 m (iteration 3 gave 0.065
      m), widen the sensor x spread to +/-0.065 m with sensor_size 0.016, since the
      0.05 m spread may let the line leave view on the slalom bends.


      - [Open this output](iteration-4/entityR1/versions/5dbfd7491af441efad683c4642cffe9e/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/34c3ef2345f647ccb19721f1b5e445f8/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-a0bc16120c79249d/payload.json)'
