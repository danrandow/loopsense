map:
  id: race-139-randow-maps
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 8 is the best design so far (56.40). Relative to iteration 3 (51.31,
      spread ±0.05 m at y=0.07 m), widening the spread to ±0.065 m cut s-bend line
      loss from 1 per run to 0.05 per run and lifted s-bend progress to 0.1825. Slalom
      still loses the line once per run, with max_error 0.0604 m (just above the 0.06
      m limit) and steering_oscillation 0.131. The Integrator''s rule applies directly:
      line loss returned at y=0.07 m with the ±0.065 m spread, so the spread is kept
      and the row is moved to y=0.067 m. This tests whether a slightly smaller lead
      cuts slalom line loss while keeping most of the s-bend gain. Iteration 7 (y=0.065
      m) showed that going too far forward-back costs s-bend progress (it fell to
      0.04), so 0.067 m is a small step, not a fall-back. Speed stays at wheel_radius
      0.03 m, since 0.04 m caused line loss in iteration 6. The oval stays fixed at
      progress 0.115 across all iterations, so I do not expect a change there. Body,
      mass, wheel track, footprint size and gains are unchanged from iteration 8,
      so the race isolates the row position.


      - [Open this output](iteration-9/entity0/versions/0981eea6e66245eb9a60393d1047cb3a/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-5acfa9b89b7c0ff2/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-efe1946c59993ae0/payload.json)'
  - id: entity1
    label: Row 0.067m, ±0.065 spread
    notes: 'Moves the iteration 8 forward row from y=0.07 to 0.067 m, with the ±0.065
      m 16 mm layout and controller unchanged. The change isolates a 3 mm lead cut
      against the slalom line loss seen in iteration 8.


      ### Rationale


      Iteration 8 is the best raced design (56.40): the ±0.065 m spread cut s-bend
      line loss to 0.05 per run and gave s-bend progress 0.1825. Slalom still lost
      the line once per run (max_error 0.0604 m, oscillation 0.131). Iterations 3,
      4 and 5 show that slalom oscillation stays near 0.13 to 0.14 at every row position
      (y=0.05 to 0.07 m), so the lead is not its cause. Iteration 7 (y=0.065 m, ±0.065
      m) lost the slalom line and fell back to s-bend progress 0.04, so the lead should
      not drop far below 0.067 m. I accept the Builder''s geometry as written: the
      same ±0.065 m, 16 mm layout as iteration 8, with the forward row moved to y=0.067
      m. The controller is kept exactly as in iteration 8 (kp 2.0, ki 0, kd 0.10,
      base_speed 1.6, last_direction, weights [-2,-1,0,1,2]). Changing the controller
      in the same race would make the row result impossible to attribute, and kd and
      kp have not been shown to move slalom oscillation. The observation request asks
      for per-track line loss, max_error, progress and oscillation so the slalom and
      s-bend results can be read separately. Expected: slalom line loss near 0, s-bend
      progress near 0.18, and a score of 53 to 58. Risk: the 3 mm lead cut may lose
      some s-bend progress.


      - [Open this output](iteration-9/entity1/versions/f5d94231b8494981bc47ee73dc71b42d/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/0981eea6e66245eb9a60393d1047cb3a/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-efe1946c59993ae0/payload.json)'
  - id: entityR1
    label: Row and spread next steps
    notes: 'Gives three rules for the next race: hold the spread if slalom line loss
      clears, widen to ±0.08 m if slalom max_error stays at or above 0.06 m, or test
      a 12 mm footprint if the score reaches 56.4. Each rests on iterations 7 and
      8.


      ### Feedback


      Written before this candidate has raced, so no outcome is claimed for it. Evidence:
      iteration 8 (y=0.07 m, ±0.065 m, 16 mm, 56.40) gave s-bend line loss of 0.05
      per run and s-bend progress of 0.1825, but slalom still lost the line once per
      run, with max_error 0.0604 m and oscillation 0.131. Iteration 7 (y=0.065 m,
      ±0.065 m, 35.77) lost the slalom line again and dropped s-bend progress to 0.04.
      So the lead below 0.067 m is risky, and 0.067 m is a small step rather than
      a fall-back. Iteration 6 (wheel_radius 0.04 m) showed that more speed brings
      line loss back, so speed stays at 0.03 m. Slalom oscillation stayed at 0.13
      to 0.14 at every row tested (iterations 3 to 8), so it is not lead-driven. The
      oval has been fixed at progress 0.115 and max_error about 0.061 m since iteration
      1. What I compensated for: kp 2.0, kd 0.10, ki 0 and the [-2,-1,0,1,2] weights
      were kept, because the signal stays within about ±2 across the ±0.065 m spread.
      Next race: if slalom line_loss_events is 0 and max_error is below 0.06 m, keep
      the ±0.065 m spread and the 0.067 m row. If slalom line loss returns at 0.067
      m, the spread is not the cure. Then keep the spread and do not move the row
      further forward or back. If slalom max_error is still at or above 0.06 m with
      zero line loss, widen the spread to ±0.08 m with 16 mm footprints.


      ### Requested changes


      - If slalom line_loss_events stays at 1 per run at y=0.067 m with zero s-bend
      loss, keep the ±0.065 m spread and 0.03 m speed, and do not move the row further
      (iteration 7 showed y=0.065 m also lost the slalom line).

      - If slalom max_error is still at or above 0.06 m with zero line loss (iteration
      8 gave 0.0604 m, iteration 7 gave 0.0642 m), widen sensor x to ±0.08 m with
      16 mm footprints, so the line stays under the sensors at the largest bend offsets.

      - If the score is at or above 56.4 with zero line loss, keep the geometry fixed
      and test sensor_size 0.012 m at the same positions, to check whether a smaller
      footprint reduces the jitter that the 16 mm footprint may add (iteration 1 showed
      the 16 mm footprint removed line loss).


      - [Open this output](iteration-9/entityR1/versions/f5d94231b8494981bc47ee73dc71b42d/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/0981eea6e66245eb9a60393d1047cb3a/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-efe1946c59993ae0/payload.json)'
