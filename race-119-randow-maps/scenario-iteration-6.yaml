map:
  id: race-119-randow-maps
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 5 (wheel_track 0.12 to 0.10 m, everything else held at iteration 3
      values) moved the s-bend from progress 0.17 to 0.42 and cut its line losses
      to 0.1 per run. The s-bend still leaves the track at max_error 0.0624, just
      above the 0.06 m limit, so the turn-rate change helped but did not finish the
      bend. The oval is fine at 20 of 20 finishes, progress 0.998 and max_error 0.037,
      so I keep wheel_track at 0.10 and do not return to 0.11. The slalom still loses
      the line once per run (line_loss_events 1.0) and leaves the track at progress
      0.0975. This matches the Integrator''s decision rule: the s-bend is drift at
      about 0.061 m, and the slalom is still losing the line once per run, so the
      next step is slalom sensor coverage. I change sensor_size from 0.012 to 0.016
      m, keeping the same five-sensor row at y=0.08 with x spread ±0.06, so the footprint
      covers more tape at the edges where the line is lost. The 0.016 footprint at
      x=±0.06 still sits inside the body envelope (about ±0.068 m reach, against the
      ±0.06 body half-width plus margin). Body, wheels and mass stay the same, since
      the off-track floor binds at 0.06 m for all body widths. Expected result: slalom
      line_loss_events falls below 1.0 and slalom progress rises above 0.10, with
      the oval finish rate holding at or above 0.85. A risk is that the larger footprint
      blurs the line-edge signal, which could raise oscillation on the oval, so I
      ask for oscillation to be measured.


      - [Open this output](iteration-6/entity0/versions/009af402e35a462fb5556ce90cc2b246/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-6f41205da7cdb030/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-7bd88dc326da31da/payload.json)'
  - id: entity1
    label: Sensor footprint 0.016
    notes: 'Adopts the Builder''s sensor_size 0.016 change on the iteration 5 geometry,
      with the controller held fixed to isolate it. Iteration 5 gave the best score
      so far (386.35), with oval 20/20 finishes and s-bend progress 0.42, but the
      slalom still loses the line once per run.


      ### Rationale


      Iteration 5 is the best raced design (386.35). Its wheel_track change from 0.12
      to 0.10 m raised s-bend progress from 0.17 to 0.42 and cut s-bend line losses
      to 0.1 per run. The oval finished 20 of 20 runs at progress 0.998, so the narrower
      track did not cause overshoot. The s-bend still leaves the track at max_error
      0.0624, and the slalom loses the line once per run (line_loss_events 1.0, progress
      0.0975). The slalom loss is a sensor-coverage limit, not a steering-gain limit.
      The Builder''s entity0 moves sensor_size from 0.012 to 0.016 m with the row
      unchanged at y=0.08 and x spread ±0.06, and I accept it as proposed. The 0.016
      footprint is inside the allowed sizes, and the outer sensors at x=±0.06 reach
      about ±0.068 m, which is within the ±0.08 limit. I keep the controller exactly
      at iteration 5''s values (kp 5.0, ki 0.1, kd 0.8, weights ±1.5/±0.75/0, base_speed
      1.6, last_direction). The larger footprint should keep more tape in view at
      the edge and reduce the once-per-run slalom loss. Because it is a sensing change,
      I isolate it by holding every gain fixed. I add steering_oscillation, controller_errors
      and noise_robustness to the observation request so I can see whether the blurrier
      edge signal raises jitter on the oval. Expected result: slalom line_loss_events
      below 1.0, slalom progress above 0.10, s-bend progress at or above 0.42, and
      oval finish rate at or above 0.85.


      - [Open this output](iteration-6/entity1/versions/3f776086347142fc8833235e6163f155/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/009af402e35a462fb5556ce90cc2b246/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-7bd88dc326da31da/payload.json)'
  - id: entityR1
    label: Next-step sensing rules
    notes: 'Feedback written before racing, citing iteration 5''s s-bend and slalom
      results and iteration 4''s ki test. It gives decision rules for widening the
      row, narrowing wheel_track to 0.09, or returning the footprint to 0.012 if oscillation
      rises.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. Iteration
      5 (wheel_track 0.10, controller kp 5.0, ki 0.1, kd 0.8, outer weights ±1.5,
      inner ±0.75, sensor_size 0.012, row at y=0.08 with ±0.06 spread) scored 386.35,
      the best so far. The oval finished 20 of 20 runs, the s-bend progress rose from
      0.17 to 0.42, and the slalom still lost the line once per run at progress 0.10.
      Iteration 4 showed that raising ki to 0.3 did not reduce the s-bend drift (still
      0.0609) and cut the oval finish rate to 0.85, so the s-bend limit is turn rate,
      not a steady bias. For this race I keep the controller at iteration 5''s values,
      so your sensor_size change is the only variable. Decision rules for the next
      race: if the slalom still loses the line about once per run with the outer sensors
      reading near zero, keep sensor_size 0.016 and try a wider row of x=±0.07 at
      y=0.08 with the same weights. If the s-bend still leaves the track at max_error
      about 0.062 with line losses near zero, narrow wheel_track to 0.09 m. If steering_oscillation
      rises on the oval above about 0.3 while max_error stays low, return sensor_size
      to 0.012 and change sensor spacing instead.


      ### Requested changes


      - If the slalom still loses the line about once per run with the outer sensors
      reading near zero after sensor_size 0.016, widen the row to x=±0.07 at y=0.08,
      keeping the weights at ±1.5 and ±0.75. Iterations 3 and 5 both show the slalom
      losing the line once per run at the ±0.06 spread, so the outer sensors need
      more reach.

      - If the s-bend still leaves the track at max_error about 0.061 to 0.062 m with
      line_loss_events near 0, change wheel_track from 0.10 to 0.09 m. Iteration 5
      moved s-bend progress from 0.17 to 0.42 when wheel_track went from 0.12 to 0.10
      m, and the oval stayed at 20 of 20 finishes, so a further step is likely to
      help.

      - If steering_oscillation rises above about 0.3 on the oval after sensor_size
      0.016, return sensor_size to 0.012 and keep the ±0.06 row, rather than widening
      further. Iteration 4 showed that extra authority lowers the oval finish rate,
      so the larger footprint should not add jitter if the sensing change is working
      as intended.


      - [Open this output](iteration-6/entityR1/versions/3f776086347142fc8833235e6163f155/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/009af402e35a462fb5556ce90cc2b246/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-7bd88dc326da31da/payload.json)'
