map:
  id: race-191-randow-maps-muted
  schema: v0.2
  scenario: Iteration 1
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 0.
dimensions:
  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Narrower, lighter body
    notes: 'Reduced wheel track from 0.12 to 0.10 m and mass from 0.8 to 0.6 kg, with
      the sensor row unchanged, to test whether faster yaw response cuts the early
      off-track exits. Based on iteration 0, where all 60 development trials ended
      off track at about 11-16% progress with max_error near 0.06-0.07 m, and the
      body-width off-track limit is fixed at 0.06 m.


      ### Rationale


      The development race for iteration 0 has no completions. All 60 trials ended
      off track after about 11-16% progress, with max_error near 0.06-0.07 m. With
      body_width 0.12 the off-track limit is max(0.06, 0.0125 + 0.03) = 0.06 m. Widening
      the body cannot raise that limit above 0.06 m (a 0.18 m body still gives 0.0575
      m), so the limit is fixed and the robot must keep its error smaller. The early
      failures point to a slow corrective response rather than to the sensor row losing
      the line: the line loss count is 1 per run, and the failure happens well before
      the course ends. The yaw response is set by wheel_track and mass. Yaw inertia
      is mass*(L^2+W^2)/12, and turn rate is the wheel speed difference divided by
      wheel_track. A narrower track gives more yaw per PWM difference, and a lighter
      robot has less inertia to resist it. I therefore change only the drivetrain
      response this iteration: wheel_track from 0.12 to 0.10 m and mass from 0.8 to
      0.6 kg. The sensor row, its 50 mm lead and body are kept fixed so the effect
      can be read cleanly. I expect max_error to fall below 0.06 m on the oval and
      s-bend, which would let runs go further, with a risk of more steering oscillation
      on the slalom. This is an isolated test, not a final design.


      - [Open this output](iteration-1/entity0/versions/af9e394d3ffc4497af43f0f51846f9fd/payload.json)

      - Based on: [entityR2A](iteration-1/entityR2A/versions/carried-e6dad3d643b2c1ba/payload.json)'
  - id: entity1
    label: Narrow, light body, kp
    notes: 'Builder''s track 0.10 m and mass 0.6 kg with kp scaled down to offset
      higher yaw gain, kd raised to 0.25 and base_speed set to 1.5. Iteration 0 left
      every run off track with max_error about 0.06-0.07 m, so the drivetrain change
      is tested in isolation.


      ### Rationale


      Iteration 0 (the baseline, kp 1.5, kd 0.15, wheel_track 0.12, mass 0.8) left
      all 60 trials off track at 11-16% progress. max_error was 0.061-0.070 m against
      the 0.060 m limit, and each run had exactly one line-loss event, so the robot
      drifted off the line rather than losing sight of it early. The Builder''s max_error
      0.06 limit cannot be raised by body width (0.18 m gives 0.0575 m), so the robot''s
      error must come down. The Builder''s test changes only the drivetrain: wheel_track
      0.12 to 0.10 m and mass 0.8 to 0.6 kg. Turn rate per unit of turn command scales
      as 1/wheel_track, so the effective steering gain rises by about 20 percent.
      Keeping kp at 1.5 would risk overcorrection and oscillation, so I scale kp down
      to 1.25 to hold the effective gain near the baseline. The lighter robot has
      less yaw inertia, so the response is quicker and needs slightly more damping.
      I raise kd from 0.15 to 0.25. ki stays at 0 because the integral adds lag and
      the motor mismatch is small. base_speed drops from 1.6 to 1.5 to reduce the
      lateral speed at bends while keeping close to the 1.5 m/s average the 3 s limit
      needs. The sensor weights, line_loss mode and sensor row are unchanged so the
      drivetrain effect can be read cleanly. I expect max_error to fall below 0.06
      m on the oval and s-bend, with a risk of more steering oscillation on the slalom.


      - [Open this output](iteration-1/entity1/versions/768874ed907b4f8a99ffef99e893b450/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/af9e394d3ffc4497af43f0f51846f9fd/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-e6dad3d643b2c1ba/payload.json)'
  - id: entityR1
    label: Lead or yaw limit next
    notes: 'Feedback gives the next-race decision rule: move the sensor row forward
      if early off-track persists, or restore mass or track width if slalom oscillation
      rises. Based on the iteration 0 outcome table, where every run ended off track
      at 11-16% progress.


      ### Feedback


      Written before this candidate has raced. Iteration 0 (the 0.12 m / 0.8 kg baseline)
      ended all 60 trials off track at 11-16% progress, with max_error 0.061-0.070
      m and one line-loss event per run. The limit of max(0.06, 0.0125 + body_width/4)
      is fixed at 0.06 m for any body_width up to 0.18 m, so the robot''s error must
      come down. I changed only the drivetrain in this package, so the next race isolates
      the effect of the Builder''s track and mass change. The narrower track gives
      about 20 percent more yaw per unit of turn command, so I reduced kp and raised
      kd to compensate. Depending on what the next race shows: if the robot still
      leaves the track early (off_track before about 20 percent progress) with max_error
      near 0.06 m, and the line-loss count stays at 1, the limit is likely the sensor
      lead rather than yaw response. Then move the sensor row forward (y from 0.05
      to about 0.065 m) before changing the drivetrain further. If steering_oscillation
      on the slalom rises clearly above the iteration 0 level of about 0.16 while
      max_error falls, the body has become too responsive, so restore some mass or
      track width. If the robot finishes the oval or s-bend but stalls or times out
      on the slalom, the constraint is speed rather than steering, so change the wheel
      radius or base_speed before changing the sensors.


      ### Requested changes


      - If the robot still goes off track before 20 percent progress with max_error
      near 0.06 m and line_loss_events of 1: move the sensor row forward from y =
      0.05 to y = 0.065 m, since iteration 0 showed the failure happens early and
      well before the course ends, which points to lead rather than drivetrain.

      - If steering_oscillation on the slalom rises above about 0.16 while max_error
      falls: restore mass to 0.7 kg or wheel_track to 0.11 m, because iteration 0
      had oscillation near 0.16 at the wider track and any further narrowing will
      add yaw gain.

      - If runs finish or reach high progress but do not complete within 3 s: raise
      wheel_radius from 0.03 to 0.035 m, because iteration 0 showed no completions
      at all, so speed is the untested constraint and needs a clear result before
      any further steering change.


      - [Open this output](iteration-1/entityR1/versions/768874ed907b4f8a99ffef99e893b450/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/af9e394d3ffc4497af43f0f51846f9fd/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-e6dad3d643b2c1ba/payload.json)'
