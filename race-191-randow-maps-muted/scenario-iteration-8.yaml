map:
  id: race-191-randow-maps-muted
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: 'Lighter body: 0.4 kg mass'
    notes: 'Keeps the best row so far (iteration 7: 0.08 m track, seven sensors) and
      drops mass from 0.6 to 0.4 kg to lower yaw inertia. Track and body width are
      settled, so mass is the remaining isolated drivetrain lever for the s-bend and
      slalom floor errors.


      ### Rationale


      Iteration 7 is the best result so far (67.95). Narrowing wheel_track from 0.10
      to 0.08 m lifted the oval to 84.1 with zero line losses, and it raised the s-bend
      and slalom modestly. Every development run still ends off track, with max_error
      about 0.062-0.066 m, just past the fixed 0.06 m floor. Body width cannot relax
      that floor: max(0.06, 0.0125 + 0.18/4) is still 0.06 m. Sensor lead (y = 0.07
      m), span (seven sensors at 20 mm spacing, +/-0.06 m) and footprint (12 mm) have
      all been tested, and the 16 mm footprint did not help. Wheel_track is already
      at its 0.08 m minimum, so yaw authority can''t be increased further through
      track width. Mass is the remaining yaw-response lever: yaw inertia is mass*(L^2+W^2)/12,
      so a lighter body turns more readily for the same wheel difference. Iteration
      1 changed mass together with track and showed only a small effect, but that
      change was confounded with a wider track. I now isolate mass by moving it from
      0.6 to the 0.4 kg minimum, keeping the sensor row and the 0.08 m track from
      iteration 7. Expected result: lower yaw inertia gives faster correction at the
      floor error, so max_error and steering oscillation fall on the s-bend and slalom,
      and line_loss_events trend toward 0. Risk: the lighter body may carry less grip,
      and the slalom may oscillate more.


      - [Open this output](iteration-8/entity0/versions/1bb4c1a6ff794626a2ea8bb66d198601/payload.json)

      - Based on: [entityR2A](iteration-8/entityR2A/versions/carried-016f2a548b7e6fee/payload.json)'
  - id: entity1
    label: Mass 0.4 kg, kd 0.30
    notes: 'Builder''s 0.4 kg mass on the iteration 7 design, with kd raised from
      0.25 to 0.30 to damp the faster yaw response. Based on iteration 7 (67.95),
      where slalom oscillation was already 0.161.


      ### Rationale


      Iteration 7 is the best result so far (67.95). Narrowing wheel_track to 0.08
      m lifted the oval to 84.1 with zero line losses, and the s-bend and slalom rose
      modestly. Every track still ends off track with max_error about 0.061-0.066
      m, just past the fixed 0.06 m floor. The Builder''s intent is to change only
      mass, from 0.6 to 0.4 kg, which is the contract minimum. Yaw inertia scales
      with mass, so a lighter body should correct faster for the same wheel difference.
      I keep the Builder''s geometry unchanged so the mass test stays isolated. The
      controller is the same as iteration 7 except kd rises from 0.25 to 0.30. Slalom
      steering_oscillation was already 0.161 in iteration 7, and a lighter body responds
      more quickly, so a little more damping is the main risk to manage. kp, base_speed,
      the 7-sensor weights and last_direction are unchanged. Expected: max_error on
      the s-bend and slalom falls toward or below 0.06 m, line_loss_events trend toward
      0, and progress rises above the iteration 7 values (s-bend about 0.178, slalom
      about 0.115). Steering oscillation should stay near or below about 0.17.


      - [Open this output](iteration-8/entity1/versions/0a2395ba85e944f384ee342d73ccc465/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/1bb4c1a6ff794626a2ea8bb66d198601/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-016f2a548b7e6fee/payload.json)'
  - id: entityR1
    label: Mass and speed next steps
    notes: 'Pre-race feedback: keep 0.4 kg unless slalom oscillation exceeds 0.18,
      then move to 0.5 kg. Test wheel_radius 0.035 m if max_error stays pinned near
      0.06 m, citing iterations 1 to 7.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. Iteration
      7 (wheel_track 0.08 m, 7 sensors at 20 mm, +/-0.06 m span, y = 0.07 m, 12 mm
      footprints, mass 0.6 kg) scored 67.95, the best so far. It removed line loss
      on the oval (84.1 mean), but the s-bend and slalom still lose the line once
      per run, with max_error 0.066 and 0.061 m. Iteration 6 showed the 16 mm footprint
      did not help, so sensing is not the limit. Iteration 1 changed mass and track
      together, so it gives no clean evidence for mass alone. The mass test is therefore
      informative. Depending on the next race: if the s-bend and slalom max_error
      falls below 0.06 m and line_loss_events drop toward 0, keep mass 0.4 kg and
      the 0.08 m track. If slalom steering_oscillation rises above about 0.18 at 0.4
      kg, the body has become too responsive, so move mass to about 0.5 kg as the
      compromise. If max_error stays pinned at 0.061-0.066 m with no change in progress,
      mass is no longer binding and the next lever is speed. Reducing wheel_radius
      to 0.025 m would cut top speed, but the 3 s finish limit needs about 1.5 m/s,
      and no run has yet completed, so reduce it only if the runs are overshooting
      the line at speed. Otherwise test a larger radius of 0.035 m for more ground
      speed.


      ### Requested changes


      - If slalom steering_oscillation rises above about 0.18 with mass 0.4 kg (iteration
      7 slalom was 0.161 at 0.6 kg), set mass to 0.5 kg as the compromise, citing
      the iteration 7 oscillation data.

      - If max_error stays at 0.061-0.066 m and progress is unchanged on the s-bend
      and slalom, the yaw response is not the limit. Try wheel_radius 0.035 m for
      more ground speed, citing iteration 7 where wheel_track changes did not move
      progress beyond 0.18 on the s-bend. Do not reduce wheel_radius to 0.025 m unless
      the robot overshoots the line at speed, because lower radius reduces the speed
      the 3 s finish needs.

      - Keep the 7-sensor row, y = 0.07 m, 12 mm footprints and the 0.08 m track fixed
      for this step. Iteration 6 (16 mm footprints) scored lower than iteration 5,
      and iteration 7 showed track narrowing was the only drivetrain change to produce
      a clear gain.


      - [Open this output](iteration-8/entityR1/versions/0a2395ba85e944f384ee342d73ccc465/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/1bb4c1a6ff794626a2ea8bb66d198601/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-016f2a548b7e6fee/payload.json)'
