  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Wheel radius 0.034 m
    notes: 'Raises wheel radius from 0.030 to 0.034 m on the best design so far (iteration
      8, score 71.37), reversing the 0.025 m change that scored 69.72. Ground speed
      looks like the binding limit for progress, so the test checks whether more speed
      lifts progress without breaking line tracking.


      ### Rationale


      Iteration 8 (0.4 kg, 0.08 m track, 0.03 m wheel radius, seven sensors at 20
      mm spacing, y = 0.07 m, 12 mm footprints) is the best result so far at 71.37.
      Mass is now at its 0.4 kg minimum and wheel_track at its 0.08 m minimum, so
      those yaw levers are spent. Body width cannot lift the 0.06 m off-track floor,
      and body_length has no dynamic effect. Sensor lead, span and footprint have
      all been tested and settled.


      Iteration 9 cut wheel_radius from 0.030 to 0.025 m to slow the robot, and the
      score fell by 1.65. The oval, s-bend and slalom all dropped, and progress is
      the main shortfall (about 0.12 to 0.20 of the course, with no completions).
      Speed is therefore not excessive. The robot is too slow to cover the course
      in 3 s, and lowering wheel radius made that worse. The reverse direction is
      the untested one. I increase wheel_radius to 0.034 m, a moderate step that should
      raise ground speed per wheel rotation and progress within the time limit. The
      risk is that faster travel leaves less time to correct at the 0.06 m floor,
      which could raise max_error and oscillation on the s-bend and slalom. Everything
      else stays fixed at the iteration 8 values, so the change isolates wheel radius.


      - [Open this output](iteration-10/entity0/versions/dde1d08fb38545329f8d2bee865f48e2/payload.json)

      - Based on: [entityR2A](iteration-10/entityR2A/versions/carried-35941b356f926be7/payload.json)'
  - id: entity1
    label: Wheel radius 0.034 m test
    notes: 'Iteration 8 design with wheel_radius raised from 0.030 to 0.034 m and
      the controller unchanged. Iteration 9 showed that a smaller radius lowered progress
      on every track, so this tests speed in the opposite direction.


      ### Rationale


      The Builder''s geometry changes only wheel_radius, from 0.030 m (iteration 8)
      to 0.034 m. Iteration 9 cut the radius to 0.025 m, and the score fell 1.65 with
      progress lower on all three tracks (oval 0.197 vs 0.201, s-bend 0.185 vs 0.188,
      slalom 0.119 vs 0.125). max_error and line loss did not improve. Speed is therefore
      not too high, so a larger radius is the direction the evidence supports. The
      controller stays identical to iteration 8 (kp 1.25, ki 0, kd 0.30, base_speed
      1.5, the seven-sensor weights [2.0, 1.3, 0.7, 0, -0.7, -1.3, -2.0], last_direction).
      Changing gains now would confound the speed test. I expect progress to rise
      on the oval and s-bend, with max_error near 0.062-0.066 m and steering oscillation
      close to iteration 8 values. Any drift in oscillation will show whether the
      faster ground speed needs more damping in a later iteration.


      - [Open this output](iteration-10/entity1/versions/24727401da27465ba59dbc34ea5d6fb0/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/dde1d08fb38545329f8d2bee865f48e2/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-35941b356f926be7/payload.json)'
  - id: entityR1
    label: Radius up, then
    notes: 'Feedback says to keep raising wheel_radius toward 0.038 m if progress
      rises with max_error stable, and to hold at 0.034 m if slalom oscillation exceeds
      about 0.18. Evidence is from iterations 8 and 9.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. Iteration
      9 (wheel_radius 0.025 m, otherwise iteration 8) scored 69.72, below iteration
      8''s 71.37. Progress fell on all three tracks (oval 0.197 from 0.201, s-bend
      0.185 from 0.188, slalom 0.119 from 0.125), while max_error stayed at 0.062-0.063
      m and line_loss_events stayed at about 1 on the s-bend and slalom. Lower radius
      therefore does not fix the control problem and costs progress. Iteration 8 (mass
      0.4 kg, radius 0.030 m) is the reference. Depending on the next race: if progress
      rises above the iteration 8 values on all tracks while max_error stays near
      0.062-0.066 m, keep increasing the radius toward 0.038 m. If progress rises
      but steering_oscillation on the slalom rises above about 0.18 (iteration 8 was
      0.168), keep 0.034 m and address damping before adding more speed. If progress
      falls, return to 0.030 m, since both directions from there have now been tested.


      ### Requested changes


      - If progress rises on all three tracks at wheel_radius 0.034 m with max_error
      still near 0.062-0.066 m, try wheel_radius 0.038 m next, citing iteration 8
      (oval 0.201, s-bend 0.188, slalom 0.125) and iteration 9, where the smaller
      radius reduced progress on every track.

      - If slalom steering_oscillation rises above about 0.18 with the larger radius,
      keep wheel_radius at 0.034 m and do not increase it further, citing iteration
      8 slalom oscillation of 0.168 at 0.030 m.

      - Keep mass at 0.4 kg, wheel_track at 0.08 m, sensor_size at 0.012 m and the
      seven-sensor row at y = 0.07 m fixed. Iteration 8 gave the best result with
      these values, and iterations 6 and 7 showed the 16 mm footprint and wider tracks
      did not help.


      - [Open this output](iteration-10/entityR1/versions/24727401da27465ba59dbc34ea5d6fb0/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/dde1d08fb38545329f8d2bee865f48e2/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-35941b356f926be7/payload.json)'
