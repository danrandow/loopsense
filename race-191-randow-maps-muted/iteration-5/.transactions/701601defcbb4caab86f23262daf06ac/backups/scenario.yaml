map:
  id: race-191-randow-maps-muted
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Wider sensor span (7
    notes: 'Widens the row to seven sensors at 20 mm spacing spanning ±0.06 m, so
      outer sensors capture the tape past the 0.06 m off-track limit. Iteration 4
      showed that span, not lead, is now the limit, with the best score so far (61.45)
      and one line-loss per run.


      ### Rationale


      Four iterations give a consistent picture. Every development run ends off track
      at 11-16% progress, with max_error near 0.06 m. The off-track limit is max(0.06,
      0.0125 + body_width/4). Even the widest allowed body (0.18 m) gives only 0.0575
      m, so the 0.06 m floor binds and body width cannot help. Drivetrain changes
      moved the score by 0.14, so they are not the lever. Sensor lead gave the big
      gain (52.3 to 60.4) and saturated near y = 0.07 m, since 0.08 m was flat or
      slightly worse. Iteration 4 widened the row to a 60 mm span (20 mm spacing,
      outer sensors at ±0.04 m). It was the best result so far (61.45): the oval and
      s-bend improved and the slalom rose to 47.8 from 45.4. Line-loss events stayed
      at 1 per run. That fits the capture arithmetic: an outer sensor at x=±0.04 with
      a 12 mm footprint sees tape only while the centre offset is below about 0.04
      + 0.0125 + 0.006 = 0.0585 m, which is just inside the 0.06 m off-track limit,
      so the robot still reaches a state with no tape under any sensor. The span is
      the active sensing limit. I therefore widen the row again, to 7 sensors at 20
      mm spacing, spanning ±0.06 m. The outer sensors then capture to about 0.0785
      m, past the off-track limit, so the robot should keep a readable signal before
      it leaves the track. Lead stays at the best measured y = 0.07 m, and the sensor
      footprint (12 mm), wheel radius, track, mass and body are unchanged. That isolates
      the span lever. Expected result: line_loss_events falling toward 0, max_error
      below 0.06 m on the oval and s-bend, more progress on all tracks, and slalom
      oscillation near or below 0.15. Risk: seven sensors give more weights to set,
      and the outer sensors may dominate the signal at large errors, which could raise
      slalom oscillation. The next lever, if span is no longer binding, is wheel_radius
      for ground speed.


      - [Open this output](iteration-5/entity0/versions/b8df0a65d52e4fcd962f583a4439a65c/payload.json)

      - Based on: [entityR2A](iteration-5/entityR2A/versions/carried-0f14f7b9c4894155/payload.json)'
  - id: entity1
    label: Wider sensor span test
    notes: 'Runs the 20 mm sensor span at lead 0.07 m with weights scaled to 40 times
      x, so the signal gain matches the best measured controller (iteration 2). Only
      the span changes, which isolates the sensing lever.


      ### Rationale


      The Builder''s candidate widens the sensor row to 20 mm spacing at x = +/-0.04
      and +/-0.02 m, y = 0.07 m, the best measured lead. Iterations 0-3 all ended
      off track at 11-16% progress with max_error 0.061-0.070 m and one line-loss
      event per run. Lead gains saturated: y = 0.07 m scored 60.41 and y = 0.08 m
      scored 60.33, with the s-bend progress flat at 0.160 across leads and drivetrains.
      The Builder''s change is therefore the only untested sensing lever. Because
      the outer sensors move from 0.03 to 0.04 m, the weights must scale with x or
      the lateral signal gain drops. I set the weights to 40 times x, giving [1.6,
      0.8, 0.0, -0.8, -1.6]. This keeps the signal per metre of offset the same as
      iteration 2 (1.2/0.03 = 40), so kp = 1.25 keeps its effective gain and the change
      isolates span. Kd 0.25, ki 0, base_speed 1.5 and last_direction are unchanged
      from the best measured controller (iteration 2). The 12 mm footprint at 20 mm
      spacing still leaves the centre reading driven by the centre sensor alone, and
      the tape covers the centre sensor fully, so the signal stays monotonic near
      centre. Expected result: fewer line-loss events and lower max_error on the oval
      and s-bend, more progress on all tracks, and slalom steering_oscillation near
      0.15. This is a design test, not a tuned final result. Risk: a coarser row may
      make the signal less linear near centre, raising slalom oscillation.


      - [Open this output](iteration-4/entity1/versions/24b0114ebe7a4c7da333baf83c653612/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/20d843eca2554592a67600f1e5a9db81/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-0b8c2a1f6c0edd60/payload.json)'
  - id: entityR1
    label: Span test feedback
    notes: 'Lead saturated at 0.07 m (60.41 vs 60.33 at 0.08 m) and the s-bend stayed
      at 0.160 progress across all leads. Feedback names the next steps depending
      on whether the slalom oscillation rises after the span change.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. Iteration
      2 (lead y = 0.07 m) scored 60.41, the best so far. Iteration 3 (lead 0.08 m)
      scored 60.33, so lead has saturated. The s-bend progress stayed at 0.160 across
      leads 0.05, 0.07 and 0.08 m (iterations 1-3), and at 0.160 with the drivetrain
      change too. The s-bend is therefore not limited by sensing lead or by track
      and mass. Slalom progress has stayed at about 0.110 throughout. The oval was
      the only track that improved with lead. Iteration 1 showed drivetrain changes
      move the score by only 0.14. Every run ends off track at max_error 0.061-0.070
      m with one line-loss event. This candidate tests sensor span, which is the one
      sensing lever left, and the weights are scaled to keep the signal gain unchanged.
      Depending on the next race: if the oval gains again (progress above 0.168 or
      max_error below 0.063) and slalom steering_oscillation stays at or below about
      0.16 (iteration 2 slalom was 0.149), keep the 20 mm span. If slalom oscillation
      rises above about 0.17 while the oval improves, the coarse spacing is making
      the signal non-linear near centre, so try a spacing between 15 and 20 mm (for
      example 17 mm, x = +/-0.034 and +/-0.017 m) before any other change. If progress
      on the s-bend stays at 0.160 with line_loss_events still at 1, sensing is no
      longer binding, and the next lever is wheel_radius for ground speed.


      ### Requested changes


      - If the 20 mm span improves the oval but slalom steering_oscillation rises
      above about 0.17 (iteration 2 slalom was 0.149), try sensor spacing of 17 mm:
      x = +/-0.034 and +/-0.017 m at y = 0.07 m, with weights scaled to 40 times x,
      citing the iteration 2 slalom data.

      - If the s-bend still ends at progress 0.160 with max_error near 0.06 m after
      the span change (iterations 1-3 all gave 0.160 at different leads), try wheel_radius
      0.035 m for more ground speed per wheel rotation, citing iteration 3 where lead
      changes did not move the s-bend.

      - If line_loss_events rise above 1 on any track with the 20 mm span, try sensor_size
      0.016 m at the 20 mm spacing so each footprint still covers the 25 mm tape at
      the edge offsets, citing the iteration 2 telemetry where max_error reached 0.063
      m without extra line loss.


      - [Open this output](iteration-4/entityR1/versions/24b0114ebe7a4c7da333baf83c653612/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/20d843eca2554592a67600f1e5a9db81/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-0b8c2a1f6c0edd60/payload.json)'
