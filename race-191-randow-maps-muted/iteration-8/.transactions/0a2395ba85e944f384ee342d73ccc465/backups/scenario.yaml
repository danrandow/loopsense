map:
  id: race-191-randow-maps-muted
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: 'Lighter body: 0.4 kg mass'
    notes: 'Keeps the best row so far (iteration 7: 0.08 m track, seven sensors) and
      drops mass from 0.6 to 0.4 kg to lower yaw inertia. Track and body width are
      settled, so mass is the remaining isolated drivetrain lever for the s-bend and
      slalom floor errors.


      ### Rationale


      Iteration 7 is the best result so far (67.95). Narrowing wheel_track from 0.10
      to 0.08 m lifted the oval to 84.1 with zero line losses, and it raised the s-bend
      and slalom modestly. Every development run still ends off track, with max_error
      about 0.062-0.066 m, just past the fixed 0.06 m floor. Body width cannot relax
      that floor: max(0.06, 0.0125 + 0.18/4) is still 0.06 m. Sensor lead (y = 0.07
      m), span (seven sensors at 20 mm spacing, +/-0.06 m) and footprint (12 mm) have
      all been tested, and the 16 mm footprint did not help. Wheel_track is already
      at its 0.08 m minimum, so yaw authority can''t be increased further through
      track width. Mass is the remaining yaw-response lever: yaw inertia is mass*(L^2+W^2)/12,
      so a lighter body turns more readily for the same wheel difference. Iteration
      1 changed mass together with track and showed only a small effect, but that
      change was confounded with a wider track. I now isolate mass by moving it from
      0.6 to the 0.4 kg minimum, keeping the sensor row and the 0.08 m track from
      iteration 7. Expected result: lower yaw inertia gives faster correction at the
      floor error, so max_error and steering oscillation fall on the s-bend and slalom,
      and line_loss_events trend toward 0. Risk: the lighter body may carry less grip,
      and the slalom may oscillate more.


      - [Open this output](iteration-8/entity0/versions/1bb4c1a6ff794626a2ea8bb66d198601/payload.json)

      - Based on: [entityR2A](iteration-8/entityR2A/versions/carried-016f2a548b7e6fee/payload.json)'
  - id: entity1
    label: Narrow track to 0.08 m
    notes: 'Iteration 5 geometry with the 12 mm footprint restored and wheel_track
      cut from 0.10 to 0.08 m, keeping the controller fixed. This tests yaw authority
      at the 0.06 m off-track floor, since iteration 6 showed footprint changes did
      not help.


      ### Rationale


      Iteration 6 (16 mm footprints) scored 62.13, below iteration 5''s 62.87. The
      oval gained nothing further (progress 0.168 vs 0.175), the s-bend was flat or
      slightly down (0.165 to 0.165 progress, max_error 0.0619), and the slalom gained
      about 0.8 but the aggregate still fell. The footprint change does not clearly
      help, so I revert sensor_size to 0.012 m, the best measured footprint. The seven-sensor
      row at +/-0.06 m, y = 0.07 m, is kept, since span removed oval line loss in
      iteration 5 (0 events, progress 0.175). Every run still ends with one line-loss
      event on the s-bend and slalom and max_error about 0.062 m, which is set by
      the fixed 0.06 m off-track floor. The Builder''s requested yaw-authority test
      is the remaining drivetrain lever, and drivetrain changes have so far been small
      (iteration 1 moved the score by only 0.14). I narrow wheel_track from 0.10 to
      0.08 m, which raises yaw per PWM count by about 25 percent. I keep kp at 1.25,
      kd at 0.25, ki at 0, base_speed at 1.5 and the iteration 5 weights, so the only
      change from iteration 5 is wheel_track, which isolates the yaw-authority effect.
      I do not scale kp down to hold effective gain, because the test is precisely
      whether extra yaw authority lets the controller hold the 0.06 m floor. Mass
      (0.6 kg), wheel_radius (0.03 m) and body (0.18 x 0.12 m) stay fixed. Expected:
      line_loss_events trending toward 0 on the s-bend and slalom, max_error below
      0.06 m, and progress above the iteration 5 values (0.165 s-bend, 0.110 slalom).
      Risk: the higher yaw gain may raise slalom steering_oscillation above about
      0.16, in which case the next step is wheel_track 0.09 m.


      - [Open this output](iteration-7/entity1/versions/4059f612e18c442095d4cfc156a782d7/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/003589f4b604408693fc15673cddf5c7/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-0b28e9f78adc8c71/payload.json)'
  - id: entityR1
    label: Track narrowing then
    notes: 'Feedback covers wheel_track as the next lever, with a 0.09 m fallback
      if slalom oscillation rises, and wheel_radius 0.035 m if the floor still binds.
      It rests on iteration 5 (62.87, best) and iteration 6 (62.13, the 16 mm footprint
      that did not help).


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. Iteration
      5 (seven sensors at 20 mm spacing, +/-0.06 m span, 12 mm footprints, track 0.10
      m) is the best measured result at 62.87. It removed line loss on the oval (0
      events, progress 0.175) but left one line-loss event per run on the s-bend (progress
      0.165) and slalom (progress 0.110), with max_error about 0.062 m. Iteration
      6 showed the 16 mm footprint did not help in aggregate (62.13), so sensing is
      not the binding constraint. Iterations 0 to 3 showed the 0.06 m off-track floor
      is fixed, and drivetrain changes moved the score by about 0.14 in total. Depending
      on the next race: if line_loss_events fall toward 0 on the s-bend and slalom
      and max_error drops below 0.06 m, keep wheel_track 0.08 m and move to wheel_radius
      for ground speed. If max_error still sits near 0.06 m with line loss at 1, the
      yaw gain is not enough, so try wheel_track 0.09 m for a middle compromise. If
      slalom steering_oscillation rises above about 0.17 (iteration 5 slalom was 0.152),
      the narrower track has overshot, so return to 0.09 m.


      ### Requested changes


      - If slalom steering_oscillation rises above about 0.17 with wheel_track 0.08
      m (iteration 5 slalom was 0.152 at 0.10 m), try wheel_track 0.09 m as the compromise,
      citing the iteration 5 oscillation data.

      - If line_loss_events and max_error stay at 1 and about 0.06 m on the s-bend
      and slalom, the yaw authority change alone is not enough. Try wheel_radius 0.035
      m for more ground speed, citing iterations 1 to 5, where lead, span, footprint
      and track changes all left oval progress at 0.16 to 0.175.

      - Keep sensor_size at 0.012 m and do not revisit the 16 mm footprint, since
      iteration 6 scored lower (62.13) than iteration 5 (62.87).


      - [Open this output](iteration-7/entityR1/versions/4059f612e18c442095d4cfc156a782d7/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/003589f4b604408693fc15673cddf5c7/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-0b28e9f78adc8c71/payload.json)'
