map:
  id: race-142-randow-maps
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Restore 16mm, track 0.085
    notes: 'Restores the iteration 3 best (203.20) sensor and body geometry after
      the 12 mm footprint test scored 139.76, and narrows wheel_track to 0.085 m as
      the single change. Evidence: s-bend and slalom max_error stayed at 0.061 to
      0.064 across all geometries, pointing to turn authority rather than sensing.


      ### Rationale


      Iteration 5 tested sensor_size 0.012 at y=0.06 with x=±0.04, changing only the
      footprint from the iteration 3 best. It scored 139.76, well below the 203.20
      best. Oval progress fell from 0.87 to 0.73, oval max_error rose above the limit
      to 0.0623, and s-bend and slalom stayed at about 0.062. The 16 mm footprint
      was therefore helping, and I restore it. Outer spacing is also not the bend-entry
      lever: widening to ±0.05 in iteration 4 lowered oval progress to 0.80 and raised
      s-bend and slalom max_error. Across every geometry tried since iteration 2,
      s-bend and slalom max_error has stayed flat at 0.061 to 0.064. Forward sensing
      moved oval max_error from 0.0617 to 0.0598 but did not move the bend exits.
      That pattern points to turn authority on the sharp bends, not to sensing. Requested
      change 1 in the Integrator''s feedback, to narrow the track to 0.085 m, was
      written as the next step if the oval holds at progress 0.87 and oscillation
      stays above 0.3. The iteration 3 oval oscillation was 0.339, so that condition
      is met for the restored design. I therefore keep the iteration 3 geometry (16
      mm footprints, x=±0.04, y=0.06, body_length 0.22, mass 0.5) and change only
      wheel_track from 0.09 to 0.085 m. Expected result: s-bend and slalom max_error
      falls below 0.06 by a small margin, and oval progress holds near 0.87. The risk
      is that oscillation rises further, which the Integrator will handle in the controller.
      Line loss stays at 1.0 or below, since footprints and spacing are unchanged.


      - [Open this output](iteration-6/entity0/versions/d51e52f8f3794009988fa33c55248d67/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-ef7dfeacb60e9e43/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-6137d15ebecaaaa6/payload.json)'
  - id: entity1
    label: 12mm footprint test
    notes: 'Iteration 3 best geometry with sensor_size cut to 0.012 and the controller
      held at kp 2.2, kd 0.30 for a single-variable test. Based on the iteration 3
      result (203.20) and iteration 4 showing that outer-pair widening and softer
      damping did not help.


      ### Rationale


      Iteration 3 is the best raced design (203.20). Its oval max_error fell to 0.0598
      and progress rose to 0.87, but oval oscillation was 0.339 and the s-bend and
      slalom still exit near 0.06. Iteration 4 widened the outer pair to ±0.05 and
      softened the controller (kp 2.0, kd 0.35). It scored lower (187.24), oval progress
      fell to 0.80, and oscillation stayed near 0.33, so the controller change did
      not reduce oscillation. The Builder''s proposal keeps the iteration 3 geometry
      (±0.04 at y=0.06, body_length 0.22, wheel_track 0.09, mass 0.5) and changes
      only sensor_size from 0.016 to 0.012. To keep this a single-variable test, I
      hold the controller at the iteration 3 values (kp 2.2, kd 0.30, ki 0, base_speed
      1.2, weights [-2,-1,0,1,2], last_direction). Expected result: a score near 203
      if the footprint is neutral, or better s-bend/slalom max_error if smaller footprints
      react more sharply at the bend exit. If line_loss rises above 1.0 on any track,
      the 12 mm footprints are not helping.


      - [Open this output](iteration-5/entity1/versions/494bfe8afaf24e49a8981e6c73f737ee/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/58a608b3c5504873a4bdb668ad88222e/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-d9e009fe61274813/payload.json)'
  - id: entityR1
    label: Forward row and footprint
    notes: 'Feedback gives two conditional next steps, forward row y=0.07 or back
      to 16 mm, plus a wheel_track option. Each is tied to the iteration 2 to 4 results
      (forward row gain, outer-pair widening loss, oscillation not moving with damping).


      ### Feedback


      Written before this candidate has raced. Evidence so far: moving the sensor
      row from y=0.04 to y=0.06 (iteration 2 to 3) cut oval max_error from 0.0617
      to 0.0598 and raised oval progress from 0.53 to 0.87, so forward sensing helps
      the oval. Widening the outer pair to ±0.05 (iteration 4) cut oval progress to
      0.80, pushed oval max_error back to 0.0607, and left s-bend and slalom max_error
      near 0.062, so outer spacing is not the bend-entry lever. Oscillation barely
      moved when the controller was softened (0.339 to 0.333), so it is not solved
      by damping alone. Line loss has stayed at 0.5 to 1.0 per run with 16 mm footprints.
      If the 12 mm race keeps oval progress near 0.87 and s-bend/slalom max_error
      falls below 0.06, keep 12 mm and treat the remaining work as turn authority.
      If line_loss_events rise above 1.0 on any track, return to 16 mm footprints.
      If oval progress drops while max_error stays under 0.06, the 16 mm footprint
      was helping and should be restored before any further geometry change.


      ### Requested changes


      - If s-bend or slalom max_error is still at or above 0.06 with line_loss_events
      at or below 1.0 after the 12 mm race: move the sensor row forward to y = 0.07
      (keep x = ±0.04 and sensor_size 0.012). Evidence: moving the row from y=0.04
      to y=0.06 in iterations 2 to 3 lowered oval max_error from 0.0617 to 0.0598
      and raised oval progress from 0.53 to 0.87.

      - If the oval progress falls below 0.8 or line_loss_events rise above 1.0 on
      any track: return sensor_size to 0.016 and keep ±0.04 at y = 0.06. Evidence:
      16 mm footprints gave progress 0.87 and line loss 0.9 on the oval in iteration
      3, while widening to ±0.05 in iteration 4 cut progress to 0.80.

      - If oval progress holds at or above 0.87 but steering_oscillation stays above
      0.3: try wheel_track 0.085 m with the rest unchanged. Evidence: narrowing wheel_track
      from 0.10 to 0.09 in iterations 1 to 2 raised oval progress from 0.46 to 0.53,
      though that change was confounded with body and controller changes.


      - [Open this output](iteration-5/entityR1/versions/494bfe8afaf24e49a8981e6c73f737ee/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/58a608b3c5504873a4bdb668ad88222e/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-d9e009fe61274813/payload.json)'
