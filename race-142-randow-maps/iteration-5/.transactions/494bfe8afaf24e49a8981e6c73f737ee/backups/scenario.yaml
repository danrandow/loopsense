map:
  id: race-142-randow-maps
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Revert outer pair, 12mm
    notes: 'Reverts the outer sensors to ±0.04 m, which was the best spacing, and
      tests sensor_size 0.012 at y = 0.06 against the 203.20 best. Iteration 4''s
      ±0.05 widening lowered oval progress and did not fix s-bend or slalom exits.
      The footprint is the only change from the best design.


      ### Rationale


      Iteration 4 scored 187.24, below the iteration 3 best of 203.20. Widening the
      outer pair to ±0.05 m moved oval max_error back up to 0.0607 (from 0.0598) and
      cut oval progress from 0.87 to 0.80. It did not fix the bend exits: s-bend max_error
      rose to 0.0621 and slalom to 0.0627, with progress falling to 0.13 and 0.10.
      The outer-sensor spacing is therefore not the bend-entry lever. Oval line_loss_events
      fell to 0.5, but the other tracks stayed at 1.0, so line loss is not the constraint
      either. The forward row at y = 0.06 is the geometry change that clearly helped
      (oval max_error under 0.06 and progress up from 0.53 to 0.87), so I keep it.
      I revert the outer pair to ±0.04 m, which was the best-scoring spacing. I also
      make one geometry change that has not been tested: sensor_size 0.012 (12 mm)
      instead of 16 mm. This tests the Integrator''s requested change 1 in its intended
      form, with the spacing held at ±0.04 m. Iteration 0 showed that 12 mm footprints
      gave weak near-centre signal, so the change is a real trade-off and not a sure
      gain. Body_length 0.22, wheel_track 0.09, wheel_radius 0.03, body_width 0.12
      and mass 0.5 stay as in iteration 3, so the only change from the best design
      is the footprint size. Expected result: a score near 203 if the footprint is
      neutral, or a s-bend/slalom max_error improvement if smaller footprints react
      more sharply at the bend exit. If line_loss rises above 1.0 on any track, the
      12 mm footprints are not helping and I will return to 16 mm.


      - [Open this output](iteration-5/entity0/versions/58a608b3c5504873a4bdb668ad88222e/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-d6dffd53fdf6bfc5/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-d9e009fe61274813/payload.json)'
  - id: entity1
    label: Wider outer pair, damped
    notes: 'Widens the outer sensors to ±0.05 m on the iteration 3 base (best at 203.20)
      and lowers kp to 2.0 and raises kd to 0.35 to cut the oval oscillation that
      rose to 0.339. Rests on iteration 3 results and the iteration 1 to 2 damping
      evidence.


      ### Rationale


      Iteration 3 (y = 0.06, x = ±0.04, body_length 0.22, wheel_track 0.09, mass 0.5,
      kp 2.2, kd 0.30) is the best raced design at 203.20. Oval max_error fell to
      0.0598 and progress rose to 0.87, but oval steering_oscillation rose to 0.339.
      Earlier iterations show oscillation falling with lower kp and higher kd (kp
      3.0 gave 0.274 at kd 0.15, and oscillation was 0.246 at kp 2.5, kd 0.25), so
      the controller, not the geometry, has to carry the damping. I keep the Builder''s
      geometry as proposed: five 16 mm sensors at y = 0.06, outer pair widened to
      x = ±0.05, body_length 0.22, wheel_track 0.09, mass 0.5. The sensor weights
      stay [-2,-1,0,1,2], since the outer pair remains the bend-entry sensors and
      the signal scale is unchanged. For the controller I lower kp from 2.2 to 2.0
      and raise kd from 0.30 to 0.35, both to reduce oscillation on the oval. ki stays
      0 to avoid integral wind-up on bends, base_speed stays 1.2 because progress
      has been limited by off-track exits rather than speed, and line_loss stays last_direction
      because every line loss so far was a bend exit. Expected result: oval oscillation
      below the iteration 3 value of 0.339, with max_error and progress held near
      iteration 3 levels. Geometry and controller changes are confounded, so the next
      race is read against iteration 3.


      - [Open this output](iteration-4/entity1/versions/afd6d23fca964cd48e43c0fbfa14ecec/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/36013794ced44f81885a0ad08d0731cd/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-94717f63cda3ff20/payload.json)'
  - id: entityR1
    label: Outer-sensor and turn
    notes: 'Gives three conditional changes: smaller footprints if bend exits persist,
      back to ±0.04 if line loss rises, and a narrower track if progress drops. Each
      is tied to iteration 1 to 3 evidence.


      ### Feedback


      Written before this candidate has raced. Iteration 3 (forward row at y = 0.06,
      x = ±0.04, body_length 0.22, kp 2.2, kd 0.30) is the best raced result at 203.20.
      Oval max_error fell to 0.0598 and progress rose to 0.87, but oval steering_oscillation
      rose from 0.246 to 0.339, and s-bend and slalom still exit at max_error 0.0615
      and 0.0611 with progress 0.17 and 0.12. Earlier iterations show that yaw inertia
      (body_length 0.16 to 0.20) moved oscillation only from 0.274 to 0.246, so geometry
      is a weak damping lever and the controller has to carry it. Outer sensors at
      x = ±0.04 were the bend-entry sensors in iterations 1 to 3, and line_loss_events
      stayed at 0.9 to 1.0 with 16 mm footprints, so there is room to move them outward.
      If the next race shows oval oscillation below about 0.3 and s-bend or slalom
      max_error still at or above 0.06 with line_loss at or below 1.0, the bend-entry
      problem is the outer-sensor spacing, and the next geometry step is requested
      change 1. If line_loss_events rise above 1.0 on any track, the outer 16 mm footprints
      are overlapping near the tape edge and requested change 2 applies. If oval progress
      falls below 0.8 while max_error stays under 0.06, the wider pair is not the
      cause and the next step is the controller again, not geometry.


      ### Requested changes


      - If s-bend or slalom max_error is still at or above 0.06 while line_loss_events
      stay at or below 1.0: try sensor_size 0.012 with the outer pair at x = ±0.05
      and y = 0.06, so the footprints are smaller and the outer sensors react to the
      bend exit. Evidence: iterations 1 to 3 kept 16 mm footprints, and line loss
      stayed at 0.9 to 1.0, so the 16 mm size has not yet been tested against 12 mm
      at the wider spacing.

      - If line_loss_events rise above 1.0 per run on any track: keep sensor_size
      0.016 but return the outer sensors to x = ±0.04 at y = 0.06. Evidence: iteration
      3 line loss was 0.9 on the oval and 1.0 elsewhere with ±0.04, so a rise after
      widening would point to outer footprints leaving the tape on tight bends.

      - If oval progress drops below 0.8 while max_error stays under 0.06: try wheel_track
      0.085 m for more turn authority, holding body_length 0.22. Evidence: moving
      wheel_track from 0.10 to 0.09 in iteration 2 raised oval progress from 0.46
      to 0.53, while body_length alone changed oscillation only from 0.274 to 0.246.


      - [Open this output](iteration-4/entityR1/versions/afd6d23fca964cd48e43c0fbfa14ecec/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/36013794ced44f81885a0ad08d0731cd/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-94717f63cda3ff20/payload.json)'
