map:
  id: race-142-randow-maps
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Restore best geometry
    notes: 'Reverts wheel_track from 0.085 m to 0.09 m, restoring the iteration 3
      geometry (score 203.20), since narrowing dropped oval progress to 0.70 without
      fixing the bend exits. Rests on iteration 6 race data and the Integrator''s
      conditional rule for oval progress below 0.85.


      ### Rationale


      Iteration 6 narrowed wheel_track from 0.09 to 0.085 m on the iteration 3 geometry
      and scored 155.17, below the 203.20 best. Oval progress fell from 0.87 to 0.70
      and oval steering_oscillation was 0.266. Oval max_error stayed at about 0.061,
      and s-bend (0.0629) and slalom (0.0610) did not move below the 0.06 off-track
      limit. The narrower track therefore over-steered and cost progress without fixing
      the bend exits. The Integrator''s rule for this case applies: oval progress
      below 0.85 at 0.085 m means returning wheel_track to 0.09 m. The sensor row
      (y = 0.06, x = ±0.04, 16 mm footprints) stays, because iterations 4 and 5 showed
      that outer spacing and 12 mm footprints both cost progress. Iteration 7 therefore
      restores the iteration 3 geometry exactly, which is the best-scoring geometry
      tested (203.20). This gives the Integrator a stable platform, and any further
      change in score can be attributed to the controller. Across every geometry since
      iteration 2, s-bend and slalom max_error has stayed at 0.061 to 0.064, so the
      bend-exit limit is probably controller-side or speed-side, not geometry. The
      next geometry hypothesis, if the Integrator''s controller holds the oval, is
      a forward row at y = 0.07, which I expect to help only if it lowers oval max_error
      without raising oscillation. Expected result: a score near 203, with oval progress
      at or above 0.85 and max_error near 0.06.


      - [Open this output](iteration-7/entity0/versions/50c7812ff1d0466998baac9d25d6fc98/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-6baa08b8889ef2de/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-8f9f2ff78ecc1115/payload.json)'
  - id: entity1
    label: Restore best geometry
    notes: 'Restores the iteration 3 geometry (y=0.06, x=±0.04, 16 mm, wheel_track
      0.09) and controller (kp 2.2, kd 0.30) exactly, the best raced design at 203.20.
      It rests on iteration 6 showing that narrowing to 0.085 m lost oval progress
      with no bend-exit gain.


      ### Rationale


      Iteration 3 is still the best raced design (203.20). Iteration 6 narrowed wheel_track
      to 0.085 m and scored 155.17, with oval progress falling from 0.87 to 0.70 and
      no change at the bend exits (s-bend max_error 0.0629, slalom 0.0610). The 0.085
      m track is therefore rejected. Iterations 4 and 5 also showed that widening
      the outer pair to 0.05 m and using 12 mm footprints both cost progress. I restore
      the iteration 3 geometry exactly (five 16 mm sensors at x = -0.04, -0.02, 0,
      0.02, 0.04 and y = 0.06; wheel_track 0.09; body 0.22 x 0.12 m; mass 0.5 kg;
      wheel radius 0.03 m). I also restore the iteration 3 controller exactly (kp
      2.2, kd 0.30, ki 0, base_speed 1.2, weights [-2,-1,0,1,2], last_direction).
      Keeping the controller identical to the best run gives a clean baseline, so
      any score change in this race comes from the restored geometry and from race-to-race
      variation, not from new gains. Oval oscillation was 0.339 at this setting, and
      the iteration 4 softening (kp 2.0, kd 0.35) moved it only to 0.333, so I do
      not change the damping here. Expected result: a score near 203, oval progress
      at or above 0.85, and oval max_error near 0.06. Line loss should stay at or
      below 1.0 per run.


      - [Open this output](iteration-7/entity1/versions/f59424c544854bb99d98e78f04fadd67/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/50c7812ff1d0466998baac9d25d6fc98/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-8f9f2ff78ecc1115/payload.json)'
  - id: entityR1
    label: Hold geometry, test
    notes: 'Tells the Builder to keep wheel_track at 0.09 and the outer pair at ±0.04
      m, and to try y=0.07 only if oval progress holds and bend exits stay at 0.061
      or above. Evidence comes from iterations 2 to 6, with the row move and the narrowing
      trial as the key points.


      ### Feedback


      Written before this candidate has raced. Evidence: the sensor row moved from
      y=0.04 to y=0.06 (iteration 2 to 3) lowered oval max_error from 0.0617 to 0.0598
      and raised oval progress from 0.53 to 0.87, so forward sensing helps the oval.
      Widening the outer pair to x=±0.05 (iteration 4) cut oval progress to 0.80 and
      raised s-bend and slalom max_error, and 12 mm footprints (iteration 5) cut oval
      progress to 0.73, so both are rejected. Narrowing wheel_track to 0.085 (iteration
      6) cut oval progress to 0.70 and did not move the bend exits. Across every geometry
      since iteration 2, s-bend and slalom max_error has stayed at 0.061 to 0.064.
      Softening the controller (iteration 4) moved oval oscillation only from 0.339
      to 0.333, so damping alone is a weak lever. This candidate restores the iteration
      3 geometry and controller exactly, so the next race is a clean baseline. If
      oval progress is at or above 0.85 and oval max_error stays near 0.06, the platform
      is stable and the remaining bend-exit gap is controller- or speed-limited, so
      geometry should stop changing. If oval steering_oscillation rises above 0.35
      or the bend exits stay at 0.061 or above, the next change is controller damping,
      not geometry.


      ### Requested changes


      - If the restored run holds oval progress at or above 0.85 and s-bend or slalom
      max_error stays at 0.061 or above: try sensor row y = 0.07 with x = ±0.04, sensor_size
      0.016 and wheel_track 0.09 unchanged. Evidence: moving the row from y=0.04 to
      y=0.06 in iterations 2 to 3 lowered oval max_error from 0.0617 to 0.0598 and
      raised oval progress from 0.53 to 0.87.

      - Do not narrow wheel_track below 0.09 m or widen the outer pair beyond x =
      ±0.04 m. Evidence: wheel_track 0.085 (iteration 6) dropped oval progress from
      0.87 to 0.70 with no bend-exit gain, and outer x = ±0.05 (iteration 4) dropped
      oval progress to 0.80.

      - If oval steering_oscillation stays above 0.3 after the restored run, keep
      the geometry and change the controller first (lower kp or raise kd in small
      steps). Evidence: iteration 4 showed that kp 2.0 with kd 0.35 moved oscillation
      only from 0.339 to 0.333, so the controller change needs to be larger or paired
      with a speed change.


      - [Open this output](iteration-7/entityR1/versions/f59424c544854bb99d98e78f04fadd67/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/50c7812ff1d0466998baac9d25d6fc98/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-8f9f2ff78ecc1115/payload.json)'
