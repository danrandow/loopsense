map:
  id: race-142-randow-maps
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Restore best geometry
    notes: 'Reverts wheel_track from 0.085 m to 0.09 m, restoring the iteration 3
      geometry (score 203.20), since narrowing dropped oval progress to 0.70 without
      fixing the bend exits. Rests on iteration 6 race data and the Integrator''s
      conditional rule for oval progress below 0.85.


      ### Rationale


      Iteration 6 narrowed wheel_track from 0.09 to 0.085 m on the iteration 3 geometry
      and scored 155.17, below the 203.20 best. Oval progress fell from 0.87 to 0.70
      and oval steering_oscillation was 0.266. Oval max_error stayed at about 0.061,
      and s-bend (0.0629) and slalom (0.0610) did not move below the 0.06 off-track
      limit. The narrower track therefore over-steered and cost progress without fixing
      the bend exits. The Integrator''s rule for this case applies: oval progress
      below 0.85 at 0.085 m means returning wheel_track to 0.09 m. The sensor row
      (y = 0.06, x = ±0.04, 16 mm footprints) stays, because iterations 4 and 5 showed
      that outer spacing and 12 mm footprints both cost progress. Iteration 7 therefore
      restores the iteration 3 geometry exactly, which is the best-scoring geometry
      tested (203.20). This gives the Integrator a stable platform, and any further
      change in score can be attributed to the controller. Across every geometry since
      iteration 2, s-bend and slalom max_error has stayed at 0.061 to 0.064, so the
      bend-exit limit is probably controller-side or speed-side, not geometry. The
      next geometry hypothesis, if the Integrator''s controller holds the oval, is
      a forward row at y = 0.07, which I expect to help only if it lowers oval max_error
      without raising oscillation. Expected result: a score near 203, with oval progress
      at or above 0.85 and max_error near 0.06.


      - [Open this output](iteration-7/entity0/versions/50c7812ff1d0466998baac9d25d6fc98/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-6baa08b8889ef2de/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-8f9f2ff78ecc1115/payload.json)'
  - id: entity1
    label: Narrow track 0.085 m
    notes: 'Iteration 3 best design with wheel_track narrowed from 0.09 to 0.085 m
      and controller held. Tests whether turn authority limits the s-bend and slalom
      exits, based on iterations 3 to 5.


      ### Rationale


      Iteration 3 is the best raced design (203.20). Its oval max_error fell to 0.0598
      and progress rose to 0.87, but oval steering_oscillation was 0.339, and s-bend
      and slalom still exit at about 0.061 max_error. Iteration 4 showed that widening
      the outer pair to x=±0.05 cut oval progress to 0.80 and did not move the bend
      exits. Iteration 4 also showed that softening the controller (kp 2.0, kd 0.35)
      only moved oscillation from 0.339 to 0.333, so damping is a weak lever. Iteration
      5 changed the footprint to 12 mm and scored 139.76, so 16 mm stays. The Builder''s
      intent is the only change to the iteration 3 design: wheel_track 0.09 to 0.085
      m for more turn authority at the bend exits. The Builder''s expected results
      are s-bend and slalom max_error below 0.06, oval progress at or above 0.85,
      and line loss at or below 1.0. I keep the iteration 3 controller (kp 2.2, kd
      0.30, ki 0, base_speed 1.2, weights [-2,-1,0,1,2], last_direction) so this race
      isolates the track change. A narrower track raises turn gain by about 6 percent,
      so oscillation may rise slightly; I accept that rather than confound the test.
      Line loss stayed at 0.9 to 1.0 with 16 mm footprints, so the footprints are
      not overlapping badly.


      - [Open this output](iteration-6/entity1/versions/762964963cb44b76ae7fb0790a1ab572/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/d51e52f8f3794009988fa33c55248d67/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-6137d15ebecaaaa6/payload.json)'
  - id: entityR1
    label: Track, then row, feedback
    notes: 'Pre-race feedback with conditional next steps: narrower or wider track
      depending on bend exits and oval progress, and a forward row move as fallback.
      Each point cites the iteration 2 to 5 evidence.


      ### Feedback


      Written before this candidate has raced. Evidence: moving the sensor row from
      y=0.04 to y=0.06 (iteration 2 to 3) lowered oval max_error from 0.0617 to 0.0598
      and raised oval progress from 0.53 to 0.87, so forward sensing helps the oval.
      Widening the outer pair to x=±0.05 (iteration 4) cut oval progress to 0.80 and
      left s-bend and slalom max_error at about 0.062, so outer spacing is not the
      bend-entry lever. Softening the controller (kp 2.0, kd 0.35) moved oval oscillation
      only from 0.339 to 0.333, so damping alone does not fix oscillation. The 12
      mm footprint (iteration 5) scored 139.76, below the 16 mm best, so keep 16 mm
      unless new evidence says otherwise. Narrowing the track is the candidate''s
      test of turn authority. If the next race shows s-bend and slalom max_error below
      0.06 with oval progress at or above 0.85, keep the track near 0.085 m and treat
      remaining bend-exit work as controller-side. If the oval progress drops below
      0.85, the narrower track is over-steering and the track should go back to 0.09
      m. If the line_loss_events rise above 1.0 on any track, the 16 mm footprints
      are missing the tape edge on tight bends and the outer pair should be checked.


      ### Requested changes


      - If s-bend or slalom max_error is still at or above 0.06 while oval progress
      holds at or above 0.85: try wheel_track 0.08 m (the minimum allowed) with the
      rest unchanged. Evidence: narrowing wheel_track from 0.10 to 0.09 in iterations
      1 to 2 raised oval progress from 0.46 to 0.53, so turn authority has improved
      progress before.

      - If oval progress falls below 0.85 with wheel_track 0.085 m: return wheel_track
      to 0.09 m and keep sensor_size 0.016 at y = 0.06 with x = ±0.04. Evidence: iteration
      3 (this geometry at 0.09 m) gave oval progress 0.87 and max_error 0.0598, the
      best oval result so far.

      - If sensor row is forward at y = 0.06 and s-bend or slalom max_error stays
      at or above 0.06 at wheel_track 0.085 m: try y = 0.07 with x = ±0.04 and sensor_size
      0.016. Evidence: moving the row from y=0.04 to y=0.06 in iterations 2 to 3 lowered
      oval max_error from 0.0617 to 0.0598 and raised oval progress from 0.53 to 0.87.


      - [Open this output](iteration-6/entityR1/versions/762964963cb44b76ae7fb0790a1ab572/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/d51e52f8f3794009988fa33c55248d67/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-6137d15ebecaaaa6/payload.json)'
