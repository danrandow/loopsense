overrides:
  entities:
  - id: entity0
    label: Wider lighter robot v2
    notes: 'Switches to 16 mm sensor footprints, cuts mass to 0.5 kg and wheel track
      to 0.10 m to address the baseline''s uniform off-track exits at max_error 0.061
      m. Evidence is iteration 0 race data, where all 60 trials ended off-track with
      one line loss each.


      ### Rationale


      Iteration 0 raced the baseline and every trial on all three development tracks
      ended off-track. Mean progress was 0.03 to 0.12, and max_error sat at about
      0.061 m on every track. That is the off-track limit of 0.06 m, so the robot
      leaves the tape at the first real bend. Each run also logged one line-loss event,
      so the line was lost once and not recovered. rms_error was about 0.03 on all
      tracks, so the robot tracks reasonably until a single excursion takes it off.
      The integrator reports that with 12 mm footprints the outer sensors only respond
      once the line moves about 1 cm off centre, which gives a weak signal near centre
      and forces large outer weights. Changing the footprint to 16 mm makes the outer
      sensors respond sooner. A 16 mm footprint at x = ±0.02 overlaps the tape edge
      once the line centre is within about 0.5 mm of the sensor, and the x = ±0.04
      sensors respond once the line moves about 2 cm. Overlapping footprints also
      make the signal more graded across the array. I am also reducing the wheel track
      from 0.12 m to 0.10 m and the mass from 0.7 kg to 0.5 kg. Both lower yaw inertia,
      mass*(L^2+W^2)/12, and a narrower track gives more turn rate per unit of wheel
      difference, so the robot should correct a drift faster before it reaches 6 cm.
      The off-track limit cannot be widened much with body_width, since max(0.06,
      0.0125 + W/4) stays at 0.06 for any W up to about 0.19 m. The sensor row stays
      at y = 0.04 so the forward reaction distance does not change. Expected result:
      fewer off-track exits, at least one track completed, and max_error below 0.06.
      Several things change at once, so attribution will be rough, but the baseline
      is failing uniformly and a bolder move is justified.


      - [Open this output](iteration-1/entity0/versions/50ce829087214eaca5104a64e9205c4c/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-cbb49919d07fa8d3/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-bfe089c0e3554f10/payload.json)'
  - id: entity1
    label: Revised gains on 0.5kg
    notes: 'Geometry kept as the Builder proposed; controller raises kp to 3.0 and
      kd to 0.15 to correct the single bend excursion that ended every iteration 0
      run off-track at 0.061 m. Expected to cut max_error below 0.06 m.


      ### Rationale


      Iteration 0 raced the baseline on all three development tracks and every trial
      ended off-track. max_error sat at about 0.061 m, rms_error at about 0.03, and
      each run logged one line-loss event that was never recovered. The line was lost
      once at the first real bend, so the controller needs more correction authority
      and less overshoot. For this geometry I keep the Builder''s five sensors and
      weights [-2,-1,0,1,2], since the 16 mm footprints give a graded signal across
      the array. I raise kp from 2.0 to 3.0 to correct drift sooner, which the lighter
      0.5 kg, 0.10 m platform can take without the yaw overshoot it would have shown
      at 0.7 kg. I raise kd from 0.05 to 0.15 to damp the faster response. ki stays
      at 0 to avoid integral wind-up on bends. base_speed stays at 1.2 so the robot
      can still cover the course in under 3 s. line_loss stays ''last_direction'',
      since the single loss in iteration 0 was a bend exit and not a fixed-direction
      search problem. Expected result: max_error below 0.06 m and fewer off-track
      exits. If steering_oscillation rises with control_effort, the next step is to
      lower kp back toward 2.5.


      - [Open this output](iteration-1/entity1/versions/25d62815fef54b15b2a1edac2e2b4fb2/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/50ce829087214eaca5104a64e9205c4c/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-bfe089c0e3554f10/payload.json)'
  - id: entityR1
    label: Feedback on 16mm array
    notes: 'Feedback written before the race; it cites iteration 0''s uniform 0.061
      m off-track failure and gives three conditional changes (footprint and spacing,
      wheel track, body length) keyed to what the next race shows.


      ### Feedback


      Written before this candidate has raced. Iteration 0 (baseline, 12 mm footprints,
      0.7 kg, 0.12 m track) failed on all three development tracks: every trial ended
      off-track, with max_error about 0.061 m, rms_error about 0.03, and one line-loss
      event each run. The controller had to use the outer weights of plus or minus
      2 to get a usable signal near centre, because a centred line mostly covered
      the middle sensor. Iteration 1 moves the footprints to 16 mm and lowers mass
      and wheel track to raise yaw response. Those changes address the single bend
      excursion. If the next race shows max_error below 0.06 with line_loss_events
      at or near zero, keep the array and check whether completion comes from speed
      or turn authority. If line_loss_events rise above one per run, the 16 mm footprints
      are probably overlapping too much; return to 12 mm and widen the outer sensors
      to plus or minus 0.05 m. If max_error stays pinned at 0.06 with low line loss,
      turn authority is the limit and the next step is a shorter wheel track or a
      wider array.


      ### Requested changes


      - If line_loss_events rise or the signal saturates near centre, return sensor_size
      to 0.012 and widen the outer sensors to x = plus or minus 0.05 m. Evidence:
      iteration 0 showed the outer 12 mm sensors responded only after about 1 cm of
      offset.

      - If max_error stays about 0.06 with line_loss_events near zero, reduce wheel_track
      from 0.10 m to 0.09 m to add turn authority. Evidence: iteration 0 showed every
      track ending at the same 0.061 m excursion, which points to turn rate, not sensing.

      - If steering_oscillation rises with control_effort, keep mass at 0.5 kg and
      raise body_length to 0.20 m, which adds yaw damping through the larger inertia
      without changing the sensor row. Evidence: iteration 0 steering_oscillation
      was about 0.07 on all tracks, so the baseline was not yet oscillating.


      - [Open this output](iteration-1/entityR1/versions/25d62815fef54b15b2a1edac2e2b4fb2/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/50ce829087214eaca5104a64e9205c4c/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-bfe089c0e3554f10/payload.json)'
