  entities:
  - id: entity0
    label: Wider sensors, narrower
    notes: 'Widens the sensor spread to ±0.045 m, enlarges sensors to 16 mm, narrows
      the wheel track to 0.10 m, and lightens the robot to 0.6 kg. The aim is to keep
      the tape under the outer sensors on sharp bends, since all 60 trials so far
      have left the line at the off-track limit. Controller is kept close to iteration
      2 with ki 0.6.


      ### Rationale


      Evidence: all 60 development trials in iterations 1 to 3 ended off_track with
      zero completions. Max error sits at about 0.061 m, the off-track limit max(0.06,
      0.0125 + body_width/4), so each run ends after one excursion on a bend. RMS
      error is stuck near 0.022 to 0.030, and steering oscillation is low (0.06 to
      0.29), so this is not jitter or instability. Progress is 0.04 to 0.48, and the
      best oval progress came at ki 0.4 (iteration 2). Raising ki to 0.8 and dropping
      speed to 1.0 (iteration 3) cut oval progress from 0.48 to 0.40 while helping
      s-bend slightly, so the integral and speed changes are not the main lever. Hypothesis
      H2 from iteration 2 is now the leading one: the outer sensors at x = ±0.03 m
      with a 12 mm footprint lose the 25 mm tape on sharp bends. The signal then collapses
      toward zero, and the robot drifts wide before the correction is strong enough.
      Changes this iteration: (1) widen the sensor spread to x = ±0.045 m, so the
      outer sensors see the tape earlier on a bend, and enlarge sensor_size to 16
      mm so each footprint keeps a larger share of the tape as the robot turns. (2)
      Reduce wheel_track from 0.12 to 0.10 m, which raises turn rate for the same
      PWM differential and gives more steering authority on tight bends. (3) Reduce
      mass from 0.8 to 0.6 kg to lower yaw inertia. (4) Set ki to 0.6 (between the
      best value and the iteration 3 value) and keep kp 3.0, kd 0.2, base_speed 1.0.
      Speed is held at 1.0 so this iteration isolates the geometry change. body_width
      stays at 0.12. Expected result: max_error falls below 0.06 on s-bend and slalom,
      and progress rises above 0.3 on all tracks. Completion inside 3 s is still unlikely;
      survival is the priority. Hypotheses: (H1) with wider sensors, progress rises
      on the sharp tracks without raising line_loss_events. (H2) if progress stays
      near 0.1 on slalom, the limiting factor is the controller response to direction
      changes, so the next step is a higher kd or lower kp. Measurements wanted: progress
      and max_error per track, where max_error occurs, line_loss_events, and whether
      steering_oscillation rises with the narrower wheel track.


