  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'First candidate, built from the contract physics with no race data yet.
      It uses five 12 mm sensors, moderate kp=2 steering, light kd, and last_direction
      line recovery. The next race should show whether it completes and where it drifts.


      ### Rationale


      Iteration 0 has no race telemetry, so this is a conservative baseline built
      from the contract''s physics and sensing rules, not a tuned design. Geometry:
      five line sensors spaced 15 mm apart across x = -0.03 to +0.03 m, placed 0.04
      m ahead of the axle so steering reacts before the wheels reach the line. A 12
      mm footprint is small enough to resolve the 25 mm tape edge while still covering
      part of it. Wheel track 0.12 m and radius 0.03 m give a moderate turn rate,
      and mass 0.8 kg keeps yaw inertia low. Controller: antisymmetric weights (-2,
      -1, 0, 1, 2) make the signal scale with lateral error and give a clear sign
      for steering. kp = 2 gives a turn of about 4 at the largest signal (about 1400
      PWM of differential), enough to correct without saturating. kd = 0.01 damps
      the response lightly, and ki = 0 avoids integral windup on bends. base_speed
      = 1.5 is a compromise: it is high enough to need roughly 1.5 m/s to finish inside
      3 s, but below full speed so the first run is less likely to leave the track.
      line_loss = last_direction lets the robot recover toward the side it last saw
      the line. Expected result: completion on the oval and s-bend with few line-loss
      events. The slalom, with its sharper direction changes, is the likely failure
      point. Next, I want to see whether the robot finishes, its completion time,
      and where max_error peaks. If it oscillates, reduce kp or raise kd. If it drifts
      wide on bends, raise kp or base_speed control margin.


      - [Open this output](iteration-0/entity0/versions/10aa1bd3dcb9452182ecb62f30c73784/payload.json)'
