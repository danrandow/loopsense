  entities:
  - id: entity0
    label: Lower kp, more kd damping
    notes: 'Keeps the iteration 5 body to isolate the controller, lowering kp 3.5
      to 2.5 and ki to 0.5 while raising kd to 0.4 and base_speed to 0.9 for turning
      margin. Evidence: kp 3.5 cut oval progress versus kp 3.0, pointing to overshoot
      across the 25 mm tape, and every run still ends at the 0.06 m off-track limit.


      ### Rationale


      Evidence: all 240 development trials across iterations 0 to 5 ended off_track
      with zero completions. Max error sits at about 0.061 m every time, which is
      the off-track limit max(0.06, 0.0125 + body_width/4). Widening body_width cannot
      lift that limit (body_width 0.18 gives 0.0575, still floored at 0.06), so the
      fix must come from tracking. RMS error stays at 0.022 to 0.030 and steering
      oscillation is low (0.06 to 0.29), so the failure is a single excursion per
      run, not jitter. Line loss is rare before the off-track limit (sensor coverage
      reaches about 0.065 m), so the robot is simply leaving the tape on bends.


      Comparing controllers at fixed geometry: iteration 5 (kp 3.5, kd 0.3, ki 0.8)
      lost oval progress (0.28 vs 0.33 at kp 3.0 in iteration 4, and 0.48 at iteration
      2). Raising kp appears to overshoot across the tape rather than help. Lower
      base_speed (1.2 to 1.0) raised s-bend progress slightly, so speed is a possible
      lever but not a clear one.


      Change: keep the iteration 5 geometry (sensors at x = ±0.045 m, 16 mm footprints,
      wheel_track 0.10, mass 0.6) so this race isolates the controller. Lower kp from
      3.5 to 2.5 to reduce overshoot across the tape. Raise kd from 0.3 to 0.4 to
      damp the faster signal changes on sharp bends. Lower ki from 0.8 to 0.5, since
      the integral lag at high ki seemed to worsen oval. Lower base_speed from 1.0
      to 0.9 for extra turning margin. Line_loss stays last_direction.


      Expected result: max_error below 0.06 on s-bend and slalom, progress above 0.15
      on slalom, and steering_oscillation no higher than about 0.3. Completion inside
      3 s remains unlikely; survival is the priority.


      Hypotheses: (H1) the excursions are overshoot caused by high kp, so lower kp
      with more kd should raise progress. (H2) if progress drops again with lower
      kp, the proportional gain is too weak to hold the line on bends, and the next
      step is kp about 3.0 with kd 0.5. (H3) if slalom stays near 0.08 progress, the
      limit is response to alternating curvature, and the next step is a narrower
      sensor spread or a lower base_speed.


      Measurements wanted: progress and max_error per track, where max_error occurs,
      line_loss_events, steering_oscillation, and control_effort, to separate overshoot
      from lag.


