  entities:
  - id: entity0
    label: Lower kp, higher kd
    notes: 'Continues the trend from iterations 4 to 10: kp 1.3 to 1.15, kd 0.8 to
      0.9, base_speed 0.9 to 0.85, with geometry held at the iteration 10 values.
      The aim is to raise slalom progress (0.67 in iteration 10) while keeping the
      oval finish and s-bend finish rate.


      ### Rationale


      Evidence: iteration 10 (kp 1.3, kd 0.8, ki 0.5, base 0.9) is the best design
      so far at 735.0. Oval finishes 20/20 at 1.91 s, s-bend finishes 18/20 (progress
      0.98), and slalom improved from 0.43 to 0.67 progress with 3/20 finishes. Max
      error is still pinned at the off-track limit (about 0.061 m), and steering oscillation
      stays moderate (0.27 to 0.33). Across iterations 4 to 10, each step that lowered
      kp and raised kd raised progress on the harder tracks. Slalom is the weakest
      track and the most likely model of the unseen final track.


      Change: keep the iteration 10 geometry exactly, so the controller change is
      isolated. Lower kp from 1.3 to 1.15 to continue reducing proportional overshoot
      across the tape. Raise kd from 0.8 to 0.9 to keep the response damped as proportional
      action falls. Lower base_speed from 0.9 to 0.85 to give more turning margin
      on slalom''s alternating curves. The cost is small: oval should still finish
      in about 2.0 s, which keeps the time term high. ki stays at 0.5, since the integral
      is not the limiting factor.


      Expected result: slalom progress rises above 0.7 with fewer line-loss events,
      s-bend finish rate stays at or above 0.9, and oval stays at a 1.0 finish. Steering
      oscillation should remain at or below about 0.35.


      Hypotheses: (H1) overshoot is still the main limit on slalom, so a further kp
      reduction with more kd raises slalom progress. (H2) if s-bend or oval progress
      drops, kp 1.15 is too weak to hold the line on curves, so the fallback is kp
      about 1.3 with kd 0.9. (H3) if slalom stays near 0.67, the limit is the response
      to alternating curvature, and the next lever is a narrower sensor spread (x
      = +/-0.03) or a lower base_speed.


      Measurements wanted: progress, completion time and max_error per track, where
      max_error occurs, line_loss_events, steering_oscillation and control_effort,
      to separate overshoot from lag.


