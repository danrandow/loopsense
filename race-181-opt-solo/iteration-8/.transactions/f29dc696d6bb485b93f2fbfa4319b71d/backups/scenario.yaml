  entities:
  - id: entity0
    label: Lower kp, higher kd
    notes: 'Keeps iteration 7 geometry and continues the kp-down, kd-up trend that
      raised progress from 0.48 to 0.59 on oval (iteration 6 to 7). kp goes from 2.0
      to 1.75 and kd from 0.5 to 0.6 to test whether overshoot is still the limit
      on bends.


      ### Rationale


      Evidence: all 300 development trials so far ended off_track or finished, with
      max_error pinned at about 0.061 m. That is the off-track limit, which body_width
      cannot raise above 0.06 in its allowed range, so the fix has to come from tracking.
      RMS error (0.02 to 0.03) and steering oscillation (0.06 to 0.32) are modest,
      so the failures are single excursions on bends, not jitter.


      Trend at fixed geometry (iterations 4 to 7): each step that lowered kp and raised
      kd raised progress. Iteration 7 (kp 2.0, kd 0.5, ki 0.5, base 0.9) is the best
      so far at 234.2, with 3 of 20 oval trials finishing in about 1.98 s. Slalom
      is still weak (progress 0.28, line loss 0.85 per run), and s-bend has progress
      0.48 with no finishes.


      Change: keep the iteration 7 geometry exactly, so the controller change is isolated.
      Lower kp from 2.0 to 1.75 to reduce overshoot across the tape, continuing the
      trend. Raise kd from 0.5 to 0.6 to keep the response damped as proportional
      action falls. Keep ki at 0.5 and base_speed at 0.9. The oval finish time (about
      2 s) shows the speed can cover the course in time, so speed stays fixed while
      the steering changes.


      Expected result: more oval finishes (finish rate above 0.15), s-bend progress
      above 0.5, and slalom progress above 0.3. steering_oscillation should stay at
      or below about 0.35.


      Hypotheses: (H1) overshoot is still the limit, so lower kp with more kd keeps
      raising progress. (H2) if progress drops, kp 1.75 is too weak to hold the line
      on curves, and the next step is kp about 2.0 with kd 0.7. (H3) if slalom stays
      near 0.3 progress, the limit is response to alternating curvature, and the next
      step is a narrower sensor spread (x = +/-0.03) or a lower base_speed.


      Measurements wanted: progress, completion time and max_error per track, where
      max_error occurs, line_loss_events, steering_oscillation and control_effort,
      to separate overshoot from lag.


