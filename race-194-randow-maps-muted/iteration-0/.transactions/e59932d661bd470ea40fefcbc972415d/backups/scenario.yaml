  - id: entity0
    label: Baseline 5-sensor
    notes: 'A symmetric, bounded baseline: five forward-mounted 12 mm sensors spanning
      6 cm, with mid-range wheel track, radius, body and mass. No race evidence exists
      yet, so the choice rests on the tape width and the off-track limit, which is
      0.06 m for any body width under 0.19 m.


      ### Rationale


      This is the first iteration, so there is no race telemetry or integration feedback
      yet. I am choosing a conventional, bounded baseline that the Integrator can
      build on and that gives clear evidence to read back. Five sensors spread at
      x = -0.03, -0.015, 0, 0.015 and 0.03 m give a 0.06 m sensing span, about 2.4
      times the 25 mm tape width, so the line stays visible through moderate lateral
      error and the signal stays roughly linear near centre. The sensors sit at y
      = 0.05 m, ahead of the axle, so the line is read before the wheels reach it,
      which gives the controller lead time. Sensor size 0.012 m is about half the
      tape width: small enough for a crisp signal, large enough to avoid losing the
      line between sensors. Wheel track 0.12 m and wheel radius 0.03 m are mid-range,
      giving moderate turn authority and a moderate top speed. Mass 0.8 kg is a middle
      value that keeps yaw inertia modest. Body width 0.12 m and body length 0.16
      m are mid-range. Body width has no effect on the off-track limit here, because
      max(0.06, 0.0125 + width/4) equals 0.06 for every width under 0.19 m. Expected
      result: a completed run on the development tracks, with rms_error well under
      0.05 m and few line-loss events. The main risk is high-speed oscillation on
      the tighter slalom bends. I have not chosen a controller, as my role requires.


      - [Open this output](iteration-0/entity0/versions/9294918edd39436e89886bf1245a2c8d/payload.json)'
