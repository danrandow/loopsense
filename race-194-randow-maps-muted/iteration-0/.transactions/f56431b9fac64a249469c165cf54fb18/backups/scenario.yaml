overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor
    notes: 'A symmetric, bounded baseline: five forward-mounted 12 mm sensors spanning
      6 cm, with mid-range wheel track, radius, body and mass. No race evidence exists
      yet, so the choice rests on the tape width and the off-track limit, which is
      0.06 m for any body width under 0.19 m.


      ### Rationale


      This is the first iteration, so there is no race telemetry or integration feedback
      yet. I am choosing a conventional, bounded baseline that the Integrator can
      build on and that gives clear evidence to read back. Five sensors spread at
      x = -0.03, -0.015, 0, 0.015 and 0.03 m give a 0.06 m sensing span, about 2.4
      times the 25 mm tape width, so the line stays visible through moderate lateral
      error and the signal stays roughly linear near centre. The sensors sit at y
      = 0.05 m, ahead of the axle, so the line is read before the wheels reach it,
      which gives the controller lead time. Sensor size 0.012 m is about half the
      tape width: small enough for a crisp signal, large enough to avoid losing the
      line between sensors. Wheel track 0.12 m and wheel radius 0.03 m are mid-range,
      giving moderate turn authority and a moderate top speed. Mass 0.8 kg is a middle
      value that keeps yaw inertia modest. Body width 0.12 m and body length 0.16
      m are mid-range. Body width has no effect on the off-track limit here, because
      max(0.06, 0.0125 + width/4) equals 0.06 for every width under 0.19 m. Expected
      result: a completed run on the development tracks, with rms_error well under
      0.05 m and few line-loss events. The main risk is high-speed oscillation on
      the tighter slalom bends. I have not chosen a controller, as my role requires.


      - [Open this output](iteration-0/entity0/versions/9294918edd39436e89886bf1245a2c8d/payload.json)'
  - id: entity1
    label: Baseline robot package
    notes: 'Builder''s symmetric baseline geometry with a moderate PD controller,
      base_speed 1.2 and last_direction line-loss recovery. No race data exists yet,
      so the expected outcome is a hypothesis to test.


      ### Rationale


      This is the first iteration, so there is no race telemetry yet. I keep the Builder''s
      baseline geometry unchanged so that the controller is tested on the platform
      as proposed. Sensor x-positions run from -0.03 (right) to +0.03 (left). Weights
      [-1, -0.5, 0, 0.5, 1] follow the same sign convention, so a line under the left
      sensors gives a positive signal, which steers left. The sum of weights at full
      coverage stays within ±1, which keeps signal scale moderate. Sensor y = 0.05
      m gives roughly 0.05 m of lead, which should let the controller see the line
      before the wheels reach it. With the 0.12 m track and 0.03 m wheels, a turn
      command of about 1 unit gives roughly 700 PWM of wheel difference out of 4095,
      so kp = 2.5 is a moderate authority. kd = 0.4 damps the response without much
      phase lag at base_speed 1.2. ki = 0.05 is small, to avoid windup on the long
      bends. base_speed 1.2 gives an average speed that should finish the roughly
      4.5 m course in under 3 s, while staying below full PWM to leave headroom for
      turns. line_loss = last_direction re-enters the line on the side it left, which
      suits the slalom. Expected result: a completed run on oval and s-bend, with
      the slalom the most likely source of line loss. This expectation is a hypothesis,
      not a measured result.


      - [Open this output](iteration-0/entity1/versions/e59932d661bd470ea40fefcbc972415d/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/9294918edd39436e89886bf1245a2c8d/payload.json)'
  - id: entityR1
    label: Baseline integration
    notes: 'No earlier race exists, so the feedback gives conditional changes tied
      to the Builder''s baseline hypotheses rather than measured evidence. Each change
      is triggered by a specific measurement in the next race.


      ### Feedback


      No race has been run on this platform yet, so there is no earlier evidence about
      this geometry. The controller in this package is a first baseline, so the Builder
      should not read any result into it. Next race, if line_loss_events are high
      on the slalom and max_error is large there, the sensing span is the likely limit:
      widen sensor x-positions (for example to ±0.04 m) before changing the wheel
      track. If the race completes with low rms_error but completion_time is above
      about 2.5 s, the drivetrain is the limit: try a smaller wheel_track (0.10 m)
      or lower mass (0.6 kg) to raise turn rate. If steering_oscillation is high on
      the s-bend or oval, keep sensor y at 0.05 m and try a shorter forward lead (y
      = 0.03 m) to reduce phase lag, since a longer lead can amplify oscillation at
      speed. The integration questions in the Builder''s request (sensor span saturation,
      lead lag, mass and track turn authority) are not yet answered by any measurement;
      they should be answered from the first race''s telemetry.


      ### Requested changes


      - If slalom line_loss_events are high: widen the sensor span from 0.06 m to
      0.08 m by setting sensor x-positions to -0.04, -0.02, 0.0, 0.02, 0.04 (sensor_size
      stays 0.012). Hypothesis from the Builder''s learning item (1); no race data
      yet.

      - If completion_time is above about 2.5 s with low rms_error: reduce wheel_track
      from 0.12 m to 0.10 m and mass from 0.8 kg to 0.6 kg to raise turn rate. Based
      on the Builder''s baseline hypothesis (3); no race data yet.

      - If steering_oscillation is high on the s-bend or oval: move sensor y from
      0.05 m to 0.03 m to reduce forward lead and phase lag. Based on the Builder''s
      baseline hypothesis (2); no race data yet.


      - [Open this output](iteration-0/entityR1/versions/e59932d661bd470ea40fefcbc972415d/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/9294918edd39436e89886bf1245a2c8d/payload.json)'
  actions:
  - id: action0
  - id: action1
