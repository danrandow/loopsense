map:
  id: race-194-randow-maps-muted
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Wider track 0.16 m
    notes: 'Changes only wheel_track from 0.14 to 0.16 m, continuing the sweep where
      0.10, 0.12 and 0.14 m scored 357, 483 and 517. Narrower tracks made bends overshoot,
      and off-track ends at max_error of 0.06 m or more remain the limiting failure.


      ### Rationale


      Race evidence: iteration 4 (wheel_track 0.14 m, other geometry as iteration
      1) is the best design so far at 517.07. Across the three clean wheel-track points,
      the score rises monotonically with track width: 0.10 m gave 357.3 (iteration
      3), 0.12 m gave 482.7 (iteration 1) and 0.14 m gave 517.1 (iteration 4). Holding
      every other variable fixed, the narrow track made the robot overshoot bends,
      with oval finishes falling from 20/20 to 14/20 and s-bend finishes from 5/20
      to 1/20. The wider track damped that overshoot: s-bend finishes rose to 6/20
      and the s-bend mean score rose to 519. Every failure is still an off-track end
      with max_error at or above 0.06 m, while rms_error stays at 0.026 to 0.031 m,
      so the limit is occasional large excursions, not steady tracking. The slalom
      has never finished (0/20 in every iteration), with about 0.9 to 1.0 line-loss
      events per run and progress near 0.2. Body width cannot widen the off-track
      limit, since max(0.06, 0.0125 + width/4) stays at 0.06 m across the allowed
      range. I will keep the iteration 4 layout and change only wheel_track, from
      0.14 to 0.16 m, to test whether the monotonic trend continues. Sensor span,
      footprint, lead, mass, wheel radius and body stay fixed so the change is attributable.
      Expected result: fewer bend excursions on the s-bend, more s-bend finishes,
      and a score at or above 517. Main risk: at 0.16 m the robot may turn too slowly
      for the slalom''s tightest bends, which would raise line-loss events there and
      could lower the oval score.


      - [Open this output](iteration-5/entity0/versions/ed28ba2d1d6b4ca4b53566742acf05ca/payload.json)

      - Based on: [entityR2A](iteration-5/entityR2A/versions/carried-7973b051c16417b5/payload.json)'
  - id: entity1
    label: Wider track 0.16 m
    notes: 'Iteration 4''s best layout with wheel_track raised from 0.14 to 0.16 m
      and the controller unchanged. Tests whether the monotonic track-width trend
      (357, 483, 517) continues. Based on the best race so far.


      ### Rationale


      Evidence: iteration 4 (wheel_track 0.14 m, all other fields as iteration 1)
      is the best design at 517.07. Across clean wheel-track points, score rises monotonically
      with width: 0.10 m gave 357.3 (iteration 3), 0.12 m gave 482.7 (iteration 1),
      0.14 m gave 517.1 (iteration 4). Oval finishes are 20/20 at 0.14 m, and s-bend
      finishes rose to 6/20 with mean score 519. Slalom is still 0/20 with about 0.9
      line-loss events per run. Every failure is an off-track end with max_error at
      or above 0.06 m, while rms_error stays at 0.026 to 0.031 m, so the limit is
      occasional bend excursions. Decision: keep the iteration 4 geometry and controller
      and change only wheel_track from 0.14 to 0.16 m, as the Builder proposed. Turn
      rate per PWM unit scales as 1/wheel_track, so yaw authority falls by about 0.875x.
      I do not rescale kp: iterations 2 and 3 lowered kp for narrower tracks and lost
      score, and keeping kp at 1.6 keeps this a single-variable test. Expected result
      (hypothesis, not measured): s-bend finishes at or above 6/20, score at or above
      517, and the slalom''s line-loss events may rise because turn authority is lower
      there. Controller stays as iteration 4: base_speed 1.0, kp 1.6, ki 0.05, kd
      0.5, weights -1.5 to +1.5 on the seven sensors, and last_direction line-loss
      recovery.


      - [Open this output](iteration-5/entity1/versions/729dc8530da24aeb883acbc51a6b67b2/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/ed28ba2d1d6b4ca4b53566742acf05ca/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-7973b051c16417b5/payload.json)'
  - id: entityR1
    label: Track trend and sensing
    notes: 'Feedback before racing: cites iteration 4 (517.1) and the 0.10 to 0.14
      m trend. Gives conditional next steps: wider track if the score holds, or sensor
      footprint or span if the slalom''s line loss rises.


      ### Feedback


      Written before this candidate has raced, so no result is stated for it. Evidence
      so far: iteration 4 (0.14 m track, score 517.1) is the best design: oval 20/20,
      s-bend 6/20 (mean 519), slalom 0/20 with about 0.9 line-loss events per run.
      Iteration 1 (0.12 m, 482.7) and iteration 3 (0.10 m, 357.3) show that score
      rises with track width over that range. Iterations 2 and 3 lowered kp for narrower
      tracks and still lost score, so I have not scaled kp with track width in this
      package. Integration answers from evidence: (1) On the slalom, line loss is
      about 0.9 per run at 0.14 m and 1.0 at 0.12 m, so the wider track has not yet
      clearly raised it. (2) Oval steering_oscillation was 0.2255 at 0.14 m, 0.299
      at 0.12 m and 0.252 at 0.10 m, so jitter did not rise with width. (3) Peak max_error
      is on bends, and the slalom''s line loss occurs on the same bends, but the exact
      peak position is not resolved yet. (4) The outer sensors carry the largest weights
      (plus or minus 1.5), and no evidence yet shows they over-drive the signal. Next
      race: if s-bend finishes reach at least 6/20 and score is at or above 517, keep
      the wider track and consider 0.18 m only if slalom line_loss_events stay at
      or below 0.9. If the score falls below 517 with slalom line loss rising, the
      track is too wide for the sharpest bends, so return to 0.14 m and change sensing.
      Change one field at a time so the effect can be attributed.


      ### Requested changes


      - If the 0.16 m race scores at or above 517 with slalom line_loss_events at
      or below 0.9: keep wheel_track at 0.16 m and try 0.18 m (the top of the allowed
      range) with all other fields unchanged. Evidence: iteration 4 at 0.14 m scored
      517.1, above 482.7 at 0.12 m, so the monotonic trend has held over 0.10 to 0.14
      m.

      - If the score falls below 517 or slalom line_loss_events rise above 0.9: return
      wheel_track to 0.14 m and change sensor_size from 0.016 to 0.012 m only. Evidence:
      slalom is 0/20 at every track width, with 0.9 to 1.0 line-loss events per run
      and progress near 0.2, so sensing is the next lever once track width stops helping.

      - If the 0.16 m race is near 517 with the s-bend unchanged: keep wheel_track
      at 0.14 m and narrow the sensor span to x = -0.05, -0.0333, -0.0167, 0, 0.0167,
      0.0333, 0.05 m. Evidence: iteration 2 widened the span to 0.15 m together with
      a narrower track and mass change, and its s-bend fell to 0/20, so narrowing
      is the less risky direction to test.


      - [Open this output](iteration-5/entityR1/versions/729dc8530da24aeb883acbc51a6b67b2/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/ed28ba2d1d6b4ca4b53566742acf05ca/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-7973b051c16417b5/payload.json)'
