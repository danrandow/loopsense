map:
  id: race-194-randow-maps-muted
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Wider sensors, lighter
    notes: 'Widens the sensor span to 12 cm with seven 16 mm sensors and lowers mass
      to 0.6 kg, aiming to cut the peak off-track error that ended all iteration-0
      runs. Based on iteration-0 telemetry: max_error of 0.061 to 0.064 m exceeded
      the 0.06 m limit, and line loss occurred 1 to 1.5 times per run.


      ### Rationale


      Iteration 0 raced with no completions: all 60 trials ended off track, with progress
      between 0.12 and 0.19. The per-track mean rms_error was small (0.024 to 0.030
      m), but max_error reached 0.061 to 0.064 m, above the 0.06 m off-track limit.
      Line-loss events were 1.0 to 1.55 per run. The failures come from occasional
      large excursions, not from steady tracking error. Body width cannot widen the
      limit: max(0.06, 0.0125 + width/4) stays at 0.06 for every width up to 0.18
      m, so the only lever is to keep max_error below 0.06. Line loss on bends suggests
      the 6 cm sensor span is too narrow to keep tape under a sensor. I am therefore
      widening the span to 0.12 m with seven sensors at 0.02 m spacing, which covers
      about 4.8 tape widths and should keep the line visible through larger lateral
      error. I am also moving to 16 mm footprints, so each sensor overlaps the tape
      over a wider range and gives a more graded reading. The sensors stay forward
      at y = 0.06 m to keep the lead distance. I am lowering mass to 0.6 kg to reduce
      yaw inertia and speed up turn response, and keeping wheel track, wheel radius
      and body size at baseline so that the change in each run can be attributed to
      a small number of variables. Expected result: fewer line-loss events, lower
      max_error, and at least some completions on the oval and s-bend tracks. Main
      risk: the 16 mm footprint may blur edges and the lower mass may increase oscillation
      at speed.


      - [Open this output](iteration-1/entity0/versions/dccb976e7a2f4579ad4fdb43484e57d5/payload.json)

      - Based on: [entityR2A](iteration-1/entityR2A/versions/carried-e51b4b3ef5d8f081/payload.json)'
  - id: entity1
    label: Wide 7-sensor robot v1
    notes: 'Builder''s 12 cm seven-sensor, 16 mm, 0.6 kg geometry with a moderate
      controller (kp 1.6, kd 0.5, base_speed 1.0). Chosen to keep steering authority
      near the iteration 0 baseline while testing the wider sensing span.


      ### Rationale


      Iteration 0 gave no completions. Every run left the track with max_error of
      0.060 to 0.064 m while rms_error stayed at 0.024 to 0.030 m, so the failures
      are short peak excursions on bends, not steady offset. The Builder''s proposal
      widens sensing to seven sensors over 0.12 m with 16 mm footprints, and lowers
      mass to 0.6 kg. I keep that geometry unchanged so the controller is tested on
      the exact proposed platform. Sensor x runs from -0.06 (right) to +0.06 (left),
      so weights are negative on the right and positive on the left, matching the
      signal convention. Weights of -1.5 to +1.5 with kp 1.6 give an effective position
      gain of about 2.4 per unit of signal, close to the baseline''s 2.5 on a ±1 scale.
      That keeps steering authority similar to iteration 0 while the wider span adds
      sensor coverage, so the controller is not made more aggressive at the same time
      as the geometry changes. kd rises to 0.5 to damp the faster turn response from
      the lighter 0.6 kg mass. ki stays small at 0.05 to avoid windup. base_speed
      is reduced from 1.2 to 1.0 because the baseline already left the line at 1.2
      and the new geometry is untested; the time budget is a risk I accept, and the
      next race will show whether completion_time is limited by speed. line_loss stays
      last_direction, which re-enters the line on the side it was lost from. Expected
      result, as a hypothesis to test: fewer line-loss events than the 1.0 to 1.55
      seen in iteration 0, and max_error below 0.06 m on at least one development
      track. Measurements requested cover the full set needed to answer the Builder''s
      questions per track.


      - [Open this output](iteration-1/entity1/versions/3c9451776d544bff931678c582cbeede/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/dccb976e7a2f4579ad4fdb43484e57d5/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-e51b4b3ef5d8f081/payload.json)'
  - id: entityR1
    label: Peak-error feedback v1
    notes: 'Feedback targets peak excursion: iteration 0 had max_error 0.060 to 0.064
      m with 0 completions, so the next race decides whether to change footprint,
      mass or track. Each requested change is tied to a specific earlier metric.


      ### Feedback


      Written before this candidate has raced. Iteration 0 (the only raced design)
      had 0 completions in 60 trials, max_error 0.060 to 0.064 m against the 0.06
      m limit, rms_error 0.024 to 0.030 m, and 1.0 to 1.55 line-loss events per run.
      So the limit is peak excursion on bends, not average tracking, and the next
      design should target peaks. This package keeps your seven-sensor 0.12 m span,
      16 mm footprint and 0.6 kg mass unchanged. For the integration questions: the
      span and footprint answers, and whether the 0.6 kg mass adds oscillation, can
      only be answered by the next race''s steering_oscillation and max_error by track.
      The controller uses weights of ±1.5 at the outer sensors and kd 0.5 to damp
      the faster turn response from lower mass, so any oscillation at speed would
      show as steering_oscillation rising on the oval. Lower base_speed (1.0) was
      chosen to protect against the extra mass-driven oscillation and the untested
      geometry, so completion_time will show whether speed is now the constraint.
      Next race, if max_error is still above 0.06 m on the s-bend with line_loss_events
      of 1 or more, the sensing span is probably not the limit: then try a smaller
      footprint (12 mm) to sharpen the edge reading. If steering_oscillation is high
      on the oval and max_error is under 0.06 m, restore mass to 0.8 kg for more yaw
      damping. If completion_time is limiting and max_error is under 0.06 m, try a
      narrower wheel_track of 0.10 m to raise turn rate. Only one of these should
      change at a time so the next race can attribute the effect.


      ### Requested changes


      - If max_error stays above 0.06 m on the s-bend and line_loss_events is 1 or
      more: change sensor_size from 0.016 to 0.012 m to sharpen the edge reading.
      Evidence: iteration 0 showed the line lost on bends with a 12 mm footprint and
      6 cm span, so the footprint change must be tested alone against this span.

      - If steering_oscillation is high on the oval while max_error is under 0.06
      m: restore mass from 0.6 kg to 0.8 kg for more yaw damping. Evidence: iteration
      0 steering_oscillation of 0.14 to 0.16 m with the 0.8 kg baseline, so the lower
      mass may raise it further.

      - If completion_time exceeds about 2.5 s with max_error under 0.06 m: reduce
      wheel_track from 0.12 m to 0.10 m to raise turn rate. Evidence: iteration 0
      rms_error was small (0.024 to 0.030 m) while no run finished, so tracking is
      adequate and speed or turn rate is the next limit.


      - [Open this output](iteration-1/entityR1/versions/3c9451776d544bff931678c582cbeede/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/dccb976e7a2f4579ad4fdb43484e57d5/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-e51b4b3ef5d8f081/payload.json)'
