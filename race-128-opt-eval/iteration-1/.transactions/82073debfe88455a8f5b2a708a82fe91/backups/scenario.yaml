  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Wider sensors, softer kp
    notes: 'Widened the sensor spread to +/-0.03 m with 16 mm footprints so the line
      is not lost until about 0.058 m error, and reduced kp to 1.5 with kd 0.1 and
      base_speed 1.4. This responds to the baseline''s off-track failures (max_error
      0.061 m just above the 0.06 m limit, line lost once per trial).


      ### Rationale


      Evidence from the baseline (iteration 0, no race yet, development sim only):
      all 60 trials went off track on oval, s-bend and slalom, with 1 line-loss event
      each and progress of only 0.04 to 0.12. The off-track limit is max(0.06, 0.0125
      + 0.12/4) = 0.06 m, and the measured max_error is about 0.061 m, so the robot
      drifts just past the allowed band right after losing the line once. rms_error
      (about 0.03 m) is low, so the robot is tracking reasonably until a transient
      pushes it out. Likely causes: (1) the outer sensors at x = +/-0.04 with 12 mm
      footprints barely see the 25 mm tape until the error is about 0.02 m, so the
      line is lost too early on bends; (2) base_speed 1.6 is too fast for the bend
      and recovery transients; (3) kp = 2 with a +/-2 signal gives up to about +/-4
      turn, which is aggressive for a line-follower with weak sensing. Changes: (a)
      sensors spread to x = -0.03, -0.015, 0, +0.015, +0.03 with 16 mm footprints,
      so the outer sensors overlap the tape at about 0.0045 m error and line loss
      needs error above about 0.058 m; (b) kp reduced from 2.0 to 1.5 and kd raised
      from 0.05 to 0.1 to damp the response; (c) base_speed reduced from 1.6 to 1.4
      to give the bends more margin, and line_loss kept as last_direction. Expected
      result: fewer line-loss events, max_error below 0.06 m on the development tracks,
      and some completions. The cost is a slower lap (about 3 s at 1.4). Hypotheses
      to check next: if completion is 1 with time above 2.8 s, raise base_speed toward
      1.6 to 1.7; if max_error still exceeds 0.06 on the s-bend, reduce base_speed
      further or increase kd.


      - [Open this output](iteration-1/entity0/versions/ef673030a82a4e6b9e2fd9a6f1382ec1/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-7d2d8a3106743523/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-70198df58ee69095/payload.json)'
  - id: entityR1
    label: 'Baseline review: approve'
    notes: 'Iteration 0 has no race data, so the baseline is checked only against
      the public contract: all fields are in range and the sign convention is correct.
      It is approved as the first race for telemetry, with conditional tuning hints
      for kp, base_speed and line_loss based on what the race shows.


      ### Feedback


      Written before this candidate has raced. There is no earlier race data yet,
      so the only evidence is the public contract and the candidate''s own contents.
      The geometry is valid: five sensors at x = +0.04 to -0.04 and y = 0.03 are within
      limits, the sensor_size of 0.012 is allowed, and the wheel_track, wheel_radius,
      mass and body dimensions all sit inside their ranges. The weights [2, 1, 0,
      -1, -2] match the sign convention, with positive x on the left. The controller
      is in range: kp = 2, ki = 0, kd = 0.05, base_speed = 1.6, and line_loss = last_direction.
      Two risks to check once telemetry arrives. First, the contract allows the signal
      to reach about ±2, so kp = 2 can produce a turn of about ±4, which is roughly
      ±1400 PWM across the wheels. That may be aggressive on the slalom and could
      show up as high steering_oscillation. Second, base_speed = 1.6 gives PWM about
      3276, and the course needs an average of roughly 1.5 m/s to finish inside 3
      s. Completion time will tell us whether that margin holds, but line loss on
      tight bends may cap the speed. Next-race guidance: if steering_oscillation is
      high or max_error is large on the slalom, reduce kp to about 1.2 to 1.5 and
      keep kd at 0.05 to 0.1. If line_loss_events is nonzero, lower base_speed to
      about 1.3 to 1.4 or change line_loss to search_right. If completed is 1 but
      completion_time is above about 2.8 s with low error, raise base_speed to about
      1.8. This is the first iteration with no baseline to compare against, so the
      candidate is valid and not obviously broken. Racing it gives more useful telemetry
      than another revision round.


      ### Requested changes


      - If steering_oscillation is high or max_error is large on the slalom (the contract
      allows signal up to ±2, so kp = 2 gives turn up to ±4), reduce kp to about 1.2
      to 1.5 and set kd to 0.05 to 0.1.

      - If line_loss_events is nonzero on the tight bends, lower base_speed to about
      1.3 to 1.4, or try line_loss = search_right to test the other recovery direction.

      - If the run completes with low rms_error but completion_time is above about
      2.8 s, raise base_speed to about 1.8 so the course is covered inside the 3 s
      limit.


      - [Open this output](iteration-0/entityR1/versions/57b8fd523e4d4f10948b422232e4dca9/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/b5112dcf3fbb43809cbba7f439386931/payload.json)'
