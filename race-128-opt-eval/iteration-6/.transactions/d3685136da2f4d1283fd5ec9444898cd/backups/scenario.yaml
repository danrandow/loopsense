map:
  id: race-128-opt-eval
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Slower entry, last_dir
    notes: 'Reverts line_loss to last_direction (search_right gave identical metrics
      to iteration 4) and tests base_speed 1.25 with kp 1.5, kd 0.15, ki 0 and the
      same geometry. Based on iterations 1 to 5, where max_error stayed at 0.060 to
      0.065 m and speed was the only untested variable acting at bend entry.


      ### Rationale


      Evidence. Iteration 5 (line_loss search_right) returned metrics identical to
      iteration 4 (last_direction) to four decimal places on all three tracks: score
      53.7076, max_error 0.0607, 0.0648 and 0.0621, one line-loss event per trial,
      and 0 completions. Recovery direction therefore has no measurable effect, and
      the excursion that pushes the robot past the 0.06 m off-track limit happens
      before or independently of the recovery steering. The results so far are: ki
      0.4 changed nothing (bias hypothesis not supported); kd 0.15 gave a tiny gain
      (+0.9) with no change in max_error; widening the sensors to +/-0.05 cut progress
      (controller signal averaging weakens steering); and every design, including
      the 1.6 base_speed baseline, still shows max_error of about 0.060 to 0.065 m.
      The off-track limit is max(0.06, 0.0125 + body_width/4), and even body_width
      0.18 gives only 0.0575, so the limit cannot be raised with geometry. The line
      is lost at about 0.05 m offset (16 mm sensors at +/-0.03 see the tape out to
      about 0.0505 m), so the robot is already drifting off the line before the loss.


      Change. Following the Evaluator''s rule for an unchanged result, I revert controller.line_loss
      to last_direction, since it is physically sensible and search_right gave no
      benefit. I also test base_speed 1.25 (down from 1.4), the one untested variable
      that acts on bend entry. Geometry (x = +/-0.03 with 16 mm footprints, y = 0.03),
      kp 1.5, ki 0 and kd 0.15 are unchanged, so any change is attributable to speed.
      The 1.6 baseline did not cure the excursion, but it was run with kp 2.0 and
      kd 0.05 and a 12 mm footprint, so speed was never isolated.


      Expected result. If bend-entry speed drives the drift, max_error should fall
      below about 0.060 m, line_loss_events should drop on some seeds, and progress
      should rise past the current 0.12 to 0.16. Completion is still unlikely at 1.25
      (about 3.5 s or more for the course), so completion_time will be the limit once
      the line is held. If max_error is still about 0.06 to 0.065 m with one loss
      per trial, speed is not the limit either, and the next test should be kp (e.g.
      2.0 with kd 0.15) to check whether stiffer steering corrects the drift before
      the 0.05 m loss.


      Hypotheses to check. (1) Lower speed reduces the drift at bends, so max_error
      falls and progress rises. (2) The excursion comes from a fixed transient at
      the start or first bend, and speed has no effect. (3) Progress gain from a longer
      run is worth more to the score (250 x progress) than the time term, so a slower
      but longer run should help while the robot stays on the line.


      - [Open this output](iteration-6/entity0/versions/33dca60274d646d7a8898233d514663d/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-2fa32862a04ddcf5/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-50c7bf0c8239ffdd/payload.json)'
  - id: entityR1
    label: 'Approve: speed 1.25 test'
    notes: 'Approved the iteration 4 design with base_speed lowered from 1.4 to 1.25
      and line_loss reverted to last_direction, the only untested variable left at
      the point of drift. Iteration 5 showed search_right had no effect, and every
      race so far has left the robot off track at about 0.06 m with one loss per trial.
      Racing this gives the speed evidence the next critique needs.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      candidate is the iteration 4 design (best raced, 53.7076: kd 0.15, ki 0, kp
      1.5, x = +/-0.03 with 16 mm footprints) with two changes: base_speed goes from
      1.4 to 1.25, and line_loss is back to last_direction. The line_loss change is
      a revert, not a new test: iteration 5 (search_right) matched iteration 4 to
      four decimal places on all three tracks, so recovery direction has no measured
      effect. The speed change is the only variable not yet isolated. The 1.6 baseline
      in iteration 0 was run with kp 2.0, kd 0.05 and 12 mm footprints, so it never
      tested speed alone. Every race so far has ended off track on all 60 trials with
      one line-loss event each and max_error of about 0.060 to 0.065 m. The geometry
      (iteration 2) and ki (iteration 3) changes did not help, and kd 0.15 (iteration
      4) gave only a small gain. The off-track limit cannot be raised with body_width
      (iteration 5 analysis), so the excursion has to be reduced by the controller
      or by speed. The candidate is valid, differs from the best raced design only
      by base_speed, and is cheap to race. Racing it gives the speed evidence the
      next critique needs, and the iteration has enough runs left for one more revision
      if the race points to a clear fix. Next-race guidance: (a) If max_error falls
      to 0.06 m or below, or line_loss_events drops to 0 or 1 on some seeds, keep
      base_speed 1.25 and check whether progress and completion_time improve. (b)
      If max_error and line_loss_events are unchanged (about 0.060 to 0.065 m, one
      loss per trial), speed is not the limit. Restore base_speed 1.4 and test kp
      2.0 with kd 0.15 as a single change, to see whether stiffer steering corrects
      the drift before the 0.05 m loss. (c) If progress falls below about 0.11 with
      no reduction in line loss, the slower speed costs more than it gains, so revert
      to 1.4.


      ### Requested changes


      - If max_error falls to 0.06 m or below, or line_loss_events falls to 0 or 1,
      keep controller.base_speed = 1.25 and check progress and completion_time against
      iteration 4 (progress 0.11 to 0.16, no completions) before any further change.

      - If max_error stays at about 0.060 to 0.065 m with one loss per trial, set
      controller.base_speed back to 1.4 and test controller.kp = 2.0 with kd = 0.15
      and ki = 0 as a single change. Iteration 0 is the only kp 2.0 run and it had
      a different kd and footprint, so this has not been tested cleanly.

      - If progress falls below about 0.11 with no drop in line-loss events, revert
      controller.base_speed to 1.4, since the slower run is losing distance without
      reducing the excursion.


      - [Open this output](iteration-6/entityR1/versions/c8e9c4ca1694418a9c13137db4286dc1/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/33dca60274d646d7a8898233d514663d/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-50c7bf0c8239ffdd/payload.json)'
