  entities:
  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'Conservative first candidate: five 12 mm sensors at 2 cm spacing, weights
      +2 to -2, kp 2, kd 0.05, base_speed 1.6, last_direction line loss. No race data
      yet; chosen from the contract limits and the 1.5 m/s pace needed to finish in
      3 s.


      ### Rationale


      Iteration 0 has no race data or Evaluator feedback, so this is a conservative
      baseline built from the contract. Evidence: the course is about 4 to 5 m and
      must be covered in under 3 s (about 1.5 m/s average), so the baseline needs
      a base_speed near 1.5 to 1.6 and a wheel radius that gives usable ground speed.
      Geometry: five sensors spaced 2 cm apart across the front of the axle (x = +0.04
      to -0.04, y = 0.03), with a 12 mm footprint. Five sensors cover the 25 mm tape
      with overlap, so the line stays visible through the bends. Sensor weights are
      +2, +1, 0, -1, -2, matching the sign convention (positive x is left, positive
      signal steers left). kp = 2 gives a moderate steering response, since the 350
      PWM per turn unit scale could oscillate at higher gains. kd = 0.05 damps the
      response without amplifying sensor noise. ki = 0 avoids integral windup on the
      bends. line_loss = last_direction recovers toward the side where the line was
      last seen. Expected result: the robot completes most of the oval and s-bend
      at around 1.5 m/s with a modest rms_error. The main risks are oscillation on
      the slalom (kp too high) and loss of the line on tight bends (speed too high).
      The observation request is set to measure these two directly. Next-iteration
      hypotheses: if steering_oscillation is high, reduce kp or raise kd; if line_loss_events
      is nonzero, lower base_speed or widen the sensor spread; if completion_time
      is above 3 s, raise base_speed.


