  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Forward sensors y=0.06
    notes: 'Moves all five sensors 3 cm further ahead of the axle (y 0.03 to 0.06)
      on the best raced controller (iteration 6, base_speed 1.25). Nine iterations
      of gain, speed, footprint, spacing and recovery tests left the 0.060 to 0.065
      m excursion unchanged, and sensor forward placement is the one geometry variable
      not yet tested.


      ### Rationale


      Evidence. Iterations 1 to 9 all ended off track on all 60 trials, each with
      one line-loss event and max_error of about 0.060 to 0.065 m. Tested changes
      that did not move this excursion: the +/-0.05 spread cut progress (iteration
      2); ki 0.4 changed nothing (3); kd 0.15 gave a small gain (4); line_loss search_right
      matched last_direction exactly (5); base_speed 1.25 changed max_error by 0.001
      to 0.004 m and gave the best raced score, 54.14 (6); kp 2.0 did not help (7);
      sensor_size 0.012 was neutral (8); and the spacing change to +/-0.025 gave 53.46
      with max_error unchanged (9). Gains, speed, footprint, spacing and recovery
      direction are therefore exhausted. The feedback on iteration 9 says the spacing
      test should be followed by a body or drivetrain variable, but none of those
      has been changed yet.


      The untested variable is forward sensor placement (y). All five sensors sit
      at y = 0.03, ahead of the axle. Because the robot turns about the axle, a sensor
      further forward sees the line earlier in each bend and reduces the lag between
      the error and the steering response. The excursion starts from an offset of
      about 0.05 m, where the 16 mm footprints lose the tape, so reacting earlier
      is the most plausible route to keeping the robot on the line. Moving the sensors
      to y = 0.06 (inside the allowed 0.08 maximum) is the single geometry change
      I can justify from the evidence.


      Change. Against the best raced design (iteration 6: base_speed 1.25, kp 1.5,
      kd 0.15, ki 0, last_direction, x = +/-0.03 and +/-0.015 with 16 mm footprints),
      I change only sensor y from 0.03 to 0.06. I keep base_speed 1.25 because it
      is the best raced score, so this iteration''s result is compared with 54.14.
      Everything else is unchanged.


      Expected result: max_error falls below about 0.060 m on some seeds, or line_loss_events
      drops, with progress at least 0.165 (the iteration 6 s-bend level). The risk
      is that a longer lever changes the signal''s lag or response in a way that makes
      the controller oscillate, which steering_oscillation will show.


      Hypotheses and measurements. (1) Forward sensors reduce the bend excursion,
      so max_error and line_loss_events improve. (2) If max_error is unchanged, sensor
      position is not the limit, and the next candidate should test wheel_track 0.10
      (a higher yaw rate per PWM difference) with the best controller. Measurements:
      max_error and line_loss_events per track, progress and completion_time (the
      run must cover the course with less loss), steering_oscillation (to check for
      jitter from the longer lever) and completion.


      - [Open this output](iteration-10/entity0/versions/baf9275662ac44ca8b4e47fb1683cc51/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-b5b01bb4473b61f6/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-965bfa6d32a9d411/payload.json)'
  - id: entityR1
    label: 'Approve: spacing +/-0.025'
    notes: 'Approved the single-variable test of outer sensor spacing (+/-0.025 vs
      +/-0.03), with all else as in iteration 4 (53.71). Every design so far has gone
      off track on all 60 trials with about 0.060 to 0.065 m max_error, so this race
      is more useful than another revision round.


      ### Feedback


      Written before this candidate has raced. Evidence: iteration 4 (kp 1.5, kd 0.15,
      ki 0, base_speed 1.4, last_direction, x = +/-0.03, 16 mm) scored 53.71 with
      max_error of 0.0607, 0.0648 and 0.0621 m and one line loss per trial. Iterations
      3 (ki), 5 (line_loss), 6 (base_speed 1.25, 54.14 best so far) and 7 (kp 2.0,
      53.40) each left that excursion essentially unchanged. Iteration 2 showed that
      the wider +/-0.05 spread cut progress on the s-bend and slalom (0.04 and 0.035,
      against 0.16 and 0.11), so the spread should stay near +/-0.03. This candidate
      is a single-variable test against iteration 4: outer spacing goes from +/-0.03
      to +/-0.025, with the inner sensors and the footprint at 0.016 m. The geometry
      is valid and the change is small. Its expected effect is modest, and it is not
      obviously broken. Racing is more informative than another revision round, since
      all designs so far score within about 1.5 points and have shown no completions.


      What to do next, depending on the race telemetry. (a) If max_error and line_loss_events
      are unchanged (about 0.060 to 0.065 m, one loss per trial), outer spacing is
      not the limit. Do not spend more iterations on gains, speed, footprint or spacing.
      Test a body or drivetrain variable instead, such as wheel_track 0.10 (narrower
      track, higher yaw rate per PWM difference) or mass 0.6. (b) If progress falls
      below about 0.11 or steering_oscillation rises with no gain in max_error, revert
      spacing to +/-0.03. (c) If max_error drops to 0.06 m or below, or line_loss_events
      falls on some seeds, keep +/-0.025 and combine it with base_speed 1.25, which
      was the best raced score (iteration 6). Check progress and completion_time before
      adding any other change.


      ### Requested changes


      - If max_error and line_loss_events are unchanged from iteration 4 (about 0.060
      to 0.065 m, one loss per trial), keep the controller at kp 1.5, kd 0.15, ki
      0, base_speed 1.4, and test geometry.wheel_track = 0.10 as a single change,
      since outer spacing and gains have shown no effect on the excursion.

      - If progress falls below about 0.11 or steering_oscillation rises with no gain
      in max_error, return sensor_positions to x = +/-0.03 (iteration 4 values), because
      the shorter spread weakens steering as iteration 2 did.

      - If max_error drops to 0.06 m or below, keep sensor_positions at x = +/-0.025
      and combine it with controller.base_speed = 1.25 (the best raced score, iteration
      6), then check progress and completion_time before any further change.


      - [Open this output](iteration-9/entityR1/versions/f3a19cc57ca84aa78732a215bb042caf/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/2e5acb1ab3104cf1a76c5e936969436e/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-d9ff9759fbd33215/payload.json)'
