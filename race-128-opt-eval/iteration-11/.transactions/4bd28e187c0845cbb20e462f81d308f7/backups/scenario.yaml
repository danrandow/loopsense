map:
  id: race-128-opt-eval
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: 'Final: best raced design'
    notes: 'Resubmits the iteration 10 design unchanged (score 60.27, best raced),
      with sensors moved forward to y = 0.06 and the iteration 6 controller. Oval
      progress and rms_error improved, but the excursion (max_error about 0.063 m,
      one line loss per trial) is still present, so I did not extrapolate to untested
      values on the final unseen-track race.


      ### Rationale


      This is the final iteration, so the design that races here is the one scored
      on the unseen track, and no later iteration can correct it. The best evidence
      is iteration 10 (score 60.27, best so far), which moved sensor y from 0.03 to
      0.06 on the iteration 6 controller. Its gain came mainly from oval progress
      (0.163 against 0.118), oval rms_error (0.0194 against 0.0293) and oval control
      effort (1.24 against 1.92). The s-bend and slalom progress were unchanged. Every
      track still shows one line-loss event per trial and max_error of about 0.063
      m, so the excursion is not solved. Gains (kp, kd, ki), speed, footprint, spacing
      and recovery direction all left the excursion essentially unchanged. The Evaluator''s
      approved candidate (R1) is this same design, and its guidance was to keep y
      = 0.06 and judge it on max_error, line-loss count and progress. I considered
      extending y to 0.08 as a single further step. The trend is supported on only
      one step, and the s-bend and slalom gave no gain, so an untested extrapolation
      on the final, unseen-track race carries more risk than the expected benefit.
      I therefore submit the iteration 10 design unchanged: base_speed 1.25, kp 1.5,
      ki 0, kd 0.15, last_direction, sensors at x = +0.03, +0.015, 0, -0.015, -0.03
      with y = 0.06, 16 mm footprints. Expected result: roughly the iteration 10 scores
      on the development tracks (about 60) and a similar, uncertain outcome on the
      unseen track. Hypotheses to check: whether forward placement reduces the drift
      on the unseen track''s bends, and whether progress remains above about 0.16.
      The measurements requested are max_error, line_loss_events and progress per
      track, plus steering_oscillation and completion to detect jitter or a finish.


      - [Open this output](iteration-11/entity0/versions/9e5dd02742bc4d3a8fa845267d0487e8/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-5bfb6e4a2efd532f/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-83869db4db90b3be/payload.json)'
  - id: entityR1
    label: 'Approve: forward sensors'
    notes: 'Approved the iteration 6 design with only sensor y moved from 0.03 to
      0.06, the one geometry variable not yet tested. Earlier races (iterations 1
      to 9) showed gains, speed, footprint, spacing and recovery direction all leave
      max_error near 0.060 to 0.065 m, so racing this single change is the most informative
      next step with one iteration left.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      candidate is the iteration 6 design (best raced score, 54.14: base_speed 1.25,
      kp 1.5, kd 0.15, ki 0, last_direction, sensors at x = +/-0.03 and +/-0.015 with
      16 mm footprints) with one change: sensor y moves from 0.03 to 0.06. The geometry
      is valid, since y = 0.06 is inside the allowed 0.08 maximum. The change is a
      single variable, and it is the one geometry variable not yet tested. Iterations
      1 to 9 all went off track on all 60 trials with one line loss each and max_error
      of about 0.060 to 0.065 m. Gains (iterations 3, 4, 7), speed (6), footprint
      (8), spacing (2, 9) and recovery direction (5) have each left that excursion
      essentially unchanged, so the remaining levers are body or drivetrain variables
      and forward sensor placement. Your lag argument is plausible for bends, but
      the excursion starts from a steady offset, so the benefit is uncertain. Racing
      is more informative than another revision round, and one iteration remains after
      this one to exploit the result.


      What to do next, depending on the race telemetry. (a) If max_error falls below
      about 0.060 m or line_loss_events drops on some seeds, keep y = 0.06 and check
      progress, completion_time and steering_oscillation before adding anything else.
      Consider y = 0.08 as the next step only if the trend is clear. (b) If max_error,
      line_loss_events and progress are unchanged, forward placement is not the limit.
      Restore y = 0.03 and test wheel_track = 0.10 with the iteration 6 controller,
      since a higher yaw rate per PWM difference may correct the drift. (c) If steering_oscillation
      rises sharply with no gain in max_error, return y to 0.03, because the longer
      lever is adding jitter without reducing the excursion.


      ### Requested changes


      - Keep sensor y = 0.06 and all other iteration 6 values. Judge the result on
      max_error and line_loss_events against the iteration 6 values (about 0.0606,
      0.0653, 0.0657 m, one loss per trial), and on progress against 0.11 to 0.165.

      - If max_error and line_loss_events are unchanged, set sensor y back to 0.03
      and test geometry.wheel_track = 0.10 as a single change, since the sensor and
      gain levers have shown no effect on the excursion.

      - If steering_oscillation rises sharply with no gain in max_error, set sensor
      y back to 0.03 so the controller returns to the iteration 6 values.


      - [Open this output](iteration-10/entityR1/versions/76dbff7388904e4dae483bb130fc38a5/payload.json)

