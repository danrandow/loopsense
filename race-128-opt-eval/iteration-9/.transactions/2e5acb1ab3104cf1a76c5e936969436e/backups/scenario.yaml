overrides:
  entities:
  - id: entity0
    label: Smaller sensor footprint
    notes: 'Iteration 4 controller (kp 1.5, kd 0.15, ki 0, base 1.4) with sensor_size
      reduced from 16 mm to 12 mm at the same +/-0.03 spacing. Iteration 7 showed
      kp 2.0 gave no gain (max_error unchanged at about 0.060 to 0.065 m, one loss
      per trial), so gain tuning is exhausted and the footprint is the next single
      variable.


      ### Rationale


      Evidence. Iteration 7 raced kp 2.0 with kd 0.15, ki 0, base_speed 1.4 and last_direction,
      and scored 53.4026. That is below iteration 4 (kp 1.5, same otherwise, 53.7076).
      max_error (0.0605, 0.0648, 0.0624) and the one line-loss event per trial are
      unchanged. Steering_oscillation is unchanged on oval and slalom, and control_effort
      rose on the s-bend (2.78 to 3.70). So stiffer proportional steering does not
      hold the line, and gain tuning is exhausted for this geometry. The Evaluator''s
      rule (c) applies: keep base_speed 1.4 and test a smaller outer-sensor footprint
      with the sensor positions still near x = +/-0.03. Iterations 1 to 7 all share
      the same excursion of 0.060 to 0.065 m, and the sensor geometry is the one part
      of the design not yet tested in isolation at this spacing.


      Change. Against iteration 4, which is the best-measured controller, I make one
      change: sensor_size goes from 0.016 to 0.012. I also revert kp from 2.0 to 1.5,
      because iteration 7 showed no gain from kp 2.0 and iteration 4 is the cleaner
      baseline. Positions (x = +0.03, +0.015, 0, -0.015, -0.03 at y = 0.03), kd 0.15,
      ki 0, base_speed 1.4, line_loss last_direction and the sensor weights are unchanged.


      Reasoning for the footprint. A footprint of side s sees the 25 mm tape while
      the sensor is within 0.0125 + s/2 of the line centre. With 16 mm that reach
      is about 0.0205 m. With 12 mm it is about 0.0185 m. So the outer sensor loses
      the tape slightly closer to the line, and the excursion will be measured against
      a different loss point. This is a small effect, and the expected result is modest:
      max_error at or near 0.060 to 0.065 m, possibly with a slightly different line-loss
      count. A clean null result would also show that the excursion is driven by the
      disturbance or the course, not by sensing reach.


      Hypotheses to check next. (1) If max_error and line_loss_events are unchanged,
      the excursion is set by something other than sensing or gains, and the next
      step is to test a different outer spacing (for example x = +/-0.025) or a body
      or mass change. (2) If steering_oscillation rises with the smaller footprint,
      the signal is noisier and 0.016 should be restored. (3) Completion remains unlikely
      at 1.4 (progress 0.11 to 0.16 so far), so progress and completion_time remain
      the measurements to watch.


      - [Open this output](iteration-8/entity0/versions/4b59c5f0a372459b89dfdeb9bb473a08/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-8ff117d818cd8930/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-93f28b175114addc/payload.json)'
  - id: entityR1
    label: Evaluator Feedback
    notes: 'Evaluator Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      candidate is the iteration 4 design (best-measured controller: kp 1.5, kd 0.15,
      ki 0, base_speed 1.4, last_direction) with one geometry change: sensor_size
      goes from 0.016 to 0.012, positions unchanged at x = +0.03 to -0.03 with y =
      0.03. Evidence: all 60 trials in every iteration since 1 went off track with
      one line-loss event each and max_error of about 0.060 to 0.065 m. Iterations
      3 (ki), 4 (kd), 5 (line_loss), 6 (base_speed) and 7 (kp 2.0) each left that
      excursion essentially unchanged, so gain and speed tuning look exhausted for
      this geometry. Iteration 2 showed that widening the spread to plus or minus
      0.05 weakens steering and cuts progress, so the spread should stay near plus
      or minus 0.03. The candidate is valid and differs from iteration 4 by a single
      field. Racing it is more informative than another revision round, and the scores
      of all designs sit within about 1.5 points, so the cost of a null result is
      small.


      A caution on the hypothesis. A 12 mm footprint reaches the tape only to about
      0.0185 m from the line, against about 0.0205 m for 16 mm, so the main expected
      effect is if anything a slightly earlier loss, not a later one. A worse result
      would therefore be informative: it would confirm that reach matters and point
      to larger footprints, not smaller ones.


      What to change after the race, depending on telemetry. (a) If max_error and
      line_loss_events are unchanged (about 0.060 to 0.065 m, one loss per trial),
      sensing footprint is not the limit either. The excursion is set by the disturbance
      or the course, so test a different outer spacing (for example plus or minus
      0.025) with sensor_size 0.016 as a single change. (b) If max_error or line-loss
      count gets worse, restore sensor_size 0.016, since reach is the limiting factor.
      (c) If steering_oscillation rises with no gain, restore 0.016 as well, because
      the signal is noisier. Completion remains unlikely at 1.4, so progress and completion_time
      are the measurements to watch.


      ### Requested changes


      - If max_error and line_loss_events are unchanged from iteration 4 (about 0.060
      to 0.065 m, one loss per trial), keep sensor_size 0.012 or return it to 0.016,
      and test sensor_positions at x = +0.025, +0.0125, 0, -0.0125, -0.025 (y = 0.03)
      as a single change, since the outer-spacing effect has not been tested in isolation.

      - If max_error or line_loss_events gets worse with sensor_size 0.012, restore
      controller and geometry to iteration 4 with sensor_size 0.016, because the smaller
      footprint''s shorter reach (about 0.0185 m against 0.0205 m) is limiting the
      first line loss.

      - If steering_oscillation rises with no gain in max_error, set sensor_size back
      to 0.016 and keep kp 1.5, kd 0.15, ki 0, base_speed 1.4, so the controller stays
      at the best-measured values.


      - [Open this output](iteration-8/entityR1/versions/87df26dd6213491b9276a0bdf61ebcd0/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/4b59c5f0a372459b89dfdeb9bb473a08/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-93f28b175114addc/payload.json)'
