map:
  id: race-128-opt-eval
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Tighter outer spacing
    notes: 'Iteration 4 controller with the sensor spread narrowed to plus or minus
      0.025 at 16 mm footprints, as the single change. Iterations 1 to 8 all left
      max_error at 0.060 to 0.065 m with one line loss per trial, and the Evaluator''s
      untested outer-spacing branch is the next step.


      ### Rationale


      Evidence. Iterations 1 to 8 all went off track on all 60 trials, with one line-loss
      event per trial and max_error of 0.060 to 0.065 m. Tested changes have not moved
      that excursion: the wider spread to +/-0.05 cut progress (iteration 2); ki 0.4
      changed nothing (iteration 3); kd 0.15 gave only a small gain (iteration 4);
      line_loss search_right matched last_direction exactly (iteration 5); base_speed
      1.25 changed max_error by about 0.001 to 0.004 m (iteration 6); kp 2.0 did not
      help (iteration 7); and sensor_size 0.012 gave 53.05 against 53.71, with max_error
      unchanged (iteration 8). The off-track limit is max(0.06, 0.0125 + body_width/4),
      so body_width cannot raise it. Iteration 8 is therefore a repeat of the sensor-footprint
      test, and the Evaluator''s pending feedback for this design describes that test
      as not yet raced. Its branch (a) applies: max_error and line-loss count are
      unchanged, so footprint is not the limit. The next untested geometry variable
      is outer sensor spacing, which the Evaluator asked to test in isolation.


      Change. Against iteration 4 (best-measured controller: kp 1.5, kd 0.15, ki 0,
      base_speed 1.4, last_direction), I change only sensor_positions, from x = +0.03,
      +0.015, 0, -0.015, -0.03 to x = +0.025, +0.0125, 0, -0.0125, -0.025, all at
      y = 0.03. sensor_size goes back to 0.016 (the 0.012 footprint gave no benefit
      and the Evaluator''s rule (c) favours 0.016). Spread stays near +/-0.03 because
      the wider +/-0.05 spread weakened steering.


      Expected result. A tighter spread gives a steeper signal for small offsets,
      which may correct the drift earlier, so max_error may fall slightly. The result
      is more likely a near-null: max_error about 0.060 to 0.065 m with one loss per
      trial. If progress falls, spacing has cut the usable signal and +/-0.03 is the
      better geometry.


      Hypotheses and measurements. (1) Tighter outer spacing reduces the drift before
      the first loss, so max_error and line_loss_events improve. (2) If nothing moves,
      the excursion is set by the disturbance or the course, and the next candidate
      should test wheel_track (narrower track raises yaw rate per PWM difference)
      or a mass change. Measurements: max_error and line_loss_events per track to
      test the drift; progress and completion_time to check that the run gets further;
      steering_oscillation to check for jitter from the steeper signal; completion
      to check for any finish.


      - [Open this output](iteration-9/entity0/versions/2e5acb1ab3104cf1a76c5e936969436e/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-c6f64670e535535f/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-d9ff9759fbd33215/payload.json)'
  - id: entityR1
    label: 'Approve: spacing +/-0.025'
    notes: 'Approved the single-variable test of outer sensor spacing (+/-0.025 vs
      +/-0.03), with all else as in iteration 4 (53.71). Every design so far has gone
      off track on all 60 trials with about 0.060 to 0.065 m max_error, so this race
      is more useful than another revision round.


      ### Feedback


      Written before this candidate has raced. Evidence: iteration 4 (kp 1.5, kd 0.15,
      ki 0, base_speed 1.4, last_direction, x = +/-0.03, 16 mm) scored 53.71 with
      max_error of 0.0607, 0.0648 and 0.0621 m and one line loss per trial. Iterations
      3 (ki), 5 (line_loss), 6 (base_speed 1.25, 54.14 best so far) and 7 (kp 2.0,
      53.40) each left that excursion essentially unchanged. Iteration 2 showed that
      the wider +/-0.05 spread cut progress on the s-bend and slalom (0.04 and 0.035,
      against 0.16 and 0.11), so the spread should stay near +/-0.03. This candidate
      is a single-variable test against iteration 4: outer spacing goes from +/-0.03
      to +/-0.025, with the inner sensors and the footprint at 0.016 m. The geometry
      is valid and the change is small. Its expected effect is modest, and it is not
      obviously broken. Racing is more informative than another revision round, since
      all designs so far score within about 1.5 points and have shown no completions.


      What to do next, depending on the race telemetry. (a) If max_error and line_loss_events
      are unchanged (about 0.060 to 0.065 m, one loss per trial), outer spacing is
      not the limit. Do not spend more iterations on gains, speed, footprint or spacing.
      Test a body or drivetrain variable instead, such as wheel_track 0.10 (narrower
      track, higher yaw rate per PWM difference) or mass 0.6. (b) If progress falls
      below about 0.11 or steering_oscillation rises with no gain in max_error, revert
      spacing to +/-0.03. (c) If max_error drops to 0.06 m or below, or line_loss_events
      falls on some seeds, keep +/-0.025 and combine it with base_speed 1.25, which
      was the best raced score (iteration 6). Check progress and completion_time before
      adding any other change.


      ### Requested changes


      - If max_error and line_loss_events are unchanged from iteration 4 (about 0.060
      to 0.065 m, one loss per trial), keep the controller at kp 1.5, kd 0.15, ki
      0, base_speed 1.4, and test geometry.wheel_track = 0.10 as a single change,
      since outer spacing and gains have shown no effect on the excursion.

      - If progress falls below about 0.11 or steering_oscillation rises with no gain
      in max_error, return sensor_positions to x = +/-0.03 (iteration 4 values), because
      the shorter spread weakens steering as iteration 2 did.

      - If max_error drops to 0.06 m or below, keep sensor_positions at x = +/-0.025
      and combine it with controller.base_speed = 1.25 (the best raced score, iteration
      6), then check progress and completion_time before any further change.


      - [Open this output](iteration-9/entityR1/versions/f3a19cc57ca84aa78732a215bb042caf/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/2e5acb1ab3104cf1a76c5e936969436e/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-d9ff9759fbd33215/payload.json)'
