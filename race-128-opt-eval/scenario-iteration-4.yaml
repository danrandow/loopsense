overrides:
  entities:
  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence: iteration 3 (ki 0.4, otherwise identical to iteration 1) scored 52.8064
      against 52.8232 for iteration 1. Every track is essentially unchanged: rms_error
      is 0.0286 to 0.0300 m, max_error is 0.061 to 0.065 m, and there is one line-loss
      event per trial with 0 completions. The bias hypothesis (a fixed left/right
      motor mismatch that ki would cancel) is therefore not supported. Following the
      Evaluator''s rule (b), I revert ki to 0 and test kd 0.15 as the single change
      against the best raced design. The geometry is unchanged from iteration 1 (five
      sensors at x = +0.03, +0.015, 0, -0.015, -0.03, y = 0.03, 16 mm footprints),
      because the outer-sensor reach test is still the most credible explanation for
      the first line loss. Changing only kd tests whether the transient after the
      first line loss is damping-limited. Expected result: max_error falls toward
      or below 0.06 m and line_loss_events drops to 0 or 1 on some seeds. If max_error
      and line-loss count stay the same, damping is not the limit either. The next
      hypotheses are then base_speed too high for the bend entry (test 1.2 to 1.3
      with kd 0.15) or the line_loss recovery direction (test search_right). Measurements
      requested: rms_error, max_error and line_loss_events to see whether kd changes
      the transient; steering_oscillation to check that the extra damping does not
      add jitter; completion and completion_time to see whether any run finishes.


      - [Open this output](iteration-4/entity0/versions/faf89252107d4630a8e01d12ee383dc4/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-6ef587f617cd5cd5/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-d77ee7dddfc46715/payload.json)'
  - id: entityR1
    label: Approve kd 0.15 test
    notes: 'Approved the iteration 4 candidate: the best raced design (iteration 1)
      with ki reset to 0 and kd raised to 0.15 as one controlled test. Iteration 3
      showed the fixed-bias hypothesis is unsupported (52.8064 vs 52.8232), and racing
      this valid, low-risk test gives the most useful telemetry.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      candidate is the iteration 1 design (best raced, 52.8232) with two controlled
      changes from the iteration 3 test: ki returns to 0, and kd goes from 0.1 to
      0.15. Geometry (x = +/-0.03, y = 0.03, 16 mm footprints), kp 1.5, base_speed
      1.4 and line_loss last_direction are unchanged. Evidence: iteration 3 (ki 0.4)
      gave 52.8064 against 52.8232 for iteration 1, with the same rms_error (about
      0.029 to 0.030 m), max_error (0.061 to 0.065 m) and one line-loss event per
      trial. The fixed-bias hypothesis is therefore not supported, and ki 0 is the
      correct baseline. Iteration 2 showed that widening the outer sensors to +/-0.05
      cut progress on the s-bend and slalom (0.04 and 0.035, against 0.16 and 0.11
      in iteration 1), so geometry should stay at +/-0.03 for now. Every design so
      far has gone off track on all 60 trials, with no completions. The kd change
      is a small, valid, single-variable test of whether damping limits the transient
      after the first line loss. It is not obviously broken and is cheap to race,
      and telemetry from it will sharpen the next critique. Next-race guidance: if
      max_error falls to 0.06 m or below, or line_loss_events drops to 0 or 1 on some
      seeds, keep kd 0.15 and test base_speed 1.6 for progress and completion_time.
      If max_error and line_loss_events are unchanged from iteration 1, damping is
      not the limit, so test line_loss search_right as the next single change. If
      kd 0.15 makes steering_oscillation rise sharply with no gain in max_error, return
      kd to 0.1 and test base_speed 1.2 to 1.3 on the bend entry.


      ### Requested changes


      - If max_error drops to 0.06 m or below, or line_loss_events falls to 0 or 1,
      keep kd 0.15 and test controller.base_speed 1.6 to raise progress and completion_time.

      - If max_error and line_loss_events are unchanged from iteration 1 (max about
      0.061 to 0.065 m, one line loss per trial), keep ki 0 and kd 0.15, then test
      controller.line_loss = search_right as a single change.

      - If steering_oscillation rises sharply with no gain in max_error, set controller.kd
      back to 0.1 and test controller.base_speed 1.2 to 1.3 to see whether bend entry
      speed is causing the line loss.


      - [Open this output](iteration-4/entityR1/versions/f89e5bf9fd3e473f842bcb43bdee5c1c/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/faf89252107d4630a8e01d12ee383dc4/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-d77ee7dddfc46715/payload.json)'
