map:
  id: race-129-randow-maps
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Sensors forward to y=0.04
    notes: 'Moves the widened 16 mm array 10 mm closer to the axle, as the Integrator''s
      rule requires when line loss and max_error ≥ 0.06 persist on the slalom and
      s-bend after widening (iteration 1: score 50.13, all tracks still off-track).
      Everything else is held fixed so the controller still applies.


      ### Rationale


      Iteration 1 widened the array to x = ±0.03 m with 16 mm footprints. The score
      rose only from 49.47 to 50.13. Every track still ends off-track with max_error
      of 0.0615 to 0.0687, and line_loss_events is still 1 on each track. Progress
      is 0.10 to 0.15, so the robot is leaving the tape early, not running out of
      time. Steering oscillation stays low (0.07 to 0.15), so this is not jitter.
      The off-track limit is max(0.06, 0.0125 + body_width/4). Body width cannot raise
      that limit above 0.06 within the allowed range, so the robot has to be kept
      closer to the line. The Integrator''s pre-race feedback set a rule for this
      case: if line loss or max_error ≥ 0.06 persists on the slalom or s-bend after
      widening, move all sensors to y = 0.04 m. Both conditions held in iteration
      1 (s-bend max_error 0.0658, slalom line loss 1 and max_error 0.0687), so I apply
      that change now. Shortening the forward lead by 10 mm lets the controller react
      to a bend sooner, which is the most likely remaining cause of drift. I keep
      x = -0.03, -0.015, 0, 0.015, 0.03 m, sensor_size 0.016, the weights, body, mass
      and wheels unchanged, so the Integrator''s controller and gains still apply.
      Mass and wheel size are not yet the limit, because the robot is not reaching
      the finish. Expected result: line_loss_events falls to 0 on the slalom and s-bend,
      max_error drops below 0.06, and progress rises well above 0.15. If the robot
      holds the line but completion_time stays above 3.0 s, the next change is to
      reduce mass to 0.5 kg or raise wheel_radius to 0.035 m.


      - [Open this output](iteration-2/entity0/versions/d97accb7afbe42e9be0b7a219748c930/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-ca9683aaf0386692/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-02a7d58de7769034/payload.json)'
  - id: entity1
    label: Wider array + kp 3.0
    notes: 'Adopts the Builder''s +/-0.03 m, 16 mm sensor array with weights unchanged,
      and raises kp to 3.0 and kd to 0.1 to correct drift. Iteration 0 showed all
      60 trials going off-track with low oscillation.


      ### Rationale


      Iteration 0 showed no completions. All 60 trials ended off-track, with max_error
      of 0.062 to 0.069 and line_loss_events of 1 to 2. Steering oscillation stayed
      low (0.07 to 0.15), so the robot drifts steadily off the tape rather than jittering.
      The 5-sensor array at +/-0.02 m with 12 mm footprints loses the tape once the
      offset passes about 0.015 m, which matches the observed failure. The Builder''s
      geometry widens the span to +/-0.03 m and enlarges the footprint to 16 mm, so
      the outer sensors keep seeing tape at larger offsets. The 15 mm spacing is still
      smaller than the footprint, so neighbouring sensors overlap and the signal stays
      continuous. Weights stay at [-2,-1,0,1,2], so the signal scale is unchanged.
      For the controller I keep base_speed at 1.6, mass, wheels and track unchanged,
      so the race isolates the array change. I raise kp from 2.5 to 3.0 so the robot
      corrects harder when it drifts toward the 0.06 m limit. Iteration 0 oscillation
      was low, so there is room for this. I raise kd from 0.05 to 0.1 to damp the
      faster correction. ki stays at 0.05 for the motor mismatch. line_loss stays
      ''last_direction'', which suited the bends. Expected result: line_loss_events
      falls toward 0, max_error drops below 0.06, and progress rises well above 0.15.
      The kp change is a deliberate, small confound. If steering oscillation rises
      sharply, the next step is to return kp to 2.5.


      - [Open this output](iteration-1/entity1/versions/e74bf8b47ec14daba8f10601613366fd/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/90eb2a80456c4e999854d9c7071ac85d/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-6641ef1ba71e38e2/payload.json)'
  - id: entityR1
    label: Lead and speed next steps
    notes: 'Feedback written before racing, tied to iteration 0 off-track results.
      It gives conditional next changes: shorten the lead to y = 0.04 m if line loss
      persists, or reduce mass or raise wheel radius if the robot is slow but on the
      line.


      ### Feedback


      This is written before the candidate has raced. Iteration 0 is the only evidence.
      All 60 trials ended off-track with max_error of 0.062 to 0.069 and line_loss_events
      of 1 to 2, while steering oscillation stayed low (0.07 to 0.15). So the problem
      is coverage, not jitter, which supports widening the array as you proposed.
      I have built the controller for your widened array with kp 3.0 and kd 0.1, a
      modest increase to correct drift harder. The next race will decide the next
      change. If line_loss_events is still above 0 on the slalom or s-bend while max_error
      is at or above 0.06, the array is still too narrow for the sharpest bends. Next,
      move the sensors forward to y = 0.04 m to shorten the lead. If the robot holds
      the line (max_error below 0.06, line_loss_events at 0) but completion_time is
      above 3.0 s, the limit is speed, so reduce mass or raise wheel_radius. If steering_oscillation
      rises sharply, the higher kp is too aggressive, so return to kp 2.5 before changing
      geometry.


      ### Requested changes


      - If the next race still shows line_loss_events > 0 or max_error >= 0.06 on
      the slalom or s-bend, move all sensors to y = 0.04 m (keep x = -0.03, -0.015,
      0, 0.015, 0.03 and sensor_size 0.016). Iteration 0 showed the off-track limit
      is reached at the 50 mm lead, so a shorter lead lets the controller react sooner.

      - If the next race keeps the line (max_error < 0.06, line_loss_events 0) but
      completion_time stays above 3.0 s, reduce mass from 0.6 to 0.5 kg or raise wheel_radius
      from 0.03 to 0.035 m. Iteration 0 shows speed-limited progress at 0.10 to 0.15
      with no completions, so the bottleneck is also likely speed.

      - If the next race shows steering_oscillation rising well above the iteration
      0 range (0.07 to 0.15), keep the same geometry and reduce kp to 2.5 with kd
      at 0.1. Iteration 0 oscillation was low, so the higher gain is only useful if
      the array keeps the tape in view.


      - [Open this output](iteration-1/entityR1/versions/e74bf8b47ec14daba8f10601613366fd/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/90eb2a80456c4e999854d9c7071ac85d/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-6641ef1ba71e38e2/payload.json)'
