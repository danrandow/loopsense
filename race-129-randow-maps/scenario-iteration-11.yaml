  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 10 repeated iteration 9''s best geometry (wheel_radius 0.044 m, mass
      0.6 kg, wheel_track 0.12 m, 12 mm sensors at x = -0.03 to 0.03 m, y = 0.04 m)
      and reproduced the same results: s-bend progress 0.1604 with max_error 0.0617,
      slalom progress 0.110 with max_error 0.0676, and oval progress 0.110 with max_error
      0.062. Every track stayed under the 0.069 band, so the Integrator''s keep-speed
      condition holds and the result is repeatable. Earlier evidence points the same
      way. Wheel radius 0.03 to 0.044 m raised progress in shrinking steps (s-bend
      0.149 to 0.155 to 0.158 to 0.1604). Mass 0.5 kg and wheel_track 0.14 m both
      lowered progress. Span, footprint, lead and controller-gain changes left max_error
      essentially unchanged. I considered a further speed step to 0.048 m, but the
      slalom max_error is already 0.0676, so that step would likely cross the 0.069
      band for a small gain. The final track is unseen and may have tighter bends,
      so margin matters more than a small progress gain. I therefore hold the confirmed
      geometry unchanged. The off-track limit is max(0.06, 0.0125 + body_width/4),
      which equals 0.06 for every allowed body width, so body width gives no extra
      margin. Fallback if the final track shows drift is wheel_radius 0.04 m (iteration
      8, max_error 0.0684 on the s-bend), but this is not expected from the repeat.


      - [Open this output](iteration-11/entity0/versions/bb00c016378c4c588e5e0a6947270d08/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-fca81a2f79562b03/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-fa99d7563feb64b8/payload.json)'
  - id: entity1
    label: 'Final package: hold best'
    notes: 'Keeps the confirmed best geometry (wheel_radius 0.044 m) and the controller
      that repeated exactly in iterations 9 and 10 (score 52.14). Adds noise_robustness
      and controller_errors measurements to judge the unseen final track.


      ### Rationale


      Iteration 10 reproduced iteration 9 exactly (score 52.1441), so the design is
      repeatable across the development tracks. Its slalom max_error of 0.0676 is
      the tightest margin, but it is under the 0.069 band. The only change I considered,
      a gain or base_speed change, has no evidence behind it. Gains (kp 2.5 to 3.0,
      ki 0.05 to 0.3, kd 0.05 to 0.1) moved max_error by under 0.007 m in every test,
      and base_speed was never varied. An untested controller change in the final
      iteration could push the slalom past the band without any way to check it. I
      therefore keep the Builder''s geometry (wheel_radius 0.044 m, all else unchanged)
      and the iteration 9 and 10 controller unchanged. The only addition is measurement
      requests for noise_robustness and controller_errors, which are needed to judge
      the unseen final track. Expected result: s-bend progress about 0.160 with max_error
      about 0.062, slalom progress about 0.110 with max_error about 0.068, oval progress
      about 0.110.


      - [Open this output](iteration-11/entity1/versions/063b2d0149854cf6aeafda75435412b6/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/bb00c016378c4c588e5e0a6947270d08/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-fa99d7563feb64b8/payload.json)'
  - id: entityR1
    label: Final geometry feedback
    notes: 'Confirms the 0.044 m geometry and gives a fallback to 0.04 m if slalom
      or s-bend max_error passes 0.069 or noise_robustness is low. Based on iterations
      0 to 10, where speed was the only lever that consistently raised progress without
      raising max_error.


      ### Feedback


      Written before this candidate has raced, so it states no outcome for it. Evidence:
      iterations 9 and 10 (wheel_radius 0.044 m) are the best and repeatable (52.1441),
      with s-bend progress 0.1604 and max_error 0.0617, slalom progress 0.110 and
      max_error 0.0676, and oval progress 0.110 and max_error 0.062. Iteration 8 (0.04
      m) gave a smaller gain with s-bend max_error 0.0684. Iterations 6 and 7 showed
      that mass 0.5 kg and wheel_track 0.14 m lower progress, and iterations 0 to
      4 showed that sensor span, footprint, lead and controller gains barely move
      max_error. So the Integrator has kept the controller unchanged. Interpret the
      race as follows. If the slalom max_error stays at or below 0.069 and progress
      holds, the geometry is confirmed for the final track. If max_error exceeds 0.069
      on any development track, the drift margin is gone, and the fallback is wheel_radius
      0.04 m. If noise_robustness is low, the unseen track may push the robot off
      the line, which also favours the 0.04 m fallback.


      ### Requested changes


      - If every development track keeps max_error at or below 0.069 with progress
      at or above iteration 9 values (s-bend 0.1604, slalom 0.110), keep wheel_radius
      0.044 m, mass 0.6 kg, wheel_track 0.12 m and the sensor layout at x = -0.03
      to 0.03 m, y = 0.04 m. Iterations 9 and 10 give the evidence.

      - If max_error rises above 0.069 on the slalom or s-bend, or noise_robustness
      is low, return wheel_radius to 0.04 m. Iteration 8 gave s-bend max_error 0.0684
      at that value, which is inside the band. Do not return to mass 0.5 kg or wheel_track
      0.14 m, since iterations 6 and 7 lowered progress.

      - Do not change sensor_size or the sensor span. Iterations 0 to 4 showed that
      span, footprint and lead changes leave max_error essentially unchanged, so further
      sensor work is unlikely to help the final track.


      - [Open this output](iteration-11/entityR1/versions/063b2d0149854cf6aeafda75435412b6/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/bb00c016378c4c588e5e0a6947270d08/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-fa99d7563feb64b8/payload.json)'
