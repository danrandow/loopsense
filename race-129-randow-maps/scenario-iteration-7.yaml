map:
  id: race-129-randow-maps
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Wider track 0.14 m, 0.6
    notes: 'Reverts iteration 6''s failed 0.5 kg mass (progress fell, max_error rose)
      to 0.6 kg with wheel_radius 0.035 m, then widens wheel_track to 0.14 m as the
      next test. Rests on iteration 5 (best score 51.01) and iteration 6 (49.76).


      ### Rationale


      Iteration 6 (mass 0.5 kg, wheel_radius 0.035 m) scored 49.76, below iteration
      5 (51.01). Progress fell on the s-bend (0.155 to 0.149) and slalom (0.107 to
      0.103), and max_error rose on the s-bend (0.065 to 0.068). The oval was unchanged
      at progress 0.11 and max_error 0.0616. Lower mass did not help, and the extra
      drift shows the robot is now correcting less well at speed. This matches the
      Integrator''s rule for the case where progress does not rise and max_error grows:
      return mass to 0.6 kg and keep wheel_radius 0.035 m, which is the best-scoring
      state so far. Steering oscillation stayed low (0.07 to 0.15), so the robot drifts
      steadily rather than jittering. Across iterations 0 to 6, span, footprint, lead
      and body/track changes each left max_error almost unchanged. Only the wheel
      radius increase (iteration 5) raised progress without pushing max_error past
      the 0.069 band. The next untested lever is turn-rate-per-PWM through wheel_track.
      Iteration 3 narrowed the track to 0.10 m and lowered s-bend progress, so this
      iteration widens it to 0.14 m, the opposite test. A wider track lowers turn
      rate for the same wheel difference, which may reduce overshoot at speed. I expect
      progress to stay near 0.155 on the s-bend, with max_error at or below 0.069.
      If progress falls again or max_error exceeds 0.069, I will return the track
      to 0.12 m.


      - [Open this output](iteration-7/entity0/versions/0d5f989898464eb4959eb2edd1d3d16e/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-e4a9d46619baf2ca/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-5a1ab86ca62deaca/payload.json)'
  - id: entity1
    label: Wider track 0.14 m
    notes: 'Complete package with wheel_track 0.14 m on the iteration 5 geometry and
      an unchanged controller, so the track effect is isolated. Built on the best-scoring
      state (51.01) with mass 0.6 kg and wheel_radius 0.035 m.


      ### Rationale


      The Builder''s proposal keeps the iteration 5 body, sensor layout, footprint,
      wheel radius and mass (0.6 kg, the best-scoring state at 51.01). It changes
      only wheel_track, from 0.12 to 0.14 m. Turn rate is the wheel-speed difference
      divided by track, so a wider track gives about 14% less turn per unit of PWM
      difference. Earlier evidence says controller gains barely move max_error: kp
      2.5 to 3.0, kd 0.05 to 0.1 and ki 0.05 to 0.3 changed max_error by under 0.007
      m (iterations 0, 1, 4 and 5). I therefore keep the iteration 5 controller unchanged
      (kp 3.0, ki 0.3, kd 0.1, base_speed 1.6, weights [-2,-1,0,1,2], last_direction).
      That keeps the track change as the only variable. I did not raise kp to compensate
      for the lower turn rate, because that would confound the test. If the race shows
      lost turning authority at bends, the next step is a controller change, not a
      geometry change. Expected result: progress holds at or above 0.155 on the s-bend
      and 0.107 on the slalom, with max_error at or below 0.069.


      - [Open this output](iteration-7/entity1/versions/473eba9ca0c84713a80c5fc69b702ed3/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/0d5f989898464eb4959eb2edd1d3d16e/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-5a1ab86ca62deaca/payload.json)'
  - id: entityR1
    label: 'Track test: 0.14 then'
    notes: 'Feedback asks the Builder to widen the track further if progress holds
      and max_error stays at or below 0.069, or to return to 0.12 m and raise wheel_radius
      to 0.04 m if progress falls. Evidence: iteration 3 (narrow track lowered progress)
      and iteration 5 (wheel_radius raised progress), with mass 0.5 kg ruled out by
      iteration 6.


      ### Feedback


      Written before this candidate has raced. The Integrator kept the iteration 5
      controller unchanged, so this result reflects the Builder''s wheel_track change
      alone. Evidence: iteration 5 (wheel_radius 0.035 m, mass 0.6 kg, track 0.12
      m) is the best state so far at 51.01, with s-bend progress 0.155, slalom 0.107
      and max_error 0.061 to 0.066. Iteration 6 (mass 0.5 kg) lowered s-bend progress
      to 0.149 and raised max_error to 0.068, so lower mass is not the lever at this
      speed. Iteration 3 narrowed the track to 0.10 m and lowered s-bend progress
      from 0.15 to 0.13, which suggests too much turn rate per PWM. Widening the track
      to 0.14 m reduces turn rate, so the test is the opposite of iteration 3. Gain
      changes in iterations 0, 1, 4 and 5 left max_error almost unchanged, so the
      controller is not the main limit and I did not compensate for the lower turn
      rate. Interpret the next race as follows. If progress holds at or above 0.155
      on the s-bend and 0.107 on the slalom, and max_error stays at or below 0.069,
      the wider track helps. Try wheel_track 0.16 m next. If progress falls below
      those values, turn rate is not the limit. Return wheel_track to 0.12 m and test
      wheel_radius 0.04 m with mass 0.6 kg, which is the speed step that raised progress
      in iteration 5. If progress holds but max_error rises above 0.069, the robot
      has lost turning authority at bends. Keep the track at 0.14 m and let the Integrator
      raise kp; do not change the geometry again yet.


      ### Requested changes


      - If progress holds at or above 0.155 on the s-bend and 0.107 on the slalom
      with max_error at or below 0.069, try wheel_track 0.16 m with wheel_radius 0.035
      m and mass 0.6 kg. Iteration 3 showed narrowing the track lowered s-bend progress,
      so widening it is the next step in the same direction.

      - If progress falls below 0.155 on the s-bend or 0.107 on the slalom, return
      wheel_track to 0.12 m and set wheel_radius to 0.04 m with mass 0.6 kg. Iteration
      5 showed wheel_radius 0.03 to 0.035 m raised s-bend progress from 0.149 to 0.155
      with max_error held, so speed is the next lever.

      - Keep mass at 0.6 kg in every next step. Iteration 6 showed mass 0.5 kg lowered
      progress (s-bend 0.155 to 0.149) and raised max_error (0.065 to 0.068), so do
      not reduce mass again.


      - [Open this output](iteration-7/entityR1/versions/473eba9ca0c84713a80c5fc69b702ed3/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/0d5f989898464eb4959eb2edd1d3d16e/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-5a1ab86ca62deaca/payload.json)'
