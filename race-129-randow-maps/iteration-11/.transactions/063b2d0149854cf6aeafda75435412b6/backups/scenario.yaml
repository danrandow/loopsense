map:
  id: race-129-randow-maps
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 10 repeated iteration 9''s best geometry (wheel_radius 0.044 m, mass
      0.6 kg, wheel_track 0.12 m, 12 mm sensors at x = -0.03 to 0.03 m, y = 0.04 m)
      and reproduced the same results: s-bend progress 0.1604 with max_error 0.0617,
      slalom progress 0.110 with max_error 0.0676, and oval progress 0.110 with max_error
      0.062. Every track stayed under the 0.069 band, so the Integrator''s keep-speed
      condition holds and the result is repeatable. Earlier evidence points the same
      way. Wheel radius 0.03 to 0.044 m raised progress in shrinking steps (s-bend
      0.149 to 0.155 to 0.158 to 0.1604). Mass 0.5 kg and wheel_track 0.14 m both
      lowered progress. Span, footprint, lead and controller-gain changes left max_error
      essentially unchanged. I considered a further speed step to 0.048 m, but the
      slalom max_error is already 0.0676, so that step would likely cross the 0.069
      band for a small gain. The final track is unseen and may have tighter bends,
      so margin matters more than a small progress gain. I therefore hold the confirmed
      geometry unchanged. The off-track limit is max(0.06, 0.0125 + body_width/4),
      which equals 0.06 for every allowed body width, so body width gives no extra
      margin. Fallback if the final track shows drift is wheel_radius 0.04 m (iteration
      8, max_error 0.0684 on the s-bend), but this is not expected from the repeat.


      - [Open this output](iteration-11/entity0/versions/bb00c016378c4c588e5e0a6947270d08/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-fca81a2f79562b03/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-fa99d7563feb64b8/payload.json)'
  - id: entity1
    label: Repeat best geometry
    notes: 'Keeps iteration 9''s geometry (wheel_radius 0.044 m) and controller exactly,
      to confirm repeatability. Adds noise_robustness for the unseen final track.
      Based on iteration 9 max_error (slalom 0.0676) being close to the 0.069 band.


      ### Rationale


      Iteration 9 (wheel_radius 0.044 m, all else as iteration 8) is the best result
      so far at 52.14. Progress rose on the s-bend (0.158 to 0.1604) and slalom (0.1075
      to 0.110). Max_error was 0.062 (oval), 0.0617 (s-bend) and 0.0676 (slalom),
      all under the 0.069 band, and the slalom is the tightest margin. Every earlier
      test of gains, sensor span, footprint, lead, body, track and mass left max_error
      almost unchanged, and the only lever that consistently raised progress was wheel
      radius. The Builder asks for a repeatability check of this geometry, so I keep
      the controller byte-identical to iteration 9 (kp 3.0, ki 0.3, kd 0.1, base_speed
      1.6, weights [-2,-1,0,1,2], last_direction). Any change in the result is then
      attributable to the geometry and the seed, not to a controller edit. I add noise_robustness
      and controller_errors to the measurements, because the final track is unseen
      and robustness to the fixed motor mismatch and sensor noise now matters more
      than a small progress gain. I expect s-bend progress at or above 0.158, slalom
      at or above 0.110, and max_error at or below 0.069 on every track.


      - [Open this output](iteration-10/entity1/versions/31d0cae234ad48c794c255aa50f5de92/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/a19342d773af42e0a958f36b15ce6f19/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-fa99d7563feb64b8/payload.json)'
  - id: entityR1
    label: Keep 0.044 or fall back
    notes: 'Pre-race feedback: keep wheel_radius 0.044 m if the confirmation race
      holds progress and max_error under 0.069, otherwise fall back to 0.04 m. Rests
      on iterations 8 and 9 and the mass and track results from iterations 6 and 7.


      ### Feedback


      Written before this candidate has raced, so it states no outcome for it. The
      evidence is iteration 9 (wheel_radius 0.044 m): s-bend progress 0.1604, slalom
      0.110, oval 0.11, max_error 0.0617 (s-bend), 0.0676 (slalom) and 0.062 (oval),
      all under the 0.069 band. Iteration 8 (0.04 m) gave a smaller gain with max_error
      0.0684 on the s-bend, so the s-bend margin is narrowing with each speed step.
      Iterations 6 and 7 showed that mass 0.5 kg and wheel_track 0.14 m both lower
      progress, so those stay fixed. Earlier controller gain changes (iterations 0,
      1, 4) barely moved max_error, so I kept the controller unchanged to make this
      a clean repeatability check. Interpret the next race as follows. If progress
      holds at or above 0.158 on the s-bend and 0.110 on the slalom, and max_error
      stays at or below 0.069 on every track, keep wheel_radius 0.044 m as the final
      geometry. If max_error goes above 0.069 on the slalom or s-bend, return to wheel_radius
      0.04 m, which is the iteration 8 best, and leave any remaining gain to the controller.
      If progress holds but noise_robustness is low, the unseen track may push the
      robot off the line, so favour the lower 0.04 m value.


      ### Requested changes


      - If the next race shows s-bend progress at or above 0.158, slalom at or above
      0.110 and max_error at or below 0.069 on every track, keep wheel_radius 0.044
      m and hold mass 0.6 kg, wheel_track 0.12 m and the sensor layout at x = -0.03
      to 0.03 m, y = 0.04 m. Iteration 9 is the evidence for this.

      - If max_error rises above 0.069 on the slalom or s-bend (iteration 9 was 0.0676
      and 0.0617), return wheel_radius to 0.04 m, which gave max_error 0.0684 on the
      s-bend in iteration 8. Do not try mass 0.5 kg or wheel_track 0.14 m again, since
      iterations 6 and 7 lowered progress.

      - Do not change sensor_size or the sensor span. Iterations 0 to 4 showed that
      span, footprint and lead changes leave max_error essentially unchanged, so further
      sensor work is unlikely to help the final track.


      - [Open this output](iteration-10/entityR1/versions/31d0cae234ad48c794c255aa50f5de92/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/a19342d773af42e0a958f36b15ce6f19/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-fa99d7563feb64b8/payload.json)'
