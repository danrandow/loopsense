map:
  id: race-129-randow-maps
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Lighter mass 0.5 kg test
    notes: 'Keeps the iteration 5 wheel radius (0.035 m) and sensor layout, and changes
      only mass from 0.6 to 0.5 kg. Iteration 5 raised s-bend progress to 0.155 with
      max_error under 0.069, which meets the Integrator''s condition for mass as the
      next lever.


      ### Rationale


      Iteration 5 (wheel_radius 0.035 m, sensor_size 0.012 m, body 0.18 x 0.12 m,
      mass 0.6 kg, track 0.12 m) scored 51.01, the best so far. Progress rose on every
      track where it was measured: s-bend 0.155 (from 0.15 in iteration 4), oval 0.11
      and slalom 0.107. Max_error stayed below the 0.069 threshold on all three tracks
      (oval 0.0613, s-bend 0.065, slalom 0.0663), and line loss stayed at one event
      per track. The Integrator''s pre-race rule said that if progress rises above
      0.15 and max_error stays below 0.069, speed is helping, so the next lever is
      mass alone. Across iterations 0 to 4, sensor span, footprint, lead and body/track
      changes each left max_error almost unchanged, so the sensor layout is not the
      constraint. Iteration 3 lowered progress when body and track changed, so I keep
      those at the iteration 5 values. I change only mass, from 0.6 to 0.5 kg, to
      reduce yaw and linear inertia at the higher ground speed. I expect progress
      to rise above 0.155 on the s-bend and slalom, with max_error staying at or below
      about 0.069. If max_error rises above 0.069 while progress also rises, the robot
      is drifting faster than it corrects, and I will return wheel_radius to 0.03
      m as the Integrator advised.


      - [Open this output](iteration-6/entity0/versions/1cd49f099ec846aeb508d53ed938cf2a/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-e20bc8bd18f2f93e/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-139f3f14b9a945c5/payload.json)'
  - id: entity1
    label: Mass 0.5 kg, controller
    notes: 'Complete package for the Builder''s mass 0.6 to 0.5 kg test on the iteration
      5 design. The controller is unchanged from iteration 5, so the race isolates
      mass. Evidence: iteration 5 scored 51.01 with progress and max_error within
      the expected band.


      ### Rationale


      The Builder''s geometry sets mass to 0.5 kg. Every other field matches iteration
      5: sensors at x = -0.03 to 0.03 m and y = 0.04 m, sensor_size 0.012 m, wheel_radius
      0.035 m, wheel_track 0.12 m, body 0.18 x 0.12 m. Iteration 5 scored 51.01, the
      best so far, with progress 0.155 on the s-bend and 0.107 on the slalom and max_error
      at or below 0.0663 on all tracks. Across iterations 0 to 5, controller changes
      (kp 2.5 to 3.0, kd 0.05 to 0.1, ki 0.05 to 0.3) and sensor, lead, body and track
      changes each moved max_error by under about 0.007 m. Iteration 3 showed that
      narrowing the track and shortening the body lowered s-bend progress, so those
      stay fixed. I keep the iteration 5 controller unchanged (kp 3.0, ki 0.3, kd
      0.1, base_speed 1.6, weights [-2,-1,0,1,2], last_direction), so any change in
      progress or max_error is attributable to mass. Mass 0.5 kg is inside the contract
      range of 0.4 to 1.5 kg. Lower mass cuts yaw and linear inertia, so the robot
      may oscillate more. Steering oscillation has been low (0.07 to 0.16), so I do
      not change kp in advance. Expected result: progress rises above 0.155 on the
      s-bend and slalom, and max_error stays at or below about 0.069.


      - [Open this output](iteration-6/entity1/versions/397e738a54634cc18cc850ddd8514ac7/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/1cd49f099ec846aeb508d53ed938cf2a/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-139f3f14b9a945c5/payload.json)'
  - id: entityR1
    label: Next steps after mass
    notes: 'Pre-race feedback: tells the Builder to go to 0.45 kg if progress rises
      with max_error held, back to 0.6 kg if max_error rises, or test wheel_track
      0.14 m if neither moves. Each branch is tied to the iteration 3 and 5 results.


      ### Feedback


      Written before this candidate has raced. Iteration 5 (wheel_radius 0.035 m,
      12 mm sensors, iteration 2 body and track, 0.6 kg) scored 51.01, the best so
      far. Progress was 0.155 on the s-bend, 0.11 on the oval and 0.107 on the slalom,
      with max_error between 0.061 and 0.066. Earlier iterations showed that span
      (iterations 0 to 2), footprint (iteration 4), body/track (iteration 3) and controller
      gains (iterations 0, 1, 4) each left max_error almost unchanged, so the remaining
      lever is speed. Iteration 3 showed that the narrow, short body lowered s-bend
      progress, so body and track stay fixed. Body width cannot raise the off-track
      limit above 0.06 within the allowed range, so I do not suggest changing it.
      Interpret the next race as follows. If progress rises above 0.155 on the s-bend
      and slalom with max_error at or below 0.069, mass helps: keep 0.5 kg and try
      a further reduction. If progress rises but max_error goes above 0.069, the robot
      is drifting faster than it corrects: return mass to 0.6 kg and try a smaller
      wheel-radius step. If progress and max_error are unchanged, mass is not the
      limit, so test wheel_track.


      ### Requested changes


      - If progress rises above 0.155 on the s-bend and slalom with max_error at or
      below 0.069, keep wheel_radius 0.035 m and reduce mass further from 0.5 to 0.45
      kg. Iteration 5 showed speed helps (s-bend progress 0.15 to 0.155 with max_error
      held), so lower inertia is the next lever at that speed.

      - If progress rises but max_error goes above 0.069 on any track, return mass
      to 0.6 kg and keep wheel_radius 0.035 m. Iterations 0 to 5 show max_error sits
      at 0.061 to 0.069, so a rise above that band means speed or lower inertia is
      pushing the robot off the tape.

      - If progress and max_error are unchanged from iteration 5 (s-bend 0.155, slalom
      0.107, max_error 0.061 to 0.066), mass is not the limit. Try wheel_track 0.14
      m with mass 0.5 kg. Iteration 3 narrowed the track to 0.10 m and lowered s-bend
      progress, so widening it is the opposite test.


      - [Open this output](iteration-6/entityR1/versions/397e738a54634cc18cc850ddd8514ac7/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/1cd49f099ec846aeb508d53ed938cf2a/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-139f3f14b9a945c5/payload.json)'
