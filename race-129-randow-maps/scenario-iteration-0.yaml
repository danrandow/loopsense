overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor
    notes: 'First-iteration symmetric baseline: five 12 mm sensors at 10 mm spacing,
      50 mm ahead of the axle, weights proportional to x, 0.12 m track, 0.6 kg. No
      race data yet, so this is a reference geometry chosen on physical reasoning,
      to be tested against the first race and the Integrator''s feedback.


      ### Rationale


      This is iteration 0, so there is no race telemetry or integration feedback yet.
      I am starting from a conservative, symmetric platform that a controller can
      be built on. Five sensors at 10 mm spacing, each 12 mm square, overlap enough
      that the tape (25 mm wide) always covers at least one sensor and the reading
      varies smoothly as the robot drifts. The sensors sit 50 mm ahead of the axle
      so the controller sees the line before the wheels reach it. Sensor x positions
      are proportional to the steering weights ([-2,-1,0,1,2] scaled to x), so the
      sign convention is consistent: a robot drifting left sees the line under the
      right-hand sensors and gets a negative (steer-right) signal. Wheel track 0.12
      m and radius 0.03 m give a moderate turn rate and a top speed that can plausibly
      reach the 1.5 m/s average needed to finish in 3 s. Mass 0.6 kg keeps acceleration
      and braking responsive while still being realistic for the drivetrain. Body
      width 0.12 m gives a comfortable off-track margin (about 0.043 m from the centre
      line). I expect the robot to complete the oval and s-bend, with the slalom being
      the most likely place to show line loss or oscillation. The main unknowns are
      the sensor spacing relative to the tape and whether the mass and wheel size
      limit top speed.


      - [Open this output](iteration-0/entity0/versions/43081de000cd496e88fe88da51e16808/payload.json)'
  - id: entity1
    label: Baseline robot package
    notes: 'Runs the Builder''s five-sensor baseline unchanged with a proportional-weighted
      controller (kp 2.5, small ki/kd, last_direction recovery). It isolates the geometry
      for the first race.


      ### Rationale


      This is iteration 0, so there is no race telemetry yet. The Builder''s baseline
      geometry is valid against the public contract: five sensors at x = -0.02 to
      0.02 m, y = 0.05 m, sensor_size 0.012, wheel_track 0.12, wheel_radius 0.03,
      body_width 0.12, body_length 0.18, mass 0.6. I keep it unchanged so the first
      race tests the geometry itself. The signal is the reading-weighted average of
      the weights, and positive signal steers left. Sensors on the left (positive
      x) therefore get positive weights, and the weights are set proportional to x
      as [-2,-1,0,1,2]. A robot drifting left sees the line under right-hand sensors,
      gets a negative signal, and steers right, which is the correct sign. Each unit
      of signal adds kp*350 PWM of differential, so kp = 2.5 gives about 875 PWM at
      full signal, a moderate authority that avoids saturating on a 2-unit signal.
      ki is small (0.05) to remove steady bias from the motor mismatch without winding
      up. kd is small (0.05) because the sensor overlap is smooth but the 10 ms signal
      derivative can amplify noise. base_speed 1.6 gives base PWM of about 3276 (80%
      of full), which leaves headroom for turn differential at full correction. line_loss
      is ''last_direction'', so the robot keeps turning the way it was going when
      the line is lost, which suits bends better than a fixed search direction. I
      expect the oval and s-bend to finish, with the slalom the most likely place
      to show line loss or oscillation. Observation request covers completion, progress,
      time, rms and max error, line-loss events, oscillation and controller errors
      so the Builder gets full evidence.


      - [Open this output](iteration-0/entity1/versions/358cc62b2df2440ca82cb9efc4579a4b/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/43081de000cd496e88fe88da51e16808/payload.json)'
  - id: entityR1
    label: Baseline integration
    notes: 'No race yet, so feedback rests on the contract and on the controller choices
      made for this geometry. Three conditional changes are given: widen the sensor
      array on line loss, lower mass or raise wheel radius on slow times, and move
      sensors closer to the axle on oscillation.


      ### Feedback


      No race has been run yet, so this feedback rests only on the contract and on
      the choices I had to make to build the controller for this geometry. The five-sensor
      array at 10 mm spacing and 12 mm footprint gives every sensor a non-zero reading
      when the 25 mm tape is under the array, so the signal is continuous. That means
      the controller does not need a large kd to keep the signal smooth (I used kd
      0.05). The sensors sit 50 mm ahead of the axle, and with weights of ±2 at the
      outer sensors the signal saturates at about ±2 units. I used kp 2.5 to keep
      full correction within the PWM range. The Builder should interpret the next
      race this way. If line_loss_events is above zero on the slalom or s-bend while
      max_error stays small, the array is not covering the tape at sharp bends, so
      widen the span (for example x = ±0.02 m is the current edge; try ±0.03 m) before
      changing the wheels. If steering_oscillation is high with max_error low, the
      robot is over-reacting: reduce sensor span or mass, or move the sensors closer
      to the axle so the controller reacts to a shorter lead. If completion_time is
      above 3.0 s with no line loss, the robot is speed-limited: reduce mass or increase
      wheel_radius, since top speed does not come from the controller (base_speed
      is already 1.6 of 2). The Integrator will report which of these conditions held.


      ### Requested changes


      - If the next race shows line_loss_events > 0 with max_error near the 0.06 m
      limit on the slalom or s-bend, widen the sensor array to x = ±0.03 m (weights
      stay proportional to x) and keep sensor_size 0.012.

      - If the next race shows completion_time > 3.0 s with no line loss, reduce mass
      from 0.6 to 0.5 kg or increase wheel_radius from 0.03 to 0.035 m to raise speed.

      - If the next race shows steering_oscillation high while max_error is low, move
      the sensors to y = 0.04 m (less lead) and keep the same x positions, to test
      whether the 50 mm forward offset is too far ahead.


      - [Open this output](iteration-0/entityR1/versions/358cc62b2df2440ca82cb9efc4579a4b/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/43081de000cd496e88fe88da51e16808/payload.json)'
