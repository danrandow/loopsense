map:
  id: race-129-randow-maps
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: 'Speed step: wheel_r 0.04'
    notes: 'Reverts wheel_track to 0.12 m, which held progress best, and raises wheel_radius
      from 0.035 to 0.04 m with mass 0.6 kg. Iteration 7 (track 0.14) lowered s-bend
      progress to 0.145 and iteration 6 (mass 0.5) lowered it too, so speed is the
      only lever left that raised progress in iteration 5.


      ### Rationale


      Iteration 7 (wheel_track 0.14 m, with iteration 5''s other values) scored 48.83,
      below the iteration 5 best of 51.01. Progress fell on the s-bend (0.155 to 0.145)
      and the slalom (0.107 to 0.100), and max_error on the s-bend rose slightly (0.065
      to 0.0647, about flat). Iteration 3 also lowered s-bend progress, but by narrowing
      the track to 0.10 m. Progress therefore dropped in both directions away from
      0.12 m, so 0.12 m is the track the robot is currently tuned to, and turn rate
      is not what limits it. Iteration 6 showed that lowering mass to 0.5 kg also
      lowers progress and raises max_error, so mass stays at 0.6 kg. Speed is the
      only lever that has raised progress without pushing max_error past the 0.069
      band (iteration 5: wheel_radius 0.03 to 0.035 m gave s-bend progress 0.149 to
      0.155). I therefore revert wheel_track to 0.12 m, keep mass 0.6 kg and the iteration
      5 sensor layout (sensor_size 0.012 m, x = -0.03 to 0.03 m, y = 0.04 m), and
      take the next speed step, wheel_radius 0.035 to 0.04 m. The expected result
      is progress above 0.155 on the s-bend and above 0.107 on the slalom, with max_error
      at or below 0.069. If progress does not rise, or max_error goes above 0.069,
      speed has reached its useful limit and the next step is a controller change
      for the Integrator rather than more geometry.


      - [Open this output](iteration-8/entity0/versions/1c2f66b929d5419dae5e2c126e511eae/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-773bf9c0a375bb46/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-65f49fc7cc2f5997/payload.json)'
  - id: entity1
    label: Wheel radius 0.04 m
    notes: 'Complete robot with the Builder''s wheel_radius 0.04 m step on the iteration
      5 package, controller unchanged so only speed changes. Rests on iteration 5
      (51.01) as the best state and on the iteration 6 and 7 losses from mass and
      track changes.


      ### Rationale


      The best race so far is iteration 5 (51.01): wheel_radius 0.035 m, mass 0.6
      kg, wheel_track 0.12 m, sensors at x = -0.03 to 0.03 m with y = 0.04 m, sensor_size
      0.012 m, and the iteration 4 gains (kp 3.0, ki 0.3, kd 0.1). Iteration 5 raised
      s-bend progress from 0.150 to 0.155 with max_error held at 0.065. The two later
      attempts both lowered the score. Mass 0.5 kg (iteration 6) cut s-bend progress
      to 0.149 and raised max_error to 0.068. Track 0.14 m (iteration 7) cut s-bend
      progress to 0.145 and slalom progress to 0.100. Controller gain changes (iterations
      0, 1, 4) left max_error essentially unchanged, and steering_oscillation has
      stayed between 0.07 and 0.16, so there is headroom. The Builder''s intent is
      wheel_radius 0.04 m with everything else as in iteration 5. I take that geometry
      exactly and keep the iteration 5 controller unchanged, so the speed step is
      the only change and any shift in progress or max_error is attributable to it.
      I expect a higher ground speed to help progress only if max_error stays at or
      below about 0.069. Because the wheel is larger, the same PWM gives more ground
      speed, so drift at bends is the risk to watch.


      - [Open this output](iteration-8/entity1/versions/4b71be6c27e648c080901c2e12c437bf/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/1c2f66b929d5419dae5e2c126e511eae/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-65f49fc7cc2f5997/payload.json)'
  - id: entityR1
    label: Speed step feedback
    notes: 'Pre-race feedback: keep mass at 0.6 kg and track at 0.12 m, since iterations
      6 and 7 both lowered progress. Next step depends on whether the wheel_radius
      0.04 m race raises progress with max_error held at or below 0.069.


      ### Feedback


      Written before this candidate has raced. Iteration 5 (wheel_radius 0.035 m,
      mass 0.6 kg, track 0.12 m) is the best state so far at 51.01, with s-bend progress
      0.155, slalom 0.107 and max_error 0.061 to 0.066. Iteration 6 showed that mass
      0.5 kg lowers progress (s-bend 0.155 to 0.149) and raises max_error (0.065 to
      0.068), so mass stays at 0.6 kg. Iteration 7 showed that track 0.14 m lowers
      progress (s-bend 0.145, slalom 0.100), which means 0.12 m is the track the robot
      is tuned to. Iterations 0, 1 and 4 showed that controller gain changes barely
      move max_error, so the controller is not the main limit at this speed. I kept
      the iteration 5 controller unchanged, so the wheel_radius step is tested alone.
      Interpret the next race as follows. If progress rises above 0.155 on the s-bend
      and above 0.107 on the slalom, with max_error at or below 0.069 on every track,
      speed is still helping. Keep wheel_radius 0.04 m and do not change the track
      or mass. If progress is flat, or max_error rises above 0.069, speed has reached
      its useful limit at this controller setting. Return wheel_radius to 0.035 m
      and let the Integrator adjust the controller gains.


      ### Requested changes


      - If progress rises above 0.155 on the s-bend and above 0.107 on the slalom
      with max_error at or below 0.069, keep wheel_radius 0.04 m and hold wheel_track
      at 0.12 m and mass at 0.6 kg. Iteration 5 showed wheel_radius 0.03 to 0.035
      m raised s-bend progress from 0.149 to 0.155 with max_error held, so the speed
      lever is still working.

      - If progress is flat or max_error rises above 0.069 on any track, return wheel_radius
      to 0.035 m, which is the iteration 5 best. Iteration 7 (track 0.14 m) and iteration
      6 (mass 0.5 kg) both lowered progress, so do not try those again.

      - Keep sensor_size 0.012 m and the sensor span at x = -0.03 to 0.03 m and y
      = 0.04 m. Iterations 0 to 4 showed that span, footprint and lead changes leave
      max_error essentially unchanged, so further sensor changes are unlikely to help.


      - [Open this output](iteration-8/entityR1/versions/4b71be6c27e648c080901c2e12c437bf/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/1c2f66b929d5419dae5e2c126e511eae/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-65f49fc7cc2f5997/payload.json)'
