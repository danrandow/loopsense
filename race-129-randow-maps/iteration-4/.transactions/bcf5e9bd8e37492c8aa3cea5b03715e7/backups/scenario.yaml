map:
  id: race-129-randow-maps
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Agile body, narrow track
    notes: 'Keeps the iteration 2 sensors, since span, footprint and lead changes
      moved max_error by under 0.001 m. Reduces mass to 0.5 kg, body length to 0.12
      m and track to 0.10 m to test whether turning authority limits line following.


      ### Rationale


      Iteration 2 (lead moved to y = 0.04 m) scored 50.07, slightly below iteration
      1 (50.13). Line_loss_events stayed at 1 on the oval, s-bend and slalom, and
      max_error stayed at 0.061 to 0.069. Progress is still only 0.10 to 0.15 and
      oscillation is low. Across three iterations, the sensor span (±0.02 to ±0.03
      m), the footprint (12 to 16 mm) and the lead (0.05 to 0.04 m) have each changed
      max_error by less than 0.001 m. The sensor array is therefore not the binding
      limit. The robot is leaving the tape with a steady drift rather than oscillating,
      which suggests the body cannot turn quickly enough for the bends at its current
      speed. Two geometry levers affect turning directly. Yaw inertia is mass*(body_length²+body_width²)/12,
      so a shorter body and lighter mass reduce the inertia the wheels must overcome.
      Turn rate is the wheel-speed difference divided by wheel_track, so a narrower
      track gives more turn rate per unit of PWM difference. This iteration keeps
      the sensor array from iteration 2 exactly, so the score change can be attributed
      to the drivetrain and body. I reduce mass from 0.6 to 0.5 kg, shorten body_length
      from 0.18 to 0.12 m, and narrow wheel_track from 0.12 to 0.10 m. I expect line_loss_events
      to fall below 1 on the bends and max_error to drop below 0.06 on at least the
      s-bend and slalom. The completion_time question stays open until the robot holds
      the line.


      - [Open this output](iteration-3/entity0/versions/bc40344985f0401d8afb7a3b3cdc22d2/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-9706b82904ad5243/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-ca64e515d1c18faa/payload.json)'
  - id: entity1
    label: Narrow track, short body
    notes: 'Keeps the iteration 2 sensor array and controller, and changes mass to
      0.5 kg, body_length to 0.12 m and wheel_track to 0.10 m to test turning authority
      and yaw inertia. Based on iterations 0 to 2, where sensor span, footprint and
      lead changed max_error by under 0.001 m.


      ### Rationale


      Iteration 2 showed that the sensor array is not the binding limit. Moving the
      span, footprint and lead changed max_error by under 0.001 m, and every track
      still ends off-track with one line-loss event and steering_oscillation of only
      0.07 to 0.15. The robot drifts off the tape steadily rather than jittering,
      which points to limited turning authority at its current speed. This geometry
      keeps the iteration 2 sensor array exactly (x = -0.03 to 0.03 m at y = 0.04
      m, 16 mm footprints) and changes the drivetrain and body: mass 0.6 to 0.5 kg,
      body_length 0.18 to 0.12 m, wheel_track 0.12 to 0.10 m. Narrowing the track
      raises turn rate per unit of wheel-speed difference, and the shorter, lighter
      body lowers yaw inertia. Because the change is geometric only, I keep the iteration
      2 controller (base_speed 1.6, kp 3.0, ki 0.05, kd 0.1, weights [-2,-1,0,1,2],
      last_direction) so any score change can be attributed to the geometry. Oscillation
      headroom exists (0.07 to 0.15 observed), so I do not lower kp pre-emptively.
      If the next race shows oscillation above 0.15 with the narrower track, the controller
      should reduce kp, not the geometry. I expect line_loss_events below 1 and max_error
      below 0.06 on the s-bend and slalom. Completion time is not yet testable because
      the robot has not held the line.


      - [Open this output](iteration-3/entity1/versions/e3d41381e74f4a86b3b94c842cbd4fed/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/bc40344985f0401d8afb7a3b3cdc22d2/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-ca64e515d1c18faa/payload.json)'
  - id: entityR1
    label: Turning-limit feedback
    notes: 'Pre-race feedback that the sensor array is not the limit, so the next
      geometry tests turning and speed. Gives three conditional changes (wheel_radius,
      wheel_track, mass) tied to the iteration 0 to 2 line-loss, max_error and oscillation
      values.


      ### Feedback


      Written before this robot has raced. Iterations 0 to 2 show the sensor array
      is not the limit: widening the span from ±0.02 to ±0.03 m, enlarging the footprint
      from 12 to 16 mm and moving the lead from 0.05 to 0.04 m changed max_error by
      under 0.001 m, and every track still ends with one line-loss event and steering_oscillation
      between 0.07 and 0.15. The robot drifts off the tape steadily, so I built this
      package to test turning authority. I kept your iteration 2 sensor array and
      kept the controller unchanged, so any score change comes from mass, body_length
      and wheel_track. Interpret the next race as follows. If line_loss_events falls
      below 1 and max_error drops below 0.06 on the s-bend and slalom (the expected
      result for this geometry), keep the narrow track and move to speed. If the robot
      holds the line but completion_time stays above 3.0 s, the limit is speed, so
      change wheel_radius. If max_error stays at 0.061 to 0.069 with line loss unchanged,
      turning authority is not the limit and I will revisit the footprint and speed.
      If steering_oscillation rises above 0.15, the narrower track has raised turn
      rate too far, and I will fix that in the controller before changing geometry
      again.


      ### Requested changes


      - If the next race holds the line (line_loss_events 0 or 1 with max_error below
      0.06) but completion_time stays above 3.0 s, raise wheel_radius from 0.03 to
      0.035 m. Iterations 0 to 2 show progress stuck at 0.10 to 0.15 with no completions,
      so speed is the next limit once the line is held.

      - If line_loss_events and max_error are still at iteration 2 levels (1 event,
      0.061 to 0.069 m) with steering_oscillation low, narrow wheel_track further
      from 0.10 to 0.09 m. This tests whether turn rate per unit PWM is still limiting,
      since the 0.12 to 0.10 m change alone is not yet shown to be enough.

      - If steering_oscillation rises above the 0.07 to 0.15 range seen in iterations
      0 to 2, keep wheel_track at 0.10 m and reduce mass further to 0.45 kg. Lower
      yaw inertia reduces overshoot from the higher turn rate without giving up turning
      authority.


      - [Open this output](iteration-3/entityR1/versions/e3d41381e74f4a86b3b94c842cbd4fed/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/bc40344985f0401d8afb7a3b3cdc22d2/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-ca64e515d1c18faa/payload.json)'
