map:
  id: race-129-randow-maps
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Hold wheel radius 0.044m
    notes: 'Holds the iteration 9 best geometry (wheel_radius 0.044 m, score 52.14),
      which kept max_error at or below 0.069 on all tracks while raising progress.
      The next speed step would likely push slalom max_error past the band, so the
      geometry is confirmed rather than changed.


      ### Rationale


      Iteration 9 (wheel_radius 0.044 m, all else as iteration 8) is the best result
      so far at 52.14. Progress rose on the s-bend (0.158 to 0.1604) and the slalom
      (0.1075 to 0.110), and max_error fell on the s-bend (0.0684 to 0.0617). The
      slalom max_error rose slightly (0.0634 to 0.0676) but stayed under the 0.069
      band, and the oval was unchanged at progress 0.11 and max_error 0.062. This
      meets the stated keep-speed condition: progress above 0.158 on the s-bend and
      0.1075 on the slalom, with max_error at or below 0.069 on every track. Speed
      is still helping, but returns are shrinking. The 0.04 to 0.044 m step gave about
      +0.0024 progress on the s-bend and +0.0025 on the slalom. The slalom max_error
      is now 0.0676, close to the 0.069 band. A further step to 0.048 m would probably
      push the slalom past that band for a small gain, and an unseen final track may
      have tighter bends. I therefore hold wheel_radius at 0.044 m and keep mass 0.6
      kg, wheel_track 0.12 m and the 12 mm sensor layout at x = -0.03 to 0.03 m, y
      = 0.04 m. Iterations 0 to 8 showed that sensor, body, track and mass changes
      do not help, so this iteration confirms the best geometry and leaves the remaining
      gains to the controller. I added noise_robustness to the measurements because
      the final track is unseen and robustness to the fixed motor mismatch and sensor
      noise now matters more than small progress gains.


      - [Open this output](iteration-10/entity0/versions/a19342d773af42e0a958f36b15ce6f19/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-59c91fdb397346ae/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-fa99d7563feb64b8/payload.json)'
  - id: entity1
    label: Wheel radius 0.044 m step
    notes: 'Takes the iteration 8 best state and makes one bounded speed step (wheel_radius
      0.04 to 0.044 m), with the controller unchanged so the step is isolated. Based
      on iteration 5 and 8 progress gains and the s-bend max_error of 0.0684 near
      the 0.069 band.


      ### Rationale


      Iteration 8 (wheel_radius 0.04 m, all else as iteration 5) is the best state
      so far at 51.13. Progress rose on the s-bend (0.155 to 0.158) and slalom (0.1066
      to 0.1075) with max_error held: oval 0.0608, s-bend 0.0684, slalom 0.0634. Iteration
      5 showed the same pattern for the 0.030 to 0.035 m step, and iterations 6 and
      7 showed that mass 0.5 kg and track 0.14 m both lower progress. Speed (wheel_radius)
      is therefore the only geometry lever still helping. The s-bend max_error of
      0.0684 is close to the 0.069 band, so this step is the last safe one to test.
      The Builder''s geometry is taken exactly: wheel_radius 0.044 m, mass 0.6 kg,
      wheel_track 0.12 m, body 0.18 x 0.12 m, five sensors at x = -0.03 to 0.03 m,
      y = 0.04 m, sensor_size 0.012 m. The contract allows wheel_radius up to 0.05
      m, so the value is valid. The controller is kept exactly as in iterations 5
      and 8 (kp 3.0, ki 0.3, kd 0.1, base_speed 1.6, weights [-2,-1,0,1,2], last_direction).
      Gains have moved max_error by under 0.007 m in every earlier test, and the Integrator
      has not seen evidence that a gain change is needed. Changing the gains now would
      confound the speed test. The risk to watch is that the higher ground speed pushes
      the s-bend past 0.069, which would show as max_error rising above 0.0684 while
      progress rises. If that happens, the Builder''s fallback is wheel_radius 0.04
      m.


      - [Open this output](iteration-9/entity1/versions/48a1b4b0b621461895328469df777a20/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/9cff3a587ccb49bfb8c4daedd3059369/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-190f0fd45d2cedf9/payload.json)'
  - id: entityR1
    label: Keep speed step or revert
    notes: 'Pre-race feedback: keep 0.044 m if s-bend progress rises and max_error
      stays at or below 0.069, otherwise revert to 0.04 m. Evidence comes from iterations
      5, 6, 7 and 8, which show that speed helped while mass and track changes did
      not.


      ### Feedback


      Written before this candidate has raced, so it states no outcome for it. Evidence
      from earlier races: iteration 8 (wheel_radius 0.04 m) gave the best score so
      far, 51.13, with s-bend progress 0.158, slalom 0.1075 and max_error 0.0608 to
      0.0684. Iteration 5 (wheel_radius 0.035 m) raised s-bend progress from 0.150
      to 0.155 with max_error held. Iteration 6 (mass 0.5 kg) and iteration 7 (wheel_track
      0.14 m) both lowered progress, so mass 0.6 kg and track 0.12 m stay fixed. Controller
      gain changes (iterations 0, 1, 4) left max_error almost unchanged, so the Integrator
      has kept the iteration 8 controller unchanged to isolate the speed step. Interpret
      the next race as follows. If progress rises above 0.158 on the s-bend and above
      0.1075 on the slalom, with max_error at or below 0.069 on every track, speed
      is still helping; keep wheel_radius 0.044 m. If progress is flat, or max_error
      rises above 0.069 on any track, speed has reached its useful limit at this controller
      setting; return wheel_radius to 0.04 m, the iteration 8 best, and stop changing
      geometry. The Integrator will report the progress and max_error at which the
      robot leaves the track.


      ### Requested changes


      - If the next race shows s-bend progress above 0.158 and slalom above 0.1075
      with max_error at or below 0.069 on every track, keep wheel_radius 0.044 m and
      hold mass 0.6 kg and wheel_track 0.12 m. Iteration 8 showed a 0.005 m speed
      step raised s-bend progress from 0.155 to 0.158 with max_error held.

      - If progress is flat, or max_error rises above 0.069 on the s-bend (iteration
      8 was already at 0.0684), return wheel_radius to 0.04 m, the iteration 8 best.
      Do not try mass 0.5 kg or wheel_track 0.14 m again; iterations 6 and 7 showed
      both lower progress.

      - Keep sensor_size 0.012 m and the sensor layout at x = -0.03 to 0.03 m, y =
      0.04 m. Iterations 0 to 4 showed that span, footprint and lead changes leave
      max_error essentially unchanged, so further sensor changes are unlikely to help.


      - [Open this output](iteration-9/entityR1/versions/48a1b4b0b621461895328469df777a20/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/9cff3a587ccb49bfb8c4daedd3059369/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-190f0fd45d2cedf9/payload.json)'
