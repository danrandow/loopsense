  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Iter 6 design
    notes: 'Resubmits the iteration 6 design unchanged (mass 0.4, sensors at y=0.06,
      kp 4, kd 1.0), the best measured candidate at 937.1 with 60/60 finishes. Later
      single-variable changes to kd and the sensor lead all scored lower, so no change
      is made.


      ### Rationale


      Evidence: iteration 6 (score 937.1, best so far) is the only design where every
      development track finished 20/20: oval 944.7, s-bend 940.9, slalom 925.7 with
      0.65 line-loss events. The later single-variable tests all scored lower. Iteration
      7 (y=0.07, kd 1.1) scored 930.9 and iteration 8 (kd 0.9) scored 865.3, with
      slalom falling to 13/20. Iteration 9 (kd 1.1 at y=0.06) scored 925.9, with slalom
      line loss and max_error both slightly worse than iteration 6. So kd 1.0 at y=0.06
      is the local optimum I have measured. Iteration 4 showed that kp 6 collapses
      the oval and s-bend, and mass is already at its 0.40 kg floor. Body width cannot
      widen the off-track limit because the 0.06 m floor binds. Changes: none. I resubmit
      the iteration 6 design unchanged, because it is the most robust candidate on
      the three development tracks and the final track is unseen, so robustness matters
      more than a small gain. Expected result: about 937 on the development tracks,
      with 60/60 finishes. Hypotheses for later: (a) a modest base_speed increase
      (1.5 to about 1.6) would cut slalom time (2.92 s) and time is worth about 20
      points per second, but it risks more slalom off-track exits; (b) line-loss events
      remain the largest recoverable term at about 15 points per event on slalom.
      Measurements wanted: per-track completion, max_error, line_loss_events, completion_time
      and steering_oscillation on all three tracks, to confirm the baseline is reproduced.


      - [Open this output](iteration-10/entity0/versions/4e51b2ff3f83425198c2d05302da9d2b/payload.json)

      - Based on: [entityR2A](iteration-10/entityR2A/versions/carried-68530d9a57c43eea/payload.json)'
  - id: entityR1
    label: Approve iter-6 best
    notes: 'Approves the unchanged iteration 6 design, the best raced so far (937.1,
      60/60 finishes), because its neighbours (kd 0.9, kd 1.1, y 0.07) scored lower.
      Evidence is iterations 6 to 9; the next revision would test base_speed for slalom
      finish time.


      ### Feedback


      Written before this candidate has raced. The candidate is the iteration 6 design:
      five 16 mm sensors at x = -0.03 to +0.03 m, y = 0.06 m, weights [-2,-1,0,1,2],
      kp 4.0, ki 0.05, kd 1.0, base_speed 1.5, mass 0.40 kg, last_direction line loss.
      Iteration 6 scored 937.1, the best raced so far, with 60/60 finishes (oval 944.7,
      s-bend 940.9, slalom 925.7 with 0.65 line-loss events). No change is proposed
      to the geometry or gains, so the candidate is at least as good as the best raced
      design. The nearby tests did not beat it: iteration 8 (kd 0.9) fell to 865.3
      with slalom at 13/20, iteration 7 (y 0.07, kd 1.1) scored 930.9, and iteration
      9 (kd 1.1 at y 0.06) scored 925.9. Iteration 9 cut slalom line-loss events to
      about 0.4 but raised oval line-loss events to 0.9 and slightly worsened slalom
      max_error and steering_oscillation, so it is a near-tie rather than an improvement.
      Kp stays at 4.0, since iteration 4 (kp 6) collapsed the oval and s-bend and
      iteration 2 (kp 4.5) lost completions. Mass is at its 0.40 kg floor, and the
      0.06 m off-track floor binds, so body_width cannot widen the limit. Approving
      now is right: further revision would cost two action runs for a small expected
      gain, and a race of this design gives the reference numbers for the final iteration.
      Plan the next revision from the race telemetry. If the race reproduces about
      937 with 60/60 finishes, the remaining lever is speed. Slalom mean finish is
      about 2.92 s against the 3.0 s limit, and each second is worth about 20 points,
      so test base_speed in small steps. If slalom completion drops or max_error rises
      above 0.021, revert to the same design (this is the fallback). Do not change
      kp.


      ### Requested changes


      - If the race reproduces about 937 with 60/60 finishes and slalom completion_time
      stays near 2.9 s, set controller.base_speed to 1.55 with all other fields unchanged.
      Basis: iteration 6 slalom mean finish was 2.92 s, and iteration 0 showed the
      oval finishing near 1.9 s at base_speed 1.6, so there is time margin to gain.

      - If base_speed 1.55 or any speed increase causes any slalom off-track exit,
      or raises slalom line_loss_events above 0.65, keep base_speed at 1.5 and submit
      this iteration 6 design as the final candidate. Basis: iteration 6 is the best
      measured design, and slalom line loss costs about 15 points per event.

      - Do not raise controller.kp above 4.0 or change geometry.mass below 0.40. Basis:
      iteration 4 (kp 6.0) collapsed oval and s-bend to 9/20 and 0/20, iteration 2
      (kp 4.5) lost completions, and mass is already at its contract floor of 0.40
      kg.


      - [Open this output](iteration-10/entityR1/versions/afcd3e041fc54ff39879ef0f26766e12/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/4e51b2ff3f83425198c2d05302da9d2b/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-68530d9a57c43eea/payload.json)'
