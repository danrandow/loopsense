  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Iter 6 design
    notes: 'Resubmits the iteration 6 design unchanged (mass 0.4, sensors at y=0.06,
      kp 4, kd 1.0), the best measured candidate at 937.1 with 60/60 finishes. Later
      single-variable changes to kd and the sensor lead all scored lower, so no change
      is made.


      ### Rationale


      Evidence: iteration 6 (score 937.1, best so far) is the only design where every
      development track finished 20/20: oval 944.7, s-bend 940.9, slalom 925.7 with
      0.65 line-loss events. The later single-variable tests all scored lower. Iteration
      7 (y=0.07, kd 1.1) scored 930.9 and iteration 8 (kd 0.9) scored 865.3, with
      slalom falling to 13/20. Iteration 9 (kd 1.1 at y=0.06) scored 925.9, with slalom
      line loss and max_error both slightly worse than iteration 6. So kd 1.0 at y=0.06
      is the local optimum I have measured. Iteration 4 showed that kp 6 collapses
      the oval and s-bend, and mass is already at its 0.40 kg floor. Body width cannot
      widen the off-track limit because the 0.06 m floor binds. Changes: none. I resubmit
      the iteration 6 design unchanged, because it is the most robust candidate on
      the three development tracks and the final track is unseen, so robustness matters
      more than a small gain. Expected result: about 937 on the development tracks,
      with 60/60 finishes. Hypotheses for later: (a) a modest base_speed increase
      (1.5 to about 1.6) would cut slalom time (2.92 s) and time is worth about 20
      points per second, but it risks more slalom off-track exits; (b) line-loss events
      remain the largest recoverable term at about 15 points per event on slalom.
      Measurements wanted: per-track completion, max_error, line_loss_events, completion_time
      and steering_oscillation on all three tracks, to confirm the baseline is reproduced.


      - [Open this output](iteration-10/entity0/versions/4e51b2ff3f83425198c2d05302da9d2b/payload.json)

      - Based on: [entityR2A](iteration-10/entityR2A/versions/carried-68530d9a57c43eea/payload.json)'
  - id: entityR1
    label: Approve kd 1.1 at y=0.06
    notes: 'Approves a single-variable test of kd 1.1 on the best raced design (iteration
      6, score 937.1), since iteration 8 showed kd 0.9 cost slalom finishes (865.3).
      Fallbacks are kd 1.0 or 1.2, depending on the slalom line-loss result.


      ### Feedback


      Written before this candidate has raced. It is the iteration 6 design (score
      937.1, the best raced so far: oval 20/20, s-bend 20/20, slalom 20/20) with one
      change, kd from 1.0 to 1.1 at the same sensor lead y=0.06. Everything else is
      unchanged: five 16 mm sensors at x=-0.03 to +0.03 m, weights [-2,-1,0,1,2],
      kp 4.0, ki 0.05, base_speed 1.5, mass 0.40, last_direction line loss. All values
      are inside their contract ranges.


      The damping evidence runs in one direction so far. Iteration 8 lowered kd to
      0.9 at y=0.06 and fell to 865.3, with slalom dropping to 13/20 finishes, 5 off-track
      exits and 2 timeouts. That makes kd 0.9 clearly worse than kd 1.0. Iteration
      7 raised kd to 1.1 but also moved the lead to y=0.07, so it is confounded: 930.9,
      with slalom line-loss events up from 0.65 to 0.95. The candidate tests kd 1.1
      alone at the known-good lead, which is the one clean test of the upward direction.
      Because the bar is at least as good as the best raced design, and this is a
      single-variable step from it, approval is justified. The race will show whether
      1.1 improves on 1.0 or whether 1.0 is the peak.


      Plan the revision from the race telemetry. If slalom line_loss_events or max_error
      get worse than iteration 6 (0.65 and 0.021), or steering_oscillation rises above
      about 0.35, the damping optimum is at or near kd 1.0: return kd to 1.0 and do
      not go further. If slalom line_loss_events fall below 0.65 with 100% completion
      on all tracks, the upward direction is working, and kd 1.2 is the next step.
      Do not change kp: iteration 4 (kp 6) collapsed the oval and s-bend, and iteration
      2 (kp 4.5) lost completions. Mass is already at its 0.40 floor.


      ### Requested changes


      - If slalom line_loss_events rise above 0.65 or max_error rises above 0.021
      (the iteration 6 values), or steering_oscillation exceeds about 0.35, return
      controller.kd to 1.0 with sensor y at 0.06. Basis: iteration 6 (kd 1.0) is the
      best measured design, and iteration 8 (kd 0.9) showed that moving kd away from
      1.0 in the lower direction costs slalom finishes.

      - If slalom line_loss_events fall below 0.65 with all tracks at 100% completion
      and steering_oscillation at or below 0.35, test controller.kd at 1.2 with the
      same lead of 0.06. Basis: iteration 7 at kd 1.1 suggests more damping is not
      harmful when the lead is held, so one more upward step is worth one run.

      - Do not raise controller.kp above 4.0. Basis: iteration 4 (kp 6.0 with a seven-sensor
      array) fell to 342.7 with oval and s-bend losses, and iteration 2 (kp 4.5) lost
      completions on oval and s-bend.


      - [Open this output](iteration-9/entityR1/versions/75e82489d6694e24b2c2426df685b1d2/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/de11a0e491bd4dbe9889604fbce534b1/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-3b17f48ae54ee553/payload.json)'
