  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: 7-sensor wide array
    notes: 'Extends the array to 7 sensors at ±0.045 m with weights rescaled and kp
      raised to 6.0 to hold gain. Aimed at cutting slalom line loss (1.25 per run)
      and the 0% slalom finish, while keeping the 100% oval finish from iteration
      3.


      ### Rationale


      Evidence: iteration 3 (685.6, best so far) keeps oval at 100% finish and s-bend
      at 85%. Slalom still never finishes (0/20, progress 0.585, max_error 0.065,
      1.25 line-loss events), and every slalom run leaves the track. Iteration 1 showed
      that widening the sensor array was the change that most improved slalom progress
      (0.12 to 0.39), and line-loss events fell as coverage grew. Body width cannot
      widen the off-track limit, because the 0.06 m floor binds across the whole body
      range. Iteration 2 showed that raising kp to 4.5 hurt the oval and s-bend, so
      I keep kp near 4.0 in effect.


      Changes: (1) Extend the array from 5 to 7 sensors at x = -0.045 to +0.045 m
      in 15 mm steps. This keeps the tape visible at lateral errors near 0.05 m, which
      is the slalom excursion range, and should cut line-loss events. (2) Rescale
      the weights to x/0.0225, giving [-2, -1.33, -0.67, 0, 0.67, 1.33, 2]. The outer
      sensors therefore still reach the ±2 limit. (3) Raise kp to 6.0 so the inner-sensor
      steering gain stays at about the iteration 3 level (4.0 x 1.5 x 0.667 = 4.0).
      Outer-sensor gain rises modestly, which should help recovery from larger excursions.
      Mass 0.6, kd 1.0, base_speed 1.5, sensor size 16 mm, line_loss last_direction
      and the y position of 0.05 m are kept unchanged, so the effect of the array
      change is isolated as far as possible.


      Expected result: slalom line-loss events fall below 0.5, slalom progress rises
      above 0.6, and some slalom runs finish. Oval completion should hold at 100%.
      Hypotheses: (a) the wider 7-sensor array reduces line loss on slalom; (b) the
      matched kp keeps s-bend and oval behaviour close to iteration 3; (c) steering_oscillation
      stays at or below 0.35. Measurements wanted: per-track completion, max_error
      and line_loss_events on slalom, and steering_oscillation on all tracks.


      - [Open this output](iteration-4/entity0/versions/8dc61acbd50040fcbd635f406bebda47/payload.json)

      - Based on: [entityR2A](iteration-4/entityR2A/versions/carried-cbcbbf86af56d02f/payload.json)'
  - id: entityR1
    label: 'Approve: revert kp, kd'
    notes: 'Approved the candidate that returns kp to 4.0 and base_speed to 1.5 (the
      best raced design, 574) and adds kd 1.0 and mass 0.6 kg. Iteration 2 showed
      kp 4.5 hurt completion and raised oscillation, so this is a low-risk, single-variable
      test from the best known point.


      ### Feedback


      Written before this candidate has raced. It reverts kp to 4.0 and base_speed
      to 1.5, the iteration 1 values that scored 574, the best so far. Iteration 2
      (kp 4.5, base 1.4, score 477) lost oval and s-bend completion, and its steering_oscillation
      rose to 0.34 to 0.39, so the kp increase is the likely cause. The candidate
      keeps the iteration 1 sensor array (x = -0.03 to +0.03 m, 16 mm footprints)
      and line_loss last_direction. It adds two changes: kd 0.8 to 1.0, to damp the
      slalom overshoot and oscillation, and mass 0.8 to 0.6 kg, to reduce yaw inertia
      for the sharp slalom bends. Both are small single-variable moves from the best
      measured design, so the race will isolate their effect. Note that mass and kd
      are changed together, so if the result moves, the telemetry may not show which
      one caused it. Plan the next revision from the race as follows. If the slalom
      still ends off track with max_error above 0.06 and line_loss_events are not
      falling, try a larger kd step (to 1.2) before touching kp. If oval or s-bend
      completion drops below the iteration 1 rates (0.8 and 0.65), or steering_oscillation
      rises above about 0.35, return kd to 0.8 and keep the mass change. If the mass
      change looks harmful, return mass to 0.8 and keep kd. Approving now is right
      for this mid-run exploration iteration: the candidate is valid, close to the
      best design, and each change is tied to a measured failure.


      ### Requested changes


      - If slalom still ends off track with max_error above 0.06 and line_loss_events
      do not fall, raise controller.kd from 1.0 to about 1.2 before changing kp. Basis:
      iteration 1 slalom max_error was 0.0635 and steering_oscillation was 0.257,
      so damping is the next untested lever.

      - If oval or s-bend completion falls below the iteration 1 rates (0.8 and 0.65),
      or steering_oscillation rises above about 0.35, return controller.kd to 0.8
      and keep geometry.mass at 0.6. Basis: iteration 2 showed steering_oscillation
      of 0.34 to 0.39 and lost completions when the controller was pushed harder.

      - If the mass change looks harmful, return geometry.mass to 0.8 and keep kd
      at 1.0. Basis: mass and kd are changed together here, so a regression should
      be isolated before the next change.


      - [Open this output](iteration-3/entityR1/versions/2dd65f2289b4490da67b99011c59d78d/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/f2b002ea31f34e9d9f3d8244d92e11ad/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-943e6614391f6bde/payload.json)'
