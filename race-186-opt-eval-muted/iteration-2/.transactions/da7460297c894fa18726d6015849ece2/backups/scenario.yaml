overrides:
  entities:
  - id: entity0
    label: Stiffer steer, slower
    notes: 'Raised kp from 4.0 to 4.5 and lowered base_speed from 1.5 to 1.4 to cut
      slalom off-track exits (max_error about 0.064, above the 0.06 limit) while keeping
      s-bend finish times under 3 s. Based on the iteration 1 race, where the slalom
      finished 0% and the s-bend 65%.


      ### Rationale


      Evidence from iteration 1 (score 574, the best so far): the oval finishes 80%
      of runs and the s-bend 65%, but the slalom never finishes (0%, mean progress
      0.39, every run ends off track). Slalom max_error is about 0.064, above the
      0.06 m off-track limit, with about 1.1 line-loss events per run. Body width
      cannot widen the limit: max(0.06, 0.0125 + body_width/4) is floored at 0.06
      across the whole body range, so the fix has to come from tighter tracking. Steering
      oscillation (0.26 to 0.35) is already moderate, and kd went from 0.4 to 0.8
      in iteration 1, which did not visibly add jitter.


      Changes: (1) Raise kp from 4.0 to 4.5 to correct lateral error faster on the
      sharp slalom bends. The sensor array and kd are kept, since the sensor change
      was not isolated and kd 0.8 appears to be stable. (2) Lower base_speed from
      1.5 to 1.4 to reduce lateral slip and sensor lag at the bends. Mean finish time
      on the s-bend was 2.45 s at 1.5, so this should give about 2.6 s, still inside
      the 3 s limit. Oval times (about 2.1 s) also stay within it.


      Expected result: slalom progress rises above 0.39 and fewer off-track exits
      occur, s-bend completion improves, and oval completion holds. Hypotheses to
      test: (a) the extra kp reduces slalom max_error below 0.06; (b) the 1.4 base
      speed keeps finish times under 3 s on the s-bend; (c) steering_oscillation stays
      near or below 0.35 with kp 4.5.


      - [Open this output](iteration-2/entity0/versions/5664d3652d074512b1d14fe2febbae9d/payload.json)

      - Based on: [entityR2A](iteration-2/entityR2A/versions/carried-33857f7110f0ac70/payload.json)'
  - id: entityR1
    label: 'Approve: kp 4.5, speed'
    notes: 'Approved the small change from the best raced design (574): kp raised
      4.0 to 4.5 to address slalom max_error 0.0635 above the 0.06 limit, and base_speed
      lowered 1.5 to 1.4 to reduce slip. Evidence is iteration 1''s per-track metrics
      and s-bend finish times; no outcome is claimed for this candidate.


      ### Feedback


      Written before this candidate has raced. The candidate keeps the iteration 1
      geometry (sensor x = -0.03 to +0.03 m at 15 mm steps, 16 mm footprints, kd 0.8)
      and changes two controller values. kp rises from 4.0 to 4.5, based on iteration
      1, where the slalom ended off track with max_error 0.0635 against the 0.06 m
      limit and 1.1 line-loss events per run. base_speed falls from 1.5 to 1.4, to
      reduce slip and sensor lag on the bends. Iteration 1''s s-bend mean finish time
      was 2.45 s at 1.5, so 1.4 should still leave room under the 3 s limit. The change
      is small and each change is tied to a measured failure, so it is a sound next
      test. Note that the sensor array change from iteration 1 has still not been
      isolated from the gain changes. Plan the next revision from the race telemetry
      as follows. If slalom max_error is still above 0.06 while line_loss_events fall,
      raise kp in steps of about 0.5 (to 5.0) before touching kd. If steering_oscillation
      rises above about 0.35 with kp 4.5, hold kp and raise kd in steps of 0.2 instead.
      If the oval or s-bend no longer completes, or completion_time on the s-bend
      exceeds about 2.8 s, return base_speed to 1.5 and keep the gain change. Approving
      now is right for this iteration: the change is valid, specific and tied to the
      failing track, and the race will show whether the bend-tracking problem is solved.


      ### Requested changes


      - If slalom max_error stays above 0.06 m while line_loss_events drop, raise
      controller.kp in steps of about 0.5 (to 5.0) before changing kd. Basis: iteration
      1 slalom max_error was 0.0635 at kp 4.0, and the 4.5 step is only a partial
      move.

      - If steering_oscillation rises above about 0.35 with kp 4.5, keep kp and raise
      controller.kd by 0.2 (to 1.0). Basis: iteration 1 measured steering_oscillation
      of 0.257 on the slalom and 0.352 on the s-bend at kd 0.8, so the s-bend is already
      close to that ceiling.

      - If the oval or s-bend stops completing, or s-bend completion_time exceeds
      about 2.8 s, return controller.base_speed to 1.5 and keep kp 4.5. Basis: iteration
      1 s-bend mean finish time was 2.45 s at base_speed 1.5, and the 3 s limit is
      the constraint.


      - [Open this output](iteration-2/entityR1/versions/18c887d6464b43cf8105f8fc6a8a39a9/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/5664d3652d074512b1d14fe2febbae9d/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-33857f7110f0ac70/payload.json)'
