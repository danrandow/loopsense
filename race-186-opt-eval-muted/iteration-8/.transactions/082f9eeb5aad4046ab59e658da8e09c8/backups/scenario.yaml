map:
  id: race-186-opt-eval-muted
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: kd 0.9 at lead y=0.06
    notes: 'Reverts the sensor lead to y=0.06 (iteration 6, score 937.1) after iteration
      7''s y=0.07 lead lowered the score to 931. Tests kd 0.9 as a single-variable
      change; iteration 6 with kd 1.0 is the fallback.


      ### Rationale


      Evidence. Iteration 6 (score 937.1, best so far) finished 60/60 across oval,
      s-bend and slalom, with slalom at 20/20 finishes, up from 11/20 at iteration
      5. Iteration 7 moved the sensor lead from y=0.06 to y=0.07 and raised kd from
      1.0 to 1.1 together. Its score fell to 930.9. On slalom, line-loss events rose
      from 0.65 to 0.95, max_error from 0.021 to 0.026, and steering_oscillation from
      0.33 to 0.34. Those changes were confounded, but the net effect was negative,
      so the 0.07 lead is rejected. Mass is already at its 0.40 kg floor, kp 6 collapsed
      the oval and s-bend in iteration 4, and body_width cannot change the off-track
      limit because the 0.06 m floor binds.


      Change. I revert the sensor lead to y=0.06, which is the iteration 6 geometry.
      I lower kd from 1.0 to 0.9, a single-variable test of the damping direction
      at the known-good lead. Everything else is the iteration 6 design: five 16 mm
      sensors at x = -0.03 to +0.03 m in 15 mm steps, weights [-2,-1,0,1,2], kp 4.0,
      ki 0.05, base_speed 1.5, line_loss last_direction.


      Expected result. Oval and s-bend stay at 100% completion. Slalom line-loss events
      should stay near 0.65 or fall slightly. Steering_oscillation should stay at
      or below about 0.33. If slalom max_error or oscillation worsens, or if completion
      drops, the fallback is the exact iteration 6 design with kd 1.0, which is already
      known to score 937.1.


      Hypotheses. (a) kd 0.9 does not add jitter at lead y=0.06, because the iteration
      7 oscillation rise was probably caused by the larger lead. (b) Slightly less
      derivative damping reduces the extra lag that causes slalom line loss. (c) Completion
      stays at 100% on all three development tracks.


      Measurements wanted. Per-track completion, max_error, line_loss_events and completion_time
      on slalom, plus steering_oscillation on all tracks. These will show whether
      kd is the driver of any change in slalom line loss.


      - [Open this output](iteration-8/entity0/versions/4abb09444c82407289a32a6894575ed0/payload.json)

      - Based on: [entityR2A](iteration-8/entityR2A/versions/carried-a5c1bfac9259e3a4/payload.json)'
  - id: entityR1
    label: 'Approve: kd 0.9 test'
    notes: 'Approved the iteration 8 candidate, the iteration 6 best design with kd
      lowered from 1.0 to 0.9 at sensor lead y=0.06. Iteration 7 raised kd and moved
      the lead together and scored lower (930.9 vs 937.1), so this single-variable
      test of less damping is a valid, low-risk next step.


      ### Feedback


      Written before this candidate has raced. It is the iteration 6 design (score
      937.1, the best raced so far, oval 20/20, s-bend 20/20, slalom 20/20) with one
      change: kd goes from 1.0 to 0.9 at the iteration 6 sensor lead of y = 0.06.
      Iteration 7 raised kd to 1.1 and moved the lead to y = 0.07 together, and the
      score fell to 930.9 with slalom line-loss events up from 0.65 to 0.95. That
      result was confounded, but it does not support more derivative damping or a
      larger lead. Sensor x positions, the 16 mm footprints, weights [-2,-1,0,1,2],
      kp 4.0, ki 0.05, base_speed 1.5, mass 0.40 and last_direction line loss are
      unchanged, and the values are inside their contract ranges. Kp stays at 4.0
      because iteration 4 (kp 6) collapsed the oval and s-bend and iteration 2 (kp
      4.5) also lost completions. Mass is at its 0.40 floor. Approval is right here:
      the candidate is valid, is a single-variable move from the best raced design,
      and the race will show whether less damping helps slalom. Plan the next revision
      from the race telemetry. If oval or s-bend completion drops below 100%, or slalom
      max_error rises above the iteration 6 value of 0.021, kd 0.9 is too little damping
      at this lead: return kd to 1.0, which is the iteration 6 design. If slalom line_loss_events
      fall below 0.65 with completion held at 100% on all tracks, test kd 0.8 next.
      If the result is neutral, keep kd at 0.9 or 1.0, since the remaining gains are
      small and a late-iteration move is not worth the runs.


      ### Requested changes


      - If oval or s-bend completion falls below 100%, or slalom max_error rises above
      0.021, set controller.kd back to 1.0 with geometry.sensor_positions y at 0.06.
      Basis: iteration 6 (kd 1.0, y 0.06) kept all three tracks at 20/20 with max_error
      0.021 on slalom, and iteration 7''s rise in line-loss events came from the combined
      kd 1.1 and lead 0.07 change.

      - If slalom line_loss_events fall below 0.65 with all tracks at 100% completion
      and steering_oscillation at or below 0.35, test controller.kd at 0.8 with the
      same lead of 0.06. Basis: iteration 7 suggests more damping did not help, so
      the damping direction is worth one more step down.

      - If slalom finishes but completion_time stays near 2.9 s, raise controller.base_speed
      to 1.6 while holding the gains. Basis: iteration 6 slalom mean finish was 2.92
      s against the 3.0 s limit, and iteration 0 showed the oval finishing near 1.9
      s at base_speed 1.6.


      - [Open this output](iteration-8/entityR1/versions/6ce098aae4cd4a9da2393061aea64a60/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/4abb09444c82407289a32a6894575ed0/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-a5c1bfac9259e3a4/payload.json)'
