map:
  id: race-186-opt-eval-muted
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Sensor lead y=0.07, kd1.1
    notes: 'Extends the iteration 6 sensor lead from y=0.06 to 0.07 m and raises kd
      from 1.0 to 1.1, targeting the remaining slalom line-loss events and rms error.
      Based on the 937-point iteration 6 result, where oval and s-bend finished 20/20
      and slalom finished 20/20.


      ### Rationale


      Evidence: iteration 6 is the best design so far (937.1). Oval and s-bend finish
      20/20, and slalom now finishes 20/20 (925.7), up from 11/20 at iteration 5.
      The remaining loss is in slalom: 0.65 line-loss events per run, rms_error 0.011,
      max_error 0.021, and a mean finish time of 2.92 s, close to the 3 s limit. Score
      sensitivity: each line-loss event costs about 15 points (120/8), and the rms
      term is worth about 65 points on slalom. Time is worth only about 1.6 points
      on slalom, so speed is a secondary lever. Iteration 6 changed mass (0.45 to
      0.40) and sensor lead (y 0.05 to 0.06) together, and both moved in the right
      direction. Iteration 4 showed that raising kp to 6 collapses the oval and s-bend,
      so kp stays at 4.0. Mass is already at its 0.40 kg floor, so it cannot move
      further. Changes: (1) Move the sensor lead from y = 0.06 to y = 0.07 m, inside
      the 0.08 limit, to continue the lead trend that helped slalom. (2) Raise kd
      from 1.0 to 1.1 to damp the extra overshoot a larger lead can introduce. Sensor
      x positions, weights, kp, ki, base_speed (1.5) and line_loss (last_direction)
      are unchanged, so the effect is readable. Expected result: slalom line-loss
      events fall to about 0.4 or below and slalom rms_error drops by a few thousandths.
      Oval and s-bend stay near 100% completion. Steering_oscillation should stay
      near 0.3 or below. Hypotheses: (a) the y = 0.07 lead cuts slalom line-loss events;
      (b) kd 1.1 keeps oscillation at or below about 0.35; (c) completion holds at
      100% on all three tracks. If slalom max_error rises or oscillation exceeds 0.35,
      revert to y = 0.06 and kd 1.0, which is the iteration 6 design.


      - [Open this output](iteration-7/entity0/versions/97f602ff27754085bd6d96f8013e949a/payload.json)

      - Based on: [entityR2A](iteration-7/entityR2A/versions/carried-bc285ef93a5d3236/payload.json)'
  - id: entityR1
    label: 'Approve: lead y 0.07, kd'
    notes: 'Approved a small two-variable step from the best raced design (iteration
      6, 937.1, all tracks 20/20 on oval and s-bend, slalom 20/20). Sensor lead moves
      to y 0.07 m and kd to 1.1, both inside contract limits, and the race will show
      whether slalom line-loss events fall without oscillation rising above about
      0.35.


      ### Feedback


      Written before this candidate has raced. The candidate is the iteration 6 design
      (score 937.1, the best raced so far) with two small moves: sensor lead y from
      0.06 to 0.07 m, and kd from 1.0 to 1.1. Sensor x positions, 16 mm footprints,
      weights [-2,-1,0,1,2], kp 4.0, ki 0.05, base_speed 1.5, mass 0.40 and last_direction
      line loss are unchanged. The changes are valid: y = 0.07 is inside the 0.08
      m limit and kd 1.1 is inside 0-10. Iteration 6 is the only design with every
      development track finishing 20/20, and its remaining loss is on slalom (0.65
      line-loss events per run, rms_error 0.0111, max_error 0.0214, mean finish 2.92
      s). Iteration 6 moved mass and sensor lead together, so the lead effect is not
      yet isolated, and this candidate changes lead and kd together, so the race result
      should be read as a pair. Iteration 4 showed that raising kp to 6 collapses
      oval and s-bend, so kp stays at 4.0. Iteration 2 showed that kp 4.5 also cost
      completions. Mass is already at its 0.40 kg floor. Plan the revision from the
      race telemetry as follows. If oval or s-bend completion falls below 100%, or
      steering_oscillation rises above about 0.35, revert to y = 0.06 and kd 1.0,
      the iteration 6 design. If slalom line_loss_events stay above about 0.5 while
      oscillation holds, try kd 1.2 before changing kp. If slalom finishes but completion_time
      stays near 2.9 s, test base_speed in steps of 0.1 (1.5 to 1.6), since iteration
      0 showed the oval finishing near 1.9 s at 1.6.


      ### Requested changes


      - If oval or s-bend completion drops below 100%, or steering_oscillation exceeds
      about 0.35, revert geometry.sensor_positions y to 0.06 and controller.kd to
      1.0. Basis: iteration 6 kept both tracks at 20/20 with oscillation 0.20 to 0.33,
      and kd and lead changes are untested singly.

      - If slalom line_loss_events remain above about 0.5 with oscillation at or below
      0.35, raise controller.kd in steps of 0.2 (1.1 to 1.2) before changing kp. Basis:
      iteration 4 showed kp 6 collapses oval and s-bend, and iteration 6 slalom had
      0.65 line-loss events.

      - If slalom finishes but completion_time stays near 2.9 s, raise controller.base_speed
      in steps of 0.1 (1.5 to 1.6) while holding gains. Basis: iteration 6 slalom
      mean finish was 2.92 s against the 3.0 s limit, and iteration 0 showed the oval
      finishing near 1.9 s at 1.6.


      - [Open this output](iteration-7/entityR1/versions/08522e6a692d442582574d9343da6d99/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/97f602ff27754085bd6d96f8013e949a/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-bc285ef93a5d3236/payload.json)'
