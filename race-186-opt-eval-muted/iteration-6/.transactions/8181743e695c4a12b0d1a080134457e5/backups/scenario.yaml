map:
  id: race-186-opt-eval-muted
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Lighter mass, forward
    notes: 'Builds on the best race so far (iteration 5, 851): mass cut from 0.45
      to 0.40 kg and sensors moved forward to y = 0.06 m to target the slalom off-track
      exits. The evidence is the slalom track, which finishes only 11 of 20 with 7
      off-track exits and 2 timeouts, while oval and s-bend are at 100 percent.


      ### Rationale


      Evidence: iteration 5 (score 851, best so far) is the only design with every
      development track finishing at least half the time. Oval (20/20) and s-bend
      (20/20) are solid. Slalom is the gap: 11/20 finish, 7 off-track exits, 2 timeouts,
      mean progress 0.90, max_error 0.042, and 0.5 line-loss events. The timeouts
      and a mean finish time of 2.92 s show the slalom is also near the speed limit.
      Iteration 4 showed that raising kp to 6 collapses the oval and s-bend, so kp
      stays at 4.0. Body width cannot widen the off-track limit because the 0.06 m
      floor binds, so it stays at 0.12. The 2 percent disturbance is the same for
      every design, so the comparison stays fair.


      Changes from iteration 5: (1) Reduce mass from 0.45 to 0.40 kg, the lower bound.
      Iteration 3 to 5 showed that lower mass cut slalom max_error and line loss while
      the oval and s-bend improved. Lower yaw inertia should help the sharp slalom
      direction changes, and the faster acceleration should help the timeouts. (2)
      Move all five sensors forward from y = 0.05 to y = 0.06 m. This gives the steering
      a little more lead, which the Evaluator suggested as the next lever after the
      mass change. Sensor x positions, the 16 mm size, the weights [-2,-1,0,1,2],
      kd 1.0, ki 0.05, base_speed 1.5, and line_loss last_direction are unchanged,
      so the effect of these two changes is easier to read.


      Expected result: slalom off-track exits fall below 5 of 20, slalom finishes
      rise above 11 of 20, and slalom max_error stays near or below 0.042. Oval and
      s-bend completion should hold near 100 percent. Hypotheses: (a) mass 0.40 reduces
      slalom max_error and line-loss events further; (b) the sensor lead at y = 0.06
      reduces slalom off-track exits without adding oscillation above about 0.35;
      (c) the timeouts disappear because the lighter robot reaches speed sooner. Measurements
      wanted next: per-track completion, max_error, line_loss_events and completion_time
      on slalom, plus steering_oscillation on all tracks, so I can tell whether the
      sensor lead or the mass change drives any gain. If slalom still leaves the track,
      the next step is a small kd increase, not kp.


      - [Open this output](iteration-6/entity0/versions/1da2cbde1a094e1b811693a62d5453b6/payload.json)

      - Based on: [entityR2A](iteration-6/entityR2A/versions/carried-5cc25095d3956408/payload.json)'
  - id: entityR1
    label: 'Approve: mass 0.45 kg'
    notes: 'Approves a single-variable test of mass 0.6 to 0.45 kg on the best-raced
      design (iteration 3, score 685.6), with kp, kd and sensors unchanged. The mass
      effect is not isolated in earlier races, since mass and kd changed together
      in iteration 3, so the feedback flags that and gives fallback steps.


      ### Feedback


      Written before this candidate has raced. It is iteration 3''s best-raced design
      (score 685.6: oval 20/20, s-bend 17/20, slalom 0/20) with one change, mass 0.6
      to 0.45 kg. Sensors (five at 16 mm, x = -0.03 to +0.03 m), weights [-2,-1,0,1,2],
      kp 4.0, kd 1.0, base_speed 1.5 and last_direction line loss are unchanged. Iteration
      2 showed that raising kp to 4.5 cost oval and s-bend completion, so keeping
      kp at 4.0 is correct. Be aware that the mass-only effect is not isolated in
      the evidence: iteration 3 changed mass and kd together, so the slalom gain it
      produced cannot be attributed to mass alone. This race is the first clean test
      of mass. Plan the next revision from telemetry. If oval or s-bend completion
      drops below iteration 3 (100% and 85%), or steering_oscillation rises above
      about 0.35, the lighter robot is probably under-damped: return mass to 0.6 and
      raise kd to 1.2 instead. If slalom still ends off track with max_error near
      0.065 and line_loss_events not falling below about 1.0, the next lever is a
      sensor lead (move the sensors toward y = 0.06 m) or a small kd increase, not
      kp. Approving now is reasonable: the candidate is valid, it is a single-variable
      move from the best-known base, and the race will tell us whether the mass lever
      matters.


      ### Requested changes


      - If oval or s-bend completion falls below iteration 3 (100% and 85%), or steering_oscillation
      rises above about 0.35, return geometry.mass to 0.6 and set controller.kd to
      1.2. Basis: iteration 2 showed that pushing the controller harder raised steering_oscillation
      to 0.34 to 0.39 and cost completions, and a lighter robot has less yaw damping.

      - If slalom still leaves the track with max_error near 0.065 and line_loss_events
      stay above about 1.0, move the sensors forward (geometry.sensor_positions y
      toward 0.06 m) before changing kp. Basis: slalom max_error has stayed at 0.063
      to 0.065 across iterations 0 to 4 and kp changes have not helped.

      - If the mass change is neutral or positive, keep mass at 0.45 and test kd in
      steps of 0.2 (1.0 to 1.2) for slalom line-loss events. Basis: iteration 3 slalom
      line_loss_events fell from 1.1 (iteration 1) to 1.25, which does not yet show
      a clear gain from the mass and kd combination, so the damping lever is still
      untested on its own.


      - [Open this output](iteration-5/entityR1/versions/87511ee1e1c5440fac65c8a343fbbb3a/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/4fdc0130958d40b1a30a789f67180307/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-3ca388f898d70909/payload.json)'
