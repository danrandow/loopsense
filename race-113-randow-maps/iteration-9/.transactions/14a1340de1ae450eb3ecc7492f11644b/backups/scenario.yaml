map:
  id: race-113-randow-maps
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Hold best geometry (y
    notes: 'Keeps the iteration 8 best geometry unchanged (score 668, y 0.075, mass
      0.6, body 0.10, track 0.09) so the controller change is isolated. Based on the
      oval holding 20 of 20 with max_error 0.0165 and the s-bend holding 19 finishes,
      with the slalom still at 0 finishes and its max_error floor.


      ### Rationale


      Iteration 8 (score 667.95) is the best measured design: body_length 0.10, mass
      0.6, sensors at y 0.075, 12 mm footprint, 15 mm pitch, wheel_track 0.09. Against
      iteration 6 it kept the oval at 20 of 20 with max_error 0.0165 and lifted the
      slalom progress from 0.26 to 0.34, so the extra look-ahead is not adding lag
      on the oval. The s-bend held 19 of 20 finishes with progress 0.993, but line
      losses rose from 0.55 to 0.80 and oscillation was 0.32, which is under the 0.35
      limit. The slalom still has 0 finishes, max_error at the 0.065 floor and 1.1
      line losses per run. Iteration 7 showed mass 0.5 reverses the s-bend gain, so
      the inertia lever is at its useful limit. Wider track (0.095 or 0.10) would
      trade s-bend turn authority for slalom retention, but at this inertia the s-bend
      is already at 19 finishes and the slalom has not responded to track or look-ahead
      within a clear margin, so I do not gain evidence for that trade in this step.
      I therefore hold every geometric value at the iteration 8 best and change nothing.
      This lets the Integrator''s controller change be read on a fixed platform. Expected
      result: the oval and s-bend stay at or near iteration 8 levels, and any slalom
      gain comes from the controller. If the slalom remains at its max_error floor
      with 0 finishes after the controller change, the geometry has reached its limit
      for these tracks.


      - [Open this output](iteration-9/entity0/versions/198b55e9e0554bd28da25efe19d14ac6/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-d946e4dc6f11c8da/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-e0fb5689e841a412/payload.json)'
  - id: entity1
    label: Restore mass 0.6, y 0.075
    notes: 'Restores the best measured inertia (mass 0.6 at body_length 0.10, iteration
      6) and changes only sensor y to 0.075 to test look-ahead on the slalom. The
      controller is held at iteration 6 gains so the change is isolated.


      ### Rationale


      Iteration 7 (mass 0.5 kg) reversed the inertia gain: s-bend finishes fell from
      19 to 18, line losses rose from 0.55 to 0.85, and progress fell from 0.996 to
      0.965. Iteration 6 (body_length 0.10, mass 0.6, y 0.07, score 657.9) is therefore
      the best measured geometry. The Builder''s proposal restores mass 0.6 and changes
      only sensor y from 0.07 to 0.075. I accept that geometry. Body length is at
      its 0.10 m minimum, and the mass floor for this controller is 0.6 kg.


      For the controller, I keep the iteration 6 gains exactly: kp 2.8, ki 0.05, kd
      0.5, base_speed 1.5, antisymmetric weights [-2, -1, 0, 1, 2] and last_direction
      line loss. The slalom has sat at its max_error floor (0.063) with 0 finishes
      through every inertia change, so the look-ahead step is the only variable that
      can be tested against it. Keeping the controller fixed means any change in the
      slalom or s-bend can be attributed to y 0.075. The oval has margin (max_error
      0.017 against a 0.06 limit), so the extra look-ahead should show up first as
      higher oval max_error if it adds lag.


      Expected, not measured: s-bend holds 19 or more finishes with line losses at
      or below 0.55; slalom line losses at or below 1.0 with progress above 0.26;
      oval still 20 of 20. Risk: y 0.075 adds sensing lag, which would show as oval
      max_error above about 0.025 or s-bend oscillation above 0.35. If either happens,
      return to y 0.07 for the next iteration.


      - [Open this output](iteration-8/entity1/versions/6ece9c24e4f8420e97f8fd21dce1a6a2/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/352d9c2ec98f484590519a1d75c624b6/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-2f4a4d92b9a038e1/payload.json)'
  - id: entityR1
    label: Keep mass 0.6, test y
    notes: 'Advises against mass 0.5, which cut s-bend finishes in iteration 7, and
      gives look-ahead revert and wheel_track triggers tied to iterations 2, 3, 6
      and 7. No outcome is claimed for this candidate.


      ### Feedback


      Written before this candidate has raced. Iteration 6 (score 658) is the best
      measured design: body_length 0.10, mass 0.6, sensors y 0.07, 12 mm footprint,
      wheel_track 0.09. It gave the s-bend 19 of 20 finishes with line losses 0.55
      and oscillation 0.33, and the oval 20 of 20 with max_error 0.017. Iteration
      7 (mass 0.5) reversed that gain: s-bend fell to 18 finishes, losses rose to
      0.85, and progress fell to 0.965. Mass 0.6 is therefore the floor, and body_length
      0.10 is at its minimum. The slalom has been at its max_error floor (0.063) with
      0 finishes in every iteration, and it has not responded to any inertia change.
      Iteration 2 (y 0.07, wheel_track 0.10) gave the best slalom line-loss count
      so far (1.0), which is why look-ahead is the next test. Read the next race as
      follows. If the s-bend holds 19 or more finishes with line losses at or below
      0.55, and the oval max_error stays near 0.017 to 0.025, keep y 0.075. If the
      oval max_error rises above about 0.025 or s-bend oscillation rises above about
      0.35, the extra look-ahead is adding lag, so return to y 0.07. If the slalom
      is still at its max_error floor with 0 finishes after y 0.075, geometry is near
      its limit and the next step should be a controller change.


      ### Requested changes


      - Keep mass 0.6 and body_length 0.10 (do not go to mass 0.5). Iteration 7 showed
      mass 0.5 cut s-bend finishes from 19 to 18 and raised line losses from 0.55
      to 0.85.

      - If slalom line losses stay near or above 1.1 with progress at 0.26 after y
      0.075, try wheel_track 0.095 as a compromise. Iteration 2 (track 0.10, y 0.07)
      gave slalom losses 1.0, while iteration 3 (track 0.09) gave 1.85 and s-bend
      progress 0.68. This trades s-bend progress against slalom retention.

      - If the oval max_error rises above about 0.025 at y 0.075, return to y 0.07,
      since iteration 6 gave oval max_error 0.017 and y 0.07 is the last layout where
      the oval clearly held margin. If the slalom is still at its max_error floor
      with 0 finishes at either y, stop changing geometry and test a controller gain
      change (kd 0.6 or kp 2.5).


      - [Open this output](iteration-8/entityR1/versions/6ece9c24e4f8420e97f8fd21dce1a6a2/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/352d9c2ec98f484590519a1d75c624b6/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-2f4a4d92b9a038e1/payload.json)'
