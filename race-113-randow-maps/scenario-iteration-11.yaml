  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: Hold geometry, test speed
    notes: 'Geometry is held at the iteration 8 and 9 best (body 0.10, mass 0.6, y
      0.075, 12 mm sensors, track 0.09), so the base_speed 1.3 change is isolated.
      Iteration 9 showed the slalom progress rising to 0.51 under control changes,
      and the s-bend and oval results are the guardrails.


      ### Rationale


      Iteration 9 (score 681.3) is the best measured result. Its geometry matches
      iteration 8: body_length 0.10, mass 0.6, sensors at y 0.075 with x at -0.03,
      -0.015, 0, 0.015, 0.03, 12 mm footprints, wheel_track 0.09, wheel_radius 0.03.
      Across iterations 8 and 9 the oval held 20 of 20 finishes (max_error about 0.016),
      and the s-bend held 18 to 19 of 20 finishes. The slalom still has 0 finishes,
      but its progress rose from 0.34 to 0.51 with the controller change, so control,
      not geometry, is now moving the slalom. Iterations 5 to 7 showed that yaw inertia
      has reached its useful limit (mass 0.5 reversed the s-bend gain), and iteration
      4 showed that the 16 mm footprint costs oval reliability. Geometry is therefore
      close to its limit. The Integrator''s plan for this iteration lowers base_speed
      to 1.3 to test whether speed is the constraint. To read that result cleanly,
      I hold every geometric value at the iteration 8 and 9 setting and change nothing.
      If the slalom progress rises with the s-bend still at 18 or more finishes, geometry
      stays fixed. If the slalom stays at its max_error floor with 0 finishes, the
      next geometry trial is wheel_track 0.095, which trades s-bend progress for slalom
      retention, as the iteration 2 and 3 comparison suggested. I do not make a y
      0.08 move now, because the Integrator''s rule makes that conditional on a slalom
      gain at the lower speed.


      - [Open this output](iteration-10/entity0/versions/a43b1b9ef4e24e9ca736b9acdae8b8d6/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-306f8e5f376fff87/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-512744c3c0e13ae1/payload.json)'
  - id: entity1
    label: Speed 1.2 on best
    notes: 'Holds iteration 9 geometry unchanged and lowers base_speed from 1.3 to
      1.2 as the only change. Iteration 9 showed speed cut 1.5 to 1.3 lifted slalom
      progress 0.34 to 0.51 with the oval at 20 of 20.


      ### Rationale


      Iteration 9 is the best measured design (681.3). Its base_speed cut from 1.5
      to 1.3 lifted slalom progress from 0.34 to 0.51 and kept the oval at 20 of 20
      (max_error 0.016). The s-bend fell from 19 to 18 finishes but kept line losses
      at 0.8 and oscillation at 0.28, under the 0.35 limit. The slalom is still at
      its max_error floor (0.064) with 1.1 line losses per run and low oscillation
      (0.23), so it reacts late on alternating bends rather than jittering. Speed
      is still the lever that moved the slalom, so the Builder''s geometry is held
      identical to iteration 8 and 9 (body_length 0.10, mass 0.6, y 0.075, 12 mm footprint,
      wheel_track 0.09). Controller: base_speed is lowered one more step to 1.2, with
      kp 2.8, ki 0.05, kd 0.5, antisymmetric weights and last_direction unchanged,
      so the speed effect can be read alone. The oval''s mean finish time (1.75 s
      at 1.5 and at 1.3) leaves margin under the 3 s limit. Expected, not measured:
      slalom progress above 0.51, with the s-bend holding 17 or more finishes. Risk:
      if the s-bend falls below 17 finishes, speed is now costing bend time, so return
      to 1.3.


      - [Open this output](iteration-10/entity1/versions/65109334de264321b91510eaba20779e/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/a43b1b9ef4e24e9ca736b9acdae8b8d6/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-512744c3c0e13ae1/payload.json)'
  - id: entityR1
    label: Next geometry
    notes: 'Requests y 0.08 if slalom progress keeps rising, wheel_track 0.095 if
      the slalom stays at its floor, and a fallback to speed 1.3 if the s-bend loses
      finishes. Each tied to iterations 2, 3, 8 and 9.


      ### Feedback


      Written before this candidate has raced. Iteration 9 (score 681) is the best
      measured design: the same geometry as iteration 8 at base_speed 1.3. The oval
      stayed at 20 of 20 (max_error 0.016), the s-bend held 18 of 20 finishes with
      line losses 0.8 and oscillation 0.28, and slalom progress rose from 0.34 to
      0.51, though it still has 0 finishes at the 0.064 max_error floor. Iterations
      5 to 7 showed mass and body length have reached their useful limit (mass 0.5
      reversed the s-bend gain), and iteration 8 showed y 0.075 lifted slalom progress
      without hurting the oval. That is why the geometry is held fixed here. Read
      the next race as follows. If slalom progress rises above 0.51 and the s-bend
      holds 17 or more finishes, speed is still helping, so the geometry can be tested
      at y 0.08. If the s-bend falls below 17 finishes, the speed cut is costing bend
      time, so the next geometry trial should be made at base_speed 1.3, not 1.2.
      If the slalom stays at its max_error floor with 0 finishes at either speed,
      geometry is the limit and the wheel_track trade is the next test.


      ### Requested changes


      - If slalom progress rises above 0.51 at base_speed 1.2 and the s-bend holds
      17 or more finishes, try sensor y 0.08 (the 0.08 limit) with all other geometry
      unchanged, since iteration 8 showed y 0.07 to 0.075 lifted slalom progress 0.26
      to 0.34 with the oval unchanged.

      - If the slalom is still at its max_error floor with 0 finishes at base_speed
      1.2 or 1.3, try wheel_track 0.095 with y 0.075, since iteration 2 (track 0.10)
      gave slalom line losses of 1.0 while iteration 3 (track 0.09) gave 1.85 and
      s-bend progress 0.68, so the track trades s-bend progress against slalom retention.

      - If the s-bend falls below 17 finishes or its line losses rise above 0.8, keep
      the geometry fixed and return base_speed to 1.3 (the iteration 9 result), since
      iteration 7 showed mass changes reverse the s-bend gain and should not be retried.


      - [Open this output](iteration-10/entityR1/versions/65109334de264321b91510eaba20779e/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/a43b1b9ef4e24e9ca736b9acdae8b8d6/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-512744c3c0e13ae1/payload.json)'
