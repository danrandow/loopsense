  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Mass 0.5 kg, body 0.10 m
    notes: 'Lowers mass from 0.6 to 0.5 kg with body length held at 0.10 m, cutting
      yaw inertia about 17 percent further. Iteration 6 (score 658) gave s-bend 19
      of 20 finishes and oval 20 of 20, with s-bend oscillation 0.33 under the 0.35
      limit, so the inertia step is still safe to test.


      ### Rationale


      Iteration 6 (score 657.9, the best so far) kept the 12 mm footprint, y 0.07
      layout and wheel_track 0.09, and shortened body_length to 0.10 m at mass 0.6
      kg. The s-bend now finishes 19 of 20 (progress 0.996, line losses 0.55, oscillation
      0.33), and the oval stays at 20 of 20 with max_error 0.017 and oscillation 0.22.
      The slalom is unchanged at 0 of 20 finishes, progress 0.26, max_error at the
      0.063 floor and oscillation 0.16. Both the s-bend and the oval are well inside
      the feedback''s stated thresholds: s-bend oscillation is 0.33 against a 0.35
      limit, so the lower-inertia step is still safe. Following the Integrator''s
      rule, I try mass 0.5 kg with body_length 0.10 m, the next step down in yaw inertia.
      Body length is already at its 0.10 m minimum, so mass is the only lever left
      on inertia. Yaw inertia falls from about 0.00122 to about 0.00102 kg·m², roughly
      17 percent. Sensor layout, 12 mm footprint, wheel_track 0.09, wheel_radius 0.03
      and body_width 0.12 stay fixed, so this race isolates mass. Expected result:
      s-bend finishes at 19 or 20 of 20 with line losses at or below 0.55, and oval
      finishes stay at 20 of 20. The slalom is probably still limited by turn authority
      on alternating bends, since it has not responded to inertia changes so far.
      Risk: oscillation on the s-bend is close to 0.35, so a rise above that is the
      cue to restore mass to 0.6 and move on to controller work.


      - [Open this output](iteration-7/entity0/versions/0b30ccacc9a040d7ade182c098ea3856/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-3365dabed10b3463/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-36ed35d75e0b1f4c/payload.json)'
  - id: entity1
    label: Shorter body, 0.10 m
    notes: 'Iteration 5''s lower-inertia design with body_length cut from 0.12 to
      0.10 m and mass held at 0.6 kg, controller unchanged. Iteration 5 showed s-bend
      finishes rising from 2 to 13 of 20 with losses at 0.95.


      ### Rationale


      Iteration 5 (score 580, the best so far) is the only validated step that broke
      the s-bend limit. It cut yaw inertia by shortening the body to 0.12 m and mass
      to 0.6 kg, and the s-bend went from 2 to 13 finishes with line losses at 0.95
      and oscillation at 0.298. The slalom did not respond (0 finishes, progress 0.23,
      max_error at the 0.063 floor), and the oval held 20 of 20. The Builder''s intent
      is to shorten body_length to 0.10 m with mass held at 0.6 kg, changing nothing
      else. Yaw inertia falls from about 0.00121 to about 0.00121 kg·m²; at these
      values the formula gives mass*(0.10²+0.12²)/12 = 0.6*0.0244/12 ≈ 0.00122 kg·m²,
      which is a further modest reduction from 0.00146. I accept the geometry as proposed.
      The contract says body_length only enters through yaw inertia, so this is a
      pure inertia step.


      For the controller I keep the iteration 5 gains exactly (kp 2.8, ki 0.05, kd
      0.5, base_speed 1.5, weights [-2,-1,0,1,2], last_direction). Changing only the
      geometry means any shift in the outcome can be attributed to inertia. Iteration
      3 showed that narrowing the track raised the effective gain by about 11% without
      oscillation running away, so the gains have some headroom. The main risk is
      that a faster heading response adds jitter, which would show as steering_oscillation
      rising above about 0.35 on the oval or s-bend. The observation request covers
      per-track line losses, max_error, oscillation and finish rate so that case can
      be detected.


      - [Open this output](iteration-6/entity1/versions/d79d2a6092664268a1af8082c6cec2db/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/2f892edb3a8e45d3982da9751d95de45/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-a44a3c57009e2422/payload.json)'
  - id: entityR1
    label: 'Next: mass 0.5 or back to'
    notes: 'Feedback before the race: continue the inertia lever if s-bend keeps improving
      with oscillation under 0.35, otherwise restore body length or move to controller
      gain. Based on iteration 5 (580) and iteration 3''s track evidence.


      ### Feedback


      Written before this candidate has raced. Iteration 5 (score 580) is the best
      measured result. It cut yaw inertia (body 0.16 to 0.12 m, mass 0.8 to 0.6 kg)
      and moved the s-bend from 2 to 13 finishes, with line losses at 0.95 and oscillation
      at 0.298. The oval stayed at 20 of 20 with max_error 0.018 and oscillation 0.217,
      so the lighter, shorter body did not add jitter at that step. The slalom did
      not respond (0 finishes, progress 0.23, max_error at the 0.063 floor), which
      points to a separate limit on alternating bends. I kept the iteration 5 controller
      unchanged, so any change in this race can be attributed to inertia. Read the
      next race as follows. If the s-bend keeps improving (line losses at or below
      0.95, progress above 0.858) and oscillation stays under about 0.35 on all tracks,
      the inertia lever is still working, so a further step (mass 0.5 with body 0.10)
      is worth trying. If oscillation rises above about 0.35 on the oval or s-bend,
      restore body_length to 0.12, since that keeps the mass benefit. If the s-bend
      plateaus near 0.86 progress with losses near 0.95 and the slalom still sits
      at its max_error floor, geometry has done most of what it can, and the next
      gain should come from a controller change rather than more geometry.


      ### Requested changes


      - If the s-bend improves (line_loss_events below 0.95, progress above 0.858)
      and steering_oscillation stays under about 0.35 on the oval, s-bend and slalom,
      try mass 0.5 with body_length 0.10 to lower yaw inertia further, since iteration
      5 showed the s-bend gain from the inertia cut and the mass floor is 0.4.

      - If steering_oscillation rises above about 0.35 on the oval or s-bend at body_length
      0.10, restore body_length to 0.12 and keep mass 0.6, since iteration 5 gave
      s-bend oscillation 0.298 and oval 0.217 at that body length.

      - If the s-bend plateaus near 0.86 progress with line losses still near 0.95
      and the slalom stays at max_error 0.063, stop changing geometry and test controller
      gain (kd 0.6 or kp 2.5), since iteration 3 showed narrowing the track to 0.09
      already raised s-bend progress (0.64 to 0.68) and iteration 5 showed the slalom
      ignores inertia.


      - [Open this output](iteration-6/entityR1/versions/d79d2a6092664268a1af8082c6cec2db/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/2f892edb3a8e45d3982da9751d95de45/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-a44a3c57009e2422/payload.json)'
