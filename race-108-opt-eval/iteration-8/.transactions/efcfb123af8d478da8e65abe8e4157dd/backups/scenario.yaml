map:
  id: race-108-opt-eval
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Narrower sensor x spread
    notes: 'Keeps the iteration 7 base (kd 0.30, kp 4.0, sensor_size 0.012, y 0.06),
      which scored 93.70 with oval oscillation 0.246, and narrows sensor x from ±0.04
      to ±0.03 to test whether the max_error floor of 0.061 to 0.065 m is a sensor-spread
      limit. The evidence is the iteration 7 race data and the Evaluator''s requested
      next lever; the result is untested.


      ### Rationale


      Evidence: iteration 7 (kd 0.30, kp 4.0, ki 0.3, sensor_size 0.012, sensors at
      y 0.06) scored 93.70, the best raced design, up from 84.33. Its oval steering_oscillation
      is 0.246, under the 0.25 threshold, so the kd step is kept as the new base,
      as the Evaluator''s rule requires. max_error is still 0.061 to 0.065 m on every
      track, and every run still goes off track with one line-loss event. Gain changes
      (kp, ki, kd), the sensor footprint (0.016) and sensor y (0.04 to 0.06) have
      all been tried without moving that floor. Per the Evaluator''s requested next
      step, this iteration tests the sensor x spread on the iteration 7 base, changing
      only that variable. Change: sensor x positions narrow from -0.04..0.04 to -0.03..0.03
      (spacing 0.015 m), at y 0.06 and sensor_size 0.012. Weights [-2,-1,0,1,2], kp
      4.0, ki 0.3, kd 0.30, base_speed 1.3 and last_direction are unchanged. Hypothesis:
      a narrower array keeps the outer sensors on the tape during tight bends and
      reduces the off-track excursion, so max_error should fall below about 0.060
      m and line_loss_events should drop. The risk is that a narrower array gives
      less signal on wide bends and lowers the score. Expected result: score at or
      above 93.70 is not assured; this is a test. If the score falls below 93.70,
      or oval steering_oscillation exceeds 0.25, return to x -0.04..0.04 (iteration
      7 geometry). If max_error is unchanged, the next lever is a wider spread (for
      example x -0.06..0.06, within the contract limit of 0.08). Do not raise base_speed
      until progress nears 0.995 with no line loss. Completion within 3 s is not expected
      at base_speed 1.3.


      - [Open this output](iteration-8/entity0/versions/c8cd12bb28374b8db2bdd2a6e55e842b/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-c8fc090d4120afa9/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-2f8ad5ef6df78aa8/payload.json)'
  - id: entityR1
    label: 'Approve: narrower sensor'
    notes: 'Approved the sensor x-spread test (-0.03..0.03 at y 0.06, sensor_size
      0.012) on the iteration 7 base, the best raced design at 93.70. It is a single-variable
      geometry test, since max_error has held at 0.061 to 0.065 m whatever gains,
      y or footprint were tried. The feedback sets revert and wider-spread follow-ups
      depending on the score and oscillation.


      ### Feedback


      Judged before racing. The candidate is valid. It changes only geometry.sensor_positions
      x-spread, from -0.04..0.04 to -0.03..0.03 at y 0.06 and sensor_size 0.012, and
      keeps the iteration 7 controller (kp 4.0, ki 0.3, kd 0.30, base_speed 1.3, last_direction).
      Iteration 7 is the best raced design at 93.70, up from 84.33 in iteration 5.
      Its oval steering_oscillation of 0.246 sits just under the 0.25 return threshold,
      so the kd 0.30 base is acceptable.


      The evidence supports a geometry test over more gain tuning. max_error has stayed
      at 0.061 to 0.065 m on every track in iterations 0 to 7, whatever kp, ki, kd,
      base_speed, sensor y or sensor_size were. Iteration 6 (sensor_size 0.016) scored
      lower than iteration 5 and pushed oval oscillation to 0.256, so footprint widening
      is not the answer. The x spread is the one geometry lever not yet tried.


      The main risk is that the signal is a weighted average, so a narrower spread
      gives a smaller change in signal per unit of lateral offset. That is roughly
      a lower effective steering gain, and it may let drift grow. Narrower spacing
      also means less tape coverage at large offsets. Do not treat the rationale''s
      expected drop in max_error as established. Nothing has been measured for this
      candidate.


      After the race, decide from the telemetry. If the score is at or above 93.70
      and oval steering_oscillation is under 0.25, keep x at -0.03..0.03 as the new
      base. If the score falls below 93.70 or oscillation exceeds 0.25, return x to
      -0.04..0.04 (iteration 7 geometry). If max_error is unchanged at 0.061 to 0.065
      m, the next test is a wider spread (for example x -0.06..0.06) rather than more
      gain changes. Do not raise base_speed until progress nears 0.995 with no line
      loss. Completion within 3 s is not expected at base_speed 1.3.


      ### Requested changes


      - If the score falls below 93.70 (iteration 7) or oval steering_oscillation
      exceeds 0.25, return geometry.sensor_positions x to -0.04, -0.02, 0.0, 0.02,
      0.04 at y 0.06. Iteration 6 showed a wider footprint raised oscillation to 0.256,
      so the current sensor layout is the fallback.

      - If max_error stays at 0.061 to 0.065 m with line_loss_events of 1 or more
      and the score does not improve, test a wider x spread, for example x -0.06..0.06
      (spacing 0.03 m) at sensor_size 0.012. Gain changes in iterations 2 to 4 and
      the footprint change in iteration 6 did not move max_error, and a narrower spread
      may reduce effective steering sensitivity.

      - Do not raise controller.base_speed above 1.3 until progress nears 0.995 with
      no line loss. Every run so far has gone off track, and speed only matters once
      the robot stays on the line.


