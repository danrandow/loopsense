map:
  id: race-108-opt-eval
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Larger sensor footprint
    notes: 'Iteration 5 design with sensor_size raised from 0.012 to 0.016 m, the
      only change, to test whether the fixed max_error floor near 0.063 m comes from
      the sensor footprint. Based on iteration 5 (score 84.33), the best raced result,
      where max_error stayed at 0.062 to 0.065 m across all gain and sensor-y changes.


      ### Rationale


      Evidence: iteration 5 (sensors moved to y 0.06, kp 4.0, ki 0.3, kd 0.25, base_speed
      1.3) is the best raced design at 84.33, up from 74.19. Every trial on all three
      tracks still went off track with one line-loss event per run. max_error stayed
      at 0.0617 to 0.0654 m, so the off-track floor has not moved across iterations
      0 to 5 whatever the gains or the sensor y. The oval steering_oscillation of
      0.244 is close to the 0.25 return threshold, and the s-bend is at 0.204. Progress
      is still low (oval 0.35, s-bend 0.17, slalom 0.09), so base_speed is not yet
      the binding limit. Raising base_speed now would only make the drift worse. The
      off-track limit is max(0.06, 0.0125 + body_width/4), which cannot exceed 0.06
      within the allowed body_width range, so widening the body does not help. The
      Evaluator''s stated next lever is sensor_size, and this change is a single-variable
      test. Change: sensor_size goes from 0.012 to 0.016 m, with all sensor positions
      (y 0.06, x -0.04 to 0.04), weights and controller values held at iteration 5.
      The larger footprint should give each sensor a smoother, more graded reading
      near the tape edge and reduce the chance of a total line loss on sharp bends.
      Expected result: line_loss_events fall on some seeds and max_error moves below
      about 0.062 m. This is uncertain. If max_error stays at 0.062 to 0.065 m, the
      floor is not from the sensor footprint and the next test is a narrower or wider
      x spread. If the score falls below 84.33 or oscillation exceeds 0.25 on the
      oval, revert to sensor_size 0.012 and try kd 0.3 with kp 4.0. Do not raise base_speed
      until progress nears 0.995 with no line loss. Completion within 3 s is not expected
      at base_speed 1.3.


      - [Open this output](iteration-6/entity0/versions/9f703427cba743ddac8682b40a32bd0b/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-c360192789bb453c/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-318ecf5fcc99ff6b/payload.json)'
  - id: entityR1
    label: Sensor footprint 0.016
    notes: 'Approved a single-variable test: sensor_size raised from 0.012 to 0.016
      m on the best raced design (iteration 5, score 84.33). Max_error has sat at
      0.061 to 0.065 m across all iterations whatever the gains or sensor y, so the
      footprint is an untested lever that racing can isolate.


      ### Feedback


      Judged before racing. The candidate is valid. It changes only geometry.sensor_size,
      from 0.012 to 0.016 m (inside the enum), and keeps the iteration 5 sensor positions
      (y 0.06, x -0.04 to 0.04), weights and controller (kp 4.0, ki 0.3, kd 0.25,
      base_speed 1.3, last_direction). Iteration 5 is the best raced design at 84.33,
      up from 74.19 in iteration 4, which was the y 0.04 to 0.06 move. Every iteration
      from 0 to 5 shows max_error between 0.061 and 0.065 m on all tracks, whatever
      kp, ki, kd, base_speed or sensor y were. The off-track floor has not moved,
      so a sensor-footprint test is a reasonable untested lever. The candidate is
      a clean single-variable test against the best raced design. Do not treat its
      expected max_error or line_loss change as established. Nothing has been measured
      for it. The main risk is that a wider footprint blurs the tape edge and reduces
      contrast, which would show as a lower score or a higher steering_oscillation.
      Oscillation on the oval was 0.244 in iteration 5 and 0.254 in iteration 4, so
      watch it closely. After the race, decide from the telemetry. If max_error falls
      below about 0.062 m or line_loss_events drop with oscillation under 0.25, keep
      sensor_size 0.016. If max_error stays at 0.062 to 0.065 m, the footprint is
      not the floor, so test a narrower or wider sensor x spread next. If the score
      falls below 84.33 or oscillation exceeds 0.25 on the oval, revert to sensor_size
      0.012 and try kd 0.3 with kp 4.0. Do not raise base_speed until progress nears
      0.995 with no line loss. Completion within 3 s is not expected at base_speed
      1.3.


      ### Requested changes


      - If the race shows max_error below about 0.062 m or fewer line_loss_events
      while steering_oscillation stays under 0.25, keep geometry.sensor_size at 0.016
      and then test controller.base_speed toward 1.5 only once progress nears 0.995
      with no line loss (iterations 0 to 5 all went off track at base_speed 1.3 and
      1.6).

      - If the score falls below 84.33 (iteration 5) or steering_oscillation exceeds
      0.25 on the oval, revert geometry.sensor_size to 0.012 and try controller.kd
      0.3 with kp 4.0, since iteration 4 (kd 0.25) and iteration 3 (kd 0.2, kp 4.0)
      show the oscillation rising with kp.

      - If max_error stays at 0.062 to 0.065 m with line_loss_events of 1 or more,
      the sensor footprint is not the floor either, so test a narrower or wider x
      spread (for example x -0.03 to 0.03) at sensor_size 0.016 rather than adjusting
      gains again, because gain changes across iterations 2 to 4 did not move max_error.


      - [Open this output](iteration-6/entityR1/versions/8a9b373ab3854507a0a437e0aa1f70d2/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/9f703427cba743ddac8682b40a32bd0b/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-318ecf5fcc99ff6b/payload.json)'
