map:
  id: race-108-opt-eval
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Add integral, slow, damp
    notes: 'Keeps the geometry and adds ki=0.3 to remove the steady drift from the
      motor mismatch, lowers base_speed to 1.3, and raises kp to 3.0 and kd to 0.15.
      Iteration 0 went off track in all 60 trials with about 0.03 m rms error and
      one line loss each, so the controller needs to correct drift before it exits
      the tape.


      ### Rationale


      Evidence: all 60 development trials ended off track. Progress was only 0.035
      to 0.115, with one line-loss event per run. Max error sat at about 0.061 m,
      just past the 0.06 m off-track limit, and rms error was about 0.03 m. Steering
      oscillation was low (about 0.07), so the robot is not jittering. It drifts steadily
      off the line early in each course rather than oscillating. The most likely cause
      is the fixed 2% left/right motor mismatch. With ki = 0, proportional control
      alone leaves a steady heading offset that grows until the robot leaves the tape.
      Base speed 1.6 may also be too fast to correct that drift on the first bends.
      Changes: (1) controller.ki from 0 to 0.3, to remove the steady offset caused
      by the motor mismatch; the integral is clamped at +/-2, so the contribution
      stays bounded. (2) controller.base_speed from 1.6 to 1.3, to give the loop more
      time to correct and reduce line loss. (3) controller.kp from 2.5 to 3.0, for
      a stiffer response to the measured offset. (4) controller.kd from 0.05 to 0.15,
      to damp the stiffer response and avoid overshoot. Geometry is unchanged, so
      the race isolates the controller. Expected result: fewer or no line-loss events,
      progress well above 0.2 on the oval and s-bend, and max_error under about 0.04
      m. Completion within 3 s is not expected yet, because base_speed 1.3 is below
      the roughly 1.5 m/s average needed. Hypotheses to test next: (a) the motor mismatch
      causes a steady offset that ki removes; (b) the early off-track exit comes from
      overshoot on the first bends, which kd addresses. Measurements wanted: progress,
      max_error, line_loss_events, steering_oscillation, and completion_time. If progress
      reaches about 0.995 with no line loss, raise base_speed toward 1.8 next. If
      the run still drifts with a steady bias, raise ki before touching kp.


      - [Open this output](iteration-1/entity0/versions/3275c40d130142cca2be514630a5902a/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-c1e6ff3cbbe50441/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-90cc1e0ad81d4715/payload.json)'
  - id: entityR1
    label: Approve controller retune
    notes: 'Approved the controller-only retune (ki 0.3, kp 3.0, kd 0.15, base_speed
      1.3) because iteration 0 failed in all 60 trials with steady drift and no oscillation,
      and this is early exploration. Next-race steps are tied to progress, max_error
      and oscillation, citing iteration 0''s measurements.


      ### Feedback


      Iteration 0 is the only raced design. It scored 26.04 and went off track in
      all 60 trials on oval, s-bend and slalom, with progress 0.035 to 0.115 and one
      line-loss event per run. Max error sat at about 0.061 m, just past the 0.06
      m limit, and rms error was about 0.03 m. Steering oscillation was low (about
      0.07), so the failure looks like a slow steady drift off the line, not jitter.
      The candidate changes only the controller, so the race isolates the controller.
      Its contents are valid: base_speed 1.3, kp 3.0, ki 0.3, kd 0.15, line_loss last_direction,
      and geometry unchanged. The ki of 0.3 is inside its 0 to 5 range, and the integral
      clamp of plus or minus 2 bounds its contribution. Nothing is obviously broken,
      and it addresses the drift that iteration 0 showed. The main risk is that base_speed
      1.3 is below the roughly 1.5 m/s average needed to finish in 3 s, so completion
      is unlikely even if the robot stays on the line. This is early exploration with
      ten iterations left, so racing it is more informative than another round of
      reading. Do not expect the rationale''s predicted outcomes to hold until the
      race reports them. After the race, decide from the measurements. If progress
      reaches about 0.995 with no line loss, raise base_speed toward 1.8, since speed
      is then the binding limit. If the robot still drifts with a steady bias (max_error
      near 0.06 with line_loss_events of 1 or more), raise ki before touching kp,
      since the 2% motor mismatch is the suspected cause. If steering_oscillation
      rises above about 0.2 after kp went up, raise kd before lowering kp.


      ### Requested changes


      - If the race shows progress at or near 0.995 with no line loss, raise controller.base_speed
      from 1.3 toward 1.8. Iteration 0 showed off-track exits at progress 0.035 to
      0.115, so speed is only worth raising once the robot stays on the line.

      - If the race still shows a steady drift (max_error near 0.06 m with line_loss_events
      of 1 or more), raise controller.ki from 0.3 toward 0.8 to 1.0 before changing
      kp. Iteration 0 had ki 0 and drifted off in every trial, which points to the
      fixed motor mismatch.

      - If steering_oscillation rises above about 0.2 after kp went from 2.5 to 3.0,
      raise controller.kd from 0.15 toward 0.25 before lowering kp. Iteration 0 had
      oscillation near 0.07 and kd 0.05, so the stiffer kp is the likely source of
      any new jitter.


      - [Open this output](iteration-1/entityR1/versions/11d93b2685a6405ebdf9a59bd08c387b/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/3275c40d130142cca2be514630a5902a/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-90cc1e0ad81d4715/payload.json)'
