map:
  id: race-108-opt-eval
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: kd 0.25 damps kp 4.0
    notes: 'Keeps kp 4.0 and raises kd from 0.2 to 0.25, following the Evaluator''s
      rule for oscillation near 0.21 after the kp rise. Iteration 3 (kp 4.0, kd 0.2)
      scored 62.5, below the best of 71.2, so this tests whether extra damping restores
      progress.


      ### Rationale


      Evidence: iteration 3 (kp 4.0, kd 0.2) scored 62.5, below the best raced design
      (iteration 1, kp 3.0, kd 0.15, score 71.2). Progress fell on every track, and
      steering_oscillation rose to 0.21 on the oval. max_error stayed at 0.062 to
      0.065 m on every track, and each run still had one line-loss event. Raising
      ki (iteration 2) and raising kp (iteration 3) both failed to move max_error,
      so the bias is not a simple gain problem. The feedback rule applies directly:
      oscillation above about 0.2 after a kp rise calls for more kd before any further
      kp change. Change: controller.kd goes from 0.2 to 0.25 and kp stays at 4.0,
      which tests whether extra damping makes the stiffer kp usable. ki stays at 0.3
      (the best ki tested) and base_speed stays at 1.3. Geometry is unchanged, so
      the race isolates the steering damping. Expected result: steering_oscillation
      falls below about 0.2, and progress holds or rises relative to iteration 3.
      max_error may not fall below 0.06 m, since the bias is not yet explained. Hypotheses:
      (1) kd 0.25 damps the kp 4.0 overshoot and restores progress; (2) the max_error
      floor near 0.063 m comes from sensor look-ahead, not gain. Measurements wanted:
      steering_oscillation, max_error, progress, line_loss_events, and control_effort
      on every track. If oscillation is now under 0.2 and max_error is still near
      0.06 m, the next step is to move the sensors forward to y about 0.06 for earlier
      look-ahead, or kp about 5. If progress reaches about 0.995 with no line loss,
      raise base_speed toward 1.8.


      - [Open this output](iteration-4/entity0/versions/1b2cb9f8b9a54b5aa4ac6226813fb9b8/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-ed2b5f711c927d5a/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-c5e8e61ad42d6ef5/payload.json)'
  - id: entityR1
    label: 'Approve: kp 4.0, kd 0.2'
    notes: 'Approved the candidate unchanged. It raises kp from 3.0 to 4.0 and kd
      from 0.15 to 0.2 on top of the best raced controller (iteration 1, score 71.2),
      keeping ki at 0.3 because iteration 2 showed higher ki reduced progress. Racing
      it is the most informative next step, with a clear plan if oscillation or max_error
      misbehaves.


      ### Feedback


      Judged before racing, the candidate is valid and differs from the best raced
      design (iteration 1, ki 0.3, kp 3.0, kd 0.15, score 71.2) only in controller.kp
      (3.0 to 4.0) and controller.kd (0.15 to 0.2). Iteration 1 showed every trial
      still leaving the line at max_error about 0.063 m, with one line-loss event
      per run and steering_oscillation about 0.15. Iteration 2 showed that raising
      ki to 0.9 lowered progress on every track (oval 0.263 to 0.226), so ki stays
      at 0.3. The proportional term is the remaining lever on the bend error, and
      kd rises with it to damp the stiffer response. Iteration 1''s oscillation of
      about 0.15 leaves room under the 0.2 concern level, so kp 4.0 is a modest step.
      Geometry and base_speed 1.3 are unchanged, so the race isolates the steering
      gains. Do not treat the expected max_error or progress gains as established:
      none is measured for this candidate. After the race, decide from the telemetry.
      If steering_oscillation rises above about 0.2, raise kd toward 0.25 before changing
      kp again. If max_error still sits near 0.06 m with no oscillation, try kp about
      5 next, or move the sensors forward to y about 0.06 for earlier look-ahead.
      If progress reaches about 0.995 with no line loss, raise base_speed toward 1.8,
      since speed is then the binding limit. Completion within 3 s is not expected
      at base_speed 1.3.


      ### Requested changes


      - If steering_oscillation exceeds about 0.2 after kp rose from 3.0 to 4.0 (iteration
      1 was about 0.15), raise controller.kd from 0.2 toward 0.25 before changing
      kp again.

      - If max_error stays near 0.06 m with line_loss_events of 1 or more and no oscillation,
      raise controller.kp from 4.0 toward 5.0. Iteration 2 showed that a larger ki
      hurt progress, so do not use ki to fix the drift.

      - If progress reaches about 0.995 with no line loss, raise controller.base_speed
      from 1.3 toward 1.8. Iteration 1 showed off-track exits at progress 0.10 to
      0.26, so speed only matters once the robot stays on the line.


