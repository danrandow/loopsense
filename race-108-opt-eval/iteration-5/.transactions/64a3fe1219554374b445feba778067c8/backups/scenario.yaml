map:
  id: race-108-opt-eval
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Sensors forward to y=0.06
    notes: 'Keeps the best raced gains (kp 4.0, kd 0.25, score 74.2) and moves the
      sensors from y=0.04 to y=0.06 to test whether earlier look-ahead lowers the
      max_error floor of about 0.063 m that gain changes have not moved. Evidence:
      all five iterations went off track with max_error stuck near 0.06 m.


      ### Rationale


      Evidence: iteration 4 (kp 4.0, kd 0.25, ki 0.3, base_speed 1.3) is the best
      raced design so far at 74.19. Every trial on all three tracks still went off
      track, with one line-loss event per run. max_error sits at 0.062 to 0.065 m
      on every track whatever the gains (iterations 0 to 4), so gain changes have
      not moved that floor. The oval steering_oscillation is 0.254, above the 0.2
      concern level, but the other tracks are at 0.12 to 0.13. Raising ki (iteration
      2) lowered progress, and raising kp (iteration 3) did not reduce max_error.


      Change: move both sensor rows from y = 0.04 to y = 0.06 m, keeping x, weights,
      and all controller values unchanged (kp 4.0, ki 0.3, kd 0.25, base_speed 1.3,
      last_direction). This is the geometry test the feedback asked for. Moving the
      sensors forward gives earlier look-ahead, so the controller sees the bend before
      the wheels reach it, which is a plausible cause of the fixed off-track floor.


      Expected result: max_error falls below about 0.058 m and line_loss_events drop
      on some seeds. Steering_oscillation may rise slightly because the signal reacts
      earlier, so I will watch it. Risk: the longer look-ahead can overshoot on tight
      bends.


      Hypotheses: (1) the max_error floor is caused by look-ahead distance, not gain;
      (2) kd 0.25 is enough damping to keep oscillation near 0.2 with earlier sensing.
      Measurements wanted: max_error, line_loss_events, progress, steering_oscillation,
      rms_error, and control_effort on every track. Next step depends on the result.
      If max_error falls and oscillation stays under about 0.2, try base_speed toward
      1.8 once progress nears 0.995 with no line loss. If the score falls below 74.19
      or oscillation exceeds about 0.25, revert to y = 0.04 and try kp 5 with kd 0.3.


      - [Open this output](iteration-5/entity0/versions/e28ecadeeac446b1823bf97756649ce6/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-7a871a24f191295c/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-ef20c65b3f954596/payload.json)'
  - id: entityR1
    label: 'Approve: sensors at y'
    notes: 'Approved the single-variable geometry test (sensor y 0.04 to 0.06) on
      the best raced controller (iteration 4, 74.19). Max_error has sat at 0.061 to
      0.065 m across all gain changes, so look-ahead is the untested lever, and the
      race is more informative than another revision round.


      ### Feedback


      Judged before racing. The candidate is valid and changes only geometry.sensor_positions,
      moving all five sensors from y = 0.04 to y = 0.06 m. Controller values match
      iteration 4, the best raced design (kp 4.0, ki 0.3, kd 0.25, base_speed 1.3,
      score 74.19), and sensor x values and weights are unchanged. y = 0.06 is inside
      the contract limit of 0.08. The change isolates one variable. Iterations 0 to
      4 all show max_error between 0.061 and 0.065 m on every track, whatever kp,
      ki, kd or base_speed were, so gain changes have not moved that floor. Earlier
      look-ahead is the untested hypothesis that could explain it. Iteration 4 also
      showed steering_oscillation at 0.254 on the oval, above the 0.2 concern level,
      so the next race should watch that closely. Do not treat the expected max_error
      drop or the oscillation outcome as established; neither has been measured for
      this candidate. After the race, decide from the telemetry. If max_error falls
      and line_loss_events drop while oscillation stays under about 0.2, keep y =
      0.06 and then try base_speed toward 1.8 once progress nears 0.995 with no line
      loss. If the score falls below 74.19 or oscillation exceeds about 0.25, return
      to y = 0.04 and try kp 5 with kd 0.3, as iteration 3 suggested for the stiffer-gain
      route. Completion within 3 s is not expected at base_speed 1.3.


      ### Requested changes


      - After the race, if max_error falls below about 0.058 m with oscillation under
      0.2, keep geometry.sensor_positions at y 0.06 and raise controller.base_speed
      from 1.3 toward 1.8 once progress nears 0.995 with no line loss (iteration 4
      gave no completions at base_speed 1.3).

      - If the score falls below 74.19 (iteration 4) or steering_oscillation exceeds
      about 0.25 on the oval, return geometry.sensor_positions to y 0.04 and try controller.kp
      5.0 with controller.kd 0.3, since iteration 3 showed kp 4.0 with kd 0.2 raised
      oscillation to 0.21.

      - If max_error stays at 0.061 to 0.065 m despite the earlier look-ahead, the
      gain and sensor-y levers have both failed, so test a change to sensor_size (0.016)
      or sensor x spread before further gain tuning, because the off-track floor has
      not moved across iterations 0 to 4.


      - [Open this output](iteration-5/entityR1/versions/8f581efc72344ec8a2aa98bdff4b24da/payload.json)

