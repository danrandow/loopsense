map:
  id: race-108-opt-eval
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: kp 3.4, kd 0.30 base
    notes: 'Iteration 9 (kp 3.7) scored 132.80, the best so far, but oval steering_oscillation
      rose to 0.278, above the 0.25 threshold. This candidate lowers kp to 3.4 with
      geometry and kd unchanged, as the feedback requested, to test whether oscillation
      drops while progress holds.


      ### Rationale


      Evidence from iteration 9 (kp 3.7, kd 0.30, ki 0.3, base_speed 1.3, sensors
      at y 0.06, x -0.03..0.03, sensor_size 0.012): score 132.80, the best raced design,
      up from 116.27. Progress rose on every track (oval 0.46 to 0.53, s-bend 0.26
      to 0.32), so the lower kp helped progress. The oval steering_oscillation rose
      to 0.278, which is above the 0.25 threshold. That breaks the earlier pattern
      where lower kp reduced oscillation (iterations 1 to 4), so kp does not explain
      the oscillation alone. The Evaluator''s rule for oscillation still above 0.25
      at kp 3.7 is to test kp 3.4 with kd 0.30 unchanged. max_error stayed at 0.0636
      to 0.0655 m on every track, so the off-track floor has not moved, and every
      run still ends off track with line-loss events (oval 1.2, slalom 2.0).


      Change: controller.kp from 3.7 to 3.4. Geometry (x -0.03..0.03, y 0.06, sensor_size
      0.012), kd 0.30, ki 0.3, base_speed 1.3, sensor_weights and last_direction line_loss
      are unchanged, so the race isolates the kp step.


      Expected result: oval steering_oscillation at or below about 0.25, with progress
      holding near 0.5 on the oval and 0.3 on the s-bend. Score is expected in the
      120 to 135 range. Risk: lower kp reduces bend tracking, so progress may fall
      and the score may drop below 132.80. Hypothesis: the oscillation is partly a
      damping issue at this geometry, and kp 3.4 may still not bring it under 0.25.


      Decision after the race: if the score is at or above 132.80 with oval oscillation
      under 0.25, keep kp 3.4. If the score falls below 116.27 or progress drops with
      oscillation still high, restore kp 3.7 (iteration 9 base) and test a moderate
      kd increase (for example 0.35) instead. If max_error stays at 0.063 to 0.066
      m, the next geometry lever is a wider x spread (for example -0.04..0.04 with
      kp 3.7), since gain and footprint changes have not moved the floor. Keep base_speed
      at 1.3 until progress nears 0.995 with no line loss.


      - [Open this output](iteration-10/entity0/versions/0bd5c605c8be48b895f490fca20d6d7d/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-cb7a661b9d404315/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-edd4d93624f1571b/payload.json)'
  - id: entityR1
    label: Approve kp 3.7 on iter 8
    notes: 'Approves the iteration 8 geometry (best raced, 116.27) with kp lowered
      from 4.0 to 3.7 to bring oval steering oscillation (0.262) under 0.25. Kp increases
      raised oscillation across iterations 1 to 4, so this single-variable step is
      supported, and the race will show whether progress holds.


      ### Feedback


      Judged before racing. The candidate is valid and is the iteration 8 design (best
      raced at 116.27, sensors x -0.03..0.03 at y 0.06, sensor_size 0.012) with one
      change: controller.kp from 4.0 to 3.7. The rationale rests on iteration 8''s
      oval steering_oscillation of 0.262, which is above the 0.25 concern level. Across
      iterations 1 to 4 at fixed kd, raising kp raised oscillation (kp 3.0 at kd 0.15
      gave 0.164 on the oval; kp 4.0 at kd 0.20 gave 0.208), so a modest kp reduction
      is supported. The change is a single-variable step of 0.3, and kd, ki, base_speed
      and line_loss are unchanged. The risk is that lower kp reduces progress on bends.
      Iteration 8 progress was 0.46 on the oval, 0.26 on the s-bend and 0.12 on the
      slalom, so progress is the number to watch. Nothing about this candidate''s
      outcome has been measured. max_error has stayed at 0.061 to 0.065 m in every
      iteration 0 to 8, so this change is unlikely to remove the off-track floor.
      It is aimed at oscillation and should be judged mainly on steering_oscillation
      and progress. Once the race reports, decide as follows. If the score is at or
      above 116.27 with oval oscillation under 0.25, keep kp 3.7 as the base. If the
      score falls below 116.27 with oscillation under 0.25, restore kp 4.0 and test
      a narrower spread (x -0.02..0.02) at kd 0.30, as the Optimizer''s own fallback
      plan says. If oscillation stays above 0.25 at kp 3.7, lower kd is not the answer
      (iteration 3 to 4 showed kd up raising oscillation); test kp 3.4 instead. Do
      not raise base_speed above 1.3 until progress nears 0.995 with no line loss,
      since every run so far has gone off track.


      ### Requested changes


      - If the score falls below 116.27 with oval steering_oscillation under 0.25,
      restore controller.kp to 4.0 and test geometry.sensor_positions x at -0.02..0.02
      (y 0.06, sensor_size 0.012, kd 0.30). Iteration 8 showed that the narrower spread
      raised progress, so a further narrowing is the next lever, not a gain change.

      - If oval steering_oscillation stays above 0.25 at kp 3.7, lower controller.kp
      further to about 3.4 with kd 0.30 unchanged. Iteration 4 (kd 0.25) and iteration
      3 (kd 0.20) show that raising kd did not reduce oscillation, so kp is the lever
      to move.

      - Keep controller.base_speed at 1.3 and do not raise it until progress nears
      0.995 with no line loss. Iterations 0 to 8 all went off track, so speed matters
      only once the robot stays on the line.


      - [Open this output](iteration-9/entityR1/versions/0c156666190e43a788009c440464c0a2/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/82d33fa1f946425a839cddc98dc358c3/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-172cf988274cee75/payload.json)'
