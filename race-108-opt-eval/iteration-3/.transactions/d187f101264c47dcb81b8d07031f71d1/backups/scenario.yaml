map:
  id: race-108-opt-eval
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Raise ki to 0.9
    notes: 'Keeps geometry, kp 3.0, kd 0.15 and base_speed 1.3, and raises ki from
      0.3 to 0.9. Iteration 1 showed progress rising and max_error stuck near 0.063
      m, which points to a steady motor-mismatch bias that the integral term should
      cancel. Oscillation at 0.15 is still below the kd-raise threshold.


      ### Rationale


      Evidence from iteration 1 (score 71.2, up from 26.0): every trial still went
      off track. Progress rose on all three tracks (oval 0.12 to 0.26, s-bend 0.04
      to 0.15, slalom 0.035 to 0.106), so the integral term helped. But max_error
      still sits at 0.0628 to 0.0641 m, just past the 0.06 m limit, and each run still
      has one line-loss event. Steering oscillation rose from about 0.07 to 0.15 (oval
      0.164), which is below the 0.2 threshold where the feedback says to raise kd
      first. The residual drift is therefore still a steady bias, consistent with
      the fixed 2% left/right motor mismatch. The integral gain of 0.3 is too weak
      to cancel it fully. Geometry cannot widen the off-track limit: body_width 0.18
      gives max(0.06, 0.0125 + 0.045) = 0.06 m, so the 0.06 m floor binds regardless.
      Changes: (1) controller.ki from 0.3 to 0.9, following the Evaluator''s requested
      range of 0.8 to 1.0 and the rule to raise ki before kp. The integral is still
      clamped at +/-2, so the contribution stays bounded. (2) kp stays at 3.0, kd
      stays at 0.15, and base_speed stays at 1.3, so the race isolates the ki change.
      Geometry is unchanged. Expected result: max_error falls below about 0.055 m,
      line_loss_events drop to 0 on at least some seeds, and progress rises toward
      0.5 or higher on the oval. Steering oscillation should stay under about 0.2.
      Risk: a larger integral can overshoot on bends and cause a new oscillation,
      which would show as a rising steering_oscillation. Speed stays low, so completion
      within 3 s is still not expected. Next steps depend on the measurements: if
      progress reaches about 0.995 with no line loss, raise base_speed toward 1.8.
      If steering_oscillation exceeds about 0.2, raise kd toward 0.25 before changing
      ki or kp.


      - [Open this output](iteration-2/entity0/versions/bd4b25bcb7fe49f3af197f97a796c949/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-29e967774f71fd9b/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-e575757ace806dd2/payload.json)'
  - id: entityR1
    label: 'Approve: ki 0.9 test'
    notes: 'Approved the ki 0.3 to 0.9 change, a single-variable test against the
      best raced design (score 71.2). Evidence: iteration 1 still drifted with a steady
      bias (max_error about 0.063 m, one line loss per run), and the integral raised
      progress when first added.


      ### Feedback


      This candidate changes only controller.ki, from 0.3 to 0.9, relative to the
      best raced design (iteration 1, score 71.2). Iteration 1 showed every trial
      still going off track with max_error about 0.063 m, just past the 0.06 m limit,
      one line-loss event per run, and steering_oscillation about 0.15 (iteration
      1 data). That pattern is a steady bias rather than jitter, which fits the fixed
      2% motor mismatch the integral term is meant to cancel. Iteration 0 (ki 0) had
      the same drift, and iteration 1 raised progress on all three tracks after ki
      went from 0 to 0.3, so the integral direction is supported. kp 3.0, kd 0.15
      and base_speed 1.3 are unchanged, so the race isolates the ki change. Geometry
      is unchanged, and body_width cannot widen the limit (the 0.06 m floor binds).
      The integral is clamped at ±2, so ki 0.9 has bounded effect. Risks to check
      in the telemetry: a larger integral may overshoot on bends, which would show
      as rising steering_oscillation, and base_speed 1.3 is still below the roughly
      1.5 m/s needed to finish in 3 s, so completion is not expected. This is early
      exploration with nine iterations after this one, so racing is more informative
      than another read. After the race, decide from the measurements. If max_error
      falls and line_loss_events reach 0 with progress near 0.995, raise base_speed
      toward 1.8. If steering_oscillation exceeds about 0.2, raise kd toward 0.25
      before changing ki or kp. If max_error still sits near 0.06 with a steady bias
      and no oscillation, raise ki further (up to about 1.5) before touching kp.


      ### Requested changes


      - Keep controller.kp at 3.0, kd at 0.15 and base_speed at 1.3 for this race,
      so the ki change is isolated; iteration 1 (ki 0.3) drifted to max_error about
      0.063 m, and this test checks whether ki 0.9 brings that below 0.06 m.

      - If the race shows progress at or near 0.995 with no line loss, raise controller.base_speed
      from 1.3 toward 1.8, since iteration 1 showed the off-track drift was the binding
      failure and speed becomes the limit only once the robot stays on the line.

      - If steering_oscillation rises above about 0.2 (iteration 1 was about 0.15),
      raise controller.kd from 0.15 toward 0.25 before changing ki or kp, because
      a larger integral can cause bend overshoot.


      - [Open this output](iteration-2/entityR1/versions/1068945751eb44acb18a66ac25326dc1/payload.json)

