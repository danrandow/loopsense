map:
  id: race-108-opt-eval
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence. Iteration 2 (ki 0.9) scored 64.3, below iteration 1 (ki 0.3, score
      71.2). Progress fell on every track (oval 0.263 to 0.226, s-bend 0.151 to 0.142,
      slalom 0.106 to 0.100), and max_error stayed at 0.062 to 0.065 m, still past
      the 0.06 m limit. So the ''raise ki to cancel a steady bias'' hypothesis is
      not supported. A stronger integral does not fix the drift and slightly slows
      the run. Steering oscillation stayed near 0.15, so the robot is not jittering.
      Every trial still leaves the line at about 0.063 m, with one line-loss event
      per run.


      Changes. (1) controller.ki goes back to 0.3, the best-scoring value so far.
      (2) controller.kp goes from 3.0 to 4.0. The error that grows on bends needs
      a stiffer proportional correction, and max_error is the binding failure. (3)
      controller.kd goes from 0.15 to 0.2 to damp the stiffer response and keep steering_oscillation
      under about 0.2. Geometry and base_speed 1.3 are unchanged, so the race shows
      the effect of the steering gains alone.


      Expected result. max_error falls below about 0.058 m, line_loss_events drop
      toward 0 on some seeds, and progress rises on the oval and s-bend. Steering
      oscillation should stay under about 0.2.


      Risks and next steps. A higher kp can overshoot and raise steering_oscillation.
      If that happens, raise kd toward 0.25 before changing kp again. If max_error
      still sits near 0.06 with no oscillation, next try kp about 5 or move the sensors
      forward (y about 0.06) for earlier look-ahead. If progress reaches about 0.995
      with no line loss, raise base_speed toward 1.8. Completion within 3 s is not
      expected at base_speed 1.3.


      Measurements wanted: max_error, line_loss_events, progress, steering_oscillation,
      control_effort, rms_error, and completion_time.


      - [Open this output](iteration-3/entity0/versions/d187f101264c47dcb81b8d07031f71d1/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-8193c7a91040d0f6/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-07eaf84570816036/payload.json)'
  - id: entityR1
    label: 'Approve: kp 4.0, kd 0.2'
    notes: 'Approved the candidate unchanged. It raises kp from 3.0 to 4.0 and kd
      from 0.15 to 0.2 on top of the best raced controller (iteration 1, score 71.2),
      keeping ki at 0.3 because iteration 2 showed higher ki reduced progress. Racing
      it is the most informative next step, with a clear plan if oscillation or max_error
      misbehaves.


      ### Feedback


      Judged before racing, the candidate is valid and differs from the best raced
      design (iteration 1, ki 0.3, kp 3.0, kd 0.15, score 71.2) only in controller.kp
      (3.0 to 4.0) and controller.kd (0.15 to 0.2). Iteration 1 showed every trial
      still leaving the line at max_error about 0.063 m, with one line-loss event
      per run and steering_oscillation about 0.15. Iteration 2 showed that raising
      ki to 0.9 lowered progress on every track (oval 0.263 to 0.226), so ki stays
      at 0.3. The proportional term is the remaining lever on the bend error, and
      kd rises with it to damp the stiffer response. Iteration 1''s oscillation of
      about 0.15 leaves room under the 0.2 concern level, so kp 4.0 is a modest step.
      Geometry and base_speed 1.3 are unchanged, so the race isolates the steering
      gains. Do not treat the expected max_error or progress gains as established:
      none is measured for this candidate. After the race, decide from the telemetry.
      If steering_oscillation rises above about 0.2, raise kd toward 0.25 before changing
      kp again. If max_error still sits near 0.06 m with no oscillation, try kp about
      5 next, or move the sensors forward to y about 0.06 for earlier look-ahead.
      If progress reaches about 0.995 with no line loss, raise base_speed toward 1.8,
      since speed is then the binding limit. Completion within 3 s is not expected
      at base_speed 1.3.


      ### Requested changes


      - If steering_oscillation exceeds about 0.2 after kp rose from 3.0 to 4.0 (iteration
      1 was about 0.15), raise controller.kd from 0.2 toward 0.25 before changing
      kp again.

      - If max_error stays near 0.06 m with line_loss_events of 1 or more and no oscillation,
      raise controller.kp from 4.0 toward 5.0. Iteration 2 showed that a larger ki
      hurt progress, so do not use ki to fix the drift.

      - If progress reaches about 0.995 with no line loss, raise controller.base_speed
      from 1.3 toward 1.8. Iteration 1 showed off-track exits at progress 0.10 to
      0.26, so speed only matters once the robot stays on the line.


      - [Open this output](iteration-3/entityR1/versions/9bfd2f390ef04ffe82990bc95c84ab91/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/d187f101264c47dcb81b8d07031f71d1/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-07eaf84570816036/payload.json)'
