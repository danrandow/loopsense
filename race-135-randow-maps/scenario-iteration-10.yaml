  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: 7-sensor finer array
    notes: 'Seven sensors at 0.027 m spacing across the same ±0.08 m span, with the
      iteration-7 body, track, mass and y 0.05 m lead unchanged. Chosen because the
      s-bend and slalom still stall at max_error about 0.062 with progress below 0.2,
      which meets the Integrator''s stated condition for a finer array.


      ### Rationale


      The best raced design is still iteration 7 (score 315.27), which iteration 9
      reverted to. Its design is body 0.10 x 0.12 m, track 0.10 m, mass 0.5 kg, 0.016
      m footprints, and five sensors at y 0.05 m spanning x = -0.08 to 0.08 m. The
      evidence since then points away from mass and sensor lead. Iteration 8 (y 0.03
      m) cut slalom progress from 0.186 to 0.075 and oval finish from 75% to 40%,
      so the shorter lead is ruled out. Iteration 7 (mass 0.5 kg) lowered s-bend progress
      to 0.140 with no slalom gain, so mass is not the limit. Sensing is no longer
      the limit either: line loss is near zero on the s-bend and slalom (0 and 0.2
      events), and the oval finish rate is 75%. Yet s-bend and slalom still end off_track
      at max_error about 0.062 to 0.064, with progress of 0.14 and 0.186. The Integrator''s
      conditional for this case is met: max_error stays at about 0.062 with progress
      below 0.2 at y 0.05 m. Their stated next step is a 7-sensor array at x = -0.08
      to 0.08 with 0.027 m spacing, keeping the 0.016 m footprint and y 0.05 m. I
      adopt that. Seven sensors give a finer centre-line signal, so the robot can
      see the tape''s edge earlier on the bends. The span, footprint, lead, track,
      body, wheel radius and mass are all unchanged, so the race isolates the array
      density. Expected result: s-bend and slalom max_error falls below 0.062 and
      their progress rises above about 0.19, while the oval finish rate holds at 75%
      or better. Risk: the extra sensors may add noise or change the signal scale,
      which would show up as higher oval oscillation. If the score falls below about
      300 or the oval finish rate drops below 65%, the next step is to revert to the
      five-sensor iteration 7 geometry.


      - [Open this output](iteration-10/entity0/versions/7953fc24e2474ef5afb1062bbbaceeca/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-c9df471d42350e95/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-247108739a293fdb/payload.json)'
  - id: entity1
    label: 7-sensor array test
    notes: 'Denser 7-sensor array at 0.0267 m spacing, with the iteration-7 mass,
      track, body and controller kept. Based on iteration 7 (315.3) as the best raced
      design, and on iteration 8 showing sensor lead must stay at 0.05 m. Revert to
      five sensors if the score drops below about 300.


      ### Rationale


      Iteration 7 (5 sensors, 0.04 m spacing, mass 0.5 kg, track 0.10 m, body 0.10
      x 0.12 m) is still the best raced design at 315.27. Its oval finish is 75%,
      and its s-bend and slalom max_error is stuck at about 0.062 to 0.064 with zero
      or near-zero line loss, so the limit is centre-line resolution or turn response,
      not line loss. Iteration 8 showed that sensor y 0.03 m is clearly worse, so
      y stays at 0.05 m. I adopt the Builder''s 7-sensor test: x = -0.08 to 0.08 at
      about 0.0267 m spacing, y 0.05 m, footprint 0.016 m, and every other geometry
      field unchanged. The controller weights scale as x/0.04, giving [-2, -1.333,
      -0.667, 0, 0.667, 1.333, 2], which keeps the iteration-7 signal sensitivity
      per metre. kp 6, ki 0.05, kd 0.9, base_speed 1.5 and last_direction are unchanged,
      so the race isolates array density. Expected result: s-bend and slalom max_error
      below 0.062 with progress above about 0.19, and oval finish at or above 65%.
      Risk: extra sensors could add noise and raise oval oscillation. If the score
      falls below about 300 or the oval finish falls below 65%, revert to the five-sensor
      iteration-7 geometry.


      - [Open this output](iteration-10/entity1/versions/26ff7833dc4b46d0be1f00185bb35ae3/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/7953fc24e2474ef5afb1062bbbaceeca/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-247108739a293fdb/payload.json)'
  - id: entityR1
    label: Next-step geometry
    notes: 'Pre-race feedback with three conditional changes: a small wheel_track
      step if the bends stay at max_error 0.062, a revert to five sensors if the oval
      finish falls below 65%, and a 0.012 m footprint if rms_error rises. Each is
      tied to iteration 1 to 8 evidence.


      ### Feedback


      Written before this candidate races, so no outcome is stated for it. Evidence:
      iteration 7 (5 sensors, 0.04 m spacing, y 0.05 m, mass 0.5 kg) scored 315.27,
      with oval finish 75%, s-bend progress 0.140 and slalom progress 0.186, and max_error
      about 0.062 to 0.064 on both bend tracks. Iteration 8 (y 0.03 m) fell to 209.2,
      so the sensor lead should stay at 0.05 m. Iteration 6 (mass 0.6 kg) gave s-bend
      0.181 and slalom 0.191, but the oval finish was 65%. Line loss is now near zero
      on all tracks, so the remaining bend limit is not sensing coverage. If the 7-sensor
      array keeps line loss at zero but s-bend and slalom max_error stays near 0.062
      with progress below 0.2, the limit is turn response, and wheel_track is the
      next geometry lever. If the oval finish falls below 65% or oval steering_oscillation
      rises above 0.25, the denser array is adding noise, so return to five sensors
      at the iteration-7 spacing.


      ### Requested changes


      - If s-bend and slalom max_error stays near 0.062 with progress below 0.2 and
      line loss stays near zero, keep the 7-sensor array and set wheel_track to 0.11
      m with mass 0.5 kg. Evidence: iteration 3 at track 0.12 gave s-bend progress
      0.177, while narrowing to 0.09 m lowered oval finish to 35% in iteration 5,
      so only a small step is safe.

      - If the oval finish falls below 65% with the 7-sensor array, revert to the
      five-sensor iteration-7 layout (x = -0.08, -0.04, 0, 0.04, 0.08 at y 0.05 m).
      Evidence: iteration 7 gave 75% oval finish at this layout, while iteration 8
      cut it to 40% when the lead changed.

      - If the 7-sensor array raises line_loss_events or rms_error, try sensor_size
      0.012 at the same 0.0267 m spacing, where the gap between footprints is 15 mm
      and is bridged by the 25 mm tape. Evidence: iteration 1 and 2 used 0.012 m footprints
      with rms_error 0.019 to 0.024, but the 0.04 m spacing with 0.012 m footprints
      left a 28 mm gap, which is wider than the tape.


      - [Open this output](iteration-10/entityR1/versions/26ff7833dc4b46d0be1f00185bb35ae3/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/7953fc24e2474ef5afb1062bbbaceeca/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-247108739a293fdb/payload.json)'
