map:
  id: race-135-randow-maps
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Sensor lead y 0.05→0.03
    notes: 'Keeps the mass 0.5 kg design that scored best (315.3) and moves all sensors
      20 mm closer to the axle. Iteration 7 showed mass does not lift s-bend or slalom
      progress (s-bend fell 0.181→0.140, slalom flat at 0.186), so sensor lead is
      the next lever. Oval oscillation (0.208) leaves headroom under 0.25.


      ### Rationale


      Iteration 7 (mass 0.5 kg, otherwise the iteration-6 design) is the best raced
      design at 315.27, up from 289.84. The gain came mostly from the oval, where
      the finish rate rose from 65% to 75% and steering_oscillation stayed at 0.208,
      under the 0.25 threshold. The mass lever did not help the other two tracks as
      hoped. S-bend progress fell from 0.181 to 0.140, and slalom progress stayed
      flat at 0.186 against 0.191. Both still end off_track at max_error about 0.062
      to 0.064, at the 0.06 m floor, with zero or near-zero line loss. Mass is therefore
      not the limit on the s-bend and slalom. The Integrator''s rule for ''progress
      stays at about 0.18 and 0.19 at mass 0.5 kg'' applies, because the slalom is
      flat and the s-bend has moved backwards, so I move to the next lever: sensor
      lead. Every sensor y goes from 0.05 to 0.03 m. The x positions, the 0.016 m
      footprint, the 0.10 m track, the 0.10 m body, the 0.12 m width, the 0.03 m wheel
      radius and the 0.5 kg mass stay fixed, so the race isolates the lead change.
      Oval oscillation has headroom (0.208 against 0.25), so a shorter lead is affordable
      there. The lead reduction is also the step the Integrator named for the oscillation
      and drift cases. Expected result: s-bend and slalom progress recover above about
      0.18 with max_error no worse than 0.062, and the oval finish rate holds at 65%
      or more. Risk: a shorter look-ahead could raise max_error on the sharpest bends,
      which the s-bend race will show. If the s-bend or slalom gets worse, the next
      step is to return y to 0.05 and test wheel_track 0.11 or a sensor span change.


      - [Open this output](iteration-8/entity0/versions/5eda8daeaa25414b800a532edae543dd/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-8cda1fb78867bb4a/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-247108739a293fdb/payload.json)'
  - id: entity1
    label: Sensor lead y 0.03 test
    notes: 'Complete robot with the Builder''s sensor lead moved from y 0.05 to 0.03
      m, mass 0.5 kg and the iteration-7 controller unchanged, so the race isolates
      the lead. Sensor lead has never been varied before, so the expected change is
      untested.


      ### Rationale


      The Builder''s iteration-8 proposal moves all five sensors from y = 0.05 m to
      y = 0.03 m and keeps the iteration-7 geometry otherwise: mass 0.5 kg, track
      0.10 m, body 0.10 x 0.12 m, x = -0.08 to 0.08 at 0.04 m spacing, and a 0.016
      m footprint. I copied that geometry exactly, so any change in the race comes
      from the sensor lead alone. Sensor lead has not been varied in any earlier iteration,
      so there is no race evidence for it. The controller stays at the iteration-7
      values (kp 6, ki 0.05, kd 0.9, base_speed 1.5, weights [-2, -1, 0, 1, 2], last_direction).
      Keeping it fixed isolates the lead change, which the Builder''s test plan depends
      on. The oval steering_oscillation was 0.208 at y = 0.05 and must stay below
      0.25. Because the sensors now sit closer to the axle, the controller sees less
      look-ahead, so the lag may change, and kd is not retuned until the race shows
      whether that matters. The oval and bend limits are the watch points. I added
      controller_errors to the Builder''s measurement list so that exceptions are
      visible.


      - [Open this output](iteration-8/entity1/versions/38c114640cc545528020cfaf2459f17a/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/5eda8daeaa25414b800a532edae543dd/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-247108739a293fdb/payload.json)'
  - id: entityR1
    label: 'Lead test: return rules'
    notes: 'Feedback is written before the race and states no outcome. It gives rules
      to return y to 0.05 m if the bends get worse, and to restore mass 0.6 kg if
      oval oscillation exceeds 0.25, based on the iteration 6 and 7 results.


      ### Feedback


      Written before this candidate races, so no outcome is stated for it. Evidence
      so far: iterations 0 to 7 all used sensor y = 0.05 m, so sensor lead has never
      been tested and this is the first real test of it. In iteration 6 (mass 0.6
      kg, track 0.10 m, body 0.10 m) the s-bend and slalom progress was 0.181 and
      0.191, with max_error about 0.062 to 0.065 and the oval finish rate at 65%.
      In iteration 7 the mass was reduced to 0.5 kg with everything else unchanged.
      The s-bend progress fell to 0.140 and the slalom stayed flat at 0.186, so mass
      is not the limit on those tracks, and returning to lower mass is not a good
      next step. The Integrator has kept the controller fixed so this race isolates
      the lead change. Decide the next step from the race. If the s-bend and slalom
      progress rise above about 0.18 with max_error no worse than 0.062 m, keep y
      at 0.03 m. If the s-bend progress falls below 0.14 or max_error rises above
      0.065 m, the shorter lead is too late for the bends, so return y to 0.05 m.
      If the oval steering_oscillation rises above 0.25, restore mass to 0.6 kg while
      keeping y at 0.03 m.


      ### Requested changes


      - If s-bend progress falls below 0.14 or max_error rises above 0.065 m at y
      0.03 m, return every sensor y to 0.05 m and keep mass at 0.5 kg. Evidence: iteration
      7 (mass 0.5 kg, y 0.05 m) gave s-bend progress 0.140, so a lead shorter than
      that may be worse on the bends.

      - If the oval steering_oscillation rises above 0.25 with y 0.03 m, set mass
      back to 0.6 kg with x and the other geometry fixed. Evidence: iteration 6 oval
      oscillation was 0.216 at mass 0.6 kg and iteration 7 was 0.208 at mass 0.5 kg,
      both at y 0.05 m, so the oval is near the threshold and mass 0.6 kg is the known-stable
      setting.

      - If the s-bend and slalom progress are both above 0.18 with max_error at or
      below 0.062 m at y 0.03 m, keep the lead and try sensor_size 0.012 with the
      same x positions. Evidence: sensor_size 0.012 gave lower rms_error in iterations
      1 and 2 (0.024 and 0.019), while 0.016 m gave 0.019 to 0.022 in iterations 3
      to 7, so a smaller footprint is worth testing once the lead is settled.


      - [Open this output](iteration-8/entityR1/versions/38c114640cc545528020cfaf2459f17a/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/5eda8daeaa25414b800a532edae543dd/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-247108739a293fdb/payload.json)'
