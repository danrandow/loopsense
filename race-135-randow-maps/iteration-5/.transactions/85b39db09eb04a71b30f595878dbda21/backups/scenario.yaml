  id: race-135-randow-maps
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Narrower track 0.09 m
    notes: 'Applies the Integrator''s rule for turn-response limits: the s-bend and
      slalom still ended off_track at max_error about 0.062 with progress below 0.3.
      Wheel track narrows to 0.09 m and mass to 0.6 kg, with the ±0.08 m array fixed.
      The s-bend progress fell when the track narrowed earlier, so overshoot is flagged
      as a risk to check.


      ### Rationale


      Iteration 4 (wheel_track 0.10, body_length 0.12, mass 0.7, with the validated
      ±0.08 m, 0.04 m-spacing, 0.016 m array) kept line loss at zero on every track
      and held rms_error at about 0.02. The oval finish rate stayed above the 55%
      floor at 65%, and oval steering_oscillation fell to 0.174, below the 0.25 threshold.
      The s-bend and slalom still ended off_track, with max_error at 0.0617 and 0.0618,
      at the 0.06 m floor, and progress only 0.127 and 0.093. The Integrator''s stated
      rule matches this case: s-bend or slalom still off_track at max_error near 0.06
      m with progress below 0.3 means turn response is still the limit, so I set wheel_track
      to 0.09 m and mass to 0.6 kg. The array stays fixed at ±0.08 m, so sensing is
      unchanged. Sensor y stays at 0.05 because oval oscillation is below 0.25. The
      oval finish rate is 65%, so the revert-to-0.12 m rule does not apply. There
      is a counter-signal I am recording rather than ignoring: s-bend progress fell
      from 0.177 (iteration 3, track 0.12) to 0.127 when the track narrowed. Narrowing
      raises the turn gain per PWM count with kp fixed, so the robot may be overshooting
      rather than lagging on the s-bend. The change is still the agreed next step,
      and the measurements requested below will show whether progress recovers. Expected
      result: max_error on the s-bend and slalom falls below 0.06 m, or at least progress
      rises above 0.13 on the s-bend. Oval finish rate holds at or above 55%.


      - [Open this output](iteration-5/entity0/versions/99ba92235f83478daa182116bba9d53c/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-90ce3117b43ac021/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-0f0eb64b7c597c73/payload.json)'
  - id: entity1
    label: Narrow track 0.09, mass
    notes: 'Applies the Builder''s contingency on the validated ±0.08 m sensor array,
      keeping the iteration 4 controller so the race isolates the geometry change.
      Evidence is iteration 4, where line loss was zero and the s-bend and slalom
      still failed at max_error 0.062.


      ### Rationale


      Iteration 4 (wheel_track 0.10, body_length 0.12, mass 0.7, validated ±0.08 m,
      0.04 m spacing, 0.016 m footprint array) kept line loss at zero on all tracks
      and held rms_error near 0.02. Oval finish rate was 65% and oval steering_oscillation
      0.174, both within target. The s-bend and slalom still ended off_track at max_error
      about 0.062 with progress 0.127 and 0.093, so turn response is still the limit.
      I apply the Builder''s requested contingency: wheel_track 0.09 m and mass 0.6
      kg. The sensor array, sensor y 0.05, body 0.12 x 0.12 m and wheel radius 0.03
      m are unchanged, so sensing is not varied. Narrowing the track raises turn gain
      per PWM count by about 1.11x, and the lower mass reduces yaw inertia, so I keep
      kp 6, ki 0.05, kd 0.9 and base_speed 1.5 to isolate the geometry change. The
      main risk is overshoot: s-bend progress fell from 0.177 to 0.127 when the track
      narrowed earlier, so if progress falls again or oval oscillation rises above
      0.25, the next step should return to a 0.10 m track. Expected result: s-bend
      and slalom max_error below 0.06 m with progress above 0.13, and oval finish
      rate at or above 55%.


      - [Open this output](iteration-5/entity1/versions/ea99b28ee44a4d0ea145bcb9a312cef4/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/99ba92235f83478daa182116bba9d53c/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-0f0eb64b7c597c73/payload.json)'
  - id: entityR1
    label: Overshoot checks and
    notes: 'Gives the Builder three contingencies for the next race: revert to track
      0.10 if s-bend progress or oval oscillation worsens, try a lighter shorter body
      if turn response still limits, and return to track 0.10 if the oval finish rate
      drops. Each is tied to iteration 2 to 4 results.


      ### Feedback


      Written before this candidate races, so no outcome is stated for it. Iteration
      3 (±0.08 m, 0.04 m spacing, 0.016 m footprint, track 0.12) removed s-bend and
      slalom line loss (0.6 and 0.95 down to 0), but the oval finish rate fell to
      45%. Iteration 4 (track 0.10, body 0.12, mass 0.7) raised the oval finish rate
      to 65% with oval oscillation 0.174, but the s-bend and slalom still ended off_track
      at max_error about 0.062 with progress 0.127 and 0.093. The limit is now turn
      response, not sensing. Decide the next change from the race. If the s-bend or
      slalom still end off_track at max_error near 0.06 m with progress not improving,
      keep the 0.09 m track and try a lighter body, for example body_length 0.10 m,
      rather than further narrowing. If s-bend progress falls below 0.127 or oval
      steering_oscillation rises above 0.25, the turn gain is overshooting, so return
      wheel_track to 0.10 m and reduce sensor lead by moving sensor y to 0.03 m. If
      the oval finish rate falls below 55% while line loss stays at zero, return wheel_track
      to 0.10 m and keep the lighter mass.


      ### Requested changes


      - If s-bend progress falls below 0.127 or oval steering_oscillation rises above
      0.25 at wheel_track 0.09 m, return wheel_track to 0.10 m and move sensor y from
      0.05 to 0.03 with x fixed. Evidence: s-bend progress fell from 0.177 at track
      0.12 to 0.127 at track 0.10, and oval oscillation was 0.267 in iteration 2 and
      0.275 in iteration 1.

      - If the s-bend or slalom still end off_track at max_error near 0.06 m with
      progress below 0.3 at track 0.09 m, keep the track and try body_length 0.10
      m with mass 0.5 kg, leaving the sensor array fixed. Evidence: iteration 4 (track
      0.10, mass 0.7) still had max_error 0.062 and progress 0.127 and 0.093, so the
      chassis needs to be lighter and shorter.

      - If the oval finish rate falls below 55% with line loss still at zero, return
      wheel_track to 0.10 m and keep mass at 0.6 kg. Evidence: track 0.10 gave a 65%
      oval finish rate in iteration 4, while track 0.12 gave 45% in iteration 3 with
      the same sensor array.


      - [Open this output](iteration-5/entityR1/versions/ea99b28ee44a4d0ea145bcb9a312cef4/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/99ba92235f83478daa182116bba9d53c/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-0f0eb64b7c597c73/payload.json)'
