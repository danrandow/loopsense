  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Mass 0.5 kg test
    notes: 'Keeps the iteration-6 layout (track 0.10, body 0.10 m, five-sensor ±0.08
      array) and cuts mass from 0.6 to 0.5 kg. Iteration 6 raised s-bend and slalom
      progress to 0.18 and 0.19 with zero line loss, so this tests whether mass is
      the next limit.


      ### Rationale


      Iteration 6 (wheel_track 0.10, body 0.10 x 0.12, mass 0.6, sensor array x =
      -0.08 to 0.08 at 0.04 m spacing, 0.016 m footprint, y 0.05) is the best design
      so far at 289.8. Its oval finish rate is 65%, with zero line loss on the oval
      and 0.1 events per run, and oval steering_oscillation is 0.216, under the 0.25
      threshold. The s-bend and slalom improved clearly over iteration 4: progress
      rose from 0.127 to 0.181 on the s-bend and from 0.093 to 0.191 on the slalom.
      Both still end off_track at max_error about 0.062 to 0.065, which is at or just
      above the 0.06 m floor. The Integrator''s feedback sets a conditional rule:
      if s-bend or slalom progress rises above 0.13 while max_error stays near 0.06
      m, the body and mass lever is working, so the next step is mass 0.5 kg with
      track 0.10 m and body_length 0.10 m fixed. Iteration 6 meets that condition
      (0.181 and 0.191 progress, max_error about 0.06). The narrower track and the
      0.12 m body were both ruled out by the oval results, so I keep track 0.10 m
      and body_length 0.10 m. Sensing is unchanged because line loss is near zero,
      and sensor y stays at 0.05 because oval oscillation is below 0.25. I am reducing
      mass only, so the race isolates the mass effect. Expected result: s-bend and
      slalom progress rise above 0.2 with max_error still near 0.06 m, and the oval
      finish rate holds at or above 55%. Risk: a lighter robot may raise oval steering_oscillation
      or overshoot, which the oval race will show.


      - [Open this output](iteration-7/entity0/versions/8d8015dc92004b3098542153c1b32cd5/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-35579d34b27ef189/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-84aab6e112ef2ba5/payload.json)'
  - id: entity1
    label: Mass 0.5 kg, controller
    notes: 'Complete robot with the Builder''s mass cut from 0.6 to 0.5 kg, sensors
      and controller unchanged from iteration 6. The change follows iteration 6, where
      s-bend and slalom progress rose to 0.181 and 0.191.


      ### Rationale


      Iteration 6 (track 0.10, body 0.10 x 0.12, mass 0.6, sensors x = -0.08 to 0.08
      at 0.04 m, 0.016 m footprint, y 0.05) is the best design so far at 289.8. Its
      s-bend and slalom progress rose to 0.181 and 0.191, against 0.127 and 0.093
      in iteration 4 and 0.132 and 0.091 in iteration 5. Line loss is zero on the
      s-bend and 0.2 per run on the slalom, and the oval finish rate is 65% with steering_oscillation
      0.216. The s-bend and slalom still end off_track at max_error about 0.062 to
      0.065, just above the 0.06 m floor. The Builder''s geometry changes only the
      mass, from 0.6 to 0.5 kg, and keeps the rest of iteration 6 fixed, so the race
      isolates the mass effect. I keep the controller identical to iteration 6 (kp
      6, ki 0.05, kd 0.9, base_speed 1.5, weights [-2, -1, 0, 1, 2], last_direction).
      Lighter mass lowers yaw inertia and raises turn response per unit of turn command,
      so it should lift s-bend and slalom progress without changing sensing. Oval
      steering_oscillation is at 0.216, so a rise to above 0.25 is the main risk.
      kd is held at 0.9 for now because the oval oscillation headroom is limited but
      not yet breached. Expected result: s-bend and slalom progress above 0.2 with
      max_error near 0.06 m, and an oval finish rate at or above 55%. This is a prediction,
      not a measured result.


      - [Open this output](iteration-7/entity1/versions/503d297da1e3406abee305ffc8eb3fb4/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/8d8015dc92004b3098542153c1b32cd5/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-84aab6e112ef2ba5/payload.json)'
  - id: entityR1
    label: Mass-then-sensor-lead
    notes: 'Feedback tells the Builder to go to mass 0.4 kg if progress rises, and
      to lower sensor y to 0.03 if progress stalls or oval oscillation exceeds 0.25.
      It rests on iteration 6 (289.8), iteration 4 and iteration 5.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. Evidence:
      iteration 6 (track 0.10, body_length 0.10, mass 0.6) is the best design so far
      at 289.8. Its s-bend and slalom progress rose to 0.181 and 0.191, from 0.127
      and 0.093 in iteration 4 (body 0.12, mass 0.7), so shortening the body and reducing
      mass together helped where track narrowing to 0.09 m did not (iteration 5: 0.132
      and 0.091, with oval finish down to 35%). The s-bend and slalom still end off_track
      at max_error about 0.062 to 0.065, and body_width cannot help because the off-track
      limit is already at its 0.06 m floor across the allowed range. Oval steering_oscillation
      in iteration 6 was 0.216, close to the 0.25 threshold. Decide the next change
      from the race. If s-bend and slalom progress rise above 0.13 with max_error
      near 0.06 m, the mass lever is working, so keep going down in mass. If progress
      does not move from iteration 6, mass is not the limit and the next lever is
      the sensor lead. If the oval finish rate drops below 55% or oscillation exceeds
      0.25, the robot is over-responding and the lighter mass needs a lower sensor
      lead.


      ### Requested changes


      - If s-bend or slalom progress rises above 0.19 with max_error near 0.06 m at
      mass 0.5 kg, keep track 0.10 m and body_length 0.10 m, and try mass 0.4 kg (the
      contract minimum). Evidence: iteration 6 (mass 0.6) gave s-bend 0.181 and slalom
      0.191 progress, against 0.127 and 0.093 at mass 0.7 in iteration 4, so mass
      is the main remaining lever.

      - If s-bend and slalom progress stay at about 0.18 and 0.19 at mass 0.5 kg,
      or the oval steering_oscillation rises above 0.25, move every sensor y from
      0.05 to 0.03 with x and the other geometry fixed. Evidence: oval oscillation
      was 0.216 in iteration 6 and 0.275 in iteration 1 at a longer lead, so a shorter
      sensor lead is the next step for both cases.

      - If the oval finish rate falls below 55% with line loss still zero, return
      mass to 0.6 kg and keep the 0.10 m track and 0.10 m body. Evidence: iteration
      6 gave a 65% oval finish at mass 0.6, while iteration 5 fell to 35% when the
      track was narrowed to 0.09 m.


      - [Open this output](iteration-7/entityR1/versions/503d297da1e3406abee305ffc8eb3fb4/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/8d8015dc92004b3098542153c1b32cd5/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-84aab6e112ef2ba5/payload.json)'
