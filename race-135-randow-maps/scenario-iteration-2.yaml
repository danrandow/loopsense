map:
  id: race-135-randow-maps
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Span ±0.06 m, 5 sensors
    notes: 'Widens the sensor span from ±0.04 m to ±0.06 m at 0.03 m spacing, keeping
      all else fixed. Iteration 1 cut line losses only to about 1 per run and max_error
      stayed at the 0.06 m limit (score 129.96), so the footprint still does not reach
      the drift far enough out.


      ### Rationale


      Iteration 1 (sensor span ±0.04 m) scored 129.96, up from 56.86 at ±0.03 m. The
      gain is real but incomplete. Every run still ended off_track with progress 0.16
      to 0.53, line_loss_events stayed at about 1.0 to 1.05 per run, and max_error
      was 0.062 to 0.069, at or above the 0.06 m off-track limit. The sensor footprint
      still does not cover the drift far enough out. The Integrator''s rule for this
      case is to widen the span to ±0.06 at 0.03 m spacing. Steering oscillation is
      0.22 to 0.27 by track (mean about 0.24), so the sensor-lead reduction is not
      yet triggered on average. The oval alone (0.275) is above the 0.25 threshold,
      and I will watch it, but I am not changing sensor y in the same step so that
      the span change can be attributed cleanly. rms_error (0.024 to 0.031) is not
      the limiting factor, so sensor_size stays at 0.012. body_width stays at 0.12
      because the off-track limit is already at its floor and cannot help. I expect
      line_loss_events to fall toward 0 and max_error to drop below 0.06 m, with progress
      rising on the oval and s-bend. The risk is that a wider array adds some oscillation,
      which the next race will show.


      - [Open this output](iteration-2/entity0/versions/225582119af44c25953360274500db39/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-6047e2c0b3b4ad4b/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-8e6f40c180e4fba1/payload.json)'
  - id: entity1
    label: ±0.06 span, weights
    notes: 'Robot package for the Builder''s ±0.06 m five-sensor array. Weights are
      scaled to x/0.04, clipped at ±1.5, so the loop keeps the sensitivity that worked
      in iteration 1, and kd is raised to 0.7 for oscillation damping.


      ### Rationale


      Iteration 0 (±0.03 m span) drifted off the line on every trial, with max_error
      at the 0.06 m limit and 1 to 2 line-loss events per run. Iteration 1 (±0.04
      m span, kp 6, kd 0.6) kept the same failure mode with progress 0.16 to 0.53
      and line_loss_events about 1.05 per run, so the span was still too narrow. The
      Builder''s geometry widens the span to ±0.06 m at 0.03 m spacing. Because the
      steering signal is a weighted average, a wider span lowers the signal change
      per metre of lateral error by about 1.5x, which would weaken the loop that held
      the line well enough in iteration 1. To keep the tuned sensitivity, I scale
      the sensor weights to x/0.04 and clip them to ±1.5 at the outer sensors, giving
      [-1.5, -0.75, 0, 0.75, 1.5]. This keeps kp at 6 and kd near 0.6 to 0.7. The
      iteration 1 oval oscillation (0.275) is already above the 0.25 threshold, so
      I raise kd slightly to 0.7 for damping and keep ki at 0.05 and base_speed at
      1.5 so the change stays attributable to the span. Expected result: line_loss_events
      fall toward 0 and max_error drops below 0.06 m. The risk is that the outer sensors
      add oscillation, which the race will show.


      - [Open this output](iteration-2/entity1/versions/ecec92bebe284727b09dc00720c74e86/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/225582119af44c25953360274500db39/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-8e6f40c180e4fba1/payload.json)'
  - id: entityR1
    label: Widen span next if losses
    notes: 'Feedback written before the race. It cites iterations 0 and 1, where line
      losses and max_error at the limit persisted, and gives three conditional changes:
      widen to ±0.08, move sensor y to 0.03 if oscillation rises, or shrink sensor_size
      if rms stays high.


      ### Feedback


      This feedback is written before the ±0.06 m candidate races, so it states no
      outcome for it. The evidence so far is iteration 0 (±0.03 m, all 60 trials off_track,
      progress 0.11 to 0.16, max_error 0.060 to 0.066, line_loss_events 1 to 2) and
      iteration 1 (±0.04 m with kp 6, all trials off_track, progress 0.16 to 0.53,
      line_loss_events about 1.05, max_error 0.062 to 0.069, steering_oscillation
      0.22 to 0.27). Widening the span from ±0.03 to ±0.04 m did not remove line loss,
      so the span is still the main limit. I have kept your ±0.06 m span and scaled
      the controller weights to match, so the controller is not the thing to change.
      Decide the next step from the race. If line_loss_events stay at 1 or more and
      max_error stays at or near 0.06 m, widen the span further toward ±0.08 m, which
      is the limit, at 0.04 m spacing. If steering_oscillation on the oval rises above
      about 0.25, the sensor lead is the suspect, so move sensor y from 0.05 to 0.03.
      If line losses are gone but rms_error stays above 0.03, the footprint is too
      large for the 25 mm tape, so try sensor_size 0.008. body_width is not a lever,
      because the off-track limit is already at its floor.


      ### Requested changes


      - If line_loss_events stay at or above 1 and max_error stays near 0.06 m with
      the ±0.06 m span, widen sensor_positions to x = ±0.08 at 0.04 m spacing (x =
      -0.08, -0.04, 0, 0.04, 0.08). Evidence: iteration 0 (±0.03) had 1 to 2 line
      losses per run, and iteration 1 (±0.04) still had about 1.05 losses per run
      with max_error 0.062 to 0.069, so the span has not yet covered the drift.

      - If steering_oscillation on the oval rises above about 0.25 with the wider
      span, move every sensor''s y from 0.05 to 0.03, with x and the other fields
      fixed. Evidence: iteration 1 oval steering_oscillation was 0.275 and iteration
      0 was 0.17, so the oval is already near the threshold.

      - If line losses are zero but rms_error stays above about 0.03, change sensor_size
      from 0.012 to 0.008. Evidence: iteration 1 rms_error was 0.024 to 0.031 with
      about 1 line loss per run, so this is a secondary lever to try only after line
      loss is fixed.


      - [Open this output](iteration-2/entityR1/versions/ecec92bebe284727b09dc00720c74e86/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/225582119af44c25953360274500db39/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-8e6f40c180e4fba1/payload.json)'
