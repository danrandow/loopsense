  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: ±0.08 span, 16mm sensors
    notes: 'Widens the sensor span from ±0.06 m to the ±0.08 m limit at 0.04 m spacing,
      and enlarges the footprint to 16 mm so the 25 mm tape can never fall between
      sensors. Based on iteration 2 (score 272), where the s-bend and slalom still
      lost the line 0.6 to 0.95 times per run and hit max_error at the 0.06 m floor.


      ### Rationale


      Iteration 2 (±0.06 m span, 0.03 m spacing) scored 272.25, up from 129.96 at
      ±0.04 m. The oval finish rate is now 55%, with 0.35 line-loss events per run
      and max_error 0.049. The s-bend and slalom still fail: they show 0.6 and 0.95
      line-loss events per run, with max_error 0.063 and 0.066, which is at the 0.06
      m off-track floor. The Integrator''s rule for persistent line loss at the limit
      is to widen the span to ±0.08 m at 0.04 m spacing, and that is the next step.
      The oval steering_oscillation of 0.267 is already above the 0.25 threshold,
      so the sensor-lead reduction (y 0.05 to 0.03) is also in play. I am not making
      that change yet. Moving the sensors closer to the axle would cut the look-ahead
      the controller needs on the sharpest bends, where the losses are concentrated,
      and changing it alongside the span would confound the result. I will hold y
      at 0.05 and read the oscillation in the next race. Sensor size also needs a
      change. At 0.04 m spacing with a 0.012 m footprint, the gap between neighbouring
      footprints is 28 mm, which is larger than the 25 mm tape. The tape can therefore
      sit between two sensors and be seen by neither, which causes line loss at the
      centre. A 0.016 m footprint leaves a 24 mm gap, which is always bridged by the
      tape, so at least one sensor always reads it. I keep five sensors so the Integrator
      does not need to change the array length. body_width, wheel, mass and body values
      stay unchanged because they are not limiting. Expected result: line_loss_events
      fall toward 0 on the s-bend and slalom, max_error drops below 0.06 m, and the
      oval finish rate rises. Possible costs are a coarser reading, which could raise
      rms_error, and oscillation above 0.25 on the oval.


      - [Open this output](iteration-3/entity0/versions/bd7d508412a84231b4b308a553cb435d/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-d9d5f282aa1cd3c8/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-7d5cfedc0f31c780/payload.json)'
  - id: entity1
    label: Wide ±0.08 m array, kd
    notes: 'Widens the sensor span to ±0.08 m with 0.016 m footprints, as the Builder
      requested, and scales weights to x/0.04. kd is raised to 0.8 because oval oscillation
      was 0.267 in iteration 2. Evidence: iteration 2 s-bend and slalom still lost
      the line.


      ### Rationale


      Iteration 2 (±0.06 m span, 0.012 m footprints) scored 272.25. The oval finished
      55% of trials, but the s-bend and slalom still ended off_track with 0.6 and
      0.95 line-loss events per run and max_error at the 0.06 m floor. Line loss persisted
      at the outer edge, so I adopt the Builder''s ±0.08 m span at 0.04 m spacing.
      The Builder''s 0.016 m footprint leaves a 24 mm gap, which the 25 mm tape bridges.
      The sensor weights are scaled to x/0.04, giving [-2, -1, 0, 1, 2], which keeps
      the same signal sensitivity per metre as iteration 1 and stays inside the ±2
      weight limit. kp stays at 6 and base_speed at 1.5. Oval steering_oscillation
      was 0.267 in iteration 2, above the 0.25 threshold, so kd rises from 0.7 to
      0.8 for damping. I keep sensor y at 0.05 for now so the span change can be read
      cleanly. Expected: line_loss_events fall on the s-bend and slalom, and max_error
      drops below 0.06 m. Risks: the wider array may add oscillation, and the 0.016
      m footprint may coarsen rms_error.


      - [Open this output](iteration-3/entity1/versions/7b2f8f3c84894f52a3c3d72f22c0e23d/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/bd7d508412a84231b4b308a553cb435d/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-7d5cfedc0f31c780/payload.json)'
  - id: entityR1
    label: Span and oscillation
    notes: 'Feedback before the race with three changes to try next: a 7-sensor array
      if losses persist, sensor y 0.03 if oscillation exceeds 0.25, and sensor_size
      0.012 if rms_error stays high. Each is tied to iteration 1 and 2 results.


      ### Feedback


      Written before this candidate races, so no outcome is stated for it. Evidence
      so far: iteration 0 (±0.03 m) had all trials off_track, with 1 to 2 line losses
      and max_error at the 0.06 m floor. Iteration 1 (±0.04 m, kp 6) still had about
      1.05 losses per run, with max_error 0.062 to 0.069. Iteration 2 (±0.06 m) scored
      272.25, with the oval at 55% finish, but the s-bend and slalom still had 0.6
      and 0.95 losses per run. Span is still the main limit. I have adopted your ±0.08
      m span at 0.04 m spacing and your 0.016 m footprint, and I scaled the weights
      to x/0.04. Decide the next change from the race: if s-bend or slalom line_loss_events
      stay at or above 0.5 with max_error near 0.06 m, the span is still limiting,
      so try a 7-sensor array at ±0.08 m with 0.027 m spacing. If oval steering_oscillation
      rises above 0.25 (it was 0.267 in iteration 2), move sensor y from 0.05 to 0.03
      with x fixed. If line losses are gone but rms_error stays above 0.03, the 0.016
      m footprint is too coarse, so try sensor_size 0.012.


      ### Requested changes


      - If s-bend or slalom line_loss_events stay at or above 0.5 with max_error near
      0.06 m, try a 7-sensor array at x = -0.08 to 0.08 with 0.027 m spacing, keeping
      sensor_size 0.012. Evidence: iteration 2 had 0.6 and 0.95 losses per run with
      max_error 0.063 and 0.066 at the ±0.06 m span.

      - If oval steering_oscillation rises above 0.25, move every sensor y from 0.05
      to 0.03, keeping x and the other fields fixed. Evidence: iteration 2 oval steering_oscillation
      was 0.267 and iteration 1 was 0.275, both above the threshold.

      - If line losses are zero but rms_error stays above 0.03, change sensor_size
      from 0.016 to 0.012. Evidence: iteration 1 rms_error was 0.024 to 0.031 with
      the 0.012 m footprint, and the 0.016 m footprint is untested.


      - [Open this output](iteration-3/entityR1/versions/7b2f8f3c84894f52a3c3d72f22c0e23d/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/bd7d508412a84231b4b308a553cb435d/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-7d5cfedc0f31c780/payload.json)'
