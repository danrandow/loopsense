map:
  id: race-122-opt-eval
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: kd 0.35 on kp 3.0 build
    notes: 'Single-lever test: iteration 7''s best raced build (kp 3.0, ki 0.2, kd
      0.4, y=0.07) with kd lowered to 0.35 as the Evaluator requested. It targets
      the oval oscillation rise (0.341 in iteration 7) while checking that progress
      holds (oval 0.741, s-bend 0.312).


      ### Rationale


      Evidence: the best raced build is iteration 7 (kp 3.0, ki 0.2, kd 0.4, y=0.07,
      base_speed 1.0, score 162.45). Forward sensors (y 0.05 to 0.07) raised oval
      and s-bend progress, and kd 0.4 raised progress on every track. Iteration 6
      showed that ki 0.3 lowered the score with no progress gain, so ki stays at 0.2.
      The Evaluator''s requested change is the clean test: keep the iteration-7 controller
      and change only kd, from 0.4 to 0.35. The evidence on kd is mixed. kd 0.3 to
      0.4 raised progress on every track, but it also raised oval steering_oscillation
      (0.075 to 0.283). Lowering kd to 0.35 is a test of whether oscillation can fall
      while progress holds. Changes from iteration 7: controller.kd 0.4 to 0.35, and
      nothing else. Geometry is unchanged (y=0.07, x = -0.05 to 0.05, sensor_size
      0.012, weights [-1, -0.5, 0, 0.5, 1]), base_speed stays at 1.0, and line_loss
      stays ''last_direction''. Survival still comes before speed. Expected result:
      oval steering_oscillation below the 0.341 measured in iteration 7, with s-bend
      progress near 0.31 and oval progress near 0.74. The risk is that progress falls
      below the Evaluator''s thresholds (s-bend 0.31, oval 0.67), in which case kd
      returns to 0.4. Hypotheses: (a) kd 0.35 reduces bend jitter without losing much
      damping, so oscillation falls with progress held; (b) line loss and max_error
      stay near 0.06, so the drift is still geometric or a mismatch problem. Measurements
      wanted per track and per seed: completion, progress, completion_time, rms_error,
      max_error, line_loss_events, steering_oscillation and control_effort, so the
      kd effect can be compared with iteration 7 on each track.


      - [Open this output](iteration-8/entity0/versions/bdecd42ac3ca4446ab4bf9fbfe7a93f6/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/c6959d1c6cbd42a8a78d9caaed0110ce/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-9a0202638004e62d/payload.json)'
  - id: entityR1
    label: Approve kd 0.35 test
    notes: 'Approved the iteration-7 best build with kd lowered from 0.4 to 0.35,
      a single-lever test of whether bend oscillation can fall without losing progress.
      Rests on iteration 4 (kd 0.3 to 0.4 raised progress on all tracks but also oscillation)
      and iteration 7 (best score 162.45).


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      candidate is the iteration-7 build (score 162.45, the best raced design) with
      one change: controller.kd from 0.4 to 0.35. Geometry (sensors at y=0.07, x from
      -0.05 to 0.05, weights [-1, -0.5, 0, 0.5, 1], sensor_size 0.012), kp 3.0, ki
      0.2, base_speed 1.0 and line_loss ''last_direction'' are unchanged, so the race
      isolates damping.


      Evidence: iteration 4 versus iteration 3 (same controller except kd 0.3 to 0.4)
      raised progress on every track (oval 0.12 to 0.48, s-bend 0.15 to 0.26, slalom
      0.11 to 0.125), but it also raised oval steering_oscillation (0.075 to 0.283)
      and s-bend oscillation (0.139 to 0.202). Iteration 7 kept kd 0.4 and kp 3.0
      and scored best. Iteration 6 showed that ki 0.3 lowered the score (oval progress
      0.666 to 0.571), so ki stays at 0.2. Iteration 5 showed that forward sensors
      (y 0.05 to 0.07) raised oval and s-bend progress, so geometry stays.


      The kd 0.35 test is a fair middle-point check. It is a small move from the best
      build and tests whether oscillation can fall while progress holds. Survival
      still comes before speed, so base_speed stays at 1.0.


      Read the next race as follows. If oval progress stays near 0.74 and s-bend near
      0.31 with oval steering_oscillation below 0.341, keep kd 0.35 and try controller.kp
      3.5, since max_error has stayed near 0.06 and the kp 2.5 to 3.0 step was the
      first gain step that did not hurt. If progress falls below about 0.67 on the
      oval or 0.31 on the s-bend, return kd to 0.4, because the progress gain from
      damping outweighs the oscillation cost. Do not raise base_speed while any track
      ends off track early.


      ### Requested changes


      - After race 8: if oval progress stays near 0.74 and s-bend near 0.31 with oval
      steering_oscillation below 0.341, keep kd 0.35 and try controller.kp 3.5, since
      iteration 7 (kp 3.0) was the best and kp 2.5 to 3.0 did not reduce progress.

      - After race 8: if oval progress falls below about 0.67 or s-bend progress below
      about 0.31, return controller.kd to 0.4 (the iteration-7 value), because iteration
      4 showed kd 0.4 gave the largest progress gain across all tracks.

      - Keep geometry.sensor_positions at y=0.07, ki at 0.2 and base_speed at 1.0
      in the next revision, because iteration 5 confirmed forward sensors and iteration
      6 showed that ki 0.3 lowered the score.


      - [Open this output](iteration-8/entityR1/versions/5d74dff810b14d25b9e53cdc16ef18bc/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/bdecd42ac3ca4446ab4bf9fbfe7a93f6/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-9a0202638004e62d/payload.json)'
