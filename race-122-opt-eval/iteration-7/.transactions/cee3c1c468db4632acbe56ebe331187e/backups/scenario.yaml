map:
  id: race-122-opt-eval
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: kp 3.0, ki reverted 0.2
    notes: 'Reverts ki to 0.2 because ki 0.3 cut oval progress (0.67 to 0.57) and
      lowered the score (160 to 139). Tests kp 3.0 on the best iteration-5 build,
      since max_error stayed near 0.06 on every track.


      ### Rationale


      Evidence: Race 6 (ki 0.3, score 139.08) fell from the best raced design, race
      5 (ki 0.2, score 160.17). Oval progress dropped from 0.666 to 0.571 and the
      oval finish disappeared. S-bend progress was about flat (0.309 vs 0.306), slalom
      progress was unchanged (0.1125), and oval steering_oscillation fell to 0.240.
      Mean max_error stayed near 0.060 on every track, so the drift is still at the
      0.06 m off-track limit. The larger integral did not improve the score, so I
      revert ki to 0.2.


      Change: with the iteration-5 build restored (ki 0.2, kd 0.4, y=0.07, base_speed
      1.0), I make one lever change, kp 2.5 to 3.0. The Evaluator''s branch for max_error
      stuck at about 0.06 points to raising kp to 3.0. Iteration 3 also showed that
      lower kp did not hurt progress, but that does not rule out a higher kp helping
      the bends. Geometry, kd, base_speed, line_loss and sensor_size stay unchanged
      so the race isolates kp.


      Expected result: max_error below 0.06 on more seeds, and s-bend and slalom progress
      at or above 0.31 and 0.125. The risk is extra overshoot, which would show as
      steering_oscillation above about 0.25 on the oval or s-bend. If progress falls
      or oscillation rises, return kp to 2.5 and test kd 0.35. Survival still comes
      before speed, so base_speed stays at 1.0.


      Hypotheses: (a) the stuck max_error comes from insufficient proportional correction
      on sharp bends; (b) kp 3.0 keeps oscillation within the limits seen in iteration
      5. Measurements wanted per track and per seed: completion, progress, completion_time,
      rms_error, max_error, line_loss_events, steering_oscillation and control_effort.


      - [Open this output](iteration-7/entity0/versions/90ffd8690a964e3e949d1366fbdd6c63/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-38216ee684f18acd/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-7e10785f1c411d90/payload.json)'
  - id: entityR1
    label: 'Approve: ki 0.3 test'
    notes: 'Approved the best-raced design (iteration 5, 160.17) with a single change,
      ki 0.2 to 0.3, to test whether a fixed motor mismatch limits bend progress.
      Evidence: iteration 5 raised oval and s-bend progress but slalom progress fell
      slightly, and gain changes in iterations 3 and 4 did not move bend progress.


      ### Feedback


      Approved for racing. The candidate is the iteration-5 best design (score 160.17)
      with one controller change: ki 0.2 to 0.3. Geometry (y=0.07 sensors, x values,
      weights [-1, -0.5, 0, 0.5, 1], sensor_size 0.012), kp 2.5, kd 0.4, base_speed
      1.0 and line_loss ''last_direction'' are unchanged, so the race isolates the
      integral effect. The evidence behind it: iteration 5 raised progress on the
      oval (0.67) and s-bend (0.31) with forward sensors, but slalom progress fell
      slightly (0.113 vs 0.125 in iteration 4), and mean max_error stayed near 0.06
      on every track. That pattern fits a fixed left/right motor mismatch, which the
      integral term is meant to cancel. Iteration 4 showed that gain changes alone
      did not move bend progress, so testing ki is the right next lever. This candidate
      is valid, is a minimal change to the best raced build, and gives telemetry that
      the next revision can use, so it is approved now. Read the race as follows.
      If s-bend and slalom progress rise above 0.31 and 0.125 with oval steering_oscillation
      at or below 0.283, keep ki 0.3 and then test a small base_speed increase (1.0
      to 1.1) while watching max_error. If progress falls, or s-bend steering_oscillation
      rises well above 0.21, the larger integral is adding overshoot: return ki to
      0.2 and test kd 0.35 instead. Survival still comes before speed, so do not raise
      base_speed while any track ends off track early.


      ### Requested changes


      - After race 6: if s-bend progress exceeds 0.31 and slalom progress exceeds
      0.125 with oval steering_oscillation at or below 0.283, keep ki 0.3 and try
      controller.base_speed 1.1 with kd 0.4 and kp 2.5, since survival is holding.

      - After race 6: if progress drops on the s-bend or slalom, or s-bend steering_oscillation
      rises well above 0.21, the extra integral is causing overshoot. Return controller.ki
      to 0.2 and test controller.kd 0.35 instead, keeping y=0.07.

      - After race 6: if max_error stays near 0.06 on every track with ki 0.3, the
      mismatch is not the limit. Keep geometry at y=0.07 and try controller.kp 3.0
      with ki 0.3, since iteration 3 showed lower kp did not hurt progress.


      - [Open this output](iteration-6/entityR1/versions/9d4d70fc7f724f639c795351c5b8c4cb/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/dd283ce7f11645679a25cb772d910d51/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-958050be3679e810/payload.json)'
