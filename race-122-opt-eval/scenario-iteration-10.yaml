map:
  id: race-122-opt-eval
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Revert kd to 0.4 (best)
    notes: 'Returns the iteration-7 build (score 162.45) by setting kd back from 0.35
      to 0.4. Iteration 8 showed s-bend progress falling from 0.31 to 0.16 and oval
      progress from 0.74 to 0.68, which met the Evaluator''s revert condition. No
      other lever is changed.


      ### Rationale


      Iteration 8 (kd 0.35) scored 131.41, below iteration 7 (kd 0.4, score 162.45).
      The drop came from the s-bend, where progress fell from 0.312 to 0.160 and the
      s-bend steering_oscillation fell only from 0.213 to 0.136. Oval progress also
      fell from 0.741 to 0.683, below the 0.74 level that would have justified continuing
      with kd 0.35. Both thresholds in the Evaluator''s rule were crossed: s-bend
      progress is below 0.31, and oval progress is below the 0.74 band. The rule therefore
      says to return kd to 0.4. I am making no other change, so this candidate is
      the iteration-7 build exactly: y=0.07 sensors, x from -0.05 to 0.05, weights
      [-1, -0.5, 0, 0.5, 1], sensor_size 0.012, kp 3.0, ki 0.2, kd 0.4, base_speed
      1.0, line_loss ''last_direction''. Its measured score of 162.45 is the best
      raced result, and it is the only build with full evidence on all three tracks.
      Survival still comes before speed, so base_speed stays at 1.0. Expected result:
      a score near 162, with oval progress near 0.74 and s-bend progress near 0.31.
      I am not adding an untested kp 3.5 step, because the Evaluator''s conditional
      for kp 3.5 requires kd 0.35 to have held, and it did not. Measurements wanted:
      per-track progress, max_error, line_loss_events, steering_oscillation and control_effort,
      to confirm that the build reproduces iteration 7 and to size the remaining gain
      over max_error near 0.06.


      - [Open this output](iteration-9/entity0/versions/e8734b3c57474963b8e542f18d03eff0/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-88db5b2bea502d3f/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-a564f0549a7b8ec8/payload.json)'
  - id: entityR1
    label: Approve best build
    notes: 'Approved the iteration-7 build unchanged, the best raced design at 162.45,
      since the iteration-8 kd 0.35 test lost progress on the oval and s-bend. The
      feedback sets the next move (kp 3.5 at kd 0.4) to take only after this race
      shows the build holds.


      ### Feedback


      Approved for racing. This candidate is the iteration-7 build exactly: sensors
      at y=0.07 with x from -0.05 to 0.05, weights [-1, -0.5, 0, 0.5, 1], sensor_size
      0.012, kp 3.0, ki 0.2, kd 0.4, base_speed 1.0 and line_loss ''last_direction''.
      Iteration 7 scored 162.45, the best raced result, and it is the only build with
      full evidence on all three tracks. The Optimizer''s kd 0.35 test (iteration
      8, score 131.41) cut oval progress from 0.741 to 0.683 and s-bend progress from
      0.312 to 0.160, so kd stays at 0.4. I am not requesting a kd change in this
      race. Read the race as follows. Expect results close to iteration 7. If oval
      progress is near 0.74 and s-bend progress near 0.31 with max_error still around
      0.06, the next lever is kp 3.5 with kd 0.4 and ki 0.2, because the kp 2.5 to
      3.0 step gained a little and did not hurt. If the race drops well below iteration
      7 on any track, do not change kd or ki again; return to this exact build. Keep
      base_speed at 1.0 until at least one track finishes or runs to near progress
      1 without leaving the line, since survival still comes first.


      ### Requested changes


      - After race 9: if oval progress is at or above about 0.74 and s-bend at or
      above about 0.31 with max_error below 0.06, keep kd 0.4, ki 0.2, y=0.07 and
      try controller.kp 3.5 in the next revision, since the kp 2.5 to 3.0 step (iteration
      7) raised the score from 160.17 to 162.45.

      - After race 9: if oval progress falls below about 0.67 or s-bend below about
      0.28, return to this exact build (kp 3.0, kd 0.4, ki 0.2). Iteration 8 showed
      that kd 0.35 cut bend progress sharply, and iteration 6 showed that ki 0.3 lowered
      the score.

      - Keep geometry.sensor_positions at y=0.07 and base_speed at 1.0 until a track
      finishes or nearly finishes without leaving the line, because iteration 5 confirmed
      the forward-sensor lever and speed has not yet been tested on this build.


      - [Open this output](iteration-9/entityR1/versions/f4353cd0804d4a68899beb7e25fc1b2d/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/e8734b3c57474963b8e542f18d03eff0/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-a564f0549a7b8ec8/payload.json)'
