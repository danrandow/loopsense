  id: race-122-opt-eval
  schema: v0.2
  scenario: Iteration 1
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 0.
dimensions:
  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Wider sensors, slower
    notes: 'Widened the sensor array to +/-0.05 m so the line stays visible past the
      0.06 m off-track limit, lowered base_speed to 1.4, and tuned kd up and ki down
      for damping. Iteration 0 ran off track on every trial with max_error about 0.065
      m and 1 to 2 line-loss events per run.


      ### Rationale


      Evidence from iteration 0 (R2A): all 60 trials ran off track on all three development
      tracks, so none finished. Mean max_error was 0.062 to 0.067 m, just above the
      0.06 m off-track limit, and rms_error was about 0.03 m. Line-loss events averaged
      1 to 2 per run. The sensors span only +/-0.03 m, narrower than the 0.06 m offset
      at which the robot leaves the track. Once the robot drifts that far, the outer
      sensors read nothing, the line is lost, and the robot runs off. Steering oscillation
      (about 0.14 to 0.17) and the high kp gain (4.0) with a 1.6 base speed also leave
      little margin for the bends. Changes: (1) widen the sensor array to x = -0.05,
      -0.025, 0, 0.025, 0.05 so the line stays visible at larger offsets. The weights
      keep the same antisymmetric pattern (-1, -0.5, 0, 0.5, 1), so the sign convention
      still steers correctly. (2) Lower base_speed from 1.6 to 1.4 so the robot can
      track the line before it reaches the limit. This trades some completion time
      for survival, which matters because a run that leaves the track scores only
      about 60. (3) Raise kd from 0.2 to 0.3 to damp the oscillation, and reduce ki
      from 0.1 to 0.05 to limit integral overshoot on bends. kp stays at 4.0. Expected
      result: fewer line-loss events, max_error under 0.06 on the oval and s-bend,
      and the first completions on the oval. The likely finish time is about 3 s or
      a little more. Hypotheses to test next: (a) the wider sensor spread removes
      most line-loss events; (b) at base_speed 1.4 the robot can finish within 3 s;
      (c) if max_error still exceeds 0.06 on the slalom, kp is too low for the sharper
      bends and should rise to about 5. Measurements wanted: completion, progress,
      completion_time, rms_error, max_error, line_loss_events and steering_oscillation,
      per track and per seed.


      - [Open this output](iteration-1/entity0/versions/72780450bf55476baf4dc7197c67ab16/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-b1e1b263e8f09a33/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-94d003d770a942ef/payload.json)'
  - id: entityR1
    label: Baseline approved to race
    notes: 'Iteration 0 candidate is valid against every contract limit, with correct
      sensor-weight signs and a conservative speed and gain set. No race data exists
      yet, so I approved it for a telemetry-gathering race and set speed, damping
      and line-loss changes to make after the result.


      ### Feedback


      No race data exists yet (iteration 0), so this critique rests only on the public
      contract and the candidate''s own contents. Nothing here predicts how the candidate
      will perform. The candidate is valid against every limit: five sensors at y=0.05
      with x from -0.03 to 0.03, sensor_size 0.012, wheel_track 0.12, wheel_radius
      0.03, mass 0.8, base_speed 1.6, kp 4.0, ki 0.1, kd 0.2, and line_loss ''last_direction''.
      The weight signs are correct: the sensor at x=-0.03 (right of centre) has weight
      -1.0, so tape on the right gives a negative signal, which steers right as the
      contract requires. The approach is a conservative baseline, and with no earlier
      race to compare against the bar is validity and not being obviously broken,
      which it meets. Racing it is the only way to get telemetry. Once the race reports,
      use the measurements to decide the next change. If completion_time is near 3
      s and completed=1 with low rms_error, raise base_speed in steps (for example
      to 1.8) and keep kp. If steering_oscillation or max_error is high, lower kp
      or kd before touching speed. If line_loss_events is above zero, change line_loss
      or widen the outer sensors. If the run leaves the track, reduce base_speed first.


      ### Requested changes


      - After race 0: if completed=1 with completion_time above about 2.5 s and low
      rms_error, raise controller.base_speed (for example 1.6 to 1.8 to 2.0) and keep
      kp at 4.0.

      - After race 0: if steering_oscillation or max_error is high on the slalom,
      reduce controller.kd (0.2 to 0.1 or 0.0) before changing kp or base_speed.

      - After race 0: if line_loss_events is above 0 or the run leaves the track,
      set controller.line_loss to ''search_left'' or ''search_right'' only if the
      telemetry shows a consistent side, otherwise keep ''last_direction'' and reduce
      base_speed to about 1.4.


      - [Open this output](iteration-0/entityR1/versions/bc49024606c34d04ac6147a622f88c4f/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/9c12c3b9129443eba19dd27565111ef9/payload.json)'
