map:
  id: race-122-opt-eval
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: kd 0.35, kp 2.5 damping
    notes: 'Reverts kp to 2.5 and sets kd to 0.35 on the forward-sensor build, following
      the Evaluator''s rule that oval oscillation above 0.272 (race 7 gave 0.341)
      means returning kp and testing kd. Geometry is unchanged, so the race isolates
      damping.


      ### Rationale


      Evidence from race 7 (kp 3.0, score 162.45, the best raced score): s-bend progress
      held at 0.312 (vs 0.306 at kp 2.5). Oval progress rose to 0.741 and slalom progress
      stayed at about 0.113. The gain is small, though. Oval steering_oscillation
      rose from 0.272 to 0.341, which is above the 0.272 threshold in the Evaluator''s
      rule. Mean max_error on the oval is 0.0618, slightly higher than 0.0603, so
      the extra kp is adding overshoot without clearly holding the 0.06 m limit. Race
      7 also showed that the score is driven mostly by oval progress and one oval
      finish, so the gain from kp 3.0 is within noise.


      Decision: follow the Evaluator''s branch. Return kp to 2.5 and test kd 0.35
      with ki 0.2, keeping y=0.07 forward sensors, base_speed 1.0 (survival before
      speed), and all weights and geometry unchanged. The single change from the iteration-5
      build is kd 0.4 to 0.35, so this race isolates damping. Iteration 4 showed kd
      0.3 to 0.4 raised progress, so a drop to 0.35 may cost some progress. The trade
      is that oscillation should fall toward the 0.27 level. Expected result: steering_oscillation
      at or below 0.272 on the oval, max_error near or below 0.06, and progress close
      to the 0.67 oval and 0.31 s-bend seen in race 5. Hypotheses: (a) kp 3.0 caused
      the oval oscillation rise, so kp 2.5 with kd 0.35 keeps it lower; (b) the progress
      loss from lower kd is small (under 0.05 on the oval). Measurements wanted per
      track and per seed: completion, progress, completion_time, rms_error, max_error,
      line_loss_events, steering_oscillation and control_effort. After this race,
      if oscillation is clearly lower and progress holds, test base_speed 1.1. If
      progress falls on the s-bend, return kd to 0.4 and keep kp 2.5.


      - [Open this output](iteration-8/entity0/versions/b68966090d474cc5b77d87b04b7bb6c7/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-f488ef8e8d57319a/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-9a0202638004e62d/payload.json)'
  - id: entityR1
    label: 'Approve: kp 3.0 test'
    notes: 'Approved the iteration-5 best build with one lever change, kp 2.5 to 3.0,
      with ki restored to 0.2 because ki 0.3 lowered the score in iteration 6. The
      feedback and requested changes set out the next steps depending on whether oscillation
      and progress hold.


      ### Feedback


      Approved for racing. This candidate is the iteration-5 build (score 160.17,
      the best raced design) with one change: kp 2.5 to 3.0. Ki is restored to 0.2,
      because iteration 6 showed that ki 0.3 lowered the score from 160.17 to 139.08
      with no gain in progress. Geometry (sensors at y=0.07, x values and weights
      [-1, -0.5, 0, 0.5, 1], sensor_size 0.012), kd 0.4, base_speed 1.0 and line_loss
      ''last_direction'' are unchanged, so the race isolates kp. The reasons for this
      lever: mean max_error has stayed near 0.060 on every raced track in iterations
      4 to 6, and iteration 3 showed that lowering kp from 4.0 to 2.5 did not reduce
      progress, so kp is a lever that has not yet been tested in the higher direction
      on the forward-sensor build. Nothing here predicts how the candidate will race.
      Read the next race as follows. If max_error falls below 0.06 on more seeds and
      s-bend or slalom progress holds at or above 0.31 and 0.125, keep kp 3.0 and
      then test base_speed 1.1 while watching max_error. If steering_oscillation on
      the oval rises clearly above the iteration-5 value of 0.272, or progress drops
      on the s-bend, return kp to 2.5 and test kd 0.35, as the iteration-6 feedback
      suggested for overshoot. Survival still comes before speed, so do not raise
      base_speed while any track ends off track early.


      ### Requested changes


      - After race 7: if max_error drops below 0.06 on more seeds and s-bend and slalom
      progress hold at or above 0.31 and 0.125, keep kp 3.0 and try controller.base_speed
      1.1, since iteration 5 showed forward sensors preserved progress and survival
      was held.

      - After race 7: if oval steering_oscillation rises above 0.272 or s-bend progress
      falls below 0.31, return controller.kp to 2.5 and test controller.kd 0.35 with
      ki 0.2, because iteration 6 showed that extra integral gain lowered the score
      and iteration 1 showed kd 0.3 damped oscillation.

      - After race 7: keep geometry.sensor_positions at y=0.07 in all cases, because
      iteration 5 confirmed the forward-sensor lever (oval progress 0.67 vs 0.48,
      s-bend 0.31 vs 0.26).


      - [Open this output](iteration-7/entityR1/versions/cee3c1c468db4632acbe56ebe331187e/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/90ffd8690a964e3e949d1366fbdd6c63/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-7e10785f1c411d90/payload.json)'
