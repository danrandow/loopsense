overrides:
  entities:
  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence from iteration 1 (365.78, the best so far): the oval finished 17 of
      20 runs (finish time about 1.92 s, max_error 0.044 m), so the design works on
      gentle curves. The s-bend had max_error 0.0613 m, just past the 0.06 m off-track
      limit, and 19 of 20 runs left the track. The slalom progressed only 0.117 and
      left the track in all 20 runs. Line-loss events were 0.3 on the oval and 0.2
      on the slalom, so the robot loses the line briefly on bends before it leaves.
      The off-track limit is max(0.06, 0.0125 + body_width/4), which is 0.06 m at
      body_width 0.12 and cannot be raised by body width within the contract, so the
      error must be reduced. Changes: (1) base_speed 1.3 to 1.1. The oval finishes
      in about 1.9 s at 1.3, leaving room in the 3.0 s limit, and the s-bend max_error
      is just over the limit, so speed is the cheapest lever. (2) Sensor span widened
      from x = +/-0.06 to +/-0.08, the contract maximum, so the line stays under an
      outer sensor on sharper bends and line loss should fall. (3) Sensors moved forward
      from y = 0.05 to y = 0.07 to give more lookahead, which reduces the lag that
      causes overshoot on the s-bend and slalom. (4) kd 0.5 to 0.6 for extra damping
      on the alternating slalom corners; steering_oscillation is moderate at 0.26,
      so this is a small step. kp stays at 1.6 and line_loss stays at last_direction
      so that only the bend-handling changes vary. Expected result: fewer off-track
      ends on the s-bend and slalom, max_error below 0.05 m on the s-bend, and completion
      on the oval with a completion time under 2.5 s. Hypotheses: speed and lookahead
      are the main drivers of bend error, and line loss on the slalom comes from the
      narrow span. Measurements wanted next: max_error and progress per track, line_loss_events
      on the slalom, and completion_time on the oval to see how much time the speed
      reduction costs.


      - [Open this output](iteration-2/entity0/versions/6a61849b205448519a5f29c969f2360b/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-15bf9c7ab88a0cfc/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-a94ea0c32f749993/payload.json)'
  - id: entityR1
    label: 'Approve: slower, damped'
    notes: 'Approved the candidate as built: base_speed 1.6 to 1.3, kp 2.0 to 1.6,
      kd 0.3 to 0.5, sensor span widened to ±0.06 m. The baseline left the track on
      all 60 development trials with max_error about 0.062 m, so these changes target
      that failure, and the race will show whether they keep the robot on track.


      ### Feedback


      Approved to race unchanged. Iteration 0 is the only raced evidence: the baseline
      (base_speed 1.6, kp 2.0, kd 0.3, sensors at x = ±0.04) left the track on all
      60 development trials (20 per track), with max_error about 0.062 m against the
      0.06 m off-track limit, about one line-loss event per run, and progress of 0.49
      (oval), 0.22 (s-bend) and 0.11 (slalom). This candidate responds to that evidence
      in four ways: base_speed lowered to 1.3, kp lowered to 1.6, kd raised to 0.5,
      and sensor span widened to ±0.06 m. Each change addresses a specific failure,
      and the set is valid within the contract limits (sensor x within ±0.08, weights
      within ±2, line_loss an allowed option). The speed and damping changes are a
      sensible first step because the baseline failed on bends rather than stalling.
      The 3.0 s limit may not be met at 1.3, but completion is worth far more than
      time, so staying on track comes first. Nothing here is obviously broken, and
      the race is needed to show whether the changes help. After the race, read the
      telemetry as follows. If max_error stays above 0.06 m or runs still end off
      track, lower base_speed further (toward 1.1) before changing the gains. If the
      robot stays on track but progress is short or completion_time is above 3.0 s,
      raise base_speed in steps of about 0.1 while watching max_error. If line_loss_events
      remain above zero on the sharpest bends, test line_loss at search_left or search_right,
      matching the side the robot leaves the line.


      ### Requested changes


      - If the race shows off-track ends or max_error above 0.06 m, lower controller.base_speed
      from 1.3 toward 1.1 first, since the baseline''s speed of 1.6 left the track
      on every trial.

      - If the robot stays on track but completion_time is above 3.0 s or progress
      is short, raise controller.base_speed in steps of about 0.1 while watching max_error,
      and keep kp at 1.6 unless steering_oscillation rises.

      - If line_loss_events stay above zero on the tightest bends after the sensor
      widening to ±0.06 m, test controller.line_loss at search_left or search_right,
      matching the side the robot leaves the line.


      - [Open this output](iteration-1/entityR1/versions/4e387087501f434d8e64213f27658e5e/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/bcbbda3ed1d7464b9a8cc0f35a6d7d8c/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-314a6e529275a1b4/payload.json)'
