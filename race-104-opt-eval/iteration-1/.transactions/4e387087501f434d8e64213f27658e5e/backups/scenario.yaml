overrides:
  entities:
  - id: entity0
    label: Wider sensors, slower
    notes: 'Cut base_speed to 1.3 and kp to 1.6, raised kd to 0.5, and widened the
      sensor span to ±0.06 m. The baseline left the track on all 60 development trials
      with max_error about 0.062 m and about one line loss per run, so this targets
      bend tracking and line retention. Evidence: the baseline race telemetry in the
      history.


      ### Rationale


      Evidence: the baseline left the track on every development trial (60/60 off_track,
      0 finishes). Max error was about 0.062 m, just past the 0.06 m off-track limit,
      and line_loss_events averaged about 1 per run. Progress was 0.49 on the oval,
      0.22 on the s-bend and 0.11 on the slalom, so the robot is failing on bends,
      not stalling. The likely causes are (a) speed too high for the turn radius,
      so the robot overshoots and the tape leaves the 80 mm sensor span, and (b) too
      little damping, since kd 0.3 is low for kp 2.0. Changes: (1) base_speed 1.6
      to 1.3, the largest safe step I can justify without evidence of the speed-to-time
      mapping; a score without completion still earns up to about 440 from progress
      and tracking, so staying on track matters more than the 3.0 s limit right now.
      (2) kp 2.0 to 1.6 to reduce overshoot on bends. (3) kd 0.3 to 0.5 to damp the
      swing. (4) Sensor span widened from x = ±0.04 to ±0.06 (step 0.03 m, sensor
      size 0.012) so the line stays under a sensor on sharper bends and line loss
      events should fall. Weights stay -2, -1, 0, 1, 2 with the correct sign convention.
      Expected result: fewer or no off-track ends, progress above 0.5 on the s-bend
      and slalom, and a first finish possible on the oval. Hypotheses to test: line
      loss is mainly due to the narrow sensor span; speed is the main driver of max_error.
      Measurements wanted next: max_error and line_loss_events per track, progress,
      and completion_time, so I can judge whether base_speed should rise toward 1.5
      to meet the 3.0 s limit.


      - [Open this output](iteration-1/entity0/versions/bcbbda3ed1d7464b9a8cc0f35a6d7d8c/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-5c0767f426b0c878/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-314a6e529275a1b4/payload.json)'
  - id: entityR1
    label: 'Baseline review: approve'
    notes: 'First candidate, with no earlier race data, so it is judged only on contract
      validity: every field is inside its limits and nothing is obviously broken.
      It is approved to race now to produce the telemetry needed for sharper critique,
      with conditional tuning steps for speed, kp, kd and line loss.


      ### Feedback


      This is the first candidate, so there is no earlier race, outcome table or Evaluator
      Race Data to cite. The critique rests on the contract and the candidate''s own
      contents. All geometry and controller values fall inside the contract limits.
      The sensors sit 0.05 m ahead of the axle, the sensor weights run -2 to 2 with
      the sign convention correct, and line_loss is one of the allowed options. Nothing
      is obviously broken. The main unknowns are whether base_speed 1.6 is fast enough
      for the 3.0 s limit without leaving the track on tight bends, and whether kp
      2.0 with kd 0.3 oscillates. Only racing can show these. Once the race telemetry
      is in, change the controller as follows. If completion_time is above 3.0 s or
      progress is short, raise base_speed in steps of about 0.2. If max_error is above
      0.03 m or the robot leaves the track on bends, lower base_speed first, and if
      the error persists lower kp. If steering_oscillation is high while rms_error
      is small, raise kd. If line_loss_events is above zero, consider changing line_loss
      to search_right or search_left, depending on which side the robot leaves the
      line.


      ### Requested changes


      - If the race shows completion_time above 3.0 s or progress below 0.995, raise
      controller.base_speed in steps of about 0.2, while watching max_error.

      - If max_error exceeds about 0.03 m or the robot leaves the track on bends,
      lower controller.base_speed first, then lower controller.kp by about 0.3 if
      the error persists.

      - If steering_oscillation is high while rms_error is small, raise controller.kd
      from 0.3 toward 0.6. If line_loss_events is above zero, test controller.line_loss
      at search_left or search_right, matching the side the robot leaves the line.


      - [Open this output](iteration-0/entityR1/versions/e5b1c2dacd0b42f9a88ecc60b952a110/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/7728df55f7cc45fca3b21881814d9a5e/payload.json)'
