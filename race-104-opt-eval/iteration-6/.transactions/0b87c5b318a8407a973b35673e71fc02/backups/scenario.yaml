overrides:
  entities:
  - id: entity0
    label: kd 0.9 damping test
    notes: 'Raises kd from 0.7 to 0.9 on the best raced design (iteration 5, 497.55),
      keeping all other fields fixed. The oval finished 20/20 and the s-bend and slalom
      still reached max_error of about 0.06 m, which triggers the Evaluator''s next
      single step.


      ### Rationale


      Evidence: iteration 5 (kd 0.7, base_speed 1.1, iteration 3 geometry) is the
      best raced design at 497.55. The oval finished 20/20 at 1.999 s with steering_oscillation
      0.183, so the straights tolerate the extra damping. The s-bend still reached
      max_error 0.060 m (mean), with 15 of 20 runs off track, and the slalom reached
      max_error 0.063 m with 0 finishes. Steering oscillation on the s-bend stayed
      at 0.286, which means bend overshoot remains the limiting problem. The Evaluator''s
      rule applies: the oval finishes 20/20 and the s-bend and slalom still reach
      max_error at or above 0.06 m, so the next single step is kd 0.7 to 0.9. Change:
      controller.kd 0.7 to 0.9, the only edit. base_speed 1.1, kp 1.6, ki 0, sensor_weights,
      last_direction and the iteration 3 and 5 geometry (x -0.06 to +0.06 in 0.03
      m steps, y 0.05, size 0.012) stay fixed. Expected result: s-bend and slalom
      max_error falls below 0.06 m, s-bend finishes rise above the 5/20 seen at kd
      0.7, and s-bend steering_oscillation drops from 0.286. Risk: the oval may lose
      finishes or its steering_oscillation may rise well above 0.18. If so, the next
      step is kd 0.7 with kp 1.4, since kp is the untested lever once damping is too
      high for the straights. Hypotheses to check next: (1) more kd reduces s-bend
      overshoot; (2) the slalom''s off-track ends are driven by the same bend overshoot.
      Measurements wanted: per-track finish rate, max_error, steering_oscillation
      and completion_time, especially on the s-bend and slalom.


      - [Open this output](iteration-6/entity0/versions/e96af8b50d824fbba7c26903998b4213/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-e8f2d6087be12006/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-2fed3099d260803e/payload.json)'
  - id: entityR1
    label: 'Approve: kd 0.7 test'
    notes: 'Approved the single-variable change kd 0.5 to 0.7 on the best-raced design
      (iteration 3, 471.07), with speed back at 1.1. Iteration 3 telemetry shows s-bend
      max_error near 0.06 m and steering_oscillation of 0.31, so damping is the next
      lever, and kd has never been isolated.


      ### Feedback


      Approved. This candidate changes one controller field from the best raced design,
      iteration 3 (471.07): kd goes from 0.5 to 0.7, with base_speed 1.1, kp 1.6,
      ki 0, last_direction, and the iteration 3 geometry (x -0.06 to +0.06 in 0.03
      m steps, y 0.05, size 0.012) all unchanged. Iteration 4 showed that lowering
      speed to 1.0 did not help (445.98, oval 19/20), so returning to 1.1 is justified.
      Iteration 3 telemetry showed s-bend max_error at 0.0598 m with steering_oscillation
      0.3087, and the oval at 20/20 with a 1.959 s mean finish, so the bend overshoot
      is the problem and damping is the natural lever. kd has not been isolated before:
      iteration 1 changed it together with speed, and iteration 2 changed it together
      with sensor geometry. The geometry must not change: the iteration 2 sensor-spacing
      and y 0.07 change scored 62.76 with 2.8 line-loss events on the oval. Nothing
      in the candidate is outside the contract, and it is a clean single-variable
      test of the best design, so it is worth racing. After the race, read the per-track
      results as follows. If the oval loses finishes or its steering_oscillation rises
      well above the iteration 3 value of 0.138, kd is too high for the straights,
      so return kd to 0.5 and test kp 1.4 next. If the s-bend and slalom still reach
      max_error at or above 0.06 m with kd 0.7, raise kd further, as the next single
      step.


      ### Requested changes


      - If the oval loses finishes (below 20/20) or its steering_oscillation rises
      well above 0.138 (iteration 3), return controller.kd to 0.5 and test controller.kp
      at 1.4 with base_speed 1.1, since kd 0.5 kept the oval at 20/20.

      - If the s-bend or slalom still reach max_error at or above 0.06 m while the
      oval still finishes 20/20, raise controller.kd from 0.7 to 0.9, keeping base_speed
      at 1.1, because s-bend max_error has sat at 0.060 to 0.063 across speeds 1.3,
      1.1 and 1.0.

      - Keep geometry.sensor_positions at the iteration 3 layout (x -0.06 to +0.06
      in 0.03 m steps, y 0.05). The iteration 2 change to 0.04 m spacing and y 0.07
      scored 62.76 with 2.8 line-loss events on the oval, so do not reintroduce it.


      - [Open this output](iteration-5/entityR1/versions/e091150754324e9fb335f3637aca1e2f/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/b6d5dba1e00c494290d501851bfb6890/payload.json),
