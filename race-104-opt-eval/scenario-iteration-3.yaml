map:
  id: race-104-opt-eval
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Revert geometry, speed
    notes: 'Reverts the geometry to iteration 1, the best design (365.78), because
      widening the sensor span to 0.04 m spacing caused line loss and scored 62.76.
      Changes only base_speed from 1.3 to 1.1 to bring the s-bend and slalom max_error
      below 0.06 m, with the oval still expected to finish under 3.0 s.


      ### Rationale


      Evidence: iteration 2 scored 62.76, far below iteration 1 (365.78). The oval
      went from 17/20 finishes to 0/20, with line_loss_events rising from 0.3 to 2.8.
      The likely cause is the sensor change: spacing widened from 0.03 m to 0.04 m,
      and 0.04 m minus the 0.012 m sensor leaves a 0.028 m gap, which is wider than
      the 0.025 m tape. The tape can then sit entirely between sensors and read as
      lost. The forward move to y = 0.07 was also untested in isolation. The approved
      candidate in entityR1 describes the iteration 2 design, which the race has already
      shown to be worse, so I am not reusing it.


      Changes from iteration 1 (the best design): I revert the geometry exactly to
      iteration 1 (5 sensors at x = -0.06 to +0.06 in 0.03 m steps, y = 0.05, sensor_size
      0.012). I change one controller variable, base_speed 1.3 to 1.1. In iteration
      1 the s-bend and slalom ended just over the 0.06 m limit (max_error 0.0613 and
      0.063), and speed was the strongest lever in iterations 0 and 1. kp 1.6, kd
      0.5, ki 0 and line_loss last_direction stay the same.


      Expected result: max_error on the s-bend and slalom falls below 0.06 m, so more
      runs finish those tracks. Oval completion time should rise from about 1.92 s
      to about 2.3 s, which is still under 3.0 s. Line-loss events should stay near
      iteration 1 levels (about 0.3 on the oval).


      Hypotheses to test: (1) speed drives bend error, so 1.1 keeps the robot on the
      tape through the s-bend and slalom; (2) the iteration 2 failure came from sensor
      spacing, not speed. Measurements wanted next: per-track completion, progress,
      max_error, line_loss_events and completion_time. If the s-bend and slalom still
      exceed 0.06 m, try base_speed 1.0. If the oval fails to finish under 3.0 s,
      go back to 1.2. If slalom line losses stay above 0.2, test line_loss at search_left
      or search_right.


      - [Open this output](iteration-3/entity0/versions/b54f71ec2cc145f3bbc9be4646f05f4a/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-1e2fc8f6db5d922f/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-c84f65be8764b25b/payload.json)'
  - id: entityR1
    label: Revert geometry, speed
    notes: 'Approves the iteration 1 geometry, which was the best raced design (365.78),
      with base_speed lowered from 1.3 to 1.1 to reduce s-bend and slalom max_error.
      Iteration 2''s sensor move is rejected because it scored 62.76 with no finishes.


      ### Feedback


      Approved to race unchanged. This candidate returns the geometry exactly to iteration
      1, the best design so far at 365.78. Iteration 2 showed that moving sensors
      to y = 0.07 with a 0.04 m spacing (scored 62.76, zero finishes, line_loss_events
      2.8 on the oval) is worse, so reverting that is justified. The only controller
      change is base_speed 1.3 to 1.1, with kp 1.6, kd 0.5, ki 0 and last_direction
      unchanged. Iteration 1 showed the s-bend ended just past the limit (max_error
      0.0613, 19 of 20 off track) and the slalom had max_error 0.063, while speed
      was the strongest lever in iterations 0 and 1. The oval finished 17 of 20 at
      a mean of 1.92 s, so there is room under the 3.0 s limit for a slower run. Approving
      now spends one action run on the race and keeps budget for one revision round
      if the telemetry shows a clear fix. Read the results as follows. If the s-bend
      or slalom still show max_error at or above 0.06 m, try base_speed 1.0 next,
      since speed moved max_error in iterations 0 and 1. If the oval stops finishing
      or completion_time approaches 3.0 s, go back to base_speed 1.2. If slalom line_loss_events
      stay above 0.2, test line_loss at search_left or search_right, matching the
      side the robot leaves the line.


      ### Requested changes


      - If the s-bend or slalom still end off track with max_error at or above 0.06
      m, lower controller.base_speed from 1.1 to 1.0, since iteration 0 to 1 showed
      speed is the main driver of bend error.

      - If the oval fails to finish under 3.0 s, raise controller.base_speed to 1.2,
      since iteration 1 finished the oval at 1.92 s at base_speed 1.3.

      - If slalom line_loss_events stay above 0.2 (iteration 1 had 0.2), test controller.line_loss
      at search_left or search_right, matching the side the robot leaves the line.


      - [Open this output](iteration-3/entityR1/versions/56fc8cbb83964217bc451e412e68b4b8/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/b54f71ec2cc145f3bbc9be4646f05f4a/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-c84f65be8764b25b/payload.json)'
