map:
  id: race-104-opt-eval
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: kp 1.4 at kd 0.9
    notes: 'Reverts kd to the best-raced value 0.9 (iteration 7''s kd 1.0 dropped
      the score to 447 with s-bend finishes at 1/20) and tests kp 1.4 as the next
      single lever. Geometry, base_speed 1.1 and ki 0 are unchanged from the 511 design,
      so the race isolates kp''s effect on bend overshoot.


      ### Rationale


      Evidence: iteration 6 (kd 0.9, kp 1.6, base_speed 1.1) is still the best raced
      design at 511.25. Its oval finished 20/20 at 2.00 s, with steering_oscillation
      0.185. Its s-bend reached 5/20 finishes with mean max_error 0.0608 m, and its
      slalom ended off track 20/20 with max_error 0.066 m. Iteration 7 raised kd to
      1.0 and scored 447.29, a clear drop. The s-bend fell to 1/20 finishes, and s-bend
      steering_oscillation rose to 0.236 on the one-run mean, with more bend losses.
      So kd has passed its useful range, and the Evaluator''s rule to return kd to
      0.9 applies. Over kd 0.5, 0.7 and 0.9 the s-bend max_error stayed at 0.060 to
      0.061 m, and speed (1.3, 1.1, 1.0) did not move it either. The remaining lever
      is proportional gain. Change: controller.kp from 1.6 to 1.4, with kd returned
      to 0.9 and everything else fixed (base_speed 1.1, ki 0, sensor_weights -2..2,
      last_direction, and the iteration 3 to 6 geometry: x -0.06 to +0.06 in 0.03
      m steps, y 0.05, sensor_size 0.012). Expected result: less steering overshoot
      on bends, so s-bend max_error falls below 0.06 m and s-bend finishes rise above
      5/20, with the oval staying at 20/20 near 2.0 s. Risk: at kp 1.4 the response
      may be too slow on the tighter slalom corners, and progress may drop. Hypotheses
      to check: (1) kp is now the limiting gain for bend overshoot; (2) the flat max_error
      across speed and kd points at the sensor layout, which may be limiting how early
      the robot sees a bend. Measurements wanted: per-track finish rate, max_error,
      steering_oscillation and completion_time, especially on the s-bend and slalom.
      If the oval drops below 20/20 or the slalom progress falls, return kp to 1.6
      and try a sensor-geometry test next.


      - [Open this output](iteration-8/entity0/versions/9e7368abd3da436d85881b5dfcf859d0/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-50b1506ba8c0f3a0/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-fad2ca77cfd40e52/payload.json)'
  - id: entityR1
    label: Approve kp 1.4 test
    notes: 'Approved the single-variable change kp 1.6 to 1.4 on the best raced design
      (iteration 6, kd 0.9, score 511.25), since kd 1.0 dropped to 447.29 in iteration
      7. The race is a clean test of the one lever not yet varied, and feedback gives
      clear rules for returning kp to 1.6 or trying 1.2.


      ### Feedback


      The candidate is a single-variable change from the best raced design, iteration
      6 (kp 1.6, kd 0.9, base_speed 1.1, score 511.25). It sets controller.kp to 1.4
      and keeps kd 0.9, base_speed 1.1, ki 0, last_direction, the sensor_weights,
      and the iteration 3 to 6 geometry (x -0.06 to +0.06 in 0.03 m steps, y 0.05,
      sensor_size 0.012). Iteration 7 showed that kd 1.0 dropped the score to 447.29,
      so the candidate correctly returns kd to 0.9. Across kd 0.5, 0.7 and 0.9, s-bend
      max_error stayed at 0.060 to 0.061 m and speed (1.3, 1.1, 1.0) did not move
      it, which points to proportional gain as the remaining untested lever. The candidate
      sits inside the contract, and the geometry is unchanged from the layouts that
      finished the oval 20/20 in iterations 3, 5 and 6. Its risk is slower corrections
      on the slalom, not a structural fault, so one race is a sound test. The geometry
      must not change: the iteration 2 spacing and y 0.07 layout scored 62.76 with
      2.8 line-loss events on the oval.


      After the race, read the results as follows. If the oval falls below 20/20 finishes,
      or slalom progress falls clearly below the iteration 6 level (0.171), return
      kp to 1.6 and stop testing proportional gain. If s-bend finishes rise above
      5/20 with max_error below 0.06 m, try kp 1.2 next with everything else fixed.
      If the s-bend is unchanged, the bend limit is not set by kp either, and the
      next test should be a sensor-size change (0.016) with geometry otherwise fixed.


      ### Requested changes


      - If the oval falls below 20/20 finishes or the slalom progress drops below
      the iteration 6 value of 0.171, return controller.kp to 1.6, since kp 1.6 with
      kd 0.9 is the best raced design at 511.25.

      - If s-bend finishes rise above 5/20 with max_error below 0.06 m while the oval
      stays 20/20, test controller.kp at 1.2 next with everything else fixed, since
      kd has plateaued at 0.9 and kp is the lever still untested.

      - Keep geometry.sensor_positions at the iteration 3 to 6 layout (x -0.06 to
      +0.06 in 0.03 m steps, y 0.05, sensor_size 0.012). The iteration 2 change to
      0.04 m spacing and y 0.07 scored 62.76 with 2.8 line-loss events on the oval.


      - [Open this output](iteration-8/entityR1/versions/fd4da99af9b74fd48afa4d1a0bcf308b/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/9e7368abd3da436d85881b5dfcf859d0/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-fad2ca77cfd40e52/payload.json)'
