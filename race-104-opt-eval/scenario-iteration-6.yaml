overrides:
  entities:
  - id: entity0
    label: kd 0.9 damping test
    notes: 'Raises kd from 0.7 to 0.9 on the best raced design (iteration 5, 497.55),
      keeping all other fields fixed. The oval finished 20/20 and the s-bend and slalom
      still reached max_error of about 0.06 m, which triggers the Evaluator''s next
      single step.


      ### Rationale


      Evidence: iteration 5 (kd 0.7, base_speed 1.1, iteration 3 geometry) is the
      best raced design at 497.55. The oval finished 20/20 at 1.999 s with steering_oscillation
      0.183, so the straights tolerate the extra damping. The s-bend still reached
      max_error 0.060 m (mean), with 15 of 20 runs off track, and the slalom reached
      max_error 0.063 m with 0 finishes. Steering oscillation on the s-bend stayed
      at 0.286, which means bend overshoot remains the limiting problem. The Evaluator''s
      rule applies: the oval finishes 20/20 and the s-bend and slalom still reach
      max_error at or above 0.06 m, so the next single step is kd 0.7 to 0.9. Change:
      controller.kd 0.7 to 0.9, the only edit. base_speed 1.1, kp 1.6, ki 0, sensor_weights,
      last_direction and the iteration 3 and 5 geometry (x -0.06 to +0.06 in 0.03
      m steps, y 0.05, size 0.012) stay fixed. Expected result: s-bend and slalom
      max_error falls below 0.06 m, s-bend finishes rise above the 5/20 seen at kd
      0.7, and s-bend steering_oscillation drops from 0.286. Risk: the oval may lose
      finishes or its steering_oscillation may rise well above 0.18. If so, the next
      step is kd 0.7 with kp 1.4, since kp is the untested lever once damping is too
      high for the straights. Hypotheses to check next: (1) more kd reduces s-bend
      overshoot; (2) the slalom''s off-track ends are driven by the same bend overshoot.
      Measurements wanted: per-track finish rate, max_error, steering_oscillation
      and completion_time, especially on the s-bend and slalom.


      - [Open this output](iteration-6/entity0/versions/e96af8b50d824fbba7c26903998b4213/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-e8f2d6087be12006/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-2fed3099d260803e/payload.json)'
  - id: entityR1
    label: Approve kd 0.9 test
    notes: 'Approved the single-variable step kd 0.7 to 0.9 on the best raced design
      (497.55), since kd 0.5 to 0.7 cut s-bend oscillation and kept the oval at 20/20.
      Geometry is held at the iteration 3 and 5 layout because the iteration 2 spacing
      change collapsed the score.


      ### Feedback


      This candidate changes one field from the best raced design, iteration 5 (kd
      0.7, scored 497.55). It sets controller.kd to 0.9 and keeps base_speed 1.1,
      kp 1.6, ki 0, last_direction, the sensor_weights, and the iteration 3 and 5
      geometry (x -0.06 to +0.06 in 0.03 m steps, y 0.05, size 0.012). The evidence
      supports a single step further in damping. In iteration 3 (kd 0.5) the s-bend
      had steering_oscillation 0.309 and max_error 0.0598 m. In iteration 5 (kd 0.7)
      the oval stayed at 20/20 with steering_oscillation 0.183, and the s-bend improved
      to 5/20 finishes with max_error 0.060 m. Changing speed (iterations 4 and 1
      to 3) did not clear the bend limit, which points to overshoot as the limit.
      The geometry must not change: iteration 2 (sensor spacing 0.04 m, y 0.07) scored
      62.76 with 2.8 line-loss events on the oval. Nothing in the candidate is outside
      the contract, and it is a clean single-variable test of the best design, so
      it is worth racing now rather than spending two action runs on a revision. Next
      race reading: if the oval drops below 20/20 or its steering_oscillation rises
      well above 0.18, the damping is too high for the straights, so return kd to
      0.7 and test kp 1.4 next. If the s-bend and slalom still reach max_error at
      or above 0.06 m while the oval holds 20/20, the next single step is kd 1.0,
      with everything else fixed.


      ### Requested changes


      - If the oval falls below 20/20 finishes or its steering_oscillation rises well
      above 0.18 (iteration 5), return controller.kd to 0.7 and test controller.kp
      at 1.4 with base_speed 1.1, since kd 0.7 kept the oval at 20/20.

      - If the s-bend or slalom still reach max_error at or above 0.06 m while the
      oval holds 20/20, raise controller.kd from 0.9 to 1.0 with everything else fixed,
      since s-bend max_error stayed at 0.060 to 0.063 across speeds 1.3, 1.1 and 1.0
      and kd 0.5 to 0.7 gave the first bend gain (iteration 3 to 5).

      - Keep geometry.sensor_positions at the iteration 3 and 5 layout (x -0.06 to
      +0.06 in 0.03 m steps, y 0.05, sensor_size 0.012). The iteration 2 change to
      0.04 m spacing and y 0.07 scored 62.76 with 2.8 line-loss events on the oval.


      - [Open this output](iteration-6/entityR1/versions/0b87c5b318a8407a973b35673e71fc02/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/e96af8b50d824fbba7c26903998b4213/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-2fed3099d260803e/payload.json)'
