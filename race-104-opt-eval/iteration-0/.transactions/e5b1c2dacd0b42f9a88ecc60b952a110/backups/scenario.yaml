overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor line
    notes: 'Baseline candidate built from the contract alone, since no race data exists
      yet: five 12 mm sensors spanning 80 mm, kp 2.0, kd 0.3, base_speed 1.6, last_direction
      line loss. It is meant to finish and establish the error and speed baseline
      for the next iteration.


      ### Rationale


      Iteration 0 has no race data yet, so this is a conservative baseline built from
      the contract. Geometry: five line sensors spread across the 80 mm sensor span
      (x = -0.04 to +0.04 m, step 0.02 m) at y = 0.05 m ahead of the axle, so the
      robot sees the line well before the wheels reach it. The 12 mm footprint is
      wider than the 8 mm option, so the line is seen across the full 25 mm tape width
      and readings change smoothly. Wheel track 0.12 m and wheel radius 0.03 m give
      moderate turn authority. Mass 0.8 kg and body 0.12 x 0.16 m keep yaw inertia
      low enough for quick corrections while the off-track limit stays comfortable
      at about 0.06 m. Controller: sensor weights -2, -1, 0, 1, 2 make the signal
      sign match the contract (positive = left, so a tape reading on the left sensors
      steers left). kp = 2.0 gives a strong proportional response; kd = 0.3 damps
      the swing without adding much jitter; ki = 0 avoids integral windup on curves.
      base_speed = 1.6 is a compromise: it should be near the 1.5 m/s average needed
      to finish in 3 s, but high enough to risk overshooting the tighter bends. line_loss
      = last_direction so the robot recovers toward the side it was last on. Expected
      result: completion on the oval and s-bend, with some risk on the slalom. The
      main unknowns are the speed-versus-off-track trade-off and whether kp is too
      high, which the race telemetry (rms_error, max_error, steering_oscillation,
      completion_time) should reveal. Next measurements: whether lateral error stays
      under 0.03 m on bends, and whether the robot finishes before 3.0 s.


      - [Open this output](iteration-0/entity0/versions/7728df55f7cc45fca3b21881814d9a5e/payload.json)'
  actions:
  - id: action0
