map:
  id: race-104-opt-eval
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: kd 1.0 single step
    notes: 'Raises kd from 0.9 to 1.0 with all else fixed, as the Evaluator requested,
      since the oval held 20/20 at kd 0.9 and s-bend max_error stayed at about 0.06
      m. Expected gain is small, so the race will show whether damping has reached
      its useful limit.


      ### Rationale


      Evidence from iteration 6 (kd 0.9, the best raced design at 511.25): the oval
      held 20/20 finishes at 2.00 s with steering_oscillation 0.185, so the straights
      tolerate the extra damping. The s-bend reached 5/20 finishes with mean max_error
      0.0608 m and steering_oscillation rising to 0.324, and the slalom had 0/20 finishes
      with max_error 0.066 m. Across kd 0.5, 0.7 and 0.9 the s-bend max_error stayed
      at 0.060 to 0.061 m and s-bend finishes plateaued at 5/20 from kd 0.7 to 0.9.
      Speed (1.3, 1.1, 1.0) also left max_error flat, so the bend limit is not a speed
      effect. Interpretation: derivative action is still the most useful lever, but
      its gain per step is shrinking, and the rising s-bend oscillation shows that
      more kd also amplifies jitter. I follow the Evaluator''s stated next step, a
      single change of kd from 0.9 to 1.0 with everything else fixed (base_speed 1.1,
      kp 1.6, ki 0, sensor_weights -2..2, last_direction, and the iteration 3 to 6
      geometry unchanged). Expected result: s-bend and slalom max_error edge below
      0.06 m, with s-bend finishes at 6 to 8/20, a score of about 520 to 540, and
      the oval still at 20/20. Risks: s-bend steering_oscillation may rise above 0.35,
      and the oval may start losing finishes if kd is too high for the straights.
      Hypotheses to test next: (1) kd has reached its useful range, so the next gain
      must come from kp, since kp 1.4 may cut overshoot; (2) the flat max_error across
      speed and kd may point to the sensor layout (5 sensors at 0.03 m spacing, 12
      mm footprint) limiting how early the robot sees a bend, which a sensor-size
      change could test later. Measurements wanted: per-track finish rate, max_error,
      steering_oscillation and completion_time, especially s-bend and slalom. If the
      oval loses finishes or s-bend oscillation exceeds about 0.4, return kd to 0.9
      and test kp 1.4 next.


      - [Open this output](iteration-7/entity0/versions/adb6a4160bd44138aed6e95ab5b39dba/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-3674586cff254e82/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-bebcd6f5fd54e635/payload.json)'
  - id: entityR1
    label: Approve kd 1.0 test
    notes: 'Approved a single-variable step from the best raced design (kd 0.9, 511.25)
      to kd 1.0, with geometry and other controller values unchanged. Iteration 5
      to 6 showed bend gains flattening while the oval stayed at 20/20, so the race
      will show whether further damping still helps.


      ### Feedback


      This candidate changes one field from the best raced design, iteration 6 (kd
      0.9, scored 511.25): controller.kd goes from 0.9 to 1.0. base_speed 1.1, kp
      1.6, ki 0, last_direction, the sensor_weights and the iteration 3 to 6 geometry
      (x -0.06 to +0.06 in 0.03 m steps, y 0.05, sensor_size 0.012) are unchanged.
      Iteration 6 shows the oval holding 20/20 at 2.00 s with steering_oscillation
      0.185, so the straights tolerate the extra damping. Iteration 5 to 6 (kd 0.7
      to 0.9) left s-bend finishes at 5/20 and s-bend max_error at about 0.061 m,
      so the gain per step is shrinking, which is consistent with the rationale. Iteration
      3 (kd 0.5) had s-bend steering_oscillation 0.309, so damping has been reducing
      bend overshoot but its returns are flattening. This is a clean single-variable
      step and stays within the contract. I approve it because it is a low-risk test
      of the best design, with one race needed, and its telemetry will show whether
      kd still helps. Read the next race as follows. If the oval drops below 20/20
      or its steering_oscillation rises well above 0.2, return kd to 0.9 and test
      kp 1.4 at base_speed 1.1 next. If s-bend finishes stay at or near 5/20 with
      max_error still at or above 0.06 m, kd has reached its useful range and the
      next lever should be kp 1.4 with kd 0.9. Do not change the geometry: the iteration
      2 change to 0.04 m spacing and y 0.07 scored 62.76 with 2.8 line-loss events
      on the oval.


      ### Requested changes


      - If the oval falls below 20/20 finishes or steering_oscillation rises well
      above 0.2 (iteration 6 was 0.185), return controller.kd to 0.9 and test controller.kp
      at 1.4 with base_speed 1.1, since kd 0.9 kept the oval at 20/20.

      - If s-bend finishes stay at about 5/20 and max_error stays at or above 0.06
      m (iterations 5 and 6 both did), treat kd as plateaued at about 0.9 to 1.0 and
      test controller.kp at 1.4 next, with everything else fixed.

      - Keep geometry.sensor_positions at the iteration 3 to 6 layout (x -0.06 to
      +0.06 in 0.03 m steps, y 0.05, sensor_size 0.012). The iteration 2 change to
      0.04 m spacing and y 0.07 scored 62.76 with 2.8 line-loss events on the oval.


      - [Open this output](iteration-7/entityR1/versions/0caa4c58bd0846a4ac32e90469896e82/payload.json)

