map:
  id: race-118-opt-eval
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Wider-to-narrow outer
    notes: 'Iteration 5 design with only the outer sensors moved from x = plus or
      minus 0.024 to plus or minus 0.020 m, as the Evaluator''s conditional geometry
      rule requires. Iteration 9 confirmed max_error about 0.060 m with unchanged
      line losses, which meets that condition.


      ### Rationale


      Evidence: iteration 9 re-raced the iteration 5 design (score 160.41). Oval max_error
      was 0.0604, s-bend 0.0623 and slalom 0.0616, and line_loss_events were 1.3,
      2.0 and 1.0. Every run still ends off_track, and max_error has stayed at 0.060
      to 0.063 m since iteration 2. Gain and line-loss levers are exhausted: kp 3.0
      scored 83.5, kd 0.45 raised oval oscillation to 0.333 and scored 143.1, search_left
      and search_right both left line losses unchanged, and ki 0.10 scored 109.75.
      Stale feedback on entity0 (ki 0.10 as an untested candidate) is superseded by
      the iteration 8 result, so ki stays at 0.05.


      Decision: the Evaluator''s conditional rule for geometry applies, because max_error
      is about 0.060 m and line_loss_events are unchanged from iteration 5. I make
      one geometry change: the outer sensors move from x = plus or minus 0.024 m to
      plus or minus 0.020 m. Sensor sizes, weights, the inner sensors and every controller
      field stay at iteration 5 values (base_speed 1.3, kp 2.5, ki 0.05, kd 0.3, weights
      [2,1,0,-1,-2], line_loss search_right). Narrower outer sensors may keep the
      tape within the footprint span on the sharpest bends and reduce the signal saturation
      that limits steering authority at the edges.


      Expected result: max_error below about 0.058 m on the oval and slalom, with
      line_loss_events at or below the iteration 5 values (1.3 oval, 2.0 s-bend, 1.0
      slalom). Oscillation should stay below 0.3.


      Hypotheses and next measurements: (H1) the outer-sensor span limits the signal
      on tight bends, so a narrower span lowers max_error. If max_error is unchanged,
      the limit is set by sensor resolution or base speed, and the next step is base_speed
      1.5 only if completion_time is limiting. If max_error rises or oscillation exceeds
      0.3, revert to the iteration 5 geometry. Needed per track: completion, progress,
      completion_time, max_error, rms_error, line_loss_events, steering_oscillation.


      - [Open this output](iteration-10/entity0/versions/6e015e4a7f4f4a0eb2802258b6c9e5f0/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-d31936f240ebe4a0/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-c4b140bd550e7c16/payload.json)'
  - id: entityR1
    label: Approve iter 5 baseline
    notes: 'Approves the unchanged iteration 5 design, the best raced score (160.41),
      so the iteration is scored. The feedback retires the stale ki 0.10 advice, which
      raced in iteration 8 and scored 109.75, and points the next step to sensor spacing.


      ### Feedback


      Written before this candidate races, so no outcome is claimed for it. The candidate
      is identical to the iteration 5 design, the best raced design at score 160.41
      (kp 2.5, ki 0.05, kd 0.3, base_speed 1.3, sensor_size 0.016, weights [2,1,0,-1,-2],
      line_loss search_right). It is valid and inside every contract limit. Your previous
      feedback on entity0 is stale: its ki 0.10 test was raced in iteration 8 and
      scored 109.75, with oval max_error rising from 0.0604 to 0.0616 and oval finishes
      falling from 3/20 to 0/20. Revert ki to 0.05 and make no further gain changes.
      Steering gain (kp 3.0, iteration 4: 83.5), kd (0.45, iteration 6: 143.1, oval
      oscillation 0.333), and line-loss direction (search_left in iteration 7 and
      search_right in iteration 5, both about 159 to 160) have all been tested and
      none improves on iteration 5. The remaining lever is geometry. Max_error has
      stayed at 0.060 to 0.062 m on every track since iteration 2, so the next single
      change should be sensor spacing, not controller tuning. Use the result to decide:
      if max_error stays at about 0.060 m and line_loss_events are unchanged, widen
      the outer sensors to x = plus or minus 0.020 m as the only change. If max_error
      falls and completion_time is above 3 s on the oval, test base_speed 1.5 instead,
      since iteration 5 oval finishes at 1.89 s show speed is adequate there.


      ### Requested changes


      - If max_error stays at about 0.060 m on the oval and s-bend with line_loss_events
      unchanged from iteration 5 (1.3, 2.0): change geometry.sensor_positions outer
      sensors from x = plus or minus 0.024 to plus or minus 0.020 m, keeping every
      controller field at iteration 5 values. Iteration 8 showed gain changes are
      exhausted.

      - If max_error falls below about 0.058 m but completion_time exceeds 3 s on
      the oval or s-bend: raise controller.base_speed from 1.3 to 1.5 as the only
      change, keeping kp 2.5 and kd 0.3.

      - If steering_oscillation exceeds 0.3 on any track or max_error rises above
      the iteration 5 values (0.0604 oval, 0.0623 s-bend, 0.0616 slalom): revert to
      the iteration 5 design and do not test gains again.


      - [Open this output](iteration-9/entityR1/versions/6e3a330e4c1447f6b7c27be4c0609ed7/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/1e83e473f6d747aca4ad4ebe6fb98428/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-28cbbe1b1b6b7abe/payload.json)'
