  entities:
  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'Conservative first candidate: five 8 mm sensors at 12 mm pitch, weights
      2..-2, kp 2.0, kd 0.1, base_speed 1.6. No race data yet, so values come from
      contract physics. Next revision should respond to the race telemetry and the
      Evaluator''s critique.


      ### Rationale


      Iteration 0 has no race telemetry or Evaluator feedback, so this is a conservative
      baseline built from the contract physics. Geometry: five 8 mm sensors spaced
      12 mm apart across x = -0.024 to +0.024 m, so the 25 mm tape is always covered
      by at least two or three sensors, with a 12 mm pitch giving smooth interpolation
      of the line position. Sensors sit 0.03 m ahead of the axle so steering reacts
      before the wheels reach the line. Weights are proportional to sensor x (2, 1,
      0, -1, -2), so the signal is roughly the line offset in units of 12 mm and positive
      signal (line on the left) steers left as the contract requires. Controller:
      base_speed 1.6 (PWM about 80%) to reach the roughly 1.5 m/s average needed to
      finish in under 3 s while leaving headroom for turns. kp 2.0 gives a moderate
      correction (signal 1 gives 700 PWM of differential). kd 0.1 damps oscillation
      without amplifying sensor noise. ki 0.05 is a small integral term to remove
      steady bias from the motor mismatch. line_loss last_direction keeps the robot
      turning the way it was going when the line is lost. Expected result: completion
      on the oval and s-bend, with moderate rms_error. If the slalom or sharp bends
      cause line loss or oscillation, the next revision should raise kd, lower base_speed,
      or widen the sensor array.


      - [Open this output](iteration-0/entity0/versions/8361211f1d07490fa8a4c4b6411fd1e9/payload.json)'
  - id: entityR1
    label: Baseline approved to race
    notes: 'First candidate with no race data: it is valid and not obviously broken,
      so approving it gets the first telemetry. The feedback sets contingent gain
      and speed changes for the next race to test on the slalom and sharp bends.


      ### Feedback


      Iteration 0 has no race telemetry, so this review rests only on the contract
      and the candidate''s own contents. The candidate is valid: five sensors within
      the position limits, five weights within [-2, 2], base_speed 1.6 and kp 2.0
      inside their ranges, and the sign convention matches the contract (positive
      weights on left-side sensors steer left). The sensor pitch of 12 mm with 8 mm
      footprints covers the 25 mm tape with overlap. Nothing in the candidate looks
      obviously broken, and no earlier race exists to show it is worse than anything
      else. Its main untested risks are on the slalom and sharp bends, where kd 0.1
      may be too little damping and base_speed 1.6 may be too high for the turns.
      Those risks can only be settled by racing. Next revision, if the race shows
      line loss or steering oscillation: raise kd, or lower base_speed. If the race
      shows completion with high rms_error on the bends: raise kp slightly. If the
      race shows completion_time well under 3 s with low rms_error: keep the controller
      and test the geometry only if a later iteration needs more margin.


      ### Requested changes


      - If line_loss_events or max_error spike on the slalom or sharp bends: lower
      controller.base_speed (for example 1.6 to 1.2) and raise controller.kd (for
      example 0.1 to 0.3), keeping the other fields as they are.

      - If steering_oscillation is high while completion is good: raise controller.kd
      only, in steps of about 0.1, and leave kp unchanged.

      - If completion is reached but completion_time is near 3 s with low rms_error:
      raise controller.base_speed (for example 1.6 to 1.8) before changing any gain.


      - [Open this output](iteration-0/entityR1/versions/a3fee6f6f42a4e2ba72ecc5d1ed3f468/payload.json)

