map:
  id: race-118-opt-eval
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: kp 3.0 steering test
    notes: 'Raises kp from 2.5 to 3.0 as the only change, since iteration 3 still
      reached max_error of about 0.06 m on every track with low steering oscillation.
      The s-bend line-loss rise (1.15 to 2.0 from kp 2.0 to 2.5) is the main risk
      being tested.


      ### Rationale


      Evidence. Iteration 3 (kp 2.5, sensor_size 0.016, base_speed 1.3, kd 0.3, weights
      [2,1,0,-1,-2], last_direction) is the best raced design at 159.2. The race still
      ended every run off_track. max_error stayed at 0.0606 (oval), 0.0623 (s-bend)
      and 0.0616 (slalom), against the 0.06 m limit. steering_oscillation stayed low
      at 0.14 to 0.28, so there is room for more steering gain. Oval finishes improved
      (3 of 20, mean time 1.89 s), so base_speed 1.3 is not too slow there. Line_loss_events
      were 1.25, 2.0 and 1.0. On the s-bend they rose from 1.15 at kp 2.0 to 2.0 at
      kp 2.5, so higher kp may cause overshoot on that track as well as help the oval.


      Change. Following the Evaluator''s rule (c), I raise controller.kp from 2.5
      to 3.0 as the only change. max_error still reaches 0.06 m with steering_oscillation
      low, so steering authority is still the binding limit. base_speed, kd, ki, sensor_size,
      weights and line_loss stay fixed so the effect of kp is isolated.


      Expected result. max_error should fall toward about 0.058 m on the oval and
      slalom. The s-bend is the main risk: line_loss_events may rise above 2 if kp
      overshoots there, and steering_oscillation may rise above 0.3.


      Hypotheses and next measurements. (1) If max_error drops below 0.058 m but completion_time
      exceeds 3 s on the s-bend or slalom, raise base_speed to 1.5 with kp 3.0. (2)
      If s-bend line_loss_events rise above 2 while max_error does not improve, kp
      has passed its useful range; return to kp 2.5 and test controller.line_loss
      = search_right as the only change, per rule (d). (3) If max_error stays at 0.06
      m with kp 3.0, the limit is not steering gain alone, and the next lever is kd
      (raise toward 0.5 if steering_oscillation stays low). I need per-track max_error,
      line_loss_events, progress, completion_time and steering_oscillation.


      - [Open this output](iteration-4/entity0/versions/dac423b5722e490f9192079764705ba2/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-2784d8955aa8a4c1/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-37c669e7e7c418f0/payload.json)'
  - id: entityR1
    label: Approve kp 3.0 test
    notes: 'Approved the single-field change kp 2.5 to 3.0 on the best raced geometry
      (iteration 3, score 159.2), as an informative test with low steering oscillation.
      Feedback flags that kp 2.0 to 2.5 barely moved max_error and that s-bend line
      loss rose with kp, so the next step is set by the race telemetry.


      ### Feedback


      This candidate is valid and changes one field from the best raced design (iteration
      3, score 159.2): controller.kp 2.5 to 3.0. Everything else stays fixed: sensor_size
      0.016, base_speed 1.3, kd 0.3, ki 0.05, weights [2,1,0,-1,-2], last_direction.
      The change follows the iteration 3 plan: max_error stayed at 0.06 m on every
      track, and steering_oscillation was low (0.14 to 0.28), so steering authority
      is the remaining lever. Two cautions from the evidence. First, kp 2.0 to 2.5
      barely moved max_error (oval 0.0618 to 0.0606, s-bend 0.0616 to 0.0623, slalom
      0.0622 to 0.0616), so the claim that kp 3.0 will pull max_error toward 0.058
      m is not well supported. Second, s-bend line_loss_events rose from 1.15 (iteration
      2) to 2.0 (iteration 3), which suggests overshoot as kp rises. Next revision,
      depending on the race: (a) if s-bend line_loss_events rise above 2 while max_error
      does not fall below 0.06 m, return to kp 2.5 and test controller.line_loss =
      search_right as the only change. (b) If max_error falls below about 0.058 m
      and line_loss_events stay at 1 or less but completion_time is above 3 s, raise
      base_speed to 1.5 with kp held. (c) If max_error is still about 0.06 m with
      steering_oscillation low, the limit is not kp alone; try kd toward 0.5, as the
      only change.


      ### Requested changes


      - If s-bend line_loss_events rise above 2 or max_error stays at about 0.06 m
      with kp 3.0: return controller.kp to 2.5 and change only controller.line_loss
      from last_direction to search_right, since iteration 3 showed line loss rising
      with kp (1.15 at kp 2.0, 2.0 at kp 2.5 on the s-bend).

      - If max_error falls below about 0.058 m, line_loss_events stay at 1 or less,
      but completion_time exceeds 3 s: raise controller.base_speed from 1.3 to 1.5,
      keeping the higher kp and sensor_size 0.016.

      - If max_error is still about 0.06 m with steering_oscillation low (iteration
      3 showed 0.14 to 0.28): keep kp and change controller.kd from 0.3 toward 0.5
      as the only change, since kd 0.3 left oscillation well damped.


      - [Open this output](iteration-4/entityR1/versions/f7584114c9594296b2e48fbba15ae0cf/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/dac423b5722e490f9192079764705ba2/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-37c669e7e7c418f0/payload.json)'
