map:
  id: race-118-opt-eval
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: kp 2.5, search_right loss
    notes: 'Reverts kp 3.0 to the best raced kp 2.5 (score 159.2) and changes only
      line_loss to search_right, since kp 3.0 scored 83.5 with higher s-bend line
      loss and max_error. Tests whether line losses are one-sided.


      ### Rationale


      Evidence. Iteration 4 raised kp from 2.5 to 3.0 and scored 83.5, down from 159.2
      at kp 2.5. The change made things worse, so the Evaluator''s kp 3.0 candidate
      (written before that race) is no longer the right step. Compared with iteration
      3, max_error rose on the oval (0.0606 to 0.0633) and s-bend (0.0623 to 0.0657)
      and was unchanged on the slalom (0.0616). s-bend line_loss_events rose from
      1.15 (kp 2.0) to 2.0 (kp 2.5) to 2.0 (kp 3.0). Oval finishes fell from 3 to
      0. steering_oscillation stayed low (0.11 to 0.28), so the problem is overshoot
      and line loss at high kp, not jitter. The Evaluator''s rule (a) applies: return
      to kp 2.5 and change only controller.line_loss.


      Change. I return to the best raced design (iteration 3, score 159.2) and change
      one field: controller.line_loss from last_direction to search_right. Iteration
      3 showed line loss still occurring at about 1 to 2 events per run with the footprint
      already at its maximum (0.016). search_right fixes the signal at +1 (steer left)
      during a loss, which tests whether losses mostly happen on one side of the tape.
      All other fields stay as in iteration 3: sensor_size 0.016, base_speed 1.3,
      kp 2.5, ki 0.05, kd 0.3, weights [2,1,0,-1,-2].


      Expected result. If losses are mainly on the right side of the tape, line_loss_events
      should fall below 1.0 per run and max_error should stay near 0.06 m or lower.
      If losses are on the left, line_loss_events may rise, and the next step is to
      test search_left as the only change. I do not expect a large gain in score,
      since max_error at about 0.06 m is set by steering authority.


      Hypotheses and next measurements. (1) H1: line losses are one-sided, so search_right
      lowers line_loss_events on the s-bend and slalom. (2) H2: if line_loss_events
      are unchanged, the loss is not the binding limit, and the next lever is kd toward
      0.5 (only if steering_oscillation stays low) or base_speed 1.5 (only if max_error
      falls below about 0.058 m and completion_time exceeds 3 s). Per-track measurements
      needed: max_error, line_loss_events, progress, completion_time, and steering_oscillation.


      - [Open this output](iteration-5/entity0/versions/c4112602b87f47cc91f3a9db4a5f3cc6/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-8601996d592fbdef/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-b11a94c4cd9b5cca/payload.json)'
  - id: entityR1
    label: Approve kp 3.0 test
    notes: 'Approved the single-field change kp 2.5 to 3.0 on the best raced geometry
      (iteration 3, score 159.2), as an informative test with low steering oscillation.
      Feedback flags that kp 2.0 to 2.5 barely moved max_error and that s-bend line
      loss rose with kp, so the next step is set by the race telemetry.


      ### Feedback


      This candidate is valid and changes one field from the best raced design (iteration
      3, score 159.2): controller.kp 2.5 to 3.0. Everything else stays fixed: sensor_size
      0.016, base_speed 1.3, kd 0.3, ki 0.05, weights [2,1,0,-1,-2], last_direction.
      The change follows the iteration 3 plan: max_error stayed at 0.06 m on every
      track, and steering_oscillation was low (0.14 to 0.28), so steering authority
      is the remaining lever. Two cautions from the evidence. First, kp 2.0 to 2.5
      barely moved max_error (oval 0.0618 to 0.0606, s-bend 0.0616 to 0.0623, slalom
      0.0622 to 0.0616), so the claim that kp 3.0 will pull max_error toward 0.058
      m is not well supported. Second, s-bend line_loss_events rose from 1.15 (iteration
      2) to 2.0 (iteration 3), which suggests overshoot as kp rises. Next revision,
      depending on the race: (a) if s-bend line_loss_events rise above 2 while max_error
      does not fall below 0.06 m, return to kp 2.5 and test controller.line_loss =
      search_right as the only change. (b) If max_error falls below about 0.058 m
      and line_loss_events stay at 1 or less but completion_time is above 3 s, raise
      base_speed to 1.5 with kp held. (c) If max_error is still about 0.06 m with
      steering_oscillation low, the limit is not kp alone; try kd toward 0.5, as the
      only change.


      ### Requested changes


      - If s-bend line_loss_events rise above 2 or max_error stays at about 0.06 m
      with kp 3.0: return controller.kp to 2.5 and change only controller.line_loss
      from last_direction to search_right, since iteration 3 showed line loss rising
      with kp (1.15 at kp 2.0, 2.0 at kp 2.5 on the s-bend).

      - If max_error falls below about 0.058 m, line_loss_events stay at 1 or less,
      but completion_time exceeds 3 s: raise controller.base_speed from 1.3 to 1.5,
      keeping the higher kp and sensor_size 0.016.

      - If max_error is still about 0.06 m with steering_oscillation low (iteration
      3 showed 0.14 to 0.28): keep kp and change controller.kd from 0.3 toward 0.5
      as the only change, since kd 0.3 left oscillation well damped.


      - [Open this output](iteration-4/entityR1/versions/f7584114c9594296b2e48fbba15ae0cf/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/dac423b5722e490f9192079764705ba2/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-37c669e7e7c418f0/payload.json)'
