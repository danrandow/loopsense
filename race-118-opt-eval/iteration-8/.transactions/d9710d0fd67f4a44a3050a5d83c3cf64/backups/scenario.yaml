map:
  id: race-118-opt-eval
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Approved best design, LL
    notes: 'Resubmits the Evaluator-approved build unchanged: iteration 5 best design
      (kp 2.5, kd 0.3, sensor 0.016) with search_left line loss. Iteration 7 showed
      line-loss direction changed nothing (max_error about 0.060 to 0.062 m), so the
      planned next test is ki 0.1.


      ### Rationale


      Evidence: Iteration 7 raced the search_left variant of the best design and scored
      159.12, against 160.41 for search_right in iteration 5. Line-loss events were
      unchanged (s-bend 2.0, slalom 1.0, oval 1.25 vs 1.3), and max_error stayed at
      0.0604 to 0.0623 m on every track. Every run still ends off_track, and steering_oscillation
      is low (0.14 to 0.28), so the line-loss direction is not the binding limit.
      Completion_time is not the limit either: the oval finish at 1.89 s shows base_speed
      1.3 is adequate, and the failures are off-track excursions.


      Change: None from the Evaluator-approved build. The approved build (kp 2.5,
      sensor_size 0.016, base_speed 1.3, kd 0.3, ki 0.05, weights [2,1,0,-1,-2], line_loss
      search_left) races unchanged, as the approval requires.


      Expected result: a score close to 159 to 160, with max_error about 0.060 to
      0.062 m and line_loss_events unchanged.


      Hypotheses and next step: The binding limit is steering geometry or the integral
      term, not line-loss handling or kp/kd. Per the Evaluator''s rule for this case,
      the next single-field test is controller.ki from 0.05 to 0.1, to check whether
      steady bias contributes to the 0.06 m excursions. Base_speed 1.5 is held back
      because completion_time is not limiting. Measurements needed per track: max_error,
      line_loss_events, steering_oscillation, progress, completion_time and completion.


      - [Open this output](iteration-8/entity0/versions/29bea5686f2446ebbbaaebcd946f4fb0/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-b8c562454893178f/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-1b2e58353a019a66/payload.json)'
  - id: entityR1
    label: 'Revise: ki test on best'
    notes: 'The reviewed candidate repeats iteration 7 (159.12) and its rationale
      does not match its ki field. I ask for the best raced design (iteration 5, 160.41,
      search_right) with only ki changed from 0.05 to 0.1, since kp, kd and line-loss
      direction have each been tested without a gain. Evidence is the iteration 3
      to 7 outcome table.


      ### Feedback


      Revise. The candidate in front of me is the iteration 7 design (kp 2.5, sensor_size
      0.016, base_speed 1.3, kd 0.3, ki 0.05, weights [2,1,0,-1,-2], line_loss search_left).
      Iteration 7 already raced it and scored 159.12, so racing it again adds no new
      information. Its rationale also says the next test is ki 0.05 to 0.1, but the
      controller field still reads ki 0.05. The rationale and the field do not match.
      Iteration 5 (search_right, otherwise identical) is the best raced design at
      160.41. Iteration 7 showed the line-loss side changes almost nothing (s-bend
      line_loss_events 2.0 on both, slalom 1.0 on both, oval 1.25 vs 1.3). Every run
      since iteration 2 has ended off_track with max_error of about 0.060 to 0.063
      m. Steering gain is exhausted, since kp 3.0 (iteration 4) overshot and kd 0.45
      (iteration 6) pushed oval steering_oscillation to 0.333 and raised max_error.
      The untested lever is the integral term. Use the best design (line_loss search_right)
      and change only ki, from 0.05 to 0.1. Keep base_speed at 1.3, since oval finishes
      at 1.89 s show speed is adequate. Interpret the race as follows. If max_error
      falls on the oval and slalom, or line_loss_events fall on the s-bend, keep ki
      0.1. If steering_oscillation rises above 0.3 on any track, or max_error rises
      above the iteration 5 values (0.0604, 0.0623, 0.0616 m), revert ki to 0.05 and
      stop tuning the controller gains.


      ### Requested changes


      - Start from the iteration 5 design (best raced, 160.41): controller.line_loss
      search_right, kp 2.5, kd 0.3, base_speed 1.3, sensor_size 0.016, weights [2,1,0,-1,-2].
      Change only controller.ki from 0.05 to 0.1, because iteration 7 showed line-loss
      direction changes little and the ki field in this candidate has not been moved.

      - If ki 0.1 raises max_error above the iteration 5 values (0.0604 oval, 0.0623
      s-bend, 0.0616 slalom) or steering_oscillation above 0.3 on any track, revert
      controller.ki to 0.05 and make no further gain changes, since kp, kd and line_loss
      have each been tested.

      - If max_error and line_loss_events are both unchanged with ki 0.1, and completion_time
      is limiting on any track, test controller.base_speed 1.5 as the only next change,
      since iteration 5 shows speed is otherwise adequate.


      - [Open this output](iteration-8/entityR1/versions/15f577529e3c44c4b51503091137de99/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/29bea5686f2446ebbbaaebcd946f4fb0/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-1b2e58353a019a66/payload.json)'
