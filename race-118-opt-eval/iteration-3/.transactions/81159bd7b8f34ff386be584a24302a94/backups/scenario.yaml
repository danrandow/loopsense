map:
  id: race-118-opt-eval
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: kp 2.5 with 16mm sensors
    notes: 'Keeps the 16 mm footprint, which cut line-loss events on the oval and
      s-bend, and raises kp from 2.0 to 2.5 to address max_error still reaching about
      0.062 m. Based on iteration 1 and 2 race telemetry.


      ### Rationale


      Evidence. Iteration 1 (sensor 0.012, score 128.9) and iteration 2 (sensor 0.016,
      score 115.4) both ended every run off_track. max_error stayed at 0.062 to 0.063
      m against the 0.06 m limit on all tracks, and rms_error was about 0.023 to 0.029
      m, so the robot tracks the line on average but makes short excursions past the
      edge. Going from 0.012 to 0.016 cut line_loss_events on the oval (1.9 to 1.2)
      and s-bend (1.85 to 1.15), and gave the only oval finish (1 of 20). Its mean
      score fell mainly because oval progress dropped (0.61 to 0.48). The slalom line-loss
      count (1.0) did not change. steering_oscillation (0.14 to 0.28) is low, so kd
      0.3 is not too much damping. The body width cannot widen the off-track limit,
      which stays at 0.06 m.


      Change. I keep sensor_size at 0.016, since it reduces line loss on two tracks
      and gives the best oval finish, and I raise controller.kp from 2.0 to 2.5. This
      follows the Evaluator''s conditional rule for the case where line loss falls
      but max_error still reaches about 0.06 m on bends: the limit is steering authority,
      not signal loss. base_speed 1.3, kd 0.3, ki 0.05, weights [2,1,0,-1,-2] and
      last_direction stay unchanged so the effect of kp is isolated.


      Expected result. max_error should drop below about 0.058 m on the s-bend and
      slalom, and line_loss_events should stay near 1 or lower. Progress on the oval
      should rise. Risk: a higher kp may increase steering_oscillation, which I will
      watch.


      Hypotheses and next measurements. (1) If max_error falls below 0.06 but completion_time
      is above 3 s, raise base_speed to 1.5 with kp 2.5. (2) If max_error still reaches
      0.06 with kp 2.5, try kp 3.0 and check whether steering_oscillation rises sharply.
      (3) If line_loss_events stay at 1 or more per run, test controller.line_loss
      = search_right as the only change. I need per-track max_error, line_loss_events,
      progress, completion_time and steering_oscillation.


      - [Open this output](iteration-3/entity0/versions/1fec60f9204e4dc0a0d54cb57e190455/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-861535050a8a5b00/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-24df151ac09b8913/payload.json)'
  - id: entityR1
    label: 'Approve: 16mm footprint'
    notes: 'Approved the single-change candidate (sensor_size 0.012 to 0.016, controller
      unchanged) because iteration 1 showed 1 to 1.9 line-loss events per run and
      max_error about 0.063 m, and an isolated footprint test is valid and cheap to
      race. Feedback sets the next step (kp, base_speed or line_loss) depending on
      the race telemetry.


      ### Feedback


      Written before this candidate races, so it states no outcome for it. The candidate
      is valid and changes one field from the best raced design (iteration 1, score
      128.9): sensor_size 0.012 to 0.016. The controller stays at base_speed 1.3,
      kp 2.0, ki 0.05, kd 0.3, weights [2,1,0,-1,-2], last_direction. That isolates
      the footprint effect, which is what the iteration 1 telemetry asked for. In
      iteration 1 every run ended off_track with max_error about 0.062 to 0.063 m
      against the 0.06 m limit, and line_loss_events were 1.0 to 1.9 per run (oval
      1.9, s-bend 1.85, slalom 1.0). The line is still being lost, so the footprint
      change is the right first lever. Steering_oscillation was 0.14 to 0.28, which
      is low enough that kd 0.3 is not yet a problem. Risk to watch: a 16 mm footprint
      on a 12 mm sensor pitch makes each reading less sharp across the tape edge,
      so the signal may be less responsive on tight bends. Next race: (a) if line_loss_events
      drop but max_error still reaches about 0.06 m on the s-bend or slalom, the limit
      is steering authority on bends, not signal loss, so raise controller.kp in steps
      of about 0.5 (2.0 to 2.5) and keep sensor_size 0.016. (b) If the robot stays
      on the line (max_error well under 0.06 m, line_loss_events near 0) but completion_time
      is above 3 s, raise controller.base_speed in steps of 0.2 (1.3 to 1.5), keeping
      kd 0.3. (c) If line loss persists at 1 or more per run even at 0.016, do not
      change the footprint again (it is already the maximum); change controller.line_loss
      only if the loss events fall with it, otherwise look at sensor weights.


      ### Requested changes


      - If line_loss_events fall but max_error still reaches about 0.06 m on the s-bend
      or slalom: raise controller.kp from 2.0 to 2.5 (then 3.0 if needed), keeping
      geometry.sensor_size 0.016 and kd 0.3.

      - If the robot stays on the line (max_error well under 0.06 m, line_loss_events
      near 0) but completion_time exceeds 3 s: raise controller.base_speed from 1.3
      to 1.5, keeping kd 0.3 and sensor_size 0.016.

      - If line_loss_events stay at 1 or more per run with sensor_size 0.016: the
      footprint is at its maximum, so test controller.line_loss as the only change
      next (for example search_right in place of last_direction) and keep the rest
      fixed, as the iteration 1 evidence showed the footprint alone is not enough.


      - [Open this output](iteration-2/entityR1/versions/47c2c9f2233143a4b7a40cef671e0fe6/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/71ac0e5d1534410191a5c3a0031664de/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-042a0398a15098a8/payload.json)'
