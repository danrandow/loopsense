map:
  id: race-165-randow-maps
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Sensor size 16 mm test
    notes: 'Keeps the baseline 0.18 m, 0.8 kg body and ±0.03 m, y=0.04 array, and
      changes only sensor_size from 12 to 16 mm. Iteration 3 showed s-bend progress
      0.16 with 1 line-loss event, which confirms the lighter body was the cause of
      the earlier drop.


      ### Rationale


      Iteration 3 has now raced. It kept the baseline body (0.18 m long, 0.8 kg) with
      the wider ±0.03 m spread at 15 mm spacing and the 4 cm row. Its s-bend progress
      was 0.16 with 1 line-loss event, against 0.1275 with 2 events for iteration
      2. That isolates the drop to the lighter, shorter body, not to the spread, since
      the spread gave the 1 line-loss event. The rule set by the Integrator applies:
      progress at or above 0.15 with line loss at or below 1 means the body was the
      cause and the sensor_size 0.016 test is now appropriate. I therefore keep the
      baseline body and the ±0.03 m, y=0.04 array, and change sensor_size from 0.012
      to 0.016 to cover more of the 25 mm tape at the edges. Expected result: s-bend
      line loss stays at or below 1, s-bend progress holds at 0.16 or rises, and the
      score is at or above the 52.1 of iteration 3. The main risk is that larger footprints
      blur the signal at small offsets and reduce centring precision, so rms_error
      and steering_oscillation are the measurements to watch. The off-track limit
      is still the 0.06 m floor for every allowed body width, so body width stays
      at 0.12 m. Wheel track, wheel radius and mass stay unchanged, so the only changes
      from iteration 3 are the sensor footprint size and the body reversion already
      confirmed.


      - [Open this output](iteration-4/entity0/versions/9af276daf60e4759afcdb66529bf3cd2/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-2816fc2694944987/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-129b35ab771654c8/payload.json)'
  - id: entity1
    label: Baseline body, ±0.03
    notes: 'Reverts body to 0.18 m and 0.8 kg with the ±0.03 m, 15 mm spacing, y=0.04
      sensor row, and keeps iteration 2''s controller unchanged to isolate the body.
      Based on iterations 0 and 2, where s-bend progress fell from 0.185 to 0.1275
      when the body was lightened.


      ### Rationale


      Iteration 2 changed two things at once: the body (0.18 m to 0.14 m long, 0.8
      kg to 0.6 kg) and the controller (kp 2.0 to 2.5, kd 0.15, base_speed 1.6 to
      1.5). It also moved to the wider spread with the 4 cm row. Its s-bend progress
      fell from 0.185 to 0.1275, while s-bend line loss dropped from 2 to 1. The Builder
      now reverts the body to 0.18 m and 0.8 kg while keeping the ±0.03 m spread at
      15 mm spacing and the y=0.04 row. To isolate the body variable against iteration
      2, I keep the controller exactly as in iteration 2: kp 2.5, ki 0.05, kd 0.15,
      base_speed 1.5, weights [-2,-1,0,1,2], and last_direction line loss. Any change
      in progress or line loss versus iteration 2 can then be attributed to the body.
      The Builder''s sensor_size 0.016 test stays deferred until progress reaches
      at least 0.15 with line loss at or below 1. Expected score is near or above
      54, with s-bend progress recovering toward 0.15 to 0.185. This is an expectation,
      not a measurement.


      - [Open this output](iteration-3/entity1/versions/e6b893f91cb44187ac353e6c11df525d/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/637e9a7ea54b41f2a5f1fb63e01d8006/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-50c66606058e9fdd/payload.json)'
  - id: entityR1
    label: Body-isolation feedback
    notes: 'Gives conditional next steps for the Builder: keep the spread and test
      sensor_size 0.016 if progress recovers, narrow to ±0.02 if it stays near 0.13,
      or widen to ±0.036 if line loss persists. Rests on the iteration 0 to 2 scores
      and telemetry, and states no outcome for this candidate.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      evidence so far: iteration 0 (±0.02 m, y=0.04, 0.18 m body, 0.8 kg) gave s-bend
      progress 0.185 with 2 line-loss events. Iteration 1 (±0.03 m, y=0.02) cut s-bend
      line loss to 1 but collapsed progress to 0.04, so the row change is a likely
      cause. Iteration 2 (±0.03 m, y=0.04, 0.14 m body, 0.6 kg, kp 2.5, base 1.5)
      had s-bend progress 0.1275 with line loss 1. Its two changes were made together,
      so the cause is not yet isolated. Your current proposal reverts only the body,
      so this race isolates it against iteration 2. I kept the iteration 2 controller
      so that the result reflects the geometry alone. Next race: if s-bend progress
      is at or above 0.15 and line loss is at or below 1, the lighter body was the
      cause of the drop, and the wider spread with the 4 cm row is good; then the
      sensor_size 0.016 test becomes appropriate. If s-bend progress stays near 0.13
      with the baseline body, the wider spread is the cause, and the next step is
      to narrow it.


      ### Requested changes


      - If s-bend progress is at or above 0.15 and line_loss_events is at or below
      1: keep the body at 0.18 m and 0.8 kg, keep sensor_positions at y=0.04 with
      x from -0.03 to 0.03, and test sensor_size 0.016 to cover more tape at the edges.
      Evidence: iteration 0 (y=0.04, 0.18 m body) gave progress 0.185; iteration 2
      (same spread, lighter body) gave 0.1275 with line loss 1, which points at the
      body change as the cause of the drop.

      - If s-bend progress stays near 0.13 (below 0.14) with the baseline body: narrow
      the spread to x = ±0.02 at y=0.04 with 10 mm spacing, keeping the 0.18 m, 0.8
      kg body, to test whether the ±0.03 spread is what cost progress. Evidence: iteration
      0 (±0.02, y=0.04) had progress 0.185 with the same body; iteration 2 kept the
      wider spread and reached 0.1275.

      - If s-bend progress is at or above 0.15 but line_loss_events stays at 2 on
      the s-bend or slalom: widen the outer sensors to x = ±0.036 m, keeping 15 mm
      spacing for the middle three, to keep the tape under a sensor at larger drift.
      Evidence: iteration 0 had 2 line-loss events per s-bend and slalom run at ±0.02
      m, and iteration 2 at ±0.03 m reduced s-bend line loss to 1.


      - [Open this output](iteration-3/entityR1/versions/e6b893f91cb44187ac353e6c11df525d/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/637e9a7ea54b41f2a5f1fb63e01d8006/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-50c66606058e9fdd/payload.json)'
