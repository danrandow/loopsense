overrides:
  entities:
  - id: entity0
    label: Wheel track 0.14 test
    notes: 'Holds the best-raced layout (±0.03 m reach, score 271.06 at iteration
      9) and changes only wheel_track from 0.12 to 0.14 m. The slalom still shows
      line loss of 1.0, which the Integrator''s rule identifies as the remaining untested
      geometry lever.


      ### Rationale


      Iteration 9 is the best raced result at 271.06, up from 160.5 at iterations
      7 and 8. The geometry was unchanged across 7, 8 and 9, so the 110-point gain
      came from the controller. The oval now finishes 8 of 20 trials (mean progress
      0.91) and the s-bend progress rose to 0.44, which means the ±0.03 m reach with
      15 mm spacing, y = 0.04, 0.016 footprint and the 0.18 m / 0.8 kg body is confirmed
      under the new damping. The Integrator''s feedback sets the rule for this case:
      if the score holds near the best result with oval completions kept, keep ±0.03
      m and y = 0.04, and test wheel_track as a single-variable change. Slalom line_loss_events
      is still 1.0 at iteration 9 with slalom progress near 0.10, so the Integrator''s
      condition for testing wheel_track is met. Iterations 2 and 3 showed body changes
      cost progress, so body_length, mass and body_width stay fixed. Changing wheel_track
      from 0.12 to 0.14 m reduces yaw per unit wheel differential by about 14 percent,
      which changes the effective steering gain. This is a single-variable test. I
      expect slalom line loss to fall toward 0 if the line is being lost in tight
      bends because the robot turns too fast, and I expect s-bend and oval progress
      to hold. The main risk is a slower response on bends, which would show as lower
      oval completions. I will read the result against iteration 9''s 271.06.


      - [Open this output](iteration-10/entity0/versions/2dd76b7d1bab4dd9890b41def0950d1b/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-ce8a20d9fe00610b/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-4c1dd08cbe597ae3/payload.json)'
  - id: entity1
    label: Verified controller
    notes: 'Builder''s ±0.03 geometry paired with the verified kd 0.35 controller
      from iteration 7 and 8 (160.5, deterministic). Controller unchanged so any score
      shift is attributable to reach.


      ### Rationale


      The supplied geometry is the Builder''s proposal: outer sensors at x = ±0.03,
      y = 0.04, 15 mm spacing, 0.016 footprint, 0.18 m / 0.8 kg body, 0.12 m track,
      0.03 m wheels. The controller is the verified iteration 7 and 8 controller (kp
      2.5, ki 0.05, kd 0.35, base_speed 1.5, weights [-2,-1,0,1,2], last_direction).
      Iteration 8 reproduced 160.5 exactly, so the simulator is deterministic for
      that design. The outcome table records iteration 7 at x = ±0.036, not ±0.03
      as the Builder''s learning states. The ±0.03 layout with kd 0.35 has never raced,
      so this package is a geometry-side test on a verified controller. I keep the
      controller unchanged so the score difference, if any, is attributable to the
      outer-sensor reach. I do not change the geometry myself, because the Builder
      owns it. Expected result, which is not a measurement: a score near 160 if reach
      is not a strong factor under kd 0.35. A materially lower score would point at
      the reach change, not the controller.


      - [Open this output](iteration-9/entity1/versions/2339bae20d534dab8f8a970271b48bc1/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/f09675d7c1bc4d45a4a6cbc1d14c8c12/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-ee9b9fb6ffb14957/payload.json)'
  - id: entityR1
    label: Reach test and wheel
    notes: 'Corrects the Builder''s iteration 7 reach reading (table shows ±0.036).
      Sets the next race as a single-variable reach test against the verified kd 0.35
      controller, with wheel_track as the next lever.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      outcome table records the 160.5 result (iterations 7 and 8) at outer sensors
      x = ±0.036, not ±0.03 as your learning states. Iteration 6 (±0.036, kd 0.25)
      scored 97.7, so the jump to 160.5 came from kd 0.25 to 0.35 with reach unchanged.
      Reach at ±0.03 with kd 0.35 has never raced, so this candidate is the one-variable
      test of reach against the verified controller. Read the next race as follows.
      If the score holds near 160 with oval completions kept, ±0.03 is sufficient
      and you should keep it. If the score falls well below 160 and oval completions
      are lost, reach was helping, so return to ±0.036 and keep kd 0.35. If slalom
      line_loss_events stays at 1 or more, the geometry lever still open is wheel_track.


      ### Requested changes


      - If the score holds near 160 with oval completions kept: keep outer sensors
      at x = ±0.03 and y = 0.04, and test wheel_track 0.14 (from 0.12) as a single-variable
      change. Evidence: iteration 7 (±0.036 with kd 0.35) gave 160.5 and iteration
      8 reproduced it exactly; the wheel_track lever has never been raced.

      - If the score falls well below 160 with oval completions lost: restore outer
      sensors to x = ±0.036 with everything else unchanged. Evidence: the verified
      160.5 design is at ±0.036 (iteration 7), and iteration 6 at ±0.036 with kd 0.25
      scored 97.7.

      - Do not change body_length or mass. Evidence: iteration 2 (0.14 m, 0.6 kg)
      cut s-bend progress from 0.16 to 0.1275, and iteration 3 recovered it to 0.16
      on the baseline body.


      - [Open this output](iteration-9/entityR1/versions/2339bae20d534dab8f8a970271b48bc1/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/f09675d7c1bc4d45a4a6cbc1d14c8c12/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-ee9b9fb6ffb14957/payload.json)'
