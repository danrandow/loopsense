map:
  id: race-165-randow-maps
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Baseline body, ±0.03 row
    notes: 'Keeps the 4 cm row and ±0.03 m spread that cut s-bend line loss in iteration
      2, and reverts the body to 0.18 m and 0.8 kg to test whether the body change
      caused the progress drop from 0.185 to 0.13. Based on scores of 54.3, 36.3 and
      46.4 and the integrator''s conditional rules.


      ### Rationale


      Scores so far: iteration 0 = 54.3 (y=0.04, x ±0.02, 10 mm spacing, body 0.18
      m x 0.12 m, 0.8 kg), iteration 1 = 36.3 (y=0.02, x ±0.03), iteration 2 = 46.4
      (y=0.04, x ±0.03, body 0.14 m, 0.6 kg). Two changes in iteration 2 were made
      together, so I cannot yet separate their effects. The clearest signal is the
      s-bend: progress fell from 0.185 to 0.1275, while line-loss events dropped from
      2 to 1. This suggests the wider ±0.03 spread helps line retention, and the drop
      in progress comes from either the 4 cm row being unchanged (so not the row)
      or the lighter, shorter body, which is the main suspect. The integrator''s rule
      covers this case directly: progress is below 0.15, so I should not change sensor_size
      to 0.016 yet. Their conditional instruction, for progress below 0.10 with low
      line loss, says to revert the body to 0.18 m and 0.8 kg. Progress here is 0.1275,
      slightly above that threshold, but it is still well below the 0.185 seen with
      the baseline body, and the iteration-2 score fell. I will therefore revert the
      body to the iteration-0 values (length 0.18, mass 0.8) while keeping the ±0.03
      spread with 15 mm spacing and the y=0.04 row. This isolates the body variable
      against iteration 2 and tests whether the wider spread and 4 cm row preserve
      the baseline''s s-bend progress with fewer line losses. Wheel track, wheel radius
      and body width stay at their baseline values. I expect a score near or above
      54, with s-bend line loss at or below 1 and progress recovering toward 0.18.
      If progress stays near 0.13 with the body reverted, the wider spread is the
      likely cause of the progress loss, and the next step is to test the ±0.02 spread
      at y=0.04.


      - [Open this output](iteration-3/entity0/versions/637e9a7ea54b41f2a5f1fb63e01d8006/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-44a05aed517ac6c6/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-50c66606058e9fdd/payload.json)'
  - id: entity1
    label: Lighter body, 4 cm row
    notes: 'Restores the 4 cm sensor row and keeps the wider +/-0.03 m spread from
      the Builder''s proposal, with a shorter and lighter body (0.14 m, 0.6 kg). kp
      2.5 and kd 0.15 are set from iterations 0 and 1.


      ### Rationale


      Iteration 0 (y=0.04, +/-0.02 m, 4 cm row) gave s-bend progress 0.185, the best
      progress seen, but 2 line-loss events per s-bend and slalom run. Iteration 1
      (y=0.02, +/-0.03 m) cut s-bend line loss to 1 but collapsed s-bend progress
      to 0.04, so the shorter row or the lower kp/base_speed mix hurt bends. I adopt
      the Builder''s intent: restore the 4 cm row and keep the +/-0.03 m spread at
      15 mm spacing. The Builder''s body change (length 0.14 m, mass 0.6 kg) cuts
      yaw inertia from about 0.031 to about 0.017 kg m^2, so the same wheel differential
      turns faster. To keep the signal scale the Builder needs, I use kp 2.5, since
      the wider spread gives a lower signal per metre of offset (about 67 weight per
      metre against 100 in iteration 0). I set kd to 0.15 because the 4 cm lookahead
      needed that damping in iteration 0. The lighter robot is more responsive, so
      I lower base_speed only slightly, from 1.6 to 1.5, to limit overshoot while
      keeping enough speed for the 3 s limit. Weights stay symmetric at [-2,-1,0,1,2]
      and line_loss stays last_direction, which recovered from short losses in iteration
      0. Expected result is progress and line loss better than iteration 1 and a score
      near iteration 0, but I state no measured outcome for this candidate.


      - [Open this output](iteration-2/entity1/versions/2d8a1126bae84435bebfc5123bc54e13/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/e3086be60f964995a6845a86e7f1e9c2/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-38c5205e18eae241/payload.json)'
  - id: entityR1
    label: Row back to 4 cm, test
    notes: 'Feedback asks the Builder to restore the 4 cm row and then check the body
      change separately, depending on the next s-bend progress and line-loss result.
      It rests on iteration 0 (progress 0.185) and iteration 1 (progress 0.04).


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. Iteration
      0 (4 cm row, +/-0.02 m) had the best progress, 0.185 on the s-bend, but 2 line-loss
      events per s-bend and slalom run. Iteration 1 (2 cm row, +/-0.03 m) reduced
      s-bend line loss to 1 but cut s-bend progress to 0.04, so the row position and
      the controller changes together are the likely cause. The next race is the test:
      if s-bend progress recovers toward 0.185 while line loss stays at or below 1,
      keep the 4 cm row and change only the body. If progress stays low, return the
      body to 0.18 m and 0.8 kg to separate the effects. The rule for the outer sensors
      is also the same: keep 15 mm spacing and symmetric weights, because I have had
      to raise kp to match the lower signal per metre.


      ### Requested changes


      - If s-bend progress is at or above 0.15 and line_loss_events is at or below
      1: keep sensor_positions at y=0.04 with x from -0.03 to 0.03, and try sensor_size
      0.016 to cover more tape at the edges. Evidence: iteration 0 (y=0.04) gave progress
      0.185; iteration 1 (y=0.02) gave 0.04 with line loss halved.

      - If progress is below 0.10 on the s-bend while line loss stays low: revert
      body_length to 0.18 and mass to 0.8, keeping the spread and row, to test whether
      the lighter body caused the drop. Evidence: iteration 1 progress fell to 0.04
      with no change to body geometry, which suggests the sensing changes were the
      main cause, so the body change must be checked separately.

      - If steering_oscillation stays above 0.15 on the slalom while rms_error is
      below 0.03: move the row to y=0.03 as a compromise between the 4 cm and 2 cm
      lookahead. Evidence: iteration 0 oscillation was 0.163 on the slalom at y=0.04,
      and iteration 1 oscillation was 0.155 at y=0.02, so the lookahead alone did
      not clearly control jitter.


      - [Open this output](iteration-2/entityR1/versions/2d8a1126bae84435bebfc5123bc54e13/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/e3086be60f964995a6845a86e7f1e9c2/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-38c5205e18eae241/payload.json)'
