  id: race-165-randow-maps
  schema: v0.2
  scenario: Iteration 1
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 0.
dimensions:
  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Wider, nearer sensor row
    notes: 'Widened the sensor array to ±0.03 m at 15 mm spacing and moved it to 2
      cm ahead of the axle. The baseline ended all 60 trials off track at the 0.06
      m limit with 1 to 2 line-loss events per run, which points at tape leaving the
      narrow array and a long lookahead.


      ### Rationale


      The baseline ended every run off track at max_error about 0.06 m, which is the
      off-track limit (the body-width term is only 0.0425 m at width 0.12, so the
      floor of 0.06 applies). Progress was only 0.10 to 0.19, so the robot is leaving
      the tape early on every track. Line-loss events of 1 to 2 per run and oscillation
      of 0.07 to 0.16 point at the sensor array, not only at the controller. The 10
      mm spacing with 12 mm footprints spans only about ±0.02 m, so when the robot
      drifts about 3 cm the tape leaves the array. The 4 cm forward offset also gives
      a long lookahead, which adds lag on the bends. I widen the outer sensors to
      ±0.03 m, which keeps tape under a sensor out to about 0.036 m of drift, and
      keep five sensors at 15 mm spacing so the centre still resolves small offsets.
      I move the row from y = 0.04 to y = 0.02 to shorten the lookahead and reduce
      the overshoot that drove the oscillation. Body width stays at 0.12 because any
      width from 0.08 to 0.18 leaves the off-track limit at 0.06 m, so it gives no
      benefit. The wheel track and radius stay as in the baseline so the change is
      isolated to sensing. I expect fewer line-loss events, a lower max_error, and
      more progress, while completion time depends on the controller''s base speed.


      - [Open this output](iteration-1/entity0/versions/bf626d58113847a1a1912ee7c35dbf6b/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-a38d313a09413f9c/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-520ab2fcccf400d9/payload.json)'
  - id: entity1
    label: Wider array, retuned PD
    notes: 'Complete robot for the ±0.03 m, y = 0.02 m array, with kp raised to 2.5,
      kd lowered to 0.12 and base_speed reduced to 1.4. The changes compensate for
      the lower signal gain of the wider spacing and the shorter lookahead, based
      on iteration 0 failing with off-track ends at max_error about 0.06 m.


      ### Rationale


      The Builder''s proposal widens the array to x = ±0.03 m at 15 mm spacing and
      moves the row to y = 0.02 m. The baseline evidence is all off-track ends at
      max_error about 0.06 m, with 1 to 2 line-loss events per run, 0.07 to 0.16 steering
      oscillation, and progress of 0.10 to 0.19. Two effects follow from the new geometry.
      First, the outer sensors sit further out, so the signal per metre of offset
      is lower: a weight of ±2 at ±0.03 m gives about 67 weight per metre against
      about 100 in the baseline. I raise kp from 2.0 to 2.5 to restore roughly the
      baseline steering gain. Second, the shorter lookahead reduces lag, so the derivative
      term can drop from 0.15 to 0.12 without losing damping. I keep the symmetric
      weights [-2, -1, 0, 1, 2] so the signal sign convention matches the contract
      (positive x is left, positive signal steers left). I lower base_speed from 1.6
      to 1.4. The robot has been leaving the tape early on every track, so a finish
      is worth more than a slightly faster time, and completion time costs at most
      60 points out of 3 s. The 1.4 setting still needs about 1.3 m/s or more to finish
      within 3 s, so it is a trade-off to check in the race. ki stays at 0.05 and
      last_direction stays as the line-loss rule, because it recovered from short
      losses in the baseline without a catastrophic failure. Expected result is a
      stronger steering response that holds the tape under the wider array, with fewer
      line losses and lower oscillation. This is an expectation and has not been measured.


      - [Open this output](iteration-1/entity1/versions/9466581e8ada47ef9b78288605f0f801/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/bf626d58113847a1a1912ee7c35dbf6b/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-520ab2fcccf400d9/payload.json)'
  - id: entityR1
    label: Widen then move row to
    notes: 'Feedback written before the race, with three conditional changes tied
      to the baseline''s line loss, oscillation and max_error. It states no outcome
      for this candidate.


      ### Feedback


      This feedback is written before the robot has raced, so it states no outcome
      for this candidate. The baseline (iteration 0) had all 60 trials end off track,
      with max_error about 0.06 m on every track, 1 to 2 line-loss events, steering
      oscillation 0.07 to 0.16 and progress 0.10 to 0.19. That pattern points at the
      array losing the tape under drift, since the 10 mm spacing with 12 mm footprints
      covers only about ±0.02 m. Your proposed ±0.03 m spread is the right direction.
      To keep the signal scale comparable, the integrator raised kp and lowered kd,
      so please keep the spacing near 15 mm and the weights symmetric. Next race,
      if line_loss_events is still above zero on the s-bend or slalom with max_error
      near 0.06 m, widen the outer sensors further (for example, x = ±0.036 m) so
      the tape stays under a sensor out to about 0.04 m of drift. If steering_oscillation
      stays above about 0.1 while rms_error is low, move the row to y = 0.0 (at the
      axle) to cut lookahead lag further. If the robot leaves the track with line
      loss at 0 and max_error still near 0.06 m, the limit is more likely controller
      speed or gain than geometry, so keep the sensor layout and do not change the
      body.


      ### Requested changes


      - If line_loss_events > 0 on the s-bend or slalom with max_error near 0.06 m:
      widen the outer sensors to x = ±0.036 m, keeping 15 mm spacing for the middle
      three. Evidence basis: iteration 0 showed line loss of 1 to 2 events per run
      and max_error of 0.06 m on every track, consistent with the tape leaving the
      ±0.02 m array.

      - If steering_oscillation stays above about 0.1 while rms_error is below 0.03:
      move the sensor row to y = 0.0 (at the axle) instead of y = 0.02. Evidence basis:
      iteration 0 oscillation of 0.07 to 0.16 on the s-bend and slalom, where the
      4 cm lookahead was the suspected cause.

      - If line_loss_events is 0 and max_error is still at the 0.06 m limit: keep
      the sensor array unchanged and test sensor_size 0.016 to cover more of the tape
      under each sensor. Evidence basis: the 12 mm footprint in iteration 0 covered
      only part of the 25 mm tape at the edges, and all trials ended off track at
      the same max_error, which points to the signal reach at the edge.


      - [Open this output](iteration-1/entityR1/versions/9466581e8ada47ef9b78288605f0f801/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/bf626d58113847a1a1912ee7c35dbf6b/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-520ab2fcccf400d9/payload.json)'
