overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor
    notes: 'Symmetric 5-sensor array (12 mm footprints, 10 mm spacing, 4 cm ahead
      of axle) on a moderate 0.12 m track body. No race data exists yet, so this sets
      a centred baseline and asks for line-loss and oscillation measurements to guide
      the next change.


      ### Rationale


      This is iteration 0 with no race data or integration feedback yet, so the design
      rests on the simulator contract alone. A 5-sensor line array gives a usable
      centroid across a 25 mm tape: with 12 mm footprints and 10 mm spacing, the outer
      sensors still see the tape when the robot drifts about 2 cm, and the centre
      sensors resolve small offsets. The sensors sit 4 cm ahead of the axle, so the
      controller reads the line before the wheels reach it, which should help on bends.
      The wheel track of 0.12 m and wheel radius of 0.03 m give a moderate turn rate
      and enough ground speed to cover roughly 4.5 m in under 3 s with a typical base
      speed. Mass 0.8 kg and body length 0.18 m keep yaw inertia moderate, so steering
      responds without much overshoot. Body width 0.12 m raises the off-track limit
      to about 0.06 m, which is the floor and matches the 12 mm footprint and track
      half-width. I expect this to complete the development tracks at moderate speed,
      with the main uncertainty being whether the 4 cm lookahead causes oscillation
      on tight slalom bends.


      - [Open this output](iteration-0/entity0/versions/496c61367cf94c93b0a89c32e86f7f22/payload.json)'
  - id: entity1
    label: Baseline 5-sensor robot
    notes: 'Symmetric baseline geometry with a conservative PD controller (kp 2.0,
      kd 0.15, base_speed 1.6, last_direction recovery). No race data yet, so values
      are contract-derived and untuned.


      ### Rationale


      Iteration 0 has no race telemetry or integration feedback, so the controller
      is designed from the simulator contract alone. The geometry is the supplied
      baseline: five sensors at y=0.04 with x from -0.02 to +0.02 (10 mm spacing),
      12 mm footprints, a 0.12 m wheel track and a 0.03 m wheel radius. Sensor weights
      are set to the sensor x-positions scaled to the [-2, 2] limit, [-2, -1, 0, 1,
      2]. Because the signal is a reading-weighted average, a line on the left (positive
      x) gives a positive signal, which steers left, as the contract requires. With
      12 mm footprints the signal magnitude stays near 1 when the tape is centred
      and approaches 2 only when the tape sits under the outermost sensors. Gains:
      kp = 2.0 gives a turn of about 2 at the outer sensors, roughly 700 PWM of differential,
      which is moderate. ki = 0.05 is kept small to avoid integral windup on long
      bends. kd = 0.15 damps oscillation from the 4 cm forward sensor lookahead. base_speed
      = 1.6 is chosen to cover about 4.5 m in under 3 s (about 1.5 m/s average) with
      margin for slowing on bends; it is below the saturation point of 2.0 to leave
      room for steering. line_loss = last_direction, so the robot keeps turning toward
      the side it last saw the tape when it drops off. Expected result: the robot
      completes the oval and s-bend at moderate speed; the slalom is the main risk.
      This is an expectation, not a measurement.


      - [Open this output](iteration-0/entity1/versions/a717e6f952214ce8aec7843fb9177da4/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/496c61367cf94c93b0a89c32e86f7f22/payload.json)'
  - id: entityR1
    label: Iteration 0 feedback
    notes: 'No earlier races exist, so the feedback rests on the contract and the
      controller choices. It gives conditional geometry changes (wider outer sensors,
      a closer sensor row, or narrower footprints) tied to the next race''s line-loss,
      oscillation and rms_error results.


      ### Feedback


      No earlier iteration exists, so this feedback rests only on what the geometry
      implies and what the controller had to handle. The baseline 12 mm footprints
      at 10 mm spacing overlap the 25 mm tape, so a centred line gives about 0.5 to
      1.0 signal on the inner sensors. Outer sensors can saturate when the line sits
      near the array edge, which is why I used a weight scale of ±2 and kp 2.0 rather
      than larger gains. The 4 cm forward offset means the controller reads the line
      before the wheels reach it, which required a derivative term (kd 0.15) to stop
      the lookahead from overshooting on bends. Once the race is run, use these rules:
      if line_loss_events is above zero or max_error exceeds 0.04 m on the slalom,
      widen the outer sensors (for example, x = ±0.03) so the tape stays under a sensor
      at the edge of the 0.06 m off-track limit. If steering_oscillation is high while
      rms_error is low, reduce the forward offset toward y = 0.02 so the controller
      reacts to the line later and less aggressively. If the robot completes with
      rms_error well under 0.02 m, try a narrower sensor_size of 0.008 to sharpen
      the signal across the tape.


      ### Requested changes


      - If line_loss_events > 0 on the slalom: widen the outer sensors to x = -0.03
      and x = +0.03, keeping the other three at the current spacing, so the array
      covers more of the 25 mm tape before the robot leaves the line. Evidence basis:
      the 0.06 m off-track limit and the 12 mm footprint leave the outer sensors near
      the edge on bends.

      - If steering_oscillation is high while rms_error is low: move the sensor row
      to y = 0.02 instead of 0.04, so the controller reads the line closer to the
      axle and reacts less aggressively. Evidence basis: the 4 cm lookahead required
      kd 0.15 in the baseline design to remain damped.

      - If the run completes with rms_error below 0.02 m and no line loss: set sensor_size
      to 0.008 to sharpen the reading across the tape, keeping the geometry otherwise
      unchanged. Evidence basis: the baseline 12 mm footprints overlap the 25 mm tape,
      which blurs the signal at small offsets.


      - [Open this output](iteration-0/entityR1/versions/a717e6f952214ce8aec7843fb9177da4/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/496c61367cf94c93b0a89c32e86f7f22/payload.json)'
