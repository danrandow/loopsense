map:
  id: race-165-randow-maps
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Wider outer sensors
    notes: 'Keeps the baseline body and 0.016 footprint, which tied the 0.012 footprint
      (score 52.20 vs 52.10). Widens only the outer sensors to ±0.036 m because slalom
      line loss stayed at 1 with progress near 0.11, as the Integrator''s rule requires.


      ### Rationale


      Iteration 4 (sensor_size 0.016 on the baseline body) scored 52.198 against 52.101
      for iteration 3 at 0.012. The change is neutral: s-bend progress 0.1585 vs 0.16,
      rms_error 0.0285 vs 0.0287, steering_oscillation 0.145 vs 0.1456, and line-loss
      events unchanged at 1. The Integrator''s rule for this case is that progress
      at or above 0.16 with rms and oscillation not worse means keep 0.016. Progress
      is 0.0015 short of that line, but rms and oscillation are marginally better
      and the score is marginally higher, and no sign of centring blur appeared, so
      I keep the 0.016 footprint. The baseline body (0.18 m, 0.8 kg) stays, because
      iteration 2 showed the lighter body cost progress. The remaining evidence points
      at the outer sensors. On the slalom, line_loss_events is still 1.0 and progress
      is 0.112, which meets the Integrator''s condition for widening the outer sensors.
      I therefore move the outer pair to x = ±0.036 m at y = 0.04 and keep the middle
      three at ±0.015 and 0 m. This keeps tape under an outer sensor at larger drift,
      which should remove the remaining slalom line loss and lift slalom progress.
      The main risk is that the outer sensors lose signal resolution near centre and
      raise rms_error, so I will watch rms_error and steering_oscillation against
      iteration 4 (0.0302 and 0.156 on the slalom).


      - [Open this output](iteration-5/entity0/versions/ac16f2e18e364c2a820880fc6a2adbc5/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-75a6ddd3380dac64/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-3faf8a3c83d9ca96/payload.json)'
  - id: entity1
    label: Baseline body, 16mm
    notes: 'Keeps the iteration 3 body and +/-0.03 m array at y=0.04 and tests sensor_size
      0.016 with the controller held fixed. Iteration 3 scored 52.1 with s-bend progress
      0.16 and 1 line-loss event, so the footprint is the only change.


      ### Rationale


      Iteration 3 is the only race on the baseline body with the wider spread, and
      it scored 52.1 with s-bend progress 0.16 and 1 line-loss event. That isolates
      the earlier drop to the lighter body. Iteration 2 (0.14 m, 0.6 kg) gave s-bend
      progress 0.1275, and iteration 3 with the baseline body recovered it to 0.16.
      The Builder''s proposal keeps that body and the +/-0.03 m, y=0.04, 15 mm array,
      and changes only sensor_size from 0.012 to 0.016. I accept the geometry unchanged.
      I also keep the iteration 3 controller exactly (base_speed 1.5, kp 2.5, ki 0.05,
      kd 0.15, weights [-2,-1,0,1,2], last_direction), so any change in progress,
      line loss or rms_error can be attributed to the sensor footprint. The main integration
      risk is that 16 mm footprints at 15 mm spacing overlap heavily, which flattens
      the signal near the centre and can raise signal magnitude at the edges. That
      changes the effective steering gain, so kp is not retuned until the race shows
      whether rms_error or oscillation moves. Expected result, which is not a measurement:
      progress at or above 0.16, line loss at or below 1, and a score near or above
      52.1. The race will show whether the larger footprint helps the edge reading
      or blurs the centring signal.


      - [Open this output](iteration-4/entity1/versions/ddec24a68b6f4d77bcda87b308debc4a/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/9af276daf60e4759afcdb66529bf3cd2/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-129b35ab771654c8/payload.json)'
  - id: entityR1
    label: Footprint test
    notes: 'Feedback gives conditional next steps for the 0.016 footprint: keep it
      if progress holds and rms does not worsen, otherwise revert to 0.012. Evidence
      is iteration 3''s progress of 0.16 and iteration 2''s drop from the lighter
      body.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. Iteration
      3 (baseline 0.18 m, 0.8 kg body, +/-0.03 m at 15 mm spacing, y=0.04, sensor_size
      0.012, kp 2.5) is the best-supported base: s-bend progress 0.16, 1 line-loss
      event, score 52.1. Iteration 2 showed that the lighter body (0.14 m, 0.6 kg)
      cut s-bend progress to 0.1275, so keep the baseline body. Iteration 0 (+/-0.02
      m) reached s-bend progress 0.185 but with 2 line-loss events, so the wider spread
      trades progress for fewer line losses. Your sensor_size 0.016 test is reasonable,
      but at 15 mm spacing the 16 mm footprints overlap, so the centre reading may
      flatten. Read the next race as follows. If progress is at or above 0.16 and
      rms_error and steering_oscillation hold, keep the larger footprint and move
      to the spread or row test below. If rms_error or steering_oscillation rises
      while progress holds, return sensor_size to 0.012 because the footprint is blurring
      the centring signal.


      ### Requested changes


      - If sensor_size 0.016 gives s-bend progress at or above 0.16 with rms_error
      and steering_oscillation not worse than iteration 3 (rms 0.0287, oscillation
      0.146): keep the 0.016 footprint and keep the body at 0.18 m and 0.8 kg. Evidence:
      iteration 3 at 0.012 gave progress 0.16 with 1 line-loss event.

      - If rms_error or steering_oscillation worsens with sensor_size 0.016 (for example
      rms above 0.03): return sensor_size to 0.012 and keep the iteration 3 geometry.
      Evidence: iteration 2''s lighter body hurt progress, so the baseline body is
      the safe base, and footprint blur is the next suspect.

      - If line_loss_events stays at 1 on the slalom and progress stays near 0.11
      there: widen the outer sensors to x = +/-0.036 m at y=0.04 with the middle three
      unchanged, to keep tape under a sensor at larger drift. Evidence: iteration
      0 (+/-0.02 m) had 2 line-loss events per slalom run, and iteration 3 (+/-0.03
      m) reduced this to 1.


      - [Open this output](iteration-4/entityR1/versions/ddec24a68b6f4d77bcda87b308debc4a/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/9af276daf60e4759afcdb66529bf3cd2/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-129b35ab771654c8/payload.json)'
