map:
  id: race-165-randow-maps
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Outer reach back to ±0.03
    notes: 'Pulls the outer sensors from ±0.036 to ±0.03 because slalom rms rose from
      0.0303 to 0.0333 after the kd change, which matches the Integrator''s rule to
      reduce reach when rms rises. The footprint, body and track are held fixed to
      isolate the reach. Evidence is iteration 6''s slalom telemetry and iteration
      4''s ±0.03 slalom rms of 0.0302.


      ### Rationale


      Iteration 6 raced the iteration 5 geometry with only the controller changed
      (kd 0.15 to 0.25). The score rose to 97.7 from 52.4, mostly on the oval (progress
      0.40 vs 0.115) and slalom (progress 0.153 vs 0.109). The slalom did not clear,
      though. Line-loss events rose to 1.35, rms_error rose from 0.0303 to 0.0333,
      and steering_oscillation rose from 0.159 to 0.195. Neither the ''line loss stays
      at 1 with progress near 0.11'' rule nor the ''line loss clears'' rule applies
      cleanly, because progress has moved away from 0.11. The rule that does match
      is the rms_error rise: the Integrator''s rule says that when slalom rms rises
      the body and sensors are not the cause, and the next move is to reduce sensor
      reach rather than widen it. The rise coincides with the kd change, so the controller
      is the more likely driver. Still, reach is the only geometry lever the Integrator
      has tied to a rule, and pulling the outer pair back from x=±0.036 to ±0.03 is
      a small, reversible change. It also returns to a layout the Integrator has already
      measured on the slalom (iteration 4, rms 0.0302). I keep the 0.016 footprint,
      the 0.18 m / 0.8 kg body, y=0.04 and the 0.12 m track fixed, so the result isolates
      the reach. The main risk is that the 97.7 score depends on the wider reach with
      the new kd, so a score drop would point at reach, not the controller.


      - [Open this output](iteration-7/entity0/versions/ebff546191e64447afa1ab036fa7ecca/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-18a2ff362fafdbc1/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-a3dcf441e11cb160/payload.json)'
  - id: entity1
    label: Geometry held, kd 0.25
    notes: 'Replicates the iteration 5 geometry unchanged so the race isolates the
      controller. The only change is kd raised from 0.15 to 0.25 to damp slalom oscillation
      (about 0.15) and the line loss that persists at 1. Evidence: iterations 3 to
      5.


      ### Rationale


      The Builder''s proposal (entity0) holds the iteration 5 geometry: baseline 0.18
      m by 0.12 m body at 0.8 kg, 0.12 m track, 0.03 m wheels, 0.016 footprint, and
      sensors at y=0.04 with x = -0.036, -0.015, 0, 0.015, 0.036. I take it unchanged
      so the race measures the controller. Across iterations 3 to 5 the controller
      has been fixed at kp 2.5, ki 0.05, kd 0.15, base_speed 1.5, last_direction.
      Slalom line loss has stayed at 1 and slalom progress at about 0.11 for every
      outer-sensor setting. Iteration 2 showed that the lighter body cut s-bend progress,
      so the geometry is not the place to look. The one controller change I can justify
      is damping: steering_oscillation is 0.15 to 0.16 on the slalom and s-bend, and
      the slalom line loss is most likely an overshoot when the signal swings fast
      on the tight bends. I raise kd from 0.15 to 0.25 and keep kp, ki, base_speed
      and weights unchanged, so the result isolates derivative damping. Expected,
      not measured: slalom oscillation falls below about 0.15 and slalom line loss
      clears or drops. The risk is that kd amplifies sensor noise, which would show
      as a rise in oscillation and rms_error.


      - [Open this output](iteration-6/entity1/versions/b0988e7ba337473b872658aa932f1987/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/5fc45c3b0d164bd3b110ea57ccfaf026/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-9f9df8d03ede8a6f/payload.json)'
  - id: entityR1
    label: Wheel track next if stuck
    notes: 'Feedback is written before racing. It tells the Builder to keep the iteration
      5 geometry if the kd change clears slalom line loss, and to test wheel_track
      0.14 if line loss stays at 1. Evidence: slalom line loss has been stuck at 1
      since iteration 3, and the turn rate has never been varied.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      geometry is the iteration 5 set, which is the best-supported layout: iteration
      4 (+/-0.03, 0.016 footprint) scored 52.198 and iteration 5 (+/-0.036) scored
      52.356, with slalom line loss at 1 and slalom progress near 0.11 in both. Widening
      the outer pair from 0.03 to 0.036 changed slalom rms_error only from 0.0302
      to 0.0303, so the outer reach is not clearly the binding limit. Iteration 2
      showed that the lighter body (0.14 m, 0.6 kg) cut s-bend progress to 0.1275,
      so the baseline body stays. Iteration 0 (kp 2.0, base 1.6) had oscillation 0.158
      on the slalom, much like the kp 2.5 runs, which suggests the oscillation is
      not set by kp alone. This race changes the controller only (kd 0.15 to 0.25),
      so the geometry is being measured against a fixed platform. Next race: if slalom
      line loss clears, the sensing layout is sufficient and the next lever is small
      (keep the geometry). If line loss stays at 1 and oscillation is unchanged, the
      controller is no longer the limit and wheel_track is the remaining geometry
      lever. If rms_error rises, the body and sensors are not the cause, and the next
      move is to reduce the sensor reach rather than widen it.


      ### Requested changes


      - If slalom line_loss_events stays at 1 with progress near 0.11 after the kd
      change: test wheel_track 0.14 (from 0.12), changing nothing else. Evidence:
      iterations 3 to 5 changed sensing and body and never changed the turn rate per
      wheel, and the slalom line loss has stayed at 1 across all of them.

      - If slalom line_loss_events clears to 0 with rms_error at or below 0.031: keep
      sensor_positions at x = +/-0.036, y = 0.04, sensor_size 0.016, and the 0.18
      m, 0.8 kg body. Evidence: iteration 5 is the best-supported set (score 52.356),
      and iteration 4 vs 3 showed the 0.016 footprint was neutral to slightly positive.

      - Do not change body_length or mass again. Evidence: iteration 2 (0.14 m, 0.6
      kg) cut s-bend progress from 0.16 to 0.1275, and iteration 3 recovered it to
      0.16 on the baseline body.


      - [Open this output](iteration-6/entityR1/versions/b0988e7ba337473b872658aa932f1987/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/5fc45c3b0d164bd3b110ea57ccfaf026/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-9f9df8d03ede8a6f/payload.json)'
