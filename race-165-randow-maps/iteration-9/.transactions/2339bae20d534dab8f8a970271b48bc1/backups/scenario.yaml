map:
  id: race-165-randow-maps
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Hold verified ±0.03
    notes: 'Holds the iteration 7 geometry (±0.03 outer sensors, 160.5 raced and repeated
      identically in iteration 8) fixed so the controller is read against the best
      platform. Corrects the Integrator''s mislabelled ±0.036 reading; wheel_track
      0.14 is deferred to a single-variable test next iteration.


      ### Rationale


      Iteration 7 (outer sensors at x = ±0.03, y = 0.04, 15 mm spacing, 0.016 footprint,
      0.18 m / 0.8 kg body, 0.12 m track, kd 0.35) is the best raced result at 160.5.
      Iteration 8 repeated it and returned an identical 160.5, so the simulator is
      deterministic for this design. The oval completions (2 of 20, mean progress
      0.81) drive most of the gain.


      I am correcting the Integrator''s reading of the outcome table. Their feedback
      says iteration 7 was raced at ±0.036 with kd 0.35. The table records iteration
      7 at ±0.03. The ±0.036 layout was iteration 6 (kd 0.25, score 97.7). Under the
      same damping, pulling the outer pair in from ±0.036 to ±0.03 raised the score
      from 97.7 to 160.5, and slalom rms fell back toward the iteration 4 level. The
      evidence therefore favours ±0.03, and I am not reverting to ±0.036.


      The body stays at 0.18 m / 0.8 kg (iteration 2 cut s-bend progress). The 0.016
      footprint and y = 0.04 row stay (iterations 3 to 5 showed them neutral to slightly
      positive). Slalom line loss is still about 1 (1.05 in iteration 7), so the remaining
      untested geometry lever is wheel_track. I will not change it in this race, because
      the controller is also changing and the two effects would be confounded. I hold
      the verified 160.5 geometry fixed and plan wheel_track 0.14 as a single-variable
      test next iteration, if the controller holds.


      - [Open this output](iteration-9/entity0/versions/f09675d7c1bc4d45a4a6cbc1d14c8c12/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-3e9ef0d87c9c87eb/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-ee9b9fb6ffb14957/payload.json)'
  - id: entity1
    label: 'Replicate best: iter 7'
    notes: 'Re-races the iteration 7 design (score 160.5) exactly, because the outcome
      table places its outer sensors at ±0.036, not the ±0.03 the Builder cited. The
      controller is unchanged, so the result tests reproducibility of the best raced
      score.


      ### Rationale


      The Builder''s entity0 proposes outer sensors at x = ±0.03 and calls iteration
      7 a ±0.03 design. The outcome table says otherwise. Iteration 7 raced with outer
      sensors at x = ±0.036 (y = 0.04, 16 mm footprint, 0.18 m / 0.8 kg body, 0.12
      m track) and kd 0.35. Its score of 160.5 is the best raced result. The step
      from 97.7 (iteration 6) to 160.5 came from kd 0.25 to 0.35 on identical geometry,
      so the Builder''s attribution of that gain to a reach change is not supported
      by the evidence. Iteration 6 vs 5 also shows that moving reach from ±0.03 to
      ±0.036 was neutral (52.2 vs 52.4). The ±0.03 reach has never been raced with
      kd 0.35, so its score is unknown. Since the scoring uses the raced design, I
      use the verified best: the exact iteration 7 design. The race is then a replicate
      of the best known result, which should reproduce 160.5 if the simulator is deterministic
      for a fixed seed. Only the controller is unchanged from iteration 7, so no new
      untested variable is introduced. Expected score: about 160.5, with oval completion
      as the main driver. The Builder''s ±0.03 idea is still worth testing later as
      a single-variable change.


      - [Open this output](iteration-8/entity1/versions/9013875c0b194ba99f18a2506ec9d410/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/a1d5440d95fc4d6b85de5067d1c44bfd/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-ee9b9fb6ffb14957/payload.json)'
  - id: entityR1
    label: Correct reach attribution
    notes: 'Corrects the Builder''s misreading: iteration 7 used ±0.036, and the gain
      came from kd 0.35, not from a reach change. Requests keeping ±0.036 and, if
      reach is retested, doing so as a single-variable change.


      ### Feedback


      Written before this candidate races, so no outcome is stated for it. Your entity0
      cites iteration 7 as a ±0.03 design, but the outcome table records iteration
      7 at x = ±0.036 with kd 0.35. The 97.7 to 160.5 gain came from raising kd 0.25
      to 0.35 on the same geometry, so the reach change you attribute it to was not
      tested. Evidence: iteration 5 (±0.036, kd 0.15) scored 52.4, and iteration 4
      (±0.03, kd 0.15) scored 52.2, so reach was neutral at kd 0.15. I have therefore
      raced the verified iteration 7 geometry at ±0.036 to protect the best known
      score. Next race: if the score holds near 160 with oval completions kept, the
      damping is confirmed and the next single-variable test is the reach or wheel_track.
      If the score falls below about 130 on the same controller, check for run-to-run
      variation before drawing any geometry conclusion.


      ### Requested changes


      - Keep the outer sensors at x = ±0.036 with y = 0.04, 15 mm spacing for the
      middle three, and sensor_size 0.016. Evidence: iteration 7 (±0.036, kd 0.35)
      scored 160.5, the best raced result, and reach was neutral at kd 0.15 (iterations
      4 and 5).

      - If you still want to test ±0.03, do it as one change against iteration 7 (reach
      only, kd 0.35 kept), so the score difference can be attributed. Evidence: iteration
      6 (±0.036, kd 0.25) scored 97.7, and iteration 7 showed kd, not reach, drove
      the large gain.

      - If slalom line_loss_events stays at 1 or more with slalom progress below 0.16
      after the damping, test wheel_track 0.14 from 0.12 with nothing else changed.
      Evidence: iterations 3 to 7 never changed the turn rate per wheel, and slalom
      line loss has stayed at 1 or above throughout.


      - [Open this output](iteration-8/entityR1/versions/9013875c0b194ba99f18a2506ec9d410/payload.json)

