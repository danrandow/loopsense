map:
  id: race-115-randow-maps
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: 16mm footprints at ±0.06m
    notes: 'Keeps the ±0.06 m span that removed s-bend and slalom line losses (0.0
      per run in iteration 5) and changes only sensor_size to 0.016 m. The remaining
      failure is drifting to the 0.06 m edge while still on the tape, and oval oscillation
      is 0.327, just above the 0.3 limit, so larger footprints should smooth the centroid.


      ### Rationale


      Iteration 5 (±0.06 m outer sensors, ±0.03 m inner, 12 mm footprints, y 0.04
      m, 12 cm track) scored 151.91, the best so far. The evidence changed from the
      pre-race feedback. Line losses on s-bend and slalom fell from 0.9 to 1.0 per
      run to 0.0, and oval losses stayed at 0.0. The span change therefore did what
      it was meant to do. The remaining failure is different: every s-bend and slalom
      trial still ends off track (progress 0.18 and 0.12). Max_error sits at about
      0.061 m, which is the off-track floor, while the tape is still being read. So
      the robot is drifting to the edge while still on the line, rather than losing
      the tape. Body width cannot move this floor: max(0.06, 0.0125 + body_width/4)
      is still 0.06 m even at the 0.18 m maximum body width. Oval steering oscillation
      is 0.327, just above the 0.3 limit, while s-bend and slalom oscillation is about
      0.15, so the controller has room on the tight tracks. I keep the ±0.06 m span,
      which removed the losses, and change one variable: sensor_size from 0.012 m
      to 0.016 m. Larger footprints overlap more, so each sensor''s reading changes
      more smoothly as the edge of the tape crosses it. That should give the controller
      an earlier and smoother centroid on bends, which may reduce the drift to the
      edge and the oval jitter. Position, count, wheel_track (0.12 m) and y (0.04
      m) stay fixed, since earlier tests showed narrowing the track or moving forward
      cut oval progress. Expected result: s-bend and slalom max_error below 0.06 m,
      or at least runs that progress further before going off track, with oval oscillation
      at or below 0.3 and oval progress holding near 0.7. Risk: a larger footprint
      may blur the centroid on gentle bends and reduce oval progress.


      - [Open this output](iteration-6/entity0/versions/f78446aafb8b4738a45441b0b83ac3bc/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-38a092eed6880949/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-0659ec223b648e6b/payload.json)'
  - id: entity1
    label: Wider outer span ±0.06m
    notes: 'Iteration 2 baseline (y 0.04 m, 12 cm track, 12 mm footprints) with outer
      sensors moved to ±0.06 m and the controller unchanged. Iteration 2 was the best
      race (124.6), and iterations 3 and 4 rejected the narrower track and forward
      sensing.


      ### Rationale


      The Builder''s proposal is the iteration 2 baseline (y 0.04 m, wheel_track 0.12
      m, 12 mm footprints) with the outer sensors widened to x = ±0.06 m and inner
      sensors at ±0.03 m, spacing 3 cm. The evidence favours keeping the iteration
      2 controller unchanged. Iteration 2 (score 124.6) is the best race so far. Iteration
      3 showed that wheel_track 0.10 m cut oval progress from 0.51 to 0.14 without
      fixing slalom losses, so the track stays at 0.12 m. Iteration 4 showed that
      forward sensing at y 0.06 m cut oval progress to 0.20 and left slalom at 1.0
      loss per run, so the sensors stay at y 0.04 m. Weights stay at [-2,-1,0,1,2]
      and the controller stays at kp 1.0, kd 0.2, ki 0.05, base_speed 1.0 and last_direction.
      This isolates the single geometry change, the outer span. Steering oscillation
      was 0.23 to 0.27 in iteration 2, so a wider centroid may raise it, and the controller
      is kept as is to measure that effect cleanly. Expected: slalom and s-bend line
      losses below 0.9 per run, max_error below 0.06 m on tight bends, oscillation
      at or below 0.3, and oval progress near 0.45 or higher.


      - [Open this output](iteration-5/entity1/versions/acdfbe7b004b47fba5840cca7834930a/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/35ca16946375452e8c494b1633b00eee/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-d2c94a34ddd1a28e/payload.json)'
  - id: entityR1
    label: Span test and next
    notes: 'Feedback sets out the ±0.06 m span test, with a footprint test if losses
      persist and a revert to ±0.05 m if oscillation exceeds 0.3. Each branch rests
      on iteration 2 oscillation (0.23 to 0.27) and the rejected track and sensor-height
      changes in iterations 3 and 4.


      ### Feedback


      Written before this candidate has raced. Iteration 2 (10 cm span, y 0.04 m,
      12 cm track) is the best result so far at 124.6. It cut oval line losses to
      0.05 per run, but slalom stayed at 1.0 and s-bend at 0.9, with max_error about
      0.061 to 0.064 m. Iteration 3 (wheel_track 0.10 m) removed oval losses but cut
      oval progress from 0.51 to 0.14, so the narrower track is rejected. Iteration
      4 (sensors forward to y 0.06 m) cut oval progress to 0.20 and left slalom losses
      at 1.0, so forward sensing is rejected. This candidate widens only the outer
      sensors to ±0.06 m. If slalom and s-bend losses fall below 0.9 per run with
      oscillation at or below 0.3, keep ±0.06 m and test gains or base_speed for progress.
      If losses stay at 0.9 to 1.0 with oscillation at or below 0.3, the tape is still
      leaving the footprint on the tightest bend, so test sensor_size 0.016 m at ±0.06
      m next. If oscillation rises above 0.3 (iteration 2 was 0.23 to 0.27), the wider
      span is over-smoothing or overshooting, so revert to ±0.05 m and test footprint
      size before widening further.


      ### Requested changes


      - If slalom and s-bend line_loss_events stay at 0.9 to 1.0 per run with max_error
      at or above 0.06 m and steering_oscillation at or below 0.3, change sensor_size
      from 0.012 m to 0.016 m at ±0.06 m. Iteration 2 showed the tape still leaving
      the footprint on tight bends, and larger footprints overlap more to smooth the
      crossing.

      - If steering_oscillation rises above 0.3 (iteration 2 was 0.23 to 0.27 at ±0.05
      m), revert the outer sensors to ±0.05 m and inner sensors to ±0.025 m, then
      test sensor_size 0.016 m at that span. Iteration 1 and 2 showed the 10 cm span
      removes most oval losses without other changes.

      - Keep y 0.04 m and wheel_track 0.12 m. Iteration 3 (wheel_track 0.10 m) cut
      oval progress from 0.51 to 0.14, and iteration 4 (y 0.06 m) cut oval progress
      to 0.20, so neither change should be retried unless slalom losses fall and progress
      holds.


      - [Open this output](iteration-5/entityR1/versions/acdfbe7b004b47fba5840cca7834930a/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/35ca16946375452e8c494b1633b00eee/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-d2c94a34ddd1a28e/payload.json)'
