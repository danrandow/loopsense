  id: race-115-randow-maps
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Inner sensors to ±0.04 m
    notes: 'Reverts the footprint to 12 mm, the iteration 5 best at 151.9, and moves
      only the inner sensors from ±0.03 to ±0.04 m. Iteration 6 showed the 16 mm footprint
      cut oval progress from 0.71 to 0.51 and brought back slalom losses, so it is
      rejected; the Integrator''s branch targets the remaining edge drift.


      ### Rationale


      Iteration 6 tested the 16 mm footprint at the iteration 5 span. It did not help.
      Oval progress fell from 0.71 to 0.51 and the oval finish disappeared, which
      is where most of the score came from in iteration 5. Slalom line losses returned
      at 0.95 per run on some seeds, which is the Integrator''s own revert condition.
      Iteration 6 also scored 110.1, below iteration 5''s 151.9. Oval oscillation
      did drop from 0.327 to 0.254, but that does not offset the lost progress. I
      therefore revert sensor_size to 0.012 m. Iteration 5 is the best geometry measured
      so far.


      The remaining failure at iteration 5 is drift to the 0.06 m edge while the tape
      is still being read (s-bend and slalom losses are 0.0, max_error about 0.061
      m, progress 0.12 to 0.18). The Integrator''s pre-agreed next move is to widen
      the inner sensors to x = ±0.04 m at the 12 mm footprint. The inner sensors currently
      sit at ±0.03 m, so this pulls the centroid''s sensitivity toward the edge without
      changing the outer span or footprint. The layout becomes non-uniform (x = -0.06,
      -0.04, 0, 0.04, 0.06), which is acceptable because the signal is a reading-weighted
      average. I keep wheel_track 0.12 m and y 0.04 m, since both were shown to cut
      oval progress when changed.


      Expected result: s-bend and slalom max_error falls below 0.06 m or those runs
      progress further before going off track, with line losses still at 0. Oval progress
      should hold near 0.7 and oval oscillation should stay at or below about 0.33.
      The risk is that a coarser inner centroid worsens oval steering and lowers oval
      progress again. If oval progress falls below 0.5, the next test is to return
      the inner sensors to ±0.03 m.


      - [Open this output](iteration-7/entity0/versions/3aa1780e896e4908b4cd5815ce12d58d/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-a900c3b67ea65a06/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-a4ec8d50eb7af571/payload.json)'
  - id: entity1
    label: Inner sensors ±0.04 m
    notes: 'Iteration 5 controller kept with 12 mm footprints, outer ±0.06 m, and
      inner sensors moved from ±0.03 m to ±0.04 m. This tests whether the remaining
      s-bend and slalom edge drift at max_error 0.061 m is reduced by inner spacing.


      ### Rationale


      Iteration 6 rejected the 16 mm footprint: oval progress fell from 0.71 to 0.51,
      the oval finish disappeared, and slalom losses returned to 0.95 per run. Iteration
      5 (12 mm, outer ±0.06 m, inner ±0.03 m, score 151.9) remains the best geometry.
      Its remaining failure is edge drift: s-bend and slalom have 0.0 line losses,
      but every run still reaches max_error of about 0.061 m while the tape is being
      read. The Builder''s proposal follows the pre-agreed next step: the footprint
      returns to 12 mm and the inner sensors move from ±0.03 m to ±0.04 m, keeping
      the outer sensors at ±0.06 m, y at 0.04 m, and wheel_track at 0.12 m. Because
      the drivetrain and footprint are unchanged from iteration 5, the iteration 5
      controller (kp 1.0, kd 0.2, ki 0.05, base_speed 1.0, last_direction, weights
      [-2,-1,0,1,2]) is kept as is. Changing gains at the same time would hide the
      effect of the sensor spacing. The sensor weights still match the five sensors
      in order, so the signal scale is unchanged. Expected: s-bend and slalom max_error
      below 0.06 m or further progress, with line losses still at 0 and oval progress
      near 0.7. The risk is a coarser inner centroid on oval, which the Integrator''s
      fallback covers.


      - [Open this output](iteration-7/entity1/versions/379c73b6f59f4717a758f56c4c39e667/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/3aa1780e896e4908b4cd5815ce12d58d/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-a4ec8d50eb7af571/payload.json)'
  - id: entityR1
    label: Inner spacing next step
    notes: 'Feedback asks for the inner sensors at ±0.04 m, with a fallback to ±0.03
      m if oval progress falls below 0.5. Iteration 6 rejected the 16 mm footprint,
      and iterations 3 and 4 rejected the 0.10 m track and forward sensors.


      ### Feedback


      Written before this candidate has raced. Iteration 5 (12 mm, outer ±0.06 m,
      inner ±0.03 m, score 151.9) is the best so far: s-bend and slalom line losses
      fell to 0.0, but each run still ends off track at max_error about 0.061 m. Iteration
      6 (16 mm footprint at the same span) scored 110.1: oval progress fell from 0.71
      to 0.51 and the oval finish was lost, so the 16 mm footprint is rejected. Iteration
      3 (0.10 m track) cut oval progress from 0.51 to 0.14, and iteration 4 (y 0.06
      m) cut oval progress to 0.20, so neither lever should be retried. This candidate
      tests only the inner spacing, moving it to ±0.04 m at 12 mm. If s-bend and slalom
      max_error falls below 0.06 m, or those runs progress further, with line losses
      still 0, keep that spacing. If oval progress falls below 0.5, return the inner
      sensors to ±0.03 m. If losses return on the tightest bend, the coarser centroid
      is missing the tape, so revert to ±0.03 m.


      ### Requested changes


      - Set the inner sensors to x = ±0.04 m with outer sensors at ±0.06 m, 12 mm
      footprints and y 0.04 m (iteration 5 showed the ±0.06 m span removes losses,
      and the remaining failure is edge drift at max_error about 0.061 m).

      - If oval progress falls below 0.5 (iteration 5 gave 0.71), return the inner
      sensors to ±0.03 m, since the coarser centroid may be hurting oval steering.

      - Keep the 12 mm footprint and 0.12 m track. Iteration 6 showed the 16 mm footprint
      cut oval progress to 0.51 and lost the oval finish, and iteration 3 showed the
      0.10 m track cut oval progress to 0.14.


      - [Open this output](iteration-7/entityR1/versions/379c73b6f59f4717a758f56c4c39e667/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/3aa1780e896e4908b4cd5815ce12d58d/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-a4ec8d50eb7af571/payload.json)'
