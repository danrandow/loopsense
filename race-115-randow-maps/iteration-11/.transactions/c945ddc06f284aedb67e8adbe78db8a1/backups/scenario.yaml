overrides:
  entities:
  - id: entity0
    label: 'Final: reproduced 0.6 kg'
    notes: 'Ships the iteration 8 geometry (0.6 kg, outer ±0.06 m, inner ±0.03 m,
      12 mm footprints) unchanged. Iteration 10 reproduced its 257.45 score exactly,
      so the 0.55 kg step was not tried because it could not be observed in this final
      iteration.


      ### Rationale


      The final iteration should ship the most reliable measured design, not an untested
      improvement. Iteration 8 (0.6 kg, iteration 5 layout) scored 257.45, and iteration
      10 reproduced it exactly (same score and per-track metrics), so the result is
      stable across runs. Its oval progress is 0.89 with 10 of 20 finishes, line losses
      are zero on every track, and max_error is 0.0603 m on s-bend and 0.0615 m on
      slalom. Iteration 9 showed that 0.5 kg collapses oval progress to 0.27 with
      no finishes, so the mass cliff lies below 0.6 kg. The Integrator''s optional
      0.55 kg step is permitted by its own rule, since the reproduction condition
      is now met. I decline it because this is the final iteration: a 0.55 kg result
      would never be observed, so it gives no learning, and the unseen-track final
      race is scored on whatever design ships. An untested mass step below the measured
      cliff risks the same collapse, so I keep the best measured geometry. Sensor
      layout (outer ±0.06 m, inner ±0.03 m, y 0.04 m), 12 mm footprints, 0.12 m track,
      0.03 m radius and the body are all unchanged. Expected result: the iteration
      8 outcome, about 257 on the development tracks, with the unseen track scored
      as the design performs there.


      - [Open this output](iteration-11/entity0/versions/0e7981e7a62f498798a07c5a525196d2/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-fefadb77bd1146d8/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-a2f30530fa0d21fc/payload.json)'
  - id: entity1
    label: Stable 0.6 kg robot
    notes: 'Iteration 8 geometry at 0.6 kg with the iteration 8 controller, unchanged,
      so the race confirms the best measured design (257.45). Iteration 9''s 0.5 kg
      run collapsed oval progress to 0.27, which rules out going lighter.


      ### Rationale


      Iteration 9 (0.5 kg) scored 81.24, against 257.45 for iteration 8 (0.6 kg, same
      layout and controller). Oval progress fell from 0.89 to 0.27 and oval finishes
      dropped to 0. The 0.5 kg step is therefore a cliff, not a trend, and the Builder''s
      revert to 0.6 kg is the only measured configuration that gives the best expected
      score. I take the Builder''s geometry exactly as proposed: outer sensors at
      ±0.06 m, inner at ±0.03 m, y 0.04 m, 12 mm footprints, 0.12 m track, 0.03 m
      radius, 0.18 x 0.12 m body, 0.6 kg. I keep the iteration 8 controller unchanged
      (kp 1.0, ki 0.05, kd 0.2, base_speed 1.0, last_direction, weights [-2,-1,0,1,2]).
      Every race in iterations 8 and 9 used this controller, so changing a gain now
      would add an untested variable to a race meant to confirm a measured result.
      Edge drift at about 0.060 m on s-bend and slalom with zero line losses points
      to controller response as the next lever, but that gain change belongs to a
      later, separately measured iteration. Expected result, from the iteration 8
      measurement: score about 257, oval progress near 0.89, about half of oval runs
      finishing, and zero line losses. The observation request keeps the full standard
      set so the next race can confirm oval finishes, max_error and oscillation.


      - [Open this output](iteration-10/entity1/versions/9f18713118cc46fabb43d89c84356a0d/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/3af85ddbbcb84af28f1e31dfda041e10/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-7412dd0da8a19de5/payload.json)'
  - id: entityR1
    label: Hold 0.6 kg, test 0.55
    notes: 'Advises keeping 0.6 kg and rejects 0.5 kg and the earlier layout changes.
      Offers 0.55 kg as one small step only if the 0.6 kg race reproduces iteration
      8, and points the drift question at controller response.


      ### Feedback


      Written before this candidate has raced. Iteration 8 (0.6 kg, with the iteration
      5 layout and controller) is the best measured design at 257.45: oval progress
      0.89, 10 of 20 oval finishes, zero line losses, and max_error 0.0603 m on s-bend
      and 0.0615 m on slalom. Iteration 9 (0.5 kg, otherwise identical) scored 81.24,
      with oval progress 0.27 and no finishes, so mass below 0.6 kg is a cliff and
      the trend has reversed. Iteration 5 (0.8 kg) was lower at 151.9. Iterations
      3, 4, 6 and 7 rejected the 0.10 m track, y 0.06 m, the 16 mm footprint and the
      inner ±0.04 m spacing, and all four cut oval progress. Answering your gain question:
      edge drift at about 0.060 m with zero losses across all three tracks is a controller-response
      limit, not a sensor limit. Body width cannot raise the 0.06 m off-track floor.
      If the next race reproduces iteration 8 (oval finishes near 10 of 20, max_error
      near 0.060 m, zero losses), the geometry is settled and the remaining gains
      are the controller''s job. If oval progress falls below 0.5 at 0.6 kg, the controller
      or seed is the cause, so keep 0.6 kg and do not retry mass below it. If line
      losses appear on any track, revert to the layout in iteration 5.


      ### Requested changes


      - Keep mass at 0.6 kg with the iteration 8 layout (outer ±0.06 m, inner ±0.03
      m, y 0.04 m, 12 mm footprints, 0.12 m track, 0.03 m radius). Iteration 8 gave
      257.45 and iteration 9 showed 0.5 kg collapses oval progress to 0.27.

      - Only if the next race reproduces iteration 8 (oval finishes at about 10 of
      20, zero line losses), try one small mass step of 0.55 kg. This is a measured
      bracket between the 0.6 kg best and the 0.5 kg cliff, and the expected gain
      is smaller drift on s-bend and slalom (max_error below 0.060 m). Revert to 0.6
      kg if oval progress falls below 0.8.

      - Do not retry inner ±0.04 m (iteration 7 oval progress 0.22), sensor_size 0.016
      m (iteration 6 oval progress 0.51), wheel_track 0.10 m (iteration 3 oval progress
      0.14) or y 0.06 m (iteration 4 oval progress 0.20). Each was rejected by earlier
      evidence.


      - [Open this output](iteration-10/entityR1/versions/9f18713118cc46fabb43d89c84356a0d/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/3af85ddbbcb84af28f1e31dfda041e10/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-7412dd0da8a19de5/payload.json)'
