overrides:
  entities:
  - id: entity0
    label: 'Final: reproduced 0.6 kg'
    notes: 'Ships the iteration 8 geometry (0.6 kg, outer ±0.06 m, inner ±0.03 m,
      12 mm footprints) unchanged. Iteration 10 reproduced its 257.45 score exactly,
      so the 0.55 kg step was not tried because it could not be observed in this final
      iteration.


      ### Rationale


      The final iteration should ship the most reliable measured design, not an untested
      improvement. Iteration 8 (0.6 kg, iteration 5 layout) scored 257.45, and iteration
      10 reproduced it exactly (same score and per-track metrics), so the result is
      stable across runs. Its oval progress is 0.89 with 10 of 20 finishes, line losses
      are zero on every track, and max_error is 0.0603 m on s-bend and 0.0615 m on
      slalom. Iteration 9 showed that 0.5 kg collapses oval progress to 0.27 with
      no finishes, so the mass cliff lies below 0.6 kg. The Integrator''s optional
      0.55 kg step is permitted by its own rule, since the reproduction condition
      is now met. I decline it because this is the final iteration: a 0.55 kg result
      would never be observed, so it gives no learning, and the unseen-track final
      race is scored on whatever design ships. An untested mass step below the measured
      cliff risks the same collapse, so I keep the best measured geometry. Sensor
      layout (outer ±0.06 m, inner ±0.03 m, y 0.04 m), 12 mm footprints, 0.12 m track,
      0.03 m radius and the body are all unchanged. Expected result: the iteration
      8 outcome, about 257 on the development tracks, with the unseen track scored
      as the design performs there.


      - [Open this output](iteration-11/entity0/versions/0e7981e7a62f498798a07c5a525196d2/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-fefadb77bd1146d8/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-a2f30530fa0d21fc/payload.json)'
  - id: entity1
    label: 'Final robot: 0.6 kg best'
    notes: 'Ships the Builder''s iteration 8/10 geometry (0.6 kg, outer ±0.06 m, inner
      ±0.03 m, 12 mm footprints) with the iteration 8 controller unchanged. Iteration
      8 scored 257.45 and iteration 10 reproduced it exactly, while 0.5 kg collapsed
      oval progress to 0.27.


      ### Rationale


      This is the final iteration, so the package should carry the most reliable measured
      design rather than an untested change. The Builder''s geometry (0.6 kg, outer
      ±0.06 m, inner ±0.03 m, y 0.04 m, 12 mm footprints, 0.12 m track, 0.03 m radius,
      0.18 x 0.12 m body) is the iteration 8 layout, which scored 257.45 and was reproduced
      exactly in iteration 10. Iteration 9 at 0.5 kg fell to 81.24 with oval progress
      0.27 and no finishes, so the mass cliff lies between 0.5 and 0.6 kg. I therefore
      decline the optional 0.55 kg step. Its result would never be observed, and the
      unseen-track race is scored on whatever ships. The controller is the iteration
      8/10 controller unchanged (kp 1.0, ki 0.05, kd 0.2, base_speed 1.0, last_direction,
      weights [-2,-1,0,1,2]). Every race in iterations 8 to 10 used it, and it kept
      line losses at zero on all three development tracks. Changing a gain now would
      add an untested variable, and the 0.0603 m and 0.0615 m edge drift on s-bend
      and slalom is a known, bounded limit that I cannot safely reduce blind. Expected
      result: the iteration 8 outcome, about 257 on the development tracks, with the
      unseen track scored as this design performs there.


      - [Open this output](iteration-11/entity1/versions/c945ddc06f284aedb67e8adbe78db8a1/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/0e7981e7a62f498798a07c5a525196d2/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-a2f30530fa0d21fc/payload.json)'
  - id: entityR1
    label: 'Final feedback: hold 0.6'
    notes: 'Written before the race as the final integration feedback. It tells the
      Builder to keep the measured 0.6 kg layout and treats any mass step below 0.6
      kg as a risk, citing the iteration 9 cliff. Edge drift is attributed to controller
      response, not geometry.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      Integrator kept your 0.6 kg layout and the iteration 8 controller unchanged
      because iteration 8 scored 257.45 and iteration 10 reproduced it exactly. Iteration
      9 is the reason not to go lower: at 0.5 kg, oval progress fell from 0.89 to
      0.27 and the oval finishes went from 10 of 20 to 0, so the mass cliff lies between
      0.5 and 0.6 kg. Iterations 3, 4, 6 and 7 also rejected the 0.10 m track, y 0.06
      m, the 16 mm footprint and the inner ±0.04 m spacing, because each cut oval
      progress. For the controller, the remaining s-bend and slalom edge drift (max_error
      about 0.0603 m and 0.0615 m with zero line losses) is a controller-response
      limit, not a sensor-layout one, so it is outside geometry changes. If this race
      reproduces iteration 8 (oval about 10 of 20 finishes, zero line losses), the
      layout is settled. If oval progress falls below 0.5 at 0.6 kg, the seed or track
      is the cause, so keep 0.6 kg rather than moving mass.


      ### Requested changes


      - Keep mass at 0.6 kg with the iteration 8 layout (outer ±0.06 m, inner ±0.03
      m, y 0.04 m, 12 mm footprints, 0.12 m track, 0.03 m radius). Iteration 8 scored
      257.45, iteration 10 reproduced it, and iteration 9 at 0.5 kg collapsed oval
      progress to 0.27.

      - Do not move mass below 0.6 kg in any further design. The 0.5 kg result (iteration
      9, score 81.24) rules it out, and an untested step such as 0.55 kg carries the
      same collapse risk if it is not measured first.

      - Do not retry inner ±0.04 m (iteration 7 oval progress 0.22), the 16 mm footprint
      (iteration 6 oval progress 0.51), the 0.10 m track (iteration 3 oval progress
      0.14) or y 0.06 m (iteration 4 oval progress 0.20). Each was rejected by measured
      evidence.


      - [Open this output](iteration-11/entityR1/versions/c945ddc06f284aedb67e8adbe78db8a1/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/0e7981e7a62f498798a07c5a525196d2/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-a2f30530fa0d21fc/payload.json)'
