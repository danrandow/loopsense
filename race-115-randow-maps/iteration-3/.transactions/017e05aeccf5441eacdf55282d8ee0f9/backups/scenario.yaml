  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Narrower track 0.10 m
    notes: 'Changes wheel_track from 0.12 to 0.10 m, keeping the 10 cm sensor span.
      The 10 cm span cut oval line losses to 0.05 per run but left the slalom at 1.0
      loss and max_error 0.0615 m, which points to the drivetrain, as the Integrator''s
      branch specified.


      ### Rationale


      Iteration 2 (10 cm span, outer sensors at ±0.05 m) changed the failure pattern
      but did not end it. Line losses fell to 0.05 per run on oval, but stayed at
      1.0 on slalom and 0.9 on s-bend, and every trial still ended off track with
      max_error about 0.061 to 0.064 m. Progress rose to 0.27 on s-bend and 0.51 on
      oval, and the score rose from 54.8 to 124.6. Sensor span from 6 cm to 10 cm
      therefore helped on the oval but is not the limit on the slalom, where the single
      excursion persists at the same max_error. Under the Integrator''s pre-agreed
      branch, a persistent loss at about 0.06 m with span widened is the signal to
      change the drivetrain. I make that single change: wheel_track 0.12 m to 0.10
      m, which gives sharper turn authority. Steering oscillation rose to 0.23 to
      0.27 on oval and s-bend, above the earlier 0.08 to 0.16 range, so I am not also
      changing the footprint now. Changing two variables at once would make it impossible
      to tell which one caused the result. I keep the 10 cm span, footprints, body,
      mass and wheel radius unchanged. Expected result: slalom and s-bend line_loss_events
      fall below 1.0 per run, and max_error on tight bends drops below 0.06 m. If
      oscillation rises further or losses persist, the next test is the 16 mm footprint
      for smoothing.


      - [Open this output](iteration-3/entity0/versions/1f5041b7daf0478795fb7284696caab8/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-215c89d604c5342f/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-e735997e6ea956c3/payload.json)'
  - id: entity1
    label: 10 cm span test
    notes: 'Widens the outer sensors to ±0.05 m with the iteration 1 controller unchanged,
      isolating the span effect. Based on iterations 0 and 1, where span from 6 to
      8 cm changed neither line losses nor max_error.


      ### Rationale


      Iterations 0 and 1 both ended with every trial off track after one line-loss
      event, with max_error near 0.061 to 0.063 m, progress 0.11 to 0.17 and no finishes.
      Widening the span from 6 cm to 8 cm changed nothing, so span is not yet the
      limit at those widths. The Builder''s test here is a 10 cm span (outer sensors
      at ±0.05 m, inner at ±0.025 m), with the footprint, forward offset, body and
      drivetrain unchanged. I keep the controller from iteration 1 (kp 1.0, kd 0.2,
      ki 0.05, base_speed 1.0, last_direction) so this race isolates the sensor span.
      Sensor weights stay at [-2,-1,0,1,2], which keeps the signal scale the same.
      Expected result if span is the limit: line_loss_events falls toward 0 and max_error
      drops below 0.06 m on the tight bends. If losses and max_error stay near 0.06
      m, the next change should be the drivetrain (wheel_track 0.10 m), as the Integrator''s
      pre-specified branch says.


      - [Open this output](iteration-2/entity1/versions/ef81f9e077ad4db4b3cb892e56181bfb/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/28ea182be6ae472caeae1cae3083977b/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-00a5e2dd4a02a0fa/payload.json)'
  - id: entityR1
    label: Span then drivetrain
    notes: 'Asks the Builder to test a 10 cm span, then move to wheel_track 0.10 m
      if the single line loss per run persists. Based on iterations 0 and 1, where
      max_error stayed near 0.06 m and steering_oscillation stayed low.


      ### Feedback


      Written before this candidate has raced. Iteration 0 (span ±0.03) and iteration
      1 (span ±0.04) both showed every trial ending off track after exactly one line-loss
      event, with max_error 0.061 to 0.063 m, progress 0.11 to 0.17 and steering_oscillation
      0.08 to 0.16. Widening the span by 2 cm made no measurable difference, so the
      failure is not explained by span at these widths. Your 10 cm span is the next
      test. If the next race shows line_loss_events below 1.0 per run and max_error
      below 0.06 m on the tight bends, keep the span and move on to the drivetrain
      for progress. If the first loss still occurs at about 0.06 m, span is ruled
      out and the next change should be the drivetrain. If rms_error rises on gentle
      bends with the wider span (iteration 1 rms_error about 0.03), the centroid is
      too coarse, so keep the outer reach and narrow the inner spacing rather than
      widening further.


      ### Requested changes


      - Set the outer sensors to x = ±0.05 with inner sensors at ±0.025 (10 cm span,
      12 mm footprints), keeping the other geometry unchanged. This is the test of
      whether the single excursion ends at this span (iterations 0 and 1 showed no
      change from 6 to 8 cm).

      - If line_loss_events stays at 1.0 per run with max_error near 0.06 m at the
      10 cm span, change wheel_track from 0.12 m to 0.10 m, since iterations 0 and
      1 had steering_oscillation of only 0.08 to 0.16 and point to a responsiveness
      limit rather than jitter.

      - If steering_oscillation rises above the 0.08 to 0.16 range seen in iterations
      0 and 1 as tape crosses between sensors, test sensor_size 0.016 m, which overlaps
      neighbouring sensors and smooths the centroid, and check whether rms_error improves.


      - [Open this output](iteration-2/entityR1/versions/ef81f9e077ad4db4b3cb892e56181bfb/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/28ea182be6ae472caeae1cae3083977b/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-00a5e2dd4a02a0fa/payload.json)'
