  entities:
  - id: entity0
    label: Lighter, narrower, faster
    notes: 'Narrows wheel track to 0.08 m, cuts mass to 0.45 kg and raises base_speed
      to 0.80 to recover oval and s-bend time, while keeping the proven kp/kd/sensor
      setup. Based on iteration 9 (917 score), where the slalom improved at each step
      of lower inertia and track width, and on the slalom''s remaining 2 off-track
      failures and 2.8 s mean time.


      ### Rationale


      Evidence from iteration 9 (score 917.2, best so far). The oval finishes 20/20
      at 2.26 s with 0.6 line-loss events and rms 0.0073. The s-bend finishes 20/20
      at 2.41 s with 0.2 line-loss events. The slalom finishes 18/20 (progress 0.974),
      but it is slow (2.8 s mean) and carries the largest steering oscillation (0.41).
      The two slalom failures end off_track at max_error about 0.06 m. Iteration 9
      also cut base_speed from 0.8 to 0.75, which added about 0.3 s to the oval and
      s-bend. The time term is worth only about 20 points in total, so the main gains
      are in the slalom completions and the line losses.


      The slalom has improved at every step where yaw inertia and track width fell
      (progress 0.16, 0.56, 0.73, 0.97). The body length (0.10 m) and wheel track
      (0.09 m) are close to their limits, and mass can still go lower (0.5 to 0.45
      kg, minimum 0.4). Changes: (1) wheel_track 0.09 to 0.08 m (minimum), giving
      more yaw per unit of wheel difference for the slalom swings. (2) mass 0.5 to
      0.45 kg, reducing yaw inertia by about 10 percent. (3) base_speed 0.75 to 0.80,
      recovering the time lost on the oval and s-bend. The speed increase is partly
      offset by the lower inertia and narrower track, which iteration 8 suggests should
      keep the slalom stable at this speed. Sensors, sensor weights, kp 6.5, kd 2.0,
      ki 0.2 and line_loss are unchanged, so the effect of the change is isolated
      to the drivetrain and speed.


      Expected result: slalom finish count rising to 19 or 20 of 20, with slalom time
      falling below about 2.5 s, and oval and s-bend times near 2.0 s. Overall score
      should rise by roughly 10 to 30 points. Risks: the lighter, narrower robot may
      oscillate on straights, so watch steering_oscillation (0.19 oval, 0.26 s-bend,
      0.35 to 0.41 slalom). If oval oscillation exceeds 0.4, the next step is kd 1.7.
      If the slalom still exits off-track with progress below 0.97, the next step
      is kp 7.0 with kd 2.2. Hypotheses: H1, the slalom failures are still limited
      by yaw agility, so the narrower track and lower mass help. H2, base_speed 0.8
      is fast enough that the slalom no longer needs the lower speed to hold the line.
      Measurements wanted next: per-track progress, completion and max_error to see
      how close the slalom runs come to the limit, line_loss_events on the slalom
      and oval, steering_oscillation for chatter from the lighter body, and completion_time
      on all tracks to check the speed cost.


