  entities:
  - id: entity0
    label: Lighter, shorter, slower
    notes: 'Keeps the 7-sensor wide array and the kp 6.5 / kd 2.0 controller that
      gave the best score (588.8). Lowers base_speed to 0.9 and reduces body length
      and mass to cut yaw inertia, aiming to stop the slalom losing the tape on its
      first swing. Based on iteration 6 telemetry: the slalom is still 0/20 with 0.75
      line losses per run, while the oval and s-bend are working.


      ### Rationale


      Evidence from iteration 6 (score 588.8, best so far): the oval finishes 20/20
      (1.89 s, 0.8 line-loss events, rms 0.007). The s-bend finishes 14/20 (progress
      0.93), up from 4/20 when the array was 5 sensors at +/-0.06 m. The slalom is
      still 0/20, with progress 0.16, 0.75 line-loss events per run, and every run
      ending off_track. Widening the array to 7 sensors at +/-0.08 m fixed most of
      the s-bend failures but did not move the slalom, so lateral reach of the array
      is no longer the main limit there. Earlier results suggest the slalom fails
      at its first fast direction change: the robot loses the tape and then leaves
      the 0.06 m off-track limit. Two hypotheses are tested together. H1: at base_speed
      1.0 the robot cannot turn fast enough through the slalom''s back-to-back bends,
      so it loses the tape. Reducing speed to 0.9 gives it more time to correct. H2:
      yaw inertia is too high for quick direction changes. Inertia scales with (body_length^2
      + body_width^2), so shortening the body from 0.18 to 0.14 m reduces it by about
      15 percent, and mass drops from 0.8 to 0.7 kg, which also lowers inertia while
      keeping the drivetrain the same. Sensors, weights, kp 6.5, kd 2.0, ki 0.2 and
      line_loss are unchanged, so the effect of the change is isolated to speed and
      inertia. Expected result: slalom progress rising above 0.3 with fewer line losses;
      the oval still finishes at about 2.0 to 2.1 s, which costs about 1 to 2 points
      on the time term. Risks: slower base speed lowers the oval time term, and a
      shorter body may make the robot less stable on straights (watch steering_oscillation).
      If the slalom still loses the line on its first swing, the next step is kp 7.0
      with kd 2.2 (stronger correction). If the oval oscillates above 0.4, the next
      step is kd 1.7.


