  entities:
  - id: entity0
    label: Higher kp and kd gain
    notes: 'Raises kp from 5.0 to 6.0 and kd from 1.0 to 1.5 to correct sharper bends
      and cut slalom line losses, with geometry and base speed unchanged. Based on
      iteration 3, where the oval finished in all 20 trials but the s-bend and slalom
      still left the track.


      ### Rationale


      Evidence from iteration 3 (score 392.7, best so far). The oval now finishes
      in all 20 trials (mean 1.97 s, 0 line losses). That confirms the kp 5 / kd 1.0
      change works on smooth track. The s-bend still ends off-track at progress 0.44,
      and the slalom reaches only 0.09 progress with 0.75 line-loss events per run.
      So the remaining failure is on sharper bends and direction changes, not on the
      straights. Two earlier results support this: raising kp and kd (iteration 3)
      moved s-bend progress from 0.16 to 0.44, and ki changes did nothing (iteration
      2). The line-loss events on the slalom suggest the robot is still steering too
      late or too weakly when the tape swings across the array. The change: raise
      kp from 5.0 to 6.0, which gives a stronger correction per millimetre of lateral
      error, and raise kd from 1.0 to 1.5, which damps the extra swing that the stronger
      kp will cause. Geometry and base_speed are held at iteration 3 values so the
      controller effect is isolated. ki stays at 0.2 because it has shown no benefit.
      Expected result: s-bend progress rises above 0.6, and slalom line-loss events
      drop below 0.5 per run. The oval should still finish. Risks: kp 6 with kd 1.5
      could chatter. If steering_oscillation on the oval exceeds about 0.4, the next
      step is kp 5.5 with kd 1.5. If the oval finishes but the s-bend and slalom still
      exit the track, the next step is to test a lower base_speed (about 0.9) on the
      slalom-type bends. Hypotheses: H1, the controller is still under-correcting
      on sharp bends, so more kp helps. H2, the extra kd is needed to keep the stronger
      kp from oscillating. Measurements wanted next: progress and line_loss_events
      per track to see how far the slalom and s-bend runs get, steering_oscillation
      to check for chatter from higher kp and kd, and max_error to see whether the
      off-track margin is still being used up.


