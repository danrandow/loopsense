  entities:
  - id: entity0
    label: Lighter, shorter, slower
    notes: 'Continues iteration 7''s trend: base_speed 0.9 to 0.8, body_length 0.14
      to 0.12 m and mass 0.7 to 0.6 kg, to lower yaw inertia and speed for the slalom.
      Evidence: slalom progress rose from 0.16 to 0.56 when speed and inertia fell,
      while the oval and s-bend still finish.


      ### Rationale


      Evidence from iteration 7 (score 712.2, best so far): the oval finishes 20/20
      (1.97 s), and the s-bend now finishes 20/20 (2.19 s). The slalom is still 0/20.
      Its progress rose from 0.16 to 0.56 and it leaves the track more slowly, with
      0.25 line-loss events per run, and every run ends off_track at max_error about
      0.063 m. Iteration 7 changed three things together (base_speed 1.0 to 0.9, body_length
      0.18 to 0.14, mass 0.8 to 0.7). Yaw inertia scales with (body_length^2 + body_width^2)/12
      times mass, so this cut inertia by roughly 25 percent. The slalom gain points
      to the robot''s inability to turn quickly enough and to recover from fast direction
      changes, not to sensing reach, since widening the array in iteration 6 did not
      move the slalom. Off-track limit is max(0.06, 0.0125 + 0.12/4) = 0.06 m for
      this body, and widening the body to 0.18 m would not raise it (0.0575 < 0.06),
      so the body width stays at 0.12 m. Change: continue the same direction. base_speed
      drops from 0.9 to 0.8, body_length from 0.14 to 0.12 m (near the 0.10 minimum),
      and mass from 0.7 to 0.6 kg, reducing inertia by a further ~20 percent. Sensors,
      weights, kp 6.5, kd 2.0, ki 0.2 and line_loss are unchanged. Expected result:
      slalom progress above 0.7 with some finishes, and line-loss events below 0.25
      per run. The oval and s-bend should still finish, at about 2.0 to 2.3 s, costing
      only a few points of time score. Risks: lower speed may slow the oval and s-bend,
      and a short, light body may be less stable on straights, so watch steering_oscillation
      (currently 0.19 oval, 0.27 s-bend, 0.35 slalom). If the oval oscillates above
      0.4, the next step is kd 1.7. If the slalom still exits on its first swing with
      progress under 0.7, the next step is kp 7.0 with kd 2.2. Hypotheses: H1, slalom
      failure is turning agility limited by inertia and speed, so further reduction
      helps. H2, kp and kd are now adequate for the lower inertia, so the slalom should
      respond without retuning. Measurements wanted next: progress, completion and
      max_error per track to see how far the slalom runs get and how much margin is
      used, line_loss_events on the slalom, steering_oscillation for chatter from
      the lighter body, and completion_time on the oval and s-bend to check the speed
      cost.


