  entities:
  - id: entity0
    label: Wider 7-sensor array
    notes: 'Widens the sensor array to +/-0.08 m with 7 sensors to stop the slalom
      line loss, which was unchanged across iteration 5 while the array only reached
      +/-0.06 m. Controller gains are held at iteration 5 values to isolate the sensing
      change.


      ### Rationale


      Evidence from iteration 5 (score 484.6, best so far): the oval finishes 20/20
      (2.00 s, 0.5 line-loss events per run). The s-bend improved to 4/20 finishes
      and 0.77 progress, up from 0.47. The slalom is unchanged at about 0.17 progress,
      0/20 finishes, and 1.0 line-loss event per run, and every slalom run ends off_track.
      Iteration 5 changed three things at once (sensors forward to y=0.06, kp 6.5/kd
      2.0, base_speed 1.0 with track 0.10). The slalom did not respond to any of them,
      which suggests the slalom failure is not about bend-entry timing or turning
      agility. The consistent single line loss followed by off-track points to the
      array losing the tape when the robot is offset on a sharp swing. The current
      array spans only +/-0.06 m, and the 16 mm footprints cannot see the 25 mm tape
      once the robot is about 0.04 m off centre on the outer sensors. The change is
      to widen the array to +/-0.08 m (the allowed maximum) with 7 sensors at 0.027
      m spacing, so the tape stays under at least one sensor for larger lateral errors.
      Weights run linearly from -1 to +1, so the steering signal keeps the same scale
      and kp/kd stay unchanged, which isolates the sensing change. The off-track limit
      is still max(0.06, 0.0125+0.03)=0.06 m for this body, so the body is kept at
      0.12 m. Expected result: fewer or no line-loss events on the slalom and s-bend,
      and slalom progress rising well above 0.17. The oval should still finish near
      2.0 s. Risks: a wider array may slightly blunt the response on straights, and
      extra sensors add reading noise to the average. Hypotheses: H1, the line is
      lost because the outer sensors leave the tape on slalom swings (tested by widening).
      H2, the lost tape is not caused by lag, so the forward move from y=0.04 to y=0.06
      was neutral. Measurements wanted next: line_loss_events and max_error per track
      to see whether the first loss still happens and how far off centre the robot
      gets, progress and completion per track for the slalom and s-bend, and steering_oscillation
      to check for chatter from the extra sensors.


