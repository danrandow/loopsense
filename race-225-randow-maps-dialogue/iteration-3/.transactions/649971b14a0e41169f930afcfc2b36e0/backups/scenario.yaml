map:
  id: race-225-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Revert sensor 12mm, track
    notes: 'Reverts the iteration 2 sensor change, which cut oval finishes from 70%
      to 0% and the score from 324 to 159, and keeps the widened row. Tests a shorter
      0.10 m wheel track for yaw response on the s-bend and slalom, following the
      Integrator''s requested test, to see whether it can reduce slalom line losses
      without losing oval finishes.


      ### Rationale


      Iteration 2 changed only sensor_size (0.012 to 0.016 m) and the score fell from
      324.07 to 159.26. The oval finish rate dropped from 0.70 to 0.00 and oval progress
      fell from 0.95 to 0.59. Completions are worth 500 points, so the oval collapse
      outweighs the small slalom gain. Slalom line_loss_events did fall from 2.0 to
      1.75, but slalom progress only moved from 0.12 to 0.15, which is too little
      to justify the larger footprint. The Integrator''s condition for keeping 0.016
      was that slalom losses fall below 2.0. They did, but the oval regression is
      a decisive counter-signal that the Integrator''s rule did not anticipate, so
      I am reverting sensor_size to 0.012 m. I am keeping the widened row (x = -0.024
      to +0.024 m at y = 0.04 m), which the evidence supports on all three tracks.
      Iteration 1 shows that s-bend and slalom max_error still sit at about 0.064
      m, and steering_oscillation on the s-bend is about 0.27. The Integrator''s requested
      test was wheel_track 0.10 m for yaw response, and I am taking it as a single
      change from the iteration 1 best. Mass and body stay unchanged because the off-track
      limit does not move with body width, and mass is a second lever I want to keep
      in reserve. I expect the oval to keep its finish rate near 0.7 if oscillation
      stays below about 0.3, with slalom and s-bend max_error reducing and slalom
      line losses possibly falling below 2.0. The main risk is that the higher yaw
      gain raises oscillation enough to cost the oval finishes.


      - [Open this output](iteration-3/entity0/versions/cee4b7222cb748a5bf7b76d6832200e0/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-c6a30030ad993a51/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-929719d8b914d0e0/payload.json)'
  - id: entity1
    label: Shorter track, retuned kp
    notes: 'Keeps the iteration 1 widened row and 12 mm sensors, sets wheel_track
      to 0.10 m, and scales kp from 5.0 to 4.5 to match the higher yaw gain. Based
      on iteration 1 as the best raced design (324.07), where oval finish rate was
      0.70 and s-bend and slalom max_error sat at the 0.06 m limit.


      ### Rationale


      Iteration 1 is the best raced design (score 324.07). It gives oval finish rate
      0.70 and s-bend and slalom progress of 0.38 and 0.12. Iteration 2 changed sensor_size
      and also base_speed (1.2 to 1.1) and kd (0.6 to 0.8), so the oval collapse cannot
      be attributed to the footprint alone. The Builder now proposes reverting sensor_size
      to 0.012 m and cutting wheel_track from 0.12 to 0.10 m, a 20% shorter track
      that gives about 20% more yaw rate per unit of wheel differential. To keep the
      effective steering loop close to the iteration 1 tuning, I scale kp by 0.10/0.12
      (5.0 to 4.5). I keep kd at 0.6, the value that held oscillation near 0.26 on
      the oval, and base_speed at 1.2, which kept the oval completion time near 1.9
      s. ki stays at 0.05 and line_loss stays at last_direction. Sensor weights stay
      [-1, -0.5, 0, 0.5, 1] to match the unchanged widened row. Expected result, not
      yet measured: oval finish rate near 0.7, max_error on s-bend and slalom closer
      to or below 0.06 m, and steering_oscillation at or below about 0.3. The main
      risk is that the yaw change still raises oscillation enough to cost oval finishes.


      - [Open this output](iteration-3/entity1/versions/0861d8096ea4415192fb36c3f080d357/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/cee4b7222cb748a5bf7b76d6832200e0/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-929719d8b914d0e0/payload.json)'
  - id: entityR1
    label: Hold sensors, test yaw
    notes: 'Asks the Builder to keep 12 mm sensors and the widened row, and to test
      wheel_track 0.10 m with mass 0.6 kg as the fallback. Iteration 2 changed controller
      gains as well as sensor_size, so the oval collapse is not clean evidence against
      the footprint.


      ### Feedback


      Written before this candidate races. The evidence is iterations 0, 1 and 2.
      Iteration 1 is the best raced design (324.07): the widened row (x = -0.024 to
      +0.024 m at y = 0.04 m) lifted oval progress from 0.18 to 0.95 and s-bend progress
      from 0.14 to 0.38, so keep that row. Iteration 2 changed sensor_size to 0.016
      m and also changed base_speed (1.2 to 1.1) and kd (0.6 to 0.8). That confounds
      the result, so the oval collapse (finish rate 0.70 to 0.00) cannot be attributed
      to the footprint alone. Slalom line_loss_events fell from 2.0 to 1.75, so the
      larger footprint did help that track, but not enough to justify the oval loss.
      I am therefore keeping sensor_size at 0.012 m, as you proposed. The wheel_track
      0.10 m test is a reasonable next step, because turn rate is the wheel speed
      difference divided by wheel_track, so a shorter track gives more yaw per unit
      of control. I have scaled kp to match, so the race tests the geometry change
      on a comparable loop gain. Depending on the next race: if oval finishes hold
      near 0.7 and steering_oscillation stays at or below about 0.3, keep wheel_track
      0.10 m. If oscillation rises above about 0.3 with finishes falling, the yaw
      gain is too high, so try mass 0.6 kg rather than further sensor changes. Body_width
      does not move the off-track limit within its range, so do not spend a run on
      it.


      ### Requested changes


      - Keep sensor_size 0.012 m and the widened row (x = -0.024 to +0.024 m at y
      = 0.04 m), which gave the best raced score (iteration 1).

      - Keep the wheel_track 0.10 m test, but read it against the matched kp of 4.5.
      If the oval keeps its finish rate near 0.7 and s-bend or slalom max_error falls
      below 0.06 m, keep the shorter track.

      - If steering_oscillation rises above about 0.3 with finishes falling, try mass
      0.6 kg to reduce yaw inertia, and do not move the sensors again before testing
      it.


      - [Open this output](iteration-3/entityR1/versions/0861d8096ea4415192fb36c3f080d357/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/cee4b7222cb748a5bf7b76d6832200e0/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-929719d8b914d0e0/payload.json)'
