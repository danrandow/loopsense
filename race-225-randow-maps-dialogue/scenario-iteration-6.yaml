overrides:
  entities:
  - id: entity0
    label: Revert to 0.8 kg best
    notes: 'Returns the geometry to the iteration 1 best (mass 0.8 kg, 12 mm widened
      row, 0.12 m track), because the 0.7 kg run finished only 0.15 of oval trials
      and was no better than 0.6 kg. Based on iteration 1 (score 324) and iteration
      5 (score 185), this tests whether the best result repeats.


      ### Rationale


      Iteration 5 (mass 0.7 kg) scored 185.49, with oval finish rate 0.15. That is
      below both the 0.6 kg result (0.30) and the 0.8 kg reference (0.70), so the
      mass-finish relationship is not monotonic. The Integrator''s rule covers this
      case: when the 0.7 kg finish rate stays near 0.3 or below, return to 0.8 kg,
      the best known mass, and do not try a lower mass again. The 0.7 kg result is
      treated as noise or a non-monotonic region, not as evidence for a new optimum.
      Iterations 2 (16 mm sensors) and 3 (0.10 m track) both hurt the oval, so both
      stay reverted. I am therefore reproducing the iteration 1 geometry exactly:
      the widened 12 mm row at x = -0.024 to +0.024 m, y = 0.04 m, wheel_track 0.12
      m, wheel_radius 0.03 m, body 0.12 x 0.16 m, mass 0.8 kg. I did not take the
      Integrator''s earlier suggestions to move sensors forward or change body width,
      because the evidence does not support them. The Integrator''s controller is
      also tuned to this geometry, so holding it unchanged keeps the integration stable.
      I expect the oval finish rate to return to about 0.5 to 0.7, with a mean score
      near 300 and wide seed variance (oval scores range 276 to 957 in iteration 1).
      The s-bend and slalom are unlikely to complete under this geometry, and their
      off-track limit is near 0.064 m max error. The main uncertainty is whether iteration
      1''s 0.70 finish rate was partly seed luck, so this race also checks whether
      the reference is repeatable.


      - [Open this output](iteration-6/entity0/versions/5090ad7e46a644a6a7feab608a60fc77/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-8b88f67f2660e770/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-8df73b00a353aefc/payload.json)'
  - id: entity1
    label: 'Reference repeat: iter 1'
    notes: 'Reproduces the iteration 1 best geometry and controller exactly, to test
      whether its 0.70 oval finish rate repeats. Rests on iterations 1 to 5, where
      every change to sensors, track or mass lowered the oval finish rate.


      ### Rationale


      The Builder''s proposal returns to the iteration 1 geometry: 0.8 kg mass, 0.12
      m wheel_track, 0.12 m wheel radius, 0.12 x 0.16 m body, 12 mm sensors on the
      widened row at x = -0.024 to +0.024 m, y = 0.04 m. Iteration 1 is still the
      best raced design (324.07, oval finish rate 0.70, oval steering_oscillation
      0.26). Every later change was worse on the oval: 16 mm sensors (0.00 finishes),
      wheel_track 0.10 m with kp 4.5 (0.10), mass 0.6 kg (0.30) and mass 0.7 kg (0.15).
      The 0.7 kg point is non-monotonic, and the evidence does not support a new optimum,
      so I hold the geometry exactly. The controller is also unchanged from iteration
      1 (kp 5.0, ki 0.05, kd 0.6, base_speed 1.2, last_direction, weights [-1, -0.5,
      0, 0.5, 1]). Changing gains now would confound the repeatability test. The off-track
      limit is 0.06 m, and iteration 1 s-bend and slalom max_error sat at about 0.064
      m, so those tracks will likely not complete; the score depends mainly on the
      oval. Expected result, not measured: oval finish rate about 0.5 to 0.7, mean
      score near 300, with wide seed variance. If the oval finish rate falls well
      below 0.5, the iteration 1 result was partly seed luck and future changes should
      be judged on multi-seed averages.


      - [Open this output](iteration-6/entity1/versions/2cf76a667cea48b6a106e952d8f40e94/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/5090ad7e46a644a6a7feab608a60fc77/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-8df73b00a353aefc/payload.json)'
  - id: entityR1
    label: Hold reference, test
    notes: 'Pre-race feedback: the reference geometry is the best raced design, so
      hold it unless the oval finish rate falls well below 0.5. Cites iterations 2
      to 5 as evidence against the sensor, track and mass alternatives.


      ### Feedback


      Written before this candidate has raced. Evidence is iterations 0 to 5. Iteration
      1 (widened 12 mm row, wheel_track 0.12 m, mass 0.8 kg, score 324.07) is the
      reference: oval finish rate 0.70 and oval steering_oscillation 0.26. Iteration
      2 showed that 16 mm sensors collapsed oval finishes to 0.00 (progress 0.59),
      so keep 12 mm. Iteration 3 showed that wheel_track 0.10 m with kp 4.5 cut oval
      finishes to 0.10 and raised oscillation to 0.33, so do not shorten the track.
      Iteration 4 (mass 0.6 kg) gave oval finishes 0.30 and oscillation 0.32, and
      iteration 5 (mass 0.7 kg) gave 0.15 finishes, so the mass-finish relation is
      not monotonic. The s-bend and slalom max_error sits at about 0.064 m, above
      the 0.06 m off-track limit, so those tracks are unlikely to complete under any
      of these geometries. Your candidate, the iteration 1 reference, is the right
      next step. Depending on the next race: if the oval finish rate is about 0.5
      or more, hold this geometry and treat it as the stable base. If it is well below
      0.5, the earlier result was partly seed luck, so future geometry changes should
      be compared on a multi-seed average before you accept them.


      ### Requested changes


      - If the oval finish rate is about 0.5 or more with steering_oscillation at
      or below about 0.3, hold this geometry as the stable base and stop changing
      the sensor row, track or mass.

      - If the oval finish rate falls well below 0.5, treat iteration 1 as partly
      seed luck and propose changes only if they are judged on a multi-seed average,
      not a single race.

      - Do not change sensor_size from 0.012 m or reduce wheel_track below 0.12 m
      again. Iterations 2 and 3 both lowered the oval finish rate.


      - [Open this output](iteration-6/entityR1/versions/2cf76a667cea48b6a106e952d8f40e94/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/5090ad7e46a644a6a7feab608a60fc77/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-8df73b00a353aefc/payload.json)'
