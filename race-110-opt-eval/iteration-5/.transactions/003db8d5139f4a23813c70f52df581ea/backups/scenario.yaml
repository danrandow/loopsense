map:
  id: race-110-opt-eval
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Sensors closer to axle
    notes: 'Moves the sensor row from y = 0.05 m to 0.02 m, keeping the wide span,
      base_speed 1.1 and all gains fixed. Iteration 4 showed speed does not clear
      max_error (about 0.061 on every track), so sensor placement is the next single-variable
      test.


      ### Rationale


      Evidence from the iteration-4 race (base_speed 1.1, wide span x = ±0.07 m):
      line_loss_events fell to 0 on oval and s-bend and stayed at 1 only on slalom.
      Max_error was 0.0611 to 0.0614 on oval and s-bend, still just above the 0.06
      m off-track limit, and 0.0694 on slalom. Progress stayed low (oval 0.115, s-bend
      0.040, slalom 0.105). Lowering speed from 1.4 to 1.1 barely moved max_error,
      so speed is not the main cause, as the approved candidate''s feedback anticipated.
      Kp, ki and kd changes have not moved max_error either, and max_error is pinned
      near 0.061 on every track. Widening the body cannot clear the limit: body_width
      would need to exceed about 0.19 m, above the 0.18 m maximum.


      Decision: keep base_speed 1.1, the wide span, kp 2.0, ki 0.4, kd 0.15 and last_direction,
      and make one geometry change. Move the sensor row from y = 0.05 m to y = 0.02
      m, closer to the axle, following the approved feedback''s plan. The hypothesis
      is that the lateral excursion starts at the drive-wheel and body rotation, so
      the sensors'' reach relative to the axle sets the early error. Moving the array
      changes that reach.


      Expected result: max_error drops below 0.06 on at least s-bend and oval, and
      progress rises above the iteration-4 values. Risk: the sensors may see the line
      later, which could increase line-loss events on slalom. Hypotheses to check:
      H1, max_error is set by the sensor y position relative to the axle, so y = 0.02
      changes it; H2, if max_error is still about 0.061 at y = 0.02, the cause is
      the kd or the start transient, and kd 0.3 is the next single-variable test.


      Measurements wanted: max_error and rms_error per track, line_loss_events, progress,
      completion, steering_oscillation and completion_time.


      - [Open this output](iteration-5/entity0/versions/71c3797a1fac46188c50e3a62b18c469/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-a8f4b664342c97a2/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-3ed8a8fcdcae3657/payload.json)'
  - id: entityR1
    label: 'Approve: speed 1.1 test'
    notes: 'Approved the single-variable test: base_speed cut from 1.4 to 1.1 with
      the wide sensor span kept. Iteration 3 removed line loss but max_error stayed
      pinned near 0.061 to 0.063, so speed is the next candidate cause and the race
      is worth more than more reading.


      ### Feedback


      Approving this candidate. It is a clean single-variable test of speed: the wide
      sensor span is kept, and base_speed drops from 1.4 to 1.1 with kp 2.0, ki 0.4
      and kd 0.15 unchanged. Evidence: iteration 3 (wide span, x = ±0.07 m) cut line_loss_events
      from 1 to 0 on every track, which supports the narrow-span hypothesis. But all
      60 trials still went off_track with 0 finishes, and max_error sat at 0.0625
      to 0.0629 on oval and s-bend and 0.061 on slalom, just past the 0.06 m limit.
      Progress is very low: s-bend 0.042 and slalom 0.035, which is roughly the first
      0.2 m of the course. Oval reached 0.188. Changing kp, ki and sensor span did
      not move max_error much, so the remaining cause may be speed-dependent. Iteration
      3 scored 37.88, slightly below the best raced score of 38.61 (iteration 1),
      so it is not yet an improvement. The speed cut will lengthen completion time,
      which only matters once the robot stays on the line, so the trade is acceptable
      for this test.


      What to change after the race, depending on what it shows:

      - If max_error falls below 0.06 on s-bend and slalom and progress rises clearly
      above 0.14 on at least one track, keep base_speed near 1.1 to 1.2 as the stable
      point. Then raise it in small steps (for example 1.25, then 1.4) while watching
      max_error, so the speed recovers without crossing the limit.

      - If max_error stays near 0.061 to 0.063 at speed 1.1, speed is not the main
      cause. Test sensor y placement next by moving the array closer to the axle (y
      about 0.02 instead of 0.05), keeping the wide span. A kd change (for example
      0.3) is the alternative if y placement does not help.

      - If line_loss_events returns to 1 or more at speed 1.1, return to the wide
      span and try line_loss = search_right or search_left, which has still never
      been tested.


      ### Requested changes


      - If max_error drops below 0.06 on s-bend and slalom at base_speed 1.1 with
      progress above 0.14, keep the wide span and step base_speed up gradually (1.25,
      then 1.4) while checking that max_error stays under 0.06.

      - If max_error stays near 0.061 to 0.063 at base_speed 1.1, speed is not the
      main cause (iterations 0 to 3 all showed the same pinned max_error). Move sensor
      y from 0.05 to about 0.02 m, keeping the x span at ±0.07 m, so the array sits
      closer to the axle and its lateral reach changes.

      - If line_loss_events rises again at the lower speed, keep the wide span and
      set line_loss = search_right or search_left in place of last_direction, which
      has never been tested.


      - [Open this output](iteration-4/entityR1/versions/ec1a67e3a6044e58a774dc20ebcab8b0/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/2966ebf0f3bb46ed8b2aebd7054f9b76/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-73f9bb65e4b69420/payload.json)'
