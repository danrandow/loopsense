map:
  id: race-110-opt-eval
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: kd 0.3, sensor row y=0.05
    notes: 'Reverts the sensor row to y = 0.05 (iteration 5''s y = 0.02 cut slalom
      progress from 0.105 to 0.035 and changed nothing on oval or s-bend) and tests
      kd = 0.3 against the iteration-4 baseline. kd has never been raised above 0.15
      and max_error has been pinned near 0.061 across every other change.


      ### Rationale


      Evidence. Iteration 5 moved the sensor row from y = 0.05 to y = 0.02 with everything
      else as iteration 4. Oval and s-bend were identical to iteration 4 to four decimals
      (progress 0.115 and 0.040, max_error 0.0611 to 0.0614), so the move had no effect
      there. Slalom got worse: progress fell from 0.105 to 0.035, score fell from
      43.2 to 14.9, and line loss went from 1 to 0 with max_error 0.0609. The move
      cost slalom progress and bought nothing on the other tracks, so y = 0.02 is
      rejected. Across iterations 0 to 5, max_error stays pinned at 0.061 to 0.063
      whatever changed (kp, kd, ki, sensor size, span, speed, y). The best raced score
      is still iteration 1 (38.61). Iteration 4 (y = 0.05, base_speed 1.1, wide span)
      is the best geometry and speed setting so far at 36.43.


      Change. I return the sensor row to y = 0.05 and keep the wide span (x = -0.07
      to 0.07 m, 16 mm footprint) and base_speed 1.1, which restores the iteration-4
      configuration. I then make one controller change: kd from 0.15 to 0.30. kd has
      never been raised above 0.15, and the approved feedback names it as the next
      lever if max_error stays near 0.061. I am reverting y rather than keeping it
      at 0.02 as the approved feedback suggested, because iteration 5 showed y = 0.02
      hurts slalom progress without helping any track. Everything else is held at
      iteration-4 values (kp 2.0, ki 0.4, line_loss last_direction), so the race isolates
      kd against iteration 4.


      Expected result. A stronger damping term should reduce the early lateral overshoot
      at bend entry and at the start, so max_error should drop toward or below 0.06
      on s-bend and slalom, and progress should rise above the iteration-4 values
      (0.040 s-bend, 0.105 slalom). Risk: kd amplifies sensor noise, so steering_oscillation
      (0.067 to 0.148 so far) may rise, and max_error may not change if the cause
      is the start transient.


      Hypotheses. H1: kd = 0.3 is the missing damping, and max_error falls below 0.06.
      H2: max_error stays near 0.061 at kd = 0.3, which would point to the start condition
      or the motor mismatch rather than the feedback loop. In that case the next test
      is line_loss = search_right or search_left, or a speed reduction with more kd.


      Measurements wanted: max_error and rms_error per track, line_loss_events, progress,
      completion, steering_oscillation and completion_time, so I can see whether kd
      changes the early transient on s-bend and slalom.


      - [Open this output](iteration-6/entity0/versions/d5becec228834e8d884e8cab18c83d55/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-3634c633335ab607/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-bec2f06e842828c7/payload.json)'
  - id: entityR1
    label: 'Approve: kd 0.15 to 0.30'
    notes: 'Approved a single-variable test that restores the iteration-4 geometry
      (y = 0.05, wide span) and raises kd from 0.15 to 0.30, since max_error has stayed
      pinned near 0.061 through every other lever. Iteration 5 showed y = 0.02 hurts
      slalom progress and helps nothing, so y is reverted. Another revision round
      would not add new evidence.


      ### Feedback


      Approved for this race. The candidate is a single-variable test of kd. It restores
      the iteration-4 configuration (sensor row y = 0.05 m, wide span x = -0.07 to
      0.07 m, base_speed 1.1, kp 2.0, ki 0.4, line_loss last_direction) and raises
      kd from 0.15 to 0.30. Iteration 5 rejected y = 0.02: slalom progress fell from
      0.105 to 0.035 and no track improved, so reverting y is correct. Iterations
      0 to 5 have pinned max_error at 0.061 to 0.063 across changes to kp, kd (0.05
      to 0.15), ki, sensor_size, span, speed and y. kd has never been raised above
      0.15, so this is the one untested lever in the feedback loop. The candidate
      is valid and not obviously broken, and the best raced score (iteration 1, 38.61)
      sets a bar this candidate does not need to clear to be useful as a test. Another
      revision round would cost two action runs without any new evidence to justify
      a different value. Expected effect: max_error may fall toward 0.06 on s-bend
      and slalom, but this is not yet shown. Steering oscillation is the main risk,
      since the derivative term acts on the per-second change in signal and noise
      is amplified at higher kd (steering_oscillation has ranged 0.064 to 0.148 so
      far).


      What to change after the race, depending on what it shows:

      - If max_error falls below 0.06 on s-bend or slalom and progress rises above
      the iteration-4 values (0.040 s-bend, 0.105 slalom), keep kd near 0.30 and step
      base_speed up (1.25, then 1.4) while checking that max_error stays under 0.06.

      - If max_error stays near 0.061 at kd 0.30 with steering_oscillation no higher
      than about 0.10, the feedback loop is not the cause. Test line_loss = search_right
      or search_left, which no iteration has tried, and keep kd at 0.30.

      - If steering_oscillation rises well above the 0.064 to 0.148 range without
      a max_error drop, return kd to 0.15 and do not raise it further.


      ### Requested changes


      - Keep geometry.sensor_positions at y = 0.05 m with x = -0.07, -0.035, 0, 0.035,
      0.07 m (iteration 5 showed y = 0.02 cut slalom progress from 0.105 to 0.035
      and improved no track).

      - If max_error stays near 0.061 at kd = 0.30 (iterations 0 to 5 pinned it at
      0.061 to 0.063 across every gain, span, speed and y change), set controller.line_loss
      = search_right or search_left in place of last_direction, which no iteration
      has tested.

      - If steering_oscillation rises well above the 0.064 to 0.148 range in iterations
      0 to 5 without a max_error drop, return controller.kd to 0.15 with the other
      values unchanged.


      - [Open this output](iteration-6/entityR1/versions/4fb0d4ad274140cb8f31a1dfdbc1d8b6/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/d5becec228834e8d884e8cab18c83d55/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-bec2f06e842828c7/payload.json)'
