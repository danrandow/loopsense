map:
  id: race-110-opt-eval
  schema: v0.2
  scenario: Iteration 0
  inherits: base.yaml
  notes: Initial prepared state before either AI role or the simulator has acted.
dimensions:
  time_horizon: prepared
  iteration: '0'
overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'Baseline candidate from the contract alone, since no race data exists
      yet: five 12 mm sensors across the front, kp 3, kd 0.05, base speed 1.6, and
      last-direction line recovery. The Evaluator should check whether the steering
      gain and speed are balanced before the first race.


      ### Rationale


      Iteration 0 has no race data or Evaluator feedback, so this is a conservative
      baseline built from the contract. Geometry: five line sensors spread across
      the front of the robot at x = -0.04, -0.02, 0, 0.02, 0.04 m and y = 0.05 m.
      Five sensors give a smooth weighted average, and the 0.05 m lead ahead of the
      axle lets the robot react before it reaches a bend. The 12 mm footprint is wider
      than the 8 mm option, which should keep at least one sensor on the 25 mm tape
      through small lateral deviations. Wheel track 0.12 m and wheel radius 0.03 m
      are mid-range; body width 0.12 m leaves the off-track limit at max(0.06, 0.0125
      + 0.03) = 0.06 m, a reasonable margin; mass 0.8 kg is moderate for yaw stability.
      Controller: weights -1.0, -0.5, 0, 0.5, 1.0 keep the signal within ±1 so kp
      = 3 gives a steering authority of about ±1050 PWM at the extremes, which is
      firm but not saturating. kd = 0.05 damps the response to bend onsets without
      amplifying sensor noise, and ki = 0 avoids integral windup on long bends. base_speed
      = 1.6 (about 80 percent of full PWM) targets the roughly 1.5 m/s average needed
      to finish in 3 s while leaving headroom for cornering. line_loss = last_direction
      recovers in the direction the line was last seen. Expected result: completion
      on the oval and s-bend, with some oscillation on the slalom. The next iteration
      should tune kp and kd from the measured steering_oscillation and max_error,
      and raise base_speed if completion_time is the limiting term.


      - [Open this output](iteration-0/entity0/versions/e4bbcbed85204dd6be540f6ceecced9b/payload.json)'
  - id: entityR1
    label: Evaluator Feedback
    notes: 'Evaluator Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Written before this candidate has raced, so no result is stated for it. The
      candidate is a valid baseline that follows the contract. Its sensor signs are
      consistent: sensors on the left (positive x) carry positive weights, which steers
      left as the contract requires. Its controller values sit inside the allowed
      ranges, and kp = 3 with weights of ±1 gives a differential of about ±1050 PWM,
      which is firm without saturating. There is no earlier race data yet, so the
      only evidence is the contract and the baseline rationale. Approving it gives
      the first telemetry, which is the most useful thing this early iteration can
      produce.


      What to change after the race, depending on what it shows:

      - If steering_oscillation or max_error is high on the slalom or s-bend, reduce
      kp (for example to 2.0) or raise kd (for example to 0.1 to 0.2) to damp the
      response.

      - If completion is reached but completion_time is near 3 s, raise base_speed
      (for example to 1.8) and keep the controller gains that gave clean tracking.

      - If line_loss_events is above zero, or the robot leaves the track on sharp
      bends, widen the sensor span or try line_loss = search_right or search_left,
      depending on which way the line was lost, before changing the gains.


      ### Requested changes


      - After the race, if steering_oscillation is high, try kd = 0.15 with kp = 2.5
      to damp oscillation without losing bend tracking.

      - If completion_time is the limiting term and the run completed with low max_error,
      try base_speed = 1.8 to gain speed.

      - If line_loss_events is above zero, test line_loss = search_right or search_left
      in place of last_direction.


      - [Open this output](iteration-0/entityR1/versions/90a66d4a596a42c0901cabfa91ade871/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/e4bbcbed85204dd6be540f6ceecced9b/payload.json)'
  - id: entity1
    label: Approved Robot Build
    notes: 'Approved Robot Build. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-0/entity1/versions/90a66d4a596a42c0901cabfa91ade871/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/e4bbcbed85204dd6be540f6ceecced9b/payload.json)'
  actions:
  - id: action0
  - id: action1
measurements: {}
