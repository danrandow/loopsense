map:
  id: race-110-opt-eval
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Sensors closer to axle
    notes: 'Moves the sensor row from y = 0.05 m to 0.02 m, keeping the wide span,
      base_speed 1.1 and all gains fixed. Iteration 4 showed speed does not clear
      max_error (about 0.061 on every track), so sensor placement is the next single-variable
      test.


      ### Rationale


      Evidence from the iteration-4 race (base_speed 1.1, wide span x = ±0.07 m):
      line_loss_events fell to 0 on oval and s-bend and stayed at 1 only on slalom.
      Max_error was 0.0611 to 0.0614 on oval and s-bend, still just above the 0.06
      m off-track limit, and 0.0694 on slalom. Progress stayed low (oval 0.115, s-bend
      0.040, slalom 0.105). Lowering speed from 1.4 to 1.1 barely moved max_error,
      so speed is not the main cause, as the approved candidate''s feedback anticipated.
      Kp, ki and kd changes have not moved max_error either, and max_error is pinned
      near 0.061 on every track. Widening the body cannot clear the limit: body_width
      would need to exceed about 0.19 m, above the 0.18 m maximum.


      Decision: keep base_speed 1.1, the wide span, kp 2.0, ki 0.4, kd 0.15 and last_direction,
      and make one geometry change. Move the sensor row from y = 0.05 m to y = 0.02
      m, closer to the axle, following the approved feedback''s plan. The hypothesis
      is that the lateral excursion starts at the drive-wheel and body rotation, so
      the sensors'' reach relative to the axle sets the early error. Moving the array
      changes that reach.


      Expected result: max_error drops below 0.06 on at least s-bend and oval, and
      progress rises above the iteration-4 values. Risk: the sensors may see the line
      later, which could increase line-loss events on slalom. Hypotheses to check:
      H1, max_error is set by the sensor y position relative to the axle, so y = 0.02
      changes it; H2, if max_error is still about 0.061 at y = 0.02, the cause is
      the kd or the start transient, and kd 0.3 is the next single-variable test.


      Measurements wanted: max_error and rms_error per track, line_loss_events, progress,
      completion, steering_oscillation and completion_time.


      - [Open this output](iteration-5/entity0/versions/71c3797a1fac46188c50e3a62b18c469/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-a8f4b664342c97a2/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-3ed8a8fcdcae3657/payload.json)'
  - id: entityR1
    label: 'Evaluator: approve y=0.02'
    notes: 'Approved the sensor-row move to y = 0.02 m with the wide span kept, the
      single-variable test the iteration-4 feedback planned. Iteration 3 removed line
      loss with the wide span, and iteration 4 showed speed does not pin max_error
      near 0.061, so sensor placement is the next untested lever.


      ### Feedback


      Approved for this race. The candidate is a single-variable test of sensor y
      placement. It keeps the iteration-3 wide span (x = ±0.07 m), kp 2.0, ki 0.4,
      kd 0.15, base_speed 1.1 and last_direction, and moves the sensor row from y
      = 0.05 m to y = 0.02 m. The evidence behind the move: iteration 3 (wide span)
      cut line_loss_events from 1 to 0 on every track, so line loss is no longer the
      main failure. Iteration 4 (base_speed 1.1) left max_error pinned at 0.0607 to
      0.0629 across all tracks and only nudged progress, so speed is not the main
      driver. Across iterations 0 to 4, changes to kp, ki, kd, sensor_size and span
      have not moved max_error off roughly 0.061. Moving the array closer to the axle
      is the next untested geometry variable. Risk to watch: a shorter lead ahead
      of the axle gives the controller less time to react on bend entry, so max_error
      could rise even if the early transient is fixed. Judge the result by max_error
      and line_loss_events per track, then progress and completion_time, not by score
      alone.


      What to change after the race, depending on what it shows:

      - If max_error drops below 0.06 on s-bend and oval and progress rises clearly
      above the iteration-4 values, keep y = 0.02 and step base_speed up (1.25, then
      1.4) while checking that max_error stays under 0.06.

      - If max_error stays near 0.061 at y = 0.02, the geometry is not the cause.
      Test kd = 0.3 with everything else unchanged, since kd has never been raised
      above 0.15.

      - If line_loss_events returns to 1 or more on slalom after the move, return
      the row toward y = 0.05 and keep the wide span, and test line_loss = search_right
      or search_left, which has never been tried.


      ### Requested changes


      - Keep y = 0.02 m for all five sensors with x = -0.07, -0.035, 0, 0.035, 0.07
      m. If max_error falls below 0.06 on s-bend and oval with progress above the
      iteration-4 values, step base_speed up to 1.25 and then 1.4 while checking max_error
      (iteration 4 showed base_speed 1.4 to 1.1 barely changed max_error, so speed
      is not the main lever).

      - If max_error stays near 0.061 at y = 0.02 (iterations 0 to 4 all pinned near
      0.061 across gain, footprint, span and speed changes), set controller.kd = 0.3
      with all other values unchanged, since kd has never been tested above 0.15.

      - If line_loss_events returns to 1 or more on slalom after the move, set geometry.sensor_positions
      y back to 0.05 and test controller.line_loss = search_right or search_left in
      place of last_direction, which no iteration has tested.


      - [Open this output](iteration-5/entityR1/versions/003db8d5139f4a23813c70f52df581ea/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/71c3797a1fac46188c50e3a62b18c469/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-3ed8a8fcdcae3657/payload.json)'
