  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: 'Final: wheel_track 0.10'
    notes: 'Resubmits the iteration-10 design unchanged (wheel_track 0.10), the only
      raced design with zero line loss and the highest progress on all three dev tracks.
      Its lower mean score (95.95 vs 98.24) comes from a single lucky oval finish
      at 0.14, so it rests on the zero line loss and progress evidence.


      ### Rationale


      Evidence. Iteration 10 (wheel_track 0.10, otherwise iteration 9) scored 95.95,
      against 98.24 for iteration 9 (wheel_track 0.14). Its dev-track metrics are
      better on three of four counts: line loss cleared to 0 on every track (0.6 per
      trial on slalom at 0.14). Progress rose on every track: oval 0.390 (0.373),
      s-bend 0.178 (0.160), slalom 0.110 (0.101). Slalom max_error fell from 0.0623
      to 0.0650, which is worse, but this is still a pinned-limit failure. The whole
      score gap comes from one lucky oval finish at 0.14 (945.9 on one trial), which
      gave the 0.14 design a mean of 184 on oval against 165 at 0.10. Oval max_error
      was 0.0610 at 0.14 and 0.0613 at 0.10, so neither is inside the limit. The plan''s
      fallback trigger (slalom progress falling or line loss rising at 0.10) did not
      fire, since slalom progress rose and line loss cleared.


      Decision. Submit the iteration-10 design unchanged (wheel_track 0.10, base_speed
      0.9, kd 0.3, ki 0.4, kp 2.0, search_right, sensor y 0.05, x -0.07 to 0.07, sensor_size
      0.016). It is the only raced design with zero line loss on every development
      track and the highest progress on all three. I am not changing base_speed or
      any other field now. Speed 1.1 to 0.9 was the only change that moved progress
      materially, but raising speed to 1.0 is untested and max_error is still at the
      limit, so an untested step in the final iteration carries too much risk.


      Expected result. Similar to iteration 10 on the unseen track: no line loss,
      progress near 0.11 to 0.39 depending on track shape, and a finish only if the
      course is gentle. Hypotheses: H1, the narrower track gives more turn authority,
      which is why slalom line loss clears. H2, max_error stays at the 0.060 to 0.065
      limit on every track, so the excursion is not driven by the drivetrain or the
      feedback gains. Measurements wanted: max_error, line_loss_events and progress
      per track, plus completion_time for any finish, so the next team can judge whether
      the 0.10 track width or the lucky 0.14 finish is the real driver.


      - [Open this output](iteration-11/entity0/versions/d5f128a5f09743bb83affca976b0668b/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-f815e6058ae710a8/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-fd0e75d4de0b0d30/payload.json)'
  - id: entityR1
    label: Approve iter-10 design
    notes: 'Approved the iteration-10 design unchanged (wheel_track 0.10, base_speed
      0.9) for the final race. It is the only raced design with zero line loss on
      every development track and the highest progress on all three, so it outweighs
      iteration 9''s single lucky oval finish. No untested revision was requested,
      since one would race for the first time on the unseen track.


      ### Feedback


      Approved unchanged. This is the final iteration, so the candidate is judged
      on whether it is the strongest design available for the unseen track, not on
      whether it is ideal. The candidate is the iteration-10 design: wheel_track 0.10,
      base_speed 0.9, kd 0.3, ki 0.4, kp 2.0, search_right, sensor y 0.05, x -0.07
      to 0.07, sensor_size 0.016. Evidence: iteration 10 (95.95) is the only raced
      design with zero line-loss events on every development track. It also has the
      highest mean progress on all three tracks: oval 0.390 (iteration 9: 0.373),
      s-bend 0.178 (0.160), slalom 0.110 (0.101). Iteration 9 (98.24, wheel_track
      0.14) scored higher only because of one lucky oval finish out of 20 trials,
      and its slalom line loss returned at 0.6 per trial. max_error stayed at 0.060
      to 0.065 across iterations 0 to 10, so no change in this line of tuning has
      cleared the off-track limit on development tracks. With no iteration left, an
      untested revision, such as base_speed 1.0 or sensor_size 0.012, would race for
      the first time on the unseen track and could lose the line, so I am not asking
      for one. Judge the result by line_loss_events, progress and max_error per track,
      and by completion_time if the unseen track is gentle enough to finish.


      ### Requested changes


      - Race the iteration-10 design unchanged. Its zero line loss and highest progress
      on all three development tracks are the best-supported evidence, and an untested
      revision in the final iteration carries too much risk.


