map:
  id: race-110-opt-eval
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Wide span, slower (1.1)
    notes: 'Keeps the ±0.07 m sensor span, which removed line loss (0 events), and
      cuts base_speed from 1.4 to 1.1 to test whether the early off-track excursions
      (max_error ≈0.061, progress ≤0.04 on s-bend and slalom) are speed-driven. Single-variable
      test against iteration 3.


      ### Rationale


      Evidence from iteration 3 (wide span, x = ±0.07 m): line_loss_events fell from
      1 to 0 on every track, so the narrow-span line-loss hypothesis is supported.
      The robot still left the track in all 60 trials, with max_error 0.0607 to 0.0629
      and 0 finishes. The failure has moved from line loss to lateral excursion just
      past the 0.06 m limit. Progress is poor and early: s-bend 0.042 and slalom 0.035,
      which is about the first 0.2 m of the course. Oval reached 0.188 on average.
      The off-track limit is max(0.06, 0.0125 + body_width/4). Even at body_width
      0.18 that is 0.0575, so widening the body cannot help. The limit has to be cleared
      by keeping lateral error below 0.06 m.


      Decision: keep the wide sensor span, since it removed line loss, and make one
      controller change. I am lowering base_speed from 1.4 to 1.1. Early failure at
      the same point on all tracks, with no change from kp 3.0 to 2.0 or ki 0 to 0.4,
      points to a speed-dependent transient, such as yaw overshoot and tyre slip at
      start and bend entry. Less speed should reduce that lateral drift. The cost
      is completion time, which only matters once the robot stays on the line. The
      other gains stay fixed (kp 2.0, ki 0.4, kd 0.15) so this race isolates speed.


      Expected result: max_error falls below 0.06 on s-bend and slalom, off_track
      endings fall, and progress rises well above 0.14 on at least one track. Hypothesis
      to test: the dominant error is speed-driven. If max_error stays at about 0.061
      at speed 1.1, the cause is not speed, and the next test is sensor y placement
      (moving the array closer to the axle, y about 0.02) or kd.


      - [Open this output](iteration-4/entity0/versions/2966ebf0f3bb46ed8b2aebd7054f9b76/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-f085f0045f24884b/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-73f9bb65e4b69420/payload.json)'
  - id: entityR1
    label: Wider sensor span test
    notes: 'Approved the iteration-2 controller with the sensor span widened from
      ±0.04 m to ±0.07 m, a single-variable geometry test. The three earlier designs
      all lost the line once per trial with max_error pinned near 0.061 m, which gain
      changes did not move, so the narrow array is the main suspect.


      ### Feedback


      Written before this candidate has raced, so no result is stated for it. The
      candidate is the iteration-2 controller (kp 2.0, kd 0.15, ki 0.4, base_speed
      1.4, line_loss last_direction) with one geometry change: the sensor span is
      widened from x = ±0.04 m to x = ±0.07 m, with the same five sensors, y = 0.05
      m, the 16 mm footprint and the same weights. Evidence: the best raced design
      (iteration 1, score 38.61) and iteration 2 (38.47) both ended all 60 trials
      off_track with 0 finishes. Each trial logged exactly one line_loss_event, and
      max_error sat at 0.0607 to 0.0615 on every track. Changing kp, sensor_size and
      ki barely moved any of these numbers, so the gains are not the main driver.
      The narrow span is a plausible cause, because the tape can leave the array when
      lateral error is only about 0.02 to 0.03 m. The change is a clean single-variable
      test, the design is valid, and it is not obviously broken. The outer sensors
      at ±0.07 m sit outside the 0.12 m body, which the contract allows (limit ±0.08
      m). The inner sensors still set the signal scale, so straight-line behaviour
      should be unchanged. Approving it now gives the first telemetry on whether geometry,
      rather than gain, is the limit. Judge the result by line_loss_events, max_error
      and progress per track, not by score alone.


      What to change after the race, depending on what it shows:

      - If line_loss_events falls toward 0 and max_error drops below 0.06 with progress
      well above 0.14, keep the wider span. Then raise base_speed toward 1.6 to recover
      completion_time, and only then revisit kp and kd.

      - If line_loss_events stays at 1 per trial with the wider span, the span is
      not the sole cause. Test line_loss = search_left or search_right in place of
      last_direction, since the direction of the loss has never been tested.

      - If the wider span lowers line loss but steering_oscillation rises well above
      the 0.06 to 0.14 range seen so far, reduce kp toward 1.5 before changing the
      span again.


      ### Requested changes


      - If the wider span removes line loss (line_loss_events near 0, max_error under
      0.06), keep geometry.sensor_positions at x = -0.07, -0.035, 0, 0.035, 0.07 with
      y = 0.05, and raise controller.base_speed to 1.6 to recover progress and completion_time.

      - If line_loss_events stays at 1 per trial with the wider span, set controller.line_loss
      = search_left or search_right in place of last_direction, which has never been
      tested (iterations 0 to 2 all used last_direction and all failed the same way).

      - If steering_oscillation rises well above the 0.06 to 0.14 range seen in iterations
      0 to 2 with the wider span, lower controller.kp to 1.5 while keeping kd 0.15
      and the wider sensor span, because the span may make the signal more sensitive.


      - [Open this output](iteration-3/entityR1/versions/282ad6c5de8c4482b9cae5274f767cbc/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/52a18c75f0674865bc7d8a217293de16/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-8e15610695729bfd/payload.json)'
