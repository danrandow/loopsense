map:
  id: race-110-opt-eval
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: kd 0.3, search_right loss
    notes: 'Keeps the iteration-6 best geometry and gains (kd 0.3, wide span, y 0.05,
      base_speed 1.1) and changes only line_loss to search_right, following the approved
      contingency. Iteration 6 kept max_error at 0.060 to 0.065 and still lost the
      line on slalom, so the recovery direction is the untested lever.


      ### Rationale


      Evidence. Iteration 6 (kd 0.30, y 0.05, wide span x = -0.07 to 0.07 m, base_speed
      1.1, kp 2.0, ki 0.4, last_direction) is the best raced design so far at 38.64.
      Every trial still ended off_track with 0 finishes. max_error is 0.0602 on oval,
      0.0613 on s-bend and 0.0648 on slalom, so it is still at or just above the 0.06
      m limit. Progress is low (oval 0.115, s-bend 0.052, slalom 0.108). Steering
      oscillation stayed at 0.071 to 0.074 on oval and s-bend, but was 0.145 on slalom,
      where line loss also recurred (0.8 events per trial). Across iterations 0 to
      6, max_error has stayed pinned at 0.060 to 0.065 across changes to kp, kd (0.05
      to 0.30), ki, sensor size, span, speed and y. The feedback loop is therefore
      not the main lever.


      Change. Following the approved contingency (max_error stays near 0.061 at kd
      0.30, and oscillation on oval and s-bend is at most 0.10), I keep kd = 0.30
      and all geometry and gains unchanged, and change only controller.line_loss from
      last_direction to search_right. No iteration has tested a fixed search direction,
      and slalom still loses the line with last_direction. search_right sets the signal
      to +1, which steers the robot left, so this tests whether recovering toward
      the left side of the tape helps. Direction is a best guess; if the result is
      worse, search_left (the other direction) is the next single-variable test.


      Expected result. line_loss_events on slalom should fall toward 0 and max_error
      should fall toward 0.06 or below on slalom and s-bend. Progress should rise
      above 0.052 on s-bend. Risk: a fixed search direction may turn the robot the
      wrong way after a loss, which would raise max_error on the tracks that lose
      the line.


      Hypotheses. H1: a fixed search direction (search_right) recovers slalom line
      loss, and max_error falls below 0.06 there. H2: max_error stays at 0.061 or
      higher on s-bend regardless of line_loss, which would point to the start transient
      or the motor mismatch. Measurements wanted: max_error and line_loss_events per
      track to test H1, and progress and steering_oscillation to check that the search
      direction does not add jitter.


      - [Open this output](iteration-7/entity0/versions/e252d359aca14d15bac1865d13d4390e/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-a17781ea858f03f0/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-137cdb0916b1675e/payload.json)'
  - id: entityR1
    label: 'Approve: search_right'
    notes: 'Approved the iteration-6 design with only line_loss changed to search_right,
      the one lever no iteration has tested. Slalom still lost the line 0.8 times
      per trial under last_direction, and max_error has stayed pinned near 0.06 across
      all gain, span, speed and y changes.


      ### Feedback


      Approved. The candidate is iteration 6 (the best raced design, 38.64) with one
      change: controller.line_loss from last_direction to search_right. Evidence:
      iterations 0 to 6 never tested a fixed search direction. Slalom still shows
      line loss under last_direction (0.8 events per trial in iteration 6), and line
      loss was removed on oval and s-bend when the wide span was used (iteration 3
      onward). max_error has stayed pinned at 0.060 to 0.065 across every change to
      kp, kd (0.05 to 0.30), ki, sensor size, span, speed and y, so the feedback loop
      is not the main lever and the line-loss recovery is the remaining untested variable.
      The candidate is valid and differs from the raced best by a single field, so
      a further revision round would cost two action runs without new evidence to
      justify a different value.


      What to change after the race, depending on what it shows:

      - If slalom line_loss_events falls toward 0 and max_error on slalom or s-bend
      drops to 0.06 or below, keep search_right and then step base_speed up (1.25,
      then 1.4) while watching max_error.

      - If slalom line loss or max_error gets worse (the fixed direction turns the
      robot the wrong way), switch to search_left, the only other single-variable
      option.

      - If max_error stays at about 0.061 on every track with either search direction,
      the loss-recovery direction is not the cause. Then the start transient or the
      motor mismatch is the likely source, so test a lower base_speed (about 0.9)
      with kd 0.3 rather than more gain changes.


      ### Requested changes


      - Set controller.line_loss = search_right in place of last_direction, keeping
      iteration 6 otherwise unchanged (sensor y 0.05, wide span x = -0.07 to 0.07,
      base_speed 1.1, kp 2.0, ki 0.4, kd 0.3). Iteration 6 slalom still lost the line
      0.8 times per trial under last_direction.

      - If slalom line_loss_events rises or max_error worsens with search_right, set
      controller.line_loss = search_left next, the only remaining untested direction.

      - If max_error stays near 0.061 with either search direction, lower controller.base_speed
      to about 0.9 with kd 0.3 unchanged, to test whether the start or bend-entry
      transient is driving the excursion (iterations 0 to 6 pinned max_error across
      all gain changes).


      - [Open this output](iteration-7/entityR1/versions/83db897adfaa407788451a17b09ccd17/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/e252d359aca14d15bac1865d13d4390e/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-137cdb0916b1675e/payload.json)'
