map:
  id: loopsense-iteration-0
  schema: v0.2
  title: Loopsense Agent Team
  scenario: 'Iteration 0: Can real-world feedback verify the loop?'
  inherits: base.yaml
  notes: 'The PM''s first aligned bet. PM, Exec, and GTM lenses applied;

    Delivery and Practitioners not yet reached; GTM is listening only (entityR3 filed).


    **Runner:** Dan + Claude Cowork — no code runner yet.


    **Experiment status:** Bet reframed (see entity0) and re-certified by Exec on

    2026-09-21 at low-medium confidence. The original comparison (topology vs

    single loop vs build-critic pair) was not run and is no longer this iteration''s

    question. The question now is whether real-world feedback, tweet engagement

    first, can return through structured flows and act as the verifier. No result

    yet: the claim is a hypothesis, not a finding. Delivery is building the

    content-loop spec and a pre-registered verdict rule. Practitioners have not

    been reached. Under the map''s current definition an iteration completes when

    GTM returns market signal (entityR3).


    **Antipattern check:** NOT a linear chain. Pull system with return flows

    and bypass loops. The verifier is real-world feedback returning through

    structured flows (entityR3 first), not a manufactured referee. Until that

    signal arrives, Dan is the judge; a more explicit verifier is iteration 1''s

    open debt.

    '
