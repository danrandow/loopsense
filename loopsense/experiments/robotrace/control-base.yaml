map:
  schema: "v0.2"
  id: "control-robotrace"
  title: "Control Robot Race"
  scenario: "Optimizer-evaluator learning loop"
  is_moo: true
  notes: |
    The conventional comparison condition for the LoopSense Robot Race. Two AI
    agents share a blackboard. The Robot Optimizer owns both geometry and
    controller. The Evaluator critiques complete candidates and may request
    revisions before submitting a valid candidate to the track. The deterministic
    orchestrator limits deliberation by the condition's token budget and forces a
    valid candidate to test after the configured review cap.

    Both AI agents receive independently addressed copies of the same race
    measurements. The Evaluator then returns post-race recommendations to the
    Optimizer. Actor 2 is the simulated robot, not an AI agent.
  iteration_definition: |
    An iteration starts when actor0 uses the preceding race data and evaluator
    feedback to generate a complete candidate robot. Actor1 reviews it. Actor0 and
    actor1 may repeat this proposal-feedback loop until actor1 submits a candidate
    for testing or the deterministic review cap is reached. Actor1 then generates
    entity1 without changing the candidate itself. Actor2 races entity1 and
    generates entity2 plus independently addressed measurement returns for both AI
    agents. Actor1 consumes its return and generates post-race entityR1 for actor0.
    The iteration ends there. A retrospective may revise the working agreement for
    the next iteration but not the topology, budgets, or evaluation rules.
  dimension_axes: [condition, iteration]

actors:
  - id: actor0
    label: Robot Optimizer
    notes: |
      AI agent. Owns and modifies the complete robot design: geometry and
      controller. It uses direct race measurements and evaluator feedback but
      remains solely responsible for the candidate submitted for review.

  - id: actor1
    label: Evaluator
    notes: |
      AI agent. Reviews complete candidates, provides as much critique as fits the
      fixed deliberation budget, and chooses when a valid candidate is ready to
      test. It does not own or edit geometry or controller files. After a race it
      interprets its measurements and recommends changes to actor0.

  - id: actor2
    label: Robot on Track
    notes: |
      Deterministic software actor instantiated from entity1. It cannot interpret
      results. It pursues the race outcome, records evidence, and supplies supported
      measurements in two addressed return-flow entities.

actions:
  - id: action0
    actor: actor0
    label: Optimize robot
    notes: |
      Produces or revises a complete geometry-controller candidate. Revisions may
      respond to pre-test evaluator feedback until the review cap is reached.

  - id: action1
    actor: actor1
    label: Evaluate candidate
    notes: |
      Reviews the complete candidate and either returns critique or submits the
      unchanged valid package for testing. After the race it resumes, consumes its
      addressed measurements, and returns recommendations for the next iteration.

  - id: action2
    actor: actor2
    label: Race track
    notes: |
      Executes the submitted robot on the same configured track and seed batch used
      by the LoopSense condition. Generates outcomes, telemetry, scores, and
      trajectory images. It supplies data, not interpretation.

entities:
  - id: entity0
    label: Candidate Robot
    system_boundary: internal
    notes: |
      Actor0's complete geometry-controller package, rationale, hypotheses, and
      measurement requests. It may have multiple versioned proposals inside one
      iteration, bounded by the deterministic review cap and token budget.

  - id: entity1
    label: Test Submission
    system_boundary: internal
    notes: |
      The unchanged complete candidate submitted by actor1 to actor2 after review.
      It includes the consolidated supported observation request and a reference to
      the exact candidate version tested.

  - id: entity2
    label: Race Outcome
    system_boundary: internal
    notes: |
      The outcome actor2 pursues by racing. It has no used-by edge to either AI
      agent; upstream learning occurs through addressed return-flow entities.

  - id: entityR1
    label: Evaluator Feedback
    direction: return
    notes: |
      Actor1's feedback to actor0. Before testing it contains candidate critique and
      a test-or-revise decision. After testing it contains recommendations grounded
      in actor1's addressed race measurements. It never directly edits the robot.

  - id: entityR2A
    label: Race Data for Optimizer
    direction: return
    notes: |
      Measurement-only evidence generated by actor2 and independently addressed to
      actor0. Initially it contains the same standard race dataset as entityR2B.

  - id: entityR2B
    label: Race Data for Evaluator
    direction: return
    notes: |
      Measurement-only evidence generated by actor2 and independently addressed to
      actor1. Initially it contains the same standard race dataset as entityR2A.

  - id: entityTeam0
    label: Working Agreement
    system_boundary: private
    notes: |
      Shared blackboard conventions, review practice, handoff format, and current
      measurement requests. Revisions apply only from the next iteration and cannot
      change the experimental budgets or review cap.

  - id: entityPub0
    label: Track Conditions
    system_boundary: public
    notes: |
      The same versioned tracks, seeds, noise, design constraints, scoring rules,
      model configuration, and total budget used by the LoopSense condition.

  - id: entityPrv0
    label: Optimizer Expertise
    system_boundary: private
    notes: Actor0's evolving robot-design knowledge and judgement.

  - id: entityPrv1
    label: Evaluator Expertise
    system_boundary: private
    notes: Actor1's evolving evaluation knowledge and judgement.

edges:
  - id: edge0G
    type: generates
    from: action0
    to: entity0
  - id: edge0U
    type: used by
    from: entity0
    to: action1
  - id: edge1G
    type: generates
    from: action1
    to: entity1
  - id: edge1U
    type: used by
    from: entity1
    to: action2
  - id: edge2G
    type: generates
    from: action2
    to: entity2

  - id: edgeR1G
    type: generates
    from: action1
    to: entityR1
    direction: return
  - id: edgeR1U
    type: used by
    from: entityR1
    to: action0
    direction: return

  - id: edgeR2AG
    type: generates
    from: action2
    to: entityR2A
    direction: return
  - id: edgeR2AU
    type: used by
    from: entityR2A
    to: action0
    direction: return
  - id: edgeR2BG
    type: generates
    from: action2
    to: entityR2B
    direction: return
  - id: edgeR2BU
    type: used by
    from: entityR2B
    to: action1
    direction: return

  - id: edgeTeam0U0
    type: used by
    from: entityTeam0
    to: action0
  - id: edgeTeam0U1
    type: used by
    from: entityTeam0
    to: action1

  - id: edgePub0U2
    type: used by
    from: entityPub0
    to: action2

  - id: edgePrv0U
    type: used by
    from: entityPrv0
    to: action0
  - id: edgePrv0G
    type: generates
    from: action0
