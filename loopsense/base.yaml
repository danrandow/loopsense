map:
  schema: "v0.2"
  id: "loopsense"
  title: "Loopsense Agent Team"
  scenario: "Moving Parts"
  is_moo: true
  notes: |
    We are our own first customer. This map is the agent team building the
    product the agent team is trying to sell — dogfooding the topology from
    day zero. A Randow Map of the agent team itself. Each actor is an AI agent (or human-AI
    hybrid). The topology is a fork of product-manager-bet, adapted for an agent
    coordination team building and validating a product in the knowledge work space.
    This map is also the orchestration spec: a runner reads it to instantiate agents,
    sequence their actions, and record each run as a scenario YAML. The map and its
    scenarios are the work surface, the audit trail, and the comparison mechanism.
    Bypass feedback loops (entityR3A, entityR2A, entityR3B, entityR4B, entityR4C)
    are real tensions the PM holds against — not noise, not failure states, but
    the actual centrifugal forces in the system. They are visible here so the PM
    can integrate them, not suppress them.
  iteration_definition: |
    An iteration starts at actor0 (PM), who acts given all return flows from
    downstream actors plus the environment bands (public and private entities).
    Each actor in turn reads the upstream spine entity AND all return flows from
    actors to their right, plus the environment bands relevant to their role.
    For now, an iteration completes when actor3 (GTM) has returned market signal
    (entityR3), which is the PM's evidence about practitioners. Practitioner
    signal (actor4) will later be measured and monitored independently; when that
    happens this definition changes.
  dimension_axes: [time_horizon, iteration]

actors:
  - id: actor0
    label: Product Manager Agent
    notes: |
      Holds the aligned bet — the current hypothesis about what is being built, for
      whom,
      and why. Has authority over nobody; wins commitment through the quality of synthesis.
      Integrates return flows from all downstream agents into an updated bet each
      iteration.
      Skills: agents/pm/SKILL.md. Knowledge: agents/pm/knowledge/pm.md. Generates: agents/pm/generates/.

  - id: actor1
    label: Exec & Business Agent
    notes: |
      Applies the viability lens to the aligned bet. Certifies it is fundable and
      strategically defensible, or returns it with a reason. Monitors business model
      precedents, startup narratives, and funding logic in the AI/agent tooling space.
      Skills: agents/exec/SKILL.md. Knowledge: agents/exec/knowledge/exec-v0.md. Generates: agents/exec/generates/.

  - id: actor2
    label: Delivery Agent
    notes: |
      Applies the feasibility lens. Builds the first artifact each iteration — a spec,
      a prototype, a working example — and feeds delivery reality back to the PM.
      Operates in Claude Code or equivalent. Skills: agents/delivery/SKILL.md. Knowledge: agents/delivery/knowledge/delivery-v0.md. Generates: agents/delivery/generates/.

  - id: actor3
    label: GTM Agent
    notes: |
      Applies the desirability lens. Goes where practitioners actually are and listens.
      Validates the PM's problem hypothesis by finding real-world evidence, not by
      broadcasting first. Feeds market signal back to PM. Knowledge: agents/gtm/knowledge/gtm-v0.md.
      Eventually: X account, website, community presence.

  - id: actor4
    label: Practitioners
    notes: |
      Knowledge work practitioners and agent orchestration engineers who have tried
      multi-agent setups and found them unsatisfying. The only actor whose yes is
      the market's actual verdict. Currently: external; not yet in direct contact.

actions:
  - id: action0
    actor: actor0
    label: Hold & iterate the bet
    notes: |
      Synthesises feasibility (Delivery), viability (Exec), and desirability (GTM) signals into one updated aligned bet. Starting question every iteration:
      why are we still doing this, and is there something better that already exists?

  - id: action1
    actor: actor1
    label: Apply viability lens
    notes: |
      Reviews the aligned bet against business model precedents, market reachability,
      and strategic defensibility. Certifies or returns with reason.

  - id: action2
    actor: actor2
    label: Build & deliver
    notes: >-
      # Role 


      Takes the funded/validated bet and builds the first concrete artifact that instantiates
      it. Feeds delivery reality (what it actually takes) back to PM.

  - id: action3
    actor: actor3
    label: Listen & validate
    notes: |
      Takes the built artifact into the world (initially: reads, observes, does not
      post).
      Gathers market signal against the PM's problem hypothesis.

  - id: action4
    actor: actor4
    label: Use & respond
    notes: |
      Practitioners encounter the artifact (via GTM channels) and respond
      —
      or don't. Their response is the desirability signal.

entities:
  # Spine
  - id: entity0
    label: Aligned Bet
    system_boundary: internal
    notes: |
      The PM's output: a prioritised hypothesis — viable, feasible, and desirable
      —
      that each downstream agent must certify by acting. Versioned per iteration.

  - id: entity1
    label: Validated Bet
    system_boundary: internal
    notes: The bet once Exec has applied the viability lens and certified it.

  - id: entity2
    label: Product
    system_boundary: internal
    notes: |
      The working artifact Delivery builds — a spec, a prototype, a repo. Feasibility
      certified. What the team can actually show to the world.

  - id: entity3
    label: Market Offer
    system_boundary: internal
    notes: |
      The artifact surfaced to practitioners by GTM — initially a listening
      posture and research synthesis; later a post, reply, or direct conversation.

  - id: entity4
    label: Practitioner Response
    system_boundary: internal
    notes: |
      The signal from practitioners: engagement, questions, objections, adoption.
      The market's actual verdict on desirability.

  # Return flows — all back to PM (spine returns)
  - id: entityR1
    label: Viability Signal
    direction: return
    notes: Exec's certification or return-with-reason on the bet.

  - id: entityR2
    label: Delivery Reality
    direction: return
    notes: What it actually takes to build. Feasibility constraints and 
      discoveries.

  - id: entityR3
    label: Market Signal
    direction: return
    notes: |
      What GTM found: which problems are real, who is feeling them,
      what alternatives exist, what is failing practitioners.

  - id: entityR4
    label: Usage & Feedback
    direction: return
    notes: Direct practitioner signal back to PM — not relayed only through 
      GTM.


  - id: entityR4A
    label: Revenue
    direction: return
    notes: |
      Fees from practitioners and partners funding Exec's continued backing —
      proving the viability the bet forecast. In the agent team: the first
      paying practitioner or hosted-runner subscription is the signal that
      the attention-first open spec model is working. Absent in early iterations;
      its presence (or absence) is the strongest viability signal Exec receives.

  # Bypass feedback loops — the centrifugal forces the PM holds against
  - id: entityR3A
    label: Field Requests
    direction: return
    notes: |
      GTM's direct requests to Delivery — feature asks, deal-specific
      requirements — that route around the PM's bet. In the agent team: GTM agent
      making direct asks of Delivery agent based on what it's reading in the market.
      Not a failure; a real tension the PM must integrate or the bet drifts.

  - id: entityR2A
    label: Cost & Risk Case
    direction: return
    notes: |
      Delivery's direct cost-and-risk case to Exec, made over the PM's head. In the
      agent team: Delivery agent surfacing feasibility constraints directly to Exec
      agent when a bet looks unbuildable. Forces PM to keep bets grounded.

  - id: entityR3B
    label: Pipeline & Forecast
    direction: return
    notes: |
      GTM's pipeline and commercial forecast to Exec — shapes viability
      judgement directly, before the PM has synthesised it. In the agent team: GTM agent's market signal (what's gaining traction, what's not) reaching Exec
      agent to update business model thesis in real time.

  - id: entityR4B
    label: Demand & Objections
    direction: return
    notes: |
      Practitioner demand and objections reaching GTM directly — what
      builders want and why they do or don't engage. GTM agent's own signal
      before it reaches the PM. The rawest form of desirability feedback.

  - id: entityR4C
    label: Usage & Defects
    direction: return
    notes: |
      Usage telemetry and failure reports from practitioners reaching Delivery directly
      — how the artifact performs in practice. In the agent team: Practitioners
      flagging schema errors, workflow friction, or broken assumptions directly to
      Delivery agent without waiting for the full PM cycle.

  # Private
  - id: entityPrv0
    label: PM Judgment
    system_boundary: private
    notes: |
      The PM's running model of the problem space — not itself an output but shapes
      what questions get asked. Updated by reading pm.md knowledge file each iteration.

  - id: entityPrv1
    label: Business Model Thesis
    system_boundary: private
    notes: Exec's current working thesis on monetisation and strategic 
      positioning.

  - id: entityPrv2
    label: Technical Capability
    system_boundary: private
    notes: Delivery's knowledge of what is uniquely buildable with Randow Maps 
      schema.

  - id: entityPrv3
    label: Community Map
    system_boundary: private
    notes: GTM's map of where practitioners actually are and what 
      they're saying.

  # Public
  - id: entityPub0
    label: Agent Frameworks Research
    system_boundary: public
    notes: |
      Everything already publicly available that bears on the bet. Two categories
      held
      together because both create the same pressure: the uniqueness claim must survive
      both.
      COMPETITIVE ALTERNATIVES: LangGraph, CrewAI, AutoGen, single-loop tools,
      open-source swarm frameworks. The exit options practitioners already have.
      RESEARCH LITERATURE: Anthropic multiagent patterns paper, AI Daily Brief
      "Agentic Loops for Knowledge Workers" (Sep 3 2026), Lenny's Podcast / Simon
      Willison on verification gap (Apr 2026), arXiv 2608.27984 knowledge-conditioned
      topology, Karpathy graph engineering PDF and aibuilderclub.com guide (2026).
      Constant pressure on the bet's uniqueness claim from both directions.

edges:
  # Private inputs
  - id: edgePrv0U
    type: used by
    from: entityPrv0
    to: action0
  - id: edgePrv1U
    type: used by
    from: entityPrv1
    to: action1
  - id: edgePrv2U
    type: used by
    from: entityPrv2
    to: action2
  - id: edgePrv3U
    type: used by
    from: entityPrv3
    to: action3

  # Public inputs
  - id: edgePub0U
    type: used by
    from: entityPub0
    to: action4
    notes: Practitioners compare what we offer against alternatives they already
      know.
  - id: edgePub0U2
    type: used by
    from: entityPub0
    to: action1
    notes: Exec applies research literature and competitor landscape to 
      viability assessment.
  - id: edgePub0U3
    type: used by
    from: entityPub0
    to: action3
    notes: GTM reads research literature to know where 
      practitioners already are.

  # Spine
  - id: edge0G
    type: generates
    from: action0
    to: entity0
  - id: edge0U
    type: used by
    from: entity0
    to: action1
  - id: edge1G
    type: generates
    from: action1
    to: entity1
  - id: edge1U
    type: used by
    from: entity1
    to: action2
  - id: edge2G
    type: generates
    from: action2
    to: entity2
  - id: edge2U
    type: used by
    from: entity2
    to: action3
  - id: edge3G
    type: generates
    from: action3
    to: entity3
  - id: edge3U
    type: used by
    from: entity3
    to: action4
  - id: edge4G
    type: generates
    from: action4
    to: entity4

  # Return flows — spine returns to PM
  - id: edgeR1G
    type: generates
    from: action1
    to: entityR1
    direction: return
  - id: edgeR1U
    type: used by
    from: entityR1
    to: action0
    direction: return

  - id: edgeR2G
    type: generates
    from: action2
    to: entityR2
    direction: return
  - id: edgeR2U
    type: used by
    from: entityR2
    to: action0
    direction: return

  - id: edgeR3G
    type: generates
    from: action3
    to: entityR3
    direction: return
  - id: edgeR3U
    type: used by
    from: entityR3
    to: action0
    direction: return

  - id: edgeR4G
    type: generates
    from: action4
    to: entityR4
    direction: return
  - id: edgeR4U
    type: used by
    from: entityR4
    to: action0
    direction: return

  # Revenue: Practitioners → Exec
  - id: edgeR4AG
    type: generates
    from: action4
    to: entityR4A
    direction: return
  - id: edgeR4AU
    type: used by
    from: entityR4A
    to: action1
    direction: return
    notes: Revenue validates Exec's viability thesis directly — the strongest 
      signal available.

  # Bypass: GTM → Delivery (field requests, around PM)
  - id: edgeR3AG
    type: generates
    from: action3
    to: entityR3A
    direction: return
  - id: edgeR3AU
    type: used by
    from: entityR3A
    to: action2
    direction: return
    notes: GTM agent making direct asks of Delivery agent — the bet-drift 
      risk.

  # Bypass: Delivery → Exec (cost & risk case, over PM's head)
  - id: edgeR2AG
    type: generates
    from: action2
    to: entityR2A
    direction: return
  - id: edgeR2AU
    type: used by
    from: entityR2A
    to: action1
    direction: return
    notes: Delivery agent escalating feasibility constraints directly to Exec.

  # Bypass: GTM → Exec (pipeline & forecast)
  - id: edgeR3BG
    type: generates
    from: action3
    to: entityR3B
    direction: return
  - id: edgeR3BU
    type: used by
    from: entityR3B
    to: action1
    direction: return
    notes: GTM agent's commercial read shaping Exec's viability thesis 
      directly.

  # Bypass: Practitioners → GTM (demand & objections)
  - id: edgeR4BG
    type: generates
    from: action4
    to: entityR4B
    direction: return
  - id: edgeR4BU
    type: used by
    from: entityR4B
    to: action3
    direction: return
    notes: Raw practitioner signal before PM has processed it.

  # Bypass: Practitioners → Delivery (usage & defects)
  - id: edgeR4CG
    type: generates
    from: action4
    to: entityR4C
    direction: return
  - id: edgeR4CU
    type: used by
    from: entityR4C
    to: action2
    direction: return
    notes: Practitioners flagging artifact failures directly to Delivery.

  # Private outputs (what each agent gets from doing this work)
  - id: edgePrv0AG
    type: generates
    from: action0
    to: entityPrv0
    notes: Each iteration, the PM's judgment file is updated.
