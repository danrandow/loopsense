map:
  id: race-185-opt-eval-muted
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Forward sensors, more
    notes: 'Moves sensors to y=0.08 for more bend lead, raises kd to 1.0 to damp corrections,
      and lowers base_speed to 1.1 to give steering margin on the slalom. Based on
      iteration 2 (score 625), where the slalom finished 0/20 and the s-bend 15/20,
      with the forward move from 0.05 to 0.07 having been the main gain.


      ### Rationale


      Evidence from the last race (iteration 2, score 625.2): the oval finished 20/20
      at 2.06 s, the s-bend finished 15/20 (5 off-track), and the slalom finished
      0/20, every failure off_track at progress about 0.36. max_error sits near the
      0.06 m off-track limit on the failing tracks. Steering oscillation is moderate
      (0.17 oval, 0.35 s-bend, 0.26 slalom) and control effort is high on the slalom
      (10.7), so the robot is correcting hard and still lagging through bends. The
      forward move from y=0.05 to y=0.07 helped (score 185 to 625), which suggests
      more sensing lead still pays off. Changes: (1) sensor y 0.07 -> 0.08, the maximum
      allowed, for the most lead time on bends. (2) kd 0.8 -> 1.0 to damp the faster
      corrections the extra lead produces. (3) base_speed 1.2 -> 1.1 so the robot
      has more steering margin on tight bends. The oval (2.06 s at 1.2) should still
      finish near 2.25 s and the s-bend near 2.6 s, both under 3 s. kp 4.5, ki 0.02,
      sensor x spread, weights, geometry and line_loss are unchanged so the effect
      of these three changes is isolated. Expected result: slalom completions begin
      to appear and s-bend finishes rise toward 18-20/20, with steering_oscillation
      staying below about 0.4. Risk: base_speed 1.1 costs time on the oval and s-bend,
      and if kd 1.0 causes sluggish correction the slalom may still leave the line.
      Hypotheses for next iteration: if the slalom still exits at low progress, the
      bottleneck is steering authority and kp should rise to about 5; if oscillation
      exceeds 0.4, kd is too high; if completion_time on the oval exceeds 2.5 s, base_speed
      should go back to about 1.2. Measurements requested: completion, progress and
      completion_time for the speed trade-off, max_error and line_loss_events for
      recovery, and steering_oscillation and control_effort for gain stability.


      - [Open this output](iteration-3/entity0/versions/6c096f3135b8472f901739e40ed97b49/payload.json)

      - Based on: [entityR2A](iteration-3/entityR2A/versions/carried-55c106d41e90ab43/payload.json)'
  - id: entityR1
    label: Forward sensors, more kd
    notes: 'Approves a candidate that moves the sensors to y = 0.07, widens their
      spread to ±0.05, raises kd to 0.8 and lowers base_speed to 1.2. This targets
      the late-bend exits seen in iteration 1 (best raced, score 185.35), where max_error
      sat at the off-track limit while rms_error stayed small. The feedback sets next
      steps by race result.


      ### Feedback


      This candidate changes five things from the iteration 1 design (score 185.35,
      the best raced so far): sensors moved forward from y = 0.05 to y = 0.07, sensor
      x spread widened to ±0.05, kp 4.0 to 4.5, kd 0.5 to 0.8, and base_speed 1.3
      to 1.2. ki and sensor_size stay at 0.02 and 0.016. All values are inside the
      contract ranges, and the sign convention and weights (-2, -1, 0, 1, 2) match
      the earlier designs. Iteration 1 showed that the robot still leaves the line
      on bends (oval 17 of 20 off_track, s-bend and slalom 20 of 20 off_track) while
      rms_error stays small (0.016 to 0.023). That points to late reaction on bends,
      which the forward sensors and wider spread address directly. Iteration 1''s
      oval finishers averaged 1.90 s, so there is time slack for a slower base_speed
      of 1.2 within the 3 s limit. The main risk is that the slower speed costs time
      on the oval and that the higher kd amplifies jitter. Neither can be judged from
      the numbers alone, so this should be read from the race.


      After the race, read these first: finish rate and completion_time on the oval,
      max_error and line_loss_events on the s-bend and slalom, and steering_oscillation.
      If the robot still exits at the first bend with max_error near 0.06, move the
      sensors further forward (y = 0.08) or raise kp in small steps. If steering_oscillation
      is above about 0.4, lower kd to about 0.6 before changing kp. If the oval completes
      but completion_time is above 3.0 s, or progress stalls, raise base_speed to
      1.3 and keep the forward sensors.


      ### Requested changes


      - If the s-bend and slalom still end off_track with max_error near 0.06 after
      this race, move the sensors further forward to y = 0.08 (the contract maximum)
      or raise kp from 4.5 to 5.0. Iteration 1 showed max_error of 0.058 to 0.064
      at the off-track limit.

      - If steering_oscillation rises above about 0.4 (iteration 1 slalom 0.19, s-bend
      0.29), reduce kd from 0.8 to 0.6 before changing kp, because kd 0.5 was the
      iteration 1 value.

      - If the oval completes with completion_time above 3.0 s or stalls with progress
      below 0.9, return base_speed to 1.3, the iteration 1 value that gave 1.90 s
      finishes on the oval.


      - [Open this output](iteration-2/entityR1/versions/c175c418589c4584a7483213877c3f45/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/2d09c95ff1254f4a99f03bfde6f9cb26/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-ccd118b91f53194f/payload.json)'
