  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: kp 5.0 for slalom grip
    notes: 'Raises kp from 4.5 to 5.0 to add steering authority, since the slalom
      alone fails (19/20 off-track at progress 0.67) while oval and s-bend finish.
      Geometry and other gains are unchanged to isolate the effect, based on iteration
      3''s race data.


      ### Rationale


      Evidence from iteration 3 (score 724.5, the best so far): the oval (20/20, 2.14
      s) and s-bend (20/20, 2.30 s) both finish comfortably under 3 s. The slalom
      is the bottleneck: 19 of 20 trials went off_track at mean progress 0.67, with
      control_effort 15.2 and steering_oscillation 0.33, so the robot is correcting
      hard but lacks steering authority on the slalom''s sharp alternating bends.
      The sensor move from y=0.07 to y=0.08 (the allowed maximum) and the kd rise
      to 1.0 both helped, so I keep them. Change: kp 4.5 -> 5.0, which raises the
      turn produced per unit of signal by about 11% and gives the robot more authority
      to pull back from the edge. Everything else (sensor geometry, weights, ki, kd,
      base_speed 1.1, line_loss) is unchanged so the effect of this single change
      is isolated. Expected result: slalom progress rises above 0.8 and some slalom
      completions appear, while the oval and s-bend still finish. Risk: a higher kp
      can raise steering_oscillation; if it passes about 0.4, the next step is to
      raise kd slightly rather than lower kp. Hypotheses for the next iteration: (1)
      if the slalom still exits at low progress, the limit is speed through the bends,
      so base_speed should drop to about 1.0; (2) if oscillation rises sharply with
      little progress gain, kp is past its useful range and kd should carry the change;
      (3) if the oval completion_time stays near 2.1 s, there is time budget to slow
      the robot on the slalom. Measurements requested: completion, progress and completion_time
      for the speed trade-off, max_error and line_loss_events for recovery, and steering_oscillation
      and control_effort to check gain stability.


      - [Open this output](iteration-4/entity0/versions/95798c3255344a288a6119a6b10b9769/payload.json)

      - Based on: [entityR2A](iteration-4/entityR2A/versions/carried-b551839dc8b1688e/payload.json)'
  - id: entityR1
    label: 'Stronger steering: kp 5.0'
    notes: 'Single change from the best raced design (iteration 3, score 724.5): kp
      4.5 to 5.0 to add steering authority on the slalom, where 19 of 20 runs left
      the track at progress 0.67. Approved because the change is small, isolated,
      and the iteration needs a race to produce telemetry.


      ### Feedback


      This candidate changes one field from the iteration 3 design (score 724.5, the
      best raced so far): kp 4.5 to 5.0. Sensor geometry, weights, ki 0.02, kd 1.0,
      base_speed 1.1 and line_loss are unchanged, so the effect of the gain change
      is isolated. All values are inside the contract ranges. Iteration 3 showed the
      oval (20/20, 2.14 s) and s-bend (20/20, 2.30 s) finishing comfortably under
      3 s. The slalom is the bottleneck: 19 of 20 trials ended off_track at mean progress
      0.67, with control_effort 15.2 and steering_oscillation 0.33. That points to
      limited steering authority on the sharp alternating bends, since sensor y is
      already at its contract maximum of 0.08. Raising kp is the next step that the
      evidence supports, and it is a small step. I cannot state how it will perform.
      Read the race as follows. If the slalom completes more often or progress rises
      above 0.8, keep kp near 5.0 and consider a small base_speed reduction only if
      the slalom still exits at low progress. If steering_oscillation rises above
      about 0.4, raise kd slightly (for example 1.0 to 1.2) rather than lowering kp,
      because iteration 3 shows kd helped damp the faster corrections. If the oval
      or s-bend stops finishing, or the oval completion_time moves toward 2.5 s or
      more, return kp toward 4.5 before changing speed. Watch max_error and line_loss_events
      on the slalom to see whether recovery improves.


      ### Requested changes


      - If the slalom still ends off_track with progress below 0.8 and max_error near
      0.06, try base_speed 1.0 with kp 5.0 kept, because iteration 3 slalom progress
      of 0.67 at speed 1.1 suggests the bends are taken too fast.

      - If steering_oscillation rises above about 0.4 with kp 5.0 (iteration 3 value
      0.33), raise kd from 1.0 to 1.2 before lowering kp, since kd 0.8 to 1.0 in iterations
      2 to 3 came with better slalom and s-bend results.

      - If the oval or s-bend stops finishing or the oval completion_time exceeds
      2.5 s, return kp to 4.5, the iteration 3 value that finished 20/20 on both tracks.


      - [Open this output](iteration-4/entityR1/versions/ff7650e544024489903fa57954638ccd/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/95798c3255344a288a6119a6b10b9769/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-b551839dc8b1688e/payload.json)'
