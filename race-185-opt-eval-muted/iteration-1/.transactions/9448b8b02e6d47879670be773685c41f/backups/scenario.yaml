overrides:
  entities:
  - id: entity0
    label: Higher kp, slower, wider
    notes: 'Lowered base_speed to 1.3 and raised kp to 4.0 with more kd, and widened
      sensors to 16 mm, because iteration 0 left the tape on the first bend in all
      60 trials (progress about 0.1-0.15). The gain and speed changes address the
      tight-bend recovery failure, and the wider footprint addresses the line loss.


      ### Rationale


      Evidence: all 60 development trials ended off_track with progress 0.10-0.15
      and one line-loss event each. The robot leaves the tape early and never recovers.
      The off-track limit here is max(0.06, 0.0125 + 0.03) = 0.06 m, and max_error
      sits at about 0.06, so the robot runs off at the first sharp bend. rms_error
      (0.026-0.030) is small, so the robot tracks the line well until the first bend.
      The failure is a loss of tracking margin on bends at speed, not steady-state
      error. Changes: (1) base_speed 1.6 -> 1.3, so the robot can turn within the
      gain it has. (2) kp 2.0 -> 4.0, because at kp 2 a full-scale signal gives only
      about 700 PWM of wheel differential, which is too weak to pull the robot back
      from the edge on tight bends. (3) kd 0.2 -> 0.5 to damp the faster steering
      response, and ki 0.05 -> 0.02 to limit integral overshoot. (4) sensor_size 0.012
      -> 0.016. A larger footprint keeps at least one sensor on the 25 mm tape when
      the robot is off-centre, which should reduce the early line-loss events. Sensor
      positions, weights, wheel geometry and line_loss are unchanged so the effect
      of the gain and speed change is isolated. Expected result: fewer line-loss events,
      progress above 0.5 on the oval and s-bend, and the first completions on some
      seeds. Risk: a higher kp may cause oscillation on the slalom, which steering_oscillation
      will show. Hypotheses for next iteration: if the robot still leaves on the first
      bend, reduce base_speed further; if it wobbles, raise kd or lower kp; if it
      completes but is slow, raise base_speed. Measurements requested: progress and
      completion_time (for speed), line_loss_events and max_error (for recovery),
      steering_oscillation (for gain stability).


      - [Open this output](iteration-1/entity0/versions/36fcdacc8a874ba88bd04fa2a24c72b9/payload.json)

      - Based on: [entityR2A](iteration-1/entityR2A/versions/carried-0194cf73176c67a7/payload.json)'
  - id: entityR1
    label: Baseline review, approved
    notes: 'First iteration with no race data, so the candidate was checked for range
      validity and sensor sign consistency only. It is a valid conservative baseline,
      so it is approved to race and produce the telemetry that the next critique needs.


      ### Feedback


      Iteration 0 has no race data, so this review checks validity and the controller''s
      internal consistency only; it makes no claim about how the robot will perform.
      Every field is inside its contract range: five sensors at y = 0.05 with x from
      -0.04 to +0.04, sensor_size 0.012, wheel_track 0.12, wheel_radius 0.03, mass
      0.8, base_speed 1.6, kp 2.0, ki 0.05, kd 0.2, and line_loss ''last_direction''.
      The sign convention is consistent: the rightmost sensor (x = +0.04, left of
      centre) has weight +2, so a tape on the left gives a positive, left-steering
      signal. Nothing here is obviously broken, and no earlier race exists to show
      a worse baseline. This is the first race, so the value is in the telemetry.
      Once it races, read steering_oscillation and rms_error first. If oscillation
      is high on the slalom, lower kp or raise kd (for example kd 0.4 to 0.6). If
      the robot drifts wide on bends with low oscillation, raise kp. If it completes
      with completion_time above 3 s, raise base_speed in small steps. If line_loss_events
      are frequent, check whether the robot leaves the track at speed before changing
      the gains.


      ### Requested changes


      - After the race, if steering_oscillation is high on the slalom, try kp 1.5
      and kd 0.4, keeping the rest unchanged.

      - If the run completes but completion_time is above 3.0 s, try base_speed 1.8
      and check whether oscillation rises.

      - If rms_error is high on the s-bend with low oscillation, try kp 2.5 with kd
      0.2 to tighten tracking.


      - [Open this output](iteration-0/entityR1/versions/ccf9d119b15b4729bec85ec455dc3d87/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/143aeb35a8ee4583a3b504a02d1ccdc7/payload.json)'
