  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Higher kp, slower, wider
    notes: 'Lowered base_speed to 1.3 and raised kp to 4.0 with more kd, and widened
      sensors to 16 mm, because iteration 0 left the tape on the first bend in all
      60 trials (progress about 0.1-0.15). The gain and speed changes address the
      tight-bend recovery failure, and the wider footprint addresses the line loss.


      ### Rationale


      Evidence: all 60 development trials ended off_track with progress 0.10-0.15
      and one line-loss event each. The robot leaves the tape early and never recovers.
      The off-track limit here is max(0.06, 0.0125 + 0.03) = 0.06 m, and max_error
      sits at about 0.06, so the robot runs off at the first sharp bend. rms_error
      (0.026-0.030) is small, so the robot tracks the line well until the first bend.
      The failure is a loss of tracking margin on bends at speed, not steady-state
      error. Changes: (1) base_speed 1.6 -> 1.3, so the robot can turn within the
      gain it has. (2) kp 2.0 -> 4.0, because at kp 2 a full-scale signal gives only
      about 700 PWM of wheel differential, which is too weak to pull the robot back
      from the edge on tight bends. (3) kd 0.2 -> 0.5 to damp the faster steering
      response, and ki 0.05 -> 0.02 to limit integral overshoot. (4) sensor_size 0.012
      -> 0.016. A larger footprint keeps at least one sensor on the 25 mm tape when
      the robot is off-centre, which should reduce the early line-loss events. Sensor
      positions, weights, wheel geometry and line_loss are unchanged so the effect
      of the gain and speed change is isolated. Expected result: fewer line-loss events,
      progress above 0.5 on the oval and s-bend, and the first completions on some
      seeds. Risk: a higher kp may cause oscillation on the slalom, which steering_oscillation
      will show. Hypotheses for next iteration: if the robot still leaves on the first
      bend, reduce base_speed further; if it wobbles, raise kd or lower kp; if it
      completes but is slow, raise base_speed. Measurements requested: progress and
      completion_time (for speed), line_loss_events and max_error (for recovery),
      steering_oscillation (for gain stability).


      - [Open this output](iteration-1/entity0/versions/36fcdacc8a874ba88bd04fa2a24c72b9/payload.json)

      - Based on: [entityR2A](iteration-1/entityR2A/versions/carried-0194cf73176c67a7/payload.json)'
  - id: entityR1
    label: Stronger kp, slower base
    notes: 'Approved a candidate that cuts base_speed to 1.3 and raises kp to 4.0,
      kd to 0.5, and sensor_size to 0.016, aimed at the bend-recovery failure seen
      in iteration 0 (all 60 trials ended off_track at progress 0.10 to 0.15). The
      feedback names the evidence behind each change and gives the next adjustments
      to try depending on the race telemetry.


      ### Feedback


      This candidate changes five fields from iteration 0: base_speed 1.6 to 1.3,
      kp 2.0 to 4.0, kd 0.2 to 0.5, ki 0.05 to 0.02, and sensor_size 0.012 to 0.016.
      All values are inside the contract ranges, and the sensor and wheel geometry
      is unchanged, so the gain and speed effects stay isolated. Iteration 0 showed
      every trial going off_track at progress 0.10 to 0.15 with one line-loss event
      each, and max_error near 0.06, which is the off-track limit. rms_error stayed
      at 0.026 to 0.030, so the failure is recovery on bends at speed, not steady-state
      tracking. The changes target that failure directly: a higher kp gives enough
      differential to pull back from the edge (kp 2 gave about 700 PWM at full scale),
      lower base_speed gives the controller room to turn, and the larger sensor footprint
      keeps a sensor on the 25 mm tape when the robot is off-centre. Raising kd with
      a lower ki is a sensible damping pair for the stiffer steering.


      The main unknown is the completion time. At base_speed 1.3 the robot may cover
      the roughly 4.5 m course too slowly for the 3.0 s limit, so this race tells
      us whether speed or recovery is the binding constraint. Read these measurements
      first: progress and line_loss_events for recovery, max_error to see whether
      the off-track limit is still reached, and steering_oscillation for gain stability.
      Then decide the next step from what the race shows. If the robot still leaves
      on the first bend, lower base_speed to about 1.1. If it stays on the line but
      wobbles on the slalom (oscillation clearly above the iteration 0 values of 0.07
      to 0.14), raise kd to about 0.8 or lower kp to about 3. If it completes but
      completion_time is above 3.0 s, raise base_speed in steps of 0.1 to 0.2 while
      watching line_loss_events.


      ### Requested changes


      - If the next race still ends off_track with line_loss_events of 1 or more near
      the first bend, lower base_speed to about 1.1 and keep kp 4.0.

      - If the robot stays on the line but steering_oscillation rises well above the
      iteration 0 levels (0.07 to 0.14), set kd to about 0.8 or kp to about 3.0, one
      change at a time.

      - If the run completes but completion_time is above 3.0 s, raise base_speed
      in steps of 0.1 to 0.2 (for example to 1.5), stopping if line_loss_events rises
      again.


      - [Open this output](iteration-1/entityR1/versions/9448b8b02e6d47879670be773685c41f/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/36fcdacc8a874ba88bd04fa2a24c72b9/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-0194cf73176c67a7/payload.json)'
