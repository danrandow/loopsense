  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: Iter 7 + integral trim
    notes: 'Keeps the verified iteration-7 robot (929.76, 60/60 finishes) and raises
      ki from 0.02 to 0.10 to cancel the fixed motor-mismatch bias and cut rms_error,
      which is the largest remaining controllable score term. Revert to ki 0.02 if
      slalom completions drop or max_error exceeds 0.035.


      ### Rationale


      Evidence: iteration 7 (kp 4.5, ki 0.02, kd 1.0, base_speed 1.1, mass 0.5, body_length
      0.12, wheel_track 0.12, five sensors at y 0.08 with x = ±0.05/±0.025/0) finished
      60/60 trials at 929.76, the best verified score. Iteration 8 (speed 1.2) showed
      the slalom losing 2 of 20 runs to off-track, so speed 1.1 is the safe ceiling.
      The score is close to its ceiling: about 500 for completion, 250 for progress,
      about 105 from one line-loss event per run, about 65 from rms_error (about 0.011
      to 0.016), and about 7 to 12 from time. The largest remaining controllable term
      is rms_error. The development tracks show rms of 0.0056 on the oval and 0.0162
      on the s-bend, and the fixed left/right motor mismatch is a steady bias that
      the proportional term alone must absorb. Change: ki 0.02 to 0.10, so the integral
      term slowly cancels the steady mismatch offset. The integral is limited to ±2,
      so the added turn is at most about 0.2 (about 70 PWM), which is small and should
      not wind up on bends. Everything else is unchanged (geometry, kp 4.5, kd 1.0,
      base_speed 1.1, sensor layout and weights, line_loss), so the effect of ki is
      isolated. Expected result: rms_error falls by roughly 10 to 20 percent on the
      oval and s-bend, worth about 1 to 3 points, with completion, slalom margin (max_error
      about 0.023 against a 0.06 limit) and steering_oscillation (about 0.2 to 0.25)
      unchanged. Risk: a larger ki could overshoot on the slalom''s alternating bends;
      if slalom completions fall below 20/20 or max_error exceeds 0.035, revert to
      ki 0.02 (iteration 7 design). Hypotheses not acted on: (1) the single line-loss
      event per run most likely occurs at the start or finish when the outer sensors
      leave the tape, so it is probably not fixable by gains alone; (2) if rms_error
      does not change with ki, the s-bend error comes from curvature lag rather than
      bias, and kd or sensor lead is the next lever. Measurements requested: completion,
      progress and completion_time to confirm no regression; rms_error and max_error
      to test the bias hypothesis; line_loss_events to locate the loss event; steering_oscillation
      for stability; controller_errors to confirm no exceptions.


      - [Open this output](iteration-10/entity0/versions/a672ec469c084c19bf5ddf79deb2d295/payload.json)

      - Based on: [entityR2A](iteration-10/entityR2A/versions/carried-f60b250b9c5ece47/payload.json)'
  - id: entityR1
    label: Approve ki 0.10 test
    notes: 'Approved the iteration 9 design with only ki raised from 0.02 to 0.10,
      aimed at the s-bend rms_error (0.0162, the largest tracking term). The change
      is bounded by the integral limit and has a clear revert to ki 0.02 if slalom
      completion or max_error worsens, based on iterations 7 to 9.


      ### Feedback


      Approved. The candidate is the iteration 9 design (score 929.76, the best raced
      so far) with one change: ki 0.02 to 0.10. Judged from earlier races only, nothing
      here is obviously broken: all values are inside the contract ranges, and kp
      4.5, kd 1.0 and base_speed 1.1 match the settings that finished 60/60 in iterations
      7 and 9. The integral is capped at +/-2, so ki 0.10 adds at most about 0.2 of
      turn. Iteration 7 showed rms_error of 0.0056 on the oval and 0.0162 on the s-bend,
      and that tracking term is the largest one the controller can still move. Its
      expected payoff is small, about 1 to 3 points, so the race is the real test.
      Iteration 8 showed that base_speed 1.2 cost slalom finishes (18/20, 2 off-track,
      score 908), so no speed change should be combined with this test. Read the race
      in this order: completion and progress on all three tracks, then slalom max_error
      (iteration 7 value 0.0233) and steering_oscillation (iteration 7 slalom 0.25),
      then rms_error. If the slalom completes less than 20/20, or slalom max_error
      passes about 0.035, resubmit the iteration 9 design with ki 0.02 for the final
      iteration, because the final track is unseen and robustness matters more than
      a few points. If all tracks finish and rms_error drops with max_error stable,
      keep ki 0.10 and consider a small kp rise to 4.8 as the next step, since iteration
      4 showed kp 5.0 lowered s-bend rms (0.0166 to 0.013) but cost slalom progress.
      Line-loss events (one per run, about 105 points) have not moved under any gain,
      sensor or speed change in iterations 3 to 9, so this race should not be spent
      on them.


      ### Requested changes


      - If the race completes 60/60 with slalom max_error at or below about 0.025
      and rms_error lower than the iteration 7 values (oval 0.0056, s-bend 0.0162),
      keep ki 0.10 and test kp 4.8 with kd 1.0 and base_speed 1.1, since iteration
      4 showed a modest kp rise lowered s-bend rms.

      - If slalom completion is below 20/20 or slalom max_error exceeds about 0.035,
      revert to ki 0.02 and resubmit the iteration 9 design (score 929.76) for the
      final iteration, because the final track is unseen.

      - Do not change base_speed above 1.1 (iteration 8 at 1.2 lost slalom finishes)
      or the sensor layout, and do not spend runs on line_loss, which has not responded
      to any change so far.


      - [Open this output](iteration-10/entityR1/versions/408034ffa0a74afd8a997d0a412f2088/payload.json)

