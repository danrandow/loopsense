overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor
    notes: 'Baseline candidate: five sensors spanning 8 cm, weights scaled to sensor
      x-position, kp 2.0, kd 0.2, base speed 1.6, last-direction line recovery. No
      race data yet; chosen as a conservative starting point with measurements for
      oscillation, error and completion time.


      ### Rationale


      Iteration 0 has no race data or evaluator feedback, so this is a conservative
      baseline. Five line sensors span 0.08 m across the robot''s width (x = -0.04
      to +0.04 m), placed 0.05 m ahead of the axle so the controller reads the line
      before the wheels reach it. Weights are set to the sensor x-positions scaled
      to -2..+2, so the steering signal is roughly proportional to the line''s lateral
      offset, with positive (left) steering when the tape sits on the left sensors.
      Gains: kp = 2.0 gives a full-scale signal of about 700 PWM of wheel differential,
      which is firm without being aggressive. ki is small (0.05) to avoid integral
      windup on curves, and kd = 0.2 damps oscillation. base_speed = 1.6 (about 78%
      PWM) aims for the roughly 1.5 m/s average needed to finish in 3 s while leaving
      headroom for turns. line_loss = last_direction lets the robot recover toward
      the side it last saw the line. Geometry is mid-range (wheel_track 0.12 m, wheel_radius
      0.03 m, mass 0.8 kg, body 0.12 x 0.16 m), with the body width giving a comfortable
      off-track margin. Expected result: the robot completes the oval and s-bend with
      low rms error and few line losses. The main risk is oscillation at 1.6 speed
      on the slalom, which the steering_oscillation measurement should reveal. Hypotheses
      to test next: (1) if oscillation is high, reduce kp or raise kd; (2) if the
      robot drifts wide on bends, raise kp or base_speed-appropriate gain; (3) if
      completion_time is over 3 s with completion, raise base_speed.


      - [Open this output](iteration-0/entity0/versions/143aeb35a8ee4583a3b504a02d1ccdc7/payload.json)'
  actions:
  - id: action0
