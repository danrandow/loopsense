map:
  id: race-185-opt-eval-muted
  schema: v0.2
  scenario: Iteration 0
  inherits: base.yaml
  notes: Initial prepared state before either AI role or the simulator has acted.
dimensions:
  time_horizon: prepared
  iteration: '0'
overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor
    notes: 'Baseline candidate: five sensors spanning 8 cm, weights scaled to sensor
      x-position, kp 2.0, kd 0.2, base speed 1.6, last-direction line recovery. No
      race data yet; chosen as a conservative starting point with measurements for
      oscillation, error and completion time.


      ### Rationale


      Iteration 0 has no race data or evaluator feedback, so this is a conservative
      baseline. Five line sensors span 0.08 m across the robot''s width (x = -0.04
      to +0.04 m), placed 0.05 m ahead of the axle so the controller reads the line
      before the wheels reach it. Weights are set to the sensor x-positions scaled
      to -2..+2, so the steering signal is roughly proportional to the line''s lateral
      offset, with positive (left) steering when the tape sits on the left sensors.
      Gains: kp = 2.0 gives a full-scale signal of about 700 PWM of wheel differential,
      which is firm without being aggressive. ki is small (0.05) to avoid integral
      windup on curves, and kd = 0.2 damps oscillation. base_speed = 1.6 (about 78%
      PWM) aims for the roughly 1.5 m/s average needed to finish in 3 s while leaving
      headroom for turns. line_loss = last_direction lets the robot recover toward
      the side it last saw the line. Geometry is mid-range (wheel_track 0.12 m, wheel_radius
      0.03 m, mass 0.8 kg, body 0.12 x 0.16 m), with the body width giving a comfortable
      off-track margin. Expected result: the robot completes the oval and s-bend with
      low rms error and few line losses. The main risk is oscillation at 1.6 speed
      on the slalom, which the steering_oscillation measurement should reveal. Hypotheses
      to test next: (1) if oscillation is high, reduce kp or raise kd; (2) if the
      robot drifts wide on bends, raise kp or base_speed-appropriate gain; (3) if
      completion_time is over 3 s with completion, raise base_speed.


      - [Open this output](iteration-0/entity0/versions/143aeb35a8ee4583a3b504a02d1ccdc7/payload.json)'
  - id: entityR1
    label: Baseline review, approved
    notes: 'First iteration with no race data, so the candidate was checked for range
      validity and sensor sign consistency only. It is a valid conservative baseline,
      so it is approved to race and produce the telemetry that the next critique needs.


      ### Feedback


      Iteration 0 has no race data, so this review checks validity and the controller''s
      internal consistency only; it makes no claim about how the robot will perform.
      Every field is inside its contract range: five sensors at y = 0.05 with x from
      -0.04 to +0.04, sensor_size 0.012, wheel_track 0.12, wheel_radius 0.03, mass
      0.8, base_speed 1.6, kp 2.0, ki 0.05, kd 0.2, and line_loss ''last_direction''.
      The sign convention is consistent: the rightmost sensor (x = +0.04, left of
      centre) has weight +2, so a tape on the left gives a positive, left-steering
      signal. Nothing here is obviously broken, and no earlier race exists to show
      a worse baseline. This is the first race, so the value is in the telemetry.
      Once it races, read steering_oscillation and rms_error first. If oscillation
      is high on the slalom, lower kp or raise kd (for example kd 0.4 to 0.6). If
      the robot drifts wide on bends with low oscillation, raise kp. If it completes
      with completion_time above 3 s, raise base_speed in small steps. If line_loss_events
      are frequent, check whether the robot leaves the track at speed before changing
      the gains.


      ### Requested changes


      - After the race, if steering_oscillation is high on the slalom, try kp 1.5
      and kd 0.4, keeping the rest unchanged.

      - If the run completes but completion_time is above 3.0 s, try base_speed 1.8
      and check whether oscillation rises.

      - If rms_error is high on the s-bend with low oscillation, try kp 2.5 with kd
      0.2 to tighten tracking.


      - [Open this output](iteration-0/entityR1/versions/ccf9d119b15b4729bec85ec455dc3d87/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/143aeb35a8ee4583a3b504a02d1ccdc7/payload.json)'
  - id: entity1
    label: Approved Robot Build
    notes: 'Approved Robot Build. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-0/entity1/versions/ccf9d119b15b4729bec85ec455dc3d87/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/143aeb35a8ee4583a3b504a02d1ccdc7/payload.json)'
  actions:
  - id: action0
  - id: action1
measurements: {}
