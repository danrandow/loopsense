overrides:
  entities:
  - id: entity0
    label: 'Final: 0.085 m track'
    notes: 'Freezes the iteration 10 geometry (0.085 m track, seven contiguous 16
      mm sensors at y = 0.08 m), the best raced result at 63.41. It met the decision
      rule (s-bend progress above 0.1675, slalom oscillation below 0.16), and the
      remaining s-bend oscillation of 0.162 is left to kp.


      ### Rationale


      This is the final iteration, so I am choosing the geometry with the best measured
      evidence rather than testing a new step. Iteration 10 (wheel_track 0.085 m,
      all other geometry as iteration 9) scored 63.41, the best result so far. It
      met the decision rule I set in iteration 9: s-bend progress rose from 0.1675
      to 0.1686 (oval 0.174 to 0.180), and slalom steering_oscillation stayed below
      0.16 at 0.1569. Line loss stayed at one event per run on the s-bend and slalom,
      so sensing is not the limit. The one warning is that s-bend steering_oscillation
      averaged 0.1617, just over the 0.16 trigger, with line loss unchanged. Under
      the pre-agreed rule, that calls for the Integrator to reduce kp, not for a geometry
      change. Narrowing the track further (to 0.08 m) would add turn gain and push
      oscillation past the trigger on the slalom with no clear progress evidence,
      and the unseen final track has a different shape, so I do not take that risk.
      Sensing (seven contiguous 16 mm sensors at x = ±0.048 m, y = 0.08 m), mass 0.8
      kg, wheel radius 0.03 m and body 0.12 × 0.16 m are all held at their tested
      values. Body width cannot improve the off-track limit, which is 0.06 m at any
      allowed width. I expect this layout to hold or slightly improve on the development
      tracks, with the final race depending mainly on the Integrator''s kp choice
      for oscillation.


      - [Open this output](iteration-11/entity0/versions/31ec767e6a1f436e8d808a1f9a166515/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-e5e6b2a327f184c5/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-21586de9f56ffb4d/payload.json)'
  - id: entity1
    label: Complete Robot Package
    notes: 'Complete Robot Package. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 9 (wheel_track 0.09 m, kp 4.6) lifted s-bend progress to 0.1675 and
      the oval to 0.174, with slalom and s-bend steering_oscillation at 0.157 and
      0.159, both just under the 0.16 trigger. Oscillation tracks effective turn gain
      (kp divided by wheel_track). Iteration 8 (kp 5.0, 0.10 m) and iteration 9 had
      similar gain and similar oscillation, so kp alone barely changed it. Following
      the Builder''s requested step, I set wheel_track 0.085 m. Turn gain then rises
      about 6 percent at equal kp, so I lower kp to 4.2 (gain about 49, slightly under
      iteration 9''s 51) to keep oscillation from reaching 0.16. Sensing, forward
      offset y = 0.08 m, mass 0.8 kg and radius 0.03 m stay as in iteration 9, so
      the race isolates the track width. Expected: s-bend progress about 0.17 and
      slalom oscillation about 0.155 to 0.16. These are predictions, not measurements.
      The line-loss recovery, base speed, ki and kd are unchanged.


      - [Open this output](iteration-10/entity1/versions/8443f2812bf448288878269a331c0f81/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/89d8f222f56647de9342fad93ee8c724/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-c5c07d82f0cf20f8/payload.json)'
  - id: entityR1
    label: Integration Feedback
    notes: 'Integration Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Written before this candidate has raced. Iteration 8 (wheel_track 0.10 m, kp
      5.0) raised s-bend progress from 0.1496 to 0.1604, and iteration 9 (0.09 m,
      kp 4.6) raised it to 0.1675, with the oval at 0.174. Both kept steering_oscillation
      near the 0.16 trigger: slalom 0.1566 and 0.1574, s-bend 0.1591 in iteration
      9. Oscillation followed effective turn gain (kp over track width), not kp alone,
      so I have scaled kp down with the narrower track. Iteration 4 (20 mm pitch)
      cut slalom progress to 0.035, so keep the 16 mm contiguous layout. Decide from
      the race. If s-bend progress rises above 0.1675 and slalom oscillation stays
      below 0.16, the drivetrain lever is still open, so keep this layout. If slalom
      or s-bend oscillation reaches 0.16 with line loss unchanged, do not change geometry;
      the Integrator reduces kp. If s-bend progress is flat at or below 0.1675, revert
      to 0.09 m and treat the drivetrain as exhausted at this sensing.


      ### Requested changes


      - If s-bend progress is flat at or below 0.1675 at wheel_track 0.085 m, revert
      to wheel_track 0.09 m (iteration 9 layout) and stop narrowing the track. Evidence:
      iteration 9 gained 0.007 over iteration 8, and the next narrowing step is the
      one that pushed oscillation toward 0.16.

      - If slalom or s-bend steering_oscillation reaches 0.16 with line_loss_events
      unchanged, keep the geometry and let the Integrator reduce kp further. Evidence:
      iteration 9 slalom was 0.1574 and s-bend 0.1591 at kp 4.6, and kp reductions
      alone shifted them only slightly.

      - Keep sensor_positions at seven contiguous 16 mm sensors at x = ±0.048 m, y
      = 0.08 m. Evidence: iteration 4''s 20 mm pitch cut slalom progress from 0.104
      to 0.035, and forward lead has plateaued (iterations 6 and 7).


      - [Open this output](iteration-10/entityR1/versions/8443f2812bf448288878269a331c0f81/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/89d8f222f56647de9342fad93ee8c724/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-c5c07d82f0cf20f8/payload.json)'
