overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Race evidence from iterations 2 to 4 points to three conclusions. (1) The contiguous
      16 mm layout at x = ±0.048 m removed line loss on the oval and s-bend (0 events
      each), so sensing footprint is no longer the limit there. (2) The s-bend fails
      at progress 0.04 with max_error about 0.061 m and zero line loss in every run
      since iteration 2. Kp 5.0 changed nothing (iteration 3 was identical to iteration
      2). In iteration 4, wheel_track 0.10 m and mass 0.6 kg also left s-bend progress
      at exactly 0.04 with max_error 0.0605 m. Turn rate is therefore not the binding
      constraint, and the robot is leaving the tape at a fixed point regardless of
      drivetrain. The likely cause is that the sensors reach the bend too late, so
      the controller starts responding after the robot is already committed. (3) Iteration
      4''s 20 mm pitch removed slalom line loss (0 events), but slalom progress fell
      from 0.104 to 0.035 and the robot went off track earlier, so the wider pitch
      with 16 mm sensors leaves the centre under-resolved. I revert that pitch and
      the drivetrain to the iteration 2 values (16 mm contiguous at ±0.048 m, wheel_track
      0.12 m, mass 0.8 kg), which had the best progress on the oval and slalom. The
      one change is a forward sensor offset of y = 0.05 m instead of 0.03 m, giving
      about 2 cm more lead. Steering oscillation has stayed at 0.07 to 0.14, well
      below the 0.16 trigger, so there is room for more lead. Expected result: s-bend
      progress above 0.04 (the first sign of a fix for the turn-rate lag), slalom
      progress at or above 0.104, and oval line loss still at 0. If s-bend progress
      is still 0.04 with y = 0.05 m, forward lead is not the fix and the next test
      is a larger lever (for example y = 0.07 m or a shorter wheel track of 0.08 m).


      - [Open this output](iteration-5/entity0/versions/0b3deaa5a2b1439289e8e869adb34277/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-785cedeb52bef5e8/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-55832d448d154e3b/payload.json)'
  - id: entity1
    label: Forward lead y=0.05 test
    notes: 'Complete package adopting the Builder''s iteration 5 geometry: contiguous
      16 mm sensors at ±0.048 m with forward offset y = 0.05 m, wheel_track 0.12 m
      and mass 0.8 kg. Controller is the iteration 2 setting (kp 5.0), so the race
      isolates forward lead. Evidence: iteration 4 showed that pitch widening and
      the drivetrain change did not help the s-bend.


      ### Rationale


      Iteration 4 cut slalom progress from 0.104 to 0.035 and left s-bend progress
      at 0.04, so the 20 mm pitch and the 0.10 m track / 0.6 kg mass combination did
      not help. Iteration 3 showed kp 5.0 vs 5.0 gives identical s-bend results, so
      gain is not the lever. The s-bend has zero line loss and ends at max_error about
      0.061 m, which points to the sensors reaching the bend too late. I therefore
      adopt the Builder''s iteration 5 geometry exactly: contiguous 16 mm sensors
      at x = ±0.048 m, forward offset y = 0.05 m, wheel_track 0.12 m and mass 0.8
      kg (the iteration 2 values with the best oval and slalom progress). Controller
      is held at the iteration 2 and 3 values (kp 5.0, ki 0.05, kd 0.3, base_speed
      1.5, last_direction line loss) so the race isolates forward lead. Weights stay
      proportional to x, so a positive signal steers left as the contract requires.
      Expected: s-bend progress above 0.04, slalom progress near 0.104, and no oval
      line loss. These are predictions, not measured results.


      - [Open this output](iteration-5/entity1/versions/bf2e83cdc32a4626b06d09ef76c35f6b/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/0b3deaa5a2b1439289e8e869adb34277/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-55832d448d154e3b/payload.json)'
  - id: entityR1
    label: Lead and back-off plan
    notes: 'Feedback written before the race, with the next step set by the outcome:
      increase lead to y = 0.07 m if the s-bend stays at 0.04, or back off to y =
      0.04 m if oscillation exceeds 0.16. Based on iterations 2 to 4, where s-bend
      progress stayed at 0.04 under kp, track and pitch changes.


      ### Feedback


      Written before this candidate has raced. Iterations 2 and 3 (16 mm contiguous
      at ±0.048 m, kp 5.0) removed line loss on the oval and s-bend, so sensing is
      no longer the limit there. They also gave identical s-bend results (progress
      0.04, max_error 0.0611 m) at kp 5.0 both times, so gain is not the lever. Iteration
      4 showed that the 20 mm pitch with 0.10 m track and 0.6 kg mass cut slalom progress
      from 0.104 to 0.035 and left s-bend progress at 0.04, so neither the wider pitch
      nor the narrower track/lighter mass is the fix. This candidate keeps the iteration
      2 sensing and drivetrain and moves only the forward offset to y = 0.05 m. Decide
      the next step from the race result. If s-bend progress rises above 0.04 with
      oscillation below 0.16, keep y = 0.05 m and test a further lead. If s-bend progress
      is still 0.04 with y = 0.05 m, forward lead is not the fix, and the next lever
      is a larger lead or a drivetrain change. If steering_oscillation rises above
      0.16 with no line loss, back off the lead toward y = 0.04 m.


      ### Requested changes


      - If s-bend progress is still about 0.04 with y = 0.05 m, try a larger forward
      offset of y = 0.07 m, keeping the 16 mm contiguous layout at ±0.048 m. Evidence:
      iterations 2, 3 and 4 all left s-bend progress at 0.04 with zero line loss and
      max_error about 0.061 m, across kp 5.0 and two drivetrains.

      - If steering_oscillation rises above 0.16 with line_loss_events at zero, reduce
      the forward offset to y = 0.04 m and keep the rest. Evidence: oscillation was
      0.07 on the oval and 0.14 on the slalom in iteration 2, so there is headroom,
      but the lead must not push jitter over the trigger.

      - Do not widen the pitch beyond the contiguous 16 mm layout at ±0.048 m, and
      keep wheel_track 0.12 m and mass 0.8 kg unless a result says otherwise. Evidence:
      iteration 4''s 20 mm pitch cut slalom progress from 0.104 (iteration 2) to 0.035
      and left the s-bend unchanged.


      - [Open this output](iteration-5/entityR1/versions/bf2e83cdc32a4626b06d09ef76c35f6b/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/0b3deaa5a2b1439289e8e869adb34277/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-55832d448d154e3b/payload.json)'
