map:
  id: race-125-randow-maps
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: 16 mm array, ±48 mm span
    notes: 'Seven 16 mm sensors at 16 mm pitch (x = ±0.048 m), up from 12 mm footprints.
      Iteration 1 still showed one line loss per run on the s-bend and slalom, and
      max_error sat just past 0.06 m, so the footprint is the next lever. Other geometry
      is held constant to isolate this change.


      ### Rationale


      Iteration 1 widened the array to seven 12 mm sensors at 12 mm pitch (x = ±0.036).
      Score fell from 64.7 to 50.7. Oval line loss improved (1.8 to 1.0), but s-bend
      and slalom still lose the line once per run (1.0 each), and max_error stays
      at 0.060 to 0.067 m, just past the 0.06 m off-track limit. Progress dropped
      on the oval (0.22 to 0.12). Integration feedback also changed the weights to
      be proportional to x and raised kp to 4.0, so the iteration 1 result mixes a
      span change with a controller change. Still, the geometry evidence is consistent:
      line loss persists on the two tracks where the robot leaves the tape, so the
      sensing footprint is still too narrow or too sparse at the edge. Body width
      cannot help, since the off-track limit stays at 0.06 m for any allowed width.
      The Integrator''s stated rule applies here: line loss above zero on the s-bend
      or slalom calls for the next step. I therefore set sensor_size to 0.016 m with
      seven sensors at 16 mm pitch, x = -0.048 to +0.048, y = 0.03. The 16 mm footprints
      tile contiguously, so the sum of readings should stay above 0.05 through the
      4 to 5 cm error zone, and the outer edge moves to ±0.048 m. I hold wheel track
      (0.12 m), radius (0.03 m), mass (0.8 kg), body (0.12 x 0.16 m) and forward offset
      (0.03 m) fixed, so this race isolates the footprint and span change. Expected
      result: line_loss_events near zero on the s-bend and slalom, max_error below
      0.06 m, and the first completions on the oval or s-bend.


      - [Open this output](iteration-2/entity0/versions/0b18619328a1496b92ec5a0b3e56cc3d/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-80a06d685da0a268/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-f73fce2ef8649656/payload.json)'
  - id: entity1
    label: 16mm array, kp 5.0
    notes: 'Complete robot for the Builder''s contiguous 16 mm seven-sensor layout
      at ±0.048 m, with kp raised to 5.0 to hold steering gain across the wider span.
      Evidence: iterations 0 and 1 both lost the line about once per run on the s-bend
      and slalom with max_error near 0.06 m.


      ### Rationale


      Iteration 0 (five 12 mm sensors, span ±0.024 m) and iteration 1 (seven 12 mm
      sensors, span ±0.036 m) both lost the line about once per run on the s-bend
      and slalom, with max_error at 0.060 to 0.067 m, just past the 0.06 m off-track
      limit. Iteration 1 also changed kp from 3.0 to 4.0 and flattened the weights,
      so its score drop (64.7 to 50.7) cannot be attributed to span alone. The Builder''s
      new proposal keeps seven sensors but moves to 16 mm footprints at 16 mm pitch
      (x = ±0.048 m, y = 0.03 m), which tiles the span contiguously and extends the
      outer edge. I keep the geometry exactly as proposed. For the controller, I keep
      weights proportional to x, scaled so the outer sensors are ±1.0, which matches
      the contract''s requirement that a positive signal steers left for positive
      x. The wider footprint lengthens the lateral distance over which the signal
      moves from -1 to +1, so the effective steering gain per metre of error falls.
      Iteration 0 gave roughly 125 per metre (kp 3.0 over a 0.024 m weight scale),
      and iteration 1 gave roughly 111 per metre. Holding about 104 per metre at the
      new 0.048 m scale needs kp near 5.0, so I set kp to 5.0. I keep ki 0.05, kd
      0.3, base_speed 1.5 and line_loss ''last_direction'' unchanged, since iteration
      0 and 1 gave no evidence that they limit the result. Expected result: line_loss_events
      near zero on the s-bend and slalom, max_error below 0.06 m, and at least some
      completions. Because kp changed along with the geometry, the race result mixes
      both effects; I report the controller change so the next iteration can separate
      them.


      - [Open this output](iteration-2/entity1/versions/e569a7968bf0487893f29ce18ab11610/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/0b18619328a1496b92ec5a0b3e56cc3d/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-f73fce2ef8649656/payload.json)'
  - id: entityR1
    label: Span and gain feedback
    notes: 'Pre-race feedback that confirms the 16 mm span and gives two conditional
      next steps, a 20 mm pitch extension and a forward offset change, tied to the
      line-loss and oscillation numbers. It flags that iteration 1 confounded span
      and kp, so the next race''s comparison needs care.


      ### Feedback


      Written before this candidate has raced. Iteration 0 (five 12 mm sensors, span
      ±0.024 m) had 60 trials, zero completions, line_loss_events of 1.0 to 1.8 per
      run, and max_error of 0.061 to 0.064 m, which is past the 0.06 m off-track limit.
      Iteration 1 (seven 12 mm sensors, span ±0.036 m) kept the same failure pattern,
      with line loss of 1.0 on all tracks and max_error of 0.060 to 0.067 m, and its
      score fell from 64.7 to 50.7. Because I also changed kp from 3.0 to 4.0 in that
      iteration, the drop cannot be assigned to span alone. The evidence supports
      moving to 16 mm footprints. Your proposal does this, contiguous at ±0.048 m,
      and I have built that package with kp 5.0 so the steering gain per metre stays
      near the iteration 0 level. Use the next race to decide the next step. If line_loss_events
      are still above zero on the s-bend or slalom, extend the span with a wider pitch:
      16 mm sensors at 20 mm pitch, x = -0.06 to +0.06 (gaps of 4 mm are acceptable
      because the 25 mm tape covers several sensors). If steering_oscillation rises
      above the iteration 0 level of 0.14 to 0.16 with line_loss_events near zero,
      move the forward offset to y = 0.05 m. If tracks complete but completion_time
      stays above 2 s, or no track completes after line loss is gone, try wheel_track
      0.10 m with mass 0.6 kg.


      ### Requested changes


      - If line_loss_events stay above zero on the s-bend or slalom after the 16 mm
      race, change sensor_positions to seven 16 mm sensors at 20 mm pitch (x = -0.06
      to +0.06, y = 0.03) to extend the outer edge past the 4 to 5 cm error zone.
      Evidence: iterations 0 and 1 both lost the line about once per run on the s-bend
      and slalom, and iteration 1 widening to 12 mm pitch did not remove it.

      - If steering_oscillation rises above 0.14 to 0.16 with line_loss_events near
      zero, set the sensor y offset to 0.05 m for all sensors. Evidence: iteration
      0 oscillation of 0.14 to 0.16 on the s-bend and slalom, and the oval reached
      0.16 with the 12 mm array.

      - If tracks complete but completion_time is above 2 s, or no track completes
      once line loss is gone, try wheel_track 0.10 m with mass 0.6 kg. Evidence: iteration
      0 slalom had the lowest progress (0.108) and the largest gap between rms_error
      and progress, which points to turn-rate limits.


      - [Open this output](iteration-2/entityR1/versions/e569a7968bf0487893f29ce18ab11610/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/0b18619328a1496b92ec5a0b3e56cc3d/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-f73fce2ef8649656/payload.json)'
