map:
  id: race-125-randow-maps
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Forward lead y=0.07 m
    notes: 'Keeps the iteration 5 layout (16 mm contiguous at ±0.048 m, 0.12 m track,
      0.8 kg) and moves the sensors to y = 0.07 m. Iteration 5 lifted s-bend progress
      from 0.04 to 0.1475 with oscillation 0.137, so forward lead is the working lever.
      The race will show whether a larger lead keeps going or adds line loss.


      ### Rationale


      Iteration 5 (y = 0.05 m, contiguous 16 mm sensors at x = ±0.048 m, wheel_track
      0.12 m, mass 0.8 kg) met the Integrator''s first success condition. S-bend progress
      rose from 0.04 to 0.1475, and steering_oscillation stayed at 0.1366, below the
      0.16 trigger. The forward lead was therefore the first geometry change to move
      the s-bend, which the drivetrain change (iteration 4) and the gain change (iteration
      3) never did. Two things remain. The s-bend and slalom each show one line-loss
      event per run, and slalom max_error is 0.0661 m, past the 0.06 m off-track limit.
      The oval is clean (0 line loss, progress 0.115). Iteration 4 showed that widening
      the pitch to 20 mm cut slalom progress, so I do not widen the pitch. The slalom
      progress of 0.105 is back at the iteration 2 level, so the 16 mm contiguous
      layout is still the better sensing choice. The Integrator''s rule says that
      when s-bend progress rises with oscillation below 0.16, keep y = 0.05 m and
      test a further lead. I therefore move the sensors to y = 0.07 m, the upper end
      of the contract''s forward range is 0.08 m, and I keep every other value fixed.
      This isolates the lead variable against iteration 5. Expected result: s-bend
      progress above 0.1475, steering_oscillation still below 0.16, and no added line
      loss on the oval. Line loss on the s-bend and slalom may persist or get worse,
      since sensors further ahead see the bend earlier and the lateral error they
      report lags the wheels more. If line loss rises or oscillation passes 0.16,
      the next step is y = 0.06 m, not further lead.


      - [Open this output](iteration-6/entity0/versions/66a3e8d1257c4af484d77f68923d2542/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-abcc613d8648e05c/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-7ed55035a8a02fca/payload.json)'
  - id: entity1
    label: Forward lead y=0.07 m
    notes: 'Package moves the seven 16 mm contiguous sensors to y = 0.07 m with the
      iteration 5 controller held fixed. Iteration 5 at y = 0.05 m raised s-bend progress
      from 0.04 to 0.1475 with oscillation 0.1366.


      ### Rationale


      Iteration 5 moved all seven 16 mm contiguous sensors from y = 0.03 m to y =
      0.05 m, with the iteration 2 drivetrain (wheel_track 0.12 m, mass 0.8 kg) and
      controller (kp 5.0). S-bend progress rose from 0.04 to 0.1475, and steering_oscillation
      stayed at 0.1366, below the 0.16 trigger. Forward lead is therefore the first
      lever to move the s-bend, which kp (iteration 3), pitch and drivetrain (iteration
      4) did not. Iteration 5 still shows one line-loss event on the s-bend and slalom,
      and slalom max_error of 0.0661 m. The oval is clean at 0 line loss and 0.115
      progress. The Builder''s intent is to test a further lead of y = 0.07 m. The
      Integrator''s rule says that when s-bend progress rises with oscillation below
      0.16, keep the forward offset and test more lead, so I adopt it. I keep the
      controller identical to iteration 5 (kp 5.0, ki 0.05, kd 0.3, base_speed 1.5,
      last_direction, weights proportional to x with a positive signal steering left)
      so that this race isolates the forward offset. I keep the 16 mm contiguous layout
      at x = ±0.048 m, because iteration 4 showed that a 20 mm pitch cut slalom progress.
      I expect s-bend progress above 0.1475 and steering_oscillation below 0.16. Line
      loss on the s-bend and slalom may persist or worsen, since the sensors see the
      bend earlier. These are predictions, not measurements.


      - [Open this output](iteration-6/entity1/versions/7f7a08ebf78345189bb48d246e1bfbba/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/66a3e8d1257c4af484d77f68923d2542/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-7ed55035a8a02fca/payload.json)'
  - id: entityR1
    label: Lead then back-off rules
    notes: 'Feedback is written before the race: it tells the Builder to go to y =
      0.08 m if s-bend progress keeps rising, and to back off to y = 0.06 m if oscillation
      or line loss rises. The requested changes cite iterations 4 and 5.


      ### Feedback


      Written before this candidate has raced. Iteration 5 (y = 0.05 m, 16 mm contiguous
      at ±0.048 m, kp 5.0, wheel_track 0.12 m, mass 0.8 kg) raised s-bend progress
      from 0.04 to 0.1475 with steering_oscillation 0.1366, which confirms forward
      lead as the working lever. Iterations 2 to 4 showed that kp changes (iteration
      3 matched iteration 2 exactly), a 20 mm pitch (iteration 4 cut slalom progress
      to 0.035) and a 0.10 m track with 0.6 kg mass (iteration 4, s-bend still 0.04)
      do not fix the s-bend. Iteration 5 also left one line-loss event per run on
      the s-bend and slalom, and slalom max_error at 0.0661 m. The candidate you receive
      moves the sensors to y = 0.07 m and keeps every other value. Decide the next
      step from the race. If s-bend progress rises above 0.1475 and steering_oscillation
      stays below 0.16 with line loss at zero or unchanged, keep the lead and test
      the next offset. If steering_oscillation rises above 0.16 with line_loss_events
      at zero, go back to y = 0.06 m. If line loss on the s-bend or slalom rises above
      one event per run, the sensors are seeing the bend too early, so return to y
      = 0.06 m and keep the 16 mm layout.


      ### Requested changes


      - If s-bend progress rises above 0.1475 and steering_oscillation stays below
      0.16, keep sensor_positions at y = 0.07 m and move the forward offset to y =
      0.08 m (the contract maximum) to test whether further lead continues to help.
      Evidence: iteration 5 moved s-bend progress from 0.04 to 0.1475 at y = 0.05
      m.

      - If steering_oscillation rises above 0.16 with line_loss_events at zero, set
      sensor_positions y to 0.06 m with the same x values. Evidence: iteration 0 oscillation
      was 0.14 to 0.16 on the s-bend and slalom, and iteration 5 was 0.1366 at y =
      0.05 m.

      - If line_loss_events on the s-bend or slalom rise above one per run, keep the
      16 mm contiguous layout at ±0.048 m and set y = 0.06 m rather than adding lead.
      Evidence: iteration 5 kept line loss at one event per run on the s-bend and
      slalom, and iteration 4 showed that widening the pitch to 20 mm cut slalom progress.


      - [Open this output](iteration-6/entityR1/versions/7f7a08ebf78345189bb48d246e1bfbba/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/66a3e8d1257c4af484d77f68923d2542/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-7ed55035a8a02fca/payload.json)'
