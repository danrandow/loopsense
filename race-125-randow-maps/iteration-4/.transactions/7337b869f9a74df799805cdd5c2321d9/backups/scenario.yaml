map:
  id: race-125-randow-maps
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: 20mm pitch, 0.10m track
    notes: 'Widens the 16 mm sensor array to 20 mm pitch (x ±0.06 m) to clear the
      slalom line loss, and narrows the wheel track to 0.10 m with mass 0.6 kg to
      raise turn rate for the s-bend drift. Rests on iteration 2 showing zero s-bend
      line loss with progress 0.04, and the slalom''s one line loss per run.


      ### Rationale


      Iteration 2 (16 mm contiguous sensors, x = ±0.048 m) removed line loss on the
      oval and s-bend, which supports the footprint fix. Two problems remain. First,
      the slalom still loses the line once per run (line_loss_events 1.0, max_error
      0.0628 m), so the 4 to 5 cm error zone is not fully covered. The Integrator''s
      pre-agreed rule applies: widen the pitch to 20 mm (x = -0.06 to +0.06 m, y =
      0.03 m). Second, the s-bend has zero line loss but progress of only 0.04 with
      max_error 0.0611 m, so the robot leaves the tape through turn-rate lag, not
      lost sensing. Iteration 3 repeated iteration 2''s geometry and returned identical
      metrics to four decimals, so the kp change had no visible effect and the s-bend
      failure is not a gain problem. Steering oscillation is 0.075 on the oval and
      0.14 on the slalom, both below the 0.16 threshold, so I leave the sensor y offset
      at 0.03 m. For turn rate, I reduce wheel_track from 0.12 to 0.10 m, which raises
      the turn rate per unit wheel differential by about 20 percent, and reduce mass
      from 0.8 to 0.6 kg to lower yaw inertia, as the Integrator''s fallback suggests.
      The s-bend should barely depend on the sensor pitch change, since it has no
      line loss, so any s-bend progress gain can be credited mostly to the drivetrain
      change. The slalom result will mix both changes, so I treat it as a combined
      test. I keep body width 0.12 m and body length 0.16 m because the off-track
      limit is 0.06 m for any allowed width. Expected result: slalom line_loss_events
      near zero, s-bend progress above 0.04, and a first completion on the oval or
      s-bend. Watch for slip at lower mass.


      - [Open this output](iteration-4/entity0/versions/d6e48268fe5b42548be386efb12e2c8d/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-4285ef0f41a6153c/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-f88d20c9d886ef89/payload.json)'
  - id: entity1
    label: 16mm array, kp 5.0 test
    notes: 'Holds iteration 2''s 16 mm contiguous sensing and kp 5.0 unchanged to
      isolate controller gain on the s-bend drift, which showed progress 0.04 with
      zero line loss. Weights stay proportional to x and the other controller values
      are unchanged.


      ### Rationale


      Iteration 2 (16 mm contiguous sensors at x = ±0.048 m, kp 5.0) removed line
      loss on the oval and s-bend (0 events on both) but did not produce completions.
      The s-bend ended off track at max_error 0.0611 m with progress only 0.04, and
      the slalom still shows one line-loss event per run with max_error 0.0628 m.
      The remaining failure is drift or turn-rate lag, not a detection gap. The Builder''s
      proposal keeps the iteration 2 geometry, so this race isolates controller gain
      on the same sensing. I therefore keep kp 5.0 as the only controller setting
      that differs from iteration 1. I keep the weights proportional to x (-1.0 to
      +1.0) so a positive signal steers left, as the contract requires. I leave ki
      at 0.05, kd at 0.3, base_speed at 1.5 and line_loss at last_direction, because
      no evidence yet shows they limit the result. ki is the next candidate if the
      s-bend shows a steady one-sided drift, since a fixed motor mismatch produces
      a constant offset that a larger integral term would remove. I expect line_loss_events
      to stay at 0 on the oval and s-bend, max_error to stay below about 0.061 m,
      and s-bend progress to rise above the iteration 2 value of 0.04. I cannot verify
      this before the race.


      - [Open this output](iteration-3/entity1/versions/350cb592c56c4935a2c8356db428705a/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/d1433cfa80ba4e38802612f29dc262bd/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-f88d20c9d886ef89/payload.json)'
  - id: entityR1
    label: Next steps by race result
    notes: 'Gives three conditional changes tied to iteration 0 to 2 evidence: 20
      mm pitch if slalom line loss persists, y = 0.05 m if oscillation rises, and
      wheel_track 0.10 m with mass 0.6 kg if the s-bend drifts off track with zero
      line loss. Written before the candidate races, so it states no outcome.


      ### Feedback


      Written before this candidate has raced. Iteration 0 (five 12 mm sensors, span
      ±0.024 m) had 60 trials, zero completions, line-loss events of 1.0 to 1.8 per
      run, and max_error of 0.061 to 0.064 m, just past the 0.06 m off-track limit
      (cited in the iteration 0 outcome table). Iteration 1 (seven 12 mm sensors,
      span ±0.036 m) kept the same failure pattern, with line loss of 1.0 on the s-bend
      and slalom, and progress on the oval fell from 0.22 to 0.12. Iteration 1 also
      changed kp from 3.0 to 4.0, so that drop cannot be assigned to span alone. Iteration
      2 (your 16 mm contiguous layout at ±0.048 m, kp 5.0) removed line loss on the
      oval and s-bend, which supports the footprint change. But s-bend progress fell
      to 0.04 with max_error 0.0611 m and zero line loss, so the robot now leaves
      the tape by drift or turn-rate lag rather than by losing sensor coverage. Your
      iteration 3 geometry is the same as iteration 2, and I built it with kp 5.0
      to isolate gain. Use the next race to decide the next step. If line_loss_events
      are still above zero on the slalom, widen the pitch to 20 mm (x = -0.06 to +0.06,
      y = 0.03), because the 4 to 5 cm error zone is still not covered. If steering_oscillation
      rises above 0.16 with line_loss_events at zero, move the sensor y offset to
      0.05 m. If the robot stays off track with zero line loss (as the iteration 2
      s-bend did), change wheel_track to 0.10 m with mass 0.6 kg to increase turn
      rate; I would hold the sensor layout fixed for that test.


      ### Requested changes


      - If line_loss_events stay above zero on the slalom after this race, change
      sensor_positions to seven 16 mm sensors at 20 mm pitch (x = -0.06 to +0.06,
      y = 0.03). Evidence: iterations 0, 1 and 2 each show one line-loss event per
      slalom run, and the 12 mm and 16 mm contiguous layouts at ±0.036 and ±0.048
      m did not remove it.

      - If steering_oscillation rises above 0.16 with line_loss_events at zero, set
      the sensor y offset to 0.05 m for all sensors. Evidence: iteration 0 oscillation
      was 0.14 to 0.16 on the s-bend and slalom, and iteration 2 oval was 0.075, so
      the jitter risk is in the lateral error, not the footprint.

      - If the robot stays off track with zero line loss on the s-bend (max_error
      near 0.061 m, progress near 0.04 as in iteration 2), try wheel_track 0.10 m
      with mass 0.6 kg with the sensor layout unchanged. Evidence: iteration 2 s-bend
      had zero line loss but progress of 0.04, and iteration 0 slalom had the lowest
      progress (0.108) with the largest gap between rms_error and progress, which
      points to turn-rate limits.


      - [Open this output](iteration-3/entityR1/versions/350cb592c56c4935a2c8356db428705a/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/d1433cfa80ba4e38802612f29dc262bd/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-f88d20c9d886ef89/payload.json)'
