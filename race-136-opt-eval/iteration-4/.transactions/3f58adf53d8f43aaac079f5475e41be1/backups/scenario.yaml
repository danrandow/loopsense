  id: race-136-opt-eval
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Integral gain raised to
    notes: 'Keeps iteration 3''s geometry and kp 2.5 and raises ki from 0.3 to 0.5
      to remove the steady drift. Iteration 3 showed zero line loss, max_error still
      at 0.061, and low s-bend and slalom oscillation (0.064 to 0.067), which points
      to steady drift.


      ### Rationale


      Evidence from iteration 3 (kp 2.5, ki 0.3, kd 0.1, base_speed 1.4, sensors at
      x = +/-0.06 m, weights +/-1.5 outer and +/-0.75 inner): score 40.69, the best
      raced so far. line_loss_events is 0 on all three tracks, so the wider span is
      holding the line. All 60 runs still end off_track with max_error 0.0609 to 0.0629
      m, just above the 0.06 m limit. The s-bend and slalom show low steering_oscillation
      (0.0665 and 0.0633) with progress of only 0.041 and 0.035, which is steady drift,
      not jitter. The oval still has high oscillation (0.113), and lowering kp from
      3.0 to 2.5 barely changed it (0.112 to 0.113), so the oval is not limited by
      the proportional gain. The evaluator''s rule (a) applies: line loss is 0, max_error
      is still at or above 0.06, and the s-bend and slalom oscillation is low. So
      the drift is steady and the integral term should be raised. I change one group:
      controller.ki from 0.3 to 0.5, with everything else held at iteration 3. The
      integral is capped at +/-2, so the extra turn stays bounded, and it should cancel
      more of the constant left/right motor-mismatch bias that proportional control
      leaves behind. Expected result, not yet measured: line_loss_events stays 0,
      max_error on the s-bend and slalom falls below 0.06 or stays close to it, and
      progress rises above 0.04. The main risk is integral overshoot on the oval,
      where oscillation is already high. Hypotheses for the next race: (1) if the
      s-bend and slalom max_error drops below 0.06 with progress near 1 and completion_time
      above 3 s, raise base_speed to 1.7; (2) if oval steering_oscillation stays above
      about 0.09, test kd (raise toward 0.2) before lowering kp again; (3) if progress
      on the s-bend falls, ki is overcorrecting and should return to 0.3.


      - [Open this output](iteration-4/entity0/versions/9aa08a838d094e599902526a070bc367/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-5c56565a204f0aad/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-c267a17b669dc41d/payload.json)'
  - id: entityR1
    label: Approve ki 0.5 test
    notes: 'Approved the single-variable change ki 0.3 to 0.5 on the best raced design
      (iteration 3, score 40.69). Iteration 3 showed zero line loss but steady drift
      with max_error just above 0.06 and low s-bend and slalom oscillation, which
      the integral term is meant to address.


      ### Feedback


      Pre-race review, based only on earlier races and the candidate''s contents.
      The candidate is valid: five sensors match five weights, x-positions are within
      ±0.08 m, and ki = 0.5 is inside its 0–5 range with the integral capped at ±2.
      It changes one group from the best raced design (iteration 3, score 40.69):
      controller.ki from 0.3 to 0.5, with geometry, kp 2.5, kd 0.1, base_speed 1.4
      and line_loss last_direction unchanged. Iteration 3 showed line_loss_events
      0 on all three tracks and max_error still at 0.0609 to 0.0629 m, just above
      the 0.06 m limit. Its s-bend and slalom oscillation was low (0.0665 and 0.0633)
      with progress of only 0.041 and 0.035, which points to steady drift rather than
      jitter, so a larger integral term is the change the evidence supports. The oval
      oscillation (0.113) was not moved by kp in iteration 3, so it is not a proportional-gain
      problem, and this candidate does not address it. The rationale''s expected outcomes
      are hypotheses only and are not measured. Use the next race as follows. (a)
      If the s-bend or slalom progress falls, or max_error rises above 0.0629, the
      integral is overcorrecting: return ki to 0.3. (b) If line_loss_events stays
      0 and max_error on the s-bend and slalom drops below 0.06 with progress near
      1 and completion_time above 3 s, raise base_speed to 1.7. (c) If oval steering_oscillation
      stays above about 0.09, test kd at 0.2 before lowering kp again. Change one
      group of fields per revision.


      ### Requested changes


      - If the s-bend or slalom progress falls below iteration 3''s 0.041 and 0.035,
      or max_error rises above 0.0629, revert controller.ki to 0.3 and keep kp at
      2.5, since iteration 3 is the best raced design.

      - If line_loss_events stays 0 and max_error drops below 0.06 with progress near
      1 and completion_time above 3 s, set controller.base_speed to 1.7 and keep the
      other fields.

      - If oval steering_oscillation stays above about 0.09 (iteration 3 measured
      0.113), set controller.kd from 0.1 to 0.2 with ki and kp unchanged before lowering
      kp again.


