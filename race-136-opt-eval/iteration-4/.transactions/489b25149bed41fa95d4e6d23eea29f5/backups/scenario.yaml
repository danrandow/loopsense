map:
  id: race-136-opt-eval
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Integral gain raised to
    notes: 'Keeps iteration 3''s geometry and kp 2.5 and raises ki from 0.3 to 0.5
      to remove the steady drift. Iteration 3 showed zero line loss, max_error still
      at 0.061, and low s-bend and slalom oscillation (0.064 to 0.067), which points
      to steady drift.


      ### Rationale


      Evidence from iteration 3 (kp 2.5, ki 0.3, kd 0.1, base_speed 1.4, sensors at
      x = +/-0.06 m, weights +/-1.5 outer and +/-0.75 inner): score 40.69, the best
      raced so far. line_loss_events is 0 on all three tracks, so the wider span is
      holding the line. All 60 runs still end off_track with max_error 0.0609 to 0.0629
      m, just above the 0.06 m limit. The s-bend and slalom show low steering_oscillation
      (0.0665 and 0.0633) with progress of only 0.041 and 0.035, which is steady drift,
      not jitter. The oval still has high oscillation (0.113), and lowering kp from
      3.0 to 2.5 barely changed it (0.112 to 0.113), so the oval is not limited by
      the proportional gain. The evaluator''s rule (a) applies: line loss is 0, max_error
      is still at or above 0.06, and the s-bend and slalom oscillation is low. So
      the drift is steady and the integral term should be raised. I change one group:
      controller.ki from 0.3 to 0.5, with everything else held at iteration 3. The
      integral is capped at +/-2, so the extra turn stays bounded, and it should cancel
      more of the constant left/right motor-mismatch bias that proportional control
      leaves behind. Expected result, not yet measured: line_loss_events stays 0,
      max_error on the s-bend and slalom falls below 0.06 or stays close to it, and
      progress rises above 0.04. The main risk is integral overshoot on the oval,
      where oscillation is already high. Hypotheses for the next race: (1) if the
      s-bend and slalom max_error drops below 0.06 with progress near 1 and completion_time
      above 3 s, raise base_speed to 1.7; (2) if oval steering_oscillation stays above
      about 0.09, test kd (raise toward 0.2) before lowering kp again; (3) if progress
      on the s-bend falls, ki is overcorrecting and should return to 0.3.


      - [Open this output](iteration-4/entity0/versions/9aa08a838d094e599902526a070bc367/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-5c56565a204f0aad/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-c267a17b669dc41d/payload.json)'
  - id: entityR1
    label: Approve kp 2.5 test
    notes: 'Approved the single change kp 3.0 to 2.5 on the best raced design (iteration
      2, score 40.38), which lowers the effective outer gain from 4.5 to 3.75. The
      evidence is line_loss_events 0 with max_error about 0.061 m and oval oscillation
      at 0.112, so the race will show whether lower gain fixes the drift.


      ### Feedback


      Pre-race review, based only on earlier races. Iteration 2 (sensors at +/-0.06
      m, weights +/-1.5 outer and +/-0.75 inner, kp 3.0, ki 0.3, kd 0.1, base_speed
      1.4) is the best raced design at 40.38. It had line_loss_events 0 on all three
      tracks, down from 1 per run in iteration 1, so the wider span fixed the line
      loss. Every run still ended off_track (0 of 60 finished), with max_error 0.0609
      to 0.0627 m, at or just above the 0.06 m limit. The oval had the highest steering_oscillation
      (0.112) and the widest score spread (31 to 167), which fits the 1.5x outer-weight
      scaling raising the effective outer gain from 3.0 to 4.5. The s-bend and slalom
      had low oscillation (0.064 to 0.067) with progress of only 0.04 and 0.035, so
      they are drifting, not jittering. This candidate changes one field, kp 3.0 to
      2.5, which lowers the effective outer gain to 3.75. The arithmetic is correct,
      the geometry and every other controller field match the best raced design, and
      it is valid. It is a sound single-variable test and it fits the budget, so approve
      it for the race. The race is needed to see whether the lower gain reduces oscillation
      without losing steering authority. Do not treat the rationale''s expected outcomes
      as measured. After the race, use the telemetry as follows. (a) If line_loss_events
      stays 0 and max_error is still at or above 0.06 with low oscillation on the
      s-bend and slalom, the drift is steady; raise ki toward 0.5 next. (b) If max_error
      falls below 0.06 with progress near 1 and completion_time above 3 s, raise base_speed
      to 1.7. (c) If max_error still reaches 0.06 with oval oscillation above about
      0.09, the outer gain is still too high; do not lower kp further before testing
      kd. If kp 2.5 causes under-steering on the s-bend (progress falls or max_error
      grows as the robot runs), return kp to 3.0 and test ki instead. Change one group
      of fields per revision.


      ### Requested changes


      - If the next race shows line_loss_events 0 with max_error still at or above
      0.06 and low steering_oscillation on the s-bend and slalom (steady drift), set
      controller.ki from 0.3 to 0.5 and keep kp at 2.5, citing iteration 2''s low
      s-bend and slalom oscillation (0.064 to 0.067).

      - If the next race shows line_loss_events 0, max_error below 0.06, and completion_time
      above 3 s with progress near 1, set controller.base_speed to 1.7 and keep the
      other fields, citing iteration 1''s progress with only one line loss per run.

      - If the next race shows under-steering (progress falls or max_error grows on
      the s-bend relative to iteration 2''s 0.0616), revert controller.kp to 3.0 and
      keep sensor_weights unchanged, citing iteration 2 as the best raced design.


      - [Open this output](iteration-3/entityR1/versions/80edd4896d59431ab22985bee0b40270/payload.json)

