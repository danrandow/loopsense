  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: 'Final: best raced design'
    notes: 'Resubmits iteration 10''s unchanged design (kd 0.3, base_speed 1.5, kp
      2.5, ki 0.5), the best raced score at 56.8458. It skips the Evaluator''s base_speed
      1.6 step because the oval line-loss condition for that step was not met (2.2
      against the 1.7 limit).


      ### Rationale


      Iteration 10 (kd 0.2 to 0.3, everything else as iteration 8''s best speed setting)
      is the best raced design at 56.8458, up from 46.1311. The gain came mainly from
      slalom progress rising from 0.036 to 0.111, with s-bend flat at 0.0415. The
      oval progress rose to 0.2734, but its line_loss_events rose from 1.7 to 2.2
      and steering_oscillation from 0.17 to 0.16. The Evaluator''s conditional rules
      were written against iteration 8. Rule (a) for keeping kd 0.3 and testing base_speed
      1.6 needs oval line_loss at or below 1.7, which was not met. Rule (b) for reverting
      kd to 0.2 was written for a score of 46.13 and does not fit a result that beats
      it by 10.7 points. The final race is on unseen tracks and is scored once, so
      a measured design should beat an untested step. I therefore submit iteration
      10''s design unchanged: geometry outer sensors at +/-0.07 with inner sensors
      at +/-0.03 and 0, weights +/-1.5 and +/-0.75 with centre 0, base_speed 1.5,
      kp 2.5, ki 0.5, kd 0.3, last_direction. I do not test base_speed 1.6 here because
      the oval line-loss trend is already worse than the approval condition, and a
      speed step could cost more than it gains on an unseen track. Expected result,
      which is a reference rather than a prediction: a score near 56.8 on the development
      tracks. Watch whether the unseen track''s line losses and off-track exits resemble
      the oval''s pattern. Measurements requested: all metrics plus noise_robustness,
      so the result can be compared directly with iteration 10.


      - [Open this output](iteration-11/entity0/versions/df82c0f020574fe39a8c2e276ef95d94/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-65814e8d5a6c8bd8/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-9a8bbf76c1b119d0/payload.json)'
  - id: entityR1
    label: Approve best raced design
    notes: 'Approved iteration 10''s design unchanged because it is the best raced
      result (56.85) and matches the Optimizer''s candidate field for field. Based
      on the outcome table, the oval line-loss trend is the main risk, but a single-field
      step now would be untested on the final race.


      ### Feedback


      Pre-race review, based only on earlier races and the candidate''s contents.
      Nothing has raced for this candidate, so this states no outcome for it. The
      candidate is valid: five sensor positions with outer x at +/-0.07 and inner
      at +/-0.03 and 0 (y = 0.03), five weights matching them, and kp 2.5, ki 0.5,
      kd 0.3, base_speed 1.5 and last_direction are all inside their ranges. It matches
      iteration 10 (score 56.8458, the best raced design) field for field, so it is
      the best-measured design available. Iteration 10 improved on iteration 8 mainly
      through slalom progress (0.036 to 0.111), with s-bend flat at 0.0415. Its oval
      line_loss_events rose from 1.7 to 2.2 and oval steering_oscillation was 0.16,
      so the oval is the weak spot. Those oval numbers were measured on development
      tracks, not the unseen track. Every run on every track still ended off_track,
      with max_error about 0.060 to 0.063 m. Testing base_speed 1.6 now would be an
      untested step on the final, once-scored race, and iteration 9 showed that a
      one-field change can cost points. Approve it unchanged. After the race, the
      telemetry is for the record only, since there is no later iteration to act on
      it. Watch whether the unseen track''s line losses and off-track exits look like
      the oval''s pattern.


      ### Requested changes


      - No change for this race: approve iteration 10''s design (kd 0.3, base_speed
      1.5, kp 2.5, ki 0.5, outer sensors +/-0.07) unchanged, because it is the best
      raced design at 56.8458 and any single-field step is untested.

      - If a later review of this design were possible, the first candidate change
      would be controller.base_speed 1.6 with all other fields fixed, citing iteration
      8''s oval progress gain from 1.4 to 1.5 (0.2261 to 0.2657), but only if oval
      line_loss_events stays at or below 2.2 and noise_robustness does not drop.


      - [Open this output](iteration-11/entityR1/versions/2856b0a8c8844a8fbab129d50de4512c/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/df82c0f020574fe39a8c2e276ef95d94/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-9a8bbf76c1b119d0/payload.json)'
