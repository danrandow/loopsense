overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'Conservative first candidate: five 12 mm sensors across 40 mm, kp 3.0,
      kd 0.05, no integral, base speed 1.6, last_direction line loss. No prior race
      data exists, so the values are chosen from the contract ranges to finish the
      course and produce telemetry for diagnosis.


      ### Rationale


      Iteration 0 has no race data or evaluator feedback, so this is a conservative
      baseline meant to finish the course and produce telemetry. Geometry: five line
      sensors spaced 10 mm apart across x = +/-20 mm (sensor_size 12 mm, which covers
      the 25 mm tape with margin), all at y = 30 mm ahead of the axle so they read
      the line before the wheels reach it. Wheel track 0.12 m and radius 0.03 m give
      a stable, moderately agile base. Body width 0.12 m keeps the off-track limit
      at max(0.06, 0.0125 + 0.03) = 0.0425 m... the larger of 0.06 m and the tape-based
      limit, so about 0.06 m of tolerance. Mass 0.8 kg with body length 0.18 m gives
      moderate yaw inertia. Controller: the signal is a reading-weighted average of
      weights [1.0, 0.5, 0, -0.5, -1.0] (positive = left), so it is proportional to
      lateral error and bounded by 1. kp = 3.0 gives a full-scale turn of about 3
      (about 1050 PWM differential) at the edge of the line, which is strong enough
      to track bends without saturating. kd = 0.05 damps the response slightly, and
      ki = 0 avoids integral windup on the long bends. base_speed = 1.6 (PWM about
      80 percent) targets an average speed near 1.5 m/s to finish inside 3 s. line_loss
      = last_direction, so the robot turns back toward the side it last saw the line.
      Expected result: completion on the oval and s-bend, with some oscillation on
      the slalom. The measurements requested (rms_error, max_error, steering_oscillation,
      line_loss_events, completion_time) will show whether kp is too high (oscillation,
      large max_error) or too low (large rms_error on the bends) and whether speed
      is limiting completion time. Hypotheses to test next: (1) if steering_oscillation
      is high, reduce kp and raise kd; (2) if completion_time is near 3 s with progress
      below 1, raise base_speed; (3) if line_loss_events is above 0, widen the sensor
      span or add a sensor.


      - [Open this output](iteration-0/entity0/versions/8ccea55316524ef2b1e454d55d505c76/payload.json)'
  - id: entityR1
    label: Evaluator Feedback
    notes: 'Evaluator Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Iteration 0 has no earlier race results and no raced candidate, so this review
      rests only on the contract and the candidate''s own contents. I checked it against
      the contract: five sensors match five weights, all sensor x-positions are within
      ±0.08 m, y = 0.03 m is within range, sensor_size 0.012 m is allowed, and every
      controller field is inside its limit. The candidate is valid and not obviously
      broken, so it is worth racing for telemetry. Its rationale claims an average
      speed near 1.5 m/s and completion within 3 s, but nothing has measured that
      yet, so treat it as a hypothesis. The off-track arithmetic in the rationale
      is right: the limit is max(0.06, 0.0125 + 0.03) = 0.06 m. Once this race reports,
      use the telemetry as follows. If steering_oscillation is high, or max_error
      is large on the slalom, lower kp (try 2.0) and raise kd (try 0.1 to 0.2). If
      completion is 0 with progress below about 0.9 and completion_time is near 3
      s, raise base_speed (try 1.8 to 2.0) and only then consider kp. If line_loss_events
      is above 0 on any track, add a sixth sensor at x = ±0.03 and widen the span,
      or switch line_loss to search_left or search_right depending on which side the
      line is lost. If rms_error is high but oscillation is low, raise kp slightly
      (3.5 to 4.0) before changing speed. Change one group of fields per revision
      so the effect stays readable.


      ### Requested changes


      - After the race, if steering_oscillation is high or max_error is large, set
      controller.kp to 2.0 and controller.kd to 0.15, keeping sensor_weights unchanged
      (the baseline race result should show which).

      - If completion is 0 with progress below 0.9 and completion_time is near 3 s,
      set controller.base_speed to 1.9 while keeping kp and kd from the baseline.

      - If line_loss_events is above 0, add a sensor at x = ±0.03, y = 0.03 with a
      matching weight of ±0.75 to widen the span, and test line_loss = last_direction
      against search_left.


      - [Open this output](iteration-0/entityR1/versions/3710d51171bc490dbc9376fa533a91b4/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/8ccea55316524ef2b1e454d55d505c76/payload.json)'
