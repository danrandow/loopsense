map:
  id: race-136-opt-eval
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: kd 0.2 damping test
    notes: 'Keeps the best raced geometry and ki 0.5 (ki gave no gain or loss in iteration
      4), and raises kd from 0.1 to 0.2 to test whether the oval steering oscillation
      of 0.113 falls below 0.09, as the Evaluator''s rule requires. The race should
      show whether max_error stays pinned near 0.06.


      ### Rationale


      Evidence from iteration 4 (ki 0.3 to 0.5, everything else as iteration 3): the
      score moved from 40.6925 to 40.6926, so the integral change had no measurable
      effect. line_loss_events stayed 0 on all tracks, and max_error stayed at 0.0609
      to 0.0629 m, still at or above the 0.06 m off-track limit. Progress was unchanged
      (s-bend 0.0406, slalom 0.035), and progress did not fall, so ki 0.5 is not overcorrecting
      and I keep it. The failure is therefore not fixed by the integral term. The
      oval steering_oscillation is still 0.1133, which the Evaluator''s rule (c) flags
      as above about 0.09. Iteration 3 showed kp 3.0 to 2.5 barely changed that oscillation
      (0.112 to 0.113), so the oscillation is not a proportional-gain problem. The
      rule''s next step is to raise kd from 0.1 to 0.2, with kp and ki unchanged.
      This is the single group changed in this iteration. Geometry is held at the
      best raced design (sensors at x = +/-0.06 and 0, weights +/-1.5 and +/-0.75,
      y = 0.03 m, base_speed 1.4, line_loss last_direction). Expected result, not
      measured: oval steering_oscillation falls below about 0.09 and s-bend and slalom
      max_error stays near 0.06 or improves slightly. Derivative action should damp
      the outer-sensor jitter. Hypotheses for the next race: (1) if oval oscillation
      falls and max_error still reaches 0.06, the remaining error is a steady bias
      that kp, ki and kd cannot remove, so the next test should be base_speed (lower
      to about 1.2 to reduce slip and outward drift at speed) rather than more gain;
      (2) if kd 0.2 raises s-bend or slalom oscillation, return kd to 0.1. Measurements
      requested: all metrics plus noise_robustness, to check whether the max_error
      pinning at about 0.061 is sensor noise or a fixed bias.


      - [Open this output](iteration-5/entity0/versions/39b3cc01649344758c285466b18dc0cb/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-d1d38b232a1b8056/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-97f7c3bb68bf493b/payload.json)'
  - id: entityR1
    label: Approve kd 0.2 test
    notes: 'Approved the single-group change kd 0.1 to 0.2 because the oval steering
      oscillation (0.113 in iteration 4) is the one symptom no gain change has moved,
      and the race is needed to test it. Feedback sets the next steps depending on
      the result: base_speed 1.2 if oscillation falls, or kd back to 0.1 if the s-bend
      or slalom worsens.


      ### Feedback


      Pre-race review. Nothing has raced for this candidate, so this states no outcome
      for it. The candidate is valid: five sensors match five weights, x-positions
      are within ±0.08 m, and kd 0.2 is inside its 0 to 10 range. It changes one group
      from the best raced design (iteration 4, score 40.6926): controller.kd from
      0.1 to 0.2, with geometry, kp 2.5, ki 0.5, base_speed 1.4 and line_loss last_direction
      unchanged. Iteration 3 showed kp 3.0 to 2.5 barely moved the oval steering_oscillation
      (0.112 to 0.113), and iteration 4 showed ki 0.3 to 0.5 had no measurable effect
      (40.6925 to 40.6926). Every run on every track still ends off_track with max_error
      at 0.0609 to 0.0629 m, and line_loss_events is 0. That leaves the oval oscillation
      (0.113) as the one clearly unexplained symptom, so testing kd is the next step
      the evidence supports. The gain is small and the cost of this race is one action
      run, so approve it and let the telemetry decide. Watch one risk: with 1.5 outer
      weights, the derivative acts on fast signal changes, so kd 0.2 may amplify sensor
      noise. Check noise_robustness and steering_oscillation together on the next
      race. After the race, use the telemetry as follows. (a) If oval steering_oscillation
      falls below about 0.09 and max_error on the s-bend and slalom stays near 0.06
      or improves, the oscillation is fixed but the error is a steady bias. Next,
      lower base_speed to about 1.2 to reduce slip and outward drift at speed, keeping
      gains fixed. (b) If kd 0.2 raises s-bend or slalom oscillation above about 0.08,
      or lowers progress, return kd to 0.1. (c) If max_error is still at or above
      0.0629 and noise_robustness is low, the error may come from sensor noise rather
      than gain, so test a wider sensor set before more gain changes. Change one group
      of fields per revision.


      ### Requested changes


      - After the race, if oval steering_oscillation falls below about 0.09 and max_error
      stays near 0.06 on the s-bend and slalom (steady bias, iteration 4 showed ki
      and kp did not move it), set controller.base_speed to about 1.2 with kp 2.5,
      ki 0.5 and kd 0.2 unchanged.

      - If the race shows s-bend or slalom steering_oscillation above about 0.08 (iteration
      4 measured 0.0665 and 0.0633) or progress falling below iteration 4''s 0.0406
      and 0.035, set controller.kd back to 0.1 and keep kp 2.5 and ki 0.5.

      - If max_error stays at or above 0.0629 on every track with noise_robustness
      low, test a sixth sensor at x = 0.09 is out of range, so instead widen the outer
      sensors to x = ±0.07 (within the ±0.08 limit) with the outer weights kept at
      ±1.5, citing iteration 2''s line-loss-free result at ±0.06.


      - [Open this output](iteration-5/entityR1/versions/a394ac836d184f85bc6c5cc8e453c9f4/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/39b3cc01649344758c285466b18dc0cb/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-97f7c3bb68bf493b/payload.json)'
