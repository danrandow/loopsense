map:
  id: race-217-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Smaller sensor footprint
    notes: 'Keeps the best-scoring forward sensor row (y 0.08, span ±0.03) and changes
      sensor_size 0.016 to 0.012 and kd 1.0 to 1.5 to test sharper line reading and
      oscillation damping. Evidence: best score 58.17 at iteration 7/8, and the wider
      ±0.06 span scored worse (55.13).


      ### Rationale


      Evidence: across 10 races, every trial ended off_track, with zero completions.
      Progress has never exceeded about 0.17, max_error sits at 0.060 to 0.067 (just
      past the 0.06 m limit), and every run logs 1 to 2 line-loss events with steering_oscillation
      of 0.14 to 0.18. Body width cannot widen the limit, so the failure is in steering
      and sensing.


      What the history shows: moving the sensor row forward (y 0.04 to 0.06 to 0.08,
      with sensor_size 0.016, wheel_track 0.14, kp 3.0) was the only change that moved
      the score materially (about 40 to 58). Iterations 7 and 8 scored identically
      (58.1734) even though kd, wheel_track and base_speed changed, so those gains
      are not what limits the result. Iteration 9 widened the sensor span to plus
      or minus 0.06 m at 0.02 m spacing and scored worse (55.13, slalom 44.2 to 37.7).
      The narrower plus or minus 0.03 m span is therefore the better layout. Iteration
      2 (kp 2.5, wider spacing) was also worse, so I do not lower kp further.


      Change, relative to the best-scoring design (iteration 7/8): (1) Restore the
      plus or minus 0.03 m span at 0.01 m spacing, with the sensors at y = 0.08 m.
      This was the best-scoring sensor layout, and iteration 9 showed the wider span
      hurts. (2) sensor_size 0.016 to 0.012. The 0.016 footprints overlap heavily
      at 0.01 m spacing, which blurs the signal and may keep line-loss and drift readings
      ambiguous at the edges. I expect a sharper, more local reading. This is the
      only sensor change, so its effect is attributable. (3) kd 1.0 to 1.5, to damp
      the steering oscillation of about 0.17, which is the most consistent symptom.
      (4) kp 3.0, ki 0.0, base_speed 1.5, wheel_track 0.14, mass 0.6, wheel_radius
      0.03 and line_loss ''last_direction'' are unchanged, so the controller baseline
      stays fixed.


      Expected result: a modest gain over 58.17, with fewer line-loss events and a
      longer run on the line, and progress above about 0.2. Completion is still unlikely.
      The main risk is that the smaller footprint gives noisier signal on the outer
      sensors and that kd 1.5 adds derivative noise, which would show as higher steering_oscillation.
      If the score drops, the sensor footprint is the wrong lever and the next step
      is to return to 0.016 and test base_speed.


      - [Open this output](iteration-10/entity0/versions/683c9ccd6b574353b3c32a0c62383233/payload.json)

      - Based on: [entityR2A](iteration-10/entityR2A/versions/carried-5e127d19ab73539f/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critique focuses on two unsupported changes: sensor_size 0.016 to 0.012
      (still overlaps at 0.01 m spacing and may raise line-loss) and kd 1.0 to 1.5
      (iterations 7 and 8 showed kd had no measurable effect). It also flags the confounded
      attribution and the missing falsifiable thresholds.


      - [Open this output](iteration-10/entityC1/versions/433675c8623546f6a4b26835e16491d5/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/683c9ccd6b574353b3c32a0c62383233/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-5e127d19ab73539f/payload.json)'
  - id: entity1
    label: Revert to best raced
    notes: 'Returns to the raced iteration 7 design (score 58.17) with no unsupported
      changes, since the critique showed my draft was confounded and kd 1.5 amplifies
      noise. Iteration 8 showed speed changes had no effect, so this is the best-evidenced
      fallback.


      ### Rationale


      What the critique got right: my draft (wheel_track 0.16, kd 1.5, base_speed
      1.4, sensor_size 0.016, mass 0.6) was never raced, and its stated baseline was
      wrong. Its changes were confounded, and kd 1.5 amplifies sensor noise by 100*kd
      per unit of signal change per step. I reject the draft.


      What I kept: the critique''s main demand that the next race be attributable
      to a known baseline. I return to the best raced design, iteration 7 (score 58.1734;
      oval 63.49, s-bend 66.85, slalom 44.19; no completions). Its values are exactly
      those raced: sensors at y 0.08 with x from -0.03 to +0.03 at 0.01 m spacing,
      sensor_size 0.012, wheel_track 0.12, mass 0.8, kp 4.5, ki 0, kd 0.1, base_speed
      1.5, linear weights, line_loss ''last_direction''.


      Why no change: iteration 8 changed only base_speed (1.5 to 1.3) and scored 58.1734,
      identical to iteration 7 to four decimals. Speed therefore has no measurable
      effect in this regime. Iterations 0 and 1, and 7 and 8, show the same pattern,
      which the critique reads as a failure set by something the controller barely
      touches (such as the seeded motor mismatch or start transient). No raced change
      has moved the oval, where progress stays near 0.16 and line_loss_events stay
      at 2. I have no evidence that any single further change will help, and the critique''s
      proposed alternatives (wider span at 0.015 spacing, kp compensation) are untested.
      I therefore keep the raced design rather than add an unsupported variable.


      Expected result: the score should reproduce about 58.17. Completion is unlikely.
      This race establishes a known-good fallback for the final stage, and it gives
      a clean baseline for the Evaluator to test.


      Falsifiable criteria: oval max_error below 0.06 and line_loss_events of at most
      1; progress above 0.2 on all tracks; any change in score beyond 0.01 from 58.17
      would indicate run-to-run variation rather than a design effect.


      - [Open this output](iteration-9/entity1/versions/07e2c635baae46429e9abf5d500ae623/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/ca39d6b9f5664b8eaa7b5271ebbf0b92/payload.json),
      [entityC1](iteration-9/entityC1/versions/905abcd16c884d02bec9712bbd7e871e/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-8d62ec433a521438/payload.json)'
  - id: entityC2
    label: Round-2 critique
    notes: 'Critiques the return to the raced iteration 7 design. Key points: the
      race repeats a known 58.17 result, the speed-invariant scores point to a fixed
      early exit that is untested, and the falsifiable targets are not tied to any
      predicted change. Evidence: the iteration 7 and 8 outcome table.


      - [Open this output](iteration-9/entityC2/versions/645722d6f3404939ae8638967a4ee1e5/payload.json)

      - Based on: [entity1](iteration-9/entity1/versions/07e2c635baae46429e9abf5d500ae623/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-8d62ec433a521438/payload.json)'
  - id: entity2
    label: Sensor size 0.008 test
    notes: 'Keeps the best raced design (iteration 7, score 58.17) and changes only
      sensor_size from 0.012 to 0.008 to sharpen the line-edge reading. Falls back
      to iteration 7 if the score drops below about 58.0; evidence is the flat speed
      result and the repeated off_track at max_error of about 0.065.


      ### Rationale


      Evidence: iteration 7 (score 58.1734) is the best raced design. Iteration 8
      repeated it with base_speed 1.3 and matched it to four decimals, so speed is
      not the limiting factor. Across the raced designs, moving sensors forward (y
      0.06 to 0.08) gave a small gain (+0.38), and moving from a 0.06 to 0.03 span
      at 0.01 spacing with kd 0.1 gave a large gain on s-bend. Every run still ends
      off_track at progress 0.11 to 0.16 with max_error about 0.065, just over the
      0.06 limit.


      Change: I keep the iteration 7 design and change one variable, sensor_size from
      0.012 to 0.008. At 0.01 m spacing, 0.012 m footprints overlap heavily, which
      blurs the line-edge signal. A 0.008 m footprint should sharpen the reading,
      and the change keeps the sensor span and forward position that have already
      helped. Controller values (kp 4.5, ki 0, kd 0.1, base_speed 1.5, linear weights,
      last_direction) stay the same so the result is attributable to sensor_size.


      The rejected alternatives are: a wider span (untested and not supported by evidence),
      kp or kd changes (kp 4 and kd 0.05 were worse in iteration 2), and body_width
      changes (the off-track limit is max(0.06, 0.0125 + body_width/4), which stays
      at 0.06 for any body_width up to about 0.18, so body_width cannot rescue the
      run).


      Expected result: max_error should fall slightly, line_loss_events should stay
      at 1 to 2, and progress may rise modestly. If the score drops below about 58.0,
      the sensor_size 0.012 design (iteration 7) is the fallback. Falsifiable: a smaller
      footprint that does not change oval max_error or line-loss counts would show
      that sensor blur is not the failure mode.


      - [Open this output](iteration-9/entity2/versions/3ec8bec42b86405a9c367a4e7f2573ea/payload.json)

      - Based on: [entity1](iteration-9/entity1/versions/07e2c635baae46429e9abf5d500ae623/payload.json),
