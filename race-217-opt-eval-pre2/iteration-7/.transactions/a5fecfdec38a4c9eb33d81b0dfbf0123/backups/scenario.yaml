map:
  id: race-217-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Sensors forward to y=0.08
    notes: 'Draft extends iteration 6 (best, 57.80) by moving the sensor row from
      y=0.06 to the forward limit y=0.08, with all other values unchanged. The lookahead
      change is the only variable moved, and it is the most likely driver of the earlier
      gain.


      ### Rationale


      Evidence: all 60 development trials in every iteration ended off_track, with
      zero completions. Progress has stayed between 0.04 and 0.17, and max_error sits
      at 0.060 to 0.067, just past the 0.06 m limit. The body_width bound cannot help:
      with body_width 0.18 the limit is max(0.06, 0.0125 + 0.045) = 0.06 m. The best
      run so far (iteration 6, score 57.80) changed four things at once: sensors moved
      forward to y = 0.06, sensor_size rose to 0.016, wheel_track rose to 0.14, and
      kp fell to 3.0. Its gain was the largest of any iteration, and the only one
      that moved the score much. Earlier iterations with forward sensors at y = 0.04
      and similar gains scored about 40, so forward lookahead looks like the most
      likely cause of the improvement.


      Change: I keep iteration 6''s design and move the sensor row to the forward
      limit, y = 0.08 m (from 0.06). This extends the lookahead that appears to have
      helped and reduces phase lag at the bends. Sensor x positions (-0.03 to +0.03
      m at 0.01 m spacing), sensor_size 0.016, weights (linear ramp -1 to +1), kp
      3.0, ki 0.0, kd 1.0, base_speed 1.5, wheel_track 0.14, mass 0.6 and line_loss
      ''last_direction'' are all unchanged. That keeps the change attributable to
      one variable.


      Expected result: a further modest gain over 57.80, through fewer line-loss events
      and a longer run on the line. Completion is still uncertain, and the main risk
      is that the extra lookahead makes the robot react to tape it has not yet reached
      on sharp bends. If progress and line-loss counts improve but the runs still
      leave the track, the next step is to raise kd or reduce base_speed.


      - [Open this output](iteration-7/entity0/versions/c4d34b032aee4634a4c10275b4e36eba/payload.json)

      - Based on: [entityR2A](iteration-7/entityR2A/versions/carried-76af15d55730ac74/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critique of the y=0.08 forward-sensor draft. It notes that iteration 6''s
      gain is confounded across six variables, that the oval did not improve, and
      that the rationale lacks falsifiable thresholds. Evidence is the per-track race
      data for iterations 5 and 6.


      - [Open this output](iteration-7/entityC1/versions/d168508a4bfc45deb39d300666688f6e/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/c4d34b032aee4634a4c10275b4e36eba/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-76af15d55730ac74/payload.json)'
  - id: entity1
    label: Reverted to raced 57.80
    notes: 'Reverts to the exact raced iteration 6 design (57.80), correcting the
      draft''s wrong baseline, and changes only sensor y from 0.06 to 0.08. Targets
      and a reversal rule are stated because the critique showed the draft''s attribution
      was confounded.


      ### Rationale


      What the evidence shows: the raced iteration 6 design scored 57.80 (oval 64.37,
      s-bend 64.84, slalom 44.18, no completions). Its actual settings were sensor
      y 0.06, sensor_size 0.012, wheel_track 0.12, mass 0.8, kp 4.5, kd 0.1, base_speed
      1.5, linear weights. My draft attributed the gain to a different set of values
      (sensor_size 0.016, wheel_track 0.14, kp 3.0, kd 1.0, mass 0.6). Those were
      never raced, so the draft''s stated baseline was wrong, and the critique is
      right that the attribution was confounded.


      What I accepted: the critique''s point that the draft changed several variables
      at once, and that the next race must be attributable. I have reverted to the
      exact raced iteration 6 design so the score change is measured against a known
      57.80 baseline. I also accepted the point that the oval has not improved and
      is still at 2 line-loss events.


      What I rejected: I did not keep the draft''s kp 3.0, kd 1.0, track 0.14, mass
      0.6 or sensor_size 0.016. Those were unraced, and kd 1.0 amplifies sensor noise
      through the 100*kd per unit signal change term.


      What I changed: one variable only. Sensor row moves from y 0.06 to y 0.08 (forward
      limit). Expected effect is small: about 2 cm more lookahead, roughly 13 ms at
      1.5 m/s. Risk: a 12 mm footprint at y 0.08 reads tape up to about 0.088 m ahead,
      which could pull the signal early on sharp bends.


      Falsifiable targets for the next race, relative to 57.80: s-bend and slalom
      line_loss_events at or below 1; oval line_loss_events below 2 and max_error
      below 0.06; slalom progress above 0.15; steering_oscillation not above 0.16.
      Reversal rule: if the score falls or any track''s max_error rises above the
      raced value, return to y 0.06. If the score rises but runs still leave the track,
      the next single change is kd (to 0.3, not higher) or base_speed down to 1.3,
      chosen by which of line_loss or steering_oscillation worsens.


      - [Open this output](iteration-7/entity1/versions/af1689fb189e4933bacd90be2023e32c/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/c4d34b032aee4634a4c10275b4e36eba/payload.json),
      [entityC1](iteration-7/entityC1/versions/d168508a4bfc45deb39d300666688f6e/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-76af15d55730ac74/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Critiques the reverted y 0.08 single-variable change. Evidence: raced
      iteration 6 shows early drift (progress 0.07 to 0.16, max_error 0.061 to 0.067),
      so lookahead is unlikely to be the main fix; several falsifiable targets are
      already met by the baseline.


      - [Open this output](iteration-7/entityC2/versions/d41e902925044ec3b1e8121c40a991a9/payload.json)

      - Based on: [entity1](iteration-7/entity1/versions/af1689fb189e4933bacd90be2023e32c/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-76af15d55730ac74/payload.json)'
  - id: entity2
    label: 7-sensor final design
    notes: 'Final design keeps the 7-sensor 0.010 m array, kp 4.5, kd 0.1 and base_speed
      1.5, and corrects the footprint and speed claims from the critique. It rests
      on the flat 39.85 baseline, where every raced design shows the same early line
      loss, so the race tests whether denser sampling changes that.


      ### Rationale


      Evidence: all 60 development trials ended off track with zero completions. Scores
      were flat at about 39.85 for iterations 0, 1 and 5, which differed in kp, ki
      and base_speed. Iteration 2 (kp 4.0, wider spacing, larger kd and ki) scored
      26.37, so under-steering hurt. Every raced design shows the same early pattern:
      exactly 2 line-loss events (1 for iteration 2), max_error 0.061 to 0.067, and
      progress 0.04 to 0.17. The failure is therefore early and set by something no
      raced gain or speed has changed.


      Critique handling. (1) Attribution: I accept that this revision changes several
      variables at once. I keep it anyway because the 5-sensor, kp 5, kd 0.02 family
      has already produced a flat score, so single-change tests inside that family
      are unlikely to move the result. The falsifiable targets below are the attribution
      mechanism for this race. (2) Footprint: I accept the correction. A 0.012 m sensor
      at x = 0.03 m reads tape only when the robot is displaced by about 0.017 m or
      more. The 0.010 m spacing does give overlapping footprints, so the sampling
      is denser, but I no longer claim the outer sensors cover the tape when centred.
      (3) Units: I accept that base_speed is a dimensionless demand. The 1.5 figure
      is only a rough target, and completion is a risk, not an expectation. (4) Saturation:
      I accept that the 7-sensor weights of plus or minus 1 rarely reach the saturation
      signal of about 0.65, so saturation is not a practical limit here. (5) Motor
      mismatch: I note the offset is about mismatch/kp. It is small at kp 4.5 and
      I do not change it in this race. (6) I reject reverting to the 5-sensor layout
      now. Its score is already known to be flat, and a revert would spend an iteration
      without new information.


      Changes from the raced baseline: 7 sensors at 0.010 m spacing (x from -0.03
      to 0.03), sensor_size 0.012, kp 4.5, kd 0.1, base_speed 1.5. ki stays 0, line_loss
      stays last_direction, and wheel_track 0.12 and mass 0.8 are unchanged.


      Expectation: I predict a score near or modestly above 40, with progress above
      0.3 if the start transient is less severe with denser sampling. I do not expect
      completion.


      Falsifiable targets: max_error below 0.06 on the oval and s-bend; line_loss_events
      at or below 1; steering_oscillation below 0.16; progress above 0.5 on all tracks.
      If max_error stays at 0.06 or above and progress is unchanged, the cause is
      not controller gain or sensor layout, and the next iteration should look for
      an early divergence (start heading or mismatch) rather than tuning. If steering_oscillation
      exceeds 0.18, kd or kp is too high. If completion_time is above 3 s with no
      line losses, base_speed must rise.


      - [Open this output](iteration-6/entity2/versions/f151e0e03a9b45179996c436a1cb6dab/payload.json)

      - Based on: [entity1](iteration-6/entity1/versions/311debb8612c4bd3a80e2bc62e5d5caf/payload.json),
