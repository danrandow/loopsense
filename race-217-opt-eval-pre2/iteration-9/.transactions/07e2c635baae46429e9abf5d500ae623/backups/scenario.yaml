map:
  id: race-217-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Wider sensor span test
    notes: 'Widens the sensor row to ±0.06 m, keeping iteration 7''s controller and
      sensor position so the span is the only change. Based on the identical scores
      in iterations 7 and 8, which show that gains, track and speed had no effect,
      while the sensor row moved the score.


      ### Rationale


      Evidence: 60 trials per design across eight iterations, and every run ended
      off_track with zero completions. Progress stayed between 0.04 and 0.17, and
      max_error sat at 0.060 to 0.067, just over the 0.06 m limit. The body_width
      bound cannot widen that limit (it is max(0.06, 0.0125 + body_width/4), which
      is 0.06 m at the largest body width).


      The telemetry points to the sensor array rather than the gains. Iterations 7
      and 8 gave identical scores (58.1734) and identical per-track metrics, even
      though kd (1.0 to 1.5), wheel_track (0.14 to 0.16) and base_speed (1.5 to 1.4)
      all changed. Iterations 0 and 1 also matched to four decimals despite different
      kp, kd and sensor size. Only the sensor row position (y 0.04 to 0.06 to 0.08)
      moved the score materially, and it gave a gain of about 18 points. Lookahead
      is now at its geometric limit (y = 0.08), so it cannot be pushed further.


      Change: widen the sensor span from x = ±0.03 m to ±0.06 m, using 7 sensors at
      0.02 m spacing (x = -0.06, -0.04, -0.02, 0, 0.02, 0.04, 0.06) at y = 0.08 m.
      The aim is to keep tape under a sensor when the robot drifts beyond the current
      ±0.03 m reach, which is where the off-track excursions appear. Weights stay
      as a linear ramp from -1 to +1 so the signal sign and scale are unchanged. Everything
      else is held at iteration 7''s values (kp 3.0, ki 0, kd 1.0, base_speed 1.5,
      wheel_track 0.14, mass 0.6, sensor_size 0.016, line_loss ''last_direction'')
      so that the sensor-span change is the only variable.


      Risk: iteration 2 widened the span and scored worse, but it also changed kp
      and y, so the comparison is confounded. If this design scores below 58.17, the
      sensor span is the wrong lever and the next step is a different sensor size
      or a line-loss strategy change. Expected result: a modest change in progress
      and line-loss events. Completion is still unlikely.


      - [Open this output](iteration-9/entity0/versions/ca39d6b9f5664b8eaa7b5271ebbf0b92/payload.json)

      - Based on: [entityR2A](iteration-9/entityR2A/versions/carried-8d62ec433a521438/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critique of the wider-span sensor draft. Main points: the signal slope
      halves at 0.02 m spacing, the 18-point attribution to sensor row is wrong (iteration
      6 changed four variables, and the isolated y step gave 0.38), and identical
      scores across kd and track changes suggest a failure the controller barely affects.


      - [Open this output](iteration-9/entityC1/versions/905abcd16c884d02bec9712bbd7e871e/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/ca39d6b9f5664b8eaa7b5271ebbf0b92/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-8d62ec433a521438/payload.json)'
  - id: entity1
    label: Speed 1.3 on raced 58.17
    notes: 'Reverts to the raced iteration-7 design (58.17) and changes only base_speed
      from 1.5 to 1.3, rejecting the unraced kd 1.5 and reduced steering-gain draft.
      The single change is tested against line-loss and progress targets, with a reversal
      rule if the score falls.


      ### Rationale


      Evidence: the best raced design is iteration 7 (score 58.17; oval 63.49, s-bend
      66.85, slalom 44.19; no completions). Its telemetry shows 2 line-loss events
      per run on the oval, 1 on the s-bend and slalom, and steering_oscillation of
      0.149 to 0.169. Progress is 0.11 to 0.16. Every run still ends off_track.


      What I accepted from the round-1 critique: (1) My draft''s stated baseline was
      wrong. It attributed the gain to values that were never raced (wheel_track 0.14,
      kp 3.0, kd 1.0, mass 0.6, sensor_size 0.016). I reject that draft. (2) kd 1.5
      is not supported. The loop gives kd x 100 turn units per unit of signal change
      per step, so kd 1.5 amplifies sensor noise. Earlier kd changes did not show
      damping, and the oscillation tracked kp and sensor geometry instead. I drop
      kd 1.5 and keep kd 0.1. (3) Reducing the steering gain (wheel_track 0.16 with
      kp 3.0) is unquantified and is the same direction as the iteration 2 under-steering
      failure. I drop it. (4) The draft changed several variables at once, so the
      next race could not be attributed. I return to the raced 58.17 design.


      What I rejected from the critique: I did not treat the oval as unexplainable.
      The oval is an open question, and I do not claim to fix it here.


      What I changed: one variable only, base_speed 1.5 to 1.3. Progress, not completion,
      is the only reachable score term. Completion has not occurred on any track,
      and the 1.5 m/s finish requirement is unmeasured. Lowering speed reduces the
      drive demand and gives the loop more time per bend, which may cut the 1 to 2
      line-loss events. The cost is a possible loss of progress if the robot stalls,
      and the completion-time term is already zero.


      Falsifiable targets relative to 58.17: line_loss_events at or below 1 on every
      track; oval max_error below 0.06; steering_oscillation not above 0.16; progress
      at or above 0.16 on all tracks.


      Reversal rule: if the score falls below 58.17, or any track''s progress falls,
      return base_speed to 1.5. If line-loss counts stay at 2 on the oval with progress
      unchanged, speed is not the cause, and the next single change should target
      the oval start transient rather than gains.


      - [Open this output](iteration-8/entity1/versions/d717e6e4a9bc4d9babe917c054341900/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/5700d7e59d614056950a664de63cfd0c/payload.json),
      [entityC1](iteration-8/entityC1/versions/a7cdcf808bc7413e96073590c2604f57/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-8d62ec433a521438/payload.json)'
  - id: entityC2
    label: Round-2 critique
    notes: 'Critiques the base_speed 1.3 revision: the change is attributable, but
      the drop is unlikely to fix early exits, progress targets conflict with baseline
      values, and fallback steps lack measurements. Evidence is the 58.17 raced telemetry
      for all three tracks.


      - [Open this output](iteration-8/entityC2/versions/5586dba47e2b41f2b50ce9a5d9e820a5/payload.json)

      - Based on: [entity1](iteration-8/entity1/versions/d717e6e4a9bc4d9babe917c054341900/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-8d62ec433a521438/payload.json)'
  - id: entity2
    label: Raced 58.17 design
    notes: 'Resubmits the raced iteration 7 design unchanged (base_speed 1.5, sensor
      row y 0.08), rejecting the round-2 speed cut to 1.3. Progress is the only live
      score term and the speed change has no measured benefit, so the 58.17 baseline
      is the safest candidate.


      ### Rationale


      Evidence: the best raced design is iteration 7 (score 58.17; oval 63.49, s-bend
      66.85, slalom 44.19; no completions). Every run ended off_track, with progress
      0.11 to 0.16. Iteration 6 (sensor row y 0.06) scored 57.80, so the y 0.08 change
      added 0.38. That gain is small, but it is the best measured result.


      Critique handling. I reject the round-2 revision''s base_speed 1.3. The critique''s
      arithmetic holds: the score is progress times the line-loss and rms factors,
      so any progress lost to slower driving is lost directly. Lower speed also has
      no measured link to fewer line-loss events, and the revision''s own reversal
      rule anticipates a score drop. Its speed mechanism is also unconfirmed: no measured
      link exists between base_speed and the early exit. I accept the critique''s
      points that the targets are partly unachievable at baseline (slalom progress
      0.1075 against a 0.16 target; oval steering_oscillation already above 0.16)
      and that the exit is early and unexplained. I do not add a second change this
      iteration, because I have no single change with a credible mechanism and a non-negative
      expected score.


      What I kept: the exact raced iteration 7 design, which the round-2 revision
      also used as its baseline. What I changed: nothing relative to that baseline.
      I restore base_speed 1.5, which reverses the round-2 revision''s speed change.


      Expected result: about 58.17 again, since the seeds are fixed. A result above
      58.17 would support keeping y 0.08. A result below it would point to the speed
      or sensor change being harmful, and I would then revert y to 0.06. The open
      risk is the early oval and slalom start transient, which only per-step telemetry
      can locate.


      - [Open this output](iteration-8/entity2/versions/9e390eab41914632ab0ce36c89dcbb09/payload.json)

      - Based on: [entity1](iteration-8/entity1/versions/d717e6e4a9bc4d9babe917c054341900/payload.json),
