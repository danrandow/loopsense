map:
  id: race-217-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: kp 3.5 on best layout
    notes: 'Starts from the best-scoring design (iteration 10, 58.85) and raises kp
      from 3.0 to 3.5 with kd held at 1.5, to add steering authority at the bends.
      All 60 trials in the record ended off-track, and progress has never exceeded
      about 0.17, so the expected gain is small.


      ### Rationale


      Evidence: all 60 development trials in every iteration ended off_track, with
      no completions. Progress has never exceeded about 0.17, and max_error sits at
      0.060 to 0.067, just past the 0.06 m limit. Body width cannot widen that limit,
      so the limiting factor is steering and sensing.


      What the history shows: the sensor row moved forward (y 0.04, then 0.06, then
      0.08) with sensor_size 0.016, wheel_track 0.14 and kp 3.0 was the only change
      that moved the score materially (about 40 to 58). Iterations 7 and 8 scored
      identically (58.1734) despite changes to kd, wheel_track and base_speed. Iteration
      9 widened the span to plus or minus 0.06 m and scored worse (55.13), so the
      plus or minus 0.03 m span is the better layout. Iteration 10 (sensor_size 0.012,
      kd 1.5, kp 3.0) is the best design so far at 58.8527, with the best oval and
      slalom progress.


      Change, relative to iteration 10: (1) kp 3.0 to 3.5. Oscillation is about 0.17
      and the robot drifts past 0.06 m at the sharper bends, so I add a little steering
      authority. kd stays at 1.5 to damp the extra gain. (2) Everything else is held
      fixed, including sensor layout, sensor_size 0.012, base_speed 1.5, wheel_track
      0.14, mass 0.6, ki 0.0 and line_loss ''last_direction''. This keeps the change
      attributable to one controller variable.


      Expected result: a small gain over 58.85, with progress above about 0.18 and
      max_error slightly lower. Completion is still unlikely. The main risk is that
      kp 3.5 adds overshoot, which would show as higher steering_oscillation and an
      earlier off-track exit. If that happens, the fallback is the iteration 10 design.


      - [Open this output](iteration-11/entity0/versions/2a79ac8095a44cbd96a891356b9bed45/payload.json)

      - Based on: [entityR2A](iteration-11/entityR2A/versions/carried-5dff049e6df67016/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critiques the kp 3.5 draft: kp was never isolated at the current sensor
      layout, the proposed drift mechanism is unsupported, and ki and motor mismatch
      are ignored. Evidence is the 10-iteration outcome table, including identical
      scores at kp 4 and kp 5 and identical scores for kd 1.0 and 1.5.


      - [Open this output](iteration-11/entityC1/versions/b40db5c8c7304ca1aff765b5b3d0b762/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/2a79ac8095a44cbd96a891356b9bed45/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-5dff049e6df67016/payload.json)'
  - id: entity1
    label: Revert to iter-10 design
    notes: 'Rejects the kp 3.5 change and the draft''s values, which did not match
      the raced record. Resubmits the iteration 10 design (kp 4.5, kd 0.1, sensor_size
      0.016, wheel_track 0.12), the best measured score at 58.85. Rests on the outcome
      table, not the draft''s unverified baseline.


      ### Rationale


      Decision: resubmit the iteration 10 design unchanged. I reject the round-1 critique''s
      suggested kp 3.5 change and the draft''s kp/kd/sensor values.


      Why the draft is withdrawn: my draft cited a design (kp 3.0, kd 1.5, sensor_size
      0.012, wheel_track 0.14, mass 0.6) that does not match the raced record. The
      outcome table shows iteration 10 as kp 4.5, kd 0.1, sensor_size 0.016, wheel_track
      0.12, mass 0.8, base_speed 1.5, and that is the design that scored 58.8527.
      The draft''s expected gains were therefore built on a misread baseline, and
      I cannot trust its attribution.


      Why kp 3.5 is rejected: kp has not been isolated at the y = 0.08 sensor row.
      The only kp sweeps were at y = 0.04 or 0.06, where the score was flat. Iterations
      7 and 8 show kd has no measurable effect in this range. Oscillation rises with
      kp, so the ''drift needs more authority'' argument conflicts with the jitter
      metric. The critique is right that an untested change on the final iteration
      adds risk for the unseen track. The oval has the worst max_error, and there
      is no per-bend telemetry to support the sharp-bend claim.


      What I kept: the sensor layout (y = 0.08, x from -0.03 to 0.03, weights -1 to
      1), sensor_size 0.016, kp 4.5, kd 0.1, ki 0, base_speed 1.5 and line_loss ''last_direction'',
      all as raced. This is the best measured design on the development tracks, and
      it is the only one with a confirmed result.


      Risks I accept: the held-back track may differ in shape, and ki 0 leaves a steady
      offset from the seeded motor mismatch uncorrected. I did not add ki because
      it is unmeasured here and could destabilise the run. Completion is still unlikely
      at progress about 0.17, and speed is capped by the stall and track length.


      Expected result: about 58.85 on the development tracks, consistent with the
      raced record.


      - [Open this output](iteration-11/entity1/versions/417dd2aabea140d1983c9693ca1ba721/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/2a79ac8095a44cbd96a891356b9bed45/payload.json),
      [entityC1](iteration-11/entityC1/versions/b40db5c8c7304ca1aff765b5b3d0b762/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-5dff049e6df67016/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Critique of the unchanged iteration-10 resubmission. It flags that all
      trials end off-track rather than stalled, that base_speed has no effect, and
      that the kd evidence in the rationale is mis-cited (iterations 7 and 8 do not
      vary kd). It rests on the aggregated development results in the race data.


      - [Open this output](iteration-11/entityC2/versions/788036f2270849ba99af9fe833069b69/payload.json)

      - Based on: [entity1](iteration-11/entity1/versions/417dd2aabea140d1983c9693ca1ba721/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-5dff049e6df67016/payload.json)'
  - id: entity2
    label: Sensor footprint 0.016
    notes: 'Keeps the raced iteration 7 design and changes only sensor_size to 0.016,
      so the result is attributable to footprint. Drops the non-discriminating progress
      and line-loss targets, and keeps a reproducible reversal rule to the 0.012 fallback
      if score or any max_error worsens.


      ### Rationale


      Evidence: iteration 7 (sensor_size 0.012, raced 58.1734) is the best raced design.
      Iteration 9 showed that shrinking the footprint to 0.008 lowers the score to
      55.13, so smaller footprints are worse. Iterations 7 and 8 gave identical scores,
      so kd, wheel_track and base_speed have no measurable effect in this regime.


      What I accepted from the round-2 critique: the change is attributable only if
      one variable moves from the raced baseline, so I keep sensor_size as the only
      change. I also accept that the proposed mechanism is untested and that the two
      oval line-loss events have persisted across layout, gain, footprint and speed
      changes. That points to a fixed early cause, such as the seeded motor mismatch
      or the start transient, not to the footprint.


      What I rejected or changed: the critique says the line-loss and progress targets
      do not discriminate. I accept that and drop them as success criteria. I keep
      the reversal rule because it is clear and reproducible with fixed seeds. I do
      not change the controller or geometry to address the motor mismatch in this
      race, because that would confound the sensor test again. I will note it as the
      next candidate cause.


      What I changed: nothing relative to my revision. The design keeps sensor_size
      0.016 with the iteration 7 controller and geometry. I expect the score to move
      only slightly. If the larger footprint blurs the edge reading, s-bend and slalom
      max_error should rise. If it keeps more reading sum when the edge falls between
      sensors, oval line_loss_events should fall. I predict the score stays within
      about 1 point of 58.17 with no large change on any track.


      Reversal rule: if the score falls below 58.17, or any track''s max_error rises
      above its raced value (oval 0.0652, s-bend 0.0665, slalom 0.0624), the final
      stage uses sensor_size 0.012 with the iteration 7 design as the fallback.


      - [Open this output](iteration-10/entity2/versions/f4869560037144978601cce55566917d/payload.json)

      - Based on: [entity1](iteration-10/entity1/versions/1957afd88be84a7a80faed4e4ac2e9c9/payload.json),
      [entityC2](iteration-10/entityC2/versions/5e2dde4bf78b4747927d34d0b18b312b/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-5e127d19ab73539f/payload.json)'
