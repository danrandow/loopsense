  id: race-212-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 1
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 0.
dimensions:
  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor draft
    notes: 'First draft with no prior telemetry: five 12 mm sensors at 20 mm spacing,
      base_speed 1.3, kp 2.5, kd 0.3, ki 0, last_direction line-loss recovery. Chosen
      to meet the roughly 1.5 m/s pace needed to finish in 3 s while keeping steering
      damped. Expected to complete the development tracks with small rms error; overshoot
      on the slalom is the main risk.


      ### Rationale


      No race telemetry exists yet (iteration 0, first draft), so this is a reasoned
      baseline rather than a tuned design. Speed: the course is about 4 to 5 m and
      must be covered in under 3 s, so average speed needs to be about 1.5 m/s or
      more. base_speed 1.3 gives a PWM base of about 2550 (62% of full), which should
      reach that pace with margin for slowdowns in bends, while leaving room to brake.
      Sensing: five sensors spaced 20 mm apart (x = -0.04 to +0.04) at y = 0.04, ahead
      of the axle so the robot sees the line before it reaches the wheels. The 12
      mm footprint is smaller than the 25 mm tape, so the outer sensors read tape
      only when the line is near them, which gives a clear, roughly linear error signal.
      Weights -2, -1, 0, 1, 2 make the signal sign match the line side: a line to
      the left gives positive signal and steers left. Control: kp 2.5 gives a moderate
      turn gain (a full-scale signal of 2 yields about 1750 PWM of wheel differential).
      kd 0.3 damps the swing that a pure proportional law causes at speed. ki is 0
      because the course has no steady bias to remove and the integral term risks
      windup on bends. line_loss ''last_direction'' lets the robot recover toward
      the side it last saw the tape. Geometry: wheel_track 0.12 and wheel_radius 0.03
      are mid-range; body_width 0.12 keeps the off-track limit comfortable (about
      0.06 m or more); mass 0.8 kg with a 0.16 m body keeps yaw inertia moderate.
      Expected result: completion on the development tracks with a few line-loss events
      at most, small rms_error (around 0.02 to 0.04 m), and completion_time near 2.5
      s. The main risk is overshoot on the slalom and s-bend, which the next race
      will show.


      - [Open this output](iteration-0/entity0/versions/301e8e1214704070807cd0aa01e2b9a2/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Flags the narrow sensor span against the 0.06 m off-track limit, the ignored
      motor-mismatch bias behind ki=0, and the kd noise risk. Also corrects the PWM
      base (2662, not 2550) and the body_width claim; the evidence is the contract''s
      formulas.


      - [Open this output](iteration-0/entityC1/versions/6e5c20c8e1a84accb0269b4be05aa93d/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/301e8e1214704070807cd0aa01e2b9a2/payload.json)'
  - id: entity1
    label: 'Revised: wider sensors'
    notes: 'Widens the sensor span to ±0.06 m, adds a small ki of 0.1 for motor-mismatch
      bias, and corrects the PWM and body-width arithmetic from the critique. kp,
      kd and base_speed are kept, with the reasons given in the rationale. Expected
      numbers are untested guesses.


      ### Rationale


      Evidence: none yet. No race data exists, so every expected value below is a
      guess to be tested, not a prediction.


      Accepted from the round-1 critique:

      - Sensor span. The outer sensors at x = ±0.04 leave only about 1.5 mm between
      the tape edge leaving the outer sensor and the 0.06 m off-track limit. I widen
      the span to x = ±0.06 with 0.03 m spacing, so the line is still seen after a
      larger excursion and recovery has room.

      - Motor-mismatch bias. The contract says a fixed left/right mismatch is set
      per seed and track, so a steady bias exists. I set ki = 0.1, a small value.
      With the integral capped at ±2, its maximum contribution is 0.2 turn units,
      which limits windup on bends.

      - Speed arithmetic. The PWM base at base_speed 1.3 is 4095 × 0.65 ≈ 2662, not
      2550. I keep base_speed 1.3 because the average speed needed is about 1.5 m/s
      and there is no evidence yet to justify going higher.

      - Yaw inertia. Computed as 0.8 × (0.16² + 0.12²) / 12 ≈ 0.0027 kg·m². At this
      value the robot should turn responsively without a large overshoot tendency
      from inertia alone.

      - Body width. body_width 0.12 gives an off-track limit of max(0.06, 0.0125 +
      0.03) = 0.06 m. The earlier wording that body_width sets this limit was wrong;
      it only matters above about 0.19 m.


      Partly accepted:

      - kd. I keep kd 0.3. The critique is right that the derivative term sees sensor
      noise and step changes. With 2% noise the derivative contribution is only around
      0.6 turn units, so the damping effect is still expected to outweigh the jitter.
      This is untested and is a candidate to reduce if steering_oscillation is high.

      - kp. I keep kp 2.5 and reduce nothing yet. A single sensor step of 1 gives
      875 PWM of differential, which is large. I accept this as a risk and will judge
      it from max_error and steering_oscillation rather than lower it blindly.


      Rejected:

      - Switching to 16 mm sensors. This would smooth the signal, but it adds overlap
      and a wider footprint that the critique did not ask for, and it would change
      the signal scale without evidence. I keep 12 mm.

      - Moving the sensors further forward or changing the wheel geometry. The critique
      gave no evidence for either, so I keep wheel_track 0.12 and wheel_radius 0.03.


      Expected result (guesses): completion on the development tracks, 0-2 line-loss
      events, rms_error around 0.02-0.04 m, completion_time about 2.5-2.9 s. Main
      risk: overshoot on the slalom and s-bend. The measurements will separate causes:
      high max_error with low line_loss suggests a gain problem; line_loss_events
      with max_error near 0.06 suggests the sensor span or recovery is still the limit.


      - [Open this output](iteration-0/entity1/versions/2e9fc21335d74244b8d2113a5e947c7e/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/301e8e1214704070807cd0aa01e2b9a2/payload.json),
      [entityC1](iteration-0/entityC1/versions/6e5c20c8e1a84accb0269b4be05aa93d/payload.json)'
  actions:
  - id: action0
  - id: action1
  - id: action2
measurements: {}
