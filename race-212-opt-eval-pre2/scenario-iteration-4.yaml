map:
  id: race-212-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Lower gain, wider sensor
    notes: 'Draft cuts kp to 2.0 and base speed to 1.2, moves sensors forward to y=0.07
      and enlarges them to 16 mm. This responds to iteration 2, where every run went
      off track with max_error at the 0.06 m limit. Expected: fewer off-track exits
      and more progress; completion is possible but not certain.


      ### Rationale


      Evidence: the only raced design (iteration 2: kp 3.0, kd 0.5, ki 0, base_speed
      1.4) finished 0 of 60 trials. Every run went off track: progress 0.22 on the
      oval, 0.04 on the s-bend and 0.035 on the slalom. rms_error is small (0.025
      to 0.03 m), but max_error sits at about 0.06 m, the off-track limit. The robot
      is making sharp excursions that end the run, not drifting slowly. Even the gentlest
      track fails at about 21% progress, so the controller overshoots and is too aggressive
      for its sensing lag. Sensors sit at y = 0.04, so the line is seen only about
      4 cm ahead of the axle. At 1.4 base speed and kp 3.0, a full-scale signal of
      2 gives about 2100 PWM of wheel differential, which is strong enough to cause
      overshoot.


      Changes: (1) Sensors move forward to y = 0.07, which gives about 3 cm more look-ahead
      and reduces lag-driven overshoot. (2) sensor_size goes from 0.012 to 0.016,
      so each sensor covers more of the 25 mm tape and the signal is smoother and
      more linear across the line. (3) base_speed drops from 1.4 to 1.2, which trades
      some lap time for more time to correct; finishing is worth 500 points and is
      the priority. (4) kp drops from 3.0 to 2.0 to reduce overshoot. (5) kd rises
      from 0.5 to 0.6 for damping. (6) ki goes from 0 to 0.1, a small value to offset
      the fixed motor mismatch without much windup risk. Geometry is otherwise kept,
      and body_width 0.12 still gives a 0.06 m off-track limit.


      Expected result: fewer off-track exits, with progress above 0.5 on the oval
      and a meaningful rise on the s-bend and slalom. Completion is possible but not
      certain. Main risk: a lower kp may under-correct on tight bends, which steering_oscillation
      and max_error in the next race should show.


      - [Open this output](iteration-4/entity0/versions/aa0ca19d6e3647bca28c1ea610aff56a/payload.json)

      - Based on: [entityR2A](iteration-4/entityR2A/versions/carried-af421f9ae15c536d/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critiques the iteration-2 draft (kp 3.0, kd 0.5, base 1.4) for derivative
      noise, a thin sensor span against the off-track limit, and speed-led priorities
      that undervalue completion and line loss. Rests on the contract equations and
      scoring weights, with the rationale''s unlabelled predictions flagged as guesses.


      - [Open this output](iteration-2/entityC1/versions/6217773e5db04b23908f8d2908485332/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/a6494c50520c49a7891b5d2f29681952/payload.json)'
  - id: entity1
    label: Wider sensors, lower kd
    notes: 'Widens the sensor span to x = ±0.07 to keep the line visible before the
      0.06 m off-track limit, cuts kd to 0.15 and kp to 2.5 to address the derivative-noise
      and bend-pivot risks from the critique. The gains are unraced guesses, and the
      race''s max_error, line-loss and steering_oscillation values will decide the
      next step.


      ### Rationale


      Evidence: still no race telemetry. Every expected value is a guess to be confirmed
      or refuted by the race.


      Accepted from the round-1 critique:

      - Sensor span (critique item 1, the largest scoring risk). The outer sensors
      move from x = +/-0.04 to +/-0.07, with 0.035 m spacing. Off-track is at 0.06
      m, and the outer sensor still reads tape when the line centre is about 0.088
      m away, so the line stays visible for recovery before the robot leaves the track.

      - kd (critique items 1, 2 and 4). kd falls from 0.5 to 0.15, inside the critic''s
      suggested 0.1 to 0.2. The derivative acts on a noisy, quantised signal, and
      I have no evidence that it damps rather than adds jitter. The lower value limits
      the kick at line loss and reacquisition.

      - kp (critique items 3 and 4). kp falls from 3.0 to 2.5. At base_pwm about 2870,
      a signal of 2 gives about 1750 PWM of differential, which avoids the near-pivot
      on bends that kp 3.0 caused.

      - ki (critique item 7). ki stays at 0.1, not 0, to remove the fixed motor-mismatch
      bias. The integral is capped at +/-2, so its maximum contribution is 0.2 turn
      units.


      Partly accepted:

      - base_speed (critique item 5). I keep 1.4 rather than moving to the critic''s
      moderate value. Completion needs about 1.5 m/s average, and 1.3 leaves no margin
      for slip and start-up. The expected completion_time of 2.5 to 2.8 s is a guess;
      if the robot is slow, the time term loses at most about 60 points, while line
      loss costs far more, so the race''s line_loss_events will decide whether to
      lower this.


      Rejected:

      - 16 mm sensors and changes to wheel_track or wheel_radius. The critique gave
      no evidence that these fail, and they would change the signal scale.

      - Off-track margin from body_width. At body_width 0.12 the limit is 0.06 m,
      so body_width sets no margin; I keep 0.12 and claim nothing from it.


      Yaw inertia = 0.8 x (0.16^2 + 0.12^2) / 12 = about 0.0027 kg m^2. The turn response
      with kp 2.5 and kd 0.15 should be responsive without large inertia-driven overshoot.


      Expected result (guesses): completion on all development tracks, 0 to 2 line-loss
      events, rms_error about 0.02 to 0.04 m, completion_time about 2.5 to 2.8 s.


      Diagnostics: high max_error with few line losses points to gain or overshoot
      (kp). Line-loss events with max_error near 0.06 points to recovery. High steering_oscillation
      at kd 0.15 points to derivative jitter. Low progress with completion 0 points
      to speed too low or stalling.


      - [Open this output](iteration-2/entity1/versions/feaab91b16804f36889c430e7bdd9a4c/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/a6494c50520c49a7891b5d2f29681952/payload.json),
      [entityC1](iteration-2/entityC1/versions/6217773e5db04b23908f8d2908485332/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Critiques the revised kd and speed reasoning. The derivative kick arithmetic
      is wrong by a factor of about 3 to 12, and base_speed is converted to metres
      per second without evidence. The sensor span and kp arithmetic are checked and
      found correct.


      - [Open this output](iteration-2/entityC2/versions/4b60cb0c22d04bca943f72ffbad3ef13/payload.json)

      - Based on: [entity1](iteration-2/entity1/versions/feaab91b16804f36889c430e7bdd9a4c/payload.json)'
  - id: entity2
    label: 'Final: wider span, kd'
    notes: 'Final design keeps the wider sensor span (+/-0.07 m) and reduces kd to
      0.10, since kd acts at 100 times per-step change and 0.15 gave about 5000 PWM
      of differential per unit step. Speed 1.4, kp 2.5 and ki 0.1 are kept, with the
      rationale marking the speed and kp choices as untested.


      ### Rationale


      Evidence: still no race telemetry, so every expected value is a guess to be
      tested by the race. I kept the sensor span and reduced kd further, based on
      the critique''s arithmetic check.


      Accepted from the round-2 critique:

      - Derivative gain. The critique is right that the derivative acts on change
      per second. With a 10 ms step, kd x 100 x (change in signal per step) applies.
      At kd 0.15 a one-unit signal change gives 15 turn units, about 5250 PWM of differential,
      far more than the 440 I had estimated. I lower kd to 0.10. Readings are quantised
      and noisy (about 2%), so a 0.02 signal jitter gives about 0.2 turn units (about
      70 PWM), which is tolerable. kd 0.10 still gives some damping on the slalom.
      If steering_oscillation is high, the first fix is kd toward 0.03 to 0.05.

      - Sensor span. The outer sensors stay at x = +/-0.07 with 0.035 m spacing, so
      tape is still visible at a centre offset of about 0.088 m and recovery can start
      before the 0.06 m off-track limit. The critique notes that x = +/-0.07 lies
      outside the 0.06 m body half-width; I keep it deliberately, because the sensors
      must reach beyond the body to see the line, and the weight-2 outer sensor still
      gives a usable signal when it is the only one on tape.

      - Sensor coverage. With 12 mm footprints and 35 mm spacing, the 25 mm tape always
      covers at least one sensor near centre, so there is no blind zone on the centre
      line.


      Partly accepted:

      - base_speed. I keep 1.4 (base PWM about 2866). The critique''s 1.7 to 2.0 m/s
      figure is an assumption, since the contract gives no m/s conversion. Completion
      needs an average of about 1.5 m/s, so 1.4 gives little margin but avoids the
      penalties from line loss, which cost far more than the time term. The race''s
      line_loss_events and completion_time will decide whether to lower it.

      - kp. I keep 2.5. A full-scale signal of 2 gives 5 turn units, or 1750 PWM of
      differential, which the critique said was safe at base PWM 2866 (inner wheel
      about 1100). I have no evidence it is needed, so the race will test it.


      Rejected:

      - ki. The critique argues ki 0.1 overstates its value, but the contract fixes
      a left/right motor mismatch that a steady integral can remove. The integral
      is capped at +/-2 (at most 0.2 turn units), so windup risk is small. I keep
      ki 0.1.

      - 16 mm sensors and wheel_track or wheel_radius changes. No evidence was given
      that these fail, and they would change the signal scale.

      - Body_width. At 0.12 the off-track limit is 0.06 m, set by the floor rather
      than body_width, so I claim no margin from it.


      Line loss: last_direction is kept. The critique''s search_left/search_right
      alternative is not clearly better, and the lower kd reduces the derivative kick
      at loss.


      Expected results (guesses): completion on all development tracks, 0 to 2 line-loss
      events, rms_error about 0.02 to 0.04 m, completion_time about 2.5 to 2.9 s.
      If the time is above 2.9 s with completion, speed is the limit; if line losses
      occur with max_error near 0.06 m, recovery is the limit; if max_error is high
      with few losses, kp overshoot is the limit.


      - [Open this output](iteration-2/entity2/versions/d310362ce72a4202bb407ec63a60cc64/payload.json)

      - Based on: [entity1](iteration-2/entity1/versions/feaab91b16804f36889c430e7bdd9a4c/payload.json),
      [entityC2](iteration-2/entityC2/versions/4b60cb0c22d04bca943f72ffbad3ef13/payload.json)'
