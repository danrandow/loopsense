map:
  id: race-132-opt-eval
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: kd 0.25 single-lever test
    notes: 'Iteration 1 baseline (replicated exactly in iteration 6, score 75.97)
      with kd raised from 0.2 to 0.25, the next untested point on the s-bend progress
      trend (kd 0.1 and 0.15 both about 0.155, kd 0.2 at 0.29). Every other field
      is unchanged, so the race isolates the kd effect.


      ### Rationale


      Evidence: iteration 6 reproduced the iteration 1 design exactly (score 75.9694,
      identical per-track metrics), so the baseline is reliable and the s-bend progress
      of 0.29 is repeatable for this design and seed set. Every lever tested since
      then lowered the score. kd is the only controller term that has moved s-bend
      progress: kd 0.1 gave about 0.155, kd 0.15 gave 0.155, and kd 0.2 gave 0.29.
      That trend is not yet resolved above 0.2, so kd 0.25 is the next untested point,
      as the Evaluator requested. kp 2.5 (iteration 3) left max_error at 0.062 to
      0.065, speed changes (1.2, 1.5) moved progress in opposite directions across
      tracks without fixing max_error, and sensor spacing or footprint changes cut
      progress. Max_error has stayed at about 0.061 to 0.065 on every track under
      every setting, so the off-track failure is not yet addressed by any lever. Change:
      kd 0.2 to 0.25, everything else unchanged (kp 2.0, ki 0, base_speed 1.4, weights
      -2..2, sensors at x -0.02..0.02 and y 0.04, sensor_size 0.012, last_direction
      line loss, same geometry). Expected result: if the s-bend progress trend continues,
      progress rises above 0.29 and steering_oscillation rises above 0.23, which trades
      jitter for progress. Hypotheses: (H1) kd 0.25 raises s-bend progress above 0.29
      while the oval stays near 0.16. (H2) If s-bend progress falls or oscillation
      grows past about 0.3 with no gain in progress, kd 0.2 is the optimum and the
      baseline should be kept for the final evaluation. (H3) max_error stays near
      0.06 to 0.065 regardless, so the remaining error is set by bend reach and dynamic
      lag. Measurements wanted: progress, line_loss_events and steering_oscillation
      per track, and max_error with its location on the s-bend and slalom.


      - [Open this output](iteration-10/entity0/versions/37297b9eb9bc42a9ac061562b1d888e3/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-1a6aaf7ceea3b3e8/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-4ed85e413178ea4f/payload.json)'
  - id: entityR1
    label: Approve best baseline
    notes: 'Approved the unchanged iteration 1/6 design (score 75.97, reproduced exactly
      in iteration 6), the best raced candidate. Every alternative since then scored
      lower (iterations 2 to 5, 7 and 8), so racing the known best is the safest score
      for this iteration.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      candidate is the iteration 1 design, reproduced exactly in iteration 6 (score
      75.97, s-bend progress 0.29, oval 0.16, max_error about 0.061 to 0.065 on every
      track). It keeps kp 2.0, kd 0.2, base_speed 1.4, ki 0, last_direction, weights
      -2..2, sensors at x -0.02..0.02 and y 0.04, and sensor_size 0.012. Every alternative
      raced since then scored lower: base_speed 1.2 with kd 0.1 (iteration 2, 50.60),
      kp 2.5 with kd 0.1 (iteration 3, 49.59), wider sensor spacing (iteration 4,
      57.85), sensor_size 0.016 (iteration 5, 59.03), kd 0.15 (iteration 7, 57.61),
      and base_speed 1.5 (iteration 8, 68.89). Approving it races the best known design,
      which is the safest score for this iteration. Note that max_error has stayed
      at 0.061 to 0.065 under every controller and geometry tried, so the off-track
      failure is not fixed by the levers so far. Read the next race as follows. If
      it reproduces about 76, the baseline is confirmed and the next iteration should
      test a single lever against it. If progress falls clearly below 0.29 on the
      s-bend, the earlier result was partly seed-dependent and the design should be
      judged on all tracks together. Keep ki at 0 unless rms_error shows a steady
      offset.


      ### Requested changes


      - If the race reproduces about 76 with s-bend progress near 0.29, test kd 0.25
      with everything else unchanged. In the evidence, s-bend progress rose with kd:
      0.155 at kd 0.1 (iteration 2), 0.155 at kd 0.15 (iteration 7), and 0.29 at kd
      0.2 (iterations 1 and 6). kd 0.25 is the next untested point on that trend.

      - Keep kp at 2.0. Iteration 3 (kp 2.5, kd 0.1) left max_error at 0.062 to 0.065,
      so raising kp has not reduced the off-track error.

      - Do not raise base_speed above 1.4 yet. Iteration 8 (base 1.5, kd 0.2) raised
      oval progress from 0.16 to 0.22 but cut s-bend progress from 0.29 to 0.167,
      so speed trades one track against another. Compare any speed change against
      the s-bend and oval together.


      - [Open this output](iteration-9/entityR1/versions/b4bdd6aa857a4b86b344a76973bc3aa7/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/11ec415f908b47a1868d4f58b9a369f4/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-26f3eb2bc9878c6b/payload.json)'
