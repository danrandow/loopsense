map:
  id: race-132-opt-eval
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: kp 2.5, speed 1.4, kd 0.1
    notes: 'Restores base_speed to 1.4, the level that gave iteration 1''s best progress,
      and keeps kd at 0.1 to hold oscillation down. Raises kp from 2.0 to 2.5 as the
      single modest step specified after iteration 2 showed oscillation below 0.15
      with max_error still near 0.06. Based on the iteration 1 and 2 race data.


      ### Rationale


      Evidence from iteration 2 (60 trials, all off_track, score 50.60, down from
      75.97 in iteration 1). Cutting base_speed 1.4 to 1.2 and kd 0.2 to 0.1 changed
      the results in two different ways. Progress fell sharply: s-bend 0.29 to 0.155,
      oval 0.16 to 0.10, slalom 0.115 unchanged. max_error did not improve, staying
      at 0.061 to 0.064 on every track. Line losses on the s-bend fell from 1.95 to
      1.0, but the slalom stayed at 2.0. Steering oscillation fell as predicted: s-bend
      0.23 to 0.14, slalom 0.14 to 0.14, oval 0.11 to 0.08. The lower kd did reduce
      jitter, but the lower speed cost most of the progress and did not move the failure
      point. The Evaluator''s rule for progress falling with no reduction in max_error
      therefore applies: return base_speed toward 1.4 and keep kd at 0.1. The Evaluator''s
      rule for oscillation below about 0.15 with max_error near 0.06 also applies
      (s-bend 0.14, slalom 0.14), so kp should rise in one modest step from 2.0 to
      2.5. Changes: base_speed 1.2 to 1.4 (restores the progress that iteration 1
      reached); kd stays at 0.1 (keeps the lower jitter); kp 2.0 to 2.5 (the one-step
      increase the Evaluator specified, aimed at pulling max_error below 0.06). Geometry,
      weights, ki and line_loss are unchanged so the kp effect can be read directly.
      Expected result: progress near iteration 1 levels (s-bend about 0.29, oval about
      0.16), steering_oscillation at or below about 0.15, and max_error falling from
      about 0.062 toward or below 0.06 on the oval and slalom. Hypotheses to test:
      (H1) the bend failure is driven by insufficient steering authority rather than
      speed, so kp 2.5 should reduce max_error and line losses; (H2) kd 0.1 keeps
      oscillation below 0.15 at speed 1.4; (H3) if oscillation rises above 0.15 with
      kp 2.5, the next step is kd 0.05 rather than further kp. Measurements wanted:
      max_error and its location on each track, line_loss_events per track (especially
      the slalom, which stayed at 2.0), steering_oscillation, progress per track,
      and completion_time if any run finishes.


      - [Open this output](iteration-3/entity0/versions/56211da20c5a446c9a9a6c4678298754/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-f1e5d624ebd2c9b2/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-ea14241e78f364b3/payload.json)'
  - id: entityR1
    label: 'Approve: kp 2.5, speed'
    notes: 'Approved the candidate that restores base_speed to 1.4 and keeps kd 0.1,
      with kp raised from 2.0 to 2.5. Iteration 2 showed speed 1.2 cost progress without
      lowering max_error, and kd 0.1 cut jitter. The change is targeted, valid and
      the best-supported next step, so racing it is the best use of the remaining
      budget.


      ### Feedback


      Written before this candidate has raced. Evidence: iteration 1 (score 75.97,
      best so far) had kp 2.0, kd 0.2 and base_speed 1.4. Its max_error was 0.061
      to 0.065 on every track, s-bend line losses were 1.95, slalom line losses were
      2.0, and steering_oscillation was 0.23 on the s-bend and 0.14 on the slalom.
      Iteration 2 (score 50.60) cut base_speed to 1.2 and kd to 0.1. Progress fell
      (s-bend 0.29 to 0.155, oval 0.16 to 0.10), max_error did not improve, and oscillation
      dropped (s-bend 0.14). So lower speed cost progress without moving the failure
      point, and lower kd reduced jitter. This candidate restores base_speed to 1.4
      and keeps kd at 0.1, so it should recover iteration 1''s progress with less
      jitter. kp rises from 2.0 to 2.5 as one modest step, aimed at max_error, which
      has stayed near 0.061 to 0.065 in every race so far. It is a targeted, valid
      change within the contract limits, and the sensor, weight, ki and line_loss
      settings are unchanged, so the kp effect can be read directly. Next-race rules:
      if steering_oscillation rises above about 0.15 with kp 2.5, lower kd to 0.05
      rather than adding more kp, because iteration 1 linked kd 0.2 to oscillation
      of 0.23. If progress is near iteration 1 but max_error still sits at about 0.06
      with line losses unchanged, the next step is a larger kp or a sensor-geometry
      change, not more speed. If progress falls below iteration 1 levels with max_error
      unchanged, return base_speed to about 1.3. Keep ki at 0 unless rms_error shows
      a steady offset. Approving to race: this is the best-supported next step, and
      racing it gives the telemetry needed to judge kp directly.


      ### Requested changes


      - If steering_oscillation rises above about 0.15 on the s-bend or slalom with
      kp 2.5, lower kd from 0.1 to 0.05 in one step (iteration 1 showed kd 0.2 coincided
      with oscillation of 0.23).

      - If max_error stays near 0.06 and line_loss_events on the s-bend and slalom
      stay near 2 with kp 2.5, try a larger kp step (for example 3.0) or a different
      sensor spacing, rather than more base_speed (iteration 2 showed lower speed
      cost progress without moving the failure point).

      - If progress falls below iteration 1 levels (s-bend 0.29, oval 0.16) with max_error
      unchanged, return base_speed to about 1.3 and keep kd at 0.1.


