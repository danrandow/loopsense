map:
  id: race-132-opt-eval
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Iter1 ctrl, wider sensors
    notes: 'Reverts the controller to the best raced design (kp 2.0, kd 0.2, base
      1.4) and widens sensor spacing to ±0.03 m to test whether the line is lost less
      on bends. Iteration 3 showed kp 2.5 did not move max_error, and the progress
      drop tracked kd 0.1, so the sensor reach is the one change tested.


      ### Rationale


      Evidence from iteration 3 (kp 2.5, kd 0.1, base_speed 1.4; score 49.59) against
      iteration 1 (kp 2.0, kd 0.2, base_speed 1.4; score 75.97). Only kp and kd differ
      between these two, and the drop came with kp rising and kd falling. Progress
      fell on the s-bend (0.29 to 0.15) and the oval (0.16 to 0.10). max_error stayed
      at 0.062 to 0.065, so kp 2.5 did not move the failure point. Iteration 2 (base
      1.2, kd 0.1, kp 2.0) gave nearly the same oval result (0.1025 progress, identical
      per-metric values to iteration 3). That points to kd 0.1 as the cause of the
      progress loss, not base_speed. So kd 0.2 looks like it supplies damping that
      buys progress, and kd 0.1 gives back progress while lowering jitter. Kp 2.5
      did not help max_error, so the kp step is not the lever. The evaluator''s rule
      for a stuck max_error suggests changing sensor geometry.


      Change: return to the iteration 1 controller (kp 2.0, kd 0.2, base_speed 1.4,
      ki 0, line_loss last_direction, weights unchanged). This is the best raced design.
      The one change is sensor spacing, widened from x = -0.02..0.02 to x = -0.03..0.03
      (step 0.015). Outer sensors then see the tape at larger lateral offsets, so
      the line should be held longer before the 0.06 m limit and the line-loss events
      on the s-bend and slalom (about 2 each) should drop. Keeping the controller
      fixed isolates the sensor effect against the iteration 1 baseline.


      Expected result: max_error below about 0.06 on at least one track, line_loss_events
      below 2 on the s-bend and slalom, and progress at or above iteration 1 (s-bend
      0.29, oval 0.16). Risk: kd 0.2 gave steering_oscillation of 0.23 on the s-bend.
      If oscillation is high with max_error still near 0.06, the next step is kd 0.15
      rather than more kp. If progress falls with spacing wider, return to the iteration
      1 spacing and test sensor_size 0.016 instead.


      Hypotheses: (H1) wider sensor spacing reduces line loss on sharp bends; (H2)
      kd 0.2 is needed to keep progress; (H3) max_error is set by the bend geometry
      and the sensor reach, not kp. Measurements wanted: max_error and where it peaks,
      line_loss_events per track, steering_oscillation, progress per track, and completion_time
      if any run finishes.


      - [Open this output](iteration-4/entity0/versions/eede52c2de154d728047f3b631223b6b/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-b5a96cfdb02cfe43/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-45846b320d6fe3b3/payload.json)'
  - id: entityR1
    label: 'Approve: kp 2.5, speed'
    notes: 'Approved the candidate that restores base_speed to 1.4 and keeps kd 0.1,
      with kp raised from 2.0 to 2.5. Iteration 2 showed speed 1.2 cost progress without
      lowering max_error, and kd 0.1 cut jitter. The change is targeted, valid and
      the best-supported next step, so racing it is the best use of the remaining
      budget.


      ### Feedback


      Written before this candidate has raced. Evidence: iteration 1 (score 75.97,
      best so far) had kp 2.0, kd 0.2 and base_speed 1.4. Its max_error was 0.061
      to 0.065 on every track, s-bend line losses were 1.95, slalom line losses were
      2.0, and steering_oscillation was 0.23 on the s-bend and 0.14 on the slalom.
      Iteration 2 (score 50.60) cut base_speed to 1.2 and kd to 0.1. Progress fell
      (s-bend 0.29 to 0.155, oval 0.16 to 0.10), max_error did not improve, and oscillation
      dropped (s-bend 0.14). So lower speed cost progress without moving the failure
      point, and lower kd reduced jitter. This candidate restores base_speed to 1.4
      and keeps kd at 0.1, so it should recover iteration 1''s progress with less
      jitter. kp rises from 2.0 to 2.5 as one modest step, aimed at max_error, which
      has stayed near 0.061 to 0.065 in every race so far. It is a targeted, valid
      change within the contract limits, and the sensor, weight, ki and line_loss
      settings are unchanged, so the kp effect can be read directly. Next-race rules:
      if steering_oscillation rises above about 0.15 with kp 2.5, lower kd to 0.05
      rather than adding more kp, because iteration 1 linked kd 0.2 to oscillation
      of 0.23. If progress is near iteration 1 but max_error still sits at about 0.06
      with line losses unchanged, the next step is a larger kp or a sensor-geometry
      change, not more speed. If progress falls below iteration 1 levels with max_error
      unchanged, return base_speed to about 1.3. Keep ki at 0 unless rms_error shows
      a steady offset. Approving to race: this is the best-supported next step, and
      racing it gives the telemetry needed to judge kp directly.


      ### Requested changes


      - If steering_oscillation rises above about 0.15 on the s-bend or slalom with
      kp 2.5, lower kd from 0.1 to 0.05 in one step (iteration 1 showed kd 0.2 coincided
      with oscillation of 0.23).

      - If max_error stays near 0.06 and line_loss_events on the s-bend and slalom
      stay near 2 with kp 2.5, try a larger kp step (for example 3.0) or a different
      sensor spacing, rather than more base_speed (iteration 2 showed lower speed
      cost progress without moving the failure point).

      - If progress falls below iteration 1 levels (s-bend 0.29, oval 0.16) with max_error
      unchanged, return base_speed to about 1.3 and keep kd at 0.1.


      - [Open this output](iteration-3/entityR1/versions/3ca8e53ac8c24fdc810a72756a80a77f/payload.json)

