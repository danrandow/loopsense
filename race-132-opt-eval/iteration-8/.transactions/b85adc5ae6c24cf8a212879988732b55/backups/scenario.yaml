map:
  id: race-132-opt-eval
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Baseline with speed 1.5
    notes: 'Reverts kd to 0.2 per the iteration 7 result (kd 0.15 cut s-bend progress
      to 0.155), keeping the iteration 1 design and testing base_speed 1.5 as the
      one untested lever. The evidence is the replicated 75.97 baseline and the kd
      0.15 race at 57.61.


      ### Rationale


      Evidence. Iteration 7 (kd 0.15) scored 57.61, below the 75.97 baseline. The
      s-bend progress fell from 0.29 to 0.155, which is below the 0.22 threshold in
      the Evaluator''s rule (2). So kd 0.15 costs progress, and kd returns to 0.2,
      the value that held progress in iterations 1 and 6. Lowering kd further is ruled
      out. Across the runs, kd 0.1 and 0.15 both cut s-bend progress to about 0.15,
      while kd 0.2 gives about 0.29. Every lever tested except base_speed has now
      been ruled out for max_error. kp 2.5 (iteration 3) left max_error at 0.062 to
      0.065. Sensor spacing and footprint changes (iterations 4 and 5) cut progress
      without moving it. The off-track limit is max(0.06, 0.0125 + body_width/4),
      which stays at 0.06 for every allowed body_width, so geometry cannot widen it.
      max_error therefore appears to be set by bend reach and dynamic lag, not gain.


      Change. The design is the iteration 1 and 6 baseline (kp 2.0, kd 0.2, ki 0,
      last_direction, weights -2..2, sensors at x -0.02..0.02, y 0.04, sensor_size
      0.012, geometry unchanged) with one lever changed: base_speed 1.4 to 1.5. Iteration
      2 lowered speed to 1.2, but it also set kd to 0.1, which we now know cuts progress
      alone. So the speed effect was never isolated, and raising speed is the untested
      lever the Evaluator asked for.


      Expected result. s-bend progress stays at or near 0.29 and completion_time improves
      if the run finishes. max_error stays near 0.06 to 0.065, and steering_oscillation
      stays near 0.23 on the s-bend. The risk is that a faster robot leaves the line
      on the tightest bend sooner, so progress could fall below 0.29; if it does,
      base_speed returns to 1.4.


      Hypotheses. (H1) Speed 1.5 keeps s-bend progress at or above 0.29, because the
      kd 0.2 damping holds the line. (H2) If progress falls, speed is a limit on the
      tightest bend, and the baseline 1.4 stays. (H3) max_error remains about 0.06
      to 0.065 whatever the speed, since gain and speed have not moved it.


      Measurements wanted: progress, line_loss_events and steering_oscillation per
      track (especially s-bend and slalom), max_error and where it peaks, and completion_time
      if any run finishes.


      - [Open this output](iteration-8/entity0/versions/6546bcd6f7934a4bb49a18d567a5f675/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-a9d9398ac435d09d/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-aa3329c3c5a1c3d0/payload.json)'
  - id: entityR1
    label: Approve kd 0.15 midpoint
    notes: 'Approved the single-lever test of kd 0.2 to 0.15 on the replicated iteration
      1 baseline (75.97, reproduced in iteration 6), to reduce the 0.23 s-bend oscillation.
      Feedback sets rules for progress and speed follow-ups, based on iterations 2
      and 3 which showed kd 0.1 and lower speed cut s-bend progress.


      ### Feedback


      Written before this candidate has raced, so it states no outcome for it. The
      candidate is the iteration 1 design (kp 2.0, base_speed 1.4, ki 0, last_direction,
      weights -2..2, sensors x -0.02..0.02 at y 0.04, sensor_size 0.012) with kd moved
      from 0.2 to 0.15. Iteration 1 is the best raced design (75.97), and iteration
      6 reproduced it exactly, so the baseline is reliable. The change is valid and
      single-lever. Iteration 1 had steering_oscillation of 0.23 on the s-bend, which
      is the main jitter problem. Iteration 2 (kd 0.1) and iteration 3 (kd 0.1) both
      lost s-bend progress (0.29 to about 0.15), but both also changed base_speed
      or kp, so kd alone is not cleanly isolated. Iteration 3 also showed that kp
      2.5 leaves max_error at 0.062 to 0.065, so kp is not the lever for the off-track
      failure. Read the race in this order. (1) If s-bend progress stays at or above
      about 0.25 and steering_oscillation falls below about 0.20, kd 0.15 is a better
      trade and the next test is base_speed. (2) If s-bend progress falls below about
      0.22, the progress lost to kd is the limit, so return kd to 0.2, which kept
      progress in iteration 1, and do not lower kd further. (3) In either case, max_error
      will probably stay near 0.06 to 0.065 because bend reach, not gain, sets it.
      Approving this test is reasonable: it is the midpoint the team needs to check,
      and the race gives per-track telemetry for the next decision.


      ### Requested changes


      - If s-bend progress stays at or above about 0.25 and steering_oscillation falls
      below about 0.20 with kd 0.15, keep kd 0.15 and test base_speed 1.5 in one step.
      Speed has only been lowered so far (iteration 2, base 1.2, cut s-bend progress
      from 0.29 to 0.155), so raising it is untested and may recover completion_time.

      - If s-bend progress falls below about 0.22 with kd 0.15, revert kd to 0.2,
      the value that held progress in iteration 1 (0.29 on the s-bend), and do not
      lower kd further.

      - Keep kp at 2.0. Iteration 3 (kp 2.5) left max_error at 0.062 to 0.065, so
      raising kp has not moved the off-track failure.


      - [Open this output](iteration-7/entityR1/versions/9144748c951c42e08289f8a6bfe3cc42/payload.json)

