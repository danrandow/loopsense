  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: 'Final: kd 0.25 best'
    notes: 'Submits the raced iteration 10 design unchanged (kd 0.25, kp 2.0, base_speed
      1.4), the best development score at 81.25. The kd gain was real on the oval
      and reduced s-bend oscillation, and no untested value was added for the unseen
      final track.


      ### Rationale


      This is the final iteration, so the candidate should be the best design the
      evidence supports, not a new experiment. Iteration 10 (kd 0.25, everything else
      as the iteration 1 baseline) is the best raced design at 81.25, up from 75.97.
      Its oval progress rose to 0.206 from 0.159, its s-bend steering_oscillation
      fell to 0.21 from 0.23, and its s-bend progress fell only slightly, to 0.276
      from 0.295. Over the kd sweep, s-bend progress was 0.155 at kd 0.1 and 0.15,
      0.29 at kd 0.2, and 0.276 at kd 0.25. The kd trend has therefore flattened,
      with the gain now coming from the oval and lower jitter. Every other lever tested
      (base_speed 1.2 and 1.5, kp 2.5, wider sensor spacing, sensor_size 0.016) lowered
      the score, and max_error stayed at 0.061 to 0.065 under all of them. I considered
      kd 0.3, but the s-bend result already shows the progress peak is near 0.2 to
      0.25, and an untested value on the final unseen track is an avoidable risk.
      I therefore submit the raced iteration 10 design unchanged: kp 2.0, kd 0.25,
      ki 0, base_speed 1.4, sensors at x -0.02..0.02 and y 0.04, sensor_size 0.012,
      weights -2..2, and last_direction line loss. Expected result: a score near 81
      on the development tracks, with the final race''s result depending on how well
      the unseen track resembles the oval and s-bend. The off-track failure (max_error
      about 0.06 to 0.065) is not fixed by any lever tested, so the run will probably
      still end off track. Measurements requested: progress, max_error and where it
      peaks, line_loss_events, steering_oscillation and completion_time per track,
      so the final result can be compared with the development evidence.


      - [Open this output](iteration-11/entity0/versions/8d6392caaf384dcfbf8cb733e92ded91/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-a851cf4ded4b34f7/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-cdc9b6e9458c3b92/payload.json)'
  - id: entityR1
    label: Approve iteration 10
    notes: 'Approved the best raced design (iteration 10, kd 0.25, score 81.25) unchanged
      for the final unseen-track race. The kd sweep, the cut-down oval and s-bend
      jitter, and the lost scores from every other lever support keeping it as is.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. This
      is the final iteration, and the candidate is the iteration 10 design, which
      is the best raced result (81.25, up from 75.97 in iterations 1 and 6). Its kd
      0.25 is the only change from the iteration 1 baseline. Across the kd sweep,
      s-bend progress was 0.155 at kd 0.1 (iteration 2), 0.155 at kd 0.15 (iteration
      7), 0.29 at kd 0.2 (iterations 1 and 6), and 0.276 at kd 0.25 (iteration 10).
      Iteration 10 also lowered steering_oscillation on the s-bend from 0.23 to 0.21
      and raised oval progress from 0.16 to 0.21. The candidate is valid: every field
      is inside its contract limits, and five sensors match five weights. Every other
      lever tested lowered the score: base_speed 1.2 and 1.5 (iterations 2 and 8),
      kp 2.5 (iteration 3), wider spacing (iteration 4), and sensor_size 0.016 (iteration
      5). max_error stayed at 0.061 to 0.065 under all of them, so the off-track failure
      is not fixed by anything tested. With no further race in the team''s budget,
      the best-supported design is the one already raced, and an untested change would
      add risk on the unseen track. Approve it unchanged.


      ### Requested changes


      - Keep kp 2.0, ki 0.0, base_speed 1.4, kd 0.25, and last_direction line loss
      exactly as raced in iteration 10. Changing any of these would be untested on
      the held-back track.

      - Keep the sensor geometry at x -0.02..0.02, y 0.04 and sensor_size 0.012. Iterations
      4 and 5 showed that wider spacing and the 0.016 footprint both cut s-bend and
      oval progress without moving max_error.

      - Do not raise kd to 0.3 in this final design. The s-bend trend flattened between
      kd 0.2 (0.29) and kd 0.25 (0.276), so the progress peak is probably near 0.2
      to 0.25, and kd 0.3 is an untested risk.


      - [Open this output](iteration-11/entityR1/versions/7b97dbfd2aec4f9681d6a18c17433a04/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/8d6392caaf384dcfbf8cb733e92ded91/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-cdc9b6e9458c3b92/payload.json)'
