map:
  id: race-132-opt-eval
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence. Iteration 6 replicated the iteration 1 design exactly (score 75.9694,
      identical per-track metrics), so the 0.29 s-bend progress is reproducible for
      this design and seed set, not luck. The remaining problem is the s-bend, where
      steering_oscillation is 0.23 and line_loss_events is about 1.95, and the slalom,
      where line_loss_events is 2.0. Every track still ends off_track with max_error
      about 0.061 to 0.065, just above the 0.06 m limit. Earlier single-lever tests
      moved progress in ways that tie to the controller. kd 0.1 (iterations 2 and
      3) cut s-bend and oval progress, while kd 0.2 (iteration 1) kept it. Iteration
      2 (base 1.2) and iteration 3 (kp 2.5) showed that speed and kp do not move max_error.
      Sensor spacing and footprint changes (iterations 4 and 5) cut progress without
      moving max_error.


      Change. I keep the replicated iteration 1 design and change one lever: kd from
      0.2 to 0.15, the midpoint the Evaluator asked me to check. Everything else is
      unchanged: base_speed 1.4, kp 2.0, ki 0, weights -2..2, sensors at x -0.02..0.02
      with y 0.04, sensor_size 0.012, and last_direction line loss. Geometry is also
      unchanged.


      Why. kd 0.2 gave the oscillation peak (0.23 on the s-bend). kd 0.1 cut progress.
      Under the iteration 1 baseline, kd 0.15 should cut jitter while keeping most
      of the progress.


      Expected result. steering_oscillation on the s-bend falls from about 0.23 to
      about 0.18 to 0.20. Progress stays between about 0.25 and 0.29 on the s-bend
      and near 0.16 on the oval. Score is near 76, with a chance of a small gain if
      line losses fall. max_error is probably still near 0.06 to 0.065.


      Hypotheses. (H1) kd 0.15 keeps s-bend progress at or above 0.25 while cutting
      oscillation below 0.20. (H2) If progress falls below about 0.22, the progress
      lost by kd is the limit, and the next lever is kp with kd 0.2 kept. (H3) max_error
      stays about 0.06 to 0.065, so the remaining error is set by bend geometry and
      reach, not by a gain. Measurements wanted are progress, line_loss_events and
      steering_oscillation per track, and max_error with its location.


      - [Open this output](iteration-7/entity0/versions/a86abc39c3cf4e4aaf9a1a8231ea570e/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-8d9b4485caf764bf/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-4ed85e413178ea4f/payload.json)'
  - id: entityR1
    label: Approve iteration 1
    notes: 'Approves the best raced design (iteration 1, score 75.97) reproduced with
      sensor_size 0.012, so this iteration scores on a known-good design. Evidence:
      iterations 2 to 5 each lowered the score when one lever changed, and kp 2.5
      did not move max_error.


      ### Feedback


      Written before this candidate has raced, so it states no outcome for it. The
      candidate is the iteration 1 design (kp 2.0, kd 0.2, base_speed 1.4, ki 0, last_direction,
      weights -2..2, x = -0.02..0.02 at y = 0.04) with sensor_size 0.012. Iteration
      1 is the best raced design at 75.97. Its progress was 0.29 on the s-bend, 0.16
      on the oval and 0.115 on the slalom, with max_error about 0.061 to 0.065 on
      every track. Every change tried since then lowered the score: base_speed 1.2
      with kd 0.1 (iteration 2, 50.60), kp 2.5 with kd 0.1 (iteration 3, 49.59), wider
      spacing (iteration 4, 57.85) and sensor_size 0.016 (iteration 5, 59.03). Changing
      kp did not move max_error, and the kd 0.1 runs lost progress on the s-bend and
      oval. Approving this candidate gives a race on the best known design, which
      is the safest score for this iteration. The race is most useful as a check that
      the iteration 1 result reproduces. If it does, the next iteration should test
      one lever at a time against it. If progress falls to about 0.16 on the s-bend,
      the 0.29 was seed-dependent and the design should be judged on the oval and
      slalom. Keep ki at 0 unless rms_error shows a steady offset.


      ### Requested changes


      - If the race reproduces about 76 with progress near 0.29 on the s-bend, next
      test kd 0.15 with kp 2.0 and everything else unchanged. Iteration 1 showed kd
      0.2 gave steering_oscillation 0.23 on the s-bend, and iteration 2 showed kd
      0.1 cut progress, so 0.15 is the midpoint to check.

      - If progress on the s-bend falls to about 0.16 (the level of iterations 4 and
      5), treat iteration 1 as seed luck and do not change the controller yet. Compare
      the s-bend and slalom line_loss_events against 1.95 and 2.0 before choosing
      the next lever.

      - Do not raise kp above 2.0 unless max_error changes. Iteration 3 (kp 2.5, kd
      0.1) left max_error at 0.062 to 0.065, so kp is not reducing the error.


      - [Open this output](iteration-6/entityR1/versions/f364828b8da24b05b69192cab166e3eb/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/3177c649c6684fd9a545347340ddbcb3/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-ba623f1ef89c5d49/payload.json)'
