  - id: entity0
    label: Baseline 5-sensor
    notes: 'Symmetric five-sensor forward array at 0.02 m pitch with 12 mm footprints,
      0.12 m track and 0.8 kg body, as a neutral starting point. No race evidence
      yet, so the design rests on the contract''s geometry limits and the sensing
      convention.


      ### Rationale


      This is iteration 0, so there is no race telemetry or Integrator feedback yet.
      The baseline aims for a stable, wide sensing array with a sensible body. Five
      sensors at 0.02 m spacing across x = -0.04 to +0.04 m give a 0.08 m sensing
      span. That covers the 25 mm tape with margin for bends, and the 12 mm footprints
      leave small gaps so readings change smoothly as the line crosses. Sensors sit
      at y = 0.04 m, ahead of the axle, so they see the line before the wheels reach
      it, which helps the controller anticipate bends. Weights are set proportional
      to sensor x (2, 1, 0, -1, -2, sign-flipped so positive is left, matching the
      signal convention), so the weighted average reports the line''s lateral offset
      directly. Wheel track 0.12 m and mass 0.8 kg give moderate yaw inertia and turn
      authority. A 0.03 m wheel radius gives a reasonable speed range for the 3 s
      limit. The body is 0.12 m wide, so the off-track limit is 0.06 m, the floor,
      which keeps the margin fixed. Expected result: the robot completes the oval
      and s-bend with few line-loss events. The slalom is the hardest test and may
      show oscillation.


      - [Open this output](iteration-0/entity0/versions/b1eaeade69fe41fb95b824bd4cb7e32a/payload.json)'
  actions:
  - id: action0
