overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 4 (0.8 kg, 0.16 m body, 0.10 m track, 0.03 m wheels, 16 mm sensors
      at y = 0.03 m) is the first race that meets the Integrator''s conditions for
      a reaction-point test. Oval steering_oscillation fell to 0.181, below the 0.2
      threshold, so restoring inertia cured the jitter that the light robot had. Line
      loss is 0 on the oval and s-bend, and only 0.25 events per run on the slalom.
      Max_error stayed at 0.0614 m, so every run still leaves the 0.06 m floor. Body
      width cannot raise that floor, because the limit is max(0.06, 0.0125 + body_width/4)
      and this stays at 0.06 for all allowed widths. Tracking therefore has to improve,
      and the reaction point is the remaining untested geometry lever. Across iterations
      0 to 4, max_error has sat at 0.062 to 0.064 m whatever the track, mass or sensor
      footprint, so the reaction point is the variable I have not yet moved in isolation.
      Progress on the oval is 0.34, below the Integrator''s 0.35 threshold for a speed
      test. I will not test wheel radius in this same race, because it would confound
      the reaction-point result, and wheel radius is the next lever if progress stays
      low. This iteration changes only the sensor row, from y = 0.03 m to y = 0.02
      m, which brings the row closer to the axle and so reduces the lead the controller
      has on the line. Everything else is held at the iteration 4 values. Expected
      result: max_error falls below about 0.06 m, or at least moves materially, while
      oval oscillation stays near or below 0.2 and line_loss_events stays near 0.
      If max_error does not move, the controller gain is the limit, not geometry.


      - [Open this output](iteration-5/entity0/versions/78c94050efac4e568d213675d20ceba3/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-faa3ddc1527f7336/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-c14c78769b42fe45/payload.json)'
  - id: entity1
    label: Row at y=0.02, same gains
    notes: 'Complete robot for the Builder''s reaction-point test: seven 16 mm sensors
      moved to y = 0.02 m, with the iteration 4 controller held fixed so only the
      row changes. Iteration 4 gave oval oscillation 0.181 and max_error 0.0614 m,
      which is the evidence this rests on.


      ### Rationale


      Iteration 4 is the reference for this package. It used the same 0.8 kg, 0.16
      m body, 0.10 m track and 0.03 m wheels, with the seven-sensor, 16 mm row at
      y = 0.03 m, kp 2.8, kd 0.35, ki 0.05 and base_speed 1.4. It gave oval steering_oscillation
      0.181, line_loss 0 on the oval and s-bend, and max_error 0.0614. The Builder''s
      geometry moves only the sensor row, from y = 0.03 m to y = 0.02 m, so the controller
      is kept at the iteration 4 values to isolate the reaction-point effect. The
      sensor x-positions are unchanged, so the weights stay proportional to x (about
      33 times x, with the outer sensors at ±2). Moving the row closer to the axle
      shortens the lead the controller has on the line, so the same kp and kd may
      now react later. I have not changed the gains yet, because the Builder''s test
      is designed to show that effect first. If oscillation rises above 0.2 with max_error
      unchanged, the next controller move is kd up to about 0.4. If max_error falls
      below 0.06, the gains stay and speed is tested next. Base_speed is held at 1.4,
      because oval progress of 0.34 is close to the Integrator threshold of 0.35 and
      a speed change would confound the result. Expected result is max_error near
      or below 0.06 m, oscillation near or below 0.2, and line_loss near 0. These
      are estimates, not measured results.


      - [Open this output](iteration-5/entity1/versions/368745c1fa6e49aa8a50f31393e3e92b/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/78c94050efac4e568d213675d20ceba3/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-c14c78769b42fe45/payload.json)'
  - id: entityR1
    label: Reaction point and speed
    notes: 'Feedback for the y = 0.02 m test: it states how to react to the next race
      (speed via wheel radius, or kd if oscillation rises). It is tied to iteration
      4 (progress 0.34, oscillation 0.181) and the unchanged max_error floor across
      all iterations.


      ### Feedback


      Written before this candidate has raced. Iteration 4 (0.8 kg, 0.16 m body, 0.10
      m track, y = 0.03 m) gave oval oscillation 0.181, line loss 0 on the oval and
      s-bend, and max_error 0.0614 m. Iteration 1 (0.12 m track, same mass and body)
      gave oscillation 0.173, so restoring inertia brought oscillation down and track
      width did not. Max_error has stayed at 0.061 to 0.064 m through every iteration,
      so the reaction point is the lever to test. I held the iteration 4 controller
      fixed (kp 2.8, kd 0.35, base_speed 1.4), so the race isolates the row move.
      If max_error falls below 0.06 m with oscillation at or below 0.2, keep y = 0.02
      m and test wheel_radius 0.035 m only if oval progress stays below 0.35. If oscillation
      rises above 0.2 while max_error does not move, the controller is reacting too
      late to the row, so the next Integrator move is kd up toward 0.4, and the geometry
      should stay as it is. If line_loss rises on the slalom (it was 0.25 at y = 0.03
      m, iteration 3), the row is too close for the sharper bends, so try sensor_size
      0.012 at the same positions.


      ### Requested changes


      - If oval progress stays below 0.35 with max_error near 0.061 m (iteration 4
      gave progress 0.34): try wheel_radius 0.035 m with the same mass 0.8 kg and
      body, since progress has tracked speed and the wheel radius is the speed lever.

      - If line_loss_events rise above about 0.25 on the slalom after the row moves
      to y = 0.02 m (iteration 3 at y = 0.03 m and 0.06 m-wide sensor span gave 0.25):
      try sensor_size 0.012 at the same x and y positions to narrow the footprint
      near the outer sensors.

      - If max_error stays at 0.061 to 0.064 m across the y = 0.02 m test and oscillation
      is low: stop geometry changes for max_error, because iterations 0 to 4 showed
      no geometry response, and try a lower-inertia mass of 0.7 kg with wheel_radius
      0.035 m for speed instead.


      - [Open this output](iteration-5/entityR1/versions/368745c1fa6e49aa8a50f31393e3e92b/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/78c94050efac4e568d213675d20ceba3/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-c14c78769b42fe45/payload.json)'
