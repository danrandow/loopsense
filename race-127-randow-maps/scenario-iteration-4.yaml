map:
  id: race-127-randow-maps
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Restore inertia at 0.10m
    notes: 'Keeps the 0.10 m track that gave the best oval progress (0.45) but returns
      mass to 0.8 kg and body length to 0.16 m, to test whether yaw inertia rather
      than track width sets oscillation. Iteration 3 showed a wider track raised oscillation
      to 0.309, so the track-only hypothesis was falsified.


      ### Rationale


      Iteration 3 (0.10 m track) did not help. Oval steering_oscillation rose to 0.309,
      up from 0.272 at 0.09 m, so the Integrator''s rule to widen the track further
      is not supported. Oval progress held at 0.45, and line loss stayed at 0 on the
      oval and s-bend, with 0.25 events per run on the slalom. Max_error stayed at
      0.062 to 0.064 m on every track, so every run still leaves the 0.06 m off-track
      floor. Body width cannot raise that floor (it would need body_width above 0.19
      m), so tracking must improve.


      Across iterations, oscillation does not follow track width alone. Iteration
      1 (0.12 m track, 0.8 kg, 0.16 m body) gave the lowest oscillation, 0.173. Iterations
      2 and 3 (0.6 kg, 0.12 m body) gave 0.272 and 0.309. Yaw inertia, mass*(L^2+W^2)/12,
      is 0.00267 in iteration 1 and 0.00144 in iterations 2 and 3, roughly halved.
      The most consistent explanation is that the lighter, shorter robot is less damped
      and twitches more. Track width and inertia were changed together in iteration
      1 to 2, so this is not proven.


      Decision: keep the 0.10 m track, which gave the best oval progress (0.45), and
      restore the iteration 1 inertia by returning mass to 0.8 kg and body_length
      to 0.16 m. Sensors, wheel radius and body width stay fixed, so the change isolates
      inertia. Expected result: oval oscillation falls toward 0.17 to 0.2, progress
      stays near 0.35 to 0.45, and max_error is unchanged near 0.062 m. If oscillation
      falls but progress drops below about 0.35, the next lever is wheel_radius 0.035
      m. If max_error still sits at 0.062 m, the reaction point (sensor y) is the
      limit, and I will test y = 0.02 m next.


      - [Open this output](iteration-4/entity0/versions/152ceb607f294b2cb50210a2ec99db3a/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-9bad8d5f482d2701/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-a24d3a929eb9021f/payload.json)'
  - id: entity1
    label: Inertia-restored robot
    notes: 'Restores mass 0.8 kg and body_length 0.16 m with the 0.10 m track, and
      sets kp 2.8, kd 0.35 for the higher inertia and narrower yaw gain. Based on
      iterations 1 to 3, where inertia tracked oscillation more closely than track
      width did.


      ### Rationale


      The Builder''s geometry restores the iteration 1 inertia (mass 0.8 kg, body_length
      0.16 m) and keeps the 0.10 m track that gave oval progress of 0.45 in iteration
      3. Iteration 3 showed that the 0.10 m track alone did not lower oscillation
      (0.309 on the oval), so inertia is the lever under test. The controller must
      work with this geometry. Yaw gain per unit of turn scales roughly as 1/track,
      so 0.10 m gives about 20% more yaw per command than iteration 1''s 0.12 m. Iteration
      1 (0.12 m, kp 3.0, kd 0.3) had oval oscillation of 0.173, and iterations 2 and
      3 (kp 2.5, kd 0.4) had 0.272 and 0.309 at lower inertia. I therefore use kp
      2.8, between those settings, so that the higher inertia and the narrower track
      do not overshoot. kd 0.35 sits between 0.3 and 0.4: more damping than iteration
      1 without the derivative noise that kd 0.4 may add at low inertia. ki stays
      at 0.05 and base_speed at 1.4, because iterations 1 to 3 had no line loss on
      the oval or s-bend at these values. The sensor weights stay proportional to
      x (about 33 times x, within the ±2 limit) so the signal scale matches the evidence.
      line_loss stays last_direction. Expected result: oval steering_oscillation near
      0.17 to 0.22, oval progress 0.35 to 0.45, line_loss near 0 on oval and s-bend,
      and max_error still near 0.062 m. This is an estimate, not a measured result.


      - [Open this output](iteration-4/entity1/versions/f524d66058f14111bc6974391a7eab2e/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/152ceb607f294b2cb50210a2ec99db3a/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-a24d3a929eb9021f/payload.json)'
  - id: entityR1
    label: Inertia-first feedback
    notes: 'Points the Builder to inertia as the oscillation lever, citing iterations
      1 to 3 (oscillation 0.173 at 0.8 kg vs 0.272 to 0.309 at 0.6 kg). Max_error
      has stayed at 0.062 to 0.064 m in every race, so the next lever is the sensor
      row, not geometry.


      ### Feedback


      Before this geometry races, the evidence is as follows. Iterations 2 and 3 used
      a 0.6 kg, 0.12 m body and gave oval progress of 0.44 and 0.45 with oscillation
      of 0.272 and 0.309. Iteration 1 used 0.8 kg, a 0.16 m body and a 0.12 m track,
      and gave oscillation of 0.173 but progress of 0.31. Yaw inertia (mass*(L^2+W^2)/12)
      is about 0.0027 in iteration 1 and about 0.0014 in iterations 2 and 3. So the
      evidence points to inertia, not track width, as the main driver of oscillation,
      although the two were confounded. Iteration 3 showed that widening to 0.10 m
      did not reduce oscillation, so I do not expect the track alone to help. The
      controller I wrote uses kp 2.8 and kd 0.35, between the iteration 1 and iteration
      2/3 gains. Yaw gain rises as the track narrows, so I did not use the iteration
      1 gain of 3.0 on this 0.10 m track. Max_error has stayed at 0.062 to 0.064 m
      on every track in every iteration, so it does not respond to these geometry
      or gain changes. Next race: if oscillation falls below about 0.2 with progress
      near 0.4, keep the inertia and move on to the reaction point. If oscillation
      is still high, the gain is the cause, not geometry, so stop chasing it with
      geometry. If progress drops below about 0.35 with the heavier robot, speed (wheel
      radius) is the next lever.


      ### Requested changes


      - If oval steering_oscillation stays above 0.2 with mass 0.8 kg and body_length
      0.16 m, keep the inertia and test wheel_track 0.11 m, because the narrower track
      has been raising yaw gain per command in every iteration so far.

      - If oval progress falls below about 0.35 with the heavier robot (iteration
      1 at 0.8 kg gave 0.31; iterations 2 and 3 at 0.6 kg gave 0.44 and 0.45), try
      wheel_radius 0.035 m, since progress has tracked speed and the wheel radius
      is the speed lever.

      - If max_error stays at 0.062 m with line_loss_events at 0 and oscillation below
      0.2 (every iteration so far has shown 0.062 to 0.064 m), move the sensor row
      to y = 0.02 m, because sensing has not limited tracking since iteration 1.


      - [Open this output](iteration-4/entityR1/versions/f524d66058f14111bc6974391a7eab2e/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/152ceb607f294b2cb50210a2ec99db3a/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-a24d3a929eb9021f/payload.json)'
