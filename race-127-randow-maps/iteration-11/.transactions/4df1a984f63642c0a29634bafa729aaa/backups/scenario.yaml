  entities:
  - id: entity0
    label: 'Final: proven 0.6 kg'
    notes: 'Keeps the iteration 7 and 10 geometry unchanged (16 mm, ±0.06 m, y = 0.02
      m, 0.6 kg, 0.10 m track), the only design with oval completions (14 of 20, score
      303.8). Untested changes are not made because this is the final race and cannot
      be verified.


      ### Rationale


      This is the final iteration, so the design raced here is the one the final unseen-track
      evaluation will use. No further geometry test can be run, so the choice should
      be the platform with the best evidence. Iteration 7 and its identical re-run
      in iteration 10 scored 303.8, the best result so far, with 14 of 20 oval completions.
      Iteration 8 (12 mm) dropped oval completions to 0, and iteration 9 (±0.07 m
      span, unscaled weights) also dropped them to 0, so both of those changes are
      rejected. Iteration 6 showed that a larger wheel radius cut oval progress, and
      iteration 4 showed that the heavier 0.8 kg robot lost progress. The Integrator''s
      own feedback keeps the ±0.06 m, 16 mm, y = 0.02 m platform. The s-bend and slalom
      have never finished, and no geometry tested has moved max_error off the 0.06
      m floor. Any untested change (for example wheel_track 0.11 m) risks losing the
      oval completions that carry most of the score, and it cannot be verified before
      the final race. I therefore keep the proven platform unchanged. The gains and
      weight scale are the Integrator''s responsibility.


      - [Open this output](iteration-11/entity0/versions/06bbe953200e483ca727647b8195a12e/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-56c1eacc32418048/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-c0ebca2d3a013b6a/payload.json)'
  - id: entity1
    label: Final platform, unchanged
    notes: 'Keeps the iteration 7 and 10 geometry and controller exactly, since that
      is the only setup with oval completions (14 of 20, score 303.8) and it reproduced
      identically. No untested change is risked on the final race.


      ### Rationale


      This is the final iteration, so the robot raced here is the one the unseen-track
      evaluation will use. The evidence favours keeping the platform and controller
      that already produced results. Iteration 7 and its unchanged re-run in iteration
      10 both scored 303.79 with 14 of 20 oval completions, which shows the race is
      deterministic for this design. Iterations 8 (12 mm footprint) and 9 (±0.07 m
      span, unscaled weights) both dropped oval completions to 0, and those are the
      only controller-relevant variants tested, so neither is carried forward. I therefore
      keep the iteration 7 geometry exactly: seven 16 mm sensors at y = 0.02 m, x
      = ±0.06 m, 0.10 m track, 0.03 m wheels, 0.6 kg, 0.12 m body. The controller
      is also unchanged: kp 2.2, kd 0.5, ki 0.05, base_speed 1.4, last_direction,
      and weights of about 33.3 times x (±2 at the outer sensors). Gains were lowered
      from kp 2.5 and raised in kd during the light-robot runs (iterations 2 to 3,
      which gave oscillation 0.27 to 0.31), and this combination is the only one that
      produced oval completions. Untested changes to gain, weight scale or track would
      risk the oval completions, which carry most of the score, and I cannot verify
      them before the final race. Expected, not measured: oval completion near 70
      percent on a similar track, with the s-bend and slalom still likely to end off
      track.


      - [Open this output](iteration-11/entity1/versions/e767d298b0da4ad9af5c3953a9a98238/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/06bbe953200e483ca727647b8195a12e/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-c0ebca2d3a013b6a/payload.json)'
  - id: entityR1
    label: Final feedback to Builder
    notes: 'Written before racing, citing iterations 6, 7, 8, 9 and 10. Records that
      the 16 mm, ±0.06 m platform is required for oval completions and gives conditional
      changes for any later work on the slalom.


      ### Feedback


      Written before this candidate has raced. Iteration 7 and its identical re-run
      in iteration 10 scored 303.8 with 14 of 20 oval completions, the best result
      so far, so I kept that platform and controller. Iteration 8 showed that a 12
      mm footprint removes all oval completions (0 of 20, score 101.4), so the 16
      mm footprint is required. Iteration 9 showed that the ±0.07 m span with unscaled
      weights also removes them (0 of 20, score 98.4), even though slalom line loss
      fell from 0.30 to 0.10. That means edge margin helps the slalom but the oval
      is sensitive to the span and weight scale together. Iteration 6 showed that
      a larger wheel radius cut oval progress (0.36 to 0.29), so speed is not the
      lever. Max_error has sat at 0.061 to 0.064 m for most geometries, while oval
      finishes reached 0.048, so the failures are sharp-bend losses rather than a
      general floor. Since this is the final iteration, no further geometry race follows.
      If the final unseen-track race is the outcome, the platform will behave as in
      iteration 7 on tracks similar to the oval. The s-bend and slalom have never
      produced progress above 0.5, so no geometry tested so far has moved them. Any
      future work should test the ±0.07 m span only with weights rescaled to about
      0.86 times, and test wheel_track 0.11 m separately.


      ### Requested changes


      - For any further iteration: keep sensor_size 0.016 m and the ±0.06 m span,
      since iteration 8 (12 mm) dropped oval completions from 14 of 20 to 0 of 20.

      - If a wider margin is needed for the slalom (iteration 9 cut line loss to 0.10
      at ±0.07 m): rescale the weights to about 0.86 times the ±0.07 m values and
      test it alone, because the unscaled ±0.07 m run lost all oval completions.

      - If the s-bend and slalom still show no progress above 0.5: try wheel_track
      0.11 m at 0.6 kg as a single change, since iteration 1 at 0.12 m gave the lowest
      oscillation (0.173) and no s-bend or slalom run has yet passed progress 0.3.


      - [Open this output](iteration-11/entityR1/versions/e767d298b0da4ad9af5c3953a9a98238/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/06bbe953200e483ca727647b8195a12e/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-c0ebca2d3a013b6a/payload.json)'
