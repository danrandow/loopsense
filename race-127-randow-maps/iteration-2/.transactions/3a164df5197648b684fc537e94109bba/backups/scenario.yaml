overrides:
  entities:
  - id: entity0
    label: Agile chassis, same
    notes: 'Keeps the iteration 1 seven-sensor array, which removed line loss, and
      makes the robot more agile: track 0.09 m, mass 0.6 kg, body length 0.12 m. Iteration
      1 still left the track at about 0.062 m, and body width is shown to be irrelevant
      to the 0.06 m limit, so tracking lag is the target.


      ### Rationale


      Evidence from iteration 1: line loss fell from about 1 event per run to 0 across
      all three tracks, so the seven-sensor, 16 mm, 0.06 m-span array fixed sensing.
      Completions stayed at 0 and every run still ended off track at max_error about
      0.0619 m, while progress fell (oval 0.42 to 0.31, s-bend 0.26 to 0.15). The
      off-track limit is max(0.06, 0.0125 + body_width/4). At the widest allowed body
      (0.18 m) that is 0.0575 m, so the floor stays at 0.06 m and body width cannot
      help. The robot is now tracking-limited, not sensing-limited. Geometry can change
      how fast the robot can correct its heading. The turn rate is (vL - vR)/wheel_track,
      so for a given PWM difference a narrower track gives more yaw per command. Yaw
      inertia is mass*(L^2+W^2)/12, so lower mass and a shorter body reduce the lag
      between a steering command and the heading change. Both changes should reduce
      the tracking lag that pushes max_error to 0.062 m. Changes: wheel_track 0.12
      to 0.09 m, mass 0.8 to 0.6 kg, body_length 0.16 to 0.12 m. Sensor layout is
      kept exactly as in iteration 1 so the sensing result stays the same and any
      change comes from the drivetrain. Expected result: max_error below 0.06 on the
      oval and s-bend, some line-loss events still at 0, and the first completions
      possible. If max_error still sits at 0.062 with this agility, the limit is the
      controller gain or reaction point, not geometry.


      - [Open this output](iteration-2/entity0/versions/7002f52dcda1466594ede3cf3a97eeb5/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-aeb868e34d07e2fb/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-293dfc8af2cb3b0c/payload.json)'
  - id: entity1
    label: 7-sensor wide array
    notes: 'Adopts the Builder''s wide seven-sensor array (x ±0.06 m, 16 mm, y 0.03
      m) with proportional weights and unchanged gains to isolate sensing. Evidence:
      iteration 0 ran 60 trials with zero completions, all ending off track near 0.062
      m.


      ### Rationale


      Iteration 0 raced 60 trials with zero completions. All runs ended off track
      at about 0.062 m max error, with about one line-loss event each. The robot loses
      the line at about the same lateral offset where it leaves the track, so the
      controller needs a sensing array that keeps the tape visible further out. The
      Builder''s proposal widens the array to seven sensors at x = ±0.06 m, uses 16
      mm footprints and places the row at y = 0.03 m. I kept the controller''s gains,
      speed and line-loss rule unchanged (kp 3.0, ki 0.05, kd 0.3, base_speed 1.4,
      last_direction), so that any change in result comes from sensing. Sensor weights
      are set proportional to lateral position, about 33.3 × x, which gives ±2 at
      the outer sensors, inside the ±2 limit. This keeps the signal scale close to
      iteration 0 at the same offsets, while the outer sensors now reach a larger
      offset before saturating. The main risk is that the weights may overreact when
      the outer sensors read partial tape at 16 mm. If the next race shows the robot
      staying on track but not completing, the next test should be speed rather than
      gain. Expected result is fewer line-loss events and max_error under 0.06 m on
      the oval and s-bend. This is an estimate, not a measured result.


      - [Open this output](iteration-1/entity1/versions/4a913fa0ae634f48a0641f6506cef671/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/0c12f77395a344a79bbc65dc7fa509c4/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-825cebf58ed3736e/payload.json)'
  - id: entityR1
    label: Sensing-first feedback
    notes: 'Feedback written before the race, citing iteration 0 off-track failures
      at about 0.062 m with one line-loss event each. It gives branch rules for line
      loss, speed and oscillation, with three concrete geometry changes to try.


      ### Feedback


      Before this geometry races, the evidence is as follows. In iteration 0 (60 trials,
      zero completions), every run ended off track at about 0.062 m max error, with
      about one line-loss event per run. The loss happened at about the same offset
      where the robot left the track, which points to the five-sensor span (about
      ±0.058 m) as the limit. Iteration 0 also showed that the body width does not
      help, because the off-track limit stays at 0.06 m. I had to make the controller
      work with the existing sensor layout by keeping the weights proportional to
      lateral position, so the signal scale matches the offset. I kept the gains fixed
      to isolate the sensing change. Next race, if line_loss_events fall near 0 but
      max_error stays above 0.06 m, the controller gain or the reaction point is the
      limit: move the row closer to the axle or reduce the outer-sensor weights. If
      the robot stays on track but does not complete, the limit is speed: test a larger
      wheel radius and lower mass next. If line loss persists at the outer sensors,
      the 16 mm footprint may be overlapping too far, so try 12 mm at the same positions.


      ### Requested changes


      - If line_loss_events stay above about 0.5 per run while max_error is near 0.06
      m: keep the seven-sensor span at ±0.06 m but reduce the footprint to 0.012 m,
      because iteration 0 used 12 mm footprints at 0.02 m pitch and still saw one
      loss per run.

      - If the robot stays on track (max_error under 0.06 m) but does not complete:
      try wheel_radius 0.035 m and mass 0.7 kg to reach speed, because iteration 0
      never stalled and only failed by leaving the track.

      - If steering_oscillation rises on the slalom compared with iteration 0 (0.14
      m): move the sensor row back to y = 0.04 m or reduce the outer sensors to x
      = ±0.05 m, because the earlier sensor row at y = 0.04 m gave a smoother but
      later reaction.


      - [Open this output](iteration-1/entityR1/versions/4a913fa0ae634f48a0641f6506cef671/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/0c12f77395a344a79bbc65dc7fa509c4/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-825cebf58ed3736e/payload.json)'
