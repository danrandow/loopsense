map:
  id: race-117-randow-maps
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Narrow track to 0.08 m
    notes: 'Keeps the iteration-3 geometry that lifted the score to 493, which had
      s-bend line loss 0 and progress 0.75, and narrows wheel_track from 0.10 to 0.08
      m to add turn authority for the slalom (0 of 20 finishes, max_error 0.0624).
      The change is isolated to one variable so the result can be read directly.


      ### Rationale


      Iteration 3 is the first clear improvement: score 493.2 from 39.5, with s-bend
      progress 0.75 (from 0.04) and oval finish rate 0.85. The change that drove this
      was restoring the 0.05 m lead and cutting yaw inertia through mass 0.6 kg and
      body 0.12 x 0.10 m. The two were applied together, so the split between them
      is unknown. Line loss on the s-bend is 0 and the oval is 0.25 per run, so the
      7-sensor reach at +/-0.06 m is working. The remaining failure is the slalom,
      which finishes 0 of 20 with progress 0.34, line loss 0.35 and max_error 0.0624
      (just above the 0.06 m off-track limit). The oval and s-bend still have off-track
      ends (3 and 14 of 20), and the s-bend max_error is 0.060. The Integrator''s
      rule for this case applies: line loss is 0 on the s-bend and progress is well
      above 0.25, so the geometry is kept and the next lever is turn authority. Body
      width cannot help, because the off-track limit is max(0.06, 0.0125 + body_width/4)
      and stays at 0.06 for any body under 0.19 m. I therefore narrow wheel_track
      from 0.10 to 0.08 m. Turn rate is the wheel speed difference divided by track,
      so the same controller command produces a sharper turn, which targets the slalom''s
      tight alternating bends. Everything else is held (lead 0.05 m, 7 sensors at
      +/-0.06 m, 16 mm footprints, mass 0.6 kg, body 0.12 x 0.10 m), so this iteration
      isolates turn authority. Expected result: slalom progress rises clearly above
      0.34 with fewer off-track ends, and oval and s-bend finish rates hold or improve.
      Main risk: the sharper turn response may raise steering_oscillation, which is
      already 0.44 on the s-bend.


      - [Open this output](iteration-4/entity0/versions/56c0dad477774f2999b2ae89c95733b2/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-90c8f7e6c8a08d90/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-0b9bb3f4bf3b37ed/payload.json)'
  - id: entity1
    label: Restored lead, lighter kd
    notes: 'Builder''s 0.6 kg, 0.12 x 0.10 m geometry at lead 0.05 m, with kd raised
      from 0.2 to 0.6 to damp overshoot. Based on iteration 0''s 0.29 s-bend progress
      and iteration 2''s collapse to 0.04 with zero line loss, which pointed to turn
      response rather than sensing.


      ### Rationale


      Evidence: iteration 0 (lead y=0.05 m, track 0.12 m, mass 0.8 kg) was the best
      run at 79.6, with s-bend progress 0.29. Iteration 1 (lead 0.03 m, track 0.10
      m) and iteration 2 (7 sensors at +/-0.06 m, lead 0.03 m) both fell, to 56.2
      and 39.5. In iteration 2 line loss fell to 0 on the oval and s-bend, yet s-bend
      progress collapsed to 0.04 and max_error stayed at about 0.061 m. So the robot
      leaves the line on bends it can still see, which points to overshoot or too
      little damping rather than sensing. The Builder''s package restores the lead
      to y=0.05 m and cuts yaw inertia by about 45 percent (mass 0.6 kg, body 0.12
      x 0.10 m). Lower inertia makes the robot turn faster for the same command, so
      it can overshoot more. I therefore keep kp 2.0 and base_speed 1.4 unchanged
      so the Builder''s change is what is tested, and raise kd from 0.2 to 0.6 to
      damp the faster turn response. Sensor weights stay proportional to sensor x
      (about 1 per 30 mm), so the signal stays within the +/-2 limit, and line_loss
      stays ''last_direction'', which gave the best result so far. Expected: s-bend
      progress rising toward 0.25 or more and steering_oscillation rising only modestly.
      This is a judgement based on the evidence above, not a measured result. Risk:
      with kd up, edge jitter from the 7-sensor array may increase.


      - [Open this output](iteration-3/entity1/versions/aae5744169f1415690b60ef13f1b8339/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/ed7656872a15461caca9fd62c2be8858/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-9874f3212351d2ec/payload.json)'
  - id: entityR1
    label: Turn-response feedback
    notes: 'Feedback written before racing: restores lead 0.05 m and cites iteration
      0 vs iterations 1 and 2 to show the shorter lead coincided with each drop. Requested
      changes are conditional on the next race''s s-bend progress and line loss.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. Evidence:
      iteration 0 (lead 0.05 m, track 0.12 m, mass 0.8 kg, 5 sensors) reached s-bend
      progress 0.29, the best so far. Iteration 1 (lead 0.03 m, track 0.10 m) dropped
      to 0.18, and iteration 2 (7 sensors at +/-0.06 m, lead 0.03 m) dropped to 0.04
      with line loss 0. Sensing reach is therefore not the limit, and the shorter
      lead has coincided with each drop. This candidate restores the lead to 0.05
      m and lowers yaw inertia, which should help if the failure is overshoot. Because
      lower inertia can also increase overshoot, I added kd 0.6 to the controller
      so the damping is not left to chance. Interpret the next race as follows. If
      s-bend progress reaches 0.25 or more and line_loss_events stays 0, keep this
      geometry and move to a narrower track of 0.08 m to test turn authority. If s-bend
      progress is still below 0.25 with line loss 0, the cause is turn response, not
      geometry, so ask for a lighter-inertia comparison at lead 0.05 m with the track
      unchanged. If line_loss_events rises to 1 or more, the outer sensors are losing
      the tape at this lead, so widen to +/-0.07 m.


      ### Requested changes


      - If s-bend progress reaches 0.25 or more with line_loss_events at 0 and max_error
      still near 0.06 m, try wheel_track 0.08 m with the lead at 0.05 m and mass 0.6
      kg, since iteration 0''s 0.12 m track was not the limit and turn authority is
      the next test.

      - If line_loss_events reach 1 or more on the s-bend or slalom, widen the outer
      sensors to x = +/-0.07 m with 16 mm footprints, since iteration 1 showed loss
      near 0.0565 m offset and iteration 2 showed the 0.06 m edge is still at risk.

      - If s-bend progress stays below 0.25 with line loss at 0 and the lead at 0.05
      m, hold the geometry and report the controller''s kd and base_speed response,
      rather than changing the lead again, since iteration 0 at lead 0.05 m reached
      0.29 and the lead has not been the cause of the drops.


      - [Open this output](iteration-3/entityR1/versions/aae5744169f1415690b60ef13f1b8339/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/ed7656872a15461caca9fd62c2be8858/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-9874f3212351d2ec/payload.json)'
