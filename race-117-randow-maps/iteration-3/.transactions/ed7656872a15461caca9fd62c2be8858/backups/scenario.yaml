  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 1 widened the span to +/-0.036 m and dropped the score to 56.2 from
      79.6. Line loss still happens once per run, and max_error still sits at about
      0.061 m, the 0.06 m off-track floor. The geometry explains this. The tape is
      25 mm wide, so its edge is 12.5 mm from its centre. With 16 mm footprints on
      the outermost sensors at x = +/-0.036 m, the outer footprint edge is at 0.044
      m, so the line is lost once the tape centre is beyond about 0.0565 m. That matches
      the observed failure. Widening to +/-0.040 m would only push the loss point
      to about 0.0605 m, which is marginal. Body width cannot help, because the off-track
      limit is max(0.06, 0.0125 + body_width/4), and that stays at 0.06 for any body
      up to 0.19 m. The change is to widen the outer sensors to x = +/-0.060 m, so
      the tape stays in view to about 0.080 m offset. I am using 7 sensors at 20 mm
      spacing with 16 mm footprints, so the signal stays smooth and the centre resolution
      is kept. I am also keeping wheel_track 0.10 m and mass 0.8 kg, so this iteration
      tests sensing reach alone. Expected result: line_loss_events drop to 0, max_error
      falls below 0.06 m, and progress on the s-bend and slalom rises well above iteration
      1. Risk: the wider 7-sensor span may add steering_oscillation, since the signal
      is now more sensitive to edge crossings.


      - [Open this output](iteration-2/entity0/versions/a591de4b5eb843a4a2a33b202e9feceb/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-7f39abfe432af41c/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-9c9af80fa8c5ed75/payload.json)'
  - id: entity1
    label: Complete Robot Package
    notes: 'Complete Robot Package. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      The Builder''s iteration 2 geometry is seven sensors at x = -0.060 to +0.060
      m (20 mm spacing), 16 mm footprints, y = 0.03 m, wheel_track 0.10 m, mass 0.8
      kg. Iteration 1 measured line loss of 1 per run and max_error of about 0.061
      m on the 72 mm span, so the sensor reach was the first thing to test. I keep
      the controller identical to iteration 1 (kp 2.0, ki 0, kd 0.2, base_speed 1.4,
      last_direction) so that this race isolates the geometry change. The weights
      are proportional to sensor x, scaled to about 1 per 30 mm, so the signal stays
      within the ±2 limit: [-2, -1.333, -0.667, 0, 0.667, 1.333, 2]. Iteration 1 scored
      56.2 against 79.6 in iteration 0. Its s-bend progress fell from 0.29 to 0.18,
      so the narrower track and shorter lead may have cost more than the wider span
      gained. This package therefore tests reach alone, and the next iteration can
      separate the track and lead effects. Expected result: line_loss_events near
      0 and max_error below 0.06 m. The risk is that the seven-sensor signal becomes
      more sensitive to edge crossings and raises steering_oscillation.


      - [Open this output](iteration-2/entity1/versions/43677a8e54204dd996e65348aa7f449e/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/a591de4b5eb843a4a2a33b202e9feceb/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-9c9af80fa8c5ed75/payload.json)'
  - id: entityR1
    label: Integration Feedback
    notes: 'Integration Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Written before this candidate has raced. Iteration 1 (72 mm span, 16 mm footprints,
      lead 0.03 m, track 0.10 m) still had line_loss_events of 1 per run and max_error
      of about 0.061 m on the oval and s-bend. The score fell from 79.6 to 56.2 mainly
      because s-bend progress dropped from 0.29 to 0.18. That suggests the lead or
      track change hurt more than the wider span helped. I had to compensate for the
      wider span by keeping the controller fixed and using weights proportional to
      sensor x, scaled to about 1 per 30 mm. The seven-sensor array raises the risk
      of steering_oscillation because it changes the signal more often at edge crossings.
      Interpret the next race as follows. If line_loss_events fall to 0 and max_error
      stays near 0.061 m, the reach is not the sole cause. Then move to turn authority,
      for example wheel_track 0.08 m. If line_loss_events stay at 1 or more, the reach
      at the outer edge is still too short. In that case try x = ±0.072 m with 16
      mm footprints. If progress on the s-bend stays below 0.25 while line loss is
      zero, restore the lead to y = 0.05 m, because the shorter lead may be reacting
      too late.


      ### Requested changes


      - If line_loss_events are 0 but max_error still reaches about 0.06 m on the
      oval or s-bend, try wheel_track 0.08 m with mass 0.8 kg, since turn authority
      would then be the limit, not sensing.

      - If line_loss_events stay at 1 or more on the s-bend or slalom, widen the outer
      sensors to x = ±0.072 m with 7 sensors at 24 mm spacing and 16 mm footprints,
      because iteration 1 showed loss at about 0.0565 m offset.

      - If the s-bend progress stays below 0.25 with line loss at 0, restore the lead
      to y = 0.05 m, since iteration 0 (lead 0.05 m, track 0.12 m) reached progress
      0.29 on the s-bend and iteration 1''s shorter lead coincided with a drop to
      0.18.


      - [Open this output](iteration-2/entityR1/versions/43677a8e54204dd996e65348aa7f449e/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/a591de4b5eb843a4a2a33b202e9feceb/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-9c9af80fa8c5ed75/payload.json)'
