map:
  id: race-117-randow-maps
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 1 widened the span to +/-0.036 m and dropped the score to 56.2 from
      79.6. Line loss still happens once per run, and max_error still sits at about
      0.061 m, the 0.06 m off-track floor. The geometry explains this. The tape is
      25 mm wide, so its edge is 12.5 mm from its centre. With 16 mm footprints on
      the outermost sensors at x = +/-0.036 m, the outer footprint edge is at 0.044
      m, so the line is lost once the tape centre is beyond about 0.0565 m. That matches
      the observed failure. Widening to +/-0.040 m would only push the loss point
      to about 0.0605 m, which is marginal. Body width cannot help, because the off-track
      limit is max(0.06, 0.0125 + body_width/4), and that stays at 0.06 for any body
      up to 0.19 m. The change is to widen the outer sensors to x = +/-0.060 m, so
      the tape stays in view to about 0.080 m offset. I am using 7 sensors at 20 mm
      spacing with 16 mm footprints, so the signal stays smooth and the centre resolution
      is kept. I am also keeping wheel_track 0.10 m and mass 0.8 kg, so this iteration
      tests sensing reach alone. Expected result: line_loss_events drop to 0, max_error
      falls below 0.06 m, and progress on the s-bend and slalom rises well above iteration
      1. Risk: the wider 7-sensor span may add steering_oscillation, since the signal
      is now more sensitive to edge crossings.


      - [Open this output](iteration-2/entity0/versions/a591de4b5eb843a4a2a33b202e9feceb/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-7f39abfe432af41c/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-9c9af80fa8c5ed75/payload.json)'
  - id: entity1
    label: Wider-span robot package
    notes: 'Builder''s 72 mm span, 16 mm footprint and 0.10 m track are kept as proposed,
      with the controller held at the iteration 0 gains to isolate the geometry change.
      Rests on iteration 0 evidence that line loss at large offsets caused all off-track
      failures.


      ### Rationale


      Iteration 0 raced 60 development trials with no finishes. Every run ended off_track
      with max_error about 0.061 m, while rms_error stayed low (0.023 to 0.030 m).
      Line_loss_events of 1 to 2 per run show the tape left the 48 mm sensor span
      on the largest offsets. Once all sensors lost the line, the fixed fallback let
      the robot drift off. This Builder proposal widens the span to 72 mm (x = ±0.036
      m), enlarges footprints to 16 mm, moves the lead to y = 0.03 m, and narrows
      the wheel track to 0.10 m. I kept the geometry exactly as proposed. The controller
      has to cope with the new geometry, so I made these choices. (1) Sensor weights
      stay proportional to sensor x, [-2, -1, 0, 1, 2]. Each sensor is 18 mm apart,
      so the signal is still a smooth weighted average across the wider span. (2)
      kp stays at 2.0 and kd at 0.2. The narrower track already raises turn rate per
      unit of wheel difference, so more kp would risk oscillation. Changing only geometry
      keeps the test clean. (3) base_speed stays at 1.4, so the speed sweep is not
      confounded with the geometry change. (4) line_loss stays ''last_direction'',
      since the robot should still recover toward the side it last saw the tape. Expected:
      line_loss_events fall toward 0 or 1, max_error drops below 0.06 m on the oval,
      and the finish rate rises above zero. Main risk: the 18 mm spacing with a 16
      mm footprint means the central sensors may see less contrast, so steering could
      become jittery near centre.


      - [Open this output](iteration-1/entity1/versions/3881742dcdc3428f84a8d4898c373d53/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/ca6728b352654e748f1874bb76eccf11/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-90e98f2272392f2d/payload.json)'
  - id: entityR1
    label: Span and track feedback
    notes: 'Conditional feedback: widen the span if line loss persists, or narrow
      the track if the line holds but the robot still leaves. Based on iteration 0''s
      60 trials, where max_error reached about 0.061 m and line_loss_events were 1
      to 2 per run.


      ### Feedback


      Integration notes for this candidate, written before it races. The controller
      is unchanged from the iteration 0 baseline (kp 2.0, kd 0.2, ki 0, base_speed
      1.4, weights [-2,-1,0,1,2]), because the Builder''s change is the only variable
      I want to test. The main thing I had to check is that 18 mm spacing with a 16
      mm footprint still gives a smooth signal. Sensors overlap, so the tape edge
      crosses boundaries less abruptly. Iteration 0 evidence: all 60 trials went off_track
      at max_error about 0.061 m with rms_error only 0.023 to 0.030 m, and line_loss_events
      were 1 to 2 per run, so line loss at large offsets is the dominant failure.
      Interpret the next race as follows. If line_loss_events drop to 0 or 1 and max_error
      falls below 0.06 m, keep the 72 mm span and try the next lever, the lead, by
      testing y = 0.02 m with the same span. If line_loss_events stay at 1 or more
      while max_error still reaches 0.06 m, the sensors are still losing the line,
      so widen to ±0.040 m, or keep the span and move back to 12 mm footprints to
      sharpen the edge. If line_loss is zero but max_error still reaches 0.06 m, the
      cause is turn authority, not sensing, so narrow the wheel track to 0.08 m or
      reduce mass to 0.6 kg.


      ### Requested changes


      - If line_loss_events stay at 1 or more on the s-bend or slalom, widen the sensor
      span to x = ±0.040 m (keeping 5 sensors and 16 mm footprints) to keep the tape
      in view at the 0.06 m offset seen in iteration 0.

      - If line_loss_events reach 0 but max_error still reaches about 0.06 m on the
      tightest bend, narrow wheel_track to 0.08 m or reduce mass to 0.6 kg, since
      iteration 0 showed the robot falls off with the line still visible.

      - If the robot completes with low max_error, test sensor_size 0.012 at the same
      72 mm span to check whether 16 mm footprints blur the edge and raise steering_oscillation,
      since the widened footprint is untested.


      - [Open this output](iteration-1/entityR1/versions/3881742dcdc3428f84a8d4898c373d53/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/ca6728b352654e748f1874bb76eccf11/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-90e98f2272392f2d/payload.json)'
