map:
  id: race-117-randow-maps
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Wider sensors, 0.10 m
    notes: 'Reverts the 0.08 m track, which cut the score from 493 to 356 by lowering
      finish rates, and widens the outer sensors to ±0.07 m to test whether slalom
      line loss (0.35 per run, max_error at 0.0624) comes from sensor reach. Built
      on the iteration-3 geometry, the best result so far.


      ### Rationale


      Iteration 4 narrowed wheel_track from 0.10 to 0.08 m, and the score fell from
      493.2 to 355.9. Oval finish rate dropped from 0.85 to 0.55, s-bend finish from
      0.30 to 0.05 with progress 0.75 to 0.66, and slalom progress from 0.34 to 0.19.
      Steering oscillation on the s-bend rose to 0.45, so the sharper turn was overshooting
      and the narrow track did not help any development track. The track change is
      therefore rejected and wheel_track returns to 0.10 m, the iteration-3 value.
      Iteration 3 is still the best design. Its remaining failure is the slalom, which
      finished 0 of 20 with line_loss_events 0.35 and max_error 0.0624, just over
      the 0.06 m off-track floor. Body width cannot move that floor (max(0.06, 0.0125
      + body_width/4) stays at 0.06 m for any body under 0.19 m). The Integrator''s
      feedback rule for this case (line loss at 0.3 or more with max_error at or above
      0.06 m means the outer sensors are losing the tape at the edge) applies to the
      iteration-3 slalom data. So I widen the outer sensors from x = ±0.06 to ±0.07
      m, keeping 7 sensors and 16 mm footprints, with spacing about 23 mm. Mass 0.6
      kg and body 0.12 x 0.10 m stay as in iteration 3, and lead stays at 0.05 m.
      Expected result: slalom line_loss_events fall toward 0, slalom progress rises
      above 0.34, and oval and s-bend finish rates hold near iteration 3. The risk
      is that the wider span adds steering oscillation, so I ask for the oscillation
      figures to be reported.


      - [Open this output](iteration-5/entity0/versions/dc7f22e0576c454387eaf17c0f10fc46/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-d6c02cca7fd27169/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-1aa78d17d2fb9687/payload.json)'
  - id: entity1
    label: Wider outer sensors v5
    notes: 'Iteration-3 robot with outer sensors widened from +/-0.06 to +/-0.07 m,
      controller and 0.10 m track unchanged. Iteration 3 (493.2) had slalom line loss
      0.35 with max_error at 0.0624, and iteration 4''s narrower track (355.9) was
      rejected.


      ### Rationale


      Evidence: iteration 3 (0.10 m track, 7 sensors at +/-0.06 m, lead 0.05 m, 0.6
      kg, body 0.12 x 0.10 m, kd 0.6) scored 493.2, the best so far. Its s-bend line
      loss was 0 with progress 0.75, and the oval finish rate was 0.85. Iteration
      4 narrowed the track to 0.08 m and scored 355.9. Oval, s-bend and slalom all
      got worse, and s-bend oscillation rose to 0.45, so turn authority is not the
      slalom limit and the 0.10 m track is restored. The slalom still lost the line
      0.35 times per run with max_error 0.0624, just above the 0.06 m off-track floor.
      Body width cannot move that floor. Iteration 1 showed line loss at about 0.0565
      m offset with a 72 mm span, so the outer sensors need more reach. This package
      keeps the iteration-3 controller unchanged (kp 2.0, ki 0, kd 0.6, base_speed
      1.4, last_direction, proportional weights) and moves the outer sensors from
      x = +/-0.06 to +/-0.07 m, with about 23 mm spacing and 16 mm footprints. The
      sensor-reach change is therefore read alone against iteration 3. Expected: slalom
      line_loss_events fall toward 0 and slalom progress rises above 0.34. Risk: the
      wider span may add steering oscillation at edge crossings, so the oscillation
      figures are requested.


      - [Open this output](iteration-5/entity1/versions/dddfd43063424bdabdbf70827cba9f60/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/dc7f22e0576c454387eaf17c0f10fc46/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-1aa78d17d2fb9687/payload.json)'
  - id: entityR1
    label: Reach test feedback
    notes: 'Feedback tied to iteration 4''s rejected 0.08 m track (355.9) and iteration
      3''s slalom line loss, with changes to try depending on whether the slalom line
      loss falls below 0.2. Nothing is stated about this candidate''s result.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. Iteration
      4 (0.08 m track) scored 355.9, down from 493.2 in iteration 3. Oval finish fell
      from 0.85 to 0.55, s-bend finish from 0.30 to 0.05, and s-bend oscillation rose
      to 0.45. The narrower track is therefore overshooting and the 0.10 m track is
      restored. Iteration 3 slalom still had 0.35 line losses per run with max_error
      0.0624, and iteration 1 showed line loss near a 0.0565 m offset. This candidate
      widens the outer sensors to +/-0.07 m with 16 mm footprints. Interpret the next
      race as follows. If slalom line_loss_events fall below 0.2 and slalom progress
      rises above 0.34, keep the reach and test the footprint or sensor-count change
      in the requests below. If slalom line loss stays at 0.3 or more with max_error
      still at or above 0.06 m, reach is not the remaining cause, so do not widen
      further and leave the next change to the controller''s kd or base_speed. If
      s-bend or slalom steering_oscillation rises above about 0.5 (iteration 3 measured
      0.44 on the s-bend), the wider span is adding edge jitter.


      ### Requested changes


      - If slalom line_loss_events fall below 0.2 with progress above 0.34, keep the
      +/-0.07 m span and hold the 0.10 m track, since iteration 4 showed the narrower
      0.08 m track cost 137 points and iteration 3 at 0.10 m was the best result.

      - If slalom line_loss_events stay at 0.3 or more with max_error at or above
      0.06 m, do not widen beyond 0.07 m, since iteration 1 shows reach is no longer
      the limit at that point; instead report the result so the Integrator can adjust
      kd or base_speed.

      - If s-bend steering_oscillation rises above about 0.5 (iteration 3: 0.44) with
      the wider span, try mass 0.5 kg at the same geometry, since iteration 3 showed
      that lowering yaw inertia (mass 0.8 to 0.6 kg with the lead restored) restored
      s-bend progress from 0.04 to 0.75.


      - [Open this output](iteration-5/entityR1/versions/dddfd43063424bdabdbf70827cba9f60/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/dc7f22e0576c454387eaf17c0f10fc46/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-1aa78d17d2fb9687/payload.json)'
