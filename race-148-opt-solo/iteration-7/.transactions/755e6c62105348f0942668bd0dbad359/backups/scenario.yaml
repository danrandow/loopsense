  entities:
  - id: entity0
    label: Lighter, faster robot
    notes: 'Mass cut from 0.6 to 0.5 kg and base_speed raised from 0.9 to 0.95 to
      shorten completion time while keeping line losses low. Based on iteration 6
      (945.4), where lower inertia and mass gave the largest gains and speed was the
      main remaining lever.


      ### Rationale


      Evidence: iteration 6 is the best design at 945.4. Oval, s-bend and slalom all
      finish 20/20 with progress about 0.996 to 0.998 and rms_error 0.006. Remaining
      gaps, in score terms: completion time (oval 1.99 s, s-bend 2.38 s, slalom 2.57
      s, worth 60*(1-t/3) per run, so about 2 points per 0.1 s), line-loss events
      (about 0.3 to 0.5 per run, worth about 15 points each), and steering oscillation.
      Iterations 4 to 5 showed that cutting yaw inertia and mass improved results
      far more than gain changes, and kd is at a plateau. The cleanest next lever
      is a small speed increase, which is the main source of time savings, and a further
      mass reduction, which also helps acceleration and turn-back.


      Changes: (1) mass 0.6 to 0.5 kg, lowering yaw inertia and improving acceleration,
      the same direction as the iteration 4 to 5 change that helped. (2) base_speed
      0.9 to 0.95, a small step to cut completion time by roughly 4 to 5 percent.
      I deliberately avoid a larger step: iteration 1 at base_speed 1.0 with a longer
      body went off track. Sensors, sensor_size 0.016, kp 4.5, ki 0.05, kd 1.0, body,
      wheels and line_loss stay the same, so the effect is attributable to speed and
      mass.


      Hypotheses: (H1) Lower mass lets the robot reach the higher speed without more
      off-track events. (H2) Completion time falls by about 0.1 to 0.15 s on the slalom
      and s-bend, adding roughly 5 to 10 points. Risk: higher speed on slalom could
      raise max_error toward 0.06 and line losses. If line losses rise or any track
      drops below 100 percent completion, the next step is to return base_speed to
      0.9 and keep only the mass change.


      Measurements wanted: completion and completion_time per track, line_loss_events
      and max_error on slalom, and steering_oscillation to check whether the higher
      speed or lighter body adds jitter.


