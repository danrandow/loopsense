  entities:
  - id: entity0
    label: Slower, stronger steering
    notes: 'Cuts base speed to 1.0 and raises kp to 4.0 and kd to 0.6, with sensors
      moved forward and narrowed to +/-0.03 m. Based on zero finishes and off-track
      ends with low oscillation, which points to running wide on bends and losing
      the line.


      ### Rationale


      Evidence from the development race (entityR2A): 0 of 60 trials finished. Every
      run ended off_track, with progress 0.43 on oval, 0.13 on s-bend and 0.08 on
      slalom. Tracking error is small while the robot is on the line (rms about 0.022
      to 0.026 m) and steering oscillation is low (0.13 to 0.25), so the controller
      is not jittering. Max error reaches about 0.06 m, which is the off-track limit,
      and each trial shows about one line-loss event. The robot is drifting wide on
      bends and then losing the tape, not oscillating.


      Hypotheses: (1) At base_speed 1.2 the robot carries too much speed into curves,
      so it runs wide before steering responds. (2) The five sensors span +/-0.04
      m, so on sharp bends the tape can fall outside the outer sensors, which reads
      near zero and triggers a line loss. (3) kp = 3 is too weak to turn back quickly
      once the robot is off-centre.


      Changes: base_speed drops from 1.2 to 1.0 to reduce curve overshoot. kp rises
      from 3.0 to 4.0 for stronger corrective turn. kd rises from 0.3 to 0.6 to damp
      the faster response, since oscillation is currently low and there is room. Sensors
      move forward to y = 0.06 so they see curves earlier, and the lateral spread
      narrows to +/-0.03 m (spacing 0.015 m) so the tape stays under the array on
      sharper bends. Sensor size stays at 0.012 m. Wheel track, radius, mass and body
      stay the same to keep the change attributable to the controller and sensor layout.
      ki stays at 0.05. line_loss stays at last_direction.


      Expected result: fewer line-loss events and a longer distance covered on the
      s-bend and slalom, with progress rising above 0.5 on the oval. Completion is
      still uncertain because the time budget needs about 1.5 m/s average.


      Measurements to check next: progress and completion per track, line_loss_events,
      max_error (is it still hitting 0.06 at the same points?), and steering_oscillation
      (to see whether the higher kp and kd cause jitter). If progress is still low
      with few line losses, the next step is to test base_speed and kp separately.


