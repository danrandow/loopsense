  - id: entity0
    label: Iter 6 design, ki 0.10
    notes: 'Reverts to the best-scoring design (iteration 6, 945.4) and raises ki
      from 0.05 to 0.10 to reduce drift-driven line losses on bends. Kp, kd and geometry
      are unchanged, so the effect of ki can be attributed.


      ### Rationale


      Evidence: iteration 6 (sensor_size 0.016, kp 4.5, kd 1.0, ki 0.05, mass 0.6,
      body_length 0.11) is the best design at 945.42, with 20/20 finishes on all three
      development tracks, progress about 0.996 to 0.998 and rms_error about 0.006.
      Iteration 8 (kp 5.0) scored 945.14, within noise, so higher kp has stopped helping.
      Iteration 9 (kd 1.2) fell to 941.04, with higher oval oscillation, so kd 1.0
      is near its useful limit. Iteration 7 (mass 0.5, base_speed 0.95) was worse,
      so lighter mass and more speed are not the lever.


      Remaining score headroom is small: line_loss_events (about 0.1 to 0.5 per run,
      about 15 points each) and completion time (about 2 points per 0.1 s). Most of
      the gain has already been taken from geometry.


      Change: revert to the iteration 6 design (kp 4.5, kd 1.0, sensor_size 0.016,
      mass 0.6, body_length 0.11, base_speed 0.9) and raise ki from 0.05 to 0.10.
      The aim is to pull the robot back onto the line on the slalom and s-bend drift,
      which should lower line_loss_events and max_error. The integral is clamped at
      +/-2, so windup risk is limited at this value. Everything else is unchanged,
      so the effect of ki is attributable.


      Hypotheses: H1, a small ki reduces the sustained lateral drift on bends (the
      slalom has the highest oscillation and line losses), so line_loss_events falls
      below 0.3. H2, if steering_oscillation or control_effort rises with no line-loss
      gain, ki is past its useful range and the final design should return to ki 0.05.


      Expected result: score about 945 to 950, with completion held at 100 percent
      on all tracks. Measurements wanted: line_loss_events, max_error and completion_time
      per track, and steering_oscillation and control_effort to check that ki adds
      no jitter.


