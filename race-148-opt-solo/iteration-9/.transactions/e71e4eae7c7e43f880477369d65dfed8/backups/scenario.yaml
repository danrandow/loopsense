  entities:
  - id: entity0
    label: kd 1.2 damping test
    notes: 'Keeps the iteration 8 design (kp 5.0, sensor_size 0.016, mass 0.6) and
      raises kd from 1.0 to 1.2 to damp slalom oscillation and line losses. Iterations
      6 and 8 both score about 945, so the plateau suggests damping is the next lever.


      ### Rationale


      Evidence: iteration 6 (kp 4.5) scored 945.42 and iteration 8 (kp 5.0) scored
      945.14. The two are within noise, so raising kp past 4.5 has stopped helping.
      Iteration 7 showed that lighter mass plus higher base_speed cost time and control
      effort, so I am not pursuing speed there. Across the last four iterations the
      score has sat near 941 to 945, which points to a local optimum in the current
      geometry and gain family. Per-track residuals: oval, s-bend and slalom all finish
      20/20 with progress about 0.996. Line_loss_events are 0.25 to 0.5 per run (about
      15 points each), completion time is 2.0 to 2.6 s, and slalom steering_oscillation
      (0.30) and control_effort (6.7 to 7.0) are the highest.


      Change: keep the iteration 8 design (sensor_size 0.016, mass 0.6, body_length
      0.11, base_speed 0.9, ki 0.05, line_loss last_direction) and raise kd from 1.0
      to 1.2. The higher kp of 5.0 may be adding jitter. Extra derivative damping
      should cut slalom oscillation and control effort, and may also reduce the late
      corrections that cause line-loss events. Expected result: steering_oscillation
      down about 10 percent on slalom and s-bend, control_effort down, line_loss_events
      at or below 0.3, and completion held at 100 percent. Score change: small, about
      +0 to +10.


      Hypotheses: H1, slalom line losses come from late corrections on sharp alternations,
      which more damping reduces. H2, if kd 1.2 adds noise-driven jitter on the oval
      (oscillation above about 0.25) with no line-loss gain, kd is past its useful
      range and the next step is to return to kd 1.0 and test ki 0.1 for drift. Measurements
      wanted: completion, completion_time, line_loss_events and max_error per track,
      plus steering_oscillation, control_effort and noise_robustness to check damping
      and noise margin.


