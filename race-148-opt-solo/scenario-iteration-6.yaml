  entities:
  - id: entity0
    label: Larger sensor footprint
    notes: 'Changes only sensor_size from 0.012 to 0.016 m on the iteration 5 design
      (best so far at 938.5). Line-loss events average 0.4 to 0.7 per run and are
      the largest remaining score loss, so wider sensor coverage is tested as the
      cause.


      ### Rationale


      Evidence from iteration 5 (score 938.5, best so far): oval, s-bend and slalom
      all finish 20/20, with progress about 0.996 to 0.998 and rms_error 0.004 to
      0.007. The remaining score gap is in three places. (a) Line-loss events average
      0.4 to 0.7 per run, and each event costs up to 15 points per unit progress (up
      to about 120 points in total). (b) Completion time is 2.2 to 2.7 s, which is
      worth at most 60 points. (c) Slalom has the highest steering_oscillation (0.30)
      and control_effort (6.7). Iteration 4 to 5 showed that reducing yaw inertia
      and mass helped a lot, while raising kd from 0.8 to 1.0 changed little. Controller
      gains and body geometry are therefore close to a local optimum, and the most
      promising untested lever is sensing coverage.


      Change: sensor_size 0.012 to 0.016 m. Larger footprints cover more of the 25
      mm tape at each sensor position, so the sum of readings should fall below the
      0.05 line-loss threshold less often on fast transitions or at the tape edge.
      Sensor positions (x = -0.03 to 0.03 at y = 0.06), weights, gains, base_speed,
      body, wheels, mass and line_loss are all unchanged, so the effect of this one
      change can be attributed. The trade-off is a coarser signal near the centre
      of the line, which could add a little steering jitter. Iteration 3 showed that
      widening the array hurt, but that changed spacing and reach, not footprint size,
      so it does not rule this out.


      Expected result: line_loss_events falling from about 0.5 to under 0.2 on each
      track, with oval, s-bend and slalom completion staying at or near 100 percent.
      Score rising by roughly 20 to 50 points. If line losses do not fall, the cause
      is not footprint coverage, and the next test is either base_speed 1.0 for time
      or a small ki for drift on slalom.


      Hypotheses to check: H1, line losses come from the tape leaving the sensor footprint
      at the array edges, so a larger footprint reduces them. H2, the remaining slalom
      oscillation comes from the signal over-responding at the tape edge. Measurements
      wanted: line_loss_events, completion_time and max_error per track, plus steering_oscillation
      and control_effort to see whether the coarser footprint adds jitter.


