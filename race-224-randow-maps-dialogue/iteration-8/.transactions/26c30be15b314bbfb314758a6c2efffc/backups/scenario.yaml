map:
  id: race-224-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: ±0.04 m row, 16 mm, kp1.2
    notes: 'Widens the sensor row to ±0.04 m at 16 mm, y = 0.04, with the Integrator''s
      kp 1.2 controller, so the widening is tested alone. It extends the coverage
      edge to about 0.0605 m, which the line-loss evidence points to, and is the untested
      step after iteration 4''s confounded result.


      ### Rationale


      Iteration 7 held the best-raced geometry (±0.03 m, 16 mm, y = 0.04). Its controller
      restore is confirmed at 69.46 (iterations 3, 5, 6, 7 all match), so the simulator
      is deterministic for this layout and the 0.06 m off-track limit is the binding
      failure. Max error sits near 0.062 m on every track, and line loss stays at
      1.0 to 1.1 events per run. Iteration 4 changed the row to ±0.04 m and kp to
      1.0 together, and the score fell to 61.49. The Integrator''s feedback reads
      that as mainly a gain effect, and I agree the widening was never tested alone.
      The Integrator has restored kp 1.2 and kd 0.4 and asked for the ±0.04 m row
      at 16 mm, y = 0.04, at that gain. I am taking that advice now, because it is
      the one untested geometry question and the controller is already tuned for a
      row of this kind. The outer footprint edge reaches about 0.0605 m offset (0.0125
      + 0.008 + 0.04), against about 0.0505 m for ±0.03 m, which should move coverage
      loss to the limit itself. Wheels, body and mass are unchanged, so any change
      in score comes from the row alone. I expect progress above 0.21 on the s-bend
      with line loss below 1.0 if coverage was the limit. If line loss stays at 1.0
      or more, the next test is a 12 mm footprint at the same spacing, to check for
      16 mm edge noise. I am not moving the row forward, because slalom oscillation
      has stayed at 0.145 to 0.147, below the 0.15 trigger.


      - [Open this output](iteration-8/entity0/versions/36416308003f4d04a1f8de5109bb3263/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-296cb64ece1d01f5/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-1fb1119f78dd3564/payload.json)'
  - id: entity1
    label: Confirm best controller
    notes: 'Holds the best-raced ±0.03 m, 16 mm row and restores kp 1.2 / kd 0.4 /
      base_speed 1.1. Iterations 3 and 5 gave the same score, so the expected result
      is about 69.46, which confirms the iteration 4 drop was the gain.


      ### Rationale


      The Builder has held the best-raced geometry (±0.03 m row, 16 mm footprint,
      y = 0.04, wheels, body and mass unchanged). I am restoring the controller that
      produced the best score: kp 1.2, kd 0.4, base_speed 1.1, ki 0, last_direction
      line loss. Iteration 3 scored 69.46, iteration 5 reproduced it exactly, and
      iteration 6 ran the same package. The simulator is deterministic for a fixed
      geometry and controller, so this race should return about 69.46 with max error
      near 0.062 m and line loss at 1.0 to 1.1 events per run. Its purpose is to confirm
      the restored controller and separate the iteration 4 drop, which came from a
      gain change combined with a row widening. I am not changing kd, base_speed or
      the signal weights, because any change would confound the controller check and
      the Builder''s next geometry test. Slalom oscillation (0.145 to 0.147) is below
      the 0.15 trigger, so I am not moving the row forward. Off-track at about 0.06
      m is the binding failure, and no controller change tested so far has removed
      it.


      - [Open this output](iteration-7/entity1/versions/08ad3aa5991f4cd18afc292495980347/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/5da2f19edca04a4c9940d26330fe12b5/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-1fb1119f78dd3564/payload.json)'
  - id: entityR1
    label: Hold row, test ±0.04 next
    notes: 'Feedback before racing: the candidate repeats the best geometry with the
      restored controller, so no new best is expected. Next, test the ±0.04 m row
      at kp 1.2 on its own, then 12 mm if line loss persists, citing iterations 3,
      4, 5 and 6.


      ### Feedback


      Written before this candidate races. The candidate is the ±0.03 m, 16 mm, y
      = 0.04 row, which is the best-raced geometry (iteration 3, 69.46, reproduced
      in iteration 5). I am restoring the controller that produced it (kp 1.2, kd
      0.4, base_speed 1.1). Iteration 4 (61.49) changed kp to 1.0 and widened the
      row to ±0.04 m in the same race. Progress fell on the s-bend (0.210 to 0.160)
      and oval (0.184 to 0.170), and line loss stayed at 1.0 per run, so the gain
      change is the more likely cause. The ±0.04 m row has therefore not been tested
      at kp 1.2 on its own. Line loss persists at 1.0 to 1.1 events per run and max
      error sits near 0.062 m on every track, so the 0.06 m off-track limit is still
      the binding failure. Do not expect a new best score from this candidate. It
      is a confirmation race.


      ### Requested changes


      - Next iteration, race the ±0.04 m row at 16 mm with y = 0.04 at kp 1.2 and
      kd 0.4. This isolates the widening from the gain change that confounded iteration
      4.

      - If the ±0.04 m row at kp 1.2 still gives line loss of 1.0 or more per run,
      test a 12 mm footprint at the same ±0.04 m spacing, to check whether 16 mm edge
      noise adds s-bend oscillation (iteration 3 s-bend oscillation was 0.168).

      - Keep y = 0.04 unless slalom steering oscillation reaches 0.15 or more. It
      has stayed at 0.145 to 0.147 across all row tests so far.


      - [Open this output](iteration-7/entityR1/versions/08ad3aa5991f4cd18afc292495980347/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/5da2f19edca04a4c9940d26330fe12b5/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-1fb1119f78dd3564/payload.json)'
