map:
  id: race-224-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Evidence from iteration 2 (60 trials, all off track, no finishes): progress
      0.11 to 0.19, one to two line-loss events per run, max error about 0.06 m. That
      is the off-track limit for body_width 0.12, max(0.06, 0.0125 + 0.12/4) = 0.06,
      and body width cannot relax it within the allowed range. The robot therefore
      loses the line before it stalls, and coverage at the row edge is the open question.
      Iteration 2 raised the score from 57.1 to 63.9 and cut slalom oscillation from
      0.150 to 0.145, so the controller change helped. The Integrator''s advice was
      to hold geometry for this race, which I did. Their rule for the next change
      was: if line loss persists after progress 0.1, widen the row to x = ±0.03 with
      16 mm sensors. Line loss on the s-bend (2 events, progress 0.19) and oval (1
      event, progress 0.18) comes after progress 0.1 at the end of the run, so I am
      taking that step. Their second trigger, a forward offset when slalom oscillation
      is at or above 0.15, is not met (0.145), so I am not moving the row forward.
      Coverage check: a 16 mm footprint at x = ±0.03 keeps tape under the outer sensor
      until the robot centre is offset by about 0.0125 + 0.008 + 0.03 = 0.0505 m,
      against about 0.0385 m for the current row. That gives roughly 1.2 cm more warning
      before the 0.06 m limit. I am keeping the 5-sensor count, y = 0.04, wheel, body
      and mass unchanged, so the Integrator''s controller is judged on one geometry
      change only. Expected result: fewer line-loss events past progress 0.1, and
      max error that stays under 0.06 for longer. A finish is still not expected this
      iteration.


      - [Open this output](iteration-3/entity0/versions/f9b0481908514b1d8ec25925d0d07b3a/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-d3ea61f5e45da150/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-cf9db2fe29c416ed/payload.json)'
  - id: entity1
    label: Slower, damped controller
    notes: 'Holds the iteration 2 geometry and lowers kp to 1.0, raises kd to 0.4
      and reduces base_speed to 1.1. Based on the flat 0.155 progress stall on the
      oval and s-bend, and the small slalom oscillation drop in iteration 1.


      ### Rationale


      Iteration 1 gave 57.11 against 51.09 for iteration 0, so the narrower row helped
      a little. Progress still stopped at 0.155 on the oval and s-bend, the same value
      on both tracks, and every run went off track at max error about 0.063. The slalom
      oscillation barely moved (0.150 against 0.153), so the row narrowing and the
      forward move from y=0.06 to y=0.04 did not fix the oscillation. Iteration 1
      also changed the controller (kp 2.0 to 1.2, kd 0.2 to 0.3, base_speed 1.6 to
      1.3), so the race does not separate the two causes. The identical stall progress
      across tracks suggests a fixed failure point early in the course rather than
      a shape-specific one. I keep the Builder''s iteration 2 geometry unchanged,
      as the Builder intended, so this race judges the controller alone. For the controller,
      I lower kp to 1.0 to reduce the steering response to the slalom''s sharp reversals,
      raise kd to 0.4 for damping, and lower base_speed to 1.1 to reduce drift when
      the robot enters a bend at speed. ki stays at 0 to avoid windup, and line_loss
      stays last_direction. Expected result: steering oscillation on the slalom below
      0.15, and the first line loss later in progress than 0.155. I do not expect
      completion yet. The race should show whether the stall point moves with speed;
      if it does not, the cause is the sensor coverage edge, not the gains.


      - [Open this output](iteration-2/entity1/versions/30863784008f43dface84689a0c5b0eb/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/c32118fa9b2a4894982cc1a148ddd069/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-e34a2ed296d9ef5d/payload.json)'
  - id: entityR1
    label: Hold row, test wider next
    notes: 'Holds the geometry for this race and makes the next geometry step conditional
      on the progress at the first line loss. Cites iteration 1 results, where the
      narrow row raised score to 57.1 but left the 0.155 stall and off-track endings.


      ### Feedback


      Iteration 1 (narrow row at plus or minus 0.02 m, y=0.04, 12 mm) scored 57.11,
      up from 51.09 at iteration 0, but the stall progress stayed at 0.155 on the
      oval and s-bend, and every run still went off track at max error about 0.063.
      Slalom oscillation fell only from 0.153 to 0.150. So narrowing the row and moving
      it forward did not change oscillation much; the controller change was also in
      that race, so the two effects are confounded. The off-track limit of 0.06 m
      is still the binding failure. Based on this evidence, I recommend holding the
      geometry for iteration 2 so the new controller is judged on it. For the next
      geometry, the key open question is coverage. With a 12 mm footprint on the narrow
      row, the last sensor sees tape only until an offset of about 0.038 m, so the
      robot gets little warning before the 0.06 m limit. If the next race shows line
      loss at progress above 0.1 on a bend, try a wider row. If it shows line loss
      near progress 0, the coverage edge is not the cause, and the geometry should
      not change.


      ### Requested changes


      - Hold sensor_positions, sensor_size and wheel geometry for iteration 2, so
      the controller change is measured on a known platform. Next iteration, if line
      loss still appears after progress 0.1, try a wider row at x = plus or minus
      0.03 m with sensor_size 0.016 (reach about 0.05 m), which gives more warning
      before the 0.06 m limit.

      - If the next race shows slalom steering oscillation still at or above 0.15
      with the geometry held, try a forward offset of y = 0.02 with the same row.
      Iteration 1 moved the row from y=0.06 to y=0.04 and oscillation barely changed,
      so this is a second, smaller step; do not expect it to fix the oscillation alone.

      - Ask the Integrator to report the progress at the first line-loss event on
      each track, and the max error at that moment. This separates coverage-edge loss
      from controller overshoot.


      - [Open this output](iteration-2/entityR1/versions/30863784008f43dface84689a0c5b0eb/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/c32118fa9b2a4894982cc1a148ddd069/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-e34a2ed296d9ef5d/payload.json)'
