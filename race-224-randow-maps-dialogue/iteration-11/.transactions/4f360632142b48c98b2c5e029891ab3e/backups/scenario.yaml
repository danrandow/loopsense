  id: race-224-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: 'Final: hold 12mm ±0.03'
    notes: 'Holds the iteration 10 layout (12 mm sensors at ±0.03 m, y = 0.04), the
      best raced design at 74.80. The 12 mm footprint cut s-bend oscillation from
      0.168 to 0.140, but slalom oscillation rose to 0.246, and I did not move the
      row forward because that change was never tested cleanly and the final race
      is unseen.


      ### Rationale


      This is the final iteration, and the design delivered here races on the unseen
      final track, so the choice is about the most reliable layout rather than another
      experiment. The best raced design is iteration 10: a 12 mm footprint on the
      ±0.03 m row at y = 0.04, which scored 74.80, the best of the run. Its per-track
      results were oval 72.63, s-bend 77.39 and slalom 74.39, with slalom min 55.39.


      The 12 mm footprint answered the open question. S-bend steering oscillation
      fell from 0.168 to 0.140 with progress held at 0.188 to 0.210 and no loss of
      score, which supports the edge-noise hypothesis for 16 mm. The cost is reach:
      the outer sensor now covers offsets only to about 0.0485 m, against 0.0505 m
      at 16 mm. Max error still sits at about 0.062 m on every track, so the 0.06
      m off-track limit remains the binding failure, and body width cannot change
      it within range.


      The slalom is the weak point. Steering oscillation rose to 0.246, above the
      0.15 trigger I set for a forward offset, and line loss averaged 1.95 per run.
      I considered moving the row forward to y = 0.02 or 0.03. I did not, because
      that trigger was written for a single-variable test that has never been run
      cleanly: the only forward-offset comparison (iteration 0 against 1) also changed
      the row width. Moving the sensors now would be an untested change applied to
      the final unseen-track race, where a regression would score directly. The proven
      74.80 layout is the safer delivery.


      I am therefore holding the iteration 10 geometry exactly. This keeps the Integrator''s
      controller, tuned for this layout, on the platform it was built for, and gives
      the final race the best measured floor.


      - [Open this output](iteration-11/entity0/versions/5ecaf480c9da43c9a422665ba519fee3/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-659b4d0a1fdc991a/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-0e5b353f5ac1f056/payload.json)'
  - id: entity1
    label: 12mm footprint test
    notes: 'Changes only the sensor footprint from 16 mm to 12 mm on the best-raced
      ±0.03 m row, keeping the kp 1.2 / kd 0.4 controller that scored 69.46. Tests
      whether 16 mm edge noise raises s-bend oscillation (0.168 at iteration 3).


      ### Rationale


      The Builder changes one thing: the sensor footprint goes from 16 mm to 12 mm,
      with the same five sensors at x = -0.03 to 0.03 in 0.015 m steps and y = 0.04.
      The best raced layout is this row at 16 mm (iteration 3, 69.46, reproduced exactly
      in iterations 5, 6, 7 and 9). Every race ends off track at max error about 0.062
      m, so the 0.06 m limit is the binding failure. Iteration 3 also showed s-bend
      steering oscillation rising to 0.168 at 16 mm. The Builder''s hypothesis is
      that 16 mm edge noise causes this. I test it by changing only the footprint
      and keeping the controller that produced 69.46 (kp 1.2, kd 0.4, base_speed 1.1,
      ki 0, last_direction, weights -1, -0.5, 0, 0.5, 1). Changing the gains now would
      confound the footprint result. The signal is a reading-weighted average, so
      its scale should stay similar at 12 mm. Edge sharpness may still shift the response
      slightly, so I will judge the gain question only after this race. Coverage falls
      from about 0.0505 m to about 0.0485 m, so warning before the limit shrinks a
      little. I am not moving the row forward because slalom oscillation has stayed
      at 0.145 to 0.147, below the 0.15 trigger. I expect no new best score from this
      package. I make no claim about how it will score.


      - [Open this output](iteration-10/entity1/versions/1936fa96a5534b4793ae49a9b4b7067f/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/88b1e0284eee4edf8ae77ded6925c413/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-1fb1119f78dd3564/payload.json)'
  - id: entityR1
    label: Feedback on 12mm test
    notes: 'Feedback written before the race, citing the 69.46 best at 16 mm (iterations
      3 to 9) and the ±0.04 m result at iteration 8. Gives the 16 mm fallback if the
      score drops below 69.46 and asks the Builder to keep the gains fixed.


      ### Feedback


      Written before this candidate races. Evidence from earlier iterations: the ±0.03
      m row at 16 mm with kp 1.2 and kd 0.4 is the best raced design, at 69.46 in
      iterations 3, 5, 6, 7 and 9, so the simulator is deterministic for this layout
      (iteration 3). Max error sits near 0.062 m on every track, so the off-track
      limit is still the binding failure (iterations 3 to 9). Iteration 3 showed s-bend
      oscillation rising to 0.168, so your edge-noise hypothesis is reasonable. The
      12 mm test at ±0.02 m (iteration 2, 63.85) was a different row and cannot isolate
      this. Iteration 8 showed that ±0.04 m at kp 1.2 scores 61.35 (iteration 8, which
      matches iteration 4 per track), so the wider row is worse on its own. I have
      held the controller at kp 1.2, kd 0.4 and base_speed 1.1. I did not change gains
      for the smaller footprint in this race, so the footprint effect can be read
      directly. Do not expect a new best from this candidate. Your reach estimate
      of about 0.0485 m is consistent with the iteration 2 and 3 coverage evidence.
      When this race reports, read s-bend oscillation against 0.168 and s-bend progress
      against 0.210, and count line-loss events against the 1.0 to 1.1 per run seen
      at 16 mm.


      ### Requested changes


      - If the score falls below 69.46 or line loss rises above 1.1 per run, return
      to the 16 mm footprint at x = ±0.03 m, y = 0.04 (iteration 3 layout), since
      the 12 mm reach of about 0.0485 m is then the limit.

      - If s-bend steering oscillation falls below 0.168 with s-bend progress held
      near 0.21, keep 12 mm at ±0.03 m as the candidate for the final design, and
      hold the Integrator''s kp 1.2 and kd 0.4 without changes.

      - If the next race shows a stronger response to edge changes (steering oscillation
      rising on the slalom above 0.15), do not move the row forward on this evidence
      alone. Hold the footprint and report the slalom oscillation, since the forward
      offset trigger has not been met at any row tested.


      - [Open this output](iteration-10/entityR1/versions/1936fa96a5534b4793ae49a9b4b7067f/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/88b1e0284eee4edf8ae77ded6925c413/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-1fb1119f78dd3564/payload.json)'
