map:
  id: race-224-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Row widened to ±0.04 m
    notes: 'Widens the 16 mm sensor row from ±0.03 to ±0.04 m (0.02 m spacing) to
      move the coverage edge to about 0.0605 m, following the Integrator''s rule for
      persistent line loss after progress 0.1. Iteration 3 scored 69.46, with line
      loss still at about 1 per run and max error at 0.062 m.


      ### Rationale


      Iteration 3 (±0.03 m row, 16 mm sensors) raised the score from 63.85 to 69.46,
      with progress up on the oval (0.184) and s-bend (0.210). Every run still ended
      off track at max error about 0.062 m, so the off-track limit remains the binding
      failure. Line loss persisted on all three tracks (1.0 to 1.1 events per run),
      and the s-bend showed the loss after progress 0.1. Slalom oscillation held at
      0.145, below the 0.15 trigger, but s-bend oscillation rose from 0.139 to 0.168,
      and the footprint-noise caveat from the Integrator is a live possibility.


      I took the Integrator''s advice on the widening step. Their rule was: if line
      loss persists after progress 0.1, widen the row toward ±0.04 m at 16 mm, keeping
      the outer footprint clear of the 0.06 m limit. That condition is met. Coverage
      check: the outer sensor sees tape until the centre offset is about 0.0125 +
      0.008 + 0.04 = 0.0605 m, against about 0.0505 m for the current row. The current
      reach is below the observed max error of 0.062 m, which is consistent with the
      line being lost just before the robot leaves the track. The wider row should
      move the loss point to the limit itself.


      I kept five sensors and y = 0.04 so the Integrator''s controller stays valid,
      with spacing widened from 0.015 m to 0.02 m. I did not move the row forward,
      because slalom oscillation is still below 0.15. I did not change the wheels,
      body or mass.


      I am not narrowing the row. The Integrator''s rule is to lower kp before narrowing,
      so if s-bend oscillation stays above about 0.16 with the wider row, that is
      a controller task, not a geometry one.


      - [Open this output](iteration-4/entity0/versions/0ec1e53de16e4b4c8fe18145b1ae03fc/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-51bbd084db888bad/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-1fb1119f78dd3564/payload.json)'
  - id: entity1
    label: ±0.04 row, kp 1.0
    notes: 'Widens the 16 mm sensor row to ±0.04 m to extend coverage toward the 0.06
      m limit, and lowers kp to 1.0 because s-bend oscillation reached 0.168 in iteration
      3. Based on the race evidence from iterations 2 and 3.


      ### Rationale


      Iteration 3 (sensors at ±0.03 m, 16 mm, y=0.04, kp 1.2, kd 0.4, base_speed 1.1)
      scored 69.46, the best so far. Progress rose on the oval (0.184) and s-bend
      (0.210), but line loss persisted at 1.0 to 1.1 events per run. Max error stayed
      near 0.062 m on every track, so the off-track limit is still the binding failure.
      S-bend steering oscillation rose from 0.139 to 0.168, above the 0.16 trigger
      that the Builder and I agreed on, so the controller must lower kp before the
      row is narrowed. Slalom oscillation held at 0.145, below the 0.15 forward-offset
      trigger. This candidate widens the row to ±0.04 m at 16 mm with 0.02 m spacing,
      as the Builder''s geometry specifies. The outer sensor then keeps tape in view
      to an offset of about 0.0605 m, against about 0.0505 m before. Because the wider
      spacing halves the signal slope per metre (about 33/m to about 25/m at equal
      weights), keeping kp at 1.2 would give a softer response than iteration 3. I
      still lower kp to 1.0, following the rule that oscillation above 0.16 calls
      for a kp reduction, and I accept some risk of softer steering on the bends.
      Weights, kd 0.4, base_speed 1.1, ki 0 and last_direction line loss are unchanged,
      so the race isolates the geometry widening plus the kp step. I expect line-loss
      events to fall below one per run on the s-bend and oval, and s-bend oscillation
      to fall back toward 0.16 or below. I do not expect completion.


      - [Open this output](iteration-4/entity1/versions/0206e0393ed641bda5c2ea7d833da4c1/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/0ec1e53de16e4b4c8fe18145b1ae03fc/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-1fb1119f78dd3564/payload.json)'
  - id: entityR1
    label: Pre-race feedback on
    notes: 'Cites iteration 3 (69.46) and its persistent line loss and s-bend oscillation
      above 0.16. Recommends holding the wider row and gives the next steps depending
      on whether the race shows line loss or oscillation.


      ### Feedback


      Written before this robot races. Iteration 3 (±0.03 m at 16 mm, kp 1.2) scored
      69.46, up from 63.85 at iteration 2. Progress rose on the oval (0.184) and s-bend
      (0.210), and line loss persisted at 1.0 to 1.1 events per run. Max error held
      near 0.062 m on every track, so the off-track limit is still the binding failure.
      S-bend oscillation rose to 0.168, while slalom oscillation held at 0.145. Your
      ±0.04 m row at 16 mm extends the coverage edge to about 0.0605 m, which is the
      direction the line-loss evidence supports. I have lowered kp to 1.0, because
      the wider spacing shallows the steering slope and the s-bend oscillation exceeded
      the 0.16 trigger. Do not expect a result from the current candidate. When it
      races, read line-loss events after progress 0.1 on the s-bend and oval, and
      s-bend oscillation. If line loss moves past the 0.06 limit or disappears, hold
      the ±0.04 row. If s-bend oscillation is still above 0.16 at this gain, the 16
      mm footprint is probably adding edge noise, so try a 12 mm footprint with the
      same spacing.


      ### Requested changes


      - Hold sensor_positions at x = -0.04 to 0.04 in 0.02 m steps, y = 0.04, sensor_size
      0.016, for the next race, so the controller is judged on the coverage change.

      - If s-bend oscillation stays above 0.16 at kp 1.0 with the wider row, try sensor_size
      0.012 at the same positions to test whether 16 mm footprint noise is the cause.

      - Keep the forward offset at y = 0.04 unless slalom oscillation reaches 0.15
      or more. If line loss begins near progress 0 rather than on bends, hold the
      geometry and ask the Integrator to examine start-up speed and entry gain.


      - [Open this output](iteration-4/entityR1/versions/0206e0393ed641bda5c2ea7d833da4c1/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/0ec1e53de16e4b4c8fe18145b1ae03fc/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-1fb1119f78dd3564/payload.json)'
