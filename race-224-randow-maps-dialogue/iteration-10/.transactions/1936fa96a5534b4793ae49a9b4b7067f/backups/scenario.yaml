map:
  id: race-224-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: 12 mm footprint test
    notes: 'Keeps the best-raced ±0.03 m row at y = 0.04 but shrinks the sensor footprint
      from 16 mm to 12 mm, to test whether 16 mm edge noise drives the s-bend oscillation
      (0.168). The ±0.04 m row was already tested at kp 1.2 and scored 61.35, so it
      is not repeated.


      ### Rationale


      Evidence across iterations 0 to 9 is consistent. The ±0.03 m row at 16 mm with
      y = 0.04 is the best-raced geometry: 69.46 in iterations 3, 5, 6, 7 and 9, identical
      each time, so the simulator is deterministic for this layout. Every race ends
      off track at max error about 0.062 m, against the 0.06 m limit. Body width cannot
      relax that limit inside its allowed range, and line loss stays at 1.0 to 1.1
      events per run. The ±0.04 m row was tested at kp 1.2 in iteration 8 and scored
      61.35, so widening is worse on its own, not only at kp 1.0. The open question
      the Integrator raised is whether 16 mm footprint edge noise adds s-bend steering
      oscillation (0.168 at iteration 3). I am taking the Integrator''s conditional
      advice: their feedback says to test a 12 mm footprint at the same ±0.03 m spacing
      if s-bend oscillation stays high. It does, so I am making that change now. The
      trade-off is reach: a 12 mm footprint at x = ±0.03 covers offsets only to about
      0.0485 m, against about 0.0505 m for 16 mm, so I expect some loss of warning
      before the limit. I am not moving the row forward, because slalom oscillation
      has stayed at 0.145 to 0.147, below the 0.15 trigger. I am keeping wheels, body
      and mass fixed. I am not repeating the known 16 mm best this iteration, because
      I have two iterations left and need evidence on whether the footprint is the
      cause before I commit the final design. If the 12 mm row does not beat 69.46,
      the next iteration returns to 16 mm, which is the known floor.


      - [Open this output](iteration-10/entity0/versions/88b1e0284eee4edf8ae77ded6925c413/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-b0bf15c8b90a473d/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-1fb1119f78dd3564/payload.json)'
  - id: entity1
    label: Confirm best row, kp 1.2
    notes: 'Holds the ±0.03 m, 16 mm, y = 0.04 geometry with kp 1.2, kd 0.4, base_speed
      1.1. This package scored 69.46 in iterations 3, 5, 6 and 7, so the expected
      result is about 69.46 with no new best.


      ### Rationale


      The best raced design is the ±0.03 m row at 16 mm with y = 0.04, kp 1.2, kd
      0.4 and base_speed 1.1. It scored 69.46 in iterations 3, 5, 6 and 7, so the
      simulator is deterministic for this package. The Builder has reverted the geometry
      to that row, and I hold the controller unchanged so this race confirms the best-supported
      package. Every run still ends off track near max error 0.062 m, against the
      0.06 m limit, and line loss stays at 1.0 to 1.1 events per run. Iteration 4
      changed kp to 1.0 and widened the row together, and that is the only race that
      drops below 69, so I keep kp at 1.2. The steering weights (-1, -0.5, 0, 0.5,
      1) are unchanged and ki stays at 0 to avoid windup. Expected result: about 69.46,
      with no new best. I make no other claim about this package.


      - [Open this output](iteration-9/entity1/versions/548645c7f32f4e2c8454e4393ee1a635/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/f0dd288eff5f47149896b505743e588a/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-153798c1aef556aa/payload.json)'
  - id: entityR1
    label: Hold row, test ±0.04 next
    notes: 'Asks the Builder to hold the best row now and test ±0.04 m at kp 1.2 next.
      Iteration 4 changed gain and row together and scored 61.49, so the widening
      is still untested alone.


      ### Feedback


      Written before this candidate races. The candidate is the ±0.03 m, 16 mm, y
      = 0.04 row, the best-raced geometry at 69.46 (iteration 3, reproduced in iterations
      5 to 7). I have held kp 1.2, kd 0.4 and base_speed 1.1. Iteration 4 (61.49)
      changed kp to 1.0 and widened the row to ±0.04 m in the same race, and progress
      fell on the s-bend (0.210 to 0.160) and oval (0.184 to 0.170) with line loss
      unchanged at 1.0. So the ±0.04 m row has still not been tested at kp 1.2 alone.
      Do not expect a new best from this candidate. When the race reports, check whether
      line loss and max error match iteration 3 (max error near 0.062 m, line loss
      1.0 to 1.1 per run). If they do, the next geometry step is the isolating ±0.04
      m test at kp 1.2, which is your planned iteration 10 test.


      ### Requested changes


      - Hold sensor_positions at x = -0.03 to 0.03 in 0.015 m steps, y = 0.04, sensor_size
      0.016, for this race, so the controller is judged on the geometry it was tuned
      for.

      - Next iteration, race ±0.04 m at 16 mm with y = 0.04 at kp 1.2 and kd 0.4 to
      isolate the widening from the gain change that confounded iteration 4.

      - If s-bend steering oscillation stays at 0.16 or above with the ±0.03 m row,
      try sensor_size 0.012 at the same ±0.03 m positions to test whether 16 mm footprint
      noise is the cause.


      - [Open this output](iteration-9/entityR1/versions/548645c7f32f4e2c8454e4393ee1a635/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/f0dd288eff5f47149896b505743e588a/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-153798c1aef556aa/payload.json)'
