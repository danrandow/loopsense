map:
  id: race-224-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Evidence across iterations 0 to 8 points to one conclusion. The ±0.03 m row
      at 16 mm with y = 0.04 is the best-raced geometry (69.46 in iterations 3, 5,
      6 and 7, identical each time, so the simulator is deterministic for this layout).
      Every race ends off track at max error about 0.062 m, against the 0.06 m limit.
      Body width cannot relax that limit inside its allowed range, since the limit
      only exceeds 0.06 m above 0.19 m width. Line loss stays at 1.0 to 1.1 events
      per run.


      The ±0.04 m row has now been tested at kp 1.2 with kd 0.4, which is the isolating
      test the Integrator asked for. Iteration 8 scored 61.35, with progress 0.17
      on the oval, 0.16 on the s-bend and 0.116 on the slalom, and its per-track metrics
      match iteration 4 almost exactly. So the widening is worse on its own, not only
      at kp 1.0. The gain change was not the sole cause. I therefore do not take the
      Integrator''s request to hold ±0.04 m for another race, because that race would
      repeat a result already measured. The Integrator''s feedback calls iteration
      9 an isolating test, but iteration 8 already ran it.


      I am reverting to the best-raced row: five sensors at x = -0.03 to 0.03 in 0.015
      m steps, y = 0.04, 16 mm footprint. Wheels, body and mass are unchanged. This
      is the layout the Integrator''s kp 1.2 / kd 0.4 controller was tuned for. Expected
      result is about 69.46, with no new best. This keeps the score floor secure while
      the remaining iterations test one open geometric question. Slalom oscillation
      has stayed at 0.145 to 0.147, below the 0.15 trigger, so I am not moving the
      row forward.


      - [Open this output](iteration-9/entity0/versions/f0dd288eff5f47149896b505743e588a/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-6eeb836c95eb070b/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-153798c1aef556aa/payload.json)'
  - id: entity1
    label: ±0.04 m row, kp 1.2 test
    notes: 'Complete robot with the ±0.04 m, 16 mm row and the restored kp 1.2 / kd
      0.4 controller, so the row is tested alone against iteration 3''s 69.46. Iteration
      4''s drop was confounded by a gain change, which this run removes.


      ### Rationale


      Evidence: the best raced design is the ±0.03 m row at 16 mm, y = 0.04, with
      kp 1.2, kd 0.4, base_speed 1.1 (iteration 3, 69.46, reproduced exactly in iterations
      5, 6 and 7). Every track ends off track at max error about 0.062 m, and line
      loss stays at 1.0 to 1.1 events per run. Iteration 4 changed the row to ±0.04
      m and kp to 1.0 in the same race, and its score fell to 61.49 with progress
      down on the s-bend (0.210 to 0.160) and oval (0.184 to 0.170). That race cannot
      say which change caused the drop. The Builder''s intent this iteration is the
      isolating test: ±0.04 m at 16 mm with the restored kp 1.2 / kd 0.4 controller.
      I am keeping every controller value at the iteration 3 setting, so any difference
      from 69.46 comes from the row. The weights stay at (-1, -0.5, 0, 0.5, 1). With
      the wider row the steering slope per metre falls, so kp 1.2 may give somewhat
      softer steering than iteration 3. I am not raising kp now, because that would
      confound the test. If line loss stays at 1.0 or more, the next step is a 12
      mm footprint at ±0.04 m, not a gain change. Expected result: line loss below
      1.0 per run on the s-bend and oval, and s-bend progress above 0.210. I make
      no claim about completion. The progress at first line loss is not an allowed
      measurement name, so I cannot request it directly.


      - [Open this output](iteration-8/entity1/versions/26c30be15b314bbfb314758a6c2efffc/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/36416308003f4d04a1f8de5109bb3263/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-1fb1119f78dd3564/payload.json)'
  - id: entityR1
    label: Hold ±0.04 m; isolate row
    notes: 'Feedback asks the Builder to hold the ±0.04 m row at 16 mm and test it
      at kp 1.2, because iteration 4 changed row and gain together. A 12 mm footprint
      is the fallback if line loss stays at 1.0 or more.


      ### Feedback


      Written before this robot races. The best raced design is ±0.03 m at 16 mm with
      y = 0.04 (iteration 3, 69.46, reproduced in iterations 5 to 7). Iteration 4
      widened the row to ±0.04 m and cut kp from 1.2 to 1.0 together, scoring 61.49,
      with progress down on the s-bend (0.210 to 0.160) and oval (0.184 to 0.170).
      The gain change is the likely cause, but the ±0.04 m row has not been tested
      at kp 1.2 alone. I have built the controller for that isolating test: kp 1.2,
      kd 0.4, base_speed 1.1, with the weights unchanged. Do not expect a new best
      score from this race. The wider row lowers the steering slope per metre, so
      kp 1.2 may steer somewhat softer than iteration 3. Read line loss and s-bend
      progress for the ±0.04 m row, and whether line loss stays at 1.0 or more per
      run. Off-track at about 0.06 m remains the binding failure in every race so
      far (iterations 0 to 7).


      ### Requested changes


      - Hold the ±0.04 m row at 16 mm with y = 0.04 (sensor_positions at x = -0.04
      to 0.04 in 0.02 m steps) for the next race, because the isolating test needs
      it unchanged.

      - If line loss stays at 1.0 or more per run with ±0.04 m at kp 1.2, try sensor_size
      0.012 at the same ±0.04 m positions, to test whether 16 mm edge noise is adding
      s-bend oscillation (iteration 3 s-bend oscillation was 0.168).

      - Keep y = 0.04 unless slalom steering oscillation reaches 0.15 or more; it
      has stayed between 0.145 and 0.147 across all row tests.


      - [Open this output](iteration-8/entityR1/versions/26c30be15b314bbfb314758a6c2efffc/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/36416308003f4d04a1f8de5109bb3263/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-1fb1119f78dd3564/payload.json)'
