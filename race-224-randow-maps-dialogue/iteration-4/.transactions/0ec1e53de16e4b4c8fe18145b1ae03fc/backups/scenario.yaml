map:
  id: race-224-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Evidence from iteration 2 (60 trials, all off track, no finishes): progress
      0.11 to 0.19, one to two line-loss events per run, max error about 0.06 m. That
      is the off-track limit for body_width 0.12, max(0.06, 0.0125 + 0.12/4) = 0.06,
      and body width cannot relax it within the allowed range. The robot therefore
      loses the line before it stalls, and coverage at the row edge is the open question.
      Iteration 2 raised the score from 57.1 to 63.9 and cut slalom oscillation from
      0.150 to 0.145, so the controller change helped. The Integrator''s advice was
      to hold geometry for this race, which I did. Their rule for the next change
      was: if line loss persists after progress 0.1, widen the row to x = ±0.03 with
      16 mm sensors. Line loss on the s-bend (2 events, progress 0.19) and oval (1
      event, progress 0.18) comes after progress 0.1 at the end of the run, so I am
      taking that step. Their second trigger, a forward offset when slalom oscillation
      is at or above 0.15, is not met (0.145), so I am not moving the row forward.
      Coverage check: a 16 mm footprint at x = ±0.03 keeps tape under the outer sensor
      until the robot centre is offset by about 0.0125 + 0.008 + 0.03 = 0.0505 m,
      against about 0.0385 m for the current row. That gives roughly 1.2 cm more warning
      before the 0.06 m limit. I am keeping the 5-sensor count, y = 0.04, wheel, body
      and mass unchanged, so the Integrator''s controller is judged on one geometry
      change only. Expected result: fewer line-loss events past progress 0.1, and
      max error that stays under 0.06 for longer. A finish is still not expected this
      iteration.


      - [Open this output](iteration-3/entity0/versions/f9b0481908514b1d8ec25925d0d07b3a/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-d3ea61f5e45da150/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-cf9db2fe29c416ed/payload.json)'
  - id: entity1
    label: Wider-row integration
    notes: 'Integrates the ±0.03 m, 16 mm row with kp raised to 1.2 to offset the
      shallower steering slope on the wider spacing. kd 0.4 and base_speed 1.1 are
      kept from iteration 2, which raised the score from 57.1 to 63.9.


      ### Rationale


      Iteration 2 raced a 12 mm row at x = ±0.02 with kp 1.0, kd 0.4 and base_speed
      1.1. It scored 63.85, up from 57.11, and slalom oscillation fell from 0.150
      to 0.145. All 60 trials still went off track at max error about 0.06 m, so the
      off-track limit remains the binding failure. The Builder has widened the row
      to x = ±0.03 at 16 mm, and I am accepting that geometry unchanged so the controller
      is judged on the one change. The steering signal is a weighted average of the
      sensor weights, so with the same weights (-1, -0.5, 0, 0.5, 1) a wider row halves
      the signal slope per metre, from about 50/m to about 33/m. Keeping kp at 1.0
      would therefore soften steering and risk more line loss on the bends. I raise
      kp to 1.2, which gives about 40/m: enough to correct the drift that line loss
      follows, but below the level that drove the slalom oscillation. kd stays at
      0.4, since it damped the signal in iteration 2. base_speed stays at 1.1 and
      ki at 0 to avoid windup. line_loss stays last_direction. Expected result: line
      loss later on the s-bend and oval, and slalom oscillation at or below 0.145.
      A finish is not expected this iteration. The progress at the first line loss
      cannot be requested, because it is not an allowed measurement name, so I request
      progress and max_error instead.


      - [Open this output](iteration-3/entity1/versions/931b9a039cb0429cb6a981b06d3f7c7e/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/f9b0481908514b1d8ec25925d0d07b3a/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-cf9db2fe29c416ed/payload.json)'
  - id: entityR1
    label: Widen row, tune kp
    notes: 'Supports the Builder''s ±0.03 m, 16 mm row as the reach needed for line
      loss after progress 0.1, citing iteration 2''s 63.9 result and the 0.06 m off-track
      limit. It asks the Builder to lower kp before narrowing if slalom oscillation
      stays at or above 0.145.


      ### Feedback


      Before this robot races: iteration 2 (row ±0.02 at 12 mm, y=0.04, kp 1.0, kd
      0.4, base_speed 1.1) scored 63.85, up from 57.11. Slalom oscillation fell from
      0.150 to 0.145, and progress rose on the oval (0.176) and s-bend (0.189). Max
      error still reached about 0.06 m on every run, so the off-track limit is the
      binding failure. The 12 mm row at ±0.02 covers offsets only to about 0.0385
      m. Your widened row at ±0.03 with 16 mm sensors extends that to about 0.0505
      m, which is the right direction for the line loss seen after progress 0.1. I
      have integrated it with kp 1.2, because a wider row gives a shallower steering
      slope, so a lower kp would soften steering too far. Do not expect a result from
      this race on the current candidate. Whether the wider row helps can be read
      from line-loss events after progress 0.1 on the s-bend and oval. Please also
      note that a 16 mm footprint may read more edge noise, so a rise in steering
      oscillation could be footprint size rather than reach.


      ### Requested changes


      - Keep sensor_positions at x = ±0.03 (or ±0.03 in 0.015 m steps) at y = 0.04
      with sensor_size 0.016 for the next race. If line loss still starts after progress
      0.1 on the s-bend or oval, widen the reach further before moving the row forward:
      the row can extend to ±0.04 at 16 mm, which reaches about 0.06 m offset, so
      keep the outer sensor''s footprint clear of the 0.06 m limit.

      - If slalom steering oscillation is still at or above 0.145 with the wider row,
      lower kp in the controller before narrowing the row, because the wider spacing
      already reduces steering slope. Do not move the row forward unless oscillation
      rises to 0.15 or more, since the Builder''s own rule for a forward offset (y
      = 0.02) depends on that trigger.

      - If line loss begins near progress 0 rather than on bends, the coverage edge
      is not the cause, and the geometry should be held while start-up speed and entry
      gain are examined.


      - [Open this output](iteration-3/entityR1/versions/931b9a039cb0429cb6a981b06d3f7c7e/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/f9b0481908514b1d8ec25925d0d07b3a/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-cf9db2fe29c416ed/payload.json)'
