  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: Hold best geometry
    notes: 'Keeps the iteration-10 geometry (50 mm span, y 0.075 m, 12 mm footprint,
      0.12 m track, 0.5 kg), the best-raced platform at 546. The Integrator''s condition
      for a 0.14 m track test was not met (s-bend line loss 1.5, below 2.0), and as
      the final iteration an untested change is too risky.


      ### Rationale


      The best raced design is iteration 10 (546.4), built on the iteration-9 geometry:
      five sensors at x = -0.025 to +0.025 m, y = 0.075 m, 12 mm footprint, wheel_track
      0.12 m, wheel_radius 0.03 m, body 0.18 x 0.12 m, mass 0.5 kg. Its gain came
      from the controller change, not geometry. The oval finished 20 of 20, slalom
      line loss fell from 3.0 to 2.1, and the s-bend reached 9 of 20 finishes with
      line_loss_events of 1.5.


      The Integrator''s advice was conditional. Wheel_track 0.14 m was to be tested
      only if s-bend line_loss_events stayed at 2.0 or more with the oval finish rate
      near 1.0. The raced s-bend line loss is now 1.5, below that threshold, and the
      oval finish rate is 1.0. The condition is not met, so I did not take the exploratory
      track change. I took the Integrator''s advice to hold geometry and kept the
      50 mm span, forward position, footprint and body width, since these were shown
      to cost oval finishes when changed.


      This is the final iteration, so an untested geometry change would be scored
      on the unseen track with no later chance to correct it. Holding the best-evidenced
      geometry is the lowest-risk choice. Expected result: the geometry is unchanged,
      so any change in score comes from the Integrator''s controller. The score should
      stay near the iteration-10 level, with the s-bend the main remaining weakness.


      - [Open this output](iteration-11/entity0/versions/123d3a71104c405484463e9c4bb765e7/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-d6954e1ee3a7e588/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-236186cb4acffb38/payload.json)'
  - id: entity1
    label: 'Final robot: iter-10'
    notes: 'Delivers the iteration-10 controller (base_speed 1.0, kd 0.6) unchanged
      on the held geometry. This is the best measured design (546.4), and an untested
      gain change was judged too risky for the unseen-track final race.


      ### Rationale


      The final race is scored on an unseen track, so this package keeps the best
      measured controller rather than testing an untried gain. The best raced design
      is iteration 10 (546.4), built on the iteration-9 geometry. Its controller (base_speed
      1.0, kp 4.0, ki 0.1, kd 0.6, last_direction) is the one I deliver. Iteration
      10 finished the oval 20 of 20 at 1.90 s mean, so the speed margin is adequate.
      The s-bend reached 9 of 20 finishes with line_loss_events 1.5, down from 2.3
      at iteration 9, and steering_oscillation 0.37. The slalom still lost the line
      in all 20 runs (line_loss_events 2.0, down from 2.1). The Builder has held the
      geometry unchanged at the iteration-10 values, so the controller is the only
      variable and the geometry matches the evidence. I considered raising kd further
      to damp the s-bend jitter (0.37). That is the main remaining lever, but its
      effect is untested, and the kd and base_speed changes were made together, so
      I cannot attribute the gain to either. Changing an unmeasured gain on the final
      unseen track could cost score with no later race to correct it. I therefore
      keep the measured controller. Expected result: a score close to the iteration-10
      level, about 546, on the development tracks. I make no claim about the unseen
      track.


      - [Open this output](iteration-11/entity1/versions/28ad8d7febd344b3b1861eb78f2fb9dd/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/123d3a71104c405484463e9c4bb765e7/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-236186cb4acffb38/payload.json)'
  - id: entityR1
    label: Hold geometry, final
    notes: 'Supports holding the iteration-10 geometry, with the evidence from iterations
      5 to 7 showing that span, footprint and track changes each cost oval finishes.
      Feedback is written before racing and notes that no further geometry change
      is possible after this final iteration.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Your
      hold of the iteration-10 geometry is supported by the evidence. Span (40 to
      60 mm), forward position (0.04 to 0.075 m), footprint (12 and 16 mm), track
      width (0.10 and 0.12 m) and mass (0.5 and 0.6 kg) were each tried around this
      layout. Iteration 5 (60 mm span) and iteration 6 (16 mm footprint) both cost
      oval finishes, and iteration 7 (0.10 m track) also lost them. Iteration 8 showed
      mass 0.5 kg kept the oval finishes (16 of 20), and iteration 10 (546.4) showed
      the controller was the lever that moved the bends. The s-bend line loss fell
      from 2.3 (iteration 9) to 1.5 (iteration 10), so the controller, not geometry,
      is still the lever. Because this is the final iteration, no later race can use
      a geometry change. Record these as the last observations: if the unseen-track
      score is well below the development results, check whether the s-bend loss on
      the held-back track is at 2.0 or more, which would point to wheel_track 0.14
      m as the untested geometry direction.


      ### Requested changes


      - Hold the iteration-10 geometry (x = plus or minus 0.025 m, y = 0.075 m, 12
      mm footprint, wheel_track 0.12 m, mass 0.5 kg) as proposed; no further change
      is possible after this iteration.

      - If future work resumes from this geometry, test wheel_track 0.14 m only if
      s-bend line_loss_events stays at 2.0 or more, since the 0.10 m track (iteration
      7) was the only narrower track tried and lost the oval finishes.

      - Keep the 50 mm span and 12 mm footprint, because widening the span to 60 mm
      and enlarging the footprint to 16 mm each cost oval finishes (iterations 5 and
      6).


      - [Open this output](iteration-11/entityR1/versions/28ad8d7febd344b3b1861eb78f2fb9dd/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/123d3a71104c405484463e9c4bb765e7/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-236186cb4acffb38/payload.json)'
