overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor array
    notes: 'Baseline geometry: five 12 mm sensors spanning 40 mm at 0.04 m ahead of
      the axle, on a light 0.6 kg chassis. No race evidence exists yet, so this is
      built from the contract: the span is wider than the 25 mm tape and the lookahead
      lets the robot react early.


      ### Rationale


      Iteration 0 has no Integration Feedback and no Geometry Race Data, so this is
      a baseline built from the contract rather than from evidence. A 25 mm tape needs
      a sensor array wider than the tape so the robot can tell which side it has drifted
      to, and the sensors should sit ahead of the axle so the robot reacts before
      the line reaches the wheels. I chose five sensors spaced 10 mm apart, spanning
      40 mm (about 1.6 tape widths), at y = 0.04 m ahead of the axle. Sensor size
      is 12 mm, so neighbouring footprints overlap slightly and the readings change
      smoothly as the line moves across them. Wheel track 0.12 m and wheel radius
      0.03 m give a moderate turn rate. Mass 0.6 kg keeps yaw inertia and response
      lag low. Body width 0.12 m keeps the off-track limit at its 0.06 m floor, so
      the robot is not given extra room to drift. Expected result: the array should
      keep line loss near zero on gentle bends, and the Integrator should be able
      to reach the 1.5 m/s average speed. Sharp slalom bends are the most likely source
      of error and are what I want measured.


      - [Open this output](iteration-0/entity0/versions/822b86fdddce455f8bd06cd8dea39ad9/payload.json)'
  actions:
  - id: action0
