map:
  id: race-219-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 2 moved the array forward from y = 0.04 m to y = 0.055 m with the
      50 mm span. Score rose from 57.2 to 65.3, and the oval improved most (mean 87.6,
      up from 60.3). Line loss did not clear, though: 2.0 events on the oval and 1.0
      on the s-bend and slalom. Max_error still reached 0.060 to 0.069 on every track,
      so the robot is still crossing the 0.06 m off-track limit. The Integrator''s
      stated rule for this case is to move the array forward again to about y = 0.06
      to 0.065 m while keeping the span, and I am following it. I choose y = 0.065
      m, the top of that range, to give the largest reaction distance. This is one
      variable changed from iteration 2 (array y only), so the result is attributable.
      I am keeping the 50 mm span, five sensors, the 12 mm footprint, the 0.12 m track,
      the 0.03 m wheels, the 0.6 kg mass and the 0.12 m body width. Body width does
      not change the off-track limit, which is already at its 0.06 m floor. I am not
      narrowing the track yet, because the Integrator''s rule only applies that change
      once line loss reaches 0 and max_error still sits near 0.06. Expected result:
      line_loss_events should fall toward 0 on the oval and s-bend, progress should
      rise above the iteration-2 values (0.22, 0.15, 0.11), and the score should improve
      on iteration 2. Risk: a sensor that is too far ahead may lose the line on tight
      entries or reduce the damping of the derivative term, so steering_oscillation
      is the watch point.


      - [Open this output](iteration-3/entity0/versions/72b48cb93b39493a800086599b163ed3/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-830988f4197888a0/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-50b819594fd6770f/payload.json)'
  - id: entity1
    label: Forward array, y=0.065 m
    notes: 'Keeps the Builder''s y = 0.065 m array and the iteration-2 controller
      unchanged, so the race isolates the sensor move. Rests on iteration 2, where
      line loss stayed at 1 to 2 events and max_error sat at 0.061 to 0.069.


      ### Rationale


      The Builder''s geometry moves the 50 mm five-sensor array forward to y = 0.065
      m. Iteration 2 (array at y = 0.055 m, same controller) cut line loss on the
      s-bend and slalom to 1.0 event and kept it at 2.0 on the oval. Max_error stayed
      at 0.061 to 0.069, so the robot still crosses the 0.06 m limit. Progress rose
      to 0.22, 0.15 and 0.11, and no run finished, so the failure is early loss of
      control, not speed. Iteration 2 showed steering_oscillation of 0.14 to 0.21,
      which is low, so there is no jitter problem to fix. I keep the controller identical
      to iteration 2 (base_speed 1.4, kp 4.0, ki 0.1, kd 0.3, last_direction, same
      weights). This makes the geometry change the only variable, so the race result
      can be attributed to the array move. The forward array gives more reaction distance,
      and the kd term already damps the signal. I do not raise base_speed, since no
      run has finished and speed margin is unproven. I expect line_loss_events to
      fall to 0 or near 0 and max_error to ease toward 0.06. If line loss clears but
      max_error stays at or above 0.06, the next lever is turning authority (narrower
      wheel_track), which the Builder can propose next iteration.


      - [Open this output](iteration-3/entity1/versions/97def789b8e94f0cb42e46b6cb2be695/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/72b48cb93b39493a800086599b163ed3/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-50b819594fd6770f/payload.json)'
  - id: entityR1
    label: Next-step feedback
    notes: 'Pre-race feedback citing iteration 2: line loss persisted at y = 0.055
      m, so the next steps are a further forward move to y = 0.075 m, or a narrower
      wheel_track if line loss clears but max_error stays near 0.06.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Iteration
      2 (array at y = 0.055 m, 50 mm span) reduced line loss on the s-bend and slalom
      from 1.0 to 1.0 (no change) and left the oval at 2.0 events, so the forward
      move helped less than hoped. Max_error stayed between 0.061 and 0.069, still
      above the 0.06 m limit, and progress reached only 0.11 to 0.22. Steering_oscillation
      stayed low (0.14 to 0.21), so the gains are not the problem. I kept your y =
      0.065 m and the 50 mm span, with the controller unchanged. Next race: if line_loss_events
      is still at least 1 on any track, move the array to about y = 0.075 m, which
      is near the top of the allowed range, and keep the span. If line loss is 0 on
      all tracks but max_error stays at or above 0.06, the limit is turning authority,
      so narrow wheel_track. Keep body_width at 0.12 m, since the off-track limit
      is already at its 0.06 m floor.


      ### Requested changes


      - If line_loss_events is still at least 1 on any development track at y = 0.065
      m, move the array forward to about y = 0.075 m, keeping the 50 mm span (iteration
      2 at y = 0.055 m still gave 1 to 2 events per track).

      - If line_loss_events drops to 0 but max_error stays at or above 0.06, reduce
      wheel_track from 0.12 m to about 0.10 m for more turn rate (iteration 2 max_error
      was 0.061 to 0.069).

      - Keep body_width at 0.12 m; the off-track limit is already at its 0.06 m floor,
      so widening the body does not change the outcome (iteration 2 max_error sat
      at the limit on all tracks).


      - [Open this output](iteration-3/entityR1/versions/97def789b8e94f0cb42e46b6cb2be695/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/72b48cb93b39493a800086599b163ed3/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-50b819594fd6770f/payload.json)'
