  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence: iteration 9 (kd 2.0) is the best design so far, scoring 673.6. The
      oval finishes 20 of 20 at 2.04 s with rms 0.005. The s-bend finishes 20 of 20
      at 2.41 s. The slalom never finishes (0 of 20, progress 0.31, about 1 line-loss
      event per run, all ended off track). The kd sequence has been consistently productive:
      0.9 to 1.2 gave +69, 1.2 to 1.5 gave +83, and 1.5 to 2.0 gave +139. The slalom
      progress rose from 0.17 to 0.31 on that last step, and the s-bend went from
      0.83 to 0.997. Max error still sits near the off-track limit on the bends with
      low rms, which fits transient overshoot entering direction changes.


      Decision: change one lever only. kd goes from 2.0 to 2.6 (within the 0 to 10
      range), and everything else is held at iteration 9 values: geometry (5 sensors
      at x = -0.04 to +0.04 in 0.02 m steps, y = 0.06, 16 mm footprint, body 0.18
      x 0.16 m, 0.8 kg, wheel track 0.12 m, wheel radius 0.03 m), kp 5.0, ki 4.0,
      base_speed 1.2 and last_direction line loss. Holding everything else keeps the
      kd effect readable against iteration 9.


      Expected result: slalom progress rises further (target above 0.4), with some
      chance of first slalom finishes. The s-bend should hold its finish rate, and
      the oval should stay near 2 s. Score should rise above 673 if the overshoot
      mechanism still dominates.


      Risks: kd amplifies sensor noise, so steering_oscillation may rise above the
      current 0.25 (oval) and 0.32 (s-bend). If the gain from kd shrinks below about
      +40 per 0.5 step, or steering_oscillation grows sharply, the diminishing-returns
      hypothesis holds. The next lever would then be base_speed 1.1 (oval time would
      be about 2.2 s, still under 3 s).


      Hypotheses for the next iteration: (H1) kd 2.6 still raises slalom progress,
      so the slalom can be completed by kd near 3.0 or by a modest base_speed cut.
      (H2) Diminishing returns on kd, so turn-in speed or sensor edge loss is the
      limit, and base_speed should drop to 1.1. (H3) Slalom line loss comes from fast
      direction changes at the 0.04 m array edge, so a 7-sensor array at plus or minus
      0.045 m is the geometry test to consider only after the kd effect is read.


      Measurements requested per track: completion, progress, completion_time, rms_error,
      max_error, line_loss_events, steering_oscillation, control_effort, controller_errors
      and noise_robustness. These separate overshoot, noise-driven jitter and edge-loss
      effects, especially on the slalom.


