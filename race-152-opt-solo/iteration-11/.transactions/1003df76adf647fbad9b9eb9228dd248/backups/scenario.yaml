  - id: entity0
    label: kd 3.0 damping step
    notes: 'Final-iteration candidate: iteration 10''s design with kd raised from
      2.6 to 3.0, all else held. The kd gains are flattening (last step +16) but slalom
      progress is still rising, so this is a small, low-risk push. Evidence is the
      iteration 10 race (score 690, oval and s-bend finishing, slalom 0 of 20).


      ### Rationale


      Evidence: iteration 10 (kd 2.6) scored 689.98, the best so far. The oval finished
      20 of 20 at 2.14 s with rms 0.004. The s-bend finished 20 of 20 at 2.47 s, leaving
      about 0.5 s of margin to the 3 s limit. The slalom still never finishes (0 of
      20, progress 0.44, about 1 line-loss event per run, all off track). The kd sequence
      has been productive but is flattening: 0.9 to 1.2 gave +69, 1.2 to 1.5 gave
      +83, 1.5 to 2.0 gave +139, and 2.0 to 2.6 gave only +16. Oval and s-bend are
      now reliable, so the remaining score gain lies in surviving the sharper direction
      changes that the slalom and unseen tracks may contain. Oscillation has risen
      (s-bend 0.33) with no collapse in tracking. Change: kd 2.6 to 3.0, the one lever
      still moving progress upward on the slalom. Geometry, kp 5.0, ki 4.0, base_speed
      1.2 and last_direction line loss are held at iteration 10 values, so the change
      is a small, low-risk step rather than a new mechanism. Expected result: slalom
      progress rises from 0.44 toward 0.5 or more, the s-bend and oval hold their
      finish rates, and the score is roughly flat to slightly up, around 690 to 710.
      Risks: diminishing returns and noise amplification by kd could raise steering_oscillation
      and cost s-bend time. Hypotheses for the record: (H1) kd still helps the slalom,
      with gain now below +20 per step; (H2) if the slalom stays off track at progress
      around 0.45, the limit is turn-in speed at the array edge, and base_speed near
      1.1 or a 7-sensor array at plus or minus 0.045 m would be the next test. Measurements
      requested per track: completion, progress, completion_time, rms_error, max_error,
      line_loss_events, steering_oscillation, control_effort, controller_errors and
      noise_robustness.


