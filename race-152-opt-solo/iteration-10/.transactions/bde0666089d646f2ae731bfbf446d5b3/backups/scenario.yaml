  - id: entity0
    label: kd 2.0 damping test
    notes: 'Keeps the iteration 8 geometry and controller and raises kd from 1.5 to
      2.0, continuing the trend where each kd step improved the s-bend and slalom.
      Evidence: iteration 8 scored 534 with oval finishing 20/20 and s-bend 9/20,
      while slalom never finished.


      ### Rationale


      Evidence: iteration 8 (kd 1.5) scored 534.3, the best so far. The oval finishes
      20 of 20 runs at 1.94 s with rms 0.0097. The s-bend finishes 9 of 20 (progress
      0.83), and the slalom still never finishes (progress 0.17, about 1 line-loss
      event per run, all off track). Each kd step has helped: kd 0.9 to 1.2 gave +69,
      and kd 1.2 to 1.5 gave +83. Max error sits at the off-track limit on the bends
      with low rms, which fits transient overshoot into bends. The change: kd 1.5
      to 2.0, a continuation of the one lever that has worked. Geometry (5 sensors
      at x = -0.04 to 0.04, y = 0.06, 16 mm footprint, body 0.18 x 0.16 m, 0.8 kg,
      wheel track 0.12 m), kp 5.0, ki 4.0, base_speed 1.2 and last_direction line
      loss are held fixed so the kd effect reads cleanly against iteration 8. Expected
      result: s-bend finish rate and progress rise, slalom progress rises above 0.17,
      and the oval holds near 2 s. Risks: kd amplifies sensor noise and may increase
      steering_oscillation (currently about 0.2 on the oval, 0.35 on the s-bend).
      Hypotheses for next: (H1) kd 2.0 still improves the s-bend, so the next step
      is kd near 2.5. (H2) If the gain shrinks (diminishing returns), turn-in speed
      is the limit and base_speed should drop to about 1.1. (H3) Slalom line loss
      comes from fast direction changes at the 0.04 m array edge, so a 7-sensor array
      at plus or minus 0.045 m is the next geometry test. Measurements requested per
      track: completion, progress, completion_time, rms_error, max_error, line_loss_events,
      steering_oscillation, control_effort, controller_errors and noise_robustness.


