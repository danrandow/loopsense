  entities:
  - id: entity0
    label: Revert geometry, kd 1.2
    notes: 'Returns the sensor array to the iteration 5 layout (±0.04 m) and keeps
      ki 4.0, since widening to ±0.06 m and ki 5 cut the score from 382 to 270. Raises
      kd from 0.9 to 1.2 to damp the bend overshoot that pins max_error at the off-track
      limit.


      ### Rationale


      Evidence. Iteration 5 (score 382.3) is the best design so far. Its oval finished
      19 of 20 runs at 1.95 s, but the s-bend (progress 0.44) and slalom (progress
      0.12, 1.4 line-loss events per run) still left the tape. Iteration 6 widened
      the sensor array to ±0.06 m and raised ki to its 5.0 limit. Its score fell to
      269.5: oval finish rate dropped from 0.95 to 0.40 and oval max_error rose, while
      the s-bend gained only a little (progress 0.48). The wider array therefore did
      not help, and it probably coarsened the edge readings. Steering oscillation
      is 0.13 to 0.33 and max_error sits at the 0.06 m off-track limit on every track.
      The robot is not jittering badly, but it overshoots into bends and then drifts
      out.


      Decision. I revert the geometry to the iteration 5 layout (five sensors at x
      = -0.04 to +0.04 in 0.02 m steps, y = 0.06, 16 mm footprint). I keep ki at 4.0,
      the value that gave the best score, rather than the 5.0 that hurt the oval.
      The one controller change is kd from 0.9 to 1.2, to damp the transient overshoot
      into bends, which is the mechanism most consistent with max_error reaching the
      limit with low RMS. kp (5.0), base_speed (1.2) and line_loss (last_direction)
      are unchanged, so the effect of kd can be read against iteration 5.


      Expected result. Oval finish rate should hold near 0.95 with completion time
      about 2 s. The s-bend and slalom should show higher progress and fewer off-track
      endings. Score should rise above 382 if the overshoot hypothesis is right.


      Hypotheses. H1: the s-bend and slalom failures are transient overshoot, so higher
      kd raises their progress. H2: if kd alone does not help and the s-bend still
      ends off track with low RMS, turn-in speed is the limit and base_speed should
      drop to about 1.1. H3: slalom line loss is caused by fast direction changes
      at the 0.04 m array edge, so the next test should try a 7-sensor array at ±0.045
      m, not a wider 5-sensor one.


      Measurements requested: completion, progress, completion_time, rms_error, max_error,
      line_loss_events, steering_oscillation, control_effort, controller_errors and
      noise_robustness, reported per track, so that overshoot, edge loss and speed
      effects can be separated.


