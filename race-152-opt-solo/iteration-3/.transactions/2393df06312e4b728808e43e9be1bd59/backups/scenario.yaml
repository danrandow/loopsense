overrides:
  entities:
  - id: entity0
    label: Add integral, finer
    notes: 'Adds ki=1.0 to cancel the fixed motor-mismatch bias that ki=0 could not
      remove, and tightens sensor spacing to +/-0.04 m. Based on rms of about 0.03
      m with max error pinned at the 0.06 m off-track limit across all 120 trials.


      ### Rationale


      Evidence: all 120 development trials across iterations 0 and 1 ended off_track
      at progress 0.10 to 0.18. Max error sits at about 0.06 m on every track, which
      is the off-track limit (max(0.06, 0.0125 + body_width/4) is 0.06 for body widths
      up to 0.18). RMS error is only 0.03 m, and steering oscillation is low (0.07
      to 0.17). The robot is not jittering. It settles into a steady offset and then
      drifts off. Iteration 1 widened the sensor span to +/-0.06 m and cut line-loss
      events to zero on the oval, but progress barely changed, so the sensor span
      is not the main limit. Both iterations used ki = 0. The simulator includes a
      fixed left/right motor mismatch, which produces a constant steering bias. With
      no integral term, the proportional controller can only hold a steady offset,
      and the offset grows toward the 0.06 m limit. Hypothesis H1: adding integral
      action will remove the steady bias and reduce max_error and off-track endings.
      Changes: set ki = 1.0 (integral is clamped to +/-2, so this is a bounded correction).
      Tighten the sensor spacing to +/-0.04 m (5 sensors at -0.04, -0.02, 0, 0.02,
      0.04) with the 16 mm footprint, so the signal changes more smoothly across the
      tape and the centre is resolved more finely. Keep kp 4.0, kd 0.4, base_speed
      1.4, line_loss last_direction and the body geometry from iteration 1, so that
      the effect of the integral term can be read cleanly. Expected result: rms_error
      and max_error drop well below 0.06 m, and runs progress further on the s-bend
      and slalom. Next hypotheses: (H2) if max_error still reaches 0.06 with low rms,
      the problem is transient overshoot on bends, and kd or kp should be raised.
      (H3) If progress rises but completion_time is too slow for the 3 s limit, base_speed
      should increase toward about 1.8. Measurements requested: all metrics, including
      noise_robustness, so that the drift and line-loss behaviour can be separated.


