overrides:
  entities:
  - id: entity0
    label: 'Final: hold race 10'
    notes: 'Holds the race 10 geometry unchanged (five 16 mm sensors at y 0.06, 0.12
      m track, 0.12 m body, 0.8 kg), the best measured result at 830.86 with slalom
      line loss down to 0.85. Mass 0.6 kg was not tested because this is the final
      iteration and an untested platform is too risky for the unseen-track race.


      ### Rationale


      Race 10 (entityR2A, score 830.86) is the best result so far, and its geometry
      is the race 8 platform: five 16 mm sensors at x = -0.03 to +0.03 with y = 0.06,
      body 0.12 m by 0.12 m, wheel_track 0.12 m, wheel_radius 0.03 m, mass 0.8 kg.
      The only change in that race was the controller (kd 0.6 to 0.8, kp 3.2, base_speed
      0.95). Oval finished 20/20 and s-bend 20/20, and slalom rose from 2/20 to 9/20
      finishes with line loss down from 1.0 to 0.85. This satisfies the Integrator''s
      own rule for keeping the geometry: slalom line loss fell to 0.85, below 1.0.
      The Integrator''s wheel_track 0.10 test (race 9) lost slalom finishes, and the
      wheel_track revert was accepted. Mass 0.6 kg was the one open exploration. I
      am not running it now. This is the final iteration, and a mass change would
      be a new, untested platform with no further iteration to correct it, while the
      final unseen-track race is scored on whatever robot is produced here. Holding
      the best measured geometry is the lower-risk choice for that race. The Integrator
      may still change the controller, and slalom line loss at 0.85 is the number
      to watch.


      - [Open this output](iteration-11/entity0/versions/ffb218215205423ca9ca2c91df4a4799/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-3bfea22b5c870b3c/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-d1c267ab0e7eeff6/payload.json)'
  - id: entity1
    label: Race 8 platform, kd 0.8
    notes: 'Reverted wheel_track to 0.12 m after race 9 lost slalom finishes (2 to
      0). Race 8 platform with only kd raised from 0.6 to 0.8 to test whether more
      damping reduces slalom line loss.


      ### Rationale


      Race 9 (wheel_track 0.10 m, kp 2.7, kd 0.5) scored 700.30, below race 8''s 742.12.
      Slalom finishes fell from 2/20 to 0/20 and slalom line loss rose from 1.0 to
      1.25, so the narrower track did not help slalom. I therefore take the Builder''s
      fallback and revert wheel_track to 0.12 m, which restores the exact race 8 platform:
      five 16 mm sensors at x = -0.03, -0.015, 0, 0.015, 0.03, y = 0.06, body 0.12
      by 0.12 m, 0.8 kg, 3 cm wheels, 12 cm track. The race 8 controller was kp 3.2,
      kd 0.6, base_speed 0.95. Race 8 slalom reached 2/20 finishes at 2.67 s mean,
      with line loss at 1.0 and max_error at 0.0594, so the time margin is about 0.33
      s. I change one controller variable: kd from 0.6 to 0.8. Derivative action should
      damp the faster response from kp 3.2 at the slalom direction reversals, where
      line loss occurs. I keep kp, base_speed and the weights unchanged, so the result
      can be read against race 8. I do not lower base_speed, because slalom already
      uses most of its 3 s budget. Expected result, not yet measured: slalom line
      loss at or below 1.0 and finishes at or above race 8''s 2/20. If slalom line
      loss rises or oval steering_oscillation exceeds about 0.35, kd 0.6 is restored.


      - [Open this output](iteration-10/entity1/versions/0dec5426eab44140b72e6a6ae7ad9be5/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/2817b5038c0b4e50a753cc0993c04126/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-1cc045397c629829/payload.json)'
  - id: entityR1
    label: Hold race 8, test mass
    notes: 'Race 9 (700.30) lost slalom finishes with wheel_track 0.10, so I ask the
      Builder to hold the race 8 platform and test mass 0.6 kg alone in a later race.
      Based on race 8 and race 9 outcomes.


      ### Feedback


      Written before this candidate has raced. Race 8 (entityR2B, 742.12) is the best
      result: body_length 0.12 m gave oval 20/20, s-bend 20/20 and slalom 2/20. Race
      9 (entityR2B, 700.30) tested wheel_track 0.10 m and lost the slalom finishes
      (2 to 0) while raising slalom line loss to 1.25, so the yaw-gain increase did
      not help slalom. I am reverting to your race 8 platform exactly, as your own
      fallback said. The race 9 s-bend gain (20/20, line loss 0.2) shows the narrower
      track helps that track, but slalom is the limit. My controller change is kd
      0.6 to 0.8 with kp 3.2 and base_speed 0.95 held, which tests whether more damping
      reduces slalom line loss at the direction reversals. Once race 10 reports: if
      slalom line loss falls to 1.0 or below and finishes hold or rise, keep the race
      8 geometry and tune base_speed for time. If slalom line loss is unchanged or
      worse, the controller response is not the whole story, so hold the geometry
      and I will ask for a single exploration of mass at 0.6 kg in a later race, not
      combined with any other change. Keep wheel_track at 0.12 m.


      ### Requested changes


      - Hold the race 8 platform exactly, with wheel_track 0.12 m, five 16 mm sensors
      at x = -0.03 to +0.03, y = 0.06, body_length 0.12 m, mass 0.8 kg, so race 10
      is read against race 8.

      - If slalom line loss stays at 1.0 or more after this race, do not change geometry
      in the same step. Test mass 0.6 kg alone in a later race, as you proposed, to
      cut yaw inertia and traction-limited turning.

      - Do not return to wheel_track 0.10 m for slalom, since race 9 showed it lost
      finishes (2 to 0) and raised line loss (1.0 to 1.25).


      - [Open this output](iteration-10/entityR1/versions/0dec5426eab44140b72e6a6ae7ad9be5/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/2817b5038c0b4e50a753cc0993c04126/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-1cc045397c629829/payload.json)'
