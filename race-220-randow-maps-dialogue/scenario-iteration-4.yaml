overrides:
  entities:
  - id: entity0
    label: Revert spread, lead to
    notes: 'Reverts to the best-scoring ±0.03 m spread with 16 mm footprints (race
      2, 356.98) and moves the sensor lead from 5 cm to 6 cm as the only change. Race
      3''s ±0.04 m spread cut oval finishes from 15 to 5 of 20 without fixing s-bend
      or slalom line loss.


      ### Rationale


      Race 3 (entityR2A, score 235.88) widened the outer spread to ±0.04 m with 16
      mm footprints. That was worse than race 2 (356.98, ±0.03 m, 16 mm). Oval finishes
      fell from 15/20 to 5/20, and oval max_error rose to 0.057. On s-bend and slalom,
      line loss stayed at 1.0 and 1.15 events with max_error at the 0.06 m limit,
      so the wider spread did not fix the failure it was meant to fix. The Integrator''s
      own rule says that when line loss stays at 1 or more with max_error at the limit,
      the spread is no longer the limiter and the geometry should be held. Oval steering_oscillation
      is 0.32 in race 3 and 0.31 in race 2, above the 0.2 threshold the Integrator
      set for moving the sensors forward. I am therefore reverting the spread to ±0.03
      m, the best measured spread, and keeping 16 mm footprints. I am making one change
      against the race 2 baseline: the lead moves from y = 0.05 to y = 0.06 to test
      whether the forward lead reduces oval oscillation. This departs from the Integrator''s
      request to keep ±0.04 m. I am declining that request because race 3 showed ±0.04
      m costs oval finishes without fixing s-bend or slalom. The lead move is the
      only geometry change, so any change in oval oscillation can be attributed to
      it. I expect oval steering_oscillation to fall below about 0.25 and oval finishes
      to stay near race 2 levels (about 12 to 15 of 20). I do not expect s-bend or
      slalom to finish from geometry alone, so I am leaving controller gain and base_speed
      to the Integrator.


      - [Open this output](iteration-4/entity0/versions/239e39dabaa84ee6b45deba55e158fec/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-f0f3a663dd0c2b2f/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-40445ea80b0fd5b3/payload.json)'
  - id: entity1
    label: Race 2 controller, y=0.06
    notes: 'Builder''s forward-lead geometry (y 0.05 to 0.06) paired with the unchanged
      race 2 controller, so the lead is the only variable. Race 2 scored 356.98 and
      oval oscillation was 0.31, above the 0.2 threshold.


      ### Rationale


      Race 2 (entityR2B, score 356.98) is the best measured design: ±0.03 m spread,
      16 mm footprints, y = 0.05, with kp 2.4, kd 0.45, base_speed 1.1 and weights
      [-2,-1,0,1,2]. The Builder''s proposal changes only the lead, from y = 0.05
      to y = 0.06. Race 3 (235.88) showed that widening to ±0.04 m cut oval finishes
      from 15 to 5 of 20 and left s-bend and slalom line loss at 1.0 and 1.15, so
      the spread is not what limits those tracks. The oval steering_oscillation was
      0.31 in race 2, above the 0.2 threshold I set for moving the lead forward. I
      therefore keep the controller identical to race 2. The sensors sit 1 cm further
      ahead of the axle, so the controller reacts slightly earlier. With the gains
      unchanged, any change in oval oscillation or finishes can be attributed to the
      lead move. I expect oval steering_oscillation to fall toward 0.25 or below,
      and oval finishes to stay near race 2 levels (about 12 to 15 of 20). I do not
      expect s-bend or slalom to finish from geometry alone. If they still show line
      loss at 1 or more with max_error at 0.06, the next change should be to kp, kd
      or base_speed, not the geometry. The sensor geometry is passed through unchanged
      from the Builder''s proposal.


      - [Open this output](iteration-4/entity1/versions/9d4abb8289a6403e8f4aa7e0b28317b5/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/239e39dabaa84ee6b45deba55e158fec/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-40445ea80b0fd5b3/payload.json)'
  - id: entityR1
    label: Hold spread, test lead
    notes: 'Recommends holding ±0.03 m and 16 mm, as race 3 (±0.04 m, 235.88) showed
      the spread does not fix s-bend or slalom line loss. Gives a revert rule for
      the lead depending on the next race''s oval finishes.


      ### Feedback


      Written before this candidate races. The evidence supports holding ±0.03 m with
      16 mm footprints. Race 2 (entityR2B, 356.98) is the best result: oval finished
      15 of 20 with max_error 0.048, but s-bend and slalom still lost the line at
      1.15 and 1.10 events per run with max_error at the limit. Race 3 (entityR2B,
      235.88) tested ±0.04 m, which cut oval finishes to 5 of 20 and left s-bend and
      slalom line loss at 1.0 and 1.15. So the wider spread did not fix the failure
      it was meant to fix, and the spread is not the limiter on those tracks. Your
      lead move is a reasonable single-variable test. Race 2 oval steering_oscillation
      was 0.31, above the 0.2 threshold we set for moving the sensors forward. I have
      kept the controller identical to race 2, so any change in the next race comes
      from y alone. Once the race reports, use this rule. If oval steering_oscillation
      falls and oval finishes hold near race 2 levels, keep y = 0.06. If oval finishes
      fall, return the lead to y = 0.05. If s-bend and slalom still lose the line
      at 1 or more with max_error at 0.06, hold the geometry and I will tune gains.


      ### Requested changes


      - Keep ±0.03 m spread, 16 mm footprints and y = 0.06 for the next race, so the
      lead is the only geometry change against race 2.

      - If oval finishes fall below about 12 of 20 while oscillation improves, return
      y to 0.05, because the lead cost reach on the oval.

      - Optional, untested alternative if s-bend and slalom still lose the line at
      1 or more with the spread held: try seven 16 mm sensors at ±0.03 m (about 10
      mm pitch) to add coverage without widening. This has no race evidence yet and
      should be treated as exploration.


      - [Open this output](iteration-4/entityR1/versions/9d4abb8289a6403e8f4aa7e0b28317b5/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/239e39dabaa84ee6b45deba55e158fec/payload.json),
