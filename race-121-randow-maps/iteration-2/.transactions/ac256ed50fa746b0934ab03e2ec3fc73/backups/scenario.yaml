overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      The only race evidence is the baseline (entityR2A, 60 trials, no finishes).
      Every run ended off track at about 10-15% progress. Max error was 0.061-0.065
      m, essentially the 0.0625 m off-track limit, and line_loss_events was 1-2 per
      run. The robot is losing the line on bends and drifting out before the controller
      can recover. Two geometry causes fit this. First, the 4 cm array is too narrow:
      the line leaves the sensors on sharper bends, which matches the line losses
      and the off-track ends. Second, the 5 cm forward offset may read the line too
      late to correct the bend. Oscillation is low (0.07-0.15), so jitter is not the
      main failure. Body width cannot widen the off-track limit within range, since
      max(0.06, 0.0125 + body_width/4) stays at 0.06 for any body width up to 0.19
      m, so I will leave body_width alone. Changes: widen the array to x = -0.03 to
      +0.03 at 1.5 cm pitch, which keeps the tape under at least one sensor through
      sharp bends. Move the sensors to y = 0.04 m, a moderate lead that is shorter
      than the baseline and within the Integrator''s suggested range. Reduce mass
      to 0.6 kg and wheel_track to 0.11 m to help the robot reach about 1.5 m/s and
      turn more readily. Keep sensor_size at 0.012 and wheel_radius at 0.03. Expected
      result: line_loss_events falls toward 0 and progress rises well above 0.15,
      with completion possible on the tightest bend. If the robot still goes off track
      with few line losses, the cause is more likely the forward offset or the gains.


      - [Open this output](iteration-1/entity0/versions/dabebc628fad46528eafa40f74663b6e/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-d3d5d9cca85ca00d/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-5d4cd3dc143da66b/payload.json)'
  - id: entity1
    label: Wider array, lighter
    notes: 'Integrates the Builder''s 6 cm five-sensor array at a 4 cm lead, 0.6 kg,
      with kp raised to 3.0 and kd to 0.1. Based on the iteration-0 baseline, where
      all 60 runs went off_track with 1-2 line losses.


      ### Rationale


      The only race evidence is the iteration-0 baseline (entityR2B, 60 trials, no
      finishes). Every run ended off_track at 10-15% progress, with 1-2 line-loss
      events per run and max_error of 0.061-0.065 m against a 0.0625 m limit. Oscillation
      was low (0.07-0.15), so jitter is not the main failure. The 4 cm array and 5
      cm lead lose the tape on bends and the robot drifts out before recovering. I
      therefore keep the Builder''s proposed geometry (five sensors at x = -0.03 to
      +0.03 m, 1.5 cm pitch, y = 0.04 m, 12 mm footprint, 0.6 kg, 0.11 m track, 0.03
      m wheel radius). For the controller, a wider array means the same weight pattern
      saturates later, so I raise kp from 2.5 to 3.0 to keep correction authority
      on the bends, and add kd 0.1 to damp the faster response of the lighter chassis.
      The weights stay [-2,-1,0,1,2], matching the array''s left-positive ordering.
      base_speed stays at 1.6 because progress, not speed, limits the baseline; ki
      stays at 0 to avoid windup on the curved course. line_loss stays ''last_direction'',
      since the tape still leaves the array on the sharpest bends. Expected result,
      not measured: line_loss_events falls toward 0 and progress rises above 0.15.
      The first race will show whether the remaining failure is the forward offset
      or the gains.


      - [Open this output](iteration-1/entity1/versions/75f03413744542499f7ea253d0b9d962/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/dabebc628fad46528eafa40f74663b6e/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-5d4cd3dc143da66b/payload.json)'
  - id: entityR1
    label: Forward offset and pitch
    notes: 'Feedback before racing, citing the baseline''s off_track and line-loss
      results. Requests a shorter forward offset, a wider pitch, and a narrower track,
      each conditional on what the next race shows.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. (1) In
      iteration 0 the baseline 4 cm array (x = -0.02 to +0.02) at a 5 cm lead gave
      1-2 line-loss events per run and every run went off_track at 10-15% progress
      (outcome table, entityR2B). The line leaves the array on bends, so the controller
      depends on the array staying over the tape. (2) The baseline oscillation was
      low (0.07-0.15), so the sensor spacing does not appear to be causing jitter.
      (3) Integration needed kp raised and kd added to match the wider array and lighter
      chassis. This is a design choice, not measured evidence. Next race: if line_loss_events
      is 0 but the robot still leaves the track, the forward offset is the likely
      limit, so try y = 0.03 m (requested change 1). If steering_oscillation rises
      above the baseline 0.15 while line losses stay at 0, try a larger sensor pitch
      or a smaller forward offset. If completion_time is near 3.0 s with completion
      at 1, try a narrower wheel_track of 0.10 m to turn more readily.


      ### Requested changes


      - If line_loss_events is 0 but the robot still goes off_track, move the sensors
      forward to y = 0.03 m (from 0.04) to read the bend earlier. Baseline: a 5 cm
      lead gave 1-2 losses and off_track on all 60 runs (entityR2B).

      - If steering_oscillation exceeds about 0.15 while line_loss_events stays 0,
      widen the pitch to 0.02 m (x from -0.04 to +0.04) to reduce sensitivity per
      cm. Baseline oscillation was 0.07-0.15, so this only applies if the new geometry
      raises it.

      - If completion_time is above about 2.9 s with completion at 1, reduce wheel_track
      to 0.10 m, keeping the same sensor layout, so the robot turns more readily.
      Iteration-0 evidence: wheel_track 0.12 and mass 0.8 gave no finishes, so drive
      response is still unmeasured at the lighter 0.6 kg mass.


      - [Open this output](iteration-1/entityR1/versions/75f03413744542499f7ea253d0b9d962/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/dabebc628fad46528eafa40f74663b6e/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-5d4cd3dc143da66b/payload.json)'
