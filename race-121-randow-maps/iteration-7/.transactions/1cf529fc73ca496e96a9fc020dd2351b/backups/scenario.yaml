  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 6 (seven 16 mm sensors at 1 cm pitch, x = -0.03 to +0.03, 4 cm lead)
      restored s-bend progress to 0.155, matching the iteration 4 reference. Its score
      was 51.11, level with iterations 1 and 4. The 2 cm pitch is therefore the cause
      of the s-bend collapse in iterations 2, 3 and 5, not the 4 cm lead, and the
      1 cm pitch is kept. The design now plateaus near 51 with one line loss per run
      and max_error about 0.06 to 0.068 m, so the remaining limit is not pitch or
      lead. Iteration 0 (1 cm pitch, 12 mm footprints, 2 cm span) also avoided the
      collapse, but it used a narrower span. Iteration 4 showed that 16 mm versus
      12 mm footprints made no measurable difference at 1.5 cm pitch. The one geometry
      variable not yet tested at the good layout is footprint at 1 cm pitch. Seven
      sensors at 1 cm pitch overlap heavily, so the 16 mm footprint may over-weight
      the outer sensors and blur the signal. I therefore change only sensor_size,
      from 16 mm to 12 mm, and keep the iteration 6 layout. The weights for the Integrator
      are x/0.015, which matches the iteration 4 slope. Expected result: s-bend progress
      at or above 0.15 and one or fewer line losses per run, with score at or above
      about 51. If progress falls below 0.11, the 16 mm footprint was needed, and
      the next lever is the Integrator''s line_loss setting or gains, not geometry.


      - [Open this output](iteration-7/entity0/versions/7879ac3a8ec344d4a23eeb859792541f/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-275efd9d80b8717b/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-ef65235c4fd6a84b/payload.json)'
  - id: entity1
    label: 1 cm pitch, 7 sensors
    notes: 'Seven 16 mm sensors at 1 cm pitch across +/-3 cm with weights x/0.015
      and unchanged gains. This isolates pitch from the 2 cm pitch that collapsed
      s-bend progress to 0.04 in iterations 2 and 5.


      ### Rationale


      The Builder''s proposal is a single-variable test from the iteration 4 reference
      (+/-3 cm span, 4 cm lead, 16 mm footprints, 0.6 kg, 0.11 m track, 0.03 m wheel
      radius, 0.18 x 0.12 m body). Only the sensor pitch changes, from 1.5 cm (5 sensors)
      to 1 cm (7 sensors). The evidence supports this test. Iteration 4 gave s-bend
      progress 0.155, oval 0.11 and score 51.12. Iterations 2 and 5 both used a 2
      cm pitch and both collapsed s-bend progress to 0.04. Iteration 3 used a 2 cm
      lead and also collapsed to 0.04, so the lead below 4 cm is harmful as well.
      Iteration 0 used 1 cm pitch and did not collapse (s-bend 0.15). That makes pitch
      a plausible cause, though iteration 5 changed span too, so it is not isolated.


      Controller: the weights are rescaled to x/0.015, which gives [-2, -1.333, -0.667,
      0, 0.667, 1.333, 2]. This keeps the same signal slope as iteration 4, where
      x = 0.015 m mapped to weight 1, so kp 3.0 carries over unchanged. Because the
      signal is a reading-weighted average, adding sensors at the same slope should
      not change the scale. kd stays at 0.1 and ki at 0, so the only controller change
      is the weight vector for the new sensor count. base_speed 1.6 and line_loss
      ''last_direction'' are unchanged. Expected result, not measured: s-bend progress
      at or above 0.155, oval at or above 0.11, and line losses at or below 1 per
      run.


      - [Open this output](iteration-6/entity1/versions/fc3aec229d41433f819a31e1dae15050/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/c870c8a827274e46bacd9b7d5853963e/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-6aa25987fc14d925/payload.json)'
  - id: entityR1
    label: Pitch test feedback
    notes: 'Feedback ties the 1 cm pitch test to iterations 2, 4 and 5 and gives a
      decision rule for the next race. Changes are limited to the sensor pitch and
      the footprint, with the 4 cm lead kept.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. (1) Iteration
      4 (5 sensors, +/-3 cm, 1.5 cm pitch, 4 cm lead, 16 mm) is the best reference:
      s-bend 0.155, oval 0.11, one line loss per run (entityR2B). The controller works
      at this lead and footprint. (2) Iterations 2 and 5 both used 2 cm pitch and
      both collapsed s-bend progress to 0.04. Iteration 5 kept the 4 cm lead, so the
      collapse there cannot be blamed on the lead, but its span also changed. Iteration
      0 used 1 cm pitch and did not collapse (s-bend 0.15). Pitch is therefore the
      leading suspect, not yet proven. (3) Leads below 4 cm are harmful: iteration
      3 (2 cm lead) and iteration 2 (3 cm lead) both collapsed s-bend progress. (4)
      rms_error stayed near 0.03 and steering_oscillation between 0.065 and 0.155
      in every iteration, so jitter is not the limit. Next race: if s-bend progress
      returns to 0.15 or above with 1 cm pitch and line losses fall, keep the 1 cm
      pitch and try a footprint change to 0.012 m to see whether the extra sensors
      are being over-weighted. If s-bend progress stays at 0.04 or falls below 0.11,
      pitch is not the cause, so return to the 5-sensor iteration 4 layout and test
      a different variable, such as the span or the line_loss setting. If progress
      is unchanged but line losses stay at 1, the line_loss setting is the lever to
      test.


      ### Requested changes


      - Keep the 1 cm pitch (seven sensors at x = -0.03 to +0.03 in 0.01 m steps,
      y = 0.04 m) only if s-bend progress is at least 0.15. Use sensor_size 0.016
      and weights x/0.015 (-2, -1.333, -0.667, 0, 0.667, 1.333, 2), which match the
      iteration 4 slope.

      - If s-bend progress falls below 0.11 with 1 cm pitch, return to the iteration
      4 five-sensor layout at 1.5 cm pitch (x = -0.03, -0.015, 0, 0.015, 0.03) and
      test sensor_size 0.012 alone, since iteration 1 with 12 mm footprints gave 0.155
      and iteration 4 with 16 mm gave 0.155.

      - Do not move the lead below 4 cm (y = 0.04 m). Iterations 2 and 3 show s-bend
      progress collapsing to 0.04 at 3 cm and 2 cm leads.


      - [Open this output](iteration-6/entityR1/versions/fc3aec229d41433f819a31e1dae15050/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/c870c8a827274e46bacd9b7d5853963e/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-6aa25987fc14d925/payload.json)'
