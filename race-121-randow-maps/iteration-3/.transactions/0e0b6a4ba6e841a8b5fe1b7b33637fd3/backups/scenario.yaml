map:
  id: race-121-randow-maps
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Shorter lead test (2 cm)
    notes: 'Single-variable change from the best design (iteration 1): the sensor
      lead moves from 4 cm to 2 cm while the ±3 cm five-sensor span is kept. Iteration
      2 removed line losses with a wider array but still went off track at about 0.06
      m, so the lead is the most likely remaining geometry limit.


      ### Rationale


      Race evidence so far. Iteration 0 (5 sensors, ±2 cm span, 5 cm lead, 0.8 kg)
      and iteration 1 (5 sensors, ±3 cm span, 4 cm lead, 0.6 kg, 0.11 m track) both
      ended every run off track at 10-16% progress, with max_error at 0.061-0.066
      m, which is the 0.06 m off-track limit. Iteration 1 reduced line losses from
      1-2 to 1 per run and scored best (51.27). Iteration 2 widened to ±6 cm with
      7 sensors, 16 mm footprints, a 3 cm lead and a 0.10 m track. Line losses fell
      to 0, but the score dropped to 26.99: s-bend progress fell to 4%, and the oval
      and slalom were unchanged at about 11% and 3.5%. So the wider, larger-footprint
      array did not fix the drift. Line losses now read 0 while the robot still exits
      at max_error of about 0.06 m, which means the sensors still see the tape and
      the robot leaves the line anyway. That points away from span and toward the
      lead or the balance between geometry and gains. The Integrator''s request for
      a shorter lead when line losses are zero also fits this. Oscillation stayed
      low (0.065-0.155) in every iteration, so jitter is not the limit. I also see
      that rms_error stays near 0.03 in every design, which suggests a constant offset
      or drift that the geometry alone has not corrected. This iteration changes one
      variable from the best design (iteration 1): the lead moves from y = 0.04 m
      to y = 0.02 m. The span (±3 cm, 5 sensors, 12 mm footprints), mass (0.6 kg),
      track (0.11 m) and wheel radius (0.03 m) are kept, so any change in outcome
      can be attributed to the lead. Expected result: if the lead is the limit, progress
      on the s-bend and oval rises above the 0.15 and 0.11 seen so far, and max_error
      drops below 0.06 m. If progress falls or line losses rise, the lead is too close
      and the next step is to restore 0.04 m and test sensor_size 0.016 alone.


      - [Open this output](iteration-3/entity0/versions/041d859893294c89a977a09f89df4efc/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-ae770cfa20f902e3/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-d75b50be2e54e1e7/payload.json)'
  - id: entity1
    label: 7-sensor ±6cm package
    notes: 'Wider seven-sensor array at a 3 cm lead, with weights scaled to x/0.03
      so the gain scale matches iteration 1. kd rises to 0.15 for the closer lead,
      and wheel_track drops to 0.10 m. Based on iteration 1, which reduced line losses
      to 1 per run but still went off track.


      ### Rationale


      The only race evidence is iteration 0 (entityR2B, 60 trials, no finishes) and
      iteration 1 (entityR2B, 60 trials, no finishes). Iteration 1 cut line losses
      from 1-2 to 1 per run, but every run still went off track at 11-16% progress
      with max_error of 0.061-0.066 m. The sensor span and lead are the main limits,
      not the gains. The Builder''s proposal widens the array to 7 sensors spanning
      ±6 cm at 2 cm pitch, with 16 mm footprints so neighbouring sensors overlap the
      25 mm tape. Sensor weights are x/0.03, giving [-2, -1.333, -0.667, 0, 0.667,
      1.333, 2]. This keeps the same signal slope as iteration 1 (±2 at 3 cm offset),
      so the gains kp 3.0 and kd 0.1 carry over without rescaling. The left-positive
      ordering matches the convention, so a positive weight on the left sensor steers
      left. The lead moves to 3 cm, which reads bends earlier. A closer lead gives
      less time to react, so I raise kd slightly to 0.15 to damp the faster response.
      The wheel track drops to 0.10 m to turn more readily, and mass stays at 0.6
      kg. base_speed stays at 1.6 and ki at 0, since progress has not yet been limited
      by speed or integral action. line_loss stays ''last_direction'' because the
      tape still leaves the array on the sharpest bends. Expected result, not measured:
      line_loss_events near 0, max_error below 0.06 m, and progress well above 0.15.
      If the robot still leaves the track with few line losses, the lead or gains
      are the limit.


      - [Open this output](iteration-2/entity1/versions/d6697091fea4419fab78949084dcbdbc/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/ac256ed50fa746b0934ab03e2ec3fc73/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-fe429c5807d70a23/payload.json)'
  - id: entityR1
    label: Lead and span guidance
    notes: 'Feedback for the Builder: the lead and span are the remaining limits after
      two iterations of 0 finishes and off-track exits. The three requested changes
      cover a shorter lead, smaller footprints, and a narrower span, each tied to
      a specific race outcome.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. (1) In
      iteration 0 the 4 cm, 5-sensor array at a 5 cm lead gave 1-2 line-loss events
      per run and every run went off track at 10-15% progress (entityR2B). The line
      leaves the array on bends. (2) In iteration 1 the wider 6 cm, 5-sensor array
      at a 4 cm lead cut line losses to 1 per run, but all 60 runs still went off
      track at 11-16% progress, with max_error 0.061-0.066 m (entityR2B). Widening
      the span helped but did not solve the drift, so the remaining limits are the
      span and the lead. (3) Oscillation stayed low at 0.07-0.155 across both iterations,
      so the sensor spacing is not causing jitter. (4) For the controller, the weights
      x/0.03 keep the same slope as iteration 1, so kp 3.0 and kd 0.1 carry over.
      A closer lead needs slightly more damping, so I raised kd to 0.15 in the package.
      Next race: if line_loss_events is 0 but the robot still goes off track, the
      lead is probably too far forward for the bend, so try y = 0.02 m. If steering_oscillation
      rises above about 0.15 while line losses stay at 0, reduce sensor_size to 0.012
      or raise kd. If the signal looks too weak at the outer sensors (line losses
      still occur at the ±6 cm extremes), narrow the span to ±5 cm.


      ### Requested changes


      - If line_loss_events is 0 but the robot still goes off track, move the lead
      from y = 0.03 m to y = 0.02 m. Iteration 0 (5 cm lead) and iteration 1 (4 cm
      lead) both gave off-track exits at 11-16% progress with line losses, so the
      lead is still the most likely limit.

      - If steering_oscillation exceeds about 0.15 while line_loss_events stays 0,
      reduce sensor_size from 0.016 to 0.012 m to shrink the footprint overlap. Iteration
      1 showed oscillation of 0.07-0.155, so this only applies if the new array raises
      it.

      - If line losses remain above 0 at the outer sensors (x = ±0.06 m), narrow the
      span to ±0.05 m with 2 cm pitch (x = -0.05, -0.03, -0.01, 0.01, 0.03, 0.05 for
      six sensors, or equivalent seven-sensor spacing). Iteration 1 showed a 6 cm
      span still losing the line once per run, so the outer sensors may be too far
      from the tape.


      - [Open this output](iteration-2/entityR1/versions/d6697091fea4419fab78949084dcbdbc/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/ac256ed50fa746b0934ab03e2ec3fc73/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-fe429c5807d70a23/payload.json)'
