overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor array
    notes: 'Symmetric five-sensor bar, 1 cm spacing, 12 mm footprints, 5 cm ahead
      of the axle, with mid-range body and wheels. No race evidence exists yet, so
      this is a baseline chosen to give a clean first measurement.


      ### Rationale


      Iteration 0 has no race data or integration feedback, so this is a baseline,
      not an optimised design. I chose a symmetric five-sensor bar that spans about
      4 cm across the 25 mm tape, so the line stays under at least one sensor through
      a moderate bend. The 12 mm footprint is half the tape width, so neighbouring
      sensors overlap the tape edge and give a graded reading. Sensors sit 5 cm ahead
      of the axle to read the line before the wheels reach it. Weights are proportional
      to sensor x (-2, -1, 0, 1, 2), so a positive weight on the left sensor steers
      left, matching the signal convention. Body and wheels are mid-range to keep
      the yaw inertia and drive torque moderate: 0.12 m track, 0.03 m wheel radius,
      0.12 m body width (off-track limit about 0.0625 m, which gives margin), 0.18
      m body length, 0.8 kg mass. I expect a complete run with a moderate rms error,
      which I will check against the race telemetry.


      - [Open this output](iteration-0/entity0/versions/579bba4886cc4d8984181d489af78e9b/payload.json)'
  actions:
  - id: action0
