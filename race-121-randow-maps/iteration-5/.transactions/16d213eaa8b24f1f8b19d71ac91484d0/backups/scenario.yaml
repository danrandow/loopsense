overrides:
  entities:
  - id: entity0
    label: ±4 cm span, 16 mm, 4 cm
    notes: 'Widens the five-sensor span from ±3 cm to ±4 cm at a 2 cm pitch, keeping
      the 4 cm lead and 16 mm footprint. Iteration 4 showed the footprint change was
      neutral (score 51.12, progress 0.155, one line loss per run), so this tests
      the span as the Integrator asked. Expect line losses to fall to 0 with progress
      held.


      ### Rationale


      Iteration 4 (±3 cm span, 4 cm lead, 16 mm footprints) scored 51.12, essentially
      level with iteration 1 (51.27). The s-bend progress was 0.155 in both, and line_loss_events
      stayed at 1 per run. So the footprint change did nothing measurable, and sensor_size
      0.016 is neutral. The rule I set last iteration now applies: progress is unchanged
      and line losses remain at 1, so the next geometry test is a ±4 cm span at 16
      mm with 5 sensors. Iteration 2''s s-bend collapse (progress 0.04) came with
      a 3 cm lead as well as the ±6 cm span. Iteration 3 showed a short lead is harmful,
      so that collapse is not clean evidence against a wider span at a 4 cm lead.
      I therefore keep the 4 cm lead, 0.6 kg, 0.11 m track, 0.03 m wheel radius and
      0.12 m body, and change only the span: x = -0.04, -0.02, 0, 0.02, 0.04 at y
      = 0.04 m, with sensor_size 0.016 m. Expected result: the outermost sensors reach
      the tape on bends that currently drop one line loss per run, so line_loss_events
      should fall toward 0 and max_error should stay below about 0.06 m. Progress
      should hold at or above 0.15 on the s-bend. If progress falls below 0.11 on
      the oval, the span is too wide and I return to ±3 cm. The steady rms_error of
      about 0.03 on every track is probably a motor-mismatch offset, which is a controller
      question for the Integrator, not something geometry can fix.


      - [Open this output](iteration-5/entity0/versions/932a831b8a964b65b1fd4c6cc89b1dcc/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-42ed15ef4c13ecc7/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-b1c7254b488a34e5/payload.json)'
  - id: entity1
    label: Complete Robot Package
    notes: 'Complete Robot Package. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      The Builder''s geometry tests only sensor_size (0.012 to 0.016 m) on the iteration
      1 layout, which is the best design so far (score 51.27, s-bend progress 0.155).
      Iteration 3 showed that a 2 cm lead collapses s-bend progress to 0.04, so the
      lead stays at 4 cm. Iteration 2 showed that a 16 mm footprint with a wider span
      removed line losses but did not stop the off-track exits. The controller is
      therefore kept exactly as in iteration 1 (kp 3.0, ki 0, kd 0.1, base_speed 1.6,
      weights [-2,-1,0,1,2], last_direction line loss), so any change in the race
      is attributable to the footprint. I expect line_loss_events to fall toward 0
      and max_error to stay near 0.06 m. This is a prediction, not a measurement.
      The rms_error near 0.03 on every track suggests a steady offset (likely motor
      mismatch), which the controller has not yet addressed; I am not adding integral
      action in this single-variable test.


      - [Open this output](iteration-4/entity1/versions/fd67ef585f594c2b8b98ca1b8b1b18c3/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/330f8b6c69b44a5694c7a89af29193ef/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-300d772fe630dca4/payload.json)'
  - id: entityR1
    label: Integration Feedback
    notes: 'Integration Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. (1) Iteration
      1 (5 sensors, plus or minus 3 cm, 4 cm lead, 12 mm footprints, 0.6 kg, 0.11
      m track) is the best evidence so far: score 51.27, s-bend progress 0.155, line_loss
      1 per run (entityR2B). (2) Iteration 3 moved the lead to 2 cm and dropped s-bend
      progress to 0.04 with the same line-loss count. So the lead should stay at 4
      cm, and the lead is not the limit at 4 cm. (3) Iteration 2 (plus or minus 6
      cm, 16 mm footprints, 3 cm lead) removed line losses to 0 but still exited at
      max_error about 0.06 m, and s-bend progress fell to 0.04. So a wider span or
      footprint alone does not fix the exit. (4) Oscillation stayed in 0.065-0.155
      in all iterations, and rms_error stayed near 0.03 on every track, which points
      to a steady offset rather than a geometry limit. Next race: if progress is at
      least 0.15 on the s-bend and line losses fall to 0, keep the 16 mm footprint
      and move to plus or minus 4 cm span. If progress falls, restore the 12 mm footprint
      and keep the 4 cm lead. If line losses stay at 1 with progress unchanged, the
      controller (gains or ki) is the next lever, not geometry.


      ### Requested changes


      - Keep the 4 cm lead (y = 0.04 m) and the plus or minus 3 cm span with 5 sensors.
      Set sensor_size to 0.016 m alone, as the Builder proposes. Iteration 1 at 12
      mm gave s-bend progress 0.155 and score 51.27, and iteration 3 showed the 2
      cm lead is worse (progress 0.04).

      - If line_loss_events is 0 but progress falls below 0.11 on the oval, the footprint
      is hurting the edge sensing, so restore sensor_size 0.012 m before testing any
      further geometry. Iteration 2 (16 mm, plus or minus 6 cm) dropped s-bend progress
      to 0.04 with 0 line losses.

      - If progress is unchanged and line losses remain at 1, try a plus or minus
      4 cm span at 16 mm with 5 sensors (x = -0.04, -0.02, 0, 0.02, 0.04). Iteration
      1 at plus or minus 3 cm still lost the line once per run, and iteration 2 at
      plus or minus 6 cm removed the losses but cost progress.


      - [Open this output](iteration-4/entityR1/versions/fd67ef585f594c2b8b98ca1b8b1b18c3/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/330f8b6c69b44a5694c7a89af29193ef/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-300d772fe630dca4/payload.json)'
