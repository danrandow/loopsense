  entities:
  - id: entity0
    label: Faster steering, narrower
    notes: 'Raises kp 2.0→2.6 and kd 0.6→0.9, and narrows wheel_track 0.12→0.10 m
      for more yaw authority. Aimed at the slalom, which ran off track at progress
      0.17 with max_error near the 0.06 m limit, while keeping the proven seven-sensor
      array and the oval at about 950.


      ### Rationale


      Evidence from iteration 2 (score 563.9, best so far): the oval is solved (20/20
      finished, max_error 0.035). The s-bend finishes 11/20 and fails 9/20 by off_track.
      The slalom fails 20/20 by off_track at progress 0.17, with max_error about 0.065
      and about 1 line-loss event per run. Steering oscillation is low (0.19 to 0.39),
      so the robot is not jittering. It is reacting too slowly to fast alternating
      bends and drifting past the 0.06 m off-track limit. The limit is fixed at 0.06
      m for this body width, because a 0.12 to 0.18 m body does not raise it above
      0.06 m. Changes: (1) Raise kp from 2.0 to 2.6 for a stronger correction per
      unit of sensor offset. The signal scale is unchanged, so the increase is a pure
      gain change. (2) Raise kd from 0.6 to 0.9 to damp the larger correction, since
      oscillation has margin (about 0.3 against an observed ceiling in the oval).
      (3) Narrow wheel_track from 0.12 to 0.10 m, which raises yaw rate per unit of
      wheel differential and gives the steering more authority on tight bends. Mass,
      sensor array (seven sensors, x = -0.06 to +0.06, y = 0.05), sensor weights,
      base_speed (1.0) and line_loss (last_direction) are kept, so the change is mostly
      about steering agility. Expected result: slalom progress rises above 0.5 with
      fewer off-track ends, and s-bend finish rate rises above 0.55. The oval should
      remain near 950. Hypotheses to test next: (a) if max_error on the slalom stays
      near 0.06 while oscillation stays low, steering is still too slow, so raise
      kp further (toward 3.0) and consider a sensor array further forward; (b) if
      oscillation rises above about 0.5 on the oval, kd is too low relative to kp;
      (c) if the robot finishes reliably but completion_time is above 2.5 s, raise
      base_speed toward 1.2 to 1.3.


