  entities:
  - id: entity0
    label: Forward, wider sensor
    notes: 'Moves the sensor row forward to y=0.07 and widens it to +/-0.08 m, with
      weights rescaled to x/0.04 to keep the steering gain. This targets the slalom
      failures (max_error about 0.063, 0.85 line losses per run) while keeping the
      oval result from iteration 3.


      ### Rationale


      Evidence from iteration 3 (score 659.4, best so far). The oval is solved: 20/20
      finished, mean time 1.76 s, max_error 0.021. The s-bend finishes 18/20, with
      two off-track ends. The slalom still fails 20/20 off track at progress 0.31,
      with max_error about 0.063 (just past the 0.06 m limit) and 0.85 line-loss events
      per run. Oscillation is low (0.27 on slalom), so the robot is not jittering.
      It is reacting too late to fast alternating bends. The sensors sit 0.05 m ahead
      of the axle, so every correction is applied only after the error has already
      grown. Changes: (1) Move the sensor row forward from y=0.05 to y=0.07 m, so
      steering reacts earlier and the phase lag falls. (2) Widen the array from +/-0.06
      m to +/-0.08 m (seven sensors at -0.08, -0.053, -0.027, 0, 0.027, 0.053, 0.08),
      so the tape stays under a sensor when the robot drifts further, which should
      cut line-loss events. (3) Rescale the weights to x/0.04, giving (-2.0, -1.33,
      -0.67, 0, 0.67, 1.33, 2.0). This keeps the steering gain per metre of offset
      the same as iteration 3, so the proven kp/kd balance is not disturbed by the
      array change. kp 2.6, kd 0.9, ki 0, base_speed 1.0, wheel_track 0.10, mass 0.6
      and line_loss last_direction stay unchanged, so the change is mainly sensing
      lead and reach. Expected result: slalom progress above 0.5 with fewer off-track
      ends and fewer line losses; s-bend finish rate at or above 0.9; oval still near
      950. Hypotheses to test next: (a) if slalom max_error stays near 0.06 with few
      line losses, steering authority is the limit, so raise kp toward 3.0 and watch
      oscillation; (b) if oscillation rises above about 0.5, kd needs to rise with
      kp; (c) if the robot finishes reliably but completion_time is above 2.5 s, raise
      base_speed toward 1.2.


