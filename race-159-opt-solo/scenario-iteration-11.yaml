  - id: entity0
    label: kp 4.0 / kd 1.5 steering
    notes: 'Raises kp from 3.6 to 4.0 and kd from 1.3 to 1.5 on the iteration 10 design,
      the only change. Slalom progress rose at every earlier gain step (0.64 to 0.80),
      and oval oscillation (0.18) leaves room for more correction.


      ### Rationale


      Evidence from iteration 10 (score 800.3, best so far). The oval (20/20, 1.90
      s, max_error 0.018) and s-bend (19/20, max_error 0.032) are solved. The slalom
      is the only failing track: 8/20 finished, 12 off-track, progress 0.80, up from
      0.64 at kp 3.2. Each steering-gain step on the 16 mm footprint has raised slalom
      progress (kp 2.6 to 3.2 gave 0.31 to 0.64, kp 3.2 to 3.6 gave 0.64 to 0.80),
      and line_loss_events on the slalom stayed low (0.35). So steering authority
      is still the limit, not sensing or speed. Slalom steering_oscillation rose to
      0.45 and control_effort to 16.6, but oval oscillation is only 0.18, so there
      is margin. Change: raise kp from 3.6 to 4.0 for more correction per unit of
      signal, and raise kd from 1.3 to 1.5 to keep the damping ratio near the 0.36
      that gave clean oval and s-bend results and to control the rising slalom jitter.
      Geometry, sensor weights, base_speed 0.85, ki 0 and last_direction line loss
      are unchanged, so the gain step is isolated. Expected result: slalom progress
      about 0.85 to 0.9 with more finishes (about 10 to 14 of 20), oval and s-bend
      still at or above about 940. Risk: slalom oscillation may pass 0.5 and cut the
      finish rate. If it does, the next step is kd about 1.8 rather than lowering
      base_speed, because finishing is worth far more than the small time term. Hypotheses
      for the next race: (a) if slalom progress reaches about 0.9 but still ends off
      track, the limit is speed through the sharpest bends, so base_speed should drop
      to about 0.75; (b) if oval steering_oscillation exceeds 0.3, kd is too low and
      should rise to about 1.8; (c) if slalom line_loss_events rise above 0.5, the
      16 mm footprint is overlapping background on sharp bends and 12 mm should be
      retested with these gains. Measurements requested: all available measurements,
      so per-track progress, max_error, oscillation and line-loss counts can be compared
      with iteration 10.


