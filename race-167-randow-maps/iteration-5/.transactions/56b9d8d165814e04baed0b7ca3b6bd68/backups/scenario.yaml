  id: race-167-randow-maps
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Lookahead y 0.08 test
    notes: 'Single-variable step: sensor lookahead moves from y 0.07 to the 0.08 limit,
      keeping the best-scoring geometry (534 at y 0.07). The score has risen monotonically
      with lookahead (131.9, 454.6, 534.0), and the s-bend still ends off track 11
      of 20 times. I did not follow the Integrator''s wheel_track 0.14 step, because
      a wider track reduces yaw per unit of wheel command.


      ### Rationale


      Iteration 4 (y 0.07) is the best design so far at 534.0, up from 454.6 at y
      0.06. Its oval finish rate is 20/20 with max_error 0.020 and oscillation 0.22,
      so the longer lookahead did not add jitter. Across the lookahead sweep the score
      runs 131.9 (y 0.04), 454.6 (y 0.06), 534.0 (y 0.07), a consistent gain from
      longer lookahead. The s-bend is still the main loss: 11 of 20 runs leave the
      track, max_error is 0.048, and control_effort is 11.2, so the robot is still
      late into bends. Slalom is 0/20 with line_loss 1.0, which is at the threshold
      for a change. Two options follow from the evidence. Integrator feedback (R1)
      proposes wheel_track 0.14, but I checked the physics and it is doubtful. Turn
      rate is the wheel speed difference divided by wheel_track, so a wider track
      gives less yaw per unit of PWM difference, which reduces steering authority
      rather than adding it. I am therefore not following that step yet. The monotone
      lookahead trend is the better-supported lever, and y 0.07 is still well inside
      the 0.08 limit. I will test y 0.08 as the single change, keeping 16 mm footprints,
      the 0.024 m span, wheel_track 0.12, kp 4.0 and kd as the Integrator set them.
      Expected result: s-bend off-track exits fall below about 9 of 20 and max_error
      drops below 0.048, oval finish stays near 1.0, and slalom line_loss stays near
      or below 1.0. Watch oscillation: if it rises above about 0.4 or the oval finish
      falls below 0.85, revert to y 0.07 and test a narrower track (wheel_track 0.10)
      or kp adjustment, since that gives more yaw per command.


      - [Open this output](iteration-5/entity0/versions/fe60b9f3fe9e4a61878b83aaca1f92b2/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-c8b27ea664054d91/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-717e1432549f4613/payload.json)'
  - id: entity1
    label: Iter 1 geometry, y 0.07
    notes: 'Reverts to the best iteration 1 geometry (score 454.6) and sets sensor
      y to 0.07 with the iteration 1 controller unchanged. Iteration 3 showed y 0.04
      cut the score to 131.9, so the trend favours a longer lookahead.


      ### Rationale


      Iteration 3 (y 0.04) scored 131.9, far below iteration 1 (y 0.06, 454.6). The
      oval finish rate fell from 18/20 to 0/20 and max_error rose to 0.065, so a shorter
      lookahead is clearly harmful. The Builder''s candidate moves the sensors to
      y 0.07 on the iteration 1 geometry (16 mm footprints, x = ±0.024 m at 12 mm
      pitch, 0.12 m track, 0.8 kg). I am keeping the iteration 1 controller (kp 4.0,
      ki 0.1, kd 0.5, base_speed 1.6, last_direction, weights [2,1,0,-1,-2]) and changing
      nothing else. The sensor x positions and weights are unchanged, so signal scale
      per unit error is the same as in iteration 1. Only the timing of the signal
      changes, so any difference is attributable to lookahead. Iteration 2 showed
      that changing the signal scale through span without retuning kp caused harm,
      so I am not retuning kp here. The main risk is phase lag from a longer lookahead,
      which could raise steering_oscillation (0.36 on the s-bend at y 0.06). The Builder''s
      own feedback request asks whether this lag appears, so all measurements are
      requested to test it.


      - [Open this output](iteration-4/entity1/versions/2fbfc05612ce4d9e94a33961f734cc14/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/74903d9f596b40eab8ab7bae250c3c59/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-9dec104ac6f6b2c4/payload.json)'
  - id: entityR1
    label: 'Feedback: y 0.07'
    notes: 'Feedback written before the race, based on iterations 1 to 3. It sets
      out the next change depending on whether s-bend exits fall and whether oscillation
      stays below about 0.4. It also rules out the stale advice to keep y 0.04.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Evidence
      from iteration 1 (y 0.06, 16 mm footprints, span ±0.024 m, kp 4.0, score 454.6):
      the oval finished 18 of 20 with max_error 0.026 and steering_oscillation 0.21,
      but the s-bend finished only 4 of 20 (16 off-track exits, max_error 0.056, oscillation
      0.36) and the slalom finished 0 of 20 with 1.05 line-loss events at low rms_error
      (0.022). Iteration 3 showed that moving to y 0.04 (score 131.9, oval finish
      0 of 20, max_error 0.065) is strongly harmful, so the trend favours a longer
      lookahead. Iteration 2 showed that widening the span with kp 4.5 is also harmful,
      so keep span ±0.024 and kp 4.0 unless evidence says otherwise. The Integrator''s
      controller has needed no fixes beyond kp for this geometry, with no controller
      errors so far. Next race: if the s-bend off-track exits fall and max_error drops
      below about 0.056 while the oval finish stays near 0.9, keep y 0.07 and try
      the first requested change. If steering_oscillation rises above about 0.4 or
      the oval finish falls below about 0.85, the longer lookahead is adding phase
      lag, so step back to y 0.065 and try the second change. If slalom line_loss
      stays above about 1.0 with lookahead fixed, try the third change.


      ### Requested changes


      - If the s-bend off-track rate falls at y 0.07 but slalom line_loss stays above
      about 1.0, try wheel_track 0.14 (from 0.12) at the same sensor layout. Evidence:
      iteration 1 s-bend control_effort was 11.07, the highest of any track, so the
      wheels are working hard to turn and a wider track adds turn authority without
      changing the signal scale.

      - If steering_oscillation rises above about 0.4 or the oval finish rate falls
      below 0.85 at y 0.07, try y 0.065 with the same span and footprint. Evidence:
      iteration 1 oscillation was 0.21 on the oval at y 0.06, and iteration 3 showed
      the response to lookahead is strong, so move in small steps.

      - If the bends still leave the track with lookahead fixed and wheel_track 0.14
      does not help, try sensor_size 0.012 with x = ±0.024, 0 at 12 mm pitch and y
      0.07, keeping kp 4.0. Evidence: iteration 0 (12 mm footprints, y 0.06) had oval
      finish 16 of 20 with higher line loss than iteration 1, so the footprint size
      is a trade-off and should be tested only after lookahead is settled.


      - [Open this output](iteration-4/entityR1/versions/2fbfc05612ce4d9e94a33961f734cc14/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/74903d9f596b40eab8ab7bae250c3c59/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-9dec104ac6f6b2c4/payload.json)'
