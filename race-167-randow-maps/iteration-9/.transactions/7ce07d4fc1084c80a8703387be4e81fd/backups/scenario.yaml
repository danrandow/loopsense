map:
  id: race-167-randow-maps
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Track 0.17 (from 0.16)
    notes: 'Widens wheel_track from 0.16 to 0.17 m with everything else fixed, following
      the monotone track-width gain (496 to 661) and the Integrator''s gate, which
      iteration 8 met with s-bend exits at 1 of 20 and max_error 0.027. Expected gain
      is small as the s-bend saturates; revert to 0.16 if exits or max_error rise.


      ### Rationale


      Iteration 8 (wheel_track 0.16, sensors at y 0.08, 16 mm footprints, x ±0.024
      m) scored 661.5, the best so far. The track-width sweep at y 0.08 is now monotone:
      0.10 gives 496.4, 0.12 gives 561.6, 0.14 gives 628.6 and 0.16 gives 661.5. S-bend
      off-track exits fell to 1 of 20 (finish 19/20), max_error fell to 0.027, and
      control_effort fell to 8.2. The oval stayed at 20/20 with oscillation 0.21,
      and s-bend oscillation was 0.285, under the 0.4 gate. R1''s gate for the next
      step is met: s-bend exits are below 4, max_error is at or below 0.034, and oscillation
      is under 0.4. I am therefore following R1''s first requested change and moving
      to wheel_track 0.17, keeping everything else fixed at iteration 8 values so
      the result isolates track width. The gain per step is shrinking (+67 at 0.14→0.16,
      +33 at 0.16→0.17 expected), and the s-bend is nearly saturated, so the expected
      gain is small: a score around 670 to 685, with max_error near 0.025 and s-bend
      exits at 0 to 1. Slalom has been 0/20 at every geometry, with line_loss about
      1.05 to 1.2 and max_error about 0.063. It is not the target of this step; the
      sensor span, footprint and lookahead were already tested without fixing it.
      The unseen final track is a different shape, so I will not treat the s-bend
      gain as proof of general performance. Risk: a wider track could make the robot
      sluggish on tight bends. If s-bend exits rise above 1 of 20, max_error rises
      above 0.030, or the oval finish falls below 0.85, revert to wheel_track 0.16
      (iteration 8).


      - [Open this output](iteration-9/entity0/versions/44e2262553094f55b1701f07eb0efd24/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-641efaabca75918e/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-6e0171e59515bdab/payload.json)'
  - id: entity1
    label: Wider track 0.16 test
    notes: 'Complete robot with wheel_track 0.16 on the iteration 7 sensor layout
      and controller, so track width is the only change from the 628.6 best. Evidence
      is the monotone track-width sweep at y 0.08. No outcome is claimed.


      ### Rationale


      Iteration 7 (wheel_track 0.14, y 0.08, kp 4.0) is the best design so far at
      628.6. Across the track-width sweep at y 0.08, the score moved 496.4 (0.10),
      561.6 (0.12), 628.6 (0.14), and the s-bend off-track exits fell 15, 9, 4 of
      20. The narrower direction overshot in bends, so the monotone trend favours
      a wider track. The Builder''s proposal is wheel_track 0.16 with everything else
      unchanged, so I keep the iteration 7 controller unchanged (kp 4.0, ki 0.1, kd
      0.5, base_speed 1.6, weights [2,1,0,-1,-2], last_direction). This keeps the
      race a one-variable test of track width. I considered raising kp to offset the
      lower yaw per command at a wider track, but iteration 2 showed that a gain change
      without evidence can hurt, so I leave kp for a later step if max_error rises.
      Oscillation was 0.19 on the oval and 0.32 on the s-bend at 0.14, both under
      the 0.4 gate, so there is margin. Slalom has stayed at 0 of 20 at every geometry
      tested, so this race is not aimed at it. I make no claim about the result of
      this package.


      - [Open this output](iteration-8/entity1/versions/2bdda32aaa154729b5c76d313b01f40b/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/cb15c111adcf4473acfa7b292bd8a3ef/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-b61d59bfaefe096a/payload.json)'
  - id: entityR1
    label: Track width next steps
    notes: 'Feedback before racing: follow the wider-track trend and keep kp at 4.0.
      Conditional changes cover a further widening, a kp raise if max_error rises,
      and a kd test for slalom once track width is settled.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Evidence
      from iteration 7 (wheel_track 0.14, y 0.08, kp 4.0, score 628.6): the oval finished
      20 of 20 with oscillation 0.19, the s-bend finished 16 of 20 with 4 off-track
      exits, max_error 0.034 and control_effort 8.9, and slalom stayed 0 of 20 with
      line_loss 1.05. Iteration 6 (wheel_track 0.10, score 496.4) showed that a narrower
      track overshoots in bends, with s-bend exits rising to 15 of 20 and max_error
      to 0.057. So the wider track is the supported direction. I am following your
      wheel_track 0.16 step, and I have kept kp at 4.0 so the track change is isolated.
      Next race: if s-bend off-track exits fall below 4 of 20, max_error stays at
      or below 0.034 and oscillation stays under about 0.4, keep the track width trend
      and try the first requested change. If max_error rises above 0.034 while the
      s-bend exits stay flat or rise, the wider track is making bends sluggish, so
      hold wheel_track at 0.14 and try the second change. If the oval finish drops
      below 0.85, revert to iteration 7 at once.


      ### Requested changes


      - If the s-bend exits fall below 4 of 20 at wheel_track 0.16 with max_error
      at or below 0.034, try wheel_track 0.17 at y 0.08 with kp 4.0. Evidence: track
      width improved monotonically from 0.10 to 0.14 (496.4, 561.6, 628.6), and the
      s-bend exits fell 15, 9, 4 of 20.

      - If max_error rises above 0.034 at wheel_track 0.16, keep wheel_track 0.14
      and raise kp to 4.5 with ki 0.1 and kd 0.5 unchanged. Evidence: at iteration
      7 the s-bend control_effort was 8.9 and max_error 0.034, so there is some room
      to raise the steering gain. Note that kp 4.5 was harmful at the wider span in
      iteration 2, so keep this to a single step.

      - If slalom is still 0 of 20 once track width is settled, do not change the
      span or footprint; instead test kd 0.8 at the best track width. Evidence: slalom
      has been 0 of 20 at every geometry tested, span widening (iteration 2) and the
      12 mm footprint (iteration 0) did not help, and s-bend oscillation of 0.32 leaves
      margin under the 0.4 gate.


      - [Open this output](iteration-8/entityR1/versions/2bdda32aaa154729b5c76d313b01f40b/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/cb15c111adcf4473acfa7b292bd8a3ef/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-b61d59bfaefe096a/payload.json)'
