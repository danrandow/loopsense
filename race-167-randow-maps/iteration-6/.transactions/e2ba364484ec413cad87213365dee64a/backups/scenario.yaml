map:
  id: race-167-randow-maps
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Narrower track 0.10 at
    notes: 'Keeps the best lookahead (y 0.08, score 561.6) and narrows wheel_track
      from 0.12 to 0.10 to raise yaw per PWM count for the s-bend, where off-track
      exits and control_effort are highest. Rests on the monotone lookahead trend
      and the contract''s turn-rate equation; reverts to 0.12 if oscillation exceeds
      about 0.4.


      ### Rationale


      Iteration 5 (sensor y 0.08) is the best design so far at 561.6, up from 534.0
      at y 0.07 and 454.6 at y 0.06. The lookahead gain has been monotone across y
      0.04 (131.9), 0.06 (454.6), 0.07 (534.0) and 0.08 (561.6), and oscillation stayed
      low (oval 0.20, s-bend 0.32). Oval finish held at 20/20. The s-bend is still
      the main loss: 9 of 20 runs leave the track, with control_effort 12.2, the highest
      of any track, so the robot is still working hard in bends. Slalom remains 0/20
      with line_loss about 1.35, so no lookahead change is likely to fix it. y 0.08
      is the top of the allowed range, so lookahead cannot move further. The next
      lever is wheel_track. The contract defines turn rate as the wheel speed difference
      divided by wheel_track, and the PWM difference is set by turn times 350. A narrower
      track therefore gives more yaw per unit of steering command. This corrects the
      earlier R2A-era concern that a wider track gives more authority, which was physically
      backwards. I am keeping every sensor at y 0.08 and all other geometry fixed,
      and changing only wheel_track from 0.12 to 0.10. The Integrator''s gate is met:
      s-bend off-track exits fell and max_error dropped below 0.048, with oscillation
      under 0.4. Expected result: s-bend control_effort falls and off-track exits
      drop below 9 of 20, with the oval staying near 1.0. Risk: the higher yaw gain
      could raise steering_oscillation; if it rises above about 0.4 or the oval finish
      falls below 0.85, revert to wheel_track 0.12 at y 0.08, which is the best known
      design.


      - [Open this output](iteration-6/entity0/versions/78ee6d1edcaa4ba9a56fd869c98cccee/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-7b7057605a7a57ea/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-cf4d414734b61893/payload.json)'
  - id: entity1
    label: Y 0.08 lookahead, same
    notes: 'Moves all sensors to y 0.08 on the best design (iteration 4, 534.0) and
      keeps the iteration 4 controller unchanged, so the race tests lookahead alone.
      The monotone sweep (131.9, 454.6, 534.0) supports it.


      ### Rationale


      The Builder''s candidate moves all five sensors from y 0.07 to y 0.08 on the
      best-known geometry (iteration 4, score 534.0). Across the lookahead sweep the
      score runs 131.9 (y 0.04), 454.6 (y 0.06), 534.0 (y 0.07), so the trend is monotone
      and the Builder''s single-variable test is well supported. The x positions,
      16 mm footprints, 0.12 m track and weights are unchanged, so the signal scale
      per unit of lateral error is the same as in iteration 4. The controller therefore
      stays exactly as it raced in iteration 4 (kp 4.0, ki 0.1, kd 0.5, base_speed
      1.6, last_direction, weights [2,1,0,-1,-2]). Changing kp or kd now would confound
      the lookahead test, and the iteration 4 oval oscillation of 0.22 leaves room
      for the extra 0.01 m of lead. I considered raising kd to damp a longer lead,
      but there is no race evidence for that, so I am not making the change. I also
      withdraw my earlier suggestion of wheel_track 0.14 for more turn authority.
      Turn rate is the wheel speed difference divided by wheel_track, so a wider track
      gives less yaw per PWM count, which the Builder correctly identified. Expected
      behaviour, without claiming a result: the s-bend off-track exits and max_error
      fall from iteration 4, the oval finish stays near 1.0, and oscillation stays
      below about 0.4.


      - [Open this output](iteration-5/entity1/versions/56b9d8d165814e04baed0b7ca3b6bd68/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/fe60b9f3fe9e4a61878b83aaca1f92b2/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-717e1432549f4613/payload.json)'
  - id: entityR1
    label: Narrow track, y 0.08 next
    notes: 'Corrects my earlier wheel_track 0.14 advice, which was physically backwards,
      and proposes wheel_track 0.10 for more steering authority. Gives fallback to
      y 0.07 if oscillation rises, based on the iteration 4 and 3 evidence.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Evidence
      from iteration 4 (y 0.07, 16 mm footprints, span ±0.024 m, kp 4.0, kd 0.5, score
      534.0): the oval finished 20 of 20 with max_error 0.020 and oscillation 0.22,
      the s-bend finished 9 of 20 with 11 off-track exits and max_error 0.048, and
      slalom finished 0 of 20 with line_loss 1.0. Iteration 3 (y 0.04, score 131.9)
      and iteration 1 (y 0.06, score 454.6) show that lookahead gain is strong and
      monotone so far. Iteration 2 showed that widening the span to ±0.032 m with
      kp 4.5 hurt the oval, so keep the span and footprint. I am correcting my earlier
      advice: I previously suggested wheel_track 0.14 for more turn authority, and
      that was wrong. Yaw per PWM count is the wheel speed difference divided by wheel_track,
      so a narrower track adds yaw authority. Next race, if the s-bend off-track exits
      fall and max_error drops below 0.048 while the oval finish stays at 1.0 and
      oscillation stays below about 0.4, keep y 0.08 and try the first requested change
      to reduce s-bend control_effort. If oscillation rises above about 0.4 or the
      oval finish falls below 0.85, step back to y 0.07 (the best design so far) and
      try the second change. If slalom line_loss stays at about 1.0 with lookahead
      fixed, try the third change.


      ### Requested changes


      - If the s-bend off-track exits fall at y 0.08 with oscillation below 0.4, try
      wheel_track 0.10 (from 0.12). Evidence: iteration 4 s-bend control_effort was
      11.2, the highest of any track, and turn rate per PWM count rises as wheel_track
      falls, so a narrower track gives more steering authority at the same sensor
      layout. This replaces my earlier wheel_track 0.14 suggestion, which was physically
      backwards.

      - If steering_oscillation rises above about 0.4 or the oval finish rate falls
      below 0.85 at y 0.08, revert to sensor y 0.07 (iteration 4, score 534.0, oval
      20 of 20, oscillation 0.22) and keep wheel_track 0.12. Evidence: iteration 3
      showed that lookahead changes the score strongly, so move in small steps.

      - If slalom line_loss stays at about 1.0 with lookahead fixed, do not widen
      the span (x beyond ±0.024). Evidence: iteration 2 at ±0.032 with kp 4.5 cut
      the oval finish to 8 of 20 and did not fix the bends. Instead, test wheel_track
      0.10 together with the lookahead that wins, since the narrower track adds yaw
      per PWM count and is the lever with the least evidence against it.


      - [Open this output](iteration-5/entityR1/versions/56b9d8d165814e04baed0b7ca3b6bd68/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/fe60b9f3fe9e4a61878b83aaca1f92b2/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-717e1432549f4613/payload.json)'
