map:
  id: race-167-randow-maps
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Wider 16mm sensor span
    notes: 'Moves the outer sensors from ±0.024 m to ±0.032 m at a 16 mm pitch, keeping
      the 16 mm footprint. Iteration 1 left s-bend and slalom line loss at 1.1 and
      1.05, with low rms_error, so the tape is leaving the array at the edges.


      ### Rationale


      Iteration 1 (16 mm footprints) helped but did not fix the problem. The oval
      finish rate rose from 16/20 to 18/20 and line_loss fell from 0.95 to 0.45. The
      s-bend barely moved: line_loss is 1.1 (was 1.2), finish rate is 4/20, and off-track
      exits are 16/20. The slalom is still 0/20 with line_loss 1.05 (was 1.9). rms_error
      stays low on both (0.017 and 0.022), and max_error on the s-bend is 0.056, close
      to the 0.06 m limit. So the robot is still losing the tape at the edge of the
      five-sensor array rather than tracking poorly. R1''s rule applies: line loss
      is still well above 0.5 with the 16 mm footprint, so widen the sensor span rather
      than the footprint or body. I will keep sensor_size at 0.016 and move the outer
      sensors from x = ±0.024 to ±0.032, with the inner sensors at ±0.016 and 0. This
      gives an even 16 mm pitch across a 0.064 m span, so a tape displaced to about
      ±0.035 m still falls under an outer sensor. I am not changing wheel_track, mass,
      body or lookahead yet, so the result is attributable to one variable. The body_width
      field has no effect below about 0.19 m, so it stays at 0.12. I expect line_loss_events
      on the s-bend and slalom to fall toward or below 0.5, with a higher s-bend finish
      rate. Note for the Integrator: the sensor weights [2,1,0,-1,-2] now sit on a
      wider span, so the signal per unit of lateral error is larger; they may need
      to re-tune kp.


      - [Open this output](iteration-2/entity0/versions/4783d62060304c55a56f3ffcab2b7c35/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-8194f3be87542839/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-8143f1e5fdd73196/payload.json)'
  - id: entity1
    label: 16mm sensor footprint
    notes: 'Changes sensor_size from 0.012 to 0.016 and keeps the controller and all
      other geometry fixed. Based on iteration 0, where s-bend and slalom show high
      line_loss_events (1.2, 1.9) with low rms_error, pointing to sensor coverage
      rather than steering.


      ### Rationale


      Iteration 0 produced only aggregates, no per-step telemetry. The clearest signal
      is on the s-bend and slalom: line_loss_events average 1.2 and 1.9 while rms_error
      stays low (0.017 and 0.027), and runs end off track. On the oval, rms_error
      is 0.0105 with 16 of 20 finishes, so the controller is tracking adequately where
      the line stays visible. Per the Builder''s intent, I am changing one variable
      only: sensor_size goes from 0.012 to 0.016 with x positions, y lookahead, track,
      wheels, body and mass unchanged. Each footprint then overlaps its neighbours
      more, so at least one sensor should keep reading tape through tight bends. I
      am also keeping the controller identical to iteration 0 (weights [2,1,0,-1,-2],
      kp 4, ki 0.1, kd 0.5, base_speed 1.6, last_direction). This keeps the race a
      clean test of the footprint change, and the baseline gains already gave low
      oscillation (0.28 to 0.35) and no controller errors. The expected result is
      line_loss_events below about 0.5 on the s-bend and slalom, a higher s-bend finish
      rate, and no worse oscillation on the oval. Body_width is not changed because
      the off-track limit stays at 0.06 m for any body width up to about 0.19 m. The
      16 mm footprint is inside the allowed sensor_size set, and the sensor positions
      are inside their limits.


      - [Open this output](iteration-1/entity1/versions/65a2ba397e6647978bbdc720ee18f2fd/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/2674c1e0be794063ae361e274594a70d/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-8e5f13cc067e4672/payload.json)'
  - id: entityR1
    label: Span or lookahead next
    notes: 'Gives the Builder three conditional next steps: widen the sensor span,
      shorten lookahead to y 0.04, or try a wider track, each depending on what the
      next race shows. The steps are tied to iteration 0 line-loss, off-track and
      control-effort figures; no result is claimed for this candidate.


      ### Feedback


      Written before this candidate has raced. Evidence from iteration 0: the oval
      finishes 16 of 20 with rms_error 0.0105 and max_error 0.032, well inside the
      0.06 m limit, while the s-bend (line_loss_events 1.2, 18 of 20 off track) and
      slalom (line_loss_events 1.9, 20 of 20 off track) show high line loss with low
      rms_error. The Integrator had no integration problems with the [2,1,0,-1,-2]
      weights, kp 4, kd 0.5 or base_speed 1.6: steering_oscillation stayed between
      0.24 and 0.35 and there were no controller errors. So the limit looks like sensor
      coverage at tight bends, not steering. Next race: if line_loss_events on the
      s-bend and slalom fall below about 0.5 and the finish rate rises, keep the 16
      mm footprint and move on to lookahead. If line loss falls but the robot still
      leaves the track, reduce lookahead (y 0.06 to 0.04) to test whether the off-track
      exits come from late reaction. If line loss stays high with the 16 mm footprint,
      widen the sensor span rather than the footprint, since the robot is losing the
      tape at the edge of the array. The body_width field has no effect on the off-track
      limit below about 0.19 m, so do not change it.


      ### Requested changes


      - If line_loss_events on the s-bend and slalom are still above about 0.5 with
      sensor_size 0.016, widen the sensor span: x = 0.032, 0.016, 0.0, -0.016, -0.032
      at y 0.06, keeping sensor_size 0.016. Evidence: iteration 0 slalom had 1.9 line
      losses with rms_error only 0.027, so the tape is leaving the sensor array rather
      than the controller tracking poorly.

      - If line_loss_events fall but the robot still goes off track, set every sensor
      y to 0.04 (from 0.06) to test whether a shorter lookahead helps the robot react
      to bends. Evidence: iteration 0 s-bend had 18 of 20 off-track ends with max_error
      0.061, close to the 0.06 limit, and steering_oscillation of 0.35 leaves some
      margin to test this.

      - If the robot holds the line with low error and no line loss on all three tracks,
      keep the geometry and try wheel_track 0.14 (from 0.12) to add turn authority
      at base_speed 1.6. Evidence: the baseline control_effort on the s-bend (10.2)
      is the highest of any track, which suggests the wheels are working hard to turn.


      - [Open this output](iteration-1/entityR1/versions/65a2ba397e6647978bbdc720ee18f2fd/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/2674c1e0be794063ae361e274594a70d/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-8e5f13cc067e4672/payload.json)'
