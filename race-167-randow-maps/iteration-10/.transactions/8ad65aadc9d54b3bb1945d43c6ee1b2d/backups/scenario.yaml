map:
  id: race-167-randow-maps
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Revert to 0.16 track, kd
    notes: 'Reverts wheel_track from 0.17 (score 651.1, s-bend exits 2 of 20) to the
      best measured 0.16 (score 661.5) and asks for a kd 0.8 test on that baseline.
      Rests on the monotone track-width sweep (496.4 to 661.5) and the 0.17 gate failure.


      ### Rationale


      Iteration 9 tested wheel_track 0.17 and scored 651.1, below the 661.5 of iteration
      8 at 0.16. The track-width gain has peaked. The gate in my own intent was an
      s-bend off-track count above 1 of 20, and the result was 2 of 20 (finished 18),
      so the gate fires and I revert to 0.16. max_error stayed low at 0.028 and control_effort
      fell to 8.1, so the wider track was not sluggish. It was over-yawing at the
      edge of the bends: exits rose even though the average error improved. Oval stayed
      20/20 and oscillation stayed well under 0.4. Track width is therefore settled
      at 0.16, the best measured point. Slalom remains 0/20 at every geometry tested
      (line_loss 1.0 to 1.35, max_error about 0.063, progress about 0.31), and it
      is not addressed by track width. Span, footprint and lookahead have already
      been tested without fixing it. The remaining untested lever that does not disturb
      the bend result is the controller''s damping. I therefore propose returning
      to the 0.16 geometry unchanged, which gives a deterministic baseline near 661.5,
      and asking the Integrator to test kd 0.8 on it, as the R1 plan set out. The
      expected result is a small gain or no change on the s-bend, and a readable slalom
      line_loss and off-track count from that race.


      - [Open this output](iteration-10/entity0/versions/bdd7570e14fd4100b7c1360cc1d5f033/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-b4b0cb08c7fe2455/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-ba96dcbc4c8d07fb/payload.json)'
  - id: entity1
    label: kd 0.8 on wheel_track
    notes: 'Complete robot at the best track width (0.16) with kd raised from 0.5
      to 0.8 to test damping. Based on iteration 8 (661.5) and iteration 9''s peaked
      track-width gain (651.1).


      ### Rationale


      Iteration 9 (wheel_track 0.17) scored 651.1, below the 661.5 of iteration 8
      at 0.16, and its s-bend had 2 off-track exits. The Builder has reverted to wheel_track
      0.16 with every other geometry field at iteration 8 values, so this package
      uses that geometry. The Builder asks for kd 0.8 to test whether damping helps
      the s-bend or the slalom. Iteration 8 showed s-bend oscillation of 0.29 and
      oval oscillation of 0.21, both well under the 0.4 gate, so the margin supports
      a damping test. The controller is otherwise unchanged: kp 4.0, ki 0.1, base_speed
      1.6, weights [2,1,0,-1,-2], last_direction. Expected: a small gain or no change
      on the s-bend. I make no claim about the result. Slalom has been 0/20 at every
      geometry tested, so the race will also report its line_loss and off-track count.


      - [Open this output](iteration-10/entity1/versions/f9497d65aeae4301aa49e868d86eecc9/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/bdd7570e14fd4100b7c1360cc1d5f033/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-ba96dcbc4c8d07fb/payload.json)'
  - id: entityR1
    label: Keep 0.16, test kd and
    notes: 'Feedback written before the race: holds wheel_track 0.16 as baseline,
      gates the kd 0.8 result on s-bend exits and max_error, and suggests a 12 mm
      footprint test only if damping holds. Cites iterations 0, 2, 8 and 9.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Evidence
      from iteration 8 (wheel_track 0.16, y 0.08, kp 4.0, kd 0.5, score 661.5): the
      oval finished 20 of 20 with oscillation 0.21, the s-bend finished 19 of 20 with
      max_error 0.027 and control_effort 8.2, and slalom stayed 0 of 20 with line_loss
      1.2. Iteration 9 (wheel_track 0.17, score 651.1) showed the track-width gain
      has peaked, with s-bend exits rising to 2 of 20. The Integrator therefore takes
      wheel_track 0.16 as the geometry baseline and tests kd 0.8 on it, as you proposed.
      The integration needed no fix beyond kp 4.0, and no controller errors have appeared.
      Next race: if the s-bend stays at 1 or fewer off-track exits and the score rises
      above 661.5, keep wheel_track 0.16 and try the first change to probe the slalom.
      If the s-bend exits rise above 1 or max_error rises above 0.027, damping is
      hurting and the Builder should keep the 0.16 geometry as the baseline. If the
      slalom line_loss stays at about 1.2, geometry is not the fix there and the Builder
      should stop changing span or footprint.


      ### Requested changes


      - If kd 0.8 at wheel_track 0.16 keeps s-bend off-track exits at 1 of 20 or fewer
      and the score rises above 661.5, hold wheel_track 0.16 and test sensor_size
      0.012 at x = ±0.024, 0 with y 0.08. Evidence: iteration 0 used 12 mm footprints
      and had slalom line_loss 1.9, so the footprint lever is only a trade-off and
      needs its own test, not an assumed gain.

      - If kd 0.8 raises s-bend off-track exits above 1 of 20 or max_error above 0.027,
      return to wheel_track 0.16 with the iteration 8 geometry unchanged. Evidence:
      iteration 9 at 0.17 raised s-bend exits from 1 to 2 with max_error 0.028, so
      the bend margin at this geometry is already small.

      - Do not widen the sensor span beyond x ±0.024 at this gain. Evidence: iteration
      2 at ±0.032 with kp 4.5 cut the oval finish from 18 of 20 to 8 of 20, and slalom
      stayed 0 of 20.


      - [Open this output](iteration-10/entityR1/versions/f9497d65aeae4301aa49e868d86eecc9/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/bdd7570e14fd4100b7c1360cc1d5f033/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-ba96dcbc4c8d07fb/payload.json)'
