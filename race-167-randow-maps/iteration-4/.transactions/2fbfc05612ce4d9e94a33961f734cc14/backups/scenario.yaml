map:
  id: race-167-randow-maps
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Lookahead y 0.07 test
    notes: 'Reverts to the best iteration-1 geometry and moves the sensor lookahead
      from y 0.06 to y 0.07. Iteration 3 showed that y 0.04 dropped the score from
      454.6 to 131.9 with the oval finish rate at 0 of 20, so the test goes the other
      way along that trend.


      ### Rationale


      Iteration 3 is the clearest evidence in the history. Moving every sensor from
      y 0.06 to y 0.04 cut the score from 454.6 to 131.9. The oval finish rate fell
      from 18/20 to 0/20, with all 20 runs ending off track and max_error rising to
      0.065. The s-bend and slalom also got worse. The Integrator''s feedback (entityR1)
      proposes keeping y 0.04 for this candidate, but it was written before this race
      and does not account for iteration 3''s result, so I am not following that plan.
      The shorter lookahead is the wrong direction. The score rises from y 0.04 to
      y 0.06, so the gradient points toward a longer lookahead. Span (iteration 2)
      and footprint (iteration 1) are already ruled out or near their useful limit.
      I am reverting to the best known geometry from iteration 1 (16 mm footprints,
      x = ±0.024 m at 12 mm pitch, 0.12 m track, 0.8 kg) and changing one variable:
      sensor lookahead from y 0.06 to y 0.07. The hypothesis is that a longer lookahead
      gives the controller more time to react before the robot reaches a bend, which
      should reduce the off-track exits on the s-bend (16 of 20 at y 0.06) and the
      slalom line loss (about 1.05). Expected result: oval finish rate near 0.9 and
      s-bend max_error below 0.056. If the oval finish rate falls or steering_oscillation
      exceeds about 0.4, the lookahead has passed its optimum, so the next step is
      to return to y 0.06 and test wheel_track 0.14 as the single change.


      - [Open this output](iteration-4/entity0/versions/74903d9f596b40eab8ab7bae250c3c59/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-71d150400ae28212/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-9dec104ac6f6b2c4/payload.json)'
  - id: entity1
    label: Lookahead y 0.04 test
    notes: 'Iteration 1 geometry with every sensor moved from y 0.06 to y 0.04, controller
      kept at the best-known kp 4.0. Isolates lookahead as the only change; the 4.5
      gain from iteration 2 was dropped because it was tuned for the wider span that
      hurt results.


      ### Rationale


      Iteration 1 (16 mm footprints, span ±0.024 m, y 0.06, kp 4.0) is the best design
      so far at 454.6. Iteration 2 widened the span to ±0.032 m and raised kp to 4.5
      to compensate. That made things worse: the oval finish rate fell from 0.9 to
      0.4, s-bend and slalom did not finish, and oscillation rose to 0.34 on the oval.
      The span change is therefore not the lever. The Builder''s intent is to revert
      to the iteration 1 geometry and change only lookahead, from y 0.06 to y 0.04.
      I used the iteration 1 span with the iteration 1 controller (kp 4.0), not the
      iteration 2 kp 4.5. The Builder''s brief says to keep the ''current candidate''
      controller, but kp 4.5 was tuned for the wider span and is the likely cause
      of the iteration 2 oscillation and off-track exits. Keeping kp 4.0 makes this
      a clean one-variable test against iteration 1. Sensors stay at 16 mm footprints,
      x = +0.024, +0.012, 0, -0.012, -0.024, with weights [2,1,0,-1,-2], kd 0.5, ki
      0.1, base_speed 1.6 and last_direction line loss. The expected result is a lower
      s-bend off-track rate and max_error (currently 0.056 against a 0.06 limit),
      with the oval finish rate held near 0.9. If steering_oscillation rises above
      about 0.4 or the oval finish rate drops, the shorter lookahead is the cause.
      All measurements are requested so the race can separate those effects.


      - [Open this output](iteration-3/entity1/versions/05f55bffed434c01a496f9fcde11a367/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/48ea6d9f2c0d4524a81d5b3622dfdd97/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-782916715c1863a2/payload.json)'
  - id: entityR1
    label: 'Feedback: lookahead then'
    notes: 'Feedback on lookahead, track width and span, citing iteration 1 s-bend
      and oval results and iteration 2 span failure. It states no outcome for the
      candidate and gives three conditional changes tied to the next race''s oscillation
      and line-loss results.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Evidence
      from iteration 1 (16 mm footprints, span ±0.024 m, y 0.06, kp 4.0, score 454.6):
      the oval finished 18 of 20 with max_error 0.026 and steering_oscillation 0.21,
      but the s-bend finished only 4 of 20 (16 off-track exits, max_error 0.056, close
      to the 0.06 m limit, oscillation 0.36) and the slalom finished 0 of 20 with
      1.05 line-loss events and low rms_error (0.022). Iteration 2 showed that widening
      the span to ±0.032 m with kp 4.5 cut the oval finish rate to 8 of 20 and raised
      oscillation to 0.34 without fixing the bends, so span is not the lever at this
      gain. The Integrator has needed no controller fixes beyond kp for this geometry,
      and no controller errors have appeared. Next race: if the s-bend off-track rate
      falls and max_error drops below about 0.056 while the oval finish rate stays
      near 0.9, keep y 0.04 and try the first requested change. If steering_oscillation
      rises above about 0.4 or the oval finish rate falls, the shorter lookahead is
      the cause, so revert to y 0.06 and try the second change. If line_loss on the
      slalom stays above about 1.0 with lookahead fixed, try the third change.


      ### Requested changes


      - If the s-bend off-track rate falls with y 0.04 but slalom line_loss stays
      above about 1.0, try wheel_track 0.14 (from 0.12) at the same sensor layout.
      Evidence: iteration 1 s-bend control_effort was 11.07, the highest of any track,
      so the wheels are working hard to turn and a wider track adds turn authority
      without changing the signal scale.

      - If steering_oscillation rises above about 0.4 or the oval finish rate drops
      below 0.85 with y 0.04, try y 0.05 (a compromise between 0.04 and 0.06) with
      the same span and footprint. Evidence: iteration 1 oscillation was 0.21 on the
      oval at y 0.06, and iteration 2 showed that the signal scale changes gain, so
      the lookahead needs to move in small steps.

      - If slalom line_loss stays above about 1.0 and wheel_track 0.14 does not help,
      try sensor_size 0.016 with a 12 mm pitch and a wider span of ±0.030 at 0.015
      pitch (x = 0.030, 0.015, 0, -0.015, -0.030), keeping kp 4.0. Evidence: iteration
      2 at ±0.032 with kp 4.5 raised oscillation and off-track exits, so the span
      should be widened only with the controller gain held at kp 4.0.


      - [Open this output](iteration-3/entityR1/versions/05f55bffed434c01a496f9fcde11a367/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/48ea6d9f2c0d4524a81d5b3622dfdd97/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-782916715c1863a2/payload.json)'
