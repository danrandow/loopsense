  - id: entity0
    label: Baseline 5-sensor
    notes: 'First neutral geometry: five 12 mm sensors at 0.06 m lookahead on a 0.12
      m track, 0.8 kg body. No prior race data exists, so it is chosen from contract
      midpoints and designed to be a clean reference for later comparison.


      ### Rationale


      Iteration 0 has no race telemetry and no Integrator feedback, so this proposal
      is a neutral baseline built from the contract. Five sensors are spread across
      the 0.08 m half-width limit, with 12 mm spacing. A 12 mm footprint at that spacing
      keeps adjacent sensors overlapping slightly, so the line is always seen by at
      least one sensor and the position estimate changes smoothly. The sensors sit
      0.06 m ahead of the axle so the controller sees the line before the wheels reach
      it, which gives the controller room to act at speed. The wheel track is 0.12
      m, a middle value that gives a reasonable turn rate without excess yaw inertia.
      The wheel radius is 0.03 m. The body is 0.12 m wide, which widens the off-track
      limit to about 0.09 m (tape half-width 0.0125 plus 0.03), so the robot is not
      ended early by brief excursions. Mass is 0.8 kg, low enough for quick acceleration
      and high enough for traction. Expected result: a completed run on the development
      tracks with modest line error. The suggested weights are proportional to sensor
      x, so a line on the left gives a positive (left-steering) signal. I expect the
      Integrator to tune gains; the weights are only a starting point.


      - [Open this output](iteration-0/entity0/versions/286fbb9a3d6f46fcaa9187c04b5a23dd/payload.json)'
