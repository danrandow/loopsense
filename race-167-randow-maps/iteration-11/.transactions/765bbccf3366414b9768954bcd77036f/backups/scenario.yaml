overrides:
  entities:
  - id: entity0
    label: Hold best geometry
    notes: 'Geometry is held at the best measured design (wheel_track 0.16, y 0.08,
      16 mm footprints, ±0.024 span), since the final unseen track is scored on robustness.
      The rationale rests on the monotone track-width sweep and the 0.17 regression
      (651.1 vs 661.5), with the Integrator testing kd 0.8 on this fixed platform.


      ### Rationale


      The race data points to one stable geometry. Track width at sensor y 0.08 with
      16 mm footprints and a ±0.024 m span rose monotonically from 0.10 to 0.16 (496.4,
      561.6, 628.6, 661.5). At 0.17 the score fell to 651.1 as s-bend off-track exits
      rose from 1 to 2, so the gain has peaked at 0.16. Iteration 10 (wheel_track
      0.16, kp 4.0, kd 0.5) scored 703.8, the best so far, with the s-bend finishing
      20 of 20 and the oval 20 of 20. Slalom is still 0 of 20 at every geometry tested,
      with line_loss about 1.2 to 1.4 and max_error about 0.065. Span, footprint and
      lookahead have each been tested without fixing it, and span widening (iteration
      2) and a 12 mm footprint (iteration 0) both did worse. The final race runs on
      an unseen track, so a robust, measured geometry is worth more than a speculative
      change. I am therefore holding the geometry at the best measured values (wheel_track
      0.16, y 0.08, 16 mm footprints, x ±0.024 at 12 mm pitch, body, wheels and mass
      unchanged). The Integrator''s kd 0.8 test is a controller change and stays with
      them. Expected result: the same geometry behaviour as iteration 10, so the controller
      test isolates damping.


      - [Open this output](iteration-11/entity0/versions/d12c3dbcf1a74a74af51cbe7e24e5732/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-48681e359f4ac0f2/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-7c0504257fcbd390/payload.json)'
  - id: entity1
    label: 'Final robot: kd 0.8'
    notes: 'Final complete robot: the Builder''s wheel_track 0.16 geometry with the
      iteration 10 controller (kd 0.8, kp 4.0). It reproduces the best measured design
      (703.8), with s-bend 20 of 20 and oval 20 of 20 in that race.


      ### Rationale


      This is the final iteration, so the package should be the most robust measured
      design rather than a speculative one. Iteration 10 raced the same geometry the
      Builder proposed (wheel_track 0.16, sensors at y 0.08, 16 mm footprints, x ±0.024
      at 12 mm pitch, body 0.16 x 0.12, wheels 0.03, mass 0.8) with kp 4.0, ki 0.1,
      kd 0.8, base_speed 1.6 and last_direction. It scored 703.8, the best in the
      history. Its oval finished 20 of 20 with oscillation 0.24, and its s-bend finished
      20 of 20 with oscillation 0.30 and max_error 0.017. Slalom stayed 0 of 20 (line_loss
      1.4, max_error 0.065), as it has at every geometry tested. Compared with kd
      0.5 at the same geometry (iteration 9-era best, 661.5), kd 0.8 removed all s-bend
      off-track exits and cut oval control_effort from 4.6 to 2.9. I therefore keep
      kd 0.8 and every other controller value unchanged. The unseen final track is
      a different shape, so I am not adding untested changes such as kp, span or footprint.
      Expected result: the same behaviour as iteration 10, with the s-bend and oval
      as the robust core and slalom-type geometry as the open risk.


      - [Open this output](iteration-11/entity1/versions/6cab95bbb5d642a1b7e8f0c4182c7629/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/d12c3dbcf1a74a74af51cbe7e24e5732/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-7c0504257fcbd390/payload.json)'
  - id: entityR1
    label: Hold 0.16 track, no span
    notes: 'Feedback asks the Builder to hold the measured best geometry and avoid
      further span or footprint changes. Evidence is iteration 10 (703.8), iteration
      9 (651.1 at 0.17) and iteration 2 (span widening failure).


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. The geometry
      you proposed (wheel_track 0.16, y 0.08, 16 mm footprints, x ±0.024) is the same
      as iteration 10, which scored 703.8 with kd 0.8 and kp 4.0. Its s-bend finished
      20 of 20 with max_error 0.017, and its oval finished 20 of 20. The iteration
      9 test at wheel_track 0.17 (651.1) showed the track-width gain has peaked, with
      s-bend exits rising to 2 of 20. I have used the iteration 10 controller, so
      the geometry you hold is the one that gave the best measured result. Next race:
      if s-bend off-track exits stay at 1 or fewer and the oval finish stays at 1.0,
      hold this geometry. If slalom remains 0 of 20 with line_loss near 1.4, the remaining
      gap is the slalom, and geometry changes to span or footprint have already failed
      there.


      ### Requested changes


      - Hold wheel_track 0.16 and sensors at y 0.08, x ±0.024 at 16 mm footprints.
      Evidence: iteration 10 (kd 0.8) scored 703.8 with s-bend 20 of 20 and oval 20
      of 20, and iteration 9 at wheel_track 0.17 fell to 651.1 as s-bend exits rose
      to 2.

      - Do not widen the span beyond x ±0.024 or change the footprint to address slalom.
      Evidence: iteration 2 at ±0.032 with kp 4.5 cut the oval finish to 8 of 20,
      and the 12 mm footprint in iteration 0 gave slalom line_loss 1.9.

      - If the next race shows s-bend off-track exits above 1 of 20 at kd 0.8, return
      to kd 0.5 at the same geometry, which scored 661.5 at iteration 8. Evidence:
      kd 0.5 at wheel_track 0.16 had 1 s-bend exit, whereas kd 0.8 had none in iteration
      10.


      - [Open this output](iteration-11/entityR1/versions/6cab95bbb5d642a1b7e8f0c4182c7629/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/d12c3dbcf1a74a74af51cbe7e24e5732/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-7c0504257fcbd390/payload.json)'
