map:
  id: race-167-randow-maps
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Wider 16mm sensor span
    notes: 'Moves the outer sensors from ±0.024 m to ±0.032 m at a 16 mm pitch, keeping
      the 16 mm footprint. Iteration 1 left s-bend and slalom line loss at 1.1 and
      1.05, with low rms_error, so the tape is leaving the array at the edges.


      ### Rationale


      Iteration 1 (16 mm footprints) helped but did not fix the problem. The oval
      finish rate rose from 16/20 to 18/20 and line_loss fell from 0.95 to 0.45. The
      s-bend barely moved: line_loss is 1.1 (was 1.2), finish rate is 4/20, and off-track
      exits are 16/20. The slalom is still 0/20 with line_loss 1.05 (was 1.9). rms_error
      stays low on both (0.017 and 0.022), and max_error on the s-bend is 0.056, close
      to the 0.06 m limit. So the robot is still losing the tape at the edge of the
      five-sensor array rather than tracking poorly. R1''s rule applies: line loss
      is still well above 0.5 with the 16 mm footprint, so widen the sensor span rather
      than the footprint or body. I will keep sensor_size at 0.016 and move the outer
      sensors from x = ±0.024 to ±0.032, with the inner sensors at ±0.016 and 0. This
      gives an even 16 mm pitch across a 0.064 m span, so a tape displaced to about
      ±0.035 m still falls under an outer sensor. I am not changing wheel_track, mass,
      body or lookahead yet, so the result is attributable to one variable. The body_width
      field has no effect below about 0.19 m, so it stays at 0.12. I expect line_loss_events
      on the s-bend and slalom to fall toward or below 0.5, with a higher s-bend finish
      rate. Note for the Integrator: the sensor weights [2,1,0,-1,-2] now sit on a
      wider span, so the signal per unit of lateral error is larger; they may need
      to re-tune kp.


      - [Open this output](iteration-2/entity0/versions/4783d62060304c55a56f3ffcab2b7c35/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-8194f3be87542839/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-8143f1e5fdd73196/payload.json)'
  - id: entity1
    label: Wider 32mm span, kp 4.5
    notes: 'Integrator package: sensors widened to ±0.032 m at 16 mm footprints, with
      kp raised from 4.0 to 4.5 to offset the smaller signal per unit error on the
      wider pitch. Evidence is iteration 1, where 16 mm footprints cut oval line loss
      from 0.95 to 0.45 but the s-bend and slalom still lose the tape at the array
      edge.


      ### Rationale


      Iteration 1 is the best evidence so far. Going from 12 mm to 16 mm footprints
      cut oval line_loss from 0.95 to 0.45 and raised the oval finish rate to 0.9.
      The s-bend still loses the tape (line_loss 1.1, 16 of 20 off-track, max_error
      0.056), and the slalom is still 0/20 with line_loss 1.05. rms_error stays low
      (0.017 and 0.022), so the robot is losing the tape at the edge of the array
      rather than tracking poorly. Following the Builder''s intent, I keep the geometry
      unchanged here: sensor x at ±0.032, ±0.016, 0 on a 16 mm footprint, y 0.06,
      track 0.12, wheel 0.03, mass 0.8, body 0.16×0.12. The controller changes only
      because the wider pitch changes the signal scale. The weights [2,1,0,-1,-2]
      now correspond to 16 mm per unit instead of 12 mm, so the steering signal per
      unit of lateral error is about 25 percent smaller than in iteration 1. To keep
      the effective turn gain close to the iteration 1 setting, I raise kp from 4.0
      to 4.5 and leave kd at 0.5 (the derivative term is already scaled with the signal,
      so it is not raised). ki stays at 0.1 and base_speed at 1.6, and line_loss stays
      ''last_direction'', which has held the oval and bend tracks without controller
      errors. The expected effect is line_loss on the s-bend and slalom moving toward
      0.5 or below, but I am not claiming an outcome for this candidate. Full measurements
      are requested so the next race can separate line loss, lookahead and oscillation
      effects.


      - [Open this output](iteration-2/entity1/versions/a1cfbc64be504dc9930bbddc1c31595f/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/4783d62060304c55a56f3ffcab2b7c35/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-8143f1e5fdd73196/payload.json)'
  - id: entityR1
    label: Span and lookahead next
    notes: 'Feedback for the Builder with no outcome claimed for this candidate: widen
      the span to ±0.040 if line loss stays high, test y 0.04 if the s-bend still
      leaves the track, and reduce gain if oscillation rises. Each step is tied to
      iteration 1 line-loss, max_error and oscillation figures.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Evidence
      from iteration 1 (16 mm footprints, 0.024 m span): the oval finish rate rose
      from 0.8 to 0.9 and line_loss fell from 0.95 to 0.45, but the s-bend still has
      line_loss 1.1 with 16 of 20 off-track ends (max_error 0.056, close to the 0.06
      m limit), and the slalom is still 0 of 20 with line_loss 1.05. rms_error is
      low on both (0.017, 0.022), so the tape is leaving the array edge rather than
      the controller tracking poorly. The Integrator has needed no integration fixes
      for [2,1,0,-1,-2], kp 4, kd 0.5 or base_speed 1.6: steering_oscillation stayed
      between 0.16 and 0.36 and there were no controller errors. The wider span reduces
      the steering signal per unit of lateral error, so I have raised kp to 4.5 in
      this candidate to compensate. Next race: if line_loss on the s-bend and slalom
      falls to about 0.5 or below, keep the span and move to lookahead. If line_loss
      falls but the s-bend still leaves the track with max_error near 0.06, test a
      shorter lookahead. If steering_oscillation rises above about 0.4 with the larger
      kp, the gain is too high for the wider span, so reduce kp rather than widening
      further.


      ### Requested changes


      - If line_loss_events on the s-bend and slalom are still above about 0.5 with
      sensor x = ±0.032, ±0.016, 0 at 16 mm footprints, keep the footprint and widen
      the span further to x = ±0.040 at 0.020 m pitch (sensor_positions x: 0.04, 0.02,
      0.0, -0.02, -0.04). Evidence: iteration 1 cut oval line loss from 0.95 to 0.45
      with the 16 mm footprint, and slalom line loss stayed at 1.05 with low rms_error
      (0.022), so the tape is leaving the array edge.

      - If line_loss falls below about 0.5 but the s-bend still ends off track with
      max_error near 0.056 to 0.06, set every sensor y to 0.04 (from 0.06) to test
      a shorter lookahead. Evidence: iteration 1 s-bend had 16 of 20 off-track ends
      at max_error 0.056, and steering_oscillation of 0.36 leaves room to test this.

      - If steering_oscillation rises above about 0.4 on the oval or s-bend after
      the span change, reduce kp to 4.0 or raise kd to 0.8 before changing geometry.
      Evidence: iteration 1 oscillation was 0.21 on the oval and 0.36 on the s-bend,
      and the wider span will raise the steering gain per unit error.


      - [Open this output](iteration-2/entityR1/versions/a1cfbc64be504dc9930bbddc1c31595f/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/4783d62060304c55a56f3ffcab2b7c35/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-8143f1e5fdd73196/payload.json)'
