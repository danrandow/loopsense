version: 1
entry_actions: [action0]
required_inputs:
  action0: []
  action1: [entity0]
  action2: [entity1]
initial_entities: []
carry_forward: [entityR1, entityR2A, entityR2B]
reentry:
  action0: on_new_inputs
  action1: on_new_inputs
  action2: once_per_iteration
# The Evaluator decides when to stop: while it returns feedback without an Approved Robot Build (entity1), the Optimizer revises
# and the Evaluator reviews again. Once entity1 exists the loop is over and the build races; any feedback it gave with the
# approval is read by the Optimizer in the next iteration.
stop_reentry_when_present:
  action0: [entity1]
  action1: [entity1]
iteration_complete_when:
  entities_present: [entity2, entityR2A, entityR2B]
