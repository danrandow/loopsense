map:
  id: race-205-randow-maps-muted
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Wider 7-sensor array
    notes: 'Widens the sensor array to ±0.06 m across 7 sensors, keeping the iteration
      1 drivetrain. The s-bend and slalom runs hit the 0.06 m off-track limit at max_error
      ≈0.061, so the line must stay graded further out. Body width cannot widen the
      limit, since it stays at 0.06 m for all allowed widths.


      ### Rationale


      Evidence from iteration 1 (score 337.6, up from 184.5) shows the narrower track,
      larger wheels, lighter mass and forward row helped. The oval now finishes 17
      of 20 runs, up from 3. The s-bend (progress 0.24) and slalom (progress 0.18)
      still end off track. Their max_error is about 0.061 and 0.060, right at the
      off-track limit. The limit is max(0.06, tape_half_width + body_width/4). Even
      at body_width 0.18 that gives 0.0575, so the effective limit is 0.06 m for any
      allowed width, and body width cannot buy margin. The failure is therefore lateral
      drift reaching 0.06 m before the controller recovers. The rms_error of about
      0.028 is modest, so the robot is mostly tracking but overshoots on sharp bends.
      The current array spans only ±0.03 m. When the robot drifts toward 0.04 to 0.06
      m, the line falls off the outer sensors, the signal saturates at the array edge,
      and the controller gets weak correction just when it needs it most. My change
      is to widen the array to 7 sensors spanning ±0.06 m at 0.02 m pitch, keeping
      them at y=0.07 for lookahead. Sensor weights are being set by the Integrator.
      This keeps the line visible and the signal graded out to the 0.06 m limit, so
      the controller has authority to act before the edge. I keep wheel_track 0.10,
      wheel_radius 0.035, mass 0.6 and sensor_size 0.012 unchanged, so the effect
      of the array can be isolated. Expected result: fewer off-track ends on s-bend
      and slalom, max_error below about 0.05, and progress above 0.4 on the s-bend.
      Risk: 7 sensors at 0.02 m pitch raise the sum of readings and may add signal
      lag, which the Integrator should check.


      - [Open this output](iteration-2/entity0/versions/d53ab4aef6a149de8b57d51ff7deda4d/payload.json)

      - Based on: [entityR2A](iteration-2/entityR2A/versions/carried-e0116f1ede91eef2/payload.json)'
  - id: entity1
    label: Narrow track, damped PD
    notes: 'Builder''s geometry kept as proposed (wheel_track 0.10, mass 0.6, forward
      sensors at y=0.07). Controller adds kd 0.4 for lookahead damping and base_speed
      1.8 for speed, based on the baseline''s off-track failures on the s-bend and
      slalom.


      ### Rationale


      Iteration 0 is the only race evidence. The baseline (score 184.5) finished 3
      of 60 trials, all on the oval. The s-bend (progress 0.24) and slalom (progress
      0.11) both ended off-track, with about one line-loss event per run and a steady
      rms_error near 0.025. That pattern points to insufficient turn authority or
      late reaction at bends, not sensor noise. The Builder''s geometry (wheel_track
      0.10, wheel_radius 0.035, mass 0.6, sensors at y=0.07 spanning ±0.03 m) is within
      every contract limit, so I keep it unchanged. Sensor weights stay proportional
      to sensor x (-2, -1, 0, 1, 2), so a centred line gives signal 0 and the signal
      scale is unchanged despite the narrower array. The narrower track raises turn
      rate per unit of kp, so I keep kp at 2.5 rather than raising it further, which
      limits the risk of overshoot. The forward offset adds lookahead lag, so kd rises
      from 0.3 to 0.4 for damping. base_speed rises from 1.6 to 1.8 to help the sub-3
      s finish, accepting some risk of off-track on the tightest bends. ki stays at
      0.05 to avoid integral wind-up on one-sided bends. line_loss stays last_direction
      so the robot recovers toward the side it last saw tape. Expected result: more
      s-bend progress and fewer off-track ends. The main risk is oscillation from
      the forward offset and higher speed together.


      - [Open this output](iteration-1/entity1/versions/e5144c1c2870425bb7acd2d5d8a59236/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/a3b61d2e2ce348c1b6026b9af7033beb/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-3c8a07898ed54cea/payload.json)'
  - id: entityR1
    label: Widen or pull back
    notes: 'Feedback is written before this geometry races, citing iteration 0 baseline
      results (3/60 finishes, s-bend progress 0.24, slalom 0.11). Three conditional
      changes are given for the next race result.


      ### Feedback


      No race has yet been run on this geometry, so nothing here states its outcome.
      The evidence available is iteration 0, the baseline (wheel_track 0.12, radius
      0.03, mass 0.7, sensors at y=0.06 spanning ±0.04 m). It finished 3 of 60 trials,
      all on the oval. The s-bend ended off-track with progress 0.24 and the slalom
      with progress 0.11, each with about one line-loss event per run and rms_error
      near 0.025. That suggests turn authority and reaction lag, not noise. To work
      with your narrower track, I kept sensor weights proportional to x and held kp
      at 2.5, added kd to damp the forward-offset lag, and raised base_speed. Next
      race decisions: if line_loss_events stay at 1 or more on the s-bend while progress
      stays near 0.25, the sensor span is too narrow for the tape edge, so widen x
      to about ±0.04 m at the same y. If steering_oscillation is high on the slalom
      while max_error is low, the forward offset is adding lag, so move y back toward
      0.06 m. If the robot now finishes but completion_time is above 3 s, keep the
      0.10 m track and mass near 0.6 kg, and raise base_speed further if the robot
      does not leave the track.


      ### Requested changes


      - If line_loss_events is still at or above 1 on the s-bend while progress stays
      near 0.25 (iteration 0 baseline), widen the sensor x span to about ±0.04 m at
      y=0.07, keeping 5 sensors, so the summed reading stays above 0.05 at the tape
      edge.

      - If steering_oscillation is high on the slalom while max_error stays low (iteration
      0 slalom max_error 0.064), move the sensor y back from 0.07 toward 0.06 m to
      reduce forward-offset lag.

      - If the robot finishes the oval but completion_time stays above 3 s, keep wheel_track
      at 0.10 m and reduce mass toward 0.5 kg, since the iteration 0 baseline mean
      finish time on the oval was 1.77 s and the target is under 3 s on every track.


      - [Open this output](iteration-1/entityR1/versions/e5144c1c2870425bb7acd2d5d8a59236/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/a3b61d2e2ce348c1b6026b9af7033beb/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-3c8a07898ed54cea/payload.json)'
