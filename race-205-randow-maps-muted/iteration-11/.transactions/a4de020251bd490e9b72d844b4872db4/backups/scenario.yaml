  id: race-205-randow-maps-muted
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: 'Final: iteration 10'
    notes: 'Resubmits the best-evidenced geometry (score 450.6): body_length 0.10
      m, wheel_radius 0.040 m, wheel_track 0.10 m, and a forward 5-sensor row at y=0.08
      m with a 0.012 m footprint. No untested change is made on the final race. The
      slalom plateau did not respond to any geometry lever, so it is flagged for the
      Integrator as a controller-side limit.


      ### Rationale


      Ten races are on record, and iteration 10 is the best design so far (score 450.6,
      up from 417.9 in iteration 8). Its geometry is: 5 sensors at y=0.08 m spanning
      ±0.03 m at 0.015 m pitch, 0.012 m footprint, wheel_track 0.10 m, wheel_radius
      0.040 m, mass 0.6 kg, body_length 0.10 m, body_width 0.12 m. Its oval finishes
      20/20 with rms_error 0.0195, and its s-bend finishes 3/20 with progress 0.61,
      up from 0.66 in iteration 8 with a finish time of 2.12 s. The shorter body cut
      yaw inertia and produced the largest single gain of the recent sweep. The sensing,
      row-position, track, radius and mass levers have each been tested in at least
      one direction. Footprint 0.016 m collapsed the oval, 0.008 m hurt the s-bend,
      and 0.012 m is the optimum. The row is already at the y=0.08 m limit. Mass 0.5
      kg hurt, and 0.6 kg is the better value. Slalom progress has stayed at 0.16
      to 0.20 under every change, so the slalom stall looks like a controller reaction-time
      limit rather than a geometry limit. This is the final iteration, and any untested
      geometry change carries real risk to the unseen-track race. Changing wheel_radius
      to 0.045 m or narrowing track further would be speculative: the radius-to-track
      ratio and speed trade-off are untested beyond 0.040 m, and the s-bend already
      showed sensitivity to ratio. I therefore propose to resubmit the iteration 10
      geometry unchanged. The robot that races is the one with the strongest evidence,
      and the Integrator can tune the controller on it. Expected result: about 450
      on the development tracks, with the same oval reliability and the same s-bend
      behaviour.


      - [Open this output](iteration-11/entity0/versions/8841a328bcd64c3b9fbcfc35974906f8/payload.json)

      - Based on: [entityR2A](iteration-11/entityR2A/versions/carried-338aeca49a596c6b/payload.json)'
  - id: entity1
    label: Final consolidated robot
    notes: 'Keeps the iteration 10 geometry and controller unchanged, since it is
      the best-evidenced design (450.6, oval 20/20). Untested controller or geometry
      changes are avoided before the unseen-track race.


      ### Rationale


      This is the final iteration, and the unseen-track race is scored on whatever
      design is delivered here. Iteration 10 (score 450.6) is the best-evidenced design:
      its oval finished 20 of 20 (mean 940, rms_error 0.0195), its s-bend finished
      3 of 20 with progress 0.61, and its slalom progress was 0.20, the top of the
      0.16 to 0.20 plateau. Every sensing, track, radius, mass and body change since
      then has either lowered the score or left the slalom flat. Iteration 8 (radius
      0.040 m, track 0.10 m, mass 0.6 kg, body 0.14 m) scored 417.9 with oval 19 of
      20, and iteration 9 (mass 0.5 kg) scored 382.3, so those levers are not better.
      The body_length 0.10 m change in iteration 10 is the one that produced the best
      score. I therefore keep the iteration 10 geometry and controller exactly as
      tested. Untested controller changes such as kd 0.45 or a different line-loss
      mode carry risk on the unseen track with no race to check them. Expected result
      is about 450 on the development tracks, consistent with the iteration 10 evidence.


      - [Open this output](iteration-11/entity1/versions/23ace2ec61e74fbdbed135e500d5273a/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/8841a328bcd64c3b9fbcfc35974906f8/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-338aeca49a596c6b/payload.json)'
  - id: entityR1
    label: 'Feedback: final iteration'
    notes: 'Gives conditional next steps for the slalom plateau and oval stability,
      each tied to iterations 3 to 10. No outcome is stated for the current candidate,
      which has not raced.


      ### Feedback


      Written before this candidate has raced. Iteration 10 (450.6, best) is the strongest
      evidence: its oval finished 20 of 20 and its s-bend progress was 0.61. Iteration
      8 (417.9, radius 0.040 m and track 0.10 m at body 0.14 m) showed that radius
      helped the s-bend (0.655) but cost oval stability (19 of 20). Iteration 9 (mass
      0.5 kg, 382.3) showed that a lighter robot lost oval finishes (18 of 20) and
      s-bend progress (0.521). Footprint 0.016 m collapsed the oval (iteration 6)
      and 0.008 m dropped s-bend progress to 0.32 (iteration 7), so 0.012 m stays.
      Widening the sensor span raised oscillation (iteration 2). The slalom has stayed
      at 0.16 to 0.20 progress across iterations 1, 3, 4, 5, 8, 9 and 10, so sensing,
      track and mass have not moved it. For a further iteration, if the slalom passes
      0.20 with s-bend at or above 0.6, the body and radius direction is working;
      if the oval drops below 18 finishes or oscillation exceeds about 0.35, return
      to the iteration 10 values. If the slalom stays at 0.16 to 0.20, treat it as
      a controller limit rather than a geometry limit.


      ### Requested changes


      - If the slalom progress passes 0.20 and s-bend progress holds at or above 0.6
      with body_length 0.10 m, try wheel_radius 0.045 m with wheel_track 0.10 m. Iteration
      8 showed that radius raised s-bend progress (0.486 to 0.655), and the oval should
      hold at 18 or more finishes.

      - If the oval falls below 18 of 20 or steering_oscillation exceeds about 0.35
      with body_length 0.10 m, return body_length to 0.14 m and mass to 0.6 kg, the
      iteration 8 values. Iteration 9 showed that lighter mass also reduced oval finishes,
      so do not combine mass changes with this.

      - If the slalom stays at 0.16 to 0.20 with max_error near 0.06 (iterations 1,
      3, 4, 5, 8, 9 and 10), stop changing sensing, track, radius or mass. Keep the
      best-supported geometry and pass the slalom to the Integrator as a controller
      reaction-time issue.


      - [Open this output](iteration-11/entityR1/versions/23ace2ec61e74fbdbed135e500d5273a/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/8841a328bcd64c3b9fbcfc35974906f8/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-338aeca49a596c6b/payload.json)'
