  id: race-205-randow-maps-muted
  schema: v0.2
  scenario: Iteration 0
  inherits: base.yaml
  notes: Initial prepared state before either AI role or the simulator has acted.
dimensions:
  time_horizon: prepared
  iteration: '0'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      This is the first iteration, so there is no race telemetry or integration feedback
      yet. The design is a baseline built from the contract''s limits. Five sensors
      at 0.012 m footprint, spaced 0.02 m apart and spanning ±0.04 m, cover about
      80 mm across, which is more than three times the 25 mm tape width. That gives
      the controller a smooth, graded reading across the line and avoids the all-or-nothing
      loss of a narrow array. The sensors sit 0.06 m ahead of the axle, near the forward
      limit, so the robot reads the line before the wheels reach a bend. Wheel track
      is 0.12 m and wheel radius 0.03 m, which are mid-range values that keep turn
      authority moderate. Mass is 0.7 kg and body length 0.14 m, which keeps yaw inertia
      low so the robot can turn quickly. Body width 0.12 m is enough: the off-track
      limit is max(0.06, 0.0125 + body_width/4), which evaluates to 0.06 m for any
      width up to about 0.19 m, so width has little effect on the limit. I expect
      a completable run on the development tracks, with the main uncertainty being
      whether the 0.06 m lookahead causes lag on tight slalom bends.


      - [Open this output](iteration-0/entity0/versions/6157c6592aa646f3b4054697af534083/payload.json)'
  - id: entity1
    label: Baseline robot package
    notes: 'Builder''s five-sensor geometry paired with a PD-plus-small-I controller
      using sensor weights proportional to x. Chosen from contract limits, since no
      race evidence exists yet.


      ### Rationale


      This is the first iteration, so there is no race telemetry yet and the controller
      is derived from the contract and the supplied geometry. The sensors span x =
      -0.04 to +0.04 m at y = 0.06 m. Weights are set proportional to sensor x (weight
      = 50*x, giving -2, -1, 0, 1, 2), so a line centred under the array gives signal
      0, and a line offset to the left (positive x) gives a positive signal, which
      steers left. Because the signal is a reading-weighted average, its magnitude
      stays within about ±2 and does not depend on how many sensors see tape. kp =
      2.5 gives a turn of about 2.5 at a full-scale signal, which is about 875 PWM
      of wheel differential, a moderate correction. ki is kept small (0.05) so the
      integral does not wind up on the one-sided signal of long bends. kd = 0.3 damps
      the slalom oscillation the Builder expects near tight bends. base_speed = 1.6
      gives about 78 percent PWM, enough to average above 1.5 m/s on a 4 to 5 m course
      while leaving headroom for turns. line_loss = last_direction, so the robot keeps
      turning toward the side it last saw the tape, which is the usual recovery at
      the tape''s edge. I expect completion on the oval and s-bend; the slalom is
      the main uncertainty.


      - [Open this output](iteration-0/entity1/versions/896c8c442fab4c4cb24445c44cf7ce98/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/6157c6592aa646f3b4054697af534083/payload.json)'
  - id: entityR1
    label: Baseline integration
    notes: 'Feedback is conditional on the next race''s line loss, oscillation and
      completion time, because no earlier telemetry exists. Requested changes cover
      sensor span, forward offset, and mass or wheel radius.


      ### Feedback


      No earlier race exists, so nothing here is measured for this geometry. Integration
      choices made: the five sensors are weighted in proportion to their x position
      (-2 to +2), so the signal is a clean, linear reading of line offset, and the
      0.06 m forward offset is handled with modest kd. Depending on the next race:
      if line_loss_events is above zero on the slalom or the s-bend, the five-sensor
      sum is probably dropping below 0.05 at the tape edge, so widen the array (for
      example, x out to ±0.06 with the same count) or raise sensor_size to 0.016.
      If steering_oscillation is high while rms_error stays low, the forward offset
      is adding signal lag, so move the sensors back (y toward 0.03) and check again.
      If completion_time is above 3 s with no line losses, the wheel track or mass
      is limiting turn response; reduce mass or increase wheel_radius to raise speed
      authority.


      ### Requested changes


      - If line_loss_events > 0 on slalom or s-bend: widen sensor x span to about
      ±0.06 m (keep 5 sensors, spacing 0.03 m) or set sensor_size to 0.016, to keep
      the summed reading above 0.05 at the tape edge.

      - If steering_oscillation is high while rms_error is low: move sensor y from
      0.06 toward 0.03 m to reduce the lag introduced by the forward offset.

      - If completion_time exceeds 3 s with no line losses: reduce mass toward 0.5
      kg or raise wheel_radius toward 0.035 m to increase speed authority; keep wheel_track
      at 0.12 m.


      - [Open this output](iteration-0/entityR1/versions/896c8c442fab4c4cb24445c44cf7ce98/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/6157c6592aa646f3b4054697af534083/payload.json)'
  actions:
  - id: action0
  - id: action1
measurements: {}
