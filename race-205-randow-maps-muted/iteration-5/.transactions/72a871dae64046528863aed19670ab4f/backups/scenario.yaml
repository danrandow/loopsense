overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Four races now give a clear picture. Iteration 4 (score 404.6, best so far)
      moved the 5-sensor row to y=0.08 m with wheel_track 0.09 m. The oval now finishes
      20 of 20 (mean 939.8, rms_error 0.023, max_error 0.038), so the forward row
      fixed the oval''s off-track ends from iteration 3. The s-bend improved to progress
      0.486 (from 0.446), but it still ends off track at max_error about 0.062. The
      slalom is flat at progress 0.16 to 0.18 across iterations 1, 3 and 4, and still
      ends off track at max_error about 0.063 to 0.069. Sensing span was ruled out
      in iteration 2 (widening to ±0.06 m hurt the oval and raised oscillation), and
      the forward row is now at its y=0.08 limit, so lookahead cannot go further.
      Narrowing wheel_track from 0.10 to 0.09 m raised s-bend progress nearly twofold
      in iteration 3, so turn authority is still the lever that moved the s-bend.
      I therefore make one change: wheel_track from 0.09 to 0.08 m, the minimum allowed.
      Everything else stays as in iteration 4 so the effect can be isolated. I expect
      s-bend progress to rise above 0.5 and max_error to fall below 0.06 on the s-bend,
      with the oval still finishing most runs. The main risk is that the narrower
      track adds oscillation or wheel slip on the oval, which earlier cost finishes
      when the track narrowed to 0.09 m without the forward row. The slalom may stay
      near 0.17, which would point at a limit other than turn rate.


      - [Open this output](iteration-5/entity0/versions/0a4706d2f4ed45509c06be7a0f8016a7/payload.json)

      - Based on: [entityR2A](iteration-5/entityR2A/versions/carried-0693980be7d38a20/payload.json)'
  - id: entity1
    label: Lookahead test, y=0.08 m
    notes: 'Iteration 3 controller and drivetrain kept, with the 5-sensor row moved
      forward to y=0.08 m as the Builder requested. Iteration 3 gave the best s-bend
      progress (0.446), and slalom progress stalled at 0.17, so lookahead is the next
      lever to isolate.


      ### Rationale


      The Builder''s proposal moves the 5-sensor row from y=0.07 to y=0.08 m and keeps
      the iteration 3 drivetrain (wheel_track 0.09, wheel_radius 0.035, mass 0.6)
      and array layout (x = -0.03 to +0.03 m, 0.015 m pitch, 0.012 m footprint). I
      kept the iteration 3 controller unchanged (base_speed 1.7, kp 2.5, ki 0.05,
      kd 0.4, weights -2 to +2, last_direction line loss). Iteration 3 scored 328.4
      with oval rms_error 0.0146 and steering_oscillation 0.18, and its s-bend progress
      (0.446) was the best yet. Its slalom progress stayed at 0.17 and max_error stayed
      near the 0.06 m off-track limit, so the controller is not the bottleneck there.
      Changing the sensor row alone isolates the lookahead effect. Iteration 2 showed
      that a wider, heavier sensor span adds oscillation, so I do not widen the array.
      I did not raise kd to offset the extra lag, because that would confound the
      test. The main risk is oscillation rising on the oval; if it does, the next
      step is to return to y=0.07 m or add kd.


      - [Open this output](iteration-4/entity1/versions/1da245120a97442194acef3f8b58c38d/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/368d969732da44a8a388448459610bcd/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-969a7bd64435cbf4/payload.json)'
  - id: entityR1
    label: 'Feedback: lookahead then'
    notes: 'Feedback is written before the race and gives outcome-dependent steps:
      keep y=0.08 m and try wheel_radius if the slalom gains, return to y=0.07 m if
      oscillation rises, and revert wheel_track to 0.10 m if oval finishes drop. Evidence
      comes from iterations 1, 2 and 3.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Iteration
      3 (328.4) showed that narrowing wheel_track from 0.10 to 0.09 m, on the iteration
      1 array, raised s-bend progress from 0.236 to 0.446 and tightened oval tracking
      (rms 0.0146, max_error 0.038), but oval finishes fell from 17 to 13. Slalom
      progress stayed at 0.17 and max_error stayed near 0.06 to 0.069, so turn authority
      does not explain the slalom failure. Iteration 2 showed that a wider array (±0.06
      m, 7 sensors) raised oscillation from 0.20 to 0.37 and cut oval finishes to
      4 of 20, so widening the span is not the fix. Iterations 0 and 1 both show line_loss_events
      of about 1.0 per run on bends, so the robot reacts late rather than turning
      too weakly. This candidate tests lookahead by moving the row forward. Next race:
      if slalom progress rises above 0.25 and steering_oscillation stays near 0.2
      on the oval, keep y=0.08 m and try wheel_radius next. If steering_oscillation
      rises above about 0.3, return the row to y=0.07 m, since the extra lag is the
      likely cause. If the oval finishes stay below 13 of 20 with no slalom gain,
      return wheel_track to 0.10 m, because the narrower track costs oval stability.


      ### Requested changes


      - If slalom progress rises above 0.25 and steering_oscillation on the oval stays
      near 0.2, keep sensor_positions at y=0.08 m and test wheel_radius 0.04 m (iteration
      1 and 3 mean oval finish time was about 1.72 s, so extra ground speed has room
      to help).

      - If steering_oscillation on the oval rises above about 0.3 (iteration 2 reached
      0.37 with a wider array), move sensor_positions y back to 0.07 m and keep wheel_track
      at 0.09 m, since iteration 3 showed that track width helped s-bend progress
      without raising oscillation.

      - If oval finishes fall below 13 of 20 with no slalom gain, set wheel_track
      back to 0.10 m, the iteration 1 value that gave 17 of 20 finishes, and keep
      sensor_positions at y=0.08 m.


      - [Open this output](iteration-4/entityR1/versions/1da245120a97442194acef3f8b58c38d/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/368d969732da44a8a388448459610bcd/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-969a7bd64435cbf4/payload.json)'
