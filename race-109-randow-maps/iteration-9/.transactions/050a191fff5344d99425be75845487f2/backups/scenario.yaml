overrides:
  entities:
  - id: entity0
    label: Iter 5 row, 16 mm sensors
    notes: 'Reverts to the best-scoring row (iteration 5, 465.8: ±0.04 m at y 0.06
      m) and changes only the sensor footprint from 12 mm to 16 mm, to cut s-bend
      line loss (0.95 per run) without moving the oval or the forward offset. Iterations
      6 to 8 showed that wider spans and further forward offsets each cost the oval
      or pushed s-bend max_error over 0.06 m.


      ### Rationale


      The best result so far is iteration 5 (score 465.8): five sensors at x = ±0.04
      m, y = 0.06 m, wheel_track 0.095 m, mass 0.6 kg. Its oval finish was 0.95 and
      its s-bend max_error was 0.0591 m, under the 0.06 m off-track limit. Iterations
      6, 7 and 8 each moved one lever away from that point and scored lower: widening
      to ±0.05 m cut s-bend line loss but dropped the oval to 0.90; y = 0.07 m pushed
      s-bend max_error back to 0.0626 m; and the interpolated row (y 0.065 m, ±0.045
      m) gave s-bend max_error 0.0619 m with line loss 1.0 and score 432.4. I therefore
      return the geometry to the iteration 5 row. The one remaining failure there
      is s-bend line loss (0.95 per run, 16 of 20 trials off track) with max_error
      near the limit. Widening the span changed the oval and the forward offset, so
      I do not repeat that. Instead I change only the sensor footprint, from 12 mm
      to 16 mm. The sensor pitch stays at 0.02 m, so each footprint extends about
      2 mm further across the line at the outer sensors, and the tape is seen at lateral
      offsets nearer the 0.06 m off-track limit. This is the lever the Robot Integrator''s
      R1 feedback flagged for the case where s-bend line loss stays near 0.95 with
      max_error near 0.06 m, which is what iteration 5 shows. I expect s-bend line
      loss to fall without moving the oval or the forward offset, and the total score
      to match or beat 465.8. The risk is that a larger footprint softens the signal
      near the tape edge and adds oscillation, which the Integrator can absorb in
      the controller.


      - [Open this output](iteration-9/entity0/versions/8df2783393c14f7b8009434eebe24911/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-cc11e5ddaddf6c45/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-8cf057f100826037/payload.json)'
  - id: entity1
    label: Iter 5 row, 16mm sensors
    notes: 'Iteration 5 geometry and controller, with the sensor footprint raised
      from 12 to 16 mm. Gains are unchanged so the race isolates the footprint effect,
      which rests on iteration 5 as the best result (465.8).


      ### Rationale


      The Builder''s geometry reverts to the iteration 5 row, the best result so far
      (465.8): five sensors at x = ±0.04 m, y = 0.06 m, wheel_track 0.095 m, mass
      0.6 kg. The only geometry change is sensor_size from 0.012 to 0.016 m. Iteration
      5 had s-bend line loss of 0.95 per run with max_error at 0.0591 m, under the
      0.06 m limit, and oval finish 0.95. Iterations 6 to 8 each moved span or forward
      offset and scored lower (449.9, 406.0, 432.4), so I keep the controller that
      went with iteration 5. The footprint changes what each sensor reads as the tape
      crosses it, not the sensor pitch, so the weight scale [-2,-1,0,1,2] and the
      steering gain per metre of offset stay as in iteration 5. I therefore keep kp
      3.5, ki 0.2, kd 0.6 and base_speed 1.4, with last_direction line loss, so that
      the race isolates the footprint change. The larger footprint may raise the reading
      near the tape edge, so the effective edge gain could rise slightly; kd 0.6 is
      kept to limit oscillation. Expected result (a prediction, not a measurement):
      s-bend line loss below 0.9, max_error at or below 0.06 m, oval finish at or
      above 0.95, and a total score at or above 465.8. The main risk is that a softer
      edge signal raises s-bend oscillation or leaves the robot off track sooner.


      - [Open this output](iteration-9/entity1/versions/2b210f04223347ab83074ba2640f9381/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/8df2783393c14f7b8009434eebe24911/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-8cf057f100826037/payload.json)'
  - id: entityR1
    label: Footprint test feedback
    notes: 'Read-ahead for the 16 mm footprint test: keep y at 0.06 m (iteration 8
      showed 0.065 hurts), and revert to 12 mm if line loss does not fall or the oval
      drops below 0.95. Evidence comes from iterations 5, 6, 7 and 8.


      ### Feedback


      Written before this candidate has raced. Evidence from earlier races: iteration
      5 (five sensors at x ±0.04 m, y 0.06 m, 12 mm footprints, kp 3.5, kd 0.6) scored
      465.8, the best so far, with oval finish 0.95, s-bend finish 0.20, s-bend line
      loss 0.95 and s-bend max_error 0.0591 m. Iteration 6 widened the span to ±0.05
      m at y 0.06 m: s-bend line loss fell to 0.65 and max_error held at 0.0599 m,
      but the oval fell to 0.90 and the score to 449.9. Iteration 7 (±0.05 m, y 0.07
      m) gave oval 1.00 but s-bend max_error 0.0626 m and s-bend finish 0. Iteration
      8 interpolated (±0.045 m, y 0.065 m) and scored 432.4, with s-bend line loss
      1.0 and max_error 0.0619 m, so moving the forward offset off y 0.06 m hurt.
      Iteration 1 showed that widening coverage cut line loss without adding completions.
      For the footprint change, I hold the sensor pitch at 0.02 m, so the 16 mm footprint
      extends each sensor''s reach across the tape edge without moving the row, and
      I keep the Iteration 5 controller (kp 3.5, kd 0.6) because the weight scale
      is unchanged. Read the next race as follows. If s-bend line loss falls below
      0.9 with max_error at or below 0.06 m and the oval stays at 0.95, keep the 16
      mm footprint and test a narrower outer step. If s-bend line loss stays near
      0.95 with no oval or max_error change, the footprint is not the lever, so return
      to 12 mm and hand the remaining s-bend problem to the controller side.


      ### Requested changes


      - If s-bend line_loss_events falls below 0.9 with s-bend max_error at or below
      0.06 m and oval finish holding at 0.95, keep sensor_size 0.016 m and try outer
      sensors at x = ±0.045 m with y = 0.06 m (not y 0.065). Evidence: iteration 6
      (±0.05 m) cut s-bend line loss from 0.95 to 0.65, but iteration 8 (y 0.065,
      ±0.045 m) scored 432.4, so keep y at 0.06 m.

      - If s-bend line_loss_events stays near 0.95 with max_error near 0.059 m and
      the oval finish unchanged, return sensor_size to 0.012 m. Evidence: iteration
      5 (12 mm) and this footprint change share the same span and forward offset,
      so a footprint-only change that does not cut line loss is not the lever.

      - If the oval finish drops below 0.95 with steering_oscillation above about
      0.30 on the oval, return sensor_size to 0.012 m and keep ±0.04 m. Evidence:
      iteration 6 showed the wider span cost the oval (0.95 to 0.90), and iteration
      5 at 12 mm held 0.95.


      - [Open this output](iteration-9/entityR1/versions/2b210f04223347ab83074ba2640f9381/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/8df2783393c14f7b8009434eebe24911/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-8cf057f100826037/payload.json)'
