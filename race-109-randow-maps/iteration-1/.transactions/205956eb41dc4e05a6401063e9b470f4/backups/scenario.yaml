overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor
    notes: 'A symmetric five-sensor front row with 12 mm footprints, 0.02 m spacing
      and proportional weights, on a mid-range body. No race evidence exists yet,
      so this is a first-principles baseline built to give overlapping coverage and
      a linear signal. The next iteration will revise it using the Integrator''s feedback
      and the race telemetry.


      ### Rationale


      This is iteration 0, so there is no race telemetry or integration feedback yet.
      The design therefore starts from first principles. Five sensors in a single
      row 0.04 m ahead of the axle, spaced 0.02 m apart (x = -0.04 to +0.04), give
      a sensing span of 0.08 m. With 12 mm footprints, adjacent sensors overlap and
      the 25 mm tape is always covered by at least two or three sensors, which keeps
      the signal continuous on bends and avoids line-loss on small offsets. Forward
      placement at y = 0.04 gives some lookahead, so steering starts before the wheels
      reach a bend. Weights are [-2, -1, 0, 1, 2] in left-positive order, so the signal
      is proportional to lateral offset and its magnitude stays within the allowed
      range. The wheel track of 0.12 m and wheel radius of 0.03 m are mid-range values
      that give a moderate turn authority. Body width of 0.12 m widens the off-track
      limit to max(0.06, 0.0125 + 0.03) = 0.06 m, so the robot can drift a little
      further before the run ends. Mass of 0.8 kg and body length of 0.18 m are mid-range.
      Expected result: completion on the development tracks with modest rms_error,
      provided the Integrator''s gains keep the robot within about 0.03 m of the line.
      Speed is set by the controller, not by this geometry, so I am not specifying
      base_speed here.


      - [Open this output](iteration-0/entity0/versions/b09292822649439198cbc1e4248134dd/payload.json)'
  - id: entity1
    label: Baseline PD robot v0
    notes: 'Builder''s symmetric five-sensor row paired with a moderate PD controller
      (kp 4, ki 0.2, kd 0.5) at base_speed 1.4 and last_direction line-loss recovery.
      No race evidence exists yet, so the controller rests on contract physics alone.


      ### Rationale


      Iteration 0 has no race telemetry, so the controller is built from the contract
      physics. The Builder''s five-sensor row (x = -0.04 to +0.04, y = 0.04, 12 mm
      footprints, 0.02 m spacing) gives a continuous signal across the 25 mm tape,
      with weights [-2,-1,0,1,2] matching left-positive sensor order. Signal magnitude
      is at most 2, so kp = 4 gives turn about 8 at the extreme and a wheel differential
      of about 2800 PWM. That is strong but not saturating for typical offsets. kp
      is set moderately, ki is small because the integral is capped at +/-2 and the
      track has no known steady bias, and kd = 0.5 damps oscillation on bends without
      amplifying sensor noise much. base_speed = 1.4 is chosen to approach the roughly
      1.5 m/s average needed for 3 s completion while leaving margin for the controller
      to hold the line. line_loss is ''last_direction'' so that a lost tape on a bend
      is recovered toward the side it was last seen. Expected result: completion on
      the development tracks with modest line-loss, but this is a prediction, not
      a measured outcome. The observation request asks for all metrics so the next
      iteration can separate speed limits from steering limits.


      - [Open this output](iteration-0/entity1/versions/98b16d6e31d04ec689bd9bb2341ada40/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/b09292822649439198cbc1e4248134dd/payload.json)'
  - id: entityR1
    label: Conditional geometry
    notes: 'Written before any race, so it names three conditional changes: widen
      the span, move the row forward, or widen the track, depending on the next race''s
      line loss, oscillation, and completion. Each is tied to the baseline design''s
      reasoning.


      ### Feedback


      No race has run for this geometry or any earlier one, so there is no telemetry
      to cite. The only evidence is what I had to set in the controller from the contract
      physics. The five-sensor row at 0.02 m spacing with 12 mm footprints gives a
      continuous signal, so I did not need a large integral term or aggressive derivative
      action to hold the line. I therefore kept ki small and kd at 0.5. What I cannot
      yet tell is whether the signal stays linear at the outer sensors (x = ±0.04)
      when the tape sits at the edge of the span. If the next race shows line_loss_events
      above zero, or the robot leaves the line at the start of a bend with rms_error
      and max_error rising together, the sensor span is probably too narrow for the
      bend and the row should be widened. If the race shows steering_oscillation high
      while line loss stays at zero, the sensors are too close together or the forward
      offset is too short for the speed reached, so the row should move forward or
      spread wider. If completion is 0 with progress well below 1 and no line loss,
      the speed is limited by wheel authority, so the wheel track or radius should
      change before the sensors. Please give the next design a clear test of one of
      these three cases.


      ### Requested changes


      - If line_loss_events is above 0 on bends, widen the sensor span: try sensor
      x positions of ±0.05 with the same five-sensor count and weights [-2,-1,0,1,2],
      since the current ±0.04 row may lose the tape at the edges.

      - If steering_oscillation is high with no line loss, move the row forward to
      y = 0.06 (keeping the 0.02 m spacing) to give more lookahead, because at the
      speed reached the current y = 0.04 may react too late.

      - If completion is 0 with progress stalled and no line loss, widen the wheel_track
      to 0.14 m to increase turn authority on tight bends, keeping the sensor row
      unchanged so the cause can be isolated.


      - [Open this output](iteration-0/entityR1/versions/98b16d6e31d04ec689bd9bb2341ada40/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/b09292822649439198cbc1e4248134dd/payload.json)'
