map:
  id: race-109-randow-maps
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Forward row to y=0.07 m
    notes: 'Keeps the ±0.05 m span from iteration 6, which cut s-bend line loss to
      0.65, and moves the sensors forward to y=0.07 m to test whether more lookahead
      lifts the s-bend finish rate. Based on the iteration 6 race data (score 449.9
      vs best 465.8) and the Integrator''s rule for this case.


      ### Rationale


      Iteration 6 widened the row to ±0.05 m at y=0.06 m. Score fell from 465.8 to
      449.9, but the s-bend changed in the direction the span was meant to fix: line
      loss fell from 0.95 to 0.65 per run, s-bend max_error is 0.0599 m (at the limit),
      and s-bend oscillation is 0.257. The oval finish dropped from 0.95 to 0.90 with
      oscillation 0.30, which is above the 0.9 threshold only in the sense that it
      is not yet below it. Both s-bend conditions in the Integrator''s rule are met
      (line loss below 0.7, max_error at or below 0.06 m), so the span stays at ±0.05
      m. The s-bend finish rate is still 0.20, so the next limit is lookahead again.
      I therefore move the sensor row forward from y=0.06 m to y=0.07 m, with five
      sensors at x = -0.05, -0.025, 0, 0.025, 0.05 m, 12 mm footprints, wheel_track
      0.095 m and mass 0.6 kg unchanged. I expect s-bend max_error to fall further
      below 0.06 m and the s-bend finish rate to rise above 0.2. The risk is oval
      finish and oscillation. If the oval finish drops below 0.9 with oscillation
      above 0.38, the next step is to return y to 0.06 m with the ±0.045 m span.


      - [Open this output](iteration-7/entity0/versions/ef569d70580248518397f6bae649b66e/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-12776031e33c79d3/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-6aec953d1a0b0c65/payload.json)'
  - id: entity1
    label: y=0.07 row, iter-6 gains
    notes: 'Builder''s ±0.05 m five-sensor row moved to y=0.07 m, with the iteration
      6 controller (kp 3.8, kd 0.6) kept unchanged to isolate the lookahead effect.
      Based on iteration 6 (449.9) showing s-bend line loss falling to 0.65 but oval
      finish dropping to 0.90.


      ### Rationale


      Iteration 6 (±0.05 m five-sensor row at y = 0.06 m, kp 3.8, kd 0.6, ki 0.2,
      wheel_track 0.095 m, mass 0.6 kg) scored 449.9, below the 465.8 best of iteration
      5. Its s-bend line loss fell from 0.95 to 0.65 per run and s-bend max_error
      sat at 0.0599 m, just under the 0.06 m off-track limit. The oval finish fell
      from 0.95 to 0.90 with oscillation 0.30. The Builder''s geometry for this iteration
      keeps the ±0.05 m span and moves the row forward to y = 0.07 m, with all other
      geometry unchanged. I supply the controller for that exact geometry. Forward
      offset does not change the sensor weights, so the signal scale matches iteration
      6 (about 40 per metre). I keep kp at 3.8, kd at 0.6, ki at 0.2, base_speed at
      1.4 and line_loss ''last_direction'', so the race isolates the lookahead change.
      I expect s-bend max_error to fall further below 0.06 m and the s-bend finish
      rate to rise above 0.2. The risk is that the oval finish falls below 0.9 with
      oscillation above about 0.38. If it does, the Builder''s own fallback applies:
      return y to 0.06 m or narrow the span to ±0.045 m. This is a prediction, not
      a measurement.


      - [Open this output](iteration-7/entity1/versions/65185ad39e7b445f86556f6b793c43f0/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/ef569d70580248518397f6bae649b66e/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-6aec953d1a0b0c65/payload.json)'
  - id: entityR1
    label: Feedback on lookahead
    notes: 'Pre-race feedback that sets out conditional next steps: keep y=0.07 if
      the oval holds at 0.9 and s-bend max_error falls below 0.059 m, otherwise return
      to y=0.06 or narrow to ±0.045 m. Evidence comes from iterations 4 to 6, which
      show the s-bend response to forward offset and span.


      ### Feedback


      Written before this candidate has raced. Evidence: iteration 6 (±0.05 m span,
      y = 0.06 m, kp 3.8) scored 449.9. Its s-bend line loss fell from 0.95 to 0.65,
      s-bend max_error was 0.0599 m, and the s-bend finish rate stayed at 0.20. The
      oval finish fell from 0.95 (iteration 5) to 0.90, with oscillation 0.30. Iteration
      5 (±0.04 m, y = 0.06 m) scored 465.8, the best so far, and iteration 4 (y =
      0.04 m) showed that forward offset is what brought s-bend max_error under the
      limit. In the controller I keep kp 3.8, kd 0.6, ki 0.2 and base_speed 1.4 unchanged
      from iteration 6, so this race isolates the forward move. Read the next race
      as follows. If the oval finish holds at 0.9 or above and s-bend max_error falls
      below 0.059 m with s-bend finish above 0.2, keep y = 0.07 m. If the oval finish
      falls below 0.9 with steering_oscillation above about 0.38, return y to 0.06
      m, since the lookahead is costing the oval. If s-bend line loss stays near 0.65
      with no finish gain, the span rather than the lookahead is the limit, so narrow
      to ±0.045 m only if the oval stays at 0.9 or above.


      ### Requested changes


      - If the oval finish falls below 0.9 with steering_oscillation above about 0.38,
      return the forward row to y = 0.06 m and keep the ±0.05 m span. Evidence: iteration
      6 oval finish fell from 0.95 to 0.90 when the span widened, and iteration 5
      at ±0.04 m held 0.95.

      - If the oval holds at 0.9 or above but s-bend line_loss_events stays at about
      0.65 with no finish gain, narrow the outer sensors to x = ±0.045 m with y =
      0.07 m and five sensors. Evidence: iteration 6 cut s-bend line loss from 0.95
      to 0.65 at ±0.05 m, and iteration 5 at ±0.04 m kept the oval finish at 0.95.

      - If the s-bend max_error falls below 0.059 m and the s-bend finish rises above
      0.2 with oval at or above 0.9, keep y = 0.07 m and the ±0.05 m span. Evidence:
      iteration 5 showed forward offset from 0.04 to 0.06 m cut s-bend max_error below
      the limit and lifted the score from 327.8 to 465.8.


      - [Open this output](iteration-7/entityR1/versions/65185ad39e7b445f86556f6b793c43f0/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/ef569d70580248518397f6bae649b66e/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-6aec953d1a0b0c65/payload.json)'
