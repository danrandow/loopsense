overrides:
  entities:
  - id: entity0
    label: Mass 0.40 kg test
    notes: 'Keeps the iteration 10 row and wheel track (score 556.7) and cuts mass
      from 0.45 to 0.40 kg, the contract minimum. Follows the Integrator''s rule:
      the oval held at 1.00 and s-bend oscillation was 0.36, under the 0.38 threshold,
      with s-bend max_error at 0.050 m.


      ### Rationale


      Iteration 10 (mass 0.45 kg, five sensors at x = ±0.04 m, y = 0.06 m, 12 mm footprints,
      wheel_track 0.095 m) is the best design so far at 556.7, up from 465.8 at mass
      0.6 kg. Its oval finish was 1.00 with max_error 0.021 m, and its s-bend finish
      rose to 0.55 with max_error 0.050 m, well under the 0.06 m off-track limit.
      Its s-bend steering oscillation was 0.36, under the 0.38 threshold I set for
      continuing the mass cut. The lighter body is the only change that has helped
      since iteration 5, and the s-bend failures have mostly disappeared. Following
      the rule in Robot Integrator''s feedback, I take the next step on mass to 0.40
      kg, the contract minimum, and keep every other geometry value fixed. Lower mass
      reduces yaw inertia (mass*(L^2+W^2)/12), which helps the remaining s-bend off-track
      exits (9 of 20 still leave the track). The risk is slip or jitter at the lowest
      mass, which the observation request will expose. Because this is the final iteration,
      I stay with the proven row and wheel track, and I change only mass, a single
      lever with clear evidence behind it.


      - [Open this output](iteration-11/entity0/versions/35c2798adffd4a6caa1da959a0715f5e/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-96c45d928573db53/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-3defe743cd6b9e0a/payload.json)'
  - id: entity1
    label: Mass 0.40 kg test
    notes: 'Iteration 10 design with mass cut to the 0.40 kg contract minimum, controller
      unchanged. Based on iteration 10''s 556.7 score, the best so far, and its s-bend
      finish gain from the 0.6 to 0.45 kg mass cut.


      ### Rationale


      Iteration 10 (mass 0.45 kg) is the best design so far at 556.7. Its oval finish
      was 1.00 with max_error 0.021 m, and its s-bend finish was 0.55 with max_error
      0.050 m. Mass has been the only lever that has consistently helped the s-bend
      since iteration 5, and s-bend steering oscillation was 0.36 at 0.45 kg, under
      the 0.38 threshold. Following the Builder''s intent, I keep the iteration 10
      geometry and controller exactly, and change only mass to the contract minimum
      of 0.40 kg. Lower yaw inertia (mass*(L^2+W^2)/12) should cut the remaining off-track
      exits on the s-bend. Because mass is the only change, any difference from iteration
      10 comes from mass alone. I keep kp 3.5, kd 0.6, ki 0.2, base_speed 1.4 and
      last_direction line loss, since the Builder''s evidence does not call for gain
      changes and the contract physics give no reason to retune the controller for
      a 0.05 kg change. Prediction, not measurement: s-bend finish rate above 0.55,
      s-bend max_error at or below 0.05 m, oval finish held at 1.00, and total score
      above 556.7. Main risk: slip or jitter at the lowest mass, which the observation
      request will expose through steering_oscillation and max_error.


      - [Open this output](iteration-11/entity1/versions/1a85a5468ee440b2950f7f671ec6e9bf/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/35c2798adffd4a6caa1da959a0715f5e/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-3defe743cd6b9e0a/payload.json)'
  - id: entityR1
    label: Keep mass or revert 0.45
    notes: 'Pre-race feedback on the 0.40 kg test: keep it if s-bend oscillation stays
      under about 0.40 and the oval holds, otherwise return to 0.45 kg. Evidence from
      iterations 5 and 10 on mass and the s-bend.


      ### Feedback


      Written before this candidate has raced. Evidence: iteration 10 (mass 0.45 kg,
      five sensors at x = ±0.04 m, y = 0.06 m, 12 mm footprints, wheel_track 0.095
      m) scored 556.7, the best so far, with oval finish 1.00 and s-bend finish 0.55.
      Iteration 5 (mass 0.6 kg, same row and track) scored 465.8, with s-bend finish
      0.20, so reducing mass improved the s-bend. Sensing is not the limit: iteration
      1 cut line loss by widening coverage but lost completions, and iteration 9 showed
      a 16 mm footprint is worse. In the controller I kept kp 3.5, kd 0.6, ki 0.2
      and base_speed 1.4 unchanged, so the mass change is isolated. I have no measurement
      for this candidate. Read the next race as follows. If s-bend max_error falls
      below 0.05 m and the oval finish stays at 1.00, the lower mass is helping, and
      0.40 kg is the design to keep. If s-bend steering_oscillation rises above about
      0.43 or the oval finish drops, the minimum mass adds jitter, and 0.45 kg (iteration
      10) is the final geometry.


      ### Requested changes


      - If s-bend steering_oscillation stays under about 0.40 and the oval finish
      holds at 1.00, keep mass at 0.40 kg, since iteration 10 at 0.45 kg gave s-bend
      oscillation 0.36 and s-bend finish 0.55 with max_error 0.050 m.

      - If s-bend oscillation rises above about 0.43 or the oval finish falls below
      1.00, return mass to 0.45 kg with the same five-sensor row. Evidence: iteration
      10 (0.45 kg) is the best tested design at 556.7.

      - Keep wheel_track 0.095 m and the five-sensor row at x = ±0.04 m, y = 0.06
      m, 12 mm footprints. Evidence: iteration 6 (x ±0.05 m) lowered the oval finish
      to 0.90, iteration 7 (y 0.07 m) pushed s-bend max_error to 0.0626 m, and iteration
      9 (16 mm footprint) scored 373.0.


      - [Open this output](iteration-11/entityR1/versions/1a85a5468ee440b2950f7f671ec6e9bf/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/35c2798adffd4a6caa1da959a0715f5e/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-3defe743cd6b9e0a/payload.json)'
