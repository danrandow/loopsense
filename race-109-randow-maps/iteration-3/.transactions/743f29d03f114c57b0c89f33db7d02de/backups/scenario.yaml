map:
  id: race-109-randow-maps
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Track 0.09 m, 0.6 kg
    notes: 'Narrows wheel_track from 0.10 m to 0.09 m, keeping the five-sensor row
      and mass 0.6 kg, to test whether more turn authority removes s-bend off-track
      exits. Based on iteration 2 (score 321), where narrowing the track lifted oval
      finishes from 1 to 9 of 20 and max_error stayed near 0.06 m on the s-bend.


      ### Rationale


      Iteration 2 (five sensors at ±0.04 m, wheel_track 0.10 m, mass 0.6 kg) is the
      best result so far at 321. Its gain came almost entirely from the oval, where
      finish rate rose from 0.05 to 0.45 and mean progress rose to 0.86. The change
      in turn dynamics is therefore the lever that matters. Sensing is not the binding
      limit: widening to seven sensors in iteration 1 cut line loss but lost completions.
      On the s-bend, however, 18 of 20 trials still end off track with max_error about
      0.063 m and 0.9 line-loss events per run, so the s-bend is still limited by
      how tightly the robot can turn. Narrowing the track from 0.12 to 0.10 m (with
      the mass drop) moved the oval from almost no finishes to 45%, which suggests
      more yaw per unit of PWM difference is still helping. The Integrator has already
      reduced kp to 3.6 and raised kd to 0.6 for this candidate to hold effective
      gain. I therefore make one geometry change: wheel_track 0.10 to 0.09 m, keeping
      mass 0.6 kg, the five-sensor row and the body fixed. This isolates turn authority
      again. I expect higher yaw response, more s-bend completions and max_error below
      0.06 m on the s-bend. The risk is steering_oscillation rising as yaw gain increases,
      which the Integrator''s kd change should absorb. If the oval finish rate does
      not improve and max_error stays near 0.06 m, the next limit is base_speed (controller
      side), not geometry.


      - [Open this output](iteration-3/entity0/versions/62fe35316d4645c3953c0478ab7161d6/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-be49466b81dcc345/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-aaac913951d7756b/payload.json)'
  - id: entity1
    label: Track 0.09m, kp trimmed
    notes: 'Complete package for the Builder''s wheel_track 0.09 m with mass 0.6 kg
      and the five-sensor row. kp is cut from 3.6 to 3.3 to hold effective yaw gain
      after the narrower track, based on iteration 2 (score 321).


      ### Rationale


      Iteration 2 is the best result so far (321). Its gain came from the oval, where
      finish rate rose from 0.05 to 0.45. Iteration 1 showed that widening the sensor
      row cut line loss (s-bend 1.1 to 0.2) but still ended every run off track, so
      sensing is not the binding limit. Max_error sits at about 0.06 to 0.063 m in
      every trial of every design, which points to turn response. The Builder''s geometry
      narrows wheel_track from 0.10 to 0.09 m with mass 0.6 kg, the five-sensor row
      at ±0.04 m, and the body unchanged. Turn rate is (v_R - v_L)/wheel_track, so
      for the same PWM difference the yaw rate rises by about 0.10/0.09 = 1.11x. To
      keep the effective steering gain at the level that produced iteration 2, I scale
      kp down by the same factor: 3.6/1.11 ≈ 3.3. I keep ki at 0.2 and kd at 0.6 (the
      iteration 2 damping, which kept steering_oscillation at 0.27 on the oval and
      0.43 on the s-bend). base_speed stays at 1.4 and line_loss stays ''last_direction'',
      so this race isolates the geometry change. Expected result (a prediction, not
      a measurement): higher yaw response, more s-bend completions and max_error below
      0.06 m. The main risk is steering_oscillation rising on the s-bend, which the
      kd of 0.6 should limit.


      - [Open this output](iteration-3/entity1/versions/67578318b18649f086790450761db7fb/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/62fe35316d4645c3953c0478ab7161d6/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-aaac913951d7756b/payload.json)'
  - id: entityR1
    label: Turn-authority next steps
    notes: 'Pre-race feedback with three conditional next steps for the Builder: widen
      outer sensors, move the row forward, or revert track width. Each is tied to
      iteration 0 to 2 evidence on line loss, max_error and oscillation.


      ### Feedback


      Written before this candidate has raced. Evidence: iteration 2 (five sensors
      at ±0.04 m, wheel_track 0.10 m, mass 0.6 kg, kp 3.6, kd 0.6) scored 321, with
      oval finish rate 0.45 and s-bend finish rate 0.10 with max_error about 0.063
      m. Iteration 1 (seven sensors at ±0.06 m) cut s-bend line loss from 1.1 to 0.2
      but dropped the score to 86, so sensing is not the limit. What I compensated
      for in the controller: narrowing the track raises yaw per unit of PWM difference
      by about 1.11x, so I scaled kp from 3.6 to 3.3 to keep the steering gain steady,
      and kept kd at 0.6 to hold oscillation (0.27 oval, 0.43 s-bend in iteration
      2). I cannot yet say whether this will hold the line on the s-bend. Please read
      the next race as follows. If max_error on the s-bend falls below 0.06 m and
      s-bend finish rate rises above 0.10, keep wheel_track narrowing as the main
      lever. If max_error stays near 0.063 m and line_loss_events stays near 0.9 with
      no completion gain, turn authority is no longer the limit, so change the sensor
      row before geometry again. If steering_oscillation rises well above 0.43 without
      line loss, the yaw gain is too high for this row, so move the sensors forward.


      ### Requested changes


      - If s-bend line_loss_events stays near 0.9 and max_error still clusters at
      about 0.063 m, widen the outer sensors to x = ±0.05 m with the same five sensors
      and y = 0.04 m. Evidence: iteration 0 lost the tape at about ±0.058 m, and iteration
      1 cut s-bend line loss from 1.1 to 0.2 when coverage was widened.

      - If steering_oscillation rises above the iteration 2 level (oval 0.27, s-bend
      0.43) with no drop in line loss, move the sensor row forward to y = 0.06 m,
      keeping five sensors at ±0.04 m with 0.02 m spacing. Evidence: iteration 0 showed
      oscillation of 0.30 on the oval, and a higher effective yaw gain (from the narrower
      track) raises jitter at the same lookahead.

      - If the oval finish rate falls below 0.45 or completion_time worsens compared
      with iteration 2, return wheel_track to 0.10 m and keep mass at 0.6 kg with
      the same five-sensor row, because the narrower track has overshot. Evidence:
      iteration 2 (wheel_track 0.10, mass 0.6) reached 0.45 oval finish rate, and
      iteration 0 (wheel_track 0.12, mass 0.8) reached only 0.05.


      - [Open this output](iteration-3/entityR1/versions/67578318b18649f086790450761db7fb/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/62fe35316d4645c3953c0478ab7161d6/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-aaac913951d7756b/payload.json)'
