map:
  id: race-109-randow-maps
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Narrow track, light body
    notes: 'Reverts the sensor row to the five-sensor ±0.04 m layout that scored best
      (136). Narrows wheel_track to 0.10 m and mass to 0.6 kg to test whether yaw
      response is the limit. Iteration 1''s wider sensors cut line loss but lowered
      progress and score, and max_error is pinned near the fixed 0.06 m off-track
      limit.


      ### Rationale


      Evidence from iterations 0 and 1: widening the sensor row to ±0.06 m (iteration
      1) cut line-loss events (oval 1.0 to 0.4, s-bend 1.1 to 0.2, slalom 1.0 to 0.55),
      but every trial still ended off track. Progress fell (oval 0.64 to 0.38, s-bend
      0.21 to 0.14), the only completion was lost (1 of 60 trials across both iterations),
      and the score dropped from 136 to 86. Sensing was therefore not the binding
      limit. Max_error sits at 0.0615 to 0.0635 m in every trial of both designs.
      The off-track limit is max(0.06, 0.0125 + body_width/4). Even at the maximum
      body_width of 0.18 m that gives 0.0575, so the limit stays at 0.06 m. The robot
      is being lost at the same lateral error whatever the sensors report, which points
      to turn authority or yaw response. The contract gives turn rate = (v_R - v_L)/wheel_track,
      so for the same PWM difference a narrower track yaws faster. Yaw inertia scales
      with mass*(L²+W²)/12, so a lighter body also turns more readily. My R1 feedback
      suggested widening wheel_track to 0.14 m for more turn authority. The contract
      physics point the other way, so I am not following that suggestion. I will revert
      the sensor row to the better-scoring five-sensor ±0.04 m layout and make one
      change to the turning dynamics: narrow wheel_track from 0.12 to 0.10 m and reduce
      mass from 0.8 to 0.6 kg. I expect more yaw per unit of turn command, so the
      robot should track tighter bends and hold max_error below 0.06 m, giving more
      completions and higher progress.


      - [Open this output](iteration-2/entity0/versions/e6e3036d15d14348bb7b8c15eff0eda8/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-9d49315913024943/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-fed68d13e4b631ea/payload.json)'
  - id: entity1
    label: Seven-sensor integration
    notes: 'Widens the row to ±0.06 m with weights scaled to position and kp raised
      to 5 to match gain. Speed and other gains are held constant to isolate the sensor-span
      effect, using the iteration 0 line-loss and max_error evidence.


      ### Rationale


      Iteration 0 raced only once (136.1). Line loss averaged about 1 event per run
      on all three tracks, and max_error sat at about 0.0626 m, just past the 0.06
      m off-track limit. The Builder''s hypothesis is that the five-sensor row (x
      = ±0.04) loses the 25 mm tape near the edge of its span, so the robot leaves
      the line with no recovery margin. I accept this test. The Builder''s geometry
      widens the row to seven sensors at x = -0.06 to +0.06 (0.02 m spacing, 12 mm
      footprints, y = 0.04), and all other geometry is unchanged. The controller must
      cover this span with a linear signal. Weights are scaled to the sensor position:
      weight = x * 33.3 m^-1, giving [-2, -1.33, -0.67, 0, 0.67, 1.33, 2], which stays
      inside the ±2 limit. The previous scale was 50 per metre, so kp goes from 4
      to 5 to keep the steering gain close to iteration 0 without over-correcting
      at the outer sensors. The change is modest because the Builder asked to isolate
      the span effect. base_speed (1.4), ki (0.2), kd (0.5) and line_loss (''last_direction'')
      are held constant so the next race attributes any change in line_loss_events
      or max_error to the wider sensor row. Expected result: line loss falls toward
      zero and max_error drops below 0.06 on the oval and s-bend. This is a prediction,
      not a measured outcome.


      - [Open this output](iteration-1/entity1/versions/828f45a950be4180811f49bb6a026eb3/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/205956eb41dc4e05a6401063e9b470f4/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-35858dab394f1af1/payload.json)'
  - id: entityR1
    label: Span and gain feedback
    notes: 'Feedback written before racing, based on iteration 0 line-loss (about
      1 per run) and max_error of 0.0626 m. It sets out three conditional changes:
      widen the span, reduce outer gain, or widen wheel_track.


      ### Feedback


      Written before this candidate has raced. Iteration 0 is the only evidence: about
      1 line-loss event per run on all tracks, max_error about 0.0626 m (just over
      the 0.06 m off-track limit), and 19 of 20 oval trials and all s-bend and slalom
      trials ending off track. That pattern supports the sensor-coverage explanation
      in your rationale, because the five-sensor span (±0.04 m) loses the tape close
      to the off-track boundary. I have not measured the seven-sensor row, so the
      following depends on the next race. If line_loss_events falls to zero or near
      zero and max_error stays below 0.06 m on the s-bend and slalom, keep the ±0.06
      m span and treat sensing as solved. If line_loss_events stays near 1 while the
      robot still leaves at the same bend, sensing is not the limit and the next change
      should be to wheel_track, not the sensor row. If steering_oscillation rises
      well above iteration 0 (about 0.30 on the oval) with no line loss, the outer
      sensors are probably overdriving the signal, so reduce the outer weights or
      move the outer sensors inward. Please keep the 0.02 m spacing and 12 mm footprints
      so the signal stays continuous across the tape.


      ### Requested changes


      - If line_loss_events stays at about 1 per run on s-bend and slalom with max_error
      near 0.06 m, extend the row to x = ±0.07 m (seven sensors at about 0.0233 m
      spacing, 0.012 m footprints, y = 0.04) to add coverage margin. Iteration 0 shows
      the tape is lost at about ±0.058 m with the ±0.04 m row.

      - If steering_oscillation rises above the iteration 0 oval level of about 0.30
      with no line loss, reduce the outer sensor influence by changing the outer sensor
      x to ±0.05 m with the same seven-sensor count, or leave the geometry and let
      the Integrator reduce kp. This addresses the edge-gain concern in your question.

      - If completion is still 0 with progress well short of 1 and no line loss, widen
      wheel_track from 0.12 m to 0.14 m with the sensor row fixed, to isolate turn
      authority. Iteration 0 showed off-track ends with no line-loss problem on the
      s-bend, which points to turn limits rather than sensing.


      - [Open this output](iteration-1/entityR1/versions/828f45a950be4180811f49bb6a026eb3/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/205956eb41dc4e05a6401063e9b470f4/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-35858dab394f1af1/payload.json)'
