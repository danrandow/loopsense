map:
  id: race-215-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: Slower, more damped draft
    notes: 'Drops base speed to 0.7 and raises kd to 0.8 to test whether bend slip-out
      causes the shared off-track failure at about progress 0.1. Sensing stays at
      the best-scoring 7-sensor layout from iteration 4; all 480 prior trials ended
      off track near max_error 0.061.


      ### Rationale


      Evidence: all 480 development trials (iterations 0-8) ended off track after
      one line-loss event, with max_error about 0.061 m against the 0.06 m limit.
      That limit is the floor for any body_width up to 0.18 m, so widening the body
      cannot help. Progress stayed at 0.04 to 0.15 across gain, mass, line-loss and
      sensor-spacing changes. Only forward sensor placement (y 0.06 to 0.08) and the
      7-sensor array moved s-bend and slalom progress. Iteration 9 (speed 0.8, kd
      1.0, footprint 0.012) never raced, so its result is unknown.


      My hypothesis is that the failure is a slip-out at the first bend. At base_speed
      1.0 the robot carries too much speed into the curve for its turn authority,
      so it runs wide and loses the tape. Survival matters more than pace here: the
      score is dominated by 250*progress, and a robot that stays on track for the
      full 3.0 s at moderate speed scores far above the current 50. A robot that completes
      is worth more still, but it has to survive first.


      Changes: (1) base_speed 1.0 to 0.7 to reduce slip-out at bends. (2) Keep the
      iteration 4 sensing that gave the best s-bend result: 7 sensors at y = 0.08
      m, x = -0.03 to +0.03 m, footprint 0.016 m, linear antisymmetric weights. (3)
      kp 2.0 unchanged, to keep steering authority at the lower speed. (4) kd 0.6
      to 0.8 for more damping of the swing after a line loss. (5) ki 0.05 kept, so
      the integral stays small. (6) Mass 0.6 kg, wheel_track 0.14 m and body unchanged,
      and line_loss search_right kept since it gave the best score so far.


      Expected result: max_error below 0.06 m on at least the s-bend and oval, with
      the first line loss moving later or disappearing. Progress should rise toward
      0.3 to 0.6. Completion within 3 s is unlikely at 0.7 base speed, so the score
      gain depends on survival rather than finishing. If the failure point stays fixed
      at about progress 0.115 on the oval, the cause is the start or the track geometry
      rather than speed.


      - [Open this output](iteration-10/entity0/versions/0f03e1d79ce84fa78203ad4651c6d998/payload.json)

      - Based on: [entityR2A](iteration-10/entityR2A/versions/carried-e825fb80a8d18703/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Round-1 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-10/entityC1/versions/d2c280f675dd47de94819fd27ee17e9b/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/0f03e1d79ce84fa78203ad4651c6d998/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-e825fb80a8d18703/payload.json)'
  - id: entity1
    label: kd 0.2 single-step test
    notes: 'Keeps the best raced design (iteration 8, score 50.39) and changes only
      kd from 0.1 to 0.2. The evidence that kd matters comes from iteration 6, where
      kd 0.05 cut s-bend progress from 0.148 to 0.040. The draft''s base_speed and
      footprint changes are rejected as untested.


      ### Rationale


      Evidence. Across 540 trials, every run ended off track after exactly one line-loss
      event, and max_error sits at about 0.061 m, which is the censored off-track
      limit. Oval progress has been 0.115 in almost every design. The best raced design
      is iteration 8 (score 50.39): five sensors at y = 0.06 m, x = -0.03 to +0.03
      m, 0.016 m footprint, mass 0.8 kg, wheel_track 0.12 m, kp 2.0, ki 1.0, kd 0.1,
      base_speed 1.4, search_right.


      What I kept from the round-1 critique. (a) Speed is not the lever: oval progress
      was flat from base_speed 1.0 to 1.8, so the draft''s slip-out hypothesis is
      rejected and base_speed stays at 1.4. (b) The 0.7 speed in the draft is rejected
      because it is untested and gives no gain in the evidence. The stall-rule worry
      is weak at this speed, since 0.5 s of motion covers far more than 0.002 of the
      course. (c) The first failure is probably a start or first-contact condition.
      I cannot change start handling with these inputs, so this step does not test
      it. (d) The footprint, mass and wheel_track changes are dropped, since they
      were untested or confounded.


      What I rejected from the critique. The critique says kd is always harmful because
      it saturates the wheels. The data do not support that: going from kd 0.1 to
      0.05 (iteration 6 against iteration 3) cut s-bend progress from 0.148 to 0.040
      and score from 49.94 to 35.65. So kd has a measurable effect on the s-bend in
      this geometry. A saturation estimate: with the 0.5 weight steps, the signal
      derivative at a tape edge is roughly 10 to 20 per second. At kd 0.2 that is
      2 to 4 turn units, about 700 to 1400 PWM, which stays under the 4095 clamp.


      Change. A single variable: kd 0.1 to 0.2, from the best raced design. Everything
      else matches iteration 8, so any change in result can be attributed to kd.


      Expected result (a guess). s-bend progress rises a little above 0.15, and the
      first line-loss step moves later or stays the same. If the first-loss step and
      oval progress are unchanged (about 0.115), the gains are not the cause. The
      next revision should then test start handling and check controller_errors and
      the first 0.5 s of per-step telemetry. If s-bend progress falls or steering_oscillation
      rises sharply, kd should return to 0.1.


      Metrics to read: first-loss step, progress at first loss, steering_oscillation,
      controller_errors, and the s-bend progress change. max_error is censored at
      about 0.061 m on failed runs, so it is not a pass test.


      - [Open this output](iteration-10/entity1/versions/a7a2f5e142e84c9e9e2aca4653fd3b95/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/0f03e1d79ce84fa78203ad4651c6d998/payload.json),
      [entityC1](iteration-10/entityC1/versions/d2c280f675dd47de94819fd27ee17e9b/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-e825fb80a8d18703/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Critiques kd 0.1 to 0.2 on the iteration 8 base. Key points: the kd-to-s-bend
      link rests on one pair of runs, the saturation estimate looks too low, the line-loss
      kick is unaddressed, and the slalom drop seen in iteration 6 is ignored. Evidence
      is the 60-trial summaries for iterations 3, 6 and 8.


      - [Open this output](iteration-10/entityC2/versions/1c7ade80a9f746ceb7d11f70cc60c948/payload.json)

      - Based on: [entity1](iteration-10/entity1/versions/a7a2f5e142e84c9e9e2aca4653fd3b95/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-e825fb80a8d18703/payload.json)'
  - id: entity2
    label: kd 0.15 single-variable
    notes: 'Raced iteration-8 design (score 50.39) with kd raised from 0.1 to 0.15
      and everything else unchanged. Chosen over the revision''s kd 0.2 because the
      critique shows the saturation estimate was wrong and slalom fell with higher
      kd in iteration 6.


      ### Rationale


      Kept from the critique: the saturation estimate in the revision is wrong. The
      signal can change by about 1 per 10 ms step at a tape edge, so the derivative
      term can reach tens to thousands of PWM at kd 0.2, and the line-loss transient
      could kick the wheels. The critique is right that kd 0.2 could hurt slalom,
      since iteration 6 showed lower kd raised slalom score. I also keep the critique''s
      point that the baseline is about equal to iteration 3 (the 0.44 gap is within
      seed spread), and that no change in this step is likely to reach completion.


      Rejected from the revision: kd 0.2 as the test value. I cannot justify it against
      the critique''s saturation and line-loss concerns, and the revision''s ki 1.0
      does not match the raced iteration 8, which used ki 0.4. I use ki 0.4 so the
      only difference from the raced best is kd.


      Change: a single variable, kd 0.1 to 0.15, from the raced iteration-8 design.
      Geometry, base_speed 1.4, kp 2.0, ki 0.4 and search_right are unchanged, so
      any difference is attributable to kd.


      Expected result: s-bend progress changes by at least 0.01 in the direction of
      the earlier kd 0.05 to 0.1 comparison (up), and slalom changes by under 0.5
      points. The first line-loss step and oval progress (about 0.115) should stay
      the same. If s-bend progress falls, or steering_oscillation rises sharply, kd
      should go back to 0.1. The decision rests on final metrics: line_loss_events,
      progress, steering_oscillation and controller_errors. Per-step telemetry is
      not guaranteed by this request.


      - [Open this output](iteration-10/entity2/versions/122c3c93a4074c638e967675b0e490bd/payload.json)

      - Based on: [entity1](iteration-10/entity1/versions/a7a2f5e142e84c9e9e2aca4653fd3b95/payload.json),
