map:
  id: race-215-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: Lighter, wider-track
    notes: 'Draft lowers mass to 0.4 kg and widens the track to 0.16 m, with base
      speed 0.9, to test whether inertia and turn rate cause the single early line
      loss. Evidence: 480 trials all ended off track at max_error about 0.061 m, and
      sensing and speed changes have not moved the oval failure point.


      ### Rationale


      Evidence: all 480 development trials (iterations 0-10) ended off track after
      exactly one line-loss event, with max_error about 0.061 m against the 0.06 m
      limit. That limit is the floor for any body_width up to 0.18 m, so widening
      the body cannot help. Oval progress sits at 0.11-0.115 whatever the speed (0.7
      to 1.8), gain, sensor spacing or line-loss rule. Speed is therefore not the
      main lever. Only forward sensor placement (y 0.06 to 0.08) and the 7-sensor
      array moved s-bend and slalom progress, and s-bend progress has never exceeded
      0.1475. Iteration 9 never raced, so the 0.8 speed / kd 1.0 / 12 mm footprint
      bundle is unverified.


      Changes (kept small, since the failure point is fixed and I have no telemetry
      on where the line is lost): (1) mass 0.6 to 0.4 kg, the minimum allowed, to
      reduce yaw inertia so the body turns faster after the single line loss. (2)
      wheel_track 0.14 to 0.16 m, to soften the turn rate per unit of wheel differential
      and reduce overshoot past the 0.06 m limit. (3) base_speed 0.7 to 0.9, a compromise
      between the 0.7 (oval 0.11) and 1.0 (best score 50.39) results. (4) kd 0.8 kept
      for damping, kp 2.0 kept for steering authority, ki 0.05 kept small. (5) Sensing
      kept as in iterations 4-10: 7 sensors at y = 0.08 m, x = -0.03 to +0.03 m, footprint
      0.016 m, linear antisymmetric weights. line_loss stays search_right, which gave
      the best score so far.


      Expected result: score near the current 50, with a modest chance of max_error
      below 0.06 m and progress above 0.15 on the s-bend and slalom. Completion within
      3 s is unlikely. If the oval progress stays at about 0.115, the failure is in
      the track geometry or start condition, and sensing and gain changes cannot fix
      it.


      - [Open this output](iteration-11/entity0/versions/536bd39591344526ba9b2e758155cc87/payload.json)

      - Based on: [entityR2A](iteration-11/entityR2A/versions/carried-74e532b4b7256cd3/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critiques the four-variable bundle (mass, track, speed, kd) for having
      no supporting evidence and for mass and track effects that pull in opposite
      directions. It also notes that the best-scoring design, iteration 8, is not
      the baseline, and that the max_error and start-condition claims are untestable
      or unaddressed. Evidence is the iteration 0-10 outcome table.


      - [Open this output](iteration-11/entityC1/versions/f637f10d43b3479e8a51a0e8b128a1ad/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/536bd39591344526ba9b2e758155cc87/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-74e532b4b7256cd3/payload.json)'
  - id: entity1
    label: Best-measured design kept
    notes: 'Resubmits the iteration 8 design unchanged (dev score 50.39), the best
      raced result. I rejected the draft''s untested bundle of mass, track, speed
      and kd changes, since the critique showed they are confounded and unsupported.


      ### Rationale


      Evidence: the best measured design is iteration 8 (dev score 50.39). It uses
      five sensors at y = 0.06 m, x = -0.03 to +0.03 m, a 0.016 m footprint, mass
      0.8 kg, wheel_track 0.12 m, base_speed 1.4, kp 2.0, ki 1.0, kd 0.1, linear weights
      and search_right. Every 2026 development trial to date has ended off track after
      one line-loss event, with oval progress near 0.115 and s-bend progress near
      0.1475.


      What I kept from the round-1 critique: the draft (entity0) changes four or more
      variables at once (mass, wheel_track, base_speed, kd, sensor layout and array
      size). None of these changes has evidence behind it, and the critique is right
      that the mass and track changes pull the turn response in opposite directions.
      The draft''s base_speed 0.9 and kd 0.8 are also untested, and kd 0.8 has an
      unresolved saturation risk. I also accept that the draft''s 7-sensor, y = 0.08
      layout does not match the best measured design.


      What I rejected: I did not accept the critique''s claim that kd is always harmful.
      Iteration 6 showed that dropping kd from 0.1 to 0.05 cut s-bend progress from
      0.148 to 0.040, so kd has a real effect. I also did not take the critique''s
      suggestion to test start handling in this race. This is the final iteration,
      and the unseen-track score depends on the robustness of a measured design, not
      on a new diagnostic.


      Change: none. I resubmit the iteration 8 design unchanged. It is the only candidate
      with a measured score above 50 on the development tracks, and every alternative
      I considered adds untested changes. Expected result: a dev score close to 50.4,
      with the failure at the same first line loss. Completion is unlikely within
      3 s.


      - [Open this output](iteration-11/entity1/versions/a89c32984a04406e9c2d051daa99f865/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/536bd39591344526ba9b2e758155cc87/payload.json),
      [entityC1](iteration-11/entityC1/versions/f637f10d43b3479e8a51a0e8b128a1ad/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-74e532b4b7256cd3/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Critiques kd 0.1 to 0.2 on the iteration 8 base. Key points: the kd-to-s-bend
      link rests on one pair of runs, the saturation estimate looks too low, the line-loss
      kick is unaddressed, and the slalom drop seen in iteration 6 is ignored. Evidence
      is the 60-trial summaries for iterations 3, 6 and 8.


      - [Open this output](iteration-10/entityC2/versions/1c7ade80a9f746ceb7d11f70cc60c948/payload.json)

      - Based on: [entity1](iteration-10/entity1/versions/a7a2f5e142e84c9e9e2aca4653fd3b95/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-e825fb80a8d18703/payload.json)'
  - id: entity2
    label: kd 0.15 single-variable
    notes: 'Raced iteration-8 design (score 50.39) with kd raised from 0.1 to 0.15
      and everything else unchanged. Chosen over the revision''s kd 0.2 because the
      critique shows the saturation estimate was wrong and slalom fell with higher
      kd in iteration 6.


      ### Rationale


      Kept from the critique: the saturation estimate in the revision is wrong. The
      signal can change by about 1 per 10 ms step at a tape edge, so the derivative
      term can reach tens to thousands of PWM at kd 0.2, and the line-loss transient
      could kick the wheels. The critique is right that kd 0.2 could hurt slalom,
      since iteration 6 showed lower kd raised slalom score. I also keep the critique''s
      point that the baseline is about equal to iteration 3 (the 0.44 gap is within
      seed spread), and that no change in this step is likely to reach completion.


      Rejected from the revision: kd 0.2 as the test value. I cannot justify it against
      the critique''s saturation and line-loss concerns, and the revision''s ki 1.0
      does not match the raced iteration 8, which used ki 0.4. I use ki 0.4 so the
      only difference from the raced best is kd.


      Change: a single variable, kd 0.1 to 0.15, from the raced iteration-8 design.
      Geometry, base_speed 1.4, kp 2.0, ki 0.4 and search_right are unchanged, so
      any difference is attributable to kd.


      Expected result: s-bend progress changes by at least 0.01 in the direction of
      the earlier kd 0.05 to 0.1 comparison (up), and slalom changes by under 0.5
      points. The first line-loss step and oval progress (about 0.115) should stay
      the same. If s-bend progress falls, or steering_oscillation rises sharply, kd
      should go back to 0.1. The decision rests on final metrics: line_loss_events,
      progress, steering_oscillation and controller_errors. Per-step telemetry is
      not guaranteed by this request.


      - [Open this output](iteration-10/entity2/versions/122c3c93a4074c638e967675b0e490bd/payload.json)

      - Based on: [entity1](iteration-10/entity1/versions/a7a2f5e142e84c9e9e2aca4653fd3b95/payload.json),
