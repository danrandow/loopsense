map:
  id: race-215-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Wider sensor array, more
    notes: 'Widens the sensor array to +/-0.06 m and raises kp and kd, with lower
      speed and mass, to keep the tape in view through larger swings. The evidence
      is that every prior design lost the line early at about 0.061 m error, and only
      sensor geometry changed progress.


      ### Rationale


      Evidence: all 60 trials of iterations 0-4 ended off track with exactly one line-loss
      event each. max_error sits at about 0.061 m, just over the fixed 0.06 m limit,
      in every design. Oval progress stayed near 0.11 across all five designs, so
      the failure is a shared early event, not a gain problem. Gains (kp 1.6 to 6,
      kd 0.05 to 0.3, ki 0 to 0.3) and speed (1.2 to 1.8) changed little. Sensor moves
      changed s-bend and slalom progress (0.04 to 0.15), so sensing geometry is the
      main lever. Most likely mechanism: the robot swings about 0.035 m off centre,
      the tape leaves the sensor array, the line is lost, and the 0.35 throttle recovery
      drifts it past 0.06 m. The array spans only +/-0.03 m, so it loses the tape
      too early.


      Changes: (1) Widen the array to x = -0.06 to +0.06 m at 0.02 m spacing, 7 sensors,
      y = 0.08 m. The tape should stay visible through a larger swing, so the line-loss
      event should move later or disappear. (2) Keep the weights linear and antisymmetric,
      [-1.5, -1.0, -0.5, 0, 0.5, 1.0, 1.5]. The wider spacing halves the signal change
      per metre of offset, so kp rises from 1.6 to 2.5 to restore the same correction
      strength. (3) kd raised from 0.3 to 0.5 to damp the swing that drives the robot
      toward the loss threshold. (4) base_speed lowered from 1.2 to 1.1 to give the
      loop more time to correct on bends. The pace cost is small, since the average
      speed needed for finishing is about 1.5 m/s and the bends are the limit. (5)
      Mass lowered from 0.8 to 0.6 kg to reduce yaw inertia, so turns respond faster.
      wheel_track 0.14, wheel_radius 0.03, body unchanged, line_loss last_direction
      kept so this change isolates sensing and damping.


      Expected result: fewer or later line-loss events, max_error below 0.06 m on
      at least the s-bend and slalom, and progress rising toward 0.3 or more on the
      oval. If line loss still happens at the same point, the next revision should
      test line_loss or the start handling rather than gains.


      - [Open this output](iteration-5/entity0/versions/789a9e999982463b81e027e542085293/payload.json)

      - Based on: [entityR2A](iteration-5/entityR2A/versions/carried-f6680c468d3b018e/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critique flags confounded attribution across iteration 3 changes, a wrong
      weight-scaling argument for lowering kp, base_speed 1.2 conflicting with the
      finish goal, and kd 0.3 likely saturating wheels. Based on the iteration 0-3
      outcome tables and the contract''s speed and derivative arithmetic.


      - [Open this output](iteration-4/entityC1/versions/50874841a08c44ba808044b2fde8ee6d/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/c6a1070138ac4301bc36ba9514eb77e4/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-a3b08088740d2d31/payload.json)'
  - id: entity1
    label: Sensors forward to y=0.08
    notes: 'Single-variable step from the best raced design (iteration 3, score 49.94):
      sensor y moves from 0.06 to 0.08 m, with kd restored to 0.1 and kp to 2.0 as
      the critique showed. The aim is to test whether an earlier sensor lead changes
      the first line-loss event, since gain changes had no effect in iterations 0
      and 2.


      ### Rationale


      Evidence: iteration 3 is the best raced design (score 49.94). Iterations 0 and
      2 gave identical results despite large gain changes, so the failure is early
      and largely track-independent. Every trial still ends with exactly one line-loss
      event and a censored max_error near 0.061 m.


      Accepted from the critique: (a) kd = 0.3 in the previous draft is likely to
      saturate the wheels at each tape edge, so kd returns to the raced 0.1. (b) The
      weight-scale argument for cutting kp was wrong, so kp is not cut. kp returns
      to the raced 2.0. (c) The wider wheel_track (0.14) and the 7-sensor array were
      confounds, so both are dropped. (d) Changing six variables at once cannot isolate
      the cause, so this step changes one variable only.


      Partly rejected: base_speed. The critique is right that 1.2 makes a sub-3 s
      finish unlikely, but raising speed risks confounding this test. I keep the raced
      1.4 for now and will raise it once line-loss timing is understood.


      Change from iteration 3: sensor y moves from 0.06 to 0.08 m, the maximum allowed,
      so the array sees the tape about 0.02 m earlier. Everything else matches iteration
      3: 5 sensors at x = -0.03 to +0.03 (0.015 m spacing), 0.016 m footprint, weights
      [-1.5, -0.75, 0, 0.75, 1.5], kp 2.0, ki 0.1, kd 0.1, base_speed 1.4, wheel_track
      0.12, last_direction line loss.


      Expected result (a guess): the first line-loss event moves earlier or later,
      or disappears. Decision rule for the next round: if the first loss occurs at
      the same time step with the same error, the cause is the start condition or
      a motor-mismatch bias, so the next step should test line_loss (search_left or
      search_right) and start alignment, not gains. If the first loss moves but max_error
      still reaches 0.06 m, check steering_oscillation before changing kp or kd. If
      progress is high but completion_time exceeds 3 s, raise base_speed.


      - [Open this output](iteration-4/entity1/versions/c35db57eacca44c6ab4bdeee29a2e575/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/c6a1070138ac4301bc36ba9514eb77e4/payload.json),
      [entityC1](iteration-4/entityC1/versions/50874841a08c44ba808044b2fde8ee6d/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-a3b08088740d2d31/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Critiques the y = 0.08 sensor-only change: the 0.02 m shift is weak against
      a fixed 0.061 m offset, the first-loss decision rule uses a measurement the
      request does not return, and the rule is unreachable at current progress. Based
      on the iteration 0, 2 and 3 race data.


      - [Open this output](iteration-4/entityC2/versions/2866b4f33da74573b88e6dc198ef6c99/payload.json)

      - Based on: [entity1](iteration-4/entity1/versions/c35db57eacca44c6ab4bdeee29a2e575/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-a3b08088740d2d31/payload.json)'
  - id: entity2
    label: Sensor y 0.08 test
    notes: 'Final design is iteration 3 with sensor y moved from 0.06 to 0.08 m, a
      single-variable test of whether earlier sensing removes the early off-track
      exit. Rationale now states falsifiable outcomes and a decision rule using only
      returned measurements, as the critique requested.


      ### Rationale


      Evidence: iteration 3 is the best raced design (49.94). Iterations 0 and 2 gave
      identical results (26.04) across very different gains and sensor layouts, and
      every trial in every iteration ends off track with one line-loss event and max_error
      about 0.061 m, just past the fixed 0.06 m limit. The failure is therefore early
      and probably track-independent.


      Critique handling. I accept the critique''s main point that the decision rule
      must be testable. The first-loss time is not returned by the observation request,
      so the rule now uses measurements that are returned: line_loss_events, max_error,
      steering_oscillation, progress and completion_time. I also accept that the expected
      result must be falsifiable, so I state it below. I reject the critique''s suggestion
      to add a start-alignment or line_loss change to this round: this round is meant
      to isolate one variable, and combining changes would reintroduce the confound
      the critique itself raised against iteration 3. I keep base_speed at 1.4 for
      the same reason, although I accept that it has no completion evidence yet. I
      also reject the critique''s point 1 that a 0.02 m lookahead change is too small
      to matter, because it is the only clean comparison available. If it shows no
      change, that is informative.


      Design. Only one variable changes from iteration 3: sensor y moves from 0.06
      to 0.08 m (the allowed maximum), so the array sees the tape about 0.02 m earlier.
      Everything else is unchanged: five sensors at x = -0.03 to +0.03 m (0.015 m
      spacing), 0.016 m footprint, weights [-1.5, -0.75, 0, 0.75, 1.5], kp 2.0, ki
      0.1, kd 0.1, base_speed 1.4, wheel_track 0.12, last_direction line loss.


      Falsifiable expectation. If sensing is the cause, max_error should fall below
      0.06 m on at least one track, or line_loss_events should drop to 0 on at least
      one track. If neither happens on any track, the sensing hypothesis is rejected
      for this layout. If max_error and line_loss_events are both unchanged to four
      decimals, the cause is a start condition or a fixed motor-mismatch bias.


      Decision rule for the next round. (a) Unchanged results: test start alignment
      or the line_loss rule, not gains. (b) max_error still at 0.061 but steering_oscillation
      rising: lower kp or kd before anything else. (c) Progress above 0.5 but completion_time
      above 3 s, or no completion with progress high: raise base_speed. The critique''s
      observation that progress has never exceeded 0.15 means rule (c) cannot fire
      yet.


      - [Open this output](iteration-4/entity2/versions/f1dfb8c311654b8bba4d36402918744a/payload.json)

      - Based on: [entity1](iteration-4/entity1/versions/c35db57eacca44c6ab4bdeee29a2e575/payload.json),
      [entityC2](iteration-4/entityC2/versions/2866b4f33da74573b88e6dc198ef6c99/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-a3b08088740d2d31/payload.json)'
