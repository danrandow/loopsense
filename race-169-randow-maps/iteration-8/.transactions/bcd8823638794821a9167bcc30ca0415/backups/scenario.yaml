map:
  id: race-169-randow-maps
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Narrower track 0.09 m
    notes: 'Keeps the best design so far (iteration 7, score 707) and narrows wheel_track
      from 0.10 to 0.09 m for more turn authority at the slalom. Iteration 7 slalom
      progress rose to 0.53 with lighter yaw inertia, while line loss rose to 1.3,
      so turn authority is the next lever tested. Evidence: iteration 4 vs 1 (track
      narrowing gave a small slalom gain without oval loss).


      ### Rationale


      Iteration 7 (mass 0.6 kg, body_length 0.12 m, lead 0.06 m, span ±0.036 m at
      0.012 m pitch, 12 mm footprints, wheel_track 0.10 m) is the best so far at 707.2.
      The s-bend finished 20/20 with steering_oscillation 0.311, under the 0.35 limit,
      and the oval held 20/20 at 1.79 s. The slalom is still 0/20, but it moved: mean
      progress rose from 0.30 to 0.53, and the best trial reached a score of 383.
      Line-loss events rose to 1.3 and max_error is 0.0653, past the 0.06 limit. Lower
      yaw inertia therefore helps the robot get further through the slalom, but it
      does not yet keep the line. Iteration 4 vs iteration 1 (wheel_track 0.12 to
      0.10) also gave a small slalom gain, which suggests turn authority is still
      the lever that moves the slalom. The Integrator''s rule for a rising line loss
      says to return mass and body_length to 0.7 kg and 0.16 m only if s-bend oscillation
      exceeds 0.35. It does not (0.311), so I keep the lighter body. I change one
      variable: wheel_track from 0.10 to 0.09 m, about 11 percent more turn authority
      for the same PWM difference. The oval has about 1.2 s of time margin, so the
      drivetrain can absorb this. Expected result: slalom progress keeps rising, with
      line-loss events near or below 1.0 and possibly the first slalom finishes. The
      main risk is s-bend jitter from higher effective turn gain, so steering_oscillation
      must be reported on all tracks.


      - [Open this output](iteration-8/entity0/versions/d4d37a439fd245b19dcea134ebb62a85/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-03cff861ee461e63/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-168742b998639e1b/payload.json)'
  - id: entity1
    label: Lighter yaw-inertia robot
    notes: 'Geometry as the Builder proposed, mass 0.6 kg and body_length 0.12 m,
      on the iteration 5 controller. This tests the only untested variable after span,
      footprint, lead and track all failed the slalom at max_error 0.062 to 0.065.


      ### Rationale


      The Builder''s proposal changes only the yaw inertia: mass 0.7 to 0.6 kg and
      body_length 0.16 to 0.12 m. I keep that geometry exactly and take the controller
      that raced in iteration 5, the best design so far (653.3). Its oval finished
      20/20 at 1.85 s, and its s-bend finished 18/20 with steering_oscillation 0.335,
      under the 0.35 limit. The slalom has failed at max_error 0.062 to 0.064 in every
      variant tried (span, footprint, lead 0.04, lead 0.07, track), and line loss
      stayed at about 1.0 events. Lead 0.07 m (iteration 6) gave no gain, so the untested
      variable is yaw response. Yaw inertia is mass*(body_length^2 + body_width^2)/12,
      which falls from about 0.00233 to about 0.00144 kg·m^2. A lower inertia should
      let the robot change heading faster at the slalom''s direction changes. The
      controller needs no change for the new geometry. The sensor span, weights, lead
      (0.06 m), wheel_track (0.10 m) and wheel_radius (0.03 m) are all unchanged.
      The off-track limit stays at 0.06 m because body_width is unchanged. kp 3.6
      and kd 0.9 are kept so the race isolates the inertia change. The main risk is
      that faster yaw adds jitter on the s-bend, so steering_oscillation is measured
      on all three tracks. Expected result: slalom line_loss_events below 1.0 and
      max_error below 0.06, with the oval still 20/20 and the s-bend at or above 17/20.
      No outcome is claimed for this package.


      - [Open this output](iteration-7/entity1/versions/e3a1a4c67c7f41f692458fdb69d888fb/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/21d102968a9d482d9cd5e55bb99c3771/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-d5bf67cd8907a2f8/payload.json)'
  - id: entityR1
    label: Yaw-inertia feedback
    notes: 'Pre-race feedback that the slalom is not limited by reach or lead (iterations
      1 to 6). It sets the next change by outcome: revert mass and body_length if
      s-bend oscillation exceeds 0.35, go lighter if line loss falls without finishes,
      or try a narrower track if the oval fails.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Evidence:
      iteration 5 (span plus or minus 0.036 m, 12 mm footprints, lead 0.06 m, wheel_track
      0.10 m) scored 653.3, the best so far. Its oval finished 20/20 at 1.85 s, and
      its s-bend finished 18/20 with steering_oscillation 0.335. Its slalom was 0/20
      with 1.0 line-loss events and max_error 0.0644. Iteration 6 (lead 0.07 m) left
      the slalom at 0/20 with 1.0 events and max_error 0.065, and its s-bend steering_oscillation
      was 0.333. Lead and reach are therefore not the limit, which points to yaw response.
      Lowering yaw inertia by about 40 percent should help the robot change heading
      at the slalom''s direction changes. The main side effect to watch is s-bend
      jitter, since the s-bend oscillation has been near the 0.35 limit in every run
      since iteration 1. Next-race rules: if slalom line_loss_events fall below 1.0
      or max_error drops below 0.06, keep the inertia change and report slalom completion_time
      if any trial finishes. If slalom line loss is unchanged at about 1.0 with max_error
      at or above 0.06, the yaw response is not the limit, so report the heading at
      first line loss so the next step can target controller entry speed. If s-bend
      steering_oscillation rises above 0.35, return to mass 0.7 kg and body_length
      0.16 m.


      ### Requested changes


      - If s-bend steering_oscillation rises above 0.35 (iterations 5 and 6 measured
      0.335 and 0.333 at the current inertia), return mass to 0.7 kg and body_length
      to 0.16 m, keeping the iteration 5 span, lead and drivetrain.

      - If slalom line_loss_events fall below 1.0 but no trial finishes (iteration
      5 max_error 0.0644 with 1.0 events), try mass 0.5 kg with body_length 0.12 m
      to reduce yaw inertia further, while keeping steering_oscillation under 0.35
      on the s-bend.

      - If the oval loses any trials or the slalom line loss stays at about 1.0 with
      max_error at or above 0.06, try wheel_track 0.09 m for more turn authority.
      Iteration 4 showed the oval at 20/20 with wheel_track 0.10 m (1.82 s), so the
      time margin is there.


      - [Open this output](iteration-7/entityR1/versions/e3a1a4c67c7f41f692458fdb69d888fb/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/21d102968a9d482d9cd5e55bb99c3771/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-d5bf67cd8907a2f8/payload.json)'
