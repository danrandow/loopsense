overrides:
  entities:
  - id: entity0
    label: Shorter body, 0.11 m
    notes: 'Keeps the best design (iteration 10, 785.3, slalom 6/20 finishes) and
      cuts body_length from 0.12 to 0.11 m, lowering yaw inertia about 8 percent at
      unchanged mass. Rests on the three-step yaw-inertia trend and s-bend jitter
      at 0.277, well under the 0.35 limit.


      ### Rationale


      Iteration 10 (mass 0.45 kg, body_length 0.12 m, wheel_track 0.10 m, seven 12
      mm sensors at x = ±0.036 m, y = 0.06 m) is the best design so far at 785.3,
      up from 741.9. The oval held 20/20 at 1.97 s and the s-bend held 20/20 with
      steering_oscillation 0.277, well under the 0.35 limit. The slalom improved again:
      mean progress rose from 0.68 to 0.76, finishes rose from 2/20 to 6/20, and line_loss_events
      fell only slightly, from 1.15 to 1.10. Yaw inertia is the only geometry lever
      that has moved the slalom in three consecutive steps (0.7 to 0.6 to 0.5 to 0.45
      kg). Mass is now near its 0.4 kg lower bound. Rather than cut mass further,
      I reduce yaw inertia through body_length, which the contract says has no direct
      effect on dynamics apart from yaw inertia. Body_length 0.12 m to 0.11 m gives
      I = 0.45*(0.0121+0.0144)/12 ≈ 0.00100 kg·m², about 8 percent below the current
      0.00108. This is a smaller step than the last mass changes, to limit overshoot
      risk, since line loss is still about 1.1. body_width stays at 0.12 m, so the
      off-track limit is unchanged. Expected: slalom progress above 0.76, more finishes,
      and line_loss_events toward 1.0, with the oval at 20/20 and the s-bend at 19/20
      or better with steering_oscillation under 0.35. Fallback: if s-bend steering_oscillation
      exceeds 0.35, the oval loses any trial, or the score falls below 785.3, return
      body_length to 0.12 m with mass 0.45 kg, the best measured design.


      - [Open this output](iteration-11/entity0/versions/9e4d32b2b46e473ea413b6d1dbafa148/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-6decaafef827cf3d/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-f69c64b20bde0b21/payload.json)'
  - id: entity1
    label: Body 0.11 m, best gains
    notes: 'Keeps the iteration 10 best design (785.3) and its controller, changing
      only body_length from 0.12 to 0.11 m to cut yaw inertia about 8 percent. Evidence:
      slalom progress rose from 0.68 to 0.76 as yaw inertia fell in iterations 7 to
      10, while the oval and s-bend held.


      ### Rationale


      Iteration 10 is the best measured design (785.3, up from 741.9). Its oval finished
      20/20 at 1.97 s, its s-bend finished 20/20 with steering_oscillation 0.277 (under
      the 0.35 limit), and its slalom finished 6/20 with mean progress 0.76, up from
      0.68. Yaw inertia is the only geometry lever that has moved the slalom in every
      step since iteration 7, and the Builder''s proposal continues that lever through
      body_length alone. Body_length 0.12 to 0.11 m lowers yaw inertia by about 8
      percent at unchanged mass (0.45 kg), and the contract says body_length has no
      other dynamic effect. Sensing (seven 12 mm sensors, x = ±0.036 m at 0.012 m
      pitch, y = 0.06 m), wheel_track 0.10 m, wheel_radius 0.03 m and body_width 0.12
      m are unchanged from the best design, so the off-track limit does not move.
      The controller is kept exactly as in iteration 10 (kp 3.6, kd 0.9, ki 0, base_speed
      1.6, last_direction, linear weights -2 to +2), so body_length is the only variable
      under test. Slalom line loss is still about 1.1 events, so I do not change gains:
      iteration 8 showed that more turn authority adds s-bend jitter, and iteration
      6 showed that a lead change does not help. Expected: slalom progress above 0.76
      with more finishes and line loss nearer 1.0, while the oval stays at 20/20 and
      the s-bend stays at 19/20 or better with steering_oscillation under 0.35. Fallback:
      if s-bend steering_oscillation exceeds 0.35, the oval loses any trial, or the
      score falls below 785.3, return body_length to 0.12 m with mass 0.45 kg.


      - [Open this output](iteration-11/entity1/versions/529006ae5b694d828880494cf9485917/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/9e4d32b2b46e473ea413b6d1dbafa148/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-f69c64b20bde0b21/payload.json)'
  - id: entityR1
    label: 'Feedback: body 0.11 m'
    notes: 'Pre-race feedback on the body_length 0.11 m step. It gives conditional
      next moves based on s-bend jitter, slalom progress and line loss, and it cites
      iterations 8 to 10 for the fallback to 0.12 m and the track and mass options.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Evidence:
      iteration 10 (mass 0.45 kg, body_length 0.12 m, wheel_track 0.10 m) is the best
      so far at 785.3, with the oval 20/20 at 1.97 s, the s-bend 20/20 with steering_oscillation
      0.277, and the slalom 6/20 with progress 0.76 and line_loss_events 1.10. Iteration
      9 (mass 0.5 kg) reached 741.9, so each yaw-inertia reduction has helped the
      slalom. Iteration 8 (wheel_track 0.09 m) showed that more turn authority raises
      s-bend jitter to 0.342 and cuts slalom progress, so do not narrow the track.
      Body_length 0.11 m continues the yaw-inertia lever with about 8 percent less
      inertia, which is a smaller step than the mass steps, to limit overshoot risk.
      Next-race rules: if slalom progress rises above 0.76 and s-bend steering_oscillation
      stays under 0.35 with the s-bend at 19/20 or better, keep body_length 0.11 m
      as the new best geometry. If slalom progress rises but line_loss_events stay
      at about 1.1 or more, keep the geometry fixed and report the heading and speed
      at first line loss, since the controller entry speed is the next lever. If s-bend
      steering_oscillation exceeds 0.35 or the oval loses any trial, return body_length
      to 0.12 m.


      ### Requested changes


      - If s-bend steering_oscillation exceeds 0.35, the oval loses any trial, or
      the score falls below 785.3, return body_length to 0.12 m with mass 0.45 kg
      (iteration 10, measured 0.277 on the s-bend and 20/20 on the oval).

      - If slalom progress rises above 0.76 and finishes rise above 6/20 with the
      s-bend holding, keep body_length 0.11 m and test mass 0.42 kg with body_length
      0.11 m, since mass 0.5 to 0.45 kg (iterations 9 to 10) raised finishes from
      2/20 to 6/20. Keep the mass at or above the 0.4 kg lower bound.

      - If slalom line_loss_events stay at about 1.1 or more with progress above 0.76,
      do not reduce yaw inertia further. Keep wheel_track at 0.10 m (iteration 8 showed
      narrowing adds jitter) and report the heading and speed at first line loss so
      the controller entry speed can be the next lever.


      - [Open this output](iteration-11/entityR1/versions/529006ae5b694d828880494cf9485917/payload.json)

