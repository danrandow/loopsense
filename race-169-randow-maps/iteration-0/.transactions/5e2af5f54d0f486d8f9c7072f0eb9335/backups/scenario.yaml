  - id: entity0
    label: Baseline 5-sensor
    notes: 'First geometry proposal: five overlapping 12 mm sensors at 0.01 m pitch
      with 0.06 m lead, a 0.12 m track and a 0.7 kg body. Built from the contract''s
      sensing and off-track rules, since no race data or Integrator feedback exists
      yet.


      ### Rationale


      Iteration 0 has no race telemetry and no Integrator feedback yet, so this is
      a baseline built from the contract''s physics and sensing rules. Sensing: a
      12 mm footprint is wider than the 8 mm gap between sensors, so a 0.01 m pitch
      gives overlapping footprints and graded readings across the tape. With 0.02
      m pitch the outer sensors would sit fully off the 25 mm tape (edge at 12.5 mm)
      and give no information near the centre. A 5-sensor array at x = -0.02 to +0.02
      covers the tape with margin for moderate deviations. The sensors sit 0.06 m
      ahead of the axle so the controller sees the line before the wheels reach it,
      which should reduce oscillation but adds lag. Weights of -2, -1, 0, 1, 2 make
      the signal proportional to lateral offset, with positive (left) matching positive
      x. Body: the off-track limit is max(0.06, 0.0125 + body_width/4). For any body_width
      up to about 0.19 m the limit stays at 0.06 m, so 0.12 m is a neutral choice.
      Drivetrain: wheel_track 0.12 m and wheel_radius 0.03 m give moderate turn authority
      and a speed that can reach the roughly 1.5 m/s average needed to finish in 3
      s. Mass 0.7 kg with a 0.16 m body length keeps yaw inertia low for quick response.
      Expected result: the robot completes the oval and s-bend with few line-loss
      events. The slalom may show the most oscillation. The main unknowns are whether
      0.06 m of sensor lead is too much or too little, and whether the 0.02 m outer
      reach is enough at high speed.


