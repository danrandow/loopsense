overrides:
  entities:
  - id: entity0
    label: Narrower track 0.09 m
    notes: 'Keeps the best design so far (iteration 7, score 707) and narrows wheel_track
      from 0.10 to 0.09 m for more turn authority at the slalom. Iteration 7 slalom
      progress rose to 0.53 with lighter yaw inertia, while line loss rose to 1.3,
      so turn authority is the next lever tested. Evidence: iteration 4 vs 1 (track
      narrowing gave a small slalom gain without oval loss).


      ### Rationale


      Iteration 7 (mass 0.6 kg, body_length 0.12 m, lead 0.06 m, span ±0.036 m at
      0.012 m pitch, 12 mm footprints, wheel_track 0.10 m) is the best so far at 707.2.
      The s-bend finished 20/20 with steering_oscillation 0.311, under the 0.35 limit,
      and the oval held 20/20 at 1.79 s. The slalom is still 0/20, but it moved: mean
      progress rose from 0.30 to 0.53, and the best trial reached a score of 383.
      Line-loss events rose to 1.3 and max_error is 0.0653, past the 0.06 limit. Lower
      yaw inertia therefore helps the robot get further through the slalom, but it
      does not yet keep the line. Iteration 4 vs iteration 1 (wheel_track 0.12 to
      0.10) also gave a small slalom gain, which suggests turn authority is still
      the lever that moves the slalom. The Integrator''s rule for a rising line loss
      says to return mass and body_length to 0.7 kg and 0.16 m only if s-bend oscillation
      exceeds 0.35. It does not (0.311), so I keep the lighter body. I change one
      variable: wheel_track from 0.10 to 0.09 m, about 11 percent more turn authority
      for the same PWM difference. The oval has about 1.2 s of time margin, so the
      drivetrain can absorb this. Expected result: slalom progress keeps rising, with
      line-loss events near or below 1.0 and possibly the first slalom finishes. The
      main risk is s-bend jitter from higher effective turn gain, so steering_oscillation
      must be reported on all tracks.


      - [Open this output](iteration-8/entity0/versions/d4d37a439fd245b19dcea134ebb62a85/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-03cff861ee461e63/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-168742b998639e1b/payload.json)'
  - id: entity1
    label: Track 0.09 m, yaw kept
    notes: 'Iteration 7 design with wheel_track narrowed from 0.10 to 0.09 m to add
      turn authority at the slalom, controller unchanged. Iteration 7 (707.2) showed
      slalom progress rising with lower yaw inertia, and iteration 4 vs 1 showed track
      narrowing helps the slalom.


      ### Rationale


      Iteration 7 (mass 0.6 kg, body_length 0.12 m, wheel_track 0.10 m, span ±0.036
      m, lead 0.06 m, kp 3.6, kd 0.9) is the best design so far at 707.2. Its s-bend
      finished 20/20 with steering_oscillation 0.311, under the 0.35 limit. Its oval
      finished 20/20 at 1.79 s. The slalom is still 0/20, with mean progress up from
      0.30 to 0.53 and line_loss_events up to 1.3, which means lower yaw inertia helped
      the robot get further but did not keep the line. Iteration 4 versus iteration
      1 showed that narrowing wheel_track from 0.12 to 0.10 m gave a small slalom
      gain without hurting the oval, so turn authority is the lever still moving the
      slalom. I follow the Builder''s intent and change only wheel_track, from 0.10
      to 0.09 m. That adds about 11 percent more turn per unit of PWM difference.
      I keep the mass, body, span, lead, footprints, kp 3.6, kd 0.9, ki 0, base_speed
      1.6 and last_direction unchanged, so the race isolates the drivetrain change.
      The oval has about 1.2 s of time margin, so it should absorb the change. The
      main risk is s-bend jitter from the higher effective turn gain, so steering_oscillation
      is measured on all three tracks. Expected: slalom line_loss_events near or below
      1.0, max_error nearer 0.06, and the oval holding 20/20. No outcome is claimed
      for this package.


      - [Open this output](iteration-8/entity1/versions/bcd8823638794821a9167bcc30ca0415/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/d4d37a439fd245b19dcea134ebb62a85/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-168742b998639e1b/payload.json)'
  - id: entityR1
    label: 'Feedback: track 0.09 m'
    notes: 'Recommends the narrower 0.09 m track and sets rules for returning to 0.10
      m if s-bend jitter or oval losses appear. Evidence is iteration 7 (s-bend 20/20,
      oscillation 0.311) and iteration 4 vs 1.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Evidence:
      iteration 7 (mass 0.6 kg, body_length 0.12 m, wheel_track 0.10 m) scored 707.2,
      the best so far. Its s-bend finished 20/20 with steering_oscillation 0.311,
      and its oval finished 20/20 at 1.79 s. Its slalom stayed at 0/20, but mean progress
      rose from 0.30 to 0.53 and line_loss_events rose to 1.3, with max_error 0.0653.
      Iteration 4 versus iteration 1 (wheel_track 0.12 to 0.10 m) gave a small slalom
      gain with the oval unchanged, which suggests turn authority is the lever. Lowering
      wheel_track further is the next step. The Integrator''s controller gains are
      kept fixed so the change isolates the track. Next-race rules: if slalom line_loss_events
      fall to about 1.0 or below and s-bend steering_oscillation stays under 0.35,
      keep wheel_track 0.09 m and look at whether the slalom gets its first finishes.
      If line loss rises again with max_error still near 0.065, the turn authority
      is overshooting at direction changes, so the next step is controller entry speed
      rather than more turn authority. If s-bend steering_oscillation rises above
      0.35, return wheel_track to 0.10 m and keep the iteration 7 design.


      ### Requested changes


      - Keep the iteration 7 design and set wheel_track to 0.09 m. Iteration 7 showed
      the slalom progress rising with lower yaw inertia (0.30 to 0.53), and iteration
      4 vs 1 showed narrower track helps the slalom without hurting the oval (20/20
      both ways).

      - If s-bend steering_oscillation rises above 0.35 or the oval loses any trials
      at 0.09 m, return wheel_track to 0.10 m, since iteration 7 measured s-bend 0.311
      and oval 20/20 at 0.10 m.

      - If slalom line_loss_events stay at 1.3 or rise with max_error at or above
      0.065, do not reduce wheel_track further; report the heading at first line loss
      so the next step can change the controller''s entry speed rather than the geometry.


      - [Open this output](iteration-8/entityR1/versions/bcd8823638794821a9167bcc30ca0415/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/d4d37a439fd245b19dcea134ebb62a85/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-168742b998639e1b/payload.json)'
