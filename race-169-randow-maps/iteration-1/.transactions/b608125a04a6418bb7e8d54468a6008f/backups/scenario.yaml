overrides:
  entities:
  - id: entity0
    label: Wider 7-sensor span
    notes: 'Widened the sensor array from +/-0.02 m to +/-0.03 m (7 sensors, 0.01
      m pitch) to stop off-track exits. Iteration 0 showed s-bend 25% finish and slalom
      0% finish, both off-track with max_error at the 0.06 m limit, while oscillation
      stayed low.


      ### Rationale


      Iteration 0 raced and the evidence is clear. The oval finishes 20 of 20 trials,
      so the basic sensing and drivetrain work. The s-bend finishes only 5 of 20 and
      the slalom finishes 0 of 20. Both failures are off-track exits (15 and 20 trials),
      and the worst max_error values (0.056 on the s-bend, 0.064 on the slalom) reach
      or pass the 0.06 m off-track limit. The problem is lateral excursion past the
      sensor reach at bends, not oscillation: steering_oscillation is modest (0.16
      to 0.25) and rms_error is small. The current array spans only +/-0.02 m, so
      when the robot drifts toward the tape edge the outer sensors read little or
      nothing and the controller loses the line. Change: widen the sensor span to
      +/-0.03 m with 7 sensors at 0.01 m pitch (the maximum sensor count), keeping
      sensor_size at 0.012 m so adjacent footprints still overlap on the 25 mm tape.
      Weights stay linear and scaled to the new span (-2 to +2), so the Integrator
      will need a somewhat higher kp, because the signal per metre of offset falls
      from about 100/m to about 67/m. I am keeping the 0.06 m sensor lead and the
      wheel geometry unchanged so this race isolates the span effect. Expected result:
      fewer off-track exits on the s-bend and slalom, with the slalom finish rate
      rising from zero. If lag then shows up as oscillation, the Integrator''s suggested
      lead reduction to 0.04 m is the next step. Body width stays at 0.12 m because
      the off-track limit remains 0.06 m for any body_width up to about 0.19 m, so
      it is not the constraint.


      - [Open this output](iteration-1/entity0/versions/150ae017dd564baa8cf4ebf51f7921d5/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-1662c495d1a6d5e4/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-3e0139759dfc26de/payload.json)'
  - id: entity1
    label: Complete Robot Package
    notes: 'Complete Robot Package. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 0 has no race telemetry or Integrator feedback, so the controller
      is built from the contract''s physics and the Builder''s stated intent. Geometry
      is kept exactly as proposed so the Builder''s baseline is what gets measured.
      Sensing: five 12 mm sensors at 0.01 m pitch overlap on the 25 mm tape, and weights
      of -2..+2 map to lateral offset in roughly 0.01 m steps, so the weighted-average
      signal is about offset/0.01 m. Gain: kp = 2 gives turn about 4 at a 0.02 m offset,
      which is about 1400 PWM of wheel differential. That is firm enough to recover
      on the oval and s-bend without saturating the wheels. ki = 0 avoids integral
      windup on bends, since the integral is capped at +/-2 anyway. kd = 0.5 damps
      the 0.06 m sensor lead without amplifying 2% noise too much. base_speed = 1.6
      (PWM about 80%) targets the roughly 1.5 m/s average needed to finish in 3 s
      while leaving room to steer. line_loss = last_direction, because the tape is
      usually lost on the outside of a bend and the robot should keep turning the
      way it was going. Expected: the oval and s-bend complete with few line losses.
      The slalom is the most likely failure point because the lead of 0.06 m adds
      phase lag at direction changes. No result is claimed for this robot.


      - [Open this output](iteration-0/entity1/versions/5e2af5f54d0f486d8f9c7072f0eb9335/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/2845d8b45ee046e3aec9f86042637267/payload.json)'
  - id: entityR1
    label: Integration Feedback
    notes: 'Integration Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Iteration 0 has no race evidence, so this feedback rests on the contract physics
      and on what the controller had to do to work with this geometry. Sensing: with
      12 mm sensors at 0.01 m pitch the readings overlap, and the signal is about
      offset/0.01 m, so kp of about 2 is a usable scale. The 0.06 m sensor lead should
      help the controller see the line early, but it adds phase lag, so kd was needed
      to damp it. If the next race shows steering_oscillation high or line losses
      on the slalom (a sign of lag), try reducing the sensor lead to y = 0.04 and
      keep the span. If the race shows line losses on the outer sensors at tight bends
      (readings saturating or dropping out near the tape edge), widen the span to
      x = +/-0.03 with a 0.012 m pitch or use a 0.016 m sensor. If the robot completes
      all three tracks with low oscillation but a time near 3 s, the drivetrain is
      the limit: try wheel_track 0.10 for quicker turning, or wheel_radius 0.035 for
      more ground speed per PWM. The off-track limit is 0.06 m for any body_width
      up to about 0.19 m, so body_width is not currently a constraint.


      ### Requested changes


      - If the next race shows line losses or oscillation on the slalom, try sensor
      lead y = 0.04 (not 0.06) to cut phase lag; the 0.06 lead is the main unknown
      in iteration 0.

      - If the outer sensors read saturated or drop out at the tape edge on tight
      bends, try sensor span x = -0.03 to +0.03 with 0.01 pitch, or sensor_size 0.016,
      to extend the reach.

      - If completion_time is near 3 s with no line losses, try wheel_track 0.10 and
      wheel_radius 0.035 to increase turn rate and ground speed for the same PWM.


      - [Open this output](iteration-0/entityR1/versions/5e2af5f54d0f486d8f9c7072f0eb9335/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/2845d8b45ee046e3aec9f86042637267/payload.json)'
