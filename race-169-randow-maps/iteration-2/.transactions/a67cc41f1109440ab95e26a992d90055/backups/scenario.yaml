map:
  id: race-169-randow-maps
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: 16mm sensors, ±0.03 span
    notes: 'Raises sensor footprint from 12 to 16 mm at the same 0.01 m pitch and
      ±0.03 m span, as the Integrator requested for line loss before the slalom exit.
      The slalom is 0/20 with 1.05 line-loss events per trial, and the s-bend improved
      to 16/20 after the span change.


      ### Rationale


      Iteration 1 widened the sensor span to ±0.03 m. The s-bend improved from 5/20
      to 16/20 finishes, and the slalom is still 0/20. All 20 slalom trials ended
      off track, with mean line_loss_events of 1.05 and mean max_error of 0.064, past
      the 0.06 m limit. The Integrator''s rule applies: the slalom still exits with
      line loss before the exit, so the span alone is not enough. The Integrator asked
      for sensor_size 0.016 m at the same 0.01 m pitch. A 16 mm footprint stays fully
      on the 25 mm tape while the sensor is within about 4.5 mm of the line centre,
      and it still reads partial tape out to about 20 mm. That keeps the outer sensors
      informative at the larger offsets the slalom produces, which should cut line-loss
      events before the exit. I am changing only sensor_size in this step. The 0.06
      m lead is kept, since steering_oscillation on the slalom is 0.198 and not elevated,
      so lag is not the evident limit. The oval finishes at 1.84 s, well under 3 s,
      so wheel_track and wheel_radius stay fixed. The seven sensors stay at x = -0.03
      to +0.03 m with 0.01 m pitch, so adjacent footprints overlap heavily. Expected
      result: fewer line-loss events on the s-bend and slalom, with the slalom beginning
      to finish in some trials. If the slalom still shows line loss before exit, the
      next candidate is a lead reduction to 0.04 m.


      - [Open this output](iteration-2/entity0/versions/71ff056cc5964ae9a4f9b25783efccbe/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-2a7acdc17154266a/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-fd471b47307034bc/payload.json)'
  - id: entity1
    label: 7-sensor span, kp 3.0
    notes: 'Widened to ±0.03 m with 7 sensors and rescaled weights. kp raised from
      2 to 3 and kd to 0.75 to hold the steering gain, after iteration 0 showed off-track
      exits at bends with max_error near 0.06 m.


      ### Rationale


      Iteration 0 raced: the oval finished 20 of 20 trials, but the s-bend finished
      only 5 of 20 and the slalom 0 of 20. Both failures were off-track exits (15
      and 20 trials). The worst max_error values (0.056 and 0.064) reach the 0.06
      m limit, while steering_oscillation stayed modest (0.16 to 0.25) and rms_error
      was small. The limit is lateral reach at bends, not jitter. The Builder''s geometry
      widens the sensor span to ±0.03 m with 7 sensors at 0.01 m pitch and keeps sensor_size
      0.012 m, so footprints still overlap on the 25 mm tape. I kept the geometry
      exactly as proposed (lead 0.06 m, wheel_track 0.12 m, wheel_radius 0.03 m, body
      and mass unchanged) so this race isolates the span effect. Controller: weights
      are linear across the seven sensors and scaled to the ±2 limit, giving [-2,
      -4/3, -2/3, 0, 2/3, 4/3, 2]. This signal falls from about 100/m to about 67/m.
      To keep the effective steering gain (kp × signal scale) near iteration 0''s
      2 × 100 = 200 per metre, I set kp = 3.0 (3 × 67 ≈ 200). kd rises from 0.5 to
      0.75 to keep damping in step with the larger kp. ki stays 0. base_speed stays
      1.6 and line_loss stays last_direction, since neither was implicated in the
      failures. Expected: fewer off-track exits on the s-bend and slalom, with a non-zero
      slalom finish rate. No result is claimed for this robot.


      - [Open this output](iteration-1/entity1/versions/b608125a04a6418bb7e8d54468a6008f/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/150ae017dd564baa8cf4ebf51f7921d5/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-3e0139759dfc26de/payload.json)'
  - id: entityR1
    label: Span first, then lag/size
    notes: 'Feedback is written before the race and rests on iteration 0''s off-track
      exits at bends. It gives three conditional changes: sensor_size 0.016, lead
      0.04 m, and wheel_track 0.10 m.


      ### Feedback


      Iteration 0 evidence: the oval finished 20 of 20, the s-bend 5 of 20, and the
      slalom 0 of 20. Both failures were off-track exits (15 and 20 trials), with
      max_error values of 0.056 and 0.064 reaching the 0.06 m limit. steering_oscillation
      (0.16 to 0.25) and rms_error were small, so the controller was not oscillating.
      The limit is lateral reach at bends. For this geometry I had to scale the seven-sensor
      weights to ±2 across ±0.03 m, which drops the signal from about 100/m to about
      67/m. To hold the steering gain near the iteration 0 level, I raised kp from
      2 to 3 and kd from 0.5 to 0.75. The lead of 0.06 m is unchanged, so lag is untested.
      Please state no outcome for this candidate. Next-race decisions: if the s-bend
      and slalom still exit off track with max_error at or above 0.06 m and line loss
      before the exit, the span alone is not enough, so next try a larger sensor footprint
      as requested below. If the slalom now shows oscillation or line loss near direction
      changes, the 0.06 m lead is causing lag, so reduce it to 0.04 m. If the oval
      stays clean and the time is near 3 s, the drivetrain is the limit and wheel_track
      or wheel_radius should change.


      ### Requested changes


      - If the s-bend or slalom still exits with line loss before the exit point,
      keep the ±0.03 m span and set sensor_size to 0.016 m (same 0.01 m pitch) so
      each footprint covers more of the tape and the outer sensors keep a reading
      at bends.

      - If the slalom shows oscillation or line loss at direction changes (lag signs
      in iteration 1 telemetry), reduce sensor y from 0.06 to 0.04 m to cut phase
      lag, since the lead is the main untested variable.

      - If all tracks finish with low oscillation but completion_time is near 3 s,
      change wheel_track from 0.12 to 0.10 m to raise turn rate, because the iteration
      0 oval shows the robot is not limited by sensing there.


      - [Open this output](iteration-1/entityR1/versions/b608125a04a6418bb7e8d54468a6008f/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/150ae017dd564baa8cf4ebf51f7921d5/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-3e0139759dfc26de/payload.json)'
