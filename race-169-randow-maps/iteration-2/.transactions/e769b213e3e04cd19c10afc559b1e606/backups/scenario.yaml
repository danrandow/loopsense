overrides:
  entities:
  - id: entity0
    label: 16mm sensors, ±0.03 span
    notes: 'Raises sensor footprint from 12 to 16 mm at the same 0.01 m pitch and
      ±0.03 m span, as the Integrator requested for line loss before the slalom exit.
      The slalom is 0/20 with 1.05 line-loss events per trial, and the s-bend improved
      to 16/20 after the span change.


      ### Rationale


      Iteration 1 widened the sensor span to ±0.03 m. The s-bend improved from 5/20
      to 16/20 finishes, and the slalom is still 0/20. All 20 slalom trials ended
      off track, with mean line_loss_events of 1.05 and mean max_error of 0.064, past
      the 0.06 m limit. The Integrator''s rule applies: the slalom still exits with
      line loss before the exit, so the span alone is not enough. The Integrator asked
      for sensor_size 0.016 m at the same 0.01 m pitch. A 16 mm footprint stays fully
      on the 25 mm tape while the sensor is within about 4.5 mm of the line centre,
      and it still reads partial tape out to about 20 mm. That keeps the outer sensors
      informative at the larger offsets the slalom produces, which should cut line-loss
      events before the exit. I am changing only sensor_size in this step. The 0.06
      m lead is kept, since steering_oscillation on the slalom is 0.198 and not elevated,
      so lag is not the evident limit. The oval finishes at 1.84 s, well under 3 s,
      so wheel_track and wheel_radius stay fixed. The seven sensors stay at x = -0.03
      to +0.03 m with 0.01 m pitch, so adjacent footprints overlap heavily. Expected
      result: fewer line-loss events on the s-bend and slalom, with the slalom beginning
      to finish in some trials. If the slalom still shows line loss before exit, the
      next candidate is a lead reduction to 0.04 m.


      - [Open this output](iteration-2/entity0/versions/71ff056cc5964ae9a4f9b25783efccbe/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-2a7acdc17154266a/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-fd471b47307034bc/payload.json)'
  - id: entity1
    label: Complete Robot Package
    notes: 'Complete Robot Package. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 1 raced. The oval finished 20/20 at 1.84 s, the s-bend finished 16/20
      (up from 5/20), and the slalom is still 0/20. All 20 slalom trials went off
      track, with mean line_loss_events 1.05 and mean max_error 0.064, past the 0.06
      m limit. The failure is line loss before the slalom exit, not oscillation: slalom
      steering_oscillation is 0.198, which is not elevated. The Builder''s iteration-2
      geometry changes only sensor_size from 0.012 to 0.016 m, keeping the ±0.03 m
      span, the 0.01 m pitch, the 0.06 m lead and the drivetrain fixed. I keep the
      controller that raced in iteration 1 (kp 3.0, kd 0.75, ki 0, base_speed 1.6,
      last_direction, weights -2 to +2 linear), so that the only change under test
      is the footprint. The 16 mm footprint should keep outer-sensor readings through
      larger slalom excursions. The Builder expects a shallower centre slope, but
      I have no measured evidence that kp must change, so I hold it and leave any
      kp adjustment to the next race. Expected: fewer slalom line-loss events and
      possibly the first slalom finishes. No outcome is claimed for this package.


      - [Open this output](iteration-2/entity1/versions/a67cc41f1109440ab95e26a992d90055/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/71ff056cc5964ae9a4f9b25783efccbe/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-fd471b47307034bc/payload.json)'
  - id: entityR1
    label: Integration Feedback
    notes: 'Integration Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Written before this candidate has raced. Evidence from iteration 1: the ±0.03
      m span lifted the s-bend from 5/20 to 16/20 finishes, but the slalom stayed
      at 0/20 with mean line_loss_events 1.05 and max_error 0.064, so the outer sensors
      still lose the line before the exit. The s-bend steering_oscillation rose from
      0.25 to 0.34 when the span widened, so jitter is now a possible side effect
      of wider reach. Iteration 0 showed the oval is not limited by the drivetrain
      (1.84 s, far under 3 s). For this candidate, the Integrator keeps kp 3.0 and
      kd 0.75 unchanged, so the next race isolates the footprint. Next-race decisions:
      if the slalom still shows line loss before exit (line_loss_events of about 1
      or more and max_error near 0.06), the coverage change is not enough, so reduce
      sensor y from 0.06 to 0.04 m to cut the lead. If s-bend steering_oscillation
      stays above about 0.3 while finishes rise, the wider footprint is causing jitter,
      so return sensor_size to 0.012 and try a narrower span of ±0.025 m with 0.0083
      m pitch. If line loss on the slalom falls but finishes remain zero, look at
      wheel_track as turn authority.


      ### Requested changes


      - If the slalom still shows line loss before exit (iteration-1 baseline: 1.05
      events, max_error 0.064), keep the 16 mm footprint and reduce the sensor lead
      from y = 0.06 to y = 0.04 m for all seven sensors, since lag was not evident
      (slalom steering_oscillation 0.198).

      - If the s-bend steering_oscillation stays above about 0.3 (iteration 1 measured
      0.34 versus 0.25 in iteration 0) while finishes rise, return sensor_size to
      0.012 m and keep the ±0.03 m span, testing whether the larger footprint is what
      adds jitter.

      - If line-loss events on the slalom fall but no trial finishes, reduce wheel_track
      from 0.12 to 0.10 m to increase turn authority at the slalom''s direction changes.
      The oval''s 1.84 s finish shows the drivetrain has time margin for this.


      - [Open this output](iteration-2/entityR1/versions/a67cc41f1109440ab95e26a992d90055/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/71ff056cc5964ae9a4f9b25783efccbe/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-fd471b47307034bc/payload.json)'
