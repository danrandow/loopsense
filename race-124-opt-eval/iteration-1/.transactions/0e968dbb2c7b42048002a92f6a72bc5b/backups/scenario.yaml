overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'Conservative first candidate: five 12 mm sensors at 10 mm spacing, kp
      4, kd 0.3, base_speed 1.6, last_direction line loss. No race data yet, so values
      come from the contract''s mid-range and the 1.5 m/s speed target.


      ### Rationale


      Iteration 0 has no race data or evaluator feedback, so this is a conservative
      baseline built from the contract. Geometry: five line sensors spaced 10 mm apart
      across x = -0.02 to +0.02 m, placed 50 mm ahead of the axle so they read the
      line before the wheels reach it. A 12 mm footprint is wider than the 10 mm spacing,
      so the sensors overlap and the signal stays smooth on the 25 mm tape. The wheel
      track (0.12 m), radius (0.03 m), mass (0.8 kg) and body dimensions are mid-range
      values that keep yaw inertia moderate. Controller: a symmetric weight pattern
      (-1, -0.5, 0, 0.5, 1) gives a signal in [-1, 1]. kp = 4 gives a moderate steering
      response (about 1400 PWM difference at full signal). kd = 0.3 damps overshoot
      on the bends, and ki = 0.05 is small so the integral does not wind up on the
      long curves. base_speed = 1.6 (about 80% PWM) is chosen to reach the roughly
      1.5 m/s average needed to finish in 3 s while leaving headroom for the slalom
      and tight bends. line_loss = last_direction so that a momentary loss turns the
      robot back toward the line it came from. Expected result: completion on the
      oval and s-bend, with some oscillation on the slalom. The next race should show
      whether speed or steering gain is the limit. Hypotheses: (1) kp is too low for
      the slalom and progress stalls; (2) base_speed of 1.6 is too fast for the tightest
      bend, causing line loss. Measurements requested: completion, progress, completion
      time, rms and max error, line-loss events and steering jitter.


      - [Open this output](iteration-0/entity0/versions/e64eba5fec0e4aef99ede84508374355/payload.json)'
  - id: entityR1
    label: Baseline valid, approved
    notes: 'Iteration 0 candidate is inside every contract range and there is no race
      data yet, so the bar of valid and not obviously broken is met. Approved to race
      for telemetry, with conditional next-step changes to kp, base_speed and kd tied
      to the measured outcomes.


      ### Feedback


      Iteration 0 has no earlier race results, so this review rests on the contract
      and the candidate''s own fields. Those fields are inside every allowed range:
      five sensors at y=0.05 with x from -0.02 to 0.02, sensor_size 0.012, and weights
      (-1, -0.5, 0, 0.5, 1) giving a signal bounded by 1. The controller values are
      kp 4.0, ki 0.05, kd 0.3, base_speed 1.6 and line_loss last_direction. The observation
      names are all in the allowed set. Nothing is obviously broken, so this is a
      valid baseline to race for telemetry. Expected weaknesses are unverified: kp
      may be too low for the slalom, and base_speed 1.6 may cause line loss on the
      tightest bend. The next race should decide which of these holds. If progress
      stalls below about 0.9 with no line loss, raise kp (for example to 6.0) before
      changing speed. If line_loss_events is above 0 on the tightest bend, lower base_speed
      (for example to 1.3) and keep kp. If steering_oscillation is high while completion
      holds, raise kd (for example to 0.6) to damp the jitter.


      ### Requested changes


      - If progress stalls with no line loss: raise controller.kp from 4.0 to about
      6.0, keeping the other fields, because the untested hypothesis is that kp is
      too low for the slalom.

      - If line_loss_events is above zero: lower controller.base_speed from 1.6 to
      about 1.3, because the untested hypothesis is that 1.6 is too fast for the tightest
      bend.

      - If steering_oscillation is high but completion holds: raise controller.kd
      from 0.3 to about 0.6 to damp jitter on the bends.


      - [Open this output](iteration-0/entityR1/versions/a660f45c291a4511b9d0d40696eb3bc9/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/e64eba5fec0e4aef99ede84508374355/payload.json)'
