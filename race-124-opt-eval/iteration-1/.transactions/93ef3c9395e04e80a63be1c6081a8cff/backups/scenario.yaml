map:
  id: race-124-opt-eval
  schema: v0.2
  scenario: Iteration 1
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 0.
dimensions:
  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Wider sensors, slower
    notes: 'Iteration 0 went off track on all 60 trials with 2 line-loss events each,
      so this candidate widens the sensor spread to ±0.03 m, lowers base_speed to
      1.3, and raises kp to 5.0 and kd to 0.5. The evidence is the per-track telemetry
      in the baseline race, which shows line loss plus max_error just above the 0.06
      m off-track limit.


      ### Rationale


      Evidence from iteration 0: every trial on all three development tracks ended
      off track (oval 20/20, s-bend 20/20, slalom 20/20). Progress was 0.23 on the
      oval, 0.11 on the s-bend and 0.07 on the slalom. Each run logged 2.0 line-loss
      events, and max_error was about 0.063 to 0.067 m, just above the 0.06 m off-track
      limit. The robot therefore fails early, mostly through line loss followed by
      drift, not through slow progress. The evaluator''s conditional rule applies:
      line_loss_events is above zero, so reduce base_speed, and keep kp.


      Causes I can infer: (1) the sensors span only x = -0.02 to +0.02. A sensor''s
      12 mm footprint reaches the 12.5 mm tape half-width only within about 18.5 mm
      of the centre, so once the robot drifts to about 0.02 m the outer sensors see
      nothing and the sum of readings can fall below 0.05. (2) At base_speed 1.6 the
      robot cannot correct before it leaves that narrow window.


      Changes: (a) base_speed 1.6 to 1.3, which the evaluator''s rule supports and
      which gives the robot more time to react. (b) Widen the sensor spread to x =
      -0.03, -0.015, 0, 0.015, 0.03 (15 mm spacing) so the line stays visible at larger
      offsets. Weights stay (-1, -0.5, 0, 0.5, 1), so the signal remains bounded by
      1. (c) kp 4.0 to 5.0 for stronger correction at the wider sensor spacing, since
      the signal now changes more gradually. (d) kd 0.3 to 0.5 to damp the extra overshoot
      that a higher kp introduces. ki stays 0.05. line_loss stays last_direction.


      Expected result: fewer line-loss events (target 0 or 1 per run), max_error below
      0.05 m, and completion on the oval and s-bend. Progress may fall a little on
      the slalom because of the lower speed. Hypotheses to test: (H1) the line-loss
      events come from the sensors losing the tape at large offsets, so wider spacing
      should cut them. (H2) base_speed 1.3 is safe enough to finish. If the robot
      still runs off with zero line loss, kp is too low and should rise to about 6.0.
      If it finishes but takes more than 3 s, raise base_speed toward 1.5 once line
      loss is zero.


      - [Open this output](iteration-1/entity0/versions/0e968dbb2c7b42048002a92f6a72bc5b/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-bb24b07b128f8f52/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-e96498c3929e49cc/payload.json)'
  - id: entityR1
    label: Wider sensors, slower
    notes: 'Approved the candidate to race unchanged: wider sensor spacing (±0.03
      m), base_speed 1.3, kp 5.0 and kd 0.5, all aimed at the line loss and off-track
      drift in iteration 0 (2.0 line-loss events and max_error about 0.065 m per run).
      It is valid and the best diagnosed fix, and this is early exploration, so racing
      gives telemetry now.


      ### Feedback


      Iteration 0 is the only race so far. All 60 trials ended off track (oval 20/20,
      s-bend 20/20, slalom 20/20), with progress 0.23, 0.11 and 0.07, and 2.0 line-loss
      events per run. Max error was 0.063 to 0.067 m, just over the 0.06 m limit,
      so the robot leaves the tape through line loss followed by drift. The candidate
      changes the fields that address that: base_speed 1.6 to 1.3 (the line-loss rule),
      sensor spacing widened from 10 mm to 15 mm (x = -0.03 to 0.03), kp 4.0 to 5.0,
      and kd 0.3 to 0.5. All values are inside the contract ranges, the signal stays
      bounded by 1 with weights (-1, -0.5, 0, 0.5, 1), and the line_loss and observation
      fields are valid. Nothing is obviously broken, and the change is the directly
      diagnosed fix, so it is worth racing now to get per-step telemetry. This is
      early exploration with 10 iterations left. Next race, read the results as follows.
      If line_loss_events is still above 0 with max_error near 0.05 m, widen the spread
      further or keep base_speed at 1.3. If line_loss_events is 0 but the robot still
      runs off track, raise kp toward 6.0, since the correction is too weak. If it
      finishes but completion_time is above 3 s, raise base_speed toward 1.5 once
      line loss is zero. If steering_oscillation rises sharply with the higher kp,
      keep kd at 0.5 or raise it to about 0.7.


      ### Requested changes


      - If line_loss_events is still above 0 with max_error near 0.05 m: keep base_speed
      at 1.3 and widen sensor x to about ±0.04, because iteration 0 showed line loss
      of 2.0 per run at base_speed 1.6 with 10 mm spacing.

      - If line_loss_events is 0 but the robot still leaves the track: raise controller.kp
      from 5.0 to about 6.0, because the iteration 0 failures came from drift past
      the 0.06 m limit.

      - If the robot finishes but completion_time is above 3 s: raise controller.base_speed
      toward 1.5 once line_loss_events is zero, since the course needs about 1.5 m/s
      average to finish in 3 s.


