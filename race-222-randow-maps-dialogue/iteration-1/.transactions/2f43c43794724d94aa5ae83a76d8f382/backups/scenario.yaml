overrides:
  entities:
  - id: entity0
    label: Baseline symmetric
    notes: 'Central baseline: five 12 mm sensors on a 12 mm pitch, 40 mm ahead of
      the axle, with a 0.12 m track and 0.8 kg mass. No race evidence yet, so it is
      chosen from the sensing and off-track rules to establish a reference point.


      ### Rationale


      Iteration 0 has no race data or Integrator feedback yet, so this proposal rests
      on the contract''s physics and sensing rules rather than evidence. The tape
      is 25 mm wide, so five sensors spaced 12 mm apart (x = -0.024 to +0.024) with
      12 mm footprints always have at least one sensor over the tape near centre,
      and the outer sensors can see a line that drifts toward the edge. Placing the
      row 40 mm ahead of the axle gives the Integrator a look-ahead of the line before
      the wheels reach it, which should reduce the lag that causes oscillation at
      bends. A 0.12 m wheel track and 0.03 m wheel radius give moderate turning authority
      without excessive yaw inertia. Body width 0.12 m keeps the off-track limit at
      0.0625 m, a little above the 0.06 m floor. A mass of 0.8 kg is mid-range, which
      keeps acceleration reasonable on the 1.5 m/s average speed the course needs.
      Expected result: a stable, completing baseline with few line-loss events. This
      is a deliberately central design to establish a reference point; I will vary
      sensor span, look-ahead and track width once the Integrator reports how this
      geometry behaves.


      - [Open this output](iteration-0/entity0/versions/5e269d4481f4472ca3fe05df98330500/payload.json)'
  - id: entity1
    label: Baseline robot, P-control
    notes: 'A complete baseline for the central five-sensor geometry: proportional
      steering with light derivative damping, speed 1.6, and last-direction line recovery.
      The gains are first estimates, since no race data exists yet, so they need tuning
      from telemetry.


      ### Rationale


      Iteration 0 has no race data, so the controller rests on the contract''s sensing
      and drivetrain rules. Signal is a reading-weighted average of sensor weights,
      and positive signal steers left. Sensor x runs from -0.024 (right) to +0.024
      (left), so weights are set proportional to x: [-1.0, -0.5, 0, 0.5, 1.0]. This
      keeps signal within about ±1 and gives a monotonic steering response across
      the five sensors. kp = 3.0 gives a turn of about ±3 at full deflection, roughly
      ±1050 PWM between wheels, which is firm enough to follow bends without saturating.
      ki = 0 avoids integral windup on a symmetric baseline. kd = 0.05 adds mild damping
      against oscillation at speed. Motor mismatch is a fixed disturbance of about
      2%, which a P-only law tolerates. base_speed = 1.6 gives about 80% of full PWM,
      aiming to clear the 1.5 m/s average needed to finish in 3 s while leaving margin
      for bends. line_loss = last_direction keeps the robot turning toward the side
      it last saw the tape, which suits a line that drifts off one edge. Expected
      result: a completing run on oval and s-bend with few line-loss events. This
      is a prediction, not a measurement.


      - [Open this output](iteration-0/entity1/versions/e4ce3a1bfa8d460580aea438a06ecf3a/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/5e269d4481f4472ca3fe05df98330500/payload.json)'
  - id: entityR1
    label: Hold geometry, test next
    notes: 'No race data exists yet, so the feedback holds the current geometry for
      a clean baseline. It gives two conditional changes, a narrower sensor span for
      line loss and a longer look-ahead for oscillation, each to be tried only if
      the first race shows that limit.


      ### Feedback


      No earlier race exists, so this feedback has no outcome evidence. What I had
      to decide in the controller: the five-sensor row spans 48 mm against a 25 mm
      tape, so the centre sensors cover the line at all times, but the outer pair
      only reads the tape when the line is near the edge. The steering signal therefore
      stays small and proportional when the robot is centred. The 40 mm look-ahead
      means the line is sensed before the wheels reach it, which should reduce lag,
      but it also means the controller acts on a path the wheels have not yet covered.
      Hold the current geometry for iteration 1 so the first race gives a clean baseline.
      Then decide as follows. If the race shows saturated or near-saturated outer
      readings with high line-loss counts on tight bends, try a narrower span (for
      example x pitch 0.008 m, giving ±0.016 m) so the line stays within the sensor
      range at the cost of earlier saturation. If steering_oscillation is high at
      speed but line loss is low, try a longer look-ahead (y near 0.06) to give the
      controller more time to respond. If rms_error is low and both are fine, keep
      the geometry and let tuning carry the score.


      ### Requested changes


      - Hold the current geometry for iteration 1 to get a clean baseline; change
      nothing until race data shows which limit binds.

      - If line_loss_events are high on tight bends, try sensor x pitch 0.008 m (x
      = -0.016 to +0.016) to keep the line within the sensor range.

      - If steering_oscillation is high at speed, try sensor y = 0.06 for a longer
      look-ahead, and report whether oscillation falls.


      - [Open this output](iteration-0/entityR1/versions/e4ce3a1bfa8d460580aea438a06ecf3a/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/5e269d4481f4472ca3fe05df98330500/payload.json)'
