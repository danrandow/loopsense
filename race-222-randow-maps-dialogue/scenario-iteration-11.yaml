map:
  id: race-222-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: 'Final: hold best geometry'
    notes: 'Holds the iteration-2 geometry (16 mm sensors at ±0.05 m, y 0.04 m, track
      0.12 m) because every tested geometry lever left max_error at about 0.061 m,
      and no supported untested hypothesis remains for the final unseen-track race.
      Evidence: iterations 0 to 10 with the Integrator''s advice to hold the row.


      ### Rationale


      This is the final iteration, so the design I deliver here is the one that will
      race the unseen final track, and I have no further iteration to recover from
      a bad geometry change. The evidence across iterations 0 to 10 supports holding
      the iteration-2 geometry. Span of ±0.05 m is the only change that mattered:
      it removed line loss on the oval and slalom (iteration 1). Footprint (12 vs
      16 mm), wheel_track (0.10, 0.12, 0.15 m), mass (0.6 vs 0.8 kg), wheel_radius
      (0.03 vs 0.04 m, where 0.04 m scored worse) and sensor y (0.02 and 0.04 m identical;
      0.06 m reintroduced line loss) all left max_error at about 0.061 m. The off-track
      floor is max(0.06, 0.0125 + body_width/4), and the widest allowed body gives
      only 0.0575 m, so no body change can lift it. The Integrator asked me to hold
      this geometry, and I took that advice. Their feedback also says that no tested
      geometry lever explains the excursion, and that a further geometry change needs
      a named start-up hypothesis with its confirming measurement. I have no such
      hypothesis with evidence behind it, so I do not add an untested change to the
      final race. I also note that iteration 10 (controller base-speed change, same
      geometry) raised the score to 27.3854, with oval max_error moving slightly,
      so the excursion may be partly speed-dependent. That is the Integrator''s lever
      to tune, not a reason to change the sensing geometry now. Expected result: the
      same behaviour as the best row, about 26.99 to 27.39 depending on the controller,
      with zero line loss and max_error near 0.061 m on the development tracks.


      - [Open this output](iteration-11/entity0/versions/2dd02b5c0f084b198c6a416257749b14/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-f93908ad7b68f6b0/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-46b004fc79c89497/payload.json)'
  - id: entity1
    label: 'Final package: best ctrl'
    notes: 'Iteration-2 geometry held unchanged, with the iteration-10 controller
      (base_speed 1.2), the best-scoring pairing at 27.3854. Evidence is eleven raced
      designs, where only span changed line loss and nothing else moved max_error.


      ### Rationale


      This is the final iteration, so this package races the unseen final track with
      no later correction. The geometry is the iteration-2 row, which the Geometry
      Builder asked me to hold: five 16 mm sensors at x = -0.05 to +0.05 m, y = 0.04
      m, wheel_track 0.12 m, wheel_radius 0.03 m, body 0.12 x 0.18 m, mass 0.8 kg.
      Across eleven raced designs, span is the only geometry lever that changed line
      loss (iteration 1 removed it on oval and slalom). Footprint, wheel_track (0.10
      and 0.15 m), mass, wheel_radius, and sensor y (0.02, 0.04, 0.06 m) all left
      max_error at about 0.061 m, so I have no evidence for a geometry change. The
      controller is the iteration-10 controller, which is the best-scoring pairing
      so far (27.3854). It keeps kp 3.5, ki 0, kd 0.05, last_direction recovery and
      weights [-1, -0.5, 0, 0.5, 1], and lowers base_speed from 1.6 to 1.2. Iteration
      10 raised the score by about 0.39 with the same geometry, and oval max_error
      moved only slightly. Two cautions apply. First, iteration 9 showed that kd 0.15
      gave identical results, so kd stays at 0.05. Second, base_speed was tested only
      at 1.2 and 1.6, so I do not extrapolate below 1.2. Expected result, not measured:
      the same behaviour as iteration 10, with zero line loss and max_error near 0.061
      m on the development tracks. The score on the unseen track is not predicted.


      - [Open this output](iteration-11/entity1/versions/aaf9b0a20a9749c3aeeb5495c06f4ba2/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/2dd02b5c0f084b198c6a416257749b14/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-46b004fc79c89497/payload.json)'
  - id: entityR1
    label: Hold geometry, final race
    notes: 'Written before the final race: holds the iteration-2 geometry and points
      to base_speed as the one lever that has moved the score. Each change tested
      in iterations 2 to 9 left max_error at about 0.061 m.


      ### Feedback


      Written before this robot races. Hold the iteration-2 geometry, as you proposed.
      Across all eleven raced designs, every run ended off_track with max_error between
      0.0604 and 0.0617 m. Span of ±0.05 m is the only change that mattered, because
      it removed line loss on oval and slalom (iteration 1). Footprint (iterations
      1 and 2), kp from 2.6 to 4.4 (iterations 2, 4, 7), wheel_track 0.10, 0.12 and
      0.15 m (iterations 4 and 8), mass 0.6 kg (iteration 5), wheel_radius 0.04 m
      (iteration 7, which scored worse), and sensor y from 0.02 to 0.06 m (iterations
      3 and 6; 0.06 m reintroduced line loss) all left max_error at about 0.061 m.
      Iteration 9 showed kd 0.15 made no difference. The one change that moved the
      score was base_speed 1.2 (iteration 10, score 27.3854), so speed is the lever
      to read, not geometry. The package holds the iteration-2 geometry and the iteration-10
      controller. Because there is no later iteration, no further geometry test can
      be run, so the requested changes below are for the record and for any future
      team.


      ### Requested changes


      - Hold the iteration-2 geometry (16 mm sensors at x = -0.05 to +0.05 m, y =
      0.04 m, wheel_track 0.12 m, wheel_radius 0.03 m, mass 0.8 kg). Do not re-test
      span, footprint, mass, track, radius or y, since each has been tested with no
      effect on max_error.

      - If a future team has another iteration, ask the Integrator to report the step
      or bend at which max_error peaks on each track. A start-up transient and a steady
      offset need different geometry responses, and the Builder has no other way to
      tell them apart.

      - Only propose a geometry change with a named start-up hypothesis and the measurement
      that would confirm it. Speed (base_speed 1.2 versus 1.6) is the only lever that
      has moved the score since span.


      - [Open this output](iteration-11/entityR1/versions/aaf9b0a20a9749c3aeeb5495c06f4ba2/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/2dd02b5c0f084b198c6a416257749b14/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-46b004fc79c89497/payload.json)'
