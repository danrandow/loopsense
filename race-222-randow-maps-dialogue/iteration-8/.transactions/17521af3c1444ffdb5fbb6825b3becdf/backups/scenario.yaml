map:
  id: race-222-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Narrow track 0.10 m
    notes: 'Reverts wheel radius to 0.03 m, since 0.04 m scored worse (26.66 vs 26.99)
      with max_error unchanged. Tests the untested narrower wheel_track (0.10 m) on
      the best 16 mm, plus/minus 0.05 m row, since every race so far has been stuck
      at max_error of about 0.061 m against a fixed 0.06 m off-track limit.


      ### Rationale


      Iteration 7 tested wheel_radius 0.04 m against the iteration-2 row. It scored
      26.6552, below the best 26.9949. Progress fell on the oval (0.1125 vs 0.115)
      and control effort rose, while max_error stayed at about 0.061 m. Larger wheels
      did not help, so I revert radius to 0.03 m. Across iterations 0 to 7, every
      run ended off_track with max_error of about 0.061 m. The off-track limit is
      max(0.06, 0.0125 + body_width/4), and no allowed body width raises it above
      0.06 m, so the excursion sits just past a fixed limit. Span (±0.05 m) removed
      line loss, and footprint, mass, wheel_track 0.15 m, sensor y (0.02 to 0.06 m)
      and radius 0.04 m have not moved max_error. The one geometry lever not yet tested
      is a narrower wheel_track. The Integrator''s contingency names wheel_track 0.10
      m, and it was written for a 0.04 m radius, which has now been shown to be worse.
      I therefore apply it on the 0.03 m radius. A narrower track gives about 1.2
      times more yaw per unit of wheel-speed difference (0.12/0.10), so the same steering
      command turns the robot harder. The Integrator may need to scale kp to keep
      the effective gain the same. That is their decision, and I do not set controller
      values here. Sensors (five 16 mm footprints at x = ±0.05 m, y = 0.04 m), mass
      0.8 kg and body are unchanged, so the test isolates track width against the
      best-scoring row. Expected result: if the excursion is a steering-authority
      limit, max_error should move. I expect a modest change at most, and I do not
      expect runs to finish.


      - [Open this output](iteration-8/entity0/versions/a92fa301001d4d1dbd97400a21c771ac/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-982675c9ba5877d6/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-b4ae6080d042a320/payload.json)'
  - id: entity1
    label: Complete Robot Package
    notes: 'Complete Robot Package. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      The Builder''s proposal is the iteration-2 row (16 mm sensors at x = ±0.05 m
      and 0 m, y = 0.04 m, mass 0.8 kg, wheel_radius 0.03 m, body 0.12 by 0.18 m)
      with one change: wheel_track 0.12 m to 0.10 m. Yaw rate is wheel-speed difference
      divided by wheel_track, so the narrower track gives about 1.2 times more yaw
      per unit of PWM difference. The iteration-4 precedent works in the same way:
      wheel_track 0.15 m was paired with kp 4.4 (3.5 × 0.15/0.12) to hold effective
      gain, and the scaling logic is the same here. I therefore scale kp by 0.10/0.12,
      giving 3.5 × 0.833 ≈ 2.9, so the effective steering gain matches iteration 2.
      The other controller values stay at the iteration-2 settings (ki 0, kd 0.05,
      base_speed 1.6, last_direction line recovery, weights [-1, -0.5, 0, 0.5, 1]).
      Evidence on the outcome is limited. Iteration 4 showed that wheel_track 0.15
      m with matched gain left max_error at about 0.061 m, so I expect a small change
      at most. Line loss is the main risk if the robot turns too hard on the narrow
      track, and kp 2.9 is the mitigation. Only the controller changes from iteration
      2, so any shift in max_error is attributable to track width, given the matched
      gain. This is a prediction, not a measurement.


      - [Open this output](iteration-8/entity1/versions/c5513ada76a645fcb08832894bb83ef4/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/a92fa301001d4d1dbd97400a21c771ac/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-b4ae6080d042a320/payload.json)'
  - id: entityR1
    label: Integration Feedback
    notes: 'Integration Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Written before this robot races. Evidence from earlier races: iterations 0 to
      6 all ended off_track with max_error of about 0.061 m on every track. Span ±0.05
      m removed line loss (iteration 1). The 16 mm footprint kept line loss at zero
      but left max_error unchanged (iteration 2). Iteration 4 tested wheel_track 0.15
      m with kp scaled to 4.4 and gave the same max_error (0.0614, 0.0611, 0.0609)
      with higher control effort. That result is the closest evidence to your narrower-track
      test, and it argues that track width does not set the excursion. I expect the
      same here, so I do not predict a score. Your claim that a narrower track gives
      more turning authority is physically right (more yaw per PWM difference), and
      I have matched gain with kp 2.9 so the test isolates track width. I also have
      no per-step telemetry, so I cannot say whether the excursion happens at the
      start of the run or at a particular bend. Please do not treat the start-up question
      as settled. Next step depends on the race. If max_error stays near 0.061 m with
      line loss at zero, stop testing wheel_track, hold the iteration-2 row, and propose
      a different hypothesis. If line loss returns on the narrow track, revert to
      0.12 m rather than widening the span, since the wider span is untested at ±0.07
      m and the evidence favours the current row.


      ### Requested changes


      - Keep the 16 mm footprint at x = ±0.05 m and y = 0.04 m, and test wheel_track
      0.10 m as the single geometry change. Report max_error and line_loss_events
      per track.

      - If max_error stays at about 0.061 m with line loss at zero, return to wheel_track
      0.12 m and propose a hypothesis other than track width, since width has now
      been tested at 0.10 m and 0.15 m without moving the excursion.

      - If line loss returns at 0.10 m, revert to 0.12 m rather than widening the
      span to ±0.07 m, because the span change was only tested at ±0.05 m and the
      iteration-2 row has zero line loss on oval and slalom.


      - [Open this output](iteration-8/entityR1/versions/c5513ada76a645fcb08832894bb83ef4/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/a92fa301001d4d1dbd97400a21c771ac/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-b4ae6080d042a320/payload.json)'
