map:
  id: race-222-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: 'Final: hold best geometry'
    notes: 'Holds the iteration-2 geometry (16 mm sensors at ±0.05 m, y 0.04 m, track
      0.12 m) because every tested geometry lever left max_error at about 0.061 m,
      and no supported untested hypothesis remains for the final unseen-track race.
      Evidence: iterations 0 to 10 with the Integrator''s advice to hold the row.


      ### Rationale


      This is the final iteration, so the design I deliver here is the one that will
      race the unseen final track, and I have no further iteration to recover from
      a bad geometry change. The evidence across iterations 0 to 10 supports holding
      the iteration-2 geometry. Span of ±0.05 m is the only change that mattered:
      it removed line loss on the oval and slalom (iteration 1). Footprint (12 vs
      16 mm), wheel_track (0.10, 0.12, 0.15 m), mass (0.6 vs 0.8 kg), wheel_radius
      (0.03 vs 0.04 m, where 0.04 m scored worse) and sensor y (0.02 and 0.04 m identical;
      0.06 m reintroduced line loss) all left max_error at about 0.061 m. The off-track
      floor is max(0.06, 0.0125 + body_width/4), and the widest allowed body gives
      only 0.0575 m, so no body change can lift it. The Integrator asked me to hold
      this geometry, and I took that advice. Their feedback also says that no tested
      geometry lever explains the excursion, and that a further geometry change needs
      a named start-up hypothesis with its confirming measurement. I have no such
      hypothesis with evidence behind it, so I do not add an untested change to the
      final race. I also note that iteration 10 (controller base-speed change, same
      geometry) raised the score to 27.3854, with oval max_error moving slightly,
      so the excursion may be partly speed-dependent. That is the Integrator''s lever
      to tune, not a reason to change the sensing geometry now. Expected result: the
      same behaviour as the best row, about 26.99 to 27.39 depending on the controller,
      with zero line loss and max_error near 0.061 m on the development tracks.


      - [Open this output](iteration-11/entity0/versions/2dd02b5c0f084b198c6a416257749b14/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-f93908ad7b68f6b0/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-46b004fc79c89497/payload.json)'
  - id: entity1
    label: Slower base speed test
    notes: 'Iteration-2 geometry and controller, with base_speed cut from 1.6 to 1.2
      as the only change. Iteration 9 showed kd has no effect on the 0.061 m excursion,
      so speed is the one untested controller lever.


      ### Rationale


      Iteration 9 tested kd 0.05 to 0.15 on the iteration-2 row and gave identical
      results (score 26.9949, max_error 0.0614, 0.0611, 0.0609 on oval, s-bend and
      slalom, zero line loss). Damping therefore does not move the excursion. Across
      iterations 0 to 9, kp from 2.6 to 4.4, ki 0.3 (confounded with y), footprint,
      span, mass, wheel_track, wheel_radius and sensor y have all left max_error at
      0.061 m. Base speed is the one controller lever not yet tested, and an entry
      transient or start-up offset would depend on forward speed. I keep the iteration-2
      geometry exactly and the iteration-2 controller (kp 3.5, ki 0, kd 0.05, weights
      [-1, -0.5, 0, 0.5, 1], last_direction recovery) and change only base_speed,
      from 1.6 to 1.2, so the race isolates speed. Expected result, which I do not
      state as measured: line loss stays at zero. max_error moves only if the excursion
      depends on speed. The trade-off is that lower speed reduces progress per step,
      so a completion gain is unlikely even if max_error falls.


      - [Open this output](iteration-10/entity1/versions/5dcb9239fc9a463cb8a8ef9bbe6b6d7c/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/67801d2528a347d98ae2f1bf10dfcfb0/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-29348d80033de260/payload.json)'
  - id: entityR1
    label: Hold geometry, test speed
    notes: 'Holds the best-scoring geometry and asks for a named start-up hypothesis
      if the excursion persists. Based on iterations 0 to 9, where only span changed
      line loss and nothing moved max_error.


      ### Feedback


      Hold the iteration-2 geometry. Iteration 9 (kd 0.15 on that geometry) gave identical
      scores and max_error (0.0614, 0.0611, 0.0609), so damping does not move the
      excursion, and I have dropped kd as a lever. Across iterations 0 to 9, kp 2.6
      to 4.4 (iterations 2, 4, 7), footprint 12 vs 16 mm (1, 2), wheel_track 0.10,
      0.12 and 0.15 m (4, 8), mass 0.6 kg (5), wheel_radius 0.04 m (7, which scored
      worse) and sensor y 0.02 to 0.06 m (3, 6; 0.06 m reintroduced line loss) all
      left max_error at about 0.061 m. Span 0.05 m (iteration 1) is the only change
      that mattered, because it removed line loss. Iteration 10 changes only the controller''s
      base speed, so I will read the race as follows. If max_error moves with speed,
      the excursion is speed-dependent and I will tune speed against progress. If
      it does not, no tested lever explains the excursion, and I will ask you for
      a geometry change only with a named start-up hypothesis and the measurement
      that would confirm it.


      ### Requested changes


      - Hold the iteration-2 geometry (16 mm sensors at x = -0.05 to +0.05 m, y =
      0.04 m, wheel_track 0.12 m, wheel_radius 0.03 m, mass 0.8 kg, body 0.12 x 0.18
      m). Do not re-test span, footprint, mass, track, radius or y, since each has
      been tested with no effect on max_error.

      - If max_error stays at about 0.061 m, propose one geometry change only with
      a named start-up hypothesis (for example, the sensor row reads the line too
      early at the start pose) and the measurement that would confirm it. Explain
      why it differs from the y and span tests already run.

      - Ask for and report, in the next race, the step or bend at which max_error
      peaks on each track. A start-up transient and a steady offset need different
      geometry responses.


      - [Open this output](iteration-10/entityR1/versions/5dcb9239fc9a463cb8a8ef9bbe6b6d7c/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/67801d2528a347d98ae2f1bf10dfcfb0/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-29348d80033de260/payload.json)'
