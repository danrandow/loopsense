map:
  id: race-222-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Look-ahead y 0.06 (test)
    notes: 'Moves the 16 mm sensor row from y 0.04 to 0.06 to test whether a longer
      look-ahead reduces the stuck ~0.061 m max_error, as the Integrator''s rule requires
      once line loss is zero. Iteration 2 showed the footprint change left max_error
      unchanged across all three tracks.


      ### Rationale


      Iteration 2 (16 mm footprint at x = ±0.05, y = 0.04) left max_error unchanged
      at about 0.061 m on every track (0.0614 oval, 0.0611 s-bend, 0.0609 slalom).
      Line-loss events stayed at 0, RMS error at about 0.030 m, and steering oscillation
      at about 0.07. Score rose only 0.2, from 26.79 to 26.99, and that gain came
      from control effort, not from progress. Every run still ended off_track with
      progress of 0.04 to 0.12. The footprint change therefore did not move the excursion,
      which matches the Integrator''s stated decision rule: if line loss is zero and
      max_error stays near 0.061 m, the next geometry lever is sensor y (look-ahead).
      I followed that advice. I kept the 16 mm footprint and the ±0.05 m span, which
      removed line loss in iteration 1, and moved the sensor row from y = 0.04 to
      y = 0.06. A longer look-ahead gives the controller the line earlier, which should
      reduce the lag behind the 0.061 m excursion. Off-track is set at max(0.06, 0.0125
      + body_width/4); with a 0.12 m body that is 0.06 m, and widening the body cannot
      raise it within the allowed range, so the body stays at 0.12 m. Wheels, mass
      and the controller gain are unchanged, so the race isolates the look-ahead change.
      Expected result: max_error moves below about 0.058 m, or progress rises above
      0.12 on at least one track. If max_error stays at about 0.061 m, the excursion
      is not a look-ahead lag and the next geometry test should be wheel_track (turning
      authority), not sensor span or footprint.


      - [Open this output](iteration-3/entity0/versions/85584ff8dc04403298ca44ceb5cbd6d5/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-331e4127410afe88/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-dcd4f211c37413ae/payload.json)'
  - id: entity1
    label: y=0.06 look-ahead + ki
    notes: 'Moves sensors to y=0.06 on the 16 mm ±0.05 m row, and adds ki=0.3 to test
      whether the fixed motor mismatch causes the steady 0.061 m off-track excursion.
      Evidence: max_error was unchanged across kp 3.0 and 3.5 and across spans.


      ### Rationale


      Iteration 2 (16 mm footprint, x = ±0.05 m, y = 0.04 m, kp 3.5) scored 26.99
      with zero line loss on the oval and slalom. Every run still ended off_track
      with max_error of about 0.061 m. That value did not move when kp went from 3.0
      to 3.5, nor when the span changed from ±0.024 m to ±0.05 m, so steering gain
      and sensing reach are not setting the excursion. The likely cause is a steady
      drift from the fixed motor mismatch, or an early transient before steering acts.
      P-only steering leaves a steady offset from that mismatch, and the integral
      term is the one term that removes it. I therefore add a small ki = 0.3 to cancel
      the fixed bias and keep kp = 3.5 so the change is isolated. The geometry follows
      the Builder''s proposal: 16 mm footprints, x = ±0.05 m, y raised to 0.06 m for
      a longer look-ahead, with the same five-sensor weights. Signal is still a weighted
      average, so the weights are unaffected by the y change. Expected result: max_error
      falls below about 0.058 m if the mismatch is the cause. If it does not move,
      the excursion is a start transient, and the next controller step is lower base_speed
      or higher kd. This is a prediction, not a measurement.


      - [Open this output](iteration-3/entity1/versions/0649e01d0be04eb5ad54193042d09bcc/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/85584ff8dc04403298ca44ceb5cbd6d5/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-dcd4f211c37413ae/payload.json)'
  - id: entityR1
    label: Test y=0.06, then wheel
    notes: 'Asks the Builder to test the y=0.06 look-ahead and, if max_error still
      sits at 0.061 m, to try a wider wheel track. Based on iterations 0 to 2, where
      kp and span did not move max_error.


      ### Feedback


      Evidence: iterations 0 to 2 all ended off_track with max_error of about 0.061
      m. Iteration 1 (12 mm, x = ±0.05 m) removed line loss on the oval and slalom,
      so coverage was the line-loss cause. Iteration 2 (16 mm, same span, kp 3.5)
      left max_error at 0.061 m on every track. Raising kp from 3.0 to 3.5 also left
      max_error unchanged, so steering gain is not what sets the excursion, and the
      controller is not the limit here. I am testing your y = 0.06 look-ahead with
      the same footprint and span; the controller adds a small integral term to see
      whether a fixed motor mismatch causes the steady offset. The result of this
      race is not known yet. If max_error still sits at about 0.061 m with line loss
      at zero, the look-ahead is not the lever, so try wheel_track near 0.15 m for
      more turning authority. If line loss returns at y = 0.06, hold y = 0.04 and
      revert the look-ahead.


      ### Requested changes


      - Keep 16 mm footprints at x = ±0.05 m and test y = 0.06, and report whether
      max_error moves below about 0.058 m.

      - If max_error stays at about 0.061 m at y = 0.06, try wheel_track 0.15 m (more
      turning authority) with the same sensors, since kp changes did not move the
      excursion.

      - If line_loss_events return at y = 0.06, revert to y = 0.04 and keep the 16
      mm, ±0.05 m row.


      - [Open this output](iteration-3/entityR1/versions/0649e01d0be04eb5ad54193042d09bcc/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/85584ff8dc04403298ca44ceb5cbd6d5/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-dcd4f211c37413ae/payload.json)'
