map:
  id: race-130-opt-eval
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: kd 0.5 damping test
    notes: 'Keeps kp 7.0 and changes only kd from 0.4 to 0.5, as the agreed plan requires
      when oval steering_oscillation rose to 0.25 in iteration 3. The aim is to reduce
      jitter while keeping the edge response that holds max_error near 0.06.


      ### Rationale


      Iteration 3 (kp 7.0, kd 0.4, base_speed 1.4, ki 0.05, 16 mm sensors at x = ±0.030
      m, last_direction) was the best so far at 82.74, but every trial still ran off
      track. Its telemetry shows three things. (1) steering_oscillation on the oval
      rose to 0.25, above the 0.2 threshold that the Evaluator and my earlier plan
      set. The s-bend (0.12) and slalom (0.13) values are low, so the oval is where
      the jitter sits. (2) max_error is still 0.061 to 0.065, just over the 0.06 limit.
      (3) Line loss is down to 1 per run on the s-bend and slalom, and 1.65 on the
      oval. Progress is still poor (0.39 oval, 0.13 s-bend, 0.09 slalom). The Evaluator''s
      conditional plan applies directly: when oscillation exceeds about 0.2 with kp
      7.0, raise kd to 0.5 before cutting kp. Cutting kp would reduce the edge response
      that is currently keeping max_error near 0.06. I therefore change one variable:
      kd 0.4 to 0.5, with kp held at 7.0. Geometry, base_speed 1.4, ki 0.05 and last_direction
      stay unchanged so the result is attributable to damping alone. Expected result:
      steering_oscillation on the oval falls back below about 0.2 while max_error
      stays near 0.06 or lower, and the oval line-loss count and progress hold or
      improve. Risk: kd 0.5 may slow the response to edge transients and lift max_error
      on the s-bend. Next measurements: steering_oscillation, max_error and line_loss_events
      per track, plus progress and rms_error. If oscillation is now low but max_error
      is still at or above 0.06, the next step is to widen the array to ±0.040 m and
      test kp near 8. If the s-bend and slalom keep one line loss at the same entries,
      the next step is to test line_loss search_left or search_right, choosing the
      side the failing bends favour. If progress is still below 1 with max_error under
      0.06, raise base_speed toward 1.6.


      - [Open this output](iteration-4/entity0/versions/0e06c019830145a19f903f7076003d68/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-73a99e2a878b01c1/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-0f4db0584201cd60/payload.json)'
  - id: entityR1
    label: Approve kd 0.5 damping
    notes: 'Approved the single-variable change kd 0.4 to 0.5 at kp 7.0, because iteration
      3 had oval steering_oscillation of 0.25 and the rationale''s own rule calls
      for more damping before lower kp. Feedback gives branch rules for the next race,
      based on iteration 3''s max_error (0.061 to 0.065) and line-loss telemetry.


      ### Feedback


      The candidate changes one variable: kd 0.4 to 0.5, with kp 7.0, geometry, base_speed
      1.4, ki 0.05 and last_direction unchanged from iteration 3. The rationale matches
      the evidence. Iteration 3 (kp 7.0, kd 0.4) was the best so far at 82.74, but
      every trial still went off track. Its oval steering_oscillation was 0.25, above
      the 0.2 concern level, while the s-bend (0.12) and slalom (0.13) were low. Its
      max_error of 0.061 to 0.065 sat just over the 0.06 limit, and line losses were
      down to 1 per run on the s-bend and slalom. The planned response to oscillation
      above about 0.2 is to raise kd before cutting kp, and cutting kp now would weaken
      the edge response that is holding max_error near 0.06. Nothing here states how
      this candidate will perform. After the race, use the telemetry as follows. If
      oval steering_oscillation falls below about 0.2 while max_error stays near 0.06
      or lower, keep kd 0.5 and test a wider array (x = ±0.040 m, 16 mm sensors) with
      kp near 8. If oscillation stays above 0.2 with kd 0.5, try kd 0.6 before reducing
      kp. If max_error is still at or above 0.06 with oscillation low, widen the array
      as above. If line_loss_events stay at 1 per run at the same bend entries, test
      line_loss search_left or search_right, choosing the side the failing bends favour.
      If progress is still below 1 with max_error under 0.06, raise base_speed toward
      1.6. Approve now: this is the best-supported next step, it is a small change
      from the best raced design, and a race is the only way to learn more with 7
      iterations left.


      ### Requested changes


      - After the race: if oval steering_oscillation falls below about 0.2 and max_error
      stays at or below 0.06, widen geometry.sensor_positions to x = ±0.040 m and
      test controller.kp near 8.0 with kd 0.5, because iteration 3 showed low oscillation
      on the s-bend and slalom and max_error only just over the limit.

      - After the race: if steering_oscillation stays above 0.2 with kd 0.5, raise
      controller.kd to 0.6 before lowering kp, because iteration 3 showed oscillation
      of 0.25 on the oval at kd 0.4 and cutting kp would weaken the edge response
      that holds max_error near 0.06.

      - After the race: if line_loss_events stay at 1 per run at the same bend entries,
      change controller.line_loss from last_direction to search_left or search_right,
      favouring the side the failing bends turn towards, since iteration 3 still shows
      one line loss per run on the s-bend and slalom; if progress is still below 1
      with max_error under 0.06, raise controller.base_speed toward 1.6.


      - [Open this output](iteration-4/entityR1/versions/a06e3c9165d747cba1503b32560f4a7a/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/0e06c019830145a19f903f7076003d68/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-0f4db0584201cd60/payload.json)'
