  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence: all 60 trials ran off track on every development track. Progress was
      0.12 on the oval, 0.055 on the s-bend and 0.045 on the slalom, with about 2
      line-loss events per run. The off-track limit here is 0.06 m, and max_error
      sits at about 0.06, so the robot leaves the tape at its first major disturbance.
      rms_error (0.023 to 0.028) and steering_oscillation (about 0.14) are both low,
      so the controller is not jittering. The failure is therefore not oscillation.
      It is the line being lost and the robot then running wide, most likely during
      fast entry into bends. Changes: (1) base_speed 1.8 to 1.4. Less speed means
      less slip and centrifugal drift in bends, and it gives the steering time to
      recover from a line loss. (2) kd 0.1 to 0.3. Extra damping on the change in
      signal should reduce overshoot as the sensors swing across the edge of the tape.
      (3) ki 0.1 to 0.05. The integral term is not needed to correct a 2 percent motor
      mismatch and could wind up during line loss. (4) kp kept at 4.0 for now, so
      this change isolates the speed and damping effects. Geometry is unchanged so
      the result can be attributed to the controller. Expected result: fewer line-loss
      events and longer progress on all three tracks. The main risk is that 1.4 is
      too slow to finish in 3.0 s. Next measurements: progress and max_error per track,
      line_loss_events, and completion_time. If the robot now stays on track but progress
      stalls below 1, raise base_speed toward 2.0. If it still leaves the track in
      bends with low oscillation, raise kp to about 5.0. If line losses persist at
      bend entries, test search_right or search_left.


      - [Open this output](iteration-1/entity0/versions/8f50d56e17f84b0499683ebb086de945/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-19d75c49fb3a5fc5/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-704ae0edfc3461a7/payload.json)'
  - id: entityR1
    label: Approve slower, damped
    notes: 'Approved the candidate that cuts base_speed to 1.4, raises kd to 0.3 and
      lowers ki to 0.05, because iteration 0 ran off track at every trial with low
      rms_error and low oscillation, pointing to line loss at speed. Early exploration
      with 10 iterations left means the race is needed to learn the speed trade-off.


      ### Feedback


      Iteration 0 raced at base_speed 1.8, kp 4.0, kd 0.1, ki 0.1 and ran off track
      on every trial. Progress was 0.12 on the oval, 0.055 on the s-bend and 0.045
      on the slalom, with about 2 line-loss events per run. rms_error (0.023 to 0.028)
      and steering_oscillation (about 0.14) were low, so the failure was not jitter.
      max_error sat at about 0.06, which is the off-track limit. The off-track limit
      is max(0.06, 0.0125 + body_width/4), and body_width cannot push it past 0.06
      within the allowed range, so the limit cannot be relaxed through geometry. The
      current candidate changes only the controller: base_speed 1.8 to 1.4, kd 0.1
      to 0.3 and ki 0.1 to 0.05, with kp 4.0 and geometry unchanged. Its rationale
      is consistent with the evidence. Lower speed should reduce slip and drift in
      bends, and more damping should reduce overshoot as the sensors cross the tape
      edge. Its main risk is that 1.4 is too slow to finish in 3.0 s, since finishing
      needs roughly 1.5 m/s average. This is an early exploration iteration with 10
      iterations left, and the race is the only way to learn how the robot behaves
      at this speed. Approve it so it races. Once the telemetry is back, use it as
      follows. If the robot now stays on the line but progress stalls below 1, raise
      base_speed toward 1.6 to 2.0 while keeping kd at 0.3, since slower speed alone
      is not the goal. If it still leaves the track at bend entries with low oscillation,
      raise kp to about 5.0. If line losses persist at bend entries, test line_loss
      search_right or search_left, and only after the speed and gain changes have
      been tried.


      ### Requested changes


      - After the race: if progress stalls below 1 while max_error stays under 0.06,
      raise controller.base_speed toward 1.6 to 2.0 and keep kd at 0.3, because iteration
      0 shows speed at 1.8 was lost in bends, not that speed itself is wrong.

      - After the race: if the robot still goes off track at bend entries with steering_oscillation
      low (about 0.14 or less), raise controller.kp from 4.0 to about 5.0, since iteration
      0 showed low rms_error and no jitter, which points to a weak steering response
      rather than an oscillating one.

      - After the race: if line_loss_events stays at 2 or more per run at the same
      bend entries, change controller.line_loss from last_direction to search_right
      or search_left, and keep the speed and gain changes.


      - [Open this output](iteration-1/entityR1/versions/8e8bb836ef2e46239bf2981c0af80363/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/8f50d56e17f84b0499683ebb086de945/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-704ae0edfc3461a7/payload.json)'
