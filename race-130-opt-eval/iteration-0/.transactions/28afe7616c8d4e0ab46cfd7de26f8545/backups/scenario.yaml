  entities:
  - id: entity0
    label: Baseline 5-sensor
    notes: 'First candidate: five sensors 40 mm ahead of the axle with linear weights,
      base_speed 1.8, kp 4, light ki/kd, and last-direction line recovery. No race
      data yet, so values come from the contract''s speed and stability requirements;
      the requested measurements will show whether it oscillates, runs wide, or is
      too slow.


      ### Rationale


      Iteration 0 has no race data or Evaluator feedback yet, so this is a conservative
      baseline built from the contract. Geometry: five line sensors spaced 8 mm apart
      across x = -16..+16 mm, placed 40 mm ahead of the axle so the robot sees the
      line before it reaches the wheels. The 12 mm footprint covers the 25 mm tape
      with overlap, so at least one sensor reads strongly at all times. Sensor weights
      are linear in lateral position (-1, -0.5, 0, 0.5, 1) so the signal is a smooth,
      proportional estimate of the line offset. Controller: base_speed 1.8 (near full
      PWM, to meet the roughly 1.5 m/s average needed to finish in under 3 s); kp
      4 gives a full-scale steering correction of about 1400 PWM counts at signal
      1, which is strong enough to track the bends without saturating; ki 0.1 removes
      slow bias from the motor mismatch; kd 0.1 damps oscillation. line_loss ''last_direction''
      keeps the robot turning toward the side it last saw the tape. Wheel radius 0.035
      m and track 0.12 m are mid-range for speed and turning stability. Expected result:
      finishes the oval and s-bend with a low rms error. If the robot oscillates,
      reduce kp or raise kd. If it runs wide on sharp bends or slalom, raise kp. If
      it is too slow to finish, raise base_speed or wheel_radius. The measurements
      requested below will show which of these holds.


      - [Open this output](iteration-0/entity0/versions/ea3aa9563ff34326bd3558119dbebb25/payload.json)'
  actions:
  - id: action0
