map:
  id: race-130-opt-eval
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: kd 0.5, kp 6.5 damping
    notes: 'Keeps the best raced geometry and kp 6.5 and lowers kd from 0.6 to 0.5,
      as the Evaluator''s plan prescribes when oscillation stays above 0.2. Iteration
      6 showed oval oscillation at 0.270 with max_error 0.064, so extra damping is
      not reducing jitter.


      ### Rationale


      Evidence from iteration 6 (kp 6.5, kd 0.6, 16 mm sensors at x = ±0.030 m, base_speed
      1.4, ki 0.05, last_direction) is the best raced result so far at 122.66, but
      all 60 trials still ran off track. Oval steering_oscillation rose to 0.270 from
      0.250 at kp 7.0, so lowering kp did not reduce it. Across this series, oscillation
      has stayed between 0.25 and 0.27 whatever the kp/kd combination, which suggests
      the jitter is not set mainly by kp. Oval max_error is 0.064, still above the
      0.06 limit. Line losses are 1.3 on the oval, 1.6 on the s-bend and 1.0 on the
      slalom. Progress is 0.53, 0.28 and 0.08. The off-track limit cannot be relaxed
      through body_width, so control has to fix it.


      Change: kd 0.6 to 0.5, with kp held at 6.5 and geometry, base_speed 1.4, ki
      0.05 and last_direction unchanged. This is the step the Evaluator''s plan prescribes
      when oscillation stays above 0.2 at kp 6.5: reduce kd toward 0.5 rather than
      add more damping. kd has not been reducing oscillation, so less derivative action
      may cut noise amplification on the sensor edges. Expected result: oval steering_oscillation
      falls toward 0.2 or below, and max_error stays near 0.063 or lower. The main
      risk is that less damping lets the robot overshoot at bend entries, which could
      raise max_error or line losses on the s-bend.


      Hypotheses: (1) derivative action is amplifying sensor noise and edge transients,
      so reducing kd lowers oscillation. (2) Line losses at s-bend entries are the
      main limit on progress. If line losses persist at the same entries after this
      change, the next lever is line_loss search_left or search_right. Measurements
      wanted: steering_oscillation, max_error and line_loss_events per track, plus
      progress, rms_error and control_effort.


      - [Open this output](iteration-7/entity0/versions/e47d96db0465459f99f4e2c231e4a0f2/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-a226d36dbdf38a0c/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-df13ceffe9fb05d1/payload.json)'
  - id: entityR1
    label: Approve kd 0.5 test
    notes: 'Approved the single-variable step kd 0.6 to 0.5 at kp 6.5, the best-raced
      base. Oscillation stayed at 0.25 to 0.27 across kd 0.4 to 0.6 (iterations 3
      to 6), so the next race tests whether less damping helps, and the feedback gives
      follow-ups for widening the sensors or changing line_loss.


      ### Feedback


      The candidate changes one variable from the best raced design, iteration 6 (kp
      6.5, kd 0.6, 16 mm sensors at x = ±0.030 m, base_speed 1.4, ki 0.05, last_direction,
      score 122.66). kd goes from 0.6 to 0.5, and kp, geometry, base_speed, ki and
      line_loss stay the same. The rationale matches the evidence. Oval steering_oscillation
      has stayed between 0.250 and 0.270 across kd 0.4, 0.5 and 0.6 (iterations 3
      to 6), so more kd has not reduced it, and the s-bend value rose with kd (0.238
      at kd 0.6 in iteration 5). Oval max_error has stayed at 0.063 to 0.064, just
      over the 0.06 off-track limit, and body_width cannot relax that limit, so control
      must fix it. Line losses are still 1.3 on the oval, 1.6 on the s-bend and 1.0
      on the slalom (iteration 6). Nothing here states how this candidate will perform.
      It is a low-risk, single-variable step, and with 4 iterations left after this
      one a raced result is more useful than another desk review, so approve it to
      race.


      After the race, use the telemetry as follows. If oval steering_oscillation falls
      to about 0.2 or below while max_error stays at or below 0.063, keep kd 0.5 and
      test a wider array (x = ±0.040 m, 16 mm sensors) with kp near 8. If oscillation
      is still above 0.2 at kd 0.5 and kp 6.5, return kd to 0.6 and reduce kp toward
      6.0 rather than adding damping. If max_error stays at or above 0.06 with oscillation
      low, widen the array as above. If line_loss_events stay at 1 or more at the
      same s-bend entries, test line_loss search_left or search_right, choosing the
      side the failing bends turn towards. Raise base_speed toward 1.6 only if progress
      is still below 1 with max_error under 0.06.


      ### Requested changes


      - After the race: if oval steering_oscillation falls to about 0.2 or below with
      max_error at or below 0.063, widen geometry.sensor_positions to x = ±0.040 m
      with 16 mm sensors and test controller.kp near 8.0 with kd 0.5, because iteration
      6 showed the edge response holds max_error near the limit.

      - After the race: if steering_oscillation stays above 0.2 at kd 0.5, restore
      controller.kd to 0.6 and reduce controller.kp toward 6.0, because oscillation
      was 0.250 to 0.267 across kd 0.4 to 0.6 and more damping has not helped.

      - After the race: if line_loss_events stay at 1 or more at the same s-bend entries
      (iteration 6: 1.6 s-bend, 1.3 oval), change controller.line_loss from last_direction
      to search_left or search_right, favouring the side the failing bends turn towards.


      - [Open this output](iteration-7/entityR1/versions/3a99f8a89cd444029783b2a92ed31c68/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/e47d96db0465459f99f4e2c231e4a0f2/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-df13ceffe9fb05d1/payload.json)'
