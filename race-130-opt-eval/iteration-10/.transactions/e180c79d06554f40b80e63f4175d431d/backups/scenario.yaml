map:
  id: race-130-opt-eval
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Iter 8 geometry, speed
    notes: 'Returns to the best raced geometry (±0.030 m, 16 mm, kp 6.0, kd 0.6) after
      the wider ±0.040 m array scored 75.8, and lowers base_speed to 1.2 to reduce
      bend drift. Rests on iteration 0 to 1, where lower speed raised progress, and
      iteration 8, the best score at 123.04.


      ### Rationale


      Evidence. Iteration 8 (sensors at x = ±0.030 m, 16 mm footprints, kp 6.0, kd
      0.6, base_speed 1.4, ki 0.05, last_direction) is the best raced design at 123.04.
      Iteration 9 widened the sensors to ±0.040 m and raised kp to 8.0. It scored
      75.78, so that change did not help. Its oval steering_oscillation fell to 0.203,
      which is the one clear gain, but oval progress dropped to 0.30 (from 0.57) and
      the s-bend progress to 0.17 (from 0.24). Oval max_error stayed at 0.0629, still
      above the 0.06 limit. So the wider reach did not give the earlier edge warning
      I expected, and the higher effective gain cost progress. Every trial on every
      track still goes off track, so score is driven mainly by progress before the
      first large offset. Across the series, oval max_error has stayed at 0.061 to
      0.065 whatever the gain, sensor reach or kd. Iteration 0 to 1 also showed that
      lowering speed from 1.8 to 1.4 raised progress on all three tracks (oval 0.12
      to 0.21, s-bend 0.055 to 0.098). Body width cannot relax the 0.06 m off-track
      limit, so the controller must hold the line at the first large offset.


      Change. I return the geometry to the iteration 8 layout (±0.030 m, 16 mm, kp
      6.0, kd 0.6), since that is the best-supported configuration. The one new variable
      is base_speed, which I lower from 1.4 to 1.2. Lower speed reduces slip and centrifugal
      drift in bends, and the earlier speed test showed progress rising as speed fell.
      ki, kd, kp, sensor weights and last_direction stay unchanged, so the result
      isolates speed.


      Expected result. Oval max_error falls to about 0.06 or below, because less drift
      is needed at bend entries. Progress on the oval and s-bend rises above the iteration
      8 values (0.57 and 0.24). Steering_oscillation stays near 0.27 to 0.29. Risk:
      1.2 may be too slow to finish, but finishing is not reachable in this design
      anyway, and a full finish is far off, so progress is the target.


      Hypotheses. (1) Off-track at bend entries is caused by speed-related drift,
      not by sensing reach or gain. (2) Line losses (1.4 oval, 1.3 s-bend) recur at
      the same entries and may need a search direction later.


      Next steps after the race. If max_error falls below 0.06 and progress rises,
      keep 1.2 and consider a small kp change. If progress falls, return to base_speed
      1.4 and test line_loss search_left or search_right, favouring the side the failing
      bends turn towards. If line losses stay at 1 or more at the same entries, that
      is the next lever.


      Measurements wanted: steering_oscillation, max_error, line_loss_events, progress
      and completion_time per track, plus rms_error and control_effort.


      - [Open this output](iteration-10/entity0/versions/9b593217d29f4360896c27efb8aa143f/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-4cc92650694e7c13/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-a803444857322d35/payload.json)'
  - id: entityR1
    label: 'Approve: speed 1.2 test'
    notes: 'Approved the iteration 8 design with base_speed lowered from 1.4 to 1.2,
      the one variable most supported by the earlier speed test (iterations 0 to 1,
      progress up as speed fell). Feedback points the next step at progress, max_error
      and line-loss results, and does not state how this candidate will perform.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      candidate is the iteration 8 design (sensors at x = ±0.030 m, 16 mm footprints,
      kp 6.0, kd 0.6, ki 0.05, last_direction, score 123.04) with one change: base_speed
      1.4 to 1.2. The single-variable isolation is sound. Iteration 0 to 1 showed
      that lowering speed from 1.8 to 1.4 raised progress on all three tracks (oval
      0.12 to 0.21, s-bend 0.055 to 0.098), so the speed-to-progress direction has
      evidence behind it. Iteration 9 showed that widening the sensors to ±0.040 m
      and raising kp to 8.0 did not help (75.78, oval progress 0.30), so the candidate
      correctly returns to the iteration 8 geometry and gain instead of extending
      that line. Oval max_error has stayed at 0.061 to 0.065 across kp 6.0 to 8.0
      and sensor reach ±0.030 to ±0.040 m (iterations 2 to 9), so body width and gain
      alone are not closing the 0.06 m off-track gap. The candidate''s expected max_error
      improvement is a hypothesis to test, not a finding. Approve so it races: this
      is a clean, low-risk test from the best design, and with one iteration left
      after this one the race is the only source of new evidence.


      After the race, use the telemetry as follows. If oval and s-bend progress both
      rise above the iteration 8 values (0.57 and 0.24) and max_error falls, keep
      base_speed 1.2 as the base for the final iteration. If progress falls on either
      track, return base_speed to 1.4 and keep the iteration 8 gains. If line_loss_events
      stay at 1 or more at the same bend entries, the next lever is line_loss search_left
      or search_right, favouring the side the failing bends turn towards, tested only
      after the speed result is known.


      ### Requested changes


      - After the race: if oval and s-bend progress both rise above 0.57 and 0.24
      (iteration 8), keep controller.base_speed at 1.2 and carry it forward as the
      base for the final iteration, because iteration 0 to 1 showed slower speed improved
      progress.

      - After the race: if progress falls on any track, return controller.base_speed
      to 1.4 with kp 6.0 and kd 0.6 (iteration 8), because iteration 9 showed that
      sensing reach and gain changes did not improve progress and iteration 8 is the
      best-supported configuration.

      - After the race: if line_loss_events stay at 1 or more at the same bend entries
      (iteration 8: 1.4 oval, 1.3 s-bend), change controller.line_loss from last_direction
      to search_left or search_right, favouring the side the failing bends turn towards,
      and keep the speed that gave the better progress.


      - [Open this output](iteration-10/entityR1/versions/2473b539a76f4ddcae252767aab293d9/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/9b593217d29f4360896c27efb8aa143f/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-a803444857322d35/payload.json)'
