  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: 'Final: best raced design'
    notes: 'Resubmits the iteration 10 design (base_speed 1.2, kp 6.0, kd 0.6, sensors
      ±0.03 m), the best raced score at 125.48, because no iteration remains to act
      on new evidence. Speed drop raised s-bend progress and total score, while the
      sensor and gain changes of iteration 9 were dropped for lowering progress.


      ### Rationale


      Final iteration, so this candidate should be the best-supported design, not
      a new experiment. Iteration 10 (sensors at x = ±0.030 m, 16 mm footprints, kp
      6.0, kd 0.6, ki 0.05, base_speed 1.2, last_direction) is the best raced design
      at 125.48. Lowering speed from 1.4 to 1.2 raised the total score and the s-bend
      progress (0.24 to 0.34), and it lowered the oval steering_oscillation risk.
      Oval progress fell (0.57 to 0.51), so the speed gain is mixed, but the overall
      score rose. Iteration 9 showed that widening the sensors to ±0.040 m and raising
      kp to 8.0 cut progress on both tracks, so I am not carrying that change forward.
      Oval max_error has stayed at 0.061 to 0.065 across every gain, reach and kd
      tried, and body_width cannot relax the 0.06 m off-track limit. The untested
      levers are line_loss search direction and base_speed between 1.2 and 1.4. Both
      carry a risk of destabilising a design whose score is already the best measured,
      and with no iteration left after this one, the race result is the only chance
      to score. I therefore submit the iteration 10 design unchanged, so that the
      race scores the best measured configuration. Hypotheses to check in the telemetry:
      (1) speed drives progress on s-bends but costs progress on the oval, so the
      best base_speed may lie between 1.2 and 1.4; (2) line losses at bend entries
      (1.3 to 1.7 per run) are the next limit on progress; (3) max_error near 0.064
      is set by edge response at the first large offset, not by gain.


      - [Open this output](iteration-11/entity0/versions/73fdce252fba48ae86b73be91938f0cd/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-cab0602fd6fb2c3c/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-de67995d96a20094/payload.json)'
  - id: entityR1
    label: Approve iter 10 unchanged
    notes: 'Approves the best measured design (iteration 10, score 125.48) unchanged
      so a candidate is delivered for the final race. The decision rests on iteration
      10 scoring highest, iteration 9 showing the wider sensors and higher kp cut
      progress, and no iterations left to learn from.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      candidate is the iteration 10 design (sensors at x = ±0.030 m with 16 mm footprints,
      kp 6.0, kd 0.6, ki 0.05, base_speed 1.2, last_direction), the best raced configuration
      so far at 125.48. Its geometry and controller match iteration 10 field for field,
      so it is valid and well supported by the evidence. Iteration 10 showed that
      lowering base_speed from 1.4 to 1.2 raised the total score and s-bend progress
      (0.24 to 0.34), while oval progress fell (0.57 to 0.51). Iteration 9 showed
      that widening the sensors to ±0.040 m and raising kp to 8.0 cut progress on
      both tracks, so that change is not carried forward. Oval max_error has stayed
      at 0.061 to 0.065 across gains, kd values and sensor reach, so the 0.06 m off-track
      limit has not been cleared by any tested lever. This is the final iteration,
      with no later iteration to learn from. Revising now would risk a design that
      has not been measured, and a delivered design is required to avoid a zero. The
      best-supported option is to race this design unchanged. Telemetry from the race
      will still be recorded for the team.


      ### Requested changes


      - No further change for this final race: race the iteration 10 design unchanged
      (base_speed 1.2, kp 6.0, kd 0.6, ki 0.05, sensors at x = ±0.030 m, 16 mm, last_direction),
      because it is the best measured design and the final race needs a delivered
      candidate.

      - For the record, if the team later reviews these results: test base_speed between
      1.2 and 1.4 and line_loss search_left or search_right, since iteration 10 showed
      speed trades oval progress against s-bend progress, and line losses at bend
      entries (1.0 to 1.7 per run) remain the next limit.


      - [Open this output](iteration-11/entityR1/versions/f3dc6ba4237549458f84416f5c21bd6c/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/73fdce252fba48ae86b73be91938f0cd/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-de67995d96a20094/payload.json)'
