map:
  id: race-189-opt-eval-muted
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Stiffer steer, narrow
    notes: 'Keeps the best design (iteration 7, score 125.3) and raises kp from 3.0
      to 3.5 to hold the line at bends, and narrows wheel_track to 0.11 m for quicker
      yaw response. Both changes target the max_error of about 0.06 m and the 1.5
      line-loss events per run seen on oval.


      ### Rationale


      Evidence: all 240 development trials so far ended off_track with no finishes.
      The best design is iteration 7 (score 125.3): oval progress 0.61, s-bend 0.23,
      slalom 0.08. Max_error sits at 0.060 to 0.066 on nearly every design, and each
      run logs 1 to 2 line-loss events. So the robot loses the tape during a bend,
      drifts past the 0.06 m limit, and the last_direction search cannot recover.
      Body width cannot widen that limit (it is max(0.06, 0.0125 + body_width/4),
      which is at most 0.06 in range), so the error must be held inside the band.
      Steering oscillation is moderate (0.12 to 0.28), so the problem is slow correction
      at bends, not jitter.


      What has helped: the 12 mm footprint with tuned gains (iteration 7, +9.5), ki
      0.4 to cancel the drift bias (iteration 3 onward), and kd around 0.3 to 0.35.
      Raising kd to 0.45 added jitter (iteration 6), and widening the span alone did
      not help (iteration 5). Iteration 7''s own rationale proposed raising kp next
      if max_error still reaches 0.06 with no line loss, and line loss is still 1.5
      per run on oval.


      Changes, relative to iteration 7: (1) kp 3.0 to 3.5, a firmer correction at
      bends, following the stated next step. (2) wheel_track 0.12 to 0.11 m. Turn
      rate is wheel speed difference divided by track, so a narrower track gives more
      yaw per unit of PWM difference and a more agile response at bends. This is a
      second change, so it is a deliberate bet to be checked against the race data.
      (3) Sensors, sensor_size 0.012, weights, ki 0.4, kd 0.35, mass 0.6, base_speed
      1.3 and line_loss last_direction are kept to hold the tuned base.


      Expected result: line_loss_events at 1 or fewer on oval and s-bend, max_error
      below 0.06 on oval, and progress at or above 0.6 on oval. Hypotheses: H1, extra
      proportional gain stops the drift that loses the line at bends. H2, the narrower
      track gives faster yaw response and reduces the overshoot. Measurements needed:
      max_error and line_loss_events per track to see where the line is lost, steering_oscillation
      to check that kp 3.5 does not add jitter, and progress and completion_time on
      s-bend and slalom. If the robot holds the line but is slow, raise base_speed
      toward 1.5. If jitter rises, lower kp or raise kd slightly.


      - [Open this output](iteration-8/entity0/versions/0bfdb5ec83cf42d998677547f2b1aeb3/payload.json)

      - Based on: [entityR2A](iteration-8/entityR2A/versions/carried-2442c40a25343cd6/payload.json)'
  - id: entityR1
    label: Approve 12mm footprint
    notes: 'Approved the 12 mm footprint candidate with kd 0.35 and mass 0.6 as a
      clean test of sensing span against the best raced gains (iteration 6, 115.8).
      All 180 earlier trials ended off_track, and the footprint has not been tested
      with those gains, so telemetry from this race is more useful than another revision.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      candidate is valid: five sensors at x = -0.02 to +0.02 (10 mm spacing) and y
      = 0.03 are inside range, sensor_size 0.012 is an allowed option, the weights
      are antisymmetric in [-2, 2], and kp, ki, kd, base_speed, mass and line_loss
      are in range. Nothing is obviously broken.


      Iteration 6 (best raced, 115.8) kept 8 mm footprints, kp 3.0, ki 0.4, kd 0.45
      and base 1.2. Every design so far (iterations 0 to 6) ended off_track on all
      180 trials, with max_error at 0.061 to 0.068 and 1 to 2 line-loss events per
      run. The footprint has never been tested with the iteration 6 gains. Iteration
      0 used 12 mm, but its 12 mm spacing and other gains confound that result (score
      26.0), so the footprint effect is still open.


      The candidate changes several things at once: footprint 8 to 12 mm, kd 0.45
      to 0.35, mass 0.7 to 0.6, base_speed 1.2 to 1.3. The race will not isolate each
      effect. I am approving because this is iteration 7 of 12, the change is a clean
      test of sensing span and footprint against the best gains, and telemetry from
      it is worth more than a revision made without it. The next critique should follow
      the race. If line_loss_events fall to 1 or fewer and max_error drops below 0.06
      on oval and s-bend, keep the 12 mm footprint and move base_speed toward 1.5
      if progress is below about 0.5. If max_error still reaches 0.06 with line loss,
      the footprint is not the limit: raise kp (3.0 to 3.5) before adding kd, as iterations
      4 to 6 suggest. If steering_oscillation exceeds about 0.28 (the iteration 6
      level) with kd 0.35, the jitter is coming from the wider signal, so lower kp
      slightly before raising kd. If the result is worse than iteration 6 while line
      loss is lower, the lower centre gain from the sharper footprint is the likely
      cause, so restore kp toward 3.5.


      ### Requested changes


      - If line_loss_events are 1 or fewer but max_error stays at or above 0.06, raise
      kp from 3.0 toward 3.5 with the 12 mm footprint and kd 0.35 held, because iterations
      0 to 6 show the robot loses the tape at bends rather than oscillating (steering_oscillation
      about 0.1 to 0.28).

      - If the robot holds the line but oval progress stays below about 0.5 (iteration
      6 reached 0.49), raise base_speed from 1.3 toward 1.5, since iteration 1 at
      base 1.5 showed the course needs roughly 1.5 m/s to finish and iteration 6 at
      base 1.2 lost progress.

      - If steering_oscillation rises above about 0.28 with kd 0.35 while max_error
      is still near 0.06, lower kp slightly before raising kd, because iteration 1
      showed kd raising jitter and iteration 6 reached 0.28 at kd 0.45.


      - [Open this output](iteration-7/entityR1/versions/5866720eb481436a80cdcbb2159695b4/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/018b66dc29b240bc9e4af3576d866cee/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-de5828cc3d52549d/payload.json)'
