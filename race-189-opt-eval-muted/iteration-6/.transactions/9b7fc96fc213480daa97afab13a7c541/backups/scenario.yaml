map:
  id: race-189-opt-eval-muted
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Iter 4 + tighter kd, 0.01
    notes: 'Keeps iteration 4''s five 8 mm sensors and kp/ki but narrows the sensor
      spacing to 0.01 m (span ±0.02), raises kd to 0.45 and lowers base speed to 1.2.
      Targets the off-track max_error (0.061 to 0.064) that every trial hit, using
      the iteration 4 result (91.4, best) and iteration 5''s wider-span result as
      evidence.


      ### Rationale


      Evidence: all 180 development trials across iterations 0 to 5 ended off_track
      with no finishes. The off-track limit is max(0.06, 0.0125 + body_width/4). Even
      at body_width 0.18 that is 0.0575, so body width cannot widen the limit past
      0.06 m. Max_error sits at 0.061 to 0.064 on almost every design, so the robot
      strays just past the limit and is lost. Iteration 4 (five 8 mm sensors at x
      = -0.016 to +0.016, y = 0.03, kp 3.0, kd 0.3, ki 0.4, base 1.3) is the best
      so far: oval progress 0.44, score 91.4. Iteration 5 widened the span to seven
      sensors and scored slightly lower (oval progress 0.39, slalom worse), so the
      wider span alone did not help. Steering oscillation stays low (0.11 to 0.23),
      so the failure looks like slow correction plus drift at bends, not jitter. Iteration
      3 showed that lower speed and higher ki reduce drift a little.


      Changes, relative to iteration 4: (1) Sensors: five 8 mm sensors at y = 0.03,
      spaced 0.01 m (x = -0.02 to +0.02). This is a compromise between iteration 4
      (span ±0.016) and iteration 5 (span ±0.024). It reaches about 0.032 m off-centre
      before the outer sensor loses the tape, and the outer edge is seen from about
      0.033 m. The aim is to keep the earlier warning of the wider span while keeping
      the finer resolution of the narrower set. (2) kd 0.3 to 0.45: more damping at
      bend entry, where overshoot is the most likely cause of the 0.06 m excursion.
      (3) base_speed 1.3 to 1.2: less centrifugal drift on bends, a small progress
      cost. Weights [-2, -1, 0, 1, 2] are kept so the sensor change is the main structural
      variable. kp 3.0 and ki 0.4 are kept.


      Expected result: max_error below 0.06 on oval and s-bend, line_loss_events at
      1 or fewer per run, and progress at or above iteration 4 on oval. Hypotheses:
      H1, the outer sensor at ±0.02 gives enough warning to hold the line through
      bends. H2, extra kd cuts the overshoot that pushes max_error past 0.06. H3,
      slightly lower speed trades a little progress for fewer off-track ends. Measurements
      needed next: max_error and line_loss_events per track, progress on s-bend and
      slalom, and steering_oscillation to check that kd 0.45 does not add jitter.
      If the robot holds the line but is slow, raise base_speed. If max_error still
      reaches 0.06 with no line loss, raise kp before adding more kd.


      - [Open this output](iteration-6/entity0/versions/675cb517a6c345acbe5e09e16cb2502c/payload.json)

      - Based on: [entityR2A](iteration-6/entityR2A/versions/carried-de3457603b3ed5fe/payload.json)'
  - id: entityR1
    label: 'Approve: ±0.02 span test'
    notes: 'Approved the intermediate-span candidate (five 8 mm sensors at ±0.02,
      kd 0.45, base 1.2) as a clean-enough test against iteration 4 (91.4) and iteration
      5 (89.5), which all failed off_track. Feedback flags the confound of lower effective
      gain (about 100 vs 125 per metre) and kd 0.45, with next steps depending on
      the race.


      ### Feedback


      Written before this candidate races, so no outcome is stated for it. The candidate
      is valid: five 8 mm sensors at x = -0.02, -0.01, 0, 0.01, 0.02 and y = 0.03
      are inside the allowed ranges, the weights are antisymmetric in [-2, 2], and
      kp, ki, kd, base_speed and line_loss are in range. Nothing is obviously broken.


      The change is relative to iteration 4 (best raced, 91.4). Iteration 5 (seven
      sensors to ±0.024, same kp, ki and kd as iteration 4) scored 89.5. Iterations
      0 to 5 all ended off_track on every trial, with max_error at 0.061 to 0.064
      and 1 to 2 line-loss events per run. Span has been tested at ±0.016 and ±0.024,
      but not at ±0.02, so this is a fair intermediate step.


      Three changes are confounded in one race. (1) The span widens to ±0.02. (2)
      The weights ±2 over ±0.02 give about 100 per metre, against about 125 per metre
      in iteration 4, so the effective steering gain is about 20 percent lower, as
      it was in iteration 5. (3) kd rises from 0.3 to 0.45 at kp 3.0. The rationale
      does not mention the lower gain. Iteration 1 showed kd 0.2 at kp 2.0 raising
      steering_oscillation (0.10 to 0.20), so the kd rise needs watching. Base_speed
      1.2 also works against progress: iteration 4 at 1.3 reached 0.44 on oval, and
      the course needs about 1.5 m/s to finish.


      I am approving rather than revising. The design is valid and close to the best
      raced design, all candidates so far have failed in the same way, and telemetry
      from this race will separate the span effect from the kd effect better than
      another review on numbers alone. Next step depends on the race. If line_loss_events
      fall but max_error stays at or above 0.06, raise kp before adding kd, as iteration
      4 suggested. If steering_oscillation rises well above 0.25 with kd 0.45, bring
      kd back to 0.3. If progress on oval falls below iteration 4''s 0.44 while the
      line is held, restore base_speed to 1.3 or 1.5.


      ### Requested changes


      - If line_loss_events are 1 or fewer but max_error stays at or above 0.06, raise
      kp from 3.0 toward 3.5 with the sensors and kd held, because iterations 0 to
      5 show line loss at bends rather than oscillation (steering_oscillation about
      0.1 to 0.2).

      - If steering_oscillation rises clearly above about 0.25 with kd 0.45, lower
      kd to 0.3, since iteration 1 showed kd 0.2 raising jitter and the wider signal
      may amplify it.

      - If the robot holds the line but oval progress stays below iteration 4''s 0.44,
      restore base_speed to 1.3 or 1.5, because the lower speed of 1.2 costs progress
      and the course needs about 1.5 m/s.


      - [Open this output](iteration-6/entityR1/versions/ffb04f67d4674c1c8997faa6b7fcc3f9/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/675cb517a6c345acbe5e09e16cb2502c/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-de3457603b3ed5fe/payload.json)'
