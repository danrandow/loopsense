overrides:
  entities:
  - id: entity0
    label: Wider 16mm sensor
    notes: 'Reverts the iteration 8 kp and track changes, which lowered the score,
      and keeps the iteration 7 controller. It changes only the sensor footprint from
      12 mm to 16 mm, because the 12 mm change was the last variable that improved
      the score.


      ### Rationale


      Evidence: all 300 development trials so far ended off_track with no finishes.
      The best design is iteration 7 (score 125.3): 12 mm footprints, five sensors
      at x = -0.02 to +0.02 (10 mm spacing), y = 0.03, kp 3.0, ki 0.4, kd 0.35, base
      1.3, mass 0.6, wheel_track 0.12. Iteration 8 changed two things at once (kp
      3.5 and wheel_track 0.11) and scored lower (108.4). Its s-bend progress fell
      from 0.23 to 0.12 and line-loss events rose to 2, so I revert both changes and
      keep the iteration 7 controller. Max_error still reaches about 0.06 to 0.066
      with 1 to 2 line-loss events per run, so the robot loses the tape at bends before
      the search can recover. The 12 mm footprint improved results (iteration 7 versus
      6, +9.5), which suggests that the detectable tape edge matters. Changing one
      variable at a time, I widen the footprint to 16 mm (the largest allowed) with
      everything else as in iteration 7. A larger footprint should see the tape edge
      from further off-centre, so the line is held longer and the search starts from
      a better position. Expected result: line_loss_events at 1 or fewer on oval and
      s-bend, max_error below 0.06 on oval, and progress at or above 0.6 on oval.
      Hypotheses: H1, the 16 mm footprint extends the detection window at the cost
      of some edge resolution. H2, kp 3.0 with kd 0.35 is adequate once the sensing
      is improved. Measurements needed next: line_loss_events and max_error per track,
      to see whether the loss moves or disappears; steering_oscillation, to check
      for jitter from the coarser signal; and progress and completion_time on s-bend
      and slalom. If the 16 mm footprint reduces progress or raises oscillation, return
      to 12 mm and test base_speed 1.4 instead.


      - [Open this output](iteration-9/entity0/versions/f1006dd85c0f47af83675dd203a0832c/payload.json)

      - Based on: [entityR2A](iteration-9/entityR2A/versions/carried-d0d761422e087caa/payload.json)'
  - id: entityR1
    label: Approve kp 3.5, narrow
    notes: 'Approved the iteration 8 candidate (kp 3.0 to 3.5, wheel_track 0.12 to
      0.11 m) because it follows iteration 7''s stated next step and is at least as
      plausible as the best raced design (125.3). Written without race data; the two
      changes are confounded and the feedback names how to separate them after the
      race.


      ### Feedback


      Written before this candidate races, so no outcome is stated for it. The candidate
      is valid. Sensors are five 12 mm footprints at x = -0.02 to +0.02 and y = 0.03,
      weights are antisymmetric in [-2, 2], and kp 3.5, ki 0.4, kd 0.35, base_speed
      1.3, mass 0.6, and line_loss last_direction are all in range. Nothing is obviously
      broken.


      The change is relative to iteration 7 (best raced, 125.3). Two things change
      at once: kp rises from 3.0 to 3.5, and wheel_track narrows from 0.12 to 0.11
      m. The kp step follows iteration 7''s own stated next step, and iterations 0
      to 7 all still lose the line at bends (1 to 2 line-loss events per run, max_error
      0.060 to 0.068). That pattern points to slow correction rather than jitter,
      since steering_oscillation has stayed at about 0.1 to 0.28. The narrower track
      is a plausible physical lever, because turn rate is wheel speed difference divided
      by track. I have no race evidence for it yet, so it is a bet, not a finding.
      Because the two changes are confounded, the race will not show which one caused
      any gain.


      I am approving rather than revising. Revision costs two action runs with no
      new evidence, and the candidate is at least as plausible as the best raced design.
      Iteration 8 of 12 is still early enough to use the telemetry. The next critique
      should follow the race.


      If line_loss_events are 1 or fewer and max_error stays at or above 0.06, the
      correction is still too weak at bends: raise kp further, toward 4.0, with the
      track held. If steering_oscillation rises clearly above about 0.28 with kp 3.5,
      lower kp toward 3.0 before touching kd, because kd 0.45 already raised jitter
      in iteration 6. If the robot holds the line but oval progress stays below about
      0.5, raise base_speed from 1.3 toward 1.5, since iteration 1 showed the course
      needs about 1.5 m/s. If the result is worse than iteration 7 while line loss
      is no lower, revert wheel_track to 0.12 and keep kp 3.5, so the track change
      is isolated.


      ### Requested changes


      - If line_loss_events stay at 1 or more and max_error still reaches 0.06 with
      kp 3.5, raise kp toward 4.0 with the 0.11 m track held, because iterations 0
      to 7 show line loss at bends rather than oscillation (steering_oscillation about
      0.1 to 0.28).

      - If steering_oscillation rises clearly above about 0.28 with kp 3.5, lower
      kp back toward 3.0 before changing kd, since kd 0.45 raised jitter in iteration
      6 and kp drives the signal that the wider turn response amplifies.

      - If the result is worse than iteration 7 (125.3) with no drop in line_loss_events,
      revert wheel_track to 0.12 and keep kp 3.5, so the narrow-track bet is isolated
      from the gain change.


      - [Open this output](iteration-8/entityR1/versions/a32cda38afc1494bb783d6ba42182da2/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/0bfdb5ec83cf42d998677547f2b1aeb3/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-2442c40a25343cd6/payload.json)'
