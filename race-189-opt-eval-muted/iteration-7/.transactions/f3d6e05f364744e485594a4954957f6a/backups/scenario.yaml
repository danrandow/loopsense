map:
  id: race-189-opt-eval-muted
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Wider footprint, kd 0.35
    notes: 'Sensor footprint raised to 12 mm so the outer sensors catch the tape edge
      earlier, kd cut from 0.45 to 0.35 to reduce jitter, and mass lowered to 0.6
      kg. The change rests on iteration 6 (score 115.8), where every trial still left
      the track at max_error about 0.063 with 1 to 2 line-loss events.


      ### Rationale


      Evidence: all 180 development trials across iterations 0 to 5 ended off_track
      with no finishes. Best so far is iteration 6 (115.8): oval progress 0.49, s-bend
      0.25, slalom 0.11. Max_error sits at 0.061 to 0.064 on almost every design,
      just past the 0.06 m limit, and line loss happens 1 to 2 times per run. Steering
      oscillation rose with kd (0.28 on oval at kd 0.45), so kd 0.45 is adding jitter
      without stopping the excursion. Body width cannot widen the off-track limit
      past 0.06 m, so the robot must keep its error inside that band.


      Diagnosis: the robot loses the tape once it drifts about 0.03 to 0.036 m off-centre,
      because the 8 mm footprints only see the tape edge at the outer sensors. Once
      the tape is lost, the last_direction search at throttle 0.35 cannot recover
      before the 0.06 m limit. Both the sensing span and the damping have been varied,
      but the 8 mm footprint is the one setting that has not been tested with the
      best gains.


      Changes, relative to iteration 6: (1) sensor_size 0.008 to 0.012 m, with five
      sensors kept at x = -0.02 to +0.02 (spacing 0.01 m) and y = 0.03. A larger footprint
      makes each sensor cover the tape edge from further away, so the line is held
      further off-centre and the signal stays informative. Iteration 0 used 12 mm,
      but with different gains and a 12 mm spacing that blurred the edge, so this
      isolates the footprint effect with the tuned gains. (2) kd 0.45 to 0.35, to
      cut the jitter seen in iteration 6 while keeping some damping. (3) mass 0.7
      to 0.6 kg, to lower yaw inertia so the wheels respond faster at bends. (4) base_speed
      kept at 1.3 (iteration 4 value), to recover some progress lost at 1.2. kp 3.0,
      ki 0.4, weights [-2,-1,0,1,2] and line_loss last_direction are kept to isolate
      the sensing and damping change.


      Expected result: line_loss_events at 1 or fewer per run, max_error below 0.06
      on oval and s-bend, steering_oscillation below 0.25, and progress at or above
      iteration 6 on oval (about 0.5).


      Hypotheses: H1, a 12 mm footprint at 10 mm spacing sees the tape edge early
      enough to prevent loss at bends. H2, kd 0.35 keeps damping while reducing the
      jitter seen at kd 0.45. H3, mass 0.6 reduces the lag in turning response. Measurements
      needed next: line_loss_events and max_error per track (to see whether loss still
      occurs and where), progress and completion_time on s-bend and slalom, and steering_oscillation
      to check jitter. If the robot holds the line but is too slow, raise base_speed
      toward 1.5. If max_error still reaches 0.06 with no line loss, raise kp before
      adding more kd.


      - [Open this output](iteration-7/entity0/versions/018b66dc29b240bc9e4af3576d866cee/payload.json)

      - Based on: [entityR2A](iteration-7/entityR2A/versions/carried-de5828cc3d52549d/payload.json)'
  - id: entityR1
    label: Approve 12mm footprint
    notes: 'Approved the 12 mm footprint candidate with kd 0.35 and mass 0.6 as a
      clean test of sensing span against the best raced gains (iteration 6, 115.8).
      All 180 earlier trials ended off_track, and the footprint has not been tested
      with those gains, so telemetry from this race is more useful than another revision.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      candidate is valid: five sensors at x = -0.02 to +0.02 (10 mm spacing) and y
      = 0.03 are inside range, sensor_size 0.012 is an allowed option, the weights
      are antisymmetric in [-2, 2], and kp, ki, kd, base_speed, mass and line_loss
      are in range. Nothing is obviously broken.


      Iteration 6 (best raced, 115.8) kept 8 mm footprints, kp 3.0, ki 0.4, kd 0.45
      and base 1.2. Every design so far (iterations 0 to 6) ended off_track on all
      180 trials, with max_error at 0.061 to 0.068 and 1 to 2 line-loss events per
      run. The footprint has never been tested with the iteration 6 gains. Iteration
      0 used 12 mm, but its 12 mm spacing and other gains confound that result (score
      26.0), so the footprint effect is still open.


      The candidate changes several things at once: footprint 8 to 12 mm, kd 0.45
      to 0.35, mass 0.7 to 0.6, base_speed 1.2 to 1.3. The race will not isolate each
      effect. I am approving because this is iteration 7 of 12, the change is a clean
      test of sensing span and footprint against the best gains, and telemetry from
      it is worth more than a revision made without it. The next critique should follow
      the race. If line_loss_events fall to 1 or fewer and max_error drops below 0.06
      on oval and s-bend, keep the 12 mm footprint and move base_speed toward 1.5
      if progress is below about 0.5. If max_error still reaches 0.06 with line loss,
      the footprint is not the limit: raise kp (3.0 to 3.5) before adding kd, as iterations
      4 to 6 suggest. If steering_oscillation exceeds about 0.28 (the iteration 6
      level) with kd 0.35, the jitter is coming from the wider signal, so lower kp
      slightly before raising kd. If the result is worse than iteration 6 while line
      loss is lower, the lower centre gain from the sharper footprint is the likely
      cause, so restore kp toward 3.5.


      ### Requested changes


      - If line_loss_events are 1 or fewer but max_error stays at or above 0.06, raise
      kp from 3.0 toward 3.5 with the 12 mm footprint and kd 0.35 held, because iterations
      0 to 6 show the robot loses the tape at bends rather than oscillating (steering_oscillation
      about 0.1 to 0.28).

      - If the robot holds the line but oval progress stays below about 0.5 (iteration
      6 reached 0.49), raise base_speed from 1.3 toward 1.5, since iteration 1 at
      base 1.5 showed the course needs roughly 1.5 m/s to finish and iteration 6 at
      base 1.2 lost progress.

      - If steering_oscillation rises above about 0.28 with kd 0.35 while max_error
      is still near 0.06, lower kp slightly before raising kd, because iteration 1
      showed kd raising jitter and iteration 6 reached 0.28 at kd 0.45.


      - [Open this output](iteration-7/entityR1/versions/5866720eb481436a80cdcbb2159695b4/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/018b66dc29b240bc9e4af3576d866cee/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-de5828cc3d52549d/payload.json)'
