map:
  id: race-189-opt-eval-muted
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Slower entry, iter 7 base
    notes: 'Keeps the best design so far (iteration 7, score 125.3) and lowers base_speed
      from 1.3 to 1.15 to reduce centrifugal drift at bends. The evidence is that
      every run goes off track with max_error near 0.06 and 1 to 2 line losses, and
      the speed-drift hypothesis is untested.


      ### Rationale


      Evidence: all 300 development trials so far ended off_track with no finishes.
      The best design is iteration 7 (score 125.3): 12 mm footprints, five sensors
      at x = -0.02 to +0.02 (10 mm spacing), y = 0.03, kp 3.0, ki 0.4, kd 0.35, base_speed
      1.3, mass 0.6, wheel_track 0.12. Max_error sits at 0.060 to 0.066 on almost
      every design, with 1 to 2 line-loss events per run. The robot loses the tape
      in bends, drifts past the 0.06 m limit, and the last_direction search cannot
      recover. Changes that did not help: widening the span alone (iteration 5), kd
      0.45 (jitter, iteration 6), kp 3.5 with a narrower track (iteration 8), and
      a 16 mm footprint (iteration 9, 84.4). Iteration 3 showed that lower speed together
      with higher ki reduced drift slightly.


      Change (one variable, relative to iteration 7): base_speed 1.3 to 1.15. Centrifugal
      drift scales with speed squared, so a slower entry into bends should keep the
      robot inside the 0.06 m band and reduce the line losses. Sensors, weights, kp,
      ki, kd, mass, track and line_loss are all held at iteration 7 values, so any
      change in result comes from speed.


      Expected result: line_loss_events at 1 or fewer on oval and s-bend, max_error
      below 0.06 on oval, and a small progress cost. Hypotheses: H1, the line loss
      at bends is speed-driven drift, so lower speed reduces off-track ends. H2, progress
      falls only modestly, since the robot is off track before finishing anyway. Measurements
      needed: max_error and line_loss_events per track, progress on oval and s-bend,
      and steering_oscillation. If the robot now holds the line but progress is too
      low, raise base_speed toward 1.4. If max_error still reaches 0.06 with no line
      loss, raise kp before adding kd.


      - [Open this output](iteration-10/entity0/versions/c5c5102b355b4409839f5ef1e8c22b20/payload.json)

      - Based on: [entityR2A](iteration-10/entityR2A/versions/carried-6f391ed7fd87fc0c/payload.json)'
  - id: entityR1
    label: 'Approve: 16 mm footprint'
    notes: 'Approved the single-variable change from iteration 7 (sensor_size 0.012
      to 0.016) because it is valid, the best-raced base is strong, and the race is
      the cheapest route to evidence with two iterations left. The feedback flags
      footprint overlap at 10 mm spacing as the main risk and gives fallbacks for
      each result.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      candidate is valid. It is iteration 7 (the best raced design, 125.3) with sensor_size
      raised from 0.012 to 0.016 m, the largest allowed value. Everything else is
      unchanged: five sensors at x = -0.02 to +0.02 and y = 0.03, weights [-2, -1,
      0, 1, 2], kp 3.0, ki 0.4, kd 0.35, base_speed 1.3, mass 0.6, wheel_track 0.12,
      last_direction. Nothing is obviously broken.


      Evidence: iterations 0 to 8 all ended off_track on every trial, with max_error
      at 0.060 to 0.068 and 1 to 2 line-loss events per run. The footprint trend is
      only partly clean. Iteration 7 (12 mm) beat iteration 6 (8 mm) by 9.5, but it
      also changed mass, kd and base_speed. Iteration 0 used 12 mm with different
      gains and scored 26.0, so footprint size has never been isolated with tuned
      gains beyond that one step. Iteration 8 showed that kp 3.5 with wheel_track
      0.11 scored lower (108.4), so neither of those changes should be carried forward.


      The main risk is geometry. With 16 mm footprints at 10 mm spacing, neighbouring
      sensors overlap heavily, so their readings are highly correlated. That can flatten
      the position-to-signal slope, which lowers the effective steering gain in a
      way similar to the flatter weight profile in iteration 5. The candidate could
      therefore hold the line a little longer and still steer less sharply at bends.
      Watch steering_oscillation and progress, not just line loss.


      I am approving rather than revising. The change is one variable, the best-raced
      base is strong, and a further revision would spend two action runs without new
      evidence. Iterations are limited (two remain after this one), so the race is
      the most useful next step.


      What to do next depends on the race. If line_loss_events fall to 1 or fewer
      and max_error drops below 0.06 on oval and s-bend, keep the 16 mm footprint
      and raise base_speed toward 1.5 if oval progress is below about 0.5. If line
      loss is unchanged or worse than iteration 7 and the score falls, return to sensor_size
      0.012 and test base_speed 1.4 as the single next change. If max_error still
      reaches 0.06 with line loss still occurring, raise kp from 3.0 to 3.5 on its
      own, with the 12 mm footprint and wheel_track 0.12, since iteration 8''s kp
      change was confounded with the track change.


      ### Requested changes


      - If line_loss_events are 1 or fewer on oval and s-bend but max_error still
      reaches 0.06, and progress is below about 0.5 on oval, raise base_speed from
      1.3 toward 1.5 with the 16 mm footprint held, since iteration 1 at base 1.5
      shows the course needs about 1.5 m/s and the candidate''s flatter signal may
      reduce speed-limited progress.

      - If the score falls below iteration 7 (125.3) with no drop in line_loss_events,
      revert sensor_size to 0.012 and test base_speed 1.4 alone, because the 16 mm
      footprints overlap at 10 mm spacing and may flatten the steering slope, as the
      flatter weights did in iteration 5.

      - If steering_oscillation rises above about 0.28 at kd 0.35 while max_error
      is still near 0.06, lower kp slightly from 3.0 before raising kd, since iteration
      6 showed kd 0.45 adding jitter without stopping the excursion.


      - [Open this output](iteration-9/entityR1/versions/cd4ce62883fb4fb5a63e91772b76a7b7/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/f1006dd85c0f47af83675dd203a0832c/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-d0d761422e087caa/payload.json)'
