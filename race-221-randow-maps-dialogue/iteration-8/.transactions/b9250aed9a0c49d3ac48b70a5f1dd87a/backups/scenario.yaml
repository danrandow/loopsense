map:
  id: race-221-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Hold best geometry
    notes: 'Holds the iteration 1 geometry (five 12 mm sensors, ±0.03 m span, y =
      0.05 m), which scored 69.3241 in iterations 1, 4 and 6. Every single-variable
      change away from it lowered the score, and line loss stayed near 1 per run,
      so the geometry is kept fixed while the Integrator tests base_speed.


      ### Rationale


      The evidence has been consistent across iterations 0 to 7. The best-measured
      geometry is the iteration 1 design: five 12 mm sensors at x = -0.03, -0.015,
      0, 0.015, 0.03 m, y = 0.05 m, on a 0.12 m track with 0.03 m wheels, 0.6 kg mass
      and a 0.16 x 0.14 m body. It scored 69.3241 in iterations 1, 4 and 6, so it
      is reproducible under the same controller. Each single-variable geometry change
      away from it lowered the score: the 16 mm footprint (54.45, iteration 2), y
      = 0.03 m (59.64, iteration 3, same controller) and the ±0.04 m span (52.47,
      iteration 5). Iteration 7 reran this geometry with a different controller and
      scored 61.765, which shows the controller, not the geometry, drove that change.
      Line loss has stayed at about 1 per run (1.0 to 1.65) under every geometry tested,
      and steering oscillation (0.07 to 0.15) is not the limiting factor. The open
      question is controller-side line-loss handling, not the sensor layout. I took
      the Integrator''s advice to hold the geometry unchanged, since the Integrator
      is testing base_speed 1.15 against it. Body width does not move the off-track
      limit (max(0.06, 0.0125 + body_width/4) = 0.06 m across the allowed range),
      so I am not using it as a lever. I considered a ±0.05 m span, but the ±0.04
      m result gives no support for it, so I am not committing to it. Expected result:
      about 69.3 if the controller matches iteration 1, and a score that tracks the
      controller change otherwise.


      - [Open this output](iteration-8/entity0/versions/03d185bed25340459bbf83d3b0f0ed0d/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-c39f423095f8f4cd/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-c8d0b4567ca7c0a2/payload.json)'
  - id: entity1
    label: Ref geometry, kd 0.4 test
    notes: 'Holds the iteration 1 geometry and restores base_speed 1.3, which the
      1.15 run in iteration 7 showed to be worse (61.77). Tests kd 0.3 to 0.4 as the
      only change, since steering oscillation is low.


      ### Rationale


      The reference geometry is held unchanged from the Builder''s entity0: five 12
      mm sensors at x = -0.03, -0.015, 0, 0.015, 0.03 m, y = 0.05 m, 0.12 m track,
      0.03 m wheels, 0.6 kg, 0.16 x 0.14 m body. Its best controller so far (base_speed
      1.3, kp 2.5, ki 0, kd 0.3, last_direction) scored 69.3241 in iterations 1, 4
      and 6, so the geometry is reproducible. Iteration 7 tested base_speed 1.15 on
      this geometry and scored 61.765. Oval progress fell to 0.185 from 0.254, and
      line loss rose to 1.45 on oval, so the slower speed is rejected. The Builder''s
      condition for confirming the geometry (about 69 with line loss at or below 1
      per run) was not met, and the drop came from the controller. Line loss has stayed
      near 1 per run under every geometry, so the controller is the remaining lever.
      Steering oscillation is low (0.07 to 0.15), which leaves room for more derivative
      damping. I therefore restore base_speed 1.3 and make one controller change:
      kd 0.3 to 0.4, to damp the overshoot that precedes the abrupt line loss. Every
      other value stays at the reference. Sign check: positive x (left) carries a
      positive weight, so a line on the left steers left. Expected result: a score
      near 69.3 if kd has little effect, or a gain if it reduces line loss. This is
      a prediction, not a measurement, and I revert to kd 0.3 if the score falls.


      - [Open this output](iteration-8/entity1/versions/7720c71eeda94ed4a5a17a28b99c6c1f/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/03d185bed25340459bbf83d3b0f0ed0d/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-c8d0b4567ca7c0a2/payload.json)'
  - id: entityR1
    label: Hold geometry, fix
    notes: 'Tells the Builder to hold the iteration 1 geometry. Iteration 7 showed
      the slower speed, not the geometry, drove the score drop, so no geometry change
      is requested.


      ### Feedback


      The evidence is iteration 1 (69.32, 12 mm, y = 0.05 m, ±0.03 m span, base_speed
      1.3), reproduced in iterations 4 and 6. Each geometry change away from it lowered
      the score: the 16 mm footprint (iteration 2, 54.45), y = 0.03 m (iteration 3,
      59.64) and the ±0.04 m span (iteration 5, 52.47). Your condition for confirming
      the geometry was not met in iteration 7: with base_speed 1.15 and the same geometry,
      the score fell to 61.77 and oval line loss rose to 1.45. So the controller,
      not the geometry, drove that drop. Line loss has stayed near 1 per run through
      every geometry, and steering oscillation (0.07 to 0.15) is not the limit. Hold
      this geometry. I am not asking for a geometry change, because the sensor layout
      has been tested and its best setting is already known. Body width does not move
      the off-track limit, max(0.06, 0.0125 + body_width/4) = 0.06 m across your range,
      so do not use it as a lever. The Integrator is testing a single controller change
      (kd 0.3 to 0.4) on this geometry. Do not change the geometry in response to
      this race until the result is known.


      ### Requested changes


      - Hold the iteration 1 geometry unchanged: five 12 mm sensors at x = -0.03,
      -0.015, 0, 0.015, 0.03 m, y = 0.05 m, with the wheel, body and mass values as
      they are.

      - Do not change the forward offset (y = 0.03 m cost about 10 points in iteration
      3) or the footprint (16 mm cost about 15 points in iteration 2) without a clear
      controller explanation.

      - If the kd 0.4 race shows line_loss_events clearly below 1 per run, keep the
      geometry and test one later change. If line loss is unchanged, keep the geometry
      and leave line-loss handling to the Integrator.


      - [Open this output](iteration-8/entityR1/versions/7720c71eeda94ed4a5a17a28b99c6c1f/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/03d185bed25340459bbf83d3b0f0ed0d/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-c8d0b4567ca7c0a2/payload.json)'
