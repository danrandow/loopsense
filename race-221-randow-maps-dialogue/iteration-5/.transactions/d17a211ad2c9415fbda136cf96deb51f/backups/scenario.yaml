map:
  id: race-221-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Span ±0.04 m test
    notes: 'Widens only the sensor span from ±0.03 m to ±0.04 m at y=0.05 m, 12 mm
      footprints, with all other geometry held. Iteration 4 reproduced iteration 1''s
      score (69.32) exactly, which confirms the forward offset caused the iteration
      3 drop, so this is a clean single-variable span test.


      ### Rationale


      Iteration 4 restored the iteration 1 geometry (y=0.05 m, 12 mm footprints, ±0.03
      m span) and reproduced its score exactly (69.3241 vs 69.3241). The forward offset
      therefore explains the iteration 3 drop, and the controller is not the cause.
      Line loss has stayed near 1 per run through every geometry tested (0 to 1.65
      per run), and steering oscillation (0.09 to 0.15) is not the limiting factor.
      The failure is an abrupt loss of the tape at the array edges, not jitter. Widening
      the span from ±0.024 to ±0.03 m raised the score by about 15 points, so the
      next single change is a wider span. I take the Integrator''s advice to hold
      sensor_size at 0.012 m and y=0.05 m, and I am testing span ±0.04 m as the only
      change against the iteration 1 reference. I expect fewer line-loss events and
      higher progress if the trend continues. The 20 mm spacing still leaves the 25
      mm tape covered by at least one 12 mm footprint across the array. Wheel track
      (0.12 m), wheel radius (0.03 m), mass (0.6 kg) and body (0.14 × 0.16 m) stay
      fixed. The off-track limit remains max(0.06, 0.0125 + 0.14/4) = 0.06 m, so body
      width is not a lever. If line loss does not fall below about 1 per run, the
      Integrator''s rule applies: return to the ±0.03 m span and do not move the offset
      again without a controller explanation.


      - [Open this output](iteration-5/entity0/versions/43a7cab619714a1c8b4c030ccb0f0bcf/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-6a4bbe58355297b3/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-2a024531fceb669c/payload.json)'
  - id: entity1
    label: Baseline restored, kp 2.5
    notes: 'Pairs the reverted y=0.05 m geometry with the iteration 1 controller unchanged,
      so the package matches the best measured design (69.32). Iteration 3 showed
      the controller was identical to iteration 1, so the offset is the only variable
      that changed.


      ### Rationale


      Iteration 3 changed only the sensor forward offset (y 0.05 to 0.03 m) and kept
      the iteration 1 controller exactly (base_speed 1.3, kp 2.5, ki 0, kd 0.3, last_direction,
      weights -1, -0.5, 0, 0.5, 1). Its score fell from 69.32 to 59.64, with progress
      down on oval (0.254 to 0.207) and slalom (0.111 to 0.086). Because the controller
      was identical, the offset is the sole cause, and the Builder''s proposal to
      restore y=0.05 m is supported. The geometry is therefore the iteration 1 geometry
      exactly: sensors at x = -0.03, -0.015, 0, 0.015, 0.03 m, y = 0.05 m, 12 mm footprints.
      The controller is also the iteration 1 controller exactly, so this package should
      reproduce the best measured result (about 69) and gives a clean reference for
      the next single-variable test. I considered retuning kd or kp to reduce the
      single line loss per run, but any such change would be unmeasured and would
      confound the baseline, so I hold them. Sign check: sensors at positive x (left)
      carry positive weights, so a line on the left gives a positive signal and steers
      left, matching the contract. The off-track limit is max(0.06, 0.0125 + 0.14/4)
      = 0.06 m, so body_width is not a lever. Expected result: score near 69, with
      line loss still about 1 per run. This is a prediction, not a measurement.


      - [Open this output](iteration-4/entity1/versions/c1336e2a14b741738cde860a937d30eb/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/046b95e9a7c14b8980653b3beb552bca/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-57a2b4821f3f4503/payload.json)'
  - id: entityR1
    label: Hold y=0.05, test span
    notes: 'Corrects the Builder''s note that iteration 3 was confounded: its controller
      matched iteration 1, so y=0.03 m alone cost about 10 points. Recommends holding
      y=0.05 m and testing a wider span as a single change.


      ### Feedback


      Iteration 3 is the key evidence here. Its controller was identical to iteration
      1 (base_speed 1.3, kp 2.5, kd 0.3), so you can attribute the drop from 69.32
      to 59.64 to the offset change alone, not to a controller change as your rationale
      suggests. Iteration 2 also held the controller fixed, and its 16 mm footprint
      fell to 54.45, so 12 mm should stay. Line loss has stayed near 1 per run in
      every iteration (0 to 3), so the sensor span and footprint have only partly
      reduced it. Steering oscillation has stayed between 0.09 and 0.15, so it is
      not the limiting factor. The Integrator''s package this iteration restores y=0.05
      m with the iteration 1 controller, so the race should show whether the offset
      was the cause. Do not treat that as a result for this design. For the next geometry,
      hold y=0.05 m and test a single change: span ±0.04 m. Iteration 0 to 1 raised
      the score by 15 points by widening the span from ±0.024 to ±0.03 m, though that
      change was paired with a controller change, so the span effect is only partly
      isolated. If line loss still persists after the span test, the remaining levers
      are the forward offset (not y=0.03 m, which iteration 3 ruled out) and the controller,
      so the Integrator will look at line-loss handling. Keep wheel track, wheel radius,
      mass and body fixed. Body width does not move the off-track limit, which is
      max(0.06, 0.0125 + body_width/4) = 0.06 m across the allowed range.


      ### Requested changes


      - Hold sensor_size at 0.012 m and the forward offset at y=0.05 m, since iteration
      3 (y=0.03 m, same controller as iteration 1) lost about 10 points and iteration
      2 (16 mm footprint) lost about 15.

      - Test a wider span of about ±0.04 m (sensor x at -0.04, -0.02, 0, 0.02, 0.04
      m) at y=0.05 m as a single geometry change, to see whether the line-loss rate
      falls further beyond the ±0.03 m span.

      - If the span test does not reduce line_loss_events below about 1 per run, return
      to the ±0.03 m span and hold the geometry; do not move the offset again without
      a controller explanation.


      - [Open this output](iteration-4/entityR1/versions/c1336e2a14b741738cde860a937d30eb/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/046b95e9a7c14b8980653b3beb552bca/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-57a2b4821f3f4503/payload.json)'
