map:
  id: race-221-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Hold best geometry (69.3)
    notes: 'Holds the iteration 1 reference geometry (±0.03 m span, y=0.05 m, 12 mm
      sensors), which reproduced 69.32 in iterations 1, 4 and 6. The 16 mm footprint,
      y=0.03 m and ±0.04 m span each lowered the score, so no geometry change is proposed.


      ### Rationale


      The evidence is consistent across iterations 0 to 6. The best-measured geometry
      is the iteration 1 design: five 12 mm sensors at x = -0.03, -0.015, 0, 0.015,
      0.03 m, with y = 0.05 m, on a 0.12 m track, 0.03 m wheels, 0.6 kg mass and a
      0.16 x 0.14 m body. It scored 69.3241 in iterations 1, 4 and 6, so the result
      reproduces with the same controller. Each change away from it lowered the score:
      the 16 mm footprint (54.45, iteration 2), y = 0.03 m (59.64, iteration 3) and
      the span of ±0.04 m (52.47, iteration 5). Line loss stayed near 1 per run in
      every iteration (1.0 to 1.65), and it did not fall clearly below 1 per run with
      any geometry tested, so the sensor layout has only partly reduced it. Steering
      oscillation (0.07 to 0.15) is not the limiting factor. The Integrator''s feedback
      advises holding this geometry and does not ask for a new variable, so I am taking
      that advice. Iteration 2 is confounded by a controller change, but iteration
      3 was not, and the reversion in iteration 4 confirmed that y = 0.05 m is the
      better offset. Wheel track, wheel radius, mass and body have no evidence pointing
      at them, and body width does not move the off-track limit: max(0.06, 0.0125
      + body_width/4) = 0.06 m across the allowed range. I considered a wider span
      (±0.05 m) but the ±0.04 m result gives no support for it, so I am not committing
      to that test now. Expected result: a score near 69.3, with line_loss_events
      about 1 per run.


      - [Open this output](iteration-7/entity0/versions/e75fe6ebd9334092a1aaf7f36c2a99b6/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-a0cf8b944fbd7f35/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-2a024531fceb669c/payload.json)'
  - id: entity1
    label: Reference + slower speed
    notes: 'Holds the proven iteration 1 geometry (69.32, reproduced three times)
      and lowers base_speed from 1.3 to 1.15 as the only change, aimed at the persistent
      single line-loss-per-run failure. Expected result is a prediction, not a measurement.


      ### Rationale


      The Builder holds the iteration 1 geometry: five 12 mm sensors at x = -0.03,
      -0.015, 0, 0.015, 0.03 m, y = 0.05 m, on a 0.12 m track with 0.03 m wheels,
      0.6 kg mass and a 0.16 x 0.14 m body. This geometry has now raced three times
      with the same controller (iterations 1, 4 and 6) and scored 69.3241 each time,
      so it is reproducible. Re-racing the identical package would add no new information,
      so this iteration tests one controller change. Evidence for the controller lever:
      line loss has stayed at about 1 per run across every geometry (1.0 to 1.65),
      so sensor layout alone has not removed it. Iteration 1 lowered base_speed from
      1.5 to 1.3 and kp from 3.0 to 2.5 and gained about 15 points, though that change
      was paired with the span change. Off-track failure at about 15 percent progress
      is the main score loss, so I lower base_speed further to 1.15 while keeping
      kp 2.5, kd 0.3, ki 0, last_direction line loss and the weights matched to the
      sensor x order. Sign check: positive x (left) carries a positive weight, so
      a line on the left steers left, as the contract requires. Single-variable change
      against the 69.32 reference, so any score change is attributable to base_speed.
      Expected result: line_loss_events falls toward or below 1 per run and progress
      rises a little, with a small loss of completion-time credit. This is a prediction,
      not a measurement. Risk: a slower base_speed may fail to finish within 3 s,
      which is accepted because the runs currently end off track well before the finish.


      - [Open this output](iteration-7/entity1/versions/f5cbb811177b4ad899a6e0c560e1ccdc/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/e75fe6ebd9334092a1aaf7f36c2a99b6/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-2a024531fceb669c/payload.json)'
  - id: entityR1
    label: Hold geometry, feedback
    notes: 'Recommends holding the 12 mm, ±0.03 m, y = 0.05 m geometry, because the
      forward offset, footprint and wider span all lowered the score in iterations
      2, 3 and 5. The controller is the open lever, so the Builder does not need to
      change anything this round.


      ### Feedback


      Written before this candidate has raced; no result is stated for it. Evidence:
      iterations 1, 4 and 6 used the same geometry and controller and each scored
      69.3241, so this geometry is reproducible. Iteration 3 (y = 0.03 m, same controller
      as iteration 1) scored 59.64, so keep y = 0.05 m. Iteration 2 (16 mm footprint,
      same controller) scored 54.45, so keep 12 mm. Iteration 5 (span ±0.04 m, same
      controller) scored 52.47 and did not bring line loss clearly below 1 per run,
      so keep ±0.03 m. Line loss has stayed at about 1 per run through iterations
      0 to 6, and steering oscillation (0.07 to 0.15) is not the limiting factor.
      The geometry is therefore not the open question. The Integrator is testing a
      slower base_speed (1.15) with the geometry held, so you do not need to change
      anything this round. Body width does not move the off-track limit, max(0.06,
      0.0125 + body_width/4) = 0.06 m across your range, so do not treat it as a lever.


      ### Requested changes


      - Hold the iteration 1 geometry unchanged: five 12 mm sensors at x = -0.03,
      -0.015, 0, 0.015, 0.03 m, y = 0.05 m, with the wheel, body and mass values as
      they are. Iterations 1, 4 and 6 show this scores 69.3241.

      - If the next race shows line_loss_events clearly below 1 per run with the Integrator''s
      slower base_speed, you may keep this geometry and test a single later geometry
      change. If line loss is unchanged, keep the geometry and let the Integrator
      work on controller line-loss handling.

      - Do not move the forward offset (y = 0.03 m cost about 10 points in iteration
      3) or the footprint (16 mm cost about 15 points in iteration 2) without a clear
      controller explanation.


      - [Open this output](iteration-7/entityR1/versions/f5cbb811177b4ad899a6e0c560e1ccdc/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/e75fe6ebd9334092a1aaf7f36c2a99b6/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-2a024531fceb669c/payload.json)'
