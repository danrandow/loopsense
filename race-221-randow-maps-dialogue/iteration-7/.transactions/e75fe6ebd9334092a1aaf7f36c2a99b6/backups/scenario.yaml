  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Revert to ±0.03 m span
    notes: 'Reverts the sensor span from ±0.04 m back to the best-measured ±0.03 m
      at y=0.05 m with 12 mm footprints. Iteration 5 (±0.04 m) scored 52.47 against
      the 69.32 reference, with oval progress halved, and the Integrator''s revert
      rule applies.


      ### Rationale


      Iteration 5 widened the span to ±0.04 m (20 mm spacing, 12 mm footprints, y=0.05
      m) and scored 52.47, down 16.9 points from the 69.32 reference. Line loss fell
      on oval (1.65 to 1.0 per run) but stayed at 1.0 on s-bend and slalom, so it
      did not fall clearly below 1 per run. Oval progress roughly halved (0.254 to
      0.127), and mean progress fell on every track except s-bend, which was roughly
      flat (0.150 to 0.150). The Integrator''s rule applies: because the score and
      progress fell with ±0.04 m, revert to the ±0.03 m span at y=0.05 m. I took that
      advice. Iterations 1 and 4 used this exact geometry and both scored 69.3241,
      so this is the best-measured design. I am not testing any new geometry this
      iteration: wheel track, wheel radius, mass and body have no evidence pointing
      to them, and the off-track limit stays at 0.06 m because body width does not
      move it. The expected result is a score near 69 if the controller is unchanged,
      and a return to the reference if the controller changes.


      - [Open this output](iteration-6/entity0/versions/92dfec0ae4644ee58383d4557684c04a/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-39ab2a17a7a13c94/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-492bb11544670ded/payload.json)'
  - id: entity1
    label: 'Reference: iter 1'
    notes: 'Reverts to the ±0.03 m, y=0.05 m, 12 mm geometry with the iteration 1
      controller, which scored 69.32 twice. This gives a clean reference for the next
      single-variable test.


      ### Rationale


      Iteration 4 reproduced the iteration 1 score exactly (69.3241), and iteration
      3 showed that moving the sensors to y=0.03 m cost about 10 points with the same
      controller. The Builder''s proposal is therefore the iteration 1 geometry: five
      12 mm sensors at x = -0.03, -0.015, 0, 0.015, 0.03 m, y = 0.05 m, with unchanged
      wheel, body and mass values. I keep the controller exactly as in iterations
      1 and 4 (base_speed 1.3, kp 2.5, ki 0, kd 0.3, last_direction, weights -1, -0.5,
      0, 0.5, 1). Sign check: positive x (left) carries a positive weight, so a line
      on the left gives a positive signal and steers left, as the contract requires.
      Line loss has stayed at about 1 per run through every geometry and controller
      tried, so the controller is not yet the proven cause. Changing it now would
      confound the reference, so this package is a clean reference that should return
      about 69.3. Expected result: score near 69.3 with line loss about 1 per run.
      This is a prediction, not a measurement.


      - [Open this output](iteration-6/entity1/versions/b96390a0b2cf46d28fe4477b8494bc3d/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/92dfec0ae4644ee58383d4557684c04a/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-492bb11544670ded/payload.json)'
  - id: entityR1
    label: Hold reference, test span
    notes: 'Advises holding the 12 mm, y=0.05 m geometry, which the iteration 2 and
      3 races showed to be better. The span test is conditional on the iteration 5
      result.


      ### Feedback


      Written before this candidate has raced. Iteration 1 (score 69.32) and iteration
      4 (same design, score 69.32 again) are the evidence, and this candidate is the
      same design, so you should expect the same score. Iteration 3 showed that y=0.03
      m cost about 10 points with the same controller, so keep y=0.05 m. Iteration
      2 showed that the 16 mm footprint lowered the score to 54.45 with the controller
      held fixed, so keep 12 mm. Line loss has stayed at about 1 per run through iterations
      0 to 4 (1.0 to 1.65 per run), so the span and footprint have only partly reduced
      it. Steering oscillation has stayed between 0.09 and 0.15, so it is not the
      limiting factor. Do not treat any of this as a result for the current candidate.
      Next, the span is the open question: iteration 5 tested ±0.04 m only if the
      geometry is revisited, and that result is not yet in. Body width does not move
      the off-track limit, which is max(0.06, 0.0125 + body_width/4) = 0.06 m across
      the allowed range, so do not use it as a lever.


      ### Requested changes


      - Hold sensor_size at 0.012 m and the forward offset at y=0.05 m, because iteration
      2 (16 mm) and iteration 3 (y=0.03 m) both scored below the 69.32 reference.

      - If the span test (±0.04 m, iteration 5) lowers line_loss_events clearly below
      about 1 per run, test a single later change of ±0.05 m at y=0.05 m. If not,
      keep the ±0.03 m span.

      - Keep wheel track, wheel radius, mass and body fixed, since the evidence does
      not point at them.


      - [Open this output](iteration-6/entityR1/versions/b96390a0b2cf46d28fe4477b8494bc3d/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/92dfec0ae4644ee58383d4557684c04a/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-492bb11544670ded/payload.json)'
