map:
  id: race-221-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: Hold reference geometry
    notes: 'Holds the iteration 1 layout (five 12 mm sensors, ±0.03 m span, y = 0.05
      m), which scored 69.32 in three reproduced races. Every geometry change tested
      in iterations 2, 3 and 5 lowered the score, and line loss stayed near 1 per
      run, so no untested change is justified for the final race.


      ### Rationale


      The evidence across iterations 0 to 10 points to one layout. Five 12 mm sensors
      at x = -0.03, -0.015, 0, 0.015, 0.03 m and y = 0.05 m scored 69.3241 in iterations
      1, 4 and 6 with the same controller, so the result is reproducible. Every single
      geometry change tested lowered the score with the controller held fixed: the
      16 mm footprint (54.45, iteration 2), y = 0.03 m (59.64, iteration 3) and the
      span of ±0.04 m (52.47, iteration 5). Line loss has stayed at about 1 per run
      (1.0 to 1.65) under every geometry, and steering oscillation (0.07 to 0.15)
      is not limiting. Later score swings (61.77, 56.44, 63.59) came from controller
      changes on this same geometry, so the controller is the lever now. The Integrator''s
      advice is to hold the geometry. I took it, because this is the final iteration
      and the final unseen-track race will be scored on whatever design is delivered
      here. An untested dynamics change (wheel_track or mass) would be a gamble with
      no line-loss evidence behind it, and the feedback says to test one only if line
      loss clearly falls, which it has not. Body width does not move the off-track
      limit (max(0.06, 0.0125 + body_width/4) = 0.06 m across the range), so it is
      not a lever. Expected result: about 69.3 if the controller matches the reference,
      with line loss near 1 per run.


      - [Open this output](iteration-11/entity0/versions/32a41d81c3fd4f14a84544dc789bc2f4/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-6a3b3af576c371fa/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-2a024531fceb669c/payload.json)'
  - id: entity1
    label: Final reference robot
    notes: 'Delivers the iteration 1 geometry and controller unchanged, which scored
      69.3241 in four races (iterations 1, 4, 6, 10). Every tested change lowered
      the score, so holding it is the most reliable choice for the final unseen-track
      race.


      ### Rationale


      This is the final iteration, and the final unseen-track race is scored on the
      design delivered here, so the aim is the most reliable robot, not an untested
      improvement. The evidence is consistent. The geometry (five 12 mm sensors at
      x = -0.03, -0.015, 0, 0.015, 0.03 m, y = 0.05 m, with wheel, body and mass unchanged)
      and the controller from iteration 1 (base_speed 1.3, kp 2.5, ki 0, kd 0.3, last_direction,
      weights -1, -0.5, 0, 0.5, 1) scored 69.3241 in iterations 1, 4, 6 and 10, so
      the result is reproducible. Every single change tested away from this design
      lowered the score: 16 mm footprint (54.45, iteration 2), y = 0.03 m (59.64,
      iteration 3), the ±0.04 m span (52.47, iteration 5), base_speed 1.15 (61.77,
      iteration 7), kd 0.4 (56.44, iteration 8) and kd 0.2 (63.59, iteration 9). Line
      loss has stayed at about 1 per run (1.0 to 1.65) under every design, and steering
      oscillation (0.07 to 0.15) is not limiting. Untested levers (line-loss search
      direction, wheel_track, mass) have no line-loss evidence behind them. With no
      iterations remaining, an untested change would be a gamble on the final score.
      I therefore deliver the reference robot exactly. Sign check: sensors at positive
      x (left) carry positive weights, so a line on the left steers left, as the contract
      requires. Expected result: a score near 69.3 on the development tracks and a
      finish-or-off-track outcome on the unseen track that is not yet known. This
      is a prediction, not a measurement.


      - [Open this output](iteration-11/entity1/versions/70576d4674bd452caa71cfa99c4b6492/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/32a41d81c3fd4f14a84544dc789bc2f4/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-2a024531fceb669c/payload.json)'
  - id: entityR1
    label: Hold reference, no
    notes: 'Advises holding the reference geometry, because every single-variable
      geometry and controller change from iterations 2 to 9 lowered the score. Notes
      that line-loss search direction is the only untested lever with a clear link
      to line loss.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. The evidence
      is iterations 1, 4, 6 and 10, which used the same geometry and controller and
      each scored 69.3241, so this design is the reproducible reference. Geometry
      changes lowered the score: 16 mm footprint in iteration 2 (54.45), y = 0.03
      m in iteration 3 (59.64) and the ±0.04 m span in iteration 5 (52.47). Controller
      changes also lowered it: base_speed 1.15 in iteration 7 (61.77), kd 0.4 in iteration
      8 (56.44) and kd 0.2 in iteration 9 (63.59). Line loss has stayed at about 1
      per run through every design tested, so the layout is mapped and the controller
      is at a local optimum for the values tried. Hold the geometry. Body width does
      not move the off-track limit, which is max(0.06, 0.0125 + body_width/4) = 0.06
      m across the allowed range, so it is not a lever. This is the final iteration,
      so no further geometry change will be raced.


      ### Requested changes


      - Hold the iteration 1 geometry unchanged: five 12 mm sensors at x = -0.03,
      -0.015, 0, 0.015, 0.03 m, y = 0.05 m, with wheel, body and mass values as they
      are.

      - Do not move the forward offset (y = 0.03 m cost about 10 points in iteration
      3) or the footprint (16 mm cost about 15 points in iteration 2) without a controller-based
      reason.

      - If a further iteration is ever run, test line-loss handling (search_left or
      search_right in place of last_direction) as a single controller change, since
      it is the only untested lever with a clear line-loss link.


      - [Open this output](iteration-11/entityR1/versions/70576d4674bd452caa71cfa99c4b6492/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/32a41d81c3fd4f14a84544dc789bc2f4/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-2a024531fceb669c/payload.json)'
