map:
  id: race-221-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Forward offset 0.03 m
    notes: 'Reverted the footprint to 12 mm and moved the sensors forward to y=0.03
      m, keeping the ±0.03 m span, as a single change from the best race (iteration
      1, 69.32). The 16 mm footprint did not reduce line loss in iteration 2 (score
      54.45, also confounded by a controller change), so the forward offset is tested
      next.


      ### Rationale


      Iteration 2 scored 54.45, below iteration 1''s 69.32. Its only geometry change
      was the footprint, 12 mm to 16 mm, but the controller also changed (lower base_speed
      and kp), so the two effects are confounded. The footprint did not reduce line
      loss: line_loss_events stayed at 1.0 per run on oval, s-bend and slalom, and
      oval progress fell from 0.25 to 0.14. The Integrator''s rule for this case says
      that if line loss persists with 16 mm, the footprint is not the cause, so I
      hold the geometry and test a forward offset as a separate change. I am reverting
      the footprint to 12 mm, since 12 mm with the ±0.03 m span gave the best measured
      score, and I am moving the sensors forward from y=0.05 to y=0.03 m with the
      span unchanged. This makes iteration 1 the reference for a single-variable test.
      The off-track limit is max(0.06, 0.0125+body_width/4), which stays at 0.06 m
      for this body width, so body_width is not changed. The score is driven mainly
      by progress before the run ends, so I expect progress to rise if sensor timing
      at bends is the limit. The risk is more steering oscillation at speed, which
      the Integrator should watch for.


      - [Open this output](iteration-3/entity0/versions/9422adec2f494847ba7864ff041ab323/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-b7a0e840697fc2a9/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-ad49e160420b8717/payload.json)'
  - id: entity1
    label: Forward offset y=0.03
    notes: 'Moves the sensors from y=0.05 to y=0.03 m with span, 12 mm footprint and
      controller from iteration 1 held fixed, so the offset effect is isolated. Iteration
      2 showed 16 mm footprint lowered the score from 69.32 to 54.45, so 12 mm is
      kept.


      ### Rationale


      Evidence: iteration 1 (sensors at y=0.05, span ±0.03 m, 12 mm footprints, base_speed
      1.3, kp 2.5, kd 0.3) scored 69.32, the best result so far. Iteration 2 kept
      that controller exactly and changed only sensor_size to 16 mm, and the score
      fell to 54.45. Oval progress dropped from 0.25 to 0.14 and line loss stayed
      at 1.0 per run. So the 16 mm footprint is a clear negative, not a neutral change,
      and the 12 mm footprint should be kept. Line loss has persisted at about 1 per
      run through every geometry tried, so it is not yet explained by footprint.


      This iteration''s geometry is the Builder''s single-variable change: forward
      offset moved from y=0.05 to y=0.03 m, with span ±0.03 m, 12 mm footprints and
      the body and wheel values unchanged. To keep the attribution clean, I hold the
      iteration 1 controller exactly. I am not retuning kd for the shorter lead distance
      yet, because that would confound the offset test. The sensor weights (-1, -0.5,
      0, 0.5, 1) match the x order and sign convention, so a line on the right gives
      a negative signal and steers right. line_loss stays at last_direction, which
      suited the bends in the evidence.


      Expected result: if sensor timing at bends is the limit, progress should rise.
      The main risk is more steering oscillation at speed, so I request the full measurement
      set including controller_errors and noise_robustness.


      - [Open this output](iteration-3/entity1/versions/6823d451522f43798d9c9a1efea7b1c5/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/9422adec2f494847ba7864ff041ab323/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-ad49e160420b8717/payload.json)'
  - id: entityR1
    label: Keep 12mm; test offset
    notes: 'Corrects the earlier confound note: iteration 2 vs 1 used an identical
      controller, so the 16 mm footprint itself reduced the score. Recommends keeping
      12 mm, testing the forward offset next, and widening the span only if the offset
      helps.


      ### Feedback


      Evidence: the controller in iteration 2 was identical to iteration 1, so the
      drop from 69.32 to 54.45 is due to sensor_size 0.012 to 0.016 alone. Oval progress
      fell from 0.25 to 0.14 and line loss stayed at 1.0 per run. This means the 16
      mm footprint is a negative result, and I correct my earlier note that it was
      confounded: that confound applied only to iteration 0 vs 1. Keep sensor_size
      at 0.012. Line loss has stayed near 1 per run through every geometry so far
      (iterations 0, 1 and 2), so the next lever is the sensor offset or span, not
      footprint. Iteration 0 to 1 showed that widening the span from ±0.024 to ±0.03
      m raised the score from 54.37 to 69.32, although that change was also paired
      with a controller change. Steering oscillation has stayed around 0.13 to 0.15
      in every iteration, so it is not yet the limiting factor. Do not expect a result
      for this candidate from this note. Next race: if progress rises and steering_oscillation
      stays at or below about 0.15 with y=0.03, keep the offset and test span ±0.04
      m as a separate change. If progress falls, revert to y=0.05. If steering_oscillation
      rises above about 0.15, also revert to y=0.05 before any span change. Keep wheel
      track, mass and body fixed, because the off-track limit and the evidence do
      not point to them.


      ### Requested changes


      - Keep sensor_size at 0.012 m, since iteration 2 shows 0.016 m lowered the score
      from 69.32 to 54.45 with the controller held fixed.

      - If progress rises with y=0.03 and steering_oscillation stays at or below about
      0.15, keep the offset and test a wider span of about ±0.04 m (sensor x at -0.04,
      -0.02, 0, 0.02, 0.04), as a separate change.

      - If progress falls or steering_oscillation rises above about 0.15 with y=0.03,
      revert the forward offset to y=0.05 m before testing any other geometry change.


      - [Open this output](iteration-3/entityR1/versions/6823d451522f43798d9c9a1efea7b1c5/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/9422adec2f494847ba7864ff041ab323/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-ad49e160420b8717/payload.json)'
