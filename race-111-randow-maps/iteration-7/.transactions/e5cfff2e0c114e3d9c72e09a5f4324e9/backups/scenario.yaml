map:
  id: race-111-randow-maps
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: 8mm sensor footprints
    notes: 'Keeps the best design (mass 0.4 kg, 70.83) and changes only sensor_size
      from 0.012 to 0.008 m. Based on the Integrator''s branch: line losses stayed
      at 1.0 per run with max_error at or above 0.06 m, and steering oscillation is
      low, so yaw inertia is exhausted and footprint sharpness is the next test.


      ### Rationale


      Iteration 6 (mass 0.4 kg, body_length 0.16 m, y 0.05 m, 12 mm footprints, 0.06
      m span, wheel_track 0.12 m) is the best design so far at 70.83, up from 65.14
      at 0.5 kg. Mass is still a working lever. Line losses did not fall: the s-bend
      and slalom still lose the line once per run, with max_error 0.0641 and 0.0669
      m, both at or above the 0.06 m off-track limit. Steering oscillation stayed
      low at 0.133 (s-bend) and 0.148 (slalom), so the robot is not over-turning.
      The oval gained progress (0.272) but lost more line events (1.8), and the oval
      is not the binding constraint for the held-back tracks. The Integrator''s branch
      for this result is: line losses at 1.0, max_error at or above 0.06 m, and steering
      oscillation below 0.2 means the yaw-inertia route is exhausted. The next change
      is sensor coverage at 8 mm footprints, keeping mass at 0.4 kg. Iteration 0 (12
      mm) and iteration 2 (16 mm, wider span, confounded) bracket the footprint question,
      and the Integrator''s notes suggest a smaller footprint may sharpen the edge
      reading. The change is one variable: sensor_size 0.012 to 0.008 m, with all
      else held at the iteration 6 values. Risk: a smaller footprint narrows the lateral
      band over which each sensor sees tape, so it could lose the line sooner on drift.
      I accept that risk because it is the test the Integrator asked for and it is
      measurable. If line losses rise, the footprint is too small and the next step
      is 0.012 m again, or a span change at 0.012 m.


      - [Open this output](iteration-7/entity0/versions/6dc514ae31b545a287ac3593b752654f/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-f4e622ed45357ab9/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-b4388d8e55e19f29/payload.json)'
  - id: entity1
    label: Mass 0.4 kg, controller
    notes: 'Takes the Builder''s mass 0.4 kg (from iteration 4 at 0.5 kg) with body_length
      0.16 m and the iteration 4 controller held exactly. Mass is the only change,
      to test whether further yaw-inertia reduction removes the s-bend and slalom
      line loss.


      ### Rationale


      Iteration 4 (mass 0.5 kg, body_length 0.16 m, y 0.05 m, 12 mm footprints, 0.06
      m span, wheel_track 0.12 m, controller kp 3.0, kd 0.2, base_speed 1.5, last_direction)
      is the best design at 65.14. Iteration 5 showed that body_length 0.12 m lowered
      the score to 61.83, so the Builder correctly does not carry it forward. Mass
      0.7 to 0.5 kg gave a gain of about 2 points, and iteration 3 showed the forward
      offset does not remove the line loss. I take the Builder''s geometry exactly
      as proposed: mass 0.4 kg (the contract minimum), body_length 0.16 m, all other
      fields as in iteration 4. The controller is kept identical to iteration 4. Any
      gain or speed change would confound the mass test, and iteration 1 showed that
      raising kp and kd did not help. With no controller change, the score difference
      from iteration 4 can be attributed to mass alone. Expected result, as a prediction
      only: line losses on the s-bend and slalom fall toward 0.5 or below, max_error
      falls below 0.06 m, and the score rises above 65.14. If steering_oscillation
      rises above about 0.2, the robot is over-turning, so mass should return to 0.5
      kg.


      - [Open this output](iteration-6/entity1/versions/723f3a25ba864dea9830dc39cd083dce/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/0443ddb2fa234db0919db2bc2c0a9960/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-6bdfcf303ff311bb/payload.json)'
  - id: entityR1
    label: 'Next: mass then 8 mm'
    notes: 'Feedback sets the branches for the next race: if mass 0.4 kg fixes the
      line loss, test 8 mm footprints; if not, move to 8 mm footprints anyway; if
      oscillation rises above 0.2, return to 0.5 kg. Based on iterations 0 to 5 only.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. The controller
      is the iteration 4 controller unchanged, so the race isolates mass 0.5 to 0.4
      kg. Iteration 4 (65.14, best) had 1.0 line-loss event per run on the s-bend
      and slalom with max_error 0.0666 and 0.0678 m, and steering_oscillation of about
      0.13 to 0.14. Iteration 5 showed body_length 0.12 m lowered the score to 61.83
      with no change in line losses, so I would not carry it forward. Iteration 3
      showed the forward offset to y 0.07 m does not remove the loss. Read the next
      race by these branches. If line losses fall to 0.5 or below on the s-bend and
      slalom and the score exceeds 65.14, mass is still a useful lever, and the next
      test is sensor_size 0.008 m at the same geometry, since 0.012 m was best and
      0.016 m (iteration 2) scored lowest. If line losses stay at 1.0 with max_error
      still at or above 0.06 m, the yaw-inertia route is exhausted, and the next change
      should be sensor coverage at 0.008 m footprints, keeping mass at 0.4 kg. If
      steering_oscillation rises above about 0.2, the robot is over-turning, so return
      mass to 0.5 kg.


      ### Requested changes


      - If line_loss_events fall to 0.5 or below per run on the s-bend and slalom
      and the score exceeds 65.14, keep mass 0.4 kg and try sensor_size 0.008 m with
      the same five positions, because iteration 0 (0.012 m, 1.0 losses) and iteration
      2 (0.016 m, lowest score) suggest smaller footprints may sharpen the edge reading.

      - If line losses stay at 1.0 per run with max_error at or above 0.06 m, stop
      the yaw-inertia route and try sensor_size 0.008 m at mass 0.4 kg, since iteration
      4 at 0.5 kg and this race show mass alone does not remove the loss.

      - If steering_oscillation rises above 0.2 at mass 0.4 kg, return mass to 0.5
      kg, since the iteration 4 value (0.1344 on the s-bend, 0.1424 on the slalom)
      is the best-known level for that metric.


      - [Open this output](iteration-6/entityR1/versions/723f3a25ba864dea9830dc39cd083dce/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/0443ddb2fa234db0919db2bc2c0a9960/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-6bdfcf303ff311bb/payload.json)'
