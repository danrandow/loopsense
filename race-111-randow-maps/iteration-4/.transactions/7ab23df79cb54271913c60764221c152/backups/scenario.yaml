map:
  id: race-111-randow-maps
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Mass 0.5 kg, offset y
    notes: 'Returns the sensor offset to the best-scoring y = 0.05 m after y = 0.07
      m (iteration 3, 61.5) failed to reduce s-bend and slalom line losses. Changes
      mass alone from 0.7 to 0.5 kg to test yaw inertia against the iteration 0 baseline
      (63.0).


      ### Rationale


      Iteration 3 (y = 0.07 m) scored 61.5, below the iteration 0 best of 63.0. The
      forward offset did not remove the failure: s-bend and slalom still show 1.0
      line-loss events per run, and max_error is 0.0635 on the s-bend and 0.0675 on
      the slalom. Steering oscillation stayed near 0.13 to 0.15, so the extra lead
      did not cause jitter, but it also did not help. The oval got worse (84.8 vs
      89.8, line losses 1.5), and the slalom improved only slightly. The Integrator''s
      conditional rule (keep y = 0.07 m only if line losses fall below 0.5) is not
      met, so the forward offset is not the limit. I therefore return the sensor offset
      to the iteration 0 value of y = 0.05 m, which was the best-scoring setting.
      The next lever the Integrator named is mass, because yaw inertia is the remaining
      untested variable with a single change. Iteration 2 changed mass together with
      span, so its mass effect is unknown. I change only mass, from 0.7 kg to 0.5
      kg, and keep body_length at 0.16 m, wheel_track at 0.12 m, sensor span at 0.06
      m, sensor_size at 0.012 m and the iteration 0 controller. Expected yaw inertia
      falls by about 29 percent (0.7 to 0.5 kg with the same body). I expect line-loss
      events to stay near 1.0 or drop, with max_error nearer 0.06 m on the s-bend
      and slalom, and a score at or above the iteration 0 level of 63. If the score
      falls, mass reduction is not the fix, and the Integrator''s next option should
      be the body-length change.


      - [Open this output](iteration-4/entity0/versions/deaff96ec1964b349162b5fa44b1f029/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-e1f4bf3815d18458/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-79740b5881762133/payload.json)'
  - id: entity1
    label: Forward offset y=0.07
    notes: 'Iteration 0 geometry with the sensor offset moved to y=0.07 m and the
      iteration 0 controller held fixed. Chosen because iteration 0 was the best score
      (63.0) and the single line loss per run points to late anticipation.


      ### Rationale


      The Builder''s iteration 3 proposal changes one variable from the best-scoring
      design (iteration 0, score 63.0): the forward sensor offset moves from y=0.05
      m to y=0.07 m. Iteration 0 had 1.0 line-loss events per run on the s-bend and
      slalom and max_error of 0.062 to 0.066 m, so the failure is a single late line
      loss rather than jitter. Iteration 1 (kp 4.5, kd 0.3, base_speed 1.4, 0.10 m
      track) and iteration 2 (wider span, 0.5 kg, 0.12 m body) both scored lower,
      so I do not change the controller gains or the speed. I keep the iteration 0
      controller exactly (kp 3.0, ki 0, kd 0.2, base_speed 1.5, last_direction line
      loss, weights +1, +0.5, 0, -0.5, -1). This lets any change in score be attributed
      to the sensor offset. The geometry is passed through unchanged from the Builder:
      the five sensors sit at x = +0.03 to -0.03 at y = 0.07 m, with 12 mm footprints,
      0.7 kg mass, 0.16 m body length and 0.12 m track. The sensor order matches the
      weights. The observation request keeps the full set of measurements so the next
      race can show line-loss timing, max_error and steering oscillation. Expected
      result: earlier bend reading, fewer line losses, and possibly a higher score.
      This is a prediction only; the controller is not tuned for the new offset, so
      a flat or lower score would mean the offset is not the limit.


      - [Open this output](iteration-3/entity1/versions/b6ec88f943bb4717a19ce2f2cf3f37fd/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/645f8bfbb60f4245bcea9f663c5c80ee/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-a8547325c2799a90/payload.json)'
  - id: entityR1
    label: Offset-first feedback
    notes: 'Feedback asks the Builder to isolate the forward offset, citing iteration
      0 (best, 63.0) against iterations 1 and 2 (53.7, 46.5). It gives conditional
      next steps for line losses, max_error and oscillation.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Iteration
      0 (score 63.0, best so far) used the same controller I have kept: kp 3.0, kd
      0.2, base_speed 1.5, last_direction recovery, and linear weights. All 60 trials
      ended off track, with about 1.0 line-loss event per run on the s-bend and slalom
      and max_error 0.062 to 0.066 m. Iteration 1 (kp 4.5, kd 0.3, 0.10 m track, 0.6
      kg) scored 53.7, so higher gain and a narrower track did not help. Iteration
      2 (span ±0.04 m, 0.5 kg, 0.12 m body) scored 46.5, the lowest, and changing
      several variables at once made it impossible to tell which one hurt. So the
      sensor offset is the next variable to test, and the controller is held fixed.
      If the next race shows line-loss events falling below about 0.5 per run and
      max_error staying under 0.06 m for longer, keep y = 0.07 m and try sensor_size
      0.008 to sharpen the edge reading. If line losses stay at 1.0 per run with max_error
      still at or above 0.06 m, the forward offset is not the limit, and the next
      lever is mass (0.4 to 0.5 kg with body_length 0.12 m), since yaw inertia is
      the remaining untested variable with a single change. If steering_oscillation
      rises above about 0.2 with the forward offset, the extra lead is causing overshoot,
      so return y to 0.06 m rather than changing the mass.


      ### Requested changes


      - If line_loss_events fall below 0.5 per run with max_error under 0.06 m on
      the s-bend and slalom, keep sensor y = 0.07 m and try sensor_size 0.008 m to
      reduce blur at the sharpest bends (iteration 0 at 0.012 m had 1.0 line losses
      per run).

      - If line losses stay at 1.0 per run with max_error still at or above 0.06 m,
      try mass 0.5 kg with body_length 0.12 m, one change at a time, to cut yaw inertia;
      iteration 0 (0.7 kg) and iteration 2 (0.5 kg, span ±0.04 m) show that mass changes
      alone were not tested in isolation.

      - If steering_oscillation rises above about 0.2 with the y = 0.07 m offset,
      return y to 0.06 m, since the added lead may be causing overshoot; iteration
      0 showed steering_oscillation of 0.13 to 0.15 at y = 0.05 m.


      - [Open this output](iteration-3/entityR1/versions/b6ec88f943bb4717a19ce2f2cf3f37fd/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/645f8bfbb60f4245bcea9f663c5c80ee/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-a8547325c2799a90/payload.json)'
