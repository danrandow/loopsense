map:
  id: race-111-randow-maps
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Wider sensor span
    notes: 'This proposal widens the sensor span to ±0.04 m, restores the 0.12 m wheel
      track, and lowers mass to 0.5 kg with a 0.12 m body. Iterations 0 and 1 both
      ended off track after a single line loss with max_error at 0.062 to 0.066 m,
      and iteration 1 scored lower after several simultaneous changes, so this run
      isolates coverage.


      ### Rationale


      Evidence across iterations 0 and 1 (both 0 of 60 completions) shows the same
      failure. Max error reaches 0.062 to 0.066 m, just past the 0.06 m off-track
      limit, and line_loss_events sit at about 1.0 per run on the s-bend and slalom.
      Progress is low (0.10 to 0.23). The robot loses the tape once and then drifts
      off before covering the course. Iteration 1 scored worse than iteration 0 (53.7
      vs 63.0) after I changed wheel_track to 0.10 m, lowered mass and body length,
      moved the sensors forward and widened the footprint to 16 mm. Those changes
      did not help, and because I changed five things at once I cannot attribute the
      drop to any one of them. Two findings look solid. First, the off-track limit
      is max(0.06, 0.0125 + body_width/4), which is 0.06 m across the whole body_width
      range, so body width cannot help. Second, a single line loss is what starts
      the failure, which points at sensor coverage at the edge of the tape band. The
      sensor span of 0.06 m (about ±0.03 m) with 16 mm footprints only sees tape out
      to roughly ±0.05 m from the centre line. A robot that drifts to 0.055 m or more
      can therefore lose the tape completely. This iteration I keep the iteration
      0 drivetrain (wheel_track 0.12 m, since the narrower track did not improve the
      oval) and make two targeted changes. I widen the sensor span to ±0.04 m (x =
      ±0.04, ±0.02, 0) so the array still sees tape at larger lateral error, and I
      keep 16 mm footprints for that same coverage. I also reduce mass to 0.5 kg and
      body_length to 0.12 m to lower yaw inertia, which the Integrator''s feedback
      suggested as the next lever. The sensors stay at y = 0.06 m. Expected result:
      line_loss_events drop toward 0 on the s-bend and slalom, max_error stays under
      0.06 m for longer, and progress rises. This will show whether coverage or turn
      authority is the limit. If max_error still reaches 0.06 m with line losses at
      0, the drivetrain is the bottleneck and I will move to a narrower wheel_track
      next.


      - [Open this output](iteration-2/entity0/versions/d6a4b0ca0a3f4631bec770eff4e4d734/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-c3a870295d84e639/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-93df4ae590bdf229/payload.json)'
  - id: entity1
    label: Wider span, iter-0 gains
    notes: 'Builder''s wider sensor span and 0.5 kg body, with the iteration 0 controller
      restored (kp 3.0, kd 0.2, base 1.5). Iteration 1 scored 53.7 after raising gain
      and narrowing the track, versus 63.0 for iteration 0, so the gain change was
      reverted.


      ### Rationale


      Iteration 0 (kp 3.0, kd 0.2, base_speed 1.5, wheel_track 0.12) scored 63.0 and
      remains the best result. Iteration 1 (kp 4.5, kd 0.3, base_speed 1.4, wheel_track
      0.10) scored 53.7, so raising gain did not help and the narrower track looks
      like a step backwards. I therefore restore the iteration 0 controller in full
      and keep the Builder''s iteration 2 geometry unchanged: 0.12 m wheel track,
      0.5 kg mass, 0.12 m body length, five sensors at x = +0.04, +0.02, 0, -0.02,
      -0.04 and y = 0.06 m, with 16 mm footprints. The outer sensors now reach the
      tape at larger lateral error, so the existing linear weights (+1, +0.5, 0, -0.5,
      -1) still match the sensor order and the signal sign convention. Because the
      sensor spacing is now 0.02 m, the weights are applied as before, and I do not
      change them. The one controller change I make is to keep kd at 0.2 so that the
      lower yaw inertia does not add gain-driven oscillation. The race tests whether
      coverage, not gain, limits the robot.


      - [Open this output](iteration-2/entity1/versions/3b1f1568d38642149581ca37e3457709/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/d6a4b0ca0a3f4631bec770eff4e4d734/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-93df4ae590bdf229/payload.json)'
  - id: entityR1
    label: Coverage-first feedback
    notes: 'Feedback before racing: keep the wider span if line losses fall, and move
      to lower mass or body length if drift remains. It rests on iteration 0 (best,
      63.0, about 1.0 line losses per run) and iteration 1 (53.7 after higher gain).


      ### Feedback


      Written before this candidate has raced. Iteration 0 (63.0, the best so far)
      used kp 3.0, kd 0.2 and base_speed 1.5 with a 0.12 m track, and all 60 trials
      ended off track with max_error 0.062 to 0.066 m and line_loss_events of about
      1.0. Iteration 1 raised kp to 4.5 and narrowed the track to 0.10 m, and it scored
      lower (53.7), with the same failure pattern. So steering gain and track width
      did not fix the drift, and I have restored the iteration 0 controller so that
      only your geometry changes. If the next race shows line_loss_events falling
      to near 0 while max_error stays below 0.06 m for longer, keep this sensor span.
      If line losses persist at about 1 per run with max_error still reaching 0.06
      m, the sensor span was not the limit, and the next change should be to mass
      or body_length, since yaw inertia is the remaining lever. If steering_oscillation
      rises above about 0.2 with the lower mass, return wheel_track to 0.14 m to damp
      the turn rate.


      ### Requested changes


      - If line_loss_events drop below 0.5 per run on the s-bend and slalom, keep
      sensor x = ±0.04 and try sensor_size 0.012 m to reduce blur at the sharpest
      bends (iteration 0 showed 1.0 line losses per run at 0.012 m).

      - If line losses stay at 1.0 per run with max_error still at or above 0.06 m,
      try mass 0.4 kg and body_length 0.10 m to cut yaw inertia further, since iteration
      0 (0.7 kg) and iteration 1 (0.6 kg) both drifted off before covering the course.

      - If steering_oscillation exceeds 0.2 with the lower mass, return wheel_track
      to 0.14 m to slow the turn rate, since iteration 1 (narrow track, higher gain)
      showed no benefit from a faster turn.


      - [Open this output](iteration-2/entityR1/versions/3b1f1568d38642149581ca37e3457709/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/d6a4b0ca0a3f4631bec770eff4e4d734/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-93df4ae590bdf229/payload.json)'
