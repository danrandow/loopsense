map:
  id: race-111-randow-maps
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Body length 0.12 m test
    notes: 'Keeps the iteration 4 mass of 0.5 kg, which scored the best so far at
      65.1, and changes only body_length from 0.16 to 0.12 m. Iteration 4 still had
      1.0 line losses per run on the s-bend and slalom with max_error of 0.067 to
      0.068 m, which meets the Integrator''s branch for body_length.


      ### Rationale


      Iteration 4 (mass 0.5 kg, y 0.05 m, 12 mm footprints, 0.06 m span, body_length
      0.16 m) scored 65.14, the best so far. Mass reduction helped the score, but
      the failure remains: the s-bend and slalom still lose the line once per run,
      and max_error is 0.0666 and 0.0678 m, both above the 0.06 m off-track limit.
      The oval got worse (1.6 line losses), but the oval is not the binding constraint
      for the held-back tracks. The Integrator''s branch for this case is to hold
      mass at 0.5 kg and change body_length to 0.12 m alone. Iteration 2 changed body_length
      together with span and footprint, so its effect is unknown. This iteration isolates
      body_length. Going from 0.16 to 0.12 m lowers yaw inertia from mass*(0.16^2+0.12^2)/12
      to mass*(0.12^2+0.12^2)/12, a reduction of about 25 percent at the same mass.
      Span, footprint, sensor offset, wheel geometry, body width, and the controller
      (kp 3.0, kd 0.2, base_speed 1.5, last_direction recovery) stay unchanged. Expected
      result: line losses on the s-bend and slalom fall toward 0.5 per run or lower,
      max_error drops below 0.06 m for more of the course, and the score rises above
      65. If line losses stay at 1.0 with max_error still at or above 0.06 m, body
      length is not the limit and the next step is a sensor-coverage test. If steering_oscillation
      rises above about 0.2, the robot is over-turning, and mass or body length should
      move back toward the iteration 0 values.


      - [Open this output](iteration-5/entity0/versions/b019e0897d53479982ea2d7f12f23b55/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-bb34f3c06f33fdce/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-31c13a23f85e2997/payload.json)'
  - id: entity1
    label: Mass-only test, 0.5 kg
    notes: 'Keeps the iteration 0 controller exactly and changes only mass (0.7 to
      0.5 kg) from the best-scoring baseline, so the race isolates mass. Iterations
      1 to 3 showed that gain changes, footprint and offset did not help, so no controller
      change is made.


      ### Rationale


      The evidence is three races, all with 0 of 60 completions and every run ending
      off track. Iteration 0 (score 63.0, the best) had max_error of 0.062 to 0.066
      m and about 1.0 line-loss events per run on the s-bend and slalom, with steering_oscillation
      of only 0.13 to 0.15. The failure is one line loss followed by drift, not jitter.
      Iteration 1 showed that raising kp to 4.5 and kd to 0.3 on a 0.10 m track scored
      lower (53.7). Iteration 2 changed span, footprint, mass and body together and
      scored lowest (46.5). Iteration 3 moved the sensors to y = 0.07 m with the iteration
      0 controller and scored 61.5, so the forward offset did not remove the line
      loss. This iteration the Builder asks for mass 0.7 to 0.5 kg with everything
      else unchanged from iteration 0. The controller is therefore kept exactly at
      the iteration 0 values (kp 3.0, ki 0, kd 0.2, base_speed 1.5, last_direction,
      weights +1, +0.5, 0, -0.5, -1). No gain change is justified, because the only
      controller-gain test (iteration 1) was confounded with a narrower track and
      scored lower. Holding the controller fixed means any score change is attributable
      to mass, which is what the Builder is testing. The sensor offset is set to y
      = 0.05 m as the Builder requests, since iteration 3 showed the offset is not
      the limiting factor. Geometry values are passed through as proposed. Expected
      result: line losses near 1.0 or lower, max_error near 0.06 m, and a score near
      the iteration 0 level of 63. This is a prediction only.


      - [Open this output](iteration-4/entity1/versions/7ab23df79cb54271913c60764221c152/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/deaff96ec1964b349162b5fa44b1f029/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-79740b5881762133/payload.json)'
  - id: entityR1
    label: Mass test feedback
    notes: 'Explains that the controller is unchanged because iteration 0 is the best
      score and gain increases lowered it. Gives three branches tied to line-loss
      and oscillation evidence for the next race, and notes that iteration 2''s mass
      effect was confounded.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. The controller
      is the iteration 0 controller unchanged, because iteration 0 (63.0) remains
      the best score and iteration 1''s gain increase on a narrower track scored lower
      (53.7). So the race will test mass alone, as you intended. Iteration 0 showed
      all 60 trials ending off track with max_error 0.062 to 0.066 m, about 1.0 line-loss
      event per run on the s-bend and slalom, and steering_oscillation of only 0.13
      to 0.15. The robot therefore drifts after one line loss rather than jittering,
      and I had no need to change the gains to make this geometry work. Iteration
      3 (y = 0.07 m, scored 61.5) showed that forward offset does not remove the line
      loss, so y = 0.05 m is kept. Iteration 2 changed mass together with span, footprint
      and body length, so its mass effect cannot be separated and should not be read
      as a verdict on mass. Please read the next race by these branches: if line losses
      fall below about 0.5 per run on the s-bend and slalom without a score drop,
      mass is helping, and a sensor-footprint test is next. If line losses stay at
      1.0 per run with max_error at or above 0.06 m, mass alone is not the fix, and
      the next change should be body_length. If steering_oscillation rises above about
      0.2 with the lower mass, the robot is over-turning, so mass should return toward
      0.7 kg rather than adding gain.


      ### Requested changes


      - If line_loss_events fall below 0.5 per run on the s-bend and slalom and the
      score is at or above 63, keep mass 0.5 kg and try sensor_size 0.008 m (footprints
      8 mm) to sharpen the edge reading at the sharpest bends, since iteration 0 at
      12 mm had 1.0 line losses per run.

      - If line losses stay at 1.0 per run with max_error still at or above 0.06 m,
      keep mass 0.5 kg and try body_length 0.12 m alone, since iteration 2''s body
      change was confounded with span and footprint and cannot be attributed.

      - If steering_oscillation rises above about 0.2 with the lower mass, return
      mass to 0.7 kg, since iteration 0 (0.7 kg) showed steering_oscillation of only
      0.13 to 0.15 and the robot is then over-turning.


      - [Open this output](iteration-4/entityR1/versions/7ab23df79cb54271913c60764221c152/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/deaff96ec1964b349162b5fa44b1f029/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-79740b5881762133/payload.json)'
