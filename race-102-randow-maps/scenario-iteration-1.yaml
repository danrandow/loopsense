overrides:
  entities:
  - id: entity0
    label: Wider span, narrower
    notes: 'Sensor span widened to ±0.045 m and wheel track narrowed to 0.10 m to
      address the baseline''s off-track exits. The evidence is entityR2A: all 60 baseline
      trials went off track after about one line loss, with max_error at the 0.06
      m limit, while rms error stayed low.


      ### Rationale


      The development evidence (entityR2A) is the only race data so far, from the
      iteration 0 baseline. Every one of 60 trials went off track and none finished:
      progress was only 0.11 to 0.18, and each run had about one line-loss event.
      Tracking error is small while the robot is on the line (rms 0.021 to 0.030 m),
      but max_error sits at 0.061 to 0.063 m, just past the 0.06 m off-track limit.
      So the robot is not wandering; it drifts to the edge of the allowed band and
      loses the tape. Line loss means no sensor sees the tape. With sensors at ±0.03
      m and a 12 mm footprint, the array covers only about ±0.036 m, so once the robot
      is roughly 0.05 m off centre the tape falls outside every sensor, and the off-track
      limit at 0.06 m ends the run shortly after. Steering oscillation is low (0.11
      to 0.15), so the robot is not over-reacting; it is failing to recover in time.
      Body width cannot relax the limit, since max(0.06, 0.0125 + body_width/4) stays
      at 0.06 for any allowed width. The levers are sensing reach and turn authority.
      I widen the outer sensors to ±0.045 m with 22.5 mm steps, so the array still
      sees the tape at 0.05 to 0.06 m offset and the controller gets an earlier, larger
      signal. I narrow wheel_track from 0.12 to 0.10 m, which raises yaw rate for
      the same wheel differential (turn rate = wheel speed difference / wheel_track),
      so the robot can turn back before reaching the limit. I keep the 12 mm footprint,
      which is well inside the 25 mm tape, and keep mass 0.8 kg, because oscillation
      is not a problem. Expected result: fewer line-loss events, lower max_error,
      and the first completed runs on oval and s-bend. Slalom may still be hard. If
      line_loss_events stays at 1 with max_error near 0.06, the next step is turn
      authority: lower mass to about 0.6 kg to cut yaw inertia.


      - [Open this output](iteration-1/entity0/versions/51acde484f9f448d95e933d6ac0b85a3/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-a4574fb920eb6dc2/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-42f26c35e374429f/payload.json)'
  - id: entity1
    label: Wider sensors, narrow
    notes: 'Sensor span widened to ±0.045 m and wheel_track narrowed to 0.10 m, with
      baseline controller gains held fixed so the geometry effect reads cleanly. Based
      on iteration 0, where all 60 runs exited off track at max_error about 0.06 m
      with one line loss each.


      ### Rationale


      Baseline evidence (iteration 0, 60 trials, no finishes): every run ended off
      track after about one line loss. Progress was 0.11 to 0.18, max_error sat at
      0.061 to 0.063 m (just past the 0.06 m limit), and rms_error was low (0.021
      to 0.030 m). The robot is not wandering; it drifts to the edge of the allowed
      band and loses the tape. Steering oscillation was low (0.11 to 0.15), so the
      controller is not over-reacting. The binding constraints are sensing reach (the
      array only covered about ±0.036 m) and turn authority.


      Geometry follows the Builder''s intent, which I checked against the contract.
      Sensors move to x = -0.045, -0.0225, 0, 0.0225, 0.045 at y = 0.05. This keeps
      five sensors with 22.5 mm spacing and extends the reach to about ±0.051 m, so
      the tape stays visible at 0.05 to 0.06 m offset. wheel_track narrows to 0.10
      m, which raises yaw rate for the same wheel differential (turn rate = wheel
      speed difference / wheel_track) by about 20 percent. Footprint, body, mass and
      wheel radius stay unchanged so the next race reads the two changes cleanly.


      Controller: I keep the iteration 0 gains (kp 4.0, ki 0.2, kd 0.3), base_speed
      1.3 and last_direction recovery. Changing gains now would confound the geometry
      effect, and the evidence does not show a gain problem. Sensor weights stay at
      [-1, -0.5, 0, 0.5, 1]. Because the signal is a reading-weighted average of the
      weights, the same weights still map a line offset to a signal of the same sign
      and similar scale across the wider span. I added controller_errors and noise_robustness
      to the observation request so exceptions and noise sensitivity are visible.


      Expected result: fewer line-loss events, max_error below 0.05 m, and possibly
      the first completed runs on oval and s-bend. If line_loss_events stays at 1
      with max_error near 0.06, turn authority is the constraint and mass should drop
      to 0.6 kg next.


      - [Open this output](iteration-1/entity1/versions/68182eade15342989f809db4ec70830e/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/51acde484f9f448d95e933d6ac0b85a3/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-42f26c35e374429f/payload.json)'
  - id: entityR1
    label: Mass and span fallbacks
    notes: 'Feedback written before this robot has raced: if line losses persist,
      lower mass to 0.6 kg; if max_error stays near the limit, widen sensors to ±0.054
      m; then narrow wheel_track to 0.09 m. Each step is tied to the iteration 0 baseline
      (max_error 0.061 to 0.063 m, low oscillation, reach about ±0.036 m).


      ### Feedback


      Evidence from iteration 0 (60 trials, no finishes): every run ended off track
      after about one line loss. max_error sat at 0.061 to 0.063 m, just past the
      0.06 m limit, while rms_error stayed at 0.021 to 0.030 m and steering oscillation
      stayed low (0.11 to 0.15). The robot drifts to the edge of the band and loses
      the tape rather than wandering. The array reached only about ±0.036 m, so the
      tape left the sensors shortly before the limit. Integration work for this geometry:
      I kept the baseline gains (kp 4.0, ki 0.2, kd 0.3) and last_direction recovery,
      and I did not add any gain changes to compensate for the sensor geometry. The
      controller therefore depends on the sensor span and turn authority you set.
      Nothing has been measured for the current candidate. Next race, if line_loss_events
      falls to 0 and max_error drops below 0.05 m, the sensing reach was the binding
      constraint: keep the span and check completion on oval and s-bend. If line_loss_events
      stays at 1 with max_error near 0.06 m, turn authority is the constraint: reduce
      mass. If the robot finishes but progress is low or completion_time is long,
      the controller can add speed, so the geometry need not change.


      ### Requested changes


      - If line_loss_events stays at 1 with max_error near 0.06 m in the next race:
      reduce mass from 0.8 to 0.6 kg to lower yaw inertia (yaw inertia = mass*(L^2+W^2)/12),
      so the robot can turn back before reaching the 0.06 m limit. Iteration 0 showed
      the robot reaches the limit with low oscillation, so yaw response, not damping,
      is the constraint.

      - If max_error still reaches 0.05 m or more while line losses are gone: widen
      the outer sensors to x = ±0.054 with 0.027 m steps, keeping sensor_size 0.012
      m, so the tape stays in view further out. Iteration 0 showed the array reaching
      only about ±0.036 m, and the baseline failed at about 0.05 m offset.

      - If the next race shows turn authority still limiting (line losses present
      and max_error at the limit after mass 0.6 kg): reduce wheel_track to 0.09 m,
      which raises yaw rate per unit wheel differential further. The narrowing from
      0.12 to 0.10 m in this iteration is the first test of this lever, so the response
      to it is not yet known.


      - [Open this output](iteration-1/entityR1/versions/68182eade15342989f809db4ec70830e/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/51acde484f9f448d95e933d6ac0b85a3/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-42f26c35e374429f/payload.json)'
