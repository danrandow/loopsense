  id: race-184-opt-eval-muted
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: kd 1.5 damping test
    notes: 'Keeps the best design (iteration 6, score 909.8) and raises kd from 1.2
      to 1.5 to damp slalom entry transients. Kp was not lowered because iteration
      7 showed that kp 2.0 increased line loss and reduced slalom finishes.


      ### Rationale


      Evidence: the best design so far is iteration 6 (909.8): kp 2.25, kd 1.2, ki
      0, base 1.2, 16 mm sensors at x = ±0.03 m, mass 0.6 kg, body 0.14 m, wheel track
      0.14 m. Its oval (20/20 finishes, 2.05 s) and s-bend (20/20, 2.38 s) are solid.
      The slalom is the gap: 16/20 finishes, 4 off-track exits, 0.2 line-loss events
      per run, and rms 0.012 m. Iteration 7 showed that lowering kp to 2.0 hurt (856.1):
      slalom finishes fell to 11/20, and line-loss events rose to 0.6. So the slalom
      failures are not overshoot that a lower kp can fix. Less turn authority causes
      the robot to undershoot and lose the line. Iteration 6 also showed that raising
      kd from 0.9 to 1.2 helped, and steering oscillation is still low (about 0.26),
      so the loop is not jittering.


      Change: a single-variable change from iteration 6, raising kd from 1.2 to 1.5
      with kp held at 2.25. More derivative action should damp the entry into tight
      slalom bends, where the signal changes fastest, without changing the steady-state
      response. Iteration 6 is the reference, and the trend from kd 0.9 to 1.2 was
      positive. Geometry and base speed stay fixed to isolate the effect.


      Expected result: slalom finishes rise to 0.85 or higher and the slalom mean
      to about 850 or more, with oval and s-bend near iteration 6 values. Steering
      oscillation should stay below 0.35. Hypotheses: (H1) the slalom off-track exits
      come from fast entry transients, so more kd reduces them; (H2) if oscillation
      rises above 0.35 or control_effort jumps, kd has reached its useful limit and
      the next step is ki 0.1 with kd 1.2; (H3) if line_loss_events stay near 0.2
      on the slalom, the loss comes from the sensor footprint and the next change
      should be to 12 mm sensors or a wider spread. Measurements wanted per track:
      completion, progress, completion_time, rms_error, max_error, line_loss_events,
      steering_oscillation, control_effort and noise_robustness, to separate line
      loss from transient overshoot.


      - [Open this output](iteration-8/entity0/versions/91c7f4a6a73449e1becc38ec2253b669/payload.json)

      - Based on: [entityR2A](iteration-8/entityR2A/versions/carried-d535fb51a72b87f2/payload.json)'
  - id: entityR1
    label: Approve kd 1.5 step
    notes: 'Approved the single-variable change kd 1.2 to 1.5 at kp 2.25, the next
      step on the kd trend that took iteration 3 to iteration 6 (893.6 to 909.8).
      Lowering kp (iteration 7, 856.1) and raising it with a wider spread (iteration
      5, 887.7) both scored worse, so kd is the lever left to test.


      ### Feedback


      Written before this candidate has raced, so no outcome is claimed for it. The
      best raced design is iteration 6 (909.8): kp 2.25, kd 1.2, ki 0, base 1.2, 16
      mm sensors at x = ±0.03 m. The oval and s-bend finish 20/20 there. The slalom
      finishes 16/20 with 4 off-track ends, 0.2 line-loss events per run, and steering
      oscillation of 0.26, so the remaining gap is on the slalom. The kd trend has
      been positive: raising kd from 0.9 (iteration 3, 893.6, slalom 15/20) to 1.2
      (iteration 6, 909.8, slalom 16/20) helped without raising oscillation. Changing
      kp in either direction has been worse. Lowering kp to 2.0 at kd 1.2 (iteration
      7, 856.1) cut slalom finishes to 11/20 and raised line-loss events to 0.6. Raising
      kp to 3.0 with a wider spread (iteration 5, 887.7) cut slalom finishes to 14/20
      and raised control effort to 8.0. So kp 2.25 is near a local optimum, and kd
      is the lever still showing gain.


      The candidate is a clean single-variable change from iteration 6: kd 1.2 to
      1.5, with kp, base speed, ki, and geometry unchanged. It is valid against the
      contract and is the logical next step on the kd trend. Approve it now. A revision
      round would cost two runs for a change the evidence does not yet discriminate,
      and the race telemetry is more informative than another review.


      Read the next race this way. If the slalom finishes at 17/20 or more with steering_oscillation
      at or below about 0.3 and control_effort not jumping, keep kd 1.5 as the new
      reference. If steering_oscillation rises above 0.35 or control_effort jumps
      on any track, kd has passed its useful limit. Return kd to 1.2 and test ki 0.1
      with kd 1.2, since the integral term is the next untested knob. If slalom line_loss_events
      stay near 0.2 while off-track ends persist, the loss comes from the sensor footprint,
      not from damping. Then test 12 mm sensors (sensor_size 0.012) at the iteration
      6 spread.


      ### Requested changes


      - If steering_oscillation rises above 0.35 or control_effort jumps on any track
      at kd 1.5: set controller.kd back to 1.2 and try controller.ki 0.1, since iteration
      6 at kd 1.2 gave oscillation 0.20 to 0.26 and the integral term is still untested.

      - If slalom off-track ends persist with line_loss_events at about 0.2 and oscillation
      low: change geometry.sensor_size from 0.016 to 0.012 at the iteration 6 spread,
      since iteration 5''s wider spread did not reduce line loss (0.3 per run) and
      the 16 mm footprint may be the limit.

      - If the slalom finishes 17/20 or more with completion_time under 2.8 s: keep
      kd 1.5 and raise controller.base_speed from 1.2 to 1.25 in one step to recover
      time, since iteration 6 slalom finish times were about 2.50 s and the oval and
      s-bend have margin.


