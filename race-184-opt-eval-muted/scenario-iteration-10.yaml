  id: race-184-opt-eval-muted
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: kp 2.75 turn authority
    notes: 'Single-variable change from the best race (iteration 9, 917.5): kp raised
      from 2.5 to 2.75 to add turn authority on sharp slalom bends. The kp sweep (2.0
      to 2.5) showed slalom finishes and line loss improving as kp rose, while kd
      had saturated.


      ### Rationale


      Evidence: iteration 9 (kp 2.5, kd 1.2, ki 0, base 1.2, 16 mm sensors at x =
      -0.03 to +0.03 m, mass 0.6 kg, body 0.14 m, wheel track 0.14 m) is the best
      design so far at 917.5. Oval finishes 20/20 at 2.12 s and s-bend finishes 20/20
      at 2.35 s. The slalom finishes 17/20 with 3 off-track exits, 0.15 line-loss
      events per run, rms 0.012 m and steering oscillation 0.26. Slalom failures cost
      about 700 points each, so they are the main gap. The kp sweep on the slalom
      gave 11/20 finishes at kp 2.0 (line-loss 0.6), 16/20 at kp 2.25, and 17/20 at
      kp 2.5. Line loss falls as kp rises, which points to insufficient turn authority
      on the tightest bends rather than overshoot. kd has saturated (iteration 8 gave
      no gain at kd 1.5), and steering oscillation (0.26) and control effort (6.2
      on the slalom) still leave headroom. Change: a single-variable change, kp 2.5
      to 2.75, with every other value held from iteration 9. Expected result: slalom
      finish rate of 0.85 to 0.9 with a line-loss rate at or below 0.15, oval and
      s-bend close to iteration 9 (completion time about 2.1 to 2.4 s). Risk: steering
      oscillation and control effort rise with kp, and iteration 5 (kp 3.0 with a
      wider spread) had slalom control effort of 8.0; if oscillation exceeds about
      0.35 or the slalom drops below 0.85 finishes, the next step is to return to
      kp 2.5 and test ki 0.1 for drift, not more kp. Hypotheses: (H1) the remaining
      slalom off-track exits are a turn-authority limit, so kp 2.75 cuts them; (H2)
      oval and s-bend are unaffected because the per-cm gain is only slightly higher.
      Measurements wanted per track: completion, progress, completion_time, rms_error,
      max_error, line_loss_events, steering_oscillation, control_effort and noise_robustness,
      to see whether the slalom failures are line loss or overshoot.


      - [Open this output](iteration-10/entity0/versions/aba5e5649bcd412197adb484fa8de526/payload.json)

      - Based on: [entityR2A](iteration-10/entityR2A/versions/carried-c95107de2d24a4e8/payload.json)'
  - id: entityR1
    label: Approve kp 2.75 step
    notes: 'Approved a single-variable change from the best design (iteration 9, 917.5):
      kp 2.5 to 2.75, others held. The kp sweep at this spread (2.0 to 2.5 gave 11,
      16, 17 slalom finishes) shows turn authority is the slalom limit, while kd is
      saturated per iteration 8.


      ### Feedback


      Written before this candidate has raced, so no outcome is claimed for it. The
      best raced design is iteration 9 (917.47): kp 2.5, kd 1.2, ki 0, base 1.2, 16
      mm sensors at x = -0.03 to +0.03 m, mass 0.6 kg, body 0.14 m. Its oval (20/20,
      2.12 s) and s-bend (20/20, 2.35 s) are solid. The slalom (17/20, 3 off-track,
      0.15 line-loss events, rms 0.012 m, steering oscillation 0.26, control effort
      6.2) is the remaining gap. Slalom failures cost about 700 points each. The kp
      sweep at this spread points the same way: kp 2.0 gave 11/20 with 0.6 line-loss
      events (iteration 7), kp 2.25 gave 16/20 (iteration 6), and kp 2.5 gave 17/20
      (iteration 9), so turn authority is the limit, not overshoot. kd has saturated
      (iteration 8 at kd 1.5 gave no gain). The candidate is a single-variable change
      from iteration 9: kp 2.5 to 2.75, with every other value unchanged. It is valid
      against the contract and is the natural next step on the kp trend. Approve it,
      since it is a small, well-grounded change from the best design and an iteration
      with no approval is not scored.


      Read the next race this way. If slalom finishes are 18/20 or more with steering_oscillation
      at or below 0.3 and oval and s-bend still at 20/20, keep kp 2.75 as the reference.
      If steering_oscillation exceeds about 0.35, or slalom control_effort climbs
      well above iteration 5''s 8.0, kp has passed its useful limit: return to kp
      2.5 and try ki 0.1 for drift, not more kp. If slalom finishes drop below 17/20,
      return to kp 2.5 (the iteration 9 design, which scored 917.47). Check line_loss_events
      and max_error on any failing slalom run to tell line loss from overshoot.


      ### Requested changes


      - If slalom finishes reach 18/20 or more with steering_oscillation at or below
      0.3: keep kp 2.75 and kd 1.2 as the new reference, and consider a single base_speed
      step from 1.2 to 1.25 only if the slalom mean finish time stays under about
      2.5 s, since iteration 9 slalom finish time was 2.49 s.

      - If steering_oscillation rises above 0.35 or slalom control_effort jumps above
      about 8 at kp 2.75: return controller.kp to 2.5, keep kd 1.2, and try controller.ki
      0.1, since iteration 9 oscillation was 0.26 and iteration 5 (kp 3.0 on a wider
      spread) reached control effort 8.0.

      - If slalom finishes fall below 17/20 at kp 2.75: revert controller.kp to 2.5
      (the iteration 9 design, score 917.47), since iteration 6 at kp 2.25 gave 16/20
      and the lower-gain trend is worse.


      - [Open this output](iteration-10/entityR1/versions/63bbcf1063c145de866a1f0bffacb0ca/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/aba5e5649bcd412197adb484fa8de526/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-c95107de2d24a4e8/payload.json)'
