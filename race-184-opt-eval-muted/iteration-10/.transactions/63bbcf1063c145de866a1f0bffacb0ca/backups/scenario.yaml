map:
  id: race-184-opt-eval-muted
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: kp 2.75 turn authority
    notes: 'Single-variable change from the best race (iteration 9, 917.5): kp raised
      from 2.5 to 2.75 to add turn authority on sharp slalom bends. The kp sweep (2.0
      to 2.5) showed slalom finishes and line loss improving as kp rose, while kd
      had saturated.


      ### Rationale


      Evidence: iteration 9 (kp 2.5, kd 1.2, ki 0, base 1.2, 16 mm sensors at x =
      -0.03 to +0.03 m, mass 0.6 kg, body 0.14 m, wheel track 0.14 m) is the best
      design so far at 917.5. Oval finishes 20/20 at 2.12 s and s-bend finishes 20/20
      at 2.35 s. The slalom finishes 17/20 with 3 off-track exits, 0.15 line-loss
      events per run, rms 0.012 m and steering oscillation 0.26. Slalom failures cost
      about 700 points each, so they are the main gap. The kp sweep on the slalom
      gave 11/20 finishes at kp 2.0 (line-loss 0.6), 16/20 at kp 2.25, and 17/20 at
      kp 2.5. Line loss falls as kp rises, which points to insufficient turn authority
      on the tightest bends rather than overshoot. kd has saturated (iteration 8 gave
      no gain at kd 1.5), and steering oscillation (0.26) and control effort (6.2
      on the slalom) still leave headroom. Change: a single-variable change, kp 2.5
      to 2.75, with every other value held from iteration 9. Expected result: slalom
      finish rate of 0.85 to 0.9 with a line-loss rate at or below 0.15, oval and
      s-bend close to iteration 9 (completion time about 2.1 to 2.4 s). Risk: steering
      oscillation and control effort rise with kp, and iteration 5 (kp 3.0 with a
      wider spread) had slalom control effort of 8.0; if oscillation exceeds about
      0.35 or the slalom drops below 0.85 finishes, the next step is to return to
      kp 2.5 and test ki 0.1 for drift, not more kp. Hypotheses: (H1) the remaining
      slalom off-track exits are a turn-authority limit, so kp 2.75 cuts them; (H2)
      oval and s-bend are unaffected because the per-cm gain is only slightly higher.
      Measurements wanted per track: completion, progress, completion_time, rms_error,
      max_error, line_loss_events, steering_oscillation, control_effort and noise_robustness,
      to see whether the slalom failures are line loss or overshoot.


      - [Open this output](iteration-10/entity0/versions/aba5e5649bcd412197adb484fa8de526/payload.json)

      - Based on: [entityR2A](iteration-10/entityR2A/versions/carried-c95107de2d24a4e8/payload.json)'
  - id: entityR1
    label: Approve kp 2.5 probe
    notes: 'Approved kp 2.25 to 2.5 at kd 1.2, a single-variable change from the best
      raced design (iteration 6, 909.8). Kp 2.0 was worse (iteration 7) and kd 1.5
      gave no gain (iteration 8), so turn authority is the untested lever that the
      evidence points to.


      ### Feedback


      Evidence: iteration 6 (kp 2.25, kd 1.2, ki 0, base 1.2, 16 mm sensors at x =
      ±0.03 m, mass 0.6, body 0.14) is the best raced design at 909.8. Its oval (20/20,
      2.05 s) and s-bend (20/20, 2.38 s) are solid, and the slalom (16/20, 4 off-track,
      0.2 line-loss events, rms 0.012 m, oscillation 0.26) is the remaining gap. Iteration
      7 lowered kp to 2.0 and got worse (slalom 11/20, 0.6 line-loss events), so turn
      authority matters. Iteration 8 raised kd to 1.5 and gave no gain (907.6), so
      derivative damping looks saturated. The candidate is a single-variable change
      from iteration 6: kp 2.25 to 2.5 with everything else unchanged. It follows
      the evidence on turn authority, and kp 2.5 at this spread has not been tested
      directly. The iteration 5 result (kp 3.0 with a ±4 cm spread) is confounded
      by the spread change, so it does not rule kp 2.5 out. Nothing is claimed about
      how this candidate will perform.


      Read the next race this way. If slalom finishes reach 17/20 or more with line_loss_events
      at or below 0.2 and steering_oscillation at or below 0.3, keep kp 2.5 as the
      new reference. If slalom finishes fall below 16/20, or line_loss_events rise
      above 0.3, the proportional gain has passed its useful point and the next step
      is kp 2.25 with ki 0.1, which is the only knob untested. If steering_oscillation
      rises above 0.35 or control_effort jumps on any track, return to kp 2.25 and
      add ki 0.1 rather than raising kp further. If the slalom off-track exits persist
      at about 0.2 line-loss events whatever the gain, the footprint is the limit,
      so test 12 mm sensors at the iteration 6 spread.


      ### Requested changes


      - If slalom finishes fall below 16/20 or line_loss_events rise above 0.3: set
      controller.kp back to 2.25 and controller.ki to 0.1, since iteration 7 showed
      that lower kp hurts and ki has not been tried yet.

      - If steering_oscillation rises above 0.35 or control_effort jumps on any track
      at kp 2.5: return controller.kp to 2.25, keep kd 1.2, and try controller.ki
      0.1, since iteration 6 oscillation was 0.20 to 0.26 and iteration 8 showed kd
      1.5 adds nothing.

      - If slalom off-track exits persist with line_loss_events near 0.2 at any kp:
      change geometry.sensor_size from 0.016 to 0.012 at the iteration 6 spread (±0.03
      m, weights -2 to 2), since the wider spread in iteration 5 did not reduce line
      loss (0.3 per run).


      - [Open this output](iteration-9/entityR1/versions/a780aa3bac9f4bd3bf85b521e72b8c93/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/09acbc2dc42d476dadd304acae5eea00/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-4e984f50ea8be427/payload.json)'
