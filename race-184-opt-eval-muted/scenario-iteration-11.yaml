overrides:
  entities:
  - id: entity0
    label: 'Final: proven kp2.5'
    notes: 'Resubmits the iteration 9 design unchanged (kp 2.5, kd 1.2, base 1.2,
      16 mm sensors at ±3 cm), the best development score at 917.47. Iteration 10
      (kp 2.75) scored lower at 902.2, so no further change is justified for the final
      unseen-track race.


      ### Rationale


      Evidence: iteration 9 (kp 2.5, kd 1.2, ki 0, base 1.2, 16 mm sensors at x =
      -0.03 to +0.03 m, mass 0.6 kg, body 0.14 m, wheel track 0.14 m) is the best
      design so far at 917.47. Its oval finishes 20/20 at 2.12 s, its s-bend finishes
      20/20 at 2.35 s, and its slalom finishes 17/20 with 0.15 line-loss events per
      run. Iteration 10 raised kp to 2.75 and scored lower (902.2), with slalom finishes
      falling back to 16/20 and line-loss events rising to 0.35. So kp has passed
      its useful point, and kp 2.5 sits at the peak of the kp sweep. Iteration 8 showed
      kd is saturated (kd 1.5 gave no gain), and iteration 7 showed kp 2.0 loses too
      much turn authority. Decision: this is the final iteration and the final score
      is on an unseen track of different shape, so I am resubmitting the proven iteration
      9 design unchanged rather than testing a new variable. Geometry and gains are
      identical to iteration 9. Expected result: about 915 to 920 on the development
      tracks, with the slalom at 0.85 finishes or better. Hypotheses: (H1) the slalom
      residual failures are a turn-authority limit that kp 2.5 already mostly covers;
      (H2) the unseen track will show similar oval and s-bend performance, with its
      tightest bend deciding the outcome. Measurements wanted per track: completion,
      progress, completion_time, rms_error, max_error, line_loss_events, steering_oscillation,
      control_effort and noise_robustness, so the failure mode on any unseen track
      can be separated into line loss or overshoot.


      - [Open this output](iteration-11/entity0/versions/b48afd0c3f9543208dd7df2ce9304ad7/payload.json)

      - Based on: [entityR2A](iteration-11/entityR2A/versions/carried-718250a52e42f3b7/payload.json)'
  - id: entityR1
    label: 'Approve: best design'
    notes: 'Approves the iteration 9 design (kp 2.5, kd 1.2, 16 mm sensors at ±3 cm,
      score 917.47), the best raced result. Iteration 10''s kp 2.75 scored lower (902.2)
      and iteration 8''s kd 1.5 gave no gain, so no revision is justified in the final
      iteration.


      ### Feedback


      Approved. The candidate is the iteration 9 design unchanged: kp 2.5, kd 1.2,
      ki 0, base_speed 1.2, 16 mm sensors at x = -0.03 to +0.03 m, weights -2 to 2,
      mass 0.6 kg, body 0.14 m, wheel track 0.14 m, line_loss last_direction. Iteration
      9 is the best raced design at 917.47. Iteration 10 raised kp to 2.75 and scored
      lower (902.2), with slalom finishes back to 16/20 and line-loss events up to
      0.35, so kp has passed its useful point. Iteration 8 showed kd is saturated
      (kd 1.5 gave 907.6, no gain). Iteration 7 showed kp 2.0 loses turn authority
      (slalom 11/20, 0.6 line-loss events). Nothing new is tested here, so the result
      on the held-back track is not predicted. Because this is the final iteration,
      another review-and-revision round would risk the delivery, and no variant has
      beaten iteration 9 on the development tracks. The slalom off-track exits (3
      to 4 of 20, about 0.15 line-loss events per run) remain the main gap. If a later
      race is ever run on this design, check the failing runs for line_loss_events
      versus max_error to tell turn-authority loss from overshoot.


      ### Requested changes


      - No change for this final submission. Keep kp 2.5, kd 1.2, ki 0, base_speed
      1.2 and the iteration 9 geometry as raced (917.47).

      - For any future iteration: if slalom line-loss events are above 0.15 on an
      unseen track, test ki 0.1 at kp 2.5 before raising kp again, since iteration
      10 showed kp 2.75 is worse.


      - [Open this output](iteration-11/entityR1/versions/d29573db70104b6cb84e503bf24ef062/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/b48afd0c3f9543208dd7df2ce9304ad7/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-718250a52e42f3b7/payload.json)'
