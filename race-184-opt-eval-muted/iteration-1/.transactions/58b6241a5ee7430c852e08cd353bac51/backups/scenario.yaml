overrides:
  entities:
  - id: entity0
    label: Calmer steering, lower kp
    notes: 'Cut kp from 2.5 to 1.5, raised kd to 0.6, removed ki, and slowed base_speed
      to 1.3, with a wider track. Iteration 0 went off track on all 60 trials with
      steering oscillation of 0.10 to 0.14, which points to over-aggressive steering
      rather than speed alone.


      ### Rationale


      Evidence: all 60 development trials went off track on every track (0 finishes).
      Progress was only 0.24 on the oval, 0.17 on the s-bend and 0.12 on the slalom,
      with 1 to 2 line-loss events and steering oscillation of 0.10 to 0.14. The robot
      is failing from instability, not from speed alone. With kp = 2.5 and weights
      of +/-2, the turn command can reach about 5 units (about 1750 PWM of differential),
      which is far too aggressive. The result is overshoot and oscillation that carry
      the robot off the tape. Changes: (1) kp lowered from 2.5 to 1.5 so the largest
      turn is about 3 units, which should cut the overshoot. (2) kd raised from 0.2
      to 0.6 to damp the oscillation that remains. (3) ki set to 0 because the integral
      adds windup and lag on curves and the errors are small. (4) base_speed lowered
      from 1.5 to 1.3 so the robot has time to correct on the tighter slalom bends.
      This gives up some speed, so completion within 3 s is less likely, but staying
      on the line is the first requirement. (5) wheel_track widened from 0.12 to 0.14
      m, so each unit of turn produces a gentler change in turn rate. (6) Sensors
      moved to y = 0.05 m ahead to look a little further down the line, which should
      reduce lag. Sensor spread, weights, mass and body stay as in iteration 0 to
      keep the comparison clean. Expected result: several trials should now stay on
      track on the oval and s-bend, with steering_oscillation below 0.08 and at least
      some finishes on the oval. The slalom may still leave the track. Hypotheses
      to test next: (H1) lower kp removes the off-track failures, with progress rising
      above 0.5 on the oval; (H2) kd of 0.6 cuts steering_oscillation by about half;
      (H3) base_speed of 1.3 is too slow to finish within 3 s, so a later iteration
      must raise speed once stability holds. Measurements wanted: completion, progress,
      completion_time, rms_error, max_error, line_loss_events, steering_oscillation,
      and control_effort, to check whether the change in kp and kd is what made the
      difference.


      - [Open this output](iteration-1/entity0/versions/0eb0c44736e3430da054b2cc9e6cc6ae/payload.json)

      - Based on: [entityR2A](iteration-1/entityR2A/versions/carried-5236c8bcb97bfe77/payload.json)'
  - id: entityR1
    label: 'Baseline review: approve'
    notes: 'Iteration 0 has no race data, so the bar is validity and no obvious fault.
      All fields sit within contract ranges and the candidate is approved to race
      as the baseline. Follow-up changes are tied to the telemetry the race will report
      (completion, oscillation, completion time, line loss).


      ### Feedback


      This is the iteration 0 baseline, so there is no race telemetry yet and I make
      no claim about how it will perform. The candidate is valid against the contract:
      all sensor positions, the 12 mm sensor size, wheel geometry, mass and controller
      values sit inside their ranges, and line_loss ''last_direction'' is an allowed
      option. Its stated hypotheses are testable from telemetry: (1) that kp=2.5 with
      kd=0.2 keeps steering_oscillation low (no earlier race exists to confirm this);
      (2) that base_speed=1.5 is the highest speed that finishes in 3 s without line
      loss; (3) that line_loss_events stays at 0 with the five-sensor spread. The
      race will settle all three. Once the race reports, check these first: if completion
      is 0 on the slalom, or the run goes off track, the controller is too aggressive
      for that curvature; if steering_oscillation is high but the run completes, raise
      kd before touching kp; if completion_time is above 3 s with progress near 1,
      base_speed is too low; if line_loss_events is above 0, the sensor spread or
      line_loss setting is the next thing to change.


      ### Requested changes


      - If the slalom fails or steering_oscillation is high: raise controller.kd from
      0.2 to 0.35 and keep kp at 2.5, to damp the oscillation the baseline hypothesis
      predicts.

      - If completion_time exceeds 3 s with progress near 1 on the oval or s-bend:
      raise controller.base_speed from 1.5 to 1.7 only if the slalom completed cleanly
      in the same race; otherwise leave base_speed unchanged.

      - If line_loss_events is above 0 on any track: widen the sensor spread (for
      example x = -0.03 to 0.03 with sensor_weights scaled to -3 to 3, or keep the
      weights at the current scale) so the line stays under a sensor through bends.


      - [Open this output](iteration-0/entityR1/versions/7d0c13c569c0446094ff3a27004eb3da/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/a3da4a76535c4af6b78aacfa7fe28c4b/payload.json)'
