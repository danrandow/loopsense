map:
  id: race-206-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Lower gain, add integral
    notes: 'Cuts kp from 3.0 to 2.0, adds ki 0.3 to cancel the motor-mismatch bias,
      and lowers base speed to 1.3 and mass to 0.6 kg. Based on iteration 1: halving
      gain raised oval progress from 0.115 to 0.176, but every run still left the
      line near the 0.06 m limit.


      ### Rationale


      Evidence: iteration 1 (weights halved, kp 3, kd 0.6, base 1.4) still left the
      line in all 60 trials, with progress 0.04 to 0.18 and max_error about 0.061,
      just past the 0.06 m off-track limit. Halving the gain improved oval progress
      (0.115 to 0.176), so the loop is too aggressive, but the failure is still early
      in every track. rms_error is nearly identical across designs (about 0.03), which
      suggests a steady bias plus oscillation, not a single bad bend. The fixed left/right
      motor mismatch in the disturbance would produce a constant turn bias. With kp
      only, that bias leaves a steady offset of bias/(kp gain), and that offset is
      large enough to reach the 0.06 m limit. The control loop has no integral action
      to remove it.


      Changes: (1) kp reduced from 3.0 to 2.0, since the earlier change showed gain
      is the main driver of overshoot. The sensor-to-offset slope is about 31 per
      metre, so the proportional turn is about 62 per metre of offset. (2) ki set
      to 0.3 so the integral cancels the constant mismatch bias. The integral is limited
      to +/-2, so windup is bounded. (3) kd raised to 0.8 to damp the oscillation
      that a lower kp still allows. (4) base_speed reduced to 1.3 to reduce lateral
      slip and the time spent in each bend. Completion in under 3 s is unlikely at
      this speed, but a stable run to progress near 1.0 is worth far more than the
      current near-zero progress (about 250 points for progress alone). (5) mass reduced
      to 0.6 kg to lower yaw inertia, so the robot responds faster to steering commands.
      Sensor layout, weights, wheel_track 0.14 and wheel_radius 0.03 are unchanged,
      so the effect of the gain changes can be read directly from the race.


      Expected result: the robot should stay on the line through the bends, with max_error
      below about 0.05 m and no line-loss events. Progress should move well beyond
      0.2 on all three development tracks, and completion may be reached on the oval.
      If the run still goes off track, the next step is to lower kp to about 1.5 or
      raise ki.


      - [Open this output](iteration-2/entity0/versions/a716bffbb75648c8bfe07a226060d850/payload.json)

      - Based on: [entityR2A](iteration-2/entityR2A/versions/carried-fe4f0e4365092828/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Round-1 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-2/entityC1/versions/71d3db1514bb449e992d078870325203/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/a716bffbb75648c8bfe07a226060d850/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-fe4f0e4365092828/payload.json)'
  - id: entity1
    label: Lower kd, stronger ki
    notes: 'Cut kd from 0.8 to 0.2 to remove sensor-edge derivative kicks, and raised
      ki to 1.0 so the integral can cancel the motor-mismatch bias. base_speed was
      lowered to 1.2 to favour staying on the line. Evidence: all 120 prior trials
      left the line at max_error about 0.061 m with little oscillation.


      ### Rationale


      Evidence: across iterations 0 and 1, the robot left the line on every development
      track (60 trials each). max_error sat at about 0.061 m on all tracks, just past
      the 0.06 m limit, and rms_error was about 0.03 m throughout. steering_oscillation
      was small (0.06 to 0.14). Progress rose only on the oval (0.115 to 0.176), and
      stayed near 0.04 on the s-bend and slalom. Both gain levels failed in the same
      way, so gain alone is not the main cause.


      Critique: I accept most of it. (a) kd 0.8 is a real problem. A 0.5-unit signal
      step at a sensor edge gives about 0.5 x 100 x 0.8 = 40 turn units, so the derivative
      term is dominated by edge kicks. The evidence shows little oscillation for kd
      to damp, so I cut kd to 0.2, which is still a modest damper (about 10 turn units
      per edge step, with kd 0.1 in iteration 1 at about 5). (b) The integral is too
      weak at ki 0.3. A 0.1-unit steady bias gives only about 0.1 turn units in 3
      s. I raised ki to 1.0. The integral is capped at +/-2, so the maximum contribution
      is 2 turn units, which is bounded and large enough to matter against a constant
      motor mismatch. (c) The speed of 1.3 cannot finish a 4 to 5 m course in 3 s.
      I reduced base_speed to 1.2 so the robot spends less time in each bend and can
      hold the line. I am prioritising staying on the line over completion, since
      no design has yet finished a run.


      Rejected or deferred: I did not change mass (the 0.6 kg change had no calculated
      benefit). I reverted it to 0.8 kg to reduce the number of changes. I also kept
      wheel_track at 0.14, because changing it now would confound the gain comparison,
      and kp at 2.0, which is the only gain change I have not yet tested in isolation.
      The critique notes that the failure may be a start transient, since max_error
      is nearly identical across gains and tracks. I have not changed the start behaviour,
      but this revision tests it: if max_error stays at about 0.061 with the same
      timing of line loss, the cause is the start, not the gains, and the next revision
      should address initial alignment and line_loss handling.


      Changes from draft: kd 0.8 to 0.2, ki 0.3 to 1.0, base_speed 1.3 to 1.2, mass
      0.6 to 0.8. Sensor layout, weights, wheel_track and kp are unchanged.


      Expected result (hypothesis, not observed): max_error below 0.05 m, line_loss_events
      at most 1, and progress above 0.2 on the oval, s-bend and slalom. Completion
      is not expected. Decision rule: if rms_error rises while steering_oscillation
      stays low, the bias is not being removed and ki should go higher. If steering_oscillation
      rises, lower kp to about 1.5 first.


      - [Open this output](iteration-2/entity1/versions/a99f98eda0aa4936ababa13cf74bc651/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/a716bffbb75648c8bfe07a226060d850/payload.json),
      [entityC1](iteration-2/entityC1/versions/71d3db1514bb449e992d078870325203/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-fe4f0e4365092828/payload.json)'
