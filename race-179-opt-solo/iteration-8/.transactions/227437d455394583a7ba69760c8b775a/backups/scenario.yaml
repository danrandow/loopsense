  entities:
  - id: entity0
    label: Iter 6 base, speed 0.90
    notes: 'Reverts to the best design (iteration 6, score 866) and moves base_speed
      to 0.90 with kd back at 1.6. Iteration 7 showed that 0.95 with kd 2.0 caused
      reversal overshoot (slalom finishes fell to 10/20), while 0.85 left slalom timeouts
      close to 3 s. The intermediate speed is tested in isolation.


      ### Rationale


      Evidence. Iteration 6 (score 866.3, best so far: base_speed 0.85, mass 0.5,
      kd 1.6) finishes the oval (20/20, 2.06 s) and s-bend (20/20, 2.36 s). Its slalom
      finishes 13/20, with 6 off-track exits, 1 timeout and a mean finish time of
      2.98 s. Iteration 7 (score 839.7) raised base_speed to 0.95 and kd to 2.0. Slalom
      finishes fell to 10/20, all failures were off-track, and the slalom finishers
      were no faster (2.97 s). So the higher speed brought back reversal overshoot,
      and the kd change did not help. Iteration 5 to 6 showed that lower speed raised
      slalom progress, but at 0.85 the slalom finishers are only just inside 3 s,
      so the slalom is pinched between overshoot at high speed and timeout at low
      speed.


      Change: revert to iteration 6 and set base_speed to 0.90, midway between the
      two tested values, with kd back at 1.6. Everything else stays as in iteration
      6 (kp 3.5, ki 0.02, sensors at x = +/-0.05 and +/-0.025, y = 0.07, sensor_size
      0.016, mass 0.5, wheel_track 0.12, wheel_radius 0.03, body 0.12 x 0.18, line_loss
      last_direction). Only the speed moves, so the effect can be read directly, and
      kd is back at the value that gave the best oval and s-bend results.


      Expected result: slalom finish rate of about 0.6 to 0.75, slalom completion
      time about 2.9 s, oval and s-bend still 20/20, and a score near 860 to 890.
      The main risk is that 0.90 is still in the overshoot range and the slalom off-track
      count returns.


      Hypotheses: (a) slalom failure is a speed-dependent trade-off between reversal
      overshoot and the 3 s limit, so the optimum lies between 0.85 and 0.95; (b)
      kd 2.0 was the cause of the oscillation rise, not the speed; (c) if the slalom
      is still limited near 0.65 finish rate, the next lever is line-loss handling
      or sensor footprint, not speed.


      Measurements wanted next: per-track completion and completion_time (to check
      the 3 s budget on the slalom), slalom line_loss_events and max_error location,
      steering_oscillation, and control_effort.


