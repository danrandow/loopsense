  entities:
  - id: entity0
    label: Iter 3 design, speed 1.0
    notes: 'Reverts to the best-scoring iteration 3 design (697.4) and changes only
      base_speed from 1.2 to 1.0, aiming to let the robot make slalom reversals without
      losing the tape. Iteration 4''s regression, where raising kp, kd and spread
      cut slalom progress to 0.17, is the evidence against further steering-gain changes.


      ### Rationale


      Evidence: iteration 3 is still the best design (score 697.4). Its oval (20/20,
      1.84 s) and s-bend (20/20, 2.08 s) both finish cleanly. The slalom is the only
      failure: 20/20 off-track exits at mean progress 0.48, with one line-loss event
      per run and max_error at the 0.06 m limit. Iteration 4 tried to fix the slalom
      by raising kp 3.5 to 4.0, kd 1.6 to 2.0 and widening the sensor spread to +/-0.06.
      That made things worse: slalom progress fell to 0.17, s-bend finishes fell to
      16/20, and steering oscillation rose. So the extra steering gain and the wider
      spread are not the fix. The most likely limit is speed on the sharp slalom reversals:
      at base_speed 1.2 the robot carries too much momentum to turn the reversal and
      loses the tape. Change: revert to the iteration 3 controller and geometry (kp
      3.5, kd 1.6, ki 0.02, sensor spread +/-0.05 at y 0.07, sensor_size 0.016, mass
      0.6) and lower base_speed from 1.2 to 1.0. This is the only change, so its effect
      can be read directly. Time budget: the oval took 1.84 s at 1.2, so at 1.0 it
      should take roughly 2.2 s, and the s-bend roughly 2.5 s, both under the 3 s
      limit. The time term is small, so the score cost is limited. Expected result:
      slalom progress rises above 0.6 and some slalom runs finish, while the oval
      and s-bend keep 20/20 finishes. Hypotheses: (a) slalom exits are caused by overshoot
      at reversals at speed, not by steering authority; (b) if slalom progress does
      not improve at base_speed 1.0, the limit is sensor coverage at the reversal,
      and the next step is a sensor_size or spread change alone. Measurements to check
      next: per-track completion and progress, slalom line_loss_events, max_error
      location, completion_time on the oval and s-bend (to confirm the time budget),
      and steering_oscillation.


