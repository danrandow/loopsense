  entities:
  - id: entity0
    label: Wider sensors, more kd
    notes: 'Widened the sensor array to x = +/-0.05 m, moved it forward to y = 0.07
      m, raised kd to 1.4 and cut base_speed to 1.2. Iteration 1 finished the oval
      20/20 but failed the slalom 20/20 at progress 0.16, so the change targets sharp
      bends.


      ### Rationale


      Evidence from iteration 1 (kp 3, kd 0.9, base_speed 1.4, mass 0.6): the oval
      finished in 20/20 trials (mean score 955, finish time 1.78 s), so the steering
      loop works on gentle bends. The s-bend finished only 2/20 (18 off-track exits,
      progress 0.83). The slalom failed 20/20 at progress 0.16, with max_error at
      the 0.06 m off-track limit, rms 0.026 and steering oscillation of only 0.17.
      Low oscillation on the slalom points to under-correction on sharp direction
      changes rather than jitter. Iteration 0 (kd 0.3) failed everywhere, so the extra
      damping from kd helped. Off-track limit: max(0.06, 0.0125 + body_width/4), which
      is 0.06 for any allowed body_width, so body geometry cannot widen the margin.
      Changes: (1) sensor spread widened to x = +/-0.05 m, with sensors moved forward
      to y = 0.07 m. Wider spacing gives a more linear signal over larger offsets
      and earlier sight of the tape on sharp bends. (2) kd 0.9 -> 1.4 for more damping
      as the steering gain effectively rises with the wider sensor spread. (3) base_speed
      1.4 -> 1.2 to give more time to turn. The oval finished with about 1.2 s of
      headroom, and the slack should absorb the extra time (expected oval finish near
      2.1 s). kp stays at 3.0 and ki at 0.02 to keep the change set small. Expected
      result: s-bend completion rising toward most trials, and slalom progress beyond
      0.5. Hypotheses: (a) the slalom failure is sensor saturation and under-steering
      at direction changes; (b) higher kd with a wider sensor array will cut overshoot
      without slowing the oval past 3 s; (c) if the slalom still exits early, kp needs
      to rise, not fall. Next measurements: per-track progress and completion, max_error
      and where it occurs, line_loss_events, steering_oscillation and completion_time,
      to see whether the slalom is limited by steering authority or by speed.


