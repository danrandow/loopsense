  entities:
  - id: entity0
    label: Slower, lighter robot
    notes: 'Cuts base_speed 1.0 to 0.85 and mass 0.6 to 0.5 kg to reduce momentum
      and yaw inertia at the slalom reversals. Iteration 5 showed slalom progress
      rising as speed fell, while oval and s-bend times barely changed.


      ### Rationale


      Evidence: iteration 5 (score 732.8, best so far) finishes the oval (20/20, 1.86
      s) and s-bend (20/20, 2.10 s) cleanly. The slalom is still the failure: 18/20
      off-track exits, mean progress 0.62, one line-loss event per run, and max_error
      at the 0.06 m limit. Lowering base_speed from 1.2 to 1.0 raised slalom progress
      from 0.48 to 0.62 and cost almost no completion time on the oval or s-bend (the
      oval moved from 1.84 s to 1.86 s). So reversal speed and momentum are the main
      slalom limit. Change 1: base_speed 1.0 -> 0.85, to reduce momentum further at
      the reversals. Time check: the oval and s-bend barely slowed when speed dropped,
      so both should still finish well under 3 s. Change 2: mass 0.6 -> 0.5 kg. Yaw
      inertia scales with mass, so a lighter robot turns faster at the reversals,
      which the iteration-5 evidence points to as the bottleneck. Everything else
      is held at iteration 5 (kp 3.5, kd 1.6, ki 0.02, sensors at x = +/-0.05 and
      y = 0.07, sensor_size 0.016, wheel geometry, line_loss last_direction), so the
      effect of these two changes can be read directly. Expected result: slalom progress
      above 0.75 with fewer off-track exits, and some slalom finishes. The oval and
      s-bend should keep their 20/20 finishes. Risks: at lower speed the completion
      time may approach 3 s on the slalom, and a lower mass may change the drivetrain
      behaviour in ways I have not measured. Hypotheses: (a) slalom exits are still
      overshoot at reversals, so speed and inertia are the lever; (b) if slalom progress
      stalls near 0.6, the limit is sensor coverage at the reversal, and the next
      step is sensor footprint or spacing alone. Measurements wanted next: per-track
      completion_time (to test the 3 s budget), slalom line_loss_events and max_error
      location, steering_oscillation, and progress on each track.


