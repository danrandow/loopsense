  - id: entity0
    label: Best-known design, final
    notes: 'Resubmits iteration 10 unchanged (score 872.9), the best measured candidate:
      oval and s-bend 20/20, slalom 14/20. As the final iteration, no later race can
      verify a change, so a known design is the lower-risk choice for the unseen track.


      ### Rationale


      Evidence. Iteration 10 is the best measured design (score 872.9). Its oval finishes
      20/20 at 2.11 s (rms 0.005), and its s-bend finishes 20/20 at 2.51 s (rms 0.009).
      The slalom finishes 14/20 at a mean of 2.96 s, with 5 off-track exits and 1
      timeout. Narrowing the sensor spread from ±0.05 m to ±0.04 m (iteration 10)
      was the only change from iteration 6 (866.3). It raised the slalom finish rate
      from 13/20 to 14/20, lowered slalom rms (0.016 vs 0.020) and max error (0.039
      vs 0.044), and lowered oval and s-bend rms. The wider spreads at ±0.065 m (iteration
      9) and ±0.06 m (iteration 4) both regressed sharply, so the steering-gain trend
      runs toward narrower spreads, but I have only one measured point below ±0.05
      m.


      Decision: submit iteration 10 unchanged. This is the final iteration, so no
      later race can verify or recover from a regression. Each untested change (narrower
      spread, kp or kd retune, speed nudge) risks the 20/20 oval and s-bend results,
      and the unseen track is scored once with no fallback. The known design is the
      safest candidate for the final evaluation.


      Expected result: about 870 to 880 on the development tracks, matching iteration
      10. The slalom finish time (mean 2.96 s) remains the main risk on an unseen
      track.


      Hypotheses: (a) the slalom limit is steering authority at reversals combined
      with the 3 s time budget at base_speed 0.85; (b) narrower spread (±0.04 m) gives
      more signal per mm and reduces slalom off-track exits, so ±0.035 m is the next
      candidate if this result holds; (c) steering_oscillation (0.25 on oval, 0.27
      on s-bend) is acceptable, but a rise above about 0.3 would mean the effective
      gain is too high.


      Measurements wanted: per-track completion and completion_time (to check the
      slalom 3 s budget), slalom line_loss_events and max_error location, steering_oscillation
      and control_effort on all tracks, and rms_error. These would show whether the
      slalom limit is speed or steering.


