  entities:
  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'First candidate with no race data yet: five 12 mm sensors ahead of the
      axle, kp 4, kd 0.3, base_speed 1.6, last_direction line loss. Chosen from the
      contract''s limits and the 1.5 m/s pace target; it is a baseline to tune from
      the first race.


      ### Rationale


      Iteration 0 has no race telemetry, so this is a baseline design built from the
      contract. Speed: the course is about 4 to 5 m and must finish in under 3 s,
      so the robot needs roughly 1.5 m/s average. I chose base_speed 1.6 (about 80%
      of full PWM) to leave some headroom for turns. Sensors: five sensors spread
      across x = +/-0.04 m at y = 0.05 m (ahead of the axle, so they see the line
      before the wheels reach it), with 12 mm footprints so that a 25 mm tape is always
      partly covered at the outer sensors. Weights are antisymmetric, [1.0, 0.5, 0,
      -0.5, -1.0], so a positive signal (line on the left) steers left, as the contract
      requires. kp = 4 gives a moderate steering response (a signal of 0.5 produces
      a 700 PWM differential). ki is small (0.05) to avoid windup on curves. kd =
      0.3 damps the oscillation expected from a high kp. line_loss = last_direction,
      so the robot keeps turning toward the side it last saw the line when it drifts
      off. Geometry: wheel_track 0.12 m, wheel_radius 0.03 m, body_width 0.12 m (a
      wider allowed off-track margin), body_length 0.18 m, mass 0.8 kg (a moderate
      inertia, so the robot turns responsively without too much yaw). Expected result:
      completion on the oval and s-bend, with some oscillation on the slalom. Next
      I want RMS error, max error, line-loss events and steering oscillation to tune
      kp, kd and base_speed. Hypotheses: (1) kp is too low for the tighter bends,
      causing run-off; (2) kd is needed if the steering oscillates at higher speed;
      (3) base_speed of 1.6 may be too slow to finish in 3 s, or too fast for the
      sharpest bends.


      - [Open this output](iteration-0/entity0/versions/24bc9c3c431b4d7e96d185d26f63c650/payload.json)'
