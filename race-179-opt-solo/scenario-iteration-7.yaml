  entities:
  - id: entity0
    label: Speed 0.95, kd 2.0 tune
    notes: 'Raised base_speed from 0.85 to 0.95 to fix the slalom time budget (finishers
      averaged 2.98 s) and kd from 1.6 to 2.0 to damp the rise in slalom oscillation
      (0.27 to 0.37) caused by the lighter 0.5 kg mass. Based on iteration 6 telemetry,
      where the oval and s-bend stayed 20/20.


      ### Rationale


      Evidence from iteration 6 (score 866.3, best so far): the oval (20/20, 2.06
      s) and s-bend (20/20, 2.36 s) both finish cleanly. The slalom is the only failure:
      13/20 finish, 6 off-track exits, 1 timeout, mean progress 0.94, and 0.95 line-loss
      events per run. Two things changed in iteration 6 (base_speed 1.0 to 0.85 and
      mass 0.6 to 0.5), and they had mixed effects. Slalom progress rose from 0.62
      to 0.94 and finishes rose from 2 to 13. However, the mean finish time of the
      slalom finishers is 2.98 s, almost at the 3 s limit, so the robot is now too
      slow to finish reliably, and the timeout confirms this. Steering oscillation
      on the slalom also rose from 0.27 to 0.37, and control effort rose to 16.7,
      which suggests the lighter robot is jittering more. Change 1: base_speed 0.85
      to 0.95. This restores time margin on the slalom while keeping the lower reversal
      speed that gave the progress gain. Change 2: kd 1.6 to 2.0 to add damping against
      the higher oscillation seen with the lower mass. Kp, ki, sensor layout, sensor_size,
      mass and line_loss are unchanged, so the effect of these two changes can be
      read directly. Expected result: slalom finish rate of 14 to 17 out of 20, mean
      slalom finish time under 2.8 s, and slalom steering oscillation back near 0.3.
      The oval and s-bend should keep their 20/20 finishes. Risks: the higher speed
      may bring back reversal overshoot, and the higher kd may amplify sensor noise.
      Hypotheses: (a) the slalom timeouts and slow finishes are caused by speed being
      too low, so 0.95 should cut them; (b) the extra oscillation comes from the lighter
      mass and is damped by kd 2.0; (c) if off-track exits still dominate, the limit
      is reversal overshoot and the next lever is kp or line-loss search direction.
      Measurements wanted next: per-track completion and completion_time (to check
      the time budget), slalom line_loss_events, slalom max_error location, and steering_oscillation.


