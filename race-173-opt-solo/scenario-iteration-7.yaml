  entities:
  - id: entity0
    label: Faster, lighter robot
    notes: 'Raises base_speed to 1.1 and lowers mass to 0.6 kg from the iteration
      6 best. Slalom timeouts (7 of 20) and off-track exits show the robot is too
      slow and too inertial for the alternating bends, while the oval and s-bend finish
      reliably.


      ### Rationale


      Evidence from iteration 6 (score 733.1, best so far). Oval (942.8) and s-bend
      (931.0) both finish 20/20. Forward sensors at y=0.07 with kd 1.5 improved the
      slalom (progress 0.58 to 0.77), and s-bend oscillation fell (0.147). Control
      effort on the s-bend rose to 8.8, which is acceptable for now. The slalom is
      still the whole gap: 0/20 finished, with 13 off-track exits and 7 timeouts.
      The timeouts show the robot is now too slow for the 3 s limit on the tight alternations,
      not only losing the line. The oval finishes in 2.03 s, so there is little speed
      margin.


      Changes: (1) base_speed 1.0 to 1.1. This should cut the slalom timeouts and
      bring average speed closer to the roughly 1.5 m/s needed. The oval has time
      to spare, and the s-bend control effort is the main risk. (2) mass 0.8 to 0.6
      kg. Yaw inertia is mass*(L^2+W^2)/12, so this lowers the inertia the steering
      must overcome, and lower mass also gives faster acceleration from the same motor
      torque. Both should let the robot follow the alternating bends at the higher
      speed. Sensors, kp 2.0, ki 0, kd 1.5, wheel_track 0.11, wheel_radius and last_direction
      line loss are unchanged, so the only changes are speed and inertia.


      Expected result: slalom timeouts drop to near 0 and progress rises above 0.85,
      with a chance of the first slalom finishes. Oval and s-bend should stay near
      1.0 finish. Hypotheses: H1, slalom timeouts come from insufficient average speed,
      so base_speed 1.1 fixes them. H2, lower mass reduces the off-track exits by
      cutting yaw lag. Risks: higher speed may bring back off-track exits on the s-bend,
      and if s-bend control effort goes above 9 or oscillation above 0.2, the next
      step is to revert base_speed to 1.0 and keep the mass change. Next measurements:
      slalom completion_time and progress (to check the 3 s budget), slalom ended_by
      counts, and s-bend max_error and control_effort (to test speed-induced overshoot).


