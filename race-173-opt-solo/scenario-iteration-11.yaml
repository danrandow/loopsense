  - id: entity0
    label: 'Final: reverted to iter 8'
    notes: 'Returns to the best measured design (iteration 8, score 858.95), since
      iteration 10''s combined speed and kd change scored lower (833.4). Oval and
      s-bend finished 20/20 at this setting, which is the most reliable basis for
      the unseen-track race.


      ### Rationale


      This is the final iteration, so the design raced here is the one scored on the
      unseen track. I am returning to the best measured design, iteration 8 (score
      858.95), rather than making a further untested change.


      Evidence: iteration 8 finished 20/20 on oval (936.8) and s-bend (921.4), and
      12/20 on slalom (718.7, with 7 timeouts and 1 off-track). Iteration 9 raised
      base_speed to 1.25: slalom finishes fell to 11/20 and off-track exits rose from
      1 to 7, so the speed-overshoot trade-off is real. Iteration 10 (base 1.18, kd
      2.0) scored 833.4, below iteration 8. Two changes in one step gave a worse result,
      so the 1.18 and kd 2.0 combination is not an improvement. Iteration 8 is the
      only tested point with the full 20/20 finish on both the oval and s-bend, which
      matters most for an unseen track.


      Design (unchanged from iteration 8): five 16 mm sensors at y = 0.08 with x =
      -0.04 to +0.04 at 0.02 spacing; wheel_track 0.11, wheel_radius 0.03, body 0.12
      x 0.18, mass 0.5; base_speed 1.1, kp 2.0, ki 0, kd 1.8, weights [-2,-1,0,1,2],
      last_direction line loss.


      Hypotheses to check on the unseen race: H1, the unseen track is closer to the
      oval and s-bend, so the 20/20 finish behaviour carries over. H2, the slalom-style
      off-track and timeout failures, if they appear, are speed-limited (timeouts)
      rather than line-limited. Measurements: completion, progress, completion_time,
      max_error, line_loss_events, steering_oscillation and control_effort, so the
      next review can compare against the development tracks.


