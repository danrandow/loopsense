  entities:
  - id: entity0
    label: Faster base speed 1.25
    notes: 'Raises base_speed from 1.1 to 1.25 with geometry and gains unchanged from
      iteration 8. Slalom timeouts (7 of 20, mean time 2.96 s) show the binding limit
      is average speed, and the earlier speed rise removed timeouts in iteration 7.


      ### Rationale


      Evidence from iteration 8 (score 858.95, best so far). The oval finishes 20/20
      in 2.12 s and the s-bend 20/20 in 2.68 s. The slalom is now the only gap: 12/20
      finished, with 7 timeouts, 1 off-track exit, and a mean finish time of 2.96
      s against the 3.0 s limit. The timeouts are the main failure, and the slalom
      is speed-limited rather than line-limited. Iteration 6 to 7 showed the same
      pattern: raising base_speed 1.0 to 1.1 cut slalom timeouts from 7 to 0 while
      the off-track count fell. Plan: raise base_speed from 1.1 to 1.25. This should
      bring the slalom mean time well under 3 s and turn the timeouts into finishes.
      The oval (2.1 s) has ample margin, so the speed rise costs little there. Other
      changes: none. Geometry (sensors at y=0.08, x=±0.04 at 0.02 spacing, size 0.016,
      track 0.11, mass 0.5) and controller (kp 2.0, ki 0, kd 1.8, last_direction)
      stay as in iteration 8, so any shift is attributable to speed. Risks: s-bend
      control effort was 10.1 and line-loss events were 1.0 per run. A 14% speed rise
      may push the s-bend into overshoot and off-track exits. If s-bend off-track
      exits appear or control_effort exceeds 12, the next step is base_speed 1.18.
      Expected result: slalom finished count rising from 12 toward 15 to 18 out of
      20, mean slalom time below 2.7 s, oval and s-bend still near 20/20. Hypotheses:
      H1, slalom timeouts are caused by average speed, so higher base_speed converts
      them to finishes. H2, the extra speed raises s-bend max_error but stays under
      the 0.06 m limit. Next measurements: slalom finished count, completion_time,
      ended_by, and s-bend max_error and control_effort to test for speed-induced
      overshoot.


