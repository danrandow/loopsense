  - id: entity0
    label: Speed 1.18, kd 2.0 trial
    notes: 'Sets base_speed between the 1.1 and 1.25 races and raises kd to 2.0 to
      damp the faster slalom swings. Iteration 9 showed the slalom now failing on
      both timeouts and off-track exits, so the speed needs balancing rather than
      raising further.


      ### Rationale


      Evidence from iteration 9 (score 839.6, below the iteration-8 best of 859.0).
      Raising base_speed from 1.1 to 1.25 turned the slalom timeouts into finishes
      at the cost of off-track exits: slalom finished 11/20 (vs 12/20), off-track
      rose from 1 to 7, timeouts fell from 7 to 2, and mean slalom max_error rose
      to 0.042. Oval (938.8, 20/20) and s-bend (923.7, 20/20) are stable. So speed
      is no longer the only limit on the slalom: at 1.25 the robot overshoots and
      leaves the tape, while at 1.1 it runs out of time. The best operating point
      lies between them. Plan: set base_speed to 1.18 (about halfway between the two
      tested speeds) and raise kd from 1.8 to 2.0 to add damping against the larger
      swings that the higher speed produces. The s-bend control effort (about 10)
      and line-loss events (about 1 per run) are the main risk, and extra kd should
      help them. Geometry is unchanged (sensors at y=0.08, x=+/-0.04 at 0.02 spacing,
      size 0.016, track 0.11, body 0.12 x 0.18, mass 0.5, wheel radius 0.03), and
      kp 2.0, ki 0 and last_direction line loss are unchanged, so any shift is attributable
      to speed and kd. Expected result: slalom finished count 14 to 17 of 20 and mean
      slalom time under 2.9 s, with oval and s-bend still near 20/20, for a score
      of about 870 to 900. Hypotheses: H1, the slalom now fails on a mix of timeouts
      and off-track exits, and a speed near 1.18 balances them. H2, kd 2.0 reduces
      slalom max_error and s-bend line-loss events without slowing the robot enough
      to cause timeouts. Next measurements: slalom finished count, ended_by split
      (timeout vs off_track), slalom completion_time and max_error, and s-bend line_loss_events,
      max_error and control_effort. If slalom off-track exits still dominate, the
      next step is a higher kd (about 2.3) at the same speed. If timeouts dominate,
      the next step is base_speed 1.22.


