  entities:
  - id: entity0
    label: Iter 2 array, larger
    notes: 'Returns to the best-measured sensor layout (iteration 2, score 671) and
      changes only sensor_size to 0.016 and kd to 1.0. Iteration 3''s regression (score
      579) came from several simultaneous changes, so this targets slalom line loss
      while keeping the s-bend steering gain unchanged.


      ### Rationale


      Evidence from iteration 3 (score 578.6, down from the best 671.3 in iteration
      2). The oval is solved in every iteration from 1 onward. The s-bend got worse:
      finishes fell from 19/20 to 12/20, control effort rose from 4.6 to 8.2 and steering
      oscillation rose from 0.37 to 0.31 (the oscillation figure is not directly comparable
      across designs). The slalom is still a total failure in all 20 trials, with
      progress 0.18 to 0.36 and about one line-loss event per run. Its max_error sits
      at the 0.06 m off-track limit, which body_width cannot change. Iteration 3 changed
      three things at once (wider array to ±0.06, sensor_size 0.012 to 0.016, kp 2.0
      to 2.5), so the regression cannot be attributed to any one of them. Its high
      control effort on the s-bend points to over-steering from the higher kp and
      the wider, less-sensitive array. Plan: return to the iteration-2 geometry, which
      was the best measured layout (x ±0.04 at 0.02 spacing), and change only the
      two levers that address the slalom''s line loss. (1) sensor_size 0.012 to 0.016
      keeps more tape under each footprint at a given lateral offset, so the sum stays
      above the 0.05 line-loss threshold for longer. The array spacing is unchanged,
      so the signal slope that the s-bend depends on is preserved. (2) kd 0.8 to 1.0
      adds damping against the quick side-to-side signal changes in the slalom and
      s-bend, which should reduce overshoot. kp stays at 2.0, ki at 0 and base_speed
      at 1.0 so the oval and s-bend behaviour is otherwise unchanged. Expected result:
      slalom line losses drop and progress rises above 0.36, the oval stays near 1.0
      progress, and the s-bend finish rate holds at or above 0.95. Hypotheses: H1,
      slalom failure is caused by line loss at large lateral offsets, which the larger
      footprint should reduce. H2, the s-bend jitter comes from too little derivative
      damping, which kd 1.0 should reduce. Next measurements: per-track line_loss_events,
      max_error and progress, so I can tell whether the sensor-size change or the
      kd change drove the result. If the slalom still exits the line at max_error
      near 0.06, the next step is a lower base_speed on the slalom path or a higher
      kd.


