  entities:
  - id: entity0
    label: Wider sensors, slower, kd
    notes: 'Widens the sensor array to +/-0.04 m, lowers base_speed to 1.0 and raises
      kd to 0.8 to cut line loss and off-track exits on the s-bend and slalom. The
      evidence is iteration 1: the oval finishes 20/20, but the s-bend and slalom
      fail mostly by off-track exit, and the body-width limit cannot help.


      ### Rationale


      Evidence from iteration 1 (score 490.9): the oval is solved (20/20 finished,
      max_error 0.027, progress 0.997). The s-bend fails by off-track exit in 15 of
      20 trials (progress 0.76, max_error 0.057). The slalom fails in 20 of 20 trials
      at progress 0.18, with about one line-loss event per run and max_error 0.062.
      The off-track limit is max(0.06, 0.0125 + body_width/4). Even at the maximum
      body_width of 0.18 the limit is 0.0575, so it stays at 0.06 m. Body width cannot
      buy margin, so the fix has to come from keeping the tape centred. The slalom''s
      near-immediate line loss suggests the sensors lose the tape at bends. The outer
      sensors at x = +/-0.03 only see the tape within about 0.0185 m of their centre,
      so a larger lateral error drops the sum below 0.05 and triggers search. Changes:
      (1) Widen the sensor array to x = -0.04 to +0.04 at 0.02 spacing, so the line
      is still detected at larger offsets and line losses fall. (2) Lower base_speed
      from 1.1 to 1.0. The oval has spare time (1.9 s against a 3 s limit), and slower
      entry into the slalom and s-bend corners should cut lateral overshoot. (3) Raise
      kd from 0.5 to 0.8 to damp the faster signal changes at the wider sensor spacing.
      (4) Keep kp at 2.0 and ki at 0 so the oval result is not disturbed. Expected
      result: fewer line-loss events and off-track ends on the s-bend and slalom,
      with progress on those tracks rising well above 0.76 and 0.18. Oval should stay
      near 1.0 progress, with a small time cost. Hypotheses: H1, line loss on the
      slalom comes from the sensor array being too narrow for the lateral error at
      bends. H2, base_speed is the main driver of max_error on the s-bend. Next measurements:
      per-track max_error, line_loss_events and progress, so I can tell whether widening
      the array or slowing down drove the change.


