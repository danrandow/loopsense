  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'First candidate: five 12 mm sensors at 0.02 m spacing, proportional-derivative
      steering with kp 2.5 and kd 0.2, base speed 1.3, and last-direction line recovery.
      Chosen from the contract ranges, not from race data, since none exists yet.


      ### Rationale


      Iteration 0 has no race telemetry, so this is a conservative baseline built
      from the contract. Sensors: five 12 mm sensors (smaller than the 25 mm tape,
      so the readings stay informative) spaced 0.02 m apart across x = -0.04 to +0.04,
      placed 0.05 m ahead of the axle so steering reacts before the wheels reach the
      bend. Weights follow x/0.02, so the signal is negative when the tape is on the
      right and positive when it is on the left, matching the steering convention.
      Gains: kp = 2.5 gives a moderate steering response, ki = 0 avoids integral windup
      on bends, and kd = 0.2 damps oscillation. base_speed = 1.3 (about 65% of the
      PWM ceiling) aims for the roughly 1.5 m/s average the 3 s limit needs while
      leaving headroom for turns. line_loss = last_direction so the robot keeps searching
      toward the side it last saw the tape. Geometry: 0.12 m track, 0.03 m wheels,
      0.12 m body width (wider body allows more off-track margin), 0.18 m body length,
      0.8 kg mass. Expected result: completes the oval and s-bend with few line losses;
      slalom and speed may expose too much or too little gain. Next measurements:
      completion_time and max_error will show whether speed or steering is the binding
      limit, and steering_oscillation will show whether kp or kd needs changing.


      - [Open this output](iteration-0/entity0/versions/556953fa2e39462b9dc7374e21044e0e/payload.json)'
