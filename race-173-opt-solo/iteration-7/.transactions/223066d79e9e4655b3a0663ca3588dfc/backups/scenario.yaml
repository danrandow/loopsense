  entities:
  - id: entity0
    label: Forward sensors, kd 1.5
    notes: 'Moves the sensor array 2 cm forward (y 0.05 to 0.07) for earlier steering
      on the slalom and raises kd from 1.3 to 1.5 to damp the faster signal changes.
      Based on iteration 5 (score 712.7), where slalom reached progress 0.58 but never
      finished and was the only gap.


      ### Rationale


      Evidence from iteration 5 (score 712.7, best so far): oval (951.8) and s-bend
      (944.8) both finish 20/20, but slalom finishes 0/20 (off-track 20, progress
      0.58, max_error 0.061, about 1 line-loss event per run). The slalom is the entire
      remaining gap. Iterations 2 to 5 show that the sensor footprint (0.016) and
      extra kd (1.0 to 1.3) each gave small gains on slalom progress (0.36 to 0.55
      to 0.58) without hurting the other tracks. Those levers appear to be saturating.
      The slalom''s failure is a lag problem: the sensors sit 0.05 m ahead of the
      axle, so the controller reacts only after the robot has drifted to the 0.06
      m limit on each alternating bend. Change 1: move all five sensors forward from
      y = 0.05 to y = 0.07, giving about 2 cm more look-ahead so steering starts earlier
      on tight alternations. The x layout and weights are unchanged, so the signal
      scale is preserved. Change 2: raise kd from 1.3 to 1.5 to damp the faster signal
      changes that the earlier sensing produces. kp 2.0, ki 0, base_speed 1.0, wheel_track
      0.11, last_direction line loss and the rest of the geometry are unchanged, so
      oval and s-bend should stay near their current finish rates. Risk: the look-ahead
      gain may over-steer on the s-bend (control effort was 5.3 at iteration 5). If
      s-bend control effort rises above 6.5, or oscillation rises above 0.3, the next
      step is to revert the sensor y to 0.05 and keep kd at 1.5. Expected result:
      slalom progress above 0.7, slalom max_error below 0.055, and a chance of the
      first slalom finishes. Hypotheses: H1, slalom off-track exits are caused by
      late reaction to the tape, which the forward sensors should reduce. H2, the
      extra kd damps the overshoot that the earlier sensing introduces. Next measurements:
      per-track progress, max_error, line_loss_events and completion_time on slalom
      (to check the 3 s limit at base_speed 1.0), and control_effort and steering_oscillation
      on s-bend to test for over-steering.


