map:
  id: race-178-opt-eval
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Revert kp 2.0, sensor
    notes: 'kp 1.6 scored 51.2, well below the kp 2.0 best (75.8), so kp is reverted
      to 2.0 and the only change is sensor_size 0.012 to 0.016 at the same x positions.
      This tests whether the 12 mm footprint leaves the outer sensors blind before
      the off-track limit, as the Evaluator''s fallback branch proposed.


      ### Rationale


      Evidence. Iteration 6 lowered kp from 2.0 to 1.6 and scored 51.18, a large fall
      from the iteration 5 best of 75.78. Progress dropped on every track (oval 0.29
      to 0.115, s-bend 0.153 to 0.150, slalom 0.108 to 0.108), and the oval fell hardest.
      The kp trend therefore turned over: kp 2.0 is the best raced gain, and the monotonic-trend
      assumption from the iteration 6 rationale is rejected. Every run still ends
      off track with one line-loss event and max_error about 0.062 to 0.067 m, above
      the 0.06 m limit. Oscillation stays low (0.08 to 0.16), so the robot drifts
      to an edge rather than weaving. Gain changes have now been tried at 1.6, 2.0,
      2.5, and sensor span and speed have been varied, with no change to the one-loss-per-run
      failure.


      Change. I revert kp to 2.0 (the iteration 5 design, 75.78) and keep everything
      else identical: base_speed 1.0, ki 0.3, kd 0.1, search_right, sensor weights,
      and sensor x positions at -0.04, -0.015, 0, 0.015, 0.04. The only change is
      sensor_size from 0.012 to 0.016. This follows the fallback branch the Evaluator
      and iteration 6 both named. With a 16 mm footprint, edge sensors should keep
      seeing tape to a larger lateral offset, and the readings should be less blind
      near the edge before the 0.06 m limit. The sensor layout is otherwise unchanged,
      so the effect can be attributed to footprint size.


      Expected result. Progress should match or exceed iteration 5 (oval about 0.29,
      s-bend about 0.15, slalom about 0.11). line_loss_events may fall, and max_error
      may drop below 0.06 m if the edge is reached because the outer sensors lose
      the tape too early. If progress falls or the signal becomes noisy, revert to
      sensor_size 0.012.


      Hypotheses. H9: the 12 mm footprint leaves the outer sensors blind before the
      off-track limit, and the 16 mm footprint extends detection range. H10: the kp
      optimum sits near 2.0 at this speed and sensor geometry. Measurements wanted:
      progress, max_error, line_loss_events and steering_oscillation per track, plus
      whether the loss point moves along the course.


      - [Open this output](iteration-7/entity0/versions/cde3d30657874dde8cb5dfdeedef2f25/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-5481e2466c1a696e/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-8a1d99630189d5c7/payload.json)'
  - id: entityR1
    label: Approve kp 1.6 step
    notes: 'Approves the iteration 6 candidate: iteration 5 geometry and controller
      with kp lowered from 2.0 to 1.6. Progress rose monotonically as kp fell from
      2.5 to 2.0 (scores 57.6 to 75.8), and this is a single-variable continuation
      of that trend.


      ### Feedback


      Written before this candidate has raced. The candidate keeps the iteration 5
      geometry, base_speed 1.0, ki 0.3, kd 0.1, sensor weights and search_right, and
      lowers kp from 2.0 to 1.6. Iteration 5 (kp 2.0) is the best raced design at
      75.779. Against iteration 4 (kp 2.5, otherwise identical), progress rose on
      every track: oval 0.21 to 0.29, s-bend 0.126 to 0.153, slalom 0.084 to 0.108.
      Every run still ended off track with one line-loss event, and max_error stayed
      at about 0.063 to 0.067 m, above the 0.06 m limit. Oscillation stayed low (0.14
      to 0.16), so the failure is a drift to an edge, not weaving. This is a clean
      single-variable step along the kp trend, and the candidate is valid and not
      obviously broken. Approve it so the race can confirm or reject the trend. Read
      the result this way. (1) If progress rises again on the oval, s-bend and slalom,
      and line_loss_events does not rise, keep kp near 1.6 and test the sensor geometry
      next (sensor_size 0.016 at the same x positions). (2) If progress falls, or
      line_loss_events rises, revert to kp 2.0 (the best raced design) and test the
      sensor geometry from there. (3) If max_error stays near 0.063 m on every track
      whatever kp does, proportional gain is not the limiter, and the next lever is
      the sensor span or sensor_size, not more gain changes.


      ### Requested changes


      - Race as written. If progress rises on all three tracks with no added line-loss
      events, keep kp 1.6 and change only sensor_size from 0.012 to 0.016 (same x
      positions), since kp 2.5 to 2.0 to 1.6 has moved progress monotonically.

      - If progress falls or line_loss_events rises at kp 1.6, revert kp to 2.0 (iteration
      5, 75.779) and change only sensor_size to 0.016 at the same x positions, to
      test whether the edge is reached because the outer sensors lose the tape too
      early.

      - If max_error stays near 0.063 m on every track whatever kp does, stop tuning
      gains and test the sensor span (outer sensors at x = plus or minus 0.05 m, with
      the 12 mm footprint or the 16 mm footprint).


      - [Open this output](iteration-6/entityR1/versions/9c93e47a8c3842e796b23bd0a551029b/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/7dcf996a4f214efca416bb2627972d8d/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-9cc42b3f03ddbf20/payload.json)'
