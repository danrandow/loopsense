overrides:
  entities:
  - id: entity0
    label: Banked iter-5 design
    notes: 'Reproduces the best raced design (iteration 5, 75.779, confirmed in iteration
      10) with no field changed. Every single-field change tested since has lost score,
      and this is the final iteration, so the known-best design is kept for the unseen-track
      race.


      ### Rationale


      Evidence: iteration 5 (kp 2.0, ki 0.3, kd 0.1, base_speed 1.0, search_right,
      sensors at x = -0.04, -0.015, 0, 0.015, 0.04 with y = 0.05, sensor_size 0.012)
      is the best raced design at 75.779. Iteration 10 reproduced it exactly, so the
      design is confirmed as the base. Every single-field change tested since then
      has lost score: kp 1.6 gave 51.18, sensor_size 0.016 gave 60.12, kd 0.2 gave
      69.03, and base_speed 1.1 gave 51.33. Every run ends with one line-loss event
      and max_error of about 0.062 to 0.067 m, above the 0.06 m limit, with low oscillation,
      so the failure is a slow drift to one edge.


      Change: none. I reproduce the iteration 5 design unchanged. This is the final
      iteration, so no later race can use what this race shows. An untested lever
      such as the wider sensor span (H14, outer sensors at x = plus or minus 0.05
      m) could raise or lower the score, and it cannot be checked by a review run,
      because only the race itself reveals it. Since the final unseen-track race is
      scored, I keep the design that has the best measured result across development
      tracks.


      Expected result: about 75.8 on the development tracks, with progress near oval
      0.29, s-bend 0.15 and slalom 0.11, and one line-loss event per run. Hypotheses
      to check on the race: (1) if the score matches 75.8, the run is deterministic
      and the design is reproduced; (2) if the score differs, the run is not deterministic,
      and that should be noted before any future change. Measurements wanted: progress,
      max_error, line_loss_events and steering_oscillation per track, and whether
      the line-loss point moves along the course.


      - [Open this output](iteration-11/entity0/versions/b2877bfb00c64ebe98e04e0a5a5cd5d3/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-4f7b752db082c063/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-9cc42b3f03ddbf20/payload.json)'
  - id: entityR1
    label: Approve best design
    notes: 'Approved the iteration 5 design unchanged because it is the best raced
      design (75.779) and iteration 10 reproduced it exactly. Every single-field change
      tested since then lost score, and this final iteration leaves no room for a
      revision to be tested before the race.


      ### Feedback


      Written before this candidate has raced. This is the iteration 5 design, reproduced
      unchanged: kp 2.0, ki 0.3, kd 0.1, base_speed 1.0, search_right, sensor weights
      [-2,-1,0,1,2], sensors at x = -0.04, -0.015, 0, 0.015, 0.04 (y = 0.05), sensor_size
      0.012. It is the best raced design at 75.779 (iteration 5), and iteration 10
      reproduced that score exactly, so the design is confirmed. Every single-field
      change tested since then lost score: kp 1.6 gave 51.18 (iteration 6), sensor_size
      0.016 gave 60.12 (iteration 7), kd 0.2 gave 69.03 (iteration 8), and base_speed
      1.1 gave 51.33 (iteration 9). Every run ends with one line-loss event and max_error
      of about 0.062 to 0.067 m, above the 0.06 m limit, with low steering oscillation,
      so the failure is a slow drift to one edge, not weaving. The untested sensor
      span (H14) is the only lever left with any logic behind it, but it cannot be
      checked without racing, and this is the final iteration, so a revision would
      cost two runs and gain no evidence before the race. Approve so the best measured
      design is the one scored on the unseen track. Read the race as follows: if the
      development tracks give about 75.8 with progress near oval 0.29, s-bend 0.15
      and slalom 0.11, the run is deterministic and the design is reproduced. If the
      score differs, record that the run is not deterministic.


      ### Requested changes


      - No design change before this race: race the iteration 5 design unchanged,
      since the best measured result is 75.779 and two confirming runs agree.

      - Untested for reference only (H14): outer sensors at x = -0.05 and +0.05 with
      sensor_size 0.012. Do not adopt it unless a later race is available to test
      it, because it has no race evidence yet.


      - [Open this output](iteration-11/entityR1/versions/204ec1b59163440faafe0f59e9abfcda/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/b2877bfb00c64ebe98e04e0a5a5cd5d3/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-9cc42b3f03ddbf20/payload.json)'
