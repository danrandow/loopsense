map:
  id: race-178-opt-eval
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: kd 0.2 on best sensors
    notes: 'Reverts sensor_size to 0.012 because the 0.016 footprint cut progress
      from 0.29 to 0.18 on the oval (score 60.12). Keeps the iteration 5 gains (kp
      2.0) and changes only kd from 0.1 to 0.2 to damp the drift toward the edge.


      ### Rationale


      Evidence. Iteration 7 changed only sensor_size from 0.012 to 0.016 relative
      to the iteration 5 best (75.779). It scored 60.12, so progress fell: oval 0.29
      to 0.18, s-bend 0.153 to 0.152, slalom 0.108 to 0.108. Max_error stayed near
      0.061 to 0.067 m, still above the 0.06 m limit. Every run still had one line-loss
      event, and oscillation stayed low (0.10 to 0.16), so the robot drifts to an
      edge rather than weaving. The 16 mm footprint therefore blurs the centre reading
      and hurts progress, which is the Evaluator''s branch 2. H9 (larger footprint
      extends edge detection) is rejected for this track set. Across all races, kp
      2.0 with base_speed 1.0 and search_right is the best gain set. kp 1.6 and kp
      2.5 both lost progress.


      Change. I revert sensor_size to 0.012 and keep the iteration 5 design otherwise
      unchanged: kp 2.0, ki 0.3, base_speed 1.0, search_right, sensor weights, and
      sensor x positions at -0.04, -0.015, 0, 0.015, 0.04. I then change one field,
      kd from 0.1 to 0.2, to add damping to the drift toward the edge. This follows
      the Evaluator''s instruction to test kd after a sensor revert.


      Expected result. Progress should return to about iteration 5 levels (oval about
      0.29, s-bend about 0.15, slalom about 0.11), with a score near or above 75.8.
      Max_error may fall slightly if the extra damping slows the approach to the edge.
      If kd 0.2 adds oscillation above about 0.2 or lowers progress, kd 0.1 stays
      the setting and the next lever is base_speed (1.1 with search_right, per the
      Evaluator''s branch 3).


      Hypotheses. H11: the drift to the edge is a slow approach that extra derivative
      action damps, so max_error falls below 0.06 m. H12: the 12 mm footprint is the
      better sensing choice at this speed. Measurements wanted: progress, max_error,
      line_loss_events and steering_oscillation per track, plus whether the loss point
      moves along the course.


      - [Open this output](iteration-8/entity0/versions/43dd64f00db84e8880a11a4eac68da29/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-db91f93a3233a9bd/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-81ff2d0856ab3bee/payload.json)'
  - id: entityR1
    label: 'Approve: kd 0.2 test'
    notes: 'Approves the iteration 5 design reverted to sensor_size 0.012 with kd
      raised from 0.1 to 0.2, as a single-variable test of edge drift. Iteration 7
      showed the 16 mm footprint cut oval progress, and iteration 6 showed kp 1.6
      lost progress, so the best raced base is safe to test.


      ### Feedback


      Written before this candidate has raced. The candidate reverts sensor_size from
      0.016 (iteration 7) to 0.012 and keeps the iteration 5 design (score 75.779,
      the best raced so far): kp 2.0, ki 0.3, base_speed 1.0, search_right, sensor
      weights [-2,-1,0,1,2], and sensor x positions at -0.04, -0.015, 0, 0.015, 0.04.
      It changes one field relative to iteration 5, kd from 0.1 to 0.2. Iteration
      7 showed that the 16 mm footprint lowered progress on the oval (0.29 to 0.18)
      and left s-bend and slalom essentially flat, so the sensor revert is well supported.
      Iteration 6 showed that kp 1.6 lost progress on every track, so kp 2.0 stays.
      Every raced run so far ends with exactly one line-loss event and max_error of
      about 0.061 to 0.067 m, above the 0.06 m limit, while steering oscillation stays
      low (0.10 to 0.16). The failure is therefore a slow drift to one edge, and a
      modest increase in derivative action is a reasonable single-variable test of
      that drift. The candidate is valid and differs from the best raced design by
      one field, so it is worth racing now rather than revising. Read the race this
      way. (1) If progress is at least as high as iteration 5 (oval about 0.29, s-bend
      about 0.15, slalom about 0.11) and max_error falls toward or below 0.06 m, keep
      kd 0.2 and test base_speed 1.1 with search_right, since speed trades progress
      between the oval and bend tracks. (2) If progress falls, or steering_oscillation
      rises clearly above the 0.16 seen in iteration 5, revert kd to 0.1 and keep
      the same test for base_speed 1.1. (3) If max_error stays near 0.063 m on every
      track whatever kd does, damping is not the limit, and the next lever is base_speed,
      not further sensing changes.


      ### Requested changes


      - Race as written. If progress matches or exceeds iteration 5 on all tracks
      and max_error falls, keep kd 0.2 and test base_speed 1.1 with search_right and
      kp 2.0, since iterations 3 and 4 showed speed moves progress between the oval
      and the bend tracks.

      - If progress falls or steering_oscillation rises above about 0.16 with kd 0.2,
      revert kd to 0.1 (iteration 5 setting) and test base_speed 1.1 from there.

      - If max_error stays near 0.063 m on every track whatever kd does, stop tuning
      damping and test base_speed 1.1 alone, keeping the iteration 5 gains and sensor_size
      0.012.


      - [Open this output](iteration-8/entityR1/versions/d2baf60927b54c969c569b7dc517adce/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/43dd64f00db84e8880a11a4eac68da29/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-81ff2d0856ab3bee/payload.json)'
