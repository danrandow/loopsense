map:
  id: race-178-opt-eval
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence. Iteration 3 (base_speed 1.0, sensors at x = ±0.04, kp 2.5, ki 0.3,
      kd 0.1, line_loss last_direction) scored 57.6, the best so far. Oval progress
      rose from 0.115 to 0.21, so speed was part of the cause. S-bend progress fell
      from 0.15 to 0.126 and slalom from 0.105 to 0.084, so slowing down did not solve
      the course in general. Every run still ended off track with exactly one line-loss
      event and max_error about 0.062 m, just above the 0.06 m limit. Oscillation
      stayed low (0.13 to 0.15), so the robot is not weaving. Gains, sensor span and
      speed have each been varied, and the line is still lost once per run. The failure
      therefore sits in the recovery after line loss, which Evaluator feedback identifies
      as the next suspect.


      Change. I keep the iteration 3 geometry, base_speed 1.0, kp 2.5, ki 0.3, kd
      0.1 and sensor weights unchanged, and change only controller.line_loss from
      last_direction to search_right. search_right holds the signal at +1, which steers
      the robot left. I chose this side arbitrarily, because the telemetry does not
      report which side max_error grows on. last_direction replays a fixed-sign turn
      of the last valid signal, and that turn is likely the wrong one or too weak
      to find the tape again. A single-variable change makes the effect of recovery
      mode clear.


      Expected result. If the failure is recovery-limited, line_loss_events stays
      at 1 but the robot re-acquires the line, so progress should rise clearly above
      0.21 on the oval and above 0.13 on the s-bend, and some runs should complete.
      If the robot instead leaves to the right, max_error will be larger on the right
      side, and the next step is search_left, which steers right. If progress does
      not change at all, recovery mode is not the limit, and the next test is lowering
      kp from 2.5 toward 2.0 to reduce bend-entry turn authority.


      Hypotheses to check. H4: the line-loss recovery mode decides whether the robot
      re-acquires the line. H5: the failure side is the same on every track, so one
      search direction should be correct for all tracks. Next measurements: progress
      and line_loss_events per track, max_error per track, and completion_time if
      any run finishes.


      - [Open this output](iteration-4/entity0/versions/d4e9c1c984154327a945d1c23c9d4fa3/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-1b4a516b2b6c8329/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-ac44139c22028e70/payload.json)'
  - id: entityR1
    label: 'Approve: speed isolation'
    notes: 'Approves the single-change candidate that drops base_speed from 1.3 to
      1.0 with everything else held fixed, so the race isolates speed as the cause
      of the bend-entry line loss. Evidence: iterations 0 to 2 all ended off track
      at progress 0.10 to 0.15 with one line loss per run, and gain and sensor changes
      barely moved it.


      ### Feedback


      Written before this candidate has raced. Evidence: iterations 0 to 2 (60 development
      trials each) all ended off track with progress of 0.10 to 0.15, one line-loss
      event per run, and max_error of about 0.062 m, just above the 0.06 m limit.
      Gain changes (iteration 1, kp 2.0 to 2.5 and ki 0.05 to 0.3) and the sensor
      span change to x = ±0.04 with base_speed 1.6 to 1.3 (iteration 2) moved progress
      only slightly. Steering oscillation stayed low, so the robot is not weaving.
      This candidate changes only base_speed (1.3 to 1.0), with geometry, gains, sensor
      weights and line_loss unchanged. That isolates speed, the one lever not yet
      tested alone. It is valid and not obviously broken. It is a diagnostic step
      that the race can answer, so reading numbers alone will not settle it. Lower
      speed will hurt completion_time, but the current scores come almost entirely
      from progress, so this is an acceptable cost for finding the failure cause.
      Read the next telemetry this way. (1) If progress rises clearly above 0.15 on
      the oval and s-bend, speed was the cause. Then find a speed between 1.0 and
      1.3 that keeps the line and gives more progress, and only then raise speed toward
      completion. (2) If progress stays near 0.11 to 0.15 even at 1.0, speed is not
      the cause. Next suspects are the line-loss recovery and turn authority. The
      line-loss recovery is the more likely target, since the robot leaves the line
      after one loss and last_direction does not bring it back.


      ### Requested changes


      - Keep the current geometry and gains and read progress, line_loss_events and
      max_error per track. If progress rises clearly above 0.15 on the oval and s-bend,
      keep base_speed near 1.0 to 1.2 and then raise it in small steps to find the
      fastest speed that still holds the line.

      - If progress stays near 0.11 to 0.15 at base_speed 1.0, change only controller.line_loss
      from last_direction to search_right or search_left, chosen by which side max_error
      grows on. Iteration 0 to 2 all show one loss per run that never recovers, so
      the recovery mode is the next suspect.

      - If line loss still occurs with the same recovery mode, lower kp from 2.5 toward
      2.0 and check whether the max_error and line-loss point move. This tests whether
      turn authority at the bend entry causes the loss, which is only worth trying
      after the recovery mode has been tested alone.


      - [Open this output](iteration-3/entityR1/versions/60aede8a45b44dcd86dec031fea0388e/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/333ed0cf9aaa4955942e9c55342d2f7d/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-12a5e2a73efe3998/payload.json)'
