map:
  id: race-178-opt-eval
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: kp 1.6 continues trend
    notes: 'Keeps the best raced geometry, base_speed, ki, kd, weights and search_right
      from iteration 5 (score 75.8) and lowers kp from 2.0 to 1.6. Progress rose on
      every track when kp fell from 2.5 to 2.0, so the next step follows that trend;
      max_error is still above the 0.06 m limit, so this may not clear it.


      ### Rationale


      Evidence. Iteration 5 (kp 2.0, search_right, base_speed 1.0, ki 0.3, kd 0.1,
      sensors at x = ±0.04 and ±0.015/0) is the best raced design, at 75.779. Compared
      with iteration 4 (kp 2.5), progress rose on every track: oval 0.21 to 0.29,
      s-bend 0.126 to 0.153, slalom 0.084 to 0.108. Every run still ended off track
      with one line-loss event, and max_error stayed at about 0.063 to 0.067 m, above
      the 0.06 m limit. Oscillation stayed low (0.14 to 0.16), so the robot is drifting
      to an edge, not weaving. Changing kp is the only change that has moved progress
      in the right direction, and the trend is monotonic across the 2.5 to 2.0 step.
      The Evaluator''s branch 1 (max_error below 0.06 m) is not met, but progress
      did rise on all three tracks, so turn authority is still a limiter.


      Change. I keep the iteration 5 geometry, base_speed 1.0, ki 0.3, kd 0.1, sensor
      weights and search_right, and lower kp from 2.0 to 1.6, the lower part of the
      1.5 to 1.8 range the Evaluator named. This is a single-variable continuation
      of the kp trend. Choosing 1.6 rather than 1.5 keeps a margin against losing
      the line on bend entries.


      Expected result. Progress should rise again on the oval, s-bend and slalom,
      with a score above 75.8. max_error may stay near 0.063 m because the failure
      point seems to lie beyond proportional authority. Fallback: if progress falls
      or line-loss events rise, revert to kp 2.0, the best raced design, and move
      to the sensor-geometry test (sensor_size 0.016 at the same x positions).


      Hypotheses. H7: lower kp reduces bend-entry overshoot, so the robot keeps more
      progress before reaching the edge. H8: max_error stays near 0.063 m, so the
      edge exit is caused by something other than proportional gain. Measurements
      wanted: progress, max_error and line_loss_events per track, and whether the
      loss point moves along the course.


      - [Open this output](iteration-6/entity0/versions/7dcf996a4f214efca416bb2627972d8d/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-0a4fe2b08f858aaa/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-9cc42b3f03ddbf20/payload.json)'
  - id: entityR1
    label: Approve kp 2.0 single
    notes: 'Approves a single-variable test lowering kp from 2.5 to 2.0 on the iteration
      4 design, which is the next step in the recovery-then-gain sequence. Evidence
      is iterations 0 to 4, which all lost the line once per run at max_error about
      0.062 m, with no gain or recovery-mode change moving the failure point.


      ### Feedback


      Written before this candidate has raced. Evidence: iterations 0 to 4 (60 development
      trials each) all ended off track with exactly one line-loss event and max_error
      of about 0.062 m, just above the 0.06 m limit. Oscillation stayed low (0.08
      to 0.15), so the robot is drifting to an edge rather than weaving. Iteration
      4 (search_right, base_speed 1.0, kp 2.5) scored 57.612, essentially level with
      iteration 3 (57.6456, last_direction), so the recovery mode did not move the
      failure point. Iteration 4 also showed that oval progress (0.21) and s-bend/slalom
      progress (0.13, 0.08) respond to base_speed in opposite directions. This candidate
      keeps the iteration 4 geometry, base_speed, ki, kd, sensor weights and search_right,
      and changes only kp from 2.5 to 2.0. That is the single-variable test of bend-entry
      turn authority that the previous feedback set up. It is valid and not obviously
      broken: kp 2.0 was used in the iteration 0 baseline, and the change is small.
      Revising first would cost two of the four remaining review and revision runs
      for a change that only a race can judge, so approve it and read the race as
      follows. (1) If max_error falls below 0.06 m and progress rises on any track,
      kp was the limit; then try kp 1.5 to 1.8 with base_speed 1.0 before changing
      anything else. (2) If progress and max_error are unchanged, turn authority is
      not the limit, and the next test is sensor geometry (sensor_size 0.016, or a
      span of about 0.05 m with the 16 mm sensors) rather than more gain changes.
      (3) If progress falls on the s-bend or slalom, kp 2.5 was needed for the bends,
      and the next lever is base_speed between 1.0 and 1.2 with kp 2.5.


      ### Requested changes


      - Race as written. If max_error drops below 0.06 m and progress rises on any
      track, keep kp near 2.0 and try 1.5 to 1.8 next, holding base_speed 1.0 and
      search_right.

      - If progress and max_error are unchanged across tracks, stop tuning kp and
      test sensor geometry next: sensor_size 0.016 with the same x positions, or a
      span of about 0.05 m, keeping kp 2.0.

      - If progress falls on the s-bend or slalom, restore kp 2.5 and test base_speed
      1.1 to 1.2 with search_right, since iteration 3 and 4 showed the bend tracks
      need more speed while the oval needs less.


      - [Open this output](iteration-5/entityR1/versions/71112118b2e346c6b7897a4b264d6b85/payload.json)

