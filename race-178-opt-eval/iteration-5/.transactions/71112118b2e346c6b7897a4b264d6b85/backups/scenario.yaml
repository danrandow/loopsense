map:
  id: race-178-opt-eval
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: kp 2.5 to 2.0 test
    notes: 'Keeps the iteration 3 geometry, speed and search_right recovery, and lowers
      kp from 2.5 to 2.0 to test bend-entry overshoot. Iteration 4 showed the recovery
      mode changes nothing (progress 0.2085 oval, score 57.612 vs 57.646), so the
      next single-variable test is turn authority.


      ### Rationale


      Evidence. Iteration 4 changed only line_loss (last_direction to search_right)
      and left every other field as in iteration 3. Oval progress stayed at 0.2085,
      s-bend moved from 0.1258 to 0.1256, slalom stayed at 0.084, and the score moved
      from 57.6456 to 57.612. Every run still ended off track with exactly one line-loss
      event and max_error about 0.062 m. The recovery mode therefore does not change
      where the robot leaves the line, so H4 is rejected. The failure happens before
      recovery matters. Oscillation stayed low (0.13 to 0.15), so the robot is not
      weaving. The off-track limit is max(0.06, 0.0125 + body_width/4), which stays
      at 0.06 m for any allowed body width, so it cannot be relaxed through geometry.
      Iterations 1 and 2 also showed that gains and sensor span alone do not move
      the failure point.


      Change. Following the Evaluator''s third branch, I keep search_right and the
      iteration 3 geometry and sensor layout, and lower kp from 2.5 to 2.0. This is
      a single-variable test of bend-entry turn authority. A proportional gain that
      is too high can overshoot on entry to a bend and push the outer sensors past
      the edge, so a weaker proportional response should reduce the peak lateral error.


      Expected result. max_error should fall below 0.062 m, and line_loss_events may
      drop from 1 toward 0 on the oval. Progress on the s-bend and slalom may rise.
      If progress and max_error are unchanged, turn authority is not the limit, and
      the next test should be sensor geometry (larger sensor_size or a wider span
      with 16 mm sensors) rather than further gain changes.


      Hypotheses. H6: at base_speed 1.0 with kp 2.5, bend-entry overshoot drives the
      line loss. Measurements wanted: progress, line_loss_events, and max_error per
      track, and whether the failure point along the course moves.


      - [Open this output](iteration-5/entity0/versions/c4988fdc999449168d9e07641c83cb0a/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-b242adede774f369/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-01f0c84b0bdb24a0/payload.json)'
  - id: entityR1
    label: 'Approve: test'
    notes: 'Approves the iteration 3 geometry and gains with only line_loss changed
      to search_right, a clean single-variable test of recovery mode. Iteration 3
      (score 57.6) is the best raced design, and every run so far lost the line once
      and never recovered.


      ### Feedback


      Written before this candidate has raced. The evidence is iterations 0 to 3 (60
      development trials each). Every run ended off track with exactly one line-loss
      event and max_error of about 0.062 m, just above the 0.06 m limit. Oscillation
      stayed low (0.08 to 0.15), so the robot is not weaving. Iteration 3 (base_speed
      1.0, sensors at x = ±0.04, kp 2.5, ki 0.3, kd 0.1, line_loss last_direction,
      score 57.6) is the best raced design. Its oval progress rose to 0.21, but slalom
      and s-bend progress fell, so speed alone does not explain the failure. Gain
      changes (iteration 1) and the sensor span change (iteration 2) also left the
      failure point largely unchanged. The candidate keeps the iteration 3 geometry
      and gains and changes only controller.line_loss to search_right. That is the
      cleanest single-variable test of the recovery hypothesis (H4), and the telemetry
      cannot settle it without a race. The change is valid and not obviously broken,
      so it is worth racing now. Iterations remaining are limited, and a revise round
      would only repeat the same test. Read the next race this way. (1) If line_loss_events
      stays at 1 but progress rises clearly above 0.21 on the oval and above 0.13
      on the s-bend, recovery mode was the limit, and the next step is to tune base_speed
      upward from 1.0 in small steps. (2) If max_error is clearly larger on the right
      edge, or progress falls, the robot is leaving on the wrong side. Test search_left
      next, which steers right. (3) If progress does not change at all, recovery mode
      is not the limit, and the next test is kp lowered from 2.5 toward 2.0 to reduce
      bend-entry turn authority.


      ### Requested changes


      - Race the candidate as written, then compare progress, line_loss_events and
      max_error per track against iteration 3. If progress rises on the oval and s-bend,
      keep search_right and move base_speed up in small steps from 1.0.

      - If the failure side is clearly the right edge or progress drops, change only
      controller.line_loss to search_left and race again.

      - If progress is unchanged across tracks, keep the recovery mode and lower kp
      from 2.5 to 2.0 as the next single-variable test.


      - [Open this output](iteration-4/entityR1/versions/9e569941507c4b2a8f78e4d4e7cea79a/payload.json)

