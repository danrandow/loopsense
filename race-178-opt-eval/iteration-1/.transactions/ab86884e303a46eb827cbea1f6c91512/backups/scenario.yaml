overrides:
  entities:
  - id: entity0
    label: Add integral, firmer kp
    notes: 'Raised ki from 0.05 to 0.3 to cancel the steady drift from the motor mismatch,
      and kp from 2.0 to 2.5 to keep max_error below the 0.06 m limit. Iteration 0
      went off track at about 10 to 15 percent progress with low oscillation, which
      points to a bias rather than weaving.


      ### Rationale


      Evidence from the iteration 0 race (development simulator, 60 trials): every
      run ended off track, with progress of only 0.10 to 0.15, one line-loss event
      each, and max_error of about 0.062 m. The off-track limit is max(0.06, 0.0125
      + body_width/4) = 0.06 m, so the robot reached the edge early and never got
      far. rms_error (0.025 to 0.029 m) is well below the limit, and steering_oscillation
      is low (0.08 to 0.14). The robot is therefore not weaving. It drifts steadily
      toward one edge and then drops off. A steady drift of this kind is the signature
      of the fixed left/right motor mismatch in the disturbance, which a proportional-only
      loop cannot fully remove. With ki = 0.05 the integral term is too weak to cancel
      it, and with kp = 2.0 the steady offset is still a few centimetres. I make two
      changes. First, I raise ki from 0.05 to 0.3, so the integral can cancel the
      constant bias. The integral is clamped at +/-2, so windup on the slalom stays
      bounded. Second, I raise kp from 2.0 to 2.5 to tighten tracking and keep max_error
      further from the 0.06 m limit. kd stays at 0.1 and I deliberately keep base_speed
      at 1.6, the sensor layout, and line_loss unchanged, so the cause of any change
      in the result is clear. Expected result: max_error falls below about 0.05 m,
      progress rises well past 0.15 on the oval and s-bend, and line_loss_events drops
      to 0 on the oval. If the robot still goes off track on the slalom, the next
      step is to widen the sensor span to x = +/-0.04 or to reduce base_speed. Hypotheses
      to check: (H1) the drift is a steady bias from the motor mismatch, so ki resolves
      it; (H2) the remaining failures are bend-entry overshoots, which kp and kd address.
      Measurements to watch: progress, max_error, line_loss_events, and steering_oscillation,
      which should stay low as kp rises.


      - [Open this output](iteration-1/entity0/versions/4171de4b85f44f0781eb17af1de0fb5a/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-b11a694c4161f529/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-e36040137861be76/payload.json)'
  - id: entityR1
    label: 'Baseline review: approve'
    notes: 'Approved the valid baseline for the first race because no telemetry exists
      yet and a race is the cheapest source of evidence. Feedback names the three
      checks (speed, oscillation, line loss) and the field changes to try if each
      one fails, based only on the contract and rationale.


      ### Feedback


      Written before this candidate has raced. Iteration 0 has no race telemetry,
      so the only evidence is the public contract and the rationale. The candidate
      is a valid, moderate baseline: five sensors spanning x = -0.03 to +0.03 m (wider
      than the 25 mm tape), weights -2..2 giving a signal proportional to lateral
      offset, kp = 2.0 (about 700 PWM difference per unit of signal), small ki and
      kd, and line_loss = last_direction. Nothing in it looks obviously broken, and
      no earlier race exists to show it is wrong. Watch three things in the race.
      (1) Completion time: base_speed 1.6 gives 80% of full PWM, and the course needs
      about 1.5 m/s average to finish in 3 s. If the run does not complete or progress
      stalls short of the end, raise base_speed toward 1.8 to 2.0 before touching
      the gains. (2) steering_oscillation and max_error: if the robot weaves on the
      slalom, lower kp (try 1.2 to 1.5) or raise kd (try 0.2 to 0.3) to damp the swing.
      If rms_error is large but oscillation is low, the robot is tracking too loosely,
      so raise kp in small steps. (3) line_loss_events: if they are nonzero on the
      slalom, widen the sensor span or change line_loss to search_left or search_right,
      depending on which side the robot leaves the line. Change one or two fields
      per revision so the cause of each change is clear.


      ### Requested changes


      - If completion is 0 or completion_time is near 3 s with progress below 1, raise
      base_speed to 1.8 to 2.0 (base_speed 1.6 may be too slow for the 1.5 m/s average
      the course needs).

      - If steering_oscillation or max_error is high on the slalom, lower kp to 1.2
      to 1.5 or raise kd to 0.2 to 0.3 to damp the swing.

      - If line_loss_events is nonzero, widen the sensor span (for example x = -0.04
      to +0.04) or change line_loss to search_left or search_right, chosen by which
      side the robot leaves the line.


      - [Open this output](iteration-0/entityR1/versions/2fda1971798a4cb298a8eafd0ce55e5b/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/731a889e462f4e01b5bea316413c3430/payload.json)'
