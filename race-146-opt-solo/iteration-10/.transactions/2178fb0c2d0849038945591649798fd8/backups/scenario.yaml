  - id: entity0
    label: Narrower track 0.10 m
    notes: 'Iteration 7 design with wheel_track narrowed from 0.11 to 0.10 m and base_speed
      held at 0.95, since speed 1.0 in iteration 8 made the slalom worse. The narrower
      track gives more turn authority at reversals, aimed at the one slalom failure
      left in iteration 7 (19/20, one timeout).


      ### Rationale


      Evidence from iteration 7 (score 933.8, the best so far) and iteration 8 (score
      930.8). Iteration 7 has oval 20/20 (2.37 s, rms 0.0055), s-bend 20/20 (2.53
      s, rms 0.013) and slalom 19/20 (one timeout, 0 off-track exits, mean progress
      0.995). Iteration 8 raised base_speed to 1.0. Its slalom regressed (one off-track
      exit, minimum score 308, mean 904 against 911), and its oval and s-bend gained
      only about 0.03 to 0.04 s. Raising speed therefore brings slalom instability
      without a clear time gain, so base_speed goes back to 0.95. The score''s remaining
      lever on the oval and s-bend is completion time (60*(1-t/3)), and the main loss
      is the single slalom failure. The slalom''s problem is steering authority at
      fast reversals, which is the limit named in iteration 7''s hypothesis (2). Change
      (single variable from iteration 7): wheel_track 0.11 -> 0.10 m. For the same
      wheel differential, a narrower track gives a higher turn rate, so the robot
      can correct reversals faster without raising speed. Everything else is held
      at iteration 7: seven sensors at x = -0.04..+0.04 m (0.0133 m pitch), sensor_size
      0.012, weights 50*x, kp 4.5, ki 0, kd 3.0, base_speed 0.95, mass 0.6, body 0.15
      x 0.12 m, radius 0.03 m, line_loss last_direction. Expected result: slalom 20/20
      with fewer timeouts and off-track exits, and oval and s-bend still finishing
      with rms under 0.015. Hypotheses: (1) if the s-bend or oval steering_oscillation
      rises above 0.25, or rms rises above 0.015, the narrower track is overturning
      and should return to 0.11 m or the kd should rise to 3.3; (2) if the slalom
      still times out at progress near 0.99, the limit is speed, so base_speed should
      go to 0.975 with wheel_track 0.10; (3) if the slalom leaves the tape, kd should
      rise to 3.5 before changing speed. Measurements requested: all metrics per track,
      with focus on slalom finish count, timeouts versus off-track exits, completion_time
      on the oval and s-bend, and steering_oscillation.


