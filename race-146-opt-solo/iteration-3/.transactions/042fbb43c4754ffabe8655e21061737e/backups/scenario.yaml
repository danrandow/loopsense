  entities:
  - id: entity0
    label: Wider sensors, speed 0.95
    notes: 'Widened the sensor array to +/-0.05 m and raised base_speed from 0.9 to
      0.95, targeting the slalom off-track exits and timeouts seen in the last race.
      Oval and s-bend both finished 20/20 with kp 4.5 and kd 2.0, so those gains are
      kept.


      ### Rationale


      Evidence from the iteration-2 race (entityR2A): the oval (20/20) and s-bend
      (20/20) now both finish with low rms_error (0.005 and 0.010), so the kp 4.5,
      kd 2.0 controller is working on smooth curves. The slalom is still the failure:
      0/20 finished, 14 off-track exits and 6 timeouts. Mean slalom progress rose
      from 0.45 to 0.74, which confirms the previous hypothesis that more damping
      helped. The timeouts show that the robot is now too slow to cover the slalom
      within 3 s, while the off-track exits show it still loses the tape on the fast
      left-right reversals. Two levers are in reach. (1) Sensor coverage: the outer
      sensors sit at x = +/-0.04 m, so at a reversal the tape leaves the array before
      the controller can react. Widening to +/-0.05 m, as my previous rationale suggested,
      gives an earlier signal at the edges. (2) Speed: base_speed 0.9 gave a slalom
      timeout rate of 30%. Raising it to 0.95 gives roughly 5% more forward speed.
      The oval margin is comfortable (2.19 s at 0.9, so about 2.1 s at 0.95). I am
      keeping kp 4.5, kd 2.0 and ki 0, because the oval oscillation (0.236) and s-bend
      results are good. Changes this iteration: sensor x spread widened to +/-0.05
      m (spacing 0.025 m); base_speed 0.9 -> 0.95. Expected result: slalom progress
      above 0.85, fewer off-track exits, and fewer timeouts. Oval and s-bend should
      still finish with rms_error under 0.012. Hypotheses to check next: (1) if the
      slalom still leaves at about the same progress, the limit is steering authority
      or kd, so try kp 5 or kd 1.5; (2) if steering_oscillation on the slalom stays
      above 0.3, kd is too low for the reversals; (3) if the s-bend off-track rate
      rises after the sensor change, the wider array is seeing the tape too late on
      gentle bends and the spread should come back to +/-0.045 m. Measurements requested:
      all metrics per track, so slalom progress, timeouts vs off-track exits, and
      line_loss_events can be compared directly with iteration 2.


