  entities:
  - id: entity0
    label: kp 4.5->5.0 for slalom
    notes: 'Keeps the iteration-4 geometry and changes only kp to 5.0 to hold the
      tape through slalom reversals. Iteration 4 scored 870 with oval and s-bend both
      20/20 and slalom failing 7 of 20 off track, with no timeouts, so tracking rather
      than speed is the limit.


      ### Rationale


      Evidence from iteration 4 (score 870.2, best so far). The oval (20/20, rms 0.005)
      and s-bend (20/20, rms 0.011) both finish comfortably. The slalom is the only
      failure: 13/20 finish, 7 end off track, mean progress 0.90, and about 0.4 line-loss
      events per run. No slalom run timed out, so the robot is fast enough. The problem
      is tracking at direction reversals, not speed. Lighter body and narrower track
      (iteration 4) raised slalom progress from 0.74 to 0.90, which confirms that
      lower yaw inertia and more steering authority help. The slalom still has steering_oscillation
      0.27 and control_effort 12.9, which points to a proportional gain that is too
      low to hold the tape through fast reversals.


      Change: kp 4.5 -> 5.0, with everything else held at iteration 4 values (geometry,
      base_speed 0.95, kd 2.5, ki 0, line_loss last_direction). This is a single-variable
      test. A higher kp gives more correction per unit of sensor error at each reversal,
      and kd 2.5 should still damp it.


      Expected result: slalom off-track exits fall from 7 toward 3 or fewer, and slalom
      mean score rises above about 800. The oval should stay near 950, provided steering_oscillation
      there remains below about 0.3.


      Hypotheses to check next: (1) If oval steering_oscillation rises above 0.35
      or s-bend rms rises above 0.013, kp 5 is too aggressive and should go back to
      about 4.75. (2) If the slalom still leaves at similar progress (about 0.9),
      the limit is sensor coverage at the +/-0.04 m edges, so the next step is seven
      sensors at about 0.0133 m spacing across +/-0.04 m, not a wider spread. (3)
      If line_loss_events on the slalom stay near 0.4, the line is lost on sharp reversals,
      and a search direction or a lower base_speed through reversals should be tested.
      Measurements requested: all metrics per track, so slalom finish count, off-track
      versus finished split, and steering_oscillation can be compared directly with
      iteration 4.


