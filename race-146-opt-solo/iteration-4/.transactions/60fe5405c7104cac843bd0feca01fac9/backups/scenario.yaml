  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence from iteration 2 (score 735.8, the best so far): oval 20/20 finished
      (rms 0.005), s-bend 20/20 finished (rms 0.010), slalom 0/20 finished. Slalom
      failures are 14 off-track exits and 6 timeouts, with mean progress 0.74 and
      about 0.8 line-loss events per run. Two things are going wrong. The timeouts
      mean the robot is too slow to cover the course in 3 s. The off-track exits mean
      it loses the tape during fast left-right reversals, where its steering is still
      underdamped (slalom steering_oscillation 0.34, control_effort 15.4). Iteration
      3 showed that widening the sensor spread to +/-0.05 m hurt the s-bend and slalom
      (score 651.9), so I am reverting the sensor layout to the iteration-2 values.


      Changes: (1) Reduce yaw inertia with a lighter, more compact body: mass 0.8
      -> 0.6 kg, body_length 0.18 -> 0.15 m. Yaw inertia scales with mass times (length^2
      + width^2), so this makes the robot turn faster on reversals and accelerate
      more easily. (2) Narrow the wheel track 0.12 -> 0.11 m. For a given wheel differential,
      turn rate rises as the track shrinks, which gives more steering authority. (3)
      base_speed 0.9 -> 0.95 to reduce slalom timeouts; the oval and s-bend have margin.
      (4) kd 2.0 -> 2.5 to damp the faster reversals. kp stays at 4.5 and ki at 0.
      Sensors stay at x = -0.04..+0.04 m, spacing 0.02 m, size 0.012 m, as in iteration
      2.


      Expected result: slalom progress above 0.85, with fewer off-track exits and
      fewer timeouts. Oval and s-bend should still finish with rms_error under 0.012,
      and completion_time should stay under 3 s.


      Hypotheses to check next: (1) If the slalom still leaves at similar progress,
      steering authority or sensor coverage is the limit, so try kp 5 or a sensor
      spacing of 0.015 m across +/-0.04 m. (2) If steering_oscillation on the oval
      rises above 0.4, kd 2.5 is too high and should return to 2.0. (3) If the lighter
      body makes the oval overshoot, return mass to 0.7 kg. Measurements requested:
      all metrics per track, so slalom progress, timeout versus off-track counts,
      and line_loss_events can be compared directly with iteration 2.


