  entities:
  - id: entity0
    label: Faster base speed 1.0
    notes: 'Raises base_speed from 0.95 to 1.0 on the iteration 7 design, the best
      so far at 933.8, to cut completion time and remove the single slalom timeout.
      Geometry and controller gains are held fixed, so the result isolates the speed
      change.


      ### Rationale


      Evidence from iteration 7 (score 933.8, best so far): oval 20/20 (mean 2.37
      s, rms 0.0055), s-bend 20/20 (mean 2.53 s, rms 0.013), slalom 19/20 finished
      with 1 timeout and 0 off-track exits (mean progress 0.995, 0 line-loss events,
      min trial 429). The seven-sensor array fixed the off-track failures, so the
      remaining losses are the one slalom timeout and the slower completion times.
      The score formula rewards faster completion (60*(1-t/3)), so speed is now the
      main lever. Iterations 4 to 6 showed no slalom timeouts at base_speed 0.95 with
      the lighter body, but iteration 7 has one timeout, which points to a small speed
      deficit on the slalom. Change (single variable): base_speed 0.95 -> 1.0. This
      is about 5% more forward drive, which should cut oval and s-bend time by roughly
      0.1 s and reduce slalom timeouts. Geometry, kp 4.5, kd 3.0, ki 0 and line_loss
      last_direction are unchanged. Expected result: slalom finish rate of 20/20 or
      near it, oval and s-bend still finishing with rms below 0.015, and completion_time
      about 2.25 s on the oval. Hypotheses to check next: (1) if slalom off-track
      exits return or steering_oscillation rises above 0.32, base_speed 1.0 is too
      fast through reversals and should return to 0.95 with a different lever such
      as wheel_track 0.10 m; (2) if the oval shows rms rising above 0.01, the faster
      speed is overshooting and kd should go up slightly; (3) if the slalom still
      times out at 1.0, the limit is steering authority at reversals, so narrow wheel_track
      to 0.10 m. Measurements requested: all metrics per track, with particular attention
      to slalom completion count, timeouts versus off-track exits, and completion_time
      on the oval and s-bend.


