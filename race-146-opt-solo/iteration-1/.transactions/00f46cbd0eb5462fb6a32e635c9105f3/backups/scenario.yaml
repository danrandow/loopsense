  entities:
  - id: entity0
    label: Stiffer steer, wider
    notes: 'Raised kp 2 to 4 and kd 0.3 to 1.0, lowered base_speed 1.2 to 1.0, and
      widened the sensor spread to +/-0.04 m. The development race showed s-bend and
      slalom leaving the track early (progress 0.33 and 0.17), so the robot needs
      faster, earlier correction on bends.


      ### Rationale


      Evidence from the development race (entityR2A): the oval finishes 60% of the
      time, but the s-bend and slalom both end off track (progress 0.33 and 0.17,
      every trial). Those failures happen early, before the robot covers much of the
      course, so the steering is too slow or too weak to hold the tape through sharp
      direction changes. The slalom''s near-constant score of about 70 suggests a
      consistent, early loss of the line rather than random noise.


      Changes: (1) kp 2.0 -> 4.0, so each sensor-signal unit produces twice the wheel
      correction and the robot reacts faster to offsets on bends. (2) kd 0.3 -> 1.0,
      to damp the extra proportional action and limit overshoot and oscillation on
      the quick alternations of the slalom. (3) base_speed 1.2 -> 1.0, so the robot
      has more time to correct at bend entry. The oval took 1.96 s at 1.2, so 1.0
      should still finish near 2.3 to 2.5 s, which is under the 3 s limit. (4) Sensor
      x spacing widened from +/-0.03 m to +/-0.04 m (0.02 m spacing), so the outer
      sensors see the tape earlier as the robot drifts and give a larger, earlier
      signal. ki stays 0 to avoid integral windup on bends. Line_loss stays last_direction.


      Expected result: fewer off-track exits on the s-bend and slalom, with progress
      rising well above 0.33 and 0.17. The oval should still finish, with a shorter
      time than before if the lower speed does not slow it too much. Hypotheses to
      check next: (1) if steering_oscillation rises sharply with kp 4 and kd 1, kp
      is too high and should come down toward 3. (2) If the s-bend still leaves the
      track at similar progress, the robot is too fast at bend entry and base_speed
      should drop to about 0.8. (3) If the oval no longer finishes, base_speed is
      too low or the robot is overcorrecting. Measurements requested: all metrics,
      so progress, rms_error and line_loss_events can be compared per track against
      the score formula.


