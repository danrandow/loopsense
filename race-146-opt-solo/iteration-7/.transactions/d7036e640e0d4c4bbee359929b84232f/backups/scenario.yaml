  entities:
  - id: entity0
    label: kd 3.0, kp back to 4.5
    notes: 'Reverts kp to 4.5 (best score 870, while kp 5.0 dropped to 814 with more
      slalom off-track exits) and raises kd from 2.5 to 3.0 to damp slalom reversals.
      The slalom still shows oscillation 0.27 and 0.4 line-loss events per run.


      ### Rationale


      Evidence from iteration 5 (score 814.0, down from 870.2 in iteration 4): kp
      5.0 made the slalom worse. Slalom finishes fell from 13/20 to 7/20 and off-track
      exits rose from 7 to 12, while the oval and s-bend stayed near their previous
      levels. Higher kp therefore overcorrects at reversals, so I am reverting kp
      to 4.5, the best-scoring value so far. Iteration 4 also showed that the slalom
      has no timeouts at base_speed 0.95 and that its failures are off-track exits
      at reversals, so speed is not the limit. The remaining slalom symptoms are steering_oscillation
      0.27 and about 0.4 line-loss events per run, which point to too little damping
      at fast reversals. This iteration changes one variable from the iteration 4
      baseline: kd 2.5 -> 3.0, with kp 4.5, ki 0, base_speed 0.95, geometry and line_loss
      unchanged. Expected result: slalom off-track exits fall from 7 toward 4 or fewer
      and slalom steering_oscillation drops below about 0.25, with the oval and s-bend
      still finishing. Hypotheses: (1) if oval steering_oscillation rises above 0.35
      or completion_time exceeds 2.6 s, kd 3.0 is too heavy and should return to 2.5.
      (2) If the slalom still leaves at progress near 0.9 with kd 3.0, the limit is
      sensor coverage at the +/-0.04 m edges, and the next test is seven sensors at
      about 0.0133 m spacing across +/-0.04 m. (3) If slalom line_loss_events stay
      near 0.4, sharp reversals lose the line, and a lower base_speed through reversals
      or a different line_loss mode should be tested. Measurements requested: all
      metrics per track, to compare slalom finish count, off-track versus finished
      split, and steering_oscillation directly with iteration 4.


