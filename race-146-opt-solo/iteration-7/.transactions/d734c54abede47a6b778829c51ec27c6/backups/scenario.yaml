  entities:
  - id: entity0
    label: 7-sensor finer array
    notes: 'Keeps the best design (iteration 6, score 890.5) and changes only the
      sensor layout: seven sensors across +/-0.04 m with weights scaled to position,
      aiming to stop the tape leaving the array at slalom reversals. Evidence: the
      oval and s-bend are saturated, and the slalom off-track exits (5/20) are the
      remaining loss.


      ### Rationale


      Evidence from iteration 6 (score 890.5, best so far): oval 20/20 finished (mean
      2.10 s, rms 0.005), s-bend 20/20 (mean 2.39 s, rms 0.013), slalom 15/20 finished
      with 5 off-track exits, mean progress 0.92, 0.3 line-loss events per run. The
      oval and s-bend are essentially saturated, so the remaining score gap (slalom
      about 774 against about 950) is entirely slalom reversal tracking. Iteration
      6 raised kd from 2.5 to 3.0 and slalom finishes went from 13/20 to 15/20, so
      extra damping helps. Raising kp to 5.0 (iteration 5) made things worse, so proportional
      gain is near its useful limit. Speed is not the constraint (no slalom timeouts
      at base_speed 0.95). The remaining hypothesis from iteration 6 is sensor coverage:
      with five sensors at +/-0.04 m and 0.02 m spacing, the tape leaves the array
      at sharp reversals before the controller can react. Change (single variable,
      the sensor layout): seven sensors evenly spaced across +/-0.04 m at about 0.0133
      m pitch, so the array covers the same width at finer resolution. Sensor weights
      are set to 50 times the sensor x-position (-2, -4/3, -2/3, 0, 2/3, 4/3, 2),
      which keeps the steering signal scale identical to the iteration 6 design (where
      weight 1 sat at x = 0.02 m). Everything else is held at the iteration 6 values
      (kp 4.5, ki 0, kd 3.0, base_speed 0.95, mass 0.6, body 0.15 x 0.12 m, track
      0.11 m, radius 0.03 m, sensor size 0.012 m, line_loss last_direction). Expected
      result: slalom off-track exits drop from 5 toward 2 or fewer and slalom progress
      rises above 0.95, with oval and s-bend unchanged near 950 and 945. Hypotheses
      to check next: (1) if slalom steering_oscillation rises above 0.32 or the oval
      shows jitter, the finer array is noisier and sensor_size should drop to 0.008
      to sharpen readings; (2) if slalom still leaves at progress near 0.92, steering
      authority at reversals is the limit and wheel_track should narrow to 0.10 m;
      (3) if the oval completion_time rises above 2.6 s, base_speed should go back
      to 0.9. Measurements requested: all metrics per track, to compare slalom finish
      count, off-track versus finished split, and line_loss_events directly with iteration
      6.


