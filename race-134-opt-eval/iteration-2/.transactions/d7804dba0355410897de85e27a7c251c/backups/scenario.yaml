map:
  id: race-134-opt-eval
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Slower speed 1.3, kd 0.4
    notes: 'Lowers base_speed from 1.5 to 1.3 with kd held at 0.4, geometry and kp
      unchanged. Iteration 1 still showed about one line loss per run on the s-bend
      and slalom with max_error near 0.062, so the speed is cut further as the Evaluator
      advised.


      ### Rationale


      Evidence from iteration 1: kd 0.4 with base_speed 1.5 raised the score from
      69.5 to 170.5, and the oval track finished 2 of 20 runs (best 955 points). Line
      loss still occurs about once per run on the s-bend (1.0) and slalom (1.05),
      and both still end off_track with max_error about 0.062, just past the 0.06
      m limit. Slalom progress is only 0.09. The line is lost once per run, so the
      departure at the sharpest bends is not yet fixed. Following the Evaluator''s
      stated rule (line losses persisting at the bend, so lower base_speed further
      before touching kp), I lower base_speed from 1.5 to 1.3. This gives the controller
      more time to correct before the array loses the tape. Geometry is unchanged:
      the five-sensor layout is not the cause, and changing it now would confound
      the test. kp 4.0, ki 0.2, kd 0.4, weights and line_loss are unchanged so that
      only one variable moves. Expected result: line_loss_events on s-bend and slalom
      fall toward 0, max_error drops below 0.06, and progress on s-bend and slalom
      rises. Completion time on the oval may rise (finished runs took about 1.86 s
      at 1.5), but 1.3 should still finish within 3.0 s if the robot stays on the
      line. Hypotheses: (a) the loss is speed-driven at the sharpest bend; (b) if
      progress stalls at low speed, the next step is base_speed about 1.4 to 1.5 with
      kd 0.4, not a gain change. Measurements wanted: line_loss_events and max_error
      per track to confirm the bend is still the failure point, plus completion_time
      on finished runs and steering_oscillation to check that kd 0.4 is not causing
      jitter.


      - [Open this output](iteration-2/entity0/versions/19b57e2a3c8348379fd28c08749ec7da/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-f0ed13356088157c/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-b0778e40f4afa15c/payload.json)'
  - id: entityR1
    label: Approve slower, damped
    notes: 'Approved the candidate that lowers base_speed 1.8 to 1.5 and raises kd
      0.2 to 0.4, because iteration 0 showed every run leaving the track at a bend
      with max_error just past 0.06. Its main risk is missing the 3.0 s finish at
      lower speed, so the feedback sets follow-up speed and kd steps depending on
      the next race.


      ### Feedback


      Judged from iteration 0 and the candidate''s contents, not from any race of
      this candidate. In iteration 0 every run on all three development tracks ended
      off_track with one line-loss event each. Max_error was about 0.062, just past
      the 0.06 m limit, while rms_error stayed low at 0.026 to 0.029. That pattern
      points to a sudden departure at a bend rather than general sloppiness, so the
      speed and derivative changes are aimed at the right failure. The candidate is
      valid: all values are inside contract limits, the sensor count matches the weights,
      and geometry is unchanged, which is correct because the sensor layout is not
      the cause. The main risk is the time limit. Lowering base_speed from 1.8 to
      1.5 reduces base PWM from about 0.90 to 0.75 of full, so completion_time may
      rise and the robot may fail to cover the course in 3.0 s, which would forfeit
      the 500-point completion bonus. This is a single, well-reasoned step that will
      show directly whether the sharp bend is the failure point, and there are ten
      iterations left, so approve it and read the telemetry before changing more.
      Interpret the next race as follows. If line_loss_events drop to zero and max_error
      falls below 0.06 but progress stalls short of the finish, raise base_speed toward
      1.7 while keeping kd at 0.4. If line losses persist at the same bend, lower
      base_speed further or raise kd before touching kp. If the robot completes, record
      completion_time and tune speed up from there.


      ### Requested changes


      - If the next race shows line_loss_events still at 1 on the sharpest bend, lower
      base_speed further (for example 1.5 to 1.3) before changing kp, since iteration
      0 showed the failure is a departure at a bend.

      - If runs stay on track with max_error below 0.06 but completion is 0 and progress
      is low, raise base_speed from 1.5 toward 1.7 with kd held at 0.4, to recover
      completion_time within the 3.0 s limit.

      - If steering_oscillation rises above the iteration 0 level of about 0.14 to
      0.16 after kd is raised to 0.4, reduce kd toward 0.3 rather than lowering kp,
      because kp 4.0 already gives a large steering range.


      - [Open this output](iteration-1/entityR1/versions/b9da49d517e945cba63b03b1db1e1f57/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/89fd3f0937094487899b99437680bae3/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-6fb202e4a71efa2b/payload.json)'
