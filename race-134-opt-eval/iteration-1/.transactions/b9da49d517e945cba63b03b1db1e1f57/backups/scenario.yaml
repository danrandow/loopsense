map:
  id: race-134-opt-eval
  schema: v0.2
  scenario: Iteration 1
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 0.
dimensions:
  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Slower, more damped run
    notes: 'Lowered base_speed 1.8 to 1.5 and raised kd 0.2 to 0.4, keeping geometry,
      kp and ki. Iteration 0 went off track on every track with one line loss each
      (progress 0.11 to 0.24), which points to speed on the sharpest bend.


      ### Rationale


      Evidence from iteration 0: every race on all three development tracks ended
      off_track, with 1 line-loss event each. Progress was only 0.11 to 0.24, and
      max_error sat at about 0.062, just past the 0.06 m off-track limit. The robot
      tracks well while it stays on the line (rms_error 0.026 to 0.029), so the failure
      is a sudden departure at a bend, not general sloppiness. Steering oscillation
      is moderate (0.14 to 0.16). The evaluator''s guidance and the contract physics
      both point to speed being too high for the sharpest curve: at base_speed 1.8
      the robot enters bends faster than the sensors and steering can hold, loses
      the line once, and ''last_direction'' recovery does not bring it back. Changes:
      (1) base_speed 1.8 to 1.5, to give the robot time to correct on the sharpest
      bend and reduce the line-loss event that ends runs. (2) kd 0.2 to 0.4, to damp
      the proportional response into curves, since kp 4.0 gives a large steering range
      (about 2800 PWM counts) and the derivative term is the cheaper stability fix.
      Following the evaluator, kp stays at 4.0 and ki at 0.2. Geometry is unchanged,
      because the sensor layout is not the cause. Expected result: zero or one line-loss
      events, max_error below the 0.06 limit on the slalom and s-bend, and some runs
      completing. Completion time will rise somewhat because speed is lower. Hypotheses:
      (a) the line loss is caused by speed on the sharpest bend, so progress should
      rise sharply once base_speed drops; (b) kd 0.4 will cut the overshoot that drives
      max_error. Measurements wanted next: completion, progress, max_error and line_loss_events
      per track, to see whether the bend is still the failure point. If runs now complete
      with low error, the next step is to raise base_speed toward 1.7 to recover completion_time
      while keeping kd at 0.4.


      - [Open this output](iteration-1/entity0/versions/89fd3f0937094487899b99437680bae3/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-58d441024c74e49e/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-6fb202e4a71efa2b/payload.json)'
  - id: entityR1
    label: 'Baseline review: approve'
    notes: 'Approved the iteration-0 baseline because it is valid and sensible, and
      no race data exists yet, so racing it is the most useful next step. Feedback
      gives conditional tuning rules for kd, kp and base_speed to apply once the oscillation
      and line-loss telemetry arrive.


      ### Feedback


      Iteration 0 has no race data yet, so this review rests on the contract and the
      candidate''s own contents. The candidate is valid: all values are inside the
      contract limits, the sensor count matches the weights, and the measurement names
      are allowed. Its geometry is coherent: the five sensors sit 0.04 m ahead of
      the axle, with antisymmetric weights (-2, -1, 0, 1, 2) whose sign matches the
      steering convention, and kp 4.0 gives a steering range of about 2800 PWM counts.
      No obvious fault is visible, so this is an exploration baseline and it should
      race. Once it races, use its telemetry to decide the next change. If steering_oscillation
      is high or max_error grows on the slalom, raise kd (for example 0.2 to 0.5)
      before changing kp. If line_loss_events occur on the sharpest bend or max_error
      rises with speed, lower base_speed (1.8 to about 1.5) rather than raising gains.
      If rms_error is large but oscillation is low, raise kp slightly (4.0 to about
      5.0). If the robot completes with little error and fast time, try raising base_speed
      toward 2.0 to improve completion_time. Do not change geometry until the controller
      telemetry is understood.


      ### Requested changes


      - If steering_oscillation or max_error is high on the s-bend or slalom, raise
      kd from 0.2 to about 0.5 before raising kp.

      - If line_loss_events occur or max_error grows on the slalom, lower base_speed
      from 1.8 to about 1.5 to test whether the sharpest curve is too fast.

      - If the run completes with low rms_error and oscillation, try base_speed near
      2.0 to reduce completion_time, keeping kp and kd unchanged.


      - [Open this output](iteration-0/entityR1/versions/c1f0add2c24648419a416a7ebdcc5c71/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/b96171cce6d0467badf66356c0cbe3c4/payload.json)'
