map:
  id: race-134-opt-eval
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Sensor size 0.016 test
    notes: 'Reverts the sensor span to ±0.04 m, which the wider span test showed lowered
      the score (238.1 to 219.9), and tests a 16 mm sensor footprint at kd 0.55. The
      iteration 5 span cut s-bend and slalom line losses but cost oval finishes, so
      the footprint is the next single variable to test.


      ### Rationale


      Evidence from iteration 5: widening the sensor span to x = ±0.06 cut line-loss
      events sharply on the s-bend (1.00 to 0.25) and slalom (1.05 to 0.85), and oval
      losses fell to 0.0. But the score fell from 238.1 to 219.9. Oval finishes dropped
      from 8 to 7 of 20, mean oval score fell from 567 to 492, and s-bend and slalom
      still end off track in every run. Completion bonuses dominate the score, so
      the wider span cost more on oval completion than it gained on losses. The Evaluator''s
      rule is to revert the span when the score falls below 238, so I revert to x
      = ±0.04 (sensor positions -0.04, -0.02, 0, 0.02, 0.04). The span result is still
      a useful signal: fewer line losses suggest sensing contributes to the failures.
      To test the next suspect while keeping the span, I change sensor_size from 0.012
      to 0.016 (16 mm footprint). Larger footprints should see the 25 mm tape earlier
      at the sharpest bends. Everything else is held at the iteration 4 values: kd
      0.55, kp 4.0, ki 0.2, base_speed 1.5, weights (-2, -1, 0, 1, 2), last_direction,
      and the same body, wheel and sensor-y geometry. So any race difference is attributable
      to sensor_size. Expected result: line_loss_events on s-bend and slalom fall
      below 1.0 while oval finishes stay at or above 8 of 20 and the score holds near
      or above 238. Risks: a larger footprint averages more background and may blunt
      the signal at the centre, which could raise rms_error or steering_oscillation.
      If the score falls below 238 or steering_oscillation exceeds about 0.32, revert
      sensor_size to 0.012 and keep the iteration 4 design. Hypotheses: (a) line losses
      at the sharpest bends come from sensors that are too small to see the tape there;
      (b) the wider span hurt oval finishes because the outer sensors see the tape
      too late on tight oval curves. Measurements wanted: line_loss_events, max_error,
      steering_oscillation and rms_error per track, plus completion and completion_time
      on the oval.


      - [Open this output](iteration-6/entity0/versions/bb48a4901eed4593808874f1be097e1b/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-c23e078970f85e47/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-1d9c26c9baac1857/payload.json)'
  - id: entityR1
    label: 'Approve: sensor_size'
    notes: 'Approves a single-variable test from the best raced design (iteration
      4, 238.1): sensor_size 0.012 to 0.016 with the span reverted to ±0.04, as iteration
      5 showed the wider span cut oval finishes. Revert and kd guidance are tied to
      the 238 score bar and the 0.32 oscillation limit.


      ### Feedback


      Judged from earlier races and this candidate''s contents only. Nothing here
      states how the candidate will perform.


      The candidate changes one variable from the best raced design (iteration 4,
      score 238.08): sensor_size goes from 0.012 to 0.016. The span returns to x =
      ±0.04, and kp 4.0, ki 0.2, kd 0.55, base_speed 1.5, weights (-2, -1, 0, 1, 2)
      and last_direction are unchanged. Iteration 5 showed that widening the span
      to ±0.06 cut line losses (s-bend 1.00 to 0.25, slalom 1.05 to 0.85) but lowered
      the score to 219.9 by cutting oval finishes from 8 to 7, so reverting the span
      is correct. Iteration 2 showed that lowering base_speed to 1.3 raised losses
      and cut the score, so speed is not the lever. The sensor_size enum includes
      0.016, the footprint (16 mm) does not overlap its neighbours at the 20 mm spacing,
      and the design is valid.


      What to do with the next race:

      - If the score holds at or above 238 and line_loss_events on the s-bend and
      slalom fall below about 1.0, keep sensor_size 0.016. Then consider a small kd
      step (0.55 to 0.6) only if steering_oscillation stays below about 0.32.

      - If the score falls below 238, or steering_oscillation rises above about 0.32,
      revert sensor_size to 0.012 and keep the iteration 4 design. Do not raise kd
      further, since iteration 4 showed the gains are shrinking.

      - If the oval finishes stay at 8 or more of 20 but rms_error rises, consider
      sensor_size 0.008 only if the larger footprint is shown to average background
      at the centre. Otherwise hold 0.012.


      Report per-track line_loss_events, max_error and steering_oscillation, plus
      oval completion and completion_time, so the sensing hypothesis can be separated
      from the damping one.


      ### Requested changes


      - Keep sensor_size at 0.016 with x = -0.04, -0.02, 0.0, 0.02, 0.04 and the other
      values from iteration 4. This tests whether a larger footprint sees the tape
      earlier at the sharpest bends, since the wider span (iteration 5) reduced line
      losses but cost oval finishes.

      - If the score falls below 238 or steering_oscillation exceeds about 0.32, revert
      sensor_size to 0.012. Iteration 4 is the best raced design, and kd gains from
      0.5 to 0.55 were the last clear step.

      - If the score holds and line losses fall below about 1.0 on the s-bend and
      slalom, consider kd 0.6 at most. Keep kp 4.0 and base_speed 1.5 fixed, because
      iteration 2 showed speed 1.3 cut the score from 170.5 to 86.8.


      - [Open this output](iteration-6/entityR1/versions/aa95302ec801424e9b3405c0d0ff2aa2/payload.json)

