map:
  id: race-134-opt-eval
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: kd 0.5 at speed 1.5
    notes: 'Restores base_speed to the best raced value (1.5) and raises kd from 0.4
      to 0.5, since iteration 2 showed lowering speed to 1.3 did not reduce line losses
      and scored 86.8. Evidence: line losses persisted at about 1 per run on the s-bend
      and slalom, and kd was the change that improved the score most.


      ### Rationale


      Evidence: iteration 1 (base_speed 1.5, kd 0.4) is the best raced design at 170.5,
      with 2 of 20 oval finishes. Iteration 2 lowered base_speed to 1.3 and scored
      86.8, with 0 finishes and more line losses on the s-bend (1.15 vs 1.0) and slalom
      (1.15 vs 1.05). So the speed reduction did not fix the line loss, and it cost
      progress and completion. Speed is therefore not the main cause. The kd change
      from 0.2 to 0.4 was the step that helped most, from 69.5 to 170.5. Following
      the Evaluator''s rule, when line losses persist at a given speed, raise kd before
      touching kp. Change: restore base_speed to 1.5, the best raced value, and raise
      kd from 0.4 to 0.5. Geometry, kp 4.0, ki 0.2, sensor weights and line_loss (last_direction)
      are unchanged, so the race result can be attributed to kd. Expected result:
      line_loss_events on the s-bend and slalom fall from about 1.0 toward 0.5 or
      less, max_error drops below the 0.06 limit on some runs, and the oval finishes
      more often than 2 of 20. Risks: steering_oscillation may rise above the earlier
      0.25 to 0.27 level, and too much kd can amplify sensor noise. If oscillation
      rises while losses persist, the next step is kd 0.45 or a small kp change. If
      line losses fall but progress stalls, base_speed should move up toward 1.6.
      Measurements wanted: line_loss_events and max_error per track, completion and
      completion_time on the oval, and steering_oscillation to check for jitter from
      the higher kd.


      - [Open this output](iteration-3/entity0/versions/10321275428141209ccaaa220e4054fa/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-acc4c0ef0ff4b276/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-05ce9131114474cd/payload.json)'
  - id: entityR1
    label: Approve kd 0.5 at speed
    notes: 'Approved the single-variable step from the best raced design (iteration
      1, 170.5): kd 0.4 to 0.5 with base_speed 1.5 restored. Iteration 2 showed that
      slowing to 1.3 hurt the score (86.8), so kd, not speed, is the lever to test.


      ### Feedback


      This candidate changes only kd, from 0.4 to 0.5, and restores base_speed to
      1.5, which is the best raced setting. Iteration 1 (base_speed 1.5, kd 0.4) scored
      170.5, the best so far. Iteration 2 showed that lowering base_speed to 1.3 cut
      the score to 86.8, with 0 oval finishes and more line losses on the s-bend (1.15)
      and slalom (1.15). Speed is therefore not the lever to pull. The kd step from
      0.2 to 0.4 gave the largest gain in iterations 0 to 1, so a further small kd
      step is the next logical test. Geometry, kp 4.0, ki 0.2, sensor weights and
      line_loss (last_direction) are unchanged, so any difference can be attributed
      to kd. Judged from the earlier races and the contents alone, the candidate is
      valid and sits within the contract limits, and it is a single-variable step
      from the best raced design. Approve it so the race can show whether line_loss_events
      on the s-bend and slalom fall, which the iteration 2 result already suggested
      is the main issue. Read the next race as follows. If line_loss_events fall and
      max_error drops below 0.06 on some runs, keep kd at 0.5 and consider a small
      base_speed rise toward 1.6 if completion_time is the limit. If steering_oscillation
      rises well above the 0.25 to 0.27 level while line losses persist, step kd back
      to 0.45 rather than changing kp. If the oval finishes more often but completion_time
      stays high, look for time gains from base_speed before touching geometry.


      ### Requested changes


      - If line_loss_events on the s-bend and slalom fall below about 1.0 and max_error
      drops under 0.06 while progress still stalls, try base_speed 1.6 with kd 0.5
      held, since speed 1.3 (iteration 2) was worse than 1.5 (iteration 1).

      - If steering_oscillation rises well above the iteration 1 level of about 0.27
      while line losses persist, reduce kd to 0.45 rather than changing kp, since
      kd 0.2 to 0.4 improved the score from 69.5 to 170.5.

      - Keep kp 4.0, ki 0.2 and the geometry fixed for the next race, so that the
      kd effect stays separable from other changes.


      - [Open this output](iteration-3/entityR1/versions/8ca7f7fcc9e844c69cc33baf28798507/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/10321275428141209ccaaa220e4054fa/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-05ce9131114474cd/payload.json)'
