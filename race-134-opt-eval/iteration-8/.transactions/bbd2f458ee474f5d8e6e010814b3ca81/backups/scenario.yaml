map:
  id: race-134-opt-eval
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: kd 0.6 on best design
    notes: 'Returns to the best raced design (iteration 4, score 238.1) with sensor_size
      0.012 and span ±0.04, and raises kd 0.55 to 0.60. Iteration 6 showed sensor_size
      0.016 drops the score to 157.9, so that change is rejected. Oscillation has
      stayed flat as kd rose, which supports this step.


      ### Rationale


      Evidence. Iteration 4 (kd 0.55, sensor_size 0.012, span x = ±0.04, base_speed
      1.5, kp 4.0, ki 0.2) is the best raced design at 238.08, with 8 of 20 oval finishes.
      Iteration 5 widened the span to ±0.06: line losses fell (s-bend 1.00 to 0.25)
      but oval finishes dropped to 7 and the score to 219.9. Iteration 6 then raced
      sensor_size 0.016 with the iteration 4 span and scored 157.9, with oval finishes
      down to 1 of 20. That result shows the 16 mm footprint hurts the score. The
      Evaluator''s feedback for this candidate was written as if sensor_size 0.016
      had not yet raced, so I did not resubmit it. Iteration 6 is the evidence I weight,
      and the 0.016 footprint is rejected.


      Change. I return to the iteration 4 geometry (sensor_size 0.012, x = -0.04 to
      0.04, y = 0.04) and make one controller step: kd 0.55 to 0.60. The gain history
      supports this. kd 0.2 to 0.4 gave +101, 0.4 to 0.5 gave +6, and 0.5 to 0.55
      gave +62. Steering_oscillation on the oval was 0.2979 at kd 0.5 and 0.2971 at
      kd 0.55, so it has not been rising with kd. The 0.32 revert threshold is still
      well clear. kp 4.0, ki 0.2, base_speed 1.5, weights (-2, -1, 0, 1, 2) and last_direction
      are held, so any change is attributable to kd.


      Expected result. A small score gain over 238 (roughly 240 to 255), with oval
      finishes at 8 or more of 20 and oscillation below about 0.32. Line losses on
      the s-bend and slalom are expected to stay near 1.0, because the sensing hypothesis
      has been tested twice and the damping lever is the one still moving the score.
      Hypotheses: (a) kd 0.6 keeps improving the score with oscillation flat; (b)
      if the score falls or oscillation exceeds 0.32, kd 0.55 is the optimum and the
      next lever is the span, at about ±0.05, which is untested. Measurements wanted:
      score, oval completion and completion_time, and per-track line_loss_events,
      max_error and steering_oscillation, so the damping effect can be separated from
      the sensing effect.


      - [Open this output](iteration-7/entity0/versions/33b9a47fe15244009e7ad57ee0d6967f/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-71a3877be0f197b9/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-d024dd6caf5fbb0b/payload.json)'
  - id: entityR1
    label: Approve kd 0.6 step
    notes: 'Approved the single-variable step kd 0.55 to 0.60 from the best raced
      design (iteration 4, 238.08), with geometry and other controller values held.
      Kd gains from iterations 0 to 4 and the oscillation level (about 0.30 against
      a 0.32 limit) support racing it; the sensor footprint branch is closed by the
      iteration 6 result.


      ### Feedback


      Judged from earlier races and this candidate''s contents only. Nothing here
      states how the candidate will perform.


      The candidate is a single-variable step from the best raced design (iteration
      4, score 238.08). Only kd changes, from 0.55 to 0.60. Geometry (sensor_size
      0.012, x = ±0.04), kp 4.0, ki 0.2, base_speed 1.5, weights (-2, -1, 0, 1, 2)
      and last_direction are held, so any race difference can be attributed to kd.
      The values are inside the contract limits.


      Evidence: kd 0.2 to 0.4 gave +101, 0.4 to 0.5 gave +6 (iteration 3), and 0.5
      to 0.55 gave +62 (iteration 4). Oval steering_oscillation was 0.298 at kd 0.5
      and 0.297 at kd 0.55, so it has not been rising with kd. The 0.32 revert threshold
      still has margin. The sensor-footprint branch is closed: sensor_size 0.016 scored
      157.9 in iteration 6, so it should not be retried. Widening the span to ±0.06
      in iteration 5 cut line losses (s-bend 1.00 to 0.25) but dropped the score to
      219.9 by reducing oval finishes from 8 to 7. Lowering base_speed to 1.3 (iteration
      2) cut the score to 86.8, so speed is not the lever.


      What to do with the next race:

      - If the score beats 238 and oval steering_oscillation stays under about 0.32,
      keep kd 0.6. The remaining line losses (about 1.0 on the s-bend and slalom)
      then point to sensing, so test an intermediate span of about ±0.05 (weights
      unchanged) next, since ±0.06 cut losses but cost finishes.

      - If the score falls below 238, or steering_oscillation exceeds about 0.32,
      revert to kd 0.55 (the iteration 4 design). Do not raise kd further, and test
      the ±0.05 span at kd 0.55 instead.


      Report per-track line_loss_events, max_error and steering_oscillation, plus
      oval completion and completion_time, so the damping effect can be separated
      from the sensing effect.


      ### Requested changes


      - If the score beats 238 and oval steering_oscillation stays below about 0.32,
      keep kd 0.6 and next test sensor span x = -0.05, -0.025, 0.0, 0.025, 0.05 with
      weights unchanged. Iteration 5 (±0.06) cut line losses but cost oval finishes,
      so an intermediate span is the next test.

      - If the score falls below 238 or steering_oscillation exceeds about 0.32, revert
      kd to 0.55 (iteration 4) and test the ±0.05 span there. Iteration 3 to 4 showed
      kd gains are shrinking, so do not raise kd above 0.6.

      - Keep kp 4.0, ki 0.2, base_speed 1.5, line_loss last_direction and sensor_size
      0.012 fixed for this race. Iteration 2 showed speed 1.3 cut the score from 170.5
      to 86.8, and iteration 6 showed sensor_size 0.016 cut it to 157.9, so these
      stay fixed to keep effects separable.


      - [Open this output](iteration-7/entityR1/versions/95454a87abff45e58b3bc19c189efcf3/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/33b9a47fe15244009e7ad57ee0d6967f/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-d024dd6caf5fbb0b/payload.json)'
