map:
  id: race-134-opt-eval
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Best design resubmitted
    notes: 'Resubmits the iteration 8 design unchanged (sensor span ±0.05, kd 0.6),
      the best raced result at 323.64. Oval steering oscillation rose to 0.40, so
      any change would be untested, and the baseline is kept as the safe choice.


      ### Rationale


      Evidence: iteration 8 (sensor span x = ±0.05, kd 0.6, sensor_size 0.012, base_speed
      1.5, kp 4.0, ki 0.2, weights (-2, -1, 0, 1, 2), last_direction) is the best
      raced design at 323.64, up from 282.45. Oval finishes rose to 14 of 20 (from
      12), and mean oval progress reached 0.93. Line losses fell on the s-bend (1.00
      to 0.75) and on the slalom held at 1.00. The Evaluator''s conditions are only
      partly met. The score beat 282.45 and finishes stayed above 12 of 20, but oval
      steering_oscillation rose to 0.40, above the 0.32 threshold. The main lever
      left is damping (kd), and kd is near its useful limit. Speed (iteration 2) and
      sensor_size 0.016 (iteration 6) are closed, and the ±0.06 span (iteration 5)
      cut finishes. Each single-variable alternative I could justify, such as kd 0.55
      at ±0.05, kp changes, or an in-between span, is untested at this span. Any of
      them could lower the score, and the current best is already the best raced result.
      So I submit the iteration 8 design unchanged. This keeps the 323.64 baseline,
      and the race measures it again. Expected result: the same score, roughly 323,
      with oval finishes of about 14 of 20 and oval steering_oscillation near 0.40.
      Hypotheses: (a) the oscillation rise comes from the wider span, which steers
      harder at the same kp and kd; (b) at this span, kd 0.6 may now be slightly too
      high for oval stability. Measurements wanted: per-track line_loss_events, max_error
      and steering_oscillation, plus oval completion and completion_time, to decide
      whether kd should drop to 0.55 at ±0.05 in the next iteration.


      - [Open this output](iteration-9/entity0/versions/1653f138ab0c43a58801a92f77384033/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-eacce24d70ffcb47/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-8a678a1c9954ea3a/payload.json)'
  - id: entityR1
    label: 'Approve: span ±0.05 test'
    notes: 'Approved the single-variable step from the best raced design (iteration
      7, 282.45): sensor span widened to ±0.05 with kd 0.6 held. This is the untested
      point between ±0.04 (best) and ±0.06 (iteration 5, cut losses but cost oval
      finishes); feedback sets revert conditions for the next race.


      ### Feedback


      Judged from earlier races and this candidate''s contents only. Nothing here
      states how the candidate will perform.


      The candidate changes one variable from the best raced design (iteration 7,
      score 282.45): the sensor span moves from x = ±0.04 to x = -0.05, -0.025, 0.0,
      0.025, 0.05. kd 0.6, kp 4.0, ki 0.2, base_speed 1.5, sensor_size 0.012, weights
      (-2, -1, 0, 1, 2) and last_direction are held. All values are inside the contract
      limits, and the sensor count matches the weights.


      Evidence for the span test: iteration 5 widened the span to ±0.06 and cut line
      losses (s-bend 1.00 to 0.25, slalom 1.05 to 0.85), but oval finishes fell from
      8 to 7 and the score fell from 238.1 to 219.9. An intermediate span of ±0.05
      is the untested point between those two results. Iteration 6 rejected sensor_size
      0.016 (157.9), so it stays fixed. Iteration 2 rejected base_speed 1.3 (86.8),
      so speed stays fixed. The kd gains are shrinking (+101, +6, +62, then +42 at
      kd 0.6 in iteration 7), and oval steering_oscillation has stayed near 0.30 to
      0.31, so kd 0.6 is the ceiling for now.


      What to do with the next race:

      - If the score beats 282.45, oval steering_oscillation stays below about 0.32,
      and line_loss_events on the s-bend and slalom fall below about 1.0, keep the
      ±0.05 span. Do not raise kd above 0.6.

      - If the score falls below 282.45, or oval finishes drop below 12 of 20, revert
      to the iteration 7 span (±0.04) at kd 0.6, which is the best raced design.

      - If the span leaves line losses unchanged but the score holds, the sensors
      are not the main limit. Then stop changing the span and treat the remaining
      losses as a controller issue rather than a sensing one.


      Report per-track line_loss_events, max_error and steering_oscillation, oval
      completion and completion_time, so the span effect can be separated from kd.


      ### Requested changes


      - Keep the ±0.05 span (x = -0.05, -0.025, 0.0, 0.025, 0.05, weights -2, -1,
      0, 1, 2) with kd 0.6, and compare it against the iteration 7 score of 282.45.
      Iteration 5 showed the ±0.06 span cut line losses but cost oval finishes, so
      the intermediate span is the test.

      - If the score falls below 282.45 or oval finishes drop below 12 of 20, revert
      the span to ±0.04 (x = -0.04, -0.02, 0.0, 0.02, 0.04) at kd 0.6, which is iteration
      7.

      - Hold kp 4.0, ki 0.2, base_speed 1.5, sensor_size 0.012 and last_direction
      fixed. Iteration 2 (speed 1.3) and iteration 6 (sensor_size 0.016) both lowered
      the score, so these stay fixed to keep effects separable.


      - [Open this output](iteration-8/entityR1/versions/7282a859b21445498a1236603a797b2a/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/bbd2f458ee474f5d8e6e010814b3ca81/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-810ac11a6d89c206/payload.json)'
