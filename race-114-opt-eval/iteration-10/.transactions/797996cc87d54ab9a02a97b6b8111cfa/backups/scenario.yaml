  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: kd 0.5 on iter 6 base
    notes: 'Reverts ki to 0.02 and the row to y = 0.03 m, then lowers kd from 0.8
      to 0.5 on the iteration 6 design (best raced, 255.7). Iteration 8 showed ki
      0.15 left max_error unchanged (0.0536 m oval), so the bias hypothesis failed
      and the damping term is the next single-variable test.


      ### Rationale


      Evidence. Iteration 8 (ki 0.15 on the iteration 6 design) scored 253.2, below
      iteration 6''s 255.7. Oval finishes held at 9 of 20, and oval max_error stayed
      at 0.0536 m (iteration 6: 0.0535). The s-bend max_error stayed at 0.0622 m (iteration
      6: 0.0623), and the slalom was unchanged. The steady-bias hypothesis is therefore
      not supported: the integral term did not move max_error. Per the approved review,
      I return ki to 0.02. The iteration 7 row move to y = 0.01 m is also reverted
      (it lowered the score to 179.1), so the row stays at y = 0.03 m. Sensor x positions,
      weights, base_speed 1.3, kp 5.0 and line_loss last_direction are unchanged from
      iteration 6.


      Change: kd from 0.8 to 0.5, on the iteration 6 design only. The evidence is
      that max_error (0.060 to 0.064 m off-track edge) has been unaffected by speed,
      kp and ki, so the remaining lever is the damping term. Iteration 0 with kd 0.3
      gave low oscillation (0.07 to 0.16), so a lower kd should not add jitter. The
      risk is that less damping raises oscillation on the oval, where iteration 6
      measured 0.32. Expected result: oval finishes at or above 9 of 20 and max_error
      at or below 0.0535 m if the lower kd reduces overshoot on bends. If finishes
      fall with oscillation rising above about 0.4, the next test is kd 0.8 with base_speed
      1.4 alone, to test the time term.


      Hypotheses to check: (a) lower kd reduces overshoot-driven off-track exits on
      the s-bend (max_error below 0.062 m); (b) oval steering_oscillation stays near
      or below 0.32. Measurements requested: completion, progress, completion time,
      rms and max error, line-loss events, steering oscillation, control effort, controller
      errors and noise robustness.


      - [Open this output](iteration-9/entity0/versions/64a43245f4ec4199a7f509f3194cc26c/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-4aaf0db9d1211f2b/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-3de8d5862329f532/payload.json)'
  - id: entityR1
    label: Approve kd 0.5 test
    notes: 'Approved one change from the best raced design (iteration 6, 255.7): kd
      0.8 to 0.5, with all else unchanged. Evidence is iteration 6''s 9 of 20 oval
      finishes and oscillation of 0.32, plus iteration 0''s low oscillation at kd
      0.3; the review makes no performance claim.


      ### Feedback


      Written before this candidate races, so it states no result for it. The candidate
      is the iteration 6 design (best raced so far, 255.7) with one change: kd lowered
      from 0.8 to 0.5. Geometry (7 sensors at y = 0.03 m, x = ±0.06 m, weights [-1,
      -0.75, -0.5, 0, 0.5, 0.75, 1]), base_speed 1.3, kp 5.0, ki 0.02 and last_direction
      are unchanged. The candidate is valid: kd is within 0 to 10 and the reverts
      of ki and sensor row are correct.


      Evidence: iteration 6 gave 9 of 20 oval finishes, line_loss 0 and oval steering_oscillation
      0.32. Iteration 0 with kd 0.3 gave oscillation of 0.07 to 0.16, so a lower kd
      should not add much jitter. Iteration 8 (ki 0.15) scored 253.2 with oval max_error
      0.0536 m against 0.0535 m in iteration 6, so the steady-bias hypothesis is not
      supported and ki should stay at 0.02. Iteration 7 (y = 0.01 m) fell to 179.1,
      so the row stays at y = 0.03 m. The main risk is that less damping raises overshoot
      on the s-bend and oval, which would show as more off-track exits.


      What to do after the race, depending on what it shows:

      - If oval finishes stay at 9 of 20 or more and oval steering_oscillation stays
      at or below about 0.4, keep kd 0.5 and test base_speed 1.4 alone for the time
      term.

      - If finishes fall below 9 of 20, or oscillation rises above about 0.4, return
      kd to 0.8 and test base_speed 1.4 alone on the iteration 6 design.

      - Do not raise ki again: the iteration 8 result shows that the integral term
      does not move max_error.


      ### Requested changes


      - Keep kd at 0.5 only if the race keeps oval finishes at 9 of 20 or more and
      oval steering_oscillation at or below about 0.4. Otherwise return kd to 0.8.
      Evidence: iteration 6 (kd 0.8) gave 9 of 20 with oscillation 0.32, and iteration
      0 with kd 0.3 gave oscillation of 0.07 to 0.16.

      - If kd 0.5 holds, change only base_speed from 1.3 to 1.4 in the next race.
      Evidence: raising base_speed from 1.2 to 1.3 lifted oval finishes from 2 to
      9 of 20 and gave a mean finish time of 1.89 s, so speed is the lever for the
      3 s time term.

      - Keep ki at 0.02 and sensor row y at 0.03 m. Evidence: ki 0.15 (iteration 8)
      left oval max_error at 0.0536 m against 0.0535 m, and y 0.01 m (iteration 7)
      dropped the score to 179.1.


      - [Open this output](iteration-9/entityR1/versions/8902d265e2c248a190d31e6f01bc1f4f/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/64a43245f4ec4199a7f509f3194cc26c/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-3de8d5862329f532/payload.json)'
