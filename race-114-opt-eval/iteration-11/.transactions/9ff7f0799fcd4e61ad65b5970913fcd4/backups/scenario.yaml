overrides:
  entities:
  - id: entity0
    label: Iteration 6 design, final
    notes: 'Reverts to the best raced design (255.7, 9 of 20 oval finishes, line_loss
      0) with base_speed 1.3. Iteration 10 at base 1.4 fell to 4 of 20 finishes, so
      the Evaluator''s return rule applies.


      ### Rationale


      Iteration 10 (base_speed 1.4, kd 0.8) scored 192.9, below the 255.7 of iteration
      6. Oval finishes fell from 9 of 20 to 4 of 20, so the stated rule applies: return
      base_speed to 1.3 on the iteration 6 design. I apply that rule and change nothing
      else.


      Why this design: iteration 6 is the best raced state (255.7, oval finishes 9
      of 20, line_loss 0, oval mean finish time 1.89 s, oval max_error 0.0535 m).
      Every later single-variable test came out lower: y = 0.01 m (179.1), ki 0.15
      (253.2, no change in max_error), kd 0.5 (56.8, finishes collapsed), base_speed
      1.4 (192.9). Iteration 6 is therefore the only measured design with a known
      good result, and this is the final iteration, so there is no later race to recover
      from a bad candidate. Only the candidate itself is raced on the unseen track.


      Geometry: 7 line sensors at y = 0.03 m, x = -0.06 to +0.06 m in 0.02 m steps,
      sensor size 0.012 m, wheel track 0.12 m, wheel radius 0.03 m, body 0.18 x 0.12
      m, mass 0.8 kg. Controller: base_speed 1.3, kp 5.0, ki 0.02, kd 0.8, weights
      [-1, -0.75, -0.5, 0, 0.5, 0.75, 1], line_loss last_direction.


      Expected result: about 9 of 20 oval finishes with line_loss 0. The unseen track
      is the main uncertainty, since the s-bend and slalom have never been finished
      in any design. Hypotheses: (a) the 1.3 speed setting holds on a different shape;
      (b) max_error stays near 0.06 m on tight bends, which limits finishes. Measurements
      requested: completion, progress, completion time, rms and max error, line-loss
      events and steering oscillation.


      - [Open this output](iteration-11/entity0/versions/946394db8d6e4400beabf587a366445e/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-1802c9cbacc1ab28/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-5d2b3a7c4e6d79ba/payload.json)'
  - id: entityR1
    label: Approve iteration 6 build
    notes: 'Approved the iteration 6 design unchanged, since it is the best raced
      state (255.7) and every later single-variable change scored lower. The final
      race is the only remaining test, so no revision fits in the budget.


      ### Feedback


      Final iteration, so the approved build races unchanged on the unseen track and
      no later revision can recover a weak candidate. The candidate is the iteration
      6 design, the best raced state (255.7). Its geometry is 7 sensors at y = 0.03
      m, x = -0.06 to +0.06 m, with weights [-1, -0.75, -0.5, 0, 0.5, 0.75, 1]. The
      controller is base_speed 1.3, kp 5.0, ki 0.02, kd 0.8, last_direction. Iteration
      6 earned 9 of 20 oval finishes with line_loss 0, and every later single-variable
      test scored lower: y = 0.01 m (iteration 7, 179.1), ki 0.15 (iteration 8, 253.2,
      no change in max_error), kd 0.5 (iteration 9, 56.8, finishes collapsed), base_speed
      1.4 (iteration 10, 192.9, finishes fell from 9 to 4). Lowering base_speed to
      1.2 (iteration 5) and widening the sensor array without the inner weights (iteration
      4) also cut finishes. The unseen track is the main uncertainty: no design has
      finished the s-bend or slalom in any race, so the outcome there depends on how
      the shape of the unseen course interacts with this steering. I am not stating
      how this candidate will perform. The decision rests on it being the best measured
      design, and a further revision cannot be tested in time.


      ### Requested changes


      - No revision is requested: approve the iteration 6 build (base_speed 1.3, kd
      0.8, ki 0.02, kp 5.0, y 0.03 m, weights [-1, -0.75, -0.5, 0, 0.5, 0.75, 1])
      unchanged. Evidence: it is the best raced design (255.7), and every single-variable
      change from it (iterations 7 to 10) scored lower.

      - Do not alter kd, ki, the sensor row or base_speed for the final race. Evidence:
      kd 0.5 collapsed finishes (iteration 9), ki 0.15 left max_error unchanged (iteration
      8), y 0.01 m lowered the score (iteration 7), and base_speed 1.4 lost finishes
      (iteration 10).

      - Keep the 7-sensor array at x = ±0.06 m with the inner weights as raced. Evidence:
      the wider array removed line loss (iteration 4 onward), and the iteration 4
      finish loss came from reduced inner weights, which the iteration 5 and 6 weights
      restored.


      - [Open this output](iteration-11/entityR1/versions/d6ce8c799adf48d7bd1180b253afbc2f/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/946394db8d6e4400beabf587a366445e/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-5d2b3a7c4e6d79ba/payload.json)'
