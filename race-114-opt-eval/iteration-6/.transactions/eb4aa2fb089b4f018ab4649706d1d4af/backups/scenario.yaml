map:
  id: race-114-opt-eval
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Speed 1.3 on wide array
    notes: 'Single-variable test: base_speed raised from 1.2 to 1.3 on the iteration
      5 design (7 sensors at ±0.06 m, weights ±1/±0.75/±0.5). Iteration 5 scored 179.9
      with zero line loss on the oval and s-bend, so the Evaluator''s plan was to
      recover completion time next.


      ### Rationale


      Evidence from iteration 5 (score 179.9, best so far). The 7-sensor array at
      x = ±0.06 m with inner weights [-1, -0.75, -0.5, 0, 0.5, 0.75, 1] removed line
      loss on the oval and s-bend (0 events), and the oval finish count rose from
      0 to 2 of 20. Max_error stayed at 0.060 to 0.062 m, so off-track exits continue,
      and the slalom still logs about one line-loss event per run. Steering oscillation
      on the oval was 0.33, below the 0.4 threshold, so kd does not need to change.
      The Evaluator''s review of iteration 5 says that if line loss stays at 0 and
      finishes recover, keep the wider array and weights, then test base_speed 1.3
      alone to recover the time term. Iteration 1 showed that speed cuts alone did
      not fix the drift, but the time term (60 points on completion_time) cannot score
      without more speed. Change: base_speed 1.2 to 1.3, and nothing else. Geometry,
      weights, kp 5.0, ki 0.02, kd 0.8 and last_direction stay as in iteration 5,
      so the race isolates speed. Expected result: line_loss_events stays near 0,
      completion_time drops toward 2.8 to 3.0 s on any finished run, and finish count
      holds at or above 2 of 20 on the oval. Risk: higher speed could push max_error
      past 0.06 m and cut finishes, as iteration 2 suggested for the opposite direction.
      Hypotheses: (a) the drift is steering-limited and not speed-limited with the
      wider array; (b) the time term becomes non-zero for finished runs. Next checks
      if the result is good: test the sensor row at y = 0.01 m for max_error. If finishes
      drop to 0 with line loss still 0, revert to base 1.2 and test that row move
      alone.


      - [Open this output](iteration-6/entity0/versions/45c309ddd989403aad78c885685af09e/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-ccf55be96fbaaf1e/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-1d14ea2c67f8e2b5/payload.json)'
  - id: entityR1
    label: 'Approve: speed 1.3 test'
    notes: 'Approved the iteration 5 best design with base_speed raised 1.2 to 1.3
      and nothing else changed, as a clean one-variable test. Evidence: iteration
      5 scored 179.9 with line loss at 0, and iterations 1 to 5 show max_error stuck
      near 0.06 m regardless of speed or gain.


      ### Feedback


      Written before this candidate races, so no result is stated for it. The candidate
      is iteration 5''s design (best raced so far, 179.9) with base_speed raised from
      1.2 to 1.3. Everything else is unchanged: 7 sensors at x = ±0.06 m, inner weights
      [-1, -0.75, -0.5, 0, 0.5, 0.75, 1], kp 5.0, ki 0.02, kd 0.8, last_direction.


      Evidence: iteration 4 (wider array, weights ±0.33/±0.67) removed line loss (about
      1 event per run down to 0) but dropped oval finishes from 2 to 0 and the score
      to 99.7. Iteration 5 restored the inner weights and kept line loss at 0 (from
      the iteration 5 race data). Iterations 1 to 3 showed that speed cuts alone (iteration
      2) and kp changes (iteration 3) did not remove the max_error of about 0.06 m.
      Iteration 5 oscillation was 0.33, below the 0.4 trigger, so kd does not need
      to change. This candidate tests one variable, speed, against the best design.
      It is valid and not obviously broken, so it is approved for the race.


      What to do after the race, depending on what it shows:

      - If line_loss stays at 0, oval finishes hold at 2 or more of 20, and completion_time
      falls on finished runs, keep base_speed 1.3. Then test the sensor row at y =
      0.01 m alone to see whether max_error falls.

      - If finishes drop to 0 while line_loss stays at 0, revert to base_speed 1.2
      (iteration 5 as raced) and test the y = 0.01 m row move alone.

      - If steering_oscillation rises above about 0.4 while max_error is below 0.05
      m, lower kd from 0.8 to about 0.5 with the current geometry.


      ### Requested changes


      - Keep the iteration 5 geometry and controller and change only base_speed, from
      1.2 to 1.3. Evidence: iteration 5 is the best raced design (179.9), and speed
      is needed to recover the time term that iteration 1 and iteration 2 showed cannot
      score without more speed.

      - If the race shows line_loss at 0 and finishes at 2 or more of 20 with completion_time
      under about 3.0 s, next test only sensor_positions row y from 0.03 to 0.01 m,
      to see whether max_error drops below 0.06 m. Evidence: max_error has stayed
      at 0.060 to 0.064 m across iterations 1 to 5 whatever the speed or gain.

      - If finishes drop to 0 while line_loss stays at 0, revert base_speed to 1.2
      and test the y = 0.01 m row move alone. Evidence: iteration 4 showed that finishes
      can be lost with the wider array, and iteration 5 at 1.2 is the best measured
      state.


      - [Open this output](iteration-6/entityR1/versions/c74db7e09a274aefa89fb1413367ed54/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/45c309ddd989403aad78c885685af09e/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-1d14ea2c67f8e2b5/payload.json)'
