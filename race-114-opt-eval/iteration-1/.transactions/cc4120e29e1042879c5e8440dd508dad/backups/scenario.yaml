overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'A conservative first candidate: five sensors at 0.02 m spacing, antisymmetric
      weights, base speed 1.6 and moderate PD gains. No race data yet, so values are
      set from the contract''s physics and sensing rules rather than telemetry.


      ### Rationale


      Iteration 0 has no race data, so this is a conservative baseline built from
      the contract''s physics and sensing rules. Geometry: five line sensors spread
      across the width at y = 0.03 m (ahead of the axle), at x = -0.04, -0.02, 0,
      0.02, 0.04 m. Spacing of 0.02 m is finer than the 25 mm tape width, so at least
      one or two sensors always see the line, and the signal varies smoothly as the
      line moves. Sensor size 0.012 m is a compromise between resolution and a wide
      footprint. Wheel track 0.12 m, wheel radius 0.03 m, mass 0.8 kg and body 0.12
      x 0.18 m are mid-range, balancing turning authority, speed and stability. Wider
      body (0.12 m) gives a larger off-track allowance, which is a safety margin.
      Controller: sensor_weights are antisymmetric (-1, -0.5, 0, 0.5, 1) so a positive
      signal (tape on the left) steers left, matching the contract. base_speed 1.6
      targets the roughly 1.5 m/s average needed to finish in under 3 s while keeping
      some margin for turns. kp 3.0 gives moderate steering (about 1050 PWM of wheel
      differential at full signal). ki 0.05 is small to avoid integral windup on long
      bends. kd 0.3 damps oscillation from the proportional term. line_loss is last_direction,
      so the robot keeps turning toward the side where it last saw the tape. Expected
      result: completion on the development tracks with modest oscillation. If the
      robot understeers on the slalom or oversteers with jitter, the next revision
      should adjust kp and kd. Hypotheses to check: (1) speed is not limited by the
      motor voltage drop at 1.6; (2) kd 0.3 is enough to damp the oscillation; (3)
      no line-loss events on the gentle oval. Measurements requested: completion,
      progress, completion time, rms and max error, line-loss events and steering
      oscillation, so the next revision can separate tracking error from speed limits.


      - [Open this output](iteration-0/entity0/versions/5afe5d38877c4d88a12e04d440668fa8/payload.json)'
  - id: entityR1
    label: 'Baseline review: approve'
    notes: 'Approved the conservative iteration-0 baseline because it is valid and
      there is no race data yet to justify revising it. The feedback gives conditional
      changes to kd, kp and base_speed, tied to what the first race''s oscillation,
      line-loss and time telemetry will show.


      ### Feedback


      Iteration 0 has no race history, so this review rests only on the public contract
      and the candidate''s contents. I found nothing invalid: all values sit inside
      their limits, the five sensor x-positions span the 25 mm tape at 0.02 m spacing,
      the weights are antisymmetric with the correct sign convention (positive steers
      left), and line_loss is a permitted option. The main unknown is whether base_speed
      1.6 (base PWM about 3276) gives enough average speed to finish in under 3 s
      without losing the line on the tighter bends. Nothing in the data can settle
      that yet, so the race is the right test. The candidate is a conservative baseline
      and the approval is for telemetry, not a claim about its performance.


      What to change after the race, depending on what it shows:

      - If steering_oscillation is high or max_error is large on the slalom, raise
      kd (for example 0.3 to 0.6) before touching kp, since kd is the damping term
      for this loop.

      - If the robot leaves the line on the sharpest bend or line_loss_events is above
      zero, either reduce base_speed (for example 1.6 to 1.3) or raise kp (for example
      3.0 to 4.0). Choose speed reduction first if completion_time is well under 3
      s, because that leaves time margin.

      - If the run completes with low rms_error and little oscillation but completion_time
      is near 3 s, raise base_speed in small steps (about 0.2) and keep kp and kd
      fixed so the change is isolated.


      ### Requested changes


      - Next race: if steering_oscillation is high or the slalom max_error is large,
      raise kd from 0.3 to about 0.6 and leave kp unchanged. Reason: kd is the damping
      term, and no race has yet shown whether 0.3 is enough.

      - Next race: if line_loss_events is above zero or the run fails on the sharpest
      bend, lower base_speed from 1.6 to about 1.3, or raise kp from 3.0 to about
      4.0 if completion_time has spare margin. Reason: the sharpest bend is the most
      likely place to lose the line at this speed.

      - Next race: if the run completes cleanly with low rms_error but completion_time
      is close to 3 s, raise base_speed in steps of about 0.2 while holding kp and
      kd fixed, so the speed effect can be isolated. Reason: the goal is under 3 s
      and the scoring rewards time.


      - [Open this output](iteration-0/entityR1/versions/6a44b3a5d489478a84ce69112c522fa0/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/5afe5d38877c4d88a12e04d440668fa8/payload.json)'
