overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'Conservative first candidate: five 8 mm sensors across the line with linear
      weights, base_speed 1.8, kp 4, kd 0.1, and last-direction line recovery. No
      race data yet, so it is chosen from the contract''s ranges and the ~1.5 m/s
      speed target.


      ### Rationale


      Iteration 0 has no race data, so this is a conservative baseline. Geometry:
      five line sensors spread across the 0.04 m width (x = -0.02 to +0.02) at y =
      0.04 m ahead of the axle. That gives enough coverage to track a 25 mm tape and
      see its centre. Sensor size is 0.008 m for fine position resolution. Wheel track
      0.12 m and radius 0.03 m give a moderate turn rate. Mass 0.8 kg and body 0.12
      x 0.18 m keep the yaw inertia moderate and the off-track limit (max(0.06, 0.0125
      + 0.03) m) reasonable. Controller: base_speed 1.8 (PWM about 90% of full) to
      target the ~1.5 m/s average needed to finish in 3 s while leaving some margin
      for turns. Sensor weights are linear across the array (-1, -0.5, 0, 0.5, 1)
      so the signal is proportional to lateral offset. kp = 4 gives roughly 1400 PWM
      of differential for a full-scale signal. ki = 0 avoids integral windup on curves.
      kd = 0.1 adds mild damping. line_loss = last_direction so the robot searches
      toward the side it last saw the tape. Expected result: completes the oval and
      s-bend, with some oscillation on the slalom. If steering_oscillation is high,
      reduce kp or raise kd. If the robot drifts wide on bends, raise kp. If it cannot
      finish in time, raise base_speed. Hypotheses to check: (1) the robot completes
      all three development tracks; (2) rms_error stays under about 0.02 m; (3) line_loss_events
      are 0 or 1.


      - [Open this output](iteration-0/entity0/versions/153debb047e94f27a675d86674ed4092/payload.json)'
  - id: entityR1
    label: Approve baseline for
    notes: 'Iteration 0 has no race data, so the review checks only validity against
      the contract, which passes for every field. Approving the conservative baseline
      gives the first telemetry; the feedback names speed, damping and gain changes
      to try depending on completion, oscillation and rms_error.


      ### Feedback


      Iteration 0 has no race data, so there is no earlier outcome to cite and nothing
      here predicts how this candidate will perform. I checked the candidate against
      the public contract: every field is inside its limit (five sensors at y=0.04
      with x from -0.02 to +0.02, sensor_size 0.008, wheel_track 0.12, wheel_radius
      0.03, mass 0.8, sensor_weights of -1 to +1, base_speed 1.8, kp 4, ki 0, kd 0.1,
      line_loss last_direction). It is valid and not obviously broken, which is the
      bar when nothing has raced. The main risk is time: the contract needs about
      1.5 m/s average to finish in 3 s, and base_speed 1.8 is roughly 90% PWM, so
      drag and turns could push completion_time toward the limit. The next race''s
      telemetry should decide the next change. If completion is 0 with progress well
      below 1, raise base_speed toward 2.0 (the cap at which extra speed stops adding).
      If steering_oscillation is high, reduce kp or raise kd. If rms_error is high
      and the robot drifts wide on bends, raise kp. Approving now gives the first
      real telemetry for the next critique.


      ### Requested changes


      - If the run does not complete or completion_time is near 3.0 s: raise controller.base_speed
      from 1.8 to 2.0, since the 3 s limit needs about 1.5 m/s average and base_speed
      above 2 adds nothing.

      - If steering_oscillation is high with rms_error acceptable: lower controller.kp
      from 4.0 to about 3.0, or raise controller.kd from 0.1 to about 0.3, to damp
      the slalom.

      - If rms_error exceeds about 0.02 m or the robot drifts wide on bends with line_loss_events
      of 0 or 1: raise controller.kp from 4.0 to about 5.0 and keep kd at 0.1.


      - [Open this output](iteration-0/entityR1/versions/30b39bdac6984d61a32beba8436bbea2/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/153debb047e94f27a675d86674ed4092/payload.json)'
