map:
  id: race-126-opt-eval
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: kp 3.0 with kd 0.8
    notes: 'Keeps the iteration 7 kd 0.8 design, which scored 304.77 with 13 of 20
      oval finishes, and lowers kp 3.5 to 3.0. The s-bend and slalom steering oscillation
      rose to 0.23 and 0.25 and both still went off track, so this reduces over-steer
      on the bends.


      ### Rationale


      Evidence from iteration 7 (kd 0.8, kp 3.5, base_speed 1.6, sensors at y = 0.07,
      x = -0.04 to +0.04, sensor_size 0.012, line_loss last_direction) scored 304.77,
      up from 64.17. The oval now finishes in 13 of 20 trials (mean finish 1.90 s,
      progress 0.91), so the 3 s time limit is not the constraint on that track. The
      s-bend and slalom still end off track (progress 0.30 and 0.19). Their steering_oscillation
      rose to 0.23 and 0.25, above the Evaluator''s 0.15 threshold, and line_loss_events
      reached 1.1 to 1.4. The derivative gain helped, but the front-weighted steering
      now looks too aggressive on the tighter bends. The Evaluator''s requested step
      for this state is to keep kd 0.8 and reduce kp from 3.5 toward 3.0. I make that
      one change: controller.kp 3.5 to 3.0. kd stays at 0.8 because the score gain
      came from it. Geometry, sensor_weights, base_speed 1.6 and line_loss last_direction
      are unchanged, so the race isolates the kp effect. Expected result: steering_oscillation
      on the s-bend and slalom falls from about 0.24 toward 0.15 or below, line_loss_events
      fall toward 1 or less, and progress on those tracks rises above the iteration
      7 values (0.30 and 0.19) while the oval finish rate holds. Hypotheses: (H1)
      lower kp reduces over-steer on the bends and so raises s-bend and slalom progress;
      (H2) if oval finishes fall or the score drops below 304.77, kp is too low for
      the oval and should go back toward 3.5 with kd 0.8 kept; (H3) if oscillation
      stays above 0.15 at kp 3.0, the next step is kp 2.5. If the robot stays on track
      on all three tracks but misses the 3 s limit, raise base_speed toward 2.0. Measurements
      wanted: completion, progress, completion_time, rms_error, max_error, line_loss_events,
      steering_oscillation and controller_errors.


      - [Open this output](iteration-8/entity0/versions/6482992498424f3eb080dca89ef9bf04/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-76a9f02f96a2e66d/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-373d76c8036327c0/payload.json)'
  - id: entityR1
    label: Approve kp 3.0 test
    notes: 'Approved the single-variable step kp 3.5 to 3.0 on the best raced design
      (kd 0.8, score 304.77), aimed at the s-bend and slalom steering oscillation
      of 0.23 and 0.25. Feedback sets follow-ups for the next race: kp 2.5 if it helps,
      a return to 3.5 if oval finishes fall, and a base_speed rise only if the bends
      hold.


      ### Feedback


      Approving the kp 3.5 to 3.0 step on the iteration 7 design. The candidate changes
      only controller.kp. Geometry (sensors at y = 0.07, x = -0.04 to +0.04, sensor_size
      0.012), kd 0.8, base_speed 1.6, line_loss last_direction and sensor_weights
      are unchanged, so the race isolates the gain effect. Iteration 7 (kd 0.8, kp
      3.5) is the best raced design at 304.77, with 13 of 20 oval finishes. Its s-bend
      and slalom runs still ended off track, with steering_oscillation of 0.23 and
      0.25 and line_loss_events of 1.1 and 1.4. That is the over-steer signal the
      kp reduction targets. The candidate is inside the contract and is not obviously
      broken. I make no claim about how it will perform. Interpret the race as follows.
      If the score is at or above 304.77 and s-bend or slalom steering_oscillation
      falls toward 0.15 with progress above 0.30 and 0.19, keep kp 3.0. Next, try
      kp 2.5 with kd 0.8 kept. If oval finishes drop below iteration 7''s 13 of 20,
      or the score falls below 304.77, kp 3.0 is too low for the oval. Return to kp
      3.5 with kd 0.8. If the robot stays on track on all three tracks but misses
      the 3.0 s limit, then speed is the constraint, so raise base_speed toward 2.0.
      The oval mean finish of 1.90 s suggests speed is not the limit there, so do
      not raise it while the bends are still failing.


      ### Requested changes


      - If the score is at or above 304.77 and s-bend or slalom steering_oscillation
      falls toward 0.15 with progress rising above 0.30 and 0.19: keep kd 0.8 and
      try controller.kp 2.5 to test whether further over-steer reduction holds the
      bends.

      - If oval finishes fall below iteration 7''s 13 of 20, or the score drops below
      304.77: return controller.kp to 3.5 with kd 0.8 kept, since the oval needs the
      stronger front-weighted steering that iteration 7 showed.

      - If the robot stays on track on all three tracks but misses the 3.0 s limit,
      raise controller.base_speed from 1.6 toward 2.0 with the chosen kp and kd, since
      oval mean finish time is 1.90 s and only the bends are failing.


