map:
  id: race-126-opt-eval
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Forward sensors y=0.07
    notes: 'Moves the wide sensor row from y=0.04 to y=0.07 m to add lookahead, with
      kp 3.5, kd 0.3 and base_speed 1.6 unchanged. Iteration 2 kept max_error at 0.061
      to 0.065 m, just over the 0.06 m limit, so the sensors are likely reacting too
      late to bends.


      ### Rationale


      Evidence: iteration 2 (wide array x = -0.04 to +0.04, sensor_size 0.012, kp
      3.5, kd 0.3, base_speed 1.6) scored 52.97. It is slightly below iteration 1''s
      55.46, and all 60 trials still went off track. Line-loss events fell from about
      2 to 1, but max_error stayed at 0.061 to 0.065 m, just over the 0.06 m limit.
      Widening the array did not stop the drift, so sensor coverage is not the main
      limit.


      The off-track limit is max(0.06, 0.0125 + body_width/4). With body_width up
      to 0.18 the limit only reaches 0.0575, so the 0.06 m floor binds and body width
      cannot relax it. The robot must stay within 0.06 m of the centre line.


      My hypothesis is that the sensors sit only 0.04 m ahead of the axle, so the
      controller sees the line too late. At 1.6 base_speed the robot covers the bend
      before the correction takes effect, and the error peaks just past 0.06 m. Moving
      the sensor row forward to y = 0.07 m gives more lookahead, so the correction
      starts earlier and the overshoot should shrink.


      Changes: (1) move all five sensors from y = 0.04 to y = 0.07 m, keeping the
      wide x spacing (-0.04 to +0.04), sensor_size 0.012 and weights unchanged; (2)
      keep kp 3.5 and kd 0.3 unchanged, since the signal scale is the same and the
      geometry is the only major change; (3) keep base_speed 1.6 and line_loss last_direction
      so that this is a single-variable test of lookahead.


      Expected result: max_error drops below 0.06 m, line_loss_events fall to 0 or
      1, and progress rises above 0.2 on the s-bend and slalom. Risks: the signal
      may react more to early curvature, so steering_oscillation could rise. If max_error
      still exceeds 0.06 m with line loss at 0 or 1, the next step is a higher kd
      to damp overshoot. If line loss stays near 1 to 2, test line_loss search_left
      or search_right. If the robot stays on track but does not finish, raise base_speed
      toward 2.0.


      - [Open this output](iteration-3/entity0/versions/9f007c623b574cb78caf6f4f157533b2/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-24242e872ee261f6/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-6bef837bc5e4df58/payload.json)'
  - id: entityR1
    label: Approve wider sensor
    notes: 'Approved the wider array (x ±0.04 m, sensor_size 0.012, kp 3.5) because
      iterations 0 and 1 all went off track with the narrow ±0.02 m array, and the
      geometry is the likeliest cause. The decision is based on the diagnosed sensor-coverage
      gap, not on any predicted result for this candidate.


      ### Feedback


      Evidence base: iteration 1 (kp 2.5, kd 0.3, base_speed 1.6, sensors at x = -0.02
      to +0.02, sensor_size 0.008) scored 55.46. All 60 trials went off track. Progress
      was 0.11 to 0.16, max_error was 0.061 to 0.063 m (just over the 0.06 m limit),
      and s-bend and slalom each had about 2 line-loss events. Iteration 0 (kp 4.0,
      kd 0.1, base_speed 1.8) had the same geometry and also failed on every trial,
      so gain changes alone have not fixed the failure. Read from the candidate itself:
      the sensors span only +/-0.02 m, while the tape edge sits at 0.0125 m, so the
      outer sensors lose the tape at roughly 0.02 m of drift. The wider array (x =
      -0.04 to +0.04), the larger sensor_size (0.012 m) and kp 3.5 address that directly.
      All values are inside the public contract. The main uncertainty is that the
      signal scale changes with spacing, so kp 3.5 may over- or under-steer. I have
      no measured outcome for this candidate, so the next race decides the next step.
      If line_loss_events fall to 0 or 1 and max_error stays under 0.06 m, keep the
      geometry and move base_speed toward 2.0 for completion time. If runs still leave
      the track with about 2 line-loss events, test line_loss ''search_left'' or ''search_right''
      with this geometry before more gain changes. If steering_oscillation rises above
      about 0.15, lower kp toward 2.5.


      ### Requested changes


      - If line_loss_events fall to 0 or 1 and max_error stays below 0.06 m but runs
      do not finish: raise controller.base_speed from 1.6 toward 2.0, keeping kp 3.5,
      kd 0.3 and the wider geometry, since the line is now held.

      - If runs still leave the track with line_loss_events near 2: keep the geometry
      and change controller.line_loss from ''last_direction'' to ''search_left'' or
      ''search_right'', since iteration 1 showed gains alone did not stop the loss
      at the 0.06 m limit.

      - If steering_oscillation rises above about 0.15 with the robot staying on track:
      lower controller.kp from 3.5 toward 2.5 to match the wider sensor signal, keeping
      kd at 0.3 and the sensor geometry unchanged.


