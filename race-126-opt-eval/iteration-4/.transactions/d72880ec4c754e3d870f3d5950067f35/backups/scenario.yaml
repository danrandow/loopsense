map:
  id: race-126-opt-eval
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Forward sensors y=0.07
    notes: 'Moves the wide sensor row from y=0.04 to y=0.07 m to add lookahead, with
      kp 3.5, kd 0.3 and base_speed 1.6 unchanged. Iteration 2 kept max_error at 0.061
      to 0.065 m, just over the 0.06 m limit, so the sensors are likely reacting too
      late to bends.


      ### Rationale


      Evidence: iteration 2 (wide array x = -0.04 to +0.04, sensor_size 0.012, kp
      3.5, kd 0.3, base_speed 1.6) scored 52.97. It is slightly below iteration 1''s
      55.46, and all 60 trials still went off track. Line-loss events fell from about
      2 to 1, but max_error stayed at 0.061 to 0.065 m, just over the 0.06 m limit.
      Widening the array did not stop the drift, so sensor coverage is not the main
      limit.


      The off-track limit is max(0.06, 0.0125 + body_width/4). With body_width up
      to 0.18 the limit only reaches 0.0575, so the 0.06 m floor binds and body width
      cannot relax it. The robot must stay within 0.06 m of the centre line.


      My hypothesis is that the sensors sit only 0.04 m ahead of the axle, so the
      controller sees the line too late. At 1.6 base_speed the robot covers the bend
      before the correction takes effect, and the error peaks just past 0.06 m. Moving
      the sensor row forward to y = 0.07 m gives more lookahead, so the correction
      starts earlier and the overshoot should shrink.


      Changes: (1) move all five sensors from y = 0.04 to y = 0.07 m, keeping the
      wide x spacing (-0.04 to +0.04), sensor_size 0.012 and weights unchanged; (2)
      keep kp 3.5 and kd 0.3 unchanged, since the signal scale is the same and the
      geometry is the only major change; (3) keep base_speed 1.6 and line_loss last_direction
      so that this is a single-variable test of lookahead.


      Expected result: max_error drops below 0.06 m, line_loss_events fall to 0 or
      1, and progress rises above 0.2 on the s-bend and slalom. Risks: the signal
      may react more to early curvature, so steering_oscillation could rise. If max_error
      still exceeds 0.06 m with line loss at 0 or 1, the next step is a higher kd
      to damp overshoot. If line loss stays near 1 to 2, test line_loss search_left
      or search_right. If the robot stays on track but does not finish, raise base_speed
      toward 2.0.


      - [Open this output](iteration-3/entity0/versions/9f007c623b574cb78caf6f4f157533b2/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-24242e872ee261f6/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-6bef837bc5e4df58/payload.json)'
  - id: entityR1
    label: Approve lookahead test
    notes: 'Approved the single-variable test that moves all sensors forward to y
      = 0.07 m, since iterations 0 to 2 all failed on max_error near 0.06 m and widening
      the array did not fix it. Approval gives telemetry for the next critique while
      keeping action runs for a revision if needed.


      ### Feedback


      Evidence base: iterations 0 to 2 all went off track on every trial (60/60 each).
      Scores were 30.8, 55.5 and 53.0. Max_error sat at 0.061 to 0.065 m, just over
      the 0.06 m floor. Line-loss events fell from 2 (iteration 0 and 1) to 1 (iteration
      2, widened array with sensor_size 0.012). Widening the array and raising kp/kd
      did not stop the drift, so the sensor row position is the next lever to test.
      Read from the candidate: all five sensors move from y = 0.04 to y = 0.07 m,
      with x spacing, sensor_size 0.012, weights, kp 3.5, kd 0.3, base_speed 1.6 and
      last_direction all unchanged. That makes this a single-variable test of lookahead,
      which is the right test given iteration 2 ruled out sensor width as the main
      limit. Nothing here predicts its outcome. The changes below depend on what the
      next race shows. If max_error drops below 0.06 m and line_loss_events fall to
      0 or 1, keep y = 0.07 and raise base_speed toward 2.0 for completion time. If
      max_error still exceeds 0.06 m with line loss at 1 or more, raise kd toward
      0.5 to damp overshoot. If line-loss events stay near 1 or 2, test line_loss
      search_left or search_right. If steering_oscillation rises above about 0.15
      while the robot stays on track, reduce kp toward 2.5 because the signal is now
      stronger at the front.


      ### Requested changes


      - If max_error is below 0.06 m with line_loss_events 0 or 1 but runs do not
      finish: raise controller.base_speed from 1.6 toward 2.0, keeping sensor y =
      0.07, since iteration 2 shows the line is now held and the 3 s limit needs about
      1.5 m/s.

      - If max_error still exceeds 0.06 m with line_loss_events of 1 or more: raise
      controller.kd from 0.3 toward 0.5 to damp overshoot on bends, keeping the forward
      sensor row, since iterations 1 and 2 showed max_error stuck near 0.061 to 0.065
      m at kd 0.3.

      - If line_loss_events stay near 1 to 2 after the sensor move: change controller.line_loss
      from ''last_direction'' to ''search_left'' or ''search_right'', since no gain
      or width change so far has reduced the loss below 1 per run.


