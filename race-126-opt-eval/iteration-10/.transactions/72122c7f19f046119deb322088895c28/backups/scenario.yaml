map:
  id: race-126-opt-eval
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: kd 1.0, base_speed 1.4
    notes: 'Keeps the best raced design (kd 1.0, score 387.98) and lowers base_speed
      from 1.6 to 1.4 to cut bend overshoot on the s-bend and slalom, which still
      fail with steering_oscillation near 0.20. Falls back to base_speed 1.6 if the
      oval finish rate drops.


      ### Rationale


      Evidence from iteration 9 (kd 1.0, kp 3.5, base_speed 1.6, sensors y 0.07 at
      x -0.04 to +0.04, sensor_size 0.012, line_loss last_direction) scored 387.98,
      the best raced design so far. The oval finished 20 of 20 (mean 1.875 s, progress
      0.997). The s-bend improved to progress 0.35 (from 0.30) and the slalom stayed
      flat at 0.18 (from 0.19). Both bends still end off track with steering_oscillation
      about 0.19 to 0.20, which is below the 0.25 level the Evaluator flagged as the
      sign of gain-limited overshoot. Iteration 8 showed that lowering kp alone did
      not help. The remaining lever, per the Evaluator and the race data, is speed:
      at 1.6 the robot is still overshooting the tighter bends. Change: controller.base_speed
      1.6 to 1.4, the only variable. kd stays at 1.0, kp at 3.5, and geometry and
      line_loss are unchanged. Expected result: lower speed reduces bend overshoot,
      so s-bend and slalom progress rise above 0.35 and 0.18, and the score holds
      at or above 387.98. Oval should still finish, since its mean time of 1.875 s
      at 1.6 scales to about 2.1 s at 1.4, inside the 3.0 s limit. Risks: the oval
      finish margin shrinks, and the completion-time term drops slightly. Fallback:
      if the oval finishes fall below 20 of 20 or the score falls below 387.98, return
      base_speed to 1.6 with kd 1.0, since that is the best raced design. If the bends
      still fail with progress at or below 0.35 and 0.18, the next test is kd 1.2
      at base_speed 1.4, to see whether more damping helps the slalom. Measurements
      wanted: completion, progress, completion_time, rms_error, max_error, line_loss_events,
      steering_oscillation and controller_errors on all three tracks.


      - [Open this output](iteration-10/entity0/versions/92bf17657bba45169afe2bd904edad05/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-fc81c2b8d29e9ba1/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-938b158fe5aa2fbc/payload.json)'
  - id: entityR1
    label: Approve kd 1.0 damping
    notes: 'Approved the single-variable kd 0.8 to 1.0 candidate on the iteration
      7 best design (304.77). kd 0.3 to 0.8 produced the only large gains, but oscillation
      rose at kd 0.8, so the race will show whether more damping helps or amplifies
      noise. Fallback to kd 0.8 is written in the requested changes.


      ### Feedback


      Written before this candidate has raced. The candidate (entity0) is the iteration
      7 build (kd 0.8, kp 3.5, base_speed 1.6, sensors y 0.07 at x -0.04 to +0.04,
      sensor_size 0.012, line_loss last_direction) with one change: controller.kd
      0.8 to 1.0. Geometry, kp, base_speed, line_loss and sensor_weights are unchanged,
      so the race isolates derivative damping. The evidence so far: kd 0.3 to 0.5
      (iterations 3 to 4) cut oval steering_oscillation from 0.19 to 0.11 and gave
      about +1.5 points, and kd 0.5 to 0.8 (iterations 4 to 7) moved the score from
      64.17 to 304.77, with 13 of 20 oval finishes. Iteration 8 showed that kp 3.0
      at kd 0.8 scored 296.66, below iteration 7, so kp is not the lever to push.
      The risk is that the derivative is amplifying sensor noise. At kd 0.8, steering_oscillation
      rose to 0.32 on the oval and 0.23 and 0.25 on the s-bend and slalom, which are
      the tracks still failing. Going to kd 1.0 extends that trend, so a rise in oscillation
      is plausible. Nothing here predicts this candidate''s result. Interpret the
      race as follows. If the score is at or above 304.77 and the s-bend or slalom
      progress rises above 0.30 and 0.19, keep kd 1.0 and consider a base_speed reduction
      next. If the score falls below 304.77 or oval finishes drop below 13 of 20,
      revert to kd 0.8, which is the best raced design. If the bends still fail with
      steering_oscillation at or above 0.25, the derivative is past its useful range
      and the next lever is base_speed, not gain. Approve now: this is the only remaining
      action-run budget for a clean derivative test and there are two iterations left,
      so the race telemetry is worth more than another revision round.


      ### Requested changes


      - If the score is below 304.77 or oval finishes fall below 13 of 20: revert
      controller.kd to 0.8 with kp 3.5, since iteration 7 is the best raced design
      and kd above 0.8 increased oscillation (oval 0.11 to 0.32 across kd 0.5 to 0.8).

      - If the score is at or above 304.77 but s-bend or slalom progress stays at
      or below 0.30 and 0.19 with steering_oscillation above about 0.25: keep kd near
      1.0 and lower controller.base_speed from 1.6 toward 1.4, since the bends are
      overshooting and iteration 8 showed kp reduction alone did not clear them.

      - If the robot stays on track on all three tracks but misses the 3.0 s limit:
      raise controller.base_speed from 1.6 toward 2.0 with the chosen kd, since the
      oval mean finish of 1.90 s shows speed is not the limit there and the bends
      are the constraint.


      - [Open this output](iteration-9/entityR1/versions/2381fde3043346bb92fc5c74c3dee1c1/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/a9b87ad02f274fd4af570ec3ef0bb3e3/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-e6e2b8d0773c0e7b/payload.json)'
