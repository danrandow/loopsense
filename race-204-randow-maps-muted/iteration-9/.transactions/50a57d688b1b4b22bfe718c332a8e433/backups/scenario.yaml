map:
  id: race-204-randow-maps-muted
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Mass 0.8 kg isolated test
    notes: 'Keeps the best iteration-1 design and changes only mass (0.6 to 0.8 kg),
      the one geometry lever never isolated. Iterations 1 to 8 show the sensor layout,
      lead and wheel_track are at a plateau, so this tests whether extra yaw inertia
      damps the excursions.


      ### Rationale


      Scores so far: iteration 1 = 114.39 (best), iteration 8 = 113.36 (the current
      authorized race, wheel_track 0.09). Every run in every iteration ended off track
      with zero finishes. Max error sits at 0.061 to 0.068 m, just over the 0.06 m
      off-track floor, while RMS error stays at 0.023 to 0.031 m. The robot tracks
      well until one excursion carries it past the edge.


      What is now settled: the 5-sensor, 12 mm array at x = ±0.05 m (0.025 m spacing)
      is the best sensor layout tested. The 7-sensor 16 mm array and the 5-sensor
      8 mm array both did worse. The sensor lead peaks near 0.03 m (0.02 m gave 91.8,
      0.04 m gave 109.9, 0.03 m gave 114.4). Wheel_track is near its optimum at 0.09
      to 0.10 m (0.11 cut oscillation but also cut progress). Body width cannot help,
      because the off-track limit max(0.06, 0.0125 + body_width/4) is floored at 0.06
      m across the allowed range.


      What is untested: mass has never been isolated. Iteration 4 changed mass, body_length
      and wheel_radius together and overshot, with oscillation rising to 0.33. Iteration
      0 used mass 0.8 but was confounded with other changes and scored low. So mass
      is the one drivetrain lever left with no clean reading.


      Decision: return to the iteration-1 design (wheel_track 0.10, the best measured
      setting) and change only mass, from 0.6 to 0.8 kg. Heavier mass adds yaw inertia
      and traction, which should damp the overshoot that iteration 4 showed, while
      leaving the sensor and track geometry untouched. Expected result: steering_oscillation
      at or below about 0.28 and max_error nearer 0.06 m, with oval progress held
      near 0.47. Risk: the extra inertia slows turn response, which could cut progress
      as wheel_track 0.11 did.


      - [Open this output](iteration-9/entity0/versions/6480b58eaef845199712a70334279747/payload.json)

      - Based on: [entityR2A](iteration-9/entityR2A/versions/carried-40823269d07526cc/payload.json)'
  - id: entity1
    label: Complete Robot Package
    notes: 'Complete Robot Package. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 1 (wheel_track 0.10, mass 0.6, 5 sensors at 12 mm, y 0.03 m, kp 2.5,
      kd 0.30, base 1.5) is the best measured design at 114.39. Every run in every
      iteration ends off track, with max_error at 0.061 to 0.068 m against the 0.06
      m floor and rms_error at 0.023 to 0.031 m. The sensor tests have bracketed the
      layout: lead 0.02 m gave 91.8, 0.04 m gave 109.9, 8 mm gave 102.8 and 16 mm
      with seven sensors gave 65.7. Iteration 4 (mass 0.5, wheel_radius 0.04, base
      1.8) raised oscillation to 0.33 without a progress gain, so extra responsiveness
      is not the answer. Iteration 7 (wheel_track 0.11) cut oval oscillation from
      0.282 to 0.259 but cost oval progress (0.471 to 0.416). Iteration 8 (wheel_track
      0.09) gave 113.36 and kept progress near iteration 1, so the track width is
      near its optimum. Mass has never been isolated cleanly. The Builder''s entity0
      asks for a single-variable test: mass 0.8 kg on the iteration-1 design. I accept
      that geometry exactly as specified. For the controller I keep every iteration-1
      value (kp 2.5, ki 0, kd 0.30, base_speed 1.5, weights [-2,-1,0,1,2], last_direction),
      so the race measures only the mass effect. Extra yaw inertia from the heavier
      body should damp the bend overshoot that drives max_error past 0.06 m. The risk
      is that slower turn response costs oval progress, as the wider track did. Expected:
      steering_oscillation at or below about 0.28 and oval progress near 0.47. This
      is an expectation, not a measured result.


      - [Open this output](iteration-9/entity1/versions/4222f67375dd4d5ab74aa9ef25fbd0d9/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/6480b58eaef845199712a70334279747/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-40823269d07526cc/payload.json)'
  - id: entityR1
    label: Integration Feedback
    notes: 'Integration Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Evidence
      from earlier races: iteration 1 (mass 0.6, track 0.10, score 114.39) is the
      reference, with oval progress 0.47, oval oscillation 0.28 and max_error 0.061
      to 0.066 m. Iteration 7 (track 0.11) cut oscillation to 0.259 but cut oval progress
      to 0.416, so extra damping costs progress. Iteration 8 (track 0.09) kept progress
      near iteration 1 (oval 0.456) with oscillation 0.251, so the track is near its
      optimum. Iteration 4 (mass 0.5 with a faster drivetrain) raised oscillation
      to 0.33, so less inertia makes the robot twitchier. Sensor lead 0.02 m and 0.04
      m both scored below 0.03 m, and the 5-sensor 12 mm layout is the best measured.
      Integration point: I kept the iteration-1 controller exactly, so the only change
      in the race is mass. Heavier mass adds yaw inertia and traction, which should
      slow the overshoot. Change the next design by what the race shows. If oscillation
      falls to about 0.28 or below and oval progress holds at or above 0.47, mass
      is a real lever: try 0.9 kg next. If oscillation falls but progress drops below
      about 0.44, the extra inertia is slowing the turn, so return to 0.6 kg and use
      controller damping instead. If oscillation is unchanged, mass is not the limit,
      and the remaining gain must come from the controller.


      ### Requested changes


      - If steering_oscillation falls to about 0.28 or below on the oval and oval
      progress holds at or above 0.47, set mass to 0.9 kg (from 0.8). Iteration 1
      showed max_error of 0.064 to 0.066 m with small rms_error, so the excursion
      is bend overshoot that more yaw inertia should damp.

      - If oval progress falls below about 0.44 with lower oscillation, return mass
      to 0.6 kg (iteration 1) and keep wheel_track 0.10 m. Iteration 7 showed that
      damping bought by a geometry change can cost progress, so the balance point
      is near iteration 1.

      - Keep the five-sensor 12 mm layout at y 0.03 m (x -0.05 to +0.05). Iteration
      5 (lead 0.02 m, score 91.8) and iteration 6 (lead 0.04 m, score 109.9) both
      fell below iteration 1.


      - [Open this output](iteration-9/entityR1/versions/4222f67375dd4d5ab74aa9ef25fbd0d9/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/6480b58eaef845199712a70334279747/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-40823269d07526cc/payload.json)'
