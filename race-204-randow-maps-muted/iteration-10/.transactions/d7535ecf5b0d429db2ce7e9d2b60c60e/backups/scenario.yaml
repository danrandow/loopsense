map:
  id: race-204-randow-maps-muted
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Scores so far: iteration 1 = 114.4 (best), iteration 8 = 113.4, iteration 4
      = 110.2, iteration 6 = 109.9, iteration 7 = 107.6, iteration 9 = 106.0, iteration
      3 = 102.8, iteration 5 = 91.8, iteration 2 = 65.7, iteration 0 = 52.3. Every
      run has ended off track with zero finishes. Max error is 0.061 to 0.068 m against
      the 0.06 m off-track floor, while RMS error stays at 0.023 to 0.031 m. The robot
      tracks well until one excursion takes it over the edge.


      The sensor layout is settled. The 5-sensor, 12 mm array at x = ±0.05 m (0.025
      m spacing) beat the 7-sensor 16 mm and 5-sensor 8 mm variants. The sensor lead
      peaks near 0.03 m (0.02 m gave 91.8, 0.04 m gave 109.9). Wheel_track is near
      its plateau at 0.09 to 0.10 m, since 0.11 cut oscillation but also cut progress.
      Body width cannot help, because the 0.06 m floor governs the off-track limit.


      Mass has now been isolated in one direction. Iteration 9 raised mass from 0.6
      to 0.8 kg with everything else at iteration 1, and the score fell from 114.4
      to 106.0. Oval progress fell from 0.47 to 0.49 (up, but oval scoring rose only
      slightly), while s-bend progress fell from 0.26 to 0.16 and slalom changed little.
      So extra inertia hurts the bends. The reverse direction is untested cleanly:
      iteration 4 also cut mass to 0.5 but changed radius and length at the same time
      and overshot. My decision is to test mass 0.5 kg alone on the iteration-1 design,
      which lowers yaw inertia and should help the bends that the 0.8 kg result hurt.
      Expected result: s-bend progress above 0.26 and a score near or above 114. The
      risk is that the lighter robot oscillates more, as iteration 4 did.


      - [Open this output](iteration-10/entity0/versions/d26c432420354ed9bed632d81bb1584b/payload.json)

      - Based on: [entityR2A](iteration-10/entityR2A/versions/carried-ddf9ca78f1b73534/payload.json)'
  - id: entity1
    label: Mass 0.5 kg test package
    notes: 'Runnable package for the Builder''s mass 0.5 kg geometry, with the iteration-1
      controller unchanged so the result isolates mass. Based on iteration 9 (0.8
      kg lost s-bend progress) and the untested lighter direction.


      ### Rationale


      The Builder''s geometry tests mass 0.5 kg on the iteration-1 design. Iteration
      9 (0.8 kg) cut s-bend progress from 0.26 to 0.16 and the score from 114.4 to
      106.0, so heavier yaw inertia slows the bends. Iteration 4 cut mass to 0.5 kg
      but also changed radius, length and speed, and oscillation rose to 0.33. The
      lighter-mass direction has not been isolated. I therefore keep the controller
      exactly at iteration-1 values (base_speed 1.5, kp 2.5, ki 0, kd 0.30, weights
      [-2,-1,0,1,2], last_direction). Any score change then comes from mass alone.
      Lower mass may raise steering oscillation, but I will not add damping in the
      same race, because that would confound the test. The geometry matches the Builder''s
      proposal exactly: 5 sensors at x = -0.05 to +0.05 (0.025 m spacing), y = 0.03
      m, 12 mm footprint, wheel_track 0.10 m, wheel_radius 0.035 m, body 0.14 x 0.10
      m, mass 0.5 kg. Expected result, not measured: s-bend progress at or above 0.26,
      oval progress near 0.47, and oscillation near or below about 0.3. Risk: a lighter
      robot may overshoot more on bends.


      - [Open this output](iteration-10/entity1/versions/48d7e77b264d412d8c4dbe9cf0269f62/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/d26c432420354ed9bed632d81bb1584b/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-ddf9ca78f1b73534/payload.json)'
  - id: entityR1
    label: Mass 0.5 integration
    notes: 'Pre-race feedback for the mass 0.5 kg test. It states no outcome and gives
      conditional next steps (mass 0.4, or back to 0.6 kg with wheel_track 0.09) tied
      to iterations 1, 4, 8 and 9.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Evidence:
      iteration 1 (mass 0.6, score 114.4) is the reference, with oval progress 0.47,
      oval oscillation 0.28 and max_error 0.061 to 0.066 m. Iteration 9 (mass 0.8)
      lost score mainly on s-bend progress (0.26 to 0.16), so heavier mass hurts bends.
      Iteration 4 (mass 0.5 with a faster drivetrain) raised oscillation to 0.33 without
      a progress gain, so its lighter-mass signal is confounded. Iteration 8 (wheel_track
      0.09) kept oval progress at 0.456 with oscillation 0.251, which suggests the
      narrower track can offset some of the extra jitter a lighter body brings. Integration
      point: I kept the iteration-1 controller unchanged, so the race measures mass
      alone and I have added no damping. Change the next design by what the race shows.
      If s-bend progress rises above 0.26 and oval progress holds near 0.47 with oscillation
      at or below about 0.3, try mass 0.4 kg next. If oscillation rises above about
      0.33 without a progress gain, the lower mass is overshooting, so return to 0.6
      kg and move to controller damping rather than geometry. If s-bend progress falls,
      the lower mass is not helping, so keep 0.6 kg.


      ### Requested changes


      - If s-bend progress rises above 0.26 and oscillation stays at or below about
      0.3 at mass 0.5 kg, set mass to 0.4 kg (lower bound 0.4) next. Iteration 9 showed
      that 0.8 kg cost bend progress (0.26 to 0.16), so the trend points toward lower
      inertia.

      - If steering_oscillation rises above about 0.33 at mass 0.5 kg without a progress
      gain, set mass back to 0.6 kg and wheel_track to 0.09 m. Iteration 8 showed
      that 0.09 m held oval progress (0.456) and cut oscillation to 0.251 relative
      to the 0.10 m reference.

      - Keep the five-sensor 12 mm layout at y 0.03 m (x -0.05 to +0.05). Iteration
      5 (lead 0.02 m, score 91.8) and iteration 6 (lead 0.04 m, score 109.9) both
      fell below iteration 1 (114.4), and iterations 2 and 3 showed the 16 mm and
      8 mm footprints did not help.


      - [Open this output](iteration-10/entityR1/versions/48d7e77b264d412d8c4dbe9cf0269f62/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/d26c432420354ed9bed632d81bb1584b/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-ddf9ca78f1b73534/payload.json)'
