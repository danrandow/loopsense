overrides:
  entities:
  - id: entity0
    label: 'Final: best-measured'
    notes: 'Returns the exact Iteration 1 geometry (score 114.39), the best measured,
      since every later isolated change (lead, footprint, array, track, mass, drivetrain)
      matched or lost score. Holding it fixed gives the most reliable final and unseen-track
      race.


      ### Rationale


      This is the final iteration, and the design written here is the one that races,
      and it is the basis for the unseen-track race. Across eleven iterations no geometry
      has beaten Iteration 1 (score 114.39, oval progress 0.47, s-bend progress 0.26).
      Every run ended off track, and max_error sat at 0.061 to 0.068 m against the
      0.06 m floor. The sensor layout (5 sensors, 0.025 m spacing, ±0.05 m, 12 mm
      footprint, 0.03 m lead) was the best tested. The 7-sensor 16 mm array dropped
      oval progress to 0.23, the 8 mm array gave 0.41, and lead 0.02 m or 0.04 m both
      scored lower. On the drivetrain, wheel_track 0.10 beat 0.09 (113.36) and 0.11
      (107.60). Mass 0.6 beat 0.8 (105.98) and 0.5 (103.70). Iteration 4 (radius 0.04,
      mass 0.5, length 0.12) overshot, so the lighter, faster direction did not help.
      Body width cannot improve the off-track limit, since the 0.06 m floor governs.
      Changing geometry now would be untested, and the evidence says the remaining
      gains lie in the controller, which I do not design. So I return the exact Iteration
      1 geometry as the best-measured design. The expected result is about 114, matching
      its measured score, with no new risk on the unseen track.


      - [Open this output](iteration-11/entity0/versions/36707f6fade94ede8a07a1897b5b6648/payload.json)

      - Based on: [entityR2A](iteration-11/entityR2A/versions/carried-d2ccee52d60c3652/payload.json)'
  - id: entity1
    label: 'Final: best-measured'
    notes: 'Reproduces the Iteration 1 geometry and controller exactly, the best measured
      design at 114.39. Every later single-variable change (sensors, footprint, lead,
      track, mass, drivetrain) matched or lost to it, so no controller change is made.


      ### Rationale


      This is the final iteration, so the package reproduces the best-measured design
      exactly: Iteration 1 (score 114.39, oval progress 0.47, s-bend progress 0.26).
      Its geometry and controller were never beaten. Iteration 2 (7 sensors, 16 mm)
      fell to 65.7. Iteration 3 (8 mm footprint) gave 102.8. Iteration 4 (mass 0.5,
      radius 0.04, length 0.12, base 1.8) gave 110.2 with oscillation up to 0.33.
      Iteration 5 (lead 0.02 m) gave 91.8. Iteration 6 (lead 0.04 m) gave 109.9. Iteration
      7 (wheel_track 0.11) gave 107.6 and cost progress. Iteration 8 (wheel_track
      0.09) gave 113.36. Iteration 9 (mass 0.8) gave 106.0, and Iteration 10 (mass
      0.5) gave 103.7. Every change tested from Iteration 1 either lost score or left
      it flat, so I keep the controller unchanged. Its gains (kp 2.5, ki 0, kd 0.30,
      base 1.5, antisymmetric weights, last_direction) are the ones that produced
      the measured result. Any new controller gain would be untested on the unseen
      track and could only add risk. The observation request covers all measurements
      so the final result can be compared with Iteration 1 in full.


      - [Open this output](iteration-11/entity1/versions/adb797d3face4b09a428a094b8ea2227/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/36707f6fade94ede8a07a1897b5b6648/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-d2ccee52d60c3652/payload.json)'
  - id: entityR1
    label: 'Final: hold best design'
    notes: 'Feedback states no outcome for this candidate. It asks the Builder to
      keep the Iteration 1 sensor, mass and drivetrain values, citing Iterations 2
      to 10, and offers wheel_track 0.09 as the single alternative (Iteration 8, 113.36).


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. The Integrator
      kept the Iteration 1 controller exactly (kp 2.5, ki 0, kd 0.30, base_speed 1.5,
      weights [-2,-1,0,1,2], last_direction), because no later change beat it. Iteration
      1 is still the reference at 114.39. The Integrator had to make no new compensations
      for this geometry, since it is the same as Iteration 1. Integration point: the
      remaining off-track endings come from single excursions at bends (max_error
      0.061 to 0.068 m against the 0.06 m floor, with rms_error 0.023 to 0.031 m),
      and that is a controller response issue, not a geometry one. Iterations 4, 9
      and 10 show that more or less responsiveness from mass or drivetrain lowers
      the score. Iteration 8 (wheel_track 0.09) is the closest alternative, at 113.36.
      Change the next design by what the race shows. If this design races at about
      114 again, the result is confirmed and no change is needed. If the score falls,
      the most likely cause is measurement variance, so keep the geometry and do not
      retune.


      ### Requested changes


      - Only if a further design is still to be raced after this one: try wheel_track
      0.09 m with all else equal. Iteration 8 gave 113.36 with oval steering_oscillation
      0.251 (against 0.282 at 0.10 m) and oval progress 0.456, which is close to Iteration
      1.

      - Keep the five-sensor 12 mm layout at y 0.03 m (x from -0.05 to +0.05). Iteration
      5 (lead 0.02 m, score 91.8), Iteration 6 (lead 0.04 m, score 109.9), Iteration
      2 (7 sensors, 16 mm, 65.7) and Iteration 3 (8 mm, 102.8) all fell below Iteration
      1.

      - Keep mass at 0.6 kg and wheel_radius at 0.035 m. Iteration 9 (mass 0.8, score
      106.0) and Iteration 10 (mass 0.5, score 103.7) both lost to 0.6 kg, and Iteration
      4 (radius 0.04 with mass 0.5) gave oscillation 0.33 without a progress gain.


      - [Open this output](iteration-11/entityR1/versions/adb797d3face4b09a428a094b8ea2227/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/36707f6fade94ede8a07a1897b5b6648/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-d2ccee52d60c3652/payload.json)'
