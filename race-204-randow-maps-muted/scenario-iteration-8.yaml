map:
  id: race-204-randow-maps-muted
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Narrower track 0.09 m
    notes: 'Single-variable test of wheel_track from 0.10 to 0.09 m on the iteration-1
      design, the best measured. Iteration 7 showed that widening to 0.11 m lowered
      oscillation but cost oval and s-bend progress, so narrowing should recover progress.
      Evidence: the iteration 1 and iteration 7 race results.


      ### Rationale


      Scores so far are 52.3, 114.4 (iteration 1, best), 65.7, 102.8, 110.2, 91.8,
      109.9 and 107.6. Every run in every iteration ended off track with zero finishes.
      Max error sits at 0.061 to 0.068 m, just above the 0.06 m off-track floor, while
      RMS error stays at 0.023 to 0.031 m. The robot tracks well until a single excursion
      takes it over the edge.


      Iteration 7 isolated wheel_track by widening it from 0.10 to 0.11 m against
      the iteration-1 design. The result was mixed. Oval oscillation fell from 0.282
      to 0.259 and line-loss events fell from 0.30 to 0.25. But oval progress fell
      from 0.471 to 0.416, s-bend progress from 0.256 to 0.236, and the total score
      dropped by 6.8. So a wider track trades turn authority for damping, and on balance
      it costs progress. This suggests the optimum lies at or below 0.10 m rather
      than above it.


      The sensor lead has a peak near 0.03 m (0.02 m gave 91.8, 0.03 m gave 114.4,
      0.04 m gave 109.9). The sensor footprint and spread were tested only in combination,
      and neither beat the 5-sensor, 12 mm layout. Body width cannot help, because
      the off-track floor of 0.06 m governs across the allowed range.


      Decision: keep the iteration-1 design and change only wheel_track, narrowing
      it from 0.10 to 0.09 m. This moves in the direction that iteration 7 implies
      should raise progress, since the wider track cost progress. The cost is that
      yaw rate per wheel differential rises, so oscillation may increase above the
      iteration-1 level of about 0.28. Expected result: oval progress at or above
      0.47 and s-bend progress at or above 0.26. Max error may stay near 0.06 m, because
      it is the controller''s response to excursions that limits the run. Risk: oscillation
      and max error rise, so the robot leaves the track sooner.


      - [Open this output](iteration-8/entity0/versions/1092fe89149b4bc09406e26f9cf35a28/payload.json)

      - Based on: [entityR2A](iteration-8/entityR2A/versions/carried-308391d2cd5173b8/payload.json)'
  - id: entity1
    label: Track 0.09 m test
    notes: 'Iteration-1 controller and sensors, with wheel_track narrowed from 0.10
      to 0.09 m to recover the oval and s-bend progress that iteration 7 showed a
      wider track costs. Kp is held at 2.5 so the result compares directly with iterations
      1 and 7.


      ### Rationale


      The Builder''s geometry changes only wheel_track, from 0.10 m (iteration 1,
      score 114.4) to 0.09 m. Iteration 7 (0.11 m, controller unchanged) lowered oval
      oscillation from 0.282 to 0.259 and line-loss events from 0.30 to 0.25, but
      cut oval progress from 0.471 to 0.416 and s-bend progress from 0.256 to 0.236.
      So a wider track trades turn authority for damping, and the Builder''s direction,
      narrowing, is the one the evidence supports. Every run in all iterations ended
      off track with max_error 0.061 to 0.068 m, against the 0.06 m floor, while rms_error
      stayed at 0.023 to 0.031 m. Sensor tests show the 5-sensor, 12 mm, 0.03 m-lead
      layout is the best measured: lead 0.02 m scored 91.8 and 0.04 m scored 109.9.
      The Builder''s sensor array is therefore kept as specified.


      Controller decision: keep the iteration-1 and iteration-7 controller exactly
      (kp 2.5, ki 0, kd 0.30, base_speed 1.5, weights [-2,-1,0,1,2], last_direction).
      Keeping kp fixed preserves the single-variable comparison with iterations 1
      and 7. The turn rate per wheel differential rises by about 11 percent at 0.09
      m, so the effective gain is somewhat higher than in iteration 1. This may raise
      oscillation above 0.28 and is the trade-off to watch. No change to kd is made,
      because iteration 4 showed that extra responsiveness raised oscillation without
      a progress gain, so damping must not be reduced.


      Expected result (not measured): oval and s-bend progress near or above the iteration-1
      values, oscillation somewhat higher than iteration 7, and max_error still near
      0.06 m. The main risk is that the higher effective gain raises oscillation and
      max_error, so the robot leaves the track sooner.


      - [Open this output](iteration-8/entity1/versions/de988086aeba452ea80a70a918ec8fbe/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/1092fe89149b4bc09406e26f9cf35a28/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-308391d2cd5173b8/payload.json)'
  - id: entityR1
    label: Track-width trade-off
    notes: 'Feedback is written before the race. It rests on iteration 7, where widening
      the track cut oscillation and progress together, and on the sensor-lead results,
      which show the 0.03 m lead is best. It asks for mass 0.7 kg if progress rises
      and max_error stays high, or a return to 0.10 m if oscillation rises.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Evidence:
      iteration 1 (wheel_track 0.10, score 114.4) gave oval progress 0.47, oval oscillation
      0.28 and max_error 0.061 to 0.066 m. Iteration 7 (wheel_track 0.11, same controller)
      gave oval oscillation 0.259, line-loss 0.25, but oval progress 0.416 and s-bend
      progress 0.236, so the wider track cost progress. Iteration 4 showed that a
      lighter, more responsive drivetrain raised oscillation to 0.33 without a progress
      gain. Sensor lead and footprint tests (iterations 2, 3, 5, 6) all scored below
      iteration 1, so the 5-sensor, 12 mm, 0.03 m-lead layout should be kept. Integration
      point: the controller is unchanged (kp 2.5, kd 0.30, ki 0, base_speed 1.5, last_direction),
      and a narrower track raises turn rate per wheel differential by about 11 percent,
      so the effective gain is higher than in iteration 1. I did not retune kp, so
      that the wheel_track effect can be read cleanly. Change the next design by what
      the race shows. If oval progress is at or above 0.47 and oscillation stays at
      or below about 0.28, the narrower track is a gain, so try mass 0.7 kg to damp
      bend overshoot. If oscillation rises above about 0.3 while progress rises, the
      extra gain is causing jitter, so return to 0.10 m and use damping instead. If
      progress falls below 0.44 on the oval, the optimum is near 0.10 m, and further
      gains must come from the controller.


      ### Requested changes


      - If oval progress is at or above 0.47 and steering_oscillation stays at or
      below about 0.28 at wheel_track 0.09 m, but max_error is still at or above 0.06
      m, set mass to 0.7 kg (from 0.6). Iteration 1 showed max_error of 0.064 to 0.066
      m with small rms_error, so the excursion looks like bend overshoot that more
      yaw inertia should damp.

      - If steering_oscillation rises above about 0.3 at wheel_track 0.09 m while
      progress does not improve, return to wheel_track 0.10 m. Iteration 7 showed
      that the 0.11 m track cut oscillation from 0.282 to 0.259, so the 0.10 m setting
      is the measured balance point.

      - Keep the five-sensor 12 mm layout at y 0.03 m (x -0.05 to +0.05). Iteration
      5 (lead 0.02 m) scored 91.8 and iteration 6 (lead 0.04 m) scored 109.9, both
      below iteration 1 (114.4).


      - [Open this output](iteration-8/entityR1/versions/de988086aeba452ea80a70a918ec8fbe/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/1092fe89149b4bc09406e26f9cf35a28/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-308391d2cd5173b8/payload.json)'
