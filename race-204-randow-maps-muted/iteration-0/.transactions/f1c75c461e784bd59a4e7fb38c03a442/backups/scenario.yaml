  - id: entity0
    label: Baseline 5-sensor
    notes: 'Baseline design: five 12 mm sensors spaced 0.02 m across the line, 0.05
      m ahead of the axle, with a moderate 0.12 m track and 0.8 kg mass. No race evidence
      yet, so this rests on the contract''s limits and the off-track formula, and
      it asks for lag and spacing feedback.


      ### Rationale


      This is iteration 0, so there is no race telemetry or Integrator feedback yet.
      The public contract gives the geometry levers that matter. The off-track limit
      is max(0.06, tape_half_width + body_width/4). With a 12.5 mm tape half-width,
      body widths up to about 0.18 m still resolve to 0.06 m, so body width is nearly
      free and I keep it moderate at 0.10 m. A 12 mm sensor footprint on a 25 mm tape
      can read a full-tape value over a wide band of offsets, while still giving a
      graded reading at the edges. I place five sensors across x = -0.04 to +0.04
      at 0.02 m spacing. That covers the tape at the robot''s centre and at moderate
      lateral error, and gives the weighted signal a usable range. The sensors sit
      0.05 m ahead of the axle so the robot sees the line before it reaches the wheels,
      which should reduce oscillation on bends. The wheel track of 0.12 m and wheel
      radius of 0.03 m give a moderate turn rate per PWM difference. Mass of 0.8 kg
      and body length of 0.16 m keep yaw inertia moderate, so the robot can turn without
      excessive overshoot. Expected result: a first completed run on the oval with
      a small RMS error. The main risk is that the 0.05 m sensor lead lets the signal
      lag on tight bends, so I ask for line-loss and oscillation data to test that.


      - [Open this output](iteration-0/entity0/versions/1e9a1cacf76744e38fadf88e8a901bca/payload.json)'
