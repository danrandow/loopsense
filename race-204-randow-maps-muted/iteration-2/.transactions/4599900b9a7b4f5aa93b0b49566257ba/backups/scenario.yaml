map:
  id: race-204-randow-maps-muted
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Wider 7-sensor array
    notes: 'Extends the sensor array to seven sensors over ±0.06 m with a 16 mm footprint,
      holding the iteration-1 drivetrain and body fixed to isolate the sensor effect.
      Based on iteration 1 evidence: max_error of about 0.064 m slightly exceeds the
      0.06 m off-track limit while RMS error stays small, so the outer sensors saturate
      on bends.


      ### Rationale


      Iteration 1 raised the score from 52.3 to 114.4, almost entirely through progress
      on the oval (0.47 mean, up from 0.14). Every run still ends off track, so the
      limiting problem is edge loss, not general tracking. RMS error is small (0.026
      to 0.031 m) while max_error sits at 0.061 to 0.066 m, just above the 0.06 m
      off-track limit. The robot tracks well until a single excursion carries it past
      the edge. Steering oscillation rose from about 0.09 to 0.28 on the oval, which
      fits the narrower, lighter robot responding faster and occasionally overshooting.
      Body width is not a lever: the limit is max(0.06, 0.0125 + body_width/4), and
      even at 0.18 m that gives 0.0575 m, so the 0.06 m floor governs. The sensor
      array is the geometry lever that matters. With five sensors at 0.025 m spacing
      over ±0.05 m, the outer sensors lose the tape once the robot is roughly 0.03
      m off centre, so the signal saturates in exactly the bends where the excursion
      happens. I therefore make three geometry changes: (1) extend to seven sensors
      at 0.02 m spacing over ±0.06 m, so a graded reading persists to larger lateral
      error and the weighted average does not saturate; (2) enlarge the footprint
      from 12 mm to 16 mm, widening each sensor''s capture band so the tape is seen
      across a wider range of offsets; (3) hold wheel_track 0.10 m, wheel_radius 0.035
      m, mass 0.6 kg, body_length 0.14 m, body_width 0.10 m and sensor lead 0.03 m,
      so the drivetrain and dynamics are unchanged and the effect of the sensor change
      can be read cleanly. Expected result: max_error below 0.06 m on the oval and
      s-bend, fewer off-track endings, and progress above 0.5 on the oval. Risk: the
      16 mm footprint lowers the spatial resolution near centre and may add jitter,
      and the seven-sensor sum may amplify noise. I ask the Integrator to report whether
      the signal is smoother at the edges and whether steering oscillation rises.


      - [Open this output](iteration-2/entity0/versions/53598ca2215b41508790483da27bac46/payload.json)

      - Based on: [entityR2A](iteration-2/entityR2A/versions/carried-de1d719a64b6a062/payload.json)'
  - id: entity1
    label: 7-sensor wide array
    notes: 'Extends the Builder''s seven-sensor array (±0.06 m, 16 mm footprint) with
      matching linear weights and iteration-1 gains, so only the sensor change is
      tested. Iteration 1 max_error of 0.061 to 0.066 m is the evidence the array
      must reduce.


      ### Rationale


      Iteration 1 raced with max_error of 0.0615 to 0.066 m, just above the 0.06 m
      off-track limit, and rms_error stayed small (0.026 to 0.031 m). The robot tracks
      well until a single bend excursion carries it past the edge, so the limit is
      edge signal loss, not general tracking. Steering oscillation on the oval rose
      to 0.28, so the narrower, lighter robot is responding quickly. I accept the
      Builder''s geometry as specified: seven sensors at x = -0.06 to +0.06 with 0.02
      m spacing, y = 0.03 m, a 16 mm footprint, wheel_track 0.10 m, wheel_radius 0.035
      m, mass 0.6 kg, body 0.14 x 0.10 m. The Builder''s intent is to isolate the
      sensor change, so I hold the drivetrain-related controller values at iteration
      1 (kp 2.5, kd 0.30, ki 0, base_speed 1.5, last_direction). The only controller
      change is the weight vector, extended to seven sensors. I keep the same endpoints
      (-2 and +2) and linear spacing, so the signal scale matches iteration 1 and
      the gains stay calibrated. The 16 mm footprint covers more of the tape at a
      given offset, so the outer sensors should hold a graded reading farther out
      before saturating. Expected result: max_error below 0.06 m on the oval and s-bend,
      fewer off-track endings, and oval progress above 0.5. Main risk: the wider footprint
      and seven-sensor sum may add jitter near centre, which would show as higher
      steering_oscillation.


      - [Open this output](iteration-2/entity1/versions/d26616e03a8f47ed9758c9bb387924cb/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/53598ca2215b41508790483da27bac46/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-de1d719a64b6a062/payload.json)'
  - id: entityR1
    label: 'Feedback: mass and'
    notes: 'Pre-race feedback noting the controller change and the next-step options.
      It cites iteration 1''s max_error (0.064 to 0.066 m on the oval and s-bend)
      and steering_oscillation (0.28 on the oval) to choose between mass and footprint
      changes.


      ### Feedback


      Written before this candidate has raced. Evidence from iteration 1 (the last
      race): all 60 trials ended off track with no finishes. Oval progress was 0.47
      (up from 0.14 in iteration 0), max_error was 0.061 to 0.066 m on all three tracks,
      rms_error stayed at 0.026 to 0.031 m, and steering_oscillation rose to 0.28
      on the oval. This pattern says the robot tracks well until one excursion at
      a bend pushes max_error past the 0.06 m off-track limit, so the sensor array
      is saturating at the edge. I made one controller change for your array: the
      weights are extended to seven values, [-2, -1.33, -0.67, 0, 0.67, 1.33, 2],
      keeping the iteration-1 signal scale and the kp 2.5, kd 0.30 gains. I have no
      per-step telemetry, so I cannot say where the first off-track event occurs,
      and I cannot yet say whether the 16 mm footprint degrades centre tracking. Change
      the next design depending on what the race shows. If max_error drops below 0.06
      m on the oval and s-bend with line_loss_events near zero, keep the seven-sensor
      array and the 16 mm footprint, and test wheel_radius or base_speed for progress.
      If max_error stays at or above 0.06 m while steering_oscillation is below about
      0.3, the array is still not the limit; the next step is a sensor lead change
      rather than more spread. If steering_oscillation rises above about 0.3 and rms_error
      rises with it, the footprint is probably adding jitter, so test a smaller footprint
      before adding sensors.


      ### Requested changes


      - If max_error is still at or above 0.06 m on the oval or s-bend while steering_oscillation
      stays below about 0.3, keep the seven-sensor spread and set mass to 0.7 kg (from
      0.6). Iteration 1 showed max_error of 0.064 to 0.066 m on the oval and s-bend
      with small rms_error, so the excursion is a bend overshoot that more yaw inertia
      should damp.

      - If steering_oscillation rises above about 0.3 (iteration 1 reached 0.28 on
      the oval) and rms_error rises with it, set sensor_size to 0.012 (from 0.016)
      with the same seven positions. This tests whether the larger footprint adds
      centre jitter, a question the Builder raised and no race has answered yet.

      - If the robot holds the line (max_error below 0.06 m) but oval progress stays
      below 0.5, set wheel_radius to 0.04 m (from 0.035). Iteration 1 showed progress
      was limited by speed on the oval (0.47), and the 3.0 s limit needs an average
      speed near 1.5 m/s.


      - [Open this output](iteration-2/entityR1/versions/d26616e03a8f47ed9758c9bb387924cb/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/53598ca2215b41508790483da27bac46/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-de1d719a64b6a062/payload.json)'
