map:
  id: race-204-randow-maps-muted
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Lead 0.02 m isolated test
    notes: 'Returns to the best measured iteration-1 design and changes only the sensor
      lead from 0.03 m to 0.02 m, to test whether a shorter look-ahead cuts the edge
      excursions. Evidence: all 60+ trials end off track with max_error of 0.061 to
      0.068 m just over the 0.06 m limit, while the iteration-4 drivetrain push raised
      oscillation without a gain.


      ### Rationale


      Scores so far: iteration 0 = 52.3, iteration 1 = 114.4 (best), iteration 2 =
      65.7, iteration 3 = 102.8, iteration 4 = 110.2. Every run in every iteration
      ended off track with zero finishes. Max error sits at 0.061 to 0.068 m against
      an off-track limit of max(0.06, 0.0125 + body_width/4) = 0.06 m, while RMS error
      stays at 0.023 to 0.031 m. The robot tracks well until a single excursion carries
      it past the edge, so the lever is the response to excursions, not general tracking.
      Body width cannot help: even at 0.18 m the limit is 0.0575 m, so the 0.06 m
      floor governs.


      Sensor array tests: 7 sensors at 16 mm cut oval progress to 0.23, and 5 sensors
      at 8 mm gave 0.41. The 5-sensor, 12 mm array of iteration 1 remains the best
      sensor layout. Drivetrain tests: iteration 4 (wheel_radius 0.04, mass 0.5, body_length
      0.12) did not beat iteration 1. Oval progress was 0.46 vs 0.47, max_error rose
      to 0.068, and steering oscillation rose from 0.28 to 0.33. So the lighter, faster
      drivetrain overshoots as much as it gains.


      What has not been isolated is the sensor lead. Iteration 0 used 0.05 m and iteration
      1 used 0.03 m, but each change was made together with other changes. A lead
      of 0.03 m puts the sensors just ahead of the axle, so they see the line late
      on bends. I therefore return to the iteration-1 design, which is the best measured,
      and change only the sensor lead, from 0.03 m to 0.02 m. This is a single-variable
      test. The sensors move closer to the axle, which shortens the sensing-to-wheel
      delay on tight bends and should cut the excursion at the edge. The drivetrain
      stays at iteration 1 values (wheel_radius 0.035, wheel_track 0.10, mass 0.6,
      body_length 0.14), so any change in max_error or progress can be attributed
      to the lead.


      Expected result: oval progress at or above 0.47, max_error reduced toward or
      below 0.06 m, and fewer off-track endings than iteration 1. Risk: a lead of
      0.02 m may reduce the look-ahead too far, so the signal reacts too late and
      steering oscillation rises.


      - [Open this output](iteration-5/entity0/versions/be584812c2694f2c8e05d7b380ea74ea/payload.json)

      - Based on: [entityR2A](iteration-5/entityR2A/versions/carried-f93f9d9de4f4eab3/payload.json)'
  - id: entity1
    label: Sensor lead 0.02 m test
    notes: 'Iteration-1 design with only the sensor row moved from y 0.03 to 0.02
      m, isolating the lead that has never been tested alone. Chosen because iteration
      1 is the best measured (114.4) and iterations 2 to 4 changed sensors or drivetrain
      without beating it.


      ### Rationale


      The evidence is consistent across iterations. Every run ends off track with
      zero finishes. Max error sits at 0.061 to 0.068 m, just above the 0.06 m off-track
      floor, while RMS error stays at 0.023 to 0.031 m, so the robot tracks well until
      a single bend excursion. Body width cannot help, because the limit is max(0.06,
      0.0125 + body_width/4) and the 0.06 m floor governs even at 0.18 m. Iteration
      1 (5 sensors, 0.025 m spacing, y 0.03 m, 12 mm, wheel_radius 0.035, wheel_track
      0.10, mass 0.6, body_length 0.14, kp 2.5, kd 0.30, base 1.5) is still the best
      measured design at 114.4. Iterations 2 and 3 changed the sensor footprint or
      count and did not beat it. Iteration 4 pushed the drivetrain and gave 110.2,
      so the drivetrain is near its limit with this controller. The sensor lead has
      never been isolated: iteration 0 used 0.05 m and iteration 1 used 0.03 m, each
      with other changes. This iteration follows the Builder''s single-variable test.
      The geometry is iteration 1 with the sensor row moved from y = 0.03 m to y =
      0.02 m. The controller is iteration 1 unchanged, because the Builder asked for
      a clean isolation and no gain should be retuned until the lead effect is known.
      Expected: max_error at or below about 0.06 m and oval progress at or above 0.47.
      Risk: a 0.02 m lead gives the controller less look-ahead, which could raise
      steering oscillation above the iteration-1 level of about 0.28.


      - [Open this output](iteration-5/entity1/versions/fedc84dc1b9c420086fa0303e8e9d77f/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/be584812c2694f2c8e05d7b380ea74ea/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-f93f9d9de4f4eab3/payload.json)'
  - id: entityR1
    label: Lead test feedback
    notes: 'Feedback for the 0.02 m lead test, citing iteration 1 as the baseline
      and iteration 4''s oscillation rise. It states no outcome for the candidate
      and gives conditional next steps on max_error, oscillation and line loss.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Evidence:
      iteration 1 (best, 114.4) had oval progress 0.47, max_error 0.061 to 0.066 m,
      rms_error 0.026 to 0.031 m and oval steering oscillation 0.28. The sensor-footprint
      and count changes in iterations 2 and 3 cut progress to 0.23 and 0.41, so the
      iteration-1 array stays the reference. Iteration 4 raised drivetrain speed and
      gave 110.2, close to iteration 1 but with oscillation rising to 0.33. For this
      candidate the Integrator changed nothing in the controller: the gains are iteration
      1 exactly, so the only variable is the sensor lead, moved from 0.03 m to 0.02
      m. Integration point: sensors closer to the axle see the line later on bends,
      so the controller gets less look-ahead and may react later. Change the next
      design according to the race. If max_error drops to 0.06 m or below and oval
      progress is at or above 0.47, keep the 0.02 m lead and try mass 0.55 kg to damp
      the remaining excursions. If steering_oscillation rises above about 0.3 with
      no gain in max_error, return the lead to 0.03 m, because iteration 4 showed
      that extra speed without damping raises oscillation. If line_loss_events rise
      above the iteration-1 value of 0.3, the lead is too short for the tight bends,
      so keep 0.03 m and move to a wheel_track change.


      ### Requested changes


      - If max_error is at or below 0.06 m on the oval and s-bend with oval progress
      at or above 0.47, keep the lead at 0.02 m and set mass to 0.55 kg (from 0.6).
      Iteration 4 showed that a lighter body raises oscillation (0.33), so use only
      a small step.

      - If steering_oscillation rises above about 0.3 while max_error does not improve,
      return sensor y to 0.03 m and set wheel_track to 0.11 m (from 0.10). Iteration
      0 with a 0.12 m track gave lower oval oscillation (0.085), so this trades some
      turn authority for damping.

      - If line_loss_events rise above 0.3 on the slalom or s-bend, keep sensor y
      at 0.03 m. Iterations 1 and 4 showed the lead of 0.03 m held the line on the
      tightest bends, so do not shorten it further.


      - [Open this output](iteration-5/entityR1/versions/fedc84dc1b9c420086fa0303e8e9d77f/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/be584812c2694f2c8e05d7b380ea74ea/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-f93f9d9de4f4eab3/payload.json)'
