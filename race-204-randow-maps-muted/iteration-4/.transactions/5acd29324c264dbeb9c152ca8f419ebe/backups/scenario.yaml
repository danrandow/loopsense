  id: race-204-randow-maps-muted
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Scores so far: iteration 0 = 52.3, iteration 1 = 114.4 (best), iteration 2 =
      65.7, iteration 3 = 102.8. Every run in every iteration has ended off track,
      with 0 finishes. The limit is the off-track distance (max(0.06, 0.0125 + body_width/4)).
      Even at the maximum body_width of 0.18 m, that limit is 0.0575 m, so the 0.06
      m floor governs and body width cannot buy tolerance. Max error sits at 0.061
      to 0.066 m in every iteration while RMS error stays at 0.023 to 0.031 m. The
      robot tracks well until a single excursion takes it over the edge.


      What the sensor tests showed: iteration 2 (7 sensors, 16 mm footprint) cut oval
      progress from 0.47 to 0.23, and iteration 3 (5 sensors, 8 mm footprint) gave
      0.41 with slightly worse score than iteration 1. The 12 mm, 5-sensor array of
      iteration 1 is the best sensor configuration tested. Neither a larger nor a
      smaller footprint improved on it, so the sensor layout is close to its useful
      optimum and further sensor changes are unlikely to fix the excursions.


      What the drivetrain change showed: the largest gain (52 to 114) came in iteration
      1, when wheel_radius rose from 0.03 to 0.035, wheel_track narrowed to 0.10,
      mass fell to 0.6 kg and body_length fell to 0.14 m. Oval progress rose from
      0.14 to 0.47. That points at speed and yaw response as the lever. Speed matters
      because the robot must cover the course in under 3 s, and with the current base
      speed it is still far from finishing. Lower yaw inertia (mass times length squared
      plus width squared, over 12) should let the robot correct faster after an excursion.


      Decision: revert the sensor array to the iteration-1 layout (5 sensors at x
      = -0.05 to +0.05 with 0.025 m spacing, y = 0.03 m, 12 mm footprint), which is
      the best measured. Push the drivetrain further in the same direction: wheel_radius
      0.035 to 0.04 m for more ground speed per PWM, mass 0.6 to 0.5 kg and body_length
      0.14 to 0.12 m to cut yaw inertia further. I keep wheel_track at 0.10 m because
      it is already a good turn-authority setting and the minimum of 0.08 m would
      risk oscillation. Expected result: oval progress above 0.5, a lower or equal
      max_error, and a shorter time to reach the excursion point. Risk: the faster
      and lighter robot may oscillate more (steering_oscillation above 0.28), or the
      higher speed may push it off track sooner on tight bends.


      - [Open this output](iteration-4/entity0/versions/904231db8d56418697b9b76313aed2c1/payload.json)

      - Based on: [entityR2A](iteration-4/entityR2A/versions/carried-956fb3b1514d187a/payload.json)'
  - id: entity1
    label: 8mm footprint isolate
    notes: 'Iteration-1 array, drivetrain and controller with the sensor footprint
      cut from 12 mm to 8 mm, to test the signal-sharpness hypothesis from iteration
      2 (progress fell 0.47 to 0.23 when the footprint grew). Nothing is measured
      yet; expected progress above 0.47 on the oval.


      ### Rationale


      Iteration 2 lowered oval progress from 0.47 to 0.23 and cut oscillation from
      0.28 to 0.13 when the array was widened to seven sensors and the footprint grew
      to 16 mm. That points to the footprint, which blurs the per-millimetre signal,
      as the likely cause, so this iteration isolates it. The Builder''s geometry
      is taken as specified: five sensors at x = -0.05 to +0.05 (0.025 m spacing),
      y = 0.03 m, sensor_size 0.008 m (8 mm, a valid option), body 0.14 x 0.10 m,
      mass 0.6 kg, wheel_radius 0.035 m, wheel_track 0.10 m. Iteration 1 is the best
      race so far (score 114.4), and its drivetrain and body are unchanged here. The
      controller therefore matches iteration 1 exactly: base_speed 1.5, kp 2.5, ki
      0, kd 0.30, sensor_weights [-2, -1, 0, 1, 2], line_loss ''last_direction''.
      Changing only the footprint keeps the comparison with iteration 1 clean. The
      weights stay antisymmetric and match the five-sensor layout. The 8 mm footprints
      still overlap the 25 mm tape across the offsets that matter, so no dead zones
      are expected. Expected result, which is not measured: oval progress above 0.47,
      max_error near or below 0.06 m, and fewer off-track endings than iteration 1.
      The main risk is that a sharper signal raises steering_oscillation above 0.28,
      which would indicate the drivetrain needs damping.


      - [Open this output](iteration-3/entity1/versions/5c4ce97228cd479a9fb149c2e94adedd/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/75fad68cee2b4a729e239b1ac9485d55/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-b444603c6624a016/payload.json)'
  - id: entityR1
    label: Feedback on 8mm test
    notes: 'Feedback built on the iteration 2 collapse in oval progress (0.47 to 0.23)
      and iteration 1''s best score. It gives three changes keyed to whether the next
      race shows overshoot, oscillation or speed as the limit.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Evidence
      from iteration 2 (the last race): widening to seven sensors at 0.02 m spacing
      with a 16 mm footprint cut oval progress from 0.47 to 0.23 and lowered oscillation
      from 0.28 to 0.13, while max_error stayed at about 0.062 m on the oval. The
      robot became smoother but covered less track, so a wider, blurrier signal seems
      to under-respond on bends. For this candidate, the controller is unchanged from
      iteration 1 (kp 2.5, kd 0.30, ki 0, base_speed 1.5, last_direction, weights
      [-2,-1,0,1,2]), so the race result depends only on your footprint change. The
      integration point to watch is that 8 mm footprints still overlap the 25 mm tape
      across the offsets that matter, so no line-loss dead zone is expected at the
      0.025 m spacing. Change the next design by what the race shows. If oval progress
      rises above 0.47 and max_error stays near 0.06 m, keep the 8 mm footprint and
      narrow the sensor spread or raise turn authority. If steering_oscillation rises
      above about 0.28 while max_error stays at or above 0.06 m, the sharper signal
      is adding jitter, so the drivetrain or the controller damping needs to change
      rather than the sensors. If line_loss_events increase above the iteration-1
      value of 0.3, the signal has too little overlap at the edges and the array spread
      should widen slightly.


      ### Requested changes


      - If oval progress stays at or above 0.47 but max_error is still at or above
      0.06 m with steering_oscillation below about 0.3, set mass to 0.7 kg (from 0.6).
      Iteration 1 showed max_error of 0.064 to 0.066 m on the oval and s-bend with
      small rms_error, so the excursion is a bend overshoot that more yaw inertia
      should damp.

      - If steering_oscillation rises above about 0.3 (iteration 1 reached 0.28 on
      the oval) and rms_error rises with it, keep sensor_size at 0.008 and set wheel_track
      to 0.12 m (from 0.10 m). Iteration 0 with a 0.12 m track showed lower oval oscillation
      (0.085), so this trades some turn authority for damping.

      - If oval progress falls below 0.47 with the 8 mm footprint, the sharper signal
      is not the bottleneck; set sensor_size back to 0.012 m (the iteration-1 value)
      and set wheel_radius to 0.04 m (from 0.035 m). Iteration 1 showed oval progress
      was limited by speed (0.47 of the course), and the 3.0 s limit needs about 1.5
      m/s average speed.


      - [Open this output](iteration-3/entityR1/versions/5c4ce97228cd479a9fb149c2e94adedd/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/75fad68cee2b4a729e239b1ac9485d55/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-b444603c6624a016/payload.json)'
