  id: race-143-randow-maps
  schema: v0.2
  scenario: Iteration 1
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 0.
dimensions:
  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Wider, forward array v1
    notes: 'Widened the sensor array to ±0.03 m, moved it forward to y=0.06 m, and
      narrowed the wheel track to 0.11 m with mass 0.7 kg. Iteration 0 went off track
      in all 60 trials with max_error near the 0.06 m limit, so the change targets
      earlier line detection and sharper turning.


      ### Rationale


      Iteration 0 raced in all 60 trials across three tracks and every run went off
      track (finish rate 0). Progress stalled at 0.08 to 0.15, and max_error (0.060
      to 0.069 m) reached or exceeded the 0.06 m off-track limit. Line-loss events
      were 1 to 2 per run. The evidence points at the robot losing the line on bends,
      not at speed, since runs ended before any time limit mattered. Three geometry
      levers follow from this. (1) Widen the sensor array from ±0.02 m to ±0.03 m,
      as the Integrator suggested, so the outer sensors see the tape sooner and the
      signal reacts before the robot drifts past 0.06 m. Keep 5 sensors with the same
      graded weights [-2,-1,0,1,2] so the Integrator''s controller is unchanged in
      structure. Sensor x values at -0.03, -0.015, 0, 0.015, 0.03 keep the spacing
      even at 15 mm. (2) Move the sensors forward to y = 0.06 m, giving about 4 cm
      more look-ahead so the steering reacts earlier and lag is reduced. This stays
      inside the 0.08 m limit. (3) Narrow wheel_track from 0.12 to 0.11 m, which gives
      more turn rate per unit of wheel PWM difference on sharp bends. I also lower
      mass from 0.8 to 0.7 kg to reduce yaw inertia and speed up turn response. I
      keep sensor_size 0.012 (the tape still covers about two sensors), wheel_radius
      0.03 and body_width 0.12. Body width cannot help: the off-track limit is max(0.06,
      0.0125 + body_width/4), and it stays at the 0.06 floor for any body width up
      to 0.18. Expected result: fewer off-track exits and max_error below about 0.05
      m on the bends, with the robot finishing at least some runs. If the robot still
      leaves the line, the next lever is spacing or wheel_radius, depending on whether
      time or error limits it.


      - [Open this output](iteration-1/entity0/versions/23ff05187a3947a39b4b849a9b77df44/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-5e2fe912b934cd42/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-865516785b2cd088/payload.json)'
  - id: entity1
    label: Wider array, retuned
    notes: 'Keeps the Builder''s wider forward array unchanged and lowers kp, raises
      kd and lowers base_speed to 1.2. Based on iteration 0, where all 60 runs drifted
      off the line with max_error at about 0.06 m, not on running out of time.


      ### Rationale


      Iteration 0 raced all 60 trials across oval, s-bend and slalom and every run
      went off track (finish rate 0). Progress stalled at 0.075 to 0.15, which is
      far short of the course, so runs ended well before the 3 s limit and speed was
      not the limiting factor. max_error (0.060 to 0.069 m) sat at or above the 0.06
      m off-track floor, and line-loss events were 1 to 2 per run, so the robot was
      losing the line early and then drifting past the edge. steering_oscillation
      was modest (0.13 to 0.17), which argues against a gain that is too high causing
      chatter, and it argues for a controller that corrects drift sooner rather than
      one that oscillates. Because the Builder''s geometry (wider array at y = 0.06,
      wheel_track 0.11, mass 0.7) is the thing under test, I keep it exactly as supplied.
      The narrower wheel_track raises the turn rate per unit of PWM difference by
      about 9 percent versus iteration 0, so I scale the proportional gain down slightly
      rather than raising it: kp goes from 3.0 to 2.5 to avoid overshoot on the bends
      the wider array will now see earlier. I add kd 0.3 (up from 0.1) to damp the
      faster-responding signal, and keep ki at 0 since no windup evidence exists.
      I lower base_speed from 1.4 to 1.2 because the runs failed by drifting off,
      not by running out of time; a slower robot gives the steering more time per
      bend. The time budget is then a question for a later iteration, once a run completes.
      line_loss stays ''last_direction'', which is consistent with the robot losing
      the line on one side. Expected result: fewer off-track exits and max_error below
      about 0.05 m, with the robot still finishing some runs; if it does not finish
      any, the next step is speed, not gain. Telemetry requests add completion_time
      and noise_robustness so the time limit and disturbance sensitivity can be read
      directly.


      - [Open this output](iteration-1/entity1/versions/fa171da4a5af4b868d49d4437790874d/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/23ff05187a3947a39b4b849a9b77df44/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-865516785b2cd088/payload.json)'
  - id: entityR1
    label: Span and weight fallbacks
    notes: 'Gives conditional changes for the next race: widen the span to ±0.04 m
      if off-track exits persist, hold wheel_radius until a run completes, and reduce
      weights before adding gain if oscillation rises. Each rule is tied to iteration
      0''s 0 finishes, max_error near 0.06 m and 1 to 2 line-loss events.


      ### Feedback


      Iteration 0 (the symmetric 0.04 m array, wheel_track 0.12, mass 0.8, kp 3.0,
      base_speed 1.4) raced 60 trials with 0 finishes and 100 percent off-track exits.
      Progress stalled at 0.075 to 0.15 and max_error was 0.060 to 0.069 m, at or
      just above the 0.06 m floor, with 1 to 2 line-loss events per run. The evidence
      points to the robot losing the line on bends, not to speed, because runs ended
      long before the 3 s limit mattered. I did not have to compensate for speed-related
      behaviour; I did reduce kp and raise kd in the controller to cope with the narrower
      wheel_track you asked for, so the geometry is effectively more responsive per
      unit of PWM. Before the next race, use these rules: if the new run still ends
      off-track with max_error above 0.05 m and line_loss_events of 1 or more, widen
      the array further (for example x = -0.04 to +0.04 m at 0.02 m spacing) before
      changing wheel_track again. If the run completes but completion_time is above
      about 3 s, that is the first evidence that speed is limiting, and then raise
      wheel_radius toward 0.035 m. If steering_oscillation is high (above about 0.2)
      while max_error is low, reduce the sensor weights to [-1,-0.5,0,0.5,1] rather
      than changing the sensor positions.


      ### Requested changes


      - If off-track exits persist with max_error above 0.05 m after the wider array,
      widen the sensor span to x = -0.04 to +0.04 m (five sensors at 0.02 m spacing);
      iteration 0 showed a 0.06 m max_error and 1 to 2 line-loss events per run, so
      more span is the direct lever.

      - Do not raise wheel_radius yet: no iteration 0 run completed, so the speed-limit
      evidence is absent. Only raise wheel_radius to 0.035 m if a future race completes
      with completion_time above about 3 s.

      - If steering_oscillation rises above about 0.2 with max_error low, lower the
      sensor weights to [-1,-0.5,0,0.5,1] before changing the geometry, since iteration
      0 oscillation was 0.13 to 0.17 and the Integrator reduced kp rather than adding
      gain.


      - [Open this output](iteration-1/entityR1/versions/fa171da4a5af4b868d49d4437790874d/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/23ff05187a3947a39b4b849a9b77df44/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-865516785b2cd088/payload.json)'
