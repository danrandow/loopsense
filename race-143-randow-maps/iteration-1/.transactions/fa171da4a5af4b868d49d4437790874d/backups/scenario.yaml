overrides:
  entities:
  - id: entity0
    label: Wider, forward array v1
    notes: 'Widened the sensor array to ±0.03 m, moved it forward to y=0.06 m, and
      narrowed the wheel track to 0.11 m with mass 0.7 kg. Iteration 0 went off track
      in all 60 trials with max_error near the 0.06 m limit, so the change targets
      earlier line detection and sharper turning.


      ### Rationale


      Iteration 0 raced in all 60 trials across three tracks and every run went off
      track (finish rate 0). Progress stalled at 0.08 to 0.15, and max_error (0.060
      to 0.069 m) reached or exceeded the 0.06 m off-track limit. Line-loss events
      were 1 to 2 per run. The evidence points at the robot losing the line on bends,
      not at speed, since runs ended before any time limit mattered. Three geometry
      levers follow from this. (1) Widen the sensor array from ±0.02 m to ±0.03 m,
      as the Integrator suggested, so the outer sensors see the tape sooner and the
      signal reacts before the robot drifts past 0.06 m. Keep 5 sensors with the same
      graded weights [-2,-1,0,1,2] so the Integrator''s controller is unchanged in
      structure. Sensor x values at -0.03, -0.015, 0, 0.015, 0.03 keep the spacing
      even at 15 mm. (2) Move the sensors forward to y = 0.06 m, giving about 4 cm
      more look-ahead so the steering reacts earlier and lag is reduced. This stays
      inside the 0.08 m limit. (3) Narrow wheel_track from 0.12 to 0.11 m, which gives
      more turn rate per unit of wheel PWM difference on sharp bends. I also lower
      mass from 0.8 to 0.7 kg to reduce yaw inertia and speed up turn response. I
      keep sensor_size 0.012 (the tape still covers about two sensors), wheel_radius
      0.03 and body_width 0.12. Body width cannot help: the off-track limit is max(0.06,
      0.0125 + body_width/4), and it stays at the 0.06 floor for any body width up
      to 0.18. Expected result: fewer off-track exits and max_error below about 0.05
      m on the bends, with the robot finishing at least some runs. If the robot still
      leaves the line, the next lever is spacing or wheel_radius, depending on whether
      time or error limits it.


      - [Open this output](iteration-1/entity0/versions/23ff05187a3947a39b4b849a9b77df44/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-5e2fe912b934cd42/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-865516785b2cd088/payload.json)'
  - id: entity1
    label: Baseline robot, speed 1.4
    notes: 'Builder''s symmetric five-sensor baseline unchanged, with a proportional
      controller (kp 3, kd 0.1, no integral) and base_speed raised to 1.4 to target
      the 3 s finish. No prior race telemetry exists, so the tuning rests on the contract.


      ### Rationale


      Iteration 0 has no race telemetry and no earlier Integrator feedback, so the
      evidence base is the contract alone. I keep the Builder''s symmetric five-sensor
      baseline unchanged so the geometry is tested as proposed. Sensor x positions
      (-0.02 to +0.02 m, y = 0.04 m) with sensor_size 0.012 m cover the 25 mm tape
      with about two sensors at a time, giving a continuous signal. Weights [-2,-1,0,1,2]
      match the sign convention: a positive x (left) sensor with a positive weight
      steers left, so the signal grows as the line moves outward. For speed, the baseline
      base_speed of 1.2 gives base_pwm of 60% of full, which may be too slow to average
      1.5 m/s and finish in 3 s. I raise base_speed to 1.4 (about 70% PWM). The controller
      stays proportional with a small derivative (kp 3, ki 0, kd 0.1) because there
      is no evidence of windup or chatter yet. ki stays at 0 so the integral cannot
      wind up on the first race. line_loss ''last_direction'' lets the robot recover
      toward the side it last saw the line. Expected result: the robot completes most
      of the course; the main risk is that the tighter bends push the 40 mm array
      off the tape, and the speed margin for the 3 s limit is thin.


      - [Open this output](iteration-0/entity1/versions/08d90f9e105b4d118fea172c41bf2f95/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/abc16c4c4c1942179b3f313fbeb9b9ba/payload.json)'
  - id: entityR1
    label: Iteration 0 integration
    notes: 'No earlier race exists, so the feedback is conditional and cites the contract
      only. It gives decision rules for widening the array, raising wheel_radius for
      speed, and lowering weights if the robot oscillates.


      ### Feedback


      Iteration 0 has no earlier race, so there is no outcome or telemetry to cite;
      these points rest on the design contract only. I did not have to compensate
      for any geometry behaviour in the controller yet, since this is the first integration.
      Decision rule for the next race: if the race ends with progress well short of
      1 and max_error near the 0.06 m off-track limit, the array is losing the line
      on bends; widen the array or narrow sensor spacing to 0.015 to 0.02 m total,
      and keep sensor_size at 0.012 so the tape still covers about two sensors. If
      the robot completes but takes more than about 3 s, speed is limiting; increase
      wheel_radius toward 0.035 or base_speed is already at 1.4, so the geometry lever
      is wheel_radius. If steering_oscillation is high, reduce the sensor weights
      (for example to [-1,-0.5,0,0.5,1]) rather than adding derivative. If rms_error
      is low and the run completes, keep the geometry and try a narrower wheel_track
      of 0.10 to 0.11 m for sharper turning authority.


      ### Requested changes


      - If the robot leaves the track or progress stalls on bends, widen the array
      to sensor x values of -0.03 to +0.03 m (or narrow spacing to 0.015 m total)
      and keep sensor_size at 0.012 m; no earlier evidence yet, so this is a conditional
      test.

      - If completion_time is above 3 s with the robot still on the line, raise wheel_radius
      to 0.035 m to increase ground speed per PWM; this is a conditional test with
      no earlier evidence.

      - If steering_oscillation is high after the first race, lower sensor weights
      to [-1,-0.5,0,0.5,1] rather than adding kd; this is a conditional test with
      no earlier evidence.


      - [Open this output](iteration-0/entityR1/versions/08d90f9e105b4d118fea172c41bf2f95/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/abc16c4c4c1942179b3f313fbeb9b9ba/payload.json)'
