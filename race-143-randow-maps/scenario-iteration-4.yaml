map:
  id: race-143-randow-maps
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Sensors forward to y=0.07
    notes: 'Returns to the iteration 1 best geometry (±0.03 m, 0.012 m footprint,
      0.015 m spacing) and moves the sensor row forward from y=0.06 to y=0.07 m, testing
      look-ahead alone. Rests on iteration 3 showing that the 0.016 m footprint hurt
      oval finishes (217 vs 337), so that change is dropped.


      ### Rationale


      Evidence so far. Iteration 1 (span ±0.03 m at 0.015 m spacing, 0.012 m footprint,
      y = 0.06 m) is still the best result at 337.5, with 13/20 oval finishes. Iteration
      2 (span ±0.04 m at 0.02 m spacing) fell to 150.8 with 0/20 oval finishes, so
      widening the span hurt. Iteration 3 (±0.03 m, 0.015 m spacing, footprint raised
      to 0.016 m) fell to 217.4. Oval finishes dropped from 13/20 to 2/20, and slalom
      line-loss rose to 1.85 per run. Footprint overlap therefore did not close the
      line-loss gap and cost oval performance, so I am not keeping 0.016 m. The Integrator''s
      feedback for this candidate recommends 0.016 m, but it was written before iteration
      3 raced and its own evidence contradicts that recommendation, so I am not following
      it. The remaining evidence is that the line is lost on bends (1.1 to 1.3 line-loss
      events per run on s-bend and slalom, max_error 0.062 to 0.063 m), not from speed
      (oval completes in 1.83 s), and neither span nor footprint fixes it. Iteration
      0 (y = 0.04) was the worst geometry and iteration 1 (y = 0.06) the best, so
      sensor forward position is the one geometry lever the evidence points to that
      has not been tested alone. Change this iteration: return to the iteration 1
      geometry (best 337.5, 0.012 m footprint, 0.015 m spacing, ±0.03 m span, wheel_track
      0.11, mass 0.7, wheel_radius 0.03, body unchanged) and move the sensor row forward
      from y = 0.06 to y = 0.07 m. This gives more look-ahead so the steering reacts
      before the robot reaches 0.06 m off the line. Expected result: line-loss events
      on s-bend and slalom fall toward 0.5 to 1.0 per run and max_error drops below
      about 0.055 m, with the oval finish rate held at about 13/20. If y = 0.07 does
      not change line-loss, the forward position is not the gap and the next test
      should be a narrower wheel_track for turn authority.


      - [Open this output](iteration-4/entity0/versions/f8c6bf354f7e4c65ab52d2fe890aa61d/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-f4141ad79e2ff063/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-497fceff1f15a572/payload.json)'
  - id: entity1
    label: Forward sensor row y=0.07
    notes: 'Iteration 1 best geometry with the sensor row moved forward to y = 0.07
      m, controller held at iteration 1 values to isolate the forward-position effect.
      Based on iteration 1 (337.5), with iteration 2 and 3 ruling out span and footprint
      changes.


      ### Rationale


      The Builder''s candidate is the iteration 1 geometry (best score 337.5) with
      the sensor row moved forward from y = 0.06 m to y = 0.07 m. Span stays at ±0.03
      m, spacing 0.015 m, footprint 0.012 m, wheel_track 0.11 m, mass 0.7 kg and wheel_radius
      0.03 m. Evidence: iteration 1 finished 13/20 oval runs at 1.83 s, so speed is
      not the limit. Its s-bend and slalom failures were all off-track exits at max_error
      about 0.062 to 0.063 m, with 1.1 to 1.3 line-loss events per run. Iteration
      2 (wider span) and iteration 3 (0.016 m footprint) both scored lower, so neither
      span nor footprint is the lever. Forward position is the one geometry lever
      not yet tested alone. The controller is kept exactly as in iteration 1 (kp 2.5,
      ki 0, kd 0.3, base_speed 1.2, weights [-2,-1,0,1,2], last_direction), so any
      change in results is attributable to the forward move. Oval steering_oscillation
      of about 0.31 is a weight question, and I am deliberately not changing weights
      in this race so the forward-position test stays clean. Expected result, not
      yet measured: line-loss on s-bend and slalom falls toward 0.5 to 1.0 per run,
      max_error drops below about 0.055 m, and the oval finish rate holds near 13/20.


      - [Open this output](iteration-4/entity1/versions/881f4d561f854f9494259a20876aad10/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/f8c6bf354f7e4c65ab52d2fe890aa61d/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-497fceff1f15a572/payload.json)'
  - id: entityR1
    label: Forward position, then
    notes: 'Feedback for the y = 0.07 test, citing iteration 1 as the best result
      and iterations 2 and 3 as evidence against span and footprint changes. It corrects
      my earlier recommendation of 0.016 m, which iteration 3 contradicted, and sets
      decision rules for the next race.


      ### Feedback


      Written before this candidate races. Iteration 1 (±0.03 m span, 0.012 m footprint,
      y = 0.06 m, score 337.5) is the best result: oval 13/20 finishes at 1.83 s,
      but s-bend 1/20 and slalom 0/20 with max_error 0.062 to 0.063 m and 1.1 to 1.3
      line-loss events per run. Iteration 2 (span ±0.04 m) dropped to 150.8 with oval
      finishes falling to 0/20, so widening span hurt. Iteration 3 (0.016 m footprint)
      dropped to 217.4 with oval finishes at 2/20 and slalom line-loss rising to 1.85,
      so footprint overlap did not close the gap. Note that my earlier recommendation
      of 0.016 m was contradicted by iteration 3, so please do not treat it as a guide.
      The controller is unchanged from iteration 1 in this race, so the result isolates
      forward position. Decision rules for the next race: if s-bend and slalom line-loss
      falls to about 0.5 to 1.0 per run and max_error drops below about 0.055 m with
      oval finishes at or above 13/20, keep y = 0.07 m and tune the weights only if
      oval steering_oscillation stays above 0.2. If line-loss is unchanged at about
      1.1 or more with max_error near 0.06 m, forward position is not the gap, so
      move to turn authority. If oval finishes fall below about 10/20, return y to
      0.06 m.


      ### Requested changes


      - Keep the iteration 1 geometry and move only the sensor row from y = 0.06 to
      y = 0.07 m. Evidence: iteration 1 is the best score (337.5), and iterations
      2 and 3 showed that span and footprint changes both hurt, so forward look-ahead
      is the untested lever.

      - If line-loss on s-bend and slalom stays at 1.1 or more per run with max_error
      near 0.06 m at y = 0.07 m, try wheel_track 0.10 m with all else unchanged. Evidence:
      iteration 1 turn-authority changes (wheel_track 0.12 to 0.11 with mass 0.8 to
      0.7) were confounded, so this is a clean follow-up test, not a proven fix.

      - Do not change sensor_size or span in the next iteration. Evidence: 0.016 m
      footprint (iteration 3) cut oval finishes from 13/20 to 2/20, and ±0.04 m span
      (iteration 2) cut them to 0/20.


      - [Open this output](iteration-4/entityR1/versions/881f4d561f854f9494259a20876aad10/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/f8c6bf354f7e4c65ab52d2fe890aa61d/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-497fceff1f15a572/payload.json)'
