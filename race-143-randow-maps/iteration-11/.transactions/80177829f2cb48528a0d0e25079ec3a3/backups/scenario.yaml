overrides:
  entities:
  - id: entity0
    label: 'Final: hold best geometry'
    notes: 'Holds the iteration 10 geometry (score 700.7) unchanged for the final
      unseen-track race, since every geometry change from iteration 2 onward was flat
      or negative on the sharp tracks. Gains are left to the Integrator''s controller,
      which is where the remaining slalom and s-bend gap sits.


      ### Rationale


      This is the final iteration, and the race is scored on an unseen track of a
      different shape, so the design should be a robust platform rather than one tuned
      to the development tracks. Iteration 10 (score 700.7) is the best observed result
      on this geometry, with the oval at 20/20 and s-bend at 20/20 with line-loss
      0.55. Slalom is still 0/20 with line-loss 1.2, which points to the controller''s
      response at direction changes, not the body.


      Geometry evidence since iteration 2 is consistent. Span widening (iteration
      2) and footprint 0.016 m (iteration 3) both hurt. Forward position 0.07 m (iteration
      4) helped the oval. Narrowing wheel_track to 0.09 m (iterations 5 to 6) gave
      small gains and is at its floor. Mass 0.5 kg (iteration 7) raised s-bend finishes,
      and the body has since held oscillation at about 0.21 to 0.27 with the stronger
      controller. Body width does not change the off-track limit, which stays at the
      0.06 m floor. Speed is not limiting, since the oval finishes in about 1.96 s.


      Decision: hold every geometry value at the iteration 10 best. Changing geometry
      now would confound the Integrator''s last controller step, and the unseen track
      is best served by a body that is already known to finish the oval and s-bend
      reliably. Expected result: the same platform scores near 700 on the development
      tracks, with any further gain coming from the Integrator''s controller (kd,
      line_loss mode) on sharp bends.


      - [Open this output](iteration-11/entity0/versions/d92be16d88ac4c7c856b9ff2a097d43d/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-f645b68add618e5c/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-5fdf7e2e26111dbd/payload.json)'
  - id: entity1
    label: kd 0.75 on best geometry
    notes: 'Geometry held at the iteration 9 best (669.8). Only kd moves from 0.6
      to 0.75, continuing the trend where kd cut slalom line-loss from 1.9 to 1.1
      with the oval flat. Revert to kd 0.6 if the oval oscillates above about 0.35.


      ### Rationale


      The Builder holds the iteration 9 geometry (wheel_track 0.09 m, span ±0.03 m
      at 0.015 m spacing, y 0.07 m, sensor_size 0.012 m, wheel_radius 0.03 m, body
      0.12 x 0.16 m, mass 0.5 kg). I keep it exactly. Only the controller changes.
      Evidence from the controller-only steps on this geometry: iteration 7 (kp 2.5,
      kd 0.3) scored 400.0; iteration 8 (kp 3.0, kd 0.45) scored 610.7 with s-bend
      15/20 and oval 20/20; iteration 9 (kd 0.6) scored 669.8 with s-bend 20/20, oval
      20/20 and slalom line-loss down from 1.9 to 1.1. Oval steering_oscillation was
      essentially flat across those steps (0.216, then 0.219), so the jitter guard
      has room. The slalom line-loss trend is still falling with kd, while kp 3.0
      is retained. I therefore step kd from 0.6 to 0.75 and keep kp 3.0, ki 0, base_speed
      1.2, the sensor weights and last_direction, so the change is attributable to
      kd alone. Expected result (not measured): oval and s-bend hold at 20/20 and
      19 to 20/20, with slalom line-loss below 1.1 per run. Guard: if oval steering_oscillation
      exceeds about 0.35 or the oval falls below 16/20, return kd to 0.6, the best
      measured value. The final unseen track is not known, so this is a modest step,
      not a tuned-to-slalom step.


      - [Open this output](iteration-10/entity1/versions/4280de24e8b54bf8ab639def69f6ac0c/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/93538bc67c0f408797ef371174882f69/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-ca6b88645ae93896/payload.json)'
  - id: entityR1
    label: Hold geometry, test kd
    notes: 'Requests that the Builder hold the iteration 9 geometry, since every body
      change since iteration 4 was flat or negative while controller changes moved
      the sharp tracks. Gives decision rules tied to the kd 0.6 to 0.75 test and a
      fallback to kd 0.6 if the oval destabilises.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Evidence:
      iteration 8 (kp 3.0, kd 0.45, geometry as iteration 7) scored 610.7, with oval
      20/20, s-bend 15/20 (line-loss 1.05) and slalom 0/20 (line-loss 1.9). Iteration
      9 (kd 0.6) scored 669.8, with oval 20/20, s-bend 20/20 (line-loss 0.75) and
      slalom line-loss 1.1 with 0/20 finishes. Oval steering_oscillation stayed at
      about 0.22 across both steps, so the controller change did not cause jitter.
      Geometry tests from iterations 2 to 7 (span, footprint, forward position, wheel_track,
      mass) moved the sharp tracks only as the controller changed, so the body is
      not the constraint. The Integrator''s controller step in this iteration is kd
      0.6 to 0.75 with the geometry held. Decision rules for the next race: (a) If
      the oval holds at 20/20 or 16/20 or better and slalom line-loss falls below
      1.1 with s-bend at 20/20 or 19/20, the geometry is stable and should be held
      for the final iteration. (b) If the oval falls below about 16/20 or steering_oscillation
      exceeds about 0.35 with low max_error, the derivative gain is too high for this
      body, so keep geometry and return kd to 0.6. (c) If slalom stays near 1.1 line-loss
      with the oval and s-bend holding, geometry is still not the gap, so do not change
      sensors, span or wheel_track; the remaining lever is line_loss mode on the controller
      side.


      ### Requested changes


      - Hold every geometry value at the iteration 9 best: wheel_track 0.09 m, span
      ±0.03 m at 0.015 m spacing, sensor y 0.07 m, sensor_size 0.012 m, wheel_radius
      0.03 m, mass 0.5 kg, body 0.12 x 0.16 m. Evidence: iteration 9 scored 669.8
      on this geometry, and every geometry change since iteration 4 has been flat
      or negative on the sharp tracks, while controller changes have moved the sharp-track
      line-loss.

      - If the oval holds at 16/20 or better and slalom line-loss is at or below 1.1
      per run after kd 0.75, keep this geometry for the final iteration without change.
      Evidence: kd 0.45 to 0.6 cut slalom line-loss from 1.9 to 1.1 with the oval
      unchanged, which shows the controller response is still moving the sharp tracks.

      - If the next race shows the oval dropping below about 16/20 with steering_oscillation
      above about 0.35, do not change geometry. Return kd to 0.6, the iteration 9
      value, and keep wheel_track 0.09 m. Evidence: mass and wheel_track changes did
      not cause jitter at 0.5 kg, so a jitter rise would point to the controller,
      not the body.


      - [Open this output](iteration-10/entityR1/versions/4280de24e8b54bf8ab639def69f6ac0c/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/93538bc67c0f408797ef371174882f69/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-ca6b88645ae93896/payload.json)'
