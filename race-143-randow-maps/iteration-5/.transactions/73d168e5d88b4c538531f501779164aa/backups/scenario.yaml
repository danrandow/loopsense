map:
  id: race-143-randow-maps
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Narrow track to 0.10 m
    notes: 'Keeps the best y = 0.07 m sensor row (score 364.1, oval 16/20) and narrows
      wheel_track from 0.11 to 0.10 m for more turn authority, since iteration 4 line-loss
      on s-bend and slalom stayed at 1.4 to 1.95 per run. The evidence is the iteration
      4 race data, with the forward-position test ruled out for the sharp tracks.


      ### Rationale


      Iteration 4 (y = 0.07 m) is the new best at 364.1, up from 337.5. Oval finishes
      rose from 13/20 to 16/20, with max_error down to 0.037 m and oval completion
      time unchanged at 1.82 s. The sharp tracks did not improve. s-bend line-loss
      is 1.4 per run and slalom rose to 1.95 (from 1.1), with max_error still 0.063
      to 0.064 m and 0/20 finishes on both. My own decision rule for this race said
      that if line-loss stays at about 1.1 or more with max_error near 0.06 m, forward
      position is not the gap and the next lever is turn authority. That condition
      holds on the sharp tracks, so forward position is no longer the limiting geometry.
      Span and footprint were already ruled out by iterations 2 and 3. Speed is not
      limiting. The remaining untested geometry lever is wheel_track, which sets turn
      rate per unit of wheel PWM difference. I keep y = 0.07 m because it helped the
      oval, and I narrow wheel_track from 0.11 to 0.10 m, the next step my plan named,
      changing nothing else. The Integrator''s controller stays as is, so the race
      isolates turn authority. Expected result: s-bend and slalom line-loss falls
      toward 1.0 or below and max_error drops under 0.06 m, with at least some sharp-track
      finishes. Risk: a narrower track may increase oval steering_oscillation (0.28
      now), which would be a weight question for the Integrator. The Integrator''s
      earlier suggestion of wheel_radius changes is not supported, since speed is
      not the limit.


      - [Open this output](iteration-5/entity0/versions/7dc83b9ac41f4d9eaca114150644a832/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-43f52efba482e664/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-3efecaf45a5ff14a/payload.json)'
  - id: entity1
    label: Narrow track to 0.10 m
    notes: 'Iteration 4 geometry with wheel_track narrowed from 0.11 to 0.10 m, paired
      with the unchanged iteration 4 controller so turn authority is isolated. Chosen
      because sharp-track line-loss stayed at 1.4 to 1.95 per run when only forward
      position changed.


      ### Rationale


      Iteration 4 (y = 0.07 m, score 364.1, the best so far) improved the oval from
      13/20 to 16/20 finishes with max_error 0.037 m, but s-bend and slalom were unchanged:
      0/20 finishes, line-loss 1.4 and 1.95 per run, and max_error 0.063 to 0.064
      m. Forward look-ahead therefore helped the oval but is not the sharp-track gap.
      Span (iteration 2) and footprint (iteration 3) were both tested and both hurt,
      so neither is the lever. Speed is not limiting, since the oval completes in
      about 1.82 s. The remaining untested geometry lever is wheel_track, which sets
      the turn rate per unit of PWM difference. I narrow wheel_track from 0.11 to
      0.10 m, as the Builder requested, and keep the rest of the geometry unchanged,
      including y = 0.07 m. Iteration 4''s controller (kp 2.5, ki 0, kd 0.3, base_speed
      1.2, weights [-2,-1,0,1,2], last_direction) is kept unchanged, so this race
      isolates turn authority. A narrower track adds roughly 10 percent more turn
      per unit of PWM, so I do not raise kp; I accept the risk of more oval oscillation
      (0.28 now) and will handle it with weights in a later iteration if it appears.
      Expected result: s-bend and slalom line-loss falls toward 1.0 or below and max_error
      drops under 0.06 m, with the oval finish rate held at 16/20 or better.


      - [Open this output](iteration-5/entity1/versions/4417c41bc0854a0eb1793194ed493570/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/7dc83b9ac41f4d9eaca114150644a832/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-3efecaf45a5ff14a/payload.json)'
  - id: entityR1
    label: Narrow then test 0.09 m
    notes: 'Pre-race feedback: keep wheel_track 0.10 m if sharp-track line-loss falls
      to 1.0 or below, try 0.09 m if it stays above 1.0 with the oval holding, and
      move to weights if line-loss stays at 1.4 or more. Based on iterations 0 to
      4 outcomes.


      ### Feedback


      Written before this candidate races. Evidence: iteration 4 (y = 0.07 m, span
      ±0.03 m, footprint 0.012 m, wheel_track 0.11 m, score 364.1) improved the oval
      to 16/20 finishes, but s-bend and slalom stayed at 0/20 with line-loss 1.4 and
      1.95 per run and max_error 0.063 to 0.064 m. Iteration 2 (span ±0.04 m) and
      iteration 3 (footprint 0.016 m) both reduced scores, so those levers are closed.
      Iteration 0 to 1 wheel_track narrowing was confounded with mass and sensor changes,
      so turn authority is not yet proven, but it is the only untested geometry lever.
      Decision rules for the next race: (a) If s-bend and slalom line-loss is 1.0
      or below and max_error is under 0.06 m, and the oval holds at 16/20 or better,
      keep wheel_track 0.10 m. (b) If line-loss is still above 1.0 with max_error
      near 0.06 m and the oval holds, the next geometry step is wheel_track 0.09 m,
      one step at a time, and only if the oval stays at 16/20 or better. (c) If line-loss
      stays at 1.4 or more on the sharp tracks at 0.10 m, narrowing is not enough.
      The Integrator should then change the controller weights, not the geometry.
      (d) If the oval falls below about 14/20 or steering_oscillation rises above
      about 0.35 with low max_error, return wheel_track to 0.11 m, because the oscillation
      is then a weight problem.


      ### Requested changes


      - Keep the iteration 4 geometry and narrow only wheel_track from 0.11 to 0.10
      m. Evidence: iteration 4 showed forward position helped the oval but left s-bend
      and slalom at 1.4 to 1.95 line-loss per run, so turn authority is the untested
      lever.

      - If s-bend or slalom line-loss is still above 1.0 per run with max_error near
      0.06 m and the oval holds at 16/20 or better, try wheel_track 0.09 m next, with
      all other geometry unchanged. Do not go further than 0.09 m. Evidence: the narrowing
      from 0.12 to 0.11 m in iteration 1 was confounded, so this is a single-step
      test.

      - Keep sensor y at 0.07 m, span at ±0.03 m, sensor_size at 0.012 m, mass 0.7
      kg and wheel_radius 0.03 m. Evidence: iteration 4 showed y = 0.07 m helped the
      oval (13/20 to 16/20). Iterations 2 and 3 showed span and footprint changes
      hurt. Speed is not limiting, since the oval completes in about 1.82 s.


      - [Open this output](iteration-5/entityR1/versions/4417c41bc0854a0eb1793194ed493570/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/7dc83b9ac41f4d9eaca114150644a832/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-3efecaf45a5ff14a/payload.json)'
