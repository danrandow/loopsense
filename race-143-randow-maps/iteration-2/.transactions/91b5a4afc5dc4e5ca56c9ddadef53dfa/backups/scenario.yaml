  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Wider 0.08 m sensor span
    notes: 'Widened the array from ±0.03 m to ±0.04 m at 0.02 m spacing, with other
      geometry unchanged, to address max_error of 0.062 to 0.063 m and off-track exits
      on s-bend and slalom. Evidence: iteration 1 finished 13 of 20 oval runs but
      only 1 of 20 s-bend and 0 of 20 slalom runs, and the Integrator''s rule calls
      for widening when max_error stays above 0.05 m.


      ### Rationale


      Iteration 1 raised the score from 48 to 337.5, with 13 of 20 oval runs finishing
      (mean 1.83 s, max_error 0.044). The s-bend and slalom tracks still fail: s-bend
      finished 1 of 20 (max_error 0.062, 1.3 line-loss events per run) and slalom
      finished 0 of 20 (max_error 0.063, 1.1 line-loss events). Every failure is an
      off-track exit with max_error at the 0.06 m floor, so the line is still being
      lost on sharper bends. The Integrator''s rule applies: off-track exits persist
      with max_error above 0.05 m and line-loss events of at least 1, so I widen the
      sensor span to x = -0.04 to +0.04 m at 0.02 m spacing, as requested. The oval
      completion time (1.83 s) shows speed is not limiting, so wheel_radius stays
      at 0.03 m. The oval steering_oscillation of 0.31 is high while oval max_error
      is low (0.044), which matches the Integrator''s weight-reduction condition.
      I am not changing the sensor layout for that. I am flagging it so the Integrator
      can decide whether to scale the weights, since the weights belong to the controller.
      I keep wheel_track 0.11, mass 0.7, sensor_size 0.012 and sensor y = 0.06, so
      the only geometry change is the wider span. Expected result: fewer off-track
      exits on s-bend and slalom, with max_error falling below about 0.05 m, while
      oval finishes at least as often as before.


      - [Open this output](iteration-2/entity0/versions/b8886c3116f64dec91029273a01ea180/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-fe313cd33f4a0b24/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-62cd84fdffdafa73/payload.json)'
  - id: entity1
    label: Wider ±0.04 m span, same
    notes: 'Integrates the Builder''s ±0.04 m sensor span at 0.02 m spacing while
      keeping the iteration 1 controller unchanged, so the race isolates the span
      effect. Based on iteration 1, where s-bend and slalom failed with max_error
      about 0.062 m.


      ### Rationale


      Iteration 1 (the ±0.03 m array) finished 13 of 20 oval runs but only 1 of 20
      s-bend and 0 of 20 slalom. Every failure is an off-track exit, with max_error
      at about 0.062 to 0.063 m and 1.1 to 1.3 line-loss events per run on the sharp
      tracks. The Builder''s geometry change widens the span to ±0.04 m at 0.02 m
      spacing, keeps y = 0.06 m, sensor_size 0.012 m, wheel_track 0.11 m, mass 0.7
      kg and wheel_radius 0.03 m. I supply that geometry as written. Oval steering_oscillation
      was 0.31 with max_error 0.044, so the oscillation is not coming from error.
      The Builder asked me to separate span from weight scaling, so I keep the iteration
      1 controller (kp 2.5, ki 0, kd 0.3, base_speed 1.2, weights [-2,-1,0,1,2], last_direction)
      unchanged. Any change in results can then be attributed to the wider span. Speed
      is not limiting (oval finishes in 1.83 s), so wheel_radius stays at 0.03. Expected
      result: fewer s-bend and slalom off-track exits with max_error below about 0.05
      m, and oval finish rate held near 13 of 20. If oscillation stays above 0.2 with
      low max_error next race, the next step is to scale weights to [-1,-0.5,0,0.5,1],
      not to change geometry.


      - [Open this output](iteration-2/entity1/versions/214a6c3e22aa40e0b55cb6c54384fc85/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/b8886c3116f64dec91029273a01ea180/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-62cd84fdffdafa73/payload.json)'
  - id: entityR1
    label: Span test and gap rules
    notes: 'Gives conditional rules for the next race: sensor_size 0.016 if sharp
      tracks still exit, weight reduction if oval oscillation stays high, and wheel_radius
      only if completion time exceeds 3 s. Each rule cites iteration 1 evidence.


      ### Feedback


      Written before this candidate races. Evidence from iteration 1 (±0.03 m array,
      13/20 oval finishes, 1/20 s-bend, 0/20 slalom, max_error 0.062 to 0.063 m on
      the sharp tracks, 1.1 to 1.3 line-loss events per run) shows that the failures
      are off-track exits on bends, not speed limits, since the oval finishes in 1.83
      s. The Integrator kept your span-only change and the iteration 1 controller
      unchanged, so the next race isolates the wider span. Decision rules for the
      next race: if s-bend and slalom off-track counts fall and max_error drops below
      about 0.05 m, keep ±0.04 m and then test whether a larger weight shape is needed.
      If the sharp tracks still exit with max_error above 0.05 m and line-loss events
      of 1 or more, change sensor_size to 0.016 m at the same spacing to close dead
      zones between sensors. If oval steering_oscillation stays above 0.2 while max_error
      is low, that is a weight problem, so reduce the controller weights rather than
      changing geometry. If the robot completes with completion_time above about 3
      s, raise wheel_radius to 0.035 m.


      ### Requested changes


      - If s-bend or slalom still exit with max_error above 0.05 m after the ±0.04
      m span, try sensor_size 0.016 m at the same 0.02 m spacing, because iteration
      1 showed line-loss events of 1.1 to 1.3 per run on sharp bends, which suggests
      gaps between sensors.

      - If the wider span lowers off-track exits but the oval still shows steering_oscillation
      above 0.2, keep this geometry and let the Integrator scale weights, since iteration
      1 oval oscillation was 0.31 with max_error 0.044, which is not an error-driven
      problem.

      - Raise wheel_radius to 0.035 m only if a future race completes with completion_time
      above about 3 s, because iteration 1 oval finished in 1.83 s, so speed was not
      the limit.


      - [Open this output](iteration-2/entityR1/versions/214a6c3e22aa40e0b55cb6c54384fc85/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/b8886c3116f64dec91029273a01ea180/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-62cd84fdffdafa73/payload.json)'
