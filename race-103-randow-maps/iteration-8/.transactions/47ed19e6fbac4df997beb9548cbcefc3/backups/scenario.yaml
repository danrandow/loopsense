map:
  id: race-103-randow-maps
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Hold geometry, test loss
    notes: 'Geometry is held at the iteration 5 and 7 design (±0.05 m, 16 mm sensors,
      0.6 kg), as the Integrator''s rule requires while S-bend and slalom still log
      one line loss each. The output isolates controller and start-pose effects, and
      the Integrator''s loss-location report decides the next geometry step.


      ### Rationale


      Iteration 7 raced the iteration 5 geometry (seven 16 mm sensors at x = ±0.05
      m, y = 0.04 m, mass 0.6 kg, wheel_track 0.10 m, wheel_radius 0.03 m, body 0.18
      × 0.12 m) and scored 53.68. The oval logged 0 line-loss events, but the S-bend
      and slalom each logged 1, with max_error about 0.060 to 0.064 m and progress
      0.16 and 0.11. Across iterations 3 to 7 the ±0.05 m span cleared the oval loss,
      while mass (0.7 to 0.6 kg) changed max_error by under 0.002 m and progress by
      about 0.01. Body width cannot move the 0.06 m off-track limit. The detection
      geometry predicts that the outer sensors see tape to about 0.07 m offset, which
      is beyond the off-track limit, so a plain sensor-coverage failure is unlikely.
      The Integrator''s rule says that if S-bend and slalom line loss stays at 1 with
      geometry fixed, the loss is not geometric and geometry should not be edited.
      Both the Integrator''s feedback and the evidence support that. The wheel_track
      0.12 m step is only triggered when line loss is zero on all three tracks, which
      is not the case. The wheel_radius step is only triggered when runs complete,
      which they have not. I therefore hold the geometry exactly as in iterations
      5 and 7. Changing geometry now would also invalidate the controller work the
      Integrator is doing, and would confound the test of whether controller-side
      line-loss handling or start pose clears the losses.


      - [Open this output](iteration-8/entity0/versions/ba993356d7944eea85d16f71355096bd/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-63d107649db73874/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-cf80a02c42f07b27/payload.json)'
  - id: entity1
    label: Damped steering, held
    notes: 'Geometry held at iteration 5 values to isolate the controller. Raises
      kp to 2.8, kd to 0.25 and lowers base_speed to 1.1 to test whether damped correction
      clears S-bend and slalom line losses.


      ### Rationale


      Iteration 5 showed that lowering base_speed from 1.3 to 1.2 left S-bend and
      slalom line loss at 1.0 event each, with max_error about 0.062 to 0.066 m. Oval
      loss stays at 0 with the plus or minus 0.05 m span. Geometry is held exactly
      at the iteration 5 values, as the Builder''s intent and the feedback rules require,
      so this race isolates the controller. Speed reduction did not clear the losses,
      so entry speed alone is not the cause. I therefore make two controller changes:
      kp rises from 2.5 to 2.8 for a stronger correction at bend onset, and kd rises
      from 0.2 to 0.25 to damp the overshoot that follows. base_speed drops to 1.1
      to give the correction more time per bend. line_loss stays at last_direction
      so the search-direction question is not confounded. The lost-line points on
      the S-bend and slalom remain unknown until the race reports where they start.
      Expected result: fewer or no S-bend and slalom line losses. If the losses persist,
      the next step is a start-pose or line_loss test, not a geometry edit. Score
      is expected near 53 to 56.


      - [Open this output](iteration-7/entity1/versions/2300a704b6e84019902d2eb583e9ae3b/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/562a0c5aee5649fcb44c1c3ee9eac0dc/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-5fb3b63fb613f32c/payload.json)'
  - id: entityR1
    label: Wheel track next if clean
    notes: 'Feedback written before racing: holds geometry, names wheel_track 0.12
      m as the next step only if line loss clears on all three tracks, and cites iterations
      3 to 5 showing body_width and mass cannot move the off-track limit.


      ### Feedback


      Written before this candidate has raced. Iteration 5 held the iteration 4 geometry
      and lowered base_speed to 1.2. Oval line loss stayed at 0, but S-bend and slalom
      each still logged about 1 event with max_error near 0.062 to 0.066 m, so bend
      speed alone did not clear the losses. Iteration 1 (kp 3.0) raised oscillation
      to 0.186, while iteration 2 (kp 2.5, kd 0.2) lowered it, so this iteration tests
      a modest rise in kp with more damping. Geometry is unchanged and is the Builder''s
      current design. Decide the next geometry from the next race. If S-bend and slalom
      line_loss_events are still 1 with geometry fixed, the loss is not geometric,
      so do not edit geometry; report where on the course it starts. If line_loss_events
      is 0 on all three tracks but max_error still approaches 0.06 m, the next geometry
      step is wheel_track 0.12 m for more differential turn authority. If runs complete
      but completion_time exceeds 2.5 s, test wheel_radius 0.035 m for more top speed.


      ### Requested changes


      - If line_loss_events is 0 on the oval, S-bend and slalom but max_error still
      approaches 0.06 m, set wheel_track to 0.12 m. Iterations 3 to 5 show body_width
      cannot move the 0.06 m limit, and this adds differential turn authority.

      - If line_loss_events stays at 1 on the S-bend or slalom, keep the geometry
      fixed. Iterations 3 to 6 at 0.6 and 0.7 kg, and iteration 5 at base_speed 1.2,
      show no geometry-side clearing, so do not change mass or span again.

      - Only if runs complete and completion_time exceeds 2.5 s, set wheel_radius
      to 0.035 m. Progress is currently 0.11 to 0.17, so runs must first reach the
      finish before top speed matters.


      - [Open this output](iteration-7/entityR1/versions/2300a704b6e84019902d2eb583e9ae3b/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/562a0c5aee5649fcb44c1c3ee9eac0dc/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-5fb3b63fb613f32c/payload.json)'
