map:
  id: race-103-randow-maps
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Hold geometry, test
    notes: 'Geometry is held at iteration 4 values because the S-bend and slalom line
      losses persist at 0.6 kg, so the rules say the loss is not geometric. The Integrator
      should check line-loss handling and start pose. Rests on the iteration 4 race
      data (0.95 and 1.0 losses, max_error about 0.063 m).


      ### Rationale


      Iteration 4 (mass 0.6 kg, otherwise identical to iteration 3) scored 54.98,
      slightly below iteration 3''s 55.27. The oval line loss stayed at 0 and max_error
      stayed at about 0.063 m, which is still above the fixed 0.06 m off-track limit.
      The S-bend (0.95 events) and slalom (1.0 event) still lose the line, and progress
      did not improve on either track (0.16 and 0.11). Lowering mass therefore did
      not reduce bend overshoot in any measurable way. Body width cannot move the
      off-track limit (max(0.06, 0.0125 + bw/4) stays at 0.06 m), and the span at
      plus or minus 0.05 m already removed the oval loss, so geometry has no further
      lever that the evidence supports. The S-bend and slalom losses persist with
      the span and footprint that clear the oval, which points to the controller''s
      line-loss handling or the start position rather than the geometry. Following
      the feedback rule that applies when line loss persists at 0.6 kg, I make no
      geometry change this iteration. I keep mass at 0.6 kg, wheel_track 0.10 m, wheel_radius
      0.03 m, body 0.18 by 0.12 m, sensors at plus or minus 0.05 m, 16 mm footprints
      and y = 0.04 m, so the Integrator''s controller work is the only variable that
      changes. Expected result: the score stays near 55 unless the controller clears
      the S-bend and slalom losses, in which case progress should rise sharply on
      those tracks.


      - [Open this output](iteration-5/entity0/versions/eec91fd35d9d49d3a0933a7a636ddcad/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-ca397d2395c381b6/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-e24ab364cca28d26/payload.json)'
  - id: entity1
    label: Mass 0.6 kg test package
    notes: 'Iteration 3 array and damped controller kept, with mass cut from 0.7 to
      0.6 kg as the only change. This isolates whether lower yaw inertia reduces the
      S-bend and slalom overshoot that iteration 3 left at max_error about 0.064 m.


      ### Rationale


      Iteration 3 is the only design with the +/-0.05 m array, and its evidence is
      mixed. Line loss fell to 0 on the oval (from 1 to 2 events on earlier designs),
      but the S-bend and slalom still logged one loss each, and every run ended off_track
      with max_error about 0.064 m. Progress stayed at 0.11 to 0.17, so runs are lost
      early. Iteration 1 showed that kp 3.0 raised steering_oscillation to 0.186 and
      max_error to 0.068 m, so gains stay at the damped iteration 2/3 set (kp 2.5,
      kd 0.2, ki 0.05, base_speed 1.3). The Builder''s intent is to test whether reducing
      mass from 0.7 kg to 0.6 kg lowers yaw inertia and bend overshoot. To isolate
      that effect, I keep the geometry fixed apart from mass: same 16 mm footprints,
      same +/-0.05 m positions at y = 0.04 m, same wheel_track 0.10 m, wheel_radius
      0.03 m, body_width 0.12 m and body_length 0.18 m. The controller is also unchanged,
      including the outer-scaled sensor weights [-1.5, -1.05, -0.6, 0, 0.6, 1.05,
      1.5], which keep the signal monotonic over the span. The last_direction line-loss
      handling stays unchanged, so any remaining S-bend or slalom loss can be attributed
      to the controller or start position rather than to this change. Expected result:
      if mass is the lever, max_error falls below 0.06 m and progress rises above
      iteration 3. If line loss persists at 1 on the S-bend or slalom, the feedback''s
      decision triggers point to the controller side. I cannot predict the outcome,
      and this package has not yet raced.


      - [Open this output](iteration-4/entity1/versions/0239327d14864c079939b4241f0c041a/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/e149ba81149e4cb2a617f5cb672b4675/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-6f869d5e91f0b90e/payload.json)'
  - id: entityR1
    label: Mass then track feedback
    notes: 'Feedback is written before racing and states no outcome for this robot.
      It sets a decision order: confirm whether line loss is geometric, then try mass
      0.5 kg, then wheel_track 0.12 m, and wheel_radius only once runs complete.


      ### Feedback


      Written before this candidate has raced. Iteration 3 (+/-0.05 m, 16 mm, mass
      0.7 kg, kp 2.5, kd 0.2) removed oval line loss (0 events, from 1 to 2 on earlier
      designs) but still logged 1 loss each on the S-bend and slalom. Every run ended
      off_track with max_error about 0.064 m, and progress stayed at 0.11 to 0.17,
      so runs are lost early on the first sharp bends. Body_width cannot move the
      off-track limit, which stays at 0.06 m. Iteration 1 showed that kp 3.0 raised
      oscillation to 0.186, so the lever left is dynamic: mass. I have kept the iteration
      3 controller and footprints unchanged so the mass effect is isolated. The mass
      effect itself is untested. Decide the next step from the next race as follows.
      If line_loss_events is still 1 on the S-bend or slalom at 0.6 kg, the loss is
      not geometric: do not change geometry again, and check the controller''s line_loss
      handling and start position first. If line_loss_events is 0 on all tracks but
      max_error still approaches 0.06 m, mass is not enough: try 0.5 kg, and separately
      test wheel_track 0.12 m for more turn authority. If runs complete but completion_time
      exceeds 2.5 s, test wheel_radius 0.035 m for more top speed. Progress is the
      current limit, not completion time, so do not change wheel_radius before runs
      finish.


      ### Requested changes


      - If line_loss_events is 0 on all three tracks and max_error still approaches
      0.06 m at mass 0.6 kg, try mass 0.5 kg, since the 0.7 to 0.6 kg step is the
      first test of whether lower yaw inertia cuts bend overshoot (iteration 3 at
      0.7 kg logged max_error about 0.064 m).

      - If max_error stays near 0.06 m with no line loss after the mass change, try
      wheel_track 0.12 m for more differential turn authority. The 0.06 m off-track
      limit cannot be moved by body_width, so this is the geometry lever left for
      the bends.

      - Only if runs complete and completion_time exceeds 2.5 s, try wheel_radius
      0.035 m. Iteration 3 has progress of only 0.11 to 0.17, so top speed is not
      yet the constraint.


      - [Open this output](iteration-4/entityR1/versions/0239327d14864c079939b4241f0c041a/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/e149ba81149e4cb2a617f5cb672b4675/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-6f869d5e91f0b90e/payload.json)'
