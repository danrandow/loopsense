  entities:
  - id: entity0
    label: Slower, firmer steering
    notes: 'Lowered base_speed 1.6 to 1.3, raised kp 2.0 to 3.0 and kd 0.3 to 0.8,
      keeping geometry fixed to isolate the controller change. Based on iteration
      0, where all runs left the track after one line loss at about 0.06 m error,
      with small rms error suggesting speed into bends was the main cause.


      ### Rationale


      Evidence from iteration 0 (development simulator, no per-step telemetry): every
      trial on all three tracks ended off_track, with none finishing. Progress was
      0.36 on the oval, 0.16 on the s-bend and 0.11 on the slalom. Each run logged
      exactly one line-loss event, and max_error reached about 0.06 m, which is the
      off-track limit (max(0.06, 0.0125 + body_width/4) = 0.06 for any allowed body
      width). rms_error stayed small (0.03 m), so the robot tracks well until a single
      sharp moment throws it off the line and it never recovers. Steering oscillation
      was moderate (0.15-0.21), so the robot is not badly jittering. The likely cause
      is that at base_speed 1.6 the robot carries too much speed into the bends, and
      with kp 2.0 and kd 0.3 it under-corrects the error that builds up. Changes:
      (1) base_speed 1.6 -> 1.3, to slow entry into bends and cut the lateral error
      that causes the single loss; (2) kp 2.0 -> 3.0, for a firmer steer on sharper
      bends; (3) kd 0.3 -> 0.8, to damp the larger kp and keep oscillation under control.
      Geometry is kept as it was so this iteration isolates the controller change;
      body_width stays at 0.12 because the off-track limit is already at its 0.06
      floor. Expected result: fewer off-track ends, the oval and s-bend progressing
      further, and possibly one finish on the oval. The finish time will be longer
      than 3 s at the lower speed, so the score may still be modest, but the progress
      and line-loss terms should rise. Hypotheses to check: (a) most failures come
      at one specific bend, and max_error occurs there; (b) the line loss happens
      at entry to the bend, so speed is the main factor; (c) if steering_oscillation
      rises with kd, kd is too high relative to kp. Next measurements: completion,
      progress, completion_time, rms_error, max_error, line_loss_events, steering_oscillation
      and control_effort, to locate the failing bend and the loss timing.


