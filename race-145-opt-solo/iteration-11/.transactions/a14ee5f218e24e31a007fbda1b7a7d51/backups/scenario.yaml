  - id: entity0
    label: 'Final: revert to iter 9'
    notes: 'Resubmits the best raced design (iteration 9, score 675.8) unchanged,
      because iteration 10''s wider sensors collapsed the s-bend and no later change
      has tested better. Oval and s-bend both finish 20/20 on the development tracks.


      ### Rationale


      Final iteration. The best raced design is iteration 9 (score 675.8). Its oval
      (20/20 finishes, 1.94 s) and s-bend (20/20 finishes, 2.34 s) both complete,
      and its slalom fails in every trial. Iteration 10 (sensors spread to x = ±0.06
      m) scored 428 because the s-bend collapsed to 1/20 finishes, so that change
      is rejected. Across the history, the changes that helped were sensors moved
      forward to y = 0.08 m (+~320 points in total) and integral action (ki 0.5 to
      1.0 gave a small gain). Speed, sensor size, sensor spacing and kp/kd changes
      either hurt or did nothing. With no further race before the unseen-track evaluation,
      an untested tweak carries real risk of losing a design that completes two of
      three tracks reliably. I am therefore resubmitting the iteration-9 design unchanged.
      Geometry: five 12 mm sensors at x = -0.04 to 0.04 m (0.02 m steps) at y = 0.08
      m, wheel_track 0.12 m, wheel_radius 0.03 m, body 0.12 x 0.18 m, mass 0.8 kg.
      Controller: base_speed 1.3, kp 3.0, ki 1.0, kd 0.8, weights -2, -1, 0, 1, 2,
      line_loss last_direction. Expected result: the oval and s-bend complete again,
      with a score near 675, and the unseen track should be similar if it resembles
      the development tracks. Hypotheses to check: the slalom remains the failure
      mode because the line leaves the sensor array laterally at sharp direction changes,
      and steering oscillation stays near 0.2 to 0.45. Measurements to request: completion,
      progress, completion_time, rms_error, max_error, line_loss_events and steering_oscillation,
      to confirm that the result holds on the final track.


