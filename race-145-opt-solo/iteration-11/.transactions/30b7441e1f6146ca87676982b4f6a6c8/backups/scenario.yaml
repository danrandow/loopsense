  entities:
  - id: entity0
    label: Wider sensor array
    notes: 'Iteration 10 keeps iteration 9''s controller and widens the sensor array
      to x = ±0.06 m at y = 0.08 m. Slalom line losses, which occur as the line leaves
      the 12 mm sensor array at the first sign change, are the main failure in the
      evidence.


      ### Rationale


      Evidence: iteration 9 is the best design so far (675.8). The oval finishes 20/20
      at 1.94 s and the s-bend finishes 20/20 at 2.34 s. The slalom still goes off
      track in all 20 trials, with progress 0.37 and about 1.15 line-loss events per
      run. Forward sensor position (y 0.03 to 0.08) and integral action (ki 0 to 1.0)
      were the levers that helped. Base speed, sensor size and kp/kd changes either
      hurt or did nothing. The remaining slalom failure looks like the line leaving
      the sensor array laterally at the first sign change. With sensors at x = ±0.04
      m and 12 mm footprints, a line-loss event occurs once the robot centre is about
      0.058 m off the line, which is essentially the 0.06 m off-track limit. The robot
      therefore has no sensor warning before it leaves the track.


      Change (one variable, geometry only): spread the five sensors from x = -0.04..0.04
      m to x = -0.06, -0.03, 0, 0.03, 0.06 m. The y position stays at 0.08 m. Weights,
      controller and sensor size are unchanged from iteration 9. The wider array should
      keep at least one sensor on the tape until the robot is about 0.07 m off the
      line, which is beyond the off-track limit. The earlier wider-array test (iteration
      2) was confounded with a narrower wheel_track and a y of 0.03 m, so it does
      not rule this lever out. The main risk is that outer sensors see the line later
      on gentle curves, which could slightly raise rms error on the oval. Controller
      values are kept so that the result isolates this change.


      Expected result: slalom line_loss_events fall from about 1.15 toward 0.5 or
      less, and slalom progress rises above 0.5. The oval should still finish at about
      1.9 to 2.0 s and the s-bend should hold its completions. Hypotheses: (a) slalom
      losses come from the line leaving the array at the first sign change, so line_loss_events
      drop when the array is wider; (b) if slalom progress does not move, the limit
      is steering response (wheel_track or mass), and the next test should change
      one of those alone; (c) if steering_oscillation rises above about 0.45 on the
      s-bend, the wider array is giving the controller a larger signal jump, and kd
      should rise slightly.


