overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor design
    notes: 'First candidate with no race data yet: five sensors at 0.02 m spacing,
      proportional weights, kp 2.0, kd 0.3, base speed 1.6, last-direction line loss.
      Chosen from contract physics to be stable and finish within 3 s; the race will
      show whether speed and damping need adjusting.


      ### Rationale


      Iteration 0 has no race telemetry, so this is a conservative first candidate
      built from the contract physics rather than tuned values. Geometry: five sensors
      spaced 0.02 m apart across x = -0.04 to +0.04 m, all at y = 0.03 m ahead of
      the axle, so they see the line slightly before the wheels reach it. Sensor size
      0.012 m is about half the 25 mm tape width, which gives a clear graded reading
      as the line moves across the array. Wheel track 0.12 m, wheel radius 0.03 m,
      body 0.12 x 0.18 m and mass 0.8 kg are mid-range values that keep yaw inertia
      moderate and the off-track limit at 0.06 m. Controller: sensor weights are proportional
      to sensor x (-2, -1, 0, 1, 2), so the signal is positive when the line is left
      of centre and steers left, as the contract requires. kp = 2.0 gives a turn of
      about 700 PWM counts per unit of signal, which is firm but not saturating. kd
      = 0.3 damps the swing toward the line without adding much high-frequency noise.
      ki = 0 avoids integral windup on bends. base_speed = 1.6 (80 percent of full
      PWM) aims for the roughly 1.5 m/s average needed to finish in 3 s while leaving
      margin for cornering. line_loss = last_direction, so the robot keeps turning
      the way it was heading when the line is lost at the edge of a bend. Expected
      result: completion on the oval and s-bend, with rms error of a few millimetres
      and no line-loss events on gentle bends. The slalom may show oscillation or
      a small number of line losses. Next measurements: whether completion_time is
      under 3 s, where max_error peaks (which bend), and whether steering_oscillation
      is high enough to justify more kd or lower kp.


      - [Open this output](iteration-0/entity0/versions/1e24494add0045bdb497870dd488b2b0/payload.json)'
  actions:
  - id: action0
