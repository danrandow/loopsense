  entities:
  - id: entity0
    label: Larger sensor footprint
    notes: 'Reverts the iteration-2 spacing and track changes, which lowered every
      score, and keeps the iteration-1 best design. The only change is sensor_size
      0.012 to 0.016 m, to hold the line visible further out and cut line-loss events
      on the s-bend and slalom.


      ### Rationale


      Evidence. Iteration 1 (score 351.8) is the best design so far: the oval finishes
      15 of 20 runs in about 1.97 s, but the s-bend (progress 0.49, about 1.05 line-loss
      events per run) and slalom (progress 0.12, about 1.1 line-loss events per run)
      still leave the track. Iteration 2 widened the sensor spacing to ±0.06 m and
      narrowed wheel_track to 0.10 m, and every metric got worse (oval finish rate
      0.65, s-bend progress 0.39, slalom progress 0.08). The change was confounded,
      but the narrower track plus wider spacing did not help, so I am reverting both.
      Line loss is the dominant failure. With 12 mm sensors, a sensor at x = ±0.04
      m sees tape only while the line centre is within about 0.0125 + 0.006 + 0.04
      = 0.058 m of the robot''s centre line. That is almost exactly the 0.06 m off-track
      limit, so the robot is blind just before it leaves the track.


      Change (one variable, relative to iteration 1). Increase sensor_size from 0.012
      to 0.016 m, keeping the iteration-1 geometry (sensors at x = -0.04, -0.02, 0,
      0.02, 0.04 m, y = 0.03 m; wheel_track 0.12 m; body 0.12 x 0.18 m; mass 0.8 kg).
      The larger footprint extends the detection range to about 0.0125 + 0.008 + 0.04
      = 0.060 m, so the line stays visible for a few more millimetres of drift. That
      should reduce line-loss events on the s-bend and slalom. Controller unchanged
      from iteration 1 (base_speed 1.3, kp 3.0, ki 0, kd 0.8, weights -2, -1, 0, 1,
      2, line_loss last_direction), so the result isolates the sensor footprint.


      Expected result: line_loss_events per run on s-bend and slalom fall from about
      1.05 toward 0.5 or less, progress on those tracks rises, and the oval finish
      rate holds at about 0.75. Risk: a larger footprint blurs the signal on tight
      bends, which could add some steering oscillation.


      Hypotheses to check: (a) line losses cluster at the entry to the sharpest s-bend
      curves, where lateral error grows fastest; (b) the larger footprint reduces
      line_loss_events without raising steering_oscillation above about 0.4; (c) if
      losses persist, the next step is to raise sensor_positions spacing only after
      confirming the footprint helps. Next measurements: progress, line_loss_events,
      max_error, steering_oscillation and completion_time per track, plus controller_errors
      to rule out exceptions.


