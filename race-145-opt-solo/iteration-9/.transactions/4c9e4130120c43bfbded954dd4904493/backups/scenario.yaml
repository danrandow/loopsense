  entities:
  - id: entity0
    label: Integral gain 0.5 to 1.0
    notes: 'Keeps the best geometry (sensors at y = 0.08 m) and raises ki from 0.5
      to 1.0 to remove residual motor-mismatch bias that drives the slalom and s-bend
      line losses. The ki 0 to 0.5 step gave the largest controller gain so far (oval
      808 to 927).


      ### Rationale


      Evidence: iteration 8 (sensors at y = 0.08 m, the geometry maximum) is the best
      design so far at 666.2. The oval finishes 20 of 20 at 1.95 s. The s-bend finishes
      19 of 20 (mean 905). The slalom still fails in all 20 trials by going off track,
      with progress 0.36 and about 1.05 line-loss events per run. Moving the sensors
      from y = 0.06 to 0.08 added only about 12 points, and the slalom progress barely
      moved (0.35 to 0.36), so the forward-position lever is near its limit. Earlier
      single-lever tests on speed, sensor spacing, sensor size and kp/kd at 3.5/1.0
      did not help. The one controller change that clearly helped was adding integral
      action: ki 0 to 0.5 raised the oval from 808 to 927 at y = 0.03. The contract
      says the motors have a fixed left/right mismatch, so a residual lateral bias
      on the straight sections and gentle bends is plausible, and the slalom and s-bend
      are where bias pushes the robot to the 0.06 m limit. Change (one variable):
      ki 0.5 to 1.0. The integral is still capped at plus or minus 2 by the contract,
      so windup is bounded. Geometry, base_speed, kp, kd, weights and line_loss stay
      as in iteration 8. Expected result: lower lateral bias, so s-bend and slalom
      progress rise and s-bend completions hold or improve, with the oval still finishing
      near 2 s. Risk: a larger integral can cause overshoot on the s-bend sign changes,
      which would show as steering_oscillation above about 0.45 and a fall in s-bend
      completions. If that happens, the next step is ki about 0.7. Hypotheses to check:
      (a) a constant bias is the cause of the slalom line losses, so progress rises
      with ki; (b) if slalom progress does not move, the limit is the steering response
      (kp/kd, wheel_track or mass), not bias; (c) if the oval gets faster but the
      s-bend overshoots, ki is past its useful range. Next measurements: progress,
      line_loss_events, max_error and steering_oscillation per track, plus completion_time
      on the oval and s-bend.


