map:
  id: race-107-randow-maps
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Hold 0.09 m track, kp 3.2
    notes: 'Geometry held exactly at iteration 8''s best (215.38) with five 12 mm
      sensors and wheel_track 0.09 m, so the race isolates the Integrator''s kp 3.2
      controller change. Narrowing to 0.08 m was not proposed because the s-bend max_error
      has been flat across track widths and the controller is tuned to 0.09 m.


      ### Rationale


      Iteration 8 (wheel_track 0.09 m, five 12 mm sensors at x = -0.024 to +0.024
      m and y = 0.04 m, 0.6 kg, kp 3.5) scored 215.38, the best result so far. Its
      oval finish rate rose to 0.30 and its s-bend max_error fell to 0.0612 m. Five-sensor
      geometry with wheel_track 0.09 m is the best-supported platform, and every sensing
      change tested in iterations 1 to 3 lowered the score.


      The remaining problems are oval steering_oscillation of 0.292, above the 0.25
      caution level, and s-bend max_error still above the 0.06 m off-track floor.
      The s-bend max_error has been flat at 0.063 to 0.064 m across track widths 0.10
      to 0.09 m, so further narrowing alone is unlikely to fix it. Narrowing to 0.08
      m would add about 12 percent more yaw gain per command, which the oscillation
      already shows is at its limit. I considered proposing 0.08 m now, but the Integrator''s
      controller (kp 3.2 with kd 0.5) is tuned to the 0.09 m geometry. Changing the
      track now would confound that controller test and could cost the 215 baseline.
      I therefore hold every geometry value at iteration 8''s settings. The only change
      this iteration is the Integrator''s kp 3.5 to 3.2, which lowers yaw gain to
      bring oscillation under 0.25. Expected result: a score at or above 215, oval
      steering_oscillation below about 0.25, and s-bend and slalom line loss at or
      below 1.25 per run. If oscillation stays above 0.25 at kp 3.2, the limit is
      yaw gain at this track width, and I will not widen the sensor array.


      - [Open this output](iteration-9/entity0/versions/519c6f2617d942b7a202efa1cd0570c3/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-7b5653dbcd3a68d0/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-04f7f6a2f6184cc8/payload.json)'
  - id: entity1
    label: Held geometry, kp 3.2 kd
    notes: 'Iteration 8''s geometry is held exactly, with the Builder''s kp 3.2 and
      kd 0.5 controller. The only change is the lower kp, chosen to bring oval oscillation
      (0.291 at kp 3.5) under 0.25 while keeping the 213 to 215 score.


      ### Rationale


      Iteration 9 holds the iteration 8 geometry exactly (wheel_track 0.09 m, five
      12 mm sensors at x = -0.024 to +0.024 m, y = 0.04 m, mass 0.6 kg). The controller
      is the one that scored 215.38 in iteration 8: kp 3.2, ki 0.2, kd 0.5, base_speed
      1.8, sensor_weights [-2, -1, 0, 1, 2], line_loss last_direction. Iteration 7
      (kp 3.5, kd 0.5) scored 213.28 with oval steering_oscillation 0.291. Iteration
      6 (kp 3.5, kd 0.3) scored 153 with oscillation 0.2505. Lowering kp to 3.2 reduces
      yaw gain (kp/wheel_track falls from 38.9 to 35.6) and is the only change from
      iteration 7, so the race isolates the controller. I considered lowering kd back
      toward 0.3, but kd 0.5 is what lifted the score from 153 to 213, so I keep it.
      Expected result: oval steering_oscillation below about 0.25 and a score at or
      above 215. Because the geometry is held, a score drop points to the controller.
      Observation requests are kept broad so the oval oscillation, s-bend max_error
      and line-loss counts can be read per track.


      - [Open this output](iteration-9/entity1/versions/4058520768ac4856974eba507138d2d7/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/519c6f2617d942b7a202efa1cd0570c3/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-04f7f6a2f6184cc8/payload.json)'
  - id: entityR1
    label: Hold geometry, cut kp
    notes: 'Pre-race feedback that holds the Builder to the iteration 7 geometry and
      asks for one-step changes (kp reduction, or wheel_track 0.08 m with kp near
      3.0) depending on the next race. Evidence comes from iterations 5 to 7, where
      yaw gain drove oscillation and kd raised the score while adding oscillation.


      ### Feedback


      Written before this candidate races, so it states no outcome for it. The held
      geometry is iteration 7''s (213.28, wheel_track 0.09 m), and the only controller
      change is kp 3.5 to 3.2 with kd 0.5 kept. Evidence: iteration 6 (kd 0.3) gave
      oval steering_oscillation 0.2505 and score 153. Iteration 7 (kd 0.5) raised
      the score to 213 but pushed oscillation to 0.291, so derivative damping helps
      the score while adding oscillation. Iteration 5 (wheel_track 0.10 m, kp 4.0)
      gave oscillation 0.277, which shows yaw gain (kp divided by wheel_track) drives
      oscillation. S-bend max_error has barely moved with track width (0.0703, 0.0626,
      0.0630, 0.0643 m across iterations 4 to 7), so narrowing alone is unlikely to
      reach 0.06 m. Sensing changes in iterations 1 to 3 all lowered the score. Next
      race: if the score is at or above 213 and oval oscillation is below 0.25, keep
      this geometry and direction. If oscillation stays above 0.25 at kp 3.2, the
      limit is yaw gain at this width, so lower kp further and do not widen the sensor
      array. If the score falls below 213, the controller is the likely cause, so
      treat kp 3.2 as the suspect.


      ### Requested changes


      - If the score is at or above 213, oval steering_oscillation is below 0.25,
      and s-bend max_error is still above 0.06 m: propose wheel_track 0.08 m with
      kp about 3.0 (kp/wheel_track near 37.5), citing iteration 5''s s-bend gain (0.0703
      to 0.0626 m) and iteration 6''s flat s-bend result (0.063 m).

      - If oval steering_oscillation is still above 0.25 at kp 3.2 with the score
      at or above 213: keep wheel_track 0.09 m and the five-sensor layout, and lower
      kp further, citing iteration 5''s oscillation of 0.277 at kp 4.0 as evidence
      that yaw gain, not sensing, drives it.

      - If the score falls below 213 with the geometry held: keep wheel_track 0.09
      m, report the controller settings used, and do not change the sensor array,
      citing iterations 1 to 3, where sensor span, footprint and look-ahead changes
      all lowered the score.


      - [Open this output](iteration-9/entityR1/versions/4058520768ac4856974eba507138d2d7/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/519c6f2617d942b7a202efa1cd0570c3/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-04f7f6a2f6184cc8/payload.json)'
