map:
  id: race-107-randow-maps
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Wider track, lighter mass
    notes: 'Widens wheel_track to 0.14 m and lowers mass to 0.5 kg while keeping the
      seven-sensor array. Iteration 1 widening did not reduce line loss or max_error
      (0.062 to 0.068 m, above the 0.06 m off-track floor), so the limit appears to
      be turn authority rather than sensing.


      ### Rationale


      Iteration 1 widened the array to seven sensors (±0.036 m) and scored 91.28,
      below iteration 0''s 96.84. Line-loss events did not fall (oval 1.05, s-bend
      1.0, slalom 1.0), and max_error stayed at 0.062 to 0.068 m, above the 0.06 m
      off-track floor on every track. Sensing span is therefore not the binding limit.
      Every run still ends off_track, so the robot is departing the tape on bends
      while its sensors still see the line. Body width cannot raise the off-track
      limit: the formula tape_half_width + body_width/4 gives at most about 0.0575
      m at body_width 0.18, so the 0.06 m floor holds for any allowed body. That leaves
      turn authority and responsiveness. Following the Integrator''s contingency (max_error
      above 0.06 with line loss covered by the controller), I widen wheel_track from
      0.12 m to 0.14 m to raise the yaw moment available for bends. I also reduce
      mass from 0.6 kg to 0.5 kg, since the robot needs about 1.5 m/s average speed
      to finish in 3 s and a lighter body turns and accelerates faster. I keep the
      seven-sensor ±0.036 m span and the y = 0.04 m row, so the Integrator''s controller
      and its weight scaling stay valid and the change isolates drivetrain and inertia.
      Expected result: max_error below 0.06 m on the s-bend and slalom, fewer off-track
      ends, and progress rising on all three tracks.


      - [Open this output](iteration-2/entity0/versions/f7770e75f3fd434880fa5f718327f42a/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-63e2f15d84db2515/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-50a3e2163fe4f0fd/payload.json)'
  - id: entity1
    label: 7-sensor controller v1
    notes: 'Complete robot for the Builder''s wider seven-sensor array. Weights rescaled
      to x/0.018 with kp raised to 6.0 to hold steering gain, based on iteration 0
      line loss of 1 to 2 events per run and max_error above 0.06 m.


      ### Rationale


      The race evidence for iteration 0 is 60 trials with no finishes, all ended off
      track. Line loss occurred 1 to 2 times per run, and max_error exceeded the 0.06
      m off-track floor on the oval (0.0626) and s-bend (0.0703). The failure is therefore
      lateral reach: the tape leaves the five-sensor span before the controller can
      correct. The Builder''s seven-sensor array at x = -0.036 to +0.036 m, with 12
      mm footprints at 12 mm spacing, keeps the tape under a sensor at larger offsets,
      so I keep its geometry unchanged to isolate the sensing effect. The sensor weights
      must stay within [-2, 2]. Setting weight = x / 0.018 gives [-2, -1.33, -0.67,
      0, 0.67, 1.33, 2], which keeps the outermost sensor at the limit. Because the
      signal is a weighted average, this lowers the signal per metre of offset by
      a factor of 2/3 relative to the baseline weights (x / 0.012). To hold the same
      steering gain per metre of offset (kp / 0.018 = 4 / 0.012), I raise kp from
      4.0 to 6.0. ki and kd stay at baseline values, since steering oscillation was
      low (0.13 to 0.25) and the Builder''s contingency for oscillation is a sensor-row
      change, not a gain change. base_speed stays at 1.8 so that the speed comparison
      with iteration 0 is clean. line_loss stays at last_direction, which worked to
      keep the robot turning toward the tape after a loss. Expected result: line_loss_events
      near zero on slalom and s-bend, max_error below 0.06 m, and higher progress
      on all three tracks. The main risk is that the higher kp raises steering oscillation
      on tight bends.


      - [Open this output](iteration-1/entity1/versions/b6025b3489fc4e82a8c90d1a56303d81/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/db33385f2e1e4260899c2cdb0536c51f/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-9d5d79948d9cec2f/payload.json)'
  - id: entityR1
    label: Sensing-first feedback
    notes: 'Feedback asks the Builder to keep the wider span and to change only one
      of the sensor row, wheel track or sensor size, depending on whether the next
      race shows oscillation, max_error or line loss. Each contingency cites iteration
      0 telemetry.


      ### Feedback


      Iteration 0 showed the five-sensor span (x = ±0.024 m) is too narrow: line_loss_events
      were 1 to 2 per run and max_error reached 0.0626 m on the oval and 0.0703 m
      on the s-bend, so runs ended off track before any finish. To work with your
      seven-sensor span, I rescaled the sensor weights to x/0.018 and raised kp to
      6.0, which keeps the steering gain per metre of offset equal to iteration 0.
      I have no race data for this candidate yet. Next race: if line_loss_events are
      zero but steering_oscillation rises above about 0.25 (iteration 0 range 0.13
      to 0.25), the outer sensors are reacting too early, so move the forward sensor
      row toward y = 0.03 m, citing that iteration 0 oscillation was low enough to
      allow this. If line_loss_events are zero and max_error is still above 0.06 m,
      the limit is turn authority rather than sensing, so widen wheel_track, citing
      the iteration 0 max_error of 0.063 to 0.070 m. If line loss remains above zero
      on slalom or s-bend, keep the seven-sensor span and widen sensor_size to 0.016
      m, which gives each sensor more footprint over the tape.


      ### Requested changes


      - If line_loss_events are zero but steering_oscillation exceeds about 0.25:
      move the forward sensor row from y = 0.04 m to y = 0.03 m, keeping x = ±0.036
      m, since iteration 0 oscillation was 0.13 to 0.25 and the outer sensors may
      be reacting early.

      - If line_loss_events are zero but max_error stays above 0.06 m: widen wheel_track
      from 0.12 m to 0.14 m, since iteration 0 max_error was 0.063 to 0.070 m with
      the sensing span the limiting factor.

      - If line_loss_events stay above zero on slalom or s-bend: set sensor_size to
      0.016 m with the same seven x positions, so each footprint covers more of the
      25 mm tape when the robot is at the edge, citing the 1 to 2 line-loss events
      per run in iteration 0.


      - [Open this output](iteration-1/entityR1/versions/b6025b3489fc4e82a8c90d1a56303d81/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/db33385f2e1e4260899c2cdb0536c51f/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-9d5d79948d9cec2f/payload.json)'
