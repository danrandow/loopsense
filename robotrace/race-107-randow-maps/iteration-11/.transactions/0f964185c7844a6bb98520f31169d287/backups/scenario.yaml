overrides:
  entities:
  - id: entity0
    label: 'Final: hold 215-scoring'
    notes: 'Holds the iteration 8 and 9 geometry (wheel_track 0.09 m, five 12 mm sensors
      at y = 0.04 m, 0.6 kg), which scored 215.38 twice. Iteration 10 showed that
      kp 3.2 cut the score to 174.96 without moving oval oscillation, so the geometry
      is kept and the controller is not changed here.


      ### Rationale


      This is the final iteration, so this design races the held-back final track
      and nothing after it can correct it. The best-supported platform is the wheel_track
      0.09 m, five-sensor, 12 mm, y = 0.04 m, 0.6 kg geometry from iterations 8 and
      9, which scored 215.38 both times. Iteration 10 kept that geometry and changed
      only the controller to kp 3.2 with kd 0.5. It scored 174.96, and oval steering_oscillation
      stayed at 0.294, so kp 3.2 is the wrong direction and the cost falls on the
      controller, not the geometry. Every sensing change (iterations 1 to 3) lowered
      the score, and narrowing the track to 0.08 m adds about 12 percent more yaw
      gain per command, which the oscillation already shows is at its limit. A geometry
      gamble on the last race has no later iteration to recover from, so I hold the
      proven values unchanged. Expected result: a score near 215 on the development
      tracks with the Integrator''s controller. The Integrator should return to kp
      3.5 with kd 0.5, which scored 215.38 on this geometry, rather than kp 3.2.


      - [Open this output](iteration-11/entity0/versions/c42677831a5446a48336929a134d7a24/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-eedf31e118a8e55e/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-c0df5f8993ac648b/payload.json)'
  - id: entity1
    label: Complete Robot Package
    notes: 'Complete Robot Package. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      The Builder''s geometry is the iteration 8 and 9 platform: wheel_track 0.09
      m, five 12 mm sensors at x = -0.024 to +0.024 m and y = 0.04 m, mass 0.6 kg.
      The Integrator adopts it unchanged. Iteration 8 and 9 both ran kp 3.2 with kd
      0.5 and scored 215.38. The oval steering_oscillation at that setting was 0.292,
      and the same value at kp 3.5 was 0.291 (iteration 7). Lowering kp from 3.5 to
      3.2 therefore left oscillation essentially unchanged. The oscillation rise came
      from the kd change: kd 0.3 gave 0.2505 (iteration 6) and kd 0.5 gave about 0.29,
      while the score rose from 153 to 213. The Builder''s premise that kp/wheel_track
      drives oscillation is not supported at this geometry. Derivative gain is the
      lever. This iteration keeps kp 3.2 (the best-scoring point) and sets kd to 0.4,
      an intermediate value between the 0.3 result (oscillation 0.25, score 153 at
      kp 3.5) and the 0.5 result (score 215). Expected result: oval oscillation near
      0.27 or below, with the score close to 215. If the score falls well below 215,
      kd 0.5 was needed for the score and the next controller step should be a different
      damping term rather than a lower kd. Sensors, geometry, base_speed, ki and line_loss
      are unchanged from the 215.38 baseline.


      - [Open this output](iteration-10/entity1/versions/51c938cf32dd4304a801e3373a31cc6c/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/a645d39d312e45ad9e7d3438f95dba7f/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-04f7f6a2f6184cc8/payload.json)'
  - id: entityR1
    label: Integration Feedback
    notes: 'Integration Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Written before this candidate races, so it states no outcome for it. The held
      geometry is iteration 8 and 9 (wheel_track 0.09 m, five 12 mm sensors at y =
      0.04 m, 0.6 kg). Evidence: iteration 6 (kp 3.5, kd 0.3) scored 153 with oval
      steering_oscillation 0.2505. Iteration 7 (kp 3.5, kd 0.5) scored 213.28 with
      oscillation 0.291. Iterations 8 and 9 (kp 3.2, kd 0.5) scored 215.38 with oscillation
      0.292. Lowering kp from 3.5 to 3.2 left oscillation unchanged, so yaw gain (kp/wheel_track)
      is not the oscillation driver at this width. Kd is. Iteration 5 showed oscillation
      rising at 0.10 m with kp 4.0 and kd 0.3, so narrowing the track also adds some
      oscillation, but that was the case before kd was raised. S-bend max_error has
      been flat at 0.061 to 0.064 m across track widths 0.10 to 0.09 m (iterations
      5 to 9), so track width alone is unlikely to reach the 0.06 m floor. Sensing
      changes in iterations 1 to 3 all lowered the score. Next race: if the score
      stays near 215 with oval oscillation below 0.25, keep the geometry and the kd
      direction. If oscillation stays above 0.25 at kd 0.4 with the score near 215,
      the sensor array should not change, and the remaining lever is a controller
      damping change. If the score falls below 213, kd 0.5 was needed for the score,
      so keep it and read any oscillation fix as a controller issue, not geometry.


      ### Requested changes


      - If the score is at or above 213 and s-bend max_error is still above 0.06 m
      with oval steering_oscillation below 0.25: propose wheel_track 0.08 m, with
      kp chosen to hold kp/wheel_track near 37.5 (about 3.0). Cite iteration 5 (s-bend
      max_error 0.0703 to 0.0626 m) and iterations 6 to 9 (flat at 0.061 to 0.064
      m) as the reason to test one more narrowing.

      - If oval steering_oscillation stays above 0.25 at kd 0.4 with the score at
      or above 213: keep wheel_track 0.09 m and the five-sensor layout. Do not treat
      kp as the oscillation fix, since kp 3.5 to 3.2 changed oscillation by only 0.001
      (iterations 7 and 9).

      - If the score falls below 213 with the geometry held: keep wheel_track 0.09
      m and do not change the sensor array. Cite iterations 1 to 3, where sensor span,
      footprint and look-ahead changes all lowered the score.


      - [Open this output](iteration-10/entityR1/versions/51c938cf32dd4304a801e3373a31cc6c/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/a645d39d312e45ad9e7d3438f95dba7f/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-04f7f6a2f6184cc8/payload.json)'
