map:
  schema: "v0.2"
  id: "control-robotrace"
  title: "Control Robot Race"
  scenario: "Optimizer-evaluator learning loop"
  is_moo: true
  notes: |
    The conventional comparison condition for the LoopSense Robot Race. Two AI
    agents share a blackboard. The Robot Optimizer owns both geometry and
    controller and produces one complete candidate per iteration. Every valid
    candidate is tested immediately. The Evaluator works after the race: it
    interprets its independently addressed measurements and advises the Optimizer
    about the next iteration.

    Both AI agents receive independently addressed copies of the same race
    measurements. The Evaluator then returns post-race recommendations to the
    Optimizer. Actor 2 is the simulated robot, not an AI agent.
  iteration_definition: |
    An iteration starts when actor0 uses the preceding race data and evaluator
    feedback to generate one complete candidate robot, entity0. Actor2 immediately
    races every valid entity0 and generates entity2 plus independently addressed
    measurement returns for both AI agents. Actor1 consumes its return and generates
    entityR1 for actor0. The iteration ends there: actor0 does not revise the robot
    until the next iteration. A retrospective may revise the working agreement for
    the next iteration but not the topology, budgets, or evaluation rules.
  dimension_axes: [condition, iteration]

actors:
  - id: actor0
    label: Robot Optimizer
    notes: |
      AI agent. Owns and modifies the complete robot design: geometry and
      controller. It uses direct race measurements and evaluator feedback but
      remains solely responsible for the candidate put on the track.

  - id: actor1
    label: Evaluator
    notes: |
      AI agent. Acts after each race, providing as much evidence-grounded feedback
      as fits the fixed budget. It does not own or edit geometry or controller files
      and cannot delay a valid candidate's test. Its advice can affect only the next
      iteration.

  - id: actor2
    label: Robot on Track
    notes: |
      Deterministic software actor instantiated from entity0. It cannot interpret
      results. It pursues the race outcome, records evidence, and supplies supported
      measurements in two addressed return-flow entities.

actions:
  - id: action0
    actor: actor0
    label: Optimize robot
    notes: |
      Produces one complete geometry-controller candidate per iteration using prior
      race data and evaluator feedback. A valid candidate is always tested before
      actor0 acts again.

  - id: action1
    actor: actor1
    label: Evaluate results
    notes: |
      Consumes independently addressed post-race measurements and returns analysis
      and recommendations for the next iteration. It supplies advice but never
      edits the robot.

  - id: action2
    actor: actor2
    label: Race track
    notes: |
      Executes the candidate robot on the same configured track and seed batch used
      by the LoopSense condition. Generates outcomes, telemetry, scores, and
      trajectory images. It supplies data, not interpretation.

entities:
  - id: entity0
    label: Candidate Robot
    system_boundary: internal
    notes: |
      Actor0's complete geometry-controller package, rationale, hypotheses, and
      measurement requests. There is exactly one tested candidate per iteration.

  - id: entity2
    label: Race Outcome
    system_boundary: internal
    notes: |
      The outcome actor2 pursues by racing. It has no used-by edge to either AI
      agent; upstream learning occurs through addressed return-flow entities.

  - id: entityR1
    label: Evaluator Feedback
    direction: return
    notes: |
      Actor1's post-race analysis and recommendations for actor0, grounded in
      actor1's addressed race measurements. It never directly edits the robot, and
      actor0 cannot act on it until the next iteration.

  - id: entityR2A
    label: Race Data for Optimizer
    direction: return
    notes: |
      Measurement-only evidence generated by actor2 and independently addressed to
      actor0. Initially it contains the same standard race dataset as entityR2B.

  - id: entityR2B
    label: Race Data for Evaluator
    direction: return
    notes: |
      Measurement-only evidence generated by actor2 and independently addressed to
      actor1. Initially it contains the same standard race dataset as entityR2A.

  - id: entityTeam0
    label: Working Agreement
    system_boundary: private
    notes: |
      Shared blackboard conventions, evaluation practice, feedback format, and
      current measurement requests. Revisions apply only from the next iteration
      and cannot add an optimization turn before testing.

  - id: entityPub0
    label: Track Conditions
    system_boundary: public
    notes: |
      The same versioned tracks, seeds, noise, design constraints, scoring rules,
      model configuration, and total budget used by the LoopSense condition.

  - id: entityPrv0
    label: Optimizer Expertise
    system_boundary: private
    notes: Actor0's evolving robot-design knowledge and judgement.

  - id: entityPrv1
    label: Evaluator Expertise
    system_boundary: private
    notes: Actor1's evolving evaluation knowledge and judgement.

edges:
  - id: edge0G
    type: generates
    from: action0
    to: entity0
  - id: edge0U
    type: used by
    from: entity0
    to: action2
  - id: edge2G
    type: generates
    from: action2
    to: entity2

  - id: edgeR1G
    type: generates
    from: action1
    to: entityR1
    direction: return
  - id: edgeR1U
    type: used by
    from: entityR1
    to: action0
    direction: return

  - id: edgeR2AG
    type: generates
    from: action2
    to: entityR2A
    direction: return
  - id: edgeR2AU
    type: used by
    from: entityR2A
    to: action0
    direction: return
  - id: edgeR2BG
    type: generates
    from: action2
    to: entityR2B
    direction: return
  - id: edgeR2BU
    type: used by
    from: entityR2B
    to: action1
    direction: return

  - id: edgeTeam0U0
    type: used by
    from: entityTeam0
    to: action0
  - id: edgeTeam0U1
    type: used by
    from: entityTeam0
    to: action1

  - id: edgePub0U2
    type: used by
    from: entityPub0
    to: action2

  - id: edgePrv0U
    type: used by
    from: entityPrv0
    to: action0
  - id: edgePrv0G
    type: generates
    from: action0
    to: entityPrv0
  - id: edgePrv1U
    type: used by
    from: entityPrv1
    to: action1
  - id: edgePrv1G
    type: generates
    from: action1
    to: entityPrv1
