map:
  id: race-106-opt-eval
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: kp 1.8, narrower sensor x
    notes: 'Keeps kp 1.8, the best raced design (432.15), and narrows the sensor spread
      from ±0.05 to ±0.04 m, the untested direction after the wider spreads hurt.
      The aim is to lift the slalom, which has stayed at about 0.186 progress across
      every change so far. Evidence: iterations 4 and 9 in the race data.


      ### Rationale


      Evidence. Iteration 9 (kp 1.8, otherwise the iteration 5 baseline) is the best
      raced design at 432.15. Oval still finished 20 of 20 at 1.88 s. S-bend progress
      rose from 0.56 to 0.68, so turn authority helps the bends. Slalom did not move:
      progress 0.186 with exactly 1 line-loss event per run, against 0.19 in iteration
      5. S-bend steering_oscillation rose to 0.36 and control effort to 8.0, so jitter
      is now a cost. Slalom progress has sat at about 0.186 across iterations 3, 5,
      7, 8 and 9, whatever the speed, kp or line-loss mode. Only the two wider or
      larger variants moved it, and both made it worse: x spread ±0.07 gave 0.11 (iteration
      4) and sensor_size 0.016 gave 0.12 (iteration 6).


      Decision. I keep kp 1.8, since it is the best raced result and the approved
      fallback path for s-bend. I do not take the kp 2.0 step. Its trigger required
      slalom to rise above 0.19, and it did not (0.1857), while s-bend oscillation
      is already 0.36. For the one change this iteration, I narrow the sensor x spread
      from ±0.05 to ±0.04 (x = -0.04, -0.02, 0, 0.02, 0.04), keeping y 0.07, sensor_size
      0.012, kd 0.4, ki 0.5, base_speed 1.2 and last_direction. The wider spread was
      the one geometry change that hurt both the oval and the slalom, so the opposite
      direction is the untested lever. The trade-off is that the outer sensors see
      less of the tape on the sharpest bends, so line loss could rise.


      Expected result. Slalom progress rises above 0.19, or at least holds at about
      0.19, with line_loss_events at or below 1. Oval finish stays at 1.0 and s-bend
      progress stays at or above about 0.6. Risk: the narrower array loses the tape
      earlier on the slalom, which would lower slalom progress and s-bend progress
      together.


      Hypotheses. (a) Outer sensors at ±0.05 read the tape too late or too early on
      sharp bends, so the narrower spread reduces the slalom loss. (b) If slalom is
      unchanged, sensor geometry is not the limit, and the next test is either kd
      0.5 for s-bend oscillation control or a single sensor-weight change.


      Measurements wanted: per-track progress, finish rate, completion_time, line_loss_events,
      max_error and steering_oscillation. Watch slalom progress against 0.186 and
      s-bend oscillation against 0.36.


      - [Open this output](iteration-10/entity0/versions/310354b2d3ed42e594058a70378235bf/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-efb9c2f2223c1695/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-dd124adf83222ef8/payload.json)'
  - id: entityR1
    label: 'Approve: narrower sensor'
    notes: 'Approved the iteration 9 design (best raced, 432.15) with only the sensor
      x spread narrowed from +/-0.05 to +/-0.04. The wider +/-0.07 spread in iteration
      4 hurt the oval finish (0.6) and the slalom, so the opposite direction is the
      untested lever left on the slalom, which has stayed near 0.186 progress since
      iteration 3.


      ### Feedback


      Written before this candidate races. The candidate is the iteration 9 design
      (best raced at 432.15: kp 1.8, kd 0.4, ki 0.5, base_speed 1.2, y 0.07, sensor_size
      0.012, last_direction) with one geometry change: the sensor x spread narrows
      from +/-0.05 to +/-0.04. I checked the controller fields against iteration 9
      and they match.


      Why it is a reasonable test: iteration 4 (x spread +/-0.07) cut oval finish
      to 0.6 and lowered slalom progress to 0.11, so widening clearly hurt. The opposite
      direction has not been tried at this geometry. Iteration 9 shows that kp 1.8
      lifted s-bend progress to 0.68 and left the oval at 20 of 20, so the controller
      is in a good state, and a single-variable geometry change is the right next
      step. Slalom progress has held at about 0.186 across iterations 3, 5, 7, 8 and
      9, which suggests the slalom loss is set by sensor geometry at the sharpest
      entry. Iteration 8 (base_speed 1.0) cut s-bend progress to 0.35, so do not lower
      speed.


      Risk: the narrower array sees less tape on the sharpest bends, so line loss
      could rise and s-bend progress could fall with it, as well as slalom. The oval
      may be steadier on straights.


      Read the race in this order. (1) If slalom progress rises above 0.19 and s-bend
      progress stays at or above about 0.6, keep the narrower spread and consider
      a further step to +/-0.03. (2) If slalom and s-bend both fall, the spread at
      +/-0.05 is the best trade-off, so return to it and treat the slalom as a limit
      of the current sensor layout. (3) If the oval finish drops below 1.0 or oval
      steering_oscillation rises well above 0.25, check the narrower spread on straights
      before taking any further step.


      ### Requested changes


      - If slalom progress rises above 0.19 with the narrower spread and s-bend progress
      stays at or above about 0.6, keep geometry.sensor_positions x at -0.04, -0.02,
      0, 0.02, 0.04 and try a further step to +/-0.03, since iteration 4 showed wider
      spread hurt and this is the opposite direction.

      - If slalom and s-bend progress both fall below iteration 9 values (0.186 and
      0.68) with the narrower spread, return geometry.sensor_positions x to +/-0.05
      (iteration 9 baseline) and keep kp 1.8, since narrowing removes tape coverage
      on the sharpest bends.

      - Do not lower controller.base_speed. Iteration 8 showed base_speed 1.0 cut
      s-bend progress from 0.68 to 0.35 without moving slalom progress (0.187), so
      keep base_speed 1.2.


      - [Open this output](iteration-10/entityR1/versions/40fa9f81988b4aeea9fb7b07adf7a5af/payload.json)

