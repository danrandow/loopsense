map:
  id: race-106-opt-eval
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Forward sensors at y 0.07
    notes: 'Reverts the wider ±0.07 spread that scored 271.7, and returns to the iteration
      3 best geometry (±0.05) with every sensor moved forward to y 0.07 for earlier
      bend steering. Controller is unchanged from the 342.0 design, so only sensor
      lead changes.


      ### Rationale


      Evidence. Iteration 3 (kd 0.4, ki 0.5, base_speed 1.2, kp 1.5, sensors at x
      = ±0.05 and y = 0.05, score 342.03) is the best raced design. Its oval finished
      16 of 20 with max_error 0.043, so derivative damping fixed the oval. Its s-bend
      and slalom still left the line at progress 0.28 and 0.19, with line_loss_events
      0.55 and 1.0 and max_error about 0.062 to 0.064. Iteration 4 widened the outer
      sensors to ±0.07 and scored lower, at 271.70. The oval finish rate fell to 0.6,
      and s-bend and slalom progress fell to 0.17 and 0.11. Wider spacing therefore
      hurt, so I am reverting the x spread. Controller gains (kp 1.5, ki 0.5, kd 0.4,
      base_speed 1.2) have not shown a clear lever on the tight tracks, and kp, ki
      and speed barely moved max_error across iterations 0 to 2.


      Change. Starting from the iteration 3 geometry (x = ±0.05, ±0.025, 0), I move
      every sensor forward from y = 0.05 to y = 0.07. The aim is earlier steering
      lead on bend entry, which is where the tape is lost on the s-bend and slalom.
      The controller is unchanged from iteration 3, so the effect of the forward shift
      is isolated.


      Expected result. Fewer line-loss events on s-bend and slalom (below 0.4 on s-bend,
      and slalom below 1.0), progress above 0.3 on those tracks, and oval finish rate
      held at or above 0.8. The risk is that a forward shift makes the sensors react
      earlier to noise, which could raise oval steering_oscillation above about 0.3.


      Hypotheses. (a) Lead distance, not sensor spread, limits the tight bends. (b)
      If line_loss stays at 1 per run on the slalom with y = 0.07, the loss is at
      the sharpest bend entry, and the next test is sensor_size 0.016 at the same
      positions. (c) If the oval finish rate drops below 0.8 or oval steering_oscillation
      rises above 0.3, drop kd back toward 0.3 before changing geometry further.


      Measurements wanted. Per-track progress, finish rate, line_loss_events, max_error,
      steering_oscillation, and distance before the first off-track event.


      - [Open this output](iteration-5/entity0/versions/fe3cbcac1b42409090993b5b3a042f46/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-6c9781f92c038ad0/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-96ca12a3dd183eb1/payload.json)'
  - id: entityR1
    label: Approve wider sensor
    notes: 'Approved the single-field test of widening the outer sensors from ±0.05
      to ±0.07 on the best raced design (342.03, iteration 3). The s-bend and slalom
      line-loss and off-track evidence from that race supports trying spread before
      controller changes.


      ### Feedback


      Approved. This candidate changes one geometry field from iteration 3: the outer
      sensor x positions move from ±0.05 to ±0.07, with the inner sensors at ±0.035
      and 0. Controller, sensor_size, sensor y and line_loss are unchanged, so any
      effect comes from the wider footprint. Iteration 3 (kd 0.4, ki 0.5, base_speed
      1.2, kp 1.5, sensors at ±0.05, score 342.03) is the best raced design. Its oval
      finished 16 of 20 runs with max_error 0.043. Its s-bend and slalom both ended
      off track with progress 0.28 and 0.19, line_loss_events 0.55 and 1.0, and max_error
      about 0.062 to 0.064. Iterations 0 to 2 showed max_error fixed near 0.061 to
      0.065 across changes to kp, kd, ki and base_speed, so the controller is not
      the main limit on the tighter tracks. The sensor spread is the cheapest untested
      lever, and the new value is inside the ±0.08 limit. Because the candidate is
      valid and a clean single-variable test of the best design, approve it so the
      race returns per-track telemetry. Read the result in this order. (1) If s-bend
      and slalom line_loss_events fall and their progress rises above 0.4, keep the
      wider spread and next test sensor y 0.07 to add steering lead. (2) If line_loss
      stays at 1 per run on the slalom with the wider array, the loss happens at bend
      entry, so next test sensor_size 0.016 with the same positions. (3) If oval steering_oscillation
      rises well above 0.28 or the oval finish rate drops below 0.8, the wider spacing
      is hurting centring on straights, so return the outer sensors to ±0.06 as a
      compromise.


      ### Requested changes


      - If s-bend or slalom line_loss_events fall but max_error stays near 0.06, keep
      geometry.sensor_positions at ±0.07 and move the sensors forward by setting every
      y to 0.07, to give earlier steering lead on bend entry.

      - If slalom line_loss_events stay at 1 per run with the wider array, keep the
      ±0.07 spread and set geometry.sensor_size to 0.016 with the same positions,
      since iteration 3 showed the outer sensors losing the tape on sharp bends.

      - If oval steering_oscillation rises well above 0.28 or the oval finish rate
      drops below 0.8, reduce the outer sensor x values to ±0.06 as a compromise between
      bend coverage and straight-line centring.


