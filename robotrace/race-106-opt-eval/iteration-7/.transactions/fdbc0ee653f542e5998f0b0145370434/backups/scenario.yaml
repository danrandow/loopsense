map:
  id: race-106-opt-eval
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Iter 5 + search_right
    notes: 'Reverts the sensor footprint to 0.012 because iteration 6 (0.016) scored
      lower than iteration 5 (350 vs 417). Changes only line_loss to search_right
      to test whether a fixed recovery direction fixes the slalom''s single line-loss
      event per run.


      ### Rationale


      Evidence: iteration 5 (sensors at x = -0.05 to 0.05, y = 0.07, sensor_size 0.012,
      kp 1.5, ki 0.5, kd 0.4, base_speed 1.2, last_direction) is the best raced design
      at 417.25. Its oval finished 20 of 20, and forward sensors (y 0.05 to 0.07)
      doubled s-bend progress (0.28 to 0.56). Iteration 6 tested sensor_size 0.016
      at the same positions and scored lower (350.07). Oval finish fell to 0.9, s-bend
      progress fell to 0.29, and slalom progress fell to 0.12. The larger footprint
      therefore hurt, and the approved input''s footprint change is already refuted
      by race data, so I am not repeating it. Controller gains have shown no clear
      lever on the tight tracks beyond kd, which is fixed at 0.4 for the oval. Slalom
      still shows exactly 1 line-loss event per run at a fixed point (iterations 3
      to 6), with progress stuck near 0.19, so the loss is a recovery-behaviour problem
      rather than a geometry limit. Change: revert sensor_size to 0.012 (iteration
      5 geometry) and change controller.line_loss from last_direction to search_right
      (signal fixed at +1, steering the robot LEFT on loss). Every other field stays
      at iteration 5 values, so the effect of the recovery mode is isolated. Expected
      result: slalom line_loss_events stay at or near 1 but the robot recovers and
      progress rises above 0.2, and oval and s-bend results match iteration 5. Hypotheses:
      (a) the slalom loss is a first-bend overshoot where a fixed search direction
      recovers the line better than last_direction; (b) if slalom progress drops or
      is unchanged with search_right, the drift is to the right and search_left is
      the next test. Measurements wanted: per-track progress, finish rate, line_loss_events,
      and the side the robot leaves the line on each track.


      - [Open this output](iteration-7/entity0/versions/5a7f184dc96744408efa427766c80174/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-98c81e59bb5369c4/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-159e69b9ed10f043/payload.json)'
  - id: entityR1
    label: 'Approve: footprint 0.016'
    notes: 'Approved the single-variable test sensor_size 0.012 to 0.016 on the iteration
      5 design (best raced, 417.25), since the oval finishes 20 of 20 and the s-bend
      and slalom still lose the line. Feedback sets follow-ups for oval finish rate,
      slalom line loss, and the line_loss mode depending on the race result.


      ### Feedback


      Approved to race as a single-variable test of the sensor footprint. The candidate
      keeps the iteration 5 geometry (sensors at x = -0.05, -0.025, 0, 0.025, 0.05
      and y = 0.07) and the iteration 5 controller (kp 1.5, ki 0.5, kd 0.4, base_speed
      1.2, last_direction). Only sensor_size changes, from 0.012 to 0.016. Iteration
      5 is the best raced design (417.25). Its oval finished 20 of 20 at progress
      0.998, but its s-bend ended off track at progress 0.56 with 0.6 line-loss events
      per run, and its slalom stayed at progress 0.19 with exactly 1 line-loss event
      per run. Iteration 4 showed that widening the x spread to ±0.07 hurt (oval finish
      0.6), so the x spread stays at ±0.05. Iteration 3 showed kd 0.4 was the lever
      that fixed the oval, so kd and ki stay as they are. The remaining untested lever
      on the tight tracks is the footprint, which is why this candidate is worth racing
      now.


      Read the result in this order. (1) If s-bend and slalom line_loss_events fall
      and slalom progress rises above 0.2, keep sensor_size 0.016 and consider a further
      gain or speed step. (2) If the oval finish rate drops below 0.8 or oval steering_oscillation
      rises well above 0.25, the larger footprint is averaging in too much background
      on straights, so return sensor_size to 0.012 and change kd to 0.3 instead. (3)
      If the slalom line_loss_events stay at 1 per run, the loss is at a fixed start
      or first-bend point rather than a geometry limit, so the next test should change
      controller.line_loss to search_left or search_right, not geometry.


      ### Requested changes


      - If the oval finish rate stays at or above 0.8 and s-bend or slalom line_loss_events
      fall below their iteration 5 values (0.6 and 1.0), keep geometry.sensor_size
      at 0.016 and try controller.base_speed 1.4 with the other fields unchanged,
      since speed has not been tested on the tighter tracks at this geometry.

      - If the oval finish rate drops below 0.8 or oval steering_oscillation rises
      above about 0.25 with sensor_size 0.016, return geometry.sensor_size to 0.012
      and set controller.kd to 0.3, using the iteration 5 geometry, since iteration
      3 showed kd 0.4 gave the oval its finish-rate gain.

      - If slalom line_loss_events stay at 1 per run with sensor_size 0.016, keep
      the footprint and change controller.line_loss from last_direction to search_left
      or search_right, matching the side the robot drifts toward on the first bend,
      since sensor coverage alone has not stopped the slalom loss in iterations 3
      to 5.


      - [Open this output](iteration-6/entityR1/versions/6069003394b94a5380454889152876ce/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/9593a83904094a0981a39c53a94aa3cc/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-e03e7bcd54a9bcc3/payload.json)'
