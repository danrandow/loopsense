  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: 'Final: iter 9 best design'
    notes: 'Reverts to the iteration 9 design (best raced, 432.15) with sensor x spread
      back to ±0.05, after the ±0.04 test scored 260.62 with lower oval finish and
      s-bend and slalom progress. No untested changes are added, since this final
      design is scored unseen.


      ### Rationale


      Final iteration, so the goal is the most reliable design to race on the unseen
      track, not a new experiment. The best raced design is iteration 9 (score 432.15):
      sensors at x = -0.05, -0.025, 0, 0.025, 0.05 with y = 0.07, sensor_size 0.012,
      kp 1.8, ki 0.5, kd 0.4, base_speed 1.2, last_direction. Iteration 9 finished
      the oval 20 of 20 at 1.88 s, with s-bend progress 0.68 and slalom progress 0.186.


      The Evaluator''s narrower-spread test (iteration 10, x = ±0.04) lost ground,
      scoring 260.62. Oval finish fell to 7 of 20, s-bend progress fell from 0.68
      to 0.53, and slalom progress fell from 0.186 to 0.182. Its requested fallback
      applies: slalom and s-bend both fell below iteration 9, so the spread returns
      to ±0.05. Iteration 4 (±0.07) and iteration 6 (sensor_size 0.016) also hurt,
      so neither is reintroduced.


      I considered untested tweaks such as kd 0.5 for s-bend oscillation (0.36) or
      kp 2.0. Neither has race evidence, and the unseen-track race is scored once
      with no later check, so I kept the proven design unchanged.


      Expected result: roughly the iteration 9 profile, with the oval completing reliably
      and s-bend and slalom progress near 0.68 and 0.19 on the development tracks.
      The unseen track may differ. Measurements requested are the standard set so
      the outcome can be read against iteration 9.


      - [Open this output](iteration-11/entity0/versions/18e1c5c2f4024cfbbbc893b933ffa15b/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-5f23cbcce7260bec/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-6f1638ba1021eb44/payload.json)'
  - id: entityR1
    label: 'Approve: narrower sensor'
    notes: 'Approved the iteration 9 design (best raced, 432.15) with only the sensor
      x spread narrowed from +/-0.05 to +/-0.04. The wider +/-0.07 spread in iteration
      4 hurt the oval finish (0.6) and the slalom, so the opposite direction is the
      untested lever left on the slalom, which has stayed near 0.186 progress since
      iteration 3.


      ### Feedback


      Written before this candidate races. The candidate is the iteration 9 design
      (best raced at 432.15: kp 1.8, kd 0.4, ki 0.5, base_speed 1.2, y 0.07, sensor_size
      0.012, last_direction) with one geometry change: the sensor x spread narrows
      from +/-0.05 to +/-0.04. I checked the controller fields against iteration 9
      and they match.


      Why it is a reasonable test: iteration 4 (x spread +/-0.07) cut oval finish
      to 0.6 and lowered slalom progress to 0.11, so widening clearly hurt. The opposite
      direction has not been tried at this geometry. Iteration 9 shows that kp 1.8
      lifted s-bend progress to 0.68 and left the oval at 20 of 20, so the controller
      is in a good state, and a single-variable geometry change is the right next
      step. Slalom progress has held at about 0.186 across iterations 3, 5, 7, 8 and
      9, which suggests the slalom loss is set by sensor geometry at the sharpest
      entry. Iteration 8 (base_speed 1.0) cut s-bend progress to 0.35, so do not lower
      speed.


      Risk: the narrower array sees less tape on the sharpest bends, so line loss
      could rise and s-bend progress could fall with it, as well as slalom. The oval
      may be steadier on straights.


      Read the race in this order. (1) If slalom progress rises above 0.19 and s-bend
      progress stays at or above about 0.6, keep the narrower spread and consider
      a further step to +/-0.03. (2) If slalom and s-bend both fall, the spread at
      +/-0.05 is the best trade-off, so return to it and treat the slalom as a limit
      of the current sensor layout. (3) If the oval finish drops below 1.0 or oval
      steering_oscillation rises well above 0.25, check the narrower spread on straights
      before taking any further step.


      ### Requested changes


      - If slalom progress rises above 0.19 with the narrower spread and s-bend progress
      stays at or above about 0.6, keep geometry.sensor_positions x at -0.04, -0.02,
      0, 0.02, 0.04 and try a further step to +/-0.03, since iteration 4 showed wider
      spread hurt and this is the opposite direction.

      - If slalom and s-bend progress both fall below iteration 9 values (0.186 and
      0.68) with the narrower spread, return geometry.sensor_positions x to +/-0.05
      (iteration 9 baseline) and keep kp 1.8, since narrowing removes tape coverage
      on the sharpest bends.

      - Do not lower controller.base_speed. Iteration 8 showed base_speed 1.0 cut
      s-bend progress from 0.68 to 0.35 without moving slalom progress (0.187), so
      keep base_speed 1.2.


      - [Open this output](iteration-10/entityR1/versions/40fa9f81988b4aeea9fb7b07adf7a5af/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/310354b2d3ed42e594058a70378235bf/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-dd124adf83222ef8/payload.json)'
