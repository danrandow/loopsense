map:
  id: race-106-opt-eval
  schema: v0.2
  scenario: Iteration 1
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 0.
dimensions:
  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Damped, slower baseline
    notes: 'Lowers base_speed to 1.2 and kp to 1.5, raises kd to 0.2, and widens the
      outer sensors to plus or minus 0.05 m. Iteration 0 went off track early (max_error
      about 0.061, one line loss per run) with low oscillation, which points to overshoot
      from speed and too little damping.


      ### Rationale


      Evidence from the iteration 0 race and its 60 trials: every run ended off_track
      (0 finishes). Progress was only 0.04 to 0.115, max_error reached about 0.061
      (just past the 0.06 m limit), and each run had exactly one line-loss event.
      Steering_oscillation was low (about 0.07), so the robot was not jittering. It
      was drifting off the line in one swing, early in the course. The likeliest cause
      is that kp 2.0 with kd 0.05 gives too little damping at 1.6 base_speed, so the
      robot overshoots a bend or the start, loses the line once, and then goes off.
      Line loss is not a sensor-coverage problem in the first trial, since the sensors
      reach about 4.6 cm either side and the tape is 2.5 cm wide. Changes: (1) base_speed
      1.6 to 1.2, to cut the momentum that carries the robot past the line; (2) kd
      0.05 to 0.2, to damp the overshoot; (3) kp 2.0 to 1.5, to reduce the turn gain
      that may be causing the swing, while keeping enough authority for bends; (4)
      sensor outer x values moved from plus or minus 0.04 to plus or minus 0.05, so
      the line is seen earlier when the robot drifts; (5) line_loss kept at last_direction.
      Expected result: fewer line-loss events, max_error below 0.05, and at least
      some runs completing the oval. Completion time will probably exceed 3 s at 1.2
      speed, so the next race should check whether progress reaches 1 with the lower
      speed. Hypotheses to test: (a) the early swing is an overshoot caused by kp
      and speed, so reducing both removes the off-track; (b) kd 0.2 is enough damping
      without adding jitter; (c) the outer sensors at 0.05 catch drift before line
      loss. Next measurements: progress and completion per track, line_loss_events
      by track and location, max_error, and steering_oscillation. If progress is now
      above 0.5 but completion_time is near 3 s, raise base_speed in steps of 0.2
      while watching max_error.


      - [Open this output](iteration-1/entity0/versions/75bdc59770d348f09e225079abbf5226/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-1ee495d815f79925/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-67d2affc254926ed/payload.json)'
  - id: entityR1
    label: Approve baseline for race
    notes: 'Iteration 0 has no race data, so the candidate is judged valid and not
      obviously broken, with all values inside contract limits. Approved to race to
      produce telemetry; the main open question is whether base_speed 1.6 reaches
      the 3 s finish.


      ### Feedback


      Iteration 0 has no earlier race data, so this review rests only on the candidate''s
      contents and the contract. The geometry and controller values are all inside
      their allowed ranges, and the turn authority (kp 2.0 times a maximum signal
      of 1.5, about 3 units or roughly 1050 PWM) is not extreme. The main unknown
      is speed: base_speed 1.6 (PWM fraction 0.8) must average about 1.5 m/s to finish
      in 3.0 s, and nothing shows yet whether the drivetrain delivers that. This is
      the first race, so approve it to get telemetry. Once the race reports back,
      check completion_time and progress first. If the robot is not finishing within
      3.0 s, raise base_speed. If steering_oscillation is high, raise kd. If line_loss_events
      cluster on the slalom, adjust sensor coverage or the line_loss setting.


      ### Requested changes


      - If the next race shows completion = 0 or completion_time near 3.0 s with progress
      below 1, raise controller.base_speed (for example to 1.8) and keep kp and kd
      unchanged, so the speed change is isolated.

      - If steering_oscillation or max_error is high on the s-bend or slalom, raise
      controller.kd (for example from 0.05 to 0.2 to 0.3) before changing kp, since
      kp 2.0 is close to the oscillation limit.

      - If line_loss_events is above zero on the slalom, widen the sensor coverage
      by moving the outermost sensor_positions x values toward plus or minus 0.06,
      or change controller.line_loss to search_left or search_right depending on which
      side the robot drifts off.


      - [Open this output](iteration-0/entityR1/versions/3afd7b2117a54e5e84021fb0d52be8d3/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/4baca33ea2f04654ab9bb41e8623df8d/payload.json)'
