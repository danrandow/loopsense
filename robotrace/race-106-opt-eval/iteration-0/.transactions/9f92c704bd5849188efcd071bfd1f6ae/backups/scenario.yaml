map:
  id: race-106-opt-eval
  schema: v0.2
  scenario: Iteration 0
  inherits: base.yaml
  notes: Initial prepared state before either AI role or the simulator has acted.
dimensions:
  time_horizon: prepared
  iteration: '0'
overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'A conservative first candidate: five 12 mm sensors at 2 cm spacing, antisymmetric
      weights, kp 2.0, kd 0.05, base speed 1.6, last-direction line recovery. No race
      data exists yet, so the values are mid-range and chosen to finish the course
      and expose oscillation and speed limits.


      ### Rationale


      Iteration 0 has no race data or evaluator feedback, so this is a conservative
      baseline meant to finish the course and produce telemetry. Geometry: five sensors
      spaced 2 cm apart across the line (x = -0.04 to +0.04 m) and 5 cm ahead of the
      axle, so the robot sees the line early enough to steer. Sensor size 12 mm is
      about half the 25 mm tape width, giving a clear, graded response. The 120 mm
      wheel track, 30 mm wheel radius, 120 mm body width and 0.8 kg mass are mid-range
      values that keep the off-track limit at 0.06 m and the yaw inertia moderate.
      Controller: weights are antisymmetric (-1.5 to +1.5), so the signal is signed
      and centred on zero. kp = 2.0 gives a turn of up to about 3 units (about 1000
      PWM difference at full signal), which is firm enough to follow bends without
      a large integral term. ki = 0 avoids windup on the bends. kd = 0.05 adds mild
      damping against overshoot. base_speed = 1.6 (PWM fraction 0.8) is chosen to
      target roughly 1.5 m/s average while leaving room for steering. line_loss =
      last_direction, so the robot turns back toward the side it last saw the line.
      Expected result: the robot completes the oval and s-bend with few line-loss
      events. I expect the slalom to be the hardest, with the most oscillation and
      the most risk of line loss. Hypotheses to test: (1) kp = 2 is near the oscillation
      limit, so steering_oscillation will rise if kd is too low; (2) base_speed 1.6
      can reach the 3 s time limit; (3) the sensor spacing is adequate for the tightest
      bend. Next measurements: completion_time and progress to check speed; rms_error
      and max_error to check tracking; steering_oscillation to check damping; line_loss_events
      to check sensor coverage on the slalom.


      - [Open this output](iteration-0/entity0/versions/4baca33ea2f04654ab9bb41e8623df8d/payload.json)'
  - id: entityR1
    label: Approve baseline for race
    notes: 'Iteration 0 has no race data, so the candidate is judged valid and not
      obviously broken, with all values inside contract limits. Approved to race to
      produce telemetry; the main open question is whether base_speed 1.6 reaches
      the 3 s finish.


      ### Feedback


      Iteration 0 has no earlier race data, so this review rests only on the candidate''s
      contents and the contract. The geometry and controller values are all inside
      their allowed ranges, and the turn authority (kp 2.0 times a maximum signal
      of 1.5, about 3 units or roughly 1050 PWM) is not extreme. The main unknown
      is speed: base_speed 1.6 (PWM fraction 0.8) must average about 1.5 m/s to finish
      in 3.0 s, and nothing shows yet whether the drivetrain delivers that. This is
      the first race, so approve it to get telemetry. Once the race reports back,
      check completion_time and progress first. If the robot is not finishing within
      3.0 s, raise base_speed. If steering_oscillation is high, raise kd. If line_loss_events
      cluster on the slalom, adjust sensor coverage or the line_loss setting.


      ### Requested changes


      - If the next race shows completion = 0 or completion_time near 3.0 s with progress
      below 1, raise controller.base_speed (for example to 1.8) and keep kp and kd
      unchanged, so the speed change is isolated.

      - If steering_oscillation or max_error is high on the s-bend or slalom, raise
      controller.kd (for example from 0.05 to 0.2 to 0.3) before changing kp, since
      kp 2.0 is close to the oscillation limit.

      - If line_loss_events is above zero on the slalom, widen the sensor coverage
      by moving the outermost sensor_positions x values toward plus or minus 0.06,
      or change controller.line_loss to search_left or search_right depending on which
      side the robot drifts off.


      - [Open this output](iteration-0/entityR1/versions/3afd7b2117a54e5e84021fb0d52be8d3/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/4baca33ea2f04654ab9bb41e8623df8d/payload.json)'
  - id: entity1
    label: Approved Robot Build
    notes: 'Approved Robot Build. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-0/entity1/versions/3afd7b2117a54e5e84021fb0d52be8d3/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/4baca33ea2f04654ab9bb41e8623df8d/payload.json)'
  actions:
  - id: action0
  - id: action1
