map:
  id: race-106-opt-eval
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: kp 1.8 at speed 1.2
    notes: 'Returns base_speed to 1.2 (iteration 8 cut s-bend progress from 0.56 to
      0.35 and left slalom unchanged) and tests kp 1.8 alone on the iteration 5 baseline.
      The approved fallback was to test kp if slalom speed did not help.


      ### Rationale


      Evidence: iteration 8 (base_speed 1.0) scored 388.85, below the iteration 5
      best of 417.25. The oval still finished 20 of 20 (completion time about 1.86
      s), but s-bend progress fell from 0.56 to 0.35, and slalom progress stayed at
      0.187 with exactly 1 line-loss event. Lowering speed therefore did not fix the
      slalom and cost s-bend progress. Iteration 7 showed the line-loss recovery mode
      (search_right) changes nothing. Speed is not the slalom limit, so the approved
      fallback applies: return base_speed to 1.2 and test kp alone. Change: controller.kp
      from 1.5 to 1.8, with all other fields at the iteration 5 baseline (base_speed
      1.2, ki 0.5, kd 0.4, sensors at x = -0.05 to 0.05 and y = 0.07, sensor_size
      0.012, line_loss last_direction). Expected result: more turn authority on the
      bend entry, so the slalom line loss may ease and slalom progress may rise above
      0.2. The oval should still finish, since kd 0.4 provides damping. Risk: kp 1.8
      with kd 0.4 may raise steering_oscillation above the current 0.21 to 0.30 range.
      Hypotheses: (a) turn authority, not speed, limits the slalom bend; (b) if slalom
      progress is unchanged, the slalom loss is set by sensor geometry at the sharpest
      entry, and the next test should be a sensor y or x change in a single step.
      Measurements wanted: per-track progress, finish rate, completion_time, line_loss_events,
      max_error and steering_oscillation, to see whether kp moves the slalom and whether
      the oval margin holds.


      - [Open this output](iteration-9/entity0/versions/3c2a1f6e222b4442bd39606a4a8afe0b/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-7b52f6528248b8a5/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-02e0836c2f552b12/payload.json)'
  - id: entityR1
    label: Kp 1.8 test on baseline
    notes: 'Approved a single-field test: kp 1.5 to 1.8 on the iteration 5 best design
      (417.25), with all other fields unchanged. It tests whether turn authority limits
      the slalom and s-bend, since kp was never tested alongside kd 0.4.


      ### Feedback


      Approved to race as a single-variable test. The candidate is the iteration 5
      baseline (best raced at 417.25: sensors at x = -0.05, -0.025, 0, 0.025, 0.05
      and y = 0.07, sensor_size 0.012, kd 0.4, ki 0.5, base_speed 1.2, last_direction)
      with only controller.kp changed from 1.5 to 1.8. I checked the input against
      iteration 5 and the other fields match.


      Why this is worth racing: iteration 5 is the only design that finishes the oval
      reliably (20 of 20). Its s-bend and slalom still leave the line. Iteration 7
      (search_right) returned identical numbers, so recovery direction is not the
      lever. Iteration 8 (base_speed 1.0) is still unraced, so speed is not yet settled.
      Iterations 0 to 2 showed max_error near 0.061 whatever kp, ki or speed were
      set, but those runs had no derivative damping, so kp was never tested alongside
      the kd 0.4 that finished the oval (iteration 3). Iteration 4 (wider x spread)
      and iteration 6 (sensor_size 0.016) both hurt, so the geometry stays put.


      Risk: at kp 1.8 the turn gain rises by 20 percent. The oval steering_oscillation
      is already about 0.21 (iteration 5), and the s-bend reached 0.30 there, so jitter
      could rise. Read the race in this order. (1) If slalom or s-bend progress rises
      above the iteration 5 values (0.19 and 0.56) and the oval still finishes at
      1.0, keep kp 1.8 and consider a further step. (2) If the oval finish drops below
      0.8, or oval steering_oscillation rises above about 0.3, return kp to 1.5. (3)
      If the tight tracks are unchanged, turn authority is not the limit. Then the
      next test should be base_speed 1.0 at kp 1.5 (iteration 8), or a single sensor
      y change, rather than more gain.


      ### Requested changes


      - If slalom and s-bend progress rise above their iteration 5 values (0.19 and
      0.56) with the oval finish at 1.0, keep controller.kp at 1.8 and try kp 2.0
      with all other fields unchanged, since iteration 0 showed kp 2.0 was not unstable
      on its own.

      - If the oval finish falls below 0.8 or oval steering_oscillation rises above
      about 0.3 at kp 1.8, return controller.kp to 1.5 and keep the iteration 5 design
      as the baseline, since iteration 5 is the only design that finishes the oval
      reliably.

      - If the tight tracks are unchanged at kp 1.8, turn authority is not the limit.
      Keep kp 1.5 and test controller.base_speed 1.0 (iteration 8) on the iteration
      5 geometry, rather than adding more gain.


      - [Open this output](iteration-9/entityR1/versions/3543a13edc044906af7b4bbd4a0675d6/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/3c2a1f6e222b4442bd39606a4a8afe0b/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-02e0836c2f552b12/payload.json)'
