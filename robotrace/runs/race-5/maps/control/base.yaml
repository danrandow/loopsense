map:
  schema: "v0.2"
  id: "control-robotrace"
  title: "Control Robot Race agent team – Evaluator-optimizer learning loop"
  scenario: "Moving parts"
  is_moo: true
  notes: |
    The conventional comparison condition for the LoopSense Robot Race. The Robot
    Optimizer produces a complete candidate. The Evaluator inspects the actual
    candidate and either returns feedback for another optimization cycle or ships
    the candidate unchanged to the track. They may loop as often as they choose
    within the same total budget available to the LoopSense condition.

    Both AI agents work through one shared, unstructured blackboard. Candidate
    versions, evaluations, reasoning, coordination notes, and the visible budget
    ledger may all be kept there. The named map entities identify
    meaningful products and uses; they do not impose filesystem access boundaries.
    Actor 2 is deterministic software, not an AI agent.
  iteration_definition: |
    An iteration begins as a scenario cloned from the preceding iteration in its
    completed state. Actor0 and actor1 may alternate through entity0 and entityR1 as
    many times as they choose while budget remains. When actor1 decides to ship, it
    generates entity1 by passing the selected entity0 build through unchanged.
    Actor2 consumes entity1, races once, generates entity2, and mechanically writes
    the same canonical measurements into entityR2A and entityR2B. The populated
    return entities end the iteration and are present in the next cloned scenario.
  dimension_axes: [condition, iteration]

actors:
  - id: actor0
    label: Robot Optimizer
    notes: |
      AI agent. Owns the complete robot design and may revise its geometry and
      controller in response to entityR1. It shares its candidate, rationale, and
      other chosen work through the common blackboard.

  - id: actor1
    label: Evaluator
    notes: |
      AI agent. Inspects the Optimizer's actual candidate, rationale, shared history,
      race evidence, constraints, and remaining budget. It either generates feedback
      for another cycle or gates the unchanged candidate through to the race.

  - id: actor2
    label: RobotraceSim Robot
    notes: |
      Deterministic software actor instantiated from entity1. It cannot interpret
      results. It races the selected build and records measurements in two addressed
      return-flow entities, matching the LoopSense condition.

actions:
  - id: action0
    actor: actor0
    label: Optimize robot
    notes: |
      Produces or revises one complete geometry-controller candidate. The action may
      recur after Evaluator Feedback while team budget remains.

  - id: action1
    actor: actor1
    label: Evaluate and gate
    notes: |
      Evaluates the current candidate. It either returns entityR1 to request another
      optimization cycle or generates entity1 to ship the candidate unchanged.

  - id: action2
    actor: actor2
    label: Race on track
    notes: |
      Executes the approved build on the configured track and seed batch. Generates
      the race outcome, telemetry, scores, trajectory images, and addressed race
      returns.

entities:
  - id: entity0
    label: Complete Robot Candidate
    system_boundary: internal
    notes: |
      Actor0's current geometry, controller, rationale, hypotheses, and measurement
      requests. Versions may be files or records within the shared blackboard.

  - id: entity1
    label: Approved Robot Build
    system_boundary: internal
    notes: |
      The candidate actor1 chooses to ship, passed through unchanged with its exact
      candidate identifier and approval decision. Actor2 consumes this build.

  - id: entity2
    label: Race Outcome
    system_boundary: internal
    notes: |
      The outcome actor2 pursues by racing. It is retained for audit and human
      inspection; operational measurements travel through the addressed returns.

  - id: entityR1
    label: Evaluator Feedback
    direction: return
    notes: |
      Actor1's critique of the current candidate, including requested changes,
      uncertainties, and reasons not to ship yet. Actor0 may use it to produce the
      next candidate version. Repeated versions remain visible on the blackboard.

  - id: entityR2A
    label: Race Data for Optimizer
    direction: return
    notes: |
      Measurement-only evidence generated by actor2 and addressed to actor0. It is
      produced from the same canonical measurement capture as entityR2B.

  - id: entityR2B
    label: Race Data for Evaluator
    direction: return
    notes: |
      Measurement-only evidence generated by actor2 and addressed to actor1. It is
      produced from the same canonical measurement capture as entityR2A.

  - id: entityTeam0
    label: Shared Blackboard
    system_boundary: private
    notes: |
      A common, unstructured file or set of files readable and writable by both AI
      agents. It may contain any shared artifacts, history, and coordination notes.
      The deterministic orchestrator updates the visible shared budget ledger after
      every model call. The initial guide supplies only minimal
      goals: build a valid constrained robot, seek better expected race performance,
      decide whether another revision is worth the remaining budget, and eventually
      select one build to race.

  - id: entityPub0
    label: Track Conditions
    system_boundary: public
    notes: |
      The same versioned tracks, seeds, noise, design constraints, scoring rules,
      model configuration, and total budget used by the LoopSense condition.

  - id: entityPrv0
    label: Optimizer Expertise
    system_boundary: private
    notes: Actor0's evolving robot-design knowledge and judgement.

  - id: entityPrv1
    label: Evaluator Expertise
    system_boundary: private
    notes: Actor1's evolving evaluation knowledge and judgement.

edges:
  - id: edge0G
    type: generates
    from: action0
    to: entity0
  - id: edge0U
    type: used by
    from: entity0
    to: action1
  - id: edge1G
