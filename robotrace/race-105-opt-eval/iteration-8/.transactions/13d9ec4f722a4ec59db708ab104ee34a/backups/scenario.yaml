map:
  id: race-105-opt-eval
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Sensors y 0.075 at 0.9
    notes: 'Returns base_speed to the best measured 0.9 and moves the sensors from
      y 0.07 to 0.075 to test whether more lead lifts slalom progress. Iteration 7
      showed 0.85 is worse (slalom 0.364 vs 0.392), so speed is not the limit. Rests
      on the iteration 5 to 7 race data.


      ### Rationale


      Evidence: iteration 7 (base_speed 0.85, sensors y 0.07, kp 1.4, kd 0.5) scored
      679.8, just below the iteration 6 best (base_speed 0.9, 683.7). Its oval and
      s-bend both finished 20/20 (oval 1.96 s, s-bend 2.26 s), but slalom progress
      fell from 0.392 to 0.364 and it still went off_track in all 20 runs. The slalom
      progress peak therefore sits near base_speed 0.9, and going slower does not
      help. The entityR1 feedback that asks for base_speed 0.85 was written before
      this race and is stale. The off-track limit is max(0.06, 0.0125 + 0.12/4) =
      0.06 m, and slalom max_error (about 0.064) still sits at that limit. Widening
      the body cannot help, since the limit stays below 0.0575 m at any body width.


      Change: return base_speed to 0.9, the best measured speed, and move all five
      sensors from y 0.07 to y 0.075. The 0.05 to 0.07 lead step improved the s-bend
      (finishes 15 to 19 of 20, oscillation 0.38 to 0.32) and left the slalom unchanged
      at base_speed 1.0. The untested question is whether lead helps at the speed
      where the slalom responds. y 0.075 is a small step that stays inside the range
      the s-bend tolerated. Sensor x positions, 16 mm footprints, weights [-2,-1,0,1,2],
      kp 1.4, kd 0.5, ki 0 and line_loss last_direction are unchanged, so any result
      change comes from the sensor forward position.


      Expected result: oval 20/20 near 2.0 s, s-bend 19 to 20 of 20 near 2.25 s, and
      slalom progress at or above 0.39, with a chance of some finishes if max_error
      stays under 0.06 at the sharpest bend.


      Risks and next reads: if s-bend finishes fall below 18 of 20, or s-bend steering_oscillation
      exceeds about 0.5, return the sensors to y 0.07. If slalom progress stays near
      0.39 with low oscillation, the next lever is a modest kd change to 0.6 at base_speed
      0.9, not further speed reduction, which the 0.85 result shows is not the limit.
      Measurements requested: per-track completion, progress, completion_time, rms_error,
      max_error, line_loss_events, steering_oscillation, control_effort, controller_errors
      and noise_robustness.


      - [Open this output](iteration-8/entity0/versions/b87aca5ba6824dbe815bf6961cde0d80/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-bbc19a4a051ebff0/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-4436bc0f835fd35c/payload.json)'
  - id: entityR1
    label: Approve base_speed 0.85
    notes: 'Approves a single-variable step (base_speed 0.9 to 0.85) from the best
      raced design, iteration 6 (683.7). Slalom progress rose from 0.311 to 0.392
      when speed dropped from 1.0 to 0.9, while the oval stayed 20/20 and the s-bend
      finished 20/20 at 2.25 s, so there is time margin to test a lower speed.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      best raced design is iteration 6 (score 683.7): base_speed 0.9, kp 1.4, kd 0.5,
      sensors at y 0.07, weights [-2,-1,0,1,2], line_loss last_direction. It finished
      20/20 on the oval at 1.99 s and 20/20 on the s-bend at 2.25 s, with s-bend max_error
      0.028 and oscillation 0.29. The slalom still went off_track in all 20 runs,
      but progress rose from 0.311 (iteration 5, base_speed 1.0) to 0.392, and max_error
      stayed near the 0.064 mean. That is the first clear movement on the slalom,
      and it came from speed alone, since iteration 5 had already ruled out sensor
      lead. This candidate changes only base_speed, from 0.9 to 0.85, so any change
      in result is attributable to speed. The s-bend completion_time has about 0.6
      s of margin under the 2.9 s guard, and the oval has ample margin. Approve: it
      is a clean single-variable step from the best design, the trend is consistent
      across two steps, and racing gives the telemetry needed for the next decision.
      Read the race as follows. If slalom progress rises above about 0.45 with the
      oval still 20/20 and s-bend finishes at 17/20 or better, keep moving speed (base_speed
      0.8 is the next probe, provided s-bend completion_time stays under 2.9 s). If
      the s-bend completion_time exceeds 2.9 s or s-bend finishes fall below 17/20,
      return base_speed to 0.9. If slalom progress stalls near 0.39 at 0.85, the limit
      is sensor reach at the sharpest bend: keep base_speed 0.85 and move the sensors
      to y 0.075. If s-bend oscillation rises above about 0.5 while the robot stays
      on the line, raise kd to 0.6 with base_speed unchanged.


      ### Requested changes


      - Keep base_speed at 0.85 and everything else as in iteration 6. The slalom
      progress rose 0.311 to 0.392 when base_speed went from 1.0 to 0.9, so speed
      through the sharp turns is the lever being tested.

      - If slalom progress rises above about 0.45 with the oval still 20/20 and the
      s-bend completion_time under 2.9 s, try base_speed 0.8 next. If the s-bend completion_time
      exceeds 2.9 s or s-bend finishes fall below 17/20, return base_speed to 0.9.

      - If slalom progress stalls near 0.39 at base_speed 0.85, keep base_speed 0.85
      and move the sensors to y 0.075 for more lead at the sharpest bend. If s-bend
      steering_oscillation rises above about 0.5, raise kd to 0.6 instead, keeping
      base_speed fixed.


      - [Open this output](iteration-7/entityR1/versions/06f07c4b26ae488aa07a5ec600a42391/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/97b6d9b08d1a49ab8582624272c05aa2/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-b2c2d5a02de9624e/payload.json)'
