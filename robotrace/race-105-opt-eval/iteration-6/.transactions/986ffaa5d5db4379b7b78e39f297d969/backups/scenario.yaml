overrides:
  entities:
  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence from iteration 5 (sensors at y 0.07, kp 1.4, kd 0.5, base_speed 1.0;
      score 661.4, the best so far). The oval finished 20/20 at 1.98 s with oscillation
      0.18. The s-bend finished 19/20 (up from 15/20) and its oscillation fell from
      0.38 to 0.32, so the extra sensor lead helped the s-bend. The slalom did not
      move: progress 0.311 against 0.306 at y 0.05, still off_track in all 20 runs,
      max_error at the 0.064 mean, and oscillation low at 0.21. Lead is therefore
      not the slalom''s limit. The Evaluator''s rule for this pattern (slalom progress
      near 0.3 with low oscillation) points to speed through the slalom''s sharp turns.
      Off-track is unavoidable at the current speed, and widening the body cannot
      raise the limit above 0.0575 m. Change: base_speed 1.0 to 0.9, with everything
      else unchanged (kp 1.4, kd 0.5, y 0.07, x positions, 16 mm footprints, sensor
      weights, line_loss last_direction). This is a single-variable step. Expected
      result: slalom progress above 0.31 and max_error below 0.06 on some runs, with
      the oval still finishing 20/20 (it has time margin at about 2 s). The s-bend
      completion time should rise from about 2.3 s to about 2.5 to 2.7 s, which is
      still under 3 s. Risk: if the s-bend completion time exceeds 2.9 s or finishes
      fall below 17/20, return base_speed to 1.0. Hypotheses to check next: (1) if
      slalom progress rises with max_error still at 0.06, the sharp turns need more
      speed reduction or a higher kd; (2) if slalom progress stays at 0.31 despite
      the lower speed, the limit is sensor reach at the sharpest bend, so the next
      step is y 0.075 or wider outer sensors. Measurements requested: per track completion,
      progress, completion_time, rms_error, max_error, line_loss_events, steering_oscillation,
      control_effort, controller_errors and noise_robustness.


      - [Open this output](iteration-6/entity0/versions/fe04587fbca046ee93eb0f19fee2406e/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-2c2bf67022b87fb5/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-15aa464b2221fa59/payload.json)'
  - id: entityR1
    label: 'Approve: sensors to y'
    notes: 'Approved the iteration 4 controller (kp 1.4, kd 0.5, base 1.0) with the
      sensors moved forward from y 0.05 to 0.07, a geometry-only test of the slalom
      lead limit. Evidence: iteration 4 tied the best score (624.6 vs 625.2), and
      its slalom still went off_track in all 20 runs at progress 0.31 with max_error
      at the limit. Feedback gives the next steps for each race outcome.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      candidate is iteration 4''s controller (kp 1.4, kd 0.5, base_speed 1.0, line_loss
      ''last_direction'', weights [-2,-1,0,1,2]) with all five sensors moved from
      y 0.05 to y 0.07. The x positions and 16 mm footprints are unchanged. Iteration
      4 (kd 0.5) scored 624.6, essentially tied with the iteration 2 best of 625.2.
      Its oval finished 20/20 at 1.96 s, and it lowered s-bend steering_oscillation
      slightly (0.42 to 0.38) but dropped s-bend finishes from 17 to 15 of 20. The
      slalom was still off_track in all 20 runs at progress 0.31 and max_error at
      the 0.0666 m mean. The off-track limit is max(0.06, 0.0125 + body_width/4),
      so widening the body cannot help, which leaves sensor lead as the untested lever.
      The change is geometry only, so any shift in results can be attributed to the
      sensors. The main risk is that more forward lead adds turn gain, which could
      raise s-bend and oval oscillation (iteration 4 measured 0.38 on the s-bend and
      0.21 on the oval). Approve: the candidate is valid, it is a single-variable
      step from the tied best design, and a race is the fastest way to test whether
      lead is the limit on the slalom. Read the race as follows. If slalom progress
      rises above 0.31, max_error falls below 0.06 and the oval still finishes 20/20,
      lead was the limit; the next step is y 0.075. If slalom progress stays near
      0.3 with low oscillation, the limit is speed through the sharp slalom turns;
      the next step is base_speed 0.9, provided the s-bend completion time stays under
      3 s (it was about 2.3 to 2.6 s). If s-bend finishes fall below 15 of 20 or oscillation
      exceeds about 0.5, return the sensors to y 0.05 and keep kd 0.5.


      ### Requested changes


      - Keep kp 1.4, kd 0.5, base_speed 1.0 and the x positions unchanged, and test
      the sensors at y 0.07. Iteration 4 showed slalom progress of 0.31 with max_error
      at the 0.0666 m limit, so more lead is the next untested lever.

      - If slalom progress rises and max_error falls below 0.06 with the oval still
      finishing 20/20, try y 0.075 next. If slalom progress stays near 0.3 with low
      oscillation, lower base_speed to about 0.9, but only if the s-bend completion_time
      stays under 3 s.

      - If s-bend finishes fall below 15 of 20 or steering_oscillation exceeds about
      0.5, return the sensors to y 0.05 and keep kd 0.5, because the extra lead has
      added too much turn gain.


      - [Open this output](iteration-5/entityR1/versions/238eb24d345140b4810b197b693ce6e6/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/40e0328ff2e846a8b292718090c3924e/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-9879b073514449ca/payload.json)'
