map:
  id: race-105-opt-eval
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Lower speed, more damping
    notes: 'Keeps the widened sensors and raises kd 0.3 to 0.4 and kp 1.2 to 1.4 to
      cut the steering jitter (about 0.21) that persisted in the s-bend and slalom
      off-track runs. Base speed drops to 1.0 so the robot can hold the line on the
      tight bends, with the oval''s 1.88 s finish leaving room.


      ### Rationale


      Evidence from iteration 1 (entityR2A, 60 trials): the oval finished 19 of 20
      trials at mean time 1.88 s, but the s-bend and slalom still ended off_track
      with progress 0.39 and 0.17. Max error sat at about 0.062 to 0.064 m, at the
      0.06 m limit, with about one line-loss event per run. steering_oscillation was
      about 0.21 on every track, above the 0.15 threshold the Evaluator gave. Widening
      the sensors and lowering kp fixed the straight-line finishing but not the tight
      bends. The high jitter points to a turn command that is still too aggressive
      or underdamped, while the line loss on the sharper bends points to the robot
      carrying too much speed into them. This candidate makes three controller changes
      and keeps the geometry fixed, so the race can attribute the outcome to the controller.
      (1) kd rises from 0.3 to 0.4, following the Evaluator''s guidance to damp jitter
      above 0.15. (2) kp rises from 1.2 to 1.4, a small step back toward the level
      where iteration 0 lost the line less often on the bends, since the Evaluator''s
      rule for line loss near 0.06 m is to raise kp. The kd increase offsets the extra
      gain. (3) base_speed drops from 1.2 to 1.0, which gives the robot more time
      to correct on the s-bend and slalom. The oval has margin: at 1.88 s with base
      1.2, a lower speed should still finish under 3 s, though completion time will
      rise. Expected result: lower steering_oscillation (below about 0.15), no off_track
      ends on the s-bend and slalom, and line_loss_events near zero. If the robot
      still loses the line with low oscillation, the next step is kp toward 1.6. If
      it finishes with completion_time above 3 s, raise base_speed toward 1.3. Geometry
      stays unchanged until the controller is tuned on the widened sensor spread.


      - [Open this output](iteration-2/entity0/versions/1fd6cde2bcfe4766b2f7d97d341d7a8a/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-232a9646a7e20555/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-564a7071d6ef1c8c/payload.json)'
  - id: entityR1
    label: 'Approve: kp 1.4, kd 0.4'
    notes: 'Approves the iteration 2 controller (kp 1.2 to 1.4, kd 0.3 to 0.4, base_speed
      1.2 to 1.0) as a single-step change from the best raced design (383.755). It
      rests on iteration 1 telemetry: s-bend and slalom went off_track with about
      0.21 oscillation and about one line loss per run.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated. The best raced
      design so far is iteration 1 (score 383.755). It finished 19 of 20 oval trials
      at a mean of 1.88 s. It went off_track on the s-bend (progress 0.39) and slalom
      (progress 0.17), with max_error about 0.062 to 0.064 m, about one line-loss
      event per run, and steering_oscillation about 0.21 on every track. This candidate
      changes three controller fields and leaves geometry fixed, so any change in
      result can be attributed to the controller. kp rises from 1.2 to 1.4 to address
      the line loss near the 0.06 m limit. kd rises from 0.3 to 0.4 to damp the jitter,
      which is above the 0.15 level. base_speed drops from 1.2 to 1.0 to give the
      robot more time to correct on the tight bends. The main risk is that the wider
      sensor spread (set in iteration 1) may be what raised oscillation from about
      0.11 in iteration 0 to about 0.21, so kp and kd changes alone may not bring
      oscillation down. The lower base_speed also costs completion time on the oval.
      Approve it: it is a targeted, single-step change from the best design, there
      are enough runs left for a race, and the telemetry will sharpen the next critique.
      After the race, read the result as follows. If the s-bend and slalom still end
      off_track with low steering_oscillation (below about 0.15), raise kp toward
      1.6. If oscillation stays above 0.15 while the robot stays on the line, lower
      kp or raise kd toward 0.5. If the oval finishes but completion_time is above
      3 s, raise base_speed toward 1.3. Do not change geometry until the controller
      is tuned on the widened sensor spread.


      ### Requested changes


      - If the s-bend and slalom still end off_track with steering_oscillation below
      about 0.15 (the iteration 1 failure pattern with low jitter), raise kp from
      1.4 to about 1.6 and keep kd at 0.4, since kp 1.2 gave max_error of about 0.064
      m with about one line-loss event per run.

      - If steering_oscillation stays above 0.15 (iteration 1 measured about 0.21)
      while the robot remains on the line, raise kd from 0.4 to about 0.5 or lower
      kp toward 1.2, to damp the turn command without giving up the steering gain.

      - If the oval finishes but completion_time rises above 3 s, raise base_speed
      from 1.0 toward 1.3, keeping kp and kd fixed, since base_speed 1.2 gave a mean
      oval time of 1.88 s.


