map:
  id: race-105-opt-eval
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Wider outer sensors ±0.04
    notes: 'Geometry now matches the stated intent: outer sensors at x ±0.040 m, with
      the rest of iteration 6 held fixed (base 0.9, kp 1.4, kd 0.5, y 0.07). The change
      tests whether lateral reach lifts slalom progress above 0.39, the one lever
      not yet tested. Iteration 6 (683.7) is the evidence base.


      ### Rationale


      Revision of the candidate the Evaluator reviewed. The Evaluator found that the
      rationale describes outer sensors at x = ±0.040 m, but the geometry block still
      had ±0.032 m. I have set the geometry to match the stated intent: five sensors
      at x = -0.040, -0.020, 0.000, +0.020, +0.040 m, all at y = 0.07 m, with 16 mm
      footprints and weights [-2, -1, 0, 1, 2].


      Evidence. Iteration 6 (base 0.9, kp 1.4, ki 0, kd 0.5, y 0.07, x ±0.032, last_direction)
      is the best raced design at 683.7. Its oval and s-bend both finished 20/20,
      and its slalom went off_track in all 20 runs at progress 0.392. Lead (y 0.075,
      iteration 8) and speed (base 0.85, iteration 7) both reduced slalom progress.
      Damping (kd 0.6, iteration 9) also reduced it, to 0.351. Lateral reach is the
      only lever not yet tested, so this revision changes only the outer span.


      Change. Outer sensors widen from ±0.032 m to ±0.040 m. Everything else is held
      at the iteration 6 values (base_speed 0.9, kp 1.4, ki 0, kd 0.5, y 0.07, line_loss
      last_direction, body and wheel geometry unchanged). The off-track limit is max(0.06,
      0.0125 + 0.12/4) = 0.06 m, so body width cannot help.


      Expected result. Slalom progress rises above 0.40 because the outer sensors
      see the tape earlier on the sharp direction changes. The oval and s-bend stay
      at 20/20.


      Decision rules for the next race. If s-bend finishes fall below 18 of 20, or
      s-bend steering_oscillation exceeds about 0.35, the outer sensors are seeing
      the tape on curves too early, so return x to ±0.032 m. If slalom progress stays
      near 0.39 with no change, the slalom geometry is the limit, and the final iteration
      should lock iteration 6 settings.


      Hypotheses. (1) Wider reach raises slalom progress above 0.40 without costing
      s-bend finishes. (2) Wider reach adds turn gain on the s-bend, which shows up
      as higher oscillation there.


      - [Open this output](iteration-10/entity0/versions/d3bc12bfd1d948649edf498ce4620df6/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/37eb7005914841b7a6c65ba9a223befd/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-19aa338416466ea7/payload.json)'
  - id: entityR1
    label: 'Revise: match outer'
    notes: 'The candidate''s geometry still shows x ±0.032 m although its rationale
      proposes ±0.040 m, so I asked for the geometry to match the intended test. The
      evidence is iteration 6 (683.7, slalom 0.392 at the max_error limit), with kd
      0.6 (iteration 9, 676.8) and forward lead (iteration 8, 671.4) both ruled out
      as the slalom lever.


      ### Feedback


      Decision: revise. The candidate is the iteration 6 controller (base_speed 0.9,
      kp 1.4, ki 0, kd 0.5, line_loss last_direction, y 0.07) with a proposed widening
      of the outer sensors. The rationale describes outer sensors at x = ±0.040 m
      with middle sensors at -0.02, 0, +0.02, but the geometry block still lists x
      = ±0.032 m at 0.016 m spacing. The submitted geometry therefore does not test
      the change the rationale describes. Revise so the sensor positions match the
      stated intent.


      Evidence for the change. Iteration 6 (base 0.9, kd 0.5, kp 1.4, y 0.07, x ±0.032)
      is the best raced design at 683.7. Its slalom ended off_track in all 20 runs
      at progress 0.392, with max_error pinned at the 0.06 m limit (mean 0.0646).
      Iteration 8 showed that moving the sensors forward to y 0.075 lowered slalom
      progress to 0.328, so forward lead is not the lever. Lateral reach is the variable
      not yet tested, which is why the outer span is worth one controlled trial. The
      off-track limit is max(0.06, 0.0125 + 0.12/4) = 0.06 m, so body width cannot
      help.


      Evidence against other moves. Iteration 9 (kd 0.6, otherwise identical to iteration
      6) scored 676.8 with slalom progress 0.351, so kd 0.6 is not the fix. Iterations
      7 and 8 (base 0.85; y 0.075) also lowered slalom progress. Keep kd 0.5, base
      0.9, kp 1.4 and y 0.07 fixed so the span is the only change.


      What to do with the next race. If the oval and s-bend stay at 20/20 and slalom
      progress rises above 0.40, keep the wider span. If s-bend finishes fall below
      18 of 20 or s-bend steering_oscillation exceeds about 0.35, return x to ±0.032
      m, since the outer sensors are then seeing the tape on curves too early. If
      slalom progress stays near 0.39 with no change, the slalom''s sharpest turn
      geometry is the limit, and the final iteration should lock the best measured
      design (iteration 6 settings).


      ### Requested changes


      - Make the geometry match the rationale: set sensor_positions x to -0.040, -0.020,
      0.000, 0.020, 0.040, all at y 0.07, with sensor_size 0.016 and sensor_weights
      [-2,-1,0,1,2]. Keep base_speed 0.9, kp 1.4, ki 0.0, kd 0.5 and line_loss last_direction,
      as in iteration 6 (683.7), so the outer span is the only change.

      - If s-bend finishes fall below 18 of 20 or s-bend steering_oscillation exceeds
      about 0.35 in the next race, revert the outer sensors to x ±0.032 m. Iteration
      6 showed the s-bend at 20/20 with oscillation 0.29 at that span.

      - Do not change kd or base_speed in this revision. Iteration 9 showed kd 0.6
      lowered slalom progress to 0.351, and iterations 7 and 8 showed that base_speed
      0.85 and y 0.075 also lowered it, so these gains and speeds are not the open
      lever.


      - [Open this output](iteration-10/entityR1/versions/37eb7005914841b7a6c65ba9a223befd/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/5903aadc78894687afef9b5bd5c49757/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-19aa338416466ea7/payload.json)'
