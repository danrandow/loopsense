overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'Baseline candidate built from the contract alone, since no race data exists
      yet: five 12 mm sensors at 0.05 m ahead, kp 2.0, kd 0.1, base_speed 1.4, last_direction
      line-loss recovery. Expected to complete the oval and s-bend; oscillation and
      speed on the slalom are the open questions.


      ### Rationale


      Iteration 0 has no race telemetry or Evaluator feedback yet, so this is a conservative
      baseline built from the contract. Geometry: five sensors spaced 12 mm apart
      across x = -0.024 to +0.024 m, with 12 mm footprints, so the tape (25 mm) always
      covers at least one or two sensors. They sit 0.05 m ahead of the axle so steering
      reacts before the wheels reach the line. A 0.12 m wheel track, 0.03 m wheel
      radius, 0.12 m body width and 0.8 kg mass give moderate yaw inertia and a body
      width that keeps the off-track limit at max(0.06, 0.0125 + 0.03) = 0.06 m. Controller:
      sensor weights [-2, -1, 0, 1, 2] match sensor x order, so a line on the left
      (positive signal) steers left. base_speed 1.4 (about 70% PWM) should give the
      roughly 1.5 m/s average needed, while leaving room to slow down on tight bends.
      kp 2.0 gives a moderate steering response (a full-scale signal of 2 gives turn
      4, about 1400 PWM difference). ki 0 avoids integral windup on curves. kd 0.1
      damps oscillation without amplifying sensor noise much. line_loss ''last_direction''
      lets the robot recover in the direction it was heading when it lost the line.
      Expected result: completion on the oval and s-bend, with some oscillation on
      the slalom. Hypotheses to test: (1) if steering_oscillation is high, reduce
      kp or raise kd; (2) if completion_time exceeds 3 s, raise base_speed toward
      1.8; (3) if the robot drifts off the line on the slalom, raise kp or add sensor
      spread. Measurements requested: completion, progress, completion_time, rms_error
      and max_error give the tracking quality; line_loss_events shows recovery frequency;
      steering_oscillation shows jitter.


      - [Open this output](iteration-0/entity0/versions/b030e9e120e24ec6af46341003bcb01a/payload.json)'
  - id: entityR1
    label: 'Baseline review: approve'
    notes: 'Approved the iteration 0 baseline because it is valid and not obviously
      broken, and no race data exists yet. Feedback names the kp/kd and base_speed
      risks from the contract''s turn and PWM scaling, and gives the next-race adjustments.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated. There are
      no earlier race results or Evaluator Race Data yet, so this review rests on
      the contract and the candidate''s own contents. The geometry and controller
      are within every public limit: five sensors at x = -0.024 to +0.024 m with 12
      mm footprints, sensor_weights [-2, -1, 0, 1, 2] matching the sensor order, kp
      2.0, ki 0, kd 0.1, base_speed 1.4, and line_loss ''last_direction''. The candidate
      is valid and not obviously broken, which is the bar for a first race. Two risks
      are worth watching. First, kp 2.0 with a full-scale signal of 2 gives turn up
      to 4, a PWM difference of about 1400, so steering may oscillate on tight bends;
      the contract''s turn scaling makes this plausible. Second, base_speed 1.4 gives
      base PWM of about 2866 (70%), and the 3 s limit needs an average of roughly
      1.5 m/s, so the robot may not finish in time. Once the race reports, apply these
      rules. If steering_oscillation is high or max_error is large on the s-bend or
      slalom, lower kp to about 1.2 to 1.5 and raise kd to about 0.3 to 0.5. If completion_time
      is above 3 s while progress is near 1 and oscillation is low, raise base_speed
      to about 1.7 to 1.8. If line_loss_events is above zero, widen the sensor spread
      (for example x of ±0.032 m) before changing gains. Do not change geometry before
      the first race shows a clear problem.


      ### Requested changes


      - After the first race, if steering_oscillation or max_error is high (no earlier
      race exists, so judge from the telemetry), reduce kp to about 1.2 to 1.5 and
      raise kd to about 0.3 to 0.5 to damp the turn command, which can reach about
      1400 PWM at kp 2.0.

      - If completion_time exceeds 3 s with low oscillation and progress near 1, raise
      base_speed to about 1.7 to 1.8, since 1.4 gives roughly 70% PWM and the race
      needs about 1.5 m/s average.

      - If line_loss_events is above zero on the slalom, widen the outer sensors (for
      example x = ±0.032 m) or try line_loss ''search_right'' or ''search_left'' only
      after checking that ''last_direction'' is the cause.


      - [Open this output](iteration-0/entityR1/versions/2c62c7d8bcef4b6497044bd816fc695d/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/b030e9e120e24ec6af46341003bcb01a/payload.json)'
