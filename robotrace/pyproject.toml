[project]
name = "loopsense-robotrace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
robotrace = "orchestrator.runner:main"
robotrace-ui = "orchestrator.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["orchestrator", "simulator", "simulator.adapter"]
