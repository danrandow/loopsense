map:
  id: randow-maps-entrant
  schema: v0.2
  title: Robot Race — Randow Maps
  scenario: Moving Parts
  is_moo: true
  notes: "The producer–integrator entrant: geometry and controller work pass through explicit handoffs, with integration feedback and separately addressed race evidence."
  dimension_axes:
  - time_horizon
  - iteration
actors:
- id: actor0
  label: Geometry Builder
  notes: "Designs geometry using integration feedback and addressed race evidence."
- id: actor1
  label: Robot Integrator
  notes: "Integrates geometry with a controller and gives the Geometry Builder specific feedback on what the geometry needs to change."
- id: actor2
  label: Race Simulator
  notes: "Deterministic software actor that races and records evidence."
actions:
- id: action0
  label: Design Geometry
  actor: actor0
  notes: |-
    Produces bounded geometry, intent, hypotheses, and measurement requests.

    ## Common to every agent
    You are competing with other teams to race a line-following robot on a held-back track. Do everything you can to maximise your team's score on that track. Learn and improve as much as you can, working with the other agent in your team, with each iteration, within your budget.

    ## This team: Geometry Builder and Robot Integrator
    You work in sequence. The Geometry Builder's proposal goes to the Robot Integrator, who adds a controller, and the resulting complete robot races every iteration. The Builder never sees the controller, so the Integrator's feedback is the Builder's only view of how its geometry works in practice.

    ## Your role: Geometry Builder
    Design the sensor and body geometry that gives your teammate, the Robot Integrator, the best possible platform to build a controller on, and that the race simulator rewards. Deliver a Geometry Proposal every iteration. Read the Integration Feedback from the Integrator (they work with your geometry directly and know what it costs them) and the Geometry Race Data (telemetry from the last race), and work out what in that evidence points at geometry. In the proposal's intent say what you changed, why, and what result you expect. Include your hypotheses and the measurements you want to see next. Do not produce a controller.
  measures:
  - id: input_tokens
    name: Model input tokens
    unit: tokens
  - id: output_tokens
    name: Model output tokens
    unit: tokens
  - id: repair_calls
    name: Format repair calls
    unit: calls
    better: lower
  - id: invalid_artifacts
    name: Invalid model artifacts
    unit: artifacts
    better: lower
- id: action1
  label: Integrate Robot
  actor: actor1
  notes: |-
    Produces a runnable package and returns integration feedback to the Geometry Builder every iteration, before and after races.

    ## Common to every agent
    You are competing with other teams to race a line-following robot on a held-back track. Do everything you can to maximise your team's score on that track. Learn and improve as much as you can, working with the other agent in your team, with each iteration, within your budget.

    ## This team: Geometry Builder and Robot Integrator
    You work in sequence. The Geometry Builder's proposal goes to the Robot Integrator, who adds a controller, and the resulting complete robot races every iteration. The Builder never sees the controller, so the Integrator's feedback is the Builder's only view of how its geometry works in practice.

    ## Your role: Robot Integrator
    Your job has two equally important parts, and you deliver both every iteration.

    1. Complete Robot Package: turn the supplied Geometry Proposal into a complete runnable robot by adding a controller for that exact geometry. Use the Integration Race Data (telemetry from the last race) to improve the controller. Preserve supported upstream measurement requests and add your own.

    2. Integration Feedback for the Geometry Builder: they cannot see your controller and rely on you to tell them how to improve. Say concretely how this geometry helped or hurt your controller (what you had to compensate for, and how), and give one to three specific requested_changes, naming the geometry fields and the values you want tried next and why. You can give this feedback as soon as you have read the geometry, before any race; add what the race data shows when you have it.
  measures:
  - id: input_tokens
    name: Model input tokens
    unit: tokens
  - id: output_tokens
    name: Model output tokens
    unit: tokens
  - id: repair_calls
    name: Format repair calls
    unit: calls
    better: lower
  - id: invalid_artifacts
    name: Invalid model artifacts
    unit: artifacts
    better: lower
- id: action2
  label: Race and Measure
  actor: actor2
  notes: "Runs development trials and produces an outcome and addressed evidence."
entities:
- id: entity0
  label: Geometry Proposal
  system_boundary: internal
  notes: "Geometry, intent, hypotheses, and measurement requests; not a runnable robot."
  measures:
  - id: requested_measurements
    name: Requested measurements
    unit: measurements
- id: entity1
  label: Complete Robot Package
  system_boundary: internal
  notes: "Supplied geometry, controller, integration notes, and observation request."
  measures:
  - id: requested_measurements
    name: Requested measurements
    unit: measurements
- id: entity2
  label: Race Outcome
  system_boundary: internal
  notes: "Human-facing result; upstream learning uses addressed returns."
  measures:
  - id: score
    name: Composite race score
    unit: points
    better: higher
  - id: completion
    name: Completed trial proportion
    unit: proportion
    better: higher
  - id: progress
    name: Normalized track progress
    unit: proportion
    better: higher
  - id: completion_time
    name: Completion time
    unit: seconds
    better: lower
  - id: rms_error
    name: RMS centre-line error
    unit: metres
    better: lower
  - id: max_error
    name: Maximum centre-line error
    unit: metres
    better: lower
  - id: line_loss_events
    name: Line-loss events
    unit: events
    better: lower
  - id: steering_oscillation
    name: Steering oscillation
    unit: index
    better: lower
  - id: control_effort
    name: Controller effort
    unit: index
    better: lower
  - id: controller_errors
    name: Controller errors
    unit: errors
    better: lower
  - id: noise_robustness
    name: Noise robustness
    unit: proportion
    better: higher
  - id: held_out_gap
    name: Development held-out gap
    unit: points
    better: lower
- id: entityR1
  label: Integration Feedback
  notes: "Direct feedback from the Robot Integrator to the Geometry Builder: how the geometry helped or hindered the controller, what the Integrator had to compensate for, and the specific geometry changes to try next. The Geometry Builder cannot see the controller, so this is their main way to learn what the Integrator needs."
- id: entityR2A
  label: Geometry Race Data
  notes: "Measurement-only evidence addressed to the Geometry Builder."
  measures:
  - id: supplied_requests
    name: Supplied requested measures
    unit: measurements
    better: higher
- id: entityR2B
  label: Integration Race Data
  notes: "Measurement-only evidence addressed to the Robot Integrator."
  measures:
  - id: supplied_requests
    name: Supplied requested measures
    unit: measurements
    better: higher
- id: entityPub0
  label: Design Constraints
  system_boundary: public
  notes: |-
    The single description of what a design is and the world it races in. Its contract is the exact shape of a design (geometry, controller, observation request) and carries the allowed range or options of every field, the units, and how the simulator uses each one (sensing, control loop, drivetrain physics, race rules). Agents receive this contract in full; the scoring rule and goal arrive separately as the objective.

    Files, for a human to follow:
    - Contract (the source of truth for limits): entities/entityPub0/contract.schema.json
    - Race settings (tracks, seeds, noise, score weights, run limits): config/race.yaml
    - Limits enforced from the contract: https://github.com/danrandow/loopsense/blob/main/robotrace/orchestrator/validators.py (design_bounds_from_contract, validate_package, validate_controller)
    - Where limits are derived at package load: https://github.com/danrandow/loopsense/blob/main/robotrace/orchestrator/map_package.py
    - What the agent is shown: https://github.com/danrandow/loopsense/blob/main/robotrace/orchestrator/executors.py
    - Simulation and scoring: https://github.com/danrandow/loopsense/blob/main/robotrace/simulator/adapter/headless.py
    - Native motor and sensor model: https://github.com/danrandow/loopsense/blob/main/robotrace/simulator/upstream/robotrace_Sim/utills_c/linesim.c
    - Tracks: https://github.com/danrandow/loopsense/blob/main/robotrace/tracks/
- id: entityPub2
  label: Track Conditions
  system_boundary: public
  notes: "Tracks, seeds, noise, trial order, and held-out configuration."
