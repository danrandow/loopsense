map:
  id: race-178-opt-eval
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Revert to best (iter 5)
    notes: 'Reverts base_speed from 1.1 to 1.0 and reproduces the iteration 5 design
      (score 75.779), because iteration 9 lost oval progress (0.29 to 0.115) and scored
      51.33. Every other field is unchanged, so the known best result is banked.


      ### Rationale


      Evidence. Iteration 9 raised base_speed from 1.0 to 1.1 on the iteration 5 design
      and scored 51.33, far below the 75.78 best. Oval progress fell from 0.29 to
      0.115, the same level as the 1.3-speed runs, while s-bend (0.153 to 0.151) and
      slalom (0.108 to 0.108) were essentially flat. The Evaluator''s feedback on
      this candidate was written before it raced, so its prediction that the bend
      tracks would rise is not supported. The race falls under the feedback''s branch
      2: oval progress fell clearly and the score dropped below 75.779. The speed-1.1
      change is rejected. Iteration 8 (kd 0.2, 69.03) also lost progress, and iterations
      6 (kp 1.6, 51.18) and 7 (sensor_size 0.016, 60.12) lost progress too. Across
      all races the best gain set and geometry are iteration 5.


      Change. I revert base_speed to 1.0 and reproduce the iteration 5 design exactly:
      kp 2.0, ki 0.3, kd 0.1, search_right, sensor weights [-2,-1,0,1,2], sensors
      at x = -0.04, -0.015, 0, 0.015, 0.04 with y = 0.05, sensor_size 0.012, 12 cm
      wheel track, 3 cm wheel radius, 16 cm body, 12 cm width, 0.8 kg. Changing nothing
      else keeps the known 75.779 result as the score to beat, and the next iteration
      can test a new variable against it. This is a deliberate choice to bank the
      best known design rather than gamble on an untested field with two iterations
      left.


      Expected result. Progress near the iteration 5 values (oval about 0.29, s-bend
      about 0.15, slalom about 0.11) and a score near 75.8. Every run still ends with
      one line-loss event and max_error of about 0.063 m, above the 0.06 m limit.


      Hypotheses. H13: the oval speed response is a sharp threshold between base_speed
      1.0 and 1.1 at this gain set, so 1.0 is near the best achievable operating point.
      H14: the remaining failure is a slow drift to one edge that none of the single-field
      changes tested has fixed, so a wider sensor span (outer sensors at about x =
      plus or minus 0.05 m) is the next untested lever if spare runs remain.


      Measurements wanted: progress, max_error, line_loss_events and steering_oscillation
      per track, and whether the line-loss point moves along the course.


      - [Open this output](iteration-10/entity0/versions/d3c3c4d3ca6f4fb29e4622309aa2f641/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-8efdd7b76e734a32/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-570e72e85af4a118/payload.json)'
  - id: entityR1
    label: 'Approve: speed 1.1 test'
    notes: 'Approved the iteration 5 best design with base_speed raised from 1.0 to
      1.1, the only change. Iterations 2 and 3 show speed moves progress between the
      oval and bend tracks, and iterations 6 to 8 show that other single-field changes
      lost score, so this is a small test near the best gain set, with a fallback
      to 1.0 if the oval drops.


      ### Feedback


      Written before this candidate has raced. The candidate is the iteration 5 design
      (score 75.779, the best raced so far: kp 2.0, ki 0.3, kd 0.1, search_right,
      sensors at x = -0.04, -0.015, 0, 0.015, 0.04 with 12 mm footprint) with one
      change: base_speed from 1.0 to 1.1. Iterations 6, 7 and 8 each moved one field
      away from that design and each lost score (kp 1.6 gave 51.18, sensor_size 0.016
      gave 60.12, kd 0.2 gave 69.03), so the iteration 5 gains and sensing stay. Iterations
      2 and 3 are the only clean speed comparison: they share sensors and gains and
      differ only in base_speed (1.3 vs 1.0). Lowering speed raised oval progress
      (0.115 to 0.209) and lowered s-bend (0.150 to 0.126) and slalom (0.105 to 0.084)
      progress. So speed trades progress between the oval and the bend tracks. The
      candidate therefore may gain on the bends and lose on the oval, and the rationale''s
      expectation that the oval holds near 0.29 is not guaranteed by that trade-off.
      Every raced run has ended with one line-loss event and max_error of about 0.061
      to 0.067 m, above the 0.06 m limit, with low oscillation, so the robot drifts
      to an edge rather than weaving. The candidate is valid and a single-variable
      step from the best design, and there are only two iterations left after this
      one, so approving it for the race is the better use of the remaining runs. Read
      the race this way. (1) If the bend tracks rise and the oval loses little, and
      the score beats 75.779, keep base_speed 1.1 and try 1.2 next. (2) If the oval
      falls clearly and the score drops below 75.779, revert base_speed to 1.0, which
      is the iteration 5 best. (3) If progress is unchanged on every track, speed
      is not the limiter at this range, and the remaining lever is base_speed only
      if a later iteration has spare runs.


      ### Requested changes


      - Race as written. If progress rises on the s-bend and slalom and the score
      exceeds 75.779, keep base_speed 1.1 and test base_speed 1.2 next, with kp 2.0,
      ki 0.3, kd 0.1 and search_right.

      - If the oval progress falls clearly below about 0.27 or the score falls below
      75.779, revert base_speed to 1.0 (iteration 5, 75.779). Do not change any other
      field in the same revision.

      - If progress is unchanged on all tracks, leave the iteration 5 design as the
      best gain set and do not spend further runs on speed alone.


      - [Open this output](iteration-9/entityR1/versions/bad128d144644793a3f356bbac155e88/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/0bf2b96185024f8e8005fb5d2c560908/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-b750615a13534293/payload.json)'
