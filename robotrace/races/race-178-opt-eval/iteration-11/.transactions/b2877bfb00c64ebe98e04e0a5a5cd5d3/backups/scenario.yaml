map:
  id: race-178-opt-eval
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: Revert to best (iter 5)
    notes: 'Reverts base_speed from 1.1 to 1.0 and reproduces the iteration 5 design
      (score 75.779), because iteration 9 lost oval progress (0.29 to 0.115) and scored
      51.33. Every other field is unchanged, so the known best result is banked.


      ### Rationale


      Evidence. Iteration 9 raised base_speed from 1.0 to 1.1 on the iteration 5 design
      and scored 51.33, far below the 75.78 best. Oval progress fell from 0.29 to
      0.115, the same level as the 1.3-speed runs, while s-bend (0.153 to 0.151) and
      slalom (0.108 to 0.108) were essentially flat. The Evaluator''s feedback on
      this candidate was written before it raced, so its prediction that the bend
      tracks would rise is not supported. The race falls under the feedback''s branch
      2: oval progress fell clearly and the score dropped below 75.779. The speed-1.1
      change is rejected. Iteration 8 (kd 0.2, 69.03) also lost progress, and iterations
      6 (kp 1.6, 51.18) and 7 (sensor_size 0.016, 60.12) lost progress too. Across
      all races the best gain set and geometry are iteration 5.


      Change. I revert base_speed to 1.0 and reproduce the iteration 5 design exactly:
      kp 2.0, ki 0.3, kd 0.1, search_right, sensor weights [-2,-1,0,1,2], sensors
      at x = -0.04, -0.015, 0, 0.015, 0.04 with y = 0.05, sensor_size 0.012, 12 cm
      wheel track, 3 cm wheel radius, 16 cm body, 12 cm width, 0.8 kg. Changing nothing
      else keeps the known 75.779 result as the score to beat, and the next iteration
      can test a new variable against it. This is a deliberate choice to bank the
      best known design rather than gamble on an untested field with two iterations
      left.


      Expected result. Progress near the iteration 5 values (oval about 0.29, s-bend
      about 0.15, slalom about 0.11) and a score near 75.8. Every run still ends with
      one line-loss event and max_error of about 0.063 m, above the 0.06 m limit.


      Hypotheses. H13: the oval speed response is a sharp threshold between base_speed
      1.0 and 1.1 at this gain set, so 1.0 is near the best achievable operating point.
      H14: the remaining failure is a slow drift to one edge that none of the single-field
      changes tested has fixed, so a wider sensor span (outer sensors at about x =
      plus or minus 0.05 m) is the next untested lever if spare runs remain.


      Measurements wanted: progress, max_error, line_loss_events and steering_oscillation
      per track, and whether the line-loss point moves along the course.


      - [Open this output](iteration-10/entity0/versions/d3c3c4d3ca6f4fb29e4622309aa2f641/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-8efdd7b76e734a32/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-570e72e85af4a118/payload.json)'
  - id: entityR1
    label: Bank iteration 5 design
    notes: 'Approves the best raced design (iteration 5, score 75.779) unchanged,
      reverting the base_speed 1.1 test that scored 51.33. Every single-field change
      tested since iteration 5 lost score, so this banks the known best result and
      leaves one iteration for a sensor-span test.


      ### Feedback


      Written before this candidate has raced. The candidate matches the iteration
      5 design exactly (kp 2.0, ki 0.3, kd 0.1, search_right, sensor weights [-2,-1,0,1,2],
      sensors at x = -0.04, -0.015, 0, 0.015, 0.04 with y = 0.05, sensor_size 0.012,
      12 cm track, 3 cm radius, 16 cm body, 12 cm width, 0.8 kg). Iteration 5 is the
      best raced design at 75.779. Every single-field departure from it has lost score:
      kp 1.6 gave 51.18 (iteration 6), sensor_size 0.016 gave 60.12 (iteration 7),
      kd 0.2 gave 69.03 (iteration 8), and base_speed 1.1 gave 51.33 (iteration 9).
      Iteration 4 showed that kp 2.5 lowers progress on every track, so kp 2.0 stays.
      Iterations 2 and 3 show base_speed 1.0 is a trade-off: it raised oval progress
      (0.115 to 0.209) and lowered the bend tracks. The candidate is valid and not
      obviously broken, and it is a banking step. Its race should reproduce about
      75.8, which secures this iteration''s score. It will not add new information
      about the failure. All races, including iteration 5, end with one line-loss
      event and max_error of about 0.062 to 0.067 m, above the 0.06 m limit, with
      low oscillation (0.08 to 0.16). The failure is a slow drift to one edge. Read
      the next race this way. (1) If the score is about 75.8 and max_error and line_loss_events
      match iteration 5, the design is reproduced and is the base for the final iteration.
      (2) If the score is clearly different from 75.8, the run is not deterministic
      and the difference should be noted before any further change. Because only one
      iteration remains after this one, the next revision should be a single, well-motivated
      test of an untried lever, not a repeat of the iteration 6 to 9 changes.


      ### Requested changes


      - Race as written. It reproduces the iteration 5 design, so the expected score
      is about 75.8 with progress near oval 0.29, s-bend 0.15 and slalom 0.11.

      - For the next iteration, if spare runs allow, test the untried sensor span
      (H14): keep the iteration 5 gains and move the outer sensors to x = -0.05 and
      +0.05 with sensor_size 0.012. The evidence is that the failure is a drift to
      one edge, and the sensor span changes in iterations 2 and 5 were small and never
      pushed the outer sensors past about 0.05 m.

      - If the next iteration has no spare runs, keep the iteration 5 design as the
      final candidate and do not add a new variable, since every single-field change
      tested so far has lost score.


      - [Open this output](iteration-10/entityR1/versions/6b86f3370aa94624b87b2f9c179a060e/payload.json)

