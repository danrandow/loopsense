map:
  id: race-178-opt-eval
  schema: v0.2
  scenario: Iteration 0
  inherits: base.yaml
  notes: Initial prepared state before either AI role or the simulator has acted.
dimensions:
  time_horizon: prepared
  iteration: '0'
overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'First candidate, built from the contract without race data: five 12 mm
      sensors spanning ±30 mm, base_speed 1.6, kp 2.0, kd 0.1, last_direction line
      loss. Chosen to give speed headroom for the 3 s limit and stable proportional
      steering; the rationale lists the measurements to check next.


      ### Rationale


      Iteration 0 has no race telemetry, so this is a conservative baseline built
      from the contract. Evidence: the course needs an average of about 1.5 m/s to
      finish in 3 s, and base_speed of 2 gives full PWM, so I set base_speed to 1.6
      for speed headroom while keeping some margin for the controller. Geometry: five
      sensors spaced 15 mm apart across x = -0.03 to +0.03 m (wider than the 25 mm
      tape, so at least one sensor sees the line at all times) and placed 50 mm ahead
      of the axle so the controller reacts before the wheels reach a bend. Sensor
      size is 12 mm, a compromise between resolution and coverage. Weights -2, -1,
      0, 1, 2 make the signal proportional to lateral offset (positive = left, which
      steers left). Gains: kp = 2.0 gives a moderate correction (about 1.0 signal
      -> 700 PWM difference); kd = 0.1 damps the oscillation a proportional-only loop
      would produce at this speed; ki = 0.05 is small to avoid integral windup on
      curves. line_loss is last_direction so the robot recovers toward the side it
      was last on. Body width 0.12 m gives an off-track limit of about 0.06 m. Mass
      0.8 kg and wheel_track 0.12 m give moderate yaw inertia. Expected result: completion
      on the oval and s-bend with low rms_error, and possibly some oscillation on
      the slalom. Next measurements to check: whether base_speed 1.6 finishes under
      3 s, whether steering_oscillation is high (which would mean kd or kp is too
      high), and whether line_loss_events is nonzero on the slalom (which would mean
      the sensor span or line_loss choice needs changing).


      - [Open this output](iteration-0/entity0/versions/731a889e462f4e01b5bea316413c3430/payload.json)'
  - id: entityR1
    label: 'Baseline review: approve'
    notes: 'Approved the valid baseline for the first race because no telemetry exists
      yet and a race is the cheapest source of evidence. Feedback names the three
      checks (speed, oscillation, line loss) and the field changes to try if each
      one fails, based only on the contract and rationale.


      ### Feedback


      Written before this candidate has raced. Iteration 0 has no race telemetry,
      so the only evidence is the public contract and the rationale. The candidate
      is a valid, moderate baseline: five sensors spanning x = -0.03 to +0.03 m (wider
      than the 25 mm tape), weights -2..2 giving a signal proportional to lateral
      offset, kp = 2.0 (about 700 PWM difference per unit of signal), small ki and
      kd, and line_loss = last_direction. Nothing in it looks obviously broken, and
      no earlier race exists to show it is wrong. Watch three things in the race.
      (1) Completion time: base_speed 1.6 gives 80% of full PWM, and the course needs
      about 1.5 m/s average to finish in 3 s. If the run does not complete or progress
      stalls short of the end, raise base_speed toward 1.8 to 2.0 before touching
      the gains. (2) steering_oscillation and max_error: if the robot weaves on the
      slalom, lower kp (try 1.2 to 1.5) or raise kd (try 0.2 to 0.3) to damp the swing.
      If rms_error is large but oscillation is low, the robot is tracking too loosely,
      so raise kp in small steps. (3) line_loss_events: if they are nonzero on the
      slalom, widen the sensor span or change line_loss to search_left or search_right,
      depending on which side the robot leaves the line. Change one or two fields
      per revision so the cause of each change is clear.


      ### Requested changes


      - If completion is 0 or completion_time is near 3 s with progress below 1, raise
      base_speed to 1.8 to 2.0 (base_speed 1.6 may be too slow for the 1.5 m/s average
      the course needs).

      - If steering_oscillation or max_error is high on the slalom, lower kp to 1.2
      to 1.5 or raise kd to 0.2 to 0.3 to damp the swing.

      - If line_loss_events is nonzero, widen the sensor span (for example x = -0.04
      to +0.04) or change line_loss to search_left or search_right, chosen by which
      side the robot leaves the line.


      - [Open this output](iteration-0/entityR1/versions/2fda1971798a4cb298a8eafd0ce55e5b/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/731a889e462f4e01b5bea316413c3430/payload.json)'
  - id: entity1
    label: Approved Robot Build
    notes: 'Approved Robot Build. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-0/entity1/versions/2fda1971798a4cb298a8eafd0ce55e5b/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/731a889e462f4e01b5bea316413c3430/payload.json)'
