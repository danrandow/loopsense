map:
  id: race-178-opt-eval
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Revert kp 2.0, sensor
    notes: 'kp 1.6 scored 51.2, well below the kp 2.0 best (75.8), so kp is reverted
      to 2.0 and the only change is sensor_size 0.012 to 0.016 at the same x positions.
      This tests whether the 12 mm footprint leaves the outer sensors blind before
      the off-track limit, as the Evaluator''s fallback branch proposed.


      ### Rationale


      Evidence. Iteration 6 lowered kp from 2.0 to 1.6 and scored 51.18, a large fall
      from the iteration 5 best of 75.78. Progress dropped on every track (oval 0.29
      to 0.115, s-bend 0.153 to 0.150, slalom 0.108 to 0.108), and the oval fell hardest.
      The kp trend therefore turned over: kp 2.0 is the best raced gain, and the monotonic-trend
      assumption from the iteration 6 rationale is rejected. Every run still ends
      off track with one line-loss event and max_error about 0.062 to 0.067 m, above
      the 0.06 m limit. Oscillation stays low (0.08 to 0.16), so the robot drifts
      to an edge rather than weaving. Gain changes have now been tried at 1.6, 2.0,
      2.5, and sensor span and speed have been varied, with no change to the one-loss-per-run
      failure.


      Change. I revert kp to 2.0 (the iteration 5 design, 75.78) and keep everything
      else identical: base_speed 1.0, ki 0.3, kd 0.1, search_right, sensor weights,
      and sensor x positions at -0.04, -0.015, 0, 0.015, 0.04. The only change is
      sensor_size from 0.012 to 0.016. This follows the fallback branch the Evaluator
      and iteration 6 both named. With a 16 mm footprint, edge sensors should keep
      seeing tape to a larger lateral offset, and the readings should be less blind
      near the edge before the 0.06 m limit. The sensor layout is otherwise unchanged,
      so the effect can be attributed to footprint size.


      Expected result. Progress should match or exceed iteration 5 (oval about 0.29,
      s-bend about 0.15, slalom about 0.11). line_loss_events may fall, and max_error
      may drop below 0.06 m if the edge is reached because the outer sensors lose
      the tape too early. If progress falls or the signal becomes noisy, revert to
      sensor_size 0.012.


      Hypotheses. H9: the 12 mm footprint leaves the outer sensors blind before the
      off-track limit, and the 16 mm footprint extends detection range. H10: the kp
      optimum sits near 2.0 at this speed and sensor geometry. Measurements wanted:
      progress, max_error, line_loss_events and steering_oscillation per track, plus
      whether the loss point moves along the course.


      - [Open this output](iteration-7/entity0/versions/cde3d30657874dde8cb5dfdeedef2f25/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-5481e2466c1a696e/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-8a1d99630189d5c7/payload.json)'
  - id: entityR1
    label: 'Approve: 16mm sensor test'
    notes: 'Approved the iteration 5 best design (kp 2.0, score 75.78) with only sensor_size
      changed to 0.016, because the kp sweep (2.5, 2.0, 1.6) never moved max_error
      below 0.06 m. The feedback sets out how to read the race and the next single-variable
      step depending on whether progress and max_error improve.


      ### Feedback


      Written before this candidate has raced. The candidate is the iteration 5 design
      (kp 2.0, search_right, base_speed 1.0, ki 0.3, kd 0.1, sensors at x = -0.04,
      -0.015, 0, 0.015, 0.04, score 75.779, the best raced so far) with one change:
      sensor_size from 0.012 to 0.016. The evidence for this test is that kp changes
      alone have not removed the failure. Across iterations 4, 5 and 6, kp 2.5, 2.0
      and 1.6 all ended with one line-loss event and max_error of about 0.063 to 0.067
      m, above the 0.06 m limit. Oscillation stayed low (0.13 to 0.16), so the robot
      is drifting to an edge rather than weaving. Iteration 2 also showed that widening
      the outer sensors to x = ±0.04 barely moved the result, so the outer-sensor
      blind zone has not yet been tested with a larger footprint. Iteration 6 (kp
      1.6) lowered progress on every track, so kp 2.0 remains the best gain. The candidate
      is valid and differs from the best raced design by one field, so it is a clean
      test. Read the next race this way. (1) If progress is equal to or higher than
      iteration 5 on the oval and s-bend, and max_error falls toward or below 0.06
      m, the larger footprint extends edge detection and H9 is supported. Then test
      a wider outer span. (2) If progress falls or the signal becomes noisy (more
      line-loss events or higher oscillation), the 16 mm footprint blurs the centre
      reading and the 12 mm footprint should be kept. Then test a different damping
      lever, not more sensor changes. (3) If max_error stays near 0.063 m whatever
      the footprint, the limit is not sensing and the next lever is kd or base_speed.
      Keep the iteration 5 gains so the sensor effect can be attributed cleanly.


      ### Requested changes


      - Race as written. If progress is at least as high as iteration 5 (oval about
      0.29, s-bend about 0.15) and max_error or line_loss_events improve, keep sensor_size
      0.016 and widen the outer sensors to x = -0.05 and +0.05 with the other three
      unchanged, since the 16 mm footprint should keep the tape visible further out.

      - If progress falls or line_loss_events rises with sensor_size 0.016, revert
      sensor_size to 0.012 and keep kp 2.0 (iteration 5, 75.779). Then test kd from
      0.1 to 0.2 to damp the drift toward the edge, since iteration 6 showed that
      lowering kp reduced progress.

      - If max_error stays near 0.063 m on every track whatever the footprint, stop
      changing sensing and test base_speed 1.1 with search_right and kp 2.0, since
      iterations 3 and 4 showed that speed trades progress between the oval and the
      bend tracks.


