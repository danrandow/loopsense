  id: race-178-opt-eval
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence. Iteration 3 (base_speed 1.0, sensors at x = ±0.04, kp 2.5, ki 0.3,
      kd 0.1, line_loss last_direction) scored 57.6, the best so far. Oval progress
      rose from 0.115 to 0.21, so speed was part of the cause. S-bend progress fell
      from 0.15 to 0.126 and slalom from 0.105 to 0.084, so slowing down did not solve
      the course in general. Every run still ended off track with exactly one line-loss
      event and max_error about 0.062 m, just above the 0.06 m limit. Oscillation
      stayed low (0.13 to 0.15), so the robot is not weaving. Gains, sensor span and
      speed have each been varied, and the line is still lost once per run. The failure
      therefore sits in the recovery after line loss, which Evaluator feedback identifies
      as the next suspect.


      Change. I keep the iteration 3 geometry, base_speed 1.0, kp 2.5, ki 0.3, kd
      0.1 and sensor weights unchanged, and change only controller.line_loss from
      last_direction to search_right. search_right holds the signal at +1, which steers
      the robot left. I chose this side arbitrarily, because the telemetry does not
      report which side max_error grows on. last_direction replays a fixed-sign turn
      of the last valid signal, and that turn is likely the wrong one or too weak
      to find the tape again. A single-variable change makes the effect of recovery
      mode clear.


      Expected result. If the failure is recovery-limited, line_loss_events stays
      at 1 but the robot re-acquires the line, so progress should rise clearly above
      0.21 on the oval and above 0.13 on the s-bend, and some runs should complete.
      If the robot instead leaves to the right, max_error will be larger on the right
      side, and the next step is search_left, which steers right. If progress does
      not change at all, recovery mode is not the limit, and the next test is lowering
      kp from 2.5 toward 2.0 to reduce bend-entry turn authority.


      Hypotheses to check. H4: the line-loss recovery mode decides whether the robot
      re-acquires the line. H5: the failure side is the same on every track, so one
      search direction should be correct for all tracks. Next measurements: progress
      and line_loss_events per track, max_error per track, and completion_time if
      any run finishes.


      - [Open this output](iteration-4/entity0/versions/d4e9c1c984154327a945d1c23c9d4fa3/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-1b4a516b2b6c8329/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-ac44139c22028e70/payload.json)'
  - id: entityR1
    label: 'Approve: test'
    notes: 'Approves the iteration 3 geometry and gains with only line_loss changed
      to search_right, a clean single-variable test of recovery mode. Iteration 3
      (score 57.6) is the best raced design, and every run so far lost the line once
      and never recovered.


      ### Feedback


      Written before this candidate has raced. The evidence is iterations 0 to 3 (60
      development trials each). Every run ended off track with exactly one line-loss
      event and max_error of about 0.062 m, just above the 0.06 m limit. Oscillation
      stayed low (0.08 to 0.15), so the robot is not weaving. Iteration 3 (base_speed
      1.0, sensors at x = ±0.04, kp 2.5, ki 0.3, kd 0.1, line_loss last_direction,
      score 57.6) is the best raced design. Its oval progress rose to 0.21, but slalom
      and s-bend progress fell, so speed alone does not explain the failure. Gain
      changes (iteration 1) and the sensor span change (iteration 2) also left the
      failure point largely unchanged. The candidate keeps the iteration 3 geometry
      and gains and changes only controller.line_loss to search_right. That is the
      cleanest single-variable test of the recovery hypothesis (H4), and the telemetry
      cannot settle it without a race. The change is valid and not obviously broken,
      so it is worth racing now. Iterations remaining are limited, and a revise round
      would only repeat the same test. Read the next race this way. (1) If line_loss_events
      stays at 1 but progress rises clearly above 0.21 on the oval and above 0.13
      on the s-bend, recovery mode was the limit, and the next step is to tune base_speed
      upward from 1.0 in small steps. (2) If max_error is clearly larger on the right
      edge, or progress falls, the robot is leaving on the wrong side. Test search_left
      next, which steers right. (3) If progress does not change at all, recovery mode
      is not the limit, and the next test is kp lowered from 2.5 toward 2.0 to reduce
      bend-entry turn authority.


      ### Requested changes


      - Race the candidate as written, then compare progress, line_loss_events and
      max_error per track against iteration 3. If progress rises on the oval and s-bend,
      keep search_right and move base_speed up in small steps from 1.0.

      - If the failure side is clearly the right edge or progress drops, change only
      controller.line_loss to search_left and race again.

      - If progress is unchanged across tracks, keep the recovery mode and lower kp
      from 2.5 to 2.0 as the next single-variable test.


      - [Open this output](iteration-4/entityR1/versions/9e569941507c4b2a8f78e4d4e7cea79a/payload.json)

