map:
  id: race-178-opt-eval
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: kp 1.6 continues trend
    notes: 'Keeps the best raced geometry, base_speed, ki, kd, weights and search_right
      from iteration 5 (score 75.8) and lowers kp from 2.0 to 1.6. Progress rose on
      every track when kp fell from 2.5 to 2.0, so the next step follows that trend;
      max_error is still above the 0.06 m limit, so this may not clear it.


      ### Rationale


      Evidence. Iteration 5 (kp 2.0, search_right, base_speed 1.0, ki 0.3, kd 0.1,
      sensors at x = ±0.04 and ±0.015/0) is the best raced design, at 75.779. Compared
      with iteration 4 (kp 2.5), progress rose on every track: oval 0.21 to 0.29,
      s-bend 0.126 to 0.153, slalom 0.084 to 0.108. Every run still ended off track
      with one line-loss event, and max_error stayed at about 0.063 to 0.067 m, above
      the 0.06 m limit. Oscillation stayed low (0.14 to 0.16), so the robot is drifting
      to an edge, not weaving. Changing kp is the only change that has moved progress
      in the right direction, and the trend is monotonic across the 2.5 to 2.0 step.
      The Evaluator''s branch 1 (max_error below 0.06 m) is not met, but progress
      did rise on all three tracks, so turn authority is still a limiter.


      Change. I keep the iteration 5 geometry, base_speed 1.0, ki 0.3, kd 0.1, sensor
      weights and search_right, and lower kp from 2.0 to 1.6, the lower part of the
      1.5 to 1.8 range the Evaluator named. This is a single-variable continuation
      of the kp trend. Choosing 1.6 rather than 1.5 keeps a margin against losing
      the line on bend entries.


      Expected result. Progress should rise again on the oval, s-bend and slalom,
      with a score above 75.8. max_error may stay near 0.063 m because the failure
      point seems to lie beyond proportional authority. Fallback: if progress falls
      or line-loss events rise, revert to kp 2.0, the best raced design, and move
      to the sensor-geometry test (sensor_size 0.016 at the same x positions).


      Hypotheses. H7: lower kp reduces bend-entry overshoot, so the robot keeps more
      progress before reaching the edge. H8: max_error stays near 0.063 m, so the
      edge exit is caused by something other than proportional gain. Measurements
      wanted: progress, max_error and line_loss_events per track, and whether the
      loss point moves along the course.


      - [Open this output](iteration-6/entity0/versions/7dcf996a4f214efca416bb2627972d8d/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-0a4fe2b08f858aaa/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-9cc42b3f03ddbf20/payload.json)'
  - id: entityR1
    label: Approve kp 1.6 step
    notes: 'Approves the iteration 6 candidate: iteration 5 geometry and controller
      with kp lowered from 2.0 to 1.6. Progress rose monotonically as kp fell from
      2.5 to 2.0 (scores 57.6 to 75.8), and this is a single-variable continuation
      of that trend.


      ### Feedback


      Written before this candidate has raced. The candidate keeps the iteration 5
      geometry, base_speed 1.0, ki 0.3, kd 0.1, sensor weights and search_right, and
      lowers kp from 2.0 to 1.6. Iteration 5 (kp 2.0) is the best raced design at
      75.779. Against iteration 4 (kp 2.5, otherwise identical), progress rose on
      every track: oval 0.21 to 0.29, s-bend 0.126 to 0.153, slalom 0.084 to 0.108.
      Every run still ended off track with one line-loss event, and max_error stayed
      at about 0.063 to 0.067 m, above the 0.06 m limit. Oscillation stayed low (0.14
      to 0.16), so the failure is a drift to an edge, not weaving. This is a clean
      single-variable step along the kp trend, and the candidate is valid and not
      obviously broken. Approve it so the race can confirm or reject the trend. Read
      the result this way. (1) If progress rises again on the oval, s-bend and slalom,
      and line_loss_events does not rise, keep kp near 1.6 and test the sensor geometry
      next (sensor_size 0.016 at the same x positions). (2) If progress falls, or
      line_loss_events rises, revert to kp 2.0 (the best raced design) and test the
      sensor geometry from there. (3) If max_error stays near 0.063 m on every track
      whatever kp does, proportional gain is not the limiter, and the next lever is
      the sensor span or sensor_size, not more gain changes.


      ### Requested changes


      - Race as written. If progress rises on all three tracks with no added line-loss
      events, keep kp 1.6 and change only sensor_size from 0.012 to 0.016 (same x
      positions), since kp 2.5 to 2.0 to 1.6 has moved progress monotonically.

      - If progress falls or line_loss_events rises at kp 1.6, revert kp to 2.0 (iteration
      5, 75.779) and change only sensor_size to 0.016 at the same x positions, to
      test whether the edge is reached because the outer sensors lose the tape too
      early.

      - If max_error stays near 0.063 m on every track whatever kp does, stop tuning
      gains and test the sensor span (outer sensors at x = plus or minus 0.05 m, with
      the 12 mm footprint or the 16 mm footprint).


      - [Open this output](iteration-6/entityR1/versions/9c93e47a8c3842e796b23bd0a551029b/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/7dcf996a4f214efca416bb2627972d8d/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-9cc42b3f03ddbf20/payload.json)'
