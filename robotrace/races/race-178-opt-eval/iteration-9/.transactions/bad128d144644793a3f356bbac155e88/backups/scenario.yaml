  id: race-178-opt-eval
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: kd 0.1, base_speed 1.1
    notes: 'Reverts kd to the iteration 5 value (kd 0.2 cut progress in iteration
      8) and tests base_speed 1.1 alone on the best gain set (kp 2.0, ki 0.3, search_right,
      sensor_size 0.012). It checks whether bend-track progress rises without losing
      the oval, per the Evaluator''s plan.


      ### Rationale


      Evidence: iteration 5 (kp 2.0, kd 0.1, ki 0.3, base_speed 1.0, search_right,
      sensor_size 0.012) is the best raced design at 75.779. Iteration 8 raised kd
      to 0.2 and scored 69.031, with lower progress on all three tracks (oval 0.29
      to 0.27, s-bend 0.15 to 0.137, slalom 0.11 to 0.089) and higher oval oscillation
      (0.16 to 0.17). Raising kd did not reduce max_error (about 0.062 m on every
      track), so damping is not the limiter. Iterations 6 (kp 1.6) and 7 (sensor_size
      0.016) both lost progress, so kp 2.0 and sensor_size 0.012 stay.


      Change: kd returns to 0.1. base_speed goes from 1.0 to 1.1. Everything else
      is the iteration 5 design: kp 2.0, ki 0.3, search_right, sensor weights [-2,-1,0,1,2],
      sensor_size 0.012, and sensor x positions of -0.04, -0.015, 0, 0.015, 0.04 at
      y 0.05. Iterations 3 and 4 showed that speed moves progress between the oval
      and the bend tracks, so this is a small test of whether bend progress rises
      without losing the oval.


      Expected result: slalom and s-bend progress above iteration 5 while the oval
      holds near 0.29. Hypothesis: the remaining failure is a slow drift to one edge
      that speed alters, not a damping or sensing problem. Fallback: if oval progress
      falls or line_loss_events rises, return base_speed to 1.0 and accept iteration
      5 as the best gain set.


      Measurements wanted: progress, max_error, line_loss_events and steering_oscillation
      per track, and whether the loss point moves along the course.


      - [Open this output](iteration-9/entity0/versions/0bf2b96185024f8e8005fb5d2c560908/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/2b5c9a879e7f4eb58f7e6fb5a3d61162/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-b750615a13534293/payload.json)'
  - id: entityR1
    label: 'Revise: kd back to 0.1'
    notes: 'This candidate repeats iteration 8''s design, which raced at 69.03 and
      lost progress on every track against the iteration 5 best (75.78). I am sending
      it back to revert kd to 0.1 and test base_speed 1.1 alone on the best gains,
      since max_error stayed near 0.062 m whatever damping was tried.


      ### Feedback


      Revise. This candidate is identical to the design raced in iteration 8 (kd 0.2,
      kp 2.0, ki 0.3, base_speed 1.0, search_right, sensor_size 0.012, same x positions).
      That race scored 69.031, below the best raced design, iteration 5 (75.779, kd
      0.1). Against iteration 5, progress fell on every track (oval 0.29 to 0.27,
      s-bend 0.15 to 0.137, slalom 0.11 to 0.089), and steering_oscillation rose on
      the oval from 0.16 to 0.17. Raising kd did not reduce max_error, which stayed
      at about 0.062 m on every track, so damping is not the limit and kd 0.2 should
      not be kept. Iteration 6 (kp 1.6) and iteration 7 (sensor_size 0.016) also lost
      progress, so kp 2.0 and sensor_size 0.012 stay. Revise so the next race tests
      speed alone on the best gains. Read the next race this way: if progress on the
      bend tracks (s-bend, slalom) rises above iteration 5 while the oval holds near
      0.29, keep base_speed 1.1 and consider a further step. If the oval progress
      falls or line_loss_events rises, return base_speed to 1.0 and accept iteration
      5 as the best gain set. Iterations 3 and 4 showed that speed shifts progress
      between the oval and the bend tracks, so 1.1 is a small step to test that trade-off.


      ### Requested changes


      - Set controller.kd back to 0.1 (iteration 5 value, score 75.779). Iteration
      8 with kd 0.2 scored 69.031, with lower progress on all three tracks and higher
      oscillation on the oval (0.17 vs 0.16).

      - Set controller.base_speed to 1.1, keeping kp 2.0, ki 0.3, kd 0.1, search_right,
      sensor_size 0.012 and the iteration 5 sensor positions. Iterations 3 and 4 showed
      speed moves progress between the oval and the bend tracks, so 1.1 is a small
      test of whether bend progress can rise without losing the oval.

      - Do not change kp, sensor_size or sensor positions in this revision. Iterations
      6 and 7 showed that kp 1.6 and sensor_size 0.016 both lowered progress, so the
      next race should isolate base_speed on the best gain set.


      - [Open this output](iteration-9/entityR1/versions/2b5c9a879e7f4eb58f7e6fb5a3d61162/payload.json)

