  entities:
  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'Initial conservative candidate: five sensors 10 mm apart, proportional-led
      steering (kp 5, kd 0.3), base speed 1.6, last-direction line recovery. No race
      data yet, so values are chosen from the contract ranges and the 3 s completion
      requirement.


      ### Rationale


      Iteration 0 has no race telemetry, so this is a conservative baseline built
      from the contract. Geometry: five line sensors spaced 10 mm apart across x =
      -0.02 to +0.02 m, 0.04 m ahead of the axle. Five sensors keep the line in view
      through bends, and 10 mm spacing is finer than the 25 mm tape width, so the
      line is always covered by at least one or two sensors. A 12 mm footprint gives
      smooth readings. Sensor weights equal the sensor x-positions (-1.0, -0.5, 0,
      0.5, 1.0 after scaling by 50), so the signal is roughly the line offset and
      positive means the line is left, which steers left. Controller: kp = 5 gives
      a turn of about 1.75 for a 0.35 signal, roughly 600 PWM differential, a firm
      but not twitchy response. kd = 0.3 damps overshoot on the curves. ki = 0.05
      is small to avoid windup on long bends. base_speed = 1.6 aims for about 1.5
      m/s average with margin under the 3 s limit. line_loss = last_direction, so
      the robot searches toward the side it last saw the line. Mass 0.8 kg, wheel_track
      0.12 m, wheel_radius 0.03 m and a 0.12 x 0.16 m body are mid-range values. Expected
      result: completion on the oval and s-bend, with some oscillation on the slalom.
      The next race should show whether speed or gain is the limiting factor. Hypotheses:
      (1) kp is adequate and speed is near the 3 s limit; (2) oscillation rises if
      kp is too high relative to the sensor scale; (3) line losses occur on the slalom''s
      sharp direction changes. Next measurements wanted: completion_time, steering_oscillation,
      line_loss_events and max_error on each track.


      - [Open this output](iteration-0/entity0/versions/13b8db3e5cbb487a9d964682785daa1b/payload.json)'
