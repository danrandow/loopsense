  entities:
  - id: entity0
    label: Wider sensor span test
    notes: 'Reverts base_speed to 1.10 (iteration 6''s 0.95 cut dropped the score
      to 357) and makes one change from the best design (iteration 5, 657.5): sensor
      x-span widened to +/-0.025 m to target the slalom''s 1.8 line losses per run.
      Expected to lift slalom progress without losing oval or s-bend finishes.


      ### Rationale


      Evidence from iteration 6 (score 357, down from 657.5 in iteration 5). Cutting
      base_speed from 1.10 to 0.95 was a mistake. The oval finish rate fell from 0.90
      to 0.10, the s-bend from 1.00 to 0.45, and oval max_error rose to the 0.06 m
      limit. Slalom progress was flat (0.347 to 0.351) and line_loss_events stayed
      at 1.3 to 1.8. So slower entry speed did not fix the slalom and hurt the other
      two tracks. I revert base_speed to 1.10, the best-scoring setting. Iteration
      5 showed mass 0.4 (at its minimum) and speed 1.10 give 0.90 oval, 1.00 s-bend,
      and 0 slalom finishes. The slalom is the only track that fails. Its failure
      is excursion at sharp direction changes, with 1.8 line-loss events per run and
      max_error at the 0.06 m limit. Earlier, widening the sensor footprint to 16
      mm plus a wider span together (iteration 2) hurt, but that test changed several
      variables at once. This iteration makes one controlled geometry change from
      iteration 5: the sensor x-span widens from +/-0.02 m to +/-0.025 m (spacing
      12.5 mm, still under the 25 mm tape width), with the 12 mm footprint kept. The
      weights are held at (-1, -0.5, 0, 0.5, 1) so the controller is unchanged. The
      aim is to see the line earlier at tight bends and reduce line losses on the
      slalom. Expected result: slalom line_loss_events below 1.5 and slalom progress
      above 0.4, with oval and s-bend finish rates held near their iteration-5 values
      (oval at or above 0.8, s-bend at or above 0.9). Hypotheses: (a) the wider span
      cuts slalom line losses, which is the main slalom limit; (b) if the oval or
      s-bend finish rate drops, the wider span is hurting the on-line signal at gentle
      curves, and the span should go back to +/-0.02; (c) if slalom line losses stay
      near 1.8, the limit is not sensor span, and the next test should be kd or the
      sensor forward position (y). Measurements wanted: completion, progress, completion_time,
      max_error, rms_error, line_loss_events and steering_oscillation on each track,
      plus control_effort to check steering load.


