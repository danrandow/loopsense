  entities:
  - id: entity0
    label: Lighter, slower robot
    notes: 'Mass cut from 0.45 to 0.40 kg (minimum) and base speed from 1.15 to 1.10,
      continuing the two changes that raised finish rate and slalom progress in iteration
      4 (score 488). Expected slalom progress above 0.35 with the oval still finishing
      under 3 s.


      ### Rationale


      Evidence from iteration 4 (score 488.3, best so far): the oval finish rate reached
      0.90 and the s-bend finish rate 0.25, but the slalom still finished 0 of 20
      with progress 0.30 and about 1.05 line-loss events per run. Every failure is
      off_track, and max_error sits at the 0.06 m limit on the s-bend and slalom,
      so the robot makes brief excursions at sharp direction changes rather than drifting.
      The trend across iterations is consistent. Cutting mass (0.8 to 0.6 to 0.5 to
      0.45 kg) lowered yaw inertia, and each cut raised finish rate and cut max_error.
      Cutting base_speed from 1.25 to 1.15 also raised s-bend finishes and slalom
      progress (0.17 to 0.30). Sensor geometry changes in iteration 2 hurt, so the
      sensors, kp, kd, ki and line_loss stay as they are. Changes: (1) mass 0.45 to
      0.40 kg, the minimum allowed, to continue the yaw-inertia trend that has helped
      every time. (2) base_speed 1.15 to 1.10 to reduce bend-entry speed on the slalom
      and s-bend. The oval finish time (about 2.4 s at 1.15) should rise to about
      2.6 s, which is still under the 3 s limit with some margin. Expected result:
      slalom progress above 0.35 with some finishes, s-bend finishes above 0.3, and
      oval finish rate at or above 0.85. Hypotheses: (a) the slalom failure is still
      driven by yaw inertia and entry speed, so both changes should help; (b) if the
      oval finish time rises above 2.8 s, speed is becoming the binding constraint
      and base_speed should not drop further; (c) if slalom line_loss_events stay
      at 1 or more, the 12 mm sensors are missing the tape on tight bends and a sensor-geometry
      test is needed. Steering_oscillation (about 0.38 on the oval) is not yet a clear
      limit, so kd is held at 0.8 for now. Measurements wanted: completion, progress,
      completion_time, max_error, rms_error, line_loss_events and steering_oscillation
      on each track, plus control_effort to check steering load.


