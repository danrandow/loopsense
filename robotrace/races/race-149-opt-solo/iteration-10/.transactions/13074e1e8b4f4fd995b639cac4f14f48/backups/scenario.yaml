  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence from iteration 9 (score 691.2, best so far). The oval (20/20 finishes,
      max_error 0.012) and s-bend (20/20, max_error 0.022) are both reliable. The
      slalom still finishes 0/20, but progress rose from 0.36 to 0.49 when kd went
      from 0.8 to 1.0. Line-loss events on the slalom rose from 1.8 to 2.25, and steering_oscillation
      on the s-bend rose slightly (0.36 to 0.37). The oval was essentially unchanged.
      The kd trend is therefore the only lever that has moved the slalom forward without
      hurting the two tracks that already finish. Geometry, base_speed, kp, ki and
      line_loss are held at iteration 9 values, so the response to kd can be attributed.
      Change: kd 1.0 to 1.2, a single-variable step. Expected result: slalom progress
      about 0.55 to 0.65, with line losses possibly still near 2 and no finish guaranteed.
      Oval and s-bend should hold near 1.0 completion. Hypotheses: (a) the slalom
      limit is loop damping at sharp bend entry, so more kd keeps raising progress;
      (b) if oval steering_oscillation rises above about 0.3 or oval completion drops
      below 0.9, derivative noise is now the limit and kd should return to about 1.0
      or 1.1; (c) if slalom progress stays below 0.55, the limit is kp or sensor span,
      and the next test should be kp alone. Measurements wanted: completion, progress,
      completion_time, max_error, rms_error, line_loss_events and steering_oscillation
      on each track, plus control_effort for steering load.


      - [Open this output](iteration-10/entity0/versions/0dc81317b01b461c9c52caa2983f8066/payload.json)

