  entities:
  - id: entity0
    label: Forward sensors y=0.06
    notes: 'Keeps the iteration 7 span (±0.025 m) and moves the sensor row forward
      from y=0.05 to 0.06 m to give more steering lead before sharp bends. Slalom
      line losses fell to 1.05 with wider span, but it still never finishes, so this
      is a single-variable test against iteration 7.


      ### Rationale


      Evidence. Iteration 5 (657.5, best) used 12 mm sensors at x = ±0.02 m, y = 0.05
      m, mass 0.4 kg, base_speed 1.1, kp 6, kd 0.8, ki 0.02. Oval 18/20, s-bend 20/20,
      slalom 0/20 (progress 0.35, 1.8 line-loss events, max_error at the 0.06 m limit).
      Iteration 7 widened the span to ±0.025 m: oval improved to 20/20 with 0.15 line
      losses, slalom line losses fell from 1.8 to 1.05, but s-bend dropped to 15/20
      and slalom progress fell to 0.28. Iteration 6 showed that lowering base_speed
      does not help the slalom. The slalom is the only track that never finishes,
      and it fails through excursions at sharp direction changes. Sensor lead is the
      lever I have not tested alone. Iteration 2 moved y to 0.06 together with other
      changes, so its effect is unknown.


      Change: keep the iteration 7 geometry (span ±0.025 m, 12 mm sensors) and move
      the sensors forward from y = 0.05 to y = 0.06 m. Controller, mass, speed and
      line-loss handling are unchanged, so this is a single-variable test against
      iteration 7. The forward sensors see the line about 10 mm earlier, which gives
      the controller more time to steer before a sharp bend.


      Expected result: slalom progress above 0.35 with line losses at or below 1.0,
      oval completion at or above 0.9, and s-bend completion recovering toward 0.9
      or better. Hypotheses: (a) forward lead reduces slalom off-track events; (b)
      if s-bend falls further, the wider span is the cause and the span should return
      to ±0.02 m while keeping y = 0.06; (c) if slalom line losses stay near 1.0 with
      no progress gain, the limit is steering gain or kd, and the next test should
      change kd (to about 1.0) alone.


      Measurements wanted: completion, progress, completion_time, max_error, rms_error,
      line_loss_events and steering_oscillation on each track, plus control_effort
      to check steering load.


