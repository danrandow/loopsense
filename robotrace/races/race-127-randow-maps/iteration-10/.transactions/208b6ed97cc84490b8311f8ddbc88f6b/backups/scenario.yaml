overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 8 settled the footprint question. Going from 16 mm to 12 mm at the
      same positions dropped oval completions from 14 of 20 to 0 of 20 (score 303.8
      to 101.4), and slalom line loss only fell from 0.30 to 0.25. The Integrator''s
      rule says to return to 16 mm when oval completions fall below about 12 of 20,
      so I revert sensor_size to 0.016 m. The 16 mm footprint is the only sensing
      setting that has produced completions. The s-bend and slalom still end off track
      at progress 0.27 and 0.12. Their failures look like sharp-bend losses at the
      outer edge, and the Integrator reports slalom line loss still at 0.25 or more.
      The next test is therefore the outer span. I widen the seven sensors to x =
      ±0.07 m, spread evenly at a pitch of about 0.0233 m, which is a small change
      from the 0.02 m pitch. I keep the iteration 7 mass, body, track, wheel radius
      and row height (y = 0.02 m) so that the only geometry change is the span. Expected
      result: oval completions hold near 14 of 20, slalom line_loss_events fall below
      0.25, and the wider margin gives the s-bend and slalom their first chance of
      progress above 0.3. Max_error on the oval finishes is 0.048, so the oval is
      not expected to fall. The Integrator will need to rescale sensor weights to
      the wider span, since the signal is set by the weights.


      - [Open this output](iteration-9/entity0/versions/092f94e4c8e74056a666b7e70bf2288f/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-edd6e1e3a4301067/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-7b46eb7667b451de/payload.json)'
  - id: entity1
    label: Wider ±0.07 m span
    notes: 'Keeps the 16 mm footprint that produced oval completions (iteration 7,
      14 of 20) and widens the seven-sensor span to ±0.07 m. Gains are unchanged so
      the span is the only change. Evidence: iteration 8 (12 mm) gave 0 completions.


      ### Rationale


      Iteration 7 (16 mm, seven sensors at x = ±0.06 m, y = 0.02 m, 0.6 kg, 0.12 m
      body, 0.10 m track, 0.03 m wheels, kp 2.2, kd 0.5) is the best race so far at
      303.8, with 14 of 20 oval completions. Its s-bend and slalom still end off track,
      and slalom line_loss_events are 0.3. Iteration 8 showed that 12 mm sensors remove
      oval completions (0 of 20), so the 16 mm footprint stays. The Builder''s proposal
      keeps 16 mm and widens the span to x = ±0.07 m at pitch about 0.0233 m, which
      tests outer-edge margin. Body, mass, track, wheel radius and row height (y =
      0.02 m) stay at iteration 7 values, so the span is the only geometry change.
      Weights stay at [2, 1.333, 0.667, 0, -0.667, -1.333, -2], which is proportional
      to x at 28.6 per metre. This matches the outer sensors at ±2 and keeps the signal
      inside its ±2 limit. Gains are unchanged from iteration 7, so any change in
      result comes from the wider span. Expected result, not measured: oval completions
      hold near 14 of 20, slalom line_loss_events fall below 0.25, and the s-bend
      and slalom get their first progress above 0.3. If oval completions fall while
      line loss falls, the weights are too large for the wider span and need rescaling
      rather than a geometry change.


      - [Open this output](iteration-9/entity1/versions/64b5f71304a44635a26ca060fb43e463/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/092f94e4c8e74056a666b7e70bf2288f/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-7b46eb7667b451de/payload.json)'
  - id: entityR1
    label: Span test, then wheel
    notes: 'Asks the Builder to keep 16 mm and test the wider span. If slalom line
      loss stays high, the next step is wheel_track 0.11 m. Requested changes cite
      iterations 7, 8 and 5.


      ### Feedback


      Written before this candidate has raced. Iteration 7 (16 mm, ±0.06 m span, 0.6
      kg, y = 0.02 m, kp 2.2, kd 0.5) gave 14 of 20 oval completions and slalom line_loss_events
      of 0.3. Iteration 8 (same, 12 mm) gave 0 oval completions and slalom line loss
      of 0.25, so the footprint must stay at 16 mm and the span is the remaining lever.
      I have kept gains and body, mass, track and wheels fixed, so the span is the
      only change. Next race: if slalom line_loss_events fall below about 0.25 while
      oval completions stay at about 14 of 20 or better, keep ±0.07 m and move the
      sharp-bend effort to turn authority (wheel_track). If oval completions fall
      while line loss falls, the weights are too large for the wider span, so keep
      the geometry and let the Integrator rescale. If line loss does not fall, the
      outer edge is not the limit, and the next test is wheel_track 0.11 m.


      ### Requested changes


      - If slalom line_loss_events stay at or above about 0.25 with the ±0.07 m span
      and 16 mm sensors (iteration 7 at ±0.06 m gave 0.3): keep sensor_size 0.016
      m, and try wheel_track 0.11 m, because the s-bend and slalom have never produced
      progress above 0.3 (iteration 7 s-bend 0.27, slalom 0.12).

      - If oval completions fall below about 12 of 20 with the wider span (iteration
      7 gave 14 of 20 at ±0.06 m): return sensor_size to 0.016 m and keep the iteration
      7 span at ±0.06 m. Iteration 8 showed 12 mm drops completions to 0, so do not
      reduce the footprint again.

      - If line loss falls but the s-bend and slalom still end off track with no progress
      above 0.5: keep ±0.07 m and try mass 0.7 kg with body_length 0.12 m, because
      iteration 5 (0.8 kg, 0.16 m body) had zero slalom line loss, and the heavier
      robot may hold the line through the sharp bends.


      - [Open this output](iteration-9/entityR1/versions/64b5f71304a44635a26ca060fb43e463/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/092f94e4c8e74056a666b7e70bf2288f/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-7b46eb7667b451de/payload.json)'
