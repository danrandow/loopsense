overrides:
  entities:
  - id: entity0
    label: 12 mm footprint test
    notes: 'Keeps the iteration 7 platform that completed 14 of 20 oval runs and changes
      only the sensor footprint from 16 mm to 12 mm. The slalom had 0.3 line-loss
      events per run at 0.6 kg, which met the Integrator''s trigger for this change.


      ### Rationale


      Iteration 7 (0.6 kg, 0.12 m body, 0.10 m track, 0.03 m wheels, seven 16 mm sensors
      at y = 0.02 m, x = ±0.06 m) is the best design so far at 303.8. On the oval
      it finished 14 of 20 runs (progress 0.88, mean finish 1.63 s), so the oval is
      now a completion. The s-bend and slalom still end 20 of 20 off track, at progress
      0.27 and 0.12. Slalom line loss is 0.3 events per run, up from zero at 0.8 kg
      in iteration 5. The Integrator''s stated trigger for a footprint change (slalom
      line loss above about 0.25 at 0.6 kg, y = 0.02 m) has been met. Max_error on
      the oval finishes is 0.048, so the robot can hold the line when it is not in
      a sharp bend. The failures on the s-bend and slalom look like sharp-bend losses,
      not a general tracking floor. Iteration 6 showed that a larger wheel radius
      cuts progress, so speed is not the lever. I will keep every value that produced
      the oval completions and change only the sensor footprint, from 16 mm to 12
      mm, at the same positions. The Integrator asked for this test, and it isolates
      the sensing cause of the slalom line loss without touching yaw inertia, track
      or reaction point. Expected result: slalom line_loss_events fall toward 0, oval
      completions hold at about 14 of 20 or better, and the score stays near or above
      300. A completion on the s-bend or slalom would add about 500 points per run,
      so those tracks are the next target if the oval holds. If line loss does not
      fall with 12 mm, the next geometry test is a wider outer span (x = ±0.07 m)
      to give the line more margin before the robot leaves the track.


      - [Open this output](iteration-8/entity0/versions/783274b0dc464121846ad3df3df2fdf1/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-84d50a16dafd85fe/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-d2b9a4008b0655b9/payload.json)'
  - id: entity1
    label: 12 mm footprint test
    notes: 'Iteration 7 geometry with the sensor footprint cut from 16 mm to 12 mm,
      controller held fixed. Tests whether footprint drives the 0.3 slalom line loss
      seen at 0.6 kg, using iteration 7''s 14 of 20 oval completions as the baseline.


      ### Rationale


      Iteration 7 is the best design so far (303.8). It completed 14 of 20 oval runs,
      with progress 0.88 and max_error 0.048. Its s-bend and slalom still end off
      track, and slalom line loss is 0.3 per run. The Builder''s proposal keeps every
      iteration 7 value and changes only the sensor footprint, from 16 mm to 12 mm.
      I keep the iteration 7 controller unchanged (kp 2.2, kd 0.5, ki 0.05, base_speed
      1.4, last_direction, weights about 33 times x) so that the race isolates the
      footprint. Iteration 5 showed that the y = 0.02 m row with 16 mm sensors gave
      zero slalom line loss at 0.8 kg, while iteration 7 at 0.6 kg gave 0.3. This
      suggests the inertia change added slalom loss, and the footprint is the test.
      The footprint is the only geometry lever not yet varied at this inertia, so
      the test is clean. The risk is that a 12 mm footprint gives less tape coverage
      per sensor, so the outer sensors may read less and trigger line loss earlier.
      If that happens, the next step is a wider span at x = ±0.07 m, not a return
      to 16 mm. The track, wheels, mass and body stay fixed, so yaw and speed are
      unchanged.


      - [Open this output](iteration-8/entity1/versions/d9ac2d12bfd445c8aa7d6d2ce1dd18e1/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/783274b0dc464121846ad3df3df2fdf1/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-d2b9a4008b0655b9/payload.json)'
  - id: entityR1
    label: Footprint then span next
    notes: 'Feedback ties the 12 mm test to iteration 7 and iteration 5 line-loss
      evidence. It gives three conditional changes: widen the span to ±0.07 m, revert
      to 16 mm if oval completions drop, or try a wider track for turn authority.


      ### Feedback


      Written before this candidate has raced. Iteration 7 (0.6 kg, 0.12 m body, 0.10
      m track, 0.03 m wheels, 16 mm, y = 0.02 m) gave the best score (303.8) with
      14 of 20 oval completions, but slalom line loss was 0.3 per run, against 0 at
      0.8 kg in iteration 5. Iteration 5 (0.8 kg, same row and footprint) gave zero
      line loss on all tracks, so the footprint and row were not the cause on their
      own. The inertia change added the slalom loss. Iteration 6 showed that raising
      wheel radius cut oval progress (0.358 to 0.291), so speed is not the lever.
      Max_error has stayed at 0.061 to 0.064 m across geometry changes, but iteration
      7 oval max_error was 0.048 on completing runs, so the failures are sharp-bend
      losses, not a general floor. Next race: if slalom line loss falls toward 0 with
      oval completions at or above about 14 of 20, keep 12 mm and move the s-bend
      and slalom effort to turn authority. If line loss does not fall, the outer span
      is the limit, so widen to x = ±0.07 m. If line loss rises with 12 mm, the footprint
      is too small to hold the edge sensors, so return to 16 mm and widen the span.


      ### Requested changes


      - If slalom line_loss_events stay at or above about 0.25 with 12 mm sensors
      (iteration 7 at 16 mm gave 0.3): widen the outer sensors to x = ±0.07 m at the
      same 0.02 m pitch, since iteration 5 at 0.8 kg with x = ±0.06 m and 16 mm gave
      zero losses only when inertia was higher, and the wider span gives the line
      more margin before the edge.

      - If oval completions fall below about 12 of 20 with 12 mm (iteration 7 gave
      14 of 20 at 16 mm): return sensor_size to 0.016 m and keep the iteration 7 positions,
      since the 16 mm footprint is the only sensing change that produced oval completions.

      - If the s-bend and slalom still show no completion or progress above 0.5 after
      the footprint change: try wheel_track 0.11 m at 0.6 kg, since iteration 1 at
      0.12 m with 0.8 kg had the lowest oscillation (0.173), and a wider track reduces
      yaw gain per command. Accept that this may lower oval progress, since iteration
      2 at 0.09 m gave the highest progress (0.44).


      - [Open this output](iteration-8/entityR1/versions/d9ac2d12bfd445c8aa7d6d2ce1dd18e1/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/783274b0dc464121846ad3df3df2fdf1/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-d2b9a4008b0655b9/payload.json)'
