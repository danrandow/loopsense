  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Larger wheels, same
    notes: 'Keeps the best-scoring Iteration 2 sensor layout (5 sensors, y=0.07 m,
      16 mm) and raises wheel radius from 0.035 to 0.040 m to test whether speed is
      what limits oval finishes. Based on Iteration 2 (score 329, oval finish 65%)
      and Iteration 3, where the 7-sensor, y=0.08 m layout cut the oval finish rate
      to 35%.


      ### Rationale


      Evidence from the race data: Iteration 2 (5 sensors at y=0.07 m, 16 mm footprint,
      track 0.10 m, wheel radius 0.035 m, mass 0.6 kg) is still the best design at
      329 points. Its oval finish rate was 65%, and its oval progress was 0.94. Iteration
      3 moved the sensors to y=0.08 m and widened the array to 7 sensors. That raised
      s-bend progress from 0.45 to 0.48 but cut the oval finish rate to 35%, nearly
      doubled steering oscillation on the oval (0.28 to 0.36), and lowered the score
      to 272. Extra look-ahead and extra spread therefore did not pay off as a package,
      and the 7-sensor, y=0.08 m geometry looks like overshoot.


      The oval failures are mostly off-track exits (7 of 20 in Iteration 2), while
      the oval mean finish time of about 1.80 s leaves about 1.2 s of margin under
      the 3.0 s limit. The completion term is worth 500 points, so a faster platform
      is the cheapest route to more finished runs on the held-back tracks. Wheel radius
      sets ground speed for a given wheel rotation rate, so raising it from 0.035
      to 0.040 m should lift average speed by about 14% without touching the controller.
      The sensor layout is kept at the Iteration 2 values so this race isolates the
      drivetrain change. I expect oval completion to rise if the robot is speed-limited,
      but the risk is more off-track exits in bends, which is what I will look for
      in the telemetry.


      - [Open this output](iteration-4/entity0/versions/4fd07d366a7a418f9ffa57f42c660f6e/payload.json)

      - Based on: [entityR2A](iteration-4/entityR2A/versions/carried-a7286ab5b380ef49/payload.json)'
  - id: entity1
    label: Seven-sensor forward
    notes: 'Builder''s y=0.08 m, ±0.054 m, 16 mm seven-sensor geometry on the iteration
      2 drivetrain, with weights scaled to x/0.027 and kp raised to 4.5 to hold steering
      gain. Based on iteration 2 scoring 329 with 65% oval finish.


      ### Rationale


      Iteration 2 is the best evidence so far: forward sensors at y=0.07 m with a
      16 mm footprint raised the score from 128 to 329, and oval finish rate rose
      from 5% to 65%. Iteration 1 showed that spreading the sensors alone (±0.036
      m) did not reduce line losses, so the Builder''s move to y=0.08 m and ±0.054
      m across seven sensors is a sensible next step. I keep the iteration 2 drivetrain
      (track 0.10 m, radius 0.035 m, mass 0.6 kg) so the sensor geometry is the only
      variable. For the seven-sensor array at 0.018 m pitch, I scale weights as x/0.027
      so the outer sensors (±0.054 m) reach ±2 without clipping and the inner sensors
      keep a smooth gradient: [-2, -1.333, -0.667, 0, 0.667, 1.333, 2]. Compared with
      the 0.018 m scaling used at ±0.036 m, the signal per metre of offset falls by
      about one third, so I raise kp from 3.5 to 4.5 to hold steering gain. The forward
      offset of 0.08 m adds phase lead, so I keep kd at 0.5 rather than raising it
      further, because iteration 2 showed oscillation of about 0.28 on the oval. ki
      stays at 0.05 and base_speed at 1.6 to isolate the sensing change. line_loss
      stays at last_direction, which is the only setting tested so far. Expected result,
      untested: fewer line-loss events and lower max_error on s-bend and slalom than
      iteration 2, with oval finish rate at or above 65%.


      - [Open this output](iteration-3/entity1/versions/29402fd8687c4a5288bbb073edcd9b21/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/b91d84a1a01d4816a0fa01f9b356b231/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-51d8fda8f707e100/payload.json)'
  - id: entityR1
    label: Look-ahead and mass next
    notes: 'Pre-race feedback: keep the forward look-ahead if oscillation stays under
      0.3, otherwise back to y=0.06 m, and try mass 0.5 kg or wheel_track 0.09 m if
      line losses persist. Evidence is iterations 0 to 2.


      ### Feedback


      Written before this candidate has raced. Iteration 2 (y=0.07 m, 16 mm, ±0.036
      m) is the only design that improved on the baseline: score 329 against 140 and
      128, oval finish rate 65%, and s-bend progress 0.45. Iteration 1 showed that
      spread alone (±0.036 m at y=0.04 m) did not reduce line losses (1.05 to 1.1
      per run) and cut oval progress, so look-ahead is the lever that has paid off.
      Iteration 2 also showed steering_oscillation of about 0.28 on the oval and 0.29
      on the s-bend, so the forward offset is close to the oscillation limit at kd
      0.5. My integration compensation for this geometry is to scale sensor weights
      to x/0.027 (not x/0.018) so the outer sensors are not clipped, and to raise
      kp to 4.5 to hold steering gain with the wider spread. Depending on the next
      race: if line_loss_events fall below 1.0 on s-bend and slalom while steering_oscillation
      stays at or under 0.3, keep y=0.08 m and try the next step on mass (0.5 kg)
      to reduce lag. If steering_oscillation rises above 0.3 while line losses fall,
      move the forward offset back to y=0.06 m with the same spread, because the iteration
      2 oscillation level suggests the forward lead is what overshoots. If line losses
      stay at 1.0 or more and max_error stays near 0.06 m with no oscillation, the
      limit is actuator lag, not sensing, so change the drivetrain (wheel_track or
      mass) rather than adding more sensors.


      ### Requested changes


      - If the next race shows line_loss_events below 1.0 on s-bend and slalom and
      steering_oscillation at or below 0.3, keep sensor y at 0.08 m and reduce mass
      from 0.6 to 0.5 kg. Iteration 2 showed that look-ahead cuts max_error, and the
      remaining limit looks like lag.

      - If steering_oscillation rises above 0.3 on any track while line losses fall,
      move all sensor y values from 0.08 to 0.06 m with the same ±0.054 m seven-sensor
      spread. Iteration 2 already reached 0.28 to 0.29 oscillation at y=0.07 m, so
      the forward lead is the source of overshoot.

      - If line_loss_events stay at 1.0 or more and max_error stays near 0.06 m with
      no oscillation, keep the sensor geometry and try wheel_track 0.09 m for faster
      turn response. Iterations 1 and 2 showed that spread and footprint changes alone
      did not remove line losses, so the next lever is drivetrain turn authority.


      - [Open this output](iteration-3/entityR1/versions/29402fd8687c4a5288bbb073edcd9b21/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/b91d84a1a01d4816a0fa01f9b356b231/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-51d8fda8f707e100/payload.json)'
