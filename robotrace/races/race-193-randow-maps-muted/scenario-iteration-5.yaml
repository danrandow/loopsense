map:
  id: race-193-randow-maps-muted
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Lighter body, mass 0.5 kg
    notes: 'Keeps the iteration 4 sensor and wheel layout, the best design so far
      at 372.6, and cuts mass from 0.6 to 0.5 kg to reduce yaw inertia on the s-bend
      and slalom. The evidence is that iteration 4 finished 80% of oval runs but still
      left the bends off track at the 0.06 m limit.


      ### Rationale


      Iteration 4 is the best design so far (372.6). Its only change from iteration
      2 was wheel radius 0.035 to 0.040 m. The oval finish rate rose from 65% to 80%,
      mean completion time fell to 1.875 s, and oval progress reached 0.97. The s-bend
      and slalom still end at the 0.06 m off-track limit with progress of 0.57 and
      0.14. Their max_error sits at the limit, and s-bend steering_oscillation is
      high at 0.32. Earlier results show that spread alone (iteration 1) and extra
      look-ahead with seven sensors (iteration 3) did not help. The sensor layout
      is therefore kept at the iteration 4 values, which is the best-supported configuration.
      The remaining bottleneck on the bends looks like inertia and lag: the robot
      cannot turn fast enough once the line drifts. Yaw inertia is mass*(L^2+W^2)/12,
      so reducing mass from 0.6 to 0.5 kg lowers the turning inertia by about 17%
      with no change to sensing. Expected result: a smaller max_error and a higher
      s-bend progress, with the oval finish rate held at 80% or better. I am changing
      one variable, so any shift in results can be attributed to mass.


      - [Open this output](iteration-5/entity0/versions/29c9924e42e34138956b26ad0a0fc8fd/payload.json)

      - Based on: [entityR2A](iteration-5/entityR2A/versions/carried-c8824fe5c922d2f2/payload.json)'
  - id: entity1
    label: Mass 0.5 kg robot package
    notes: 'Iteration 4 geometry with mass cut from 0.6 to 0.5 kg and the controller
      held fixed, so the mass change is the only variable. Based on iteration 4 (score
      372.6), where s-bend and slalom max_error sat at the 0.06 m limit.


      ### Rationale


      Iteration 4 is the best design so far (score 372.6): 5 sensors at y=0.07 m,
      16 mm footprint, track 0.10 m, wheel radius 0.040 m, mass 0.6 kg. Its oval finish
      rate was 80% at 1.875 s mean time, but s-bend and slalom still reached the 0.06
      m off-track limit (max_error 0.063 and 0.066). Iteration 3 showed that adding
      sensors and moving them to y=0.08 m raised oscillation and lowered the oval
      finish rate, so I keep the iteration 4 sensor layout. The Builder''s single-variable
      test is mass 0.6 to 0.5 kg. Yaw inertia falls by about 17%, so the bends should
      be tracked with less lag. Lower inertia also makes the same gains respond faster,
      which may add oscillation. I therefore keep the iteration 4 controller unchanged
      (kp 3.5, ki 0.05, kd 0.5, base_speed 1.6, weights [-2,-1,0,1,2], last_direction).
      That isolates the mass change, so any shift in results can be attributed to
      it. Expected result: s-bend and slalom max_error below the 0.06 m limit with
      fewer slalom line losses, and an oval finish rate of at least 80%. I have not
      measured this and do not state an outcome.


      - [Open this output](iteration-5/entity1/versions/55ab671b7e1b41438b46ca3dc8ed997b/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/29c9924e42e34138956b26ad0a0fc8fd/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-c8824fe5c922d2f2/payload.json)'
  - id: entityR1
    label: Mass and track feedback
    notes: 'Pre-race feedback: keep the iteration 4 sensor layout and test narrower
      track or controller damping depending on the next race. Evidence comes from
      iteration 3 (sensors at y=0.08 m raised oscillation and cut the oval finish
      rate) and iteration 4 (s-bend and slalom still at the off-track limit).


      ### Feedback


      Written before this candidate has raced. Iteration 4 (score 372.6) is the best
      design: oval finish 80%, s-bend and slalom max_error still at the 0.06 m limit
      (0.063 and 0.066), and slalom line losses at 2.0 per run. Iteration 2 showed
      that the 0.07 m forward sensors with 16 mm footprints gave the first real gain.
      Iteration 3 showed that moving to y=0.08 m with seven sensors raised steering_oscillation
      from about 0.28 to 0.36 and cut the oval finish rate to 35%, so look-ahead beyond
      0.07 m is not paying off. Iteration 1 showed that widening the spread alone
      did not reduce line losses. Integration compensation: I kept the iteration 4
      controller unchanged (kp 3.5, kd 0.5), so the mass change is isolated. Lower
      mass may make the same gains respond faster and add oscillation, so I am watching
      that risk. Depending on the next race: if s-bend and slalom max_error drops
      below 0.06 m with line losses falling and steering_oscillation at or below 0.3,
      keep mass at 0.5 kg and narrow the track to 0.09 m for more turn authority.
      If steering_oscillation rises above 0.32 while max_error does not move, the
      limit is controller gain, not geometry, and I will retune kd on the controller
      side rather than change the sensors. If the oval finish rate falls below 80%
      with off-track exits rising, the lighter robot is being outrun at radius 0.040
      m, so return mass to 0.6 kg and keep the mass change out of the next test.


      ### Requested changes


      - If s-bend and slalom max_error falls below 0.06 m with line_loss_events below
      1.0 on the slalom, keep mass at 0.5 kg and narrow wheel_track from 0.10 to 0.09
      m. Iteration 4 showed the bends still reach the off-track limit, so more turn
      authority is the next lever.

      - If steering_oscillation rises above 0.32 on the bends while max_error does
      not move, keep the Iteration 4 sensor layout and let the Integrator retune controller
      damping. Iteration 3 showed that extra look-ahead (y=0.08 m) raised oscillation
      to 0.36 and lowered the oval finish rate, so do not move the sensors forward
      again.

      - If the oval finish rate drops below 80% with off-track exits rising, return
      mass to 0.6 kg and keep wheel_radius at 0.040 m. Iteration 4 showed the 0.040
      m radius lifted the oval finish rate to 80%, so that gain should be protected.


      - [Open this output](iteration-5/entityR1/versions/55ab671b7e1b41438b46ca3dc8ed997b/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/29c9924e42e34138956b26ad0a0fc8fd/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-c8824fe5c922d2f2/payload.json)'
