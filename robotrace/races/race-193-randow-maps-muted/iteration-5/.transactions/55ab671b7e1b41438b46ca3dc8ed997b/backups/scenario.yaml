  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Lighter body, mass 0.5 kg
    notes: 'Keeps the iteration 4 sensor and wheel layout, the best design so far
      at 372.6, and cuts mass from 0.6 to 0.5 kg to reduce yaw inertia on the s-bend
      and slalom. The evidence is that iteration 4 finished 80% of oval runs but still
      left the bends off track at the 0.06 m limit.


      ### Rationale


      Iteration 4 is the best design so far (372.6). Its only change from iteration
      2 was wheel radius 0.035 to 0.040 m. The oval finish rate rose from 65% to 80%,
      mean completion time fell to 1.875 s, and oval progress reached 0.97. The s-bend
      and slalom still end at the 0.06 m off-track limit with progress of 0.57 and
      0.14. Their max_error sits at the limit, and s-bend steering_oscillation is
      high at 0.32. Earlier results show that spread alone (iteration 1) and extra
      look-ahead with seven sensors (iteration 3) did not help. The sensor layout
      is therefore kept at the iteration 4 values, which is the best-supported configuration.
      The remaining bottleneck on the bends looks like inertia and lag: the robot
      cannot turn fast enough once the line drifts. Yaw inertia is mass*(L^2+W^2)/12,
      so reducing mass from 0.6 to 0.5 kg lowers the turning inertia by about 17%
      with no change to sensing. Expected result: a smaller max_error and a higher
      s-bend progress, with the oval finish rate held at 80% or better. I am changing
      one variable, so any shift in results can be attributed to mass.


      - [Open this output](iteration-5/entity0/versions/29c9924e42e34138956b26ad0a0fc8fd/payload.json)

      - Based on: [entityR2A](iteration-5/entityR2A/versions/carried-c8824fe5c922d2f2/payload.json)'
  - id: entity1
    label: Wheel radius 0.040 test
    notes: 'Iteration 2 robot with only wheel_radius raised from 0.035 to 0.040 m,
      controller unchanged, so the drivetrain change is isolated. Based on Iteration
      2 (score 329, oval finish 65%), the best result so far.


      ### Rationale


      Iteration 2 is still the best design (score 329, oval finish rate 65%, oval
      mean finish time 1.80 s). Entity0 changes only wheel_radius, from 0.035 to 0.040
      m, and keeps every other geometry field at the Iteration 2 values. Because the
      sensor layout, track, mass and body are unchanged, the radius change is the
      only variable in this race. Raising the radius raises ground speed per wheel
      rotation by about 14%. Iteration 2 showed oval off-track exits (7 of 20) while
      the finish time left about 1.2 s of margin, so the speed gain is the lever being
      tested. I keep the Iteration 2 controller exactly (base_speed 1.6, kp 3.5, ki
      0.05, kd 0.5, weights [-2,-1,0,1,2], last_direction). Changing the controller
      in the same race would confound the test. Weights match the 0.036 m spread via
      x/0.018, as in Iterations 1 and 2. Expected result: a higher oval finish rate
      and lower completion_time than Iteration 2. Off-track exits in bends are the
      main risk, and the telemetry will show whether they rise. Nothing about this
      robot''s performance has been measured yet.


      - [Open this output](iteration-4/entity1/versions/335ade5c2ce44a4bac1618bc42744e3c/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/4fd07d366a7a418f9ffa57f42c660f6e/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-a7286ab5b380ef49/payload.json)'
  - id: entityR1
    label: Next steps by race result
    notes: 'Feedback tied to Iteration 2 and Iteration 3 evidence, with changes to
      try depending on whether the oval finish rate and off-track exits move. Written
      before the radius 0.040 m robot has raced, so it states no outcome for it.


      ### Feedback


      Written before this robot has raced. Iteration 2 (5 sensors at y=0.07 m, 16
      mm, track 0.10 m, radius 0.035 m, mass 0.6 kg) is the best design so far: score
      329, oval finish rate 65%, oval mean finish 1.80 s, 7 of 20 oval runs off track.
      Iteration 3 (7 sensors at y=0.08 m) lowered the oval finish rate to 35% and
      raised steering_oscillation from about 0.28 to 0.36 on the oval, so extra look-ahead
      and spread did not help as a package. Iteration 1 showed that spread alone did
      not cut line losses. The Integrator has kept the controller unchanged from Iteration
      2, so this geometry''s effect on speed is isolated. Depending on the next race:
      if the oval finish rate rises above 65% with off-track exits falling, the speed
      limit is the bottleneck, so raise wheel_radius further to 0.045 m. If the oval
      finish rate rises but off-track exits also rise with max_error near 0.043 m,
      the speed is outrunning steering, so reduce mass to 0.5 kg or widen wheel_track
      to 0.11 m rather than adding speed. If steering_oscillation stays near 0.28
      and the finish rate does not move, the geometry is not the bottleneck and the
      next change should be the controller, not the sensors.


      ### Requested changes


      - If the oval finish rate rises above 65% with fewer off-track exits, raise
      wheel_radius from 0.040 to 0.045 m. Iteration 2 showed the oval finish time
      has about 1.2 s of margin, so more ground speed is the cheapest route to more
      finished runs.

      - If off-track exits rise on the oval while max_error stays near 0.043 m, reduce
      mass from 0.6 to 0.5 kg with wheel_radius 0.040 m. Iteration 3 showed that extra
      steering load (more sensors and higher oscillation) lowered finish rate, so
      reducing inertia should help the same bends at higher speed.

      - If steering_oscillation stays near 0.28 and the finish rate does not move,
      keep the Iteration 2 sensor layout (5 sensors, y=0.07 m, 16 mm) and widen wheel_track
      from 0.10 to 0.11 m for yaw stability. Iterations 1 and 3 showed that changing
      the sensor layout alone did not improve the finish rate.


      - [Open this output](iteration-4/entityR1/versions/335ade5c2ce44a4bac1618bc42744e3c/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/4fd07d366a7a418f9ffa57f42c660f6e/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-a7286ab5b380ef49/payload.json)'
