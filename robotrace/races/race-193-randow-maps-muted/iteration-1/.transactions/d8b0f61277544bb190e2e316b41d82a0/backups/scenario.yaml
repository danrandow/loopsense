overrides:
  entities:
  - id: entity0
    label: Wider spread, tighter
    notes: 'Widens the sensor array to ±0.036 m and tightens track to 0.10 m, with
      larger wheels and lower mass. The baseline lost the line past about 0.042 m
      offset (max_error ~0.06 m, 1 to 1.35 line losses per run), and this change targets
      that failure.


      ### Rationale


      The baseline reached the off-track limit (0.06 m) on every development track.
      Max error averaged about 0.06 m, and line-loss events averaged 1.0 to 1.35 per
      run. The sensor footprints are 12 mm, so the outer sensors stop seeing tape
      once the line moves about 0.042 m off centre (0.024 spread + 0.0125 half-tape
      + 0.006 half-footprint). Beyond that the controller is blind, which matches
      the line losses. The off-track limit is max(0.06, 0.0125 + body_width/4). With
      body_width at most 0.18 that gives at most 0.0575, so the limit stays at 0.06
      m whatever body width I choose. Body width therefore does not help, and I leave
      it at 0.12. Changes for this iteration: (1) widen the sensor spread to ±0.036
      m (5 sensors, 18 mm pitch). This keeps tape visible to about 0.054 m offset,
      which should cut line-loss events and keep the robot on the line through bends.
      (2) Reduce wheel_track from 0.12 to 0.10 m. For the same wheel-speed difference,
      turn rate rises by about 20 percent, so the robot can follow tighter bends.
      (3) Raise wheel_radius from 0.03 to 0.035 m, which increases ground speed per
      unit of wheel rotation, to help the 1.5 m/s average needed to finish in 3 s.
      (4) Lower mass from 0.8 to 0.6 kg to reduce inertia in bends. Expected result:
      fewer line-loss events, a lower max_error on s-bend and slalom, and a higher
      progress on oval. Finishing on the s-bend and slalom is still unlikely until
      the integrator tunes the controller.


      - [Open this output](iteration-1/entity0/versions/498dacb1c263437493eded377c782299/payload.json)

      - Based on: [entityR2A](iteration-1/entityR2A/versions/carried-e1bec54f7a77775d/payload.json)'
  - id: entity1
    label: Complete Robot Package
    notes: 'Complete Robot Package. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      This is iteration 0, so there is no race telemetry or earlier integration feedback.
      I kept the Builder''s baseline geometry exactly (five sensors at y=0.04, x from
      -0.024 to 0.024, 12 mm footprints, track 0.12 m, wheel radius 0.03 m, mass 0.8
      kg) so the controller is designed for that geometry. Sensor weights are the
      sensor''s lateral position scaled to [-2, 2] (x/0.012, clipped), so a positive
      signal (tape on the left) steers left, as the contract requires. Sensor spacing
      of 0.012 m matches the 0.012 m footprint, so the tape always covers at least
      one or two sensors. kp=3 gives a maximum turn of 6 (about 2100 PWM of differential),
      which is strong enough for the bends without saturating. kd=0.3 damps oscillation
      from the 10 ms loop. ki=0.05 is small to avoid windup on long bends. base_speed=1.6
      gives 80% PWM, which should reach the roughly 1.5 m/s needed to finish in 3
      s, leaving headroom for slowing on tight bends. line_loss=''last_direction''
      keeps the robot turning toward the side it last saw the tape, which suits a
      line that leaves on one side. Expected result: completion on the development
      tracks with moderate line error. This is untested and will be revised after
      the race.


      - [Open this output](iteration-0/entity1/versions/0ce9a7207ca94bc98259ed6e3004bb05/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/427b2b39c417455ab19def4acbe891af/payload.json)'
  - id: entityR1
    label: Integration Feedback
    notes: 'Integration Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      No race evidence exists yet: this is iteration 0 and the Builder''s baseline
      has never raced, so every claim below is a reasoned expectation, not a measurement.
      Compensation I had to make: the sensor weights are scaled from lateral position
      (x/0.012, clipped to [-2, 2]) because the five sensors span only 0.048 m, and
      the 12 mm footprint means adjacent sensors overlap the tape together. Controller
      choices that depend on geometry: kp=3 and kd=0.3 were set because the 0.12 m
      track and 0.8 kg mass give moderate yaw authority. If the next race (iteration
      0 results) shows steering_oscillation high or max_error rising on bends, then
      the forward offset is too large or the sensors respond too late: reduce sensor
      y from 0.04 toward 0.02 and reduce the track to 0.10 m so the turn response
      is quicker. If line_loss_events are high on the tight bends (the robot leaves
      the tape at the edge of the 0.048 m spread), then widen the spread to about
      0.064 m (x of ±0.032 is outside the allowed range, so use ±0.030 with 5 sensors)
      to see the line for longer. If completion_time is over 3 s with no oscillation
      or loss, then reduce mass toward 0.6 kg to speed acceleration, since the controller
      can keep base speed at 1.6 without extra correction.


      ### Requested changes


      - If steering_oscillation is high in the next race, move all sensor y values
      from 0.04 to 0.02 (forward offset down) and keep the rest fixed, because a sensor
      closer to the axle reacts later and reduces the overshoot the controller must
      damp.

      - If line_loss_events are high on tight bends, widen the sensor lateral spread
      to x = ±0.030 (about 0.06 m total span) in place of ±0.024, since the baseline
      0.048 m span loses the tape when the line drifts at the edge of the sensor array.

      - If completion_time exceeds 3 s without line loss, reduce mass from 0.8 to
      0.6 kg, since lower yaw inertia and mass should let the robot reach the 1.5
      m/s average speed sooner.


      - [Open this output](iteration-0/entityR1/versions/0ce9a7207ca94bc98259ed6e3004bb05/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/427b2b39c417455ab19def4acbe891af/payload.json)'
