  id: race-115-randow-maps
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: 16mm footprints at ±0.06m
    notes: 'Keeps the ±0.06 m span that removed s-bend and slalom line losses (0.0
      per run in iteration 5) and changes only sensor_size to 0.016 m. The remaining
      failure is drifting to the 0.06 m edge while still on the tape, and oval oscillation
      is 0.327, just above the 0.3 limit, so larger footprints should smooth the centroid.


      ### Rationale


      Iteration 5 (±0.06 m outer sensors, ±0.03 m inner, 12 mm footprints, y 0.04
      m, 12 cm track) scored 151.91, the best so far. The evidence changed from the
      pre-race feedback. Line losses on s-bend and slalom fell from 0.9 to 1.0 per
      run to 0.0, and oval losses stayed at 0.0. The span change therefore did what
      it was meant to do. The remaining failure is different: every s-bend and slalom
      trial still ends off track (progress 0.18 and 0.12). Max_error sits at about
      0.061 m, which is the off-track floor, while the tape is still being read. So
      the robot is drifting to the edge while still on the line, rather than losing
      the tape. Body width cannot move this floor: max(0.06, 0.0125 + body_width/4)
      is still 0.06 m even at the 0.18 m maximum body width. Oval steering oscillation
      is 0.327, just above the 0.3 limit, while s-bend and slalom oscillation is about
      0.15, so the controller has room on the tight tracks. I keep the ±0.06 m span,
      which removed the losses, and change one variable: sensor_size from 0.012 m
      to 0.016 m. Larger footprints overlap more, so each sensor''s reading changes
      more smoothly as the edge of the tape crosses it. That should give the controller
      an earlier and smoother centroid on bends, which may reduce the drift to the
      edge and the oval jitter. Position, count, wheel_track (0.12 m) and y (0.04
      m) stay fixed, since earlier tests showed narrowing the track or moving forward
      cut oval progress. Expected result: s-bend and slalom max_error below 0.06 m,
      or at least runs that progress further before going off track, with oval oscillation
      at or below 0.3 and oval progress holding near 0.7. Risk: a larger footprint
      may blur the centroid on gentle bends and reduce oval progress.


      - [Open this output](iteration-6/entity0/versions/f78446aafb8b4738a45441b0b83ac3bc/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-38a092eed6880949/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-0659ec223b648e6b/payload.json)'
  - id: entity1
    label: 16mm footprint at ±0.06m
    notes: 'Iteration 5 geometry with sensor_size raised from 12 mm to 16 mm, controller
      unchanged. Iteration 5 removed s-bend and slalom line losses (0.0 per run) but
      every run still ended at about 0.061 m max_error, so the footprint is the one
      variable tested.


      ### Rationale


      Iteration 5 is the best race so far (151.91). The ±0.06 m outer span removed
      line losses on s-bend and slalom (0.0 per run, down from 0.9 to 1.0), and oval
      finished 1 of 20 trials with progress 0.71. The remaining failure is that every
      s-bend and slalom trial still ends off track at max_error about 0.061 m, so
      the robot drifts to the edge while still reading the tape. Oval steering oscillation
      is 0.327, just above the 0.3 target. The Builder''s single change is sensor_size
      from 0.012 m to 0.016 m, with the span, y, wheel_track and body unchanged. I
      keep the iteration 5 controller exactly (kp 1.0, kd 0.2, ki 0.05, base_speed
      1.0, last_direction, weights [-2,-1,0,1,2]). Changing gains at the same time
      as the footprint would make it impossible to attribute the result. Base speed
      is not the constraint: the oval finish took 1.94 s, under the 3 s limit. Larger
      footprints overlap more, so the centroid should change more smoothly as the
      tape edge crosses each sensor. That may reduce the edge drift and the oval jitter,
      but it may also blur the centroid on gentle bends. The expected result is that
      s-bend and slalom max_error stays below 0.06 m or runs progress further, with
      oval oscillation at or below 0.3 and oval progress near 0.7. The main risk is
      that oval progress falls, which the Builder''s fallback rule covers.


      - [Open this output](iteration-6/entity1/versions/8c3c93d6de794f578685cc4842df2466/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/f78446aafb8b4738a45441b0b83ac3bc/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-0659ec223b648e6b/payload.json)'
  - id: entityR1
    label: Edge-fix branches, no
    notes: 'Feedback gives the next move for each outcome: inner sensors to ±0.04
      m if edge drift persists, or revert to 12 mm if oval oscillation exceeds 0.33
      or progress falls below 0.5. It rules out the wheel_track and y changes that
      cut oval progress in iterations 3 and 4.


      ### Feedback


      Written before this candidate has raced. Iteration 5 (±0.06 m outer, ±0.03 m
      inner, 12 mm footprints, y 0.04 m, 12 cm track) scored 151.91, the best so far,
      and removed s-bend and slalom line losses (0.0 per run, from 0.9 to 1.0). Every
      s-bend and slalom trial still ended off track at max_error about 0.061 m, so
      the failure is now edge drift on the line, not tape loss. Oval oscillation was
      0.327 and oval progress 0.71. Iteration 2 at ±0.05 m with 12 mm footprints gave
      oval oscillation 0.27, so the wider span and the footprint both affect jitter.
      The controller was held at the iteration 5 gains, so no compensation was needed
      beyond that. For this candidate, the outcome is not yet known. If the next race
      shows s-bend and slalom losses still at 0 and max_error still about 0.061 m,
      the sensor layout is the limit at the edge: change the inner sensors to x =
      ±0.04 m at sensor_size 0.016 m, since the remaining failure is at the edge,
      not in the loss logic. If oval oscillation rises above 0.33 or oval progress
      falls below 0.5, the 16 mm footprint is blurring the centroid, so revert sensor_size
      to 0.012 m and keep the ±0.06 m span. If s-bend or slalom losses return above
      0 at this footprint, the larger footprint is pulling the signal, so revert to
      0.012 m. Do not retry the other levers: iteration 3 (wheel_track 0.10 m) cut
      oval progress from 0.51 to 0.14, and iteration 4 (y 0.06 m) cut oval progress
      to 0.20 while leaving slalom losses at 1.0.


      ### Requested changes


      - Keep sensor_size 0.016 m with outer sensors at x = ±0.06 m and inner at ±0.03
      m, y 0.04 m. If s-bend and slalom losses stay at 0 with max_error still about
      0.061 m, next move the inner sensors to x = ±0.04 m at the same footprint, since
      iteration 5 showed the span removes the losses and the remaining failure is
      at the edge.

      - If oval steering_oscillation rises above 0.33 or oval progress falls below
      0.5 (iteration 5 gave 0.327 and 0.71), revert sensor_size to 0.012 m with the
      ±0.06 m span, since the larger footprint may be blurring the centroid on gentle
      bends.

      - Do not retry wheel_track 0.10 m or y 0.06 m. Iteration 3 cut oval progress
      from 0.51 to 0.14 at 0.10 m, and iteration 4 cut oval progress to 0.20 at y
      0.06 m, with slalom losses unchanged at 1.0 in both.


      - [Open this output](iteration-6/entityR1/versions/8c3c93d6de794f578685cc4842df2466/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/f78446aafb8b4738a45441b0b83ac3bc/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-0659ec223b648e6b/payload.json)'
