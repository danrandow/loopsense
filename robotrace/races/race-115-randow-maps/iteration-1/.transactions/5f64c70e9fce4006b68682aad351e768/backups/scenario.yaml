  id: race-115-randow-maps
  schema: v0.2
  scenario: Iteration 1
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 0.
dimensions:
  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Widen sensor span to 8 cm
    notes: 'Moves the outer sensors from ±0.03 to ±0.04 m to keep the tape under a
      sensor when the robot is pushed off the line on bends. The baseline showed one
      line loss per run and every run ending off-track at the 0.06 m limit, and body
      width cannot change that limit within range.


      ### Rationale


      The baseline race result is a complete failure on all three development tracks:
      every trial ended off track (20 of 20 per track, finish rate 0). Each trial
      shows exactly one line-loss event, max_error sits at about 0.061 m, and progress
      stalls at 0.11 to 0.16. Steering oscillation is low (0.08 to 0.16) and rms_error
      is small (about 0.03), so the robot is not jittering or wandering. It is being
      thrown off the line in a single excursion that reaches the 0.06 m off-track
      floor. The off-track limit is max(0.06, tape_half_width + body_width/4). With
      body_width at 0.12 m that gives 0.06 m. Widening the body cannot raise it, because
      the body would need to exceed 0.19 m, which is out of range. The only lever
      on this failure is keeping the tape under the sensors, so I am changing the
      sensor geometry first. The 6 cm span (x = ±0.03) is the one dimension that the
      Integrator''s feedback flagged as possibly losing the tape on bends. I widen
      the outer sensors to x = ±0.04 and set the inner ones at ±0.02 and 0, keeping
      five sensors at 2 cm spacing and the 12 mm footprint. The 8 cm span is the allowed
      x limit. I keep the drivetrain unchanged so that this race isolates the sensing
      effect. I expect line_loss_events to drop toward zero and max_error to fall
      below 0.06 on the tightest bends, which should let runs reach the finish. The
      main risk is that a wider span weakens the centroid on gentle bends, which the
      next race should show.


      - [Open this output](iteration-1/entity0/versions/0fd6b70ac985448db75a655d72d6ef78/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-00d8eb98c7daf12b/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-06194566d16e27c0/payload.json)'
  - id: entity1
    label: 8cm span, tuned
    notes: 'Builder''s 8 cm sensor span paired with kp 1.0, kd 0.2 and base_speed
      1.0 to counter the single line-loss excursion per run seen in iteration 0 (max_error
      about 0.061 m). Drivetrain and footprints unchanged so the race isolates sensing.


      ### Rationale


      Iteration 0 raced all 60 trials with every run ending off track after one line-loss
      event (max_error about 0.061 m, progress 0.11 to 0.16, finish rate 0). Steering
      oscillation (0.08 to 0.16) and rms_error (about 0.03) are small, so the robot
      is not jittering or wandering. It is thrown off in one excursion past the 0.06
      m floor. The Builder''s geometry change widens the outer sensors to x = ±0.04
      with inner sensors at ±0.02 and 0, keeping 12 mm footprints and the drivetrain
      fixed, so this race isolates sensing span. Sensor weights stay at [-2,-1,0,1,2],
      which keeps the signal scale consistent with the old span. With the wider span,
      the signal is driven harder by a given lateral offset, so I keep kp near its
      previous value but raise it slightly to 1.0 so the robot turns back sooner when
      the tape leaves the outer sensors. I raise kd from 0.1 to 0.2 to damp the faster
      correction and avoid overshoot, which would otherwise cross the line. I lower
      base_speed from 1.2 to 1.0 to shorten the time between a loss beginning and
      the correction, since the excursion is what ends runs. The cost is possibly
      slower finishes, so if no run finishes, base_speed is the next thing to revisit.
      ki stays at 0.05 and line_loss stays ''last_direction'', which suits losses
      that happen on bends. Expected result: line_loss_events falls toward zero and
      max_error drops below 0.06 on the tightest bends. Risk: the wider span may weaken
      the centroid on gentle bends, which the race''s rms_error should show.


      - [Open this output](iteration-1/entity1/versions/bc364e87de0741b3be772f0dc73d25ed/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/0fd6b70ac985448db75a655d72d6ef78/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-06194566d16e27c0/payload.json)'
  - id: entityR1
    label: Span and drivetrain steps
    notes: 'Feedback written before racing: iteration 0 showed one line loss per run
      with low jitter, so the sensor span is the main lever. Requested changes are
      tied to iteration 0 max_error, rms_error and steering_oscillation values.


      ### Feedback


      Written before this candidate has raced. Iteration 0 (no prior race evidence
      for the controller) showed every trial on all three development tracks ending
      off track after exactly one line-loss event, with max_error about 0.061 m, progress
      0.11 to 0.16, and finish rate 0. Steering oscillation was low (0.08 to 0.16)
      and rms_error small (about 0.03), so the failure is a single excursion past
      the 0.06 m off-track floor, not jitter. The floor is max(0.06, 0.0125 + body_width/4),
      which at body_width 0.12 gives 0.06 m, so the sensor layout is the lever. The
      8 cm span in this proposal is designed to keep tape under a sensor on bends.
      If the next race shows line_loss_events at 0 and max_error below 0.06 on the
      tight bends while rms_error stays near 0.03 on gentle bends, keep the span at
      ±0.04 and move on to drivetrain. If line losses persist on the tightest bends
      (first loss still occurs and max_error still reaches 0.06), widen the outer
      sensors further. If rms_error rises on gentle bends with losses gone, the span
      is now too coarse, so narrow the inner spacing rather than the outer reach.


      ### Requested changes


      - If line_loss_events is still at least 1 per run on the tightest bends (iteration
      1 with the 8 cm span), widen the outer sensors to about x = ±0.05 with inner
      sensors at ±0.025, since iteration 0 showed the 6 cm span failing with one excursion
      per run.

      - If line losses are gone but rms_error rises above about 0.04 on gentle bends
      (iteration 0 rms_error was about 0.03), keep the outer sensors at ±0.04 and
      reduce wheel_track to 0.10 m for sharper turning only if completion_time remains
      a limit, since iteration 0 showed low steering oscillation (0.08 to 0.16), which
      points to a responsiveness limit, not jitter.

      - If the signal jitters as tape crosses between sensors (steering_oscillation
      rising well above the iteration 0 range of 0.08 to 0.16), test sensor_size 0.016
      m, which overlaps neighbouring sensors more and smooths the centroid, and check
      whether rms_error improves.


      - [Open this output](iteration-1/entityR1/versions/bc364e87de0741b3be772f0dc73d25ed/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/0fd6b70ac985448db75a655d72d6ef78/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-06194566d16e27c0/payload.json)'
