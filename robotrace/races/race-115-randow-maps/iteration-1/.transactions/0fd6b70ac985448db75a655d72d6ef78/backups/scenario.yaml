overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor
    notes: 'Balanced first design: five 12 mm sensors spaced 1.5 cm across 6 cm, 4
      cm ahead of the axle, with mid-range wheels, track, body and mass. No race evidence
      yet, so this is a baseline to measure against.


      ### Rationale


      Iteration 0 has no race telemetry or integration feedback yet, so this is a
      baseline chosen for a line follower rather than one fitted to evidence. Five
      sensors spread across 6 cm of width give a clear centroid for the Integrator
      to work with while keeping the tape inside the sensor span on bends. The sensors
      sit 4 cm ahead of the axle so they see the line before the wheels reach it,
      which leaves time to correct steering. A 12 mm footprint is about half the 25
      mm tape width, so a single sensor can read partial coverage and the signal varies
      smoothly as the line moves under it. Track 0.12 m and radius 0.03 m are mid-range,
      giving a moderate turn authority and a speed capability well above the 1.5 m/s
      the course needs. Mass 0.8 kg and body width 0.12 m are moderate, and the 0.12
      m width keeps the off-track limit at about 0.06 m. I expect this to complete
      the oval with few line losses. The main risks are weak response on tight slalom
      bends and sensor saturation on the widest turns, which the next race should
      show.


      - [Open this output](iteration-0/entity0/versions/3a86a7d68bf24f51bf2f77ee92836018/payload.json)'
  - id: entity1
    label: Baseline robot package
    notes: 'Balanced Builder geometry with a conservative PD controller and linearly
      weighted sensors, chosen from the contract physics because no race data exists
      yet. Expect the next race to show whether the tight slalom sections limit steering.


      ### Rationale


      Iteration 0 has no race telemetry or integration feedback, so the controller
      is a conservative baseline built from the contract''s physics and sensing rules,
      not tuned to evidence. The Builder''s geometry is kept unchanged so the race
      measures that geometry directly. Sensor weights are proportional to each sensor''s
      lateral position (-2, -1, 0, 1, 2 across x = -0.03 to 0.03), so a positive signal
      (left) comes from tape on the left and a negative signal (right) from tape on
      the right. With kp 0.8, a full-edge signal of about 2 gives turn about 1.6,
      a wheel differential near 560 PWM, which is strong without saturating. kd 0.1
      damps oscillation without amplifying sensor noise much, and ki 0.05 stays small
      to avoid windup on long bends. base_speed 1.2 gives a base PWM of about 60 percent,
      which should cover the course in under 3 s if the bends allow it. line_loss
      ''last_direction'' steers back toward the side the tape was last seen, which
      suits a line that is lost on a bend. I expect this to complete the oval with
      few line losses, with steering limited by the tight slalom sections.


      - [Open this output](iteration-0/entity1/versions/2758dfa71fb5400788a2de585e47d327/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/3a86a7d68bf24f51bf2f77ee92836018/payload.json)'
  - id: entityR1
    label: Baseline geometry
    notes: 'No race has run, so the feedback names the sensor span and drivetrain
      as the first levers and gives race-conditional changes. The requested changes
      are tied to line-loss, oscillation and jitter evidence the next race should
      provide.


      ### Feedback


      No race evidence exists yet, so this is based only on the geometry as proposed.
      Five sensors at 1.5 cm spacing across 6 cm give a clear centroid, and the 4
      cm forward offset gives time to react before the wheels reach the line. The
      main open question is whether the 6 cm span loses the line on the tightest bends.
      If the next race shows frequent line_loss_events on tight bends (cite the line_loss_events
      and max_error for those bends), widen the sensor span toward 0.08 m (the x limit)
      or move the outer sensors outward. If the race shows high steering_oscillation
      with few line losses, the sensors are fine and the drivetrain is the limit:
      reduce the wheel_track toward 0.10 m so the robot turns more sharply, or keep
      the layout and change only the drivetrain. If rms_error is high on gentle bends
      with no oscillation, the robot is sluggish: reduce wheel_track or increase wheel_radius
      only after checking that completion_time still meets the 3 s limit.


      ### Requested changes


      - If line_loss_events is above zero on the tightest bends, widen the sensor
      span: set the outer sensor x positions to about -0.04 and 0.04 (sensor_size
      0.012 kept), since the 6 cm span may lose the tape on sharp curves.

      - If steering_oscillation is high with few line losses, try wheel_track 0.10
      m (radius 0.03 m kept), because a narrower track gives sharper response, provided
      completion_time stays under 3 s.

      - If sensor readings jitter when tape crosses between sensors, test sensor_size
      0.016 m, since larger footprints overlap more and smooth the signal, and report
      whether rms_error improves.


      - [Open this output](iteration-0/entityR1/versions/2758dfa71fb5400788a2de585e47d327/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/3a86a7d68bf24f51bf2f77ee92836018/payload.json)'
