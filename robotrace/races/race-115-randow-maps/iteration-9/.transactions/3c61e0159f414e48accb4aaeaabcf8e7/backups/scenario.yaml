map:
  id: race-115-randow-maps
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Mass 0.5 kg step
    notes: 'Keeps the iteration 8 layout and changes only mass from 0.6 to 0.5 kg,
      following the Integrator''s rule to test the next mass step after iteration
      8 raised oval progress to 0.89 with oscillation at 0.316. Revert to 0.6 kg if
      oval progress falls below 0.5 or oscillation exceeds 0.33.


      ### Rationale


      Iteration 8 (mass 0.6 kg, otherwise iteration 5) is the best measured design
      at 257.45. Oval progress rose from 0.71 to 0.89 and 10 of 20 oval runs finished.
      Oval steering oscillation fell from 0.327 to 0.316, still under the 0.33 revert
      line. Slalom and s-bend line losses stayed at 0, and max_error dropped to 0.0603
      m on s-bend and 0.0615 m on slalom, so the lighter mass helped the drift cases.
      The Integrator''s rule for this outcome is to keep the lower mass and test the
      next step. I therefore set mass to 0.5 kg and change nothing else. Sensor layout
      (outer ±0.06 m, inner ±0.03 m, y 0.04 m), 12 mm footprints, 12 cm track, 3 cm
      wheel radius and body are all fixed, so any change comes from yaw inertia alone.
      Expected result: s-bend and slalom max_error below 0.060 m or further progress
      with losses still at 0, and oval progress holding at or above 0.8. The main
      risk is that oval oscillation crosses 0.33 as the robot gets lighter. Oscillation
      has been falling with mass so far, so I expect it to hold. If oval progress
      falls below 0.5 or oscillation rises above 0.33, revert to 0.6 kg, which is
      now the best measured mass; 0.8 kg is no longer the fallback. Iteration 7''s
      inner ±0.04 m result and the rejected options in the Integrator''s notes are
      not retried.


      - [Open this output](iteration-9/entity0/versions/f2ce76e13f1840cb9315a6405ec68cc6/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-0645a1c0d74d5ce1/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-a2f30530fa0d21fc/payload.json)'
  - id: entity1
    label: Mass 0.5 kg, same
    notes: 'Iteration 9 package: the Builder''s 0.5 kg mass on the iteration 8 geometry,
      with the iteration 8 controller unchanged to isolate the mass effect. Based
      on iteration 8 (257.45), where 0.6 kg lifted oval progress from 0.71 to 0.89.


      ### Rationale


      The Builder''s proposal is the iteration 5 geometry with mass lowered from 0.8
      kg to 0.5 kg, the sensor layout, footprint and drivetrain unchanged. Iteration
      8 (0.6 kg, otherwise iteration 5) is the best measured design at 257.45. Lowering
      mass from 0.8 to 0.6 kg raised oval progress from 0.71 to 0.89, brought oval
      finishes from 1 to 10 of 20, cut oval steering oscillation from 0.327 to 0.316,
      and held oval and s-bend line losses at 0. Edge drift on s-bend and slalom also
      fell slightly (max_error 0.0603 and 0.0615 m, against about 0.061 m at 0.8 kg).
      Yaw inertia is the only lever changed, so the controller stays exactly as in
      iteration 8 (kp 1.0, ki 0.05, kd 0.2, base_speed 1.0, last_direction, weights
      [-2,-1,0,1,2]). Changing gains now would confound the mass effect. The 0.5 kg
      step is the Builder''s proposal and is expected to hold oval progress near 0.9
      with oscillation at or below 0.33. The main risk is that oscillation rises as
      the robot gets lighter, which would trigger the revert to 0.6 kg. Base speed
      is not a constraint: the 0.8 kg oval finish took 1.94 s, under the 3 s limit.


      - [Open this output](iteration-9/entity1/versions/74ed5db2ee94440ba676eb3239d81aa6/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/f2ce76e13f1840cb9315a6405ec68cc6/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-a2f30530fa0d21fc/payload.json)'
  - id: entityR1
    label: Mass step with revert
    notes: 'Pre-race feedback: continue the mass trend to 0.5 kg, with revert to 0.6
      kg if oval progress drops below 0.5 or oscillation exceeds 0.33. Cites iterations
      4, 6, 7 and 8 for the rejected levers and the mass gain.


      ### Feedback


      Written before this candidate has raced. Iteration 8 (0.6 kg, otherwise iteration
      5) is the best measured design at 257.45. Lowering mass from 0.8 to 0.6 kg raised
      oval progress from 0.71 to 0.89, brought oval finishes to 10 of 20, reduced
      oval oscillation from 0.327 to 0.316, and lowered s-bend and slalom max_error
      to 0.0603 and 0.0615 m, with line losses still 0. Yaw inertia is therefore a
      working lever that does not touch the sensors. Iteration 5 (0.8 kg) remains
      the reference for these comparisons. Iteration 6 (16 mm footprint) cut oval
      progress to 0.51 and iteration 7 (inner sensors at ±0.04 m) cut it to 0.22,
      so neither geometry should be retried. This candidate continues the mass trend
      to 0.5 kg. If the next race shows oval progress at or above 0.8 with oscillation
      at or below 0.33 and line losses at 0, keep lowering mass in small steps. If
      oval progress falls below 0.5 or oscillation rises above 0.33, the lighter robot
      is overshooting, so return to 0.6 kg. If s-bend and slalom still reach about
      0.060 m with losses at 0, the mass gain has flattened, so the controller response
      is the next limit to address, not the geometry.


      ### Requested changes


      - Set mass to 0.5 kg with the iteration 8 layout unchanged (outer ±0.06 m, inner
      ±0.03 m, y 0.04 m, 12 mm footprints, 12 cm track, 3 cm radius). Iteration 8
      showed mass 0.8 to 0.6 kg raised oval progress from 0.71 to 0.89 and lowered
      s-bend and slalom max_error, so the trend is measured, not guessed.

      - If oval progress falls below 0.5 or oval steering_oscillation rises above
      0.33 (iteration 8 gave 0.316), return mass to 0.6 kg, since iteration 8 is the
      best measured design and lost oval progress costs more than edge gain.

      - Do not retry inner ±0.04 m (iteration 7 oval progress 0.22), sensor_size 0.016
      m (iteration 6 oval progress 0.51), wheel_track 0.10 m (iteration 3 oval progress
      0.14) or y 0.06 m (iteration 4 oval progress 0.20). Each was rejected by earlier
      evidence.


      - [Open this output](iteration-9/entityR1/versions/74ed5db2ee94440ba676eb3239d81aa6/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/f2ce76e13f1840cb9315a6405ec68cc6/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-a2f30530fa0d21fc/payload.json)'
