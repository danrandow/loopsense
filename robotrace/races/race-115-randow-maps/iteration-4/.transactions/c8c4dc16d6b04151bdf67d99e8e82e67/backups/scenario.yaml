map:
  id: race-115-randow-maps
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Forward sensors, 12cm
    notes: 'Reverts wheel_track to 0.12 m, the best-scoring setting (124.6), and moves
      the sensor row forward to y 0.06 m as a single-variable test. Iteration 3 showed
      the 0.10 m track cut oval progress and lowered the score to 62.6, while slalom
      line losses stayed at 1.0 across every span and track change.


      ### Rationale


      Iteration 3 (wheel_track 0.10 m) scored 62.6, below iteration 2''s 124.6, so
      the narrower track is not an improvement. Oval progress fell from 0.51 to 0.14
      and oval line losses went to 0, but the robot still ended off track. Oscillation
      dropped to about 0.07 on oval, so the robot is no longer wobbling, but it is
      not covering the course. S-bend progress fell from 0.27 to 0.19, and slalom
      stayed at 1.0 line loss per run with progress about 0.12. The best-scoring design
      so far is iteration 2: 10 cm span, 12 cm track, 12 mm footprints. I revert wheel_track
      to 0.12 m to recover that baseline. Slalom losses have persisted at about 1.0
      per run through every span and track change (max_error about 0.061 to 0.064
      m), which suggests the sensors see the tape too late on the slalom bends. The
      Integrator''s feedback has not yet tested a forward shift, so I make that the
      single change from the best baseline: move all five sensors forward from y 0.04
      m to y 0.06 m, within the allowed range. I expect slalom and s-bend line losses
      to fall below 1.0 per run and progress to rise from the iteration 2 values,
      because the robot reacts earlier. The risk is that the forward offset adds overshoot
      on the oval, where oscillation was already 0.27. If oscillation exceeds 0.3
      again, the next lever is sensor_size 0.016 m.


      - [Open this output](iteration-4/entity0/versions/b8a27379a1cb4c358ef7c31fba21e606/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-14144165daa576ae/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-5be00d53ca101c80/payload.json)'
  - id: entity1
    label: Narrow track, kp 0.9
    notes: 'Pairs the Builder''s 0.10 m wheel_track with kp lowered from 1.0 to 0.9
      to offset the sharper turn response. Iteration 2 showed slalom and s-bend losses
      persisting at 10 cm span with oscillation up to 0.27.


      ### Rationale


      Iteration 2 is the best evidence so far (score 124.6). Widening the span to
      10 cm (outer sensors at ±0.05 m) cut oval line losses from 1.0 to 0.05 per run,
      but slalom stayed at 1.0 and s-bend at 0.9, with max_error still about 0.061
      to 0.064 m. Steering oscillation rose to 0.23 to 0.27 on oval and s-bend, above
      the 0.08 to 0.16 seen before. The Builder''s proposal changes one variable,
      wheel_track from 0.12 m to 0.10 m, which is the drivetrain branch the Integrator
      specified for persistent losses. I keep that geometry unchanged. Turn rate is
      the wheel speed difference divided by wheel_track, so a 0.10 m track gives about
      20 percent more turn authority for the same wheel command. To avoid adding overcorrection
      on top of the oscillation already seen, I reduce kp from 1.0 to 0.9. That leaves
      the effective steering gain near 1.08 times the 0.12 m value, not 1.2 times.
      kd 0.2 stays to damp the faster response. ki 0.05, base_speed 1.0 and last_direction
      stay as they were, so this race changes only the drivetrain and the one gain
      that compensates for it. Expected result: slalom and s-bend line losses fall
      below 1.0 per run, and steering_oscillation stays below about 0.3. Runs are
      still unlikely to finish within 3 s at base_speed 1.0, so completion_time remains
      a constraint to watch.


      - [Open this output](iteration-3/entity1/versions/017e05aeccf5441eacdf55282d8ee0f9/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/1f5041b7daf0478795fb7284696caab8/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-e735997e6ea956c3/payload.json)'
  - id: entityR1
    label: Track 0.10 then smoothing
    notes: 'Feedback is written before the race and gives conditional next steps:
      keep wheel_track 0.10 m if losses fall, try 0.09 m if they persist, and test
      sensor_size 0.016 m if oscillation rises above 0.3. Based on iterations 0 to
      2.


      ### Feedback


      Written before this candidate has raced. Iteration 2 (10 cm span, wheel_track
      0.12) reduced oval line losses to 0.05 per run, but slalom stayed at 1.0 and
      s-bend at 0.9, with max_error still about 0.061 to 0.064 m. Span from 6 to 10
      cm is therefore not the full fix on tight bends, so the drivetrain is the next
      variable. Oscillation rose to 0.23 to 0.27 on oval and s-bend, above the 0.08
      to 0.16 range of iterations 0 and 1. If the next race shows slalom and s-bend
      line losses below 1.0 per run with max_error below 0.06 m and oscillation at
      or below about 0.3, keep wheel_track 0.10 m and keep the span. If losses stay
      at about 0.9 to 1.0 per run with max_error near 0.06 m, the response is still
      too slow, so narrow wheel_track further. If oscillation rises above 0.3 while
      losses persist, the turn is overcorrecting, so keep wheel_track 0.10 m and move
      the sensor footprint rather than the drivetrain.


      ### Requested changes


      - Keep the 10 cm span and set wheel_track to 0.10 m (iteration 2 showed slalom
      and s-bend losses stayed at 0.9 to 1.0 per run at 0.12 m). If losses fall below
      1.0 per run, keep it; if they stay at about 1.0 with max_error near 0.06 m,
      try wheel_track 0.09 m next.

      - If steering_oscillation rises above 0.3 with losses still present (iteration
      2 gave 0.23 to 0.27), test sensor_size 0.016 m, since iteration 2''s oscillation
      range suggests jitter as tape crosses the footprints, and report whether rms_error
      and oscillation both improve.

      - If line losses still occur at the same bend after the drivetrain change, test
      moving the sensors forward from y 0.04 m to y 0.06 m (within the allowed range),
      so the robot reacts earlier. This is a hypothesis not yet tested in any iteration,
      so report the step and bend of the first loss to confirm it.


      - [Open this output](iteration-3/entityR1/versions/017e05aeccf5441eacdf55282d8ee0f9/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/1f5041b7daf0478795fb7284696caab8/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-e735997e6ea956c3/payload.json)'
