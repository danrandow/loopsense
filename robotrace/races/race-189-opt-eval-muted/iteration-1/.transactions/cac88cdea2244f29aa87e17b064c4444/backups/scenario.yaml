overrides:
  entities:
  - id: entity0
    label: Tighter sensors, gentler
    notes: 'Iteration 0 left the track in all 60 trials, with max error at the 0.06
      m limit and a line loss early in each run. This candidate uses 8 mm sensors
      spaced 8 mm apart, lower speed (1.5), kp 2.0, kd 0.2 and ki 0.05 to reduce overshoot,
      and a lighter 0.7 kg body.


      ### Rationale


      Evidence: every trial in iteration 0 left the track (off_track 60/60). Progress
      was only 0.04 to 0.115, and max_error reached about 0.061, just past the 0.06
      m off-track limit. Each run recorded one line-loss event, so the robot lost
      the tape early and never recovered. Steering error (rms 0.029) was not the main
      failure. The likely causes are an aggressive gain/speed combination (kp 3.0
      at base_speed 1.7 with a weak kd of 0.05) that overshoots on each bend, and
      12 mm sensors spaced 12 mm apart, which blur the line edge.


      Changes: (1) Sensors: spacing reduced to 8 mm (x = -0.016 to +0.016) with 8
      mm footprints. This gives a sharper, less averaged position estimate, and the
      outer sensors still see the tape edge. (2) base_speed 1.7 to 1.5: less centrifugal
      drift and overshoot, while still close to the speed needed to finish. (3) kp
      3.0 to 2.0: smaller turn per unit of signal, which reduces oscillation. (4)
      kd 0.05 to 0.2: more damping of the correction. (5) ki 0.1 to 0.05: less integral
      lag on bends. (6) mass 0.8 to 0.7 and body_width unchanged: lighter body responds
      faster to steering. Sensor weights and line_loss are kept so the change in steering
      response can be isolated.


      Expected result: fewer off-track ends, with progress rising toward completion
      on oval and s-bend. Hypotheses to test: H1, the off-track failures come from
      overshoot at bends (so lower kp and higher kd should help). H2, the 12 mm sensor
      blur contributes to the early line loss. The measurements requested will show
      whether max_error and line_loss_events drop and whether steering_oscillation
      falls. If the robot now stays on track but finishes too slowly, the next step
      is to raise base_speed.


      - [Open this output](iteration-1/entity0/versions/a221401d61b54ac8b2ed71fef7b5cc29/payload.json)

      - Based on: [entityR2A](iteration-1/entityR2A/versions/carried-3d1575180c9509a7/payload.json)'
  - id: entityR1
    label: Evaluator Feedback
    notes: 'Evaluator Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Iteration 0 has no race telemetry, so this review rests only on the contract
      and the candidate''s contents. The candidate is valid: all sensor positions
      are inside the allowed x and y ranges, sensor_size 0.012 is an allowed option,
      the five sensor_weights are in [-2, 2] with antisymmetric signs (positive x
      steers left, so the signs are consistent), and kp, ki, kd, base_speed and line_loss
      are all in range. Nothing is obviously broken. Two points to watch once it races.
      (1) base_speed 1.7 gives a PWM base of about 0.85, and the course must be covered
      in under 3.0 s (about 1.5 m/s average). If completion_time is near or above
      3 s with no line loss, speed is the limit, not steering. (2) With kp 3.0 and
      kd 0.05, the slalom is the most likely place for overshoot and oscillation.
      If steering_oscillation is high or max_error is large on the slalom, damping
      is the limit. Because no race has happened, I cannot say how this design will
      perform. The next race will decide the next revision, so approve now to get
      telemetry rather than spend two action runs on a revision with no evidence to
      guide it.


      ### Requested changes


      - If the race shows completion_time above about 2.8 s with no line-loss events
      and completion, raise base_speed in steps (for example 1.7 to 1.9), since speed
      rather than steering is then the limit.

      - If the race shows steering_oscillation or max_error high on the slalom or
      s-bend, raise kd (for example 0.05 to 0.15) before changing kp, so the damping
      is tested without making the response sluggish.

      - If line_loss_events is above zero on tight bends, change line_loss or reduce
      base_speed before changing the gains, since losing the line at speed is the
      failure to fix first.


      - [Open this output](iteration-0/entityR1/versions/6387c2dcb2c6466aba9162b33308b838/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/3816ef92a154460b8f99afe86ac6d526/payload.json)'
