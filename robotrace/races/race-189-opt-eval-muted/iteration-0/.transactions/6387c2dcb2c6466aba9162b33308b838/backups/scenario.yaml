  entities:
  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'First candidate built from the contract alone, with no race data yet.
      It uses a symmetric five-sensor array, base speed 1.7, and moderate PID gains
      (kp 3.0, ki 0.1, kd 0.05). It is meant to establish whether speed or steering
      is the limit.


      ### Rationale


      Iteration 0 has no race telemetry or Evaluator feedback, so this is a conservative
      baseline built from the contract. Geometry: five sensors spaced 12 mm apart
      across x = -0.024 to +0.024 m (the tape is 25 mm wide, so the outer sensors
      can see the edge), placed 0.03 m ahead of the axle so steering reacts before
      the wheels reach the line. A 12 mm footprint keeps the readings smooth. Wheel
      track 0.12 m, radius 0.03 m, and mass 0.8 kg give a stable, moderately responsive
      body. Controller: antisymmetric weights [-2,-1,0,1,2] make the signal proportional
      to lateral error with the correct sign (positive x steers left). base_speed
      1.7 is high enough to cover the course in under 3 s (about 1.5 m/s average needed)
      while leaving margin for bends. kp 3.0 gives a firm correction without saturating
      the wheels on normal errors. ki 0.1 is small, to avoid integral windup on long
      bends. kd 0.05 damps the oscillation that kp alone would cause. line_loss ''last_direction''
      lets the robot search toward the side it was last on. Expected result: completion
      on the development tracks with a moderate rms_error and few line-loss events.
      Expected weak points: overshoot in the slalom and possible speed loss in tight
      bends. The next race should show whether speed or steering is the limit.


      - [Open this output](iteration-0/entity0/versions/3816ef92a154460b8f99afe86ac6d526/payload.json)'
