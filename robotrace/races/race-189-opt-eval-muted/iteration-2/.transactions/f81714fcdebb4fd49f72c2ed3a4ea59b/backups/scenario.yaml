map:
  id: race-189-opt-eval-muted
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: 7-sensor wider-view tune
    notes: 'Seven 8 mm sensors spanning ±0.024 m at y=0.05, with kp raised to 2.5,
      kd lowered to 0.1, and base_speed 1.6. This addresses the line loss and off-track
      failures seen in both prior races (max_error about 0.06 m, 1 to 2 line-loss
      events per run).


      ### Rationale


      Evidence: all 60 development trials in iterations 0 and 1 ended off_track with
      no finishes. Progress was only 0.04 to 0.21, max_error sat at about 0.061 to
      0.064 (just past the 0.06 m limit), and line_loss_events were 1 to 2 per run.
      Steering error was not the main failure. Iteration 1 (kp 2.0, kd 0.2, 8 mm sensors)
      scored 65.9, better than iteration 0 (kp 3.0, kd 0.05, 12 mm sensors, 26.0),
      but steering_oscillation rose with the higher kd. The off-track limit is max(0.06,
      0.0125 + body_width/4), so body_width cannot widen it past 0.06 within the allowed
      range. The robot must therefore keep its error under 0.06 m.


      Diagnosis: the outer sensors at x = ±0.016 barely overlap the 25 mm tape edge
      (it reaches x = ±0.0125), so the robot has little warning and loses the line
      once it drifts sideways. Sensors at y = 0.03 also react late at speed.


      Changes: (1) Seven sensors at 8 mm spacing from x = -0.024 to +0.024, with 8
      mm footprints. This widens the detection window to about ±0.036 m of offset,
      so the line is less often lost on a drift and the signal stays informative.
      (2) Sensors moved to y = 0.05 so steering starts earlier and offsets the motor
      lag at speed. (3) Weights [-2, -1.3, -0.6, 0, 0.6, 1.3, 2] keep the signal proportional
      to lateral error and bounded by 2. (4) base_speed 1.5 to 1.6 to close the progress
      gap, still under full PWM. (5) kp 2.0 to 2.5 for a firmer correction now that
      sensing is wider. (6) kd 0.2 to 0.1 to cut the jitter that kd 0.2 introduced.
      (7) ki kept low at 0.05 to avoid lag on bends. Mass 0.7, track 0.12, radius
      0.03, and line_loss ''last_direction'' are kept so the change in sensing and
      gains can be isolated.


      Expected result: max_error below 0.06 on oval and s-bend, fewer line-loss events
      (target 0 or 1), lower steering_oscillation than iteration 1, and progress above
      0.5. Hypotheses to test: H1, the 12 mm to 8 mm sensor change with seven sensors
      removes most line loss. H2, the forward sensor offset reduces overshoot at bends.
      H3, lower kd reduces oscillation without losing damping. Next measurements to
      check these: line_loss_events per track, max_error on s-bend and slalom, steering_oscillation,
      and progress. If the robot stays on track but is slow, raise base_speed; if
      it still drifts, try raising kp before raising kd.


      - [Open this output](iteration-2/entity0/versions/ea3921d1d3a54fd7ac6d18da8a31ecf6/payload.json)

      - Based on: [entityR2A](iteration-2/entityR2A/versions/carried-c733ff43f7e14c9f/payload.json)'
  - id: entityR1
    label: 'Approve:'
    notes: 'Approved the iteration-1 candidate (8 mm sensors, kp 2.0, kd 0.2, base_speed
      1.5) because it is valid and responds directly to iteration 0, where every trial
      went off track with one line loss. Written before racing, so the feedback states
      no results; it names what to change for each race outcome.


      ### Feedback


      The candidate is valid. All sensor positions are inside the allowed x and y
      ranges, sensor_size 0.008 is an allowed option, the weights are antisymmetric
      in [-2, 2], and kp, ki, kd, base_speed and line_loss are in range. Nothing is
      obviously broken. It is a reasonable response to iteration 0, where all 60 trials
      ended off_track with one line-loss event each (progress 0.04 to 0.115, max_error
      about 0.061). Those failures came early, so the first priority is keeping the
      robot on the tape. The candidate targets that by moving to 8 mm sensors, lowering
      kp from 3.0 to 2.0, raising kd from 0.05 to 0.2, and lowering base_speed from
      1.7 to 1.5. The changes are made together, so the race will not show which one
      matters most.


      Two risks to watch. (1) base_speed 1.5 gives a PWM base of about 0.75. The course
      needs an average of roughly 1.5 m/s to finish in 3.0 s, so the robot may stay
      on track and still time out or stall without completing. (2) kp 2.0 gives a
      weaker correction per unit of signal. If the robot stays on track but drifts
      wide on bends, the gain is too low, not too high.


      This is early exploration with 10 iterations left, and the candidate is a sensible
      step from a field that has not yet completed a track. Approving gets telemetry,
      which will sharpen the next critique more than another round of review on numbers
      alone. The next revision should depend on what the race shows, as set out in
      the requested changes.


      ### Requested changes


      - If the race shows max_error still above 0.06 with line_loss_events of 1 or
      more and progress stalling early, go back toward kp 2.5 with kd 0.2 and keep
      the 8 mm sensors. Iteration 0 showed the 0.06 m off-track limit is reached early,
      so the line must be kept on the bends.

      - If the robot stays on track but completion_time is above about 2.8 s or the
      run ends by stall with progress well below 1, raise base_speed in steps (1.5
      to 1.7) while keeping kd at 0.2. Iteration 0 needed about 1.5 m/s to finish,
      so speed is then the limit.

      - If line_loss_events stays at 1 per run with the line lost on the first bend,
      try line_loss ''search_right'' or ''search_left'' in place of ''last_direction''
      before changing the gains, to test whether the search direction is the cause.


      - [Open this output](iteration-1/entityR1/versions/cac88cdea2244f29aa87e17b064c4444/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/a221401d61b54ac8b2ed71fef7b5cc29/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-3d1575180c9509a7/payload.json)'
