overrides:
  entities:
  - id: entity0
    label: Iter 7 baseline, resubmit
    notes: 'Resubmits the best measured design (iteration 7, score 125.3) unchanged.
      Every single change tried from it since then (kd, kp with narrower track, 16
      mm footprint, lower speed) scored lower, so no untested change is risked on
      the final race.


      ### Rationale


      Evidence: all 300 development trials so far ended off_track with no finishes.
      Max_error sits at 0.060 to 0.066 on nearly every design, with 1 to 2 line-loss
      events per run, so the robot loses the tape in bends and drifts past the 0.06
      m limit. The best measured design is iteration 7 (score 125.3): 12 mm footprints,
      five sensors at x = -0.02 to +0.02 (10 mm spacing), y = 0.03, kp 3.0, ki 0.4,
      kd 0.35, base_speed 1.3, mass 0.6, wheel_track 0.12, line_loss last_direction.
      Every change tried from it has scored lower: widening the span alone (iteration
      5), kd 0.45 (jitter, iteration 6), kp 3.5 with a narrower track (iteration 8,
      108.4), a 16 mm footprint (iteration 9, 84.4), and base_speed 1.15 (iteration
      10, 108.5). Iteration 10 also shows that lowering speed does not stop the line
      loss, so speed is not the fix. Because this is the final iteration and the final
      unseen-track race is scored from this design, I am not making an untested change.
      I resubmit iteration 7 unchanged. Expected result: about the same as iteration
      7, with the oval progress near 0.6. Hypotheses to test: H1, the loss at bends
      comes from sensing reach, not from gain, so a sensor with more lateral reach
      would hold the line. H2, the 0.06 m limit is reached in a single bend before
      the search can recover. Measurements wanted: max_error and line_loss_events
      per track to locate the loss, and steering_oscillation to check jitter.


      - [Open this output](iteration-11/entity0/versions/09d1b04a6e9a46c8b0395342fc747d72/payload.json)

      - Based on: [entityR2A](iteration-11/entityR2A/versions/carried-0c199d8313710a97/payload.json)'
  - id: entityR1
    label: Approve iteration 7
    notes: 'Approved the unchanged iteration 7 design, the best raced score (125.3),
      because iterations 8 to 10 each changed one or two variables from it and all
      scored lower. This is the final iteration, so no revision could be tested. Evidence:
      the outcome table and scoreboard.


      ### Feedback


      This is the final iteration, so no later revision can use the race result. The
      candidate is identical to iteration 7, the best raced design (125.3), which
      is the only design with oval progress above 0.5 at base_speed 1.3 (iteration
      7 oval progress 0.61). Iterations 8, 9 and 10 each changed one or two variables
      from this base (kp 3.5 with wheel_track 0.11 at 108.4; 16 mm footprint at 84.4;
      base_speed 1.15 at 108.5) and all scored lower, so the base has not been beaten
      by any tested single change. The candidate is valid: five 12 mm sensors at x
      = -0.02 to +0.02 and y = 0.03 are within range, the weights are antisymmetric
      in [-2, 2], and kp, ki, kd, base_speed, mass, wheel_track and line_loss are
      in range. Nothing is obviously broken. Every design so far (iterations 0 to
      10) ended off_track on every trial, with max_error at 0.060 to 0.068 and 1 to
      2 line-loss events, so the known weakness (line loss at bends) is still unsolved,
      but no untested change has evidence strong enough to justify a revision with
      no race left to check it. Approving the best raced design is the lower-risk
      choice for the unseen-track race, which is scored from this design.


      ### Requested changes


      - No change is requested for this final race. The candidate should race unchanged,
      because iteration 7 is the best raced design and each tested change from it
      (iterations 8, 9 and 10) scored lower.

      - For the record only: the next untested lever would be kp alone (3.0 to 3.5)
      with the 12 mm footprint, wheel_track 0.12 and base_speed 1.3 held, since iteration
      8 confounded kp 3.5 with the 0.11 m track. This cannot be tested in this iteration,
      so it is noted for the team''s records.


      - [Open this output](iteration-11/entityR1/versions/e6dd5d7b84bd48e094670f8e43b44440/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/09d1b04a6e9a46c8b0395342fc747d72/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-0c199d8313710a97/payload.json)'
