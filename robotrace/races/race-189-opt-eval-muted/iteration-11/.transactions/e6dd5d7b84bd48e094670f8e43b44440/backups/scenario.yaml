overrides:
  entities:
  - id: entity0
    label: Iter 7 baseline, resubmit
    notes: 'Resubmits the best measured design (iteration 7, score 125.3) unchanged.
      Every single change tried from it since then (kd, kp with narrower track, 16
      mm footprint, lower speed) scored lower, so no untested change is risked on
      the final race.


      ### Rationale


      Evidence: all 300 development trials so far ended off_track with no finishes.
      Max_error sits at 0.060 to 0.066 on nearly every design, with 1 to 2 line-loss
      events per run, so the robot loses the tape in bends and drifts past the 0.06
      m limit. The best measured design is iteration 7 (score 125.3): 12 mm footprints,
      five sensors at x = -0.02 to +0.02 (10 mm spacing), y = 0.03, kp 3.0, ki 0.4,
      kd 0.35, base_speed 1.3, mass 0.6, wheel_track 0.12, line_loss last_direction.
      Every change tried from it has scored lower: widening the span alone (iteration
      5), kd 0.45 (jitter, iteration 6), kp 3.5 with a narrower track (iteration 8,
      108.4), a 16 mm footprint (iteration 9, 84.4), and base_speed 1.15 (iteration
      10, 108.5). Iteration 10 also shows that lowering speed does not stop the line
      loss, so speed is not the fix. Because this is the final iteration and the final
      unseen-track race is scored from this design, I am not making an untested change.
      I resubmit iteration 7 unchanged. Expected result: about the same as iteration
      7, with the oval progress near 0.6. Hypotheses to test: H1, the loss at bends
      comes from sensing reach, not from gain, so a sensor with more lateral reach
      would hold the line. H2, the 0.06 m limit is reached in a single bend before
      the search can recover. Measurements wanted: max_error and line_loss_events
      per track to locate the loss, and steering_oscillation to check jitter.


      - [Open this output](iteration-11/entity0/versions/09d1b04a6e9a46c8b0395342fc747d72/payload.json)

      - Based on: [entityR2A](iteration-11/entityR2A/versions/carried-0c199d8313710a97/payload.json)'
  - id: entityR1
    label: 'Approve: slower 1.15 test'
    notes: 'Approved the iteration 10 candidate, which is iteration 7 with base_speed
      cut from 1.3 to 1.15 as a single-variable test of speed-driven bend drift. Evidence:
      all designs so far end off_track with max_error near 0.06 and 1 to 2 line-loss
      events, and iteration 7 (125.3) is the best raced base.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      candidate is valid and is iteration 7 (best raced, 125.3) with one change: base_speed
      1.3 to 1.15. Sensors (five 12 mm footprints at x = -0.02 to +0.02, y = 0.03),
      weights, kp 3.0, ki 0.4, kd 0.35, mass 0.6, wheel_track 0.12 and last_direction
      are all held, so any change in result should come from speed. Nothing is obviously
      broken.


      The evidence supports testing speed. Every design so far (iterations 0 to 9)
      has ended off_track on every trial, with max_error at 0.060 to 0.068 and 1 to
      2 line-loss events per run. Iteration 7 is the only design with oval progress
      above 0.5 at 1.3 and has line loss of 1.0 on s-bend. Iteration 3 showed that
      lower speed with higher ki reduced drift slightly. Iterations 8 and 9 both moved
      away from iteration 7 and scored lower, so the controller and sensing at iteration
      7 are the best current base. Centrifugal drift at bends scales with speed squared,
      so a small speed cut is a plausible way to keep the robot inside the 0.06 m
      band.


      The risk is progress. Iteration 6 at base 1.2 reached only 0.49 on oval, and
      the course needs about 1.5 m/s to finish, so a cut to 1.15 may lower progress
      and the 250 times progress term with it, even if line loss falls. The race will
      show whether that trade is worth it. Approving is right here: the change is
      clean, the base is the best raced, and there is one iteration left after this,
      so telemetry from this race is worth more than a revision made without it.


      What to change next depends on the race. If line_loss_events fall to 1 or fewer
      on oval and s-bend and max_error drops below 0.06, but oval progress falls below
      about 0.5, raise base_speed toward 1.3 to 1.4 in steps. If max_error still reaches
      0.06 with line loss unchanged, speed is not the limit: keep 1.3 and raise kp
      alone toward 3.5 with the 12 mm footprint and wheel_track 0.12 held, since iteration
      8''s kp change was confounded with the track change. If the score falls below
      iteration 7 (125.3) with no drop in line loss, return to base_speed 1.3 for
      the final iteration.


      ### Requested changes


      - If line_loss_events are 1 or fewer on oval and s-bend but oval progress falls
      below about 0.5, raise base_speed in steps toward 1.3 to 1.4, since iteration
      7 at 1.3 reached 0.61 oval progress and iteration 6 at 1.2 reached only 0.49.

      - If max_error still reaches 0.06 with line loss unchanged at base_speed 1.15,
      revert base_speed to 1.3 and raise kp alone from 3.0 toward 3.5 with sensor_size
      0.012 and wheel_track 0.12 held, because iteration 8''s kp 3.5 result was confounded
      with the 0.11 m track.

      - If the score falls below iteration 7 (125.3) with no drop in line_loss_events,
      revert base_speed to 1.3 for the final iteration, since iteration 7 is the best
      raced design and speed is the only variable changed here.


      - [Open this output](iteration-10/entityR1/versions/34be0229be2441498ecac959ae8d114a/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/c5c5102b355b4409839f5ef1e8c22b20/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-6f391ed7fd87fc0c/payload.json)'
