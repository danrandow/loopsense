map:
  id: race-135-randow-maps
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Turn-response geometry
    notes: 'Keeps the ±0.08 m sensor array that removed line loss in iteration 3,
      and narrows the track and shortens and lightens the body to turn more readily.
      Evidence: iteration 3 had zero line-loss events but max_error at the 0.06 m
      floor, so the remaining failure is drift in the steering response.


      ### Rationale


      Iteration 3 (±0.08 m span, 0.04 m spacing, 0.016 m footprint) fixed the line
      loss it was designed to fix. The s-bend and slalom now have 0 line-loss events
      per run, down from 0.6 and 0.95, and rms_error fell to 0.021 to 0.022. The score
      still fell from 272 to 210 because the oval finish rate dropped from 55% to
      45%. Every track still ends off_track, with max_error 0.062 to 0.062 at the
      0.06 m floor, and progress on the s-bend and slalom is only 0.18 and 0.09. The
      robot now stays on the tape but drifts past the 0.06 m limit without losing
      sight of it, so the limit is now the robot''s steering response, not sensing
      coverage. Oval steering_oscillation fell to 0.16, so the sensor-lead change
      (y 0.05 to 0.03) is not triggered. Moving the sensors would not address drift
      that is not oscillation, so I leave y unchanged. body_width cannot help, since
      the off-track limit is already at its floor. Geometry can change turning response:
      turn rate is the wheel-speed difference divided by wheel_track, so a narrower
      track gives more turn per PWM count. Yaw inertia is mass*(L²+W²)/12, so a shorter,
      lighter body turns more readily. I therefore keep the validated sensor array
      (±0.08 at 0.04 m, 0.016 m footprint) and reduce wheel_track from 0.12 to 0.10
      m, body_length from 0.16 to 0.12 m, and mass from 0.8 to 0.7 kg. Expected result:
      max_error below 0.06 m on the s-bend and slalom, progress rising on those tracks,
      and the oval finish rate at or above the 55% of iteration 2. The risk is more
      steering gain, which may raise oval steering_oscillation above 0.25; if it does,
      the next step is sensor y 0.05 to 0.03.


      - [Open this output](iteration-4/entity0/versions/8d6adb839f2f453e80f52a349be28bf4/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-67eaa1f1f704b058/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-3b354ba2ccf219c6/payload.json)'
  - id: entity1
    label: Narrow, light chassis v4
    notes: 'Runs the Builder''s narrower (0.10 m track), shorter and lighter chassis
      on the validated ±0.08 m array, with kd raised to 0.9 for damping. Based on
      iteration 3, where line loss was solved but drift past 0.06 m remained.


      ### Rationale


      Iteration 3 (±0.08 m span, 0.04 m spacing, 0.016 m footprint) removed line loss
      on the s-bend and slalom (0 events per run, down from 0.6 and 0.95), but every
      track still ends off_track at the 0.06 m max_error floor, with progress only
      0.18 on the s-bend and 0.09 on the slalom. The robot stays on the tape but drifts
      past the limit, so the limit is now steering response, not sensing. Oval steering_oscillation
      was 0.16, well below 0.25, so the sensor lead does not need to change. The Builder''s
      geometry narrows wheel_track 0.12 to 0.10 m, shortens body_length 0.16 to 0.12
      m, and lightens mass 0.8 to 0.7 kg. Turn rate per PWM count scales with 1/wheel_track,
      so the narrower track gives about 1.2x more yaw per unit of turn, and lower
      mass reduces yaw inertia. The sensor array is unchanged, so I keep kp at 6 and
      ki at 0.05 as in iteration 3. I raise kd from 0.8 to 0.9 to damp the extra yaw
      response and hold base_speed at 1.5. Expected result: max_error below 0.06 m
      on the s-bend and slalom with rising progress. The main risk is oval steering_oscillation
      above 0.25, which would trigger the sensor y change next.


      - [Open this output](iteration-4/entity1/versions/e5efc24e75d64116893a3d79f2245432/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/8d6adb839f2f453e80f52a349be28bf4/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-3b354ba2ccf219c6/payload.json)'
  - id: entityR1
    label: Turn-response next steps
    notes: 'Feedback written before the race: if the s-bend and slalom still drift,
      narrow the track further; if oval oscillation rises, move sensor y to 0.03;
      if the oval finish rate drops, return to the 0.12 m track. Each is tied to iterations
      2 and 3.


      ### Feedback


      Written before this candidate races, so no outcome is stated for it. Evidence:
      iteration 3 (±0.08 m, 0.016 m footprint, kp 6, kd 0.8) had zero line loss on
      the s-bend and slalom and oval steering_oscillation of 0.16, but all 60 trials
      ended off_track at max_error about 0.062. Progress was 0.18 on the s-bend and
      0.09 on the slalom, and the oval finish rate fell to 45%, below iteration 2''s
      55%. Sensing coverage is now adequate, so the limit is the robot''s turn response.
      I have adopted your narrower track and lighter, shorter body and kept the array
      fixed. Decide the next change from the race. If the s-bend or slalom still ends
      off_track with max_error at or near 0.06 m and progress below 0.3, the turn
      response is still too slow, so try wheel_track 0.09 m (within the 0.08 m limit)
      and keep mass at or below 0.7 kg. If oval steering_oscillation rises above 0.25
      while max_error falls, the sensor lead is the suspect, so move sensor y from
      0.05 to 0.03 with x fixed. If the oval finish rate drops below 55% with line
      loss still at zero, the extra turn authority is too high, so return wheel_track
      to 0.12 m and keep the shorter, lighter body.


      ### Requested changes


      - If the s-bend or slalom still end off_track at max_error near 0.06 m with
      progress below 0.3, set wheel_track to 0.09 m and mass to 0.6 kg, keeping the
      ±0.08 m array fixed. Evidence: iteration 3 had zero line loss but max_error
      0.062 and progress 0.18 and 0.09 on these tracks, so the limit is turn response.

      - If oval steering_oscillation rises above 0.25, move every sensor y from 0.05
      to 0.03, with x and the other fields fixed. Evidence: iteration 2 oval oscillation
      was 0.267 and iteration 1 was 0.275, both above the threshold, while iteration
      3 was 0.16.

      - If the oval finish rate falls below 55% while line loss stays at zero, return
      wheel_track to 0.12 m and keep the shorter, lighter body. Evidence: iteration
      2 reached 55% finish at track 0.12 m, and iteration 3 fell to 45% with the same
      track.


      - [Open this output](iteration-4/entityR1/versions/e5efc24e75d64116893a3d79f2245432/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/8d6adb839f2f453e80f52a349be28bf4/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-3b354ba2ccf219c6/payload.json)'
