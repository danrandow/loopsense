map:
  id: race-135-randow-maps
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 8 (sensor y 0.03 m, mass 0.5 kg) scored 209.2, below iteration 7''s
      315.3 at y 0.05 m. The race shows the shorter lead hurt the robot. Oval finish
      rate fell from 75% to 40%, and oval progress fell from 0.963 to 0.756. Slalom
      progress collapsed from 0.186 to 0.075. S-bend progress edged up from 0.140
      to 0.1435, and max_error stayed at 0.061, inside the 0.065 m limit. The Integrator''s
      rules say to keep y at 0.03 m only if s-bend and slalom both rise above about
      0.18. Slalom fell far below that, so the condition is not met. The rule to return
      y to 0.05 m when s-bend progress falls below 0.14 is borderline, but the slalom
      and oval regressions make the lead change clearly negative. I therefore return
      sensor y to 0.05 m and keep every other field at the iteration-7 values, which
      is the best raced design so far (315.3). Sensor size 0.012 is not tested now
      because its conditions were not met, and at 0.04 m spacing its 28 mm gap is
      wider than the tape. This revert is a return to a validated design, not a new
      change. Expected result: score near 315, with oval finish rate at or above 75%,
      and s-bend and slalom progress near 0.14 and 0.19. The s-bend and slalom still
      end off_track at max_error about 0.062, so the next exploration must come from
      a different lever, not sensor lead.


      - [Open this output](iteration-9/entity0/versions/ef22699f3f3940d9b5a76b70ceb35c2a/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-c494e5bb1d32ca84/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-a8d3a64dd76a5058/payload.json)'
  - id: entity1
    label: Revert to iter-7 geometry
    notes: 'Restores sensor y to 0.05 m at mass 0.5 kg, the best raced design (315.3),
      with the iteration-7 controller unchanged. The iteration-8 drop to 209 with
      y 0.03 m shows the shorter lead was the cause.


      ### Rationale


      Iteration 8 moved sensor y to 0.03 m at mass 0.5 kg and scored 209.2, below
      iteration 7''s 315.3 at y 0.05 m. The shorter lead cut oval finish from 75%
      to 40% and slalom progress from 0.186 to 0.075, so the lead change is clearly
      negative. I take the Builder''s revert: iteration-7 geometry with y 0.05 m,
      mass 0.5 kg, track 0.10 m, body 0.10 x 0.12 m, sensor span x = -0.08 to 0.08
      at 0.04 m spacing, 0.016 m footprint. The iteration-7 controller (kp 6, ki 0.05,
      kd 0.9, base_speed 1.5, weights [-2, -1, 0, 1, 2], last_direction) is kept unchanged,
      because it is the only raced controller behind a 315 score. Changing gains now
      would confound the revert and risk the best known result. Oval steering_oscillation
      was 0.208 at this setting, so kd is not raised. The s-bend and slalom still
      stop at max_error about 0.062, which is a lever for later iterations and not
      for this revert. Expected result: score near 315, oval finish rate at or above
      65%, and s-bend and slalom progress near 0.14 and 0.19. This is an expectation,
      not a measured result.


      - [Open this output](iteration-9/entity1/versions/8760be3dc0714592b1b797777df92052/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/ef22699f3f3940d9b5a76b70ceb35c2a/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-a8d3a64dd76a5058/payload.json)'
  - id: entityR1
    label: 'Feedback: mass and array'
    notes: 'Pre-race feedback that rests on iterations 6 to 8. It sets rules for mass
      0.6 kg if the oval finish falls, and for a 7-sensor 0.027 m array if the s-bend
      and slalom remain at max_error 0.062.


      ### Feedback


      Written before this candidate races, so no outcome is stated for it. Evidence:
      iteration 7 (y 0.05 m, mass 0.5 kg, track 0.10 m, body 0.10 m) is the best raced
      design at 315.3, with oval finish 75%, s-bend progress 0.140 and slalom progress
      0.186. Iteration 8 (same design with y 0.03 m) fell to 209.2, with oval finish
      40% and slalom progress 0.075. So sensor lead should stay at 0.05 m. Iteration
      6 (mass 0.6 kg, same otherwise) gave oval finish 65% and s-bend and slalom progress
      0.181 and 0.191. The s-bend and slalom still end at max_error about 0.062 to
      0.064 on every design, so the limit is not sensing lead or mass alone. Decide
      the next change from the race. If the oval finish rate drops below 65% with
      y 0.05 m, mass 0.5 kg is not helping and mass 0.6 kg is the known-stable setting.
      If s-bend and slalom max_error stays at about 0.062 with progress below 0.2,
      the sensing footprint and spacing are the next thing to test. body_width cannot
      help because the off-track limit is already at its floor.


      ### Requested changes


      - If the oval finish rate falls below 65% at y 0.05 m, set mass back to 0.6
      kg and keep the 0.10 m track and 0.10 m body. Evidence: iteration 6 at mass
      0.6 kg gave a 65% oval finish, while iteration 7 at mass 0.5 kg gave 75%, so
      the lower mass helps the oval but its direction is not yet clear on the bends.

      - If s-bend and slalom max_error stays at about 0.062 with progress below 0.2
      at y 0.05 m, try a 7-sensor array at x = -0.08 to 0.08 with 0.027 m spacing,
      keeping sensor_size 0.016 and y 0.05 m. Evidence: iteration 8 showed the lead
      is not the limit, and iterations 3 to 7 with 0.04 m spacing still ended off_track
      at max_error 0.062, so finer spacing may improve the centre-line signal.

      - If the oval steering_oscillation rises above 0.25 at mass 0.5 kg, keep the
      geometry and set kd to 0.8 in the controller. Evidence: oval oscillation was
      0.267 in iteration 2 and 0.275 in iteration 1, both above the threshold, while
      iteration 7 was 0.208, so this is a headroom check only.


      - [Open this output](iteration-9/entityR1/versions/8760be3dc0714592b1b797777df92052/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/ef22699f3f3940d9b5a76b70ceb35c2a/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-a8d3a64dd76a5058/payload.json)'
