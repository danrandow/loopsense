map:
  id: race-219-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Array forward to y=0.075
    notes: 'Moved the 50 mm sensor array from y=0.065 m to 0.075 m, following the
      Integrator''s rule because line loss was still 1.7 to 2.0 per track at 0.065
      m. Iteration 3 progress rose on every track and the score improved to 82.8,
      so the forward trend is supported; the s-bend line-loss count rose, so it is
      the watch point.


      ### Rationale


      Iteration 3 moved the array from y = 0.055 m to y = 0.065 m with the 50 mm span.
      Score rose from 65.3 to 82.8, and progress improved on every track (oval 0.22
      to 0.27, s-bend 0.15 to 0.21, slalom 0.11 to 0.14). Line loss did not clear,
      though: 2.0 events on the oval, 2.0 on the s-bend and 1.7 on the slalom. max_error
      stayed at 0.062 to 0.066, still above the 0.06 m off-track floor. Steering oscillation
      rose modestly to 0.20 to 0.24, so the forward array is adding some jitter but
      not destabilising the loop. The Integrator''s rule for this case is that if
      line_loss_events is still at least 1 on any development track at y = 0.065 m,
      move the array to about y = 0.075 m and keep the 50 mm span. Line loss is still
      at least 1 on all three tracks, so I follow that rule and set y = 0.075 m, which
      is inside the 0.08 m limit. I keep the span, five sensors, the 12 mm footprint,
      the 0.12 m track, the 0.03 m wheels, the 0.6 kg mass and the 0.12 m body width.
      The Integrator''s wheel_track change only applies once line loss reaches 0 and
      max_error stays at or above 0.06, so it is not yet triggered. Widening the body
      does not change the off-track limit, which is already at its 0.06 m floor. I
      took the Integrator''s advice. Expected result: line_loss_events falls on the
      oval and s-bend, progress rises further, and the score improves on 82.8. Risk:
      the s-bend loss count rose from 1 to 2 when the array moved forward, so the
      sensors may be losing the tape on tight entries. steering_oscillation is the
      watch point.


      - [Open this output](iteration-4/entity0/versions/4b43a2e62c81446d925d268c1b564485/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-066569a59e389859/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-4f48ae7925d7c863/payload.json)'
  - id: entity1
    label: Forward array, kd 0.4
    notes: 'Keeps the Builder''s y = 0.075 m array and changes only kd (0.3 to 0.4)
      to damp the oscillation rise seen in iteration 3 (0.20 to 0.24). Line loss is
      still 1.7 to 2.0 per track at y = 0.065 m, so the forward move follows the agreed
      rule.


      ### Rationale


      Iteration 3 (array at y = 0.065 m, 50 mm span, controller unchanged) scored
      82.8. Line loss did not clear: 2.0 events on the oval, 2.0 on the s-bend and
      1.7 on the slalom. Max_error stayed at 0.062 to 0.066, still above the 0.06
      m off-track floor, and no run finished. Steering oscillation rose to 0.20 to
      0.24, which is the jitter cost of moving the array forward. My earlier rule
      says to move the array to about y = 0.075 m while line loss is still at least
      1 per track, and the Builder''s geometry does this, so I keep it. Because the
      score is about 147 times progress at this loss level, the lever that matters
      is getting further along the track before leaving it. The added jitter is the
      main new risk, so I raise kd from 0.3 to 0.4 to damp the faster-changing signal
      from the forward array. kp (4.0), ki (0.1), base_speed (1.4) and last_direction
      line loss are kept, so the kd change is the only controller variable moved.
      Expected result: steering_oscillation falls back toward 0.15 to 0.2, line_loss_events
      falls toward 0 or stays near 2, and progress rises above the iteration-3 values
      (0.27, 0.21, 0.14). I do not claim this outcome. Speed is held because no run
      has finished and the speed margin is still unproven.


      - [Open this output](iteration-4/entity1/versions/4447fe383fe94630b41c84f48f8d51a0/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/4b43a2e62c81446d925d268c1b564485/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-4f48ae7925d7c863/payload.json)'
  - id: entityR1
    label: Span or track next, if
    notes: 'Advises holding y = 0.075 m and widening the span to ±0.03 m if line loss
      persists, or narrowing wheel_track to 0.10 m if line loss clears but max_error
      stays at or above 0.06. Both branches rest on iteration 3''s results, and no
      outcome is stated for this candidate.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Iteration
      3 (y = 0.065 m, 50 mm span) reached 82.8, the best so far. Line loss was still
      2.0, 2.0 and 1.7 events per track, max_error stayed at 0.062 to 0.066, and steering
      oscillation rose to 0.20 to 0.24. Moving to y = 0.075 m follows the rule from
      iteration 3. Your y = 0.075 m proposal is the top of the allowed forward range,
      so further forward moves are not available. The Integrator has raised kd to
      0.4 to offset the added jitter. Next race: if line_loss_events is still at least
      1 on any track at y = 0.075 m, keep the array forward and try a wider span (x
      = ±0.03 m) before changing wheel_track, because the span has been the variable
      that moved coverage so far. If line_loss_events is 0 on all tracks but max_error
      stays at or above 0.06, reduce wheel_track to about 0.10 m for more turn rate.
      Keep body_width at 0.12 m, because the off-track limit sits at its 0.06 m floor
      and body width does not change it.


      ### Requested changes


      - If line_loss_events is still at least 1 on any development track at y = 0.075
      m, widen the span to x = ±0.03 m (60 mm) with five sensors and keep y = 0.075
      m, since the forward move alone has not cleared the loss (iteration 3 gave 1.7
      to 2.0 events).

      - If line_loss_events drops to 0 but max_error stays at or above 0.06, reduce
      wheel_track from 0.12 m to about 0.10 m for more turn rate (iteration 3 max_error
      was 0.062 to 0.066).

      - Keep body_width at 0.12 m, since the off-track limit is already at its 0.06
      m floor, and keep mass at 0.6 kg until turning authority is shown to limit the
      outcome.


      - [Open this output](iteration-4/entityR1/versions/4447fe383fe94630b41c84f48f8d51a0/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/4b43a2e62c81446d925d268c1b564485/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-4f48ae7925d7c863/payload.json)'
