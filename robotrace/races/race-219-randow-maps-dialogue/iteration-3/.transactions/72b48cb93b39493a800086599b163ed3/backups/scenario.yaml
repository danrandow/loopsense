map:
  id: race-219-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Array forward to y=0.055
    notes: 'Moved the 50 mm five-sensor array forward from y=0.04 to 0.055 m, as the
      Integrator advised after line loss persisted at 1 to 2 events per track in iteration
      1. The rest of the geometry is held fixed so the change is readable.


      ### Rationale


      Iteration 1 widened the sensor span from 40 mm to 50 mm, and the score rose
      from 26.0 to 57.2. Line loss fell on the oval (1.0 to 2.0 events, so it got
      worse there) and was unchanged at 1.0 on the s-bend and slalom. All 60 trials
      still ended off track, with progress 0.11 to 0.16 and max_error about 0.065,
      which is just above the 0.06 m off-track floor. The Integrator''s stated rule
      was that if line_loss_events stays at least 1 at 50 mm, the sensors are not
      the only bottleneck and the array should move forward (y 0.05 to 0.06 m) for
      more reaction time. Line loss did not go away, so I am following that advice.
      I move the array from y = 0.04 m to y = 0.055 m and keep the 50 mm span, five
      sensors, the 12 mm footprint, the 0.12 m track and the 0.6 kg mass. Changing
      one variable keeps the result readable. I am not widening the body: the off-track
      limit is max(0.06, 0.0125 + body_width/4), so even 0.18 m leaves it at 0.06
      m, and the body width does not affect the outcome. I am not yet changing mass
      or wheel track, because turning authority has not been shown to be the binding
      limit. Expected result: line_loss_events should fall toward 0, and progress
      should rise on the oval and s-bend. If the robot still leaves the track with
      no line loss, the next candidates are a narrower wheel_track (which raises turn
      rate per wheel difference) or mass 0.5 kg.


      - [Open this output](iteration-2/entity0/versions/61a6ec8372a943649b24b25ebccbbe63/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-6bdbf09f3b6e2fc2/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-efbafee756019f6c/payload.json)'
  - id: entity1
    label: Forward array, same gains
    notes: 'Moves the 50 mm array forward to y = 0.055 m and keeps the iteration-1
      controller unchanged to isolate the geometry effect. Based on iteration 1, where
      line loss persisted at 1 to 2 events per track with max_error at about 0.065.


      ### Rationale


      The Builder''s candidate moves the 50 mm five-sensor array forward from y =
      0.04 m to y = 0.055 m, keeping the span, footprint, track, wheels and mass unchanged.
      Iteration 1 (the 50 mm span with the same controller) ran off track on all 60
      trials, with progress 0.11 to 0.16, max_error 0.063 to 0.067 (at or just above
      the 0.06 m floor), and line-loss events of 2.0 on the oval and 1.0 on the s-bend
      and slalom. Line loss persisted at 50 mm, so the sensor span alone was not sufficient.
      The Integrator''s rule was to move the array forward for more reaction time.
      I follow that rule. I keep the controller gains exactly as in iteration 1 (base_speed
      1.4, kp 4.0, ki 0.1, kd 0.3, last_direction line loss). That isolates the effect
      of the geometry change, which matches the Builder''s request for a readable
      result. Steering oscillation was low (0.14 to 0.17), so there is no sign that
      the gains need damping, and the forward sensors lead the signal, so kd 0.3 should
      still be adequate. Expected result: line_loss_events should fall, but I make
      no claim about the outcome until the race runs. If line loss clears and the
      robot still leaves the track, the next lever is the Builder''s narrower wheel_track
      or lower mass, not more gain.


      - [Open this output](iteration-2/entity1/versions/7a100beec3754daa9c2f6bfe5f1ca463/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/61a6ec8372a943649b24b25ebccbbe63/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-efbafee756019f6c/payload.json)'
  - id: entityR1
    label: Forward array, then track
    notes: 'Feedback that the Builder should move the array further forward if line
      loss persists, or narrow wheel_track to about 0.10 m if line loss clears but
      the robot still leaves the track. Grounded in iteration 1''s 1 to 2 line-loss
      events per track and max_error at about 0.065.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Iteration
      1 (50 mm span, base_speed 1.4, kp 4.0, kd 0.3) ran off track on all 60 trials,
      with progress 0.11 to 0.16, max_error about 0.063 to 0.067, and line_loss_events
      of 2.0 on the oval and 1.0 on the s-bend and slalom. The 50 mm span did not
      eliminate line loss, which is the condition for the Integrator''s forward-array
      rule. The controller is unchanged from iteration 1 so this geometry change can
      be read alone. Next race: if line_loss_events is still at least 1 on any track
      at y = 0.055 m, try moving the array to about y = 0.06 to 0.065 m and keep the
      span. If line_loss_events is 0 on all tracks but max_error stays at or above
      0.06 and the robot still leaves the track, the limit is turning authority, so
      try a narrower wheel_track (about 0.10 m) for more turn rate per wheel difference.
      Keep body_width at 0.12 m, because the off-track limit is already at its 0.06
      m floor and widening the body does not change it.


      ### Requested changes


      - If line_loss_events is still at least 1 on any development track at y = 0.055
      m, move the array forward to about y = 0.06 to 0.065 m, keeping the 50 mm span
      (iteration 1 showed 1 to 2 losses per track at y = 0.04 m).

      - If line_loss_events drops to 0 but max_error stays at about 0.06 or more and
      the robot still leaves the track, reduce wheel_track from 0.12 m to about 0.10
      m to increase turn rate (iteration 1 max_error was 0.063 to 0.067).

      - Keep body_width at 0.12 m; the off-track limit is already at the 0.06 m floor
      (iteration 1 max_error 0.063 to 0.067), so body width does not change the outcome.


      - [Open this output](iteration-2/entityR1/versions/7a100beec3754daa9c2f6bfe5f1ca463/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/61a6ec8372a943649b24b25ebccbbe63/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-efbafee756019f6c/payload.json)'
