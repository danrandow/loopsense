map:
  id: race-219-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Hold 0.5 kg geometry
    notes: 'Kept the iteration-8 geometry (mass 0.5 kg, otherwise iteration 4) unchanged,
      since it is the best score so far (303.6) with the oval finish rate up to 0.80.
      Line loss on the bends did not clear under any geometry tried, so geometry search
      stops here and further gains need controller-side work.


      ### Rationale


      Iteration 8 (mass 0.5 kg, otherwise the iteration-4 geometry) is the best design
      so far at 303.6, against 291.9 for iteration 4. The oval finish rate held at
      16 of 20 (0.80, up from 0.75), and its mean finish time was 1.86 s, so the lighter
      robot has speed margin. The s-bend line loss stayed at 2.0 and the slalom rose
      from 2.0 to 3.0, so the mass change did not clear bend line loss. Geometry changes
      tried so far have not cleared it: span (40 to 60 mm), forward position (0.04
      to 0.075 m), footprint (12 and 16 mm), track width (0.10 and 0.12 m) and mass
      (0.5 and 0.6 kg). The Integrator''s rule has two parts. Keep 0.5 kg if the oval
      holds at 0.75 or above, which it does. Consider a further mass reduction only
      if line loss falls on the s-bend or slalom, which it did not, so I am not taking
      that step. Their stop rule applies: line loss stayed at 2.0 on the s-bend with
      0.5 kg, so I am stopping geometry search. I took the Integrator''s advice on
      mass and on stopping. I am not making a wheel_radius change now, since it would
      alter speed and turn rate at the same time as the controller work and the Integrator
      flagged it only as a later option. Expected result: the geometry is unchanged,
      so the score should be about 300 with the same controller. Any gain now has
      to come from control, so this iteration''s useful evidence is the diagnostic
      measurements on the bends.


      - [Open this output](iteration-9/entity0/versions/5dbd8f8f359c4ef081778b517ae15f9b/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-ebf4746441b6c59b/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-b3af658f45c88c74/payload.json)'
  - id: entity1
    label: Mass 0.5 kg, iter-4 ctrl
    notes: 'Iteration-4 geometry and controller with mass cut from 0.6 to 0.5 kg as
      the only change, matching the Builder''s test. Evidence: iteration 4 (291.9)
      is the only design with oval finishes, and iteration 7 showed the narrower track
      failed.


      ### Rationale


      The Builder''s geometry is the iteration-4 layout (best score 291.9) with mass
      changed from 0.6 to 0.5 kg. Iteration 4 is the only design where the oval finished
      runs (15 of 20). Iterations 5 (60 mm span, 73.6), 6 (16 mm footprint, 83.5)
      and 7 (wheel_track 0.10 m, 83.5) all lost the oval finishes (0 of 20) and kept
      line_loss_events at 2.0 on the s-bend and slalom. Iteration 7 is the clearest
      case: the narrower track did not clear line loss, and max_error rose to 0.065
      to 0.070, so my rule to return wheel_track to 0.12 m applies. The Builder''s
      geometry already restores 0.12 m. The mass change alone is the only variable
      I am asked to test, so I keep the iteration-4 controller exactly: base_speed
      1.4, kp 4.0, ki 0.1, kd 0.4, last_direction, weights [-1, -0.5, 0, 0.5, 1].
      kd 0.4 is kept because it brought steering_oscillation down to 0.16 on the oval
      at iteration 4. Lower mass reduces yaw inertia, so the same kp gives a quicker
      turn; I do not retune gains, so any change in score can be attributed to mass.
      Expected result: the oval finish rate holds at or above 0.75 and line_loss_events
      on the bends may fall. This is a prediction, not a measured result. Risk: lighter
      mass changes traction and speed response, so the oval finish rate and steering_oscillation
      are the watch points.


      - [Open this output](iteration-8/entity1/versions/c4abc6a712654dd4b2e375a28917f782/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/7723caa3372048b39cd5c9c69e4a0e97/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-49ca1a596dbc294f/payload.json)'
  - id: entityR1
    label: Hold layout, test mass
    notes: 'Restores wheel_track 0.12 m and supports the mass-only test, because the
      0.10 m track (iteration 7) and the 60 mm span and 16 mm footprint (iterations
      5 and 6) all lost the oval finishes. If line loss persists after the mass change,
      geometry search should stop.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Iteration
      4 (291.9) remains the reference. Iterations 5 (60 mm span), 6 (16 mm footprint)
      and 7 (wheel_track 0.10 m) each left the oval at 0 of 20 finishes, and line_loss_events
      stayed at 2.0 on the s-bend and slalom in every case. Iteration 7 is the key
      evidence against a narrower track: at 0.10 m, max_error rose to 0.065 to 0.070
      and the oval lost all finishes, so turning authority via track width did not
      help. Your plan to restore wheel_track 0.12 m is correct. Sensing (span, footprint,
      forward position) and track width have now all been tried around the iteration-4
      layout without clearing bend line loss. Mass 0.5 kg is the one remaining single-variable
      test, and it is reasonable to run it on the iteration-4 geometry. Next race:
      if the oval finish rate holds at or above 0.75 and line_loss_events falls on
      the s-bend or slalom, keep 0.5 kg and consider a modest further mass reduction.
      If the oval finish rate drops below 0.75 or the score falls below 291.9, return
      to the exact iteration-4 geometry at 0.6 kg. If line loss stays at 2.0 on the
      bends with mass 0.5 kg, stop searching sensor geometry and report that the limit
      is control response, since no geometry variant has cleared it.


      ### Requested changes


      - Keep the iteration-4 layout (x = ±0.025 m, y = 0.075 m, sensor_size 0.012
      m, wheel_track 0.12 m, wheel_radius 0.03 m) and change only mass to 0.5 kg,
      as proposed; do not combine it with wheel_radius or track changes in the same
      race.

      - If the score falls below 291.9 or the oval finish rate drops below 0.75, revert
      to mass 0.6 kg with the exact iteration-4 geometry, which is the best known
      design.

      - If line_loss_events stays at 2.0 on the s-bend and slalom after the mass change,
      stop geometry search and propose only controller-side tests, since span, footprint,
      forward position and track width have all been tried without clearing it.


      - [Open this output](iteration-8/entityR1/versions/c4abc6a712654dd4b2e375a28917f782/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/7723caa3372048b39cd5c9c69e4a0e97/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-49ca1a596dbc294f/payload.json)'
