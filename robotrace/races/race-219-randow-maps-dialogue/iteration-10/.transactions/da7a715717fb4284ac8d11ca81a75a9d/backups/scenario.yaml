map:
  id: race-219-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Hold iter-9 geometry
    notes: 'Geometry unchanged from the best design (412.7), so the controller result
      reads cleanly. The slalom line loss fell below the Integrator''s 3.0 threshold
      and the oval finished 20 of 20, which met their hold rule. The 0.14 m track
      test is kept for the last iteration if bend line loss stays at 2.0 or more.


      ### Rationale


      Iteration 9 is the best result so far at 412.7 (up from 303.6). The geometry
      was unchanged from iteration 8, so the gain comes from the Integrator''s controller
      change. The oval finished 20 of 20 runs (finish rate 1.0, mean finish time 1.91
      s, line_loss_events 1.0). The slalom line loss fell from 3.0 to 2.1, which is
      below the 3.0 threshold the Integrator set, and the s-bend mean rose slightly
      from 2.0 to 2.3 while its score improved to 237 from 89. The Integrator''s rule
      was to hold the geometry if the bend line loss falls below 2.0 or 3.0 after
      the controller change, and to report which change did it. The slalom criterion
      is met, and the oval finish rate is well above the 0.75 floor. I therefore hold
      the iteration-9 geometry exactly. I took the Integrator''s advice, and I am
      not testing wheel_track 0.14 yet. The s-bend line loss of 2.3 is not clearly
      still at 2.0, so the condition for the exploratory track change is not cleanly
      met, and changing geometry now would confound the controller result. Span, forward
      position, footprint, track width and mass have all been tested around this layout,
      and the 0.10 m track was clearly worse. Holding keeps the best platform fixed
      while the controller is tuned. Expected result: a score near the iteration-9
      value, about 400 or more, with any further change coming from the controller.
      The remaining iteration can test wheel_track 0.14 if the s-bend line loss stays
      at 2.0 or more after the controller work.


      - [Open this output](iteration-10/entity0/versions/e11cd08f5de24c8a9c5a71d27ad02238/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-bb12c2aaef5c923c/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-10db6b89b332d1c3/payload.json)'
  - id: entity1
    label: 'Controller: slower'
    notes: 'Keeps the iteration-8 geometry and changes only the controller: base_speed
      1.4 to 1.2 and kd 0.4 to 0.5. This tests whether bend line loss (2.0 on s-bend,
      3.0 on slalom) is a control-response limit, and the oval''s 1.86 s finish time
      leaves speed margin.


      ### Rationale


      Iteration 8 (mass 0.5 kg, otherwise the iteration-4 layout) is the best design
      so far at 303.6. The oval finished 16 of 20 runs with a mean finish time of
      1.86 s, so there is speed margin. The s-bend and slalom still ended off track
      in every run, with line_loss_events at 2.0 and 3.0. Span, forward position,
      footprint, track width and mass have all been tried around this layout without
      clearing bend line loss. The remaining hypothesis is a control-response limit
      at bend entry, so this iteration changes only the controller. I keep the iteration-8
      geometry exactly, so any score change is attributable to control. Two controller
      changes: (a) base_speed 1.4 to 1.2. The bend failures are off-track losses,
      not a speed shortfall, and a slower entry gives the 0.04 to 0.075 m lookahead
      more time to correct. Expected oval mean finish time is about 1.86 x 1.4/1.2,
      roughly 2.2 s, still under the 3 s limit. (b) kd 0.4 to 0.5. Bend steering_oscillation
      is about 0.22 and kd damped the oval earlier (0.20 to 0.16 when kd went 0.3
      to 0.4). kp (4.0), ki (0.1) and last_direction line loss are unchanged. Risk:
      a lower base_speed lengthens finish time, and higher kd may amplify sensor noise,
      so completion_time and steering_oscillation are the watch points. If the oval
      finish rate falls below 0.75 or the score falls below 303.6, the next design
      should return to base_speed 1.4 and kd 0.4.


      - [Open this output](iteration-9/entity1/versions/1703796021f848f589e04f03e3af020b/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/5dbd8f8f359c4ef081778b517ae15f9b/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-b3af658f45c88c74/payload.json)'
  - id: entityR1
    label: Hold geometry, test
    notes: 'Advises holding the iteration-8 geometry while the controller is tested,
      since span, footprint, forward position and track width have not cleared bend
      line loss. Suggests wheel_track 0.14 m as the one exploratory geometry test
      if bend line loss persists.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Iteration
      8 (mass 0.5 kg, 303.6) is the best design so far, and its oval finished 16 of
      20 runs (mean finish 1.86 s) while the s-bend (line_loss 2.0) and slalom (line_loss
      3.0) still went off track in all runs. Your choice to hold the geometry is supported.
      Iterations 4 to 8 show that span (iteration 5), footprint (iteration 6), track
      width at 0.10 m (iteration 7) and forward position (iterations 2 to 4) each
      either left bend line loss at 2.0 or cost oval finishes. Bend line loss is therefore
      most likely a control-response limit, which is why this iteration tests the
      controller only. Next race: if the s-bend or slalom line_loss_events falls below
      2.0 or 3.0 with the controller change, hold the geometry and report which change
      did it. If the oval finish rate falls below 0.75 with no bend improvement, the
      geometry is not the cause and the controller should revert to the iteration-8
      settings. If bend line loss is still 2.0 and 3.0 after the controller change,
      the geometry search should stop, as you planned.


      ### Requested changes


      - Hold the iteration-8 geometry (x = plus or minus 0.025 m, y = 0.075 m, sensor_size
      0.012 m, wheel_track 0.12 m, wheel_radius 0.03 m, mass 0.5 kg) for the controller
      test, so the controller result can be read cleanly.

      - If the bend line loss remains at 2.0 and 3.0 after the controller change,
      and the oval still finishes near 0.8, test one exploratory geometry change:
      wheel_track 0.14 m. The 0.10 m test (iteration 7) lost the oval finishes, so
      the wider track is the untested direction for bend stability.

      - Keep the five sensors at y = 0.075 m and the 50 mm span. Both have been the
      best-performing sensing layout, and widening the span or enlarging the footprint
      each cost oval finishes.


      - [Open this output](iteration-9/entityR1/versions/1703796021f848f589e04f03e3af020b/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/5dbd8f8f359c4ef081778b517ae15f9b/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-b3af658f45c88c74/payload.json)'
