map:
  id: race-219-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Hold iter-9 geometry
    notes: 'Geometry unchanged from the best design (412.7), so the controller result
      reads cleanly. The slalom line loss fell below the Integrator''s 3.0 threshold
      and the oval finished 20 of 20, which met their hold rule. The 0.14 m track
      test is kept for the last iteration if bend line loss stays at 2.0 or more.


      ### Rationale


      Iteration 9 is the best result so far at 412.7 (up from 303.6). The geometry
      was unchanged from iteration 8, so the gain comes from the Integrator''s controller
      change. The oval finished 20 of 20 runs (finish rate 1.0, mean finish time 1.91
      s, line_loss_events 1.0). The slalom line loss fell from 3.0 to 2.1, which is
      below the 3.0 threshold the Integrator set, and the s-bend mean rose slightly
      from 2.0 to 2.3 while its score improved to 237 from 89. The Integrator''s rule
      was to hold the geometry if the bend line loss falls below 2.0 or 3.0 after
      the controller change, and to report which change did it. The slalom criterion
      is met, and the oval finish rate is well above the 0.75 floor. I therefore hold
      the iteration-9 geometry exactly. I took the Integrator''s advice, and I am
      not testing wheel_track 0.14 yet. The s-bend line loss of 2.3 is not clearly
      still at 2.0, so the condition for the exploratory track change is not cleanly
      met, and changing geometry now would confound the controller result. Span, forward
      position, footprint, track width and mass have all been tested around this layout,
      and the 0.10 m track was clearly worse. Holding keeps the best platform fixed
      while the controller is tuned. Expected result: a score near the iteration-9
      value, about 400 or more, with any further change coming from the controller.
      The remaining iteration can test wheel_track 0.14 if the s-bend line loss stays
      at 2.0 or more after the controller work.


      - [Open this output](iteration-10/entity0/versions/e11cd08f5de24c8a9c5a71d27ad02238/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-bb12c2aaef5c923c/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-10db6b89b332d1c3/payload.json)'
  - id: entity1
    label: Slower entry, more
    notes: 'Holds the iteration-9 geometry and lowers base_speed to 1.0 and raises
      kd to 0.6. The aim is to reduce bend line loss and the s-bend jitter (0.37),
      with oval finish time still expected under 3 s. Rests on the iteration 8 to
      9 gain and the rising bend oscillation.


      ### Rationale


      Iteration 9 is the best design so far (412.7). Its geometry is the iteration-8
      layout, which is also the one the Builder holds for iteration 10: five sensors
      at x = -0.025 to +0.025 m, y = 0.075 m, 12 mm footprint, wheel_track 0.12 m,
      wheel_radius 0.03 m, body 0.18 by 0.12 m, mass 0.5 kg. The iteration-9 controller
      change (base_speed 1.4 to 1.2, kd 0.4 to 0.5) is what produced the gain. Oval
      finished 20 of 20 at 1.91 s mean, so there is still roughly 1 s of margin under
      the 3 s limit. The slalom line loss fell from 3.0 to 2.1, which supports the
      view that a slower bend entry helps. The s-bend improved in score (89 to 237),
      but its line loss rose to 2.3 and steering_oscillation rose to 0.37 on the bends,
      so the bends now show jitter, not just under-response. Two moves follow from
      this. First, lower base_speed a further step to 1.0, which gives the 0.04 m
      lookahead more time on bend entry. The oval should finish in roughly 2.3 s by
      scaling the 1.91 s mean, which keeps it inside 3 s. Second, raise kd from 0.5
      to 0.6 to damp the bend oscillation, where kd has previously reduced jitter
      (0.20 to 0.16 when kd went 0.3 to 0.4). kp stays at 4.0 and ki at 0.1, so the
      change is limited to speed and damping. I expect the s-bend line loss to fall
      toward 2.0 and the slalom toward 2.0, with the oval finish rate held at 1.0.
      This is a prediction, not a measured result. The Builder''s geometry is unchanged,
      so the controller result can be read cleanly.


      - [Open this output](iteration-10/entity1/versions/da7a715717fb4284ac8d11ca81a75a9d/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/e11cd08f5de24c8a9c5a71d27ad02238/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-10db6b89b332d1c3/payload.json)'
  - id: entityR1
    label: Hold geometry, test track
    notes: 'Supports holding the iteration-9 geometry for a clean controller read.
      Proposes wheel_track 0.14 m as the next geometry test only if bend line loss
      stays at 2.0 or more, since 0.10 m was the only narrower track tried and it
      cost oval finishes.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Iteration
      9 (base_speed 1.2, kd 0.5, 412.7) confirmed that the bends were limited by control,
      not geometry: the oval finished 20 of 20, the slalom line loss fell from 3.0
      to 2.1, and the bend steering_oscillation rose to 0.37. The mass change in iteration
      8 (303.6) and the controller change in iteration 9 are the two gains so far,
      and all geometry levers tried earlier (span 40 to 60 mm, forward position 0.04
      to 0.075 m, footprint 12 and 16 mm, track 0.10 and 0.12 m) either left bend
      line loss at 2.0 or cost oval finishes. I am holding your iteration-9 geometry
      unchanged for this race, as you asked, so that the controller result reads cleanly.
      Your condition for the exploratory track change is the right one, but it can
      only be judged after this race: if the s-bend line_loss_events is still 2.0
      or more and the oval finish rate holds near 1.0, then wheel_track 0.14 m is
      the next geometry test, since 0.10 m (iteration 7) was the only track width
      tried and it lost the oval finishes. Keep the five sensors at y = 0.075 m with
      the 50 mm span, because that layout has the best oval results. Keep body_width
      at 0.12 m, since the off-track limit is already at its 0.06 m floor.


      ### Requested changes


      - Hold the iteration-9 geometry for this race and change only the controller,
      as proposed. If the s-bend line_loss_events falls below 2.3 with the oval finish
      rate at or above 0.9, keep the geometry and move the controller further in the
      same direction.

      - If the s-bend or slalom line_loss_events stays at 2.0 or more after this controller
      change, test wheel_track 0.14 m as the single geometry change in the next iteration,
      since 0.10 m is the only narrower track tried and it lost the oval finishes.

      - Keep the five sensors at y = 0.075 m with x = plus or minus 0.025 m and the
      12 mm footprint. Widening the span to 60 mm, the 16 mm footprint and the 0.10
      m track each cost oval finishes, so do not revisit them.


      - [Open this output](iteration-10/entityR1/versions/da7a715717fb4284ac8d11ca81a75a9d/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/e11cd08f5de24c8a9c5a71d27ad02238/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-10db6b89b332d1c3/payload.json)'
