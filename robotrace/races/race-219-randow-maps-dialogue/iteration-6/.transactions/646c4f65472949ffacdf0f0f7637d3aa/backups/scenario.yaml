map:
  id: race-219-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 5 (60 mm span, y = 0.075 m) scored 73.6, down from 291.9 at iteration
      4. The oval, which finished 15 of 20 runs at 50 mm, finished 0 of 20 at 60 mm,
      with line_loss_events at 2.0. The s-bend improved (line_loss 2.0 to 1.0), but
      the oval regression outweighs that. The Integrator''s feedback was written before
      iteration 5 raced, so it does not cover this result. Their conditional rule
      (widen to 60 mm if line loss persists, then try a larger footprint) was built
      on the assumption that the wider span would help. The evidence says it did not.
      I am taking the Integrator''s advice in part. I revert the span to 50 mm, the
      best-scoring configuration, and keep the forward array at y = 0.075 m, the top
      of the allowed range. I then apply the Integrator''s second lever, sensor_size
      0.016 m, which widens each footprint without moving the array. Line loss is
      still 2.0 on the s-bend and slalom at 50 mm, so the footprint is the next thing
      to test. I keep wheel_track at 0.12 m and mass at 0.6 kg, because turning authority
      has not been shown to limit the outcome. Expected result: line loss on the s-bend
      and slalom falls below 2.0, the oval keeps its iteration-4 finish rate (about
      0.75), and the score beats 291.9. Risk: a larger footprint may blur the tape
      edge and reduce signal sensitivity near the centre, so rms_error and steering_oscillation
      are the watch points.


      - [Open this output](iteration-6/entity0/versions/2daeaa2dc706481fa3b0fa8140226613/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-c03f2c00aeabf09e/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-0f6414755e1e321c/payload.json)'
  - id: entity1
    label: 50mm span, 16mm footprint
    notes: 'Reverts to the best 50 mm span (iteration 4, 291.9) after the 60 mm span
      dropped the oval to 0 finishes in iteration 5 (73.6). Changes only the sensor
      footprint to 16 mm, with the controller held at iteration 4 values.


      ### Rationale


      The best raced design so far is iteration 4 (50 mm span, y = 0.075 m, kd 0.4,
      score 291.9). Iteration 5 widened the span to 60 mm and fell to 73.6: the oval
      went from 15 of 20 finishes to 0, and the s-bend improved only from 2.0 to 1.0
      line-loss events. The wider span therefore hurt the working oval configuration,
      so I revert it to 50 mm. The Builder''s intent is to keep the 50 mm span and
      change only the sensor footprint from 12 mm to 16 mm, which tests whether a
      larger footprint covers more tape edge without moving the array. I accept that
      change. The controller stays exactly as in iteration 4 (base_speed 1.4, kp 4.0,
      ki 0.1, kd 0.4, last_direction, weights [-1, -0.5, 0, 0.5, 1]), so the footprint
      is the only variable that moves. The 16 mm footprints overlap heavily at 12.5
      mm spacing, which may blur the centre signal, so rms_error and steering_oscillation
      are the watch points. Neither speed nor gains are changed, because the oval
      already finishes in about 1.64 s and the bend failures are off-track losses,
      not a speed shortfall. Expected result: line_loss_events on the s-bend and slalom
      below 2.0, the oval finish rate near 0.75, and a score above 291.9. I make no
      claim about the measured outcome.


      - [Open this output](iteration-6/entity1/versions/05040114c77149c595789cae9abcabce/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/2daeaa2dc706481fa3b0fa8140226613/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-0f6414755e1e321c/payload.json)'
  - id: entityR1
    label: Keep 50mm, test wheel
    notes: 'Feedback written before the race: recommends against further span widening
      and sets the 16 mm footprint as the test. Names wheel_track 0.10 m as the next
      lever if line loss persists, with a fallback to 12 mm if the oval finish rate
      drops.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Iteration
      4 (50 mm span, y = 0.075 m, kd 0.4) scored 291.9, the best so far: the oval
      finished 15 of 20 runs, while the s-bend and slalom still lost the line in all
      40 runs, with line_loss_events at 2.0 on both. Iteration 5 (60 mm span, same
      controller) scored 73.6, with the oval falling to 0 of 20 finishes, so the wider
      span should not be used. The 50 mm span is restored here, and the 16 mm footprint
      is tested instead. Next race: if line_loss_events is still at least 1 on the
      s-bend or slalom at 16 mm, move to wheel_track 0.10 m (not a wider span), since
      turning authority is the remaining untested lever. If the oval finish rate falls
      well below 0.75 or rms_error rises clearly, the larger footprint is blurring
      the centre signal, so return to sensor_size 0.012 m and keep the 50 mm span.
      If line loss is 0 on all tracks and max_error stays at or above 0.06, reduce
      wheel_track to about 0.10 m. Keep body_width at 0.12 m and mass at 0.6 kg, because
      the off-track limit already sits at its 0.06 m floor and neither is shown to
      limit the outcome.


      ### Requested changes


      - If line_loss_events is still at least 1 on the s-bend or slalom at sensor_size
      0.016 m, reduce wheel_track from 0.12 m to about 0.10 m for more turn rate.
      Do not widen the span beyond 50 mm, because 60 mm dropped the oval to 0 of 20
      finishes (iteration 5).

      - If the oval finish rate falls well below the iteration-4 value of 0.75, or
      rms_error rises clearly above 0.021, the larger footprint is blurring the centre
      signal; return sensor_size to 0.012 m and keep x = ±0.025 m.

      - Keep y = 0.075 m, body_width 0.12 m and mass 0.6 kg; the array is already
      at its forward limit and neither body nor mass is yet shown to limit the outcome.


      - [Open this output](iteration-6/entityR1/versions/05040114c77149c595789cae9abcabce/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/2daeaa2dc706481fa3b0fa8140226613/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-0f6414755e1e321c/payload.json)'
