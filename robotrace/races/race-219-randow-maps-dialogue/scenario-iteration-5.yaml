map:
  id: race-219-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Wider span at forward
    notes: 'Keeps the array at y = 0.075 m (the forward limit, which gave the best
      score of 291.9) and widens the span from 50 mm to 60 mm, because line loss was
      still 1.3 to 2.0 per track. Other geometry is unchanged, and the Integrator''s
      advance rule for this case was followed.


      ### Rationale


      Iteration 4 (array at y = 0.075 m, 50 mm span) is the best design so far at
      291.9. The oval finished 15 of 20 runs (mean progress 0.81, max_error 0.041),
      so forward placement worked there. The s-bend and slalom still ended off track
      in all 40 runs, with line_loss_events at 2.0 on both and max_error at 0.072
      and 0.066. Line loss is still at least 1 on every track, so the rule the Integrator
      and I set in advance now applies: keep the array at y = 0.075 m, which is the
      top of the forward range, and widen the span to x = ±0.03 m (60 mm). I am following
      that advice. The forward array has been run to its limit, and the span is the
      variable that has moved coverage in earlier iterations (iteration 0 to 1 cut
      line loss on the oval), so I change only the span. I keep five sensors, the
      12 mm footprint, the 0.12 m wheel track, the 0.03 m wheels, the 0.6 kg mass
      and the 0.12 m body width. Body width still does not affect the 0.06 m off-track
      floor, and mass and track are not yet shown to limit the outcome. Sensor spacing
      becomes 15 mm, so adjacent footprints still overlap. Expected result: line_loss_events
      falls below 2.0 on the s-bend and slalom, the robot holds the line through the
      tight bends, and the score exceeds 291.9. Risk: a wider span may reduce signal
      sensitivity on the centre line, so steering_oscillation and rms_error are the
      watch points. If line loss clears but max_error stays at or above 0.06, the
      next lever is narrowing wheel_track to about 0.10 m.


      - [Open this output](iteration-5/entity0/versions/076c25543857483590aee40fba71af1a/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-d2368befb1895cc5/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-e554af2b41c396f3/payload.json)'
  - id: entity1
    label: 60 mm span, same gains
    notes: 'Widens the sensor span from 50 to 60 mm at the forward limit (y = 0.075
      m) and keeps the iteration-4 controller unchanged, so the span is the only variable.
      Iteration 4 (score 291.9) still lost the line on the s-bend and slalom at 2.0
      events per track.


      ### Rationale


      Iteration 4 is the best design so far (score 291.9). It ran the oval to 15 of
      20 finishes (mean progress 0.81, mean finish time 1.64 s) with kd 0.4 and y
      = 0.075 m. The s-bend and slalom still lost the line in all 40 runs, with line_loss_events
      at 2.0 on both and max_error at 0.072 and 0.066. Line loss is still at least
      1 on every track, so the advance rule applies: the array stays at the forward
      limit (y = 0.075 m) and the span widens from 50 mm to 60 mm (x = ±0.03 m), as
      the Geometry Builder proposed. I keep the controller identical to iteration
      4 (kp 4.0, ki 0.1, kd 0.4, base_speed 1.4, last_direction, weights [-1, -0.5,
      0, 0.5, 1]) so the race isolates the span change. The 15 mm sensor spacing still
      overlaps the 12 mm footprints. Base speed stays at 1.4 because the oval finishes
      in 1.64 s and the failures on the bends are off-track losses, not a lack of
      speed, so raising speed now would likely worsen them. Expected result: line_loss_events
      below 2.0 on the s-bend and slalom, and a score above 291.9. Risk: a wider span
      may reduce signal sensitivity near centre, so steering_oscillation and rms_error
      are the watch points.


      - [Open this output](iteration-5/entity1/versions/efc586e7deea4f8385dfc7c5a92cb3c1/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/076c25543857483590aee40fba71af1a/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-e554af2b41c396f3/payload.json)'
  - id: entityR1
    label: Span hold, then footprint
    notes: 'Supports the 60 mm span test and sets the next levers: a larger 16 mm
      footprint if line loss persists, then a narrower wheel_track if line loss clears
      but max_error stays near the limit. Evidence is the iteration 4 result (score
      291.9, oval 15 of 20 finishes).


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Iteration
      4 (50 mm span, y = 0.075 m, kd 0.4) scored 291.9, the best so far. The oval
      finished 15 of 20 runs with progress 0.81, and steering_oscillation fell to
      0.16 after kd rose from 0.3 to 0.4 (iteration 3 had 0.20 to 0.24). The s-bend
      and slalom still lost the line in all 40 runs, with line_loss_events at 2.0
      on both and max_error at 0.072 and 0.066. Your 60 mm span at y = 0.075 m is
      the right next step, because the forward array is already at its limit and the
      span is the variable that moved coverage earlier (iteration 0 to 1 cut line
      loss on the oval). Next race: if line_loss_events is still at least 1 on the
      s-bend or slalom at 60 mm, try a larger footprint (sensor_size 0.016 m) before
      changing wheel_track, because it widens each sensor''s view of the tape edge
      without moving the array. If line_loss_events is 0 on all tracks but max_error
      stays at or above 0.06 and the robot still leaves the track, reduce wheel_track
      from 0.12 m to about 0.10 m for more turn rate. Keep body_width at 0.12 m, since
      the off-track limit sits at its 0.06 m floor and body width does not change
      it.


      ### Requested changes


      - If line_loss_events is still at least 1 on the s-bend or slalom at x = ±0.03
      m, try sensor_size 0.016 m with the same positions, so each footprint covers
      more of the tape edge at the forward limit.

      - If line_loss_events drops to 0 but max_error stays at or above 0.06, reduce
      wheel_track from 0.12 m to about 0.10 m for more turn rate (iteration 4 max_error
      was 0.066 to 0.072 on the bends).

      - Keep body_width at 0.12 m and mass at 0.6 kg until turning authority is shown
      to limit the outcome; the off-track limit is already at its 0.06 m floor.


      - [Open this output](iteration-5/entityR1/versions/efc586e7deea4f8385dfc7c5a92cb3c1/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/076c25543857483590aee40fba71af1a/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-e554af2b41c396f3/payload.json)'
