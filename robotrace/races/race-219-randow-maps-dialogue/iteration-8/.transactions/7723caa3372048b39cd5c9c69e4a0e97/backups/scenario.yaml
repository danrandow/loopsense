map:
  id: race-219-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Narrower track, 12 mm
    notes: 'Reverted the 16 mm footprint, which dropped the oval to 0 of 20 finishes
      (iteration 6), and kept the best iteration-4 geometry with wheel_track cut from
      0.12 to 0.10 m for more turn rate. Only one variable changed from the best-scoring
      design, so the result is attributable.


      ### Rationale


      Iteration 6 tested the 16 mm footprint at the 50 mm span and y = 0.075 m. It
      scored 83.5, far below iteration 4''s 291.9. The oval finished 0 of 20 runs,
      down from 15 of 20, and line_loss_events stayed at 2.0 on both the s-bend and
      the slalom, so the larger footprint did not clear the line loss. The Integrator''s
      rule for this case says to return sensor_size to 0.012 m and keep the 50 mm
      span if the oval finish rate falls well below 0.75. That condition is met, so
      I am following that part of the advice. The Integrator also said that if line
      loss persists at 16 mm, the next lever is wheel_track 0.10 m. Turning authority
      is the one lever not yet tested in isolation, and the evidence (line loss of
      2.0 on the bends at every footprint and span tried at the forward limit) is
      consistent with a turn-rate limit. I therefore restore the iteration-4 geometry
      and change only wheel_track, from 0.12 m to 0.10 m. A narrower track gives more
      turn rate per unit wheel difference (turn rate = difference / wheel_track).
      Because this is the single change from the best-scoring design, any change in
      the result can be attributed to the track width. I keep sensor_size 0.012 m,
      five sensors at x = -0.025 to +0.025 m, y = 0.075 m, the 0.03 m wheels, body_width
      0.12 m, body_length 0.18 m and mass 0.6 kg. Body width and mass are unchanged
      because the off-track limit sits at its 0.06 m floor and neither is shown to
      limit the outcome. Expected result: line_loss_events on the s-bend and slalom
      falls below 2.0, and max_error drops below 0.06 on the bends. The oval finish
      rate should stay near 0.75 or improve. Risk: a narrower track can reduce stability
      at speed and may raise steering_oscillation, so that is the watch point.


      - [Open this output](iteration-7/entity0/versions/fc871de6574c4c5bbedb3148359c0e16/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-ee91da7e332cac88/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-2f4f3dcb56604001/payload.json)'
  - id: entity1
    label: Track 0.10 m integration
    notes: 'Complete robot with the iteration-4 controller unchanged and wheel_track
      narrowed to 0.10 m, so only the track width varies against the 291.9 baseline.
      Based on iteration 4 line loss of 2.0 on the bends and the 16 mm and 60 mm regressions
      in iterations 5 and 6.


      ### Rationale


      Iteration 4 (50 mm span at x = ±0.025 m, y = 0.075 m, sensor_size 0.012 m, wheel_track
      0.12 m, kd 0.4) is the best design so far at 291.9. The oval finished 15 of
      20 runs, but the s-bend and slalom still lost the line in every run, with line_loss_events
      at 2.0 on both and max_error at 0.072 and 0.066. Iterations 5 and 6 both tested
      wider or larger sensing and both hurt the oval: a 60 mm span dropped it to 0
      of 20 (score 73.6), and a 16 mm footprint at 50 mm also dropped it to 0 of 20
      (score 83.5). The Builder''s proposal restores the iteration-4 geometry and
      changes only wheel_track, from 0.12 m to 0.10 m. A narrower track raises turn
      rate for the same wheel-command difference (turn rate = wheel speed difference
      / wheel_track), which targets the remaining line loss on the bends, which is
      consistent with a turning-authority limit. I keep the controller identical to
      iteration 4 (base_speed 1.4, kp 4.0, ki 0.1, kd 0.4, last_direction, weights
      [-1, -0.5, 0, 0.5, 1]) so the track width is the only variable that moves and
      the result can be attributed to it. kd 0.4 is retained because it brought steering_oscillation
      down to 0.16 on the oval. Expected result: line_loss_events below 2.0 on the
      s-bend and slalom, max_error below 0.06 on some bends, and the oval finish rate
      holding near 0.75. Risk: a narrower track can raise steering_oscillation, which
      is the watch point. If the oval finish rate drops sharply, the Builder''s plan
      is to revert wheel_track to 0.12 m.


      - [Open this output](iteration-7/entity1/versions/70fa9ade12a844a0a3a3a4d8f4096e03/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/fc871de6574c4c5bbedb3148359c0e16/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-2f4f3dcb56604001/payload.json)'
  - id: entityR1
    label: Keep layout, test track
    notes: 'Pre-race feedback that holds the iteration-4 sensing layout, since the
      60 mm span and 16 mm footprint both collapsed the oval finish rate, and proposes
      wheel_track 0.10 m as the single next test. It gives mass 0.5 kg as the follow-up
      if line loss clears but max_error stays at or above 0.06.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Your
      16 mm footprint at iteration 6 (score 83.5) and your 60 mm span at iteration
      5 (score 73.6) both dropped the oval from 15 of 20 finishes at iteration 4 to
      0 of 20, so the working 50 mm, 12 mm footprint layout should be held fixed.
      Iteration 4 (291.9) is the reference: s-bend and slalom still show line_loss_events
      of 2.0 on all 40 runs, with max_error at 0.066 to 0.072. Sensing has now been
      tried at the forward limit (y = 0.075 m) and at the widest span that still preserved
      the oval, so turning authority is the remaining lever you have not tested in
      isolation. Your proposal to narrow wheel_track to 0.10 m is the right next test.
      If the oval finish rate holds and line loss clears, the next step is to probe
      more turning authority. If line loss clears but max_error stays at or above
      0.06, do not widen the span or footprint again; test mass instead. If steering_oscillation
      rises sharply, return wheel_track to 0.12 m.


      ### Requested changes


      - Keep the iteration-4 layout (x = ±0.025 m, y = 0.075 m, sensor_size 0.012
      m) and change only wheel_track to 0.10 m. Do not widen the span or enlarge the
      footprint, because both reduced the oval finish rate in iterations 5 and 6.

      - If line_loss_events clears on the s-bend and slalom and the oval finish rate
      holds near 0.75, try wheel_track of about 0.09 m for further turn rate. If line
      loss clears but max_error stays at or above 0.06, try mass 0.5 kg to reduce
      yaw inertia (mass × (L² + W²)/12) for a quicker turn response.

      - Keep body_width at 0.12 m and body_length at 0.18 m, since the off-track limit
      already sits at its 0.06 m floor and neither dimension is shown to limit the
      outcome.


      - [Open this output](iteration-7/entityR1/versions/70fa9ade12a844a0a3a3a4d8f4096e03/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/fc871de6574c4c5bbedb3148359c0e16/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-2f4f3dcb56604001/payload.json)'
