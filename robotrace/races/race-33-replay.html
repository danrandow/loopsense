function extent(points,margin=.09){const xs=points.map(p=>p[0]),ys=points.map(p=>p[1]);let a=Math.min(...xs),b=Math.max(...xs),c=Math.min(...ys),d=Math.max(...ys),m=Math.max(b-a,d-c)*margin||1;return[a-m,b+m,c-m,d+m]}
