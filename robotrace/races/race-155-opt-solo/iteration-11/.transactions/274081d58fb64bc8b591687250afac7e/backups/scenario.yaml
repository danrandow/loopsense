  - id: entity0
    label: 'Final: proven iter-10'
    notes: 'Keeps the iteration 10 design unchanged, the best raced candidate (931.6),
      which completed 20/20 on all development tracks with max_error about 0.02 m.
      Variants tested in earlier iterations did not improve the score, and any change
      adds off-track risk on the unseen final track.


      ### Rationale


      This is the final iteration, and the unseen-track race scores this design with
      no later chance to correct it. Iteration 10 is the best raced design (931.57).
      It finished 20/20 on all three development tracks (oval 937.6, s-bend 931.5,
      slalom 925.7), with rms_error 0.009 to 0.012 and max_error 0.02 to 0.023, well
      inside the 0.06 m off-track limit. Earlier changes that were tested and reverted
      (base_speed 0.95, kd 0.45 with 1.1 speed, kp 3.5, and a 1.2 speed to save time)
      gave no reliable gain. The remaining score levers are small: about 15 points
      for line-loss events (currently about 1.0 per run) and about 4 points for every
      0.2 s of completion time. Each of those changes risks off-track exits on an
      unseen shape, which costs 500 points per run. So I am keeping the iteration
      10 design unchanged, since its completion margin is the most reliable evidence
      available. Hypotheses to check from this race: the sensor lead at y=0.08 keeps
      the slalom and s-bend completing on the held-back-style bends, and line_loss_events
      stay near 1 per run, which suggests a small future gain from kd or a sensor-lead
      change but no change is justified now. Expected result: completion on all tracks
      with a score near 930. Failure signs: any off-track exit on an unseen track
      would point to the sensor lead being at its limit, with y=0.075 the fallback.


