  entities:
  - id: entity0
    label: Shorter body, kp 3.2
    notes: 'Cuts body length to 0.10 m to lower yaw inertia further and raises kp
      to 3.2 for slalom steering authority, building on iteration 7 (805 score), where
      lower inertia lifted slalom finishes from 0 to 8 of 20. Expect slalom finishes
      and line losses to improve, with oval and s-bend still completing; the risk
      is higher oscillation.


      ### Rationale


      Evidence from iteration 7 (score 805.5, best so far): the oval (20/20) and s-bend
      (20/20) both finish. Slalom finishes 8/20, with 12 off-track exits, progress
      0.81, 1.1 line-loss events per run, steering_oscillation 0.42 and control_effort
      11.8. Slalom is still the bottleneck. Iteration 7 cut mass 0.5 to 0.4 kg and
      body_length 0.15 to 0.12 m; slalom mean score rose from 320 to 536 and finishes
      went from 0 to 8, so reducing yaw inertia helps the quick direction changes.
      Iteration 6 showed that cutting speed slows the robot without fixing off-track
      exits, so speed stays at 1.1.


      Changes: (1) body_length reduced from 0.12 to 0.10 m, the lower limit. Yaw inertia
      is mass*(L^2+W^2)/12, so this cuts inertia by about 10 percent more and should
      turn the robot in faster on slalom. body_width stays at 0.12 m, so the off-track
      limit stays at 0.06 m. (2) kp raised from 3.0 to 3.2 for a modest increase in
      steering authority. Iteration 7''s notes flagged this as the next lever if line
      loss persisted, and the earlier sensor-weight and kp scaling suggests a 7% rise
      stays clear of the oscillation seen at kp 3.5. (3) kd held at 0.5 to damp the
      faster response. (4) Mass 0.4 kg, wheel_track 0.12 m, wheel_radius 0.03 m, sensors
      unchanged, base_speed 1.1, ki 0, last_direction line loss, so the oval and s-bend
      result is preserved.


      Expected result: slalom finishes rise to around 12 or more of 20, line_loss_events
      fall to about 0.7 or below, and slalom progress exceeds 0.9. Oval and s-bend
      should still complete. Hypotheses: (a) lower inertia reduces overshoot on slalom
      direction changes; (b) a small kp increase adds the authority to pull back faster
      after a line-loss event. Failure signs: steering_oscillation above 0.5 means
      kp or kd is too high for the faster response, so kd should drop to about 0.4
      next. If slalom progress stays near 0.8 with the same line losses, the limit
      is sensing width or steering authority, and the next step is a wider sensor
      span or a kp of about 3.5. Next measurements: completion, progress and line_loss_events
      on slalom and s-bend show whether the inertia change still helps; steering_oscillation
      and max_error show gain balance; completion_time on the oval shows the speed
      margin.


