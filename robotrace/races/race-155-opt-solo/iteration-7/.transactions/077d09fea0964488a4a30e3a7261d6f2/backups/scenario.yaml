  entities:
  - id: entity0
    label: Lower inertia, speed 1.1
    notes: 'Restores the iteration 5 controller, which scored best (711), since the
      iteration 6 speed cut lowered slalom progress to 0.46. Mass drops to 0.4 kg
      and body_length to 0.12 m to cut yaw inertia about 25 percent, aimed at the
      slalom off-track exits.


      ### Rationale


      Evidence. Iteration 5 (base_speed 1.1, kd 0.5, kp 3.0, sensors at y=0.065 spanning
      x=±0.042, mass 0.5) is the best design so far at 711. Its oval finished 20/20
      and its s-bend finished 18/20. Its slalom never finished: 0/20, progress 0.77,
      1.05 line losses, oscillation 0.45. Iteration 6 cut base_speed to 0.95 and kd
      to 0.45. Score fell to 652. Slalom progress dropped to 0.46 and two runs timed
      out, so the speed cut slowed the robot without fixing the off-track exits. Oscillation
      fell only slightly (0.45 to 0.37). Speed is therefore not the lever; keep base_speed
      at 1.1. The sensing change from iteration 4 to 5 was the largest gain, so keep
      the 7-sensor forward array.


      Changes. (1) Restore the iteration 5 controller: base_speed 1.1, kp 3.0, kd
      0.5, ki 0, last_direction line loss, same weights. (2) Reduce mass from 0.5
      to 0.4 kg, the lower limit. (3) Reduce body_length from 0.15 to 0.12 m. Yaw
      inertia is mass*(L^2+W^2)/12, so this drops inertia about 25 percent. The robot
      should turn in and recover faster on slalom direction changes, which is the
      failure mode. body_width stays 0.12 m, so the off-track limit stays at 0.06
      m. Wheel track, radius and sensor layout are unchanged, so this iteration isolates
      the inertia effect.


      Expected result. Slalom progress above 0.85 with fewer line losses (target 0.5
      or below). Oval and s-bend should still finish, since the controller is unchanged.
      Steering oscillation may rise slightly with the faster response.


      Hypotheses. (a) Lower yaw inertia reduces overshoot on the slalom''s quick direction
      changes, which cuts line losses. (b) The controller stays fixed, so any gain
      in slalom progress comes from geometry, not from a change in tuning.


      Failure signs. If slalom still ends off-track near progress 0.77 with about
      1 line loss, steering authority or sensing is the limit; the next step is a
      modest kp increase (about 3.3) or a wider array. If oscillation exceeds 0.5,
      kd should come down toward 0.4.


      Next measurements. Progress and line_loss_events on slalom and s-bend show whether
      inertia helps. steering_oscillation and max_error show gain balance. completion_time
      on the oval shows the speed margin. noise_robustness is also requested as a
      check on the disturbance margin.


