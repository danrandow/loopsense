map:
  id: race-210-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: 'Draft: kd 1.8 to 2.2'
    notes: 'Keeps the iteration 6 geometry and changes only kd, from 1.8 to 2.2, to
      test whether more damping raises oval progress further. Iteration 6 is the best
      race so far (94.96). Its kd increase from 1.2 raised oval progress from 0.33
      to 0.44.


      ### Rationale


      Evidence: 300 development trials across seven designs, none finished. Every
      run ended off track. The best design so far is iteration 6 (94.96), which kept
      the iteration 4 geometry and raised kd from 1.2 to 1.8. Its oval progress rose
      from 0.33 to 0.44 and oval line-loss events fell from 1.0 to 0.5. Its s-bend
      and slalom results were flat or slightly worse, and steering oscillation rose
      from 0.19 to 0.25 on the oval. Max error is pinned near 0.063 m on every track
      whatever the gains, so the off-track limit of 0.06 m is still the binding constraint.
      The off-track limit cannot be raised by body width (0.12 m gives 0.0425, so
      the limit is 0.06 m, and 0.18 m gives 0.0575, still under 0.06 m). Iteration
      5 showed that changing several things at once confounds the result, so I keep
      the iteration 6 geometry exactly.


      Change: kd from 1.8 to 2.2, and nothing else. The kd trend has been positive
      on the oval (1.2 gave progress 0.33, 1.8 gave 0.44), and the oval drives most
      of the score because its progress term is the largest. The larger derivative
      action should damp the rising jitter and keep the robot inside the band for
      longer. Oscillation is likely to rise further, so this is a real risk. If oscillation
      or slalom progress gets worse, the next revision should return kd to about 1.8
      and address the slalom through base_speed or kp.


      Expected result: oval progress about 0.5 and a score around 100 to 110, with
      a small chance of a first oval finish. s-bend and slalom should change little.


      - [Open this output](iteration-7/entity0/versions/eb891ba5ae5046ff9f88df38fee8e201/payload.json)

      - Based on: [entityR2A](iteration-7/entityR2A/versions/carried-80578df94448551e/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critique of the kd 1.8 to 2.2 draft: the gain from kd 1.2 to 1.8 is real
      on the oval, but oscillation is rising, the saturation risk is unquantified,
      and the finish and score predictions lack thresholds. Based on the iteration
      4 and 6 development results and the scoring formula.


      - [Open this output](iteration-7/entityC1/versions/3469dea6261d41f294e7b96691479f96/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/eb891ba5ae5046ff9f88df38fee8e201/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-80578df94448551e/payload.json)'
  - id: entity1
    label: kd 0.6 to 0.9 on best
    notes: 'Restores the raced iteration 6 design (y = 0.05, kp 7, base 1.4), which
      the Draft misdescribed, and changes only kd to 0.9. The oval gain from kd 0.3
      to 0.6 (progress 0.33 to 0.44) supports a further modest step, and kd 2.2 is
      rejected as a saturation risk. Pass and fail thresholds are stated in the rationale.


      ### Rationale


      Evidence. The raced best is iteration 6 (score 94.96). Its raced design, per
      the outcome table, was sensors at x = -0.06 to 0.06 with y = 0.05, sensor_size
      0.016, kp 7.0, ki 0.1, kd 0.6, base_speed 1.4, last_direction. The Draft Design''s
      listed values (y = 0.07, kp 2.5, base_speed 1.3, kd 1.8 or 2.2) do not match
      what raced, so I do not carry them forward. The Draft''s claim that iteration
      6 kept the iteration 4 geometry with kd raised from 1.2 to 1.8 is also wrong.
      The only controller change that raced from the y = 0.05 base was kd 0.3 to 0.6,
      which took the score from 81.56 to 94.96. Oval progress rose from 0.33 to 0.44
      and oval line-loss events fell from 1.0 to 0.5. The y = 0.07 row (iteration
      5) cost about 20 points, so it stays out.


      Kept: the raced iteration 6 design in full (geometry, kp 7.0, ki 0.1, base_speed
      1.4, last_direction). Kept from the critique: the single-variable discipline,
      the caution about saturation at high kd, and the request for thresholds. Changed:
      kd 0.6 to 0.9, the only variable moved. This tests whether the kd gain on the
      oval continues, in a step small enough to stay clear of the saturation risk
      the critique raises at kd 2.2. Rejected: the Draft''s kd 2.2 jump. The critique''s
      own estimate shows that a 0.1 signal step per 10 ms at kd 2.2 is large enough
      to saturate the wheels, and oscillation has risen with each kd increase so far.


      Pass and fail rules. Keep kd 0.9 if oval progress is above 0.44 and the overall
      score is above 94.96. If oval steering_oscillation rises above 0.37 (about 50
      percent over 0.25), return kd to 0.6, the raced best. If the score falls with
      progress flat, the kd gain has peaked, and the next test is base_speed 1.5 on
      its own. Max_error is pinned near 0.063, so it is not expected to pass 0.06
      at this step. The result is judged on the oval first, then on the s-bend and
      slalom, which the Draft and critique both flag as the weaker tracks.


      Expected result: oval progress about 0.47 to 0.50, overall score about 98 to
      105, and oscillation about 0.28 to 0.32. Completion is not expected at this
      speed, and completion_time is requested to show whether base_speed is limiting
      progress.


      - [Open this output](iteration-7/entity1/versions/8a190a9f034341109685068206adcd52/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/eb891ba5ae5046ff9f88df38fee8e201/payload.json),
      [entityC1](iteration-7/entityC1/versions/3469dea6261d41f294e7b96691479f96/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-80578df94448551e/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Critiques the kd 0.3 to 0.6 candidate on the iteration-4 base. Main points:
      the rationale cites an iteration-1 kd 0.8 run that the history does not contain,
      the oscillation pass limit sits almost on the baseline, and completion is still
      unaddressed. Evidence is the outcome table and the iteration 4 per-track metrics.


      - [Open this output](iteration-6/entityC2/versions/ced45aed63dc4fbc8593253c76ab7857/payload.json)

      - Based on: [entity1](iteration-6/entity1/versions/63c090c94ab14812843e64a90d866efb/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-a2d4893514bc2ebb/payload.json)'
  - id: entity2
    label: kd 0.6 on best raced base
    notes: 'Restores the raced best (iteration 4, score 81.56: x ±0.045, y 0.05, kp
      7, ki 0.1) and changes only kd 0.3 to 0.6. Corrects the draft''s ±0.06 baseline,
      which was never raced, and the critique''s misread of the kd history. Keep rule:
      max_error falls with oscillation up no more than 20 percent.


      ### Rationale


      Evidence. The raced best is iteration 4 (score 81.56), per the outcome table:
      sensors at x = -0.045, -0.0225, 0, 0.0225, 0.045 with y = 0.05, kp 7.0, ki 0.1,
      kd 0.3, base_speed 1.4, last_direction. Per track it scored 135.7 (oval, progress
      0.33), 67.9 (s-bend, progress 0.17) and 41.1 (slalom, progress 0.10). All 60
      trials ended off track, with max_error 0.063 m on each track and about one line
      loss per run. Iteration 5 moved only y to 0.07 and fell to 61.46, so y = 0.07
      is rejected and y = 0.05 is restored.


      Corrections to the inputs. The entity1 draft and the critiques say iteration
      4 used x = ±0.06. The outcome table and the iteration-4 produced design both
      show ±0.045, so ±0.045 is the raced baseline. The ±0.06 layout was never raced,
      so I do not carry it forward. The draft''s kd 0.6 was attached to the wrong
      geometry, so it would have confounded the test. The critique''s claim that iteration
      1 raised kd from 0.3 to 0.8 is also wrong: the history shows a cut from 0.5
      to 0.3, and no run has kd 0.8. The kd evidence is therefore weak, and I do not
      treat it as support for a higher kd.


      Change. One variable only: kd 0.3 to 0.6, applied to the raced ±0.045, y = 0.05
      design. Everything else is identical (kp 7.0, ki 0.1, base_speed 1.4, last_direction,
      same wheels, body and mass). I considered the critique''s objection that a doubling
      is large and kept the step at 0.6 because it is the smallest test that can be
      read against the baseline at 81.56. I rejected kd 1.8 for saturation risk on
      tape-edge steps.


      Pass and fail rules. The keep rule governs: keep kd 0.6 only if max_error falls
      and steering_oscillation rises by no more than 20 percent. The 0.19 oval oscillation
      figure is a soft expectation, not a second pass rule, because the baseline is
      already at 0.1889 and the two rules conflict. If oscillation rises by more than
      20 percent, return to kd 0.3. If max_error changes by less than 0.001 m on each
      track, kd is not the lever for peak error; the next single test is base_speed
      alone, and a change is judged real only if it exceeds about 0.001 m. Expected:
      max_error at or below about 0.062 m on the oval and s-bend, line_loss_events
      at or below 1 per run, and oval progress at or above 0.33.


      Completion. No run has finished and base_speed stays at 1.4, so this race does
      not address the 500-point completion term. completion_time is requested so the
      next race can show whether runs are slow or stopped. If runs stay on track with
      completion_time above 3 s, the next single test is base_speed plus 0.1.


      - [Open this output](iteration-6/entity2/versions/8b243999fcc24dc7a0eb3f2608b3cf3c/payload.json)

