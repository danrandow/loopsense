overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor draft
    notes: 'A conservative first draft with five sensors across 0.08 m, base speed
      1.6, kp 5 and light damping, since no race telemetry exists yet. It is chosen
      to complete the course at a speed near the 1.5 m/s target, and the first race''s
      data will show whether to adjust speed or gain.


      ### Rationale


      No race telemetry exists yet (iteration 0), so this is a conservative baseline
      rather than a tuned design. Geometry: five sensors spread across 0.08 m (x =
      -0.04 to 0.04) at y = 0.05 m ahead of the axle, so the array covers the 25 mm
      tape with overlap and gives a usable signal on moderate bends. Sensor size 0.012
      m is a compromise between resolution and tape coverage. The wheel track, radius,
      mass and body dimensions are mid-range values that give a stable yaw inertia.
      Controller: base_speed 1.6 (PWM about 80 percent) is high enough to approach
      the 1.5 m/s average needed to finish in 3 s while leaving headroom for turns.
      Weights [-1, -0.5, 0, 0.5, 1] make the signal scale about one unit per sensor
      offset, so kp = 5 gives a moderate steering response (about 1750 PWM counts
      per unit of signal). A small kd = 0.3 damps oscillation and a small ki = 0.05
      removes bias from the motor mismatch. line_loss is ''last_direction'' so the
      robot keeps turning the way it was heading when it drifts off the tape. Expected
      result: the robot completes the oval and s-bend with modest error, and the first
      race''s telemetry (rms_error, oscillation, line-loss count) will show whether
      the speed is too high or the gain too low or too high.


      - [Open this output](iteration-0/entity0/versions/755cac9a37fb43f9a903b44d61603857/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Round-1 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-0/entityC1/versions/da5ba2723873424d82e0edfe2427f453/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/755cac9a37fb43f9a903b44d61603857/payload.json)'
  - id: entity1
    label: Revised baseline v2
    notes: 'Sensors now overlap (16 mm footprints at 12 mm spacing), ki raised to
      0.3 so it can offset motor mismatch, kp 6, kd 0.5, and base_speed lowered to
      1.5. Partly accepts the round-1 critique and rejects the suggestion to slow
      the robot much, because finishing is worth 500 points.


      ### Rationale


      Kept: five sensors, the axle-relative geometry frame, the mid-range body, wheel
      and mass values, the ''last_direction'' line-loss rule, and a base_speed near
      1.5 m/s (base_pwm about 75 percent). The critique is correct that the baseline''s
      sensor overlap claim was false and its ki was too small to do anything, so those
      are fixed. Its points on the speed claim and the kd justification are only partly
      accepted. I cannot convert PWM to m/s from the inputs, so I keep a speed that
      can finish in 3 s and state the risk.


      Changed: (1) Sensor footprint 0.016 m with 0.012 m spacing (x = -0.024 to +0.024).
      The footprints now overlap, and the 0.064 m span covers the 0.025 m tape even
      on tight bends, which answers critique point 1. (2) kp 5 to 6, since the signal
      is a weighted average capped at 1.0 and kp only sets the maximum turn at 2100
      PWM counts when the line is fully under the outer sensor. I now state that scale
      correctly instead of tying it to sensor offsets (critique 2). (3) base_speed
      1.6 to 1.5, to lower the off-track risk on bends where the speed-to-PWM mapping
      is unknown (critique 3). (4) ki 0.05 to 0.3. With the integral capped at +/-2,
      this gives up to about 0.6 turn, roughly 210 PWM, enough to offset a fixed motor
      mismatch (critique 4). (5) kd 0.3 to 0.5, a small damping term. I kept it modest
      and explain that it damps signal changes rather than the oscillation itself
      (critique 5).


      Rejected: the critique''s suggestion to slow the robot a lot. Completion is
      worth 500 points and needs about 1.5 m/s, so a much slower baseline would likely
      fail to finish and lose most of the score. The critique''s remark that a slow
      run could outscore a fast one is not supported here, because the score terms
      reward finishing.


      Hypotheses for the first race: completion 1 on the oval and s-bend, rms_error
      under 0.03 m, line_loss_events 0 to 2, and max_error under 0.04 m. If line losses
      exceed 3 per track, lower base_speed by 0.1 first. If rms_error is high with
      steady oscillation, lower kp by 1. If rms_error is high with a constant offset,
      raise ki. If the run stalls or times out before 3 s, raise base_speed by 0.1
      next. Robustness to the unseen track is argued from the overlapping sensors
      and the moderate gains, not from tuning to the development shapes.


      - [Open this output](iteration-0/entity1/versions/8d5a27ac63fa4fa78cf6461ca16168e9/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/755cac9a37fb43f9a903b44d61603857/payload.json),
      [entityC1](iteration-0/entityC1/versions/da5ba2723873424d82e0edfe2427f453/payload.json)'
