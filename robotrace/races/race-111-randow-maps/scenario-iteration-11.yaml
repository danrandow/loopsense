overrides:
  entities:
  - id: entity0
    label: Hold iteration 6 base
    notes: 'Holds the iteration 6 geometry (70.83, confirmed by iteration 10 at 70.8269)
      unchanged for the final race, rather than adding an untested wheel_radius change
      with no later iteration to verify it. The evidence is two identical races with
      one line loss per run on the s-bend and slalom, and the 0.14 m track test (69.05)
      and other geometry levers all scored lower.


      ### Rationale


      The iteration 10 race has returned. It reproduces the iteration 6 design exactly:
      score 70.8269, with one line loss per run on the s-bend and slalom and identical
      per-track metrics. That confirms the iteration 6 geometry as a stable base,
      and the score difference in iteration 9 (69.05) came from the 0.14 m track.


      The Integrator''s conditional branch applies here: the score is near 70.8 with
      line losses still at 1.0 per run, so the base is confirmed and wheel_radius
      0.035 m is the one untested single lever. I considered testing it, but this
      is the final iteration. Whatever I submit here is the design raced on the unseen
      final track, and no later iteration exists in which to use what a dev race reveals.
      Wheel_radius 0.035 m raises speed and turn rate together. Turn rate was the
      factor that lowered the score when slowed (0.14 m track), and faster turning
      on the 0.10 m track (iteration 1, confounded) also scored lower. So an untested
      change would stake the final score on an unverified gain.


      I therefore hold the iteration 6 geometry unchanged: mass 0.4 kg, body 0.16
      m by 0.12 m, five 12 mm sensors at x = +0.03, +0.015, 0, -0.015, -0.03 and y
      = 0.05 m, wheel_track 0.12 m, wheel_radius 0.03 m. This is the best-evidenced
      design (70.83 on two independent races). I expect a score near 70.8 on the development
      tracks, and the final unseen race is the one that depends on how well this base
      transfers.


      - [Open this output](iteration-11/entity0/versions/2130b34d05da40439f0cdf715b2f1351/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-d6f32982721ca139/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-b4388d8e55e19f29/payload.json)'
  - id: entity1
    label: 'Final robot: iter 6 base'
    notes: 'Iteration 6 geometry and controller, unchanged, to hold the 70.83 design
      that scored twice (iterations 6 and 10). No untested gain or geometry change
      is added before the unseen-track race.


      ### Rationale


      The iteration 6 geometry (mass 0.4 kg, body 0.16 m by 0.12 m, five 12 mm sensors
      at x = +0.03, +0.015, 0, -0.015, -0.03 and y = 0.05 m, wheel_track 0.12 m, wheel_radius
      0.03 m) has the best evidence: 70.83 in iterations 6 and 10. Every other geometry
      change tested since then lowered the score or left line losses at 1.0 per run
      (y 0.07 m, body_length 0.12 m, 8 mm footprints, the ±0.04 m span at 36.6, and
      wheel_track 0.14 m at 69.05). I keep that geometry unchanged. The controller
      is also kept exactly as in iteration 6 (kp 3.0, ki 0, kd 0.2, base_speed 1.5,
      last_direction line loss, weights +1, +0.5, 0, -0.5, -1). The only controller
      change ever tried (iteration 1, kp 4.5 and kd 0.3 on a narrower track) was confounded
      and scored 53.7. The controller is the only variable left on the unseen track,
      and an untested gain change could not be checked by any later race, so I do
      not add one. Expected result, as a prediction only: a score near 70.8 on the
      development tracks, with about one line loss per run on the s-bend and slalom.


      - [Open this output](iteration-11/entity1/versions/0f4be224eb154cb79f04323a53976411/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/2130b34d05da40439f0cdf715b2f1351/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-b4388d8e55e19f29/payload.json)'
  - id: entityR1
    label: 'Final feedback: hold base'
    notes: 'Written before racing, and this is the final iteration, so no later iteration
      can use it. It records that the iteration 6 base is held and names wheel_radius
      0.035 m as the one untested lever, with the closed levers listed as evidence.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. This is
      the final iteration, so this feedback has no later iteration to act on, and
      I record it for the record. The candidate is the iteration 6 geometry with the
      iteration 6 controller, which scored 70.83 in iterations 6 and 10. Iteration
      9 (wheel_track 0.14 m, 69.05) showed that slower turning did not remove the
      s-bend and slalom line losses. Iteration 8 (±0.04 m span, 36.6) and iteration
      7 (8 mm footprints, 67.75) closed those levers. Iteration 5 (body_length 0.12
      m) lowered the score, and iteration 3 (y 0.07 m) did not remove the loss. If
      a further iteration were run, the branches would be: if the score returns to
      about 70.8 with one line loss per run, test wheel_radius 0.035 m alone, since
      it is the only untested single lever and raises speed and turn rate together.
      If the score falls clearly below 70.8 with losses unchanged, keep the iteration
      6 geometry without further changes.


      ### Requested changes


      - If a further iteration is available and the iteration 10 score is near 70.8
      with line_loss_events still at 1.0 per run on the s-bend and slalom, test wheel_radius
      0.035 m alone with all other fields as in iteration 6. This is the only untested
      single lever (evidence: iterations 6 and 9 show turn-rate changes without speed
      changes did not help).

      - Do not use a sensor span beyond ±0.03 m or 8 mm footprints in any later design.
      The ±0.04 m span scored 36.6 (iteration 8) and 8 mm scored 67.7 (iteration 7),
      so both are closed.

      - If the score falls clearly below 70.8 with line losses unchanged, return to
      the iteration 6 design (wheel_track 0.12 m, wheel_radius 0.03 m) with no further
      geometry changes (iterations 6 to 9).


      - [Open this output](iteration-11/entityR1/versions/0f4be224eb154cb79f04323a53976411/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/2130b34d05da40439f0cdf715b2f1351/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-b4388d8e55e19f29/payload.json)'
