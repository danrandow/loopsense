  id: race-111-randow-maps
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: 8mm sensor footprints
    notes: 'Keeps the best design (mass 0.4 kg, 70.83) and changes only sensor_size
      from 0.012 to 0.008 m. Based on the Integrator''s branch: line losses stayed
      at 1.0 per run with max_error at or above 0.06 m, and steering oscillation is
      low, so yaw inertia is exhausted and footprint sharpness is the next test.


      ### Rationale


      Iteration 6 (mass 0.4 kg, body_length 0.16 m, y 0.05 m, 12 mm footprints, 0.06
      m span, wheel_track 0.12 m) is the best design so far at 70.83, up from 65.14
      at 0.5 kg. Mass is still a working lever. Line losses did not fall: the s-bend
      and slalom still lose the line once per run, with max_error 0.0641 and 0.0669
      m, both at or above the 0.06 m off-track limit. Steering oscillation stayed
      low at 0.133 (s-bend) and 0.148 (slalom), so the robot is not over-turning.
      The oval gained progress (0.272) but lost more line events (1.8), and the oval
      is not the binding constraint for the held-back tracks. The Integrator''s branch
      for this result is: line losses at 1.0, max_error at or above 0.06 m, and steering
      oscillation below 0.2 means the yaw-inertia route is exhausted. The next change
      is sensor coverage at 8 mm footprints, keeping mass at 0.4 kg. Iteration 0 (12
      mm) and iteration 2 (16 mm, wider span, confounded) bracket the footprint question,
      and the Integrator''s notes suggest a smaller footprint may sharpen the edge
      reading. The change is one variable: sensor_size 0.012 to 0.008 m, with all
      else held at the iteration 6 values. Risk: a smaller footprint narrows the lateral
      band over which each sensor sees tape, so it could lose the line sooner on drift.
      I accept that risk because it is the test the Integrator asked for and it is
      measurable. If line losses rise, the footprint is too small and the next step
      is 0.012 m again, or a span change at 0.012 m.


      - [Open this output](iteration-7/entity0/versions/6dc514ae31b545a287ac3593b752654f/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-f4e622ed45357ab9/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-b4388d8e55e19f29/payload.json)'
  - id: entity1
    label: 8mm footprint test
    notes: 'Iteration 6 best design (70.83, mass 0.4 kg) with sensor_size reduced
      to 0.008 m and the controller held fixed. This isolates footprint, since line
      losses stayed at 1.0 on the s-bend and slalom and yaw inertia is at its floor.


      ### Rationale


      The evidence is iteration 6 (70.83, best): mass 0.4 kg, body_length 0.16 m,
      12 mm footprints, 0.06 m span, y 0.05 m, wheel_track 0.12 m. Its failure is
      unchanged: one line loss per run on the s-bend and slalom, with max_error 0.0641
      and 0.0669 m, both at or above the 0.06 m off-track limit. Steering oscillation
      is low (0.133 and 0.148), so the robot is not over-turning. Earlier single-variable
      tests ruled out several levers: y 0.07 m did not remove the loss (iteration
      3), body_length 0.12 m lowered the score (iteration 5), and the 0.016 m, wider-span
      design scored lowest (iteration 2, confounded). Mass has now been taken to its
      0.4 kg minimum, so yaw inertia is exhausted, and the remaining single lever
      is sensor footprint. I adopt the Builder''s geometry as proposed: sensor_size
      0.008 m, with mass, body, positions, span and wheel geometry unchanged. The
      controller is held exactly at the iteration 6 values (kp 3.0, ki 0, kd 0.2,
      base_speed 1.5, last_direction, weights +1, +0.5, 0, -0.5, -1). Changing the
      gains now would confound the footprint test, and iteration 1 showed higher gain
      did not help. Risk: a smaller footprint lowers each sensor''s reading when the
      robot is off-centre, so the sum of readings may fall below 0.05 sooner and produce
      more line-loss events. The 8 mm footprints still leave the 25 mm tape covered,
      since sensor spacing (0.015 m) is below the tape width. Expected result, as
      a prediction only: line losses on the s-bend and slalom fall below 1.0 and max_error
      drops under 0.06 m. The score should exceed 70.83, or the footprint is too small
      and the next step returns to 0.012 m.


      - [Open this output](iteration-7/entity1/versions/e5cfff2e0c114e3d9c72e09a5f4324e9/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/6dc514ae31b545a287ac3593b752654f/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-b4388d8e55e19f29/payload.json)'
  - id: entityR1
    label: Footprint branch feedback
    notes: 'Feedback for the Builder: the 8 mm test is the only remaining lever after
      mass and body length were exhausted. Branches depend on whether line losses
      fall below 1.0 and whether the score beats 70.83, citing iterations 2, 3, 5
      and 6.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. The controller
      is the iteration 6 controller unchanged, since iteration 6 (70.83) is the best
      score and the only gain change (iteration 1) was confounded and scored lower.
      Iteration 6 showed one line loss per run on the s-bend and slalom with max_error
      0.0641 and 0.0669 m, and steering_oscillation of 0.133 to 0.148. Mass reduction
      from 0.5 to 0.4 kg raised the score (iteration 4 to 6), while body_length 0.12
      m lowered it (iteration 5) and y 0.07 m did not help (iteration 3). So the yaw-inertia
      route is exhausted and sensor footprint is the lever now being tested. Read
      the next race by these branches. If line losses fall below 1.0 per run on the
      s-bend and slalom and the score exceeds 70.83, keep sensor_size 0.008 m, since
      sharper edge reading helps. If line losses rise above 1.0, or the score falls
      below 70.83 with progress unchanged, the 8 mm footprint is too small for the
      drift: return sensor_size to 0.012 m. If steering_oscillation rises above about
      0.2 with the smaller footprint, the sensor signal is becoming jittery, so return
      to 0.012 m before changing geometry.


      ### Requested changes


      - Keep the iteration 7 test: sensor_size 0.008 m with mass 0.4 kg, body_length
      0.16 m and y 0.05 m. If line_loss_events fall below 1.0 per run on the s-bend
      and slalom and the score exceeds 70.83, keep 0.008 m for the next test. Iteration
      6 (12 mm) left 1.0 losses per run, so smaller footprints are the untested direction.

      - If line losses rise above 1.0 or the score falls, return sensor_size to 0.012
      m and try a wider lateral span at that footprint, x = ±0.04 m with sensors at
      0.02 m spacing. Iteration 2 widened the span but was confounded with 16 mm footprints
      and a lighter body, so this has not been isolated.

      - If steering_oscillation rises above about 0.2 at 0.008 m, return sensor_size
      to 0.012 m and try wheel_track 0.14 m to slow the turn rate. Iteration 1 (narrow
      0.10 m track with higher gain) gave no benefit from faster turning, so this
      is a damping test, not a speed gain.


      - [Open this output](iteration-7/entityR1/versions/e5cfff2e0c114e3d9c72e09a5f4324e9/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/6dc514ae31b545a287ac3593b752654f/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-b4388d8e55e19f29/payload.json)'
