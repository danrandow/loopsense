map:
  id: race-111-randow-maps
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Revert to iter 6 base
    notes: 'Returns wheel_track to 0.12 m, the iteration 6 geometry that scored 70.83,
      because the 0.14 m track (iteration 9, 69.05) left line losses at 1.0 and lowered
      the oval score. Every other geometry lever has now been tested and lowered the
      score, so this holds the best-evidenced base.


      ### Rationale


      Iteration 9 (wheel_track 0.14 m) scored 69.05, below the iteration 6 best of
      70.83. Line_loss_events stayed at 1.0 per run on the s-bend and slalom, so the
      wider track did not remove the drift. The oval got slightly worse (score 104.2
      vs 107.4, progress 0.264 vs 0.272, line losses 1.8). Steering oscillation fell
      a little on the s-bend (0.1285 vs 0.1333) and the slalom (0.1419 vs 0.1481),
      but this did not reduce line losses or raise progress. Both branches in the
      Integrator''s feedback point the same way: line losses unchanged and the score
      not improved means turn rate is not the limit, so return wheel_track to 0.12
      m. Every geometry lever has now been tested at least once: mass is at its 0.4
      kg floor, body_length 0.12 m lowered the score, y 0.07 m did not help, 8 mm
      footprints and the ±0.04 m span both lowered the score, and wheel_track 0.14
      m lowered it. The best evidence-backed geometry is therefore the iteration 6
      design (70.83), which I hold as the base. I am not adding untested changes this
      iteration, because the controller is fixed and the one remaining iteration is
      needed to confirm the base. The Integrator''s controller is unchanged, so any
      difference from 70.83 would come from seed or track noise rather than geometry.


      - [Open this output](iteration-10/entity0/versions/6685269c1f8b4f8e84e24c4a98946a6b/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-52ac461704275a01/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-f2232b116428b357/payload.json)'
  - id: entity1
    label: Complete Robot Package
    notes: 'Complete Robot Package. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      The Builder''s iteration 9 proposal is the iteration 6 design (score 70.83)
      with one change: wheel_track 0.12 m to 0.14 m. Evidence: iteration 6 left one
      line loss per run on the s-bend and slalom, with max_error 0.0641 and 0.0669
      m and low steering_oscillation (0.133 and 0.148). Iterations 7 and 8 closed
      the footprint and span levers at 12 mm: the 8 mm footprint scored 67.75 and
      the ±0.04 m span scored 36.6. Iteration 5 showed that a shorter body hurts,
      and iteration 3 showed that a forward offset does not remove the loss. Yaw inertia
      is already at the 0.4 kg floor, so turn rate is the remaining untested lever.
      Turn rate is the wheel speed difference divided by wheel_track, so a 0.14 m
      track gives about 14 percent less turn per unit of PWM differential. The effective
      steering gain therefore falls with the track change. I keep the iteration 6
      controller exactly (kp 3.0, ki 0, kd 0.2, base_speed 1.5, last_direction, weights
      +1, +0.5, 0, -0.5, -1) so that the race isolates the track change. Raising kp
      to offset the lower turn rate would confound the test. Geometry is passed through
      as the Builder specified: 0.4 kg, body 0.16 m by 0.12 m, five sensors at x =
      +0.03 to -0.03 with y = 0.05 m, 12 mm footprints, wheel_radius 0.03 m. Expected
      result, as a prediction only: steering_oscillation at or below about 0.15, and
      line losses at or below 1.0 per run on the s-bend and slalom. The main risk
      is that slower turning causes an earlier line loss on the sharpest bends, which
      would show up as a lower score.


      - [Open this output](iteration-9/entity1/versions/ed92bb696ae34ca5927dcff50a1c044d/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/b4a197eeb78c4c5e874901812aa6d018/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-5a7ce3411db6d9bd/payload.json)'
  - id: entityR1
    label: Integration Feedback
    notes: 'Integration Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. The controller
      is the iteration 6 controller unchanged, so the race isolates the track change.
      Evidence from earlier races: iteration 6 (70.83, best) had one line loss per
      run on the s-bend and slalom, with max_error 0.0641 and 0.0669 m and steering_oscillation
      of 0.133 and 0.148. Iterations 7 and 8 closed the footprint and span levers
      at 12 mm (8 mm gave 67.75; ±0.04 m gave 36.6, with s-bend progress collapsing
      to 0.04). Iteration 5 showed that body_length 0.12 m lowers the score, and iteration
      3 showed that the forward offset y 0.07 m does not remove the loss. Mass is
      at its 0.4 kg floor. Track width is the remaining single lever. Note that turn
      rate scales with 1/wheel_track, so 0.14 m gives about 14 percent less turn per
      unit of PWM. Read the next race by these branches. If line losses fall below
      1.0 per run on the s-bend and slalom and steering_oscillation falls, turn rate
      was the limit, so try wheel_track 0.16 m next. If line losses stay at 1.0 and
      progress is unchanged, the controller rather than the geometry is limiting the
      robot, so return to wheel_track 0.12 m as the base. If line losses rise or the
      oval score falls, the robot is under-turning, so return to 0.12 m.


      ### Requested changes


      - If line_loss_events fall below 1.0 per run on the s-bend and slalom and steering_oscillation
      falls below 0.133 and 0.148 (iteration 6), try wheel_track 0.16 m with the other
      fields unchanged, to test whether more damping still helps.

      - If line losses stay at 1.0 per run with progress and score unchanged, return
      wheel_track to 0.12 m and hold the iteration 6 geometry as the final base, since
      no geometry lever has yet beaten 70.83 at 12 mm footprints with ±0.03 m span
      (iterations 6 to 8).

      - If line_loss_events rise above 1.0 or the score falls below 70.83 with progress
      on the s-bend lower, return to wheel_track 0.12 m, since the slower turn rate
      is causing the robot to under-turn the sharpest bends (iteration 6 evidence).


      - [Open this output](iteration-9/entityR1/versions/ed92bb696ae34ca5927dcff50a1c044d/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/b4a197eeb78c4c5e874901812aa6d018/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-5a7ce3411db6d9bd/payload.json)'
