  - id: entity0
    label: Baseline 5-sensor
    notes: 'A symmetric five-sensor baseline with a 0.06 m span, 12 mm footprints,
      a 0.05 m forward offset, and a light 0.7 kg body. With no race data yet, the
      design rests on the contract limits and the aim of avoiding line loss while
      keeping speed.


      ### Rationale


      This is iteration 0, so there is no race telemetry or integration feedback yet.
      The design therefore starts from the contract''s limits and sound priors. Five
      sensors spread across the front of the body at x = +0.03, +0.015, 0, -0.015,
      -0.03 with 12 mm footprints give a 0.06 m sensing span. The tape is 25 mm wide,
      so the sensors overlap enough that the line stays visible through modest lateral
      error. The wide span also keeps the sum of readings above the 0.05 line-loss
      threshold when the robot drifts. The sensors sit 0.05 m ahead of the axle, so
      the signal is read before the wheels turn, which helps the controller respond
      to bends. The body is 0.12 m wide, which gives an off-track limit of 0.06 m,
      the floor value, and is wide enough to avoid a tight body constraint. The wheel
      track is 0.12 m and the wheel radius 0.03 m, a mid-range drivetrain that should
      allow a fast average speed, with the 3 s deadline requiring roughly 1.5 m/s.
      Mass is 0.7 kg, a light robot that accelerates quickly while keeping the yaw
      inertia low, since mass times (length squared plus width squared)/12 governs
      how fast it can turn. I expect a first race to complete the oval with few line
      losses. The main unknowns are whether the sensor span is too wide for the slalom''s
      sharpest bends and whether the 0.05 m forward offset causes lag. Both should
      show up in the measurements requested below.


      - [Open this output](iteration-0/entity0/versions/4abc12f8a2f14a7190c9c54e47226766/payload.json)'
