overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor
    notes: 'A symmetric five-sensor baseline with a 0.06 m span, 12 mm footprints,
      a 0.05 m forward offset, and a light 0.7 kg body. With no race data yet, the
      design rests on the contract limits and the aim of avoiding line loss while
      keeping speed.


      ### Rationale


      This is iteration 0, so there is no race telemetry or integration feedback yet.
      The design therefore starts from the contract''s limits and sound priors. Five
      sensors spread across the front of the body at x = +0.03, +0.015, 0, -0.015,
      -0.03 with 12 mm footprints give a 0.06 m sensing span. The tape is 25 mm wide,
      so the sensors overlap enough that the line stays visible through modest lateral
      error. The wide span also keeps the sum of readings above the 0.05 line-loss
      threshold when the robot drifts. The sensors sit 0.05 m ahead of the axle, so
      the signal is read before the wheels turn, which helps the controller respond
      to bends. The body is 0.12 m wide, which gives an off-track limit of 0.06 m,
      the floor value, and is wide enough to avoid a tight body constraint. The wheel
      track is 0.12 m and the wheel radius 0.03 m, a mid-range drivetrain that should
      allow a fast average speed, with the 3 s deadline requiring roughly 1.5 m/s.
      Mass is 0.7 kg, a light robot that accelerates quickly while keeping the yaw
      inertia low, since mass times (length squared plus width squared)/12 governs
      how fast it can turn. I expect a first race to complete the oval with few line
      losses. The main unknowns are whether the sensor span is too wide for the slalom''s
      sharpest bends and whether the 0.05 m forward offset causes lag. Both should
      show up in the measurements requested below.


      - [Open this output](iteration-0/entity0/versions/4abc12f8a2f14a7190c9c54e47226766/payload.json)'
  - id: entity1
    label: Baseline robot, kp 3 PD
    notes: 'Builder''s baseline geometry with a proportional-derivative controller
      (kp 3.0, kd 0.2, no integral), speed 1.5 and last-direction line-loss recovery.
      No race evidence exists yet, so the gains come from the contract equations.


      ### Rationale


      Iteration 0 has no race telemetry and no integration feedback, so the controller
      is built from the contract''s equations and the Builder''s stated hypotheses.
      Geometry is passed through unchanged so the Builder''s baseline is tested as
      proposed. Sensor weights are proportional to each sensor''s sideways position
      (+1.0, +0.5, 0, -0.5, -1.0). Positive x is left and a positive signal steers
      left, so a line under the left sensors produces a left-steering correction.
      kp=3.0 gives a moderate steering response, since a half-scale signal of 0.5
      yields a turn of 1.5 and about 525 PWM of wheel differential. ki=0 avoids integral
      windup on the bends. kd=0.2 damps the response without much added noise sensitivity.
      base_speed=1.5 gives 75 percent PWM, which should give an average speed near
      the 1.5 m/s needed for the 3 s deadline while leaving margin for the slalom.
      line_loss=''last_direction'' makes the robot keep turning toward the side it
      last saw the tape, which suits a line that is lost on a bend. The observation
      request covers completion, timing, error and line-loss measures, plus oscillation
      and controller health, so the next race separates steering problems from geometry
      problems. Expected result: the robot completes the oval and s-bend with few
      line losses. The slalom is the most likely failure point. This is a prediction
      only, not a measured outcome.


      - [Open this output](iteration-0/entity1/versions/c884001f514146a6a312b6c0fda0b13d/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/4abc12f8a2f14a7190c9c54e47226766/payload.json)'
  - id: entityR1
    label: Baseline feedback, 3
    notes: 'Iteration 0 feedback with no measured results. It gives three conditional
      geometry changes (forward offset, sensor spacing, wheel track), each tied to
      a race outcome to check, since no earlier race evidence exists.


      ### Feedback


      No earlier race exists, so this feedback rests only on the contract and on what
      I had to set in the controller for this geometry, not on any measured outcome.
      Five sensors at 0.015 m spacing with 12 mm footprints overlap the 25 mm tape,
      so at least one sensor sees tape through a moderate lateral error, which is
      why I used linear weights (+1, +0.5, 0, -0.5, -1) and kp 3.0. If the next race
      shows steering_oscillation high with line_loss_events at 0 (the robot weaving
      on the line), reduce kp or raise kd, and keep the sensor spacing. If it shows
      line_loss_events above zero, concentrated on the sharpest slalom bends, the
      outer sensors at ±0.03 m are not reaching the tape early enough. Try a wider
      span or a larger forward offset (y up to about 0.07 m) so the signal is read
      before the wheels turn. If completion_time is near or above 3 s with no line
      losses, the wheel track or mass is limiting turn authority, not the sensors.
      Try a shorter wheel track (0.10 m) to raise turn rate, keeping the mass near
      0.7 kg, since yaw inertia depends on body size and mass.


      ### Requested changes


      - If line_loss_events > 0 on the slalom or s-bend, try a forward offset of y
      = 0.07 m for all five sensors (keep x positions and sensor_size 0.012) to give
      earlier bend anticipation. No earlier race evidence yet; this is a hypothesis
      to test.

      - If steering_oscillation is high on the oval with few line losses, keep the
      sensor geometry but ask for a lower-gain controller path by reporting whether
      a sensor spacing of 0.02 m (x = ±0.04, ±0.02, 0) gives a smoother signal. No
      earlier race evidence yet.

      - If completion_time is above 2.8 s with no line losses, reduce wheel_track
      from 0.12 m to 0.10 m to increase turn rate on the slalom while keeping mass
      at 0.7 kg. No earlier race evidence yet.


      - [Open this output](iteration-0/entityR1/versions/c884001f514146a6a312b6c0fda0b13d/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/4abc12f8a2f14a7190c9c54e47226766/payload.json)'
  actions:
  - id: action0
  - id: action1
