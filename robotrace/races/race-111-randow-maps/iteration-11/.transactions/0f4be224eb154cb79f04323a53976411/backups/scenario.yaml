map:
  id: race-111-randow-maps
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: Hold iteration 6 base
    notes: 'Holds the iteration 6 geometry (70.83, confirmed by iteration 10 at 70.8269)
      unchanged for the final race, rather than adding an untested wheel_radius change
      with no later iteration to verify it. The evidence is two identical races with
      one line loss per run on the s-bend and slalom, and the 0.14 m track test (69.05)
      and other geometry levers all scored lower.


      ### Rationale


      The iteration 10 race has returned. It reproduces the iteration 6 design exactly:
      score 70.8269, with one line loss per run on the s-bend and slalom and identical
      per-track metrics. That confirms the iteration 6 geometry as a stable base,
      and the score difference in iteration 9 (69.05) came from the 0.14 m track.


      The Integrator''s conditional branch applies here: the score is near 70.8 with
      line losses still at 1.0 per run, so the base is confirmed and wheel_radius
      0.035 m is the one untested single lever. I considered testing it, but this
      is the final iteration. Whatever I submit here is the design raced on the unseen
      final track, and no later iteration exists in which to use what a dev race reveals.
      Wheel_radius 0.035 m raises speed and turn rate together. Turn rate was the
      factor that lowered the score when slowed (0.14 m track), and faster turning
      on the 0.10 m track (iteration 1, confounded) also scored lower. So an untested
      change would stake the final score on an unverified gain.


      I therefore hold the iteration 6 geometry unchanged: mass 0.4 kg, body 0.16
      m by 0.12 m, five 12 mm sensors at x = +0.03, +0.015, 0, -0.015, -0.03 and y
      = 0.05 m, wheel_track 0.12 m, wheel_radius 0.03 m. This is the best-evidenced
      design (70.83 on two independent races). I expect a score near 70.8 on the development
      tracks, and the final unseen race is the one that depends on how well this base
      transfers.


      - [Open this output](iteration-11/entity0/versions/2130b34d05da40439f0cdf715b2f1351/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-d6f32982721ca139/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-b4388d8e55e19f29/payload.json)'
  - id: entity1
    label: Base confirmation, 70.8
    notes: 'Restores the iteration 6 best geometry (wheel_track 0.12 m) with the iteration
      6 controller unchanged, so the race confirms the base. Evidence: iteration 6
      scored 70.83, and iteration 9 showed the 0.14 m track lowered the score to 69.05.


      ### Rationale


      The Builder''s iteration 10 proposal restores the iteration 6 geometry (70.83,
      the best result). The only change from iteration 9 is wheel_track back to 0.12
      m. Iteration 9 (0.14 m track, 69.05) showed that a wider track neither removed
      the s-bend and slalom line losses nor raised the score, so turn rate is not
      the limit. Every geometry lever tested at 12 mm footprints has either lowered
      the score or left line losses at 1.0 per run: mass 0.4 kg is at its floor, body_length
      0.12 m lowered the score, y 0.07 m did not help, 8 mm footprints lowered it,
      the ±0.04 m span collapsed the s-bend (36.6), and the 0.14 m track lowered it.
      I therefore accept the geometry exactly as proposed. The controller is kept
      identical to iteration 6 (kp 3.0, ki 0, kd 0.2, base_speed 1.5, last_direction
      recovery, weights +1, +0.5, 0, -0.5, -1). Any controller change now would confound
      this confirmation race, and the only gain change tried (iteration 1) was confounded
      with a narrower track and scored lower. Expected result, as a prediction only:
      a score near 70.8 with about 1.0 line-loss event per run on the s-bend and slalom.
      Any difference would come from seed or track noise, since the design is unchanged
      from iteration 6.


      - [Open this output](iteration-10/entity1/versions/45be5ea5558f4f94b54b14205f3046da/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/6685269c1f8b4f8e84e24c4a98946a6b/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-f2232b116428b357/payload.json)'
  - id: entityR1
    label: 'Next test: wheel_radius'
    notes: 'Pre-race feedback: if the base holds at about 70.8, the final iteration
      should test wheel_radius 0.035 m alone, since it is the only lever not yet tried.
      Other geometry tests are closed by iterations 6 to 9.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. The geometry
      is the iteration 6 best design (70.83) with wheel_track 0.12 m, and the controller
      is unchanged from iteration 6, so this race confirms the base. Evidence: iteration
      6 had one line loss per run on the s-bend and slalom, with max_error 0.064 and
      0.067 m and steering_oscillation of 0.133 and 0.148. Iteration 9 (wheel_track
      0.14 m, 69.05) showed that slower turning did not remove the losses and lowered
      the score, so track width is closed. Iterations 7 and 8 closed footprint (8
      mm gave 67.75) and span (±0.04 m gave 36.6). Read the next race by these branches.
      If the score is near 70.8 with line losses still at 1.0 per run, the base is
      confirmed and the final iteration can test one lever, wheel_radius 0.035 m,
      which raises speed and turn rate together. If the score is clearly below 70.8
      with line losses at 1.0, the variation is from track or seed noise, not geometry,
      so keep the iteration 6 geometry as the final base rather than adding changes.
      If line losses fall below 1.0 per run on the s-bend or slalom, the wheel_track
      0.12 m base has a real edge, and the final test should be wheel_radius only.


      ### Requested changes


      - If the iteration 10 score is near 70.8 with line_loss_events still at 1.0
      per run on the s-bend and slalom, hold the iteration 6 geometry and test wheel_radius
      0.035 m alone in the final iteration. Iteration 9 showed turn-rate changes without
      speed changes did not help, so this is the only untested single lever, and it
      raises speed and turn rate together (evidence: iterations 6 and 9).

      - If the score falls clearly below 70.8 with line losses unchanged, do not add
      geometry changes. Return to the iteration 6 design with wheel_track 0.12 m,
      since no lever has beaten 70.83 at 12 mm footprints with ±0.03 m span (iterations
      6 to 9).

      - Do not use a sensor span beyond ±0.03 m or 8 mm footprints in the final iteration.
      The ±0.04 m span scored 36.6 (iteration 8) and 8 mm scored 67.7 (iteration 7),
      so both are closed.


      - [Open this output](iteration-10/entityR1/versions/45be5ea5558f4f94b54b14205f3046da/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/6685269c1f8b4f8e84e24c4a98946a6b/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-f2232b116428b357/payload.json)'
