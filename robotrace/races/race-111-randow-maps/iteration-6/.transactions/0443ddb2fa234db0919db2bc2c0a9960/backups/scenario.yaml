  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Body length 0.12 m test
    notes: 'Keeps the iteration 4 mass of 0.5 kg, which scored the best so far at
      65.1, and changes only body_length from 0.16 to 0.12 m. Iteration 4 still had
      1.0 line losses per run on the s-bend and slalom with max_error of 0.067 to
      0.068 m, which meets the Integrator''s branch for body_length.


      ### Rationale


      Iteration 4 (mass 0.5 kg, y 0.05 m, 12 mm footprints, 0.06 m span, body_length
      0.16 m) scored 65.14, the best so far. Mass reduction helped the score, but
      the failure remains: the s-bend and slalom still lose the line once per run,
      and max_error is 0.0666 and 0.0678 m, both above the 0.06 m off-track limit.
      The oval got worse (1.6 line losses), but the oval is not the binding constraint
      for the held-back tracks. The Integrator''s branch for this case is to hold
      mass at 0.5 kg and change body_length to 0.12 m alone. Iteration 2 changed body_length
      together with span and footprint, so its effect is unknown. This iteration isolates
      body_length. Going from 0.16 to 0.12 m lowers yaw inertia from mass*(0.16^2+0.12^2)/12
      to mass*(0.12^2+0.12^2)/12, a reduction of about 25 percent at the same mass.
      Span, footprint, sensor offset, wheel geometry, body width, and the controller
      (kp 3.0, kd 0.2, base_speed 1.5, last_direction recovery) stay unchanged. Expected
      result: line losses on the s-bend and slalom fall toward 0.5 per run or lower,
      max_error drops below 0.06 m for more of the course, and the score rises above
      65. If line losses stay at 1.0 with max_error still at or above 0.06 m, body
      length is not the limit and the next step is a sensor-coverage test. If steering_oscillation
      rises above about 0.2, the robot is over-turning, and mass or body length should
      move back toward the iteration 0 values.


      - [Open this output](iteration-5/entity0/versions/b019e0897d53479982ea2d7f12f23b55/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-bb34f3c06f33fdce/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-31c13a23f85e2997/payload.json)'
  - id: entity1
    label: Body length 0.12 m test
    notes: 'Iteration 4 design with body_length cut from 0.16 to 0.12 m and the controller
      held fixed, to isolate yaw inertia. Based on iteration 4 (65.14), which still
      lost the line once per run on the s-bend and slalom.


      ### Rationale


      Iteration 4 (mass 0.5 kg, sensor y 0.05 m, body_length 0.16 m, 12 mm footprints,
      0.06 m span, wheel_track 0.12 m) is the best design so far at 65.14. Its failure
      is unchanged: one line loss per run on the s-bend and slalom, with max_error
      of 0.0666 and 0.0678 m, just above the 0.06 m off-track limit. Iteration 3 showed
      that moving the sensors forward to y 0.07 m does not remove the loss, and iteration
      2 (16 mm footprints, wider span, lighter body) scored lowest, so larger footprints
      and wider spans have not helped. The Builder''s intent is to isolate body_length,
      which lowers yaw inertia by about 25 percent at fixed mass (0.16 to 0.12 m).
      I accept this geometry exactly as proposed. The controller is kept identical
      to iteration 4 (kp 3.0, ki 0, kd 0.2, base_speed 1.5, last_direction line loss,
      weights +1, +0.5, 0, -0.5, -1). Any change in controller would confound the
      single-variable test the Builder needs. Iteration 1 showed that raising kp and
      kd did not help, so there is no evidence that more gain is the fix. Expected
      result, as a prediction only: line losses on the s-bend and slalom fall toward
      0.5 or lower and max_error drops below 0.06 m for longer. The race will show
      whether body_length is the limit.


      - [Open this output](iteration-5/entity1/versions/422b596899d34f4b89e57ca017d26885/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/b019e0897d53479982ea2d7f12f23b55/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-31c13a23f85e2997/payload.json)'
  - id: entityR1
    label: Next-step branches for
    notes: 'Feedback written before the race. It sets next steps by line-loss and
      oscillation outcomes, with mass 0.4 kg, wheel_track 0.14 m and 8 mm footprints
      as the tied options. The evidence is iterations 1, 2 and 4.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. The controller
      is the iteration 4 controller unchanged, because the only gain test (iteration
      1: kp 4.5, kd 0.3 on a 0.10 m track) scored lower at 53.7, and iteration 0 (kp
      3.0, kd 0.2) and iteration 4 (same controller, 0.5 kg) are the best-scoring
      controllers. So any score change in this race is attributable to body_length
      alone. Iteration 4 (65.14) is the best result, and its failure is a single line
      loss per run on the s-bend and slalom, with max_error 0.0666 and 0.0678 m. Iteration
      3 (y 0.07 m) showed the forward offset does not remove that loss, and iteration
      2 (16 mm footprints, wider span, 0.5 kg, 0.12 m body) scored lowest at 46.5,
      so larger footprints and wider coverage have not helped. Read the next race
      as follows. If line losses fall below 0.5 per run on the s-bend and slalom with
      max_error under 0.06 m, body_length (yaw inertia) is a real lever, and the next
      step is the smaller footprint test. If line losses stay at 1.0 per run with
      max_error still at or above 0.06 m, the yaw inertia floor is not the whole story,
      and the next step is mass. If steering_oscillation rises above about 0.2, the
      robot is over-turning, and the geometry should move back toward the iteration
      4 values.


      ### Requested changes


      - If line_loss_events stay at 1.0 per run on the s-bend and slalom with max_error
      still at or above 0.06 m and steering_oscillation at or below 0.2, try mass
      0.4 kg with body_length 0.12 m. Iteration 4 showed 0.5 kg raised the score to
      65.14 (from 63.0 at 0.7 kg), so one more step down in mass is the next yaw-inertia
      test.

      - If steering_oscillation rises above 0.2 with body_length 0.12 m, return body_length
      to 0.16 m and try wheel_track 0.14 m to slow the turn rate. Iteration 1 (narrow
      0.10 m track with higher gain) scored 53.7, so faster turning alone has not
      helped.

      - If line_loss_events fall below 0.5 per run on the s-bend and slalom and the
      score exceeds 65.14, try sensor_size 0.008 m with the current sensor positions
      to sharpen the edge reading. Iteration 2 (16 mm footprints, wider span) scored
      lowest, so smaller footprints may help rather than hurt.


      - [Open this output](iteration-5/entityR1/versions/422b596899d34f4b89e57ca017d26885/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/b019e0897d53479982ea2d7f12f23b55/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-31c13a23f85e2997/payload.json)'
