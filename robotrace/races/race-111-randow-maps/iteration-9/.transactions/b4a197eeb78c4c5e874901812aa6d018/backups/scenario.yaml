  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 7 changed only sensor_size, from 12 mm to 8 mm, on the iteration 6
      design (70.83). It scored 67.75, which is lower, and the line-loss pattern did
      not change. The s-bend and slalom still lose the line once per run, with max_error
      0.0633 and 0.0617 m. Progress on both held-back-relevant tracks is flat (s-bend
      0.1475 vs 0.1496, slalom 0.1025 vs 0.105), and the oval lost more ground (score
      100.0 vs 107.4, progress 0.253 vs 0.272). Steering oscillation stayed in the
      0.13 to 0.15 band, so the smaller footprint did not add jitter. The Integrator''s
      rule applies: the score fell below 70.83 with progress unchanged, so the 8 mm
      footprint is too small for the drift. I return sensor_size to 0.012 m, the best-performing
      footprint. The yaw-inertia route (mass 0.4 kg, body_length 0.16 m) is kept,
      since it is the best result so far. The remaining untested geometry lever is
      lateral span at the 12 mm footprint. Iteration 2 widened the span to ±0.04 m,
      but it was confounded with 16 mm footprints and a 0.5 kg, 0.12 m body, so its
      result says nothing about span alone. This iteration changes only the span:
      the outer sensors move from ±0.03 m to ±0.04 m, with five sensors at 0.02 m
      spacing. Expected result: the sensors keep seeing tape at larger lateral error,
      so line losses on the s-bend and slalom fall below 1.0 per run, max_error stays
      under 0.06 m for longer, and the score exceeds 70.83. Risk: at 0.02 m spacing
      the centre may saturate and blur the small-error signal, so the Integrator should
      check the sum of readings and the signal resolution near centre.


      - [Open this output](iteration-8/entity0/versions/9dd9f1f68b964e2bb3a09ede972adc35/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-23dcf51c8932eb9e/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-288b40eeacabc84e/payload.json)'
  - id: entity1
    label: Wider span test at 12 mm
    notes: 'Outer sensors moved to ±0.04 m at 0.02 m spacing on the iteration 6 best
      design, with sensor_size 0.012 m and the controller unchanged. Tests span alone;
      iteration 7 showed the 8 mm footprint lowered the score.


      ### Rationale


      Iteration 6 (mass 0.4 kg, 12 mm footprints, span ±0.03 m, y 0.05 m, controller
      kp 3.0, kd 0.2, base_speed 1.5, last_direction) is the best design at 70.83.
      Its failure is unchanged: one line loss per run on the s-bend and slalom, with
      max_error 0.0641 and 0.0669 m. Steering oscillation is low (0.133 and 0.148),
      so the robot is not over-turning. Earlier single-variable tests have closed
      several levers: y 0.07 m did not remove the loss (iteration 3), body_length
      0.12 m lowered the score (iteration 5), mass is at its 0.4 kg floor, and the
      8 mm footprint lowered the score to 67.75 (iteration 7). The Builder''s intent
      is to test lateral span alone at 12 mm, widening the outer sensors from ±0.03
      m to ±0.04 m at 0.02 m spacing. I adopt that geometry exactly as proposed: sensor_size
      0.012, mass 0.4, body_length 0.16, y 0.05, wheel geometry unchanged. The controller
      is held at the iteration 6 values, including the same linear weights (+1, +0.5,
      0, -0.5, -1), which still match the sensor order. Any gain change would confound
      the span test, and iteration 1 showed that raising gain did not help. Risk:
      at 0.02 m spacing the centre sensor is likely to read near 1 for small errors,
      which can flatten the signal near the centre. I will watch for this in the next
      race. Expected result, as a prediction only: line losses on the s-bend and slalom
      fall below 1.0 per run, max_error stays under 0.06 m for longer, and the score
      exceeds 70.83. If the score falls with progress unchanged, span is not the limit.


      - [Open this output](iteration-8/entity1/versions/2ea943eb73994e288210ba7c6c45a11f/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/9dd9f1f68b964e2bb3a09ede972adc35/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-288b40eeacabc84e/payload.json)'
  - id: entityR1
    label: Span test and branches
    notes: 'Feedback cites iteration 6 (70.83) and iteration 7 (67.75) to keep 12
      mm, and gives branches for the span result: keep, revert to ±0.03 m with wheel_track
      0.14 m, or return if the centre saturates.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. The controller
      is the iteration 6 controller unchanged, because iteration 6 (70.83) is the
      best score and the only gain change (iteration 1) was confounded and scored
      lower. The evidence supports the span test. Iteration 6 showed one line loss
      per run on the s-bend and slalom, with max_error 0.0641 and 0.0669 m and low
      steering oscillation (0.133 to 0.148), so the robot drifts rather than jitters.
      Several levers are now closed: y 0.07 m did not remove the loss (iteration 3),
      body_length 0.12 m lowered the score (iteration 5), mass is at its 0.4 kg floor
      (iteration 6 beat iteration 4), and the 8 mm footprint lowered the score (iteration
      7, 67.75). Read the next race by these branches. If line losses fall below 1.0
      per run on the s-bend and slalom and the score exceeds 70.83, keep the ±0.04
      m span. If line losses stay at 1.0 with max_error still at or above 0.06 m and
      progress flat, span is not the limit, and the next test is wheel_track 0.14
      m to damp turn rate. If the centre reads near 1 on every step and the oval gets
      worse, the 0.02 m spacing is saturating the signal, so return to ±0.03 m.


      ### Requested changes


      - Keep sensor_size at 0.012 m and mass at 0.4 kg, and test the outer sensors
      at x = ±0.04 m with 0.02 m spacing, as in this race. Iteration 7 (8 mm) fell
      to 67.75, and iteration 6 (12 mm, ±0.03 m) reached 70.83, so 12 mm is the footprint
      to keep while span is tested.

      - If line_loss_events stay at 1.0 per run on the s-bend and slalom and progress
      is unchanged, return the span to ±0.03 m and try wheel_track 0.14 m with the
      other fields as in iteration 6. Iteration 1 (narrow 0.10 m track with higher
      gain) gave no benefit from faster turning, so this is a damping test, not a
      speed gain.

      - If the centre sensor reads near 1 on the middle steps and the oval score drops,
      the 0.02 m spacing is blurring small errors. Return to ±0.03 m spacing, which
      gave the iteration 6 best score.


      - [Open this output](iteration-8/entityR1/versions/2ea943eb73994e288210ba7c6c45a11f/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/9dd9f1f68b964e2bb3a09ede972adc35/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-288b40eeacabc84e/payload.json)'
