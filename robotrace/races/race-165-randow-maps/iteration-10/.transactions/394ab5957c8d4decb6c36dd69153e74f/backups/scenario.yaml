overrides:
  entities:
  - id: entity0
    label: Wheel track 0.14 test
    notes: 'Holds the best-raced layout (±0.03 m reach, score 271.06 at iteration
      9) and changes only wheel_track from 0.12 to 0.14 m. The slalom still shows
      line loss of 1.0, which the Integrator''s rule identifies as the remaining untested
      geometry lever.


      ### Rationale


      Iteration 9 is the best raced result at 271.06, up from 160.5 at iterations
      7 and 8. The geometry was unchanged across 7, 8 and 9, so the 110-point gain
      came from the controller. The oval now finishes 8 of 20 trials (mean progress
      0.91) and the s-bend progress rose to 0.44, which means the ±0.03 m reach with
      15 mm spacing, y = 0.04, 0.016 footprint and the 0.18 m / 0.8 kg body is confirmed
      under the new damping. The Integrator''s feedback sets the rule for this case:
      if the score holds near the best result with oval completions kept, keep ±0.03
      m and y = 0.04, and test wheel_track as a single-variable change. Slalom line_loss_events
      is still 1.0 at iteration 9 with slalom progress near 0.10, so the Integrator''s
      condition for testing wheel_track is met. Iterations 2 and 3 showed body changes
      cost progress, so body_length, mass and body_width stay fixed. Changing wheel_track
      from 0.12 to 0.14 m reduces yaw per unit wheel differential by about 14 percent,
      which changes the effective steering gain. This is a single-variable test. I
      expect slalom line loss to fall toward 0 if the line is being lost in tight
      bends because the robot turns too fast, and I expect s-bend and oval progress
      to hold. The main risk is a slower response on bends, which would show as lower
      oval completions. I will read the result against iteration 9''s 271.06.


      - [Open this output](iteration-10/entity0/versions/2dd76b7d1bab4dd9890b41def0950d1b/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-ce8a20d9fe00610b/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-4c1dd08cbe597ae3/payload.json)'
  - id: entity1
    label: Wider track 0.14 test
    notes: 'Builder''s geometry with wheel_track 0.14 on the verified iteration 9
      controller (kd 0.35, kp 2.5), so only the turn-rate lever changes. Supported
      by iteration 9 (271.06) and the reproducibility shown by iterations 7 and 8.


      ### Rationale


      The Builder''s entity0 tests wheel_track 0.14 (from 0.12) on the iteration 9
      platform. Iteration 9 (271.06) used the same sensor layout, body and wheel radius,
      with kp 2.5, ki 0.05, kd 0.35, base_speed 1.5, symmetric weights and last_direction
      line loss. Iterations 7 and 8 reproduced 160.5 exactly, so the simulator is
      deterministic and single-variable tests are reliable. I keep the verified controller
      unchanged so that any score or line-loss change is attributable to wheel_track
      alone. Wider track cuts yaw per unit wheel differential by about 14 percent,
      so the robot may steer more gently. I expect a retune to be needed only if oval
      completions fall, and I will not change kp in this race to avoid confounding
      the test. Slalom line loss of 1.0 persists in every race, and that is the lever
      this test targets. The geometry is taken as supplied from entity0.


      - [Open this output](iteration-10/entity1/versions/5b9e4a01d1eb4265af5edbf8ecee6bf6/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/2dd76b7d1bab4dd9890b41def0950d1b/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-4c1dd08cbe597ae3/payload.json)'
  - id: entityR1
    label: Keep kp, test track rule
    notes: 'Feedback fixes the controller and gives conditional rules for the wheel_track
      result. It is grounded in iteration 9''s 8 oval completions and persistent slalom
      line loss of 1.0.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. Iteration
      9 (271.06, ±0.03 m, y=0.04, 0.016 footprint, kd 0.35) is the best raced platform.
      Its slalom line_loss_events is still 1.0 and slalom progress about 0.10, so
      the wheel_track lever is the one still untested. Iteration 8 repeated iteration
      7 exactly, so single-variable tests here are reliable. The controller is held
      fixed so the race isolates wheel_track. Read the next race as follows. If the
      score holds at or near 271 with oval completions kept, keep wheel_track 0.14
      and move to a single further step only if slalom line loss is still at or above
      1. If oval completions fall and the score drops well below 271, the steering
      gain has dropped; return to 0.12 or test 0.10, and do not change body or mass.
      Iterations 2 and 3 showed that body changes cost progress, so body_length, mass
      and body_width should stay fixed.


      ### Requested changes


      - If the score is at or near 271 with oval completions held and slalom line_loss_events
      below 1: keep wheel_track at 0.14 and keep sensor_positions at x = ±0.03, y
      = 0.04, sensor_size 0.016. Evidence: iteration 9 (271.06) with the same layout
      and controller, and iteration 8 reproducing iteration 7 exactly.

      - If oval completions fall below 8 of 20 and the score drops well below 271:
      return wheel_track to 0.12, or test 0.10 as a single change. Evidence: the iteration
      9 oval finished 8 of 20 with mean progress 0.91; a lower steering gain from
      a wider track is the likely cause if completions fall.

      - Do not change body_length, body_width or mass. Evidence: iteration 2 (0.14
      m, 0.6 kg) cut s-bend progress from 0.16 to 0.1275, and iteration 3 recovered
      it on the baseline body.


      - [Open this output](iteration-10/entityR1/versions/5b9e4a01d1eb4265af5edbf8ecee6bf6/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/2dd76b7d1bab4dd9890b41def0950d1b/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-4c1dd08cbe597ae3/payload.json)'
