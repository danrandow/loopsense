overrides:
  entities:
  - id: entity0
    label: 'Final: restore best (271)'
    notes: 'Restores the iteration 9 geometry (wheel_track 0.12, outer sensors ±0.03,
      0.016 footprint, 0.18 m / 0.8 kg body), which is the best verified result at
      271.06. Iteration 10''s wheel_track 0.14 dropped oval completions from 8 to
      3 and the score to 215, so it is rejected for the final unseen-track race.


      ### Rationale


      This is the final iteration, so the design raced here is the one scored on the
      unseen track. I am choosing the most robust verified geometry rather than testing
      a new lever. Iteration 9 (wheel_track 0.12, outer sensors at x = ±0.03, y =
      0.04, 15 mm spacing, 0.016 footprint, 0.18 m / 0.8 kg body) is the best raced
      result at 271.06. Iteration 8 reproduced iteration 7 exactly, so results are
      deterministic for a fixed design. Iteration 10 tested wheel_track 0.14 on the
      same platform and scored 215.32, a drop of 56 points. Oval completions fell
      from 8 of 20 to 3 of 20, and oval progress fell from 0.91 to 0.80. The lower
      steering gain from the wider track hurt the completion term that dominates the
      score. The Integrator''s conditional rule for this case says to return wheel_track
      to 0.12, and the data supports that. The R1 feedback''s ''keep 0.14'' request
      is contradicted by iteration 10''s outcome, so I do not follow it. Slalom line
      loss stays at about 1 on every design, but I will not gamble the final race
      on an untested fix. Body length, body width, mass, footprint, row position and
      spread all stay at their verified iteration 9 values, since body changes cost
      progress in iterations 2 and 3. I expect a score near 271 on the development
      tracks. The unseen track is the real uncertainty, and the main protection is
      keeping the design that has produced the most completions.


      - [Open this output](iteration-11/entity0/versions/3e310dfa3de94eba822fa3fd604454db/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-e58c872c8974ecd6/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-d3ceaf106326dd95/payload.json)'
  - id: entity1
    label: 'Final: verified iter 9'
    notes: 'Restores the iteration 9 geometry and kd 0.35 controller, the best raced
      design at 271.06 with 8 of 20 oval completions. Deterministic reproduction (iteration
      8) and the wheel_track 0.14 regression (iteration 10) support keeping it unchanged
      for the unseen track.


      ### Rationale


      This is the final iteration, so the design raced here is the one scored on the
      unseen track. The best verified result is iteration 9 at 271.06, with wheel_track
      0.12, outer sensors at x = ±0.03 (y = 0.04, 15 mm spacing), a 0.016 footprint,
      a 0.18 m by 0.12 m body at 0.8 kg, and the controller kp 2.5, ki 0.05, kd 0.35,
      base_speed 1.5, weights [-2,-1,0,1,2] with last_direction line loss. Iteration
      8 reproduced iteration 7 exactly (160.5), so the simulator is deterministic
      for a fixed design, and iteration 9''s 8-of-20 oval completions are the strongest
      evidence available. I keep this exact design rather than testing wheel_track
      0.14 (iteration 10 fell to 215.32 because oval completions dropped from 8 to
      3), the untested 0.10 to 0.11 track, or any body change (iteration 2 cut s-bend
      progress). The evidence supports a score near 271 on the development tracks.
      The unseen track remains the main uncertainty, and this design is the most robust
      option available.


      - [Open this output](iteration-11/entity1/versions/2c514fd0b964453a9218d95b0fa172d8/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/3e310dfa3de94eba822fa3fd604454db/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-d3ceaf106326dd95/payload.json)'
  - id: entityR1
    label: 'Final feedback: hold'
    notes: 'Asks the Builder to keep the iteration 9 geometry, wheel_track 0.12 and
      the current body, based on iterations 8 to 10. No further iterations follow,
      so these requests are recorded only.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. This
      candidate is the verified iteration 9 platform (271.06) with the iteration 9
      controller, so it reproduces the best evidence you have. The evidence for each
      element: iteration 9 gave 8 of 20 oval completions with ±0.03 m outer sensors,
      15 mm spacing, y = 0.04 and a 0.016 footprint. Iteration 8 reproduced iteration
      7 exactly, so the result is deterministic. Iteration 10 showed wheel_track 0.14
      lowered oval completions to 3 of 20 and the score to 215.32. Iteration 6 showed
      the ±0.036 reach at kd 0.25 scored 97.7, and iterations 2 and 3 showed that
      body changes cost s-bend progress. Because this is the final iteration, no further
      race will follow this one, so the requested changes below are for the record
      and do not alter this race.


      ### Requested changes


      - Keep sensor_positions at x = ±0.03 and y = 0.04 with 15 mm spacing, and sensor_size
      0.016. Evidence: iteration 9 (271.06, 8 of 20 oval completions) and iteration
      8 reproducing iteration 7 exactly.

      - Keep wheel_track at 0.12. Evidence: iteration 10 at wheel_track 0.14 dropped
      oval completions from 8 to 3 and the score from 271.06 to 215.32.

      - Keep body_length 0.18, body_width 0.12 and mass 0.8. Evidence: iteration 2
      (0.14 m, 0.6 kg) cut s-bend progress from 0.16 to 0.1275, and iteration 3 recovered
      it on the baseline body.


      - [Open this output](iteration-11/entityR1/versions/2c514fd0b964453a9218d95b0fa172d8/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/3e310dfa3de94eba822fa3fd604454db/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-d3ceaf106326dd95/payload.json)'
