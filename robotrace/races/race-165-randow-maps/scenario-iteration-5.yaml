  id: race-165-randow-maps
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Wider outer sensors
    notes: 'Keeps the baseline body and 0.016 footprint, which tied the 0.012 footprint
      (score 52.20 vs 52.10). Widens only the outer sensors to ±0.036 m because slalom
      line loss stayed at 1 with progress near 0.11, as the Integrator''s rule requires.


      ### Rationale


      Iteration 4 (sensor_size 0.016 on the baseline body) scored 52.198 against 52.101
      for iteration 3 at 0.012. The change is neutral: s-bend progress 0.1585 vs 0.16,
      rms_error 0.0285 vs 0.0287, steering_oscillation 0.145 vs 0.1456, and line-loss
      events unchanged at 1. The Integrator''s rule for this case is that progress
      at or above 0.16 with rms and oscillation not worse means keep 0.016. Progress
      is 0.0015 short of that line, but rms and oscillation are marginally better
      and the score is marginally higher, and no sign of centring blur appeared, so
      I keep the 0.016 footprint. The baseline body (0.18 m, 0.8 kg) stays, because
      iteration 2 showed the lighter body cost progress. The remaining evidence points
      at the outer sensors. On the slalom, line_loss_events is still 1.0 and progress
      is 0.112, which meets the Integrator''s condition for widening the outer sensors.
      I therefore move the outer pair to x = ±0.036 m at y = 0.04 and keep the middle
      three at ±0.015 and 0 m. This keeps tape under an outer sensor at larger drift,
      which should remove the remaining slalom line loss and lift slalom progress.
      The main risk is that the outer sensors lose signal resolution near centre and
      raise rms_error, so I will watch rms_error and steering_oscillation against
      iteration 4 (0.0302 and 0.156 on the slalom).


      - [Open this output](iteration-5/entity0/versions/ac16f2e18e364c2a820880fc6a2adbc5/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-75a6ddd3380dac64/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-3faf8a3c83d9ca96/payload.json)'
  - id: entity1
    label: Widened outer sensors
    notes: 'Integrates the Builder''s +/-0.036 m outer-sensor geometry on the confirmed
      0.18 m, 0.8 kg body with the 0.016 footprint, holding the iteration 4 controller
      so only the sensing changes. Supported by iteration 4 (score 52.198) and the
      persistent slalom line loss of 1 at +/-0.03.


      ### Rationale


      Iteration 4 (sensor_size 0.016 on the baseline body, +/-0.03 m, y=0.04) scored
      52.198, the best result since iteration 0, with rms_error 0.0285 and steering_oscillation
      0.145 on the s-bend. The footprint change did not blur the centring signal,
      so I keep 0.016. Slalom line_loss_events is still 1.0 with progress 0.112, the
      same limit seen on every outer-sensor setting since iteration 3. The Builder''s
      intent is to widen the outer pair to x = +/-0.036 m at y = 0.04, which should
      keep tape under an outer sensor at larger drift. I take that geometry as proposed.
      For the controller I hold the iteration 4 values (kp 2.5, ki 0.05, kd 0.15,
      base_speed 1.5, weights [-2,-1,0,1,2], last_direction). Weights are unitless
      and the signal is a centroid of tape position, so widening the sensors does
      not change the signal scale. Holding the controller isolates the geometry change.
      Expected result, not measured: slalom line loss falls toward 0 and slalom progress
      rises above 0.112. The main risk is that the outer sensors lose resolution near
      centre and raise rms_error above 0.032 on the slalom. In that case the Builder''s
      fallback to +/-0.03 applies.


      - [Open this output](iteration-5/entity1/versions/3a627a83483e4be8a0fb49089360234c/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/ac16f2e18e364c2a820880fc6a2adbc5/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-3faf8a3c83d9ca96/payload.json)'
  - id: entityR1
    label: Outer-sensor reach
    notes: 'Pre-race feedback: keep the baseline body and 0.016 footprint, and decide
      the next step on slalom line loss and rms_error. Thresholds rest on iterations
      0, 2, 3 and 4, where body and spread changes were separated.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      best-supported base is iteration 4: baseline 0.18 m / 0.8 kg body, +/-0.03 m
      at y=0.04, sensor_size 0.016, score 52.198, with s-bend rms_error 0.0285 and
      steering_oscillation 0.145. Iteration 2 showed the lighter body (0.14 m, 0.6
      kg) cut s-bend progress to 0.1275, and iteration 3 recovered it to 0.16 on the
      baseline body, so keep the baseline body. Iteration 0 (+/-0.02 m) had 2 line-loss
      events per slalom run, and iterations 3 and 4 at +/-0.03 m reduced this to 1.
      Slalom line loss is therefore still limited by the outer reach. Read the next
      race as follows. If slalom line_loss_events falls to 0 with rms_error at or
      below 0.032, keep +/-0.036 and move to a controller gain test. If line loss
      stays at 1 and progress stays near 0.11, the limit is controller speed or gain,
      not geometry, so keep the sensor layout and do not change the body. If rms_error
      rises above 0.032 on the slalom, return the outer sensors to +/-0.03.


      ### Requested changes


      - If slalom line_loss_events is 0 and rms_error is at or below 0.032: keep sensor_positions
      at x = +/-0.036 and y = 0.04, keep sensor_size 0.016, and keep body 0.18 m and
      0.8 kg. Evidence: iteration 4 at +/-0.03 gave slalom line loss 1 and progress
      0.112, so the outer reach is the remaining limit.

      - If rms_error on the slalom rises above 0.032 (iteration 4 was 0.0302): return
      the outer sensors to x = +/-0.03 and keep the 0.016 footprint. Evidence: iteration
      4 with 0.016 at +/-0.03 kept rms_error at 0.0302 and oscillation at 0.156, so
      the wider pair may be costing centring signal.

      - If line_loss_events stays at 1 on the slalom with progress near 0.11 even
      at +/-0.036: keep the geometry fixed and do not change the body, since the controller
      speed or gain is the likely limit. Evidence: the body is confirmed at 0.18 m
      and 0.8 kg (iteration 2 at 0.14 m / 0.6 kg cut s-bend progress to 0.1275), and
      sensor_size 0.016 was neutral to slightly positive (iteration 4).


      - [Open this output](iteration-5/entityR1/versions/3a627a83483e4be8a0fb49089360234c/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/ac16f2e18e364c2a820880fc6a2adbc5/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-3faf8a3c83d9ca96/payload.json)'
