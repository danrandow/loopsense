overrides:
  entities:
  - id: entity0
    label: Outer reach back to ±0.03
    notes: 'Pulls the outer sensors from ±0.036 to ±0.03 because slalom rms rose from
      0.0303 to 0.0333 after the kd change, which matches the Integrator''s rule to
      reduce reach when rms rises. The footprint, body and track are held fixed to
      isolate the reach. Evidence is iteration 6''s slalom telemetry and iteration
      4''s ±0.03 slalom rms of 0.0302.


      ### Rationale


      Iteration 6 raced the iteration 5 geometry with only the controller changed
      (kd 0.15 to 0.25). The score rose to 97.7 from 52.4, mostly on the oval (progress
      0.40 vs 0.115) and slalom (progress 0.153 vs 0.109). The slalom did not clear,
      though. Line-loss events rose to 1.35, rms_error rose from 0.0303 to 0.0333,
      and steering_oscillation rose from 0.159 to 0.195. Neither the ''line loss stays
      at 1 with progress near 0.11'' rule nor the ''line loss clears'' rule applies
      cleanly, because progress has moved away from 0.11. The rule that does match
      is the rms_error rise: the Integrator''s rule says that when slalom rms rises
      the body and sensors are not the cause, and the next move is to reduce sensor
      reach rather than widen it. The rise coincides with the kd change, so the controller
      is the more likely driver. Still, reach is the only geometry lever the Integrator
      has tied to a rule, and pulling the outer pair back from x=±0.036 to ±0.03 is
      a small, reversible change. It also returns to a layout the Integrator has already
      measured on the slalom (iteration 4, rms 0.0302). I keep the 0.016 footprint,
      the 0.18 m / 0.8 kg body, y=0.04 and the 0.12 m track fixed, so the result isolates
      the reach. The main risk is that the 97.7 score depends on the wider reach with
      the new kd, so a score drop would point at reach, not the controller.


      - [Open this output](iteration-7/entity0/versions/ebff546191e64447afa1ab036fa7ecca/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-18a2ff362fafdbc1/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-a3dcf441e11cb160/payload.json)'
  - id: entity1
    label: Geometry held, kd 0.35
    notes: 'Keeps the iteration 5/6 geometry as the Builder proposed and raises kd
      from 0.25 to 0.35. Iteration 6 showed kd 0.15 to 0.25 lifted the score from
      52 to 98 on oval and slalom progress, so the damping trend is tested further.


      ### Rationale


      Iteration 6 (kd 0.25, geometry as in iteration 5) raised the score from 52.4
      to 97.7. Oval progress rose from 0.115 to 0.40 and slalom progress from 0.109
      to 0.153, which shows the damping change is what moved the score. Slalom rms
      rose to 0.0333, oscillation to 0.195 and line loss to 1.35, so the gain is not
      yet clean. Score is dominated by the 250*progress term, so progress is the main
      lever. The Builder holds the iteration 5 geometry unchanged this round, so I
      keep it identical and continue the damping trend. I raise kd from 0.25 to 0.35,
      keeping kp 2.5, ki 0.05, base_speed 1.5, the symmetric weights and last_direction,
      so the result isolates derivative damping. Expected, not measured: oval and
      slalom progress hold or rise, and slalom oscillation falls. The risk is that
      kd amplifies sensor noise, which would show as rising oscillation and rms.


      - [Open this output](iteration-7/entity1/versions/ee11c12f031d44aeadefd2c8b74ec0cb/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/ebff546191e64447afa1ab036fa7ecca/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-a3dcf441e11cb160/payload.json)'
  - id: entityR1
    label: Keep geometry, test wheel
    notes: 'Advises keeping the iteration 5/6 layout and body, and tests wheel_track
      0.14 only if slalom line loss stays at 1 with low progress. Based on iterations
      2 to 6, where geometry changes were neutral and the damping change drove the
      score.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      geometry you propose is the iteration 5 set, which I am keeping. Iteration 5
      (score 52.36) and iteration 4 (score 52.20) show the outer reach and footprint
      are neutral; iteration 3 vs 2 showed the 0.14 m / 0.6 kg body cut s-bend progress
      from 0.16 to 0.1275, so the body stays. Iteration 6 kept your geometry and raised
      kd from 0.15 to 0.25, lifting the score to 97.7 with oval progress 0.40 and
      slalom progress 0.153, but slalom rms rose to 0.0333 and line loss to 1.35.
      So the geometry is not the limit on progress; the controller damping is. This
      round I raise kd to 0.35 on the same geometry. If the next race shows progress
      rising with rms and oscillation holding, the geometry is sufficient and you
      should keep it. If slalom line loss stays at 1 or more with progress still near
      0.15, the untested geometry lever is wheel_track.


      ### Requested changes


      - Keep sensor_positions at x = +/-0.036 and y = 0.04, sensor_size 0.016, and
      the 0.18 m / 0.8 kg body. Evidence: iteration 5 (score 52.36) and iteration
      6 (score 97.7, same geometry) are the best-supported layout, and the body change
      at iteration 2 cost about 6 points.

      - If slalom line_loss_events stays at 1 or more and slalom progress stays below
      0.16 after the damping change: test wheel_track 0.14 (from 0.12), changing nothing
      else. Evidence: iterations 3 to 6 never changed the turn rate per wheel, and
      slalom line loss has stayed at 1 or above across all of them.

      - Do not change body_length or mass again. Evidence: iteration 2 (0.14 m, 0.6
      kg) cut s-bend progress from 0.16 to 0.1275, and iteration 3 recovered it to
      0.16 on the baseline body.


      - [Open this output](iteration-7/entityR1/versions/ee11c12f031d44aeadefd2c8b74ec0cb/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/ebff546191e64447afa1ab036fa7ecca/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-a3dcf441e11cb160/payload.json)'
