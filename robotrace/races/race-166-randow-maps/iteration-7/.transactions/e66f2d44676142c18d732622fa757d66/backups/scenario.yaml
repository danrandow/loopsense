map:
  id: race-166-randow-maps
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 6 (mass 0.6, y = 0.07, wheel_track 0.12, 16 mm sensors) scored 54.61,
      close to iteration 3''s 54.90 at mass 0.8. Oval progress rose slightly from
      0.1175 to 0.12 and is the first oval movement in any race. Oval max_error is
      0.0609, still at the 0.06 floor, so the rise is marginal. S-bend oscillation
      is 0.140, under the 0.15 limit, so mass 0.6 does not over-respond on that track.
      S-bend progress is 0.1625, close to the 0.165 seen at mass 0.8, and the forward
      lead is still the main s-bend driver: y = 0.04 and 0.06 both gave 0.04, while
      y = 0.07 gave 0.165. Slalom still loses the line once per run (1.0 events) and
      reaches only 0.1075 progress, so the slalom is the weakest track.


      I am keeping mass 0.6, since it did no harm and gave a small oval gain. Entity
      R1 conditions the next lead test on oval progress above 0.1175 and max_error
      below 0.06. The first condition holds. The second does not strictly hold (0.0609),
      but the oval is at the floor in every race and the difference is 0.0009 m. I
      judge that the oval lever is exhausted and the open question is the s-bend and
      slalom lead. I am therefore following R1''s requested single change: forward
      lead from y = 0.07 to y = 0.08, the contract maximum, with spread, footprint,
      weights, wheel track and mass unchanged. Expected result: s-bend progress rises
      above 0.1625, toward completion, and slalom progress rises from 0.1075. The
      risk is that the stronger lead raises s-bend or slalom oscillation above 0.15,
      which would mean returning to y = 0.07.


      - [Open this output](iteration-7/entity0/versions/7c508e9678a54bb8945dd467cf434af5/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-72166868abdeb134/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-6c113a7044105c4c/payload.json)'
  - id: entity1
    label: Mass 0.6 on iter 3 base
    notes: 'Restores the iteration 3 geometry (y = 0.07, wheel_track 0.12) and tests
      a single oval lever, mass 0.8 to 0.6 kg, with the controller unchanged. Iteration
      3 scored 54.90 with oval progress flat at 0.1175, and s-bend oscillation at
      0.144.


      ### Rationale


      Iteration 5 (wheel_track 0.12, y = 0.06) scored 36.76, its worst result since
      iteration 1. Its s-bend progress fell from 0.165 at y = 0.07 to 0.04, the same
      as the y = 0.04 baseline, so the forward lead carries the s-bend gain. Under
      the Integrator rule set in iteration 5, this restores y = 0.07 at wheel_track
      0.12, which is the iteration 3 design (score 54.90, s-bend progress 0.165, s-bend
      steering_oscillation 0.144, under the 0.15 limit). Oval progress has been flat
      at 0.1175 across every track width and lead change, so mass is the next oval
      lever. The Builder''s requested change is mass 0.8 to 0.6 kg, which lowers yaw
      inertia (mass times (body_length^2 + body_width^2)/12) and should give a quicker
      turn response. The controller is unchanged from iterations 3 to 5: kp 3.0, ki
      0.1, kd 0.2, base_speed 2.0, sensor_weights 25 times x (-2, -1, 0, 1, 2), and
      last_direction line-loss recovery. Only mass changes against iteration 3, so
      the race isolates that lever. Expected result: oval progress above 0.1175 with
      max_error near or below 0.06, s-bend progress near 0.165, and s-bend steering_oscillation
      at or below 0.15. If s-bend oscillation exceeds 0.15, the Builder''s rule applies:
      restore mass 0.8 and test wheel_track 0.11 at y = 0.07.


      - [Open this output](iteration-6/entity1/versions/94e2b476af274dba98ff62b3cc095bd4/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/028402317c0b46c0b883c235b266fcf4/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-48df655857328444/payload.json)'
  - id: entityR1
    label: Mass and lead next steps
    notes: 'Gives the Builder conditional next steps: keep mass 0.6 and test y = 0.08
      if the s-bend stays at or below 0.15 oscillation; otherwise restore mass 0.8
      and test wheel_track 0.11. Built from iterations 3 to 5, where oval progress
      never moved off 0.1175 and the lead drove s-bend progress.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. Evidence:
      iteration 3 (y = 0.07, wheel_track 0.12, mass 0.8) scored 54.90, with s-bend
      progress 0.165, s-bend steering_oscillation 0.144, and oval progress flat at
      0.1175 with max_error at the 0.06 floor. Iteration 5 (y = 0.06) fell to 36.76
      because s-bend progress dropped to 0.04, which confirms the forward lead drives
      the s-bend. Iteration 4 (wheel_track 0.10) lifted the score to 56.50 but pushed
      s-bend oscillation to 0.164 and slalom line losses to 0.95, and oval progress
      again stayed at 0.1175. Oval progress has not moved across any track width or
      lead, so turn authority and lead are not the oval lever. Integration note: the
      controller is unchanged, so mass alters the robot''s response without any compensation
      from me. Decide the next step from the per-track telemetry: if oval progress
      rises above 0.1175 with max_error below 0.06 and s-bend steering_oscillation
      at or below 0.15, keep mass 0.6 and use the next iteration to test a single
      lead change (y = 0.08). If s-bend steering_oscillation exceeds 0.15, restore
      mass 0.8 and test wheel_track 0.11 at y = 0.07. If oval progress stays at 0.1175
      with mass 0.6, the oval limit is not the robot''s inertia either, and the remaining
      cause is controller response. That is an Integrator question, and I will tune
      it in the controller rather than ask for further oval geometry changes.


      ### Requested changes


      - If the next race shows oval progress above 0.1175 and s-bend steering_oscillation
      at or below 0.15 at mass 0.6, keep mass 0.6 and test the forward lead at y =
      0.08 with the same spread and weights. Evidence: iteration 3 showed the lead
      moved s-bend progress from 0.04 (y = 0.04) to 0.165 (y = 0.07), and y = 0.06
      dropped it to 0.04.

      - If the next race shows s-bend steering_oscillation above 0.15 at mass 0.6,
      restore mass 0.8 and set wheel_track to 0.11 at y = 0.07. Evidence: iteration
      3 at mass 0.8 gave s-bend oscillation 0.144, and iteration 4 at wheel_track
      0.10 pushed it to 0.164, so a narrower track is the next gentler test.

      - Do not request further oval geometry changes if oval progress stays at 0.1175
      at mass 0.6. Evidence: oval progress was 0.115 to 0.1175 in every race, across
      track width (0.10 and 0.12), lead (y = 0.04, 0.06, 0.07), footprint and spread,
      so the oval limit is not geometric.


      - [Open this output](iteration-6/entityR1/versions/94e2b476af274dba98ff62b3cc095bd4/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/028402317c0b46c0b883c235b266fcf4/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-48df655857328444/payload.json)'
