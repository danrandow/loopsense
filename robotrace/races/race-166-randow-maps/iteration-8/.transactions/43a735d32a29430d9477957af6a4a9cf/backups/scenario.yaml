map:
  id: race-166-randow-maps
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Lead 0.08, mass 0.5 test
    notes: 'Keeps the best-scoring y = 0.08 lead (score 75.92, oval progress 0.2725)
      and changes only mass from 0.6 to 0.5 kg to test whether a lighter robot holds
      the s-bend and slalom. Restore mass 0.6 if s-bend progress or slalom line losses
      get worse.


      ### Rationale


      Iteration 7 (y = 0.08, mass 0.6, wheel_track 0.12, 16 mm sensors, 0.16 m spread)
      scored 75.92, the best result so far, up from 54.61 at y = 0.07. The gain came
      mainly from the oval, where progress rose from 0.12 to 0.2725 and oval score
      from 51 to 115. Oval max_error stayed at the 0.06 floor, so the oval was still
      at the edge but covered much more track. The s-bend fell slightly, from 0.1625
      to 0.1573, and its oscillation was 0.135, under the 0.15 limit. Slalom progress
      was 0.1094 (above the 0.1075 threshold) with 1.0 line loss per run, which is
      within the limit I set.


      My earlier pre-committed rule said to restore y = 0.07 if s-bend progress fell
      below 0.1625. I am not applying that rule. It was set before the oval gain was
      visible, and the overall score rose by 21 points. The s-bend loss is 0.005 of
      progress, while the oval gain is about 0.15 of progress on one track. Restoring
      y = 0.07 would give up the best-scoring design.


      The design races once per seed, so repeating iteration 7 exactly would return
      the same result and teach us nothing. I therefore keep the y = 0.08 lead and
      sensor footprint and change one thing: mass from 0.6 to 0.5 kg. Lower mass has
      already moved in the right direction. Going from 0.8 to 0.6 kg lowered s-bend
      oscillation (0.144 to 0.140) and lifted oval progress slightly (0.1175 to 0.12).
      The expected result is a further small reduction in yaw inertia, which should
      help the s-bend and slalom hold their progress at the stronger lead. The main
      risk is that a lighter robot over-responds on the oval, where steering oscillation
      already rose to 0.18 at y = 0.08. Oval oscillation is not one of the stated
      limits, but I will watch it.


      The controller is unchanged, so this race isolates the mass step against iteration
      7.


      - [Open this output](iteration-8/entity0/versions/a37b1adf1db543b09049a4c3489328af/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-4a5a2478e2e4b376/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-90cf861ce9233ea8/payload.json)'
  - id: entity1
    label: Lead 0.08, mass 0.6
    notes: 'Moves the forward sensor lead from 0.07 to the 0.08 contract maximum at
      mass 0.6, with the controller unchanged, as the Builder requested. The s-bend
      lead threshold (0.04 at 0.06, 0.165 at 0.07) and the iteration 6 oscillation
      of 0.140 justify testing the next step.


      ### Rationale


      Iteration 6 (mass 0.6, y = 0.07, wheel_track 0.12, 16 mm sensors) scored 54.61,
      close to iteration 3''s 54.90 at mass 0.8. The Builder''s intent is one change:
      forward lead from y = 0.07 to y = 0.08, the contract maximum, with mass 0.6,
      spread, footprint, wheel track and the 25-times-x weights unchanged.


      Evidence: the forward lead is the s-bend lever. Progress was 0.04 at y = 0.04
      and 0.06, and 0.1625 to 0.165 at y = 0.07. That is a threshold, not a smooth
      slope, so y = 0.08 could help or could overshoot. Oscillation is the risk. Iteration
      3 had s-bend steering_oscillation 0.144 at y = 0.07, and iteration 6 had 0.140
      at mass 0.6. The Builder''s rule (restore y = 0.07 if s-bend oscillation exceeds
      0.15 or s-bend progress falls below 0.1625) is sound.


      Controller decision: keep kp 3.0, ki 0.1, kd 0.2, base_speed 2.0, sensor_weights
      (-2, -1, 0, 1, 2) and line_loss last_direction, exactly as in iterations 3 and
      6. The controller is unchanged, so the race isolates the lead. A further 0.08
      m lead lowers the sensor-to-axle lag the controller sees, so the corrective
      signal arrives earlier. That should help the s-bend and slalom progress without
      a gain change. I have not changed kd here, since the Builder asked for a single
      geometry change and kd is the next lever only if this result shows oscillation
      rising.


      Expected result: s-bend progress above 0.1625, slalom progress above 0.1075
      with at most one line loss per run, and s-bend steering_oscillation at or below
      0.15. The oval should remain near 0.12, with max_error near its 0.06 floor.


      - [Open this output](iteration-7/entity1/versions/e66f2d44676142c18d732622fa757d66/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/7c508e9678a54bb8945dd467cf434af5/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-6c113a7044105c4c/payload.json)'
  - id: entityR1
    label: Lead 0.08 feedback
    notes: 'Gives the Builder pre-race rules for y = 0.08: keep it if s-bend progress
      exceeds 0.1625 with oscillation at or below 0.15, test 0.075 if oscillation
      exceeds 0.15, and restore 0.07 if slalom losses rise. Based on iterations 2,
      3, 5 and 6 telemetry.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. Evidence:
      the s-bend lead is the main lever. Iteration 2 (y = 0.04) and iteration 5 (y
      = 0.06) both gave s-bend progress 0.04. Iteration 3 (y = 0.07, mass 0.8) gave
      0.165 and iteration 6 (y = 0.07, mass 0.6) gave 0.1625. That is a threshold
      between 0.06 and 0.07, so the gain is not linear and y = 0.08 could overshoot.
      Oscillation is the cost. Iteration 3 had s-bend steering_oscillation 0.144 and
      iteration 6 had 0.140, both under the 0.15 limit. Iteration 4 showed that a
      narrower track raises oscillation (0.164), so you should expect the stronger
      lead to add oscillation as well. Integration note: the controller is unchanged
      (kp 3.0, ki 0.1, kd 0.2, base_speed 2.0, last_direction, weights 25 times x).
      A longer lead gives the controller earlier information, so I expect less lag
      rather than a gain change. Oval progress has stayed at 0.115 to 0.1175 in every
      race, so it is not the lever to chase at y = 0.08. Decide the next step from
      the per-track telemetry: if the s-bend progress rises above 0.1625 with s-bend
      steering_oscillation at or below 0.15, and slalom line losses stay at or below
      one per run, keep y = 0.08. If the oscillation exceeds 0.15, the lead is past
      the useful range.


      ### Requested changes


      - If the next race shows s-bend progress above 0.1625 with s-bend steering_oscillation
      at or below 0.15 and slalom line losses at or below 1.0 at y = 0.08 and mass
      0.6, keep y = 0.08 and mass 0.6. Evidence: the lead moved s-bend progress from
      0.04 (y = 0.06) to 0.165 (y = 0.07), so a further lead is the next s-bend gain
      to keep.

      - If the next race shows s-bend steering_oscillation above 0.15 at y = 0.08,
      restore y = 0.07 with mass 0.6 and test y = 0.075 as the single change. Evidence:
      iteration 3 at y = 0.07 had s-bend oscillation 0.144, and iteration 4 at a narrower
      track had 0.164, so the limit is close to the 0.07 to 0.08 range, and an intermediate
      lead tests where the oscillation crosses 0.15.

      - If the next race shows slalom line losses above 1.0 or slalom progress below
      0.1075 at y = 0.08, restore y = 0.07 and do not raise the lead further. Evidence:
      the slalom had one line loss per run at y = 0.07 (iterations 3 and 6), and y
      = 0.06 dropped the s-bend, so the slalom losses are the next warning sign that
      the lead is past its useful range.


      - [Open this output](iteration-7/entityR1/versions/e66f2d44676142c18d732622fa757d66/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/7c508e9678a54bb8945dd467cf434af5/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-6c113a7044105c4c/payload.json)'
