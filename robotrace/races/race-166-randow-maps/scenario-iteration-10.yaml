map:
  id: race-166-randow-maps
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Track 0.11 test at y=0.08
    notes: 'Keeps the reproduced best design (score 75.92, mass 0.6, lead 0.08) and
      changes only wheel_track to 0.11 m. Iteration 9 matched iteration 7 exactly,
      so the baseline is stable, and the Integrator''s rule named this as the next
      single lever.


      ### Rationale


      Iteration 9 reproduced iteration 7 exactly (score 75.9247, oval progress 0.2725,
      s-bend 0.1573, slalom 1.0 line loss per run). The simulator is deterministic
      per seed and track, so the best design is stable and the result is not seed
      noise. The one open question is whether turn authority can be raised without
      losing the oval gain. Iteration 4 showed that narrowing the track from 0.12
      to 0.10 at y = 0.07 raised s-bend oscillation to 0.164 and slalom line losses
      to 0.95, but that test used a large step at a different lead. Iteration 7''s
      s-bend oscillation at y = 0.08 is 0.135, which leaves room for a smaller step.
      I therefore test wheel_track 0.11, the single change that Entity R1 identified
      as the next test if the iteration 7 result reproduces. Mass 0.6, lead y = 0.08,
      16 mm sensors, the 0.16 m x 0.14 m body, wheel radius 0.03 and the 25-per-metre
      weights (controller side) are all unchanged. Expected result: oval progress
      near or above 0.27, s-bend steering oscillation at or below about 0.15, and
      slalom line losses at or below 1.0. Risk: the narrower track raises turn rate
      by about 9 percent for the same controller output, so the s-bend and slalom
      may over-respond as they did at 0.10. If that happens, iteration 11 should restore
      wheel_track 0.12 and the iteration 7 design, which is the known best. Iteration
      11 is the last iteration, so I will not test another geometry lever after this
      one unless this result is clearly better.


      - [Open this output](iteration-10/entity0/versions/af17c5ee4a3a4cd6828c4c9ab45f9659/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-c76bfa2085a0abd3/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-90cf861ce9233ea8/payload.json)'
  - id: entity1
    label: Wheel track 0.11 test
    notes: 'Applies the Builder''s wheel_track 0.12 to 0.11 step on the iteration
      9 design with the unchanged controller, so the race isolates the track change.
      Chosen because iteration 9 reproduced the best score (75.92) exactly, making
      it a clean comparison.


      ### Rationale


      Evidence: iteration 9 reproduced iteration 7 exactly (score 75.9247, oval progress
      0.2725, s-bend progress 0.1573 with oscillation 0.135, slalom progress 0.1094
      with 1.0 line loss per run). The simulator is deterministic per seed and track,
      so this is the reference for the comparison. The Builder proposes one change:
      wheel_track 0.12 to 0.11 m, with mass 0.6, lead y = 0.08, 16 mm sensors and
      the 0.16 m x 0.14 m body unchanged. I apply the geometry as proposed. The controller
      stays exactly as in iterations 3 to 9: kp 3.0, ki 0.1, kd 0.2, base_speed 2.0,
      line_loss last_direction, and sensor_weights 25 times x (-2, -1, 0, 1, 2). Those
      weights remain correct because sensor x positions are unchanged. Narrowing the
      track raises turn rate per unit of wheel-speed difference by about 9 percent,
      so the same kp produces more yaw. Iteration 4 showed that at y = 0.07 a 0.10
      m track pushed s-bend oscillation to 0.164 and slalom line losses to 0.95. At
      y = 0.08 the s-bend oscillation margin is smaller than the 0.015 that the 0.11
      step could use only if the response is gentle. I make no controller change so
      that this race isolates the track step against iteration 9. Expected result
      (not measured): oval progress at or above 0.2725, s-bend progress near 0.157
      with oscillation at or below 0.15, and slalom progress near 0.109 with at most
      1.0 line loss. If the s-bend oscillation exceeds 0.15 or the slalom loses the
      line more than once per run, the Builder''s rule restores wheel_track 0.12 for
      the final race.


      - [Open this output](iteration-10/entity1/versions/ccc34596e51b419d9ad81a9cb0497543/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/af17c5ee4a3a4cd6828c4c9ab45f9659/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-90cf861ce9233ea8/payload.json)'
  - id: entityR1
    label: Track 0.11 risks and
    notes: 'Feedback cites iteration 4''s over-response at 0.10 and the iteration
      8 mass sensitivity. It sets the restore-to-0.12 rule for the final race if s-bend
      oscillation exceeds 0.15 or slalom losses exceed 1.0.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. Evidence:
      iteration 9 reproduced the iteration 7 best design exactly (score 75.92; oval
      progress 0.2725 with max_error at the 0.06 floor; s-bend 0.1573 with oscillation
      0.135; slalom 0.1094 with 1.0 line loss per run). That makes iteration 9 the
      comparison point. Iteration 4 (wheel_track 0.10 at y = 0.07) gave oval progress
      0.1175, the same as the 0.12 track, so narrowing the track did not lift the
      oval at that lead. It also raised s-bend oscillation to 0.164 and slalom losses
      to 0.95. So the oval is not a turn-authority problem at y = 0.07, and the step
      to 0.11 at y = 0.08 is a test with uncertain payoff. Integration note: I changed
      nothing in the controller. The 25-per-metre weights and kp 3.0 are unchanged,
      so the narrower track gives about 9 percent more yaw per unit of controller
      output. That is the main risk on the s-bend, where the oscillation margin at
      y = 0.08 is 0.015 under the 0.15 limit. Decide the next step from the per-track
      telemetry: if s-bend oscillation is at or below 0.15 and slalom line losses
      are at or below 1.0, the 0.11 track is safe. If the oval progress also rises
      above 0.2725, keep it. If s-bend oscillation exceeds 0.15 or slalom losses rise
      above 1.0, return to 0.12 in iteration 11.


      ### Requested changes


      - If the next race shows s-bend steering_oscillation above 0.15 or slalom line_loss_events
      above 1.0 at wheel_track 0.11, restore wheel_track 0.12 for the final race with
      all other fields as in iteration 9. Evidence: iteration 4 at wheel_track 0.10
      raised s-bend oscillation to 0.164 and slalom losses to 0.95 at y = 0.07.

      - If the next race keeps s-bend oscillation at or below 0.15 and slalom losses
      at or below 1.0 but oval progress stays at 0.2725 or below, do not narrow the
      track further. Keep wheel_track 0.11 only if oval progress rises. Evidence:
      at y = 0.07 the oval progress was 0.1175 at both 0.12 and 0.10 track widths,
      so narrowing alone may not lift the oval.

      - Do not change mass in the final race. If oval progress falls well below 0.2725
      at wheel_track 0.11, the cause may be the same sensitivity seen in iteration
      8, so keep mass 0.6. Evidence: mass 0.5 at y = 0.08 dropped oval progress from
      0.2725 to 0.12 (iteration 8).


      - [Open this output](iteration-10/entityR1/versions/ccc34596e51b419d9ad81a9cb0497543/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/af17c5ee4a3a4cd6828c4c9ab45f9659/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-90cf861ce9233ea8/payload.json)'
