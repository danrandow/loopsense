overrides:
  entities:
  - id: entity0
    label: 'Final: restore iter 7'
    notes: 'Restores the best-known geometry (wheel_track 0.12, mass 0.6, lead y 0.08,
      16 mm sensors) that scored 75.92 and reproduced exactly in iteration 9. The
      wheel_track 0.11 test in iteration 10 collapsed the oval to 0.1225 progress,
      so it is rejected as the final design.


      ### Rationale


      Iteration 10 tested wheel_track 0.11 at y = 0.08 and mass 0.6, and it failed.
      Oval progress fell from 0.2725 to 0.1225, the score fell from 75.92 to 54.95,
      and slalom still lost the line once per run (progress 0.105). The oval result
      is non-monotonic in both mass and track width, and the iteration 7 design is
      the only tested point that gives the oval gain. Iterations 7 and 9 reproduced
      exactly (75.9247), so the simulator is deterministic for this design. Iteration
      9''s telemetry also shows s-bend oscillation at 0.135 and slalom at 1.0 line
      loss per run, both within the limits. Because this is the final iteration and
      the unseen-track race is scored once, the rational choice is to deliver the
      proven best design rather than explore further. I restore wheel_track 0.12 and
      keep every other field from iteration 7: mass 0.6, forward lead y = 0.08, 16
      mm sensors at x = -0.08 to 0.08 in 0.04 m steps, wheel radius 0.03, body 0.16
      by 0.14 m. The Integrator''s controller is unchanged. The risk is that an unseen
      track of a different shape behaves differently. This design is sensitive to
      mass and track width, so I do not recommend further tuning of geometry at this
      point.


      - [Open this output](iteration-11/entity0/versions/3d250a33b42f418aa2a5fecbcf0bfee4/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-895146ead46df78c/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-21e9658f83a2922d/payload.json)'
  - id: entity1
    label: 'Final: reproduced best'
    notes: 'Keeps the iteration 7 and 9 design unchanged (mass 0.6, y = 0.08, wheel_track
      0.12) with the proven controller. Iteration 9 reproduced its score of 75.92
      exactly, and both single-lever tests from it (mass 0.5, wheel_track 0.11) scored
      lower.


      ### Rationale


      This is the final iteration, so the design raced once on the unseen track is
      scored and nothing can be revised afterwards. The evidence favours the proven
      best design. Iterations 7 and 9 reproduced exactly (score 75.9247, oval progress
      0.2725, s-bend progress 0.1573 with oscillation 0.135, slalom progress 0.1094
      with 1.0 line loss per run), so the simulator is deterministic for this design.
      Every single-lever change tested from it lowered the score: mass 0.5 (iteration
      8, 55.18), and wheel_track 0.11 (iteration 10, 54.95, with oval progress back
      to 0.1225). I therefore adopt the Builder''s entity0 geometry without change:
      mass 0.6, forward lead y = 0.08 (the contract maximum), 16 mm sensors at x =
      -0.08 to 0.08 in 0.04 m steps, wheel_track 0.12, wheel_radius 0.03, body 0.16
      by 0.14 m. The controller is the same as iterations 3 to 9: kp 3.0, ki 0.1,
      kd 0.2, base_speed 2.0, sensor weights 25 times x (-2, -1, 0, 1, 2), and last_direction
      line-loss recovery. The controller is unchanged, so the only thing that can
      differ from iteration 9 is the unseen track. The risk is that the unseen track
      is of a different shape and the design''s sensitivity to mass and track width
      does not transfer. I accept that risk, because any alternative is untested here
      and would be a guess.


      - [Open this output](iteration-11/entity1/versions/1f61f7aac0334301b91d4566498f4735/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/3d250a33b42f418aa2a5fecbcf0bfee4/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-21e9658f83a2922d/payload.json)'
  - id: entityR1
    label: Final-iteration feedback
    notes: 'Feedback for a design that cannot be revised again, citing the reproduced
      75.92 result and the two failed single-lever tests. It offers conditional changes
      only in case a later iteration exists.


      ### Feedback


      Written before this candidate has raced. This is the final iteration, so no
      later geometry change can follow. The candidate is the iteration 7 and 9 design
      (score 75.9247, reproduced exactly), and the controller is unchanged from iterations
      3 to 9. Controller compensation: none is needed on the development tracks. The
      gains and 25-per-metre weights are the ones that produced the oval gain at y
      = 0.08. Iteration 8 (mass 0.5) dropped oval progress from 0.2725 to 0.12, and
      iteration 10 (wheel_track 0.11) dropped the score to 54.95. Both tests show
      that this design is sensitive to single parameters. The result on the unseen
      track is not measured and is not predicted here. Its outcome will depend on
      how far the track shape differs from the development tracks. If the team gets
      a later iteration, the race data should be read per track: a low s-bend or slalom
      result with few line losses points to the lead (y = 0.08, the maximum), and
      high steering oscillation with completion intact points to turn authority (wheel_track).
      Apply those changes only if the evidence supports them.


      ### Requested changes


      - Keep geometry exactly as in iteration 9 (mass 0.6, y = 0.08, wheel_track 0.12,
      16 mm sensors, 0.16 m spread). Evidence: iteration 9 reproduced the 75.9247
      score exactly, while mass 0.5 (iteration 8, 55.18) and wheel_track 0.11 (iteration
      10, 54.95) both lowered it.

      - If a later iteration exists and the unseen-track evidence shows steering oscillation
      above 0.15 with completion still low, test wheel_track 0.12 with y = 0.07 rather
      than narrowing the track. Evidence: iteration 3 (y = 0.07, wheel_track 0.12)
      had s-bend oscillation 0.144, while iteration 4 (wheel_track 0.10) pushed it
      to 0.164.


      - [Open this output](iteration-11/entityR1/versions/1f61f7aac0334301b91d4566498f4735/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/3d250a33b42f418aa2a5fecbcf0bfee4/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-21e9658f83a2922d/payload.json)'
