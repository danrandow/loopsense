map:
  id: race-166-randow-maps
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Lead 0.08, mass 0.5 test
    notes: 'Keeps the best-scoring y = 0.08 lead (score 75.92, oval progress 0.2725)
      and changes only mass from 0.6 to 0.5 kg to test whether a lighter robot holds
      the s-bend and slalom. Restore mass 0.6 if s-bend progress or slalom line losses
      get worse.


      ### Rationale


      Iteration 7 (y = 0.08, mass 0.6, wheel_track 0.12, 16 mm sensors, 0.16 m spread)
      scored 75.92, the best result so far, up from 54.61 at y = 0.07. The gain came
      mainly from the oval, where progress rose from 0.12 to 0.2725 and oval score
      from 51 to 115. Oval max_error stayed at the 0.06 floor, so the oval was still
      at the edge but covered much more track. The s-bend fell slightly, from 0.1625
      to 0.1573, and its oscillation was 0.135, under the 0.15 limit. Slalom progress
      was 0.1094 (above the 0.1075 threshold) with 1.0 line loss per run, which is
      within the limit I set.


      My earlier pre-committed rule said to restore y = 0.07 if s-bend progress fell
      below 0.1625. I am not applying that rule. It was set before the oval gain was
      visible, and the overall score rose by 21 points. The s-bend loss is 0.005 of
      progress, while the oval gain is about 0.15 of progress on one track. Restoring
      y = 0.07 would give up the best-scoring design.


      The design races once per seed, so repeating iteration 7 exactly would return
      the same result and teach us nothing. I therefore keep the y = 0.08 lead and
      sensor footprint and change one thing: mass from 0.6 to 0.5 kg. Lower mass has
      already moved in the right direction. Going from 0.8 to 0.6 kg lowered s-bend
      oscillation (0.144 to 0.140) and lifted oval progress slightly (0.1175 to 0.12).
      The expected result is a further small reduction in yaw inertia, which should
      help the s-bend and slalom hold their progress at the stronger lead. The main
      risk is that a lighter robot over-responds on the oval, where steering oscillation
      already rose to 0.18 at y = 0.08. Oval oscillation is not one of the stated
      limits, but I will watch it.


      The controller is unchanged, so this race isolates the mass step against iteration
      7.


      - [Open this output](iteration-8/entity0/versions/a37b1adf1db543b09049a4c3489328af/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-4a5a2478e2e4b376/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-90cf861ce9233ea8/payload.json)'
  - id: entity1
    label: Mass 0.5 kg robot, y 0.08
    notes: 'Integrated the iteration 8 design: iteration 7 geometry with mass 0.5
      kg, controller unchanged. Based on iteration 7 (75.92) and the mass 0.8 to 0.6
      trend in iterations 3 and 6.


      ### Rationale


      The Builder''s iteration 8 proposal changes one thing from iteration 7: mass
      from 0.6 to 0.5 kg. Geometry is otherwise identical: 16 mm sensors at y = 0.08,
      x = -0.08 to 0.08 at 0.04 m spacing, wheel_track 0.12, wheel_radius 0.03, body
      0.16 by 0.14 m. The controller is unchanged from iterations 3 to 7 (kp 3.0,
      ki 0.1, kd 0.2, base_speed 2.0, sensor_weights 25 times x, last_direction),
      so there is no gain compensation to add. Iteration 7 (y = 0.08, mass 0.6) is
      the best design so far at 75.92. Its oval progress was 0.2725 but oval steering_oscillation
      was 0.18, and its slalom had 1.0 line losses per run. Iteration 6 (mass 0.6,
      y = 0.07) and iteration 3 (mass 0.8, y = 0.07) showed that lowering mass from
      0.8 to 0.6 cut s-bend oscillation (0.144 to 0.140) and lifted oval progress
      slightly. Mass 0.5 lowers yaw inertia further, so the robot turns more readily
      at the same kp. I expect the oval to hold its gain, and the main risk is extra
      oval and s-bend oscillation. I also keep the Builder''s decision rule in mind:
      if s-bend oscillation exceeds 0.15 the next step is to restore 0.6. Mass 0.5
      is within the 0.4 to 1.5 kg limit, and the design is a single-variable test
      against iteration 7.


      - [Open this output](iteration-8/entity1/versions/43a735d32a29430d9477957af6a4a9cf/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/a37b1adf1db543b09049a4c3489328af/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-90cf861ce9233ea8/payload.json)'
  - id: entityR1
    label: Mass 0.5 feedback
    notes: 'Pre-race feedback on the mass 0.5 test with two decision rules tied to
      s-bend progress, slalom line losses and s-bend oscillation. Evidence is from
      iterations 3, 6 and 7.


      ### Feedback


      Written before this candidate has raced. Evidence: iteration 7 (mass 0.6, y
      = 0.08) scored 75.92, the best so far. Oval progress rose to 0.2725 with max_error
      still at the 0.06 floor, but oval steering_oscillation rose to 0.18. S-bend
      progress was 0.1573 with oscillation 0.135, and slalom progress was 0.1094 with
      1.0 line loss per run. Iteration 6 (mass 0.6, y = 0.07) gave s-bend progress
      0.1625. Iteration 3 (mass 0.8, y = 0.07) gave 0.165. So the lead from 0.07 to
      0.08 moved oval progress strongly and cost a little s-bend progress. Mass 0.8
      to 0.6 lowered s-bend oscillation (0.144 to 0.140) and lifted oval progress
      marginally. Integration note: the controller is unchanged, so the same kp gives
      more yaw at lower mass. Expect the oval oscillation to rise further, and watch
      the s-bend and slalom. Decide the next step from the per-track telemetry: if
      s-bend progress holds at or above 0.1573 and slalom line losses stay at or below
      1.0, keep mass 0.5 and test the wheel_track change only if it is needed. If
      s-bend progress falls below 0.1573 or slalom line losses exceed 1.0, restore
      mass 0.6 at y = 0.08, the iteration 7 design.


      ### Requested changes


      - If s-bend steering_oscillation exceeds 0.15 at mass 0.5, restore mass 0.6
      and set wheel_track to 0.11 at y = 0.08. Evidence: iteration 4 at wheel_track
      0.10 raised s-bend oscillation to 0.164, so a narrower track is the gentler
      way to add turn authority than further mass changes.

      - If s-bend progress falls below 0.1573 or slalom line losses exceed 1.0 at
      mass 0.5, restore mass 0.6 at y = 0.08 and keep the iteration 7 controller.
      Evidence: iteration 7 at mass 0.6 held s-bend progress at 0.1573 and slalom
      at 1.0 line loss per run, so these are the values to protect.

      - Do not move the lead beyond y = 0.08 in the next iteration. Evidence: y =
      0.08 gave the best oval progress (0.2725), and the forward lead is at the contract
      maximum, so changes to mass or wheel_track are the remaining levers.


      - [Open this output](iteration-8/entityR1/versions/43a735d32a29430d9477957af6a4a9cf/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/a37b1adf1db543b09049a4c3489328af/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-90cf861ce9233ea8/payload.json)'
