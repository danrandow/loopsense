  - id: entity0
    label: Baseline 5-sensor
    notes: 'First geometry: five 12 mm sensors spread 0.16 m across and 0.04 m ahead
      of the axle, on a 0.12 m track, 0.8 kg body. No race evidence yet, so it is
      built from the contract physics and scoring rule, with hypotheses on oscillation
      and rms error.


      ### Rationale


      This is the first iteration, so there is no race telemetry or Integrator feedback
      yet. The design therefore starts from the contract''s physics and the scoring
      rule, not from measured results. The race must cover about 4 to 5 m in under
      3 s, so the robot needs a fast, stable platform, and the line-following score
      rewards low RMS error and no line losses. I chose five sensors spread across
      0.08 m at 0.02 m spacing. That covers roughly the 25 mm tape width with redundancy,
      so the line is seen even on tight bends. A 12 mm footprint gives each sensor
      a clear reading of the tape edge without washing out the signal. Sensors sit
      0.04 m ahead of the axle so the control signal leads the wheels and gives the
      Integrator some phase lead against the drivetrain lag. Weights are proportional
      to sensor x (±2, ±1, 0), so the signal is positive when the line is on the left,
      matching the contract''s steering sign. Wheel track 0.12 m and radius 0.03 m
      give a moderate turn authority and speed. Mass 0.8 kg with a 0.16 m body keeps
      yaw inertia low enough to turn quickly. Body width 0.14 m keeps the off-track
      limit at its 0.06 m floor. I expect this to complete the course with few line
      losses, though I expect rms error to be the main cost. The base speed is set
      at 2.0 (full voltage) so the speed target is met, and the gains are moderate.
      Those gains belong to the Integrator, so I only list them as guidance in the
      intent.


