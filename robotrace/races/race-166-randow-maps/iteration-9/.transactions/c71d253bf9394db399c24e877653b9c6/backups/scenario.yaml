  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 8 (mass 0.5, y = 0.08) scored 55.18, well below iteration 7 (mass
      0.6, y = 0.08), which scored 75.92 and is the best design so far. The loss came
      from the oval. Oval progress fell from 0.2725 back to 0.12, the level seen in
      every earlier oval test, and oval score fell from 115 to 51. The s-bend improved
      to progress 0.1644 with oscillation 0.141, and slalom stayed at 1.0 line loss
      per run with progress 0.1075. So both pre-set hold rules passed (s-bend progress
      at or above 0.1573, slalom losses at or below 1.0), but the oval gain did not
      survive the lighter mass. Mass 0.5 is therefore not a monotonic improvement.
      The oval gain at y = 0.08 appears to depend on a specific mass band, and 0.6
      kg is the only tested point inside it that scores well. Entity R1''s rules for
      y = 0.08 were written for 0.5 kg and did not anticipate an oval collapse, so
      I am not following them further. The simulator is deterministic per seed and
      track, so the iteration 7 design can be restored exactly. Restoring it gives
      the best known score (75.92) and a reliable baseline for the final race. Further
      single-lever tests (for example wheel_track 0.11) remain open for later iterations
      if the team wants to explore beyond the known best.


      - [Open this output](iteration-9/entity0/versions/21da2a3f72384869ada32f0d57431f66/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-13cd79e52b4cf15f/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-d1ab1355a1843259/payload.json)'
  - id: entity1
    label: Restore iter 7 best
    notes: 'Restores the iteration 7 geometry exactly (mass 0.6, y = 0.08) with the
      unchanged controller, as the Builder asked. The race tests whether the 75.92
      result, with oval progress 0.2725, is reproducible after iteration 8''s oval
      collapse at 0.5 kg.


      ### Rationale


      Iteration 8 (mass 0.5, y = 0.08) scored 55.18, down from 75.92 at iteration
      7 (mass 0.6, y = 0.08). The loss came from the oval, where progress fell from
      0.2725 to 0.12. The s-bend (0.1644) and slalom (1.0 line loss, progress 0.1075)
      stayed within the pre-set hold rules, but the oval gain did not survive at 0.5
      kg. Mass is therefore not monotonic, and 0.6 kg is the best-tested point. The
      Builder asked for an exact restore of iteration 7 to test whether that result
      is reproducible. The controller is unchanged from iterations 3 to 8 (kp 3.0,
      ki 0.1, kd 0.2, base_speed 2.0, sensor weights 25 times x, last_direction recovery),
      so this race isolates the geometry restore. I am not changing kd or the weights,
      because the iteration 7 result is the only evidence for this geometry and any
      controller change would confound the reproduction. Expected result: oval progress
      near 0.27, s-bend near 0.157, slalom near 0.109 with 1.0 line loss per run,
      and a score near 76. If the oval differs materially from 0.2725, the race has
      a seed or disturbance effect and the team should account for it before further
      geometry changes.


      - [Open this output](iteration-9/entity1/versions/186a5bb39e594b44a2bef9123a39a8a4/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/21da2a3f72384869ada32f0d57431f66/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-d1ab1355a1843259/payload.json)'
  - id: entityR1
    label: Reproduce, then wheel
    notes: 'Feedback is written before the race. It tells the Builder to keep mass
      0.6 and y = 0.08 if the oval reproduces, and to test wheel_track 0.11 next,
      with iteration 4 as the evidence. It warns against further mass moves, since
      iteration 8 showed the oval gain disappears at 0.5 kg.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. Evidence:
      iteration 7 (mass 0.6, y = 0.08) scored 75.92 and is the best design so far,
      with oval progress 0.2725, s-bend 0.1573 with oscillation 0.135, and slalom
      0.1094 with 1.0 line loss per run. Iteration 8 (mass 0.5, y = 0.08) scored 55.18
      because oval progress fell back to 0.12, while s-bend (0.1644) and slalom (1.0
      line loss) held. So the oval gain is sensitive to mass near 0.6 kg and does
      not follow a monotonic trend. This iteration restores the iteration 7 geometry
      exactly, with the controller unchanged, so the race tests reproducibility. Plan
      for the next race: (1) If oval progress returns to about 0.27 and the score
      is near 76, the design is stable, and the team can spend the next iteration
      on one narrow test. Try wheel_track 0.11 at mass 0.6 and y = 0.08, since iteration
      4 showed that a narrower track raises turn authority, though it also raised
      s-bend oscillation at y = 0.07. (2) If the oval falls back toward 0.12 again,
      treat the iteration 7 result as seed-sensitive and keep this geometry as the
      final candidate rather than moving mass further. (3) If the slalom line loss
      rises above 1.0 with oval progress intact, that is a controller problem, and
      I will address it in the controller rather than asking for more geometry change.


      ### Requested changes


      - If the next race reproduces oval progress near 0.2725 with a score near 76,
      keep mass 0.6 and y = 0.08, and test wheel_track 0.11 as the single next change.
      Evidence: iteration 4 (wheel_track 0.10) lifted the score to 56.50 at y = 0.07,
      and oval progress only stayed flat there because the lead was limiting it, not
      the track.

      - If the next race does not reproduce the oval result (oval progress well below
      0.2725), keep this geometry and do not change mass again. Evidence: iteration
      8 showed that moving mass from 0.6 to 0.5 at y = 0.08 dropped oval progress
      from 0.2725 to 0.12, so further mass moves are not a safe lever near this point.

      - Do not move the forward lead beyond y = 0.08 in the next iteration. Evidence:
      y = 0.08 is the contract maximum, and it gave the best oval progress (0.2725)
      at a small cost to s-bend progress (0.1573 versus 0.1625 at y = 0.07).


      - [Open this output](iteration-9/entityR1/versions/186a5bb39e594b44a2bef9123a39a8a4/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/21da2a3f72384869ada32f0d57431f66/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-d1ab1355a1843259/payload.json)'
