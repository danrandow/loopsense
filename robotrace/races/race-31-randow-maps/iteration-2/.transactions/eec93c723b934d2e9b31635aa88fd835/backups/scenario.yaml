      on the s-bend, I narrowed the sensor spread slightly to ±0.045 m to reduce noise
      from off-line areas, kept the sensor size at 0.016 m for robust detection, and
      maintained other geometry parameters unchanged to preserve stability. I lowered
      the base speed to 1.1 and increased the integral gain ki to 0.8 to enhance steady-state
      error correction in curves. I expect these changes to reduce noise, improve
      control stability, decrease line loss events, and increase completion rates
