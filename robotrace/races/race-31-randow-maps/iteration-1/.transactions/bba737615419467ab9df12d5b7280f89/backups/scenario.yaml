overrides:
  entities:
  - id: entity0
    label: Wider, larger sensors;
    notes: 'Increased sensor size and spread for better line detection and coverage,
      plus higher base speed to test speed control. Changes based on integrator feedback
      praising sensor layout but noting off-track event on s-bend track.


      ### Rationale


      The integration feedback praises the current geometry for its stable platform
      and well-spaced sensors that cover the tape line effectively. The controller
      uses a smooth gradient of sensor weights, indicating good sensor placement.
      The race data shows a perfect finish on the oval track with no line loss and
      very low error, but the s-bend track run ended off-track with one line loss
      event and higher error, suggesting room for improvement in sensor coverage and
      speed control. To improve robustness and coverage, I will increase the sensor
      size from 0.012 to 0.016 to enhance line detection. I will also spread the sensors
      slightly wider from ±0.04 m to ±0.05 m to cover a broader area, which should
      help in sharper curves like the s-bend. Additionally, I will increase the base
      speed from 1.0 (default) to 1.2 to test higher speed capability, expecting the
      integrator to adjust control gains accordingly. I keep the wheel track, wheel
      radius, body dimensions, and mass unchanged to maintain stability and inertia
      balance. I expect these changes to improve line detection robustness and coverage,
      reduce line loss on complex tracks, and increase overall speed and score. I
      request measurements of completion, progress, line_loss_events, rms_error, and
      completion_time to evaluate these effects.


      - [Open this output](iteration-1/entity0/versions/bbb13f4af9384abeb13cb6b43bd517c9/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-b386fc364f8b2219/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-85ac80529f3cbe4c/payload.json)'
  - id: entity1
    label: Initial controller for
    notes: 'Created a PID controller with moderate gains and sensor weights matching
      the sensor layout to enable stable line following at moderate speed.


      ### Rationale


      The initial geometry is balanced with 5 medium-sized sensors evenly spread across
      the front, a moderate wheel track and radius, and a compact body for stability
      and control. To complement this, I designed a PID controller with moderate gains
      to provide stable line following and smooth steering. Sensor weights are set
      to create a gradient from left to right sensors, enabling the controller to
      detect line position and steer accordingly. The base speed is set moderately
      to allow completion with control, and line loss behavior is set to ''search_left''
      to recover from line loss by steering right. The observation request includes
      completion, progress, line_loss_events, rms_error, and completion_time to evaluate
      performance and guide future tuning.


      - [Open this output](iteration-0/entity1/versions/3b1a126ba99447bfa5aa2166c88dfbdb/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/6a0c63fbf0604b9a954972f8b3867406/payload.json)'
  - id: entityR1
    label: Initial integration
    notes: 'Confirmed geometry is stable and well sensed; requested larger sensors,
      wider sensor spread, and higher base speed for next iteration.


      ### Feedback


      The geometry provides a stable and well-sensed platform with evenly spaced sensors
      that cover the tape line well. The moderate wheel track and radius balance speed
      and control effectively. The controller compensates well for the sensor layout
      with a smooth gradient of sensor weights, enabling good line position detection.
      The compact body and moderate mass help maintain stability without excessive
      inertia. The line loss recovery strategy ''search_left'' should help regain
      the line when lost. Initial tuning expects moderate speed and low line loss,
      but future races will confirm performance and highlight any needed adjustments.


      ### Requested changes


      - Increase sensor_size to 0.016 to improve line detection robustness

      - Adjust sensor_positions to spread sensors slightly wider (e.g., from ±0.04
      to ±0.05) for better coverage

      - Increase base_speed to 1.2 to test higher speed capability while monitoring
      control stability


      - [Open this output](iteration-0/entityR1/versions/3b1a126ba99447bfa5aa2166c88dfbdb/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/6a0c63fbf0604b9a954972f8b3867406/payload.json)'
