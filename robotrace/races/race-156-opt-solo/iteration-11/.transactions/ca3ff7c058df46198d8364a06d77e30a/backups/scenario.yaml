  - id: entity0
    label: 'Final: 16mm sensors, 1.1'
    notes: 'Combines iteration 8''s best speed and gains with iteration 10''s 16 mm
      sensor footprint, which cut oval oscillation from 0.25 to 0.16. Base speed returns
      to 1.1 because 1.2 gave no time gain, and the persistent single line-loss event
      is left for later investigation.


      ### Rationale


      Iteration 10 (score 930.6) was slightly below iteration 8 (932.0, best). Its
      larger 16 mm sensor footprint cut oval steering oscillation from 0.25 to 0.16
      and kept every run finishing, but base_speed 1.2 gave no time gain (oval 2.13
      s vs 2.12 s; slalom 2.79 s vs 2.78 s), so the speed increase only added cost.
      The 1.0 line-loss event per run persisted, so the sensor span (H7) and footprint
      size (H13) are both ruled out as its cause. This design keeps iteration 10''s
      sensor footprint for the smoother steering, which matters on an unseen track
      shape, and returns base_speed to 1.1, the level where time was best. Geometry
      is otherwise unchanged from iteration 8: seven sensors at y = 0.08 m spanning
      x = -0.045 to +0.045 m, mass 0.5 kg, track 0.12 m, radius 0.03 m, body 0.12
      x 0.16 m. Controller: weights [-2,-1.33,-0.67,0,0.67,1.33,2], kp 2.0, ki 0.05,
      kd 1.2, line_loss last_direction. Expected result: score about 932 to 935, all
      runs finishing, with oscillation near 0.16 to 0.20 and line loss still about
      1 per run. Hypotheses: H14, the 16 mm footprint lowers jitter without costing
      completion time. H15, the persistent line-loss event occurs at a fixed point
      in the course, probably the start or finish, so speed and sensing changes do
      not remove it. Measurements wanted: line_loss_events and the times of loss if
      available, steering_oscillation (to confirm the footprint effect), max_error
      on the slalom (margin to the 0.06 m off-track limit), and completion_time on
      the oval.


