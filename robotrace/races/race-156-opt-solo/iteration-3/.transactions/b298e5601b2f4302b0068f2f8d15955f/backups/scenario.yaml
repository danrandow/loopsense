  entities:
  - id: entity0
    label: Wider span, slower, kp
    notes: 'Lowers base_speed to 1.0 and widens the sensor span to ±0.06 m, with kp
      raised to 2.6 to keep steering gain similar. Iteration 2 finished 0% of slalom
      runs and only 15% of s-bend runs, with max_error just over the 0.06 m off-track
      limit, so this targets sharp alternating bends.


      ### Rationale


      Evidence from iteration 2 (score 442.8): the oval finishes 15/20 (progress 0.95,
      1.93 s), the s-bend finishes 3/20 (progress 0.75), and the slalom never finishes
      (progress 0.33, max_error about 0.063 m, just above the fixed 0.06 m off-track
      limit). Iteration 1 to 2 showed that slower speed and a finer sensor spread
      helped the bends, but the robot still leaves the line on sharp alternating bends.
      The body-width term cannot raise the off-track limit (it is 0.06 m for every
      allowed body width), so tracking error has to fall. Hypothesis H4: at base_speed
      1.2 the robot covers ground faster than its steering can follow, and the sensor
      span of +/-0.045 m is still too narrow, so the line leaves the sensor footprint
      during large swings. Changes: (1) base_speed 1.2 to 1.0. The oval time limit
      has headroom (about 2.3 s expected against 3 s), and completion is worth 500
      points while time is worth at most 60. (2) Sensor span widened to +/-0.06 m
      (seven sensors, 0.02 m spacing, y = 0.04 m), so the line stays visible at larger
      lateral error. (3) Weights scaled to keep their ends at +/-2 and their spacing
      even: [-2, -1.33, -0.67, 0, 0.67, 1.33, 2]. The signal gain per metre falls
      from about 44 to about 33, so kp rises from 2.0 to 2.6 to keep the overall steering
      gain similar (about 86 vs 88 per metre). (4) kd kept at 0.6 for damping, and
      ki at 0.05. Mass 0.6 kg, track 0.12 m, and radius 0.03 m are unchanged to isolate
      the speed and sensing effects. Expected result: slalom progress well above 0.33,
      with some completions on the s-bend, and max_error nearer 0.05 m. Risks: kp
      2.6 with kd 0.6 may add jitter (steering_oscillation was 0.38 on the oval),
      and the wider span could reduce resolution on gentle bends. Measurements wanted
      next: completion and progress per track to see whether slower speed or the wider
      span drove the change; max_error and line_loss_events on the slalom to test
      H4; steering_oscillation to check whether kp 2.6 adds jitter; and completion_time
      on the oval to confirm the time budget.


