  entities:
  - id: entity0
    label: Forward sensors, more kd
    notes: 'Moves the sensor row forward to y=0.07 m, raises kd to 1.0 and trims base
      speed to 1.0, aimed at the slalom failure (progress 0.65, max_error 0.064 m)
      while keeping the oval and s-bend finishes from iteration 4 (score 724). Based
      on the iteration 4 race, where forward sensors and higher kd doubled slalom
      progress.


      ### Rationale


      Evidence from iteration 4 (score 724, best so far). The oval (20/20 finishes,
      1.76 s, steering_oscillation 0.21) and s-bend (20/20, 2.16 s) are solved. The
      slalom is still the bottleneck: 0/20 finishes, progress 0.65, one line-loss
      event per run and max_error 0.064 m, just above the fixed 0.06 m off-track limit.
      The body-width term cannot raise that limit (0.0125 + body_width/4 is at most
      0.058 m, so the floor stays 0.06 m), so tracking error on the alternating bends
      must fall. Iteration 4 showed that moving the sensors forward (y 0.04 to 0.06)
      and raising kd (0.6 to 0.8) lifted slalom progress from 0.33 to 0.65, which
      supports H5: the robot reacts late to sharp alternations. This iteration pushes
      the same direction a little further and changes nothing else. Changes: (1) sensor
      y 0.06 to 0.07 m for about 1 cm more lead; (2) kd 0.8 to 1.0 for more damping
      of the faster corrections (oval oscillation of 0.21 leaves room); (3) base_speed
      1.1 to 1.0 for more correction time on the tight slalom bends. Geometry, sensor
      span (+/-0.045 m), weights, kp 2.0, ki 0.05 and line_loss are unchanged so the
      effect is attributable. Expected result: slalom progress above 0.7, max_error
      below 0.06 m and some slalom completions, while the oval stays at about 20/20
      with completion time near 1.9 s, still well under 3 s. Risks: the forward sensors
      may lose the line on the tightest bend, and kd 1.0 could add jitter. Hypotheses:
      H6, the remaining slalom failure is a late-reaction error that more lead and
      damping will reduce; H7, the line-loss event happens when the line passes outside
      the +/-0.045 m span. Measurements wanted next: slalom progress, max_error and
      line_loss_events to test H6 and H7; steering_oscillation to check kd jitter;
      completion_time on the oval to confirm the time budget at base 1.0.


