  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'First candidate: no race data yet, so a conservative baseline with 5 sensors,
      base_speed 1.6 and kp 2.5 aimed at finishing in 3 s. Hypotheses to test: speed
      is too low to finish in time, or kp causes weaving on the slalom.


      ### Rationale


      Iteration 0 has no race telemetry, so this is a conservative baseline built
      from the contract, not a tuned design. Geometry: five sensors spaced 15 mm apart
      across x = -0.03 to +0.03 m, all at y = 0.04 m ahead of the axle, so the line
      is seen before the wheels reach it. A 12 mm footprint gives a usable signal
      on a 25 mm tape. Track 0.12 m and radius 0.03 m give moderate steering authority;
      mass 0.8 kg and a 0.12 m body keep yaw inertia low enough to turn quickly. Controller:
      sensor_weights [-2,-1,0,1,2] match the sensor x-order, so a line on the left
      gives a positive signal and steers left. base_speed 1.6 targets the ~1.5 m/s
      average needed to finish in 3 s, with headroom for slowing on bends. kp 2.5
      gives a moderate correction (about 875 PWM per unit of signal); ki 0.05 is small
      to avoid integral windup on long bends; kd 0.15 damps the fast signal changes
      that cause jitter. line_loss ''last_direction'' lets the robot recover toward
      the side it was last on. Expected result: completion on the oval and s-bend,
      with some oscillation on the slalom. The next race should show whether speed
      or kp is the limit. Hypotheses: (1) the robot is too slow to finish in 3 s at
      base_speed 1.6; (2) kp is too high, causing weaving on the slalom. Measurements
      requested: completion time, rms and max error, and steering oscillation, to
      separate speed limits from steering oscillation.


      - [Open this output](iteration-0/entity0/versions/b987f122bf574cfb8c401aec7d06d0f2/payload.json)'
