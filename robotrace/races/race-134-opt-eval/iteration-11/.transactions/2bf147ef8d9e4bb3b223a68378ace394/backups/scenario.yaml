  id: race-134-opt-eval
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: 'Final: proven span 0.05'
    notes: 'Resubmits the iteration 8 design unchanged (span x=±0.05, kd 0.6, base_speed
      1.5), which scored 323.64 on both the iteration 8 and iteration 9 races. No
      untested variant is submitted, since this is the final design and it will face
      the unseen track.


      ### Rationale


      This is the final iteration, so the design submitted here gets the unseen-track
      race and no later iteration can correct it. I am submitting the measured best
      design, iteration 8, unchanged. It scored 323.64 in iteration 8 and again in
      iteration 9, which confirms the simulator is deterministic for this design.
      Span 0.05 at kd 0.6 is the best raced point: oval finishes rose to 14 of 20
      and s-bend line losses fell from 1.00 to 0.75 versus span 0.04. Every alternative
      I could test now is untested at this span. The 0.045 span, kd 0.55 and other
      single-variable changes could each lower the score, and an unseen track gives
      no means to check them. The 0.06 span cut losses but cost oval finishes, and
      sensor_size 0.016 and base_speed 1.3 both lowered the score, so those stay closed.
      Oval steering_oscillation of 0.40 is above the 0.32 caution level, but the score
      is the decisive measure and it held across both races. Expected result: a score
      near 323 on the development tracks, with the unseen-track result depending on
      how well this layout generalises. Hypotheses: (a) the oscillation comes from
      the wider span steering harder at kd 0.6, so it is a cost of the better score
      rather than a fault; (b) the sensing layout limits s-bend and slalom, not damping.
      Measurements wanted: per-track line_loss_events, max_error and steering_oscillation,
      plus oval completion and completion_time, to confirm the baseline and show whether
      the unseen track is limited by sensing or by damping.


      - [Open this output](iteration-11/entity0/versions/705dca6e3b5246449cd4cbca5d9585d8/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-8bf2a8f1727df3af/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-8a678a1c9954ea3a/payload.json)'
  - id: entityR1
    label: Approve unchanged
    notes: 'Approves the iteration 8 design unchanged (span 0.05, kd 0.6), which is
      the best raced design at 323.64 and reproduced exactly in iteration 9. Revisions
      that lower kd or speed or raise sensor_size have all cut the score before, so
      approval locks the measured baseline and points the last iteration at a span
      test between 0.04 and 0.05.


      ### Feedback


      Judged from earlier races and this candidate''s contents only. Nothing here
      states how the candidate will perform.


      The candidate is the iteration 8 and 9 design, unchanged: sensor span x = -0.05,
      -0.025, 0.0, 0.025, 0.05 with weights (-2, -1, 0, 1, 2), kd 0.6, kp 4.0, ki
      0.2, base_speed 1.5, sensor_size 0.012 and last_direction. Iteration 8 and its
      unchanged re-run in iteration 9 both scored 323.64, so the simulator appears
      deterministic for this design and a further identical race adds no new information
      beyond locking that score.


      Evidence: the span widened from 0.04 to 0.05 at kd 0.6 raised oval finishes
      from 12 to 14 of 20 and cut s-bend line losses from 1.00 to 0.75 (iterations
      7 to 8). Slalom losses held at 1.00. Span 0.06 at kd 0.55 (iteration 5) cut
      losses further but cost oval finishes, so the useful span is probably between
      0.04 and 0.06. Lowering kd has hurt every time it was tested (kd 0.55 at span
      0.04 scored 238 against 282 at kd 0.6), so kd 0.6 stays. Speed 1.3 (iteration
      2) and sensor_size 0.016 (iteration 6) both lowered the score and stay closed.
      Oval steering_oscillation rose to 0.40 at this span, above the 0.32 caution
      level, but the score is the decisive measure.


      Why approve: this is the best raced design, it is already measured at 323.64,
      and every single-variable alternative I can justify is either untested at this
      span or has a record of lowering the score (kd down, speed down, sensor_size
      up). A revision spends two action runs and could land below 323.64. Approving
      locks the measured baseline.


      For the last iteration after this one, the best use of the next design is a
      span test between the measured points, not a kd change. Read the next race as
      follows. If the score holds near 323, keep the span at 0.05 and kd at 0.6. Treat
      the remaining s-bend and slalom losses as limits of the sensing layout, not
      a damping issue.


      ### Requested changes


      - Next iteration, test sensor span x = -0.045, -0.0225, 0.0, 0.0225, 0.045 at
      kd 0.6 with weights unchanged. Span 0.04 scored 282.45 and span 0.05 scored
      323.64, while span 0.06 cut losses but cost oval finishes (iteration 5), so
      an in-between span is the untested point.

      - If that span scores below 323.64 or oval finishes drop below 14 of 20, keep
      the iteration 8 span of 0.05 at kd 0.6 as the final design. Do not raise kd
      above 0.6, since kd 0.55 scored below kd 0.6 at span 0.04.

      - Hold kp 4.0, ki 0.2, base_speed 1.5, sensor_size 0.012 and last_direction
      fixed. Iteration 2 (speed 1.3, score 86.8) and iteration 6 (sensor_size 0.016,
      score 157.9) both lowered the score, so these stay fixed to keep effects separable.


      - [Open this output](iteration-10/entityR1/versions/0774d123d4204b7e93e22fb6bdb836d9/payload.json)

