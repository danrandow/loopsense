overrides:
  entities:
  - id: entity0
    label: 'Final: proven span 0.05'
    notes: 'Resubmits the iteration 8 design unchanged (span x=±0.05, kd 0.6, base_speed
      1.5), which scored 323.64 on both the iteration 8 and iteration 9 races. No
      untested variant is submitted, since this is the final design and it will face
      the unseen track.


      ### Rationale


      This is the final iteration, so the design submitted here gets the unseen-track
      race and no later iteration can correct it. I am submitting the measured best
      design, iteration 8, unchanged. It scored 323.64 in iteration 8 and again in
      iteration 9, which confirms the simulator is deterministic for this design.
      Span 0.05 at kd 0.6 is the best raced point: oval finishes rose to 14 of 20
      and s-bend line losses fell from 1.00 to 0.75 versus span 0.04. Every alternative
      I could test now is untested at this span. The 0.045 span, kd 0.55 and other
      single-variable changes could each lower the score, and an unseen track gives
      no means to check them. The 0.06 span cut losses but cost oval finishes, and
      sensor_size 0.016 and base_speed 1.3 both lowered the score, so those stay closed.
      Oval steering_oscillation of 0.40 is above the 0.32 caution level, but the score
      is the decisive measure and it held across both races. Expected result: a score
      near 323 on the development tracks, with the unseen-track result depending on
      how well this layout generalises. Hypotheses: (a) the oscillation comes from
      the wider span steering harder at kd 0.6, so it is a cost of the better score
      rather than a fault; (b) the sensing layout limits s-bend and slalom, not damping.
      Measurements wanted: per-track line_loss_events, max_error and steering_oscillation,
      plus oval completion and completion_time, to confirm the baseline and show whether
      the unseen track is limited by sensing or by damping.


      - [Open this output](iteration-11/entity0/versions/705dca6e3b5246449cd4cbca5d9585d8/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-8bf2a8f1727df3af/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-8a678a1c9954ea3a/payload.json)'
  - id: entityR1
    label: Approve best design
    notes: 'Approves the unchanged iteration 8 design (span 0.05, kd 0.6), the best
      raced result at 323.64, re-confirmed in iteration 9. Approval rests on the deterministic
      repeat score and on the failure of every untested single-variable change in
      earlier races, with no iteration left to test them.


      ### Feedback


      Judged from earlier races and this candidate''s contents only. Nothing here
      states how the candidate will perform. The candidate is the iteration 8 design,
      unchanged and re-confirmed in iteration 9: sensor span x = -0.05, -0.025, 0.0,
      0.025, 0.05 with weights (-2, -1, 0, 1, 2), kd 0.6, kp 4.0, ki 0.2, base_speed
      1.5, sensor_size 0.012, last_direction. All values are inside the contract limits
      and the sensor count matches the weights. Its record is the best raced result
      (323.64, up from 282.45 at span 0.04). The same score on two races shows the
      simulator is deterministic for this design. Sensor_size 0.016 (iteration 6,
      157.9) and base_speed 1.3 (iteration 2, 86.8) both lowered the score, and span
      0.06 (iteration 5) cut line losses but cut oval finishes. The untested alternatives
      (kd 0.55 at this span, or a span of about 0.045) could each lower the score,
      and this is the final iteration, so no later race can check them. Approving
      locks in the measured design for the unseen-track race. Oval steering_oscillation
      of about 0.40 is above the 0.32 caution level, but the score held across both
      races, so it is not a reason to revise now.


      ### Requested changes


      - Race the iteration 8 design unchanged: span x = -0.05, -0.025, 0.0, 0.025,
      0.05, kd 0.6, kp 4.0, ki 0.2, base_speed 1.5, sensor_size 0.012, last_direction.
      It has the best raced score (323.64, confirmed in iterations 8 and 9).

      - Do not raise kd above 0.6 or lower base_speed below 1.5. Kd 0.55 at span 0.04
      scored below kd 0.6 (238 against 282), and base_speed 1.3 scored 86.8 against
      170.5 at 1.5.

      - Record per-track line_loss_events, max_error, steering_oscillation, oval completion
      and completion_time, so the unseen-track result can be compared with the development
      tracks.


      - [Open this output](iteration-11/entityR1/versions/2bf147ef8d9e4bb3b223a68378ace394/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/705dca6e3b5246449cd4cbca5d9585d8/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-8a678a1c9954ea3a/payload.json)'
