  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'A conservative first candidate: five 12 mm sensors with antisymmetric
      weights, base_speed 1.8, kp 4.0, kd 0.2, and last_direction line recovery. No
      race data exists yet, so the values come from the contract''s physics and the
      speed needed to finish under 3 s. The race telemetry will test whether the gains
      oscillate and whether the speed is too high for the sharpest bends.


      ### Rationale


      Iteration 0 has no race data or Evaluator feedback yet, so this is a conservative
      baseline built from the contract''s physics. Geometry: five line sensors spread
      across the centre line (x = -0.04 to +0.04 m, step 0.02 m) and 0.04 m ahead
      of the axle, so the robot sees the line before it reaches the wheels. The 12
      mm footprint is wide enough to keep readings non-zero on curves while staying
      narrow enough to resolve the 25 mm tape edge. Sensor weights are antisymmetric
      (-2, -1, 0, +1, +2), so a positive signal (tape on the left) steers left, which
      matches the contract''s sign convention. Wheel track 0.12 m and radius 0.03
      m give a moderate turn rate and a speed ceiling that should allow completing
      a 4 to 5 m course in under 3 s. Mass 0.8 kg keeps yaw inertia low, so turns
      respond quickly. Controller: base_speed 1.8 (near full PWM) to meet the roughly
      1.5 m/s average needed. kp 4.0 gives a clear steering response without saturating
      the 350-count differential. kd 0.2 damps the overshoot a proportional-only loop
      would show on sharp bends. ki 0.2 is small, to remove steady bias from the fixed
      motor mismatch without windup. line_loss last_direction recovers toward the
      side the line was last seen. Expected result: completion on the development
      tracks with a few line-loss events at the sharpest bend. Hypotheses to test:
      (1) kp around 4 is near the oscillation threshold at speed 1.8, so steering_oscillation
      will show whether kd must rise; (2) the 0.04 m sensor lead is enough, which
      max_error will confirm; (3) base_speed 1.8 may be too fast for the sharpest
      curve, which shows as max_error growth and line_loss_events on the slalom track.
      Measurements requested: completion, progress, completion_time, rms_error, max_error,
      line_loss_events and steering_oscillation, so the next revision can tune speed
      against stability.


