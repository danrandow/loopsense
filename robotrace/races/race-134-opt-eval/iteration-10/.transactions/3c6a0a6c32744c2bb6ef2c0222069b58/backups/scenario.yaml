map:
  id: race-134-opt-eval
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Best design resubmitted
    notes: 'Resubmits the iteration 8 design unchanged (sensor span ±0.05, kd 0.6),
      the best raced result at 323.64. Oval steering oscillation rose to 0.40, so
      any change would be untested, and the baseline is kept as the safe choice.


      ### Rationale


      Evidence: iteration 8 (sensor span x = ±0.05, kd 0.6, sensor_size 0.012, base_speed
      1.5, kp 4.0, ki 0.2, weights (-2, -1, 0, 1, 2), last_direction) is the best
      raced design at 323.64, up from 282.45. Oval finishes rose to 14 of 20 (from
      12), and mean oval progress reached 0.93. Line losses fell on the s-bend (1.00
      to 0.75) and on the slalom held at 1.00. The Evaluator''s conditions are only
      partly met. The score beat 282.45 and finishes stayed above 12 of 20, but oval
      steering_oscillation rose to 0.40, above the 0.32 threshold. The main lever
      left is damping (kd), and kd is near its useful limit. Speed (iteration 2) and
      sensor_size 0.016 (iteration 6) are closed, and the ±0.06 span (iteration 5)
      cut finishes. Each single-variable alternative I could justify, such as kd 0.55
      at ±0.05, kp changes, or an in-between span, is untested at this span. Any of
      them could lower the score, and the current best is already the best raced result.
      So I submit the iteration 8 design unchanged. This keeps the 323.64 baseline,
      and the race measures it again. Expected result: the same score, roughly 323,
      with oval finishes of about 14 of 20 and oval steering_oscillation near 0.40.
      Hypotheses: (a) the oscillation rise comes from the wider span, which steers
      harder at the same kp and kd; (b) at this span, kd 0.6 may now be slightly too
      high for oval stability. Measurements wanted: per-track line_loss_events, max_error
      and steering_oscillation, plus oval completion and completion_time, to decide
      whether kd should drop to 0.55 at ±0.05 in the next iteration.


      - [Open this output](iteration-9/entity0/versions/1653f138ab0c43a58801a92f77384033/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-eacce24d70ffcb47/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-8a678a1c9954ea3a/payload.json)'
  - id: entityR1
    label: Approve best design as-is
    notes: 'The candidate is the unchanged iteration 8 design, the best raced result
      (323.64), so approving it locks in that score. Oval steering_oscillation at
      0.40 is flagged for a kd 0.55 test next iteration, and reverting the span is
      named as the fallback.


      ### Feedback


      Judged from earlier races and this candidate''s contents only. Nothing here
      states how the candidate will perform.


      The candidate is the iteration 8 design, unchanged: sensor span x = -0.05, -0.025,
      0.0, 0.025, 0.05 with weights (-2, -1, 0, 1, 2), kd 0.6, kp 4.0, ki 0.2, base_speed
      1.5, sensor_size 0.012 and last_direction. It is the best raced design so far
      (323.64, up from 282.45 at span 0.04). The values are inside the contract limits,
      and the sensor count matches the weights.


      Evidence: the span change to 0.05 raised oval finishes from 12 to 14 of 20 and
      cut s-bend line losses (1.00 to 0.75). Slalom losses held at 1.00. Oval steering_oscillation
      rose to 0.40, which is above the 0.32 threshold set in earlier reviews, so this
      is the one warning sign. The span 0.06 result (iteration 5) cut losses but cost
      finishes, so the useful span is probably between 0.04 and 0.06. Sensor_size
      0.016 (iteration 6) and base_speed 1.3 (iteration 2) both lowered the score,
      so they stay closed. The kd gains are shrinking (kd 0.6 added +42 at span 0.04),
      so kd is near its useful limit.


      Why approve: the design is identical to the best raced result. No variant I
      can justify from the evidence is certain to beat 323.64, and each untested change
      risks a lower score. Racing it locks in this iteration''s score and gives per-track
      telemetry.


      What to do in the next iteration, depending on the race:

      - If the score holds near 323 and oval finishes stay at 14 of 20, the next single-variable
      test is kd 0.55 at span 0.05, to check whether the oscillation rise (0.40) comes
      from damping.

      - If the score falls below 323.64, revert the span to 0.04 at kd 0.6 (iteration
      7 design, 282.45) or test an intermediate span of about 0.045 at kd 0.6, and
      do not raise kd further.

      - Report per-track line_loss_events, max_error and steering_oscillation, plus
      oval completion and completion_time, so the span effect can be separated from
      the damping effect.


      ### Requested changes


      - Keep the iteration 8 design (span x = -0.05, -0.025, 0.0, 0.025, 0.05, kd
      0.6) as the baseline. If it races at about 323, next test kd 0.55 at this span,
      since oval steering_oscillation rose to 0.40 (above the 0.32 threshold) and
      the oscillation may come from damping.

      - If the score falls below 323.64 or oval finishes drop below 14 of 20, revert
      to span 0.04 at kd 0.6 (iteration 7, 282.45), or test an intermediate span of
      about 0.045 at kd 0.6 (between the 0.04 and 0.05 results), keeping kd at 0.6
      and not raising it above that.

      - Hold kp 4.0, ki 0.2, base_speed 1.5, sensor_size 0.012 and last_direction
      fixed. Iteration 2 (speed 1.3, score 86.8) and iteration 6 (sensor_size 0.016,
      score 157.9) both lowered the score, so keep these fixed to keep effects separable.


      - [Open this output](iteration-9/entityR1/versions/73d14e4e987b4749bb5d6b61bb1229ec/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/1653f138ab0c43a58801a92f77384033/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-8a678a1c9954ea3a/payload.json)'
