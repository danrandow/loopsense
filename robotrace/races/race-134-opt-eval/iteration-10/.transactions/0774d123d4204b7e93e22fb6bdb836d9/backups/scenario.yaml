map:
  id: race-134-opt-eval
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Restore proven span 0.05
    notes: 'Restores the iteration 8 design exactly (span ±0.05, kd 0.6, all other
      values fixed), which scored 323.64 in iterations 8 and 9. This follows the Evaluator''s
      revise request, so this iteration races a measured baseline rather than an untested
      variant.


      ### Rationale


      Evidence: the best raced design is iteration 8, which was re-run unchanged in
      iteration 9 and scored 323.64. It uses sensor span x = ±0.05, kd 0.6, kp 4.0,
      ki 0.2, base_speed 1.5, sensor_size 0.012, weights (-2, -1, 0, 1, 2) and last_direction.
      Oval finishes were 14 of 20, mean oval progress 0.93, and oval steering_oscillation
      0.40. Line losses fell on the s-bend (1.00 to 0.75) and held at 1.00 on the
      slalom.


      Change: none. This candidate restores the proven design exactly, as the Evaluator
      requested, so this iteration races a measured 323.64 baseline rather than an
      untested variant. kd is not raised above 0.6, since kd gains are shrinking.
      Speed (base_speed 1.3), sensor_size 0.016 and the ±0.06 span were each measured
      to lower the score or cut finishes, so they stay closed.


      Expected result: about 323, with oval finishes near 14 of 20. Hypotheses: (a)
      the oval steering_oscillation rise to 0.40 comes from the wider span steering
      harder at kd 0.6; (b) kd 0.55 at span 0.05 may cut that oscillation without
      losing finishes. Measurements wanted: per-track line_loss_events, max_error
      and steering_oscillation, plus oval completion and completion_time, so the next
      iteration can decide between the kd 0.55 test and a span of about 0.045 at kd
      0.6.


      - [Open this output](iteration-10/entity0/versions/b582a5dbb3114c1e9ae37895b5de172a/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/a89471d0faf9469db03f6d0e434c45f6/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-8a678a1c9954ea3a/payload.json)'
  - id: entityR1
    label: Restore proven kd 0.6
    notes: 'Revised the kd 0.55 test back to kd 0.6 at span ±0.05, the design that
      scored 323.64 in iterations 8 and 9. kd 0.55 is a speculative change with likely
      lower score, based on the +44 kd gain at span 0.04.


      ### Feedback


      Judged from earlier races and this candidate''s contents only. Nothing here
      states how the candidate will perform.


      The candidate changes kd from 0.6 to 0.55 at sensor span x = ±0.05, with everything
      else held. Iteration 8 and its reproduction in iteration 9 (span ±0.05, kd 0.6,
      base_speed 1.5, kp 4.0, ki 0.2, sensor_size 0.012, weights (-2, -1, 0, 1, 2),
      last_direction) gave 323.64, the best raced score. At span 0.04, kd 0.55 to
      0.6 gave +44 (iteration 4 to iteration 7), so lowering kd is more likely to
      lose score than gain it. The oval steering_oscillation of 0.40 (iteration 8)
      is above the 0.32 warning level, but no earlier race isolates damping as its
      cause. Lowering kd is therefore a speculative test, and it would spend this
      iteration''s race on a design that may score below the proven one.


      The proven design is kd 0.6 at span ±0.05. Revise to restore it exactly, so
      that this iteration races a design already measured at 323.64. Leave the span,
      kp, ki, base_speed, sensor_size and line_loss unchanged. Do not raise kd above
      0.6: kd gains are shrinking (+101, +6, +62, +42 across iterations 2 to 7), and
      steering_oscillation has risen with span.


      After this race, use the telemetry to decide the final iteration. If the proven
      design holds near 323, the final iteration can test one change only, such as
      span 0.045 at kd 0.6, or kd 0.55 at span 0.05, with the other values fixed.
      Keep whichever design scores higher on development tracks while keeping oval
      steering_oscillation below about 0.40.


      ### Requested changes


      - Restore kd to 0.6 with span x = -0.05, -0.025, 0.0, 0.025, 0.05 and weights
      (-2, -1, 0, 1, 2), so that the design matches the proven 323.64 result (iterations
      8 and 9).

      - Hold kp 4.0, ki 0.2, base_speed 1.5, sensor_size 0.012 and line_loss last_direction
      fixed. Iteration 2 (base_speed 1.3, score 86.8) and iteration 6 (sensor_size
      0.016, score 157.9) both lowered the score.

      - Do not raise kd above 0.6. Its gains are shrinking, and oval steering_oscillation
      rose to 0.40 at span 0.05 (iteration 8), so further damping changes need a clear
      reason.


      - [Open this output](iteration-10/entityR1/versions/a89471d0faf9469db03f6d0e434c45f6/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/3c6a0a6c32744c2bb6ef2c0222069b58/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-8a678a1c9954ea3a/payload.json)'
