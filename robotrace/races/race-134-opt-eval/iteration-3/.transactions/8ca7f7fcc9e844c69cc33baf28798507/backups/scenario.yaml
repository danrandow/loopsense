map:
  id: race-134-opt-eval
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: kd 0.5 at speed 1.5
    notes: 'Restores base_speed to the best raced value (1.5) and raises kd from 0.4
      to 0.5, since iteration 2 showed lowering speed to 1.3 did not reduce line losses
      and scored 86.8. Evidence: line losses persisted at about 1 per run on the s-bend
      and slalom, and kd was the change that improved the score most.


      ### Rationale


      Evidence: iteration 1 (base_speed 1.5, kd 0.4) is the best raced design at 170.5,
      with 2 of 20 oval finishes. Iteration 2 lowered base_speed to 1.3 and scored
      86.8, with 0 finishes and more line losses on the s-bend (1.15 vs 1.0) and slalom
      (1.15 vs 1.05). So the speed reduction did not fix the line loss, and it cost
      progress and completion. Speed is therefore not the main cause. The kd change
      from 0.2 to 0.4 was the step that helped most, from 69.5 to 170.5. Following
      the Evaluator''s rule, when line losses persist at a given speed, raise kd before
      touching kp. Change: restore base_speed to 1.5, the best raced value, and raise
      kd from 0.4 to 0.5. Geometry, kp 4.0, ki 0.2, sensor weights and line_loss (last_direction)
      are unchanged, so the race result can be attributed to kd. Expected result:
      line_loss_events on the s-bend and slalom fall from about 1.0 toward 0.5 or
      less, max_error drops below the 0.06 limit on some runs, and the oval finishes
      more often than 2 of 20. Risks: steering_oscillation may rise above the earlier
      0.25 to 0.27 level, and too much kd can amplify sensor noise. If oscillation
      rises while losses persist, the next step is kd 0.45 or a small kp change. If
      line losses fall but progress stalls, base_speed should move up toward 1.6.
      Measurements wanted: line_loss_events and max_error per track, completion and
      completion_time on the oval, and steering_oscillation to check for jitter from
      the higher kd.


      - [Open this output](iteration-3/entity0/versions/10321275428141209ccaaa220e4054fa/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-acc4c0ef0ff4b276/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-05ce9131114474cd/payload.json)'
  - id: entityR1
    label: 'Approve: base_speed 1.3'
    notes: 'Approved the single-variable change from base_speed 1.5 to 1.3, with kd
      0.4 held. Iteration 1 showed the line is still lost at the sharpest bend (line_loss
      1.0 to 1.05 on s-bend and slalom), so slowing the robot is the cheapest test.
      The race will show whether that holds before any gain changes.


      ### Feedback


      Judged from earlier races and the candidate''s contents, not from any race of
      this candidate. Iteration 1 (base_speed 1.5, kd 0.4) is the best raced design
      at 170.5. It completed 2 of 20 oval runs, and every s-bend and slalom run still
      ended off_track with about one line-loss event each (max_error about 0.062,
      just past the 0.06 limit). This candidate changes only base_speed, from 1.5
      to 1.3. That is a single, well-motivated step: the iteration 1 telemetry places
      the failure at the sharpest bend, and the iteration 0 to 1 change showed that
      the failure responds to controller changes. The geometry, kp 4.0, ki 0.2, kd
      0.4, weights and line_loss are all unchanged, so any difference in the race
      can be attributed to speed. The contract is satisfied: all values are within
      limits and the sensor count matches the weights. The main risk is completion
      time. Oval finishes at 1.5 took about 1.86 s, and a drop to 1.3 scales the average
      speed by roughly 0.87, which should still fit the 3.0 s limit if the robot stays
      on the line. Read the next race as follows. If line_loss_events on the s-bend
      and slalom fall toward 0 and max_error drops below 0.06, but progress still
      stalls before the end of those tracks, the speed-limited hypothesis holds and
      base_speed should move back up to about 1.4 with kd 0.4 held. If line losses
      persist at the same bend at 1.3, the cause is not only speed, and the next change
      should be kd (for example 0.4 to 0.5) before any change to kp. If the oval finishes
      more often but completion_time rises past about 2.5 s, treat that as the trade-off
      and search for the speed that balances the two.


      ### Requested changes


      - If line_loss_events on the s-bend and slalom fall toward 0 and max_error drops
      below 0.06 but progress stalls, try base_speed 1.4 with kd 0.4 held, since iteration
      1 showed speed 1.5 still loses the line at the sharpest bend.

      - If line losses persist at 1.3, keep base_speed at 1.3 and raise kd from 0.4
      to about 0.5 before touching kp, because kp 4.0 already gives a large steering
      range and iteration 1 improved with kd 0.2 to 0.4.

      - If the oval completes more often but completion_time rises above about 2.5
      s, accept base_speed 1.3 as the stable point and look for a finish-time gain
      from the controller rather than from speed.


      - [Open this output](iteration-2/entityR1/versions/d7804dba0355410897de85e27a7c251c/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/19b57e2a3c8348379fd28c08749ec7da/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-b0778e40f4afa15c/payload.json)'
