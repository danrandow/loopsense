map:
  id: race-134-opt-eval
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Wider sensor span test
    notes: 'Keeps the best raced controller (kd 0.55, score 238.1) and widens the
      sensor span from ±0.04 m to ±0.06 m to test whether narrow sensing causes the
      remaining s-bend and slalom line losses (still about 1.0 per run). The Evaluator''s
      conditions for this step are only partly met: score and oscillation pass, but
      line losses did not fall.


      ### Rationale


      Evidence from iteration 4 (kd 0.55, base_speed 1.5, kp 4.0, ki 0.2) is the best
      raced result so far at 238.1, up from 176.2 at kd 0.5. Oval finishes rose from
      3 to 8 of 20 and mean oval progress reached 0.85. The Evaluator''s branch conditions
      are only partly met. The score beat 176.2 and steering_oscillation (oval 0.297,
      s-bend 0.278) stayed below the 0.32 revert threshold, so kd 0.55 stays. However,
      line_loss_events did not fall: s-bend is 1.0 and slalom is 1.05, unchanged from
      iteration 3. The Evaluator''s stated next step is therefore to keep kd 0.55
      and test hypothesis (b), that the narrow sensor span (x = ±0.04 m) loses the
      tape before steering responds. The change is to widen the span to x = -0.06,
      -0.03, 0.0, 0.03, 0.06 with the sensor weights unchanged (-2, -1, 0, 1, 2).
      Sensor count, sensor_size, y positions, wheel and body geometry, base_speed
      1.5, kp 4.0, ki 0.2, kd 0.55 and line_loss last_direction are all held, so any
      change in the race is attributable to the span. Expected result: line_loss_events
      on the s-bend and slalom fall below about 1.0, and the score holds at or above
      238 with fewer off-track exits. Risks: outer sensors may see the line later
      and blunt the signal, which could raise rms_error or cut finishes. If the score
      falls below 238 or steering_oscillation rises above about 0.32, the next iteration
      should revert to the iteration 4 sensor span (x = ±0.04) and keep kd 0.55. Hypotheses
      to test: (a) the remaining line losses come from the sensors losing tape at
      the sharpest bends, so a wider span reduces them; (b) kd is near its useful
      limit, so further kd gains are small. Measurements wanted: line_loss_events,
      max_error and steering_oscillation per track, plus completion and completion_time
      on the oval.


      - [Open this output](iteration-5/entity0/versions/ba7dd520c5724e7899fb5ef2ad5dc0bc/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-9d0460b45a824e9e/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-60a047066d557235/payload.json)'
  - id: entityR1
    label: Approve wider sensor span
    notes: 'Approves the single-variable test of widening the sensor span to x = ±0.06
      with kd 0.55 held, since iteration 4 (score 238.1) still shows about 1.0 line
      losses per run on the s-bend and slalom. Feedback sets the next step for the
      race: keep the span if losses fall and the score holds, otherwise revert and
      test sensor_size 0.016.


      ### Feedback


      Judged from earlier races and this candidate''s contents only. Nothing here
      states how the candidate will perform.


      Evidence: iteration 4 (kd 0.55, base_speed 1.5, kp 4.0, ki 0.2, narrow span
      x = ±0.04) is the best raced design at 238.1. Iteration 3 (kd 0.5) scored 176.2,
      so kd 0.5 to 0.55 added about 62 points. Oval finishes rose to 8 of 20 and mean
      oval progress reached 0.85. Steering oscillation stayed under the 0.32 revert
      threshold (oval 0.297, s-bend 0.278). However, line_loss_events did not fall:
      s-bend is 1.0 and slalom is 1.05, the same as iteration 3. Iteration 2 showed
      that cutting base_speed to 1.3 raised losses and lowered the score, so speed
      is not the lever. The remaining line losses point to sensing, which is the reason
      for the span test.


      This candidate is a single-variable change from iteration 4: the sensor span
      widens to x = -0.06, -0.03, 0.0, 0.03, 0.06, with weights (-2, -1, 0, 1, 2),
      kd 0.55, base_speed 1.5, kp 4.0, ki 0.2 and last_direction all held. Sensor
      count, sensor_size and y positions are unchanged, so any race difference comes
      from the span. It is valid against the contract.


      What to do next, depending on the race:

      - If line_loss_events on the s-bend and slalom fall below about 1.0 and the
      score holds at or above 238, keep the wider span. Then consider a small kd or
      kp step, since the sensors are no longer the limit.

      - If the score falls below 238 with the same losses, or the wider span raises
      rms_error or cuts oval finishes, revert to the iteration 4 span (x = ±0.04).
      Then test sensor_size 0.016 at kd 0.55, since the sensors may be too small to
      see the tape at the sharpest bends.

      - If steering_oscillation rises above about 0.32, reduce kd to 0.5 before changing
      kp.


      Report per-track line_loss_events, max_error and steering_oscillation, and oval
      completion and completion_time.


      ### Requested changes


      - If line_loss_events on the s-bend and slalom fall below about 1.0 and the
      score holds at or above 238, keep the wider span (x = -0.06, -0.03, 0.0, 0.03,
      0.06) with weights unchanged. Iteration 4 showed kd gains are still helping,
      so a later kd or kp step can follow.

      - If the score falls below 238 or rms_error rises, revert to the iteration 4
      span (x = ±0.04) and test sensor_size 0.016 at kd 0.55, base_speed 1.5 and kp
      4.0. Iteration 4''s line losses point to the sensors, not to speed.

      - If steering_oscillation rises above about 0.32, reduce kd to 0.5 (iteration
      3 level) rather than changing kp. Keep base_speed 1.5, since iteration 2 showed
      that lowering it to 1.3 cut the score from 170.5 to 86.8.


      - [Open this output](iteration-5/entityR1/versions/f6298b4ac90a42b7b31d34e700248dc9/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/ba7dd520c5724e7899fb5ef2ad5dc0bc/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-60a047066d557235/payload.json)'
