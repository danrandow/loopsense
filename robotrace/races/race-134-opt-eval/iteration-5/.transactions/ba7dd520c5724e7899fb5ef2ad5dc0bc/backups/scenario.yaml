overrides:
  entities:
  - id: entity0
    label: kd 0.55 step from best
    notes: 'Single-variable step from the best raced design (iteration 3, kd 0.5,
      score 176.2): kd raised to 0.55 with everything else held. Kd steps were the
      only changes that improved the score, and line losses on the s-bend and slalom
      are still about 1.0 per run, so a small further damping step is the next test.


      ### Rationale


      Evidence: iteration 3 (base_speed 1.5, kd 0.5) is the best raced design at 176.2,
      up from 170.5 at kd 0.4. Oval finishes rose to 3 of 20 and mean oval progress
      rose to 0.69. Line losses are still about 1.0 per run on the s-bend and 1.05
      on the slalom, and every s-bend and slalom run still ends off_track. Lowering
      speed to 1.3 (iteration 2) made losses worse, so speed is not the lever. The
      kd steps have been the only changes that helped (kd 0.2 to 0.4 gave +101, kd
      0.4 to 0.5 gave +6). The gain per step is shrinking, and steering_oscillation
      on the oval has risen to about 0.30. Change: kd 0.5 to 0.55, a small single-variable
      step. base_speed 1.5, kp 4.0, ki 0.2, the geometry and line_loss last_direction
      are all held, so any change is attributable to kd. Expected result: a small
      further gain in score (about 176 to 185), with line_loss_events on the s-bend
      and slalom at or slightly below 1.0 and max_error still near 0.06. Risk: steering_oscillation
      may rise past about 0.32 and cut the gain, in which case the next step is kd
      0.5 again and a sensor-geometry test, not kp. Hypotheses: (a) line losses are
      caused by under-damped response into the sharpest bend, so kd keeps helping
      with diminishing returns; (b) the remaining losses come from the narrow sensor
      span (x = ±0.04 m), which may lose the tape before the steering can respond.
      Measurements wanted next: line_loss_events and max_error per development track,
      completion and completion_time on the oval, and steering_oscillation to see
      whether jitter is growing with kd.


      - [Open this output](iteration-4/entity0/versions/185b525cd22e4c3194e60939d44c9ff7/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-f3e9829a3d2ed097/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-7b46b23d6097edb8/payload.json)'
  - id: entityR1
    label: Approve kd 0.55 step
    notes: 'Approves the single-variable kd step from 0.5 to 0.55 on the best raced
      base (176.2), since the kd gains are shrinking but still positive and the candidate
      is valid. Feedback sets the next test depending on whether line losses fall
      and oscillation stays below about 0.32.


      ### Feedback


      Judged from earlier races and this candidate''s contents only, not from any
      race of it. The change is a single step, kd 0.5 to 0.55, with base_speed 1.5,
      kp 4.0, ki 0.2, geometry and last_direction held. Iteration 3 (kd 0.5) is the
      best raced design at 176.2. Its kd steps each helped, but the gain is shrinking:
      kd 0.2 to 0.4 gave +101, and kd 0.4 to 0.5 gave +6. Iteration 2 showed that
      lowering base_speed to 1.3 cut the score to 86.8, so speed is not the lever.
      Steering oscillation on the oval has risen to about 0.30 (iteration 3), so more
      kd carries a jitter risk. The candidate is valid and a small, attributable step
      from the best design, and there are seven iterations left, so it should race
      and provide telemetry. Next race: if the score beats 176.2 and line_loss_events
      on the s-bend and slalom fall below about 1.0, keep kd at 0.55 and test sensor
      span. If steering_oscillation exceeds about 0.32 or the score falls below 176.2,
      revert kd to 0.5 and do not raise kd further, since the remaining losses then
      point to sensing rather than damping.


      ### Requested changes


      - If the score beats 176.2 and line losses on the s-bend and slalom fall, keep
      kd 0.55 and test hypothesis (b) by widening the sensor span to x = -0.06, -0.03,
      0.0, 0.03, 0.06 (weights unchanged). Iteration 3 shows line losses still near
      1.0 per run with kp and speed held, so the narrow span is the next suspect.

      - If steering_oscillation rises above about 0.32 or the score falls below 176.2,
      revert kd to 0.5 and test sensor_size 0.016 instead, keeping kp 4.0 and base_speed
      1.5. Iteration 3 showed kd gains are shrinking and jitter is growing.

      - Keep kp 4.0, ki 0.2, base_speed 1.5 and line_loss last_direction fixed for
      the next race. Iteration 2 showed that lowering speed to 1.3 cut the score from
      170.5 to 86.8, so these are not the lever, and holding them keeps each effect
      separable.


      - [Open this output](iteration-4/entityR1/versions/a8bcf1b2047f4c5c86eaefd01ba17b84/payload.json)

