map:
  id: race-170-opt-eval
  schema: v0.2
  scenario: Iteration 1
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 0.
dimensions:
  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Wider sensor array v1
    notes: 'Widened the sensor array to x = ±0.08 so the line is still seen before
      the off-track limit, with kp and kd doubled to offset the halved signal scale.
      Iteration 0 ended every run off track with line loss just before the limit,
      so this targets line-loss events and max_error.


      ### Rationale


      Evidence from iteration 0 (development simulator, 60 trials, none finished):
      every run ended off track. Oval reached progress 0.35, s-bend 0.16, slalom 0.12,
      with about one line-loss event per run. max_error is about 0.06 m, which is
      the off-track limit, while rms_error is only about 0.025 to 0.03 m. The robot
      is therefore tracking well until a sudden loss of the line, and then leaves
      the track. The likely cause is geometry. The five sensors span only x = -0.04
      to +0.04, so all readings drop to zero once the tape is about 0.058 m from centre.
      That is almost exactly the off-track limit, so the robot loses the line in the
      same instant it leaves the track, and last_direction then has to recover from
      a sensor-blind state. Change 1 (geometry): widen the sensor array to x = -0.08,
      -0.04, 0, 0.04, 0.08 (the allowed maximum). The outer sensors then see the tape
      well before the robot reaches the off-track limit, which should cut line-loss
      events. Change 2 (controller, compensating gain): with the same weights (-2,
      -1, 0, 1, 2), the signal per metre of lateral offset halves, so I double kp
      from 2.5 to 5.0 to keep the same steering authority, and double kd from 0.2
      to 0.4 to keep the same damping ratio. ki stays 0. Speed: I keep base_speed
      at 1.2. Stability has to come before the time target, and the failures are off-track
      rather than too slow. Line loss stays last_direction. Expected result: fewer
      line-loss events, lower max_error, and longer progress on all three tracks,
      possibly with a first completion on the oval. Hypotheses to check: (a) line_loss_events
      falls to near zero and max_error drops below 0.05; (b) if oscillation rises
      with kp 5.0, the gain is too high and kd or kp should be trimmed; (c) if the
      robot is stable and finishes with spare time, raise base_speed toward 1.4 to
      1.6 for the 3.0 s limit. Measurements requested: completion, progress, completion_time,
      rms_error, max_error, line_loss_events, steering_oscillation.


      - [Open this output](iteration-1/entity0/versions/aa668353cb5245479ed172194ead8ce7/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-dc0fea1dbb9babcb/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-d0fbf125c2d61564/payload.json)'
  - id: entityR1
    label: Baseline approved to race
    notes: 'The candidate is valid and conservative, and no race data exists yet,
      so it is approved as the iteration 0 baseline. The feedback is conditional on
      what the race shows, mainly whether base_speed 1.2 is too slow for the 3.0 s
      limit given the contract''s 1.5 m/s requirement.


      ### Feedback


      Iteration 0 has no race data, so this review checks validity and the reasoning
      in the rationale, not performance. The candidate is valid: all five sensor positions
      sit inside the allowed x and y ranges, the five sensor weights are within [-2,
      2] with the signs the contract expects, and base_speed, kp, ki, kd and line_loss
      are inside their limits. The main open question is speed. The contract says
      the course must be covered in under 3.0 s, which needs about 1.5 m/s average
      on a 4 to 5 m course. The rationale''s estimate that base_speed 1.2 gives about
      1.5 m/s is unverified, because no earlier race exists to calibrate it. Your
      own rationale also says base_speed is set conservatively, so the robot may be
      too slow to finish. Do not change the candidate before this race. Once the race
      reports completion_time and progress, use them as follows. If the run finishes
      with spare time, keep base_speed and tune kp. If it covers most of the course
      but runs out of time (completion 0, progress high), raise base_speed in steps
      of about 0.2, keeping the speed that still tracks the line. If steering_oscillation
      or max_error is high, lower kp or raise kd before raising speed. If line_loss_events
      is high on the bends, check whether last_direction is correct for the loss pattern.


      ### Requested changes


      - If completion is 0 and progress is high at the 3.0 s limit, raise controller.base_speed
      from 1.2 toward 1.4 to 1.6, because the contract needs an average of about 1.5
      m/s to finish in time.

      - If steering_oscillation or max_error is high, lower controller.kp (for example
      from 2.5 to about 1.8) or raise controller.kd (for example from 0.2 to about
      0.4) before changing speed.

      - If the robot runs wide on bends (large max_error with no oscillation), raise
      controller.kp in steps of about 0.5, and keep kd so the response stays damped.


      - [Open this output](iteration-0/entityR1/versions/b7448539c00449c888d0d6ecd918adde/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/3c09966bb8e1426db6ed0142a41d744d/payload.json)'
