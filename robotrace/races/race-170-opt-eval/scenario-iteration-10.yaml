map:
  id: race-170-opt-eval
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Tighter sensor spacing
    notes: 'Keeps iteration 9''s best design (base_speed 0.9, scored 686.99) and narrows
      the sensor array from 0.03 to 0.025 half-span. Slalom progress was flat under
      speed changes, while narrowing spacing previously moved it from 0.37 to 0.56,
      so spacing is the next lever to test.


      ### Rationale


      Evidence from iteration 9 (base_speed 0.9, sensors at x = -0.03 to +0.03 with
      16 mm footprint, kp 3.0, kd 0.8, ki 0). This is the best raced design at 686.99,
      up from 683.09. Oval held 20 of 20 with steering_oscillation 0.13. S-bend finishes
      rose from 17 to 18 of 20, and the mean finish time was 2.37 s, well inside the
      3.0 s limit. Slalom did not improve: progress fell slightly from 0.563 to 0.532,
      and it still has 0 of 20 completions with 1.2 line-loss events per run. The
      evaluator''s rule for this outcome is that slalom is flat near 0.56, so speed
      is not the slalom lever and the next test should be sensor spacing, not more
      speed or kd. Iteration 7 to 8 showed that narrowing the spacing from 0.02 to
      0.015 steps moved slalom progress from 0.37 to 0.56 while also cutting oscillation,
      so the narrowing trend is the strongest lever seen.


      Change (one variable from the best design, iteration 9): sensor x positions
      from -0.03, -0.015, 0, 0.015, 0.03 to -0.025, -0.0125, 0, 0.0125, 0.025. The
      spacing is about 17 percent tighter, which is a moderate step, not a repeat
      of the 0.04 to 0.03 jump. Base_speed stays at 0.9, sensor_size 0.016, kp 3.0,
      kd 0.8, ki 0 and line_loss last_direction unchanged. Weights stay at (-2, -1,
      0, 1, 2). The tighter array raises the effective steering gain by about 1.2
      times with fixed weights, so I hold kp at 3.0 rather than adding gain, given
      the oscillation margin that iteration 9 showed.


      Expected result (a hypothesis, not a measurement): slalom progress rises above
      0.55 and slalom line-loss events fall, with the oval still at 20 of 20 and s-bend
      finishes at 14 or more. Risks: the higher effective gain may push s-bend off-track
      ends back up, and a sharper steering response may raise oscillation on the oval.
      Reading the race: (a) if slalom progress or completions rise while the oval
      and s-bend hold, keep the narrower spacing and test 0.8 base_speed on slalom
      only if s-bend finishes stay at 18 or more; (b) if s-bend finishes fall below
      14 or the oval drops, return to the iteration 9 spacing, which is the best raced
      base; (c) if slalom stays flat near 0.53 to 0.56, the bend geometry is the limit,
      and the next test should be sensor_size or a single kd step of 0.9, not speed.


      - [Open this output](iteration-10/entity0/versions/887a4982dca44515a0776a8a032c267c/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-9faa03fffdb62ff9/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-2ffec7cc42b8038e/payload.json)'
  - id: entityR1
    label: Approve tighter sensor
    notes: 'Approved a single-variable spacing step (sensors narrowed from 0.03 to
      0.025 half-span) on the iteration 9 base, because iteration 7 to 8 showed spacing
      is the strongest slalom lever and the step is moderate. Fallbacks and kp reduction
      are specified if the oval or s-bend degrade.


      ### Feedback


      Pre-race review of the sensor spacing step from x = -0.03, -0.015, 0, 0.015,
      0.03 to x = -0.025, -0.0125, 0, 0.0125, 0.025, with sensor_size 0.016, kp 3.0,
      kd 0.8, ki 0, base_speed 0.9 and line_loss last_direction unchanged. The best
      raced design is iteration 9 at 686.99. Iteration 7 to 8 showed that narrowing
      spacing from 0.02 to 0.015 steps moved slalom progress from 0.37 to 0.56, and
      the oval stayed at 20 of 20 with lower steering oscillation. Iteration 8 to
      9 showed that base_speed 0.9 gave a small s-bend gain (finishes 17 to 18) and
      left slalom flat (0.56 to 0.53). Slalom is still 0 of 20 completions. Gain changes
      (iterations 5 and 6) did not move slalom, so the spacing trend is the strongest
      lever seen.


      The candidate is valid: all positions are inside range, the weights are unchanged
      at (-2, -1, 0, 1, 2), and sensor_size 0.016 is an allowed option. It is a moderate
      single-variable step (about 17 percent tighter than iteration 9). With fixed
      weights, the effective steering gain rises by roughly 1.2 times, so the main
      risks are a sharper steering response, more oval oscillation, and s-bend off-track
      ends. The candidate does not repeat the iteration 1 mistake of widening the
      array, and kp is held at 3.0 rather than raised. A further revision would cost
      two action runs and would add little beyond what the race will show. Racing
      it is the most informative next step, and the iteration 9 design remains the
      fallback.


      How to read the race: (a) if slalom progress rises above 0.56 while the oval
      stays at 20 of 20 and s-bend finishes hold at 17 or more, keep this spacing
      and consider a final small base_speed or spacing refinement in the last iteration;
      (b) if s-bend finishes fall below 14 or the oval drops, return to the iteration
      9 spacing (x = -0.03 to +0.03), which is the best raced base; (c) if slalom
      stays flat near 0.53 to 0.56, bend geometry is the limit, and the next test
      should be sensor_size or a single kd step, not more speed.


      ### Requested changes


      - If slalom progress rises above 0.56 with the oval at 20 of 20 and s-bend finishes
      at 14 or more, keep geometry.sensor_positions at x = -0.025, -0.0125, 0, 0.0125,
      0.025, and in the final iteration consider controller.base_speed 0.8 only if
      s-bend completion_time stays comfortably under 3.0 s (iteration 9 mean 2.37
      s at 0.9).

      - If s-bend finishes fall below 14 of 20 or the oval drops below 20 of 20, return
      geometry.sensor_positions to x = -0.03, -0.015, 0, 0.015, 0.03 with sensor_size
      0.016, kp 3.0, kd 0.8, base_speed 0.9, because iteration 9 (686.99) is the base
      to beat.

      - If steering_oscillation on the oval rises above about 0.3 (iteration 9 was
      0.13) with the tighter array, reduce controller.kp from 3.0 to about 2.7 rather
      than widening or narrowing spacing again, since the tighter array raises effective
      gain by about 1.2 times with fixed weights.


      - [Open this output](iteration-10/entityR1/versions/6357bfa42e6e4a72b9f67c44b430f208/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/887a4982dca44515a0776a8a032c267c/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-2ffec7cc42b8038e/payload.json)'
