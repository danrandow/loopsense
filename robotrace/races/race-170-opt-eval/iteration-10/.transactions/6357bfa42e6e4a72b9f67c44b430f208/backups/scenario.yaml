map:
  id: race-170-opt-eval
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Tighter sensor spacing
    notes: 'Keeps iteration 9''s best design (base_speed 0.9, scored 686.99) and narrows
      the sensor array from 0.03 to 0.025 half-span. Slalom progress was flat under
      speed changes, while narrowing spacing previously moved it from 0.37 to 0.56,
      so spacing is the next lever to test.


      ### Rationale


      Evidence from iteration 9 (base_speed 0.9, sensors at x = -0.03 to +0.03 with
      16 mm footprint, kp 3.0, kd 0.8, ki 0). This is the best raced design at 686.99,
      up from 683.09. Oval held 20 of 20 with steering_oscillation 0.13. S-bend finishes
      rose from 17 to 18 of 20, and the mean finish time was 2.37 s, well inside the
      3.0 s limit. Slalom did not improve: progress fell slightly from 0.563 to 0.532,
      and it still has 0 of 20 completions with 1.2 line-loss events per run. The
      evaluator''s rule for this outcome is that slalom is flat near 0.56, so speed
      is not the slalom lever and the next test should be sensor spacing, not more
      speed or kd. Iteration 7 to 8 showed that narrowing the spacing from 0.02 to
      0.015 steps moved slalom progress from 0.37 to 0.56 while also cutting oscillation,
      so the narrowing trend is the strongest lever seen.


      Change (one variable from the best design, iteration 9): sensor x positions
      from -0.03, -0.015, 0, 0.015, 0.03 to -0.025, -0.0125, 0, 0.0125, 0.025. The
      spacing is about 17 percent tighter, which is a moderate step, not a repeat
      of the 0.04 to 0.03 jump. Base_speed stays at 0.9, sensor_size 0.016, kp 3.0,
      kd 0.8, ki 0 and line_loss last_direction unchanged. Weights stay at (-2, -1,
      0, 1, 2). The tighter array raises the effective steering gain by about 1.2
      times with fixed weights, so I hold kp at 3.0 rather than adding gain, given
      the oscillation margin that iteration 9 showed.


      Expected result (a hypothesis, not a measurement): slalom progress rises above
      0.55 and slalom line-loss events fall, with the oval still at 20 of 20 and s-bend
      finishes at 14 or more. Risks: the higher effective gain may push s-bend off-track
      ends back up, and a sharper steering response may raise oscillation on the oval.
      Reading the race: (a) if slalom progress or completions rise while the oval
      and s-bend hold, keep the narrower spacing and test 0.8 base_speed on slalom
      only if s-bend finishes stay at 18 or more; (b) if s-bend finishes fall below
      14 or the oval drops, return to the iteration 9 spacing, which is the best raced
      base; (c) if slalom stays flat near 0.53 to 0.56, the bend geometry is the limit,
      and the next test should be sensor_size or a single kd step of 0.9, not speed.


      - [Open this output](iteration-10/entity0/versions/887a4982dca44515a0776a8a032c267c/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-9faa03fffdb62ff9/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-2ffec7cc42b8038e/payload.json)'
  - id: entityR1
    label: Evaluator Feedback
    notes: 'Evaluator Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Pre-race review of the base_speed test: controller.base_speed 1.0 to 0.9, with
      the iteration 8 design otherwise unchanged (sensor x = -0.03, -0.015, 0, 0.015,
      0.03; sensor_size 0.016; kp 3.0; kd 0.8; ki 0; line_loss last_direction; geometry
      and weights unchanged). Iteration 8 is the best raced design at 683.09, so this
      candidate is judged against that bar.


      The candidate is valid: all positions are inside range, the weights are unchanged
      at (-2, -1, 0, 1, 2), and base_speed 0.9 is within [0.05, 2]. It changes one
      variable from the best design, so the race isolates speed. Iteration 8 showed
      that sensing is the slalom lever (progress 0.37 to 0.56), and iterations 5 and
      6 showed that gain changes did not move slalom. Speed is the remaining untested
      lever for slalom bend entry, and the rationale''s time estimate is reasonable:
      the s-bend mean finish at 1.0 was 2.43 s (iteration 8), so 0.9 should land near
      2.7 s, inside the 3.0 s limit. The main cost is a lower completion-time term,
      which is small next to the value of turning slalom off-track ends into completions.
      Racing this is more informative than another revision, which would cost two
      action runs for little added evidence.


      Do not treat the expected slalom gain as measured. Once the race reports, read
      it as follows. If slalom progress or completions rise while the oval stays at
      20 of 20 and s-bend finishes stay at 14 or more, keep base_speed 0.9 and test
      a small step around 0.8 next, or a spacing refinement to 0.025 steps. If s-bend
      finishes fall below 14 or s-bend completion times approach 3.0 s, return base_speed
      to 1.0 and keep the iteration 8 design as the base. If slalom stays flat near
      0.56, bend geometry is the limit, so the next test should be kd or sensor spacing
      rather than speed. Watch for a stall on slalom at low speed: progress must rise
      by at least 0.002 per 50 steps, or the run ends early.


      ### Requested changes


      - If slalom progress rises above 0.56 and the oval holds 20 of 20 with s-bend
      finishes at 14 or more, keep controller.base_speed at 0.9 and test 0.8 next,
      since iteration 8 showed sensing is the slalom lever and speed is the next untested
      one.

      - If s-bend finishes fall below 14 of 20 or s-bend completion_time approaches
      3.0 s, return controller.base_speed to 1.0 and keep the iteration 8 design as
      the base, because iteration 8 is the best raced design at 683.09.

      - If slalom progress stays flat near 0.56 at base_speed 0.9, do not add more
      speed or kd. Test a small sensor spacing refinement to x = -0.0375, -0.01875,
      0, 0.01875, 0.0375 or a spacing of 0.025, because iteration 8 showed that spacing
      moved slalom progress from 0.37 to 0.56.


      - [Open this output](iteration-9/entityR1/versions/d9cac5fa145f43f9a2ee35f191245e00/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/271d9d260cb94f52bfbaf87c99158f7f/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-3f1e0aa40a0ba504/payload.json)'
