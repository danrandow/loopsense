  id: race-170-opt-eval
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Sensor 16mm, ki 0 base
    notes: 'Reverts ki to 0 because the ki 0.05 race fell to 579 (s-bend finishes
      12 vs 14) and tests sensor_size 0.016 on the best iteration 4 design (600.47).
      This follows the Evaluator''s rule for a flat slalom with max_error near 0.06
      and gain changes not moving it.


      ### Rationale


      Evidence. The ki 0.05 candidate (iteration 6) raced at 579.17, below the best
      raced design, iteration 4 (kp 3.0, kd 0.8, ki 0) at 600.47. Oval held at 20
      of 20 with steering_oscillation unchanged at 0.26. S-bend finishes fell from
      14 to 12 of 20 (mean finish 2.55 s), and s-bend off-track ends rose from 6 to
      8. Slalom stayed at 0 of 20 with progress 0.232 and max_error 0.062. The Evaluator''s
      keep-ki rule needs s-bend finishes of 14 or more, and that is not met, so ki
      goes back to 0. The Evaluator''s third rule then applies: slalom is flat near
      progress 0.22 to 0.23 and max_error near 0.06 across kd 0.6 to 0.8 and kp 3.0
      to 3.5, so gain is not moving it.


      Change (one variable from the best design, iteration 4): geometry.sensor_size
      0.012 to 0.016. Everything else is held at iteration 4 values: kp 3.0, kd 0.8,
      ki 0, base_speed 1.0, line_loss last_direction, sensor positions and weights
      unchanged. A wider footprint averages more tape under each sensor, so the signal
      should be smoother at the 0.06 m edge and slalom line loss may drop. The footprint
      is still well under the 25 mm tape width.


      Expected result (a hypothesis, not a measurement): slalom line_loss_events fall
      below about 1.0 and slalom progress rises above 0.25, with oval still at 20
      of 20. Risk: the larger footprint blurs the s-bend response and could cut s-bend
      finishes below 14.


      Hypotheses and reading the race: (a) if slalom progress or max_error improves
      with s-bend finishes at 14 or more, sensing was the slalom limit and the next
      step is a sensor_size or spacing refinement; (b) if s-bend finishes drop with
      the oval unchanged, return sensor_size to 0.012 and keep the iteration 4 design
      as the base; (c) if slalom stays flat, slalom is limited by bend geometry, so
      the next lever is base_speed or sensor spacing rather than gain.


      Measurements wanted: completion, progress, completion_time, rms_error, max_error,
      line_loss_events, steering_oscillation and control_effort on all three tracks,
      to separate the sensor-size effect on slalom from the s-bend effect.


      - [Open this output](iteration-7/entity0/versions/ce2411e9e5524cc9a5182a7dbe00d81b/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-5a3dd4228ce3ea61/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-7fee118f39a766dc/payload.json)'
  - id: entityR1
    label: Evaluator Feedback
    notes: 'Evaluator Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Pre-race review of the ki step: controller.ki 0 to 0.05, with kp 3.0, kd 0.8,
      base_speed 1.0, line_loss last_direction and the iteration 0 sensor layout unchanged.
      The best raced design is iteration 4 (kp 3.0, kd 0.8, ki 0) at 600.47, so this
      candidate is judged against that bar. The candidate is valid: all sensor positions
      are inside range, the weights are unchanged at (-2, -1, 0, 1, 2), and ki 0.05
      is inside [0, 5]. It changes one variable from the best design, so the next
      race isolates integral action. The rationale''s windup risk is small: the integral
      is capped at +/-2, so ki 0.05 adds at most 0.1 to turn, which is a minor term
      next to kp 3.0 times the signal. Expect little change, so the race is the main
      source of information. A revision would cost two action runs and would not clearly
      add value, so race it now. Do not treat the rationale''s expected s-bend result
      as measured. Slalom is still 0 of 20 finishes, and iteration 5 showed that kp
      3.5 did not move it, so ki is unlikely to solve slalom on its own. Once the
      race reports: if s-bend finishes hold at 14 or more and the oval holds 20 of
      20, keep ki at 0.05 and test base_speed 1.2 to recover completion time. If oval
      finishes fall or steering_oscillation rises sharply (iteration 4 oval 0.26,
      s-bend 0.40), return to ki 0. If slalom is still flat with max_error near 0.06,
      the next lever is geometry, not gain: test sensor_size 0.016 with the other
      values held.


      ### Requested changes


      - If s-bend finishes hold at 14 of 20 or more and the oval holds 20 of 20 with
      ki 0.05, keep controller.ki at 0.05 and test controller.base_speed 1.2 to recover
      completion time, since the iteration 4 s-bend mean finish of 2.57 s leaves limited
      margin under 3.0 s.

      - If oval finishes fall or steering_oscillation rises sharply above the iteration
      4 levels (oval 0.26, s-bend 0.40) with progress flat, return controller.ki to
      0 and keep the iteration 4 design (kp 3.0, kd 0.8).

      - If slalom stays at 0 of 20 finishes with progress near 0.22 and max_error
      near 0.06, change one geometry field: geometry.sensor_size from 0.012 to 0.016,
      keeping kp 3.0, kd 0.8 and ki at the better of 0 or 0.05, because kp 3.5 (iteration
      5) did not move slalom progress.


      - [Open this output](iteration-6/entityR1/versions/16dec4d925a34bf69b84642a53e2c2c0/payload.json)

