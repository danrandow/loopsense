  - id: entity0
    label: Tune for stability and
    notes: 'Lowered base_speed to 1.4 to reduce aggressive driving, increased kd to
      3.5 for better damping, and adjusted sensor weights to increase inner sensor
      influence for improved steering precision. Geometry unchanged. This candidate
      is ready to race to gather telemetry for further refinement.


      ### Rationale


      The Evaluator feedback indicates that the last candidate has not yet been raced,
      so we lack telemetry data to confirm the effects of the current parameters.
      The feedback suggests improving stability and reducing aggressive driving by
      slightly lowering base_speed to 1.4, increasing kd to 3.5 to enhance damping,
      and adjusting sensor_weights to [-1.0, -0.8, 0, 0.8, 1.0] to increase the influence
      of the inner sensors for better steering precision. I have implemented these
      changes accordingly, keeping kp at 7 and ki at 0.35 to maintain a balance between
      responsiveness and integral correction. The geometry remains unchanged as no
      issues were reported. I expect these adjustments to improve stability, reduce
      oscillations and line loss events, and maintain good speed. I request telemetry
      on completion, progress, line_loss_events, rms_error, and steering_oscillation
      to verify these effects after racing.


