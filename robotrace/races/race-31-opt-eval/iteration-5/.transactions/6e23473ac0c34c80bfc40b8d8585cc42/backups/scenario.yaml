      from previous iterations. Given the limited remaining runs and the lack of telemetry,
      I will keep this candidate unchanged to allow it to be raced and gather essential
      telemetry data. This data will be critical to inform any final tuning decisions.
      I request telemetry on completion, progress, line_loss_events, rms_error, and
      steering_oscillation to evaluate stability, speed, and line tracking performance.


