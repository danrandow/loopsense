      damping, and keeps kp at 7 and ki at 0.35 to maintain responsiveness and integral
      correction. Sensor weights remain at [-1.0, -0.8, 0, 0.8, 1.0], preserving steering
      balance. The geometry is unchanged, which is reasonable given no reported issues.
      These changes aim to reduce oscillations and line loss events while maintaining
      good progress. I recommend approving this candidate to race and collect telemetry
      on completion, progress, line_loss_events, rms_error, and steering_oscillation
      to verify these improvements. No further changes are requested before racing.


