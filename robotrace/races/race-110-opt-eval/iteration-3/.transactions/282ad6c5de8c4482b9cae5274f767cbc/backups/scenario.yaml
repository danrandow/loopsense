map:
  id: race-110-opt-eval
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Wider sensor span
    notes: 'Widens the sensor array from ±0.04 m to ±0.07 m to keep the tape in view
      through bends, since ki 0.4 changed nothing (max_error still about 0.061 with
      one line loss per trial). Tests whether the narrow array causes the line loss
      that drives every trial off track.


      ### Rationale


      Evidence. Iteration 2 (ki 0.4, all else as R1) scored 38.47, essentially identical
      to R1 at 38.61. Every trial in both races still ended off_track with 0 finishes.
      max_error stayed at 0.0607 to 0.0615 on every track, and each trial logged exactly
      one line_loss_event. Adding integral action changed nothing measurable, so the
      constant-bias hypothesis (H3) is rejected. Lowering kp and widening the footprint
      (iteration 1) also barely moved max_error. Across all three iterations, max_error
      is pinned just above the 0.06 m off-track limit, whatever the gains. The one
      consistent event is a single line loss per trial, followed by drift off the
      line.


      Hypothesis. The sensor array is too narrow for the bends. The sensors span x
      = -0.04 to +0.04 m, plus footprint, so the tape leaves the array when the robot''s
      lateral error or heading error is about 0.02 to 0.03 m. The line is then lost,
      and last_direction with throttle 0.35 cannot recover before the robot reaches
      0.06 m. A wider span (x = ±0.07 m) should keep the tape under at least one sensor
      through the same bends and so avoid the line loss. Lateral error should then
      stay below 0.06 m.


      Change. I widened the sensor span to x = -0.07, -0.035, 0, 0.035, 0.07 m, keeping
      five sensors, y = 0.05 m and the 16 mm footprint. The weights stay at -1, -0.5,
      0, 0.5, 1, so the signal range is unchanged. I kept kp 2.0, kd 0.15, ki 0.4
      (neutral in iteration 2, so it is harmless and keeps the test to one variable),
      base_speed 1.4 and line_loss last_direction. This is a single-variable geometry
      test. Speed and line_loss are held back until line loss is resolved.


      Expected result. line_loss_events falls toward 0, max_error drops below 0.06,
      and progress rises well above 0.14. If line loss persists with the wider array,
      the next test is line_loss = search_left or search_right, and then sensor y
      placement.


      Measurements wanted: max_error and rms_error per track, line_loss_events, progress,
      completion, steering_oscillation and completion_time. These show whether the
      span, rather than the gains, is the driver.


      - [Open this output](iteration-3/entity0/versions/52a18c75f0674865bc7d8a217293de16/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-9e98a45db9cfb34c/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-8e15610695729bfd/payload.json)'
  - id: entityR1
    label: Integral test (ki 0.4)
    notes: 'Single-variable test: R1 with ki raised from 0 to 0.4, because all 60
      R2A trials showed a near-constant max_error of about 0.061 m that fits a steady
      motor-mismatch bias. Approved now so the race gives telemetry that tests this
      hypothesis.


      ### Feedback


      Written before this candidate has raced, so no result is stated for it. The
      candidate is R1 with one change: ki 0.0 to 0.4. Evidence: R2A (iteration 1,
      scored 38.6) ended all 60 trials off_track with 0 finishes. Progress was 0.04
      to 0.14, each trial logged exactly one line_loss_event, and max_error sat at
      0.0607 to 0.0615 on every track, just past the 0.06 m limit. That near-identical
      value across tracks and seeds points to a constant bias, not a bend-specific
      failure, and the iteration-0 to iteration-1 change in gain and footprint moved
      max_error very little. A fixed motor mismatch is the likely constant bias, so
      integral action is a sound single-variable test. The ki value (0.4, inside the
      0 to 5 range and well within the +/-2 integral limit) is moderate and is not
      obviously broken. The rationale keeps kp 2.0, kd 0.15, sensor_size 0.016, base_speed
      1.4 and line_loss last_direction, so the race isolates the integral effect.
      Judge the result by max_error, line_loss_events and progress, not by the score
      alone.


      What to change after the race, depending on what it shows:

      - If max_error falls clearly under 0.06 and line_loss_events drops toward 0,
      keep ki near 0.4 and raise base_speed toward 1.6 to improve completion_time.

      - If max_error stays near 0.061 and line_loss_events remains at 1 per trial,
      integral action is not the cause. Test line_loss = search_left or search_right
      in place of last_direction, since the line-loss direction has never been tested.

      - If steering_oscillation rises well above the 0.06 to 0.07 baseline range,
      the integral is adding jitter. Lower ki to 0.2 before changing anything else.


      ### Requested changes


      - If max_error stays near 0.061 and line_loss_events stays at 1 per trial with
      ki = 0.4, test line_loss = search_left or search_right in place of last_direction;
      iteration 1 (R2A) never tested which way the line is lost.

      - If steering_oscillation rises well above the 0.06 to 0.07 range seen in R2A/R2B,
      reduce ki to 0.2 while keeping kp 2.0 and kd 0.15, to check whether the integral
      term is adding jitter.

      - If max_error drops clearly below 0.06 and the run stays on track but progress
      is short of 0.9 or completion_time is the limiting term, restore base_speed
      to 1.6 with ki and the other settings unchanged.


      - [Open this output](iteration-2/entityR1/versions/d345bc95d9dc4b9c9175316adecf7b87/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/f8606a08608d4edc8b1248a08a901c96/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-1395c8063f520396/payload.json)'
