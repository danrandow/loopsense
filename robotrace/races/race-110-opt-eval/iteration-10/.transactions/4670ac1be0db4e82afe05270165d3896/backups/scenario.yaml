map:
  id: race-110-opt-eval
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Track 0.10 m test
    notes: 'Iteration 9 (wheel_track 0.14, score 98.24) is kept except wheel_track,
      which goes to 0.10 m. The Evaluator''s rule applies because slalom progress
      fell to 0.101 and its line loss returned, while max_error stayed at about 0.061
      on oval and s-bend. The narrower track tests whether the drivetrain can be made
      to hold the line on bends.


      ### Rationale


      Evidence. Iteration 9 (wheel_track 0.14, otherwise iteration 8) scored 98.24,
      the best raced design so far, up from 85.47. Oval progress rose from 0.268 to
      0.373 and the oval finish rate was 1 in 20 trials. S-bend progress held at 0.160
      and its max_error fell only slightly, from 0.0606 to 0.0603. Slalom progress
      fell from 0.113 to 0.101, its max_error rose from 0.065 to 0.0623, and line
      loss returned (0.6 events per trial). Oval max_error was unchanged at 0.061.
      Every trial still ends off_track, and max_error has stayed pinned at 0.060 to
      0.065 across iterations 0 to 9.


      Decision. The approved contingency applies. max_error did not drop to 0.060
      or below on oval or s-bend, and slalom progress fell clearly below 0.113. So
      the next single-variable test is geometry.wheel_track = 0.10 m, with everything
      else as iteration 9. Iteration 9 is kept as the fallback. I am not moving base_speed
      in this iteration, because the drivetrain result is not yet clear.


      Expected result. A narrower track gives more turn per wheel difference. That
      should restore slalom steering authority and the line-loss recovery on tight
      bends. If the constant-bias explanation holds, the oval and s-bend max_error
      may rise, so the oval finish rate could fall. I expect the score to move either
      way by a moderate amount.


      Hypotheses. H1: the motor-mismatch bias is the drift source, and at 0.10 m the
      slalom line loss clears while max_error stays near 0.060 on oval and s-bend.
      H2: max_error stays at 0.061 or above at both 0.14 and 0.10, which would show
      the drivetrain is not the cause. The next step would then be sensor geometry,
      such as sensor_size 0.012 at the wide span, in the final iteration.


      Measurements wanted: max_error, line_loss_events, progress, completion and steering_oscillation
      per track, to compare against iteration 9 and against iteration 8.


      - [Open this output](iteration-10/entity0/versions/3ba6738f49fa409e90bbc0f6aebd764c/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-7e38a6c3d2108e79/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-023c6d7133c5bec6/payload.json)'
  - id: entityR1
    label: 'Approve: wheel_track 0.14'
    notes: 'Approved iteration 8, the best raced design (85.47), with wheel_track
      raised from 0.12 to 0.14 m. max_error has stayed pinned at 0.060 to 0.065 across
      every other change, and wheel_track is the one geometry lever never tested,
      so this is a low-risk single-variable test with two iterations left.


      ### Feedback


      Approved as a single-variable test. The candidate is iteration 8 (base_speed
      0.9, kd 0.3, ki 0.4, kp 2.0, search_right, y 0.05, wide span x = -0.07 to 0.07
      m, 16 mm sensors, wheel_track 0.12 m) with geometry.wheel_track raised from
      0.12 to 0.14 m. Evidence: iteration 8 is the best raced design (85.47). It removed
      line loss on oval and s-bend, but max_error is still at the limit (oval 0.0607,
      s-bend 0.0606, slalom 0.065). Across iterations 0 to 8, max_error has stayed
      at 0.060 to 0.065 under changes to kp, kd (0.05 to 0.30), ki, sensor size, span,
      y, search direction and base_speed (0.9 to 1.6). wheel_track has never been
      varied, so it is the untested lever. The change is physically motivated: turn
      rate is (vR - vL)/wheel_track, so a wider track gives less turn for the same
      wheel difference. That would reduce any drift from a fixed motor mismatch. The
      main risk is weaker steering authority on tight bends, which could cut slalom
      progress (0.113 in iteration 8). Note that ki = 0.4 (iteration 2) did not change
      max_error, which weakens the constant-bias explanation, so this is a test, not
      a likely fix. Judge the result by max_error, line_loss_events and progress per
      track against iteration 8.


      What to change next, depending on what the race shows:

      - If max_error falls to 0.060 or below on oval or s-bend and progress holds
      near 0.268 and 0.160, keep wheel_track 0.14 and step base_speed up (1.0, then
      1.1) while checking that max_error stays under the limit.

      - If max_error is unchanged or rises, or slalom progress drops clearly below
      0.113, move wheel_track to 0.10 m, the other option, since the direction of
      the effect is then unclear.

      - If max_error stays at 0.061 or higher at both 0.14 and 0.10, the drivetrain
      is not the cause. Then stop varying the controller and test sensor geometry
      (for example sensor_size 0.012 at the wide span) in the last iteration.


      ### Requested changes


      - Keep iteration 8 unchanged except geometry.wheel_track = 0.14 (from 0.12).
      Iterations 0 to 8 pinned max_error at 0.060 to 0.065 under every gain, span,
      y, search and speed change, and wheel_track has never been tested.

      - If max_error drops to 0.060 or below on oval or s-bend with progress held
      (oval near 0.268, s-bend near 0.160), keep wheel_track 0.14 and step controller.base_speed
      to 1.0, then 1.1, while watching max_error.

      - If max_error does not drop or slalom progress falls clearly below 0.113 at
      wheel_track 0.14, set geometry.wheel_track = 0.10 as the next single-variable
      test. If max_error is still at or above 0.061 there too, the drivetrain is not
      the cause.


      - [Open this output](iteration-9/entityR1/versions/d09ce1222cfb48e194d75128cf8fd34a/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/b2e23672c4d84145aa60e92548a113ef/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-8893eaa5493c7125/payload.json)'
