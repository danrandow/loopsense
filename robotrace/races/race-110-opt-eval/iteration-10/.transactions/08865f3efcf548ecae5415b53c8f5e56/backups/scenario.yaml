map:
  id: race-110-opt-eval
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Track 0.10 m test
    notes: 'Iteration 9 (wheel_track 0.14, score 98.24) is kept except wheel_track,
      which goes to 0.10 m. The Evaluator''s rule applies because slalom progress
      fell to 0.101 and its line loss returned, while max_error stayed at about 0.061
      on oval and s-bend. The narrower track tests whether the drivetrain can be made
      to hold the line on bends.


      ### Rationale


      Evidence. Iteration 9 (wheel_track 0.14, otherwise iteration 8) scored 98.24,
      the best raced design so far, up from 85.47. Oval progress rose from 0.268 to
      0.373 and the oval finish rate was 1 in 20 trials. S-bend progress held at 0.160
      and its max_error fell only slightly, from 0.0606 to 0.0603. Slalom progress
      fell from 0.113 to 0.101, its max_error rose from 0.065 to 0.0623, and line
      loss returned (0.6 events per trial). Oval max_error was unchanged at 0.061.
      Every trial still ends off_track, and max_error has stayed pinned at 0.060 to
      0.065 across iterations 0 to 9.


      Decision. The approved contingency applies. max_error did not drop to 0.060
      or below on oval or s-bend, and slalom progress fell clearly below 0.113. So
      the next single-variable test is geometry.wheel_track = 0.10 m, with everything
      else as iteration 9. Iteration 9 is kept as the fallback. I am not moving base_speed
      in this iteration, because the drivetrain result is not yet clear.


      Expected result. A narrower track gives more turn per wheel difference. That
      should restore slalom steering authority and the line-loss recovery on tight
      bends. If the constant-bias explanation holds, the oval and s-bend max_error
      may rise, so the oval finish rate could fall. I expect the score to move either
      way by a moderate amount.


      Hypotheses. H1: the motor-mismatch bias is the drift source, and at 0.10 m the
      slalom line loss clears while max_error stays near 0.060 on oval and s-bend.
      H2: max_error stays at 0.061 or above at both 0.14 and 0.10, which would show
      the drivetrain is not the cause. The next step would then be sensor geometry,
      such as sensor_size 0.012 at the wide span, in the final iteration.


      Measurements wanted: max_error, line_loss_events, progress, completion and steering_oscillation
      per track, to compare against iteration 9 and against iteration 8.


      - [Open this output](iteration-10/entity0/versions/3ba6738f49fa409e90bbc0f6aebd764c/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-7e38a6c3d2108e79/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-023c6d7133c5bec6/payload.json)'
  - id: entityR1
    label: 'Approve: wheel_track 0.10'
    notes: 'Approved iteration 9 with wheel_track changed from 0.14 to 0.10 m, the
      one untested drivetrain lever. Slalom line loss returned and progress fell at
      0.14, and max_error has stayed pinned near 0.061 across all earlier changes.
      Iteration 9 remains the fallback.


      ### Feedback


      Written before this candidate has raced. It is iteration 9 (the best raced design,
      98.24) with one change: geometry.wheel_track from 0.14 to 0.10 m. Everything
      else stays fixed (base_speed 0.9, kp 2.0, ki 0.4, kd 0.3, search_right, sensor
      y 0.05, x -0.07 to 0.07, sensor_size 0.016). The evidence behind it: iteration
      9 widened the track from 0.12 to 0.14 m, and max_error stayed at the limit (oval
      0.061, s-bend 0.0603, slalom 0.0623). Slalom progress fell from 0.113 to 0.101
      and slalom line loss returned (0.6 events per trial). Iterations 0 to 9 have
      kept max_error pinned at 0.060 to 0.065 across gain, span, y, search-direction,
      and speed changes. The narrower track is the untested direction that should
      give more turn per wheel difference, which fits the slalom loss seen at 0.14.
      The candidate is valid and differs from the raced best by one field, so it is
      a clean test.


      What to do after the race, depending on what it shows, judged against iteration
      9 on max_error, line_loss_events and progress per track:

      - If slalom line loss clears and slalom progress recovers toward or above 0.113,
      and max_error on oval or s-bend moves to 0.060 or below, keep wheel_track 0.10
      and step base_speed up to 1.0 while checking that max_error stays under the
      limit.

      - If max_error and progress are essentially unchanged, the drivetrain is not
      the lever. Then test sensor_size 0.012 at the wide span in the final iteration,
      and keep whichever of the 0.10 or 0.14 designs scored higher as the fallback.

      - If slalom progress falls or line loss rises at 0.10, return to wheel_track
      0.14 (the iteration 9 fallback) and do not vary the drivetrain further.


      ### Requested changes


      - Keep iteration 9 unchanged except geometry.wheel_track = 0.10 (from 0.14).
      Slalom line loss returned at 0.14 (0.6 per trial) and slalom progress fell from
      0.113 to 0.101, so the narrower track is the next test of turn authority.

      - If max_error drops to 0.060 or below on oval or s-bend and slalom line loss
      clears, keep wheel_track 0.10 and step controller.base_speed to 1.0 while checking
      that max_error does not rise above the limit.

      - If max_error stays at 0.061 or higher at both 0.14 and 0.10, the drivetrain
      is not the cause. Then set geometry.sensor_size = 0.012 at the wide span (x
      -0.07 to 0.07, y 0.05) as the final single-variable test, keeping the higher-scoring
      track width.


      - [Open this output](iteration-10/entityR1/versions/4670ac1be0db4e82afe05270165d3896/payload.json)

