  id: race-188-opt-eval-muted
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: kp 4.5, kd 0.8 for slalom
    notes: 'Keeps the iteration-4 geometry and integral gain, raising kp to 4.5 for
      faster response and kd to 0.8 to damp it. Slalom never finished (progress 0.32)
      and s-bend oscillated most (0.41), so the change targets fast alternating bends.
      Oval finished 20 of 20 in iteration 4, so it is the regression check.


      ### Rationale


      Evidence: iteration 4 is the best design so far (score 483.7). Oval finished
      20 of 20 runs (mean 1.99 s, progress 0.997), so the 1.3 base speed and the current
      gains work on gentle bends. S-bend finished 3 of 20 (progress 0.71, steering_oscillation
      0.41, the highest so far), and slalom never finished (progress 0.32, off track
      in all 20 runs). The weak point is fast alternating bends, where the loop is
      still underdamped and responds too slowly to direction changes. Iteration 4
      also showed that ki (0.02 to 0.5) and kd (0.3 to 0.6) together cut max_error
      and line losses, so the integral and derivative terms are doing useful work.


      Changes, all in the controller: (1) kp 4.0 to 4.5 for more steering authority
      on rapid direction changes, since slalom progress is limited by slow response
      rather than by jitter. (2) kd 0.6 to 0.8 to damp the extra proportional gain,
      because s-bend oscillation is already high and kp 5 with kd 0.3 previously caused
      overshoot. (3) ki stays at 0.5, which iteration 4 showed is helping. base_speed
      stays at 1.3, because s-bend needs about 2.8 s and a lower speed would push
      it past the 3 s limit. Geometry is unchanged, so the effect of the controller
      change can be read directly.


      Expected result: slalom progress rises above 0.5 and some slalom runs complete,
      s-bend completions increase, and oval stays at 20 of 20. Hypotheses: (a) with
      kd 0.8, steering_oscillation on s-bend falls back below 0.4 even with the higher
      kp, so kd is damping rather than adding lag; (b) if oval steering_oscillation
      rises above 0.35 or oval completions drop, kp 4.5 is too aggressive and should
      return to 4.0 with kd kept at 0.8. Measurements wanted next: completion and
      completion_time by track, progress and max_error on slalom and s-bend (to see
      where the robot leaves the line), rms_error and line_loss_events (to judge the
      effect of kp), and steering_oscillation (to judge kd).


      - [Open this output](iteration-5/entity0/versions/8874026c5b884a32bcdd6d544e169766/payload.json)

      - Based on: [entityR2A](iteration-5/entityR2A/versions/carried-5438f6c876243359/payload.json)'
  - id: entityR1
    label: Approve kp 4.5 / kd 0.8
    notes: 'Approves the single-step controller change (kp 4.0 to 4.5, kd 0.6 to 0.8)
      on the iteration-4 best design. Evidence: oval 20/20, s-bend 3/20 with high
      oscillation (0.41), and slalom 0/20 with progress 0.32, so the change targets
      slow response on alternating bends.


      ### Feedback


      Judged before racing, so no outcome is stated for this candidate. The evidence
      is the iteration-4 race (score 483.7, best so far): oval finished 20 of 20 runs
      (mean 1.99 s, progress 0.997), s-bend finished 3 of 20 (progress 0.71, steering_oscillation
      0.41, the highest so far), and slalom finished 0 of 20 (progress 0.32, off track
      in every run). The weak spot is fast alternating bends, which is consistent
      with slow response rather than an integral or bias problem. The candidate changes
      only controller.kp (4.0 to 4.5) and controller.kd (0.6 to 0.8). Geometry, ki
      0.5, base_speed 1.3, sensor weights and line_loss are unchanged, so the effect
      can be read directly. Iteration 3 showed that kp 5 with kd 0.3 overshot, which
      is why kd rises with kp here. The risk is oval: iteration 4 has steering_oscillation
      0.23 there, and a higher kp could push it up and cost the 20/20 completions.
      The change is small, tied to the slalom evidence, and the candidate is valid.
      Approve so the race gives per-track telemetry, since a revision would cost two
      action runs and iterations remain for further tuning. Interpreting the next
      race: if oval stays at 20/20 and s-bend or slalom progress rises, keep kp 4.5
      and kd 0.8. If oval steering_oscillation rises above about 0.35 or oval completions
      drop, kp 4.5 is too aggressive, so return kp to 4.0 and keep kd 0.8. If s-bend
      steering_oscillation stays above 0.4 with kd 0.8, kd is not damping enough,
      so raise kd toward 1.0 before changing kp again.


      ### Requested changes


      - If oval completions hold at 20/20 and s-bend or slalom progress rises, keep
      controller.kp at 4.5 and controller.kd at 0.8, then consider a small base_speed
      step (for example 1.35) only if s-bend completion_time stays near 2.8 s with
      no line loss.

      - If oval steering_oscillation rises above about 0.35 or any oval run goes off
      track, set controller.kp back to 4.0 and keep controller.kd at 0.8, since iteration
      3 showed kp 5 with lower damping overshoots.

      - If s-bend steering_oscillation stays above 0.4 with kd 0.8, raise controller.kd
      to about 1.0 before changing kp, since iteration 4 showed s-bend oscillation
      was the highest measured while kd was 0.6.


      - [Open this output](iteration-5/entityR1/versions/00f3f59536574924bab6e91d2448029d/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/8874026c5b884a32bcdd6d544e169766/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-5438f6c876243359/payload.json)'
