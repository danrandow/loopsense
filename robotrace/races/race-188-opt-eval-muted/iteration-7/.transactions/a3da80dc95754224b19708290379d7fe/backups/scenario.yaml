map:
  id: race-188-opt-eval-muted
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: kp 5.0 / kd 1.0 tune-up
    notes: 'Keeps the iteration-6 geometry and raises kp 4.8 to 5.0 and kd 0.9 to
      1.0 to add steering authority on slalom while damping it. Rests on the steady
      gains in iterations 4 to 6, where oval and s-bend stayed at 100% completion
      and slalom progress rose.


      ### Rationale


      Evidence: iteration 6 is the best design so far (score 696.6). Oval finishes
      20 of 20 (mean 1.98 s, max_error 0.0095). S-bend finishes 20 of 20 (mean 2.42
      s, steering_oscillation 0.33). Slalom still never finishes (0 of 20, progress
      0.47, 1.25 line-loss events per run), so it is the main source of lost score.
      Across iterations 4 to 6, each step up in kp with a matching step up in kd (4.0/0.6,
      4.5/0.8, 4.8/0.9) cut max_error and line losses on s-bend and raised slalom
      progress, with no oval regression. The diagnosis is that slalom is limited by
      slow response to rapid direction changes, not by jitter. Oval steering_oscillation
      (0.23) and s-bend (0.33) still have headroom.


      Changes, controller only, geometry unchanged so the effect is isolated: (1)
      kp 4.8 to 5.0 for more steering authority on fast alternating bends. (2) kd
      0.9 to 1.0 to keep the extra proportional gain damped; iteration 2 showed kp
      5 with kd 0.3 overshoots, so the damping ratio should be kept at or above the
      level that worked at kp 4.8. (3) ki 0.5, base_speed 1.3 and line_loss last_direction
      are unchanged. ki is removing the motor-mismatch bias, and base_speed 1.3 keeps
      s-bend inside the 3 s limit (about 2.4 s now).


      Expected result: slalom progress rises above 0.5 and the first slalom completions
      appear. Oval stays at 20 of 20 and s-bend completions hold at 100%. Hypotheses:
      (a) kd 1.0 keeps oval and s-bend steering_oscillation at or below about 0.35
      despite the higher kp, so kd is damping rather than adding lag. (b) If oval
      completion drops or oval steering_oscillation exceeds 0.35, kp 5.0 is too aggressive
      and should return to 4.8. Sensor coverage (line losses on slalom) is the next
      suspect if progress stalls near 0.5; a wider sensor footprint would be the next
      geometry test. Measurements wanted: completion and completion_time by track,
      progress and max_error on slalom (where the robot leaves the line), line_loss_events
      and rms_error (effect of kp), and steering_oscillation (effect of kd).


      - [Open this output](iteration-7/entity0/versions/30695971ccb741ff8bc5f98353694e6f/payload.json)

      - Based on: [entityR2A](iteration-7/entityR2A/versions/carried-b2fb347e0958b87a/payload.json)'
  - id: entityR1
    label: Approve kp 4.8, kd 0.9
    notes: 'Approves a small controller step (kp 4.5 to 4.8, kd 0.8 to 0.9) on top
      of the best design so far (score 606.2). Oval oscillation of 0.243 at kp 4.5
      in iteration 5 leaves room for the change, and racing it gives per-track telemetry
      for the next revision.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated. The candidate
      is the iteration-5 design with two controller changes: kp 4.5 to 4.8 and kd
      0.8 to 0.9. Geometry, ki 0.5, base_speed 1.3, sensor weights and line_loss are
      unchanged, so any difference in result comes from the gain change. The evidence
      is iteration 5 (score 606.2, best so far). Oval finished 20 of 20 (mean 1.98
      s, steering_oscillation 0.243, well under the 0.35 caution level). S-bend finished
      11 of 20 (progress 0.96, steering_oscillation 0.378). Slalom never finished
      (progress 0.44, 1.15 line-loss events per run), and it is the largest source
      of lost score. The step from kp 4.0/kd 0.6 to 4.5/0.8 in iteration 5 improved
      progress without breaking oval, so a further small step is a reasonable test.
      Note that the rationale''s claim that kp 5 with kd 0.3 overshot refers to iteration
      2, which had ki 0.02 and a different bias. It is a weaker comparison than the
      rationale implies, so treat kd as the main damping lever and watch steering_oscillation
      directly. Interpreting the next race: if oval stays at 20 of 20 with steering_oscillation
      below about 0.35, and s-bend or slalom progress rises above the iteration-5
      values (0.96 and 0.44), keep kp 4.8 and kd 0.9. If oval completions drop, any
      oval run goes off track, or oval steering_oscillation exceeds about 0.35, return
      kp to 4.5 with kd 0.9. If s-bend steering_oscillation stays above 0.4 with kd
      0.9, raise kd toward 1.0 before changing kp again. If slalom progress is flat
      but its max_error is near 0.06 m, slow response is still the limit, so the next
      step is a modest base_speed reduction only if completion_time has slack, not
      more kp.


      ### Requested changes


      - If oval stays at 20 of 20 with steering_oscillation below about 0.35 and slalom
      or s-bend progress rises above iteration-5 values (0.44 and 0.96), keep controller.kp
      at 4.8 and controller.kd at 0.9, since iteration 5 showed oval oscillation of
      0.243 at kp 4.5.

      - If any oval run goes off track or oval steering_oscillation exceeds about
      0.35, set controller.kp back to 4.5 and keep controller.kd at 0.9, since the
      kp increase is then too aggressive for the oval bends.

      - If s-bend steering_oscillation stays above 0.4 with kd 0.9, raise controller.kd
      to about 1.0 before changing kp, since iteration 4 showed the highest s-bend
      oscillation (0.41) at kd 0.6.


      - [Open this output](iteration-6/entityR1/versions/36bb26e55bfd413fbc7632e77327baea/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/22c7140769b046b58ce997845b58824e/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-08503eb5bd192c86/payload.json)'
