overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor racer
    notes: 'Conservative first candidate: five sensors 1 cm apart at 0.04 m ahead
      of the axle, weights proportional to lateral offset, base_speed 1.6, kp 3, kd
      0.15. No race data yet, so the values are reasoned from the contract rather
      than measured.


      ### Rationale


      First candidate, no race data yet, so this is a conservative baseline. Geometry:
      five sensors spread across the 25 mm tape (x = -0.02 to +0.02 m, 0.01 m apart),
      placed 0.04 m ahead of the axle so the line is read before the wheels reach
      it. Sensor size 0.008 m keeps the footprint well inside the tape width. Chassis:
      0.12 m wheel track, 0.03 m wheel radius, 0.12 m body width (widens the off-track
      limit to max(0.06, 0.0125 + 0.03) = 0.06 m), 0.16 m body length, 0.8 kg mass.
      Controller: sensor weights [-2, -1, 0, 1, 2] equal the sensor''s lateral offset
      in cm, so the signal is roughly the line offset in cm and stays within +/-2.
      Positive weights go with left-side sensors, so a line on the left gives a positive
      signal and a left steer, as the contract requires. base_speed 1.6 targets the
      ~1.5 m/s average needed to finish in 3 s while staying below full PWM for some
      headroom in the bends. kp 3 gives a 1 cm offset about 1050 PWM of differential,
      a firm correction. ki 0.02 is small to avoid integral windup on the bends. kd
      0.15 damps the oscillation expected from a high kp. line_loss ''last_direction''
      keeps the robot turning toward the side it last saw the line. Expected result:
      completion on the oval and s-bend, with some weaving on the slalom. I expect
      the main risks to be oscillation at kp 3 and running out of time if the speed
      is too low. Next measurements to check these: steering_oscillation and max_error
      (to judge kp/kd), completion_time and progress (to judge base_speed), and line_loss_events
      (to judge sensor coverage on the tighter bends).


      - [Open this output](iteration-0/entity0/versions/f370fba39c404ae79ca2040bb825bcab/payload.json)'
  - id: entityR1
    label: 'Baseline review: approve'
    notes: 'Approved as a valid, unobviously broken baseline; no race data exists
      yet, so the decision rests on contract validity and the candidate''s contents.
      Feedback sets contingent changes to kp, kd, base_speed and sensor span depending
      on what the first race shows.


      ### Feedback


      No race has run yet, so there is no earlier telemetry to cite. Judged on its
      contents, the candidate is valid: all sensor positions, the sensor size, the
      wheel, body and mass values, and the controller fields fall inside the contract
      limits, and the five sensor weights are within [-2, 2]. The outer sensors at
      x = ±0.02 m sit near the tape edge (half-width 0.0125 m), so they may read nothing
      on tight bends, which makes line_loss_events the next thing to check. Kp 3 with
      a 350 PWM-per-unit turn gain is a firm but not extreme correction. Race it as
      the baseline and set the next revision from what the telemetry shows. If steering_oscillation
      or max_error is high, lower kp (for example to 2.0) or raise kd (for example
      to 0.3) before changing anything else. If completion_time is near or above 3.0
      s with progress short of 1, raise base_speed (for example to 1.8) and watch
      max_error. If line_loss_events is above zero on the s-bend or slalom, widen
      the sensor span (for example x = ±0.03 m) or make the outer sensor weights larger
      in magnitude before changing the gains.


      ### Requested changes


      - No earlier race exists, so this is a contingent plan. If steering_oscillation
      or max_error is high on the race, reduce kp to about 2.0 or raise kd to about
      0.3.

      - If completion is 0 or completion_time is near 3.0 s with progress below 1,
      raise base_speed to about 1.8 and recheck max_error and line_loss_events.

      - If line_loss_events is above 0 on the s-bend or slalom, widen the outer sensors
      to x = ±0.03 m or enlarge the outer weights, keeping sensor_weights within [-2,
      2].


      - [Open this output](iteration-0/entityR1/versions/8e8b14fcb0e0481baccf9ea05815bb25/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/f370fba39c404ae79ca2040bb825bcab/payload.json)'
