map:
  id: race-188-opt-eval-muted
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Wider sensor array (16mm)
    notes: 'Reverts the controller to the best-scoring iteration 6 gains (kp 4.8,
      kd 0.9), since kp 5 cut s-bend completions. Widens the sensor array to +/-4
      cm with 16 mm footprints to test whether slalom line losses (about 1.25 per
      run) come from sensor coverage.


      ### Rationale


      Evidence: iteration 6 (kp 4.8, kd 0.9, ki 0.5, base 1.3, seven 12 mm sensors
      at +/-3 cm) is the best design so far at 696.6. Oval finishes 20/20 and s-bend
      finishes 20/20. Slalom finishes 0/20, with progress 0.47, 1.25 line-loss events
      per run and off-track in every run. Slalom is now the main source of lost score.
      Iteration 7 raised kp to 5.0 and kd to 1.0. Slalom progress rose only slightly
      (0.47 to 0.53), s-bend finishes fell from 20/20 to 17/20, and the total score
      fell to 675. So kp 5 is past the useful range, and the controller is near its
      limit.


      Diagnosis: slalom loses the line about 1.25 times per run. That points to sensor
      coverage, not gain. With 12 mm footprints spanning +/-3 cm, the line can leave
      the array on fast direction changes, so the signal drops below the 0.05 threshold
      and the robot runs on the last-direction search. Widening the array should keep
      tape under at least one sensor during larger lateral excursions.


      Changes: (1) Controller reverted to iteration 6 values (kp 4.8, kd 0.9, ki 0.5,
      base_speed 1.3, last_direction), since iteration 7 showed no gain from kp 5.
      (2) Geometry: sensor footprint 12 mm to 16 mm, and the array widened from +/-3
      cm to +/-4 cm at 1.33 cm spacing. Sensor weights are unchanged, so the signal
      scale stays inside +/-2. Seven sensors and y = 0.06 are kept. The wider footprint
      ensures the outer sensors see the tape at larger offsets.


      Expected result: line_loss_events on slalom fall from about 1.25 toward 0.5
      or lower, slalom progress rises above 0.6, and the first slalom completions
      appear. Oval and s-bend should hold near their iteration 6 results. Risk: the
      larger footprint blurs the centroid on tight bends, which may raise max_error
      on s-bend.


      Hypotheses: (a) line losses on slalom come from the array being too narrow,
      so wider coverage cuts line_loss_events and raises slalom progress. (b) The
      16 mm footprint does not add steering oscillation on oval (the steering_oscillation
      should stay at or below about 0.3). Measurements wanted: completion and completion_time
      by track, progress and max_error on slalom (to locate where the line is lost),
      line_loss_events and rms_error (to test coverage), and steering_oscillation
      (to check whether the blur adds jitter).


      - [Open this output](iteration-8/entity0/versions/fa642eede9174c0c8c44ec3f6691f67d/payload.json)

      - Based on: [entityR2A](iteration-8/entityR2A/versions/carried-c8e0442fdbf6c157/payload.json)'
  - id: entityR1
    label: Wider 16mm sensor array
    notes: 'Approved: controller is the iteration-6 best (696.6) with the sensor footprint
      widened to 16 mm and the array to ±4 cm, a clean one-variable test of the slalom
      line-loss hypothesis. The feedback flags the roughly 25 percent drop in effective
      signal slope at the wider spacing and sets kp fallbacks for the next race.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated. The controller
      is the iteration-6 set (kp 4.8, kd 0.9, ki 0.5, base_speed 1.3, last_direction),
      which scored 696.6, the best so far. The one change is geometry: sensor footprint
      12 mm to 16 mm and the array widened from ±3 cm to ±4 cm at 1.33 cm spacing,
      with y = 0.06 and seven sensors kept. The limits are respected: sensor x values
      lie within ±0.08, the footprint is one of the allowed sizes, and the weights
      stay within ±2. The evidence is iteration 6: oval 20/20 (max_error 0.0095, steering_oscillation
      0.232), s-bend 20/20 (progress 0.997, line_loss_events 0.25), and slalom 0/20
      (progress 0.47, 1.25 line-loss events per run, off track every run). Slalom
      is the main lost score, so the coverage hypothesis is worth one clean test.
      The change is isolated to geometry, so any result can be read against iteration
      6.


      One point to watch: the weights were kept at ±2 at the outer sensors, but the
      outer sensors now sit at ±4 cm. The signal slope per centimetre of line offset
      falls from about 0.67 per cm (±3 cm) to about 0.50 per cm (±4 cm). That is roughly
      a 25 percent drop in effective steering gain at the same kp, which could cost
      some oval and s-bend margin even if slalom coverage improves. The weights cannot
      be scaled up without leaving the ±2 limit, so any compensation has to come through
      kp.


      How to read the next race: if slalom line_loss_events fall clearly (below about
      0.8) and oval and s-bend hold, keep this geometry and consider a modest kp increase
      (for example 5.0) to recover effective gain. If slalom progress rises but oval
      or s-bend max_error grows or completions drop, the lower effective gain is the
      cause, so restore it with kp near 5.5 before changing geometry again. If slalom
      line losses stay at about 1.25 per run, coverage is not the limit and the 16
      mm change should be reverted to 12 mm.


      ### Requested changes


      - If slalom line_loss_events fall clearly below about 0.8 per run and oval and
      s-bend hold at 20/20 and 20/20, keep geometry at 16 mm and ±4 cm, and try controller.kp
      5.0 (kd 1.0) to recover the effective steering gain lost to the wider spacing,
      since the signal slope fell about 25 percent.

      - If oval or s-bend completions drop or max_error rises while the sensor span
      is widened, set controller.kp to about 5.5 with kd 1.0 to restore effective
      gain at the new spacing, before reverting geometry, since the drop comes from
      the lower signal slope rather than from coverage.

      - If slalom line_loss_events stay near 1.25 per run, revert geometry.sensor_size
      to 0.012 and sensor_positions to ±3 cm, keeping iteration-6 controller values,
      since coverage is then not the limit and the iteration-6 design remains the
      best known baseline.


      - [Open this output](iteration-8/entityR1/versions/cf6cd7c10c644f2abbee8e29487fe95e/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/fa642eede9174c0c8c44ec3f6691f67d/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-c8e0442fdbf6c157/payload.json)'
