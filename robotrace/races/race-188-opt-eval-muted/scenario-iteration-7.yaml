map:
  id: race-188-opt-eval-muted
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: kp 5.0 / kd 1.0 tune-up
    notes: 'Keeps the iteration-6 geometry and raises kp 4.8 to 5.0 and kd 0.9 to
      1.0 to add steering authority on slalom while damping it. Rests on the steady
      gains in iterations 4 to 6, where oval and s-bend stayed at 100% completion
      and slalom progress rose.


      ### Rationale


      Evidence: iteration 6 is the best design so far (score 696.6). Oval finishes
      20 of 20 (mean 1.98 s, max_error 0.0095). S-bend finishes 20 of 20 (mean 2.42
      s, steering_oscillation 0.33). Slalom still never finishes (0 of 20, progress
      0.47, 1.25 line-loss events per run), so it is the main source of lost score.
      Across iterations 4 to 6, each step up in kp with a matching step up in kd (4.0/0.6,
      4.5/0.8, 4.8/0.9) cut max_error and line losses on s-bend and raised slalom
      progress, with no oval regression. The diagnosis is that slalom is limited by
      slow response to rapid direction changes, not by jitter. Oval steering_oscillation
      (0.23) and s-bend (0.33) still have headroom.


      Changes, controller only, geometry unchanged so the effect is isolated: (1)
      kp 4.8 to 5.0 for more steering authority on fast alternating bends. (2) kd
      0.9 to 1.0 to keep the extra proportional gain damped; iteration 2 showed kp
      5 with kd 0.3 overshoots, so the damping ratio should be kept at or above the
      level that worked at kp 4.8. (3) ki 0.5, base_speed 1.3 and line_loss last_direction
      are unchanged. ki is removing the motor-mismatch bias, and base_speed 1.3 keeps
      s-bend inside the 3 s limit (about 2.4 s now).


      Expected result: slalom progress rises above 0.5 and the first slalom completions
      appear. Oval stays at 20 of 20 and s-bend completions hold at 100%. Hypotheses:
      (a) kd 1.0 keeps oval and s-bend steering_oscillation at or below about 0.35
      despite the higher kp, so kd is damping rather than adding lag. (b) If oval
      completion drops or oval steering_oscillation exceeds 0.35, kp 5.0 is too aggressive
      and should return to 4.8. Sensor coverage (line losses on slalom) is the next
      suspect if progress stalls near 0.5; a wider sensor footprint would be the next
      geometry test. Measurements wanted: completion and completion_time by track,
      progress and max_error on slalom (where the robot leaves the line), line_loss_events
      and rms_error (effect of kp), and steering_oscillation (effect of kd).


      - [Open this output](iteration-7/entity0/versions/30695971ccb741ff8bc5f98353694e6f/payload.json)

      - Based on: [entityR2A](iteration-7/entityR2A/versions/carried-b2fb347e0958b87a/payload.json)'
  - id: entityR1
    label: Approve kp 5.0 / kd 1.0
    notes: 'Approved the kp 4.8 to 5.0 and kd 0.9 to 1.0 step, a small increment on
      the best raced design (iteration 6, score 696.6) with oval and s-bend both at
      20 of 20. The feedback gives keep, back-off and geometry branches for the next
      race, since the approve decision is final for this iteration.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      candidate is the iteration-6 design (score 696.6, best so far) with two controller
      steps: kp 4.8 to 5.0 and kd 0.9 to 1.0. Geometry, ki 0.5, base_speed 1.3, sensor
      weights and line_loss last_direction are unchanged, so any difference comes
      from the gains. The evidence is iteration 6: oval finished 20 of 20 (steering_oscillation
      0.232, max_error 0.0095), s-bend finished 20 of 20 (mean 2.42 s, steering_oscillation
      0.334), and slalom never finished (progress 0.47, 1.25 line-loss events per
      run). Slalom is the main lost score. Across iterations 4 to 6, each paired rise
      in kp and kd cut s-bend max_error and line losses without an oval regression,
      so a further small step is a reasonable test. Two cautions. First, the claim
      that kp 5 with kd 0.3 overshoots comes from iteration 2, which had ki 0.02 and
      a different bias, so it is weak support for the damping ratio here; watch steering_oscillation
      directly. Second, kp 5.0 is the highest gain tested, and oval has the least
      margin on oscillation headroom (0.232 against a caution level near 0.35). Interpreting
      the next race: if oval stays at 20 of 20 with steering_oscillation at or below
      about 0.35, and slalom progress rises above 0.47 (or any slalom completion appears),
      keep kp 5.0 and kd 1.0 and consider a small base_speed step only if s-bend completion_time
      stays well under 2.8 s. If any oval run goes off track or oval steering_oscillation
      exceeds about 0.35, return kp to 4.8 and keep kd 1.0. If slalom progress is
      flat near 0.47 with line_loss_events still above 1 per run, the limit is sensor
      coverage rather than gain, so the next geometry test should widen the outer
      sensors (for example to x = ±0.04 m with weights rescaled to stay within [-2,
      2]).


      ### Requested changes


      - If oval stays at 20 of 20 with steering_oscillation at or below about 0.35
      and slalom progress rises above 0.47, keep controller.kp at 5.0 and controller.kd
      at 1.0, since iteration 6 showed each paired gain step cut max_error and line
      losses without oval regression.

      - If any oval run goes off track or oval steering_oscillation exceeds about
      0.35, set controller.kp back to 4.8 and keep controller.kd at 1.0, because the
      oval bends are the first place extra steering gain would show up as oscillation.

      - If slalom progress stays near 0.47 with line_loss_events still above 1 per
      run, leave the gains alone and test geometry.sensor_positions widened to x =
      ±0.04 m (rescale sensor_weights to stay within [-2, 2]), since iteration 6 losses
      point to sensor coverage on the tight alternating bends.


      - [Open this output](iteration-7/entityR1/versions/a3da80dc95754224b19708290379d7fe/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/30695971ccb741ff8bc5f98353694e6f/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-b2fb347e0958b87a/payload.json)'
