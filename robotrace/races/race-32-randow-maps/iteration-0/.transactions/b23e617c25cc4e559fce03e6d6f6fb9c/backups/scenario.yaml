      ### Rationale


      Starting fresh with no prior integration feedback or race data, I propose a
      balanced, conservative geometry to maximize line sensing and stable control.
      I choose 5 sensors spaced evenly across the front, covering left to right, to
      detect the tape line effectively. Sensor size is medium (0.012 m) to balance
      resolution and coverage. The wheel track is set moderately wide (0.14 m) for
      stability, with a medium wheel radius (0.035 m) to balance speed and torque.
      The body is compact but wide enough (0.14 m width, 0.18 m length) to allow some
      off-track tolerance without excessive drag. Mass is set at 1.0 kg for stability
      without excessive inertia. The intent is to provide the integrator a stable,
      well-sensed platform to develop a controller that can follow the line reliably
      and quickly. I expect this geometry to yield good line detection and stable
      handling, enabling the integrator to tune a controller for fast, accurate line
      following.


