  - id: entity0
    label: 'Final: restore best (it7)'
    notes: 'Reproduces iteration 7, the best raced design (933.8), because later single-variable
      changes (wheel track 0.10, kd 3.4, base 1.0) all scored lower. Chosen for stability
      at the one remaining race; the rationale lists the next-step hypotheses.


      ### Rationale


      Final iteration, so this candidate races once for the score that counts most,
      and the goal is robustness on an unseen track of a different shape. The best
      raced design is iteration 7 (score 933.8). Iteration 9 (932.0) and iteration
      8 (930.8) are within noise of it. Iteration 10 dropped to 911.8, mainly from
      the slalom (one off-track exit, progress 0.956), after wheel_track 0.10 m and
      kd 3.4 were combined. Iteration 8 showed that base_speed 1.0 added slalom instability
      without a clear time gain. Iteration 5 showed that kp 5.0 overcorrects at reversals.
      The oval and s-bend are saturated at about 950 and 945, so the remaining gap
      is slalom reliability at reversals. Iteration 7 has the most stable slalom at
      its wheel track (0.11 m, kd 3.0, base 0.95): 19/20 finished with 0 off-track
      exits and 0 line-loss events, and the single failure was a timeout, not a tape
      loss. I therefore reproduce iteration 7 exactly, with no untested changes, because
      the one-race budget cannot verify a new variant. The design is seven sensors
      at x = -0.04 to +0.04 m (0.0133 m pitch), weights 50*x, kp 4.5, ki 0, kd 3.0,
      base_speed 0.95, mass 0.6 kg, body 0.15 x 0.12 m, wheel track 0.11 m, radius
      0.03 m, sensor size 0.012 m, and line_loss last_direction. Expected result:
      about 933 on the development tracks, with the oval and s-bend finishing 20/20
      and the slalom finishing about 19/20. Hypotheses for the next (held-out) race:
      (1) if the unseen track''s bends are sharper than the slalom, the limit is steering
      authority, and a narrower track or higher kp would help; (2) if completion_time
      is the main loss, base_speed 0.975 is the lever, at some risk of tape loss;
      (3) if off-track exits appear, kd should rise before speed changes. Measurements
      requested: all metrics, with focus on completion, completion_time and off-track
      versus timeout counts.


