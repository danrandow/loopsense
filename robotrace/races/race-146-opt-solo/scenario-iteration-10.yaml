  - id: entity0
    label: Narrow track, kd 3.4
    notes: 'Keeps the iteration 9 geometry (wheel_track 0.10 m), which cut oval time
      from 2.37 s to 2.15 s, and raises kd from 3.0 to 3.4 to damp the slalom. Iteration
      9 still had one slalom off-track exit (minimum 218), and the rationale''s hypothesis
      (3) calls for more kd before more speed.


      ### Rationale


      Evidence from iteration 9 (score 932.0, close to the best of 933.8 at iteration
      7). Oval finished 20/20 with mean time 2.15 s (down from 2.37 s), rms 0.0054
      and 0.15 line-loss events. The narrower 0.10 m track gave the oval its time
      gain, and the s-bend stayed at 20/20 with rms 0.012 and 2.38 s. The slalom is
      the weak point: 19/20 finished, one off-track exit with a minimum score of 218,
      mean progress 0.973 (down from 0.995), steering_oscillation 0.29 (up from 0.28)
      and control_effort 14.6. The narrower track gives more steering authority, but
      it appears to make the slalom reversals slightly less stable. Iteration 8 showed
      that raising base_speed to 1.0 adds slalom instability without a clear time
      gain, so speed should stay at 0.95. I am keeping wheel_track 0.10, the seven-sensor
      array at x = -0.04..+0.04 m, the weights 50*x, kp 4.5, ki 0, mass 0.6, body
      0.15 x 0.12 m, radius 0.03 m and line_loss last_direction. The one change is
      kd 3.0 -> 3.4, which follows hypothesis (3) from iteration 9: add damping before
      touching speed. Expected result: slalom 20/20 or near it, with off-track exits
      reduced and steering_oscillation at or below about 0.27. Oval and s-bend should
      keep their times near 2.15 s and 2.4 s with rms under 0.015. Hypotheses to check
      next: (1) if oval or s-bend completion_time rises above about 2.5 s, or steering_oscillation
      on the oval rises above 0.25, kd 3.4 is too heavy and should return to 3.2;
      (2) if the slalom still times out with progress near 0.99, speed is the limit
      and base_speed should go to 0.975; (3) if an off-track exit remains on the slalom,
      check whether it happens at the same reversal, which would point to sensor edge
      coverage at x = +/-0.04 m. Measurements requested: all metrics per track, with
      focus on slalom finish count, timeouts versus off-track exits, line_loss_events,
      steering_oscillation, and completion_time on the oval and s-bend.


