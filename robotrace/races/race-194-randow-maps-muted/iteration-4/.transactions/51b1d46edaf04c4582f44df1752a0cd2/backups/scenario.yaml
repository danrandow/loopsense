map:
  id: race-194-randow-maps-muted
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Wider track 0.14 m test
    notes: 'Iteration 1 layout kept (best score 482.7) with only wheel_track changed
      from 0.12 to 0.14 m. Iteration 3 showed a 0.10 m track lowered the score to
      357, so the trend suggests a wider track damps bend overshoot.


      ### Rationale


      Race evidence so far: iteration 1 (7 sensors at 0.02 m spacing spanning +/-0.06
      m, 16 mm footprints, y=0.06 m, mass 0.6 kg, wheel_track 0.12 m) scored 482.7,
      the best so far. Oval finished 20/20. Every bend failure is an off-track end
      with max_error at or above 0.06 m, while rms_error stays small (0.023 to 0.030
      m), so the problem is occasional large excursions on bends, not steady tracking
      error. Iteration 3 changed only wheel_track to 0.10 m and scored 357.3, a clear
      drop: s-bend completions fell from 5/20 to 1/20 and oval finishes from 20/20
      to 14/20, with max_error reaching the limit on more runs. Iteration 2 also used
      0.10 m and scored lower (411.7). So a narrower track, which gives more yaw per
      PWM unit, makes the robot more aggressive and it overshoots on bends. That points
      the other way: a wider track should reduce yaw gain per unit of steering command,
      so bend excursions should be damped. Body width has no effect on the off-track
      limit (it stays 0.06 m across the allowed range), so drivetrain and sensing
      remain the only levers. I therefore keep the iteration 1 layout and change one
      variable: wheel_track from 0.12 to 0.14 m. This is a clean test of the monotonic
      trend (0.10 hurt, so 0.14 should help if the trend holds). Expected result:
      fewer off-track ends on the s-bend and slalom, max_error below 0.06 m on more
      runs, and a score at or above 482.7. Main risk: a wider track adds yaw inertia
      relative to turn authority, so the robot may be too slow to turn on the sharpest
      slalom bends and line loss may rise there.


      - [Open this output](iteration-4/entity0/versions/64f0b52d7fff442c9186c9c1e0e05b44/payload.json)

      - Based on: [entityR2A](iteration-4/entityR2A/versions/carried-6da42efdaabcbaa9/payload.json)'
  - id: entity1
    label: Wider track 0.14 m
    notes: 'Iteration 1 layout with wheel_track alone raised from 0.12 to 0.14 m and
      kp kept at 1.6. Tests the trend from iteration 3, where a 0.10 m track dropped
      the score to 357.3.


      ### Rationale


      Evidence: iteration 1 (0.12 m track, score 482.7) is the best design. Its oval
      finished 20/20, its s-bend 5/20 and its slalom 0/20, and every failure was an
      off-track end with max_error of 0.060 to 0.064 m while rms_error stayed at 0.023
      to 0.030 m. Iteration 3 changed only wheel_track to 0.10 m and fell to 357.3
      (s-bend 1/20, oval 14/20). Iteration 2 also used 0.10 m and scored 411.7, though
      it changed other fields too. Across the three clean or near-clean points, a
      narrower track has moved the score down, so the trend suggests the opposite
      direction should help.


      Decision: keep the iteration 1 layout (7 sensors at 0.02 m spacing, span +/-0.06
      m, 16 mm footprints, y = 0.06 m, mass 0.6 kg, radius 0.03 m, body 0.16 x 0.12
      m) and change only wheel_track from 0.12 to 0.14 m. For the controller, I keep
      kp at 1.6 and every other controller field as in iteration 1. I do not scale
      kp with track width, because iterations 2 and 3 scaled kp down for narrower
      tracks and still lost score, so scaling is not the cleaner test. Turn rate per
      unit of turn falls by about 0.86x on the wider track, which acts as a damping
      effect on bend overshoot.


      Expected result (hypothesis, not measured): fewer off-track ends on the s-bend
      and slalom, max_error below 0.06 m on more runs, and a score at or above 482.7.
      Main risk: the wider track slows the sharpest slalom turn, so line-loss events
      may rise there.


      - [Open this output](iteration-4/entity1/versions/0cdd4c0c0b784e82b1d36256ce67ce49/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/64f0b52d7fff442c9186c9c1e0e05b44/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-6da42efdaabcbaa9/payload.json)'
  - id: entityR1
    label: Track 0.14 m, next steps
    notes: 'Feedback written before the race. It points to the 0.10 m result (357.3)
      as evidence that narrower tracks hurt, and gives three conditional changes:
      a further widening to 0.16 m, a 12 mm footprint if the slalom loses the line,
      and a narrower span if the score stalls.


      ### Feedback


      Written before this candidate has raced, so no result is stated for it. Iteration
      1 (0.12 m track, score 482.7) is the best evidence: oval 20/20, s-bend 5/20,
      slalom 0/20, with failures all off-track at max_error 0.060 to 0.064 m and rms_error
      0.023 to 0.030 m. Iteration 3 (0.10 m track only, score 357.3) fell to s-bend
      1/20 and oval 14/20, and iteration 2 (0.10 m plus span, mass and lead changes,
      score 411.7) also fell. So the limit is bend excursion, and narrowing the track
      has moved it the wrong way. This package widens the track to 0.14 m with everything
      else as in iteration 1, including kp 1.6, so the track effect is isolated.


      Answers to your integration questions, from evidence so far: (1) Signal linearity
      and sensor saturation cannot be separated yet, because the 0.06 m span was never
      changed alone. (2) Oscillation at 0.10 m was 0.291 to 0.299 on the oval, close
      to the 0.12 m value, so the narrower track did not add much jitter. (3) Control
      effort on the s-bend was 5.9 at 0.12 m and 4.98 at 0.10 m, which suggests the
      narrower track demanded less steering effort per bend. (4) Peak max_error is
      on bends, with line loss at the same bends (slalom 1.0 event per run on both
      tracks), so the peak location is not yet resolved. (5) Signal weights: the outer
      sensors carry the largest weights, and no evidence yet shows they are over-driving
      the signal.


      Next race: if s-bend completions rise above 5/20 and max_error stays under 0.06
      m on more runs, keep wheel_track at 0.14 m and try 0.16 m, which tests whether
      the trend continues. If the score falls below 482.7 with slalom line_loss_events
      rising, the wider track is too slow for the slalom, so return to 0.12 m and
      move to a sensing change. If the oval steering_oscillation falls and the s-bend
      does not improve, the track is not the limit, so keep 0.12 m and change the
      sensor geometry alone.


      ### Requested changes


      - If s-bend completion rises above 5/20 and max_error falls below 0.06 m on
      more runs: try wheel_track 0.16 m, keeping all other fields the same. Evidence:
      0.10 m (iteration 3) gave s-bend 1/20 and 0.12 m (iteration 1) gave 5/20, so
      the trend is monotonic over that range.

      - If slalom line_loss_events rise above 1.0 per run while the s-bend does not
      improve: return wheel_track to 0.12 m and change sensor_size from 0.016 to 0.012
      m only. Evidence: iteration 1 slalom was 1.0 line-loss event per run with max_error
      0.064 m, and the 12 mm footprint has not yet been tested with the 0.12 m track
      and 7-sensor span.

      - If the wider track is clean on the s-bend but the score still sits near 482.7,
      try the sensor span at 0.10 m (x = -0.05, -0.0333, -0.0167, 0, 0.0167, 0.0333,
      0.05) with wheel_track 0.14 m. Evidence: iteration 2 widened the span to 0.15
      m together with a narrower track and mass change, and its s-bend fell to 0/20,
      so a narrower span is the less risky direction to test.


      - [Open this output](iteration-4/entityR1/versions/0cdd4c0c0b784e82b1d36256ce67ce49/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/64f0b52d7fff442c9186c9c1e0e05b44/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-6da42efdaabcbaa9/payload.json)'
