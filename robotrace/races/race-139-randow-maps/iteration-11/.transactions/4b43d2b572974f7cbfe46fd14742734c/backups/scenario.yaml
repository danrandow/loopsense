overrides:
  entities:
  - id: entity0
    label: Widen spread to ±0.08 m
    notes: 'Returns the lead to y=0.07 m (best score, 56.40) and widens the sensor
      spread from ±0.065 to ±0.08 m to remove the slalom line loss that persisted.
      Iteration 9 showed y=0.067 m lost s-bend progress, and spread widening already
      cut s-bend line loss from 1 to 0.05 per run.


      ### Rationale


      Iteration 9 (y=0.067 m, ±0.065 m, 16 mm, 0.03 m speed) scored 51.11, below iteration
      8 (y=0.07 m, same spread) at 56.40. The 3 mm lead cut was costly: s-bend line
      loss rose from 0.05 to 0.5 per run and s-bend progress fell from 0.1825 to 0.1474.
      Slalom still lost the line once per run, and its max_error worsened from 0.0604
      to 0.0647 m. So y=0.067 m is worse on both bends, and I return the row to y=0.07
      m, the best-scoring lead. Iteration 8''s remaining fault is slalom: one line
      loss per run with max_error 0.0604 m and steering oscillation 0.131. Slalom
      oscillation has stayed at 0.13 to 0.14 at every row tested, so the row is not
      its cause. The wider spread did cut s-bend line loss from 1 to 0.05 per run
      (iteration 3 to 8), which shows that spread is the lever that keeps the tape
      in view on bends. Iteration 0 showed the line drops out of view at about 0.045
      to 0.05 m offset with a narrow spread. The slalom loss at ±0.065 m is most likely
      the same effect at larger offsets. I therefore widen the spread to ±0.08 m (the
      contract maximum), keep the proven y=0.07 m lead, and keep 16 mm footprints,
      0.03 m speed, 0.09 m track and 0.5 kg mass unchanged. Expected result: slalom
      line_loss_events near 0, slalom max_error below 0.06 m, s-bend progress around
      0.18, and a score above 56.4. Risk: the wider spread lowers signal resolution
      near centre, which could add jitter or raise s-bend oscillation (0.127 in iteration
      8).


      - [Open this output](iteration-10/entity0/versions/411351c06b2a4ffebf27a3e99b2fa181/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-b9f5f655f6b6814b/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-993f829830be104b/payload.json)'
  - id: entity1
    label: Wider spread ±0.08 m
    notes: 'Keeps the proven y=0.07 m lead and 0.03 m speed from iterations 8 and
      9, and widens the spread to the contract maximum of ±0.08 m with 16 mm footprints.
      The controller is unchanged from iteration 8 so that only the spread differs.


      ### Rationale


      Iteration 8 (y=0.07 m, ±0.065 m, 16 mm, 0.03 m radius, 56.40) is the best raced
      design. Widening the spread from ±0.05 m to ±0.065 m cut s-bend line loss from
      1 to 0.05 per run and raised s-bend progress from 0.155 to 0.1825. Slalom still
      lost the line once per run, with max_error 0.0604 m and oscillation 0.131. Iteration
      9 (y=0.067 m, same spread) scored 51.11, with s-bend line loss back to 0.5 and
      s-bend progress down to 0.147, so the row should stay at y=0.07 m. Iteration
      7 (y=0.065 m) also lost the slalom line and fell to s-bend progress 0.04, so
      the lead below 0.07 m is harmful. Speed stays at wheel_radius 0.03 m, because
      0.04 m brought line loss back in iteration 6. The Builder''s geometry for this
      iteration keeps the y=0.07 m row and widens the spread to the contract maximum
      of ±0.08 m with 16 mm footprints. I take that geometry as written. I keep the
      controller identical to iteration 8 (kp 2.0, ki 0, kd 0.10, base_speed 1.6,
      last_direction, weights [-2,-1,0,1,2]), because the slalom oscillation of 0.13
      to 0.14 has not moved across any row or spread tested. Changing kd in the same
      race would confound the spread test. The five weights still span the sensors
      and the signal stays within about ±2. Expected result: slalom line_loss_events
      near 0 and slalom max_error below 0.06 m. Risk: a ±0.08 m spread lowers resolution
      near centre, which could raise s-bend oscillation (0.127 in iteration 8) or
      rms_error.


      - [Open this output](iteration-10/entity1/versions/b1ec8736cd3143d797bb55012886eebf/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/411351c06b2a4ffebf27a3e99b2fa181/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-993f829830be104b/payload.json)'
  - id: entityR1
    label: Spread test feedback
    notes: 'Pre-race feedback that keeps the lead at y=0.07 m and sets out conditional
      next steps for slalom line loss, oscillation and footprint size, each tied to
      iterations 3 to 9.


      ### Feedback


      Written before this candidate has raced, so no outcome is claimed for it. Evidence:
      iteration 8 (y=0.07 m, ±0.065 m, 16 mm, 56.40) cut s-bend line loss to 0.05
      per run and gave s-bend progress 0.1825, but slalom still lost the line once
      per run (max_error 0.0604 m, oscillation 0.131). Iteration 9 (y=0.067 m, same
      spread, 51.11) brought s-bend line loss back to 0.5 per run, so the row should
      stay at y=0.07 m. Iteration 7 (y=0.065 m, 35.77) lost slalom line and dropped
      s-bend progress to 0.04, which supports keeping the lead near 0.07 m. Iteration
      6 (wheel_radius 0.04 m, 47.71) brought line loss back, so speed stays at 0.03
      m. Slalom steering_oscillation has stayed at 0.13 to 0.14 at every row and spread
      tested (iterations 3 to 9), so it is not driven by geometry. The oval has been
      fixed at progress 0.115 and max_error about 0.061 m since iteration 1. What
      I compensated for: I kept kp 2.0, kd 0.10 and ki 0, and kept the five weights
      [-2,-1,0,1,2], so the signal stays within about ±2 at the wider spread. Next
      race: if slalom line loss is zero and max_error is below 0.06 m, keep ±0.08
      m and y=0.07 m. If slalom line loss stays at 1 per run with the spread at ±0.08
      m, the spread is not the trigger, so keep the geometry and test kd 0.15 in the
      controller instead. If steering_oscillation rises above 0.14 on s-bend or slalom,
      return the spread to ±0.065 m.


      ### Requested changes


      - If slalom line_loss_events stays at 1 per run at ±0.08 m with y=0.07 m (iteration
      8 gave 1 per run at ±0.065 m), keep the geometry fixed and tell me, so the next
      change is the controller (kd 0.10 to 0.15), not the row or spread.

      - If steering_oscillation rises above 0.14 on s-bend or slalom with the ±0.08
      m spread (iteration 8 gave 0.127 and 0.131), return sensor x to ±0.065 m, since
      resolution near centre may be the cause.

      - If the score is at or above 56.4 with zero line loss, keep the geometry and
      test sensor_size 0.012 m at the same positions, to check whether a smaller footprint
      reduces jitter (iteration 9 showed the lead is sharply tuned, so do not move
      y).


      - [Open this output](iteration-10/entityR1/versions/b1ec8736cd3143d797bb55012886eebf/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/411351c06b2a4ffebf27a3e99b2fa181/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-993f829830be104b/payload.json)'
