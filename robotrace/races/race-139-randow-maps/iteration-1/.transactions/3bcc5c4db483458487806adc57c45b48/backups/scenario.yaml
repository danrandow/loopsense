  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Wider sensor spread
    notes: 'Widens the sensor spread from ±0.03 m to ±0.05 m and the footprint from
      12 mm to 16 mm, so the line stays detected out to about 0.07 m offset. The evidence
      is the baseline race, where all 60 trials ended off_track with one line loss
      each at about 0.05 m offset, and the off-track limit is fixed at 0.06 m by the
      contract.


      ### Rationale


      The race evidence (entityR2A, 60 trials) shows every run ending off_track, with
      max_error about 0.06 m, one line_loss_event per run, and progress of only 0.035
      to 0.11. The off-track limit is max(0.06, 0.0125 + body_width/4). With body_width
      0.12 that is 0.06 m, and widening the body to its 0.18 maximum still gives 0.06
      m, so body width cannot buy margin. The robot has to stay within 0.06 m of the
      centre line. The line-loss event means the tape left every sensor''s reach at
      about 0.05 m offset. The baseline sensors span only ±0.03 m with 12 mm footprints,
      so the tape (half-width 0.0125 m) drops out of all sensors once the robot is
      roughly 0.045 to 0.05 m off centre. The controller then falls back to a fixed
      search at 0.35 throttle and the robot drifts off. I therefore change the sensing
      geometry, not the body: widen the sensor spread to ±0.05 m (x = -0.05, -0.025,
      0, 0.025, 0.05 at y = 0.04) so the line stays visible out to about 0.07 m offset,
      and enlarge the footprint to 16 mm so each sensor''s coverage of the tape grows
      and the readings do not fall below the 0.05 total-reading threshold at the edges.
      I keep the 0.04 m forward offset, 0.12 m wheel track, 0.03 m wheel radius and
      0.7 kg mass, so the only variables that change are sensor spread and footprint.
      Expected result: line_loss_events drop toward 0, the off_track endings become
      rarer, progress rises well above 0.11 on the oval, and rms_error falls below
      the current 0.03 m. Risk: a wider spread on the tight s-bend and slalom may
      reduce signal resolution near centre, so I ask for rms_error by track to check
      this. The wheel track and controller gains stay for the Integrator to tune.


      - [Open this output](iteration-1/entity0/versions/6cfa4b70b8574f8abb44e13fffffbeb1/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-6f55ce26bfb39968/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-7dc29c06d4a3e8ae/payload.json)'
  - id: entity1
    label: Baseline runnable robot
    notes: 'Builder''s baseline geometry with a symmetric weighted-sensor controller
      (kp 2.0, kd 0.05, base speed 1.6) and last_direction line recovery. No race
      evidence exists yet, so the controller rests on contract limits alone.


      ### Rationale


      Iteration 0 has no race telemetry and no integration feedback, so the controller
      is built from the contract alone. The Builder''s baseline geometry is kept unchanged:
      five sensors at x = -0.03, -0.015, 0, 0.015, 0.03 (y = 0.04), 12 mm footprints,
      a 0.12 m wheel track, and 0.03 m wheels. The sensor weights are scaled to sensor
      x-position, [-2, -1, 0, 1, 2]. Sensors on the left (positive x) therefore push
      the signal positive, which steers left as the contract requires. With a reading-weighted
      average, the signal stays within about ±2 and tracks the line''s lateral offset.
      kp = 2.0 gives a turn of about 2 per unit of signal, or roughly 700 PWM of wheel
      differential at full offset. That is firm enough to hold a 25 mm tape on bends
      without the 0.12 m track being overdriven. ki = 0 avoids integral windup on
      the bends. kd = 0.05 adds mild damping against the fast signal change the 0.04
      m forward lead produces. base_speed = 1.6 (PWM about 3070) gives a pace that
      should reach the roughly 1.5 m/s average needed to finish in 3 s, while leaving
      headroom for turning. line_loss = last_direction keeps the robot turning toward
      the side it last saw the tape, which suits a sensor array that is narrow relative
      to the body. The observation request covers completion, progress, time, error,
      loss events, jitter and effort, so the next iteration can tune spread, forward
      offset and sensor size.


      - [Open this output](iteration-0/entity1/versions/678e3c775bed4d7a8d14f276bc3464e0/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/e486d8a85f154b5bb5f9edf313d06b83/payload.json)'
  - id: entityR1
    label: Baseline integration
    notes: 'No earlier race evidence yet, so the feedback is conditional on the first
      race. It names the controller compensations used and gives three race-triggered
      geometry changes (spread, forward offset, sensor size).


      ### Feedback


      No earlier race evidence exists yet, so nothing here is measured for this geometry.
      What I had to compensate for: the controller uses the Builder''s symmetric five-sensor
      array, scaled by sensor x so the signal stays within about ±2. This needed a
      moderate kp (2.0), no integral term, and a small kd (0.05). The 0.04 m forward
      lead gives early warning but also makes the signal change quickly on bends,
      so damping was needed. Next race: if rms_error and max_error are large with
      line_loss_events above 0 on the tightest bends, the outer sensors are probably
      seeing too little tape at ±0.03 m. Then try a narrower spread (±0.02 m) so the
      line stays covered. If steering_oscillation is high with low error, the forward
      offset or sensor spread is too aggressive for the controller, so try a smaller
      forward offset (0.02 m) or a wider wheel track for stability. If the robot completes
      with few losses and low error, keep the geometry and try a larger sensor_size
      (0.016) to see whether a wider footprint reduces noise sensitivity.


      ### Requested changes


      - If the first race shows line_loss_events above 0 or large max_error on tight
      bends: narrow sensor spread to x = ±0.02 m (keep 5 sensors, y = 0.04) so outer
      sensors keep tape in view, and report the change in rms_error.

      - If steering_oscillation is high with completion true: move sensor forward
      offset from y = 0.04 m to y = 0.02 m to reduce lead-induced signal swing, keeping
      all other fields fixed.

      - If the race completes cleanly with low rms_error: try sensor_size = 0.016
      m with the same positions to test whether a wider footprint reduces noise dominance
      at partial line coverage.


      - [Open this output](iteration-0/entityR1/versions/678e3c775bed4d7a8d14f276bc3464e0/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/e486d8a85f154b5bb5f9edf313d06b83/payload.json)'
