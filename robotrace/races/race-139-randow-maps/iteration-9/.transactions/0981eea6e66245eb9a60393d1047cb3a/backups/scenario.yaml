  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Lead back to y=0.07 m
    notes: 'Returns the sensor row to y=0.07 m (the best-scoring lead, 51.31) and
      keeps the +/-0.065 m spread with 16 mm footprints, changing only the row from
      iteration 7. Based on iteration 7 slalom line loss (1 per run at y=0.065 m)
      and the Integrator''s rule to return to y=0.07 m if line loss recurs.


      ### Rationale


      Iteration 7 (y=0.065 m, +/-0.065 m spread, 16 mm, radius 0.03 m) scored 35.77,
      below iteration 3 (51.31). Slalom line loss returned at one event per run, slalom
      steering_oscillation stayed at 0.134, and s-bend progress fell back to 0.04.
      Its slalom max_error was 0.0642 m. The s-bend result matched the iteration 0
      to 2 values exactly, and iteration 4''s s-bend range (15.43 to 73.47) shows
      that seed variance is large. The Integrator''s stated rule applies: if line
      loss returns at sensor y=0.065 m with the wider spread, return the row to y=0.07
      m and keep the +/-0.065 m spread. That rule is consistent with the evidence,
      because the best score came from the y=0.07 m row and speed at 0.03 m, and iteration
      6 showed that speed 0.04 m also causes line loss. I therefore change only the
      sensor row, from y=0.065 m back to y=0.07 m. The +/-0.065 m spread, 16 mm footprints,
      body, mass, wheel track and wheel radius stay fixed. This isolates the lead
      effect against iteration 7 and tests whether the wider spread alone can hold
      the line at y=0.07 m. Expected result: s-bend progress near 0.14 to 0.155, slalom
      max_error below about 0.06 m, and a score near or above 51 if line loss does
      not return. Risk: the wider spread may not stop the slalom line loss at y=0.07
      m, which would point to the lead, not the spread, as the trigger.


      - [Open this output](iteration-8/entity0/versions/5cb5868f79a543fabbc4cb87585468ff/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-dd060d5762f9de67/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-247f370dd86345c8/payload.json)'
  - id: entity1
    label: Lead 0.07 with wide
    notes: 'Restores the best-lead row (y=0.07 m, iteration 3) with the wider +/-0.065
      m spread from iteration 7. The controller matches iteration 3, so the race isolates
      whether the spread or the lead caused the iteration 7 slalom line loss.


      ### Rationale


      Iteration 7 (y=0.065 m, +/-0.065 m spread, 16 mm, radius 0.03 m) scored 35.77,
      below iteration 3 (51.31). Its slalom line loss returned at one event per run,
      and s-bend progress fell back to 0.04. Iteration 3 (y=0.07 m, +/-0.05 m) is
      the best design so far. Iteration 6 showed that speed 0.04 m also causes line
      loss, so ground speed stays at 0.03 m. Slalom steering_oscillation has stayed
      at 0.13 to 0.14 at every row tested (iterations 3 to 7), so it is not driven
      by the lead. This iteration restores the 0.07 m row and keeps the wider +/-0.065
      m spread, which is the Builder''s proposal. The controller is held at iteration
      3 settings (kp 2.0, ki 0, kd 0.10, base_speed 1.6, last_direction, weights [-2,-1,0,1,2]),
      so the result reflects geometry only. The spread change is the only variable
      compared with iteration 3. If line loss stays at zero and slalom max_error falls
      below 0.06 m, the spread was the missing piece. If line loss returns, the 0.07
      m lead itself is the trigger at this speed. Expected score is near or above
      51 if line loss does not return. Risk: the wider spread may reduce signal resolution
      near centre, which would show up as higher rms_error.


      - [Open this output](iteration-8/entity1/versions/c3b4d7247a97458f983057730e43dbcd/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/5cb5868f79a543fabbc4cb87585468ff/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-247f370dd86345c8/payload.json)'
  - id: entityR1
    label: Spread vs lead test plan
    notes: 'Feedback is written before the race. It gives conditional rules for line
      loss, slalom max_error and oscillation, based on iterations 3 to 7.


      ### Feedback


      Written before this candidate has raced, so no outcome is claimed. Evidence:
      iteration 3 (y=0.07 m, +/-0.05 m, radius 0.03 m, 51.31) gave the best s-bend
      progress (0.155), with one line-loss event per run on s-bend and slalom and
      slalom max_error 0.065 m. Iteration 7 (y=0.065 m, +/-0.065 m) scored 35.77,
      with slalom line loss again and s-bend progress back to 0.04. Iteration 6 (radius
      0.04 m) brought line loss back and cut s-bend progress to 0.1325, so ground
      speed should stay at 0.03 m. Slalom steering_oscillation stayed at 0.13 to 0.14
      at rows y=0.05, 0.06, 0.065 and 0.07 m, so the lead does not drive it. The oval
      has been stuck at progress 0.115 and max_error about 0.061 m since iteration
      1, so geometry may not fix it. What I had to compensate for: I kept kp 2.0,
      kd 0.10 and ki 0, because the narrower 0.09 m track already raises turn gain.
      The weights [-2,-1,0,1,2] keep the signal within about +/-2 across the wider
      spread. Next race: if line loss is zero on s-bend and slalom and slalom max_error
      is below 0.06 m, keep the +/-0.065 m spread at y=0.07 m. If line loss returns
      at y=0.07 m with the wider spread, the lead is the trigger at this speed. Then
      keep the spread and try y=0.067 m, not a bigger lead. If slalom max_error stays
      at or above 0.06 m with zero line loss, widen the spread to +/-0.08 m with 16
      mm footprints.


      ### Requested changes


      - If line_loss_events return at sensor y=0.07 m with the +/-0.065 m spread (iteration
      3 had one per run at +/-0.05 m, iteration 7 one per run at y=0.065 m), keep
      the spread and set y=0.067 m to test whether a slightly smaller lead cuts the
      loss while keeping most of the s-bend gain.

      - If line loss is zero and slalom max_error is still at or above 0.06 m (iteration
      3 gave 0.065 m, iteration 7 gave 0.0642 m), widen sensor x to +/-0.08 m with
      16 mm footprints, since the 0.065 m spread may still let the line leave view
      on slalom bends.

      - If the score is at or above 51.3 with zero line loss, keep geometry fixed
      and test sensor_size 0.012 m at the same positions, to check whether a smaller
      footprint reduces the jitter that the 16 mm footprint may add.


      - [Open this output](iteration-8/entityR1/versions/c3b4d7247a97458f983057730e43dbcd/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/5cb5868f79a543fabbc4cb87585468ff/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-247f370dd86345c8/payload.json)'
