map:
  id: race-139-randow-maps
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Lead back to y=0.07 m
    notes: 'Returns the sensor row to y=0.07 m (the best-scoring lead, 51.31) and
      keeps the +/-0.065 m spread with 16 mm footprints, changing only the row from
      iteration 7. Based on iteration 7 slalom line loss (1 per run at y=0.065 m)
      and the Integrator''s rule to return to y=0.07 m if line loss recurs.


      ### Rationale


      Iteration 7 (y=0.065 m, +/-0.065 m spread, 16 mm, radius 0.03 m) scored 35.77,
      below iteration 3 (51.31). Slalom line loss returned at one event per run, slalom
      steering_oscillation stayed at 0.134, and s-bend progress fell back to 0.04.
      Its slalom max_error was 0.0642 m. The s-bend result matched the iteration 0
      to 2 values exactly, and iteration 4''s s-bend range (15.43 to 73.47) shows
      that seed variance is large. The Integrator''s stated rule applies: if line
      loss returns at sensor y=0.065 m with the wider spread, return the row to y=0.07
      m and keep the +/-0.065 m spread. That rule is consistent with the evidence,
      because the best score came from the y=0.07 m row and speed at 0.03 m, and iteration
      6 showed that speed 0.04 m also causes line loss. I therefore change only the
      sensor row, from y=0.065 m back to y=0.07 m. The +/-0.065 m spread, 16 mm footprints,
      body, mass, wheel track and wheel radius stay fixed. This isolates the lead
      effect against iteration 7 and tests whether the wider spread alone can hold
      the line at y=0.07 m. Expected result: s-bend progress near 0.14 to 0.155, slalom
      max_error below about 0.06 m, and a score near or above 51 if line loss does
      not return. Risk: the wider spread may not stop the slalom line loss at y=0.07
      m, which would point to the lead, not the spread, as the trigger.


      - [Open this output](iteration-8/entity0/versions/5cb5868f79a543fabbc4cb87585468ff/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-dd060d5762f9de67/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-247f370dd86345c8/payload.json)'
  - id: entity1
    label: Wider spread, lead 0.065
    notes: 'Adopts the Builder''s combined change from the best raced design (iteration
      3): sensor y 0.065 m, spread ±0.065 m, wheel_radius kept at 0.03 m. Based on
      the iteration 3 line loss and the iteration 6 speed result. Controller unchanged,
      so the race isolates geometry.


      ### Rationale


      Iteration 3 (y=0.07 m, wheel_radius 0.03 m, 51.31) is the best raced design.
      Iteration 6 showed that wheel_radius 0.04 m brings back line loss and cuts s-bend
      progress to 0.1325, so ground speed should stay at 0.03 m. Iteration 4 (y=0.06
      m) and iteration 5 (y=0.05 m) showed that the forward lead is needed for s-bend
      progress, but y=0.07 m also gave one line-loss event per run on s-bend and slalom.
      Slalom steering_oscillation stayed near 0.13 to 0.14 at every lead tested (y=0.05,
      0.06, 0.07 m), so the lead does not cause it. Slalom max_error was 0.065 to
      0.069 m at the ±0.05 m spread, above the 0.06 m off-track limit. The Builder''s
      plan applies the agreed rules: keep wheel_radius at 0.03 m, set sensor y to
      0.065 m to keep most of the lead while cutting speed-related line loss, and
      widen the spread to ±0.065 m with 16 mm footprints so the line stays under the
      sensors on slalom bends. I take the Builder''s geometry as written. The controller
      stays at the iteration 3 settings (kp 2.0, ki 0, kd 0.10, base_speed 1.6, last_direction)
      with weights [-2,-1,0,1,2], so the signal stays within about ±2 across the wider
      spread. Changing both the lead and the spread at once makes attribution harder.
      The observation request therefore reports per-track line_loss_events, max_error
      and steering_oscillation so each change can be read separately. Expected result:
      line loss back to 0, s-bend progress near 0.14 to 0.155, slalom max_error below
      0.06 m, and a score of about 50 to 54. The oval should stay at progress 0.1125
      and max_error about 0.060 m. Risk: a wider spread can reduce signal resolution
      near centre.


      - [Open this output](iteration-7/entity1/versions/779bab8db514416cbe52ce6b73ad6a39/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/10e21064b5af4719b1dd1a3af73ce899/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-4cc13864183b7e6e/payload.json)'
  - id: entityR1
    label: 'Feedback: lead and spread'
    notes: 'Feedback written before the race: next steps depend on whether line loss
      returns at y=0.065 m and whether slalom max_error stays above 0.06 m. Evidence
      is from iterations 3, 4, 5 and 6.


      ### Feedback


      Written before this candidate has raced, so no outcome is claimed for it. Evidence:
      iteration 3 (y=0.07 m, ±0.05 m spread, 16 mm, wheel_radius 0.03 m, 51.31) had
      the best s-bend progress (0.155) but one line-loss event per run on s-bend and
      slalom, with slalom max_error 0.065 m. Iteration 6 (wheel_radius 0.04 m, 47.71)
      showed that higher ground speed also brings back line loss and cuts s-bend progress
      to 0.1325, so speed should stay at 0.03 m. Iteration 4 (y=0.06 m) and iteration
      5 (y=0.05 m) show that the lead below 0.07 m loses most of the s-bend gain.
      Slalom steering_oscillation stayed near 0.14 at every row tested, so the row
      position is not its cause. The oval has been fixed at progress 0.1125 and max_error
      about 0.060 m since iteration 1. What I had to compensate for: I kept kp 2.0,
      kd 0.10 and ki 0, and kept the weights [-2,-1,0,1,2] matched to the spread,
      so the signal stays about ±2 on the wider spread. Next race: if line_loss_events
      return on s-bend or slalom at y=0.065 m, the lead is still too aggressive for
      this speed; return to y=0.07 m and keep the ±0.065 m spread. If slalom max_error
      stays at or above 0.06 m with zero line loss, widen the spread toward ±0.08
      m (the maximum allowed) with 16 mm footprints. If steering_oscillation stays
      above 0.10 on slalom with zero line loss, geometry is not the lever, so I will
      change the controller, not the geometry.


      ### Requested changes


      - If line_loss_events return on s-bend or slalom at sensor y=0.065 m (iteration
      3 had one per run at y=0.07 m), return sensor y to 0.07 m and keep the ±0.065
      m spread, to test whether the lead is what causes the loss.

      - If slalom max_error stays at or above 0.06 m with zero line loss (iteration
      3 gave 0.065 m at ±0.05 m), widen sensor x to ±0.08 m with sensor_size 0.016
      m, so the line stays under the sensors at the largest bend offsets.

      - If the score is at or above 51.3 with zero line loss, keep geometry fixed
      and try sensor_size 0.012 m at ±0.065 m, to test whether a smaller footprint
      reduces the signal jitter that the 16 mm footprint may add (iteration 6 showed
      speed is not the lever).


      - [Open this output](iteration-7/entityR1/versions/779bab8db514416cbe52ce6b73ad6a39/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/10e21064b5af4719b1dd1a3af73ce899/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-4cc13864183b7e6e/payload.json)'
