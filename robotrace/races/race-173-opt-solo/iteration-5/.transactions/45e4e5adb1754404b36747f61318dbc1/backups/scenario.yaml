  entities:
  - id: entity0
    label: 'Slalom: narrower track'
    notes: 'Keeps the iteration-4 layout, which finishes oval and s-bend 20/20, and
      targets the slalom, which fails 0/20. Narrows wheel_track 0.12 to 0.11 for more
      yaw response and raises kd 1.0 to 1.3 for damping, based on the 2 to 4 gain
      from larger footprint and kd.


      ### Rationale


      Evidence from iteration 4 (score 709.6, best so far): the oval (953) and s-bend
      (944) both finish 20/20, with s-bend control effort and oscillation acceptable.
      The slalom is the whole gap. It finishes 0/20 (off-track 18, timeout 2), with
      progress 0.55, about 0.9 line-loss events per run and max_error 0.0595, right
      at the 0.06 m off-track limit. Score is the mean of the three tracks, so a finished
      slalom would add roughly 500 to 700 points on that track. Iteration 2 to 4 showed
      that a larger sensor footprint (0.012 to 0.016) plus more derivative damping
      (kd 0.8 to 1.0) roughly doubled slalom progress without hurting the other tracks.
      Derivative damping and the footprint are therefore still the productive levers.
      Two changes this iteration: (1) kd 1.0 to 1.3 for more damping against the quick
      left-right signal swings of the slalom. (2) wheel_track 0.12 to 0.11. Turn rate
      is the wheel speed difference divided by track, and the controller''s differential
      is fixed at 350 PWM per unit of turn, so a narrower track gives about 9% more
      yaw response per unit of kp. This helps the slalom''s tight alternating bends,
      where the robot currently falls behind the tape. Sensor array (x = -0.04 to
      +0.04, 0.02 spacing, 0.016 size), kp 2.0, ki 0, base_speed 1.0, last_direction
      line loss and the other geometry are unchanged, so the oval and s-bend behaviour
      should stay close to iteration 4. Expected result: slalom line losses fall below
      0.5 per run and progress rises above 0.6, with a chance of finishing some slalom
      runs. Oval and s-bend should hold near 1.0 finish. Hypotheses: H1, the slalom
      off-track exits come from insufficient yaw response at tight alternations, which
      the narrower track addresses. H2, the extra kd reduces overshoot, so max_error
      on the slalom drops below 0.05. Risk: the combined response increase could bring
      back s-bend oscillation (control effort was 4.3 at iteration 4). Next measurements:
      per-track max_error, line_loss_events and progress, and slalom completion_time
      to see whether the robot can meet the 3 s limit at base_speed 1.0. If the s-bend
      control effort rises above 6, I will back off the wheel_track change first.


