  entities:
  - id: entity0
    label: Narrower array, softer PD
    notes: 'Narrows the sensor array to plus or minus 0.03 m, lowers kp to 2.0 and
      base_speed to 1.1, and raises kd to 0.5. The baseline failed by exceeding the
      0.06 m off-track limit (max_error about 0.06) with oscillation and line loss,
      so this targets overshoot at bends.


      ### Rationale


      Evidence from the baseline race: the robot leaves the line on almost every run.
      Off-track ends dominate (18 of 20 oval trials, all s-bend and slalom trials),
      and max_error averages about 0.06 m. That equals the off-track limit, max(0.06,
      0.0125 + 0.12/4) = 0.06 m, so the robot is failing by exceeding the allowed
      lateral error, not by stalling. Steering oscillation (about 0.14 to 0.17) and
      about one line-loss event per run point to over-aggressive steering. The effective
      turn gain is high: with weights of +/-2 and kp = 2.5, a fully-on-tape outer
      sensor gives turn = 5, a wheel differential of about 1750 PWM. Base speed 1.3
      also carries the robot into bends faster than it can steer. Changes: (1) Narrow
      the sensor array to x = -0.03 to +0.03 at 0.015 spacing. The outer sensors then
      still see the 25 mm tape on a centred line, so the signal does not saturate
      early and recovery is smoother. (2) Reduce kp from 2.5 to 2.0 to cut the overshoot
      that drives oscillation and the max_error. (3) Raise kd from 0.2 to 0.5 to damp
      the faster signal changes. (4) Reduce base_speed from 1.3 to 1.1 so the robot
      holds the line through bends. This costs some time: the 3 s limit needs about
      1.5 m/s, so completion may suffer. Accepted because staying on track is worth
      far more than speed right now. Geometry stays at 0.12 m track, 0.03 m wheels
      and 0.8 kg mass, and body_width cannot raise the 0.06 m off-track limit within
      the allowed range. Expected result: fewer off-track ends, max_error below about
      0.05, and some s-bend and slalom progress above the baseline 0.12 to 0.17. Hypotheses
      to test: H1, the off-track failures are mainly from overshoot at bends (check
      max_error against steering_oscillation). H2, the speed-versus-steering trade-off
      is the binding limit (check completion_time on runs that finish). Next measurements:
      max_error, progress, line_loss_events and steering_oscillation per track, to
      decide between further lowering base_speed and raising kp.


