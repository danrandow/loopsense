  entities:
  - id: entity0
    label: Look-ahead 0.08, kd 1.8
    notes: 'Moves sensors to y=0.08, raises kd 1.5 to 1.8, and lowers mass to 0.5
      kg to attack slalom off-track exits. Iteration 7 showed 5/20 slalom finishes,
      15 off-track, and max_error near 0.055, with the earlier look-ahead and kd gains
      still productive.


      ### Rationale


      Evidence from iteration 7 (score 772.0, best so far): the oval (947.5) and s-bend
      (938.4) both finish 20/20 with low line-loss counts. The slalom is the whole
      remaining gap: 5/20 finished, 15 off-track exits, progress 0.72, max_error 0.055
      (just under the 0.06 m limit), and about 0.9 line-loss events per run. The base_speed
      1.1 and mass 0.6 change removed the slalom timeouts seen in iteration 6 (7 timeouts),
      so speed was the binding limit there. The remaining failures are off-track exits,
      which are a lag and overshoot problem. The forward sensor move (y 0.05 to 0.07)
      and kd increase (1.3 to 1.5) raised slalom progress in earlier iterations, and
      s-bend oscillation fell as kd rose, so both levers are still productive.


      Changes: (1) Move all five sensors forward from y = 0.07 to y = 0.08, the top
      of the allowed range, for another 1 cm of look-ahead so steering starts earlier
      on the alternating slalom bends. x positions, sensor size and weights are unchanged,
      so the signal scale is preserved. (2) Raise kd from 1.5 to 1.8 to damp the faster
      signal changes that the earlier sensing produces, and to counter the overshoot
      risk. (3) Lower mass from 0.6 to 0.5 kg. Yaw inertia scales with mass, so this
      lowers the steering load on tight bends while keeping the same drive. base_speed
      stays at 1.1, kp at 2.0, ki at 0, wheel_track at 0.11, and the line-loss rule
      at last_direction.


      Expected result: slalom off-track exits fall, with progress above 0.85 and a
      higher finish rate (target 6 to 10 of 20 finishes). Oval and s-bend should stay
      near 20/20 finishes. Hypotheses: H1, slalom off-track exits come from late reaction,
      so the further look-ahead reduces them. H2, the extra kd and lower mass keep
      the s-bend stable despite the higher look-ahead. Risks: over-steering on the
      s-bend (control effort was 8.8 at iteration 7). If s-bend control_effort exceeds
      9.5 or steering_oscillation exceeds 0.2, the next step is to revert kd to 1.5
      and keep the sensor move. Next measurements: slalom progress, finished count,
      completion_time and ended_by, plus s-bend max_error, control_effort and steering_oscillation,
      to separate the look-ahead effect from the kd and mass effects.


