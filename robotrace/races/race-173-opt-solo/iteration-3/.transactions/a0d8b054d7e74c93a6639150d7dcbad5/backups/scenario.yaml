  entities:
  - id: entity0
    label: Wider array, larger
    notes: 'Widens the sensor array to +/-0.06 m, enlarges the sensors to 16 mm and
      raises kp to 2.5, targeting slalom line loss (progress 0.36, one loss per run).
      Built on the best iteration-2 design (671 score), with the oval and s-bend behaviour
      kept unchanged.


      ### Rationale


      Evidence from iteration 2 (score 671.3, best so far): the oval is solved (20/20
      finished, max_error 0.0093, 2.02 s). The s-bend nearly is (19/20 finished, one
      off-track). The slalom still fails in 20/20 trials, with progress 0.36, max_error
      0.0625 (at the 0.06 m off-track limit) and about one line-loss event per run.
      Body width cannot widen the off-track limit (it stays at 0.06 m), so the fix
      has to keep the tape under the sensors at larger lateral errors. Iteration 1
      to 2 showed that widening the array (x = +/-0.03 to +/-0.04) and slowing down
      roughly doubled slalom progress, so the array is the main lever still open.
      Changes: (1) Widen the array to x = -0.06 to +0.06 at 0.03 spacing, so the tape
      stays detected when the robot is about 0.05 m off centre. (2) Enlarge sensor_size
      from 0.012 to 0.016, so each footprint covers more of the 25 mm tape at the
      same offset and the sum rarely drops below the 0.05 line-loss threshold. (3)
      Raise kp from 2.0 to 2.5. The wider spacing lowers the signal slope (weights
      x/0.03 instead of x/0.02, about 33 vs 50 per metre), so kp is raised to keep
      the steering response close to the iteration-2 level (about 83 vs 100 per metre).
      (4) Keep kd 0.8, ki 0, base_speed 1.0 and last_direction line loss, so the oval
      and s-bend behaviour is not disturbed. Expected result: slalom line losses fall
      and progress rises well above 0.36, the oval stays near 1.0 progress, and the
      s-bend finish rate holds or improves. Hypotheses: H1, slalom failure is line
      loss at large lateral offsets, which the wider and larger sensors should fix.
      H2, the effective gain is now slightly too low, which would show as higher max_error
      on the s-bend. Next measurements: per-track progress, line_loss_events and max_error,
      to separate the effect of the array change from the kp change.


