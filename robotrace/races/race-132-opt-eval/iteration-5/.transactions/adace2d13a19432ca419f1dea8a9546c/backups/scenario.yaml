  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Iter 1 base, 16mm sensors
    notes: 'Reverts the wider sensor spacing, which cut s-bend progress from 0.29
      to 0.16 in iteration 4, and tests a 16 mm sensor footprint on the iteration
      1 spacing and controller. The evidence is iteration 4''s progress drop and the
      Evaluator''s requested revert.


      ### Rationale


      Evidence: iteration 4 (sensor x widened to -0.03..0.03, otherwise iteration
      1''s controller) scored 57.85, below iteration 1 at 75.97. Progress fell on
      the s-bend (0.29 to 0.157) and oval (0.16 to 0.153). Line losses did drop (s-bend
      1.95 to 1.0, slalom 2.0 to 1.0) and s-bend oscillation fell (0.23 to 0.14),
      but max_error stayed at 0.062 to 0.064 on every track. The wider spread costs
      signal on the bends, and the score is driven mainly by progress. The Evaluator''s
      requested change applies: progress fell below iteration 1 levels, so I revert
      the sensor x positions to -0.02..0.02 and test a larger footprint instead. Change:
      sensor_size 0.012 to 0.016, with the iteration 1 spacing and controller (kp
      2.0, kd 0.2, base_speed 1.4, ki 0, last_direction, weights -2..2) unchanged.
      Expected result: a larger footprint reads the tape earlier and more continuously
      at the same spacing, so line_loss_events should fall without giving up the s-bend
      progress of about 0.29. I expect max_error to stay near 0.06 to 0.065 since
      the geometry reach is the same. Hypotheses: (H1) the larger footprint reduces
      line losses while keeping progress at iteration 1 levels; (H2) if progress drops,
      the footprint is not the limit and the next lever is kd near 0.15 for the s-bend
      oscillation of 0.23. Measurements wanted: progress per track (s-bend and oval
      against 0.29 and 0.16), line_loss_events on s-bend and slalom, max_error and
      its location, steering_oscillation, and completion_time if any run finishes.


      - [Open this output](iteration-5/entity0/versions/8b9591522bfe402d846b8dfcfc18a384/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-713cd64e616a1562/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-94d4be75a0477f6d/payload.json)'
  - id: entityR1
    label: 'Approve: wider sensor'
    notes: 'Approved the iteration 1 controller with sensor spacing widened to x =
      -0.03..0.03, a single-variable test against the best raced design (score 75.97).
      Iterations 2 and 3 showed speed and kp did not move max_error, which stayed
      near 0.061 to 0.065 on every track, so sensor geometry is the remaining lever.


      ### Feedback


      Written before this candidate has raced. The candidate keeps the iteration 1
      controller (kp 2.0, kd 0.2, base_speed 1.4, ki 0, last_direction, weights -2..2)
      and changes only sensor spacing, widening x from -0.02..0.02 to -0.03..0.03
      at y 0.04. Iteration 1 is the best raced design (score 75.97). Its max_error
      stayed at 0.061 to 0.065 on every track, and it had about 2 line-loss events
      on the s-bend and slalom. Iteration 2 (base 1.2, kd 0.1) and iteration 3 (kp
      2.5, kd 0.1) both cut progress to about 0.10 to 0.15 on the oval and s-bend,
      and neither moved max_error. So speed and kp were not the levers the evidence
      points to, and sensor geometry is the untested lever. The candidate is a clean
      one-variable test against the best baseline, and every field is within contract
      limits with five sensors matching five weights. Watch for three things in the
      race. First, max_error should fall toward or below 0.06 and line_loss_events
      on the s-bend and slalom should drop below 2. Second, progress should hold at
      or above iteration 1 (s-bend 0.29, oval 0.16); if it falls, the wider spacing
      is costing signal and the spacing should be reverted. Third, steering_oscillation
      was 0.23 on the s-bend at kd 0.2, so if it stays high while max_error is still
      near 0.06, the next step is kd 0.15 rather than more kp. Keep ki at 0 unless
      rms_error shows a steady offset.


      ### Requested changes


      - If progress falls below iteration 1 levels (s-bend 0.29, oval 0.16) with the
      wider spacing, return the sensor x positions to -0.02..0.02 and instead test
      sensor_size 0.016 with the iteration 1 spacing, since iteration 1 gave the best
      progress.

      - If max_error stays near 0.06 and steering_oscillation on the s-bend stays
      above about 0.2 with the wider spacing, lower kd from 0.2 to 0.15 in one step
      (iteration 1 showed kd 0.2 gave oscillation of 0.23 on the s-bend), keeping
      kp at 2.0.

      - If line_loss_events on the s-bend and slalom fall below 2 while max_error
      drops under 0.06, keep the new spacing and try x spread at -0.04..0.04 (step
      0.02) to test whether a wider spread helps further.


      - [Open this output](iteration-4/entityR1/versions/78202a510da9401c9eda299b4111483f/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/eede52c2de154d728047f3b631223b6b/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-45846b320d6fe3b3/payload.json)'
