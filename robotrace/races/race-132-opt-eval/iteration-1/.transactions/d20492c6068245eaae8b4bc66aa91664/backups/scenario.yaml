  id: race-132-opt-eval
  schema: v0.2
  scenario: Iteration 1
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 0.
dimensions:
  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Slower, tighter-sensor v2
    notes: 'Cut base_speed from 1.8 to 1.4, tightened sensor spacing to ±0.02 m, and
      raised kp to 2.0 and kd to 0.2. The evidence is that all 60 development trials
      of v1 went off track at max_error about 0.061 with one line loss each, so the
      first fix is staying on the line.


      ### Rationale


      Evidence from iteration 0 (no earlier race; development simulator only, all
      60 trials): the robot never finished on any track. Every trial ended off_track,
      with progress 0.04 to 0.115 and max_error 0.061 on every track, just above the
      0.06 m off-track limit. Each trial also logged one line-loss event, so the robot
      left the tape early and never recovered. The failure is early and systematic,
      not a slow finish, so the first priority is staying on the line.


      What I think is wrong: (1) base_speed 1.8 is too fast for the tightest bends.
      Steering authority is kp*350 PWM per unit signal, and the robot cannot correct
      before it leaves the tape. (2) The sensors are spread at x = -0.04 to +0.04
      with 12 mm footprints. A sensor at x = ±0.04 sees tape only once the robot is
      more than about 2.15 cm off centre, so when the robot starts drifting the outer
      sensors give no signal and the response is delayed. (3) kd = 0.05 gives little
      damping, so the robot overshoots after each correction.


      Changes: base_speed 1.8 to 1.4 (a moderate reduction that keeps some progress
      toward the 1.5 m/s average). Sensor x positions tightened to -0.02, -0.01, 0,
      0.01, 0.02 at y = 0.04, so every sensor sees tape within about 1 cm of the centre
      line and the signal responds earlier. Weights stay -2, -1, 0, 1, 2 (5 sensors,
      5 weights). kp 1.5 to 2.0 for firmer correction; with the signal limited to
      ±2 the largest turn is about 4, or about 1400 PWM. kd 0.05 to 0.2 for damping
      against overshoot. ki stays 0. line_loss stays last_direction, since it was
      not the cause.


      Expected result: the robot should hold the line through the bends and finish
      the oval and s-bend with 0 to 1 line-loss events, with completion_time near
      3 s or slightly above. Hypotheses to check: (H1) the early exit was caused by
      speed, so progress should rise sharply when base_speed drops. (H2) tighter sensor
      spacing removes the dead zone, so max_error should fall well below 0.06. (H3)
      kd 0.2 will damp oscillation without adding noise problems. Measurements I want
      next: progress and completion per track, max_error and where in the course it
      peaks, line_loss_events, steering_oscillation (to test H3), and completion_time
      (to see whether speed can rise again). If max_error stays near 0.06 with low
      oscillation, the next step is a lower base_speed or higher kp. If oscillation
      is high, the next step is a lower kd.


      - [Open this output](iteration-1/entity0/versions/0c8c3d1ddd1f478995a42a70c33a2771/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-8befde7f2f22e669/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-ade5e5c94e4b9055/payload.json)'
  - id: entityR1
    label: 'Iter 0 baseline: approved'
    notes: 'Approved the conservative first candidate, which is valid and not obviously
      broken, so it races to produce the first telemetry. No earlier race exists,
      so the feedback and requested changes are conditional on that race''s measurements
      (speed, oscillation, line loss).


      ### Feedback


      No race has run yet, so there is no earlier telemetry for this candidate or
      for any other. The bar for this iteration is that the candidate is valid and
      not obviously broken. I checked every field against the contract: all values
      are inside their limits, with 5 sensors matching 5 weights, a 0.012 m footprint,
      and last_direction line loss. Nothing is obviously broken, so I am approving
      it to race and get the first telemetry. Two things are untested and worth watching
      in the results. First, base_speed 1.8 may be too fast for the tightest bend,
      since the contract says 1.5 m/s average is needed to finish, and the first race
      will show whether the robot holds the line at that speed. Second, kp 1.5 with
      kd 0.05 gives a large differential (turn up to about 1050 PWM from a full-scale
      signal of 2), so oscillation on the slalom is plausible. Once the race reports,
      use these rules: if max_error approaches 0.06 or line_loss_events is above zero,
      lower base_speed or raise kp so the robot holds the line. If steering_oscillation
      is high while max_error is small, raise kd in small steps, since that damps
      the jitter without adding much noise. If completion is 0 with progress stalled,
      check the bend where it stopped before changing anything else. Keep ki at 0
      unless rms_error shows a steady offset.


      ### Requested changes


      - After the race, if max_error is near 0.06 or line_loss_events is above 0,
      reduce base_speed (for example 1.8 to 1.5) before changing kp, because the speed
      limit is the likelier cause on the first run.

      - If steering_oscillation is high while max_error stays small, raise kd from
      0.05 to about 0.2 in one step and re-race; no earlier race supports a specific
      value yet.

      - If completion_time is above 3 s with completion 1, raise base_speed in small
      steps only if max_error and line_loss_events stay low; no earlier race has measured
      this trade-off yet.


      - [Open this output](iteration-0/entityR1/versions/ce01cb8381a8425bbf0e9c34b923afab/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/fbcf6310309a4d14ad8a4e28a00c0827/payload.json)'
