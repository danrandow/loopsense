map:
  id: race-132-opt-eval
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Slower, calmer kd 0.1
    notes: 'Cuts base_speed 1.4 to 1.2 to address line losses and max_error near 0.06,
      and kd 0.2 to 0.1 to reduce the oscillation that rose to 0.23 on the s-bend.
      Both changes follow the Evaluator''s rules and iteration 1 race telemetry.


      ### Rationale


      Evidence from iteration 1 (60 trials, every run still ended off_track, score
      75.97, up from 26.04): max_error is 0.061 on oval, 0.065 on s-bend and 0.061
      on slalom, so the robot still leaves the 0.06 m limit on every track. Line losses
      remain near 2 per trial on the s-bend (1.95) and slalom (2.0). Steering oscillation
      rose sharply to 0.23 on the s-bend and 0.14 on the slalom, against 0.07 to 0.11
      on the oval and about 0.07 in iteration 0. Progress improved on the s-bend (0.04
      to 0.29) and oval (0.115 to 0.16), so the tighter sensors and higher kp helped,
      but the robot still fails at the first sharp bends.


      Interpretation: the Evaluator rule for high oscillation with small max_error
      does not apply, because max_error is not small. The rule for max_error near
      0.06 with line losses does apply, and the Evaluator named base_speed as the
      likelier cause. The high oscillation on the s-bend, with kd at 0.2 amplifying
      10 ms sensor noise and kp at 2.0 giving a large differential, makes me think
      the derivative term is adding jitter that pushes the robot off the tape.


      Changes: (1) base_speed 1.4 to 1.2, one Evaluator-suggested step, so the robot
      has more time to correct on bends (H1: line losses and max_error fall, and progress
      holds because the failure point moves later). (2) kd 0.2 to 0.1, to cut the
      jitter the Evaluator flagged, since oscillation rose about three times on the
      s-bend (H2: steering_oscillation falls below 0.15 without raising max_error).
      kp stays at 2.0 and ki at 0, and the sensor geometry and weights are unchanged,
      so the effect of each change can be read from the race. I expect max_error to
      drop below 0.06 on the oval and slalom, line_loss_events to fall to 0 to 1,
      and completion to remain 0 unless speed is raised later.


      Measurements wanted next: max_error and where it peaks on each track, line_loss_events
      per track, steering_oscillation (to confirm the kd change), progress per track,
      and completion_time if any run finishes. If the next race shows low oscillation
      and max_error still near 0.06, raise kp to 2.5. If oscillation is still high
      with kd 0.1, lower kd to 0.05.


      - [Open this output](iteration-2/entity0/versions/3b5e2a1ec2b0493d90eaed23ed41b0b1/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-507ac57e9c04c4df/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-4ed85e413178ea4f/payload.json)'
  - id: entityR1
    label: Evaluator Feedback
    notes: 'Evaluator Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      The candidate is a valid, targeted change from iteration 0, which raced 60 trials
      with every run ending off_track, progress 0.04 to 0.115, max_error about 0.061
      and one line-loss event per trial. The candidate lowers base_speed from 1.8
      to 1.4 (tests H1, that speed caused the early exit), tightens the sensors to
      x = -0.02 to +0.02 at y = 0.04 so the outer sensors see tape earlier (tests
      H2), raises kp from 1.5 to 2.0 for firmer correction, and raises kd from 0.05
      to 0.2 for damping (tests H3). The sensor geometry, weights, and line_loss setting
      are all within contract limits and the weights still match the five sensors,
      so it is not obviously broken and is the right kind of step at this early stage.
      One risk to watch: kd 0.2 multiplies the rate of change of the signal per second,
      so it amplifies sensor noise on the 10 ms loop, and kp 2.0 with kd 0.2 may produce
      more jitter than iteration 0 did. Once the race reports, use these rules. If
      steering_oscillation is high while max_error is small, reduce kd in steps (for
      example 0.2 to 0.1) before changing anything else. If max_error still approaches
      0.06 or line_loss_events stays above 0 with low oscillation, reduce base_speed
      (for example 1.4 to 1.2) or raise kp (for example 2.0 to 2.5). If completion
      is 1 and completion_time is well under 3 s with low max_error, raise base_speed
      in small steps to gain time. Keep ki at 0 unless rms_error shows a steady offset.


      ### Requested changes


      - If steering_oscillation is high while max_error is small after the race, lower
      kd from 0.2 to about 0.1 in one step, since derivative gain on the 10 ms signal
      amplifies sensor noise.

      - If max_error stays near 0.06 or line_loss_events is above 0 with low oscillation,
      lower base_speed from 1.4 to about 1.2 before raising kp further, since iteration
      0 pointed to speed as the most likely cause.

      - If completion is 1 with max_error and line_loss_events both low, raise base_speed
      in steps of about 0.2 (1.4 to 1.6) to bring completion_time nearer 3 s, since
      the 1.5 m/s average needs more speed.


      - [Open this output](iteration-1/entityR1/versions/d20492c6068245eaae8b4bc66aa91664/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/0c8c3d1ddd1f478995a42a70c33a2771/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-ade5e5c94e4b9055/payload.json)'
