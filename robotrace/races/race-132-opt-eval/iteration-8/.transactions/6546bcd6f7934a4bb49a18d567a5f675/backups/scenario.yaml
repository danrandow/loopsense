  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence. Iteration 6 replicated the iteration 1 design exactly (score 75.9694,
      identical per-track metrics), so the 0.29 s-bend progress is reproducible for
      this design and seed set, not luck. The remaining problem is the s-bend, where
      steering_oscillation is 0.23 and line_loss_events is about 1.95, and the slalom,
      where line_loss_events is 2.0. Every track still ends off_track with max_error
      about 0.061 to 0.065, just above the 0.06 m limit. Earlier single-lever tests
      moved progress in ways that tie to the controller. kd 0.1 (iterations 2 and
      3) cut s-bend and oval progress, while kd 0.2 (iteration 1) kept it. Iteration
      2 (base 1.2) and iteration 3 (kp 2.5) showed that speed and kp do not move max_error.
      Sensor spacing and footprint changes (iterations 4 and 5) cut progress without
      moving max_error.


      Change. I keep the replicated iteration 1 design and change one lever: kd from
      0.2 to 0.15, the midpoint the Evaluator asked me to check. Everything else is
      unchanged: base_speed 1.4, kp 2.0, ki 0, weights -2..2, sensors at x -0.02..0.02
      with y 0.04, sensor_size 0.012, and last_direction line loss. Geometry is also
      unchanged.


      Why. kd 0.2 gave the oscillation peak (0.23 on the s-bend). kd 0.1 cut progress.
      Under the iteration 1 baseline, kd 0.15 should cut jitter while keeping most
      of the progress.


      Expected result. steering_oscillation on the s-bend falls from about 0.23 to
      about 0.18 to 0.20. Progress stays between about 0.25 and 0.29 on the s-bend
      and near 0.16 on the oval. Score is near 76, with a chance of a small gain if
      line losses fall. max_error is probably still near 0.06 to 0.065.


      Hypotheses. (H1) kd 0.15 keeps s-bend progress at or above 0.25 while cutting
      oscillation below 0.20. (H2) If progress falls below about 0.22, the progress
      lost by kd is the limit, and the next lever is kp with kd 0.2 kept. (H3) max_error
      stays about 0.06 to 0.065, so the remaining error is set by bend geometry and
      reach, not by a gain. Measurements wanted are progress, line_loss_events and
      steering_oscillation per track, and max_error with its location.


      - [Open this output](iteration-7/entity0/versions/a86abc39c3cf4e4aaf9a1a8231ea570e/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-8d9b4485caf764bf/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-4ed85e413178ea4f/payload.json)'
  - id: entityR1
    label: Approve kd 0.15 midpoint
    notes: 'Approved the single-lever test of kd 0.2 to 0.15 on the replicated iteration
      1 baseline (75.97, reproduced in iteration 6), to reduce the 0.23 s-bend oscillation.
      Feedback sets rules for progress and speed follow-ups, based on iterations 2
      and 3 which showed kd 0.1 and lower speed cut s-bend progress.


      ### Feedback


      Written before this candidate has raced, so it states no outcome for it. The
      candidate is the iteration 1 design (kp 2.0, base_speed 1.4, ki 0, last_direction,
      weights -2..2, sensors x -0.02..0.02 at y 0.04, sensor_size 0.012) with kd moved
      from 0.2 to 0.15. Iteration 1 is the best raced design (75.97), and iteration
      6 reproduced it exactly, so the baseline is reliable. The change is valid and
      single-lever. Iteration 1 had steering_oscillation of 0.23 on the s-bend, which
      is the main jitter problem. Iteration 2 (kd 0.1) and iteration 3 (kd 0.1) both
      lost s-bend progress (0.29 to about 0.15), but both also changed base_speed
      or kp, so kd alone is not cleanly isolated. Iteration 3 also showed that kp
      2.5 leaves max_error at 0.062 to 0.065, so kp is not the lever for the off-track
      failure. Read the race in this order. (1) If s-bend progress stays at or above
      about 0.25 and steering_oscillation falls below about 0.20, kd 0.15 is a better
      trade and the next test is base_speed. (2) If s-bend progress falls below about
      0.22, the progress lost to kd is the limit, so return kd to 0.2, which kept
      progress in iteration 1, and do not lower kd further. (3) In either case, max_error
      will probably stay near 0.06 to 0.065 because bend reach, not gain, sets it.
      Approving this test is reasonable: it is the midpoint the team needs to check,
      and the race gives per-track telemetry for the next decision.


      ### Requested changes


      - If s-bend progress stays at or above about 0.25 and steering_oscillation falls
      below about 0.20 with kd 0.15, keep kd 0.15 and test base_speed 1.5 in one step.
      Speed has only been lowered so far (iteration 2, base 1.2, cut s-bend progress
      from 0.29 to 0.155), so raising it is untested and may recover completion_time.

      - If s-bend progress falls below about 0.22 with kd 0.15, revert kd to 0.2,
      the value that held progress in iteration 1 (0.29 on the s-bend), and do not
      lower kd further.

      - Keep kp at 2.0. Iteration 3 (kp 2.5) left max_error at 0.062 to 0.065, so
      raising kp has not moved the off-track failure.


      - [Open this output](iteration-7/entityR1/versions/9144748c951c42e08289f8a6bfe3cc42/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/a86abc39c3cf4e4aaf9a1a8231ea570e/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-4ed85e413178ea4f/payload.json)'
