  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Baseline at base 1.4
    notes: 'Reverts base_speed from 1.5 to 1.4 on the best raced design (kp 2.0, kd
      0.2, iteration 1 and 6 baseline, score 75.97). Iteration 8 at 1.5 dropped s-bend
      progress from 0.29 to 0.167, which triggers the Evaluator''s speed-limit rule.


      ### Rationale


      Evidence from iteration 8 (base_speed 1.5, otherwise the iteration 1 and 6 baseline;
      score 68.89, below the 75.97 baseline). Oval progress rose (0.16 to 0.22), but
      s-bend progress fell from 0.29 to 0.167, and slalom line losses stayed at 2.0.
      Max_error stayed at 0.062 to 0.065 on every track, so the off-track failure
      did not move. This meets the Evaluator''s rule (2): s-bend progress fell below
      about 0.22 with max_error near 0.06, so speed is limiting the tightest bend.
      I return base_speed to 1.4. The candidate is therefore the iteration 1 and 6
      baseline, which is the best raced design (75.97) and reproduced exactly in iteration
      6. kp 2.0, kd 0.2, ki 0, last_direction, weights -2..2, sensors at x -0.02..0.02
      at y 0.04, sensor_size 0.012 and geometry are all unchanged. Expected result:
      about 76, with s-bend progress near 0.29 and oval near 0.16. Every lever tested
      so far that moved progress has lowered the score, so this is a safe scoring
      candidate. Hypotheses to check next: (H1) the s-bend progress of 0.29 depends
      on kd 0.2 damping, and kd is the only lever that has held it. (H2) Speed above
      1.4 helps the oval but hurts the s-bend, so the tightest bend limits base_speed.
      Measurements wanted: progress, line_loss_events and steering_oscillation per
      track, with max_error and where it peaks on the s-bend.


      - [Open this output](iteration-9/entity0/versions/11ec415f908b47a1868d4f58b9a369f4/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-eba23404bf05e71f/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-26f3eb2bc9878c6b/payload.json)'
  - id: entityR1
    label: Speed 1.5 on best
    notes: 'Single-lever test: the iteration 1 and 6 baseline (score 75.97, reproduced
      exactly) with base_speed raised from 1.4 to 1.5. Speed was only ever lowered
      before, and the earlier speed cut was confounded with kd 0.1, so this is the
      untested lever; approved as the clean test left in the budget.


      ### Feedback


      Written before this candidate has raced, so it states no outcome for it. The
      candidate is the iteration 1 and 6 baseline (kp 2.0, kd 0.2, ki 0, last_direction,
      weights -2..2, sensors x -0.02..0.02 at y 0.04, sensor_size 0.012, geometry
      unchanged) with base_speed raised from 1.4 to 1.5. The baseline is the best
      raced design (75.97), and iteration 6 reproduced it exactly, so it is a reliable
      comparison. Speed has only been lowered so far: iteration 2 cut base_speed to
      1.2 but also set kd to 0.1, so the speed effect was never isolated. Iteration
      2 lost s-bend progress (0.29 to 0.155) and oval progress (0.16 to 0.10), and
      the kd 0.1 runs in iteration 3 show that kd alone cost much of that, so the
      speed effect is still unclear. Raising speed is the one untested lever that
      bears on completion_time, since the 3.0 s limit needs about 1.5 m/s average.
      The candidate is a valid single-lever change. Read the race in this order. (1)
      If s-bend progress stays at or above 0.29 and line_loss_events and max_error
      do not rise, keep base_speed 1.5 and try a further small step only if completion
      appears. (2) If s-bend progress falls below about 0.22 with max_error near 0.06
      to 0.065, speed is limiting the tightest bend, so return base_speed to 1.4.
      (3) If progress holds but max_error rises above 0.065, return to 1.4, since
      that means the robot is leaving the line sooner. In every case, kp and kd stay
      at 2.0 and 0.2 until the race shows a reason to change them. Approving this
      test is reasonable: the iteration budget is limited, and a single-lever speed
      test on the best baseline is the most informative race left.


      ### Requested changes


      - If s-bend progress stays at or above 0.29 and line_loss_events on the s-bend
      and slalom do not rise above 1.95 and 2.0, keep base_speed 1.5 and try 1.6 in
      one step, since no run has yet finished and the 3 s limit needs about 1.5 m/s.

      - If s-bend progress falls below about 0.22 with max_error still near 0.06 to
      0.065, return base_speed to 1.4, because iteration 2 (base 1.2) showed that
      the speed change cost progress and the candidate would then be judged as the
      iteration 1 baseline.

      - Keep kp at 2.0 and kd at 0.2 for this race. Iteration 3 (kp 2.5) left max_error
      unchanged at 0.062 to 0.065, and iteration 7 (kd 0.15) is being tested separately,
      so only the speed effect should be read from this race.


      - [Open this output](iteration-8/entityR1/versions/b85adc5ae6c24cf8a212879988732b55/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/6546bcd6f7934a4bb49a18d567a5f675/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-aa3329c3c5a1c3d0/payload.json)'
