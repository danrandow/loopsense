map:
  id: race-132-opt-eval
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: kd 0.25 single-lever test
    notes: 'Iteration 1 baseline (replicated exactly in iteration 6, score 75.97)
      with kd raised from 0.2 to 0.25, the next untested point on the s-bend progress
      trend (kd 0.1 and 0.15 both about 0.155, kd 0.2 at 0.29). Every other field
      is unchanged, so the race isolates the kd effect.


      ### Rationale


      Evidence: iteration 6 reproduced the iteration 1 design exactly (score 75.9694,
      identical per-track metrics), so the baseline is reliable and the s-bend progress
      of 0.29 is repeatable for this design and seed set. Every lever tested since
      then lowered the score. kd is the only controller term that has moved s-bend
      progress: kd 0.1 gave about 0.155, kd 0.15 gave 0.155, and kd 0.2 gave 0.29.
      That trend is not yet resolved above 0.2, so kd 0.25 is the next untested point,
      as the Evaluator requested. kp 2.5 (iteration 3) left max_error at 0.062 to
      0.065, speed changes (1.2, 1.5) moved progress in opposite directions across
      tracks without fixing max_error, and sensor spacing or footprint changes cut
      progress. Max_error has stayed at about 0.061 to 0.065 on every track under
      every setting, so the off-track failure is not yet addressed by any lever. Change:
      kd 0.2 to 0.25, everything else unchanged (kp 2.0, ki 0, base_speed 1.4, weights
      -2..2, sensors at x -0.02..0.02 and y 0.04, sensor_size 0.012, last_direction
      line loss, same geometry). Expected result: if the s-bend progress trend continues,
      progress rises above 0.29 and steering_oscillation rises above 0.23, which trades
      jitter for progress. Hypotheses: (H1) kd 0.25 raises s-bend progress above 0.29
      while the oval stays near 0.16. (H2) If s-bend progress falls or oscillation
      grows past about 0.3 with no gain in progress, kd 0.2 is the optimum and the
      baseline should be kept for the final evaluation. (H3) max_error stays near
      0.06 to 0.065 regardless, so the remaining error is set by bend reach and dynamic
      lag. Measurements wanted: progress, line_loss_events and steering_oscillation
      per track, and max_error with its location on the s-bend and slalom.


      - [Open this output](iteration-10/entity0/versions/37297b9eb9bc42a9ac061562b1d888e3/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-1a6aaf7ceea3b3e8/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-4ed85e413178ea4f/payload.json)'
  - id: entityR1
    label: kd 0.25 single-lever test
    notes: 'Approves a one-lever test of kd 0.2 to 0.25 against the reproduced best
      baseline (75.97). The s-bend progress trend across kd 0.1, 0.15 and 0.2 (0.155,
      0.155, 0.29) makes 0.25 the next informative point, and the racing result will
      decide whether to keep it or revert to 0.2.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      candidate is the iteration 1 and 6 baseline (kp 2.0, ki 0, base_speed 1.4, last_direction,
      weights -2..2, sensors at x -0.02..0.02 and y 0.04, sensor_size 0.012) with
      kd moved from 0.2 to 0.25. Iteration 6 reproduced iteration 1 exactly (score
      75.97, s-bend progress 0.29), so the baseline is reliable. Across the kd tests,
      s-bend progress was 0.155 at kd 0.1 (iteration 2 and 3), 0.155 at kd 0.15 (iteration
      7), and 0.29 at kd 0.2 (iterations 1 and 6). kd 0.25 is the next untested point
      on that trend. The change is a single lever against the best raced design, and
      every other lever tried since iteration 1 (base_speed 1.2 and 1.5, kp 2.5, sensor
      spacing, sensor_size 0.016) lowered the score. max_error has stayed at 0.061
      to 0.065 under every setting, so the off-track failure is not yet addressed,
      and kd is the only lever that has moved s-bend progress. Read the next race
      in this order. (1) If s-bend progress rises above 0.29 and oval stays near 0.16,
      keep kd 0.25 as the new best and treat the trend as real. (2) If steering_oscillation
      on the s-bend rises above about 0.3 with no gain in progress, kd 0.2 is the
      optimum, so revert to kd 0.2 for the final evaluation. (3) If progress falls
      below about 0.22 on the s-bend, the trend has peaked, so return kd to 0.2. In
      every case, keep kp at 2.0 and base_speed at 1.4, since neither has moved max_error.


      ### Requested changes


      - If the next race shows s-bend progress above 0.29 with steering_oscillation
      at or below about 0.3, keep kd 0.25 and check whether kd 0.3 gives a further
      gain, since kd has been the only lever that raised s-bend progress (0.155 at
      kd 0.15, 0.29 at kd 0.2).

      - If s-bend progress falls below 0.29 or steering_oscillation grows past about
      0.3 without a progress gain, revert kd to 0.2, the value that held progress
      in iterations 1 and 6, and keep it for the final evaluation.

      - Keep kp at 2.0 and base_speed at 1.4 for this race. Iteration 3 (kp 2.5) left
      max_error at 0.062 to 0.065, and iteration 8 (base_speed 1.5) raised oval progress
      but cut s-bend progress from 0.29 to 0.167.


      - [Open this output](iteration-10/entityR1/versions/819eb665789e4ae8927e18959cdef07f/payload.json)

