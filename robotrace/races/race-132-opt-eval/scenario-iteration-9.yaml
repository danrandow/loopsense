overrides:
  entities:
  - id: entity0
    label: Baseline at base 1.4
    notes: 'Reverts base_speed from 1.5 to 1.4 on the best raced design (kp 2.0, kd
      0.2, iteration 1 and 6 baseline, score 75.97). Iteration 8 at 1.5 dropped s-bend
      progress from 0.29 to 0.167, which triggers the Evaluator''s speed-limit rule.


      ### Rationale


      Evidence from iteration 8 (base_speed 1.5, otherwise the iteration 1 and 6 baseline;
      score 68.89, below the 75.97 baseline). Oval progress rose (0.16 to 0.22), but
      s-bend progress fell from 0.29 to 0.167, and slalom line losses stayed at 2.0.
      Max_error stayed at 0.062 to 0.065 on every track, so the off-track failure
      did not move. This meets the Evaluator''s rule (2): s-bend progress fell below
      about 0.22 with max_error near 0.06, so speed is limiting the tightest bend.
      I return base_speed to 1.4. The candidate is therefore the iteration 1 and 6
      baseline, which is the best raced design (75.97) and reproduced exactly in iteration
      6. kp 2.0, kd 0.2, ki 0, last_direction, weights -2..2, sensors at x -0.02..0.02
      at y 0.04, sensor_size 0.012 and geometry are all unchanged. Expected result:
      about 76, with s-bend progress near 0.29 and oval near 0.16. Every lever tested
      so far that moved progress has lowered the score, so this is a safe scoring
      candidate. Hypotheses to check next: (H1) the s-bend progress of 0.29 depends
      on kd 0.2 damping, and kd is the only lever that has held it. (H2) Speed above
      1.4 helps the oval but hurts the s-bend, so the tightest bend limits base_speed.
      Measurements wanted: progress, line_loss_events and steering_oscillation per
      track, with max_error and where it peaks on the s-bend.


      - [Open this output](iteration-9/entity0/versions/11ec415f908b47a1868d4f58b9a369f4/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-eba23404bf05e71f/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-26f3eb2bc9878c6b/payload.json)'
  - id: entityR1
    label: Approve best baseline
    notes: 'Approved the unchanged iteration 1/6 design (score 75.97, reproduced exactly
      in iteration 6), the best raced candidate. Every alternative since then scored
      lower (iterations 2 to 5, 7 and 8), so racing the known best is the safest score
      for this iteration.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      candidate is the iteration 1 design, reproduced exactly in iteration 6 (score
      75.97, s-bend progress 0.29, oval 0.16, max_error about 0.061 to 0.065 on every
      track). It keeps kp 2.0, kd 0.2, base_speed 1.4, ki 0, last_direction, weights
      -2..2, sensors at x -0.02..0.02 and y 0.04, and sensor_size 0.012. Every alternative
      raced since then scored lower: base_speed 1.2 with kd 0.1 (iteration 2, 50.60),
      kp 2.5 with kd 0.1 (iteration 3, 49.59), wider sensor spacing (iteration 4,
      57.85), sensor_size 0.016 (iteration 5, 59.03), kd 0.15 (iteration 7, 57.61),
      and base_speed 1.5 (iteration 8, 68.89). Approving it races the best known design,
      which is the safest score for this iteration. Note that max_error has stayed
      at 0.061 to 0.065 under every controller and geometry tried, so the off-track
      failure is not fixed by the levers so far. Read the next race as follows. If
      it reproduces about 76, the baseline is confirmed and the next iteration should
      test a single lever against it. If progress falls clearly below 0.29 on the
      s-bend, the earlier result was partly seed-dependent and the design should be
      judged on all tracks together. Keep ki at 0 unless rms_error shows a steady
      offset.


      ### Requested changes


      - If the race reproduces about 76 with s-bend progress near 0.29, test kd 0.25
      with everything else unchanged. In the evidence, s-bend progress rose with kd:
      0.155 at kd 0.1 (iteration 2), 0.155 at kd 0.15 (iteration 7), and 0.29 at kd
      0.2 (iterations 1 and 6). kd 0.25 is the next untested point on that trend.

      - Keep kp at 2.0. Iteration 3 (kp 2.5, kd 0.1) left max_error at 0.062 to 0.065,
      so raising kp has not reduced the off-track error.

      - Do not raise base_speed above 1.4 yet. Iteration 8 (base 1.5, kd 0.2) raised
      oval progress from 0.16 to 0.22 but cut s-bend progress from 0.29 to 0.167,
      so speed trades one track against another. Compare any speed change against
      the s-bend and oval together.


      - [Open this output](iteration-9/entityR1/versions/b4bdd6aa857a4b86b344a76973bc3aa7/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/11ec415f908b47a1868d4f58b9a369f4/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-26f3eb2bc9878c6b/payload.json)'
