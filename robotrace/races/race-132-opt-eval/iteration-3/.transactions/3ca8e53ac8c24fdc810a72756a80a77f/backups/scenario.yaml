map:
  id: race-132-opt-eval
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: kp 2.5, speed 1.4, kd 0.1
    notes: 'Restores base_speed to 1.4, the level that gave iteration 1''s best progress,
      and keeps kd at 0.1 to hold oscillation down. Raises kp from 2.0 to 2.5 as the
      single modest step specified after iteration 2 showed oscillation below 0.15
      with max_error still near 0.06. Based on the iteration 1 and 2 race data.


      ### Rationale


      Evidence from iteration 2 (60 trials, all off_track, score 50.60, down from
      75.97 in iteration 1). Cutting base_speed 1.4 to 1.2 and kd 0.2 to 0.1 changed
      the results in two different ways. Progress fell sharply: s-bend 0.29 to 0.155,
      oval 0.16 to 0.10, slalom 0.115 unchanged. max_error did not improve, staying
      at 0.061 to 0.064 on every track. Line losses on the s-bend fell from 1.95 to
      1.0, but the slalom stayed at 2.0. Steering oscillation fell as predicted: s-bend
      0.23 to 0.14, slalom 0.14 to 0.14, oval 0.11 to 0.08. The lower kd did reduce
      jitter, but the lower speed cost most of the progress and did not move the failure
      point. The Evaluator''s rule for progress falling with no reduction in max_error
      therefore applies: return base_speed toward 1.4 and keep kd at 0.1. The Evaluator''s
      rule for oscillation below about 0.15 with max_error near 0.06 also applies
      (s-bend 0.14, slalom 0.14), so kp should rise in one modest step from 2.0 to
      2.5. Changes: base_speed 1.2 to 1.4 (restores the progress that iteration 1
      reached); kd stays at 0.1 (keeps the lower jitter); kp 2.0 to 2.5 (the one-step
      increase the Evaluator specified, aimed at pulling max_error below 0.06). Geometry,
      weights, ki and line_loss are unchanged so the kp effect can be read directly.
      Expected result: progress near iteration 1 levels (s-bend about 0.29, oval about
      0.16), steering_oscillation at or below about 0.15, and max_error falling from
      about 0.062 toward or below 0.06 on the oval and slalom. Hypotheses to test:
      (H1) the bend failure is driven by insufficient steering authority rather than
      speed, so kp 2.5 should reduce max_error and line losses; (H2) kd 0.1 keeps
      oscillation below 0.15 at speed 1.4; (H3) if oscillation rises above 0.15 with
      kp 2.5, the next step is kd 0.05 rather than further kp. Measurements wanted:
      max_error and its location on each track, line_loss_events per track (especially
      the slalom, which stayed at 2.0), steering_oscillation, progress per track,
      and completion_time if any run finishes.


      - [Open this output](iteration-3/entity0/versions/56211da20c5a446c9a9a6c4678298754/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-f1e5d624ebd2c9b2/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-ea14241e78f364b3/payload.json)'
  - id: entityR1
    label: 'Approve: slower, lower kd'
    notes: 'Approved the candidate with base_speed 1.2 and kd 0.1 (kp 2.0 unchanged),
      since both changes target evidence from iteration 1: line losses and max_error
      near 0.06, and oscillation of 0.23 on the s-bend. It is valid and the best cheap
      test of speed and kd, so it races now to get telemetry.


      ### Feedback


      Written before this candidate has raced. The evidence is iteration 1 (60 trials,
      all off_track, score 75.97, the best raced so far) and iteration 0 (score 26.04).
      In iteration 1, max_error stayed at about 0.061 to 0.065 on every track, line
      losses were about 2 per trial on the s-bend and slalom, and steering_oscillation
      rose to 0.23 on the s-bend and 0.14 on the slalom. Progress improved (s-bend
      0.04 to 0.29, oval 0.115 to 0.16), so the tighter sensors and kp 2.0 helped.
      The candidate makes two changes, both in the direction the evidence supports:
      base_speed 1.4 to 1.2, which tests whether speed is causing the early line loss,
      and kd 0.2 to 0.1, which tests whether derivative noise is causing the high
      oscillation. The sensor geometry, weights, kp and line_loss are unchanged, so
      each effect can be read from the race. Every field is inside its contract limits
      and the sensor and weight counts match. Nothing is obviously broken, so this
      is a valid, targeted step. Watch two things in the telemetry. First, progress
      may fall if the lower speed does not move the failure point later, since it
      is the main score driver while runs end off-track. Second, a lower kd may cut
      damping and push max_error back up. Next-step rules: if steering_oscillation
      falls and max_error stays near 0.06 with line losses low, raise kp in steps
      (2.0 to 2.5). If oscillation is still high with kd 0.1, lower kd to 0.05. If
      progress drops without a gain in max_error, return base_speed toward 1.4 and
      keep kd at 0.1. Keep ki at 0 unless rms_error shows a steady offset.


      ### Requested changes


      - After the race, if steering_oscillation falls below about 0.15 and max_error
      stays near 0.06, raise kp from 2.0 to 2.5 in one step (iteration 1 showed kp
      1.5 to 2.0 reduced max_error only slightly, so the next step should be modest).

      - If steering_oscillation is still above about 0.15 with kd at 0.1, lower kd
      to 0.05 (iteration 1 showed kd 0.2 coincided with oscillation of 0.23 on the
      s-bend).

      - If progress falls below the iteration 1 levels (s-bend 0.29, oval 0.16) with
      no reduction in max_error, return base_speed toward 1.4 and keep kd at 0.1,
      since speed then looks like a limit on the bend count and not the cause of line
      loss.


      - [Open this output](iteration-2/entityR1/versions/0ca364c0f88e44a182e21b863a9fb3e7/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/3b5e2a1ec2b0493d90eaed23ed41b0b1/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-4ed85e413178ea4f/payload.json)'
