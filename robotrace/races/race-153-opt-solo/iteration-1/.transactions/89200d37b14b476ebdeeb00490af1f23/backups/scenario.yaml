  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'Conservative first candidate: five sensors at 0.02 m spacing, base_speed
      1.4, kp 3.0, kd 0.1, no integral term, last_direction line recovery. No race
      data exists yet, so values are chosen from the contract ranges and the 1.5 m/s
      pace requirement; the observation request targets completion, speed, error and
      oscillation.


      ### Rationale


      Iteration 0 has no race telemetry yet, so this is a conservative baseline meant
      to finish the course and produce measurements. Speed: the run must cover about
      4-5 m in under 3 s (about 1.5 m/s average), so base_speed is set to 1.4, high
      enough to be near the required pace but below full voltage to limit wheel slip
      and overshoot on bends. Sensing: five sensors spread across the body at x =
      +0.04, +0.02, 0, -0.02, -0.04, placed 0.05 m ahead of the axle so they read
      the line before the wheels reach it. Sensor size 0.012 m (half the 25 mm tape
      width gives good coverage at this spacing). Weights are linear in x (1, 0.5,
      0, -0.5, -1), so signal equals the lateral tape offset in roughly sensor-spacing
      units and positive steers left as required. Control: kp = 3.0 gives about 1050
      PWM of wheel differential per unit of signal, enough to correct a 2 cm offset
      without saturating. kd = 0.1 adds mild damping against oscillation; ki = 0 avoids
      integral windup on bends. Line loss uses last_direction so the robot turns back
      toward the side it last saw the line. Geometry: wheel_track 0.12 m, wheel_radius
      0.03 m, body_width 0.12 m (a wider off-track limit gives more tolerance), body_length
      0.16 m, mass 0.8 kg. Hypotheses to test: (1) the robot completes the course
      with few line-loss events at this speed; (2) if steering_oscillation is high,
      kp is too large relative to kd; (3) if completion_time exceeds 3 s, base_speed
      must rise. Next measurements needed: completion, completion_time, rms_error,
      max_error, line_loss_events, steering_oscillation. Expected result: completion
      with moderate rms_error, with the speed/oscillation trade-off showing where
      to tune next.


      - [Open this output](iteration-0/entity0/versions/5b88e3d0a05c4d2297a1f0043f3d702c/payload.json)'
