  entities:
  - id: entity0
    label: Wider array, damped PD
    notes: 'Widens the sensor array to +/-0.06 m to cut line-loss events, lowers kp
      to 2.0 and raises kd to 0.3 with base_speed 1.2 to curb overshoot, and lightens
      the robot to 0.6 kg. Based on the baseline, where every trial went off track
      after about one line loss.


      ### Rationale


      Evidence from the iteration 0 baseline: all 60 development trials went off track.
      Progress was 0.04 on s-bend and slalom and 0.15 on oval, and max_error hit about
      0.06, which is the off-track limit. Line-loss events averaged about 1 per run,
      and steering oscillation was low (0.06-0.09). So the robot is not oscillating
      itself to death. It loses the line once, usually on a bend, and drifts off before
      it recovers. Likely causes: (a) the sensor array (x = +/-0.04 at 5 points) is
      too narrow, so a sharp bend moves the tape outside every sensor and triggers
      line loss; (b) kp = 3.0 with ki = 0 and kd = 0.1 gives a fast, lightly damped
      response that overshoots at 1.4 base speed. Changes: widen the array to x =
      +/-0.06 with 5 sensors (+0.06, +0.03, 0, -0.03, -0.06) so the tape stays visible
      through tighter bends and line loss is less likely; keep weights linear (1,
      0.5, 0, -0.5, -1) so the signal still means lateral offset. Reduce base_speed
      from 1.4 to 1.2 to cut overshoot and slip, which lowers the speed margin for
      the 3 s limit but protects completion first. Reduce kp from 3.0 to 2.0 and raise
      kd from 0.1 to 0.3 for a more damped response, since the baseline overshoots.
      Lower mass to 0.6 kg to reduce yaw inertia and make wheel commands act faster.
      Keep the geometry and line_loss choice otherwise. Expected result: fewer line-loss
      events and longer progress on all three tracks, with completion still uncertain.
      If progress is still low, the next step is to raise base_speed while keeping
      kd; if steering_oscillation rises, kd is too high. Hypotheses: (1) line-loss
      events fall below 1 per run with the wider array; (2) progress rises above 0.5
      on the s-bend. Next measurements: completion, progress, completion_time, rms_error,
      max_error, line_loss_events, steering_oscillation.


