  entities:
  - id: entity0
    label: Wider 7-sensor array
    notes: 'Widens the sensor span to ±0.08 m with 7 sensors and raises kp to 5.3
      to keep the same effective gain. This targets the slalom line losses and the
      s-bend drift seen in iteration 4, where the oval completed 20/20 but the other
      tracks left the course.


      ### Rationale


      Evidence from iteration 4 (score 358.7): the oval now completes in 20 of 20
      trials (progress 0.997, mean finish 2.04 s), so the basic tracking works. The
      s-bend (progress 0.23) and slalom (progress 0.10) still leave the course in
      every trial, with max_error at the 0.06 m off-track limit and rms_error about
      0.027. The slalom loses the line about once per run, so its weaves exit the
      5-sensor span at ±0.06 m. The s-bend has few line losses but drifts outward,
      so the robot is responding too slowly to bends. Hypothesis: the sensor span
      is too narrow for the sharper weaves and bends. Changes: (1) widen the array
      to 7 sensors spanning x = ±0.08 m (spacing 0.027 m, which keeps the 12 mm footprints
      overlapping the 25 mm tape). Weights stay linear (1, 0.67, 0.33, 0, -0.33, -0.67,
      -1), so the signal still means lateral offset. (2) Because the signal now changes
      by 1/0.08 per metre instead of 1/0.06, kp rises from 4.0 to 5.3 (about 4.0 ×
      0.08/0.06 ≈ 5.3) to keep the same effective steering gain on the oval. (3) kd
      rises from 0.6 to 0.7 to damp the higher gain. (4) ki, base_speed (0.85), mass,
      wheel_track, body and line_loss are unchanged, so the change is mostly the wider
      sensing and matched gain. Expected result: fewer line-loss events on the slalom
      (target below 0.5 per run) and s-bend progress above 0.4, with the oval still
      completing at 80% or more. Risk: the wider span may add oscillation on the oval;
      if steering_oscillation exceeds 0.4, reduce kp to 4.8 before touching kd. Remaining
      hypotheses to check next: whether base_speed can rise once the s-bend and slalom
      complete, since completion time then becomes the constraint.


