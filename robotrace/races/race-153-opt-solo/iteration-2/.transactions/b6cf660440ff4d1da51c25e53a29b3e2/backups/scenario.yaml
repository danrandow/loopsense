  entities:
  - id: entity0
    label: Integral + stiffer steer
    notes: 'Adds ki = 0.5 to cancel the steady motor-mismatch drift, raises kp to
      3.0 for bend tracking, and lowers base_speed to 1.0 to stay on the line. Geometry
      is unchanged from iteration 1 so the controller change is isolated. Based on
      consistent off-track failures with low oscillation and rms error of about 0.03.


      ### Rationale


      Evidence: both races ended off track in all 60 development trials. Iteration
      1 widened the array and softened the controller, and progress improved only
      slightly (s-bend 0.04 to 0.14, oval 0.15 to 0.14, slalom 0.04 to 0.10). Line
      loss is still about 0.85-1 event per run on s-bend and slalom. The off-track
      limit (max_error about 0.06-0.068) is reached while rms_error is only about
      0.024-0.03. Steering oscillation is low (0.06-0.14), so the robot is not jittering;
      it drifts steadily away from the line. The most likely cause is a steady bias:
      the fixed left/right motor mismatch pushes the robot one way, and with ki =
      0 a proportional controller holds a residual offset of roughly bias/kp. Bends
      add to this, and kp = 2 is probably too weak to hold a bend. Changes: (1) add
      a small integral term, ki = 0.5, to remove the constant motor-mismatch offset
      (the integral is capped at +/-2, so it cannot wind up badly); (2) raise kp from
      2.0 to 3.0 for stronger correction on bends; (3) keep kd = 0.3, which iteration
      1 showed to be well damped; (4) lower base_speed from 1.2 to 1.0 so the robot
      stays on the line through bends. Finishing time becomes the trade-off, but off-track
      failure dominates the score now, so completion comes first. Geometry is kept
      identical to iteration 1 so that the controller change is isolated. Hypotheses:
      (a) rms_error falls below 0.015 with ki > 0; (b) line_loss_events falls below
      0.5 per run; (c) progress on the s-bend exceeds 0.5. If progress rises but the
      robot still runs off, the next step is to raise kp further. If steering_oscillation
      rises above about 0.2, reduce kp or raise kd. If the run completes, the next
      step is to raise base_speed to bring completion_time under 3 s. Expected result:
      a first partial or full completion on oval and s-bend.


