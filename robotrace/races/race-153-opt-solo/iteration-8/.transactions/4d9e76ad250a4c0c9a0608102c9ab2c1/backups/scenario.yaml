  entities:
  - id: entity0
    label: Bigger sensors, kp
    notes: 'Reverts kp to 5.3 and kd to 0.8 because kp 6.5 cut s-bend finishes from
      18/20 to 7/20 without helping slalom. Enlarges sensor footprints to 16 mm to
      test whether slalom line loss, flat at progress 0.16 for three iterations, comes
      from tape leaving the sensors.


      ### Rationale


      Evidence from iteration 7 (score 499.5, below the iteration 6 best of 619.4).
      The oval still completes 20/20 (progress 0.998, 2.06 s, rms 0.009). The s-bend
      fell from 18/20 finishes (progress 0.96, iteration 6) to 7/20 (progress 0.74)
      when kp rose from 5.3 to 6.5. Slalom did not move: progress 0.160 to 0.167 to
      0.160 across iterations 5, 6 and 7, with about one line-loss event per run and
      0/20 finishes. So the kp increase overcorrected the bends and did nothing for
      slalom. Slalom''s failure is therefore not a steering-gain problem. It looks
      like sensing: the tape leaves the 12 mm footprints during sharp weaves, the
      sum of readings drops, and the line is lost. Changes: (1) revert kp to 5.3 and
      kd to 0.8, the values that gave the best s-bend result; (2) enlarge sensor_size
      from 0.012 to 0.016 m, the lever iteration 7 flagged for slalom. Larger footprints
      keep more sensors covering the tape during sharp weaves, which should reduce
      line loss. Sensor weights are normalised by the sum of readings, so the signal
      scale is unchanged. Geometry, ki, base_speed, mass, wheel_track and line_loss
      stay as in iteration 6, isolating the sensing change. Expected result: slalom
      line-loss events fall below 0.5 per run and slalom progress rises above 0.3.
      The s-bend should return to iteration 6 levels (about 0.9 finish rate) and the
      oval should keep finishing. Hypotheses: (a) slalom line_loss_events drop when
      sensor_size rises to 0.016; (b) s-bend completion recovers to at least 80% once
      kp returns to 5.3. If slalom stays flat, the next step is to test a wider sensor
      span or a lower base_speed on slalom, or to check whether line_loss ''search''
      options matter. Measurements needed next: per-track completion, progress, line_loss_events,
      max_error and steering_oscillation, especially on slalom.


