  entities:
  - id: entity0
    label: Higher gain for slalom
    notes: 'Raises kp from 5.3 to 6.5 and kd from 0.8 to 1.0 to correct the slalom
      weaves faster, keeping the geometry from iteration 6. Iteration 6 finished the
      oval 20/20 and the s-bend 18/20, but slalom stayed at progress 0.17 with about
      one line loss per run, which points to steering response as the limit.


      ### Rationale


      Evidence from iteration 6 (score 619.4): the oval completes 20/20 (2.07 s, rms
      0.014), and the s-bend completes 18/20 (progress 0.96, 2.68 s). Slalom is the
      failure: 0/20 finish, progress 0.17, about one line-loss event per run, and
      max_error at the 0.06 m off-track floor with rms about 0.027. Oscillation on
      slalom is low (0.21), so the robot is not jittering. It is responding too slowly
      to the alternating weaves and drifting out. The s-bend result shows that the
      speed and damping change (0.85 to 0.75, kd 0.7 to 0.8) fixed the bend slip,
      but slalom barely moved (0.165 to 0.167 progress). That suggests the limit on
      slalom is steering authority and response, not speed. Changes: kp 5.3 to 6.5
      for a stronger correction on each weave, and kd 0.8 to 1.0 to keep that gain
      damped. Geometry, sensor span, sensor weights, base_speed, ki and line_loss
      stay unchanged, so this iteration isolates the gain effect. Hypotheses: (a)
      slalom progress rises above 0.4 with the higher kp; (b) the oval still finishes
      in at least 90% of trials, with steering_oscillation under about 0.35 thanks
      to the extra kd; (c) line_loss_events on slalom fall below 0.5. Risk: the higher
      gain may oscillate on the oval. If oscillation exceeds 0.35 or the oval fails,
      the next step is kd up before kp is reduced. If slalom still exits with progress
      flat, the next lever is sensor_size 0.016 for wider tape coverage on sharp weaves.


