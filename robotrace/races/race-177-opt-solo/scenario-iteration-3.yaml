  entities:
  - id: entity0
    label: Stiffer steer, slalom fix
    notes: 'Raises kp to 4.2 and kd to 0.9, adds ki 0.05, and narrows wheel track
      to 0.09 to target the slalom off-track failure, while keeping base speed at
      1.2. Evidence: iteration 2 finished the oval and s-bend but the slalom reached
      only 31% progress with max_error 0.063 m.


      ### Rationale


      Evidence from iteration 2 (kp 3.5, kd 0.6, sensors at y 0.08, wheel_track 0.10,
      mass 0.5, base 1.2): the oval (100% finish, max_error 0.019) and s-bend (100%
      finish, max_error 0.030, 2.48 s) now pass. The slalom still fails in all 20
      trials, reaching only 31% progress and ending off track with max_error 0.063
      m, just over the 0.06 m limit. Steering oscillation on the slalom is low (0.19),
      so the robot is not jittering. It is lagging on the sharp alternating bends
      and drifting out. Body width cannot help, since the limit is 0.06 m at every
      allowed width. Line loss still occurs about once per run, and control_effort
      is high on the s-bend (10.9), so the controller is working hard but has too
      little authority or too little damping in the bends.


      Changes: (1) kp 3.5 to 4.2 for more steering per unit signal on the slalom''s
      tight alternations. The oval''s low oscillation (0.22) leaves margin for this.
      (2) kd 0.6 to 0.9 to damp the faster response and limit overshoot as the steering
      becomes more aggressive. (3) ki 0.0 to 0.05 to counter the fixed left/right
      motor mismatch, which causes a steady drift that a pure P-D controller holds
      as a small offset. The integral is capped at 2, so windup stays small. (4) wheel_track
      0.10 to 0.09 to raise the turn rate for the same PWM difference, which helps
      the robot turn into sharp bends. Base_speed stays at 1.2 because lowering it
      risks missing the 3 s finish on the s-bend, which took 2.48 s. Sensors, sensor
      size, mass and line_loss are unchanged, since they were not the bottleneck.


      Expected result: the slalom should lose the line less and progress further,
      with max_error below 0.06 m, and the oval and s-bend should still finish. Hypotheses:
      H1, if steering_oscillation rises above about 0.6 on the oval, kd is still too
      low for this kp, so raise kd toward 1.2. H2, if the slalom still ends off track
      with max_error near 0.06 and little line loss, the robot is entering bends too
      fast, so lower base_speed to about 1.1. H3, if line_loss_events stay at 1 per
      run at one fixed position, the search direction is the problem, so test search_right.
      Measurements wanted: progress and completion_time for speed margin, max_error
      and line_loss_events for steering margin, steering_oscillation and control_effort
      for damping.


