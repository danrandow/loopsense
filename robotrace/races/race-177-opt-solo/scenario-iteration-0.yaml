  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'Conservative first candidate: five 12 mm sensors spanning ±4 cm, proportional
      weights, kp 1.5, kd 0.1, base speed 1.6, last-direction line recovery. No race
      data yet, so values are chosen from the contract ranges to get a completing
      baseline.


      ### Rationale


      Iteration 0 has no race telemetry, so this is a conservative baseline built
      from the contract rather than from evidence. Geometry: five line sensors spread
      across x = -0.04 to +0.04 m (8 mm spacing of 2 cm) and placed 4 cm ahead of
      the axle, so they see the line before the wheels reach it. Sensor size 12 mm
      is a middle value that covers the 25 mm tape with a few sensors at once. Wheel
      track 0.12 m, wheel radius 0.03 m, body 0.12 x 0.18 m and mass 0.8 kg are mid-range
      values that keep yaw inertia moderate. Controller: sensor weights are proportional
      to sensor x (-2, -1, 0, 1, 2), so a positive signal (line on the left) steers
      left, as the contract requires. kp = 1.5 gives a moderate steering response
      (turn of about 1.5 per unit signal, 525 PWM per unit), kd = 0.1 damps the response,
      and ki = 0.02 is small to avoid integral windup on curves. base_speed = 1.6
      (PWM about 80 percent) targets the roughly 1.5 m/s average needed to finish
      within 3 s. line_loss = last_direction so the robot searches toward the side
      it last left the line. Expected result: completion on the oval and s-bend, with
      some oscillation on the slalom. Hypotheses to test: (1) speed is too high or
      kp too low if max_error grows on tight bends; (2) kd too low if steering_oscillation
      is high; (3) line-loss events indicate sensors too narrow or too few. Next measurements:
      completion_time and progress tell whether speed is sufficient, max_error and
      line_loss_events show steering margin, and steering_oscillation shows whether
      kd is adequate.


      - [Open this output](iteration-0/entity0/versions/657b78bffa1c431ca6ef5cd2e8cac15c/payload.json)'
