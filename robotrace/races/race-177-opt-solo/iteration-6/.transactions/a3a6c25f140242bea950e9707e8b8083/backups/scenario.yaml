  entities:
  - id: entity0
    label: Faster slalom, lighter
    notes: 'Raises base speed 1.1 to 1.15 and mass 0.5 to 0.45 kg to cut the slalom
      timeouts (14 of 20 in iteration 4) without the off-track rise seen at speed
      1.2. Steering gains are held so the change is attributable to speed and mass.


      ### Rationale


      Evidence from iteration 4 (base 1.1, kd 1.2, sensors at 0.025 m spacing, kp
      4.2, ki 0.05, wheel_track 0.09, mass 0.5). The oval (100% finish, 2.04 s, max_error
      0.013) and s-bend (100% finish, 2.43 s, max_error 0.030) pass with margin. The
      slalom improved from 0.49 to 0.80 progress and off-track endings fell from 17
      to 6. But the 14 timeouts show the slalom is now too slow to finish in 3 s,
      so the failure has moved from drifting off the line to running out of time.
      Speed and off-track risk trade off against each other on the slalom. Iteration
      3 (base 1.2) had 17 off-track endings and iteration 4 (base 1.1) had 6, so base
      speed drives off-track risk, and base 1.1 is too slow for the time limit. Steering
      authority (kp 4.2) and damping (kd 1.2) look adequate, since oscillation is
      0.15 to 0.36 and well below the 0.6 caution level.


      Changes: (1) base_speed 1.1 to 1.15, a midpoint between the two slalom outcomes,
      to recover progress without a large rise in off-track endings. (2) mass 0.5
      to 0.45 kg. Lower mass gives faster wheel acceleration and quicker yaw response,
      which should let the robot reach and hold speed on the alternating bends, which
      limits the timeouts. Geometry is otherwise unchanged, so the effect of the mass
      and speed change can be read. Steering gains are held so that the slalom result
      can be attributed to speed and mass.


      Expected result: slalom progress about 0.85 to 0.95 with a first few completions,
      off-track endings similar to or below iteration 4 (6 of 20), and oval and s-bend
      still finishing with completion_time near 2.2 s and 2.5 s. Hypotheses: H1, if
      slalom off-track endings rise above about 10 of 20, the base speed is too high
      for the bends, so return to 1.1 and raise kd to about 1.4. H2, if slalom still
      times out with progress near 0.8 and off-track endings stay low, the speed is
      still too low, so raise base to 1.25 and check the margin. H3, if line_loss_events
      remain about 1 per run at one fixed track position, the last_direction search
      is the limit, so test search_right next. Measurements wanted: slalom progress
      and completion_time for the speed margin, max_error and line_loss_events for
      steering margin, and steering_oscillation with control_effort for damping.


