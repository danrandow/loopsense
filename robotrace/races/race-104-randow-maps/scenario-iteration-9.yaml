map:
  id: race-104-randow-maps
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Narrow track, wide row
    notes: 'Holds the ±0.04 m 16 mm row and mass 0.8 kg from iteration 8 and changes
      only wheel_track to 0.10 m, the last untested geometry lever at kp 3.0. Iteration
      8 matched iteration 6 to four decimals, so row reach is not the limit, and the
      Integrator''s rule (c) points to wheel track.


      ### Rationale


      Iteration 8 (sensors at x = ±0.04 m, 16 mm footprints, y = 0.07 m, mass 0.8
      kg, wheel_track 0.12 m, wheel_radius 0.03 m) returned score 36.3097 and metrics
      identical to iteration 6 to four decimals on all three tracks: max_error 0.0614,
      0.0611 and 0.0694 m, one line-loss event per trial, and no finishes. Widening
      the row removed nothing, so the row reach is not the limit. Across spread, footprint,
      track, radius, lead and mass, the only change that moved the score is controller
      gain (kp 3.0), and it moved only the slalom. The line-loss mechanism on the
      oval and s-bend is unchanged. The Integrator''s rule (c) for this case is to
      test wheel_track 0.10 m on the new row to see whether more yaw response helps.
      Iteration 3 tested 0.10 m only at kp 2.0, so the combination with kp 3.0 is
      untested. I therefore keep the ±0.04 m, 16 mm row at y = 0.07 m with mass 0.8
      kg and change only wheel_track from 0.12 m to 0.10 m. This is the last geometry
      test I can justify. If the metrics match iteration 6 again, geometry is exhausted
      for this controller and the remaining levers are controller damping (kd near
      0.2) and base_speed, which are the Integrator''s to test. Mass 0.5 kg is rejected:
      it cut the score by 0.67 points by lowering slalom progress. Expected result:
      a yaw-response change should show up as a change in max_error or line_loss_events
      on the oval and s-bend. Most likely the metrics stay at the baseline.


      - [Open this output](iteration-9/entity0/versions/565ff031590746f6a69726f1a1828869/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-f5ef3a41561cfdca/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-b5ccae4b4a828b78/payload.json)'
  - id: entity1
    label: Track 0.10 m test, ±0.04
    notes: 'Single geometry change: wheel_track 0.12 to 0.10 m on the ±0.04 m row,
      with the iteration-8 kp 3.0 controller held fixed. Tests yaw response against
      the 36.3097 baseline, which iterations 6 and 8 matched to four decimals.


      ### Rationale


      Iteration 8 (±0.04 m, 16 mm row at y = 0.07 m, kp 3.0, mass 0.8 kg, wheel_track
      0.12 m) scored 36.3097 and matched iteration 6 to four decimals on all tracks.
      Widening the row removed no line loss, so the sensor reach is not the limit.
      Iteration 7 showed that mass 0.5 kg lowers the score, so mass stays at 0.8 kg.
      The only evidence that moves the score is kp 3.0, which helped on the slalom
      alone.


      The Builder asks for one geometry change: wheel_track 0.12 m to 0.10 m on the
      ±0.04 m row. I keep the iteration-8 controller exactly (kp 3.0, ki 0, kd 0.05,
      base_speed 1.6, last_direction) so the result isolates wheel_track. The weights
      stay at (-2, -1, 0, 1, 2), the iteration-8 scaling (x/0.02). These match the
      earlier steering gain per metre, and the Builder''s x/0.03 wording conflicts
      with the iteration-8 weights actually raced. I keep the iteration-8 weights
      so the comparison against score 36.3097 is clean. Iteration 3 showed that 0.10
      m alone at kp 2.0 gave no change, so this test checks the kp 3.0 combination.
      The Builder expects the metrics to stay near baseline. I do not claim an outcome.


      kd stays at 0.05 for this race. Changing kd now would confound the track test.
      If the metrics match the baseline, kd about 0.2 is the next controller test,
      aimed at the slalom oscillation of 0.16.


      - [Open this output](iteration-9/entity1/versions/20bfa38b5b74486aa027dae9c79a0d88/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/565ff031590746f6a69726f1a1828869/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-b5ccae4b4a828b78/payload.json)'
  - id: entityR1
    label: Geometry exhaustion rules
    notes: 'Feedback sets rules for the next race: if the metrics match iteration
      8, geometry is exhausted and kd about 0.2 is the next lever. Mass 0.5 kg (iteration
      7) and the wider row (iteration 8) both gave no line-loss change, so they are
      not repeated.


      ### Feedback


      Written before this candidate has raced. Iteration 8 (±0.04 m row, kp 3.0, wheel_track
      0.12 m) gave 36.3097, identical to iteration 6, so widening the row did not
      change the line-loss mechanism on the oval and s-bend. Iteration 7 (mass 0.5
      kg) lowered the score to 35.64, so mass 0.8 kg is kept. Iteration 6 (kp 3.0)
      is the only change that has moved the score, and only on the slalom (14.39 to
      45.18). The oval and s-bend still lose the line once, with max_error 0.061 m,
      which is just past the 0.06 m off-track floor. Your 0.10 m track is a yaw-response
      test, and iteration 3 showed a null effect at kp 2.0 with the narrower row.
      The combination with kp 3.0 and the ±0.04 m row is untested, so it is a fair
      test, but I make no claim about its outcome. The 0.10 m track raises yaw per
      unit turn, so slalom steering_oscillation is the risk to watch. Next-race rules:
      (a) if the metrics match iteration 8 or 6 to four decimals on all tracks, geometry
      is exhausted for this controller. Do not spend another iteration on geometry;
      move to kd near 0.2 with wheel_track 0.12 m. (b) If line_loss_events fall below
      one on the oval or s-bend, keep wheel_track 0.10 m and test kd near 0.2 to damp
      the slalom oscillation. (c) If line loss persists with max_error near 0.061
      m but steering_oscillation rises above the 0.16 seen at wheel_track 0.12 m,
      the narrower track is over-steering. Keep the controller at kd 0.2 and do not
      change geometry further.


      ### Requested changes


      - Hold the ±0.04 m, 16 mm row at y = 0.07 m with mass 0.8 kg and set wheel_track
      to 0.10 m. Iteration 8 (score 36.3097) is the baseline, and this race isolates
      wheel_track.

      - If the metrics match iteration 8 to four decimals, stop geometry changes.
      The next test is controller damping: kd about 0.2 at wheel_track 0.12 m, aimed
      at the slalom steering_oscillation of 0.16 seen in iteration 6.

      - If slalom steering_oscillation rises above 0.16 with zero line-loss change,
      keep the controller and test wheel_track 0.11 m as the midpoint. Iteration 3
      gave no gain at 0.10 m with the narrower row, so do not go below 0.10 m.


      - [Open this output](iteration-9/entityR1/versions/20bfa38b5b74486aa027dae9c79a0d88/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/565ff031590746f6a69726f1a1828869/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-b5ccae4b4a828b78/payload.json)'
