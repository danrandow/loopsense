map:
  id: race-104-randow-maps
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Narrow track, wide row
    notes: 'Holds the ±0.04 m 16 mm row and mass 0.8 kg from iteration 8 and changes
      only wheel_track to 0.10 m, the last untested geometry lever at kp 3.0. Iteration
      8 matched iteration 6 to four decimals, so row reach is not the limit, and the
      Integrator''s rule (c) points to wheel track.


      ### Rationale


      Iteration 8 (sensors at x = ±0.04 m, 16 mm footprints, y = 0.07 m, mass 0.8
      kg, wheel_track 0.12 m, wheel_radius 0.03 m) returned score 36.3097 and metrics
      identical to iteration 6 to four decimals on all three tracks: max_error 0.0614,
      0.0611 and 0.0694 m, one line-loss event per trial, and no finishes. Widening
      the row removed nothing, so the row reach is not the limit. Across spread, footprint,
      track, radius, lead and mass, the only change that moved the score is controller
      gain (kp 3.0), and it moved only the slalom. The line-loss mechanism on the
      oval and s-bend is unchanged. The Integrator''s rule (c) for this case is to
      test wheel_track 0.10 m on the new row to see whether more yaw response helps.
      Iteration 3 tested 0.10 m only at kp 2.0, so the combination with kp 3.0 is
      untested. I therefore keep the ±0.04 m, 16 mm row at y = 0.07 m with mass 0.8
      kg and change only wheel_track from 0.12 m to 0.10 m. This is the last geometry
      test I can justify. If the metrics match iteration 6 again, geometry is exhausted
      for this controller and the remaining levers are controller damping (kd near
      0.2) and base_speed, which are the Integrator''s to test. Mass 0.5 kg is rejected:
      it cut the score by 0.67 points by lowering slalom progress. Expected result:
      a yaw-response change should show up as a change in max_error or line_loss_events
      on the oval and s-bend. Most likely the metrics stay at the baseline.


      - [Open this output](iteration-9/entity0/versions/565ff031590746f6a69726f1a1828869/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-f5ef3a41561cfdca/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-b5ccae4b4a828b78/payload.json)'
  - id: entity1
    label: Wider row +/-0.04 m
    notes: 'Widens the 16 mm row to +/-0.04 m with weights scaled to x/0.02, keeping
      iteration-6 controller (kp 3.0) so the spread is the only change. Based on the
      iteration 6 and 7 results, with mass held at 0.8 kg.


      ### Rationale


      Iteration 6 (kp 3.0, mass 0.8 kg, y = 0.07 m, 16 mm, +/-0.03 m) is the best-scoring
      platform at 36.31. Its gain came from the slalom, while the oval and s-bend
      still end off track after one line-loss event with max_error near 0.061 m. Iteration
      7 (mass 0.5 kg) lowered the score to 35.64, so mass 0.8 kg is kept. The Builder''s
      iteration 8 geometry widens the row to +/-0.04 m at 16 mm, with sensors at y
      = 0.07 m. I keep the controller gains of iteration 6 (kp 3.0, ki 0, kd 0.05,
      base_speed 1.6, last_direction) so the spread is the only change. To keep the
      steering gain per metre of lateral offset equal to the earlier x/0.02 scaling,
      the weights are x/0.02: -2.0, -1.0, 0, 1.0, 2.0. The end weights sit at the
      +/-2 limit. The signal is a reading-weighted average, so its size is set by
      the weights, and this scaling keeps the earlier steering strength. Expected
      result, not measured: if the wider row reaches the tape earlier, line_loss_events
      on the oval and s-bend should fall. If the metrics match iteration 6 to four
      decimals, geometry is exhausted for this controller and the next lever is kd
      or base_speed.


      - [Open this output](iteration-8/entity1/versions/4647ae125a5149ee8ed7aef0bc3559bc/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/32d284912be643d390499be773079bde/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-49f8f0aa4eafce15/payload.json)'
  - id: entityR1
    label: Row-width test feedback
    notes: 'Feedback on the +/-0.04 m test, with rules for next race depending on
      whether line loss clears on the oval and s-bend. It cites iterations 0 to 7
      and states no outcome for this candidate.


      ### Feedback


      Written before this candidate has raced. Iterations 0 to 5 left max_error at
      0.060 to 0.061 m and line_loss_events at one per trial on the oval and s-bend,
      across spread (iteration 1), footprint (iteration 2), wheel track (iteration
      3), wheel radius (iteration 4) and lead (iteration 5, which matched iteration
      0). Iteration 6 (kp 3.0) raised the score from 26.04 to 36.31, but only on the
      slalom. Iteration 7 (mass 0.5 kg) lowered the score to 35.64, so mass 0.8 kg
      is the reference. Your +/-0.04 m, 16 mm row is the one spread not yet tested
      with kp 3.0. Next-race rules: (a) if line_loss_events fall below one on the
      oval or s-bend and max_error drops toward 0.06 m, keep the +/-0.04 m row and
      test kd near 0.2 to damp slalom steering_oscillation; (b) if the metrics match
      iteration 6 to four decimals, geometry is exhausted for this controller, so
      check the pipeline and move to kd or base_speed rather than another geometry
      change; (c) if line loss persists with max_error near 0.061 m, the row reach
      is not the limit, so test wheel_track 0.10 m with the new row to see whether
      more yaw response helps.


      ### Requested changes


      - Hold sensor_positions at x = -0.04, -0.02, 0, 0.02, 0.04 with y = 0.07 m and
      sensor_size 0.016 m, and keep mass 0.8 kg. This tests the wider row against
      the iteration-6 baseline (score 36.31).

      - If line_loss_events fall below one on the oval or s-bend, keep the wider row
      and try a lower wheel_track of 0.10 m. Iteration 3 used that value only with
      the narrower row, and the wider row gives the robot more tape reach to use.

      - If the metrics match iteration 6 to four decimals, stop geometry changes.
      The next lever is controller damping (kd about 0.2), which the Integrator will
      test, not a further row change.


      - [Open this output](iteration-8/entityR1/versions/4647ae125a5149ee8ed7aef0bc3559bc/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/32d284912be643d390499be773079bde/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-49f8f0aa4eafce15/payload.json)'
