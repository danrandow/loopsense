  - id: entity0
    label: Baseline 5-sensor
    notes: 'Symmetric five-sensor baseline at y=0.05 m with 12 mm footprints, 0.12
      m track and 0.8 kg body, chosen for line coverage and speed headroom. No race
      evidence yet, so this is a reasoned starting point with hypotheses to test.


      ### Rationale


      This is iteration 0, so there is no race telemetry or integration feedback yet
      and the geometry is a baseline, not a tuned design. The baseline needs to sense
      the line well at the speeds the course demands. The course must be covered in
      under 3 s, roughly 1.5 m/s or more, so the sensors should sit ahead of the axle
      to give the Integrator lead time to correct bends before the wheels reach them.
      Five sensors spread across about ±0.02 m cover the 25 mm tape with overlap,
      so the reading stays informative when the robot is slightly off centre and the
      signal does not saturate quickly. A 12 mm footprint is a compromise: small enough
      to resolve the tape edge, large enough to avoid dropouts from noise. The body
      is mid-sized, with a wheel track of 0.12 m for moderate turn authority and a
      0.03 m wheel radius for speed. Mass is 0.8 kg, which keeps yaw inertia modest
      for quick bends. Body width of 0.12 m gives a comfortable off-track margin:
      the limit is max(0.06, 0.0125 + 0.03), so 0.0425 m, not 0.06 m, so this margin
      is the binding constraint. Expected result: completion on the development tracks
      with few line-loss events, since the sensor baseline is symmetric and the spread
      is wide enough to keep the tape in view through the bends. The main risk is
      oscillation on the slalom from the lead distance, which I want measured.


      - [Open this output](iteration-0/entity0/versions/cf0685d504cb4e9db405f9ed7d39900a/payload.json)'
