map:
  id: race-104-randow-maps
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: 16mm footprint test
    notes: 'Keeps the ±0.03 m spread and changes only sensor footprint to 16 mm, to
      test whether extra tape visibility stops the early line loss. Iteration 1''s
      metrics matched iteration 0 exactly, so the spread alone is shown to have no
      effect.


      ### Rationale


      Iteration 1 changed the sensor spread from ±0.02 m to ±0.03 m, but its race
      metrics match iteration 0 to four decimal places on all three tracks (max_error
      0.0614, 0.0611, 0.0609; progress 0.115, 0.04, 0.035; identical score 26.0449).
      Either widening the spread had no effect on the robot''s behaviour, or the iteration
      1 race data duplicates iteration 0. Under either reading, sensor spread alone
      is not the binding limit, so I will not widen it further. The failure is early
      on every track (progress 0.035 to 0.115), and the robot leaves the 0.06 m off-track
      band about 1 line-loss event in, which suggests a fixed drift or steering-response
      problem near the start. Within geometry, the most direct lever left is the sensor
      footprint. Moving from 12 mm to 16 mm extends tape visibility by about 2 mm
      per side at every sensor, so the outer sensors keep reading the tape a little
      further out before a line loss. I keep the ±0.03 m spread so the change is isolated
      to footprint size. I keep the body, wheels and mass fixed. Expected result:
      line_loss_events fall toward zero and max_error drops below the 0.06 m limit
      on at least the s-bend and slalom. If the metrics again match iterations 0 and
      1 exactly, the next step is to verify the race data pipeline, not to change
      geometry.


      - [Open this output](iteration-2/entity0/versions/79c6c2ae1d66462c91c4d39eff9bb1af/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-9fbb0344a47498ad/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-9210119df577d901/payload.json)'
  - id: entity1
    label: 16mm footprint package
    notes: 'Complete robot with 16 mm sensors at ±0.03 m spread and gains held from
      iteration 1, isolating footprint size. Iteration 1 metrics matched iteration
      0 exactly, so the baseline evidence is weak and the race may be duplicated.


      ### Rationale


      Iteration 1 changed the sensor spread from ±0.02 m to ±0.03 m, but its race
      metrics match iteration 0 to four decimal places on all three tracks (max_error
      0.0614/0.0611/0.0609, progress 0.115/0.04/0.035, score 26.0449). Iteration 1
      also rescaled the sensor weights by 1.5, which should change the effective steering
      gain, yet the results are still identical. So the iteration 1 evidence cannot
      separate geometry effects from a duplicated or insensitive race. I treat the
      iteration 0 and 1 results as one data point, not two. The Builder''s iteration
      2 geometry changes the footprint from 12 mm to 16 mm at the ±0.03 m spread,
      keeping the lead at y = 0.05 m and the body, wheels and mass fixed. I build
      the controller for that exact geometry. Sensor weights stay at (-1.5, -0.75,
      0, 0.75, 1.5), matching the iteration 1 scaling (x/0.02), so the steering gain
      per metre of offset matches iteration 0. Because the signal is a reading-weighted
      average, this keeps kp = 2.0 at the same effective strength. Gains (kp 2.0,
      ki 0, kd 0.05, base_speed 1.6, last_direction) are unchanged so the race isolates
      footprint size. With 16 mm footprints, the outer sensors should see tape out
      to about 0.0485 m of offset, close to the 0.06 m off-track limit. Expected result:
      line_loss_events fall. I do not state the outcome, which is unmeasured.


      - [Open this output](iteration-2/entity1/versions/14914d301fac44779f487032ea771946/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/79c6c2ae1d66462c91c4d39eff9bb1af/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-9210119df577d901/payload.json)'
  - id: entityR1
    label: Footprint then spread
    notes: 'Feedback asks for the 16 mm footprint test first, with a conditional move
      to ±0.04 m spread or a lead change depending on line loss and oscillation. It
      flags the identical iteration 0 and 1 metrics as a possible data duplication,
      since no geometry change has produced any measured difference yet.


      ### Feedback


      Written before this candidate has raced. Iteration 0 (±0.02 m spread, 12 mm
      footprint) gave 100% off-track failure, one line-loss event per trial and max_error
      about 0.061 m, just past the 0.06 m off-track limit, which is the binding constraint
      (the body term is 0.0425 m). Iteration 1 (±0.03 m spread, 12 mm footprint) reproduced
      those metrics exactly to four decimals on all three tracks, so it gives no evidence
      that spread alone matters, and it may be a duplicate run. Your 16 mm footprint
      change is the next test. Do not read an outcome into it yet. Next-race rules:
      (a) if line_loss_events fall to zero on the s-bend and slalom but max_error
      still reaches about 0.06 m, the limit is steering response, not visibility,
      so the next change is gain (kp near 3.0 on the same geometry) rather than more
      geometry; (b) if line loss persists with the 16 mm footprint, the sensors still
      do not reach far enough, so widen the spread to ±0.04 m (keep 5 sensors) and
      scale the weights to match; (c) if the robot completes but steering_oscillation
      is high on the slalom, reduce the forward lead to y = 0.03 m, changing nothing
      else. If the new race matches iterations 0 and 1 exactly again, stop changing
      geometry and check the data pipeline first.


      ### Requested changes


      - Test sensor_size 0.016 m at the ±0.03 m spread (same positions, lead y = 0.05
      m) to extend tape visibility by about 2 mm per side. Iteration 1 at 12 mm reproduced
      iteration 0 exactly, so the footprint is the first lever to isolate.

      - If line_loss_events stay above zero with 16 mm, widen the spread to ±0.04
      m (x = -0.04, -0.02, 0, 0.02, 0.04) with weights scaled to x/0.02 (-2.0, -1.0,
      0, 1.0, 2.0), keeping sensor_size 0.016 m.

      - If the robot completes but steering_oscillation is high on the slalom, test
      forward lead y = 0.03 m with the spread and footprint fixed, to isolate the
      lead effect. Do not change the lead before the footprint result is known.


      - [Open this output](iteration-2/entityR1/versions/14914d301fac44779f487032ea771946/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/79c6c2ae1d66462c91c4d39eff9bb1af/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-9210119df577d901/payload.json)'
