map:
  id: race-104-randow-maps
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Mass 0.5 kg test
    notes: 'Holds the iteration 6 platform and changes only mass (0.8 to 0.5 kg),
      the last untested geometry lever. Iteration 6 showed line loss and max_error
      near 0.06 m on the oval and s-bend, so lower yaw inertia is tested as the next
      limit.


      ### Rationale


      Iteration 6 moved the score from 26.04 to 36.31. The gain is on the slalom (score
      14.39 to 45.18, progress 0.035 to 0.11), while the oval and s-bend still end
      off track after one line-loss event with max_error at 0.061 m. Five geometry
      families (spread, footprint, wheel track, wheel radius, lead) left max_error
      at 0.060 to 0.061 m, and the 0.06 m off-track floor binds because body_width
      cannot lift it. The Integrator''s rule (b) applies: line loss persists near
      0.06 m, so the next untested geometry lever is mass. Mass has never been tested,
      and a lower mass lowers yaw inertia, so the robot turns faster for the same
      turn command. I keep the iteration 6 geometry and change only mass, from 0.8
      kg to 0.5 kg, so any change against iteration 6 comes from mass. body_length
      is left alone because the contract says it has no dynamic effect. Expected result:
      max_error falls toward or below 0.06 m on the oval and s-bend and line_loss_events
      drop, but the slalom may show more steering oscillation because the robot is
      more responsive. If mass does not move the metrics, geometry is exhausted and
      the Integrator should focus on controller damping (kd) and base_speed.


      - [Open this output](iteration-7/entity0/versions/bb79e30bc63d4e7ab844671a937873e1/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-2cfa2a48241a688c/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-d159ceed27be8883/payload.json)'
  - id: entity1
    label: kp 3.0 gain test
    notes: 'Geometry frozen at the iteration-5 platform, with kp raised from 2.0 to
      3.0 as the only change. Six geometry iterations left max_error at 0.060 to 0.061
      m, and no gain has been tested since iteration 0.


      ### Rationale


      The frozen geometry is the iteration-5 platform: sensors at y = 0.07 m, x =
      -0.03 to +0.03 m in 0.015 m steps, 16 mm footprints, wheel_radius 0.03 m, wheel_track
      0.12 m, body 0.12 x 0.18 m, mass 0.8 kg. Iteration 5 matched the iteration-0
      baseline on every track (score 26.0449, max_error 0.0609 to 0.0614 m, one line-loss
      event per trial, no finishes). Across five geometry families (spread, footprint,
      wheel track, wheel radius, lead), max_error has stayed at 0.060 to 0.061 m.
      Iteration 4 moved the metrics slightly (score 25.7177), so the pipeline is live,
      and the lead test did not change the outcome. The controller has been unchanged
      since iteration 0 (kp 2.0, kd 0.05, ki 0), so no gain has ever been tested.
      I therefore make kp 3.0 the only change, as the Builder''s request asks. Steering
      turn per unit signal rises by 50 percent, and at a 0.03 m offset the differential
      reaches about 1575 PWM. ki stays 0 to avoid integral windup, and kd stays 0.05
      so that any oscillation rise can be attributed to kp. base_speed 1.6 and last_direction
      line-loss handling are unchanged. Expected result: if steering response is the
      limit, line_loss_events and max_error should move. This is a prediction, not
      a measured result.


      - [Open this output](iteration-6/entity1/versions/9b14a748e7c7446ea065fe28f4cd3814/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/1f6ebfc11d1644e5acfe1640c016ea46/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-ae5b8bbd384cbfb4/payload.json)'
  - id: entityR1
    label: Mass test if kp fails
    notes: 'Feedback gives rules for the kp 3.0 race and proposes mass 0.5 kg as the
      next geometry lever if line loss persists. It also warns that body_length has
      no dynamics effect, based on the contract.


      ### Feedback


      Written before this candidate has raced. Iterations 0 to 5 show that sensor
      spread (0.02 to 0.03 m, iteration 1), footprint (12 to 16 mm, iteration 2),
      wheel_track (0.10 to 0.12 m, iterations 0 and 3), wheel_radius (0.03 to 0.04
      m, iteration 4) and lead (y 0.05 to 0.07 m, iteration 5) have all left max_error
      at 0.060 to 0.061 m and line_loss_events at one per trial. Iteration 5 matched
      iteration 0 to four decimals, so the lead had no effect. Iteration 4 moved the
      metrics slightly (score 25.7177), so the pipeline is live. Geometry has not
      lifted the 0.06 m off-track floor. The controller has not been changed since
      iteration 0, so the next test is kp 3.0 on this frozen platform. Next-race rules:
      (a) if line_loss_events fall to zero and max_error drops below 0.06 m, keep
      this geometry and move to kd or base_speed on the controller. (b) If line loss
      stays at one with max_error near 0.06 m, the steering response is not the only
      limit, so mass is the next geometry lever. Note that body_length has no effect
      on dynamics or the off-track limit in the contract, so please do not spend a
      test on it. (c) If steering_oscillation rises sharply on the slalom with kp
      3.0, the controller needs damping, and geometry should not change.


      ### Requested changes


      - Hold geometry at the current frozen values (sensors at y = 0.07 m, 16 mm footprints,
      +/-0.03 m spread, wheel_radius 0.03 m, wheel_track 0.12 m, mass 0.8 kg) for
      the kp 3.0 race. Iterations 1 to 5 showed these values are not the binding limit,
      so this race isolates the controller gain.

      - If line_loss_events stay at one or more with max_error near 0.06 m under kp
      3.0, test mass 0.5 kg (the contract''s yaw inertia is mass times (body_length^2
      + body_width^2)/12, so lower mass gives faster yaw per unit turn). Keep all
      other geometry fixed. Mass has not been tested in any earlier iteration.


      - [Open this output](iteration-6/entityR1/versions/9b14a748e7c7446ea065fe28f4cd3814/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/1f6ebfc11d1644e5acfe1640c016ea46/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-ae5b8bbd384cbfb4/payload.json)'
