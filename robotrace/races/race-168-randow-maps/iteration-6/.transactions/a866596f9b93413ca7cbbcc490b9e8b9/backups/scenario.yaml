map:
  id: race-168-randow-maps
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Forward sensor row y=0.06
    notes: 'Moves the ±0.05 m sensor row from y=0.03 to y=0.06 m, changing only lookahead
      against the iteration 5 baseline. Four other geometry levers (span, track, radius,
      mass) left max_error pinned at about 0.061, so lookahead is the last untested
      sensor-row lever.


      ### Rationale


      Iterations 0 to 5 show a stable pattern. Line losses are removed by a sensor
      span of ±0.05 m or wider, but max_error stays pinned at 0.0601 to 0.0628 on
      every track. The off-track limit is max(0.06, 0.0125 + body_width/4), so body
      width cannot raise it within range. Oval progress is 0.115 in every design,
      so the failure point is almost fixed regardless of geometry. Four geometry levers
      have now failed to move the floor: span (±0.04 to ±0.06), wheel_track (0.10
      to 0.12), wheel_radius (0.03 to 0.035) and mass (0.8 to 0.6). Mass 0.6 gave
      a small gain on slalom max_error and a small loss on s-bend, with no net change,
      so it is not the lever. Iteration 5 (±0.05, 16 mm, y=0.03, 0.12 m track, 0.035
      radius, 0.6 kg) is the current best-controlled baseline, with score 26.99. The
      only geometry lever not yet isolated against this baseline is the sensor row''s
      forward position. Iteration 0 used y=0.05 but with a different span and footprint,
      so its result was confounded. I therefore move the row forward from y=0.03 to
      y=0.06 and change nothing else. The hypothesis is that more lookahead gives
      the controller earlier warning of the bend, so the robot starts correcting before
      reaching the 0.06 m edge. Expected result: max_error on oval and s-bend falls
      below about 0.058 with line_loss_events at 0. If the floor stays at 0.060 to
      0.062, sensor lookahead is also ruled out, and the next geometry test should
      be a much wider track (0.16 m) or a smaller footprint (0.008 m) to sharpen the
      edge signal.


      - [Open this output](iteration-6/entity0/versions/5eb5bb96a9114afda1f4f946a36fccf5/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-d236ba6f89e272ef/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-688e40e6ae1a0b37/payload.json)'
  - id: entity1
    label: Mass 0.6 kg test package
    notes: 'Iteration 4 geometry with mass cut from 0.8 to 0.6 kg, and the iteration
      4 controller held unchanged so the race isolates mass. The choice rests on iterations
      0 to 4 showing the max_error floor is untouched by span, track, radius and ki.


      ### Rationale


      The Builder''s proposal is iteration 4''s geometry with mass cut from 0.8 to
      0.6 kg, which is a single-lever test. Iteration 4 (±0.05 span, wheel_radius
      0.035, wheel_track 0.12, y 0.03, 16 mm) kept line_loss_events at 0 and gave
      oval max_error 0.0601, s-bend 0.062 and slalom 0.0621. Iterations 2 and 3 showed
      that ki 0.05 vs 0.5 and wheel_track 0.10 vs 0.12 gave identical metrics, so
      neither is a lever. The controller that raced in iteration 4 is kept unchanged
      (base_speed 1.6, kp 2.5, ki 0.5, kd 0.15, weights [-2,-1,0,1,2], last_direction).
      Changing any controller gain alongside the mass change would confound the test.
      Mass changes yaw inertia, not the sensed signal, so the same gains should still
      hold. The only expected effect is a faster turn response from the lower yaw
      inertia, which kd 0.15 can damp. Expected: if max_error on oval and s-bend falls
      below about 0.058 with line_loss_events at 0, mass is a real lever. If it stays
      at 0.060 to 0.062, the floor is not a mass effect. This is a hypothesis, not
      a result.


      - [Open this output](iteration-5/entity1/versions/d66df0d5ee594857827338cc782e4670/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/a16279c0909c46c6bebda87c479d89a8/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-782069e9a9d93674/payload.json)'
  - id: entityR1
    label: Mass then radius or span
    notes: 'Feedback ties the next change to the mass result: try 0.4 kg if max_error
      falls, wheel_radius 0.04 if it does not, and a ±0.045 span if slalom stays at
      0.035. Each request cites an earlier race.


      ### Feedback


      Written before this candidate has raced. Evidence: iterations 0 to 4 show max_error
      pinned at 0.0601 to 0.0621 on every track, whatever the span, footprint, lookahead,
      wheel_track or wheel_radius (iteration 4 moved oval only from 0.0614 to 0.0601).
      Iteration 3 matched iteration 2 exactly, so ki 0.05 vs 0.5 and wheel_track 0.10
      vs 0.12 did not move the floor. Line losses are fixed by a span of ±0.05 or
      wider (iterations 2 and 4). Slalom progress was 0.110 at ±0.04 (with line losses)
      and 0.035 at ±0.05 and ±0.06 (without). What I had to do in the controller:
      I kept the iteration 4 controller unchanged, so the mass test is not confounded.
      Lower mass reduces yaw inertia, so the robot may turn faster; kd 0.15 is kept
      to damp that. Next race: if max_error on oval and s-bend falls below about 0.058
      with line_loss_events still 0, keep mass 0.6 and try 0.4 kg next. If max_error
      stays at 0.060 to 0.062 and the response looks unchanged, mass is not the floor,
      so test wheel_radius 0.04 next. If line_loss_events rise above 0, return mass
      to 0.8 and restore ±0.05 span tuning.


      ### Requested changes


      - If max_error on oval and s-bend drops below about 0.058 with mass 0.6 and
      line_loss_events still 0, keep the span and try mass 0.4 kg, because the mass
      test is the only untested body lever and lower yaw inertia is the expected cause.

      - If max_error stays at 0.060 to 0.062 with mass 0.6, the mass floor is ruled
      out, so try wheel_radius 0.04 with the ±0.05 span, since iteration 4 showed
      a larger radius moved oval max_error slightly (0.0614 to 0.0601).

      - If slalom progress stays at 0.035 with the ±0.05 span, try outer sensors at
      ±0.045 with 16 mm footprints, because the ±0.04 span reached slalom progress
      0.110 in iteration 1 but with line losses, so a span between ±0.04 and ±0.05
      may keep both.


      - [Open this output](iteration-5/entityR1/versions/d66df0d5ee594857827338cc782e4670/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/a16279c0909c46c6bebda87c479d89a8/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-782069e9a9d93674/payload.json)'
