map:
  id: race-168-randow-maps
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Row y=0.05, span ±0.06
    notes: 'Moves the sensor row to y=0.05 and widens the outer sensors to ±0.06,
      the only untested combination after iteration 9 showed that base_speed 1.4 did
      not clear the s-bend and slalom losses. Evidence: iteration 2 (±0.06) removed
      losses at y=0.03, and iterations 6 to 9 show losses at forward rows with ±0.05
      to ±0.055.


      ### Rationale


      Iteration 9 held the iteration 8 geometry and cut base_speed to 1.4. Its score
      rose to 67.70, the best so far, but the line losses did not clear. s-bend logged
      0.9 losses per trial and slalom 1.0, the same as before. Oval progress rose
      to 0.242, but its max_error stayed at 0.0628, so the oval floor is unchanged.
      Speed is therefore not the cause of the losses. The Integrator''s rule for this
      case is to keep the controller and change geometry. The losses have appeared
      at every forward row tested with ±0.055 or ±0.05 (y=0.06 and y=0.045), and none
      appeared at y=0.03 with ±0.05. Iteration 2 showed that ±0.06 removed losses
      at y=0.03, and the ±0.06 span has not yet been tested at an intermediate row.
      I therefore move the row to y=0.05 and widen the outer sensors to ±0.06, keeping
      the 16 mm footprints and the 0.03 m spacing. Track, wheels, body and mass stay
      as in iteration 9, so the span and row change is the only geometry difference.
      I expect line losses to fall toward 0 on s-bend and slalom while s-bend progress
      stays near 0.14. The oval max_error floor at about 0.061 to 0.063 is unlikely
      to move, because the off-track limit of 0.06 m cannot be raised by body width
      within the allowed range.


      - [Open this output](iteration-10/entity0/versions/11cd8fd031c4410eb9a0ba1ccc12c3be/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-9bdd20e060acb965/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-a4c663679417b54a/payload.json)'
  - id: entity1
    label: Forward row y=0.05, ±0.06
    notes: 'Integrator package: Builder''s y=0.05, ±0.06 geometry with the iteration
      9 controller held fixed (base_speed 1.4), so only the sensing geometry changes.
      Speed was ruled out as the loss cause by iteration 9, which still lost the line
      at y=0.045.


      ### Rationale


      The Builder''s iteration-10 geometry moves the forward row to y=0.05 and widens
      the outer sensors to x=±0.06, keeping 16 mm footprints, 0.12 m track, 0.035
      m wheels, 0.6 kg mass and the 0.16 x 0.12 m body. Iteration 9 (y=0.045, ±0.055,
      base_speed 1.6 to 1.4) still logged 0.9 line losses on s-bend and 1.0 on slalom,
      so curve speed did not cause the losses. Iterations 6 to 8 showed the forward
      row is the source: y=0.03 gave zero losses, while y=0.045 to 0.06 gave roughly
      one per trial. The off-track floor (max_error about 0.061) has not moved under
      any geometry or gain change, so it is not treated as a lever. Because speed
      is ruled out, I keep the iteration 9 controller exactly (base_speed 1.4, kp
      2.5, ki 0.5, kd 0.15, weights [-2,-1,0,1,2], last_direction). That isolates
      the geometry change. The only controller-side question is whether losses remain
      at the intermediate row; if they do, the next step is geometric, not a gain
      change. Expected: line losses may fall if ±0.06 at y=0.05 covers the curve edge.
      I do not state a result.


      - [Open this output](iteration-10/entity1/versions/c66292eb72d4430ea2c0ae4809223a50/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/11cd8fd031c4410eb9a0ba1ccc12c3be/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-a4c663679417b54a/payload.json)'
  - id: entityR1
    label: Row and span fallbacks
    notes: 'Feedback gives three conditional next steps: return to y=0.03 with ±0.06
      if losses persist, narrow to ±0.055 if slalom progress drops, or bracket with
      y=0.04. Each ties to iteration 2, 5, 6 or 9 evidence.


      ### Feedback


      Written before this geometry has raced. Evidence: iteration 9 (y=0.045, ±0.055,
      base_speed 1.4) still had 0.9 line losses on s-bend and 1.0 on slalom, so curve
      speed is ruled out as the cause. Iteration 5 (y=0.03, ±0.05) had zero losses
      but s-bend progress of only 0.040. Iteration 6 (y=0.06, ±0.05) gave the best
      progress (s-bend 0.157) at the cost of about one loss per trial. What I had
      to do in the controller: I kept the iteration 9 gains and weights unchanged,
      so the geometry change is isolated. Span has not moved the oval floor (about
      0.061) in any iteration, and body width cannot raise the 0.06 m off-track limit
      within range, so I do not expect the floor to move. If line losses persist at
      y=0.05 with ±0.06, the loss is tied to the forward row itself, and the next
      move is back toward y=0.03 with ±0.06. If losses clear and s-bend progress holds
      near 0.14, the next test is span, not row.


      ### Requested changes


      - If line_loss_events stay at or above 0.9 on s-bend and slalom at y=0.05 with
      ±0.06, return the row to y=0.03 with ±0.06, because iteration 2 (y=0.03, ±0.06)
      had zero losses and iteration 6 to 9 showed that forward rows at 0.045 to 0.06
      always lost the line.

      - If line losses clear at y=0.05 but slalom progress falls below about 0.10,
      narrow the outer sensors to x=±0.055 at y=0.05, because iteration 1 (±0.04)
      reached slalom progress 0.110 and iteration 9 (±0.055) held 0.100 at the forward
      row.

      - If losses are cut in half but not removed, try y=0.04 with ±0.06 as a bracket
      between the zero-loss row y=0.03 and the lossy row y=0.045, because iterations
      5 and 9 bound the loss onset somewhere between those rows.


      - [Open this output](iteration-10/entityR1/versions/c66292eb72d4430ea2c0ae4809223a50/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/11cd8fd031c4410eb9a0ba1ccc12c3be/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-a4c663679417b54a/payload.json)'
