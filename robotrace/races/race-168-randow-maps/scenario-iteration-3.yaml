map:
  id: race-168-randow-maps
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Wider track 0.12 m
    notes: 'Keeps the ±0.06 m span that cut line losses to zero, and widens wheel_track
      from 0.10 to 0.12 m to reduce the mismatch-driven drift that pins max_error
      near 0.061 on every track. Iteration 2 showed the same floor in all designs,
      so the drift hypothesis is the one to test.


      ### Rationale


      Iteration 2 widened the outer sensors to ±0.06 m. Line-loss events fell from
      1 to 0 on all tracks, which confirms the span was limiting sensing. But the
      robot still left the track at max_error 0.0609 to 0.0614, the same floor as
      before, and slalom progress dropped from 0.105 to 0.035. Oval progress stayed
      at 0.115 across all three designs, so the failure point is not driven by sensing.
      Since every design leaves at about 0.061 m, the likely cause is a steady drift.
      The fixed left/right motor mismatch in the simulator produces a yaw rate that
      scales inversely with wheel_track, because turn rate is the wheel-speed difference
      divided by track. A wider track therefore lowers the drift for the same mismatch.
      Body width cannot help: the off-track limit is max(0.06, 0.0125 + body_width/4),
      which stays at 0.06 for any body up to about 0.19 m. I keep the ±0.06 span and
      16 mm footprints, since they removed the line losses, and keep y = 0.03 to limit
      lag. I change only wheel_track, from 0.10 to 0.12 m, as the Integrator''s requested
      next step. Expected result: line losses stay at 0, and max_error on bends drops
      below about 0.055 if mismatch drift is the cause. If max_error does not move,
      drift is not from track width, and the next test should be ki or a wider track
      (0.14 m). Slalom oscillation should stay near 0.15 or below, so the controller
      has room.


      - [Open this output](iteration-3/entity0/versions/8acfa7188f9849e4ae59c8e84bd42164/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-5ca6ab3e7b340fd5/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-e0ae08043b3bb394/payload.json)'
  - id: entity1
    label: Wheel track 0.12 + ki 0.5
    notes: 'Keeps the ±0.06 span and 16 mm sensors, widens the track to 0.12 m as
      the Builder proposed, and raises ki to 0.5 to cancel steady drift. Based on
      iteration 2''s max_error floor of 0.061 on every track and oval progress stuck
      at 0.115.


      ### Rationale


      Iteration 2 kept line losses at 0 with the ±0.06 m span, but max_error stayed
      at 0.0609 to 0.0614 on every track, which is the 0.06 m off-track limit being
      crossed. Oval progress was 0.115 in all three designs, so the first bend is
      still the failure point. Slalom progress fell from 0.105 (iteration 1, ±0.04
      m) to 0.035, so the wider span hurt slalom while fixing line loss. The uniform
      ~0.061 floor across tracks, plus the fixed left/right motor mismatch in the
      simulator, points to a steady lateral drift. With kp alone, a constant mismatch
      leaves a steady offset of mismatch/kp. ki = 0.05 is far too small to remove
      it. The Builder''s proposal is wheel_track 0.12 with the span, footprint and
      y row unchanged, which raises turn authority for the same wheel difference.
      I accept that geometry unchanged. On the controller side I raise ki from 0.05
      to 0.5 so the integral (clamped at ±2, so at most ±1 turn) can cancel the constant
      drift. I keep kp at 2.5 rather than cutting it, because slalom oscillation was
      0.159 at ±0.04 m and the wider span raises edge gain, but the integral is expected
      to remove the offset without adding much jitter. kd 0.15, base_speed 1.6 and
      last_direction are unchanged so this race isolates ki and the 0.12 m track.
      Expected: max_error below about 0.055 on oval and s-bend, and oval progress
      past 0.115. If max_error still sits at 0.061, drift is not the mismatch offset
      and the next step is wheel_track or wheel_radius rather than ki.


      - [Open this output](iteration-3/entity1/versions/4d85d754a5864106b8f526850b09ae44/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/8acfa7188f9849e4ae59c8e84bd42164/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-e0ae08043b3bb394/payload.json)'
  - id: entityR1
    label: Track and span next steps
    notes: 'Conditional next steps: wheel_track 0.14 or wheel_radius 0.035 if max_error
      stays at the floor, and ±0.05 span if slalom progress stays low. Tied to iteration
      1 vs 2, where span changed slalom progress from 0.110 to 0.035.


      ### Feedback


      Written before this candidate has raced. Iteration 2 (±0.06 m span, y = 0.03,
      16 mm, 0.10 m track) had line_loss_events 0 on all tracks, but max_error stayed
      at 0.0609 to 0.0614, the same floor as iteration 1, and oval progress stayed
      at 0.115. Slalom progress fell from 0.105 (iteration 1) to 0.035, so the wider
      span helped sensing but hurt slalom. Iteration 1 had steering_oscillation 0.159
      on slalom. What I had to do: I kept the span, footprint and y row so the wheel_track
      change is the only geometry difference. I raised ki from 0.05 to 0.5 to cancel
      a steady drift that kp alone cannot remove, and left kp at 2.5 because slalom
      oscillation was already near 0.16. Next race, if max_error on oval and s-bend
      drops below about 0.055 with progress past 0.115, keep wheel_track 0.12 and
      try the next step at 0.14. If max_error still sits at about 0.061, the drift
      is not a track-width effect, so change wheel_radius rather than widening further.
      If slalom progress stays near 0.035, the ±0.06 span is costing slalom, so test
      ±0.05 at y = 0.03.


      ### Requested changes


      - If max_error drops below about 0.055 on oval and s-bend with wheel_track 0.12,
      try wheel_track 0.14 with the ±0.06 span kept, because iteration 2 showed max_error
      pinned at 0.061 at 0.10 m and a wider track lowers yaw per unit of mismatch.

      - If max_error stays at about 0.061 with wheel_track 0.12, change wheel_radius
      to 0.035 (keeping wheel_track 0.12), because the floor did not move between
      iterations 1 and 2 when only the span changed and the track alone may not be
      the lever.

      - If slalom progress stays below about 0.06 with the ±0.06 span, reduce the
      outer sensors to x = ±0.05 at y = 0.03, because iteration 1 (±0.04) reached
      slalom progress 0.110 while iteration 2 (±0.06) reached 0.035 with line losses
      already at 0.


      - [Open this output](iteration-3/entityR1/versions/4d85d754a5864106b8f526850b09ae44/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/8acfa7188f9849e4ae59c8e84bd42164/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-e0ae08043b3bb394/payload.json)'
