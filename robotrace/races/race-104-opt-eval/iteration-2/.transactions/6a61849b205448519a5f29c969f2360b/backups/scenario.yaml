map:
  id: race-104-opt-eval
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Wider sensors, slower
    notes: 'Cut base_speed to 1.3 and kp to 1.6, raised kd to 0.5, and widened the
      sensor span to ±0.06 m. The baseline left the track on all 60 development trials
      with max_error about 0.062 m and about one line loss per run, so this targets
      bend tracking and line retention. Evidence: the baseline race telemetry in the
      history.


      ### Rationale


      Evidence: the baseline left the track on every development trial (60/60 off_track,
      0 finishes). Max error was about 0.062 m, just past the 0.06 m off-track limit,
      and line_loss_events averaged about 1 per run. Progress was 0.49 on the oval,
      0.22 on the s-bend and 0.11 on the slalom, so the robot is failing on bends,
      not stalling. The likely causes are (a) speed too high for the turn radius,
      so the robot overshoots and the tape leaves the 80 mm sensor span, and (b) too
      little damping, since kd 0.3 is low for kp 2.0. Changes: (1) base_speed 1.6
      to 1.3, the largest safe step I can justify without evidence of the speed-to-time
      mapping; a score without completion still earns up to about 440 from progress
      and tracking, so staying on track matters more than the 3.0 s limit right now.
      (2) kp 2.0 to 1.6 to reduce overshoot on bends. (3) kd 0.3 to 0.5 to damp the
      swing. (4) Sensor span widened from x = ±0.04 to ±0.06 (step 0.03 m, sensor
      size 0.012) so the line stays under a sensor on sharper bends and line loss
      events should fall. Weights stay -2, -1, 0, 1, 2 with the correct sign convention.
      Expected result: fewer or no off-track ends, progress above 0.5 on the s-bend
      and slalom, and a first finish possible on the oval. Hypotheses to test: line
      loss is mainly due to the narrow sensor span; speed is the main driver of max_error.
      Measurements wanted next: max_error and line_loss_events per track, progress,
      and completion_time, so I can judge whether base_speed should rise toward 1.5
      to meet the 3.0 s limit.


      - [Open this output](iteration-1/entity0/versions/bcbbda3ed1d7464b9a8cc0f35a6d7d8c/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-5c0767f426b0c878/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-314a6e529275a1b4/payload.json)'
  - id: entityR1
    label: 'Approve: slower, damped'
    notes: 'Approved the candidate as built: base_speed 1.6 to 1.3, kp 2.0 to 1.6,
      kd 0.3 to 0.5, sensor span widened to ±0.06 m. The baseline left the track on
      all 60 development trials with max_error about 0.062 m, so these changes target
      that failure, and the race will show whether they keep the robot on track.


      ### Feedback


      Approved to race unchanged. Iteration 0 is the only raced evidence: the baseline
      (base_speed 1.6, kp 2.0, kd 0.3, sensors at x = ±0.04) left the track on all
      60 development trials (20 per track), with max_error about 0.062 m against the
      0.06 m off-track limit, about one line-loss event per run, and progress of 0.49
      (oval), 0.22 (s-bend) and 0.11 (slalom). This candidate responds to that evidence
      in four ways: base_speed lowered to 1.3, kp lowered to 1.6, kd raised to 0.5,
      and sensor span widened to ±0.06 m. Each change addresses a specific failure,
      and the set is valid within the contract limits (sensor x within ±0.08, weights
      within ±2, line_loss an allowed option). The speed and damping changes are a
      sensible first step because the baseline failed on bends rather than stalling.
      The 3.0 s limit may not be met at 1.3, but completion is worth far more than
      time, so staying on track comes first. Nothing here is obviously broken, and
      the race is needed to show whether the changes help. After the race, read the
      telemetry as follows. If max_error stays above 0.06 m or runs still end off
      track, lower base_speed further (toward 1.1) before changing the gains. If the
      robot stays on track but progress is short or completion_time is above 3.0 s,
      raise base_speed in steps of about 0.1 while watching max_error. If line_loss_events
      remain above zero on the sharpest bends, test line_loss at search_left or search_right,
      matching the side the robot leaves the line.


      ### Requested changes


      - If the race shows off-track ends or max_error above 0.06 m, lower controller.base_speed
      from 1.3 toward 1.1 first, since the baseline''s speed of 1.6 left the track
      on every trial.

      - If the robot stays on track but completion_time is above 3.0 s or progress
      is short, raise controller.base_speed in steps of about 0.1 while watching max_error,
      and keep kp at 1.6 unless steering_oscillation rises.

      - If line_loss_events stay above zero on the tightest bends after the sensor
      widening to ±0.06 m, test controller.line_loss at search_left or search_right,
      matching the side the robot leaves the line.


