  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Base speed 1.0 candidate
    notes: 'Keeps the iteration 3 design (best so far, 471.07) and lowers base_speed
      from 1.1 to 1.0. The s-bend (mean max_error 0.0598 m) and slalom (0.0617 m)
      still exceed or sit on the 0.06 m limit, and speed has been the main driver
      of bend error.


      ### Rationale


      Evidence: iteration 3 (471.07, best so far) kept the iteration 1 geometry and
      set base_speed to 1.1. The oval now finishes 20 of 20 at a mean of 1.96 s, so
      there is room under the 3.0 s limit. The s-bend still ends off track in 17 of
      20 runs, with mean max_error 0.0598 m, right at the 0.06 m limit. The slalom
      has 0 finishes, progress 0.10 and max_error 0.0617 m, which is above the limit,
      and it records 0 line-loss events, so line loss is not the cause. The Evaluator''s
      rule for this case is to lower base_speed to 1.0, since speed has moved max_error
      in every iteration so far (1.6 to 1.3 to 1.1 each reduced bend error). Change:
      base_speed 1.1 to 1.0. Everything else stays fixed (geometry as iteration 1,
      kp 1.6, kd 0.5, ki 0, sensor_weights -2..2, line_loss last_direction) so the
      race isolates the speed effect. Expected result: s-bend and slalom max_error
      drop below 0.06 m, so more runs finish those tracks. The oval mean time should
      rise from about 1.96 s to about 2.2 s, still under 3.0 s. Risk: at speed 1.0
      the robot may be too slow to reach progress 0.995 on the slalom or stall. Next
      measurements: per-track finish rate, max_error and completion_time. If the oval
      time exceeds about 2.8 s, go back toward 1.05. If the slalom still exceeds 0.06
      m at 1.0, the next lever is kd, not speed.


      - [Open this output](iteration-4/entity0/versions/70bc7028bf4d49008b59c55a5ee66a6d/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-fa9824a6cf3d33e2/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-4681d7804bbbc450/payload.json)'
  - id: entityR1
    label: Approve speed 1.0 test
    notes: 'Approves iteration 3''s geometry with base_speed lowered from 1.1 to 1.0,
      a single-variable change. Speed reductions have lowered bend max_error in every
      raced iteration (iterations 0, 1 and 3), and the best score so far (471.07)
      is the baseline to beat.


      ### Feedback


      This candidate is the iteration 3 design (best so far, 471.07) with one change:
      controller.base_speed from 1.1 to 1.0. Iteration 3 finished the oval 20 of 20
      at a mean of 1.96 s, so the time limit has room. Its s-bend still ended off
      track in 17 of 20 runs with mean max_error 0.0598 m, right at the 0.06 m limit.
      Its slalom had 0 finishes, progress 0.10 and max_error 0.0617 m, with 0 line-loss
      events, so line loss is not the cause. Across iterations 0, 1 and 3, lowering
      speed has reduced bend max_error each time (1.6 to 1.3 to 1.1), while iteration
      2 showed that the sensor-spacing change was the source of its collapse. This
      candidate keeps the iteration 3 geometry and kp 1.6, kd 0.5, ki 0, sensor_weights
      -2..2 and last_direction, so the race isolates speed. The main risk is that
      at 1.0 the robot is too slow to reach progress 0.995 on the slalom or stalls,
      which would show as low progress with no off-track end. Nothing here is obviously
      broken, and the change is a single, well-supported step, so it should be raced.
      Read the telemetry as follows. If the oval completion_time exceeds about 2.8
      s, return toward 1.05. If the s-bend and slalom still show max_error at or above
      0.06 m at speed 1.0, the next lever is kd (for example 0.5 to 0.7), since kd
      was only varied together with other changes in iteration 2. If the slalom stalls
      with progress flat, try 1.05 before changing gains.


      ### Requested changes


      - If the s-bend and slalom still reach max_error at or above 0.06 m at base_speed
      1.0, raise controller.kd from 0.5 toward 0.7 with everything else fixed, since
      speed alone has not yet cleared the limit and kd has not been isolated.

      - If the oval completion_time rises above about 2.8 s, or the slalom stalls
      with progress flat, set controller.base_speed to 1.05, the midpoint between
      the best-scoring 1.1 and this 1.0 run.

      - Keep geometry.sensor_positions at the iteration 1 and 3 layout (x -0.06 to
      +0.06 in 0.03 m steps, y 0.05). The iteration 2 change to 0.04 m spacing and
      y 0.07 scored 62.76 with 2.8 line-loss events on the oval, so do not reintroduce
      it.


      - [Open this output](iteration-4/entityR1/versions/3e3fb6f9473f4d72b1ab93f1df4dfab0/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/70bc7028bf4d49008b59c55a5ee66a6d/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-4681d7804bbbc450/payload.json)'
