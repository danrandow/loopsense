overrides:
  entities:
  - id: entity0
    label: Narrow track to 0.09 m
    notes: 'Returns the ±0.06 m row and 12 mm footprint from the best-scoring iteration
      5 and narrows wheel_track from 0.10 to 0.09 m, which is the single turn-rate
      change the s-bend evidence supports. It reverts the ±0.07 row, which collapsed
      the oval in iterations 7 and 8. Iteration 9''s race output matches iteration
      8, so I flag a possible stale-design run.


      ### Rationale


      Evidence. Iteration 5 is the best design so far (386.35): wheel_track 0.10 m,
      five sensors at y=0.08 spanning x=±0.06, 12 mm footprints. It gave 20 of 20
      oval finishes and s-bend progress 0.42. Narrowing the track from 0.12 to 0.10
      m moved s-bend progress from 0.17 to 0.42, so turn rate per unit of steering
      is the s-bend lever. Iteration 6 (16 mm footprint) cut the oval finish to 0.55
      and did not fix the slalom, so footprint is rejected. Iterations 7 and 8 both
      widened the row to ±0.07 m. Their oval finish fell to 0.15 at 0.09 m and to
      0.45 at 0.10 m, so the widened row is the likely cause of the oval loss, and
      the track alone does not explain it.


      Iteration 9 needs a flag. Its produced geometry matches iteration 5 (±0.06,
      0.10 m), but its race result matches iteration 8 (±0.07 row) to four decimal
      places. The race may have run a stale design, so I cannot treat iteration 9
      as a clean test of the ±0.06 row. I therefore do not read iteration 9 as evidence
      for or against ±0.06 at 0.10 m.


      Decision. Keep the proven ±0.06 m row and 12 mm footprint. Change one variable:
      wheel_track 0.10 to 0.09 m. This is the turn-rate lever the s-bend evidence
      points to, and it isolates the track change from the row change that broke the
      oval in iterations 7 and 8. Body, wheels and mass stay the same. The off-track
      floor binds at 0.06 m for every body width, so body changes are not useful.
      Expected result: s-bend progress at or above 0.42 with max_error at or below
      0.061 m, oval finish at least 0.85. If the oval finish falls below 0.85 or steering_oscillation
      exceeds about 0.3, revert to 0.10 m in iteration 11, which is the known-good
      geometry. Slalom line loss (about one per run at progress 0.10) is still open.
      I will not change sensing for it until the track result is known.


      - [Open this output](iteration-10/entity0/versions/20a08ae4751a4845a268c72efe9b1e00/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-ee9056142a5a692e/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-3bb02139c72297e7/payload.json)'
  - id: entity1
    label: Complete Robot Package
    notes: 'Complete Robot Package. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      The Builder''s proposal (wheel_track 0.09 m, five sensors at y=0.08 spanning
      x=±0.06 m, 12 mm footprints) is the one-variable test of the turn-rate lever.
      Iteration 5 (0.10 m, ±0.06 m) is the only stable oval design, at 20 of 20 finishes,
      and moved s-bend progress from 0.17 to 0.42. Iteration 7 (0.09 m) collapsed
      the oval, but it also widened the row to ±0.07 m, and iteration 8 showed that
      row widening alone cuts the oval to 0.45 at 0.10 m. So the row, not the track,
      is the likely cause of the oval collapse, and 0.09 m with ±0.06 m is still untested.
      Iteration 9''s output matched iteration 8 because its geometry was the ±0.07
      m row, so there is no stale-design problem. The controller is held at iteration
      5''s best values (kp 5.0, ki 0.1, kd 0.8, weights -1.5/-0.75/0/0.75/1.5, base_speed
      1.6, last_direction). Iteration 4 showed that ki 0.3 lowers the oval finish
      rate, so ki stays at 0.1. Expected: s-bend progress at or above 0.42 with max_error
      near or below 0.061 m, and oval finish at least 0.85. If the oval falls below
      0.85 with oscillation above about 0.3, iteration 11 should return to 0.10 m.


      - [Open this output](iteration-10/entity1/versions/cc87784b1c764b0c9929f46070fb4ece/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/20a08ae4751a4845a268c72efe9b1e00/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-3bb02139c72297e7/payload.json)'
  - id: entityR1
    label: Integration Feedback
    notes: 'Integration Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Written before this robot has raced, so no outcome is stated for it. The evidence:
      iteration 5 (wheel_track 0.10, ±0.06 m row, 12 mm, kp 5, ki 0.1, kd 0.8, weights
      ±1.5/±0.75) gave 20 of 20 oval finishes and s-bend progress 0.42, with the slalom
      losing the line once per run. Iteration 8 (0.10 m, ±0.07 m row) fell to 9 of
      20 on the oval and 0.18 on the s-bend, so the wider row costs the oval. Iteration
      7 (0.09 m, ±0.07 m) fell to 3 of 20. Iteration 4 showed that ki 0.3 cut the
      oval finish rate, so controller authority is also a limit. Iteration 6 showed
      a 0.016 footprint is not the lever. The controller is held at iteration 5''s
      values, so the track change is the only variable. Decision rules for iteration
      11: if the oval finish rate is at least 0.85 and the s-bend progress is at or
      above 0.42, keep 0.09 m and try wheel_track 0.085 m or 0.08 m next. If the oval
      falls below 0.85, return to 0.10 m, which is the known-good geometry.


      ### Requested changes


      - If the oval finish rate is at least 0.85 and s-bend progress rises above 0.42
      with max_error near 0.061 m, keep the ±0.06 m row and narrow wheel_track to
      0.085 m, since the track is the turn-rate lever (iteration 5 moved s-bend progress
      from 0.17 to 0.42 for a 0.02 m reduction).

      - If the oval finish rate falls below 0.85 at 0.09 m with the ±0.06 m row, return
      wheel_track to 0.10 m, the known-good iteration 5 geometry. Iteration 7''s collapse
      was confounded by the ±0.07 m row, so the oval result here is the first clean
      test of the narrower track.

      - If the slalom still loses the line about once per run at 0.09 m, do not widen
      the row past ±0.06 m, because iteration 8 showed ±0.07 m costs the oval. Test
      sensor y spacing (for example, moving the row from y=0.08 to a tighter centre
      cluster at the same ±0.06 m span) instead.


      - [Open this output](iteration-10/entityR1/versions/cc87784b1c764b0c9929f46070fb4ece/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/20a08ae4751a4845a268c72efe9b1e00/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-3bb02139c72297e7/payload.json)'
