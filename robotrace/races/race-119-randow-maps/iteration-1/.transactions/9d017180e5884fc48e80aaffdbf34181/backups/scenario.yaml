map:
  id: race-119-randow-maps
  schema: v0.2
  scenario: Iteration 1
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 0.
dimensions:
  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Wider row, lower gain
    notes: 'Widens the sensor row from ±4 cm to ±6 cm, moves it 1 cm forward, and
      lowers the outer weights to ±1.0, cutting the steering gain by about a third.
      Iteration 0 went off track on every track with max_error just over 0.06 m and
      one line loss per run, and the body cannot widen the off-track limit, so the
      evidence points to sensing.


      ### Rationale


      Iteration 0 failed on all three development tracks: every run ended off track,
      with about one line-loss event and max_error of about 0.062 to 0.065 m, just
      over the 0.06 m limit. Progress was 0.53 on the oval, 0.27 on the s-bend and
      0.14 on the slalom. The failures are at the line edge, not from a stall, so
      the robot loses the line on bends. The controller turns the outer sensor weights
      (about 50 per metre of offset, clipped at ±2) into a large steering gain, and
      with kp=3 a small offset gives a big wheel differential. Together with the 8
      cm row, that means the robot sees the bend late and then overcorrects. The body
      does not help: the off-track limit is max(0.06, 0.0125 + body_width/4), which
      is still 0.06 m at the maximum body_width of 0.18 m, so body changes cannot
      widen the margin. The change is therefore in the sensing. I widen the sensor
      row to ±6 cm (the outer sensors sit 1 cm inside the body''s ±6.5 cm reach, within
      the allowed ±8 cm), move the row 1 cm further forward for look-ahead, and scale
      the weights to about 16.7 per metre (±1.0 at the outer sensors, ±0.5 at the
      inner pair). This follows the Robot Integrator''s first requested change: a
      wider row gives more warning on sharp bends. The lower weights reduce the steering
      gain by about a third, which targets the overshoot. The drivetrain, body and
      sensor size stay the same, so this race isolates the sensing change. Expected
      result: zero or one line-loss events, max_error below 0.06 m on the oval and
      s-bend, and a higher progress on the slalom.


      - [Open this output](iteration-1/entity0/versions/2c2240a670fb4c19a5fd723e8504a187/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-0c39c7177a5cbe8b/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-1eb818be74a60ee9/payload.json)'
  - id: entity1
    label: Wider row, gentler gains
    notes: 'Keeps the Builder''s wider ±6 cm row and 0.06 m look-ahead, and sets kp
      to 4.0 so the steering gain is about two-thirds of iteration 0 rather than a
      third. kd is raised to 0.6 to damp overshoot. Rests on iteration 0''s line loss
      and max_error of about 0.062 m.


      ### Rationale


      Iteration 0 (the only race so far) failed on all three development tracks. Every
      run went off track with one line-loss event and max_error of 0.062 to 0.065
      m, just over the 0.06 m limit. Progress was 0.53 on the oval, 0.27 on the s-bend
      and 0.14 on the slalom. The failures happen at the line edge on bends, not from
      a stall. The Builder''s geometry moves the sensor row to ±6 cm at y=0.06 and
      cuts the weights to 16.7 per metre (±1.0 outer, ±0.5 inner, 0 centre). That
      gives the robot more warning on sharp bends and lowers the signal gain. The
      Integrator''s concern is that this gain change may be too large. With kp=3 the
      effective steering gain falls to about 50 per metre, roughly a third of iteration
      0''s 150, which could leave the robot slow to correct on tight bends. I therefore
      set kp to 4.0, giving about 67 per metre, so the gain is still lower than iteration
      0 (to test the overshoot hypothesis) but not so low that the robot under-steers.
      ki stays low at 0.1 to avoid wind-up. kd rises to 0.6 to damp the overshoot
      seen as high oscillation risk. base_speed stays at 1.6 to keep the speed variable
      unchanged. line_loss stays ''last_direction'', which suits a line lost on one
      side of a bend. Expected result: no off-track exit on the oval and s-bend, with
      max_error below 0.06 m. If line loss persists, the next step is a longer look-ahead,
      not a wider row.


      - [Open this output](iteration-1/entity1/versions/c8bfd7da6bf34016ac9416445e9179a7/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/2c2240a670fb4c19a5fd723e8504a187/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-1eb818be74a60ee9/payload.json)'
  - id: entityR1
    label: Sensing-change feedback
    notes: 'Advises on the next race''s outcome. Iteration 0 showed one line loss
      per run and max_error near 0.062 to 0.065 m on all tracks, so the next race
      decides whether to widen the look-ahead or reduce the outer weights further.


      ### Feedback


      Written before this candidate has raced. Iteration 0 is the only evidence: one
      line-loss event per run and max_error of 0.062 to 0.065 m on all three tracks,
      with progress of 0.53 (oval), 0.27 (s-bend) and 0.14 (slalom). The failures
      happen on bends at the line edge, which points to late warning and overcorrection.
      The Integrator''s controller for this geometry uses kp=4.0 and kd=0.6, because
      the Builder''s lower weights (16.7 per metre) cut the steering gain sharply
      and would otherwise under-steer on tight bends. The controller therefore compensates
      for the lower sensor gain, so the sensing change is tested with a steering response
      close to iteration 0''s. The next race decides the following step. If line_loss_events
      is still at least 1 on the tightest bend with max_error near 0.06 m, the row
      width is not the limit: move the sensors forward to y=0.08 (the allowed maximum)
      and keep the ±6 cm spread. If the robot completes or stays on track with max_error
      below 0.06 m but steering_oscillation is high, reduce the outer weights to ±0.75
      and inner to ±0.375, keeping the spread. If line losses are gone but progress
      is still low on the slalom, the robot is too slow through bends, so keep the
      geometry and raise base_speed rather than changing the sensing.


      ### Requested changes


      - If line_loss_events is at least 1 with max_error near 0.06 m on the tightest
      bend, move the sensor row forward to y=0.08 with x kept at ±0.06, because iteration
      0''s 5 cm look-ahead gave too little warning and this is the longest look-ahead
      the contract allows.

      - If steering_oscillation is high while max_error stays below 0.06 m, reduce
      the outer weights to ±0.75 (inner ±0.375), because iteration 0''s outer weights
      of ±2 caused the overshoot and the Integrator''s kp of 4.0 has been set to compensate
      for the lower weights.

      - Keep the body_width at 0.12 or wider, because the off-track limit is max(0.06,
      0.0125 + body_width/4), which stays at the 0.06 m floor for every allowed body
      width, so body changes cannot widen the margin in iteration 0''s evidence.


      - [Open this output](iteration-1/entityR1/versions/c8bfd7da6bf34016ac9416445e9179a7/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/2c2240a670fb4c19a5fd723e8504a187/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-1eb818be74a60ee9/payload.json)'
