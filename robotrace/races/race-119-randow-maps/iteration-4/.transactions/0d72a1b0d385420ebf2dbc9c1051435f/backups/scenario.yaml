map:
  id: race-119-randow-maps
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 3 holds the geometry at iteration 2''s values and scored 340.07, up
      from 190.17. Oval is now the strongest track: 19 of 20 runs finished, progress
      0.976, max_error 0.034. Two tracks still fail. On the s-bend, all 20 runs left
      the track at progress 0.17, with max_error 0.0609 and only 0.05 line-loss events
      per run. The failure is therefore a drift past the 0.06 m off-track limit, not
      a loss of the line, so the Integrator''s wheel_track rule (which needs at least
      1 s-bend line loss with max_error near 0.06 m) is not triggered. On the slalom,
      the robot still loses the line once per run and leaves the track at progress
      0.10. Body and sensor changes cannot widen the off-track margin. The limit is
      max(0.06, 0.0125 + body_width/4), which is 0.06 m for every allowed body_width,
      since the maximum gives 0.0575 m. The Integrator is raising the outer weights
      to about ±1.5 with kp 5.0 and kd 0.8, which is the steering-authority test that
      iteration 3 was designed to isolate. I am holding the geometry at iteration
      3''s values (identical to iteration 2) so that this controller change is the
      only variable. A wheel_track or sensor_size change now would confound the result.
      Expected: the s-bend drift falls below 0.06 m and the s-bend finishes or gets
      further, the oval stays at 0.95 or higher finish rate, and the slalom line losses
      fall. If the s-bend still goes off track at about 0.061 m with near-zero line
      loss, the next geometry step is wheel_track 0.12 to 0.10 m, which gives more
      yaw per unit of steering command. If the slalom still loses the line with the
      sensors near zero on the outer pair, the next step is sensor_size 0.012 to 0.016.


      - [Open this output](iteration-4/entity0/versions/eb1e84f348e44cc9abb6061f7e3566a1/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-965229f2fcdef04f/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-9ffee73473e4a842/payload.json)'
  - id: entity1
    label: Steering authority ±1.5
    notes: 'Geometry held at iteration 2''s best values, with outer weights raised
      to ±1.5 and inner to ±0.75, kp 5.0 and kd 0.8. Iteration 2 lost the s-bend line
      once per run with max_error 0.0626, and iteration 1 showed that low weights
      under-steer.


      ### Rationale


      Iteration 2 is the best raced design (190.17). It had five sensors at y=0.08
      spanning x=±0.06, weights ±1.0/±0.5, kp 6.0 and kd 0.6. Its oval progress reached
      0.70, but the s-bend still lost the line once per run with max_error 0.0626,
      and the slalom went off track at progress 0.13. Iteration 1 showed that cutting
      the weights to ±1.0/±0.5 (about 16.7 per metre) under-steers, and iteration
      0 showed that ±2 outer weights at kp 3 overshoot with high oscillation. The
      Builder holds geometry at iteration 2''s values, so the geometry is passed through
      unchanged. For the controller I restore outer weights to ±1.5 and inner weights
      to ±0.75, which the Builder''s intent recommends. I set kp to 5.0 rather than
      6.0. The turn gain is kp times the weight, so 5.0 × 1.5 = 7.5 gives more authority
      than iteration 2 (6.0 × 1.0 = 6.0) but less than a 6.0 × 1.5 = 9.0 setting that
      would risk the overshoot seen in iteration 2''s oval oscillation (0.37). I raise
      kd from 0.6 to 0.8 to damp the extra gain, and keep ki at 0.1 and base_speed
      at 1.6 so that the only changes are steering authority and damping. line_loss
      stays ''last_direction'', which suited the one-sided losses seen so far. Expected
      result: line_loss_events on the s-bend falls below 1.0, oval progress stays
      at or above 0.70, and max_error at or below about 0.06 m.


      - [Open this output](iteration-3/entity1/versions/8f74bc39efb341abac581d562c866922/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/42a12d600b9b4dde8a2932a973fbea2a/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-69174f4270aa344e/payload.json)'
  - id: entityR1
    label: Track width and footprint
    notes: 'Feedback before the race: if the s-bend still loses the line, narrow wheel_track
      to 0.10 m to raise yaw per command, or enlarge sensor_size to 0.016 m. These
      follow from iteration 2''s s-bend loss and iteration 0''s overshoot.


      ### Feedback


      Written before this robot has raced. Iteration 0 (±2 outer weights, kp 3, y=0.05)
      gave one line loss per run and max_error 0.062 to 0.065 m on every track, so
      the steering gain was roughly right in size but the sensing was too short. Iteration
      1 (±1.0 outer weights, kp 4, y=0.06) cut oval progress from 0.53 to 0.36 and
      still lost the line on the s-bend (0.55) and slalom (0.25), so the lower weight
      scale under-steers. Iteration 2 (±1.0 weights, kp 6, y=0.08) was the best result
      at 190.17. Its oval progress was 0.70 and slalom losses fell to 0, but the s-bend
      still lost the line once per run at max_error 0.0626. Your geometry is held
      at iteration 2''s values, so the next race isolates steering authority. The
      Integrator is raising the outer weights to ±1.5 and kp to 5.0 with kd 0.8. Decide
      the next geometry change from the next race: if line_loss_events on the s-bend
      is still at least 1 with max_error near 0.06 m, the limit is turn rate per unit
      of steering command, not sensor reach. If steering_oscillation rises sharply
      while max_error stays below 0.06 m, the gain is too high for the current damping,
      so back off the authority rather than changing the sensors.


      ### Requested changes


      - If line_loss_events stays at 1 or more on the s-bend with max_error near 0.06
      m, reduce wheel_track from 0.12 to 0.10 m. Turn rate is the wheel speed difference
      divided by wheel_track, so a narrower track gives more yaw per steering command.
      This follows from iteration 2''s s-bend loss at a steering authority the controller
      could not reach.

      - If the line is still lost at the tight bend but the sensors read near-zero
      on the outer pair, increase sensor_size from 0.012 to 0.016 with the same spread.
      A larger footprint keeps more tape in view at the edge, which reduces the chance
      that all sensors fall below the 0.05 line-loss threshold, as the slalom and
      s-bend losses in iterations 1 and 2 suggest.

      - If steering_oscillation rises sharply on the oval with max_error below 0.06
      m, keep the geometry at iteration 2''s values and do not change the body. Iteration
      0 showed that high gain overshoots, and body_width cannot help because the off-track
      limit stays at the 0.06 m floor for every allowed body width.


      - [Open this output](iteration-3/entityR1/versions/8f74bc39efb341abac581d562c866922/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/42a12d600b9b4dde8a2932a973fbea2a/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-69174f4270aa344e/payload.json)'
