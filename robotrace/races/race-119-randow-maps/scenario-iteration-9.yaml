  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Revert to ±0.06 row
    notes: 'Returns the geometry to iteration 5''s best configuration (wheel_track
      0.10, row x=±0.06 at y=0.08, 12 mm sensors) because the ±0.07 row cut the oval
      finish rate to 0.45 in iteration 8, after the same effect in iteration 7. The
      slalom remains the open problem and is deferred to a later test.


      ### Rationale


      Iteration 8 tested the widened row (x=±0.07) at wheel_track 0.10 m, and it went
      backwards. Oval finish fell from 20 of 20 (iteration 5) to 9 of 20, and the
      s-bend progress fell from 0.42 to 0.18. The row change is the common factor,
      because iteration 5 had the same 0.10 m track with the ±0.06 row and was stable.
      Iteration 7 also fell when the row was widened, so the ±0.07 row is the likely
      cause of both oval collapses, not the track. The one benefit was slalom line
      losses falling from 1.0 to 0.0 per run, but the slalom still goes off track
      at progress 0.12, so the benefit is not enough to offset the oval and s-bend
      losses. The Integrator''s decision rule for this case is to return the row to
      ±0.06 at y=0.08. Iteration 5 is the best-scoring design (386.35) and the only
      one with a stable oval, so I return to its exact geometry: five sensors at y=0.08
      with x=-0.06, -0.03, 0, 0.03, 0.06, 12 mm footprints, wheel_track 0.10, wheels
      0.03 m, mass 0.7 kg, body 0.12 by 0.18 m. The off-track floor binds at 0.06
      m for every body width, so body changes stay out of scope. Expected result:
      oval finish at least 0.85 (near 1.0), s-bend progress near 0.42, and a score
      near iteration 5''s. The slalom remains the open problem, and the only geometry
      lever I have left untested at the 0.10 track is sensor spacing or count, which
      I would test only after the stable baseline is confirmed.


      - [Open this output](iteration-9/entity0/versions/1ee5b840520140daa201126272fd50b6/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-a4c2e3dec8621cc8/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-3bb02139c72297e7/payload.json)'
  - id: entity1
    label: Row ±0.07, track 0.10
    notes: 'Adopts the Builder''s iteration 8 geometry (track 0.10 m, row ±0.07 m)
      with iteration 5''s controller unchanged. Iteration 7 suggests the 0.09 m track
      caused the oval collapse, and this race isolates the wider row.


      ### Rationale


      Iteration 7 changed two geometry variables at once (wheel_track 0.10 to 0.09
      m and row x=±0.06 to ±0.07). Its oval finish fell from 20/20 to 3/20 and s-bend
      progress fell from 0.42 to 0.18, while slalom line losses fell from 1.0 to 0.0.
      Iteration 4 showed that extra controller authority also lowers the oval finish
      rate, so the narrower track is the likely cause of the oval collapse. Iteration
      5 (track 0.10, row ±0.06) gave 20/20 oval finishes and the best s-bend progress
      (0.42). Iteration 6 showed a 0.016 footprint cuts the oval to 0.55 without fixing
      the slalom, so footprint is rejected. I accept the Builder''s iteration 8 geometry:
      wheel_track back to 0.10 m, the row widened to x=±0.07 at y=0.08, and 12 mm
      footprints. This isolates whether the wider row alone keeps the oval stable
      while removing the slalom line losses. The controller is iteration 5''s best
      set, unchanged, because the row change keeps the same five sensor weights. Expected:
      oval finish at least 0.85, slalom line losses near 0 with progress above 0.12,
      and s-bend progress at or above 0.42. The main risk is that the wider row alone
      destabilises the oval, which the next race will show.


      - [Open this output](iteration-9/entity1/versions/5ea19f33d887449fbbdf97077f6d8a85/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/1ee5b840520140daa201126272fd50b6/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-3bb02139c72297e7/payload.json)'
  - id: entityR1
    label: Row test feedback
    notes: 'Feedback gives decision rules for the next race: keep the row if the oval
      holds, return to ±0.06 if it does not. Evidence comes from iterations 5, 6 and
      7.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      evidence is iteration 5 (track 0.10, row ±0.06, kp 5, ki 0.1, kd 0.8, weights
      ±1.5/±0.75): oval 20 of 20 finishes, s-bend progress 0.42, slalom one line loss
      per run at progress 0.10. Iteration 7 (track 0.09, row ±0.07) gave oval finish
      0.15, s-bend progress 0.18 and no slalom line losses. Iteration 6 showed footprint
      0.016 is not the lever. The controller is held at iteration 5''s values, so
      the track and row changes are the only variables. Decision rules for the next
      race: if the oval finish rate is at least 0.85 and slalom line losses are near
      0, the wider row is confirmed; the next lever is s-bend turn rate, with wheel_track
      0.09 retried only if the s-bend still exits near 0.061 m. If the oval finish
      rate is below 0.85, the wider row is the likely cause, so return the row to
      ±0.06 and address the slalom through controller base_speed or weights rather
      than sensing.


      ### Requested changes


      - Keep wheel_track at 0.10 m with the ±0.07 row and 12 mm footprint. Iteration
      5 gave 20 of 20 oval finishes at 0.10 m, while iteration 7 gave 0.15 at 0.09
      m, so 0.10 m is the track that isolates the row change.

      - If the oval finish rate stays below 0.85 with the ±0.07 row at 0.10 m, return
      the row to x=±0.06 at y=0.08. Iteration 5 kept the oval stable at ±0.06, and
      iteration 7 shows the wider row alone does not fix the oval.

      - If the oval finish rate reaches at least 0.85 and slalom line losses stay
      at 0, keep the ±0.07 row and try wheel_track 0.09 only if the s-bend still exits
      near 0.061 m. Iteration 5 moved s-bend progress from 0.17 to 0.42 when the track
      narrowed from 0.12 to 0.10 m.


      - [Open this output](iteration-9/entityR1/versions/5ea19f33d887449fbbdf97077f6d8a85/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/1ee5b840520140daa201126272fd50b6/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-3bb02139c72297e7/payload.json)'
