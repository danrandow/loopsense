map:
  id: race-119-randow-maps
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Revert track, keep wide
    notes: 'Returns wheel_track to 0.10 m after iteration 7''s oval collapse (finish
      0.15) and keeps the ±0.07 sensor row that cut slalom line losses from 1.0 to
      0.0. Based on iteration 7 race data and the Integrator''s decision rule for
      oval finish below 0.85.


      ### Rationale


      Iteration 7 scored 122.83, the second-worst result, and the evidence shows which
      change caused it. Oval finish fell from 1.0 (iteration 5) to 0.15, with 17 off-track
      exits and progress 0.38. Steering oscillation on the oval was low at 0.122,
      so the failure is not jitter. The s-bend also got worse, with progress falling
      from 0.42 to 0.18 and max_error at 0.065. On the slalom, line losses fell from
      1.0 to 0.0 per run, which supports the wider row x=±0.07. The slalom still went
      off track at progress 0.12 with max_error 0.0636, so the wider row helped sensing
      but did not complete the course.


      Iteration 7 changed two geometry variables at once: wheel_track 0.10 to 0.09
      m and the row x=±0.06 to ±0.07. The oval collapse and the s-bend regression
      point at the narrower track. A 0.09 m track gives about 11 percent more yaw
      per unit of steering command, and the oval finish rate already fell to 0.85
      when extra authority was added in iteration 4. The Robot Integrator''s decision
      rule (oval finish below 0.85 means return wheel_track to 0.10 and keep the row
      change) applies directly. I follow it.


      For iteration 8, I set wheel_track back to 0.10 m, the best-scoring track so
      far, and keep the widened row x=±0.07 at y=0.08 with 12 mm footprints. The row
      is the one change that removed slalom line losses, so keeping it isolates whether
      the oval collapse came from the track. Body, wheels, mass and sensor size stay
      as in iteration 5. The off-track floor still binds at 0.06 m for every body
      width, so body changes are not useful here.


      Expected result: oval finish back to at least 0.85 (ideally 1.0), slalom line_loss_events
      near 0 with slalom progress above 0.12, and s-bend progress at or above 0.42.
      The main risk is that the wider row alone reduces oval stability, which the
      measurements below will show.


      - [Open this output](iteration-8/entity0/versions/80afec91e1f4453b861b1aeaeb44543f/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-d59fea61e37e4155/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-755af9515fcd75e1/payload.json)'
  - id: entity1
    label: Narrow track, wider row
    notes: 'Reverts sensor size to 0.012, narrows wheel_track to 0.09 m and widens
      the sensor row to x=±0.07, with iteration 5''s controller held. Based on iteration
      5 (386.35) and iteration 6''s failed 0.016 footprint.


      ### Rationale


      Iteration 6 is the key evidence. Raising sensor_size to 0.016 cut the oval finish
      rate from 1.0 to 0.55 and left the slalom at one line loss per run, so the larger
      footprint is rejected. Iteration 5 (wheel_track 0.10, sensor 0.012, row at y=0.08
      with x=±0.06) remains the best design at 386.35: oval 20 of 20 finishes, s-bend
      progress 0.42. The s-bend still leaves the track at max_error 0.0624 with 0.1
      line losses, which is turn-rate limited, so I adopt the Builder''s wheel_track
      0.09 m. Iteration 5 showed the oval tolerates a narrower track, so 0.09 is a
      reasonable step, though it is the main risk. The slalom still loses the line
      once per run with x=±0.06, so the Builder''s row widening to x=±0.07 at y=0.08
      with sensor_size 0.012 gives the outer sensors more reach. Controller values
      are held at iteration 5 (kp 5.0, ki 0.1, kd 0.8, weights -1.5/-0.75/0/0.75/1.5,
      base_speed 1.6, last_direction). Kd stays at 0.8 to damp the extra yaw from
      the narrower track. Two geometry variables change (track and row width), which
      I accept with four iterations left. Expected: s-bend max_error at or below 0.061
      m, s-bend progress at or above 0.42, slalom line losses below 1.0, oval finish
      rate at or above 0.85. If the oval finish rate falls below 0.85 or steering_oscillation
      rises above about 0.3, revert wheel_track to 0.10 first.


      - [Open this output](iteration-7/entity1/versions/14dc95bd655444d9b0eba21db907fcaf/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/171d2c4c77384593bc327da44c75f7d7/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-748eee7be133d643/payload.json)'
  - id: entityR1
    label: Track and row next steps
    notes: 'Feedback written before the race: keep the controller fixed, and revert
      wheel_track to 0.10 if the oval finish rate falls below 0.85. Iteration 6 rejected
      the larger footprint.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      evidence is iteration 5 (wheel_track 0.10, sensor 0.012, row x=±0.06 at y=0.08,
      weights ±1.5/±0.75, kp 5, kd 0.8) at 386.35: oval 20 of 20 finishes, s-bend
      progress 0.42 with max_error 0.0624, slalom one line loss per run at progress
      0.10. Iteration 6 (sensor_size 0.016) cut the oval finish rate to 0.55 and left
      the slalom at one loss per run, so the footprint change is rejected. The controller
      is held at iteration 5 values, so your wheel_track and row changes are the only
      variables. Decision rules for the next race: if the oval finish rate falls below
      0.85 or steering_oscillation rises above about 0.3, the extra yaw from the narrower
      track is overshooting, so return wheel_track to 0.10 and keep the row change.
      If the s-bend still leaves the track at about 0.061 to 0.062 m with line losses
      near zero, the turn-rate limit is not yet cured, and the next step is a wheel_track
      of 0.08 m (the contract minimum) only if the oval is stable. If the slalom still
      loses the line about once per run with the outer sensors near zero, move the
      outer pair to x=±0.08 (the contract limit) before any footprint change.


      ### Requested changes


      - If the oval finish rate falls below 0.85 or steering_oscillation rises above
      about 0.3, change wheel_track from 0.09 back to 0.10 m. Iteration 5 showed 0.10
      keeps the oval at 20 of 20 finishes, and iteration 4 showed extra authority
      lowers the finish rate.

      - If the s-bend still leaves the track at max_error about 0.061 to 0.062 m with
      line_loss_events near 0, and the oval is stable, try wheel_track 0.08 m. Iteration
      5 moved s-bend progress from 0.17 to 0.42 for a 0.02 m track reduction, so a
      further step is the next turn-rate lever.

      - If the slalom still loses the line about once per run with the outer sensors
      near zero, move the outer pair to x=±0.08 at y=0.08 with sensor_size 0.012.
      Do not raise sensor_size: iteration 6 showed 0.016 hurts the oval (finish 1.0
      to 0.55) without fixing the slalom.


      - [Open this output](iteration-7/entityR1/versions/14dc95bd655444d9b0eba21db907fcaf/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/171d2c4c77384593bc327da44c75f7d7/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-748eee7be133d643/payload.json)'
