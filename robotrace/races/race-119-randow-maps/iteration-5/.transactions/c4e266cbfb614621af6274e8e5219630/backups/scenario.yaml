map:
  id: race-119-randow-maps
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Narrower track 0.10 m
    notes: 'Narrows wheel_track from 0.12 to 0.10 m to add yaw per unit of steering,
      because the s-bend leaves the track at max_error 0.0609 with almost no line
      loss (iteration 4). Sensors and body are held at iteration 3 values so the s-bend
      change is isolated.


      ### Rationale


      Iteration 4 held the geometry at iteration 3''s values, so its result isolates
      the controller change. The oval finish rate fell from 0.95 to 0.85 and the score
      fell from 340.07 to 319.08, but max_error on the oval stayed low (0.036) and
      the s-bend still left the track on all 20 runs at max_error 0.0609 with only
      0.10 line-loss events per run. The s-bend failure is therefore a drift past
      the 0.06 m limit with the line still held, not a lost line. That is the condition
      the Integrator''s rule names for a turn-rate limit: the robot cannot yaw fast
      enough per unit of steering command. Body changes cannot widen the limit, since
      max(0.06, 0.0125 + body_width/4) stays at 0.06 m for every allowed body_width.
      Following that rule, I narrow wheel_track from 0.12 to 0.10 m. The turn rate
      is the wheel speed difference divided by wheel_track, so the same steering command
      gives about 20 percent more yaw. I hold sensor_size at 0.012 and the sensor
      row at iteration 3''s values, so the s-bend result isolates the track change.
      The slalom line loss (1.0 per run, progress 0.10) is a separate limit; I do
      not change sensor_size in the same race, because that would confound the s-bend
      result and the outer-sensor readings have not been reported. The oval finish-rate
      drop is probably a controller authority issue, which the Integrator is handling,
      so it is not a geometry change. Expected result: s-bend max_error falls below
      0.06 m or the s-bend progress rises above 0.17, and the oval finish rate holds
      at or above 0.85. If the s-bend still exits at about 0.061 m, the next step
      is sensor_size 0.016 for the slalom coverage problem.


      - [Open this output](iteration-5/entity0/versions/d922b9302e674cf9b0ee9cd847547d1d/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-49471cd465c800c0/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-98ed8acc06861851/payload.json)'
  - id: entity1
    label: Hold geometry, add ki 0.3
    notes: 'Geometry is held at iteration 3''s best values, and ki rises from 0.1
      to 0.3 to test whether the integral term removes the steady s-bend drift (max_error
      0.0609, 0.05 line losses). Evidence is the iteration 3 outcome table.


      ### Rationale


      Iteration 3 is the best raced design (340.07). Oval finished 19 of 20 runs,
      the s-bend exits off track at max_error 0.0609 with almost no line loss (0.05
      per run), and the slalom loses the line once per run. The geometry is held at
      iteration 3''s values, as the Builder requested. The steering-authority controller
      (outer weights ±1.5, inner ±0.75, kp 5.0, kd 0.8) is kept. The one change is
      ki from 0.1 to 0.3. The s-bend failure is a steady drift to 0.061 m with little
      line loss, which points to a constant bias. The fixed left/right motor mismatch
      from the disturbance model is the likely source, and the integral term is the
      contract''s tool for removing a steady offset. ki stays well inside the integral
      limit of ±2, and iteration 0 used ki 0.2 without windup on the oval. Expected:
      s-bend max_error falls below 0.06 m, and the oval finish rate stays at 0.95
      or higher. If the slalom still loses the line with near-zero outer readings,
      the next step is sensor_size 0.016, not more gain.


      - [Open this output](iteration-4/entity1/versions/0d72a1b0d385420ebf2dbc9c1051435f/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/eb1e84f348e44cc9abb6061f7e3566a1/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-9ffee73473e4a842/payload.json)'
  - id: entityR1
    label: Decision rules for iter 5
    notes: 'Hold geometry at iteration 3''s values and tie the next change to the
      next race: wheel_track 0.10 for an s-bend drift, sensor_size 0.016 for slalom
      line loss, or lower weights if oval finishes fall. Evidence is iterations 0
      to 3.


      ### Feedback


      Written before this robot has raced. Iteration 3 (±1.5/±0.75 weights, kp 5.0,
      kd 0.8, geometry at iteration 2''s values) gave the best result so far at 340.07.
      Oval finished 19 of 20 runs, but the s-bend still left the track on all 20 runs
      at max_error 0.0609 with only 0.05 line losses per run, and the slalom lost
      the line once per run and went off track at progress 0.10. Because the s-bend
      loss is a drift past the 0.06 m limit and not a lost line, I am testing ki rather
      than geometry first. The motor mismatch in the disturbance model produces a
      steady bias, which the integral term can cancel. Hold the geometry exactly at
      iteration 3''s values for this race. Next race decision rules: if the s-bend
      still exits at about 0.061 m with near-zero line loss, the limit is turn rate
      per unit steering, so try wheel_track 0.10. If the slalom still loses the line
      while the outer pair reads near zero, try sensor_size 0.016 with the same spread.
      If the oval finish rate falls below 0.95 while max_error stays under 0.06 m,
      the authority is too high and the weights should come back toward ±1.25.


      ### Requested changes


      - If the s-bend still goes off track at max_error of about 0.061 m with line_loss_events
      near 0 (iteration 3: 0.0609 and 0.05), change wheel_track from 0.12 to 0.10
      m. Iteration 3 shows the drift is turn-rate limited, and a narrower track gives
      more yaw per unit of steering.

      - If the slalom still loses the line once per run with the outer sensors reading
      near zero (iteration 3: 1.0 losses, progress 0.10), change sensor_size from
      0.012 to 0.016 with the same x spread of ±0.06 and y of 0.08. Iteration 2 shows
      the row reaches the tape edge, but the small footprint can drop below the 0.05
      line-loss threshold.

      - If the oval finish rate falls below 0.95 while max_error stays under 0.06
      m (iteration 3: 19 of 20 finished), keep the geometry unchanged and reduce the
      outer weights to ±1.25 (inner ±0.625). Iteration 0 showed that high outer gain
      produces overshoot.


      - [Open this output](iteration-4/entityR1/versions/0d72a1b0d385420ebf2dbc9c1051435f/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/eb1e84f348e44cc9abb6061f7e3566a1/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-9ffee73473e4a842/payload.json)'
