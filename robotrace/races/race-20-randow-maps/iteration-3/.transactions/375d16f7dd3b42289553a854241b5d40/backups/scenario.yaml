    notes: 'Updated sensor size, body length, and body width to improve line tracking
      and reduce line loss events.


      ### Rationale


      The telemetry indicates a high number of line loss events (2) and a low progress
      score (0.0825), suggesting that the current geometry is not effective. To improve
      performance, I am changing the sensor size to 0.016, body length to 0.2, and
      body width to 0.15. These adjustments are expected to enhance line tracking
      and reduce line loss events, leading to better overall progress in future trials.


