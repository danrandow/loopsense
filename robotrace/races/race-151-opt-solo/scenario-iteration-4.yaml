  entities:
  - id: entity0
    label: Lower kp, more kd
    notes: 'Cuts kp from 6.0 to 5.0 and raises kd to 1.8 to stop the oval overshoot
      (completion fell to 45% at kp 6) while keeping the bend gain that lifted s-bend
      progress to 0.74. Geometry is unchanged from iteration 3 so the controller effect
      is isolated.


      ### Rationale


      Evidence from iteration 3 (score 338.4, down from 398.1). The s-bend improved
      a lot: progress rose from 0.42 to 0.74 and 3 of 20 runs finished. The oval got
      worse: completions fell from 20/20 to 9/20, off-track ends rose to 11, and steering_oscillation
      rose from 0.14 to 0.23. The slalom barely moved (progress 0.19). So kp 6.0 with
      kd 1.5 gives useful extra correction on bends but overshoots and oscillates
      on the gentler oval. Line loss is not the main problem; the off-track limit
      is 0.06 m.


      Changes: (1) kp reduced from 6.0 to 5.0 to cut the overshoot that is hurting
      the oval, keeping most of the bend gain. (2) kd raised from 1.5 to 1.8 to damp
      the oscillation at the new kp (kd/kp rises from 0.25 to 0.36). (3) base_speed
      held at 1.1, since the oval finished in time at 1.1 and lowering it further
      would cost time and the completion bonus is worth more. (4) Geometry is kept
      identical to iteration 3 (sensors at y 0.08, x ±0.07, size 0.016, wheel_track
      0.10, mass 0.7, body 0.14 by 0.12), so the controller change is isolated. ki
      stays at 0 and line_loss stays last_direction.


      Expected result: oval completion back above 75 percent with steering_oscillation
      at or below about 0.2, s-bend progress above 0.6, and slalom progress above
      0.25.


      Hypotheses: (H1) the oval off-track failures come from overshoot at kp 6, so
      a kp near 5 restores oval completion while keeping most of the s-bend gain.
      (H2) the slalom fails because the sensor lead and response are too slow for
      alternating curves, so it may need a further kp or kd change, or a larger base
      speed reduction. (H3) wheel_track 0.10 may be adding yaw gain that contributes
      to oscillation; if the oval stays weak, the next step is to restore wheel_track
      to 0.12. Measurements requested: per-track completion, progress, max_error,
      rms_error, line_loss_events, steering_oscillation and control_effort, to separate
      overshoot from lag.


