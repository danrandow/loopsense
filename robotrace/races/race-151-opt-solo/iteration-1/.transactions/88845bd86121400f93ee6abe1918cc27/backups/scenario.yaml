  entities:
  - id: entity0
    label: Wider, forward sensors
    notes: 'Widened the sensor span to ±0.07 m and moved the array forward to y =
      0.06 m, with kp raised to 3.5, kd to 0.6 and base speed lowered to 1.3. The
      evidence is that 57 of 60 development trials ended off track on bends, with
      max_error at the 0.06 m limit and about one line-loss event per run.


      ### Rationale


      Evidence: 17 of 20 oval trials and all 40 s-bend and slalom trials ended off
      track, with max_error at 0.06 m, the off-track limit for this body (max(0.06,
      0.0125 + 0.12/4) = 0.06 m). Line-loss events were about 1 per run, and progress
      was only 0.17 on the s-bend and 0.12 on the slalom. The robot loses the line
      on bends and never recovers. Likely causes: (a) the sensor span of 0.08 m (x
      = ±0.04) is barely wider than the 0.025 m tape plus the turning lag, so on sharp
      bends the tape leaves the array; (b) kp = 2.5 with kd = 0.3 corrects too slowly
      at 1.5 base speed, and the robot runs wide before the correction builds; (c)
      the sensors sit 0.05 m ahead of the axle, so the wheels reach the tape before
      the sensors have fully corrected. Changes: widen the array to x = ±0.07 m (5
      sensors, 0.035 m spacing) so the line stays under a sensor through tighter bends;
      move the array forward to y = 0.06 m for more lead; raise kp to 3.5 for stronger
      correction; raise kd to 0.6 to damp the extra gain; lower base_speed to 1.3
      to give the controller time to respond on bends, at a small cost in completion
      time. Keep ki = 0 to avoid integral windup, and keep line_loss = last_direction.
      Expected result: fewer off-track ends on the s-bend and slalom, with progress
      above 0.5 on those tracks and a finish on the oval. Hypotheses to test next:
      (1) widening the span reduces line_loss_events to near 0; (2) steering_oscillation
      stays below about 0.4 at kp 3.5 and kd 0.6; (3) completion time rises by about
      0.1 to 0.2 s from the lower base speed, which is acceptable if completion rate
      rises. Measurements requested: per-track completion, progress, max_error and
      line_loss_events, which will show whether the failure is line loss or steering
      lag.


