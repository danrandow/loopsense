map:
  id: race-172-opt-eval
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: kd 0.30 to 0.20 test
    notes: 'Keeps base_speed 1.0 and search_left from the best raced design (iteration
      6, score 85.60) and lowers kd from 0.30 to 0.20 only. Oval steering oscillation
      was 0.19 with max_error 0.0623, so the Evaluator''s damping rule (c) applies.


      ### Rationale


      Evidence: iteration 6 (base_speed 1.0, kd 0.30, search_left, sensors at ±0.05
      m, sensor_size 0.016) scored 85.60, the best so far. Oval progress rose to 0.3425
      (from 0.318 at speed 1.2), so the Evaluator''s condition (a) for keeping speed
      1.0 is met on progress. Oval line-loss events are 0.0 and oval max_error is
      0.0623, still just above the 0.06 m off-track limit. Oval steering_oscillation
      is 0.1917, well above the 0.15 guide. s-bend and slalom still show one line-loss
      event each (progress 0.1625 and 0.110), so the recovery direction and speed
      are not limiting them.


      The Evaluator''s condition (c) applies: oscillation is above 0.15 while oval
      max_error is still at or above 0.06. The requested fix is to reduce controller.kd
      from 0.30 to about 0.20, with every other field fixed. Iteration 1 showed kd
      0.30 pushed oscillation above 0.15, and this iteration confirms it. I am changing
      only kd, so the race isolates the damping effect. I am not changing the sensor
      layout yet. The Evaluator''s condition (d) (a fifth forward sensor or a wider
      spread for s-bend/slalom) depends on the result of this race, and s-bend/slalom
      progress is small, so it is a lower-priority lever.


      Expected result: oval steering_oscillation falls from 0.19 toward 0.15 or below,
      and oval max_error drops toward or below 0.06 because the steering is less jittery
      at the corner entries. Oval progress may fall slightly (lower damping), so the
      watch value is 0.3425. Hypotheses: (a) kd 0.20 brings oval oscillation below
      0.15 while progress stays at or above about 0.32; (b) oval max_error falls below
      0.06 on more seeds; (c) s-bend and slalom progress stay near 0.16 and 0.11.
      Measurements next: oval progress, max_error, steering_oscillation and line_loss_events;
      s-bend and slalom line_loss_events and progress.


      - [Open this output](iteration-7/entity0/versions/86759eb4349b464da19bd23e44057447/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-b40d41c700bc6dc4/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-9d0c0724b36b7402/payload.json)'
  - id: entityR1
    label: 'Approve: speed 1.0 test'
    notes: 'Approved the single-group change base_speed 1.2 to 1.0 on the best raced
      design (iteration 5, 81.82) to test whether slower entry keeps the oval max_error
      under 0.06. Feedback sets next steps by oval progress, oscillation and s-bend/slalom
      line losses.


      ### Feedback


      Decision: approve. This candidate changes one field group from the best raced
      design (iteration 5, score 81.82): base_speed 1.2 to 1.0. Geometry, kp 4.0,
      ki 0.05, kd 0.30, sensor weights and line_loss search_left are unchanged. The
      evidence supports the test. Oval max_error has been 0.0605 to 0.0626 across
      iterations 3 to 5, just over the 0.06 m off-track limit, and iteration 5 showed
      the largest oval gain from the speed drop (progress 0.137 to 0.318). Oval line-loss
      events fell to 0.15 with search_left. On s-bend and slalom, line_loss_events
      stayed at 1 under every recovery direction tried, and progress barely moved,
      so speed is not their limiting factor. Steering oscillation on the oval was
      0.183 in iteration 5, above the 0.15 guide. We are in mid-run with 5 iterations
      left, and this candidate is valid and isolates speed, so racing it gives the
      most useful telemetry. Do not assume it beats iteration 5 until the race shows
      it. Read the next race as follows. (a) If oval progress stays at or above 0.318
      and oval max_error falls below 0.06, keep base_speed 1.0. (b) If oval progress
      falls well below 0.318, speed 1.0 is too slow; return to 1.1 or 1.2 and test
      a different lever. (c) If oval steering_oscillation stays above 0.15 while max_error
      is still at or above 0.06, reduce kd to about 0.20 before changing kp. (d) If
      s-bend or slalom still show one line-loss event, change the sensor layout (a
      wider spread or a forward fifth sensor) rather than the recovery direction.


      ### Requested changes


      - If oval progress falls below 0.318 at base_speed 1.0 (iteration 5 value at
      1.2), set base_speed to about 1.1 and keep kd 0.30 and search_left, so speed
      is tuned between 1.0 and 1.2 without changing steering.

      - If oval max_error stays at or above 0.06 with steering_oscillation above 0.15
      at base_speed 1.0, reduce controller.kd from 0.30 to about 0.20 with all other
      fields fixed. Evidence: iteration 5 oval oscillation was 0.183 at kd 0.30, and
      iteration 1 showed kd 0.30 raised oscillation above 0.15.

      - If s-bend or slalom line_loss_events stay at 1 after this race, change the
      sensor layout (for example a fifth sensor forward at y 0.06, or a wider spread)
      with the speed and recovery direction held fixed. Evidence: line_loss stayed
      at 1 with last_direction (iterations 0 to 3) and search_right (iteration 4)
      on those tracks.


      - [Open this output](iteration-6/entityR1/versions/4842399d66e449e9807b6444e6fd1466/payload.json)

