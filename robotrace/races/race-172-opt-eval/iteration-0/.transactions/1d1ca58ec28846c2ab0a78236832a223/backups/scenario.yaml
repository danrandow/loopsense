overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor racer
    notes: 'Conservative first candidate: five 12 mm sensors at 20 mm spacing, linear
      weights, kp 4, base speed 1.6. No race data exists yet, so the values come from
      the contract''s limits and the 1.5 m/s finish-time requirement.


      ### Rationale


      Iteration 0 has no race data or evaluator feedback, so this is a conservative
      baseline built from the contract. Geometry: five line sensors at x = -0.04,
      -0.02, 0, 0.02, 0.04 m, spaced 20 mm so the 25 mm tape always covers at least
      one or two sensors. They sit 0.04 m ahead of the axle so the robot reads the
      line before it reaches it. Sensor size is 12 mm, which gives a clean reading
      across a 25 mm tape. Wheel track 0.12 m, wheel radius 0.03 m, body width 0.12
      m (off-track limit about 0.06 m), body length 0.18 m, mass 0.8 kg. Controller:
      sensor_weights = 25*x, giving -1, -0.5, 0, 0.5, 1, so a line under the left
      sensors gives a positive signal (steer left) as the contract requires. kp =
      4 gives roughly 1400 PWM per unit signal, enough steering authority for the
      sharper bends. ki = 0.05 is a small integral term to remove steady bias from
      the motor mismatch. kd = 0.05 damps overshoot without amplifying sensor noise.
      base_speed = 1.6 (about 80 percent of full PWM) is chosen to reach the roughly
      1.5 m/s average needed to finish in 3 s while leaving headroom for turning.
      line_loss = last_direction, so the robot searches toward the side it last saw
      the line. Expected result: completion on the oval and s-bend, with some slalom
      risk. Hypotheses to test: (1) the baseline completes all three tracks with few
      line-loss events; (2) completion time is near 2.5 s, meaning speed is adequate;
      (3) steering oscillation is low at kp = 4. Measurements requested below will
      show whether kp or base_speed is the bottleneck.


      - [Open this output](iteration-0/entity0/versions/d39e37b7eb144a488a0f4233d127ccde/payload.json)'
  actions:
  - id: action0
measurements: {}
