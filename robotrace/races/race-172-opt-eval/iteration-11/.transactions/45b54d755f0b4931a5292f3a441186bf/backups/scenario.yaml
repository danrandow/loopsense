overrides:
  entities:
  - id: entity0
    label: 'Best design: speed 1.0'
    notes: 'Returns base_speed to 1.0 and keeps every other field at the iteration
      6 design, which raced 85.60 and reproduced exactly in iteration 9. Iteration
      10 (speed 0.9) scored 81.76, with lower oval progress and higher max_error,
      so the lower speed is rejected.


      ### Rationale


      This is the final iteration, so the design raced here is the one scored on the
      unseen final track. The evidence favours the best raced design, not a new untested
      change. Iteration 10 tested base_speed 0.9 and scored 81.76, below iteration
      6 (85.60, reproduced exactly in iteration 9). At 0.9, oval progress fell from
      0.3425 to 0.3279, oval max_error rose from 0.0623 to 0.0651, and oval line losses
      rose from 0 to 0.95. That is the ''speed too slow'' outcome the Evaluator named,
      so I am returning to base_speed 1.0. Every other field stays at the iteration
      6 values: geometry (five 16 mm sensors at x = -0.05, -0.025, 0, 0.025, 0.05
      m, y = 0.04 m), kp 4.0, ki 0.05, kd 0.30, weights -1, -0.5, 0, 0.5, 1, and line_loss
      search_left. Sensor and kd changes were rejected by iterations 7 and 8, and
      recovery direction did not move s-bend or slalom. Expected result: about 85.6
      on the development tracks, with oval progress near 0.34 and 0 oval line losses.
      Unseen-track performance is uncertain, and this design is the most reliable
      known option. Open hypotheses for the record: oval max_error stays just above
      0.06 at this speed, and s-bend and slalom keep one line loss each. Measurements
      requested: all ten, to confirm reproduction and show the per-track line-loss
      and max_error values.


      - [Open this output](iteration-11/entity0/versions/4cf57d7623f74dd9a0f76bc981d78b79/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-622df256699c2962/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-033939c10a409448/payload.json)'
  - id: entityR1
    label: Approve reproduced best
    notes: 'Approves the iteration 6 design, which reproduced at 85.60 in iteration
      9 and is the best raced result. Speed 0.9 (81.76), kd 0.20 and the 0.08 m spread
      were all worse, so the candidate returns to base_speed 1.0 with every other
      field unchanged.


      ### Feedback


      Decision: approve. This is the final iteration, so this design is the one scored
      on the unseen track, and no later revision can be raced. The candidate matches
      iteration 6 (score 85.60), which iteration 9 reproduced exactly. The one change
      from iteration 6 is base_speed 1.0 to 1.0 with no difference, so the design
      is identical to the best raced result. Iteration 10 (base_speed 0.9, score 81.76)
      shows that 0.9 is worse, so the candidate correctly returns to 1.0. Iteration
      7 (kd 0.20) and iteration 8 (sensor spread 0.08 m) both lost badly, so their
      settings should not be used. Nothing here is a prediction for the candidate.
      The open issues from earlier races (oval max_error about 0.062, just over the
      0.06 m limit, and one line loss each on s-bend and slalom) were not resolved
      by any recovery direction, speed or sensor change tried, so they are not addressed
      in this final design. Approving the reproduced best keeps the most reliable
      known option for the held-back track.


      ### Requested changes


      - Race entity0 unchanged: base_speed 1.0, kp 4.0, ki 0.05, kd 0.30, sensor weights
      -1, -0.5, 0, 0.5, 1, five 16 mm sensors at x = -0.05, -0.025, 0, 0.025, 0.05
      m (y = 0.04 m), line_loss search_left. Evidence: iterations 6 and 9 both scored
      85.60, and iteration 10 at 0.9 scored 81.76.

      - Do not change kd (iteration 7 at 0.20 cut oval progress to 0.115) or sensor
      spread (iteration 8 at 0.08 m cut oval progress to 0.2039 and collapsed s-bend
      and slalom).


      - [Open this output](iteration-11/entityR1/versions/71ca5a6bd6164666a58b68781687891d/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/4cf57d7623f74dd9a0f76bc981d78b79/payload.json),
