map:
  id: race-172-opt-eval
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Slower entry, search left
    notes: 'Keeps the iteration 4 geometry (wider 0.016 sensors) and changes base_speed
      1.4 to 1.2 and line_loss search_right to search_left. Iteration 4 left oval
      max_error at 0.0605 and s-bend and slalom line losses at 1 under search_right,
      which meets the Evaluator''s conditions for both changes.


      ### Rationale


      Evidence from iteration 4 (score 56.11, the best so far): the oval now shows
      0 line-loss events and progress 0.137 (up from 0.124), but max_error is 0.0605,
      still just over the 0.06 m off-track limit. On s-bend and slalom, line_loss_events
      stayed at 1 with search_right, and progress was unchanged (0.1576 and 0.1099).
      The search direction therefore did not change where the line is lost. The Evaluator''s
      conditions are both met: (1) oval max_error is at or above 0.06 with sensor_size
      0.016, so base_speed drops from 1.4 to 1.2 to give slower entry into the first
      corner; (2) s-bend and slalom line-loss events stayed at 1 with search_right,
      so line_loss changes to search_left with the same geometry. Geometry is unchanged:
      five sensors at x = -0.05, -0.025, 0, 0.025, 0.05 m, y = 0.04 m, sensor_size
      0.016, and the same body, wheel and mass values. kp 4.0, ki 0.05, kd 0.30 and
      the sensor weights are also unchanged. Expected result: oval max_error falls
      below 0.06 with 0 line losses, and s-bend and slalom line-loss events drop to
      0 or the progress values change, which will show whether the loss point depends
      on search direction. Risk: two controller fields change at once (speed and recovery
      direction). Speed mainly affects the oval, and direction mainly affects s-bend
      and slalom, so the per-track telemetry should separate them. Hypotheses to check:
      (a) base_speed 1.2 brings oval max_error below 0.06 while progress stays at
      or above 0.124; (b) search_left reduces or keeps the s-bend and slalom line-loss
      count at 1 with different progress; (c) steering_oscillation stays near 0.15.
      If progress falls on all tracks, speed 1.2 is too slow and should return to
      1.4.


      - [Open this output](iteration-5/entity0/versions/5004fb9f36e04cd5b96d798d5954692b/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-bf58d5ac5d885589/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-6bb6f18462b6d896/payload.json)'
  - id: entityR1
    label: 'Approve: sensor 0.016 +'
    notes: 'Approved the iteration 4 candidate unchanged (sensor_size 0.016, line_loss
      search_right, base_speed 1.4, kd 0.30). The oval max_error of 0.0609 at iteration
      3 is just over the 0.06 m limit, and s-bend and slalom each lost the line once
      under last_direction. The feedback sets the next step for each track outcome.


      ### Feedback


      Decision: approve. This candidate is valid and well supported by earlier races.
      We are in early exploration with 7 iterations left, so racing it gives the most
      useful telemetry, and the best raced score so far is 53.94 (iteration 3).


      Why the changes are sound: (1) sensor_size 0.012 to 0.016 targets the oval.
      Iterations 0 to 3 all show oval max_error at 0.0607 to 0.0614, just over the
      0.06 m off-track limit, with progress stuck at 0.115 to 0.124. Iteration 2 showed
      the wider +/-0.05 m array removed oval line-loss events, but did not lift progress,
      so the footprint is the next untested sensing lever. (2) line_loss last_direction
      to search_right addresses s-bend and slalom. Last_direction gave exactly one
      line-loss event per run on those tracks in iterations 0 to 3 (s-bend 0.1575
      progress, slalom 0.1075). search_right is untested. (3) base_speed 1.4 and kd
      0.30 are kept from iteration 3, the best raced design.


      Weakness: two groups change at once (footprint and recovery direction). The
      footprint should mainly affect the oval and the recovery direction mainly affects
      s-bend and slalom, so the telemetry per track should still separate the two.


      How to read the race: (a) If oval max_error falls below 0.06 with 0 line losses,
      keep sensor_size 0.016. (b) If s-bend or slalom line-loss events drop to 0,
      or progress rises above 0.1575 and 0.1075, keep search_right. (c) If s-bend
      or slalom line-loss events rise, the search direction was wrong: next revision
      should use search_left with the same geometry. (d) If the oval still shows max_error
      at or above 0.06 with sensor_size 0.016, try base_speed 1.2 before changing
      kp, since slower entry into the first corner is the remaining lever. (e) If
      steering_oscillation rises well above 0.15, lower kd to about 0.20 rather than
      cutting kp.


      ### Requested changes


      - If the oval max_error stays at or above 0.06 with sensor_size 0.016, set base_speed
      to about 1.2 with all other fields fixed. Evidence: oval progress has been 0.115
      to 0.124 at speeds 1.4 and 1.6, and max_error has stayed at 0.0607 to 0.0614
      throughout.

      - If s-bend or slalom line_loss_events stays at 1 with controller.line_loss
      search_right, switch to search_left with the same geometry. Evidence: last_direction
      gave one line-loss event per run on s-bend and slalom in iterations 0 to 3.

      - If steering_oscillation rises well above 0.15, reduce kd from 0.30 to about
      0.20 and keep kp at 4.0. Evidence: iteration 1 (kd 0.30) gave oscillation of
      0.154 on s-bend and 0.158 on slalom.


      - [Open this output](iteration-4/entityR1/versions/9874b68bb1054137a40d9692be251e03/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/9899dd9f3e9b4111a1df4f6d881b9de5/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-a0d12235adb5be8e/payload.json)'
