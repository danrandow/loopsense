map:
  id: race-172-opt-eval
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: kd 0.30, speed 1.4 retest
    notes: 'Restores kd 0.30, which gave the only s-bend and slalom progress gains
      (0.157 and 0.110), and keeps the wider +/-0.05 m sensors that cut oval line
      losses to 0. Base speed drops to 1.4 as a single test of whether the oval holds
      the line (max_error 0.0614 at 1.6 with progress stuck at 0.115).


      ### Rationale


      Evidence: all 60 trials of iteration 2 ended off track. Progress was 0.115 on
      the oval, 0.040 on the s-bend and 0.035 on the slalom. The iteration 1 candidate
      (kd 0.30, sensors +/-0.04 m) was the best raced score (52.35), and its s-bend
      and slalom progress (0.157 and 0.110) were clearly higher than the kd 0.15 runs.
      So kd 0.15 is the most likely cause of the lost progress on those tracks. Iteration
      2 also cut oval line-loss events from 1 to 0 with the wider +/-0.05 m sensor
      array, so that change is worth keeping. The oval still stalls at progress 0.115
      with max_error 0.0614, just over the 0.06 m off-track limit, which suggests
      the robot enters the first corner too fast.


      Changes, following the Evaluator''s requests: (1) kd goes from 0.15 back to
      0.30, the value that gave the only progress gains so far. (2) base_speed goes
      from 1.6 to 1.4, a single test of whether slower entry lets the oval hold the
      line. (3) The +/-0.05 m sensor spread, sensor size 0.012, weights, kp 4.0, ki
      0.05 and line_loss last_direction are unchanged. I am not changing line_loss
      yet, because the Evaluator asked for that only if line-loss events stay at 1
      on s-bend or slalom after this race.


      Expected result: s-bend and slalom progress recover toward 0.15 and 0.11 or
      higher. Oval max_error falls below 0.06 with line-loss events at 0 or 1, and
      oval progress rises above 0.115. The cost is some steering oscillation, which
      was 0.154 and 0.158 at kd 0.30 in iteration 1; that is a guide, not a score
      term.


      Hypotheses and next measurements: (a) base_speed 1.4 with kd 0.30 gives oval
      max_error below 0.06 and oval progress above 0.115. (b) s-bend and slalom progress
      are at or above iteration 1 values. (c) steering_oscillation stays near 0.15.
      If oval progress still stalls at 0.115, next test sensor_size 0.016 or a different
      line_loss search direction. If s-bend or slalom still show one line-loss event,
      test line_loss search_right or search_left, with all other fields fixed.


      - [Open this output](iteration-3/entity0/versions/da8ab17d09bd471d8c9421c28480d9c8/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/31f48fc3d7b2477c8b1ef21672b6b9db/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-2e8e772ad8b4b2ab/payload.json)'
  - id: entityR1
    label: 'Approve: kd 0.30 + wider'
    notes: 'Approved the candidate that returns kd to 0.30 (best s-bend and slalom
      progress in iteration 1) with the +/-0.05 m sensor spread (oval line-loss events
      fell from 1 to 0 in iteration 2) and base_speed 1.4 to test whether slower entry
      holds the oval line. Feedback sets a clear next step for each result, since
      no outcome is stated for the candidate before it races.


      ### Feedback


      Decision: approve. This candidate is valid and well-supported by earlier races,
      and we are in early exploration with 8 iterations left, so racing it gives the
      most useful telemetry.


      Why it is a sound test: (1) kd back to 0.30 is the value that gave the only
      progress gains so far. Iteration 1 (kd 0.30, +/-0.04 m sensors, base_speed 1.6)
      gave s-bend progress 0.157 and slalom 0.110, against 0.04 and 0.035 at kd 0.05
      (iteration 0) and 0.04 and 0.035 at kd 0.15 (iteration 2). (2) The +/-0.05 m
      sensor spread is kept because iteration 2 cut oval line-loss events from 1 to
      0 with weights unchanged. Oval progress was 0.115 in every iteration, so the
      oval is the main drag on the score and the spread is the only lever that has
      moved its line-loss count. (3) base_speed 1.4 is a single untested variable.
      Iteration 2 showed max_error 0.0614 on the oval at speed 1.6, just over the
      0.06 m limit, so slower entry into the first corner is a plausible fix.


      Weakness to watch: the candidate combines the kd return with the sensor spread
      and the speed change. Iteration 2 showed the spread alone did not lift oval
      progress above 0.115, and iteration 1 showed kd 0.30 alone left the oval unchanged,
      so the speed change is the main unknown for the oval. Its score is 52.35 at
      best so far (iteration 1), so read this race against that. Do not state a result
      for this candidate in planning; use the telemetry as follows.


      Next step depends on the race. (a) If s-bend and slalom progress fall below
      the iteration 1 values (0.157 and 0.110), speed 1.4 is slowing the robot or
      stalling it; return base_speed to 1.6 and keep kd 0.30. (b) If oval max_error
      stays at or above 0.06 with line_loss_events 0, try sensor_size 0.016 before
      changing speed again. (c) If line_loss_events stays at 1 on s-bend or slalom,
      change line_loss to search_right or search_left with all other fields fixed.
      (d) If steering_oscillation rises well above 0.15, lower kd to about 0.20 rather
      than cutting kp.


      ### Requested changes


      - If s-bend or slalom progress falls below iteration 1 (0.157 and 0.110 at kd
      0.30, speed 1.6), set base_speed back to 1.6 and keep kd 0.30 and the +/-0.05
      m sensors.

      - If oval max_error stays at or above 0.06 with line_loss_events 0, set sensor_size
      to 0.016 at base_speed 1.4, since the 0.012 footprint may be too small to keep
      the 25 mm tape in view on the first corner.

      - If line_loss_events stays at 1 on s-bend or slalom, change controller.line_loss
      from last_direction to search_right or search_left with all other fields fixed,
      because last_direction has produced one loss per run on every track in iterations
      0 to 2.


      - [Open this output](iteration-3/entityR1/versions/c26cfb8b9b2743a69527badd6b97f304/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/da8ab17d09bd471d8c9421c28480d9c8/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-2e8e772ad8b4b2ab/payload.json)'
