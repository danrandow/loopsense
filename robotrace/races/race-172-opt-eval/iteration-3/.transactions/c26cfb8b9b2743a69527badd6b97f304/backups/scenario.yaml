map:
  id: race-172-opt-eval
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: kd 0.30, speed 1.4 retest
    notes: 'Restores kd 0.30, which gave the only s-bend and slalom progress gains
      (0.157 and 0.110), and keeps the wider +/-0.05 m sensors that cut oval line
      losses to 0. Base speed drops to 1.4 as a single test of whether the oval holds
      the line (max_error 0.0614 at 1.6 with progress stuck at 0.115).


      ### Rationale


      Evidence: all 60 trials of iteration 2 ended off track. Progress was 0.115 on
      the oval, 0.040 on the s-bend and 0.035 on the slalom. The iteration 1 candidate
      (kd 0.30, sensors +/-0.04 m) was the best raced score (52.35), and its s-bend
      and slalom progress (0.157 and 0.110) were clearly higher than the kd 0.15 runs.
      So kd 0.15 is the most likely cause of the lost progress on those tracks. Iteration
      2 also cut oval line-loss events from 1 to 0 with the wider +/-0.05 m sensor
      array, so that change is worth keeping. The oval still stalls at progress 0.115
      with max_error 0.0614, just over the 0.06 m off-track limit, which suggests
      the robot enters the first corner too fast.


      Changes, following the Evaluator''s requests: (1) kd goes from 0.15 back to
      0.30, the value that gave the only progress gains so far. (2) base_speed goes
      from 1.6 to 1.4, a single test of whether slower entry lets the oval hold the
      line. (3) The +/-0.05 m sensor spread, sensor size 0.012, weights, kp 4.0, ki
      0.05 and line_loss last_direction are unchanged. I am not changing line_loss
      yet, because the Evaluator asked for that only if line-loss events stay at 1
      on s-bend or slalom after this race.


      Expected result: s-bend and slalom progress recover toward 0.15 and 0.11 or
      higher. Oval max_error falls below 0.06 with line-loss events at 0 or 1, and
      oval progress rises above 0.115. The cost is some steering oscillation, which
      was 0.154 and 0.158 at kd 0.30 in iteration 1; that is a guide, not a score
      term.


      Hypotheses and next measurements: (a) base_speed 1.4 with kd 0.30 gives oval
      max_error below 0.06 and oval progress above 0.115. (b) s-bend and slalom progress
      are at or above iteration 1 values. (c) steering_oscillation stays near 0.15.
      If oval progress still stalls at 0.115, next test sensor_size 0.016 or a different
      line_loss search direction. If s-bend or slalom still show one line-loss event,
      test line_loss search_right or search_left, with all other fields fixed.


      - [Open this output](iteration-3/entity0/versions/da8ab17d09bd471d8c9421c28480d9c8/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/31f48fc3d7b2477c8b1ef21672b6b9db/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-2e8e772ad8b4b2ab/payload.json)'
  - id: entityR1
    label: 'Revise: restore kd, speed'
    notes: 'Revise because kd 0.15 erased the s-bend and slalom progress gains seen
      at kd 0.30 (iteration 1, best score 52.35), while the speed-only test is worth
      keeping. Requests kd 0.30 with base_speed 1.4 and a line-loss direction change
      if line loss persists.


      ### Feedback


      Decision: revise. This candidate is valid, but it drops the kd gain that produced
      the only progress gains so far. Iteration 1 (kd 0.30, sensors +/-0.04 m) raised
      s-bend progress from 0.040 to 0.157 and slalom from 0.035 to 0.110, which is
      the best raced score (52.35). Iteration 2 (kd 0.15, sensors +/-0.05 m) returned
      both tracks to baseline progress (0.040 and 0.035), so the candidate''s kd of
      0.15 is the likely reason those tracks are slow. Widening the sensors to +/-0.05
      m reduced oval line-loss events from 1 to 0 but left oval progress at 0.115
      and max_error at 0.0614, so it has not solved the oval. The base_speed change
      to 1.4 is a fair single test of the oval corner: the oval fails at a fixed progress
      point, and max_error sits just over the 0.06 m limit, which points to speed
      into the corner. Oscillation in iteration 1 (0.154 and 0.158) was only just
      above the 0.15 threshold, and that threshold is a guide, not a score term. Revise
      so the next race tests the speed change while restoring the kd that gave the
      best progress. Next steps depend on the race: if oval progress still stalls
      at 0.115 at base_speed 1.4, test a larger sensor_size (0.016) or a different
      line_loss search direction. If s-bend and slalom still show one line-loss event
      each, test line_loss = search_right or search_left, keeping the other fields
      fixed. Change one field group at a time so the cause of each effect stays clear.


      ### Requested changes


      - Restore controller.kd to 0.30, keeping kp 4.0 and ki 0.05. Iteration 1 showed
      kd 0.30 gave the only s-bend and slalom progress gains (0.157 and 0.110 against
      baseline 0.040 and 0.035), and iteration 2 showed kd 0.15 lost them.

      - Keep controller.base_speed at 1.4, as tested in this candidate, to check whether
      slower entry lets the oval hold the line (oval max_error was 0.0614 at base_speed
      1.6 with progress 0.115 unchanged).

      - If line_loss_events stays at 1 on s-bend or slalom after this change, set
      controller.line_loss to search_right or search_left. Iterations 0 to 2 show
      last_direction gave one line-loss event per run on those tracks.


      - [Open this output](iteration-3/entityR1/versions/31f48fc3d7b2477c8b1ef21672b6b9db/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/fcd66a9d1dae4c15957e717822fc70db/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-2e8e772ad8b4b2ab/payload.json)'
