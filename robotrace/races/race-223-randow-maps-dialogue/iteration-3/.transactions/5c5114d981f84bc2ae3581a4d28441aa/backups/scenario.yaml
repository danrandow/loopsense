map:
  id: race-223-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Hold geometry, test lag
    notes: 'Holds the iteration-2 geometry as the Integrator asked, so the next race
      isolates the controller change. Iteration 2 data shows line loss rose on oval
      (0.25) and slalom (0.3) and max_error did not move, so the lag and inertia change
      is not yet proven and is the first thing to revert if line loss stays high.


      ### Rationale


      The Integrator asked me to hold geometry for this race. I am taking that advice,
      with one caveat about the latest race data.


      Iteration 2 (this geometry, entityR2A, score 114.36 vs 111.80) changed three
      things: sensor y 0.03 to 0.02, body_length 0.18 to 0.14, and mass 0.8 to 0.7.
      The Integrator''s feedback was written before those results were visible, and
      it assumed line loss was already settled. The race data does not fully support
      that:

      - Line loss rose on oval (0 to 0.25 per run) and slalom (0.1 to 0.3). The s-bend
      rose slightly (0 to 0.05). So the lag and inertia change made the line-loss
      problem worse on two of three tracks.

      - Slalom progress fell (0.098 to 0.089) and oval progress fell (0.55 to 0.32).
      The score gain came from s-bend progress (0.14 to 0.39).

      - max_error stayed at about 0.063 to 0.064 m on every track. The lag change
      did not move the limiting error, which is the failure the Integrator wanted
      it to fix.

      - rms_error went down on oval and s-bend, so tracking improved on average, but
      excursions past the 0.06 m limit still end the run.


      The mixed result is probably a mix of the geometry change and the controller
      retune that the Integrator is making now. I cannot separate the two from one
      race. So I am holding the iteration-2 geometry as requested, rather than reverting
      the sensor y or mass in the same race as a new controller. That keeps this race
      a clean read of the controller change on the current platform. If line_loss_events
      on oval or slalom stays at or above 0.2 after the controller change, the most
      likely cause is the reduced inertia or the closer sensors, and I would revert
      sensor y to 0.03 first, keeping mass at 0.7.


      I am not adopting the 7-sensor array: line loss is near zero at the 0.06 m span
      on most tracks. The wheel_track 0.10 lever stays on the list for when max_error
      is still above 0.06 m after this race, as the Integrator proposed.


      - [Open this output](iteration-3/entity0/versions/249309a4032b461e8151b28ba351f53a/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-5fa3db7910814a6d/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-dbf4dec3a80cb0f0/payload.json)'
  - id: entity1
    label: Softer gains, slower base
    notes: 'Kept the held iteration-2 geometry and cut kp 4.0 to 3.5 and base_speed
      1.2 to 1.0 to address the rising line loss (0.25 oval, 0.30 slalom) and s-bend
      oscillation seen in iteration 2. Expected result is unmeasured; the evidence
      is entityR2A''s race outcome table.


      ### Rationale


      Race evidence from iteration 2 (entityR2A geometry with kp 4.0 and kd 0.6, score
      114.36 vs 111.80) is mixed. Line loss rose on oval (0.25 per run) and slalom
      (0.30), up from 0 and 0.1 in iteration 1. Max_error stayed at 0.063 to 0.064
      m on every track, so the gain increase did not reduce the limiting error. Steering
      oscillation rose on the s-bend (0.28 from 0.13), which means kp 4 with kd 0.6
      is pushing the loop toward overshoot. Progress fell on oval (0.55 to 0.32) and
      slalom (0.10 to 0.09). The Builder asked me to hold geometry, so the geometry
      is the iteration-2 values unchanged. The controller must now do the work. I
      am lowering kp from 4.0 to 3.5 to cut overshoot and the line-loss excursions
      it causes. I am keeping kd at 0.6 for damping. The constant max_error near 0.063
      m across all three tracks, and the steady 0.02 to 0.03 m rms_error, suggest
      the robot is entering bends too fast for its correction, so I am lowering base_speed
      from 1.2 to 1.0 to give the loop more time to respond. ki stays at 0.05 because
      there is no sign of a steady offset, and the sensor weights stay at -2 to +2
      for the 0.03 m spacing. line_loss stays last_direction, which has held up in
      every race. Expected result, not yet measured: fewer line-loss events on oval
      and slalom, and max_error pulled below 0.06 m on more trials. If line loss stays
      at 0.2 or higher on oval or slalom, the cause is the reduced inertia or the
      closer sensors, which is the Builder''s next revert candidate.


      - [Open this output](iteration-3/entity1/versions/ec0f221290e649278a562625e4079918/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/249309a4032b461e8151b28ba351f53a/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-dbf4dec3a80cb0f0/payload.json)'
  - id: entityR1
    label: Hold geometry, next
    notes: 'Written before the race: asks the Builder to hold geometry and sets the
      next lever by outcome. Revert sensor y to 0.03 if line loss stays at or above
      0.2, and try wheel_track 0.10 if max_error still sits at 0.063 m, using iteration
      1 and 2 race data.


      ### Feedback


      Iteration 1 (entityR2B, 111.80) showed that the 0.06 m sensor span removed line
      loss: it fell from 1 to 0 per run on oval and s-bend, and to 0.1 on slalom.
      Iteration 2 (entityR2A geometry with kp 4 and kd 0.6, 114.36) kept that geometry
      and changed the controller. It did not reduce max_error, which stayed at 0.063
      to 0.064 m on all tracks. It also raised line loss to 0.25 on oval and 0.30
      on slalom, and raised s-bend oscillation to 0.28. Progress on oval fell from
      0.55 to 0.32. I read this as the controller overshooting near the sensor edge,
      not as a geometry fault, so I am reducing gain rather than changing the platform.
      Because the geometry is held, I am not asking for changes now. For the next
      race, the question is whether the controller alone brings line loss back to
      near zero. If line loss on oval or slalom stays at 0.2 or more, the sensor y
      or inertia change is the cause, so revert sensor y to 0.03 first, keeping mass
      at 0.7. If line loss returns near zero but max_error stays at 0.063 m, the limit
      is bend speed and track width, so try wheel_track 0.10 next, since it gives
      more turn rate per unit of wheel differential. If neither is the cause, the
      array is not the limit, so I would not add sensors.


      ### Requested changes


      - Hold the iteration-2 geometry for this race (sensor y 0.02, body_length 0.14,
      mass 0.7, ±0.06 m span with 16 mm footprints) so the controller change is isolated.

      - If line_loss_events is still 0.2 or higher on oval or slalom after this race,
      revert sensor y to 0.03 while keeping mass 0.7 and body_length 0.14.

      - If line loss returns near 0 but max_error stays at about 0.063 m, try wheel_track
      0.10 to increase turn rate per unit of wheel differential.


      - [Open this output](iteration-3/entityR1/versions/ec0f221290e649278a562625e4079918/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/249309a4032b461e8151b28ba351f53a/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-dbf4dec3a80cb0f0/payload.json)'
