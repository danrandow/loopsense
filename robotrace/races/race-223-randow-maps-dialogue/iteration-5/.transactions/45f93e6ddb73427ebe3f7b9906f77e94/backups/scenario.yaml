  id: race-223-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Revert inertia to
    notes: 'Reverts mass to 0.8 kg and body_length to 0.18 m, keeping sensor y 0.03,
      following the Integrator''s rule after iteration 4 slalom line loss of 0.85.
      Evidence: iteration 4 scored 124.2 but slalom line loss was high, and iteration
      1 with these values had slalom line loss of 0.1.


      ### Rationale


      Iteration 4 (y 0.03, mass 0.7, body_length 0.14, ±0.06 m span, 16 mm footprints)
      scored 124.20, the best so far. Oval line loss was 0 and s-bend 0.15, but slalom
      line loss was 0.85 per run. The Integrator''s stated rule says to revert mass
      to 0.8 and body_length to 0.18 if oval or slalom line loss is 0.2 or higher,
      and the slalom figure is well above that. Iteration 1 used these values with
      y 0.03 and had slalom line loss of 0.1. I am therefore taking the Integrator''s
      advice and reverting mass and body_length, keeping sensor y at 0.03, the ±0.06
      m span, 16 mm footprints, wheel_track 0.12 and wheel_radius 0.03. Iteration
      2 showed that the sensor y 0.02 change raised line loss, so y stays at 0.03.
      The main cost is likely less s-bend progress, because the lower inertia from
      iteration 4 helped there (0.39 against 0.14 in iteration 1). I expect slalom
      line loss near 0.1 and a score in the 112 to 120 range. The best score so far
      (124) came from the lower-inertia design, so this revert is a trade-off, and
      I am making it because the rule is explicit and line loss is the more controllable
      failure. Other Integrator feedback is not yet in view for this design, so I
      am not changing the controller side.


      - [Open this output](iteration-5/entity0/versions/46d2e5bcebbd432289fdad8aaf50f00c/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-3e2830292913a421/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-debb3c2557bf1048/payload.json)'
  - id: entity1
    label: Revert inertia, keep
    notes: 'Uses the Builder''s iteration-1 inertia values (mass 0.8, body_length
      0.18) with the best-scoring iteration-4 controller. Iteration 4 showed slalom
      line loss of 0.85 with lower inertia, against 0.1 with these values.


      ### Rationale


      Iteration 4 (mass 0.7, body_length 0.14, y 0.03, kp 3.0, kd 0.3, base 1.2) scored
      124.20, the best so far. Its slalom line loss was 0.85 per run. Iteration 1
      used the same sensors and controller but mass 0.8 and body_length 0.18, and
      its slalom line loss was 0.1. Inertia is m(L^2+W^2)/12, so the reduced inertia
      is the most likely cause of the slalom line loss. The Builder''s geometry for
      this iteration matches iteration 1 exactly (x = -0.06 to +0.06 in 0.03 m steps,
      y 0.03, 16 mm footprints, mass 0.8, body_length 0.18), so I keep the controller
      that scored best in iteration 4. Its gains are kp 3.0, ki 0.05, kd 0.3, base_speed
      1.2, weights -2 to +2 and last_direction line loss. I am not retuning the controller
      here, because the only change that clearly helped was the lower inertia, and
      the lower inertia is what this geometry removes. The expected result is line
      loss near 0.1 on slalom and a score near iteration 1 (about 112), with s-bend
      and oval progress a little lower than in iteration 4. max_error has stayed at
      0.063 m in every race, so it is not expected to move with these geometry values
      alone.


      - [Open this output](iteration-5/entity1/versions/dc1dc962a92548cc818e9a12cd643a71/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/46d2e5bcebbd432289fdad8aaf50f00c/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-debb3c2557bf1048/payload.json)'
  - id: entityR1
    label: Inertia revert feedback
    notes: 'Supports the inertia revert because iteration 4 slalom line loss (0.85)
      jumped from iteration 1 (0.1) with the same sensors and controller. Gives the
      next test if line loss stays high or max_error stays near 0.063 m.


      ### Feedback


      Iteration 4 (entityR2B, 124.20) is the best result so far, but its slalom line
      loss was 0.85 per run. The same sensors and controller in iteration 1 (entityR2A,
      111.80; mass 0.8, body_length 0.18) had slalom line loss 0.1. The reduced inertia
      from iteration 4 is therefore the likely cause of the slalom line loss, and
      the revert is supported. The candidate geometry matches iteration 1, and I state
      no outcome for it. Iteration 4 also showed that lower inertia helped s-bend
      progress (0.20 vs 0.14) and oval progress (0.53 vs 0.40), so some of that gain
      is likely to be lost. Your mass and body_length revert is still the right first
      test, because line loss is the more controllable failure. Next steps depend
      on the race. If slalom line loss is 0.2 or higher, the inertia cause is confirmed,
      so try mass 0.7 with body_length 0.18 next to separate the two effects. If line
      loss is near 0.1 and max_error stays at about 0.063 m, wheel_track 0.10 is the
      next lever to test, since it raises turn rate per unit of wheel differential.


      ### Requested changes


      - Keep mass 0.8 and body_length 0.18 with sensor y 0.03 and the 0.06 m span,
      since this matches the iteration-1 result that had slalom line loss 0.1.

      - If slalom line loss is still 0.2 or higher, try mass 0.7 with body_length
      0.18 to separate the effect of mass from the effect of body_length on inertia.

      - If line loss is near 0.1 but max_error stays at about 0.063 m, try wheel_track
      0.10 to raise turn authority.


      - [Open this output](iteration-5/entityR1/versions/dc1dc962a92548cc818e9a12cd643a71/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/46d2e5bcebbd432289fdad8aaf50f00c/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-debb3c2557bf1048/payload.json)'
