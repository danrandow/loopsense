map:
  id: race-223-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 1
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 0.
dimensions:
  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Wider array, larger
    notes: 'Widens the sensor array from ±0.04 m to ±0.06 m and raises sensor_size
      to 0.016 m, so the line stays in view past the 0.06 m off-track limit. The baseline
      race (60 trials, all off-track with one line-loss each and max_error about 0.063
      m) shows the line dropping out just before the limit, which is why the array
      span is the change.


      ### Rationale


      Race evidence for the baseline (entityR2A, 60 trials): every run ended off_track,
      none finished, and each run had exactly one line-loss event. Max error sat at
      about 0.062 to 0.063 m on all three tracks, just above the off-track limit.
      The off-track limit is max(0.06, 0.0125 + body_width/4). With body_width at
      most 0.18 that limit is always 0.06 m, so body width cannot buy margin. The
      baseline sensors sit at x = ±0.04 with a 0.012 m footprint, so a sensor sees
      the tape only while the line centre is within about 0.0185 m of it. The line
      therefore drops out of view at roughly 0.0585 m of offset, just before the 0.06
      m off-track limit. The sequence fits the data: the robot tracks well (rms_error
      about 0.023 to 0.026 m), then one bend pushes it past the edge of the array.
      Once the line is lost the robot cannot recover, so it leaves the track. The
      limiting factor is the array''s lateral span, not the body or the forward offset.
      I am taking the Integrator''s advice from iteration 0 only in spirit: there
      is no Integrator feedback yet, so the change comes from race data alone. I am
      widening the array to x = ±0.06 with 0.016 m footprints. A sensor at x = 0.06
      then sees the tape for offsets up to about 0.0805 m, well past the 0.06 m limit,
      so the controller keeps a signal during the excursions that currently end runs.
      I keep the 0.03 m forward offset, wheel geometry, body and mass unchanged, so
      the race isolates the sensor-span change. Expected result: line_loss_events
      falls to 0 or near 0 on the development tracks, max_error stays under 0.06 more
      often, and progress rises on the oval and s-bend. The main risk is that wider
      spacing (0.03 m, larger than the 0.025 m tape) gives a flatter signal near centre,
      which may need a smaller kp from the Integrator.


      - [Open this output](iteration-1/entity0/versions/0c8a3ea0f35141c89ae65036dc9204d7/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-5a3ccd8fb67bb043/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-4d3a709a014e268b/payload.json)'
  - id: entity1
    label: Baseline robot package
    notes: 'Symmetric five-sensor geometry with a conservative prior controller (kp
      3, kd 0.3, base_speed 1.2, last_direction line loss). No race telemetry exists
      yet, so the gains are contract-based guesses to be tuned after the first race.


      ### Rationale


      Iteration 0 has no race telemetry, so this controller is a conservative prior
      built from the contract''s physics. The sensor array is symmetric, with x =
      -0.04 to +0.04 and y = 0.03. Sensor x is positive on the left, so the weights
      run from -2 (far right) to +2 (far left), and the signal sign steers the robot
      toward the line. The 0.02 m spacing with a 12 mm footprint gives about two sensors
      on the 25 mm tape at once, so the signal changes smoothly. kp = 3 gives a moderate
      turn response: a full-scale signal of about 2 yields roughly 2100 PWM of differential,
      which is enough to correct without saturating. kd = 0.3 damps the lag from the
      0.03 m forward offset. ki = 0.05 is kept small to avoid windup on bends. base_speed
      = 1.2 gives about 2450 PWM base, which should keep average speed near the 1.5
      m/s needed to finish in 3 s, but it is untested and may need raising or lowering
      after the first race. line_loss = last_direction is chosen so the robot keeps
      turning toward the side it last saw the line. Expected result: completion on
      most tracks with few line-loss events. This is a baseline to measure, not a
      tuned design.


      - [Open this output](iteration-0/entity1/versions/90e9bacee6b2452ebfe7cee0f88f70a2/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/6d87e46ad4a74420a654754de6fb449f/payload.json)'
  - id: entityR1
    label: Hold baseline, narrow if
    notes: 'Recommends holding the geometry for the first race to get a clean baseline.
      Gives telemetry-dependent changes: narrow the span if oscillation is high, or
      enlarge the sensors if line loss is frequent. No outcome is claimed for this
      candidate.


      ### Feedback


      No race has been run yet, so there is no outcome for this geometry and none
      is claimed here. The geometry is a reasonable prior. Its five-sensor span (0.08
      m) is about three times the 0.025 m tape, so the line should stay in view through
      moderate offsets. The 0.03 m forward offset gives the controller a look-ahead,
      but it also adds phase lag, so the controller needs derivative damping. For
      the first race, I am holding the geometry unchanged to get a clean baseline.
      Next steps depend on the telemetry. If steering_oscillation or max_error is
      high on the slalom or s-bend, the array is probably too wide or too far forward
      for the tight bends. In that case, try a narrower array (about 0.03 m total
      span, with x values at -0.015, -0.005, 0.005, 0.015 or similar) so fewer sensors
      are off-tape at once. If completion is poor because the robot is too slow or
      leaves the track, try a longer wheel_track or a smaller body_length to reduce
      yaw inertia. If line_loss_events is high, the array may be too narrow or the
      sensors too small for the 25 mm tape, so a larger sensor_size (0.016) could
      help.


      ### Requested changes


      - Keep the current geometry for the first race to measure the baseline. Do not
      change it before telemetry is available.

      - If steering_oscillation or max_error is high on tight bends after the first
      race, narrow the sensor span to about 0.03 m total (x = -0.015 to +0.015) and
      keep the forward offset at y = 0.03.

      - If line_loss_events is high, try sensor_size 0.016 with the current spacing
      to make the line more visible to the outer sensors.


      - [Open this output](iteration-0/entityR1/versions/90e9bacee6b2452ebfe7cee0f88f70a2/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/6d87e46ad4a74420a654754de6fb449f/payload.json)'
