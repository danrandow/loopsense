overrides:
  entities:
  - id: entity0
    label: 'Final: midpoint inertia'
    notes: 'Keeps the iteration 10 geometry unchanged (mass 0.75, body_length 0.16,
      wheel_track 0.12), the best raced design at 146.27. Slalom line loss was 0.0,
      which meets the Integrator''s rule not to reduce inertia further, and wheel_track
      0.10 and mass 0.7 stay excluded by the iteration 4 and 6-8 results.


      ### Rationale


      Iteration 10 raced the midpoint inertia (mass 0.75, body_length 0.16) on the
      wheel_track 0.12 platform and scored 146.27, the best of the run and 34.5 above
      iteration 9''s reproduced baseline of 111.80. Oval progress rose to 0.597 with
      3 of 20 runs finishing. Slalom line loss was 0.0, and s-bend progress was 0.146
      with no line loss. The Integrator''s stated rule was: if slalom line loss is
      0.1 or below, do not go lower on inertia. That condition holds at 0.0, so I
      am not reducing inertia further. The Integrator''s other suggestion, a controller-only
      change, is theirs to make, and I am not changing the platform again. Iterations
      6 to 8 showed that wheel_track 0.10 was worse at every gain, and iteration 4
      showed that mass 0.7 with body_length 0.14 drove slalom line loss to 0.85, so
      both stay excluded. Max_error stayed at 0.061 to 0.066 m across every geometry,
      which points to the run-ending threshold rather than a geometry lever. This
      is the final iteration, and the unseen-track race is scored on whatever I deliver.
      The best-measured geometry is the safest choice, so I am keeping iteration 10
      unchanged. I did not take a new geometry risk, since no evidence supports one.


      - [Open this output](iteration-11/entity0/versions/adc0bd5a75f14be3a6e189d3e305e51a/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-3c79c5cfee76eac3/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-31e90c86e5bfa039/payload.json)'
  - id: entity1
    label: 'Final robot: iter-10 kept'
    notes: 'Delivered the iteration-10 geometry and controller unchanged, since that
      exact design scored 146.27 with slalom line loss 0.0. No untested gain change
      is added before the final unseen-track race.


      ### Rationale


      The Builder''s final geometry is the iteration-10 platform, unchanged: five
      sensors at x = -0.06 to +0.06 in 0.03 m steps, y = 0.03, 16 mm footprints, wheel_track
      0.12, wheel_radius 0.03, body_width 0.12, body_length 0.16, mass 0.75. Iteration
      10 raced this exact geometry with the controller below and scored 146.27, the
      best of the run. Its development results were oval progress 0.597 with 3 of
      20 runs finishing, slalom line loss 0.0 and s-bend progress 0.146 with no line
      loss. The controller that produced that result is the iteration-10 controller
      (kp 3.0, kd 0.3, ki 0.05, base_speed 1.2, weights -2 to +2, last_direction).
      I am delivering it unchanged. Every controller change tried on the 0.12 platform
      either raised line loss or was confounded with a geometry change, and max_error
      stayed at 0.061 to 0.066 m across all geometries and gains, so no measured lever
      points to a better gain set. This is the final iteration, so an untested gain
      change would add risk to the unseen-track race, which is scored on whatever
      is delivered. The best-measured design is the safest choice.


      - [Open this output](iteration-11/entity1/versions/568716f035f449c4aedd379d0b57eeff/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/adc0bd5a75f14be3a6e189d3e305e51a/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-31e90c86e5bfa039/payload.json)'
  - id: entityR1
    label: 'Final feedback: hold'
    notes: 'Feedback recommends holding the 0.12 track and midpoint inertia, citing
      iterations 4, 6 to 8 and 10. It rules out lower inertia and the 0.10 track,
      since both lost line retention or progress in earlier races.


      ### Feedback


      This is the final iteration, so no later race will use this feedback. I have
      delivered your iteration-10 geometry unchanged with the iteration-10 controller,
      which is the best-measured design (146.27). The evidence behind that: the 0.12
      track with mass 0.75 and body_length 0.16 gave slalom line loss 0.0 and oval
      progress 0.597 (iteration 10). Narrowing to 0.10 was worse at every kp tried
      (iterations 6 to 8, 72.9 to 79.6), with slalom line loss up to 0.35 and oval
      progress halved. Lower inertia (mass 0.7, body_length 0.14, iteration 4) gave
      good progress but slalom line loss of 0.85. max_error stayed at 0.061 to 0.066
      m across all nine races, so it is most likely the off-track threshold, not a
      geometry or gain lever. For this reason I did not add any further change. The
      unseen-track result will show whether this platform generalises. Any future
      work should treat the 0.12 track and midpoint inertia as the baseline, and test
      sensor span or forward offset only after a line-loss check.


      ### Requested changes


      - Hold the geometry as delivered: wheel_track 0.12, mass 0.75, body_length 0.16,
      sensors at y 0.03 with x from -0.06 to +0.06 and 16 mm footprints. Iteration
      10 is the evidence for this platform.

      - If a later revision is ever possible, do not reduce inertia below mass 0.75
      or body_length 0.16 (iteration 4 gave slalom line loss 0.85), and do not return
      to wheel_track 0.10 (iterations 6 to 8).


      - [Open this output](iteration-11/entityR1/versions/568716f035f449c4aedd379d0b57eeff/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/adc0bd5a75f14be3a6e189d3e305e51a/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-31e90c86e5bfa039/payload.json)'
