  entities:
  - id: entity0
    label: Baseline 5-sensor draft
    notes: 'First-principles baseline with no prior telemetry: five sensors at 2 cm
      spacing, linear weights x*100, kp 3, kd 0.3, base speed 1.5. It is a starting
      point for the Evaluator to critique, not a tuned design.


      ### Rationale


      No race telemetry is supplied for this iteration (iteration 0, no previous calls),
      so this is a first-principles baseline rather than a tuned design. Geometry:
      five line sensors spread across the 25 mm tape at x = -0.02, -0.01, 0, 0.01,
      0.02 m (about 0.8 tape widths total), slightly ahead of the axle at y = 0.05
      m so they read the line before the wheels reach it. Sensor size 0.012 m is a
      middle choice that covers the tape width without over-smearing curves. Wheel
      track 0.12 m and radius 0.03 m give a moderate turn authority. Body 0.12 x 0.18
      m with mass 0.8 kg keeps yaw inertia modest and sits well inside the off-track
      limit. Controller: weights set to x*100 (-2, -1, 0, 1, 2), so the signal is
      positive when the line is on the left (steer left) and scales with lateral offset,
      staying within the ±2 weight bound. kp = 3 gives a differential of about 1050
      PWM per unit signal, a firm but not saturating response. ki = 0.1 is kept small
      to avoid integral wind-up on curves. kd = 0.3 damps oscillation from the sensor-driven
      signal. base_speed = 1.5 targets the roughly 1.5 m/s average needed to finish
      within 3 s while leaving margin for cornering. line_loss = last_direction so
      the robot continues the way it was turning when the line is lost at the edge
      of a bend. Expected result: completion on the oval and s-bend with modest line
      error; the slalom and tighter unseen tracks may show oscillation or line loss,
      which the Evaluator and next telemetry should expose. All measurements are requested
      so the next iteration can tune kp, kd and base_speed against measured rms_error,
      steering_oscillation and line_loss_events.


      - [Open this output](iteration-0/entity0/versions/8ec16b2403aa43ed84d6ab0305529af1/payload.json)'
  actions:
  - id: action0
