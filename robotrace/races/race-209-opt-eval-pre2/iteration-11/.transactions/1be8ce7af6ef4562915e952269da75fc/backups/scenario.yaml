map:
  id: race-209-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: Slower base speed 1.1
    notes: 'Keeps the verified iteration-10 geometry and gains, lowering base_speed
      from 1.2 to 1.1 to give more time to correct on tight bends. Evidence: speed
      was the only change that moved the score, and oval completion was 20 of 20 at
      1.2.


      ### Rationale


      Evidence: iteration 10 is the best verified design (374.4). Its oval result
      is 20 of 20 finishes, mean progress 0.998, mean time 1.88 s, and rms_error 0.014.
      Its s-bend (progress 0.32) and slalom (progress 0.10) still leave the tape,
      with about 1 line-loss event per run. Dropping base_speed from 1.3 to 1.2 is
      the only change that has moved the result, since the kd and kp changes in iterations
      6, 8 and 9 left scores unchanged. The held-back track has a different shape,
      so the robot has to survive bends, not just finish the oval. The failures on
      s-bend and slalom are tight alternating bends where the robot runs wide and
      exits the 0.06 m band. Speed is the lever that has shown an effect, so I am
      taking it further in the same direction. Changes: (1) base_speed 1.2 to 1.1,
      giving more time to correct at bends. Oval finish time should rise from about
      1.88 s to about 2.05 s, still well inside the 3.0 s limit. The time term loses
      about 2 points and completion should hold. (2) Keep the verified geometry exactly:
      8 mm sensors at x = -0.016 to +0.016 m, y = 0.06 m, wheel_track 0.10 m, wheel_radius
      0.03 m, body 0.12 x 0.12 m, mass 0.6 kg. (3) Keep kp 2.0, ki 0.1 and kd 0.6,
      which are verified. Expected result: oval completion at or near 1.0, s-bend
      progress above 0.35, slalom progress above 0.11, and line_loss_events and steering_oscillation
      at or below iteration 10 levels. Risk: the slower speed may cost finish reliability
      on the oval. The telemetry should show whether bend progress rises.


      - [Open this output](iteration-11/entity0/versions/3601d6a1e81b4fb39da3d1c19425d1ac/payload.json)

      - Based on: [entityR2A](iteration-11/entityR2A/versions/carried-56e76d0458e197bc/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critique of the 1.1 m/s draft: the last speed cut lowered bend progress
      (s-bend 0.335 to 0.318, slalom 0.112 to 0.103), contradicting the draft''s prediction.
      The score gain came only from oval completions, and the time-term cost is understated.


      - [Open this output](iteration-11/entityC1/versions/4d3bd3c1a9824075b68b34a4b0eea53a/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/3601d6a1e81b4fb39da3d1c19425d1ac/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-56e76d0458e197bc/payload.json)'
  - id: entity1
    label: Verified plant, speed 1.3
    notes: 'Restores the raced iteration-7 geometry (344.5) and changes only base_speed
      from 1.5 to 1.3 to test whether slower entry helps the s-bend and slalom. The
      draft''s unraced geometry was rejected because iterations 8 and 9 reproduced
      the verified score exactly.


      ### Rationale


      Evidence: the only verified best design is the raced iteration-7 design (score
      344.5): body 0.18 x 0.12 m, mass 0.8 kg, wheel_track 0.12 m, five 12 mm sensors
      at x = -0.02 to +0.02 m, y = 0.05 m, kp 2.0, ki 0.5, kd 0.25, base_speed 1.5,
      line_loss ''search_left''. It finished 17 of 20 oval runs (mean progress 0.95,
      mean time 1.86 s). Its s-bend (progress 0.34) and slalom (0.11) still leave
      the tape, with 1.15 and 1.25 line-loss events per run.


      Critique points accepted: (a) The draft''s plant claim was wrong. Its ''iteration-7
      geometry'' (body 0.12, mass 0.6, wheel_track 0.10, sensors at y 0.06, 8 mm footprints)
      was never the raced design. Iterations 8 and 9 reproduced 344.4979 to four decimals
      on every track, which means the race ran the verified design and not the altered
      geometry. The draft''s geometry is therefore rejected, and I restore the verified
      geometry exactly. (b) kd 0.4 (iteration 8) gave no measurable change, so kd
      stays at 0.25. (c) The identical metrics in iterations 6, 8 and 9 mean the simulator
      may not respond to some edits. Only one variable is changed here, so any result
      is attributable.


      Critique points rejected: the draft''s base_speed 1.2 on the wrong geometry
      is not a test of anything verified, so I do not carry it forward as-is. I do
      test speed, but on the verified plant and at a milder step.


      Change from iteration 7: base_speed 1.5 to 1.3, nothing else. Speed is the one
      lever not yet tested on the verified plant, and the s-bend and slalom failures
      are spatial, so a slower entry could give the controller more time to correct
      tight alternating bends. The oval time should rise from about 1.86 s to about
      2.15 s, still under the 3.0 s limit, so oval completion should hold. The time
      term loses about 6 points on each finish.


      Expected result: oval completion stays at or near 0.85 and s-bend progress rises
      above 0.34. Falsification: oval completions below 15 of 20, or s-bend progress
      at or below 0.34, rejects the speed hypothesis and returns base_speed to 1.5.
      An identical score would show the change did not reach the race, which is a
      simulator issue rather than a design result.


      - [Open this output](iteration-10/entity1/versions/43c69a2522bd41e38076a398770c650d/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/4bfeea3288964cc1a0a4edc868efe08b/payload.json),
      [entityC1](iteration-10/entityC1/versions/442a8564dec347e68a882134c05ee7c6/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-deb90022f1143262/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Critiques the base_speed 1.3 candidate on the verified plant. Key points:
      the rationale cites an iteration-3 speed test that the outcome table contradicts
      (base_speed 1.5), lower base PWM raises effective steering gain, and the time-limit
      risk on an unseen track is understated. Based on the contracts and race outcome
      table.


      - [Open this output](iteration-10/entityC2/versions/8e8a3520437043f08fbb15f893571546/payload.json)

      - Based on: [entity1](iteration-10/entity1/versions/43c69a2522bd41e38076a398770c650d/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-deb90022f1143262/payload.json)'
  - id: entity2
    label: Speed 1.3 test on best
    notes: 'Keeps the scored 344.5 record (kd 0.35, last_direction, verified geometry)
      and changes only base_speed 1.5 to 1.3 to test whether slower entry helps the
      s-bend and slalom. The record, not the conflicting entity1 text, is the baseline
      because it is the only design with a reproduced score.


      ### Rationale


      Evidence: the only design with a verified score is the raced iteration-7 design,
      which scored 344.4979. Iterations 8 and 9 reproduced that score to four decimals
      on all 60 trials, so the race is deterministic and the record is trustworthy.
      The outcome table records that design as kd 0.35, ki 0.5, kp 2.0, base_speed
      1.5, line_loss ''last_direction''. The authorized entity1 text describes kd
      0.25 and ''search_left'', which never raced and conflicts with the scored record.
      I therefore keep the scored record, not the entity1 text. Its oval completion
      is 17 of 20 (mean progress 0.95, mean time 1.86 s). Its s-bend (progress 0.34,
      1.15 line-loss events) and slalom (progress 0.11, 1.25 line-loss events) both
      still leave the tape.


      Critique points accepted: the draft''s altered plant (body 0.12, mass 0.6, wheel_track
      0.10, sensors at y 0.06) was never raced, so I restore the verified geometry
      exactly. kd is not a tuning lever in this range (0.25 and 0.35 and 0.4 gave
      identical results), so I keep kd 0.35 as raced. The round-2 critique''s point
      that the record should be the baseline is also accepted.


      Critique points partly accepted: speed is the one lever not yet tested on the
      verified plant, and the s-bend and slalom failures are spatial, so a slower
      entry may give more correction time. I test base_speed 1.5 to 1.3 as the only
      change. The critique warns that lower base PWM raises effective steering gain,
      so steering_oscillation may rise, and that the oval time rises from about 1.86
      s toward about 2.15 s, still under 3.0 s. I accept that risk because this is
      a test on an iteration that is followed by one more iteration, and reverting
      is cheap.


      Change from the scored record: base_speed 1.5 to 1.3, nothing else.


      Expected result: oval completion stays at 15 to 17 of 20, and s-bend progress
      rises above 0.335. I expect steering_oscillation on the oval to rise modestly
      from 0.197, because of the higher effective gain. Falsification: oval completions
      below 15 of 20, or a total score below 344.5, rejects the speed hypothesis,
      and base_speed returns to 1.5 for the final design. A mixed result (oval unchanged,
      s-bend progress up slightly) is treated as inconclusive, and I would not change
      the final design on it alone. An identical score would indicate the change did
      not reach the race.


      - [Open this output](iteration-10/entity2/versions/6dfc03c03f774e3e972bb0fc47a00e0b/payload.json)

      - Based on: [entity1](iteration-10/entity1/versions/43c69a2522bd41e38076a398770c650d/payload.json),
      [entityC2](iteration-10/entityC2/versions/8e8a3520437043f08fbb15f893571546/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-deb90022f1143262/payload.json)'
