map:
  id: race-209-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Slower entry, verified
    notes: 'Keeps the iteration-7 geometry (best score 344.5) and reverts kd to 0.6,
      then lowers base_speed to 1.2 to test whether slower bend entry fixes the s-bend
      and slalom failures. Iteration 9''s identical scores suggest kd changes had
      no effect, so this is a single-variable test of speed.


      ### Rationale


      Evidence: iteration 7 is the best verified design (344.5). Its oval result was
      17 of 20 finishes (progress 0.95, mean time 1.86 s). Its s-bend (progress 0.34)
      and slalom (progress 0.11) still leave the tape, with 1.15 and 1.25 line-loss
      events per run and steering oscillation of 0.22 and 0.14. Iteration 9 changed
      only kd (0.6 to 0.8) and reproduced iteration 7''s scores to four decimals on
      every track, so kd does not appear to change the outcome, and the same happened
      for the kp and base_speed changes in iteration 6. The only verified gain is
      the iteration-7 plant change.


      Changes: (1) Restore kd to 0.6, the verified value, so the draft is not confounded
      by the iteration-9 change. (2) Keep the full iteration-7 geometry: 8 mm sensors
      at x = -0.016 to +0.016 m (8 mm spacing), y = 0.06 m, wheel_track 0.10 m, wheel_radius
      0.03 m, body 0.12 x 0.12 m, mass 0.6 kg. (3) Lower base_speed from 1.3 to 1.2
      m/s. The s-bend and slalom failures are tight alternating bends where the robot
      runs wide, so a slower entry gives more time to correct. The oval finish time
      rises from about 1.86 s to roughly 2.0 s, still inside the 3.0 s limit, so completion
      should hold. The time term loses only a few points. (4) Keep kp 2.0 and ki 0.1,
      since the motor-mismatch correction is still useful.


      Expected result: the oval completion rate stays at or near 0.85, with mean finish
      time about 2.0 s. s-bend and slalom progress should rise, and line-loss events
      and oscillation should fall. This is a single-variable test of speed, so the
      telemetry should show whether speed is what limits the bends. If the score does
      not move, the next step should test sensor weights or a larger kp change on
      the verified geometry.


      - [Open this output](iteration-10/entity0/versions/4bfeea3288964cc1a0a4edc868efe08b/payload.json)

      - Based on: [entityR2A](iteration-10/entityR2A/versions/carried-deb90022f1143262/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critique of the draft: the speed-only test contradicts iteration 3 and
      iteration 6, where speed and kp changes returned identical metrics, so the speed
      mechanism is unsupported. Recommends testing line_loss, and asks for falsifiable
      thresholds.


      - [Open this output](iteration-10/entityC1/versions/442a8564dec347e68a882134c05ee7c6/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/4bfeea3288964cc1a0a4edc868efe08b/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-deb90022f1143262/payload.json)'
  - id: entity1
    label: Verified plant, speed 1.3
    notes: 'Restores the raced iteration-7 geometry (344.5) and changes only base_speed
      from 1.5 to 1.3 to test whether slower entry helps the s-bend and slalom. The
      draft''s unraced geometry was rejected because iterations 8 and 9 reproduced
      the verified score exactly.


      ### Rationale


      Evidence: the only verified best design is the raced iteration-7 design (score
      344.5): body 0.18 x 0.12 m, mass 0.8 kg, wheel_track 0.12 m, five 12 mm sensors
      at x = -0.02 to +0.02 m, y = 0.05 m, kp 2.0, ki 0.5, kd 0.25, base_speed 1.5,
      line_loss ''search_left''. It finished 17 of 20 oval runs (mean progress 0.95,
      mean time 1.86 s). Its s-bend (progress 0.34) and slalom (0.11) still leave
      the tape, with 1.15 and 1.25 line-loss events per run.


      Critique points accepted: (a) The draft''s plant claim was wrong. Its ''iteration-7
      geometry'' (body 0.12, mass 0.6, wheel_track 0.10, sensors at y 0.06, 8 mm footprints)
      was never the raced design. Iterations 8 and 9 reproduced 344.4979 to four decimals
      on every track, which means the race ran the verified design and not the altered
      geometry. The draft''s geometry is therefore rejected, and I restore the verified
      geometry exactly. (b) kd 0.4 (iteration 8) gave no measurable change, so kd
      stays at 0.25. (c) The identical metrics in iterations 6, 8 and 9 mean the simulator
      may not respond to some edits. Only one variable is changed here, so any result
      is attributable.


      Critique points rejected: the draft''s base_speed 1.2 on the wrong geometry
      is not a test of anything verified, so I do not carry it forward as-is. I do
      test speed, but on the verified plant and at a milder step.


      Change from iteration 7: base_speed 1.5 to 1.3, nothing else. Speed is the one
      lever not yet tested on the verified plant, and the s-bend and slalom failures
      are spatial, so a slower entry could give the controller more time to correct
      tight alternating bends. The oval time should rise from about 1.86 s to about
      2.15 s, still under the 3.0 s limit, so oval completion should hold. The time
      term loses about 6 points on each finish.


      Expected result: oval completion stays at or near 0.85 and s-bend progress rises
      above 0.34. Falsification: oval completions below 15 of 20, or s-bend progress
      at or below 0.34, rejects the speed hypothesis and returns base_speed to 1.5.
      An identical score would show the change did not reach the race, which is a
      simulator issue rather than a design result.


      - [Open this output](iteration-10/entity1/versions/43c69a2522bd41e38076a398770c650d/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/4bfeea3288964cc1a0a4edc868efe08b/payload.json),
      [entityC1](iteration-10/entityC1/versions/442a8564dec347e68a882134c05ee7c6/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-deb90022f1143262/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Critiques the reverted iteration-7 design and its reproduction-check rationale.
      Evidence is the 60-trial race data for iterations 7 and 8, where kd 0.25 and
      0.4 gave identical metrics and the s-bend and slalom never finished.


      - [Open this output](iteration-9/entityC2/versions/0089386a6d5348afbe8197ad7eacb3d1/payload.json)

      - Based on: [entity1](iteration-9/entity1/versions/9eeefaf27f6d462f8ebefd6fd5fa667f/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-deb90022f1143262/payload.json)'
  - id: entity2
    label: Verified best
    notes: 'Resubmits the raced 344.4979 design exactly (kd 0.35, ki 0.5, line_loss
      last_direction), rejecting the unraced kd 0.25 / search_left variant. Iteration
      8 reproduced the score to four decimals, so the outcome table is the basis for
      this choice.


      ### Rationale


      Decision: resubmit the verified best design exactly as it raced in iteration
      7 and iteration 8 (score 344.4979). The round-2 critique and the authorized
      entity1 text describe a different configuration (kd 0.25, line_loss ''search_left'').
      I reject that configuration as the submission because the outcome record does
      not support it. Iteration 7''s design, as recorded in the outcome table and
      produced in my own history, was kd 0.35, ki 0.5, kp 2.0, base_speed 1.5, line_loss
      ''last_direction''. That is the only configuration with a measured score of
      344.4979, and iteration 8 reproduced it to four decimals on all 60 trials. The
      search_left and kd 0.25 variant has never raced, so it has no evidence behind
      it.


      What I kept: every value of the raced 344.5 design, including geometry (five
      12 mm sensors at x = -0.02 to +0.02 m, y = 0.05 m; body 0.18 x 0.12 m; mass
      0.8 kg; wheel_track 0.12 m; wheel_radius 0.03 m) and the controller (kp 2.0,
      ki 0.5, kd 0.35, base_speed 1.5, line_loss ''last_direction'', weights -2 to
      2).


      What I did not change: no new single-variable test. Critique points against
      kd 0.4 and against search_left are accepted as reasons not to advance them now.
      Points that the final track may differ from the oval are noted, but the s-bend
      and slalom failures have no tested fix that would not risk the only proven gain.


      Expected result: about 344.5 on the development set, with oval completion near
      0.85 (17 of 20), and s-bend and slalom still failing (progress about 0.34 and
      0.11). Reproducibility is already shown by iteration 8, so this race is a repeat
      check and adds little new information. The next iteration, if any single-variable
      test is run, should state its baseline as kd 0.35 / last_direction.


      - [Open this output](iteration-9/entity2/versions/a80339ff5ce24cb3af73937a904f09f0/payload.json)

      - Based on: [entity1](iteration-9/entity1/versions/9eeefaf27f6d462f8ebefd6fd5fa667f/payload.json),
      [entityC2](iteration-9/entityC2/versions/0089386a6d5348afbe8197ad7eacb3d1/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-deb90022f1143262/payload.json)'
