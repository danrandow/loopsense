  - id: entity2
    label: kd 0.35, single change
    notes: 'Drops the unsupported search_left change and tests kd alone (0.25 to 0.35)
      on the iteration 5 design, since ki 0.5 raised oscillation to 0.152. Evidence:
      all 60 trials ended off_track at progress 0.13 to 0.40, and the line-loss change
      was within run-to-run noise.


      ### Rationale


      Evidence: iteration 5 (kp 2.0, ki 0.5, kd 0.25, base_speed 1.5, line_loss last_direction)
      is the best design at 99.67. All 60 development trials across three tracks ended
      off_track between progress 0.13 and 0.40, with no finish except one oval run
      in iteration 4. A correction to earlier reasoning: iteration 4 changed kd (0.15
      to 0.25) and ki (0.05 to 0.3) together, so the gain attributed to ki alone was
      not isolated. The clean isolated step is iteration 5 (ki 0.3 to 0.5 only). Oval
      steering_oscillation has risen with ki (0.110, 0.125, 0.152) and is close to
      the 0.16 failure line.


      Critique points accepted: (1) The line_loss change to search_left is dropped.
      The critique''s argument holds: the evidence does not show that line loss starts
      the failure, the fixed direction has no sign basis, and the expected max_error
      change (about 0.0001 to 0.002) is inside the run-to-run spread (0.0608 to 0.0633).
      Line_loss returns to last_direction, the iteration 5 setting. (2) The ki 0.8
      step stays rejected, because oscillation is already rising with ki. (3) The
      critique''s point that the rationale did not state what the next lever is accepted,
      so this iteration names one.


      Critique points rejected or deferred: I do not raise kp, shrink the track, move
      the sensors, or change mass or base_speed. Speed stays at 1.5 because the 3
      s finish is not reached by any run, and changing speed alone would be confounded
      with the failure mode, as iteration 3 showed.


      Change from iteration 5: kd 0.25 to 0.35, nothing else. Hypothesis: derivative
      action damps the oscillation that the higher ki introduced, so oval steering_oscillation
      should fall, and max_error and progress should hold or improve. This is the
      first clean test of kd alone. Success: oval steering_oscillation below 0.152
      with oval progress at or above 0.40 and max_error at or below 0.0627. Failure:
      oscillation or progress worse than iteration 5 on two or more tracks, in which
      case kd returns to 0.25. Expected result: a modest change in oscillation and
      max_error, not a finish. The 500-point completion term remains unmet, and the
      next iteration should decide on a speed test only if progress stays at or below
      0.40 with no finishes.


      - [Open this output](iteration-7/entity2/versions/db5abbb6620e4d3f9ab84a2b04378a85/payload.json)

