map:
  id: race-209-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Finer sensors, wider
    notes: 'Builds on the best-scoring design (iteration 2, 64.09) with smaller 8
      mm sensors spread to +/-0.03 m, kd raised to 0.6 and base speed trimmed to 1.4.
      Evidence: every run still ended off-track with max_error at or above the 0.06
      m limit, and iteration 3''s forward move scored lower.


      ### Rationale


      Evidence: all 60 development trials across iterations 1 to 3 ended off_track
      with zero finishes. Iteration 2 (kp 1.5, kd 0.5, sensors at y=0.05 spanning
      +/-0.024 m) is the best so far at 64.09. Iteration 3 moved the sensors forward
      to y=0.07, widened them to +/-0.03 m, and cut kp, kd and base_speed. It scored
      lower (61.07), so moving the sensors forward is not the fix. Max_error stays
      at 0.063 to 0.067 against the fixed 0.06 m off-track limit (body_width/4 cannot
      raise it above 0.06 within the allowed body range). Steering oscillation is
      still 0.11 to 0.16 and 1 to 2 line-loss events occur per run, so the loop is
      still overshooting at the edges of the tape.


      Changes from iteration 2, one group at a time: (1) Sensor footprint reduced
      from 0.012 to 0.008 m. A smaller footprint gives a sharper edge response, so
      the signal changes less smoothly near the tape boundary. (2) Sensor spread widened
      to x = -0.03, -0.015, 0, 0.015, 0.03 m at the iteration-2 forward position y=0.05,
      so the outer sensors keep the tape in view on tight bends and line loss is less
      likely. (3) kd raised from 0.5 to 0.6 to damp the faster signal change that
      the finer sensors produce. (4) kp kept at 1.5 and ki at 0.05, since iteration
      2 showed kp 1.5 is better than 3.0. (5) base_speed reduced from 1.5 to 1.4,
      a small margin so the robot can correct at bends. Wheel geometry, mass and body
      are unchanged to keep the comparison with iteration 2 clean.


      Expected result: max_error just under 0.06, steering oscillation below 0.12,
      and line-loss events at 0 to 1 per run. Progress should rise above 0.2, with
      a first chance at completion on the oval and s-bend. The slalom may remain the
      hardest track. The next telemetry should show whether the narrower sensors and
      wider spread reduced max_error and line loss at this speed.


      - [Open this output](iteration-4/entity0/versions/b687718243214804a0b6df5b6b2f7f51/payload.json)

      - Based on: [entityR2A](iteration-4/entityR2A/versions/carried-28a093bccd8517a8/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critique of the draft: it cuts base_speed again though the last cut lowered
      progress, raises kd though oscillation rose with kd earlier, and repeats the
      span already tested in iteration 3. It also flags an untested ki and motor-mismatch
      offset explanation, based on iterations 1 to 3 telemetry summaries.


      - [Open this output](iteration-4/entityC1/versions/e9b7bdbfb77e4d36a9f549ea945f18ad/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/b687718243214804a0b6df5b6b2f7f51/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-28a093bccd8517a8/payload.json)'
  - id: entity1
    label: Iter 2 + integral test
    notes: 'Returns to the iteration-2 best (64.09) geometry, kp, kd and base_speed,
      and changes only ki from 0.05 to 0.3 to test whether a steady motor-mismatch
      offset causes the max_error past 0.06. Rejects the critique''s speed and kd
      cuts, which the iteration-3 and kd evidence did not support.


      ### Rationale


      Evidence: all 60 development trials in iterations 1 to 3 ended off_track with
      zero finishes. The best score so far is iteration 2 (64.09: kp 2.0, kd 0.25,
      ki 0.05, base_speed 1.5, sensors at y 0.05 with x from -0.02 to 0.02 m, size
      0.012). Iteration 3 moved the sensors forward and widened them (61.07), and
      cutting base_speed to 1.3 lowered progress, so both moves are rejected. max_error
      stays at 0.063 to 0.067 against the fixed 0.06 m limit, and steady-state offset
      is a plausible cause. A fixed left/right motor mismatch produces a consistent
      lateral pull, which proportional control holds as a constant offset. Only the
      integral term removes that offset, and at ki 0.05 it is nearly inert.


      Critique points accepted: (a) the draft changed five things at once, so its
      result could not be attributed; I return to the iteration-2 layout and controller.
      (b) Reducing base_speed contradicts the evidence and the 3 s finish requirement,
      so base_speed returns to 1.5. (c) The kd rise to 0.6 is unsupported and likely
      amplifies sensor noise, so kd returns to 0.25. (d) The smaller 0.008 m footprint
      and the wider span are not shown to help and are reverted to the iteration-2
      values. (e) The offset hypothesis from point 6 is adopted as the one change
      under test.


      Critique points partly rejected: the critique says the sensor-footprint and
      span changes are untested, but iteration 3 already showed that moving and widening
      the array did not help, so I do not re-test sensing now.


      Change from iteration 2: ki raised from 0.05 to 0.3, and nothing else. At the
      +/-2 integral cap, ki 0.3 adds up to 0.6 turn units (about 210 PWM), a moderate
      correction. The next race therefore isolates whether an integral term reduces
      max_error from a steady drift.


      Expected result: if max_error has a consistent sign across seeds, max_error
      should fall to about 0.06 or below and line_loss_events should drop to 0 to
      1. Success thresholds: max_error below 0.06 on the oval, and steering_oscillation
      at or below 0.12. If oscillation rises above 0.16 with no max_error gain, the
      offset hypothesis is wrong and ki should go back to 0.05. Any finish counts
      as a clear improvement.


      - [Open this output](iteration-4/entity1/versions/7a0f2c3508b9458babcc93889e535168/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/b687718243214804a0b6df5b6b2f7f51/payload.json),
      [entityC1](iteration-4/entityC1/versions/e9b7bdbfb77e4d36a9f549ea945f18ad/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-28a093bccd8517a8/payload.json)'
  - id: entityC2
    label: Round-2 critique
    notes: 'Critiques the sensor-only revision (controller held at iteration 2, sensors
      moved to y 0.06 m and widened to 0.048 m). Argues the forward move adds negligible
      look-ahead, that the fallback kp 1.7 contradicts the flat kp-to-max_error data,
      and that the first departure point is never located.


      - [Open this output](iteration-3/entityC2/versions/2b293c6bf4564db8beb2551f6fd659f8/payload.json)

      - Based on: [entity1](iteration-3/entity1/versions/6c4cc3ab8b744a2796284c131c3443ee/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-eccca8e394ebff97/payload.json)'
  - id: entity2
    label: Forward sensor probe
    notes: 'Controller returned to iteration 2 exactly; only sensing changes, moving
      the array to y 0.06 m and widening x to ±0.024 m at 0.012 m spacing. Kept the
      controller and base_speed because the critique''s point that kp barely moves
      max_error is supported by the race data, and the expected effect of the sensing
      change is small.


      ### Rationale


      Evidence: iteration 2 (kp 2.0, ki 0.05, kd 0.15, base_speed 1.5, sensors at
      y 0.05 with x from -0.02 to 0.02 m) left all 60 trials off-track with zero finishes.
      Max_error was 0.063 to 0.066, just past the 0.06 m limit on every track. Progress
      was 0.12 to 0.19, so departures happen in the first metre or so. Line-loss events
      were 1 to 2 per run and steering_oscillation was 0.11 to 0.16. The telemetry
      is aggregated, so it does not show where the first departure happens.


      Critique of the revision (entityC2) and what I kept: I accept that a 1 cm forward
      move gives only about 7 ms of extra look-ahead at 1.5 m/s, so I do not expect
      a large max_error change from sensing alone. I accept that kp has barely moved
      max_error across iterations 1 and 2 (oval 0.0612 to 0.0633, s-bend 0.0663 to
      0.0662), so kp 1.7 is not my next step on the strength of that evidence. I accept
      that the rationale did not quantify the sensor lag or say what result would
      make the isolation worth an iteration. I also accept that ''steering_oscillation
      at or below 0.11'' cannot discriminate, because it equals the iteration 2 baseline.


      What I kept: the controller is returned exactly to iteration 2 (kp 2.0, ki 0.05,
      kd 0.15, base_speed 1.5, last_direction line loss), so this race isolates the
      sensing change. base_speed stays at 1.5 because lowering it would risk missing
      the 3 s limit, and the critique''s contradiction point is correct. The 0.012
      m spacing is kept so that adjacent footprints abut with no dead zones.


      What I changed from the critique''s suggested path: I keep the forward move
      to y 0.06 and the x span of -0.024 to 0.024 m as a probe of sensor lag, and
      I state the limit of that probe. Its expected effect is small (max_error maybe
      a few mm at most), so a null result is informative: it would confirm that sensing
      lead is not the cause of departures. I do not commit to kp 1.7 as the fallback.
      If max_error does not fall, the next iteration will change the failure-mode
      lever, not the same gain, and I will decide which lever once the first-departure
      timing is known.


      Risk on speed: no run has finished, so completion (500 points) remains untested.
      I will not raise or lower base_speed on this race alone. If completion_time
      is reported above 3 s with progress well below 1 and few line-loss events, base_speed
      becomes the first suspect and I will test it in steps of 0.1.


      Expected result: max_error on the oval moves toward 0.06 or below, with a small
      or zero change in line-loss events. Success threshold: any finish, or progress
      above 0.25 on all three tracks. I accept that a null result on max_error is
      the most likely outcome, and that it still tells the next iteration that sensing
      lead is not the main problem.


      - [Open this output](iteration-3/entity2/versions/0bfd14b3c3f94c04ab813a1c63000d78/payload.json)

      - Based on: [entity1](iteration-3/entity1/versions/6c4cc3ab8b744a2796284c131c3443ee/payload.json),
      [entityC2](iteration-3/entityC2/versions/2b293c6bf4564db8beb2551f6fd659f8/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-eccca8e394ebff97/payload.json)'
