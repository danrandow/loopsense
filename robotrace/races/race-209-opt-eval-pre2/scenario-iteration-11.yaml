  - id: entity2
    label: 'Final: verified iter-10'
    notes: 'Resubmits the iteration-10 design unchanged (score 374.39, 20/20 oval
      finishes), rejecting the draft''s unraced geometry and base_speed 1.1. The authorized
      entity1 text conflicts with the scored record on kd and line_loss, so the record
      was kept.


      ### Rationale


      Decision: submit the iteration-10 design exactly as it raced (score 374.386),
      with no further change. The authorized entity1 text lists kd 0.25 and line_loss
      ''search_left'' with base_speed 1.3. Those values do not match the scored record,
      which shows kd 0.35 and line_loss ''last_direction'' for iteration 10. I keep
      the scored record, because the score is only attributable to the values that
      actually raced. The draft''s geometry (8 mm sensors, body 0.12 x 0.12 m, mass
      0.6 kg, track 0.10 m) and its base_speed 1.1 were never raced, so I reject them.
      Evidence: iteration 10 finished 20 of 20 oval runs (mean progress 0.998, mean
      time 1.88 s, score 950 per oval run). Its s-bend (progress 0.318) and slalom
      (progress 0.103) still leave the tape, with about 1 line-loss event per run.
      Iterations 8 and 9 reproduced the same design to four decimals, so the result
      is deterministic. The score depends heavily on the oval. The held-back track
      is of unknown shape, so the 374 figure may not transfer, and I do not claim
      bend-track gains. Kept: body 0.18 x 0.12 m, mass 0.8 kg, wheel_track 0.12 m,
      wheel_radius 0.03 m, five 12 mm sensors at x = -0.02 to +0.02 m and y = 0.05
      m, kp 2.0, ki 0.5, kd 0.35, base_speed 1.3, line_loss ''last_direction''. Expected
      result: oval completion 0.95 to 1.0, time about 1.9 s, s-bend progress about
      0.32, slalom about 0.10.


      - [Open this output](iteration-11/entity2/versions/aa8ae7f3f1f64e05b2f5ba49dcbe2222/payload.json)

      - Based on: [entity1](iteration-11/entity1/versions/1be8ce7af6ef4562915e952269da75fc/payload.json),
