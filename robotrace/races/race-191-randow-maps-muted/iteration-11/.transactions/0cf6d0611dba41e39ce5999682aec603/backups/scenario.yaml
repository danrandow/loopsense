overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      This is the final iteration, so the delivered geometry is what the unseen-track
      race scores. The best measured design is iteration 8 (score 71.37): 0.4 kg mass,
      0.08 m track, 0.03 m wheel radius, seven 12 mm sensors at 20 mm spacing (x =
      ±0.06 m), lead y = 0.07 m, body 0.18 x 0.12 m. Iterations 9 and 10 each changed
      wheel radius and both scored lower. Radius 0.025 m dropped the score by 1.65,
      and radius 0.034 m dropped it by 1.05 against iteration 8. Radius 0.034 m raised
      the oval (87.3 vs 86.4) but lowered the s-bend and slalom, which are closer
      to the unseen shape. Mass and track are already at their minimums, and sensor
      lead, span and footprint have all been tested. The off-track floor of 0.06 m
      is fixed, and body width cannot relax it. I therefore return the iteration 8
      geometry unchanged rather than add an untested change to the final race. Every
      development run still ends off track near max_error 0.062-0.066 m, so this design
      is not a finished solution. It is the most robust measured platform for the
      Integrator''s controller.


      - [Open this output](iteration-11/entity0/versions/9e671f2bc7f040aab8c8d549f5f471c3/payload.json)

      - Based on: [entityR2A](iteration-11/entityR2A/versions/carried-f680d071c1d7f1e0/payload.json)'
  - id: entity1
    label: 'Final robot: iter 8'
    notes: 'Delivers the iteration 8 geometry and controller unchanged, the best measured
      design at 71.37. Neighbouring one-parameter changes (wheel radius 0.025 and
      0.034 m) scored lower, and the controller was not retuned because no gain was
      isolated from the geometry.


      ### Rationale


      This is the final iteration, so the delivered package must be the best measured
      design. Iteration 8 scored 71.37 and is the highest of all eleven races. Mass
      (0.4 kg) and track (0.08 m) are at their minimums, and the seven-sensor row
      at y = 0.07 m, span +/-0.06 m and 12 mm footprints are the settled sensing choices.
      Iterations 9 and 10 changed only wheel_radius, and both scored lower (0.025
      m gave 69.72 and 0.034 m gave 70.32), so 0.030 m stays. The geometry is therefore
      kept exactly as the Builder delivered it. The controller is kept exactly as
      iteration 8 (kp 1.25, ki 0, kd 0.30, base_speed 1.5, weights [2.0, 1.3, 0.7,
      0, -0.7, -1.3, -2.0], last_direction). I considered tuning it, but every controller
      value has been measured only in combination with iteration 8''s geometry, and
      the evidence does not isolate any single gain. The line-loss and max_error pattern
      (about 0.062 to 0.066 m, pinned at the fixed 0.06 m floor) is a geometry-level
      limit, so a blind gain change has no clear expected benefit. Changing the controller
      now would add untested risk to the only race that counts. The observation request
      adds controller_errors and noise_robustness to the usual set, so the package
      reports any exception and the noise margin.


      - [Open this output](iteration-11/entity1/versions/6ce0a648639542f69946eb537f6bb374/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/9e671f2bc7f040aab8c8d549f5f471c3/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-f680d071c1d7f1e0/payload.json)'
  - id: entityR1
    label: 'Final feedback: hold'
    notes: 'Recommends no geometry change, citing iterations 8 to 10 (71.37 vs 69.72
      and 70.32 for wheel radius). It explains the three controller compensations
      (sensor weights, kd for the lighter body, last_direction recovery) and marks
      the 0.06 m floor as the remaining limit.


      ### Feedback


      Written before the final race. The Builder''s geometry is the iteration 8 design,
      which scored 71.37, the best of all races. The Integrator kept the iteration
      8 controller unchanged, because no gain was ever isolated from the geometry.
      The controller needed three compensations for this geometry, all visible in
      the race history. First, the seven-sensor row at 20 mm spacing needed weights
      scaled to about 33 times x (iteration 5), because the outer sensors at +/-0.06
      m would otherwise dominate the signal. Second, the lighter 0.4 kg body needed
      kd raised from 0.25 to 0.30, since steering oscillation rose on the s-bend and
      slalom (0.173 and 0.168 against 0.161 at 0.6 kg in iteration 7). Third, last_direction
      line recovery was needed, because the outer sensors still lose the line once
      per run at the 0.06 m floor. Iteration 8 is the evidence for this package. Its
      controller and geometry were measured together, so any single-field change would
      be untested. If the final race (unseen track) shows max_error near 0.062 to
      0.066 m and line loss of about 1 on curves, the limit is the fixed off-track
      floor, and no body or sensor change from this design is expected to lift it.
      Changes to wheel_radius have been tested at 0.025, 0.030 and 0.034 m, and 0.030
      m was the best. Mass and track are at their minimums. No further geometry change
      is recommended.


      ### Requested changes


      - No change: keep the iteration 8 geometry (0.4 kg, 0.08 m track, 0.03 m wheel
      radius, seven 12 mm sensors at 20 mm spacing, y = 0.07 m, span +/-0.06 m) unchanged,
      because it is the best measured design (71.37) and each one-parameter change
      from it scored lower in iterations 9 and 10.


      - [Open this output](iteration-11/entityR1/versions/6ce0a648639542f69946eb537f6bb374/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/9e671f2bc7f040aab8c8d549f5f471c3/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-f680d071c1d7f1e0/payload.json)'
