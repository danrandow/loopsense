map:
  id: race-191-randow-maps-muted
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Sensor lead 0.07 m
    notes: 'Moves the sensor row 20 mm further forward (y 0.05 to 0.07 m), with all
      else unchanged, to test whether late sensing is causing the off-track failures.
      Based on iterations 0 and 1, where every run left the 0.06 m limit at 11-16%
      progress and drivetrain changes gave only small gains.


      ### Rationale


      Evidence: in both iterations every development run ended off track at 11-16%
      progress. Max error sits at 0.06-0.07 m, just past the off-track limit. With
      body_width 0.12 the limit is max(0.06, 0.0125 + 0.03) = 0.06 m. Iteration 1
      (track 0.12 to 0.10 m, mass 0.8 to 0.6 kg) raised the score only from 52.18
      to 52.33. It helped the s-bend (65.8 vs 64.1) and slightly hurt the oval (45.9
      vs 47.3), and runs still left the line. Body width cannot change the limit,
      since 0.18 m still gives the 0.06 m floor, so the robot must hold its error
      below 0.06 m. Drivetrain changes gave only small gains, which points to the
      sensing lead as the next lever. The current row is at y = 0.05 m, so the sensors
      see the line only about 0.05 m ahead of the axle. At speed the correction arrives
      late on curves. This iteration changes one thing: sensor forward position from
      y = 0.05 to y = 0.07 m, a 20 mm gain in lead, within the 0.08 m limit. Track
      0.10 m, mass 0.6 kg, wheel radius 0.03 m, body 0.18 x 0.12 m and the 12 mm sensors
      at 15 mm spacing stay the same, so any change can be attributed to the lead.
      Expected result: the robot sees the upcoming bend earlier, so max_error falls
      below about 0.05 m and progress rises on the oval and slalom. Risk: a longer
      lead can overshoot and increase steering oscillation on the slalom. If that
      happens, the next step is to shorten the lead or reduce spacing, not to change
      the body.


      - [Open this output](iteration-2/entity0/versions/920c1b61851446d5922a3defa416f442/payload.json)

      - Based on: [entityR2A](iteration-2/entityR2A/versions/carried-ffe78805d7ac41c0/payload.json)'
  - id: entity1
    label: Forward lead test y=0.07
    notes: 'Moves the sensor row from y=0.05 to y=0.07 m with the iteration 1 controller
      unchanged, to isolate whether extra lead reduces the off-track drift at 11-16%
      progress. Based on iteration 0 and 1 outcome tables, where drivetrain changes
      gave only small gains.


      ### Rationale


      Iterations 0 and 1 both ended all 60 development runs off track at 11-16% progress,
      with max_error of 0.061-0.070 m against the 0.06 m limit and one line-loss event
      per run. Steering oscillation stayed low on the oval (0.073), so the robot drifts
      steadily off the line rather than oscillating. Changing the drivetrain from
      track 0.12 to 0.10 m and mass 0.8 to 0.6 kg moved the score by only 0.14, so
      drivetrain is not the binding constraint. This iteration tests the Builder''s
      one remaining sensing lever: forward sensor lead from y = 0.05 to y = 0.07 m,
      which is inside the 0.08 m limit. I keep the controller identical to iteration
      1 (kp 1.25, kd 0.25, ki 0, base_speed 1.5, weights [1.2, 0.6, 0, -0.6, -1.2],
      last_direction) so any change in progress or max_error can be attributed to
      the lead. The added lead lets the sensors see the line earlier, so the existing
      gain should correct earlier on curves. The main risk is overshoot on the slalom,
      where kd 0.25 is the existing damping. I expect max_error to fall and progress
      to rise on the oval and s-bend, with steering_oscillation on the slalom staying
      near the iteration 1 level of about 0.15.


      - [Open this output](iteration-2/entity1/versions/33da632393c643e389a35f8dcec3aef3/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/920c1b61851446d5922a3defa416f442/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-ffe78805d7ac41c0/payload.json)'
  - id: entityR1
    label: Lead then radius or
    notes: 'Pre-race feedback: keep y=0.07 if progress rises and slalom oscillation
      stays low, drop to 0.065 if it overshoots, and otherwise test wheel_radius 0.035
      or 0.01 spacing. Each option cites the iteration 0 and 1 off-track and oscillation
      evidence.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. Iterations
      0 and 1 both ended off track at 11-16% progress with max_error of 0.061-0.070
      m and one line-loss event per run (iteration 0 and iteration 1 outcome tables).
      Changing the drivetrain (track 0.12 to 0.10 m, mass 0.8 to 0.6 kg) moved the
      score only from 52.18 to 52.33, so drivetrain is not what limits the run. This
      candidate tests the sensor lead alone, moving y from 0.05 to 0.07 m, with the
      controller unchanged. Depending on what the race shows: if progress rises on
      the oval and s-bend and max_error falls below 0.06 m, keep y = 0.07 m. If slalom
      steering_oscillation rises clearly above the iteration 1 level of about 0.15
      while max_error falls, the lead is overshooting, so use y = 0.065 m. If progress
      and max_error are within about 0.01 of iterations 0 and 1, the lead is not the
      constraint and the next change should be to the wheel or sensor spacing rather
      than to the lead again.


      ### Requested changes


      - If lead y = 0.07 m raises progress on the oval and s-bend with max_error below
      0.06 m, keep y = 0.07 m. If slalom steering_oscillation rises above about 0.16
      (iteration 1 slalom level 0.154), try y = 0.065 m to limit overshoot, citing
      the iteration 1 oscillation data.

      - If progress stays at 11-16% with max_error still near 0.06-0.07 m and line_loss_events
      still 1, the sensing lead is not the limit. Next try wheel_radius 0.035 m, because
      no iteration has tested speed or wheel size and iteration 0 and 1 gave no completions.

      - If line_loss_events rise above 1 at the larger errors seen near the limit,
      reduce the sensor spacing from 0.015 m to 0.01 m (x = +/-0.02 m) so the outer
      sensors stay on the tape, citing the iteration 1 telemetry on line loss at max_error
      0.06-0.07 m.


      - [Open this output](iteration-2/entityR1/versions/33da632393c643e389a35f8dcec3aef3/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/920c1b61851446d5922a3defa416f442/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-ffe78805d7ac41c0/payload.json)'
