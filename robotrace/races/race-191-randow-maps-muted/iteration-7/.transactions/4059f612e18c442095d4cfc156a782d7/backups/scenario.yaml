map:
  id: race-191-randow-maps-muted
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Narrow track to 0.08 m
    notes: 'Reverts the sensor footprint to 12 mm, the best measured configuration
      (iteration 5, 62.87), since 16 mm gave a lower aggregate score (62.13). Narrows
      wheel_track from 0.10 to 0.08 m to add yaw authority, since every run still
      fails at the fixed 0.06 m off-track floor and drivetrain changes are the untested
      lever.


      ### Rationale


      Iteration 6 (16 mm footprints) scored 62.13, below iteration 5''s 62.87. The
      oval improved (mean 72.5, zero line losses), but the s-bend was flat and the
      slalom gained only about 0.9 while the aggregate fell. The footprint change
      therefore did not clearly help, so I revert sensor_size to 0.012 m, the best
      measured configuration. Sensor lead (y = 0.07 m) and the seven-sensor +/-0.06
      m span are kept, since span is what removed oval line loss. Every run still
      ends off track with max_error about 0.06 m, which equals the fixed off-track
      floor, so the robot must hold a tighter line rather than widen its allowed band.
      Body width cannot relax that floor (0.18 m still gives 0.06 m), so it stays
      at 0.12 m. Drivetrain changes so far have moved the score by about 0.14, and
      the remaining untested lever is yaw authority. I narrow wheel_track from 0.10
      to 0.08 m, which raises turn rate per PWM difference and gives the controller
      more ability to correct at the floor error. Mass (0.6 kg) and wheel_radius (0.03
      m) stay fixed so this effect is isolated from the footprint revert. Expected
      result: max_error falls below 0.06 m on the s-bend and slalom, line_loss_events
      trends toward 0, and progress rises above iteration 5 values (0.165 s-bend,
      0.110 slalom). Risk: the narrower track gives more yaw per PWM count, which
      may raise steering_oscillation on the slalom above about 0.16.


      - [Open this output](iteration-7/entity0/versions/003589f4b604408693fc15673cddf5c7/payload.json)

      - Based on: [entityR2A](iteration-7/entityR2A/versions/carried-0b28e9f78adc8c71/payload.json)'
  - id: entity1
    label: 16mm footprint test
    notes: 'Changes only sensor_size from 0.012 to 0.016 m on the iteration 5 seven-sensor
      row, to test whether footprint gaps cause residual line loss on the s-bend and
      slalom. Evidence: iteration 5 removed line loss on the oval but not the curves.


      ### Rationale


      Evidence: iteration 5 (seven sensors at 20 mm spacing, span ±0.06 m, lead 0.07
      m, 12 mm footprints) removed line loss on the oval (0 events, progress 0.175,
      the best oval result so far). The s-bend and slalom still show 1 line-loss event
      per run, with max_error about 0.062 m and progress 0.165 and 0.110. Iteration
      4 showed that lead and span are no longer moving the s-bend, and iteration 5''s
      span change did not fix the curves. The Builder''s hypothesis is that gaps between
      12 mm footprints at 20 mm spacing let a 25 mm tape edge fall between sensors.
      I accept that test: sensor_size goes from 0.012 to 0.016 m, the largest allowed
      footprint, so each footprint overlaps its neighbours. Everything else stays
      fixed (seven sensors, y = 0.07 m, ±0.06 m span, track 0.10 m, mass 0.6 kg, wheel
      radius 0.03 m, body 0.18 x 0.12 m). Controller: iteration 5''s weights are kept
      at about 33 times x, since the footprint change alters readings but not the
      lateral geometry. kp 1.25, kd 0.25, ki 0, base_speed 1.5 and last_direction
      also stay unchanged, so any change in result is attributable to the footprint.
      Expected: line_loss_events near 0 on the s-bend and slalom, max_error at or
      below about 0.06 m, and more progress. Risk: a larger footprint averages more
      of the edge, which can soften the signal near centre and raise slalom oscillation.
      The observation request is kept so the race reports those metrics.


      - [Open this output](iteration-6/entity1/versions/75554d844687482a8658486e1aaf88eb/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/b1cf8251126c4b06b3482ee25558c2fc/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-b53044dd075274d6/payload.json)'
  - id: entityR1
    label: Footprint then wheel
    notes: 'Feedback is written before the race and states no outcome. It sets next
      steps for footprint, wheel_track and wheel_radius depending on whether line
      loss clears and whether slalom oscillation rises, citing iteration 5 data.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. Evidence
      from iteration 5 (best so far at 62.87): the seven-sensor ±0.06 m row removed
      line loss on the oval (0 events, progress 0.175), but the s-bend and slalom
      still show 1 line-loss event per run with max_error about 0.062 m and progress
      0.165 and 0.110. Iteration 4 showed lead and span saturating on the curves.
      This candidate tests footprint alone: sensor_size 0.012 to 0.016 m, so the 16
      mm footprints overlap at 20 mm spacing and the edge should not drop between
      sensors. Next race reading: if line_loss_events fall to 0 on the s-bend and
      slalom with max_error at or below about 0.06 m, keep sensor_size 0.016 m and
      move to the drivetrain or speed levers. If line loss is gone but the robot still
      leaves the track near 0.06 m, the limit is yaw authority, not sensing. If slalom
      steering_oscillation rises above about 0.18, the wider footprint is over-smoothing
      the signal near centre.


      ### Requested changes


      - If line loss is removed but the robot still leaves the track at about 0.06
      m max_error, try wheel_track 0.08 m for more yaw authority, citing iteration
      5''s max_error of 0.062 m on the s-bend and slalom. Keep kp scaled down (about
      1.0) to hold effective gain, since narrowing the track raises yaw gain.

      - If slalom steering_oscillation rises above about 0.18 with the 16 mm footprint,
      drop sensor_size back to 0.012 m, or reduce the outer weights to about +/-1.5
      (from +/-2.0), citing iteration 5''s slalom oscillation of 0.152 at 12 mm.

      - If the robot finishes the curves with line loss and off-track removed but
      progress stalls near 0.17 to 0.19 on the oval, try wheel_radius 0.035 m for
      more ground speed per wheel rotation, citing the flat progress across iterations
      1 to 5 where lead, span and footprint changes did not move the oval beyond 0.175.


      - [Open this output](iteration-6/entityR1/versions/75554d844687482a8658486e1aaf88eb/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/b1cf8251126c4b06b3482ee25558c2fc/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-b53044dd075274d6/payload.json)'
