map:
  id: race-191-randow-maps-muted
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Wider sensor span 20mm
    notes: 'Widens the sensor row to 20 mm spacing (outer sensors at ±0.04 m) at the
      best measured lead of 0.07 m, keeping the drivetrain fixed. The rationale is
      that the current 60 mm span loses the tape near the 0.0485 m offset, where runs
      reach max_error and go off track, and lead 0.08 m gave no further gain.


      ### Rationale


      Evidence across four iterations: every development run ends off track at 11-16%
      progress, with max_error near 0.06 m. The off-track limit is max(0.06, 0.0125
      + body_width/4), so the 0.06 m floor binds and body width cannot relax it. Drivetrain
      changes (track 0.12 to 0.10 m, mass 0.8 to 0.6 kg) moved the score by only 0.14.
      Moving sensor lead from y=0.05 to 0.07 m raised the score from 52.3 to 60.4,
      mostly on the oval. Lead 0.08 m gave 60.33, slightly worse than 0.07 m, with
      the slalom down about 0.18 and the oval flat. So lead has saturated near 0.07
      m and further lead gains are not available. The remaining candidate is sensor
      span. The outer sensors at x=±0.03 m with 12 mm footprints can only see tape
      when the robot''s centre offset is less than about 0.03 + 0.0125 + 0.006 = 0.0485
      m. Runs that reach max_error 0.06 m therefore have no tape under any sensor,
      which fits the single line-loss event per run. I change only the lateral spacing:
      20 mm instead of 15 mm, giving x = ±0.04 and ±0.02 m, at y = 0.07 m (the best
      measured lead). This extends capture to about 0.0605 m, which is just past the
      off-track limit. Wheels, mass, track, body and sensor size stay fixed, so the
      result isolates span. Expected result: fewer line-loss events, lower max_error
      on the oval and s-bend, and more progress. Risk: coarser spacing gives a less
      linear signal near centre, which may raise steering_oscillation on the slalom.
      If the oval improves but the slalom oscillates, the next step is to narrow spacing
      to about 17 mm or raise sensor_size to 0.016 mm rather than move the lead.


      - [Open this output](iteration-4/entity0/versions/20d843eca2554592a67600f1e5a9db81/payload.json)

      - Based on: [entityR2A](iteration-4/entityR2A/versions/carried-0b8c2a1f6c0edd60/payload.json)'
  - id: entity1
    label: Lead 0.08 m test package
    notes: 'Sensor lead pushed to the maximum y = 0.08 m with the controller held
      at iteration 2 settings, so the lead effect is isolated. Based on the +8.1 score
      gain from lead 0.05 to 0.07 m in iteration 2.


      ### Rationale


      Iteration 2 (sensor lead y = 0.07 m) raised the score from 52.3 to 60.4. The
      oval gained most: progress rose from 0.112 to 0.168, rms_error fell from 0.029
      to 0.019, and control_effort fell from 1.35 to 0.88. The slalom and s-bend did
      not move. Both still end off track at about 0.061-0.069 m max_error, against
      the 0.06 m limit. The s-bend progress was 0.16 at both lead 0.05 m and lead
      0.07 m, so lead is not what limits it. Lead is the one geometry lever with a
      measured, monotonic gain, so this iteration tests lead y = 0.08 m, the top of
      the allowed range. Geometry changes only in the lead (body 0.18 x 0.12 m, mass
      0.6 kg, track 0.10 m, wheel radius 0.03 m, 12 mm sensors at 15 mm spacing).
      The controller is kept identical to iteration 2 so the lead effect is isolated.
      Sensor weights are unchanged. The signal magnitude is the same at any lead,
      because the sensors keep their lateral positions. Only the timing of the correction
      changes. The main risk is slalom overshoot, which the observation request will
      show through steering_oscillation. I expect the oval to improve further, and
      I expect the s-bend and slalom to stay limited by gain or speed rather than
      by sensing.


      - [Open this output](iteration-3/entity1/versions/c17ce986b6fd4e868fa6627ec592531f/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/0c6d188bd8604d888aa5e2d099e7d37e/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-3955470e8f9fa835/payload.json)'
  - id: entityR1
    label: 'Next: wheel radius or'
    notes: 'Pre-race feedback that points the Builder to wheel_radius 0.035 m if the
      s-bend stays at 0.16 progress, since lead does not affect it (iterations 1 and
      2 match). Includes fallbacks for slalom overshoot and line loss.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. Iteration
      2 (lead y = 0.07 m, controller unchanged) gave the best score so far, 60.41,
      up from 52.33 at lead 0.05 m. The gain came from the oval, where progress rose
      from 0.112 to 0.168 and max_error stayed near 0.063. The slalom (progress 0.110)
      and s-bend (progress 0.160) did not change, and both still end off track. Iteration
      1 showed the s-bend progress was also 0.160 at lead 0.05 m, so the s-bend is
      not limited by lead. Depending on the next race: if the oval progress rises
      again and slalom steering_oscillation stays near the iteration 2 level of about
      0.15, keep lead 0.08 m and move to the spacing or speed levers. If slalom oscillation
      rises clearly above about 0.16 while max_error falls, lead is overshooting,
      so use y = 0.075 m. If progress and max_error are within about 0.01 of iteration
      2 on all tracks, lead has stopped being the limit, and the next change should
      be wheel_radius or sensor spacing.


      ### Requested changes


      - If lead 0.08 m leaves the s-bend at progress 0.16 with max_error near 0.061-0.069
      m (the same as leads 0.05 and 0.07 m), try wheel_radius 0.035 m. The s-bend
      result has not moved with lead (iterations 1 and 2 both 0.160), and no iteration
      has yet tested speed, which the 3 s finish limit needs.

      - If line_loss_events rise above 1 on the s-bend or slalom at max_error 0.06-0.07
      m, narrow the outer sensors to x = +/-0.02 m (10 mm spacing) so they stay on
      the 25 mm tape. Iteration 2 showed line loss still at 1 per run, so this is
      only a fallback.

      - If slalom steering_oscillation rises above about 0.16 at lead 0.08 m (iteration
      2 slalom was 0.149), move the lead back to y = 0.075 m, or raise wheel_track
      to 0.11 m to reduce yaw gain. Both are supported by the iteration 2 oscillation
      data.


      - [Open this output](iteration-3/entityR1/versions/c17ce986b6fd4e868fa6627ec592531f/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/0c6d188bd8604d888aa5e2d099e7d37e/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-3955470e8f9fa835/payload.json)'
