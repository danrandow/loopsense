map:
  id: race-191-randow-maps-muted
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Wider sensor span (7
    notes: 'Widens the row to seven sensors at 20 mm spacing spanning ±0.06 m, so
      outer sensors capture the tape past the 0.06 m off-track limit. Iteration 4
      showed that span, not lead, is now the limit, with the best score so far (61.45)
      and one line-loss per run.


      ### Rationale


      Four iterations give a consistent picture. Every development run ends off track
      at 11-16% progress, with max_error near 0.06 m. The off-track limit is max(0.06,
      0.0125 + body_width/4). Even the widest allowed body (0.18 m) gives only 0.0575
      m, so the 0.06 m floor binds and body width cannot help. Drivetrain changes
      moved the score by 0.14, so they are not the lever. Sensor lead gave the big
      gain (52.3 to 60.4) and saturated near y = 0.07 m, since 0.08 m was flat or
      slightly worse. Iteration 4 widened the row to a 60 mm span (20 mm spacing,
      outer sensors at ±0.04 m). It was the best result so far (61.45): the oval and
      s-bend improved and the slalom rose to 47.8 from 45.4. Line-loss events stayed
      at 1 per run. That fits the capture arithmetic: an outer sensor at x=±0.04 with
      a 12 mm footprint sees tape only while the centre offset is below about 0.04
      + 0.0125 + 0.006 = 0.0585 m, which is just inside the 0.06 m off-track limit,
      so the robot still reaches a state with no tape under any sensor. The span is
      the active sensing limit. I therefore widen the row again, to 7 sensors at 20
      mm spacing, spanning ±0.06 m. The outer sensors then capture to about 0.0785
      m, past the off-track limit, so the robot should keep a readable signal before
      it leaves the track. Lead stays at the best measured y = 0.07 m, and the sensor
      footprint (12 mm), wheel radius, track, mass and body are unchanged. That isolates
      the span lever. Expected result: line_loss_events falling toward 0, max_error
      below 0.06 m on the oval and s-bend, more progress on all tracks, and slalom
      oscillation near or below 0.15. Risk: seven sensors give more weights to set,
      and the outer sensors may dominate the signal at large errors, which could raise
      slalom oscillation. The next lever, if span is no longer binding, is wheel_radius
      for ground speed.


      - [Open this output](iteration-5/entity0/versions/b8df0a65d52e4fcd962f583a4439a65c/payload.json)

      - Based on: [entityR2A](iteration-5/entityR2A/versions/carried-0f14f7b9c4894155/payload.json)'
  - id: entity1
    label: 7-sensor ±0.06 m row
    notes: 'Widens the sensor row to seven sensors at 20 mm spacing (±0.06 m) at lead
      0.07 m, with weights scaled to about 33 times x. Iteration 4''s 20 mm span gave
      the best score (61.45) but still left line loss at 1 per run, which fits the
      outer-sensor capture limit.


      ### Rationale


      Iteration 4 is the best result so far (61.45). Its 20 mm spacing at lead 0.07
      m raised the oval and s-bend and lifted the slalom to 47.8, but line_loss_events
      stayed at 1 per run, which fits the capture limit of the outer sensors at ±0.04
      m. This iteration widens the row to seven sensors at 20 mm spacing, spanning
      ±0.06 m, all at y = 0.07 m. Outer sensors then capture to about 0.0785 m, past
      the 0.06 m off-track limit. Lead, footprint (12 mm), wheel radius, track, mass
      and body are unchanged, so the span is the only sensing change. The Builder
      suggested weights of 25 times x, but iteration 4 gave the best result at about
      40 times x. I use about 33 times x, [2.0, 1.3, 0.7, 0, -0.7, -1.3, -2.0], which
      keeps the lateral signal gain between the two tested values and stays inside
      the ±2 weight limit. kp, kd, base_speed and last_direction are unchanged from
      iteration 4. Expected result: line_loss_events falling toward 0, max_error below
      0.06 m on the oval and s-bend, and slalom steering_oscillation at or below about
      0.15. Risk: the outer sensors may dominate at large errors and raise slalom
      oscillation, in which case the outer weights should be reduced.


      - [Open this output](iteration-5/entity1/versions/701601defcbb4caab86f23262daf06ac/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/b8df0a65d52e4fcd962f583a4439a65c/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-0f14f7b9c4894155/payload.json)'
  - id: entityR1
    label: Span and speed next steps
    notes: 'Feedback that maps the seven-sensor result to next steps: reduce outer
      weights if the slalom oscillates, try wheel_radius if the s-bend stays at progress
      0.16, or try a larger sensor footprint if the robot still leaves the line. Based
      on iterations 2 to 4.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. Iteration
      4 (20 mm spacing, span ±0.04 m, lead 0.07 m) scored 61.45, the best so far,
      with the oval at progress 0.167, the s-bend at 0.163 and the slalom up to 47.8.
      Iteration 2 (lead 0.07 m, 15 mm spacing) scored 60.41, and iteration 3 (lead
      0.08 m) scored 60.33, so lead has saturated. Line_loss_events stayed at 1 per
      run in iteration 4, which fits the capture limit of about 0.0585 m for the ±0.04
      m sensors. Depending on the next race: if line_loss_events falls below 1 and
      max_error stays below 0.06 m on the oval and s-bend, keep the ±0.06 m span.
      If slalom steering_oscillation rises above about 0.17 with seven sensors, reduce
      the outer weights. If progress is still flat near 0.16 on the s-bend with line
      loss at 1, sensing is no longer the limit and wheel_radius should be the next
      lever.


      ### Requested changes


      - If the slalom steering_oscillation rises above about 0.17 with the ±0.06 m
      row (iteration 4 slalom was 0.153), reduce the outer sensor span to ±0.05 m
      or state the spacing that works best, citing the iteration 4 oscillation data.

      - If line_loss_events stays at 1 and the s-bend progress is still about 0.16
      after the span change (iterations 1 to 3 all gave 0.160 at different leads),
      try wheel_radius 0.035 m for more ground speed, because lead and span changes
      have not moved the s-bend.

      - If the oval and s-bend improve with the wider row but the robot still ends
      off track, try sensor_size 0.016 m at 20 mm spacing so the outer footprints
      stay on the 25 mm tape at the edge offsets, citing the iteration 4 telemetry
      where max_error reached 0.062 m.


      - [Open this output](iteration-5/entityR1/versions/701601defcbb4caab86f23262daf06ac/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/b8df0a65d52e4fcd962f583a4439a65c/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-0f14f7b9c4894155/payload.json)'
