  entities:
  - id: entity0
    label: Initial balanced geometry
    notes: 'Proposed a moderate-sized robot with 5 evenly spaced medium sensors near
      the front, medium wheel radius and track, and moderate mass to provide a stable
      baseline for initial controller development and telemetry gathering.


      ### Rationale


      Since this is the first iteration, we have no integration feedback or race telemetry
      yet. To start, I propose a balanced geometry with moderate body size and mass,
      a mid-sized sensor array with 5 sensors evenly spaced near the front, and medium
      wheel radius and track width. This setup aims to provide good line sensing coverage
      and stable handling without excessive mass or size that could hinder agility.
      The intent is to establish a baseline geometry that is neither extreme nor minimal,
      allowing the integrator to build a controller and gather initial telemetry to
      inform future refinements. We request measurements on completion, progress,
      completion_time, rms_error, line_loss_events, and steering_oscillation to diagnose
      line following performance and control stability in the next iteration.


      - [Open this output](iteration-0/entity0/versions/94039be4117f4e54a6b72d52a418bbc7/payload.json)'
  - id: entity1
    label: Baseline Robot Package
    notes: 'Created a balanced baseline robot with moderate geometry and a stable
      PID controller tuned for smooth line following. Added extra telemetry requests
      for detailed control diagnostics.


      ### Rationale


      The supplied geometry is a balanced baseline with moderate body size, mass,
      and wheel dimensions, and a 5-sensor array evenly spaced near the front. This
      provides good line sensing coverage and stable handling. For the controller,
      I chose a moderate base speed to balance progress and control, and tuned PID
      gains to provide stable line following with minimal oscillation. Sensor weights
      are symmetric and emphasize the center sensors to prioritize the line center,
      with smaller weights on the outer sensors to detect line edges. The line_loss
      strategy is set to ''search_left'' to recover from line loss by turning left,
      a common default that can be adjusted later based on telemetry. The observation
      request includes all upstream requested measurements plus max_error and control_effort
      to better diagnose control performance. This package should provide a stable
      baseline for initial races and telemetry gathering, enabling informed improvements
      in future iterations.


      - [Open this output](iteration-0/entity1/versions/258a73845c0d4172ac7db9bdc67369fc/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/94039be4117f4e54a6b72d52a418bbc7/payload.json)'
  - id: entityR1
    label: Geometry Feedback for
    notes: 'Geometry is balanced and sensor layout good, but controller must compensate
      for moderate mass and wheel radius. Requested changes: increase wheel_track
      to 0.14, sensor_size to 0.016, and reduce body_length to 0.16 to improve stability,
      sensing, and agility.


      ### Feedback


      The geometry provides a good balanced baseline with moderate size, mass, and
      sensor layout, which should simplify controller tuning. The 5 sensors evenly
      spaced near the front give good line coverage, reducing the need for aggressive
      steering corrections. However, the moderate mass and wheel radius may limit
      acceleration and responsiveness, requiring the controller to compensate with
      more aggressive PID gains. The sensor size of 0.012 is a good middle ground
      for sensitivity and noise. To improve controller performance, I recommend trying:
      1) Slightly increasing the wheel_track to 0.14 to improve lateral stability
      and reduce steering oscillation. 2) Increasing sensor_size to 0.016 to improve
      line detection robustness, especially in curves. 3) Slightly reducing body_length
      to 0.16 to improve agility and reduce inertia during turns. These changes should
      help the controller maintain smoother line following with fewer line loss events
      and less oscillation.


      ### Requested changes


      - wheel_track to 0.14 for better lateral stability

      - sensor_size to 0.016 for improved line detection

      - body_length to 0.16 for increased agility


      - [Open this output](iteration-0/entityR1/versions/258a73845c0d4172ac7db9bdc67369fc/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/94039be4117f4e54a6b72d52a418bbc7/payload.json)'
