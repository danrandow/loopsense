    label: Initial balanced geometry
    notes: 'Proposed a moderate-sized robot with 5 evenly spaced medium sensors near
      the front, medium wheel radius and track, and moderate mass to provide a stable
      baseline for initial controller development and telemetry gathering.


      ### Rationale


      Since this is the first iteration, we have no integration feedback or race telemetry
      yet. To start, I propose a balanced geometry with moderate body size and mass,
      a mid-sized sensor array with 5 sensors evenly spaced near the front, and medium
      wheel radius and track width. This setup aims to provide good line sensing coverage
      and stable handling without excessive mass or size that could hinder agility.
      The intent is to establish a baseline geometry that is neither extreme nor minimal,
      allowing the integrator to build a controller and gather initial telemetry to
      inform future refinements. We request measurements on completion, progress,
      completion_time, rms_error, line_loss_events, and steering_oscillation to diagnose
      line following performance and control stability in the next iteration.


