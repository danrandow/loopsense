map:
  id: race-102-randow-maps
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 3 (wheel_track 0.09 m, mass 0.6 kg, ±0.045 m sensors) scored 55.14,
      up slightly from iteration 2 (54.15) but still below the baseline''s 62.32.
      The s-bend and slalom still lost the line once per run (line_loss_events 1.0),
      with max_error 0.0618 and 0.0673 m, so narrowing the track did not clear them.
      Oval progress stayed at 0.121, so the 0.09 m track did not cost progress, and
      oval line losses (0.6) were no worse than before. The Integrator''s stated rule
      for this case applies: with mass 0.6 kg and wheel_track 0.09 m, line losses
      still at 1 with max_error at or above 0.06 m, widen the outer sensors to x =
      ±0.054 at 0.027 m steps and keep sensor_size 0.012 m. Mass is kept at 0.6 kg
      because iteration 2 showed it reduces oval losses (1.05 to 0.35 with the same
      sensors). The 0.09 m track is kept because it did not hurt progress. The remaining
      turn-authority levers (mass, track) have now been tried, so reach is the lever
      left. Expected result: the tape stays in view to about 0.06 m off centre, so
      the robot gets an earlier, larger correction on the s-bend and slalom. I expect
      s-bend and slalom line losses to fall toward 0 and max_error to drop below about
      0.055 m. The 12 mm footprint is unchanged and the body and wheel radius are
      unchanged, so the change reads cleanly. The body width still cannot widen the
      off-track limit (0.06 m).


      - [Open this output](iteration-4/entity0/versions/5c1533ecb11942f1b83a43606dfa803a/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-cdac25e2d730393e/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-f5bcd45d0b27f06c/payload.json)'
  - id: entity1
    label: Narrow track 0.09 m robot
    notes: 'Complete robot with the proposed 0.09 m track, 0.6 kg mass and ±0.045
      m sensors, using the unchanged iteration 2 controller so the track is the only
      change. Iteration 2 left s-bend and slalom losses at 1.0, the case this test
      targets.


      ### Rationale


      Iteration 2 (mass 0.6 kg, ±0.045 m sensors, 0.10 m track) left s-bend and slalom
      at 1.0 line-loss events with max_error 0.061 to 0.063 m, just past the 0.06
      m off-track limit. Oval line losses fell to 0.35, so the wider sensor reach
      helps there. Oval progress stayed near 0.12. The Builder''s intent is a clean
      turn-authority test: keep mass 0.6 kg and the ±0.045 m span, and narrow wheel_track
      from 0.10 to 0.09 m, which raises yaw rate per unit wheel differential by about
      11 percent. I apply the geometry exactly as proposed. For the controller, I
      keep kp 4.0, ki 0.2, kd 0.3, base_speed 1.3, last_direction recovery and weights
      [-1, -0.5, 0, 0.5, 1], so the geometry effect reads cleanly. Oval progress is
      limited by early off-track exits, not by a demonstrated speed ceiling, so raising
      base_speed now would confound the test. Sign convention is unchanged: the left
      sensor (x positive) has positive weight, so a line on the left gives a positive
      signal and steers left. Expected result, which is a prediction and not a measurement:
      s-bend and slalom line losses fall toward 0 and max_error drops below about
      0.055 m. If progress then stays near 0.12, the next change belongs in controller
      speed.


      - [Open this output](iteration-3/entity1/versions/9685151530534c67881e923f7cab0809/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/5ff4376f15504841a8d058a7d76afb1c/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-22a58995b918f5ca/payload.json)'
  - id: entityR1
    label: Next levers if track
    notes: 'Pre-race feedback with three conditional changes: widen sensors to ±0.054
      m if losses persist, keep geometry and raise speed if only oval progress is
      short, and revert to 0.10 m if narrowing costs progress. Evidence comes from
      iterations 0 to 2.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Evidence:
      in iteration 0 (baseline, 60 trials) every run went off track after about one
      line loss, with max_error 0.061 to 0.063 m and low steering oscillation (0.11
      to 0.15). In iteration 1, widening the sensors to ±0.045 m cut oval line losses
      from 1.05 to 0.55, so sensing reach is real. But s-bend and slalom still lost
      the line once per run (1.0), and oval progress fell from 0.175 to 0.121. In
      iteration 2 (mass 0.6 kg), s-bend and slalom still showed 1.0 line losses with
      max_error 0.061 to 0.063 m, while oval losses fell to 0.35. Mass reduction alone
      did not clear those tracks, so turn authority is the remaining constraint there.
      I kept the controller gains and speed unchanged so the wheel_track change reads
      cleanly. Read the next race as follows: if s-bend and slalom line losses reach
      0 with max_error below about 0.055 m, keep the geometry and check oval progress.
      If losses stay at 1 with max_error at the limit, the turn-authority lever is
      spent, so widen the sensors. If losses are gone but oval progress stays near
      0.12, the shortfall is controller speed, which I will fix in the controller.


      ### Requested changes


      - If s-bend or slalom still shows line_loss_events of 1 with max_error at or
      above 0.06 m after this race: keep mass 0.6 kg and wheel_track 0.09 m, and widen
      the outer sensors to x = ±0.054 with 0.027 m steps, keeping sensor_size 0.012
      m. Iteration 1 showed ±0.045 m cut oval line losses from 1.05 to 0.55, and iteration
      0 showed the array reaching only about ±0.036 m.

      - If line losses reach 0 on all development tracks but oval progress stays near
      0.12: keep the geometry as proposed. The shortfall is controller speed, which
      I will address by raising base_speed, not by narrowing further.

      - If wheel_track 0.09 m makes oval progress fall below 0.12 without clearing
      the s-bend and slalom losses: return to wheel_track 0.10 m, the iteration 2
      setting. Iteration 1 showed that progress fell when the track was first narrowed,
      so the track may be costing progress, not gaining turn authority.


      - [Open this output](iteration-3/entityR1/versions/9685151530534c67881e923f7cab0809/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/5ff4376f15504841a8d058a7d76afb1c/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-22a58995b918f5ca/payload.json)'
