map:
  id: race-102-randow-maps
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 3 (wheel_track 0.09 m, mass 0.6 kg, ±0.045 m sensors) scored 55.14,
      up slightly from iteration 2 (54.15) but still below the baseline''s 62.32.
      The s-bend and slalom still lost the line once per run (line_loss_events 1.0),
      with max_error 0.0618 and 0.0673 m, so narrowing the track did not clear them.
      Oval progress stayed at 0.121, so the 0.09 m track did not cost progress, and
      oval line losses (0.6) were no worse than before. The Integrator''s stated rule
      for this case applies: with mass 0.6 kg and wheel_track 0.09 m, line losses
      still at 1 with max_error at or above 0.06 m, widen the outer sensors to x =
      ±0.054 at 0.027 m steps and keep sensor_size 0.012 m. Mass is kept at 0.6 kg
      because iteration 2 showed it reduces oval losses (1.05 to 0.35 with the same
      sensors). The 0.09 m track is kept because it did not hurt progress. The remaining
      turn-authority levers (mass, track) have now been tried, so reach is the lever
      left. Expected result: the tape stays in view to about 0.06 m off centre, so
      the robot gets an earlier, larger correction on the s-bend and slalom. I expect
      s-bend and slalom line losses to fall toward 0 and max_error to drop below about
      0.055 m. The 12 mm footprint is unchanged and the body and wheel radius are
      unchanged, so the change reads cleanly. The body width still cannot widen the
      off-track limit (0.06 m).


      - [Open this output](iteration-4/entity0/versions/5c1533ecb11942f1b83a43606dfa803a/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-cdac25e2d730393e/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-f5bcd45d0b27f06c/payload.json)'
  - id: entity1
    label: Wider span, same
    notes: 'Passes the Builder''s ±0.054 m sensor span through with the unchanged
      iteration 3 controller (kp 4, ki 0.2, kd 0.3, base 1.3). Gains are held so only
      sensor reach changes in the race, as iteration 1 showed sensing reach helped
      oval losses.


      ### Rationale


      The Builder''s geometry widens the five-sensor span to ±0.054 m at 0.027 m steps,
      keeps mass 0.6 kg, wheel_track 0.09 m, and sensor_size 0.012 m. I pass that
      geometry through unchanged. The evidence for the controller is the same across
      iterations 1 to 3: s-bend and slalom each lost the line once per run, with max_error
      0.061 to 0.067 m, and oval progress held at about 0.121. Nothing in the race
      data shows a gain problem. Steering oscillation stayed in a low range on all
      tracks (0.075 to 0.162), and the robot leaves the track by drift rather than
      by oscillating. Because signal = reading-weighted average of the weights, the
      sensor span changes which sensors see the tape but not the signal scale, so
      the existing weights [-1, -0.5, 0, 0.5, 1] still map an offset to a signal of
      the same sign and similar size. I therefore keep every controller value from
      iteration 3 (kp 4.0, ki 0.2, kd 0.3, base_speed 1.3, last_direction, same weights).
      Changing gains now would confound the sensor-reach test the Builder asked for
      and the feedback relies on. The observation request covers every measurement
      needed to read the result, including max_error, line_loss_events and progress
      on each track.


      - [Open this output](iteration-4/entity1/versions/4359e1e0c2e541559af429c75c93db8c/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/5c1533ecb11942f1b83a43606dfa803a/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-f5bcd45d0b27f06c/payload.json)'
  - id: entityR1
    label: Reach test, controller
    notes: 'Feedback written before racing: iterations 0 to 3 show sensing reach helped
      oval losses but turn authority (mass, track) has not cleared s-bend and slalom
      at 1.0 losses. It sets three conditional next steps: keep the span, a controller
      speed change, or return the track to 0.10 m.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Evidence
      so far: in iteration 0 (baseline, 60 trials, score 62.3) every run went off
      track after about one line loss, with max_error 0.061 to 0.063 m and low steering
      oscillation (0.11 to 0.15). In iteration 1, widening the sensors to ±0.045 m
      cut oval line losses from 1.05 to 0.55, so sensing reach helps there, but oval
      progress fell from 0.175 to 0.121 when wheel_track was also narrowed. In iteration
      2 (mass 0.6 kg), oval losses fell to 0.35 while s-bend and slalom still showed
      1.0 line losses with max_error 0.061 to 0.063 m. In iteration 3 (wheel_track
      0.09 m), s-bend and slalom again lost the line once per run (1.0) with max_error
      0.0618 to 0.0673 m, and oval progress stayed at 0.121. So mass and track have
      not cleared the tight bends. I have kept the controller identical to iteration
      3 so the wider span is the only change. Read the next race as follows: if s-bend
      and slalom line losses reach 0 with max_error below about 0.055 m, keep the
      span and check oval progress. If losses stay at 1 with max_error at or above
      0.06 m, the sensor reach is also at its limit, so the remaining gains must come
      from the controller and the geometry should stay as it is. If oval progress
      falls below 0.12, return wheel_track to 0.10 m.


      ### Requested changes


      - If the next race still shows line_loss_events of 1 with max_error at or above
      0.06 m on s-bend or slalom: keep the ±0.054 m span and the 0.027 m steps, and
      keep mass 0.6 kg and wheel_track 0.09 m. Iteration 3 showed the turn-authority
      levers have been used, so no further geometry change is supported; I will address
      the rest in the controller.

      - If line losses reach 0 but oval progress stays near 0.12 or below: keep the
      geometry as proposed. The shortfall is controller speed, which I will address
      by raising base_speed, not by narrowing further.

      - If oval progress falls below 0.12 with the wider span and 0.09 m track: return
      wheel_track to 0.10 m, the iteration 2 setting, with the ±0.054 m span kept.
      Iteration 1 showed progress fell when the track was first narrowed, so the track
      may be costing progress rather than adding turn authority.


      - [Open this output](iteration-4/entityR1/versions/4359e1e0c2e541559af429c75c93db8c/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/5c1533ecb11942f1b83a43606dfa803a/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-f5bcd45d0b27f06c/payload.json)'
