map:
  id: race-102-randow-maps
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Narrow track to 0.09 m
    notes: 'Keeps mass 0.6 kg and the ±0.045 m sensor span, and narrows wheel_track
      from 0.10 to 0.09 m, the pre-agreed next lever. Iteration 2 (54.1, below baseline
      62.3) showed that mass reduction alone left s-bend and slalom line losses at
      1.0 with max_error at the 0.06 m limit.


      ### Rationale


      Iteration 2 scored 54.1, below the baseline''s 62.3, so neither the iteration
      1 nor the iteration 2 design has beaten the baseline. Mass 0.8 to 0.6 kg, with
      the ±0.045 m sensor span and 0.10 m track, left the s-bend and slalom unchanged:
      line_loss_events stayed at 1.0 and max_error stayed at 0.061 to 0.063 m, just
      past the 0.06 m off-track limit. Oval line losses fell to 0.35 and the oval
      progress stayed near 0.12. So the 0.6 kg mass did not give the turn authority
      the robot needs on the tighter bends. The Integrator''s pre-agreed rule applies:
      with mass 0.6 kg, line losses still at 1 and max_error at the limit, narrow
      wheel_track to 0.09 m. I keep mass 0.6 kg and the ±0.045 m sensor span, since
      the oval loss reduction is evidence that the wider reach helps, and I change
      only wheel_track. I also note the oval progress drop from 0.175 to 0.121 appeared
      in iteration 1, when wheel_track was first narrowed together with the sensors.
      Iteration 2 kept the 0.10 m track and progress stayed low, so the track width
      is a possible cause of the progress loss. A further narrowing could make that
      worse, so the next race must read oval progress alongside s-bend and slalom
      line losses. Expected result: s-bend and slalom line_loss_events fall toward
      0 and max_error drops below about 0.055 m. If progress falls below 0.12 on oval,
      the next step is a controller speed change or a return to a wider track, not
      more narrowing.


      - [Open this output](iteration-3/entity0/versions/5ff4376f15504841a8d058a7d76afb1c/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-ccc4667ab63bb395/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-22a58995b918f5ca/payload.json)'
  - id: entity1
    label: Mass 0.6 kg turn test
    notes: 'Complete robot with the Builder''s mass-only change (0.8 to 0.6 kg) on
      the iteration 1 layout, controller unchanged. Iteration 1 showed s-bend and
      slalom still losing the line at max_error 0.063 to 0.068 m, so yaw inertia is
      the next test.


      ### Rationale


      Evidence from iteration 1 (60 trials, no finishes): the wider sensors cut oval
      line-loss events from 1.05 to 0.55, but s-bend and slalom still lost the line
      once per run (1.0) with max_error at 0.063 to 0.068 m, past the 0.06 m limit.
      Steering oscillation rose on those tracks (0.16), so the robot is reacting but
      not recovering in time. Oval progress fell from 0.175 to 0.121. Iteration 1
      changed both sensor span and wheel_track, so the two effects are confounded.
      The Builder''s intent is a clean mass-only test against iteration 1. I accept
      that design: mass 0.8 to 0.6 kg lowers yaw inertia from about 0.00312 to 0.00234
      kg·m², which should let the robot turn back for the same wheel differential.
      The Builder keeps the ±0.045 m sensor span, which has oval evidence behind it,
      and wheel_track 0.10 m. Body, footprint and wheel radius are unchanged.


      Controller: I keep every controller value from iteration 1 (kp 4.0, ki 0.2,
      kd 0.3, base_speed 1.3, last_direction, weights [-1, -0.5, 0, 0.5, 1]). Changing
      gains now would confound the mass effect, and the evidence does not yet show
      a gain problem. There is a known risk: lower yaw inertia makes the same kp give
      a faster yaw response, which may raise oscillation on the s-bend and slalom.
      I will not pre-empt that until this race shows it. The observation request keeps
      all measurements, including control_effort, controller_errors and noise_robustness.


      Expected result: line_loss_events on s-bend and slalom fall toward 0, max_error
      drops below about 0.055 m, and oval progress recovers. This is a prediction,
      not a measured outcome.


      - [Open this output](iteration-2/entity1/versions/87a2c78d1f6841caa3a8a48e64640518/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/03a12bd9424b4dba85dbef1dbff766f8/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-b474b8a57504767b/payload.json)'
  - id: entityR1
    label: Next-step geometry
    notes: 'Feedback written before the race: keep the mass change if line losses
      clear, then try wheel_track 0.09 m or wider sensors depending on which limit
      remains. Based on baseline and iteration 1 race evidence, with the oval progress
      shortfall passed to the controller.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Evidence
      so far: in iteration 0 (baseline, 60 trials) every run went off track after
      about one line loss, with max_error at 0.061 to 0.063 m and steering oscillation
      low (0.11 to 0.15). In iteration 1, widening the sensors to ±0.045 m cut oval
      line-loss events from 1.05 to 0.55, so sensing reach is real. But s-bend and
      slalom still lost the line once per run (1.0) with max_error at 0.063 to 0.068
      m, and steering oscillation rose to about 0.16. Oval progress fell from 0.175
      to 0.121. The robot reacts more without recovering before the 0.06 m limit,
      which points to turn authority (yaw inertia and wheel track) as the constraint
      on those tracks. Body width cannot widen the limit, which stays at 0.06 m. I
      kept the iteration 1 controller unchanged so your geometry changes are tested
      cleanly. Use the next race as follows. If s-bend and slalom line losses fall
      to 0 and max_error stays below about 0.055 m, keep the mass change and check
      oval progress. If line losses stay at 1 with max_error near 0.06 m, the turn-authority
      lever is still the constraint, so narrow wheel_track. If the robot finishes
      but progress is low, the fix belongs in the controller speed, not the geometry.


      ### Requested changes


      - If the mass 0.6 kg run still shows line_loss_events of 1 on s-bend and slalom
      with max_error at or above 0.06 m: set wheel_track to 0.09 m (from 0.10 m),
      keeping mass 0.6 kg and the ±0.045 m sensor span. Iteration 1 showed that the
      sensor widening alone does not fix s-bend and slalom, and narrowing the track
      is the remaining untested turn-authority lever.

      - If line losses are gone but max_error stays at 0.05 m or more on the s-bend
      or slalom: widen the outer sensors to x = ±0.054 with 0.027 m steps, keeping
      sensor_size 0.012 m. Iteration 0 showed the array reached only about ±0.036
      m, and iteration 1 showed ±0.045 m helped oval line losses, so more reach may
      still help.

      - If the 0.6 kg run is kept but oval progress stays near 0.12 with no line losses:
      keep the geometry as it is and pass the shortfall to the controller (higher
      base_speed). Iteration 1 showed oval progress fell from 0.175 to 0.121, which
      the geometry changes alone do not explain.


      - [Open this output](iteration-2/entityR1/versions/87a2c78d1f6841caa3a8a48e64640518/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/03a12bd9424b4dba85dbef1dbff766f8/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-b474b8a57504767b/payload.json)'
