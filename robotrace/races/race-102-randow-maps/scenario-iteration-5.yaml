overrides:
  entities:
  - id: entity0
    label: Hold best geometry (67.9)
    notes: 'Keeps the iteration 4 geometry unchanged, the best-scoring design at 67.90,
      with ±0.054 m sensors, 0.09 m track and 0.6 kg mass. Oval line losses dropped
      to zero and progress rose to 0.204, while the Integrator''s latest feedback
      says the remaining s-bend and slalom losses should be addressed in the controller,
      not by more geometry change before the final unseen-track race.


      ### Rationale


      Iteration 4 is the best result so far (67.90, up from 55.14). Widening the five
      sensors to ±0.054 m at 0.027 m steps removed oval line losses (0.6 to 0.0) and
      lifted oval progress from 0.121 to 0.204, with oval max_error at 0.0625 m and
      no line loss. The s-bend and slalom still lost the line once per run (line_loss_events
      1.0), with max_error 0.0669 and 0.0648 m. That is at or above the 0.06 m threshold
      the Integrator set, so the Integrator''s rule now applies: the sensor reach
      is at its limit for those tracks. Earlier levers were already tried and did
      not clear them: mass 0.6 kg (iteration 2), wheel_track 0.09 m (iteration 3),
      and the wider span (iteration 4). The Integrator''s latest feedback asks me
      to keep the ±0.054 m span with 0.027 m steps, mass 0.6 kg and wheel_track 0.09
      m, and to leave the remaining gains to the controller. Iteration 5 is the final
      iteration and its design is what races on the unseen track, so an untested geometry
      change now carries risk and would force the Integrator to rebuild. I therefore
      keep the iteration 4 geometry exactly. Expected result: the same behaviour as
      iteration 4, which scored 67.9, with any gain coming from the Integrator''s
      controller on the s-bend and slalom losses and the oval progress shortfall.
      The unseen track is different in shape, so the main uncertainty is whether the
      ±0.054 m reach holds on bends that are sharper than the development set.


      - [Open this output](iteration-5/entity0/versions/733228d8c52b4593b12e970980d729a3/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-708e9a1df8e01f6f/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-21342aca8a45c298/payload.json)'
  - id: entity1
    label: 'Final robot: iter-4 kit'
    notes: 'Complete robot with the Builder''s best geometry (iteration 4, 67.90)
      and the unchanged controller. Kept fixed because no controller change has been
      tested and this is the final, unseen-track design. The result rests on the iteration
      4 race data.


      ### Rationale


      The Builder holds the iteration 4 geometry unchanged: five sensors at +/-0.054
      m in 0.027 m steps, sensor_size 0.012, mass 0.6, wheel_track 0.09, body 0.18
      x 0.12, wheel radius 0.03. Iteration 4 is the best race so far (67.90). It cleared
      oval line losses (0.0 vs 0.6 at iteration 3) and lifted oval progress to 0.204,
      with oval max_error 0.0625 m. Its remaining faults are one line loss per run
      on s-bend (max_error 0.0669) and slalom (max_error 0.0648). Iterations 2 and
      3 show that mass and wheel_track have already been tried on those bends without
      clearing them, so the geometry is at its range. Any controller change is untested,
      and this is the final iteration. Its design races unseen, so a risky change
      could take the score down from a known 67.9 level. The controller is therefore
      kept identical to iteration 4 (kp 4.0, ki 0.2, kd 0.3, base_speed 1.3, weights
      [-1, -0.5, 0, 0.5, 1], last_direction recovery). That keeps the robot working
      as measured on the development set. The observation request covers every measurement
      so the result can be read in full.


      - [Open this output](iteration-5/entity1/versions/767af594693b4ea0b3ad6179a50b5e00/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/733228d8c52b4593b12e970980d729a3/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-21342aca8a45c298/payload.json)'
  - id: entityR1
    label: 'Final feedback: keep span'
    notes: 'Written before the final race. It states that no later iteration exists
      to apply the requested changes, and that the iteration 4 geometry is the tested
      best. The changes apply only if the design is re-run on other evidence.


      ### Feedback


      No later iteration follows this one, so these requested changes can only apply
      if the design is re-run. The evidence: iteration 0 (baseline, 62.32) lost the
      line once per run with max_error 0.061 to 0.063 m. Iteration 1 widened the sensors
      to +/-0.045 m, which cut oval line losses from 1.05 to 0.55. Iteration 2 (mass
      0.6 kg) cut oval losses further to 0.35, but s-bend and slalom still lost the
      line once (1.0). Iteration 3 (wheel_track 0.09 m) left those tracks at 1.0 losses
      with max_error 0.062 to 0.067 m, and oval progress at 0.121. Iteration 4 (+/-0.054
      m span, scoring 67.90) cleared oval line losses (0.0) and lifted oval progress
      to 0.204, but s-bend and slalom still lost the line once, with max_error 0.0669
      and 0.0648 m. The mass and track levers have now both been used without clearing
      those bends, so the sensor reach looks close to its limit for them. The Integrator
      has kept the iteration 4 geometry and controller, so the Builder''s design races
      as tested. The points below apply only if a later design is raced: for an unseen
      track, keep the +/-0.054 m span with 0.027 m steps and sensor_size 0.012, because
      it removed oval line losses and kept max_error near 0.0625 m. Do not narrow
      wheel_track below 0.09 m or reduce mass below 0.6 kg, because those did not
      clear s-bend or slalom. If the unseen track shows line losses at max_error above
      0.06 m, widen the outer sensors further (for example to +/-0.063 with 0.0315
      m steps) before changing any other field.


      ### Requested changes


      - If a later race shows a line loss with max_error at or above 0.06 m on a sharp
      bend: widen the outer sensors to x = +/-0.063 with 0.0315 m steps, keeping sensor_size
      0.012. Iteration 4 showed that widening from +/-0.036 to +/-0.054 removed oval
      line losses and kept max_error near 0.0625 m.

      - Keep mass 0.6 kg and wheel_track 0.09 m: iterations 2 and 3 show that further
      mass or track narrowing did not clear the s-bend or slalom losses, and iteration
      3 cut oval progress only slightly.

      - Keep sensor_size at 0.012 m: iteration 4 with that footprint was the best
      design measured, and no evidence supports changing it.


      - [Open this output](iteration-5/entityR1/versions/767af594693b4ea0b3ad6179a50b5e00/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/733228d8c52b4593b12e970980d729a3/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-21342aca8a45c298/payload.json)'
