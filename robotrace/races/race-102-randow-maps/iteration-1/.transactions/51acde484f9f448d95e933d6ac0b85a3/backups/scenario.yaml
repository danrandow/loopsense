  entities:
  - id: entity0
    label: Baseline 5-sensor chassis
    notes: 'A symmetric five-sensor array (15 mm spacing, 12 mm footprints) on a 0.12
      m track, 0.8 kg body, chosen from the contract ranges because no race data exists
      yet. It is a baseline for the Integrator to test, not a tuned design.


      ### Rationale


      Iteration 0 has no race telemetry and no Integrator feedback yet, so this is
      a baseline built from the contract''s ranges rather than from evidence. I chose
      a five-sensor line array because the controller needs enough samples across
      the 25 mm tape to estimate lateral offset smoothly, and five is well inside
      the 3 to 7 limit. Sensors sit 15 mm apart, spanning 60 mm, so the outer sensors
      can see the tape as the robot drifts before the centre sensors lose it. Sensors
      are placed 50 mm ahead of the axle so the steering reaction starts before the
      wheels reach the bend. I used a 12 mm footprint: it is smaller than the 25 mm
      tape, so readings change clearly as the line crosses it, and it is not so small
      that noise dominates. Body width 0.12 m gives an off-track limit of max(0.06,
      0.0125 + 0.03) = 0.06 m, which is a reasonable margin for a line follower. Wheel
      track 0.12 m and radius 0.03 m give a moderate turn authority with the 350 PWM-per-turn-unit
      mapping. Mass 0.8 kg and body length 0.18 m keep yaw inertia moderate, so the
      robot can change direction without excessive overshoot. Expected result: a completed
      run on the development tracks at a moderate speed, with rms error well under
      0.05 m. If the Integrator reports sluggish turning or early line loss, the next
      step is to widen the sensor span or reduce mass. I have not yet made any claims
      about the controller, which the Integrator owns.


      - [Open this output](iteration-0/entity0/versions/72b7b0ad9117431e826472fd5b404239/payload.json)'
  - id: entity1
    label: Baseline runnable robot
    notes: 'Complete robot with Builder''s symmetric five-sensor geometry and a conservative
      PD controller using last-direction line recovery. Gains come from the contract
      ranges because no race telemetry exists yet.


      ### Rationale


      Iteration 0 has no race telemetry and no earlier Integrator feedback, so the
      controller is a first-principles design for the Builder''s baseline geometry.
      Sensor weights follow the sign convention: positive x (left) gets a positive
      weight, so a line sitting left of centre produces a positive signal and steers
      left. The five weights span -1.0 to 1.0 in 0.5 steps, which keeps the signal
      inside the -2 to 2 limit and gives roughly the offset in units of sensor spacing.
      kp=4 means a full-scale signal of 1.0 gives turn=4, i.e. about 1400 PWM difference
      between wheels, a firm but not saturating correction on a 4095 base. ki is small
      (0.2) to remove steady bias from the motor mismatch without winding up. kd=0.3
      damps the swing without amplifying sensor noise. base_speed=1.3 gives base PWM
      4095*0.65 ≈ 2660, a moderate speed that should be fast enough to approach the
      1.5 m/s average needed for the 3 s limit while leaving margin for the bends.
      line_loss=''last_direction'' keeps the robot turning toward where the line was
      last seen, which is better than stopping on a sharp bend. Expected result: completion
      on the development tracks with modest oscillation; this is a prior, not a measured
      outcome. Geometry is passed through unchanged, as the Builder owns it.


      - [Open this output](iteration-0/entity1/versions/031dbc6c02d8421a8b062f106b422c00/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/72b7b0ad9117431e826472fd5b404239/payload.json)'
  - id: entityR1
    label: Iteration 0 feedback
    notes: 'No earlier race exists, so the feedback is a prior from the contract and
      makes no claim about this robot''s result. It gives three conditional changes
      to try after the next race.


      ### Feedback


      No race has been run for this geometry lineage, so there is no earlier outcome
      or telemetry to cite; the statements below are prior expectations from the contract,
      not evidence. The controller uses gentle gains (kp 4, kd 0.3) and last-direction
      line recovery, so the main integration pressure will be on sensing resolution
      and turn authority. Next race, if rms_error is high (above about 0.05 m) with
      no line_loss_events, the sensor span is too narrow for the bend curvature: widen
      the span so the outer sensors respond earlier. If line_loss_events is above
      0 on the sharper development tracks, the robot is losing the tape before it
      can turn: increase turn authority by narrowing wheel_track or lowering mass
      so it can yaw faster. If steering_oscillation is high while rms_error is acceptable,
      the robot is over-reacting to the sensors: a lower yaw inertia (lower mass or
      body_length) will make it settle faster without changing the sensing layout.


      ### Requested changes


      - If rms_error exceeds about 0.05 m with zero line_loss_events: widen the sensor
      span to x = ±0.045 (keeping five sensors and 0.015 spacing scaled to 0.0225
      steps, or x = ±0.04 at four sensors) so the outer sensors detect drift earlier.

      - If line_loss_events is above 0 on the development tracks: reduce wheel_track
      to about 0.10 m to increase turn authority, and keep sensor_size at 0.012 m
      so the footprint stays well inside the 25 mm tape.

      - If steering_oscillation is high while rms_error is acceptable: reduce mass
      to about 0.6 kg to lower yaw inertia, so the robot can settle without the controller
      having to damp harder.


      - [Open this output](iteration-0/entityR1/versions/031dbc6c02d8421a8b062f106b422c00/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/72b7b0ad9117431e826472fd5b404239/payload.json)'
