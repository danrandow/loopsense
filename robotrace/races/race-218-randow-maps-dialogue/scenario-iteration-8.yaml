map:
  id: race-218-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 7 (y = 0.07 m, x = ±0.024 m, 0.6 kg, 0.12 m track) scored 673.6, the
      best so far. Oval and s-bend both complete 20 of 20. The slalom still fails
      0 of 20, with progress 0.3185, max_error 0.0632 m and 1.0 line-loss events per
      run. Those numbers match the Integrator''s trigger for a wheel_track test (progress
      near 0.3, max_error near 0.063 m, line losses near 1 per run), so the trigger
      condition is met. The Integrator also asked that the controller change be tested
      with geometry held, and that wheel_track only be tested after that controller
      race has been separated out. This iteration carries the Integrator''s larger-ki
      controller candidate. Changing wheel_track now would confound that result, so
      I am taking their sequencing advice and holding the geometry exactly as in iterations
      5 to 7. I am deferring the wheel_track test (0.10 m) to the next geometry step,
      when it can be read against a clean controller baseline. Line losses are far
      below the 2-per-run widening threshold, and the sensor spread is not the limit.
      The body and mass are not constraints, and the off-track limit stays at its
      0.06 m floor. I expect oval and s-bend to hold at 20 of 20 and the slalom to
      stay limited by reversal reaction unless the ki change helps it. I am not stating
      a score outcome for the controller change.


      - [Open this output](iteration-8/entity0/versions/a21eff0d775a457eb2f49bdc292b9ab8/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-7f5fedd0ecb09d4a/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-adb7243707ebda1c/payload.json)'
  - id: entity1
    label: Larger integral (ki 0.7)
    notes: 'Iteration-7 geometry held; ki raised from 0.4 to 0.7 as the only change.
      Iteration 4 showed integral action lifted slalom progress, but the 0.2 to 0.4
      step gained only about 0.02, so this tests whether more ki still helps.


      ### Rationale


      Iteration 7 (ki 0.4, kd 0.8, kp 2.4, base 1.3, y = 0.07 m, 0.6 kg) is the best
      race so far at 673.6. Oval and s-bend both complete 20 of 20. The slalom still
      fails 0 of 20, with progress 0.3185, max_error 0.0632 m and 1.0 line-loss events
      per run. Iteration 4 showed that adding integral action (ki 0 to 0.2, with kd
      raised) lifted slalom progress from 0.198 to 0.278. The later step from ki 0.2
      to 0.4 added only about 0.02 more progress, so the integral term is giving diminishing
      returns. Look-ahead is saturated (iteration 5), and line losses are well below
      the 2-per-run widening trigger, so the spread is not the limit.


      The Builder held the iteration-7 geometry unchanged, so the controller is the
      only variable this iteration. I raise ki from 0.4 to 0.7 to test whether a stronger
      integral can remove more of the fixed motor-mismatch bias on the slalom. The
      integral is clamped to +/-2, so windup is bounded. kp 2.4, kd 0.8, base_speed
      1.3 and last_direction line loss stay as before. I expect slalom progress to
      rise above 0.32 and oval and s-bend completion to hold. The main risk is overshoot
      after bends, which would show as lower s-bend completion or higher oscillation
      (s-bend oscillation is about 0.29 in iteration 7). This is a hypothesis, not
      a measured result.


      - [Open this output](iteration-8/entity1/versions/42d0066b8f8b4dd690e5203d4c7f7005/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/a21eff0d775a457eb2f49bdc292b9ab8/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-adb7243707ebda1c/payload.json)'
  - id: entityR1
    label: Hold geometry; next
    notes: 'Feedback asks the Builder to hold geometry so the ki change is isolated.
      It names wheel_track of about 0.10 m as the next test if the slalom still fails
      with the same error signature, based on the flat progress from ki 0.2 to 0.4
      in iterations 4 to 7.


      ### Feedback


      Iteration 7 is the best race so far at 673.6, and its controller evidence points
      to a small remaining gain from integral action. Iteration 4 (ki 0 to 0.2, with
      kd raised) lifted slalom progress from 0.198 to 0.278, but iteration 7 (ki 0.2
      to 0.4) moved it only from about 0.30 to 0.32 (iterations 4, 6 and 7 outcome
      tables). That flattening suggests ki is near saturation, not that mismatch is
      no longer relevant. Iterations 5 and 6 showed that y = 0.07 m gives no slalom
      gain, and line losses stay near 1 per run, so look-ahead and sensing are not
      the limit. Your geometry is held this iteration, and the controller is testing
      a larger ki. I state no outcome for this candidate. For the next geometry step:
      if the slalom still fails at max_error near 0.063 m with progress near 0.3 and
      line losses near 1 per run, test wheel_track of about 0.10 m with y = 0.07 m,
      to see whether a narrower track speeds the reversal. If slalom line losses rise
      above about 2 per run with progress below 0.2, widen the spread to x = +/-0.032
      m at y = 0.07 m. If oval or s-bend completion falls below 20 of 20 and 18 of
      20, revert to y = 0.06 m.


      ### Requested changes


      - Hold the geometry at y = 0.07 m, x = +/-0.024 m, 12 mm footprint, 0.12 m track,
      0.03 m wheels, 0.16 by 0.14 m body and 0.6 kg mass, so the controller change
      is the only variable.

      - If the slalom still fails at max_error near 0.063 m with progress near 0.3
      and line losses near 1 per run, test wheel_track of about 0.10 m next, keeping
      y = 0.07 m.

      - If slalom line losses rise above about 2 per run with progress below 0.2,
      widen the spread to x = +/-0.032 m at y = 0.07 m with five sensors.


      - [Open this output](iteration-8/entityR1/versions/42d0066b8f8b4dd690e5203d4c7f7005/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/a21eff0d775a457eb2f49bdc292b9ab8/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-adb7243707ebda1c/payload.json)'
