map:
  id: race-218-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 1
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 0.
dimensions:
  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Forward sensors to y=0.06
    notes: 'Moved all five sensors 20 mm forward (y 0.04 to 0.06 m) to give more look-ahead,
      as the Integrator advised. The iteration-0 race ended every trial off track
      at max_error of about 0.061 m with few line losses, which points to late reaction.


      ### Rationale


      The race evidence for the iteration-0 design is poor on all three development
      tracks. Every one of the 60 trials ended off track, with progress of only 0.105
      (oval), 0.156 (s-bend) and 0.113 (slalom). Mean max_error sits at about 0.061
      to 0.062 m, which is the 0.06 m off-track limit. So the robot is drifting out
      of the line early in each run, not slowly losing time. Line losses are low (1
      per run on oval and s-bend, 2 on slalom), so the sensors are still seeing the
      tape most of the time. The Integrator''s rule applies: high max_error with few
      line losses points to late reaction, so I adopt their advice and move all sensors
      forward from y = 0.04 m to y = 0.06 m. That gives the controller about 60 mm
      of look-ahead, up from 40 mm. I am keeping the sensor spread at ±0.024 m, because
      line_loss_events do not point to a narrow spread. I am also keeping the body
      and drivetrain unchanged, to isolate the forward-offset effect. Body width cannot
      widen the off-track limit: max(0.06, 0.0125 + body_width/4) stays at 0.06 for
      any allowed body width, so it is not a lever. I expect fewer off-track ends
      and longer progress, with max_error falling below 0.06 on the s-bend and slalom.
      The main risk is that the look-ahead overshoots on the tighter bends.


      - [Open this output](iteration-1/entity0/versions/952155fea44146a7aab6dc74031a7a04/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-aa4f175deb02fb79/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-4273643098aeb890/payload.json)'
  - id: entity1
    label: Stronger steering, y=0.06
    notes: 'Keeps the Builder''s y=0.06 m sensors and raises kp from 1.2 to 2.0 with
      kd 0.3. Iteration 0 showed all 60 trials going off track at max_error of about
      0.06 m with low line losses, so steering authority was the first thing to fix.
      Expected outcome only; not measured.


      ### Rationale


      Iteration 0 raced the baseline (sensors at y=0.04, kp 1.2, kd 0.15, base_speed
      1.6). All 60 trials went off track with progress of only 0.105 to 0.156, and
      mean max_error was 0.061 to 0.062 m, just above the 0.06 m limit. Line-loss
      events were low (1 to 2 per run), so the sensors kept seeing the tape. The evidence
      points to steering that is too weak to correct drift, not to lost sensing. Oscillation
      was also low (0.07 to 0.15), so there is room to add gain without instability.
      The Builder has moved the sensors to y=0.06 m, which gives more look-ahead and
      should reduce the reaction lag. I therefore raise kp from 1.2 to 2.0 for a stronger
      correction per unit of signal, and raise kd from 0.15 to 0.3 to damp the extra
      gain. I keep base_speed at 1.6 because the 3 s finish needs about 1.5 m/s and
      the drift is not evidence that speed is too high. I keep the sensor weights
      [-2,-1,0,1,2] and the last_direction line loss, since line losses are low and
      the sign convention is verified (positive weight on the left-side sensor steers
      left). ki stays at 0 to avoid windup on long bends. Expected result, not measured:
      max_error should fall below 0.06 m and progress should rise. The main risk is
      oscillation on the sharpest bend if kp is too high.


      - [Open this output](iteration-1/entity1/versions/83f2b994cb9442c2a49bc463e91c7cdf/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/952155fea44146a7aab6dc74031a7a04/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-4273643098aeb890/payload.json)'
  - id: entityR1
    label: Hold geometry, tune gain
    notes: 'Advises holding the y=0.06 m geometry and letting the controller tune
      gain first, because iteration 0 showed late drift with low line losses. Widening
      the spread is held back until line losses rise. States no outcome for the new
      geometry.


      ### Feedback


      Iteration 0 gives the main evidence. All 60 trials (oval, s-bend and slalom)
      ended off track, with progress of 0.105 to 0.156 and mean max_error of 0.061
      to 0.062 m, just above the 0.06 m limit. Line-loss events were only 1 to 2 per
      run, so the 40 mm sensor spread still sees the tape, and the drift is late reaction
      rather than sensing failure. Your move to y=0.06 m is therefore the right first
      step. I have raised steering gain in the controller to compensate for weak correction
      (kp 2.0, kd 0.3), so the geometry itself does not need changing before this
      race. I state no outcome for the y=0.06 m geometry. For the next iteration:
      if the race shows max_error still at or above 0.06 m with progress below 0.2,
      the limit is probably controller gain or speed, not geometry, so hold the geometry
      and do not widen it. If line_loss_events rise on the sharpest bend (above about
      2 per run), the spread is then too narrow, and widening to +/-0.032 m becomes
      the next option. Holding the spread at +/-0.024 m is correct while line losses
      stay low.


      ### Requested changes


      - Hold the sensors at y=0.06 m with x of +/-0.024 m and the same sensor size
      for the next race, to test the forward offset alone.

      - If max_error stays at or above 0.06 m with progress below 0.2 after this race,
      hold the geometry and let the Integrator tune gain. Do not change the body or
      mass yet.

      - If line_loss_events rise above about 2 per run on the sharpest bend, widen
      the sensor spread to x = +/-0.032 m with five sensors, and keep y=0.06 m.


      - [Open this output](iteration-1/entityR1/versions/83f2b994cb9442c2a49bc463e91c7cdf/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/952155fea44146a7aab6dc74031a7a04/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-4273643098aeb890/payload.json)'
