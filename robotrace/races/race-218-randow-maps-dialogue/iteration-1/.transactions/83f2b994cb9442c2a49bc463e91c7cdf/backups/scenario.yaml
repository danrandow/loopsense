overrides:
  entities:
  - id: entity0
    label: Forward sensors to y=0.06
    notes: 'Moved all five sensors 20 mm forward (y 0.04 to 0.06 m) to give more look-ahead,
      as the Integrator advised. The iteration-0 race ended every trial off track
      at max_error of about 0.061 m with few line losses, which points to late reaction.


      ### Rationale


      The race evidence for the iteration-0 design is poor on all three development
      tracks. Every one of the 60 trials ended off track, with progress of only 0.105
      (oval), 0.156 (s-bend) and 0.113 (slalom). Mean max_error sits at about 0.061
      to 0.062 m, which is the 0.06 m off-track limit. So the robot is drifting out
      of the line early in each run, not slowly losing time. Line losses are low (1
      per run on oval and s-bend, 2 on slalom), so the sensors are still seeing the
      tape most of the time. The Integrator''s rule applies: high max_error with few
      line losses points to late reaction, so I adopt their advice and move all sensors
      forward from y = 0.04 m to y = 0.06 m. That gives the controller about 60 mm
      of look-ahead, up from 40 mm. I am keeping the sensor spread at ±0.024 m, because
      line_loss_events do not point to a narrow spread. I am also keeping the body
      and drivetrain unchanged, to isolate the forward-offset effect. Body width cannot
      widen the off-track limit: max(0.06, 0.0125 + body_width/4) stays at 0.06 for
      any allowed body width, so it is not a lever. I expect fewer off-track ends
      and longer progress, with max_error falling below 0.06 on the s-bend and slalom.
      The main risk is that the look-ahead overshoots on the tighter bends.


      - [Open this output](iteration-1/entity0/versions/952155fea44146a7aab6dc74031a7a04/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-aa4f175deb02fb79/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-4273643098aeb890/payload.json)'
  - id: entity1
    label: Baseline robot, first try
    notes: 'Builder''s symmetric five-sensor baseline with a proportional controller
      (weights -2 to 2, kp 1.2, kd 0.15, base_speed 1.6). No race evidence yet, so
      the gains come from the contract and geometry alone.


      ### Rationale


      This is iteration 0, so there is no race telemetry and no Builder feedback yet.
      I kept the Builder''s geometry unchanged so the first race tests the controller
      on a known baseline. Sensor x positions run from -0.024 to +0.024 m (negative
      is right, positive is left), so I set sensor_weights proportional to x: [-2,
      -1, 0, 1, 2]. A tape on the left then gives a positive signal, which steers
      left, as the contract requires. Signal magnitude stays within the ±2 range at
      the outer sensors, and the weights are centred so the robot is not biased. base_speed
      1.6 gives base PWM of about 3069 (75 percent of full). That should give roughly
      1.5 m/s or more, enough to finish inside 3 s if the robot tracks well. kp 1.2
      gives a moderate steering response: a full signal of 2 gives turn 2.4, or about
      ±840 PWM between wheels. kd 0.15 damps oscillation at this speed, and ki 0 avoids
      integral windup on long curves while there is no evidence it is needed. line_loss
      is ''last_direction'' so the robot keeps turning the way it last saw the tape,
      which suits a line that ends a bend at the edge of the sensor span. I expect
      a completed run on the development tracks, with the main risk being overshoot
      on the sharpest bend. That is a prediction for the Builder to test, not a result.


      - [Open this output](iteration-0/entity1/versions/24d6156abdd04c83810ca2bb91d87153/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/4069d7d727bd459e841673dbb6aa0fc9/payload.json)'
  - id: entityR1
    label: Hold geometry, await data
    notes: 'No earlier races exist, so the feedback recommends holding the baseline
      and gives two conditional changes (forward offset for late reactions, wider
      spread for line loss). It states no result for this candidate.


      ### Feedback


      No earlier race exists, so nothing here is evidence from a race, and I state
      no outcome for this geometry. What I had to do in the controller: I used sensor
      weights proportional to sensor x, scaled to ±2 at the outer sensors, which works
      only because the five sensors are symmetric about the centre line. Their 12
      mm spacing spans 48 mm, about twice the 25 mm tape width, so at least one sensor
      usually reads tape on each bend. That is a design fact from the contract, not
      a measurement. The forward offset of 40 mm gives the controller a look-ahead,
      so the steering gain can stay modest. For the next race, the most useful evidence
      will come from the telemetry: if max_error is large with few line-loss events,
      the robot is reacting late, and a larger forward offset (for example y = 0.05
      to 0.06 m) is the first change to try. If line_loss_events is high on the sharpest
      bend, the spread is too narrow for the tape position, and a wider spread (for
      example x = ±0.032 m) is the next option. Hold the current geometry if the race
      completes with low max_error and low oscillation.


      ### Requested changes


      - Hold the current geometry for the first race and report full telemetry, including
      max_error and line_loss_events on each track.

      - If max_error is high with few line losses (late reaction), try a larger forward
      offset, for example y = 0.05 to 0.06 m for all sensors.

      - If line_loss_events is high on the sharpest bend (sensor span too narrow),
      try a wider sensor spread, for example x = ±0.032 m, keeping 5 sensors.


      - [Open this output](iteration-0/entityR1/versions/24d6156abdd04c83810ca2bb91d87153/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/4069d7d727bd459e841673dbb6aa0fc9/payload.json)'
