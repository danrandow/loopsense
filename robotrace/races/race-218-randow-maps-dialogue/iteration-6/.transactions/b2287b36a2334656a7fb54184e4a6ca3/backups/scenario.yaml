map:
  id: race-218-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 5 moved the sensors from y = 0.06 m to y = 0.07 m, with the spread,
      body, wheels and mass unchanged. Score moved from 649.6 to 646.8, which is a
      small change. Per track, the oval still finishes 20 of 20 and the s-bend still
      finishes 18 of 20, so the revert-to-0.06 m trigger in the Integrator''s feedback
      does not fire. Max_error improved on the oval (0.0139 to 0.0104 m) and the s-bend
      (0.0339 to 0.0298 m), and oval oscillation fell slightly (0.194 to 0.183). Slalom
      did not improve: progress fell from 0.278 to 0.260, and max_error stayed at
      0.063 m, just above the 0.06 m limit. Line losses on the slalom stayed at 1.0
      per run, far below the 2-per-run widening threshold, and slalom progress is
      above 0.2, so the widening trigger does not fire either. The evidence therefore
      says extra look-ahead is not what limits the slalom. The Integrator''s rule
      for this case is to hold the geometry and move the work to the controller, and
      I am following it. I am keeping y = 0.07 m rather than reverting to 0.06 m.
      The score difference is within noise, the error metrics on the two tracks that
      complete are better at 0.07 m, and the Integrator''s controller was tuned against
      this geometry. Changing the geometry again now would confound the controller
      test. I am not changing the spread, body or mass, because none of the triggers
      that would justify those changes has fired.


      - [Open this output](iteration-6/entity0/versions/1cb0dfb2f63d4ec8a2768ba14faef243/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-c5b093fb0ac6d467/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-0d290717dddee421/payload.json)'
  - id: entity1
    label: Kd damping test, y=0.07
    notes: 'Keeps the Builder''s y = 0.07 m geometry and changes only kd (0.6 to 0.8)
      to test whether damping cuts slalom overshoot. Based on iteration 5, where look-ahead
      did not move slalom max_error.


      ### Rationale


      Iteration 5 moved the sensors from y = 0.06 m to y = 0.07 m with the controller
      held at iteration 4''s values. Oval and s-bend completion held (20 of 20 and
      18 of 20), and max_error improved on the oval. Slalom max_error stayed at 0.063
      m, progress fell from 0.278 to 0.260, and line losses stayed at 1.0 per run.
      Extra look-ahead therefore does not limit the slalom, and the Builder''s proposal
      holds y = 0.07 m, so I keep that geometry exactly. The remaining slalom failure
      is a small max_error excess with few line losses, which points to the controller''s
      response on the reversal. Oval oscillation is 0.18 and s-bend oscillation is
      0.30, so I change one controller term, kd from 0.6 to 0.8, to damp overshoot
      without raising kp, which earlier raised oscillation. kp, ki, base_speed and
      line_loss stay as in iteration 4 and 5, so the kd change is the only controller
      variable. I expect the slalom max_error to fall toward 0.06 m with the oval
      and s-bend completions holding. This is a hypothesis, not a measured result.
      The main risk is that higher kd slows the response on the reversal and reduces
      slalom progress.


      - [Open this output](iteration-6/entity1/versions/9b5d1a5e6b9940669264a518eeb14a9c/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/1cb0dfb2f63d4ec8a2768ba14faef243/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-0d290717dddee421/payload.json)'
  - id: entityR1
    label: Hold y=0.07, test wheel
    notes: 'Advises holding the y = 0.07 m geometry and stops further forward moves,
      because iteration 5 showed no slalom gain from look-ahead. Gives the spread
      and wheel_track triggers to try depending on the next race.


      ### Feedback


      Iteration 5 showed that moving the sensors from y = 0.06 m to y = 0.07 m did
      not limit or fix the slalom. Slalom max_error stayed at 0.063 m, progress fell
      from 0.278 to 0.260, and line losses stayed at 1.0 per run (iteration 5 outcome
      table). Oval and s-bend completion held at 20 of 20 and 18 of 20, so the forward
      move is not destabilising, but it is also not the lever. The earlier move from
      y = 0.04 to 0.06 m did help (oval finishes 0 to 4 of 20, slalom progress 0.11
      to 0.14 in iterations 0 and 1). Since the y = 0.07 m step gave no further slalom
      gain, I expect look-ahead to be saturated, so I am holding your geometry unchanged
      and testing a controller term. I state no outcome for the current candidate.
      For the next race: if the slalom max_error falls to 0.06 m or below with line
      losses at or below 2 per run, hold y = 0.07 m and keep the spread and wheels.
      If the slalom line losses rise above about 2 per run with progress below 0.2,
      widen the spread to x = +/-0.032 m at y = 0.07 m, as your trigger says. If the
      slalom still fails at max_error near 0.063 m with progress around 0.26 and line
      losses at 1 per run, the limit is the reaction on the reversal rather than sensing
      or look-ahead. In that case the next geometry test is wheel_track, narrower
      (for example 0.10 m) to raise turn rate, tested only after this controller race
      has been separated out. Do not move y further forward.


      ### Requested changes


      - Hold the geometry at y = 0.07 m with x = +/-0.024 m, 12 mm footprint, 0.12
      m track, 0.03 m wheels, 0.16 by 0.14 m body and 0.6 kg mass, so the controller
      change is the only variable.

      - If slalom line_loss_events rise above about 2 per run with slalom progress
      below 0.2, widen the spread to x = +/-0.032 m at y = 0.07 m. Do not move y further
      forward, because iteration 5 showed no slalom gain from y = 0.06 to 0.07 m.

      - If the slalom still fails at max_error near 0.063 m with progress around 0.26
      and line losses at 1 per run, test wheel_track of about 0.10 m next to see whether
      a narrower track speeds up the reversal, and keep the sensors at y = 0.07 m.


      - [Open this output](iteration-6/entityR1/versions/9b5d1a5e6b9940669264a518eeb14a9c/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/1cb0dfb2f63d4ec8a2768ba14faef243/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-0d290717dddee421/payload.json)'
