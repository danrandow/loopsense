map:
  id: race-218-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 2 is the best result so far (score 501.2, up from 166.4). The oval
      now finishes 20 of 20 runs. The s-bend finishes 6 of 20, and the slalom still
      finishes 0 of 20. Both failing tracks end off track. Line-loss events are 0.9
      on the s-bend and 1.0 on the slalom, well below the 2-per-run threshold, so
      the sensor spread of ±0.024 m is not failing and I am not widening it. Max error
      on the s-bend is now 0.0529 m, under the 0.06 m limit, so the s-bend is no longer
      clearly stuck at the limit. The slalom max error is 0.0628 m, above the limit,
      and its progress is only 0.10. Oval steering oscillation is 0.206, above the
      roughly 0.15 level the Integrator flagged. Integration feedback asked me to
      try a lower mass (about 0.6 kg) if oscillation stays high and s-bend and slalom
      still hit max_error near 0.06 m with progress below 0.25. That condition is
      met on the slalom (max_error 0.063, progress 0.10, oscillation high on the oval)
      but not on the s-bend, where progress is 0.85. I am taking the mass step because
      the slalom is the binding failure and the yaw-inertia reduction is the only
      geometry lever the Integrator named. I am changing only the mass, from 0.8 to
      0.6 kg. The sensors, body, track, wheels and sensor size stay as they were,
      so the effect of the mass change is isolated from the Integrator''s controller
      change as far as one race allows. Body width still sets the off-track limit
      at its 0.06 m floor, so I am not touching it. I expect slalom progress to rise
      above 0.2 and max error to fall toward or below 0.06 m, with oval oscillation
      dropping below about 0.15. I expect the s-bend to hold near its current completion
      rate. I am not sure of this, because the Integrator''s controller also changes
      in this iteration.


      - [Open this output](iteration-3/entity0/versions/2750d0152ef64ba1b2fbe7826fa287d8/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-4a5b82e447c9544e/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-b3dd52f975dcd2ea/payload.json)'
  - id: entity1
    label: Slower, damped controller
    notes: 'Geometry held at iteration 1 values as requested. Controller drops base_speed
      to 1.3 and raises kp to 2.4 and kd to 0.5, because the s-bend and slalom drift
      off track at about 0.06 m while line losses stay low. Expected result is not
      measured.


      ### Rationale


      Iteration 1 moved the sensors to y = 0.06 m and raised kp from 1.2 to 2.0 (kd
      0.3). Compared with iteration 0, the oval now finishes 4 of 20 trials and mean
      score rose from 50.7 to 166.4. The s-bend (progress 0.206) and slalom (progress
      0.136) still leave the track at max_error of about 0.060 to 0.062 m. Line-loss
      events stay low (0.85, 1.0 and 2.0), so the sensors still see the tape and the
      failure is drift, not lost sensing. Oscillation on the oval rose from 0.07 to
      0.18, so more kp alone risks instability. I therefore keep the geometry unchanged,
      as the Builder asked, and change only the controller in two ways. I lower base_speed
      from 1.6 to 1.3, since the drift on the tighter bends suggests the robot is
      entering them too fast to correct. Oval mean finish time was 1.885 s at 1.6,
      so about 2.3 s at 1.3 still fits the 3 s limit. I also raise kd from 0.3 to
      0.5 to damp the oscillation that a higher kp would bring, and raise kp from
      2.0 to 2.4 for more correction per unit of signal. ki stays at 0 and line_loss
      stays last_direction, since line losses are low and the sign convention is verified.
      Expected, not measured: fewer off-track ends on the s-bend and slalom, with
      progress above 0.2, and oval completion holding. The main risk is that kd 0.5
      with the 60 mm look-ahead causes jitter on the sharpest bend.


      - [Open this output](iteration-2/entity1/versions/520ad4e63630420b89d7b85bc21aefcf/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/b3015e7c738d4275ab242f8ffbdf5bd9/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-2c134cdc5f76e46d/payload.json)'
  - id: entityR1
    label: Hold geometry, test mass
    notes: 'Advises holding the iteration 1 geometry so the controller change is isolated.
      Names mass 0.6 kg as the next lever if oscillation stays high, and a wider spread
      if line losses rise, each tied to iteration 0 and 1 results.


      ### Feedback


      Iterations 0 and 1 both leave the s-bend and slalom off track at mean max_error
      of about 0.060 to 0.062 m, with line-loss events at 1 to 2 per run (iteration
      1 table). Moving the sensors from y = 0.04 to 0.06 m and raising kp to 2.0 gave
      the first finishes on the oval (4 of 20) and raised s-bend progress to 0.206,
      so forward look-ahead is helping. Because line losses stayed low, the failure
      is drift on the bends, not lost sensing. Oval oscillation rose from 0.07 to
      0.18 at the higher gain, so more gain alone is probably not the answer. For
      the next race, hold the geometry (five sensors, x = ±0.024 m, y = 0.06 m, 0.12
      m track, 0.03 m wheels, 0.8 kg). Do not change the body, since body width cannot
      widen the off-track limit. Keep the spread at ±0.024 m while line_loss_events
      stay at or below about 2 per run. If the next race shows the s-bend and slalom
      still hitting max_error near 0.06 m with progress below 0.25 and oscillation
      high, the next geometry lever is mass: try about 0.6 kg to cut yaw inertia.
      If line losses rise above about 2 per run on the sharpest bend, widen to x =
      ±0.032 m. I state no outcome for the next candidate.


      ### Requested changes


      - Hold the geometry unchanged for the next race (five sensors, x = ±0.024 m,
      y = 0.06 m, 0.8 kg), so the controller change is the only variable.

      - If oscillation stays high (above about 0.15 on the oval) and max_error stays
      near 0.06 m on the s-bend and slalom, try a lower mass of about 0.6 kg to reduce
      yaw inertia.

      - If line_loss_events rise above about 2 per run on the sharpest bend, widen
      the spread to x = ±0.032 m with five sensors and keep y = 0.06 m.


      - [Open this output](iteration-2/entityR1/versions/520ad4e63630420b89d7b85bc21aefcf/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/b3015e7c738d4275ab242f8ffbdf5bd9/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-2c134cdc5f76e46d/payload.json)'
