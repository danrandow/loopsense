  entities:
  - id: entity0
    label: Wider sensors, kp 5
    notes: 'Stronger steering (kp 5, kd 0.6), larger 16 mm sensors spread to +/-0.07
      m, narrower track 0.09 m, lighter 0.5 kg mass and base speed 1.1 to stop line
      loss at bends. Based on iteration 1 telemetry: max error about 0.06 m past the
      off-track limit and 0.25 to 1 line-loss events per run, with oval finishing
      in 1.68 s, so speed headroom exists.


      ### Rationale


      Evidence from iteration 1 (score 225.15, up from 26.05): no trial failed on
      controller exceptions or stalls. Every run ended by off_track except 3 oval
      finishes. Max error sits at 0.060 to 0.067 m, just past the 0.06 m off-track
      limit, and line_loss_events is 0.25 to 1 per trial, so the robot drifts out
      at bends rather than oscillating. Steering oscillation stayed low (0.23 to 0.35),
      so the damping is not the main problem. Oval finishes in about 1.68 s, so speed
      headroom exists when the line is held. Off-track limit is max(0.06, 0.0125 +
      body_width/4), which tops out near 0.0575 even at body_width 0.18, so the limit
      cannot be widened and the fix must come from tracking. Changes: (1) kp 4.0 to
      5.0 for stronger correction at bends; (2) kd 0.3 to 0.6 to damp the larger correction;
      (3) base_speed 1.3 to 1.1 to give steering more time per bend, since the oval
      finish time leaves room, though I expect completion_time to rise to about 2.0
      to 2.4 s; (4) sensor_size 0.012 to 0.016 so the sum of readings stays above
      the 0.05 line-loss threshold further from the line; (5) sensors spread to x
      = +/-0.07 with 0.035 spacing and y = 0.07 to see the line earlier and catch
      drift sooner; (6) wheel_track 0.10 to 0.09 for more turn rate per PWM count;
      (7) mass 0.6 to 0.5 kg to cut yaw inertia. body_length, body_width, wheel_radius
      and sensor weights are unchanged. Expected result: line_loss_events below 0.5,
      max_error below 0.05, more oval finishes and s-bend progress above 0.8. Hypotheses
      to test: H1, kp 5 with the wider sensor array reduces max_error; H2, the larger
      sensor size removes most line-loss events; H3, lower base_speed trades some
      time for completion. Next measurements: progress and completion (did the bend
      drift stop), completion_time (cost of slower speed), max_error and line_loss_events
      (where the line is still lost), and steering_oscillation (whether kp 5 with
      kd 0.6 is too stiff).


