  entities:
  - id: entity0
    label: kd 0.8 on mass-0.4 base
    notes: 'Keeps the best design (iteration 9, score 531.7) and raises derivative
      gain from 0.6 to 0.8 as the single change, to test whether extra phase lead
      reduces bend lag and off-track errors. Evidence: all failures are off_track
      with max_error just above 0.06 m, and the oval holds 20/20.


      ### Rationale


      Evidence: iteration 9 (score 531.7, best so far) is the iteration 5 design with
      mass lowered from 0.5 to 0.4 kg. It finishes the oval 20/20 at 2.11 s, s-bend
      progress rose from 0.78 to 0.82 (6/20 finishes), and slalom is essentially unchanged
      at 0.38 (0/20). Every failure is off_track with max_error 0.054 to 0.064 m,
      just past the fixed 0.06 m limit. Steering oscillation is moderate (0.25 to
      0.51), with the highest value on the s-bend. The robot lags behind bends rather
      than jittering. Iterations 3 and 4 showed that stiffer loops (higher kp, ki)
      hurt the oval, and iterations 6 and 7 showed that changing sensor span or base_speed
      away from 1.1 hurts. Mass was a small, positive effect, so I keep it at 0.4.


      Change (one variable, controller only): kd 0.6 -> 0.8. Derivative action adds
      phase lead, so the robot should react to the approaching edge of the tape sooner
      in each bend. This tests whether the remaining lag comes from missing damping.
      Sensors, gains kp and ki, base_speed, geometry and line_loss are all unchanged
      from iteration 9, so any change in s-bend and slalom progress can be read as
      a derivative effect.


      Expected result: s-bend progress 0.85 or more with 7 or more finishes, slalom
      progress rising toward 0.45, and oval finishes holding at 20/20. Steering oscillation
      may rise somewhat, but should stay below about 0.5.


      Hypotheses: H1, extra kd reduces the lag-driven max_error on bends. H2, the
      oval holds because the straight-line behaviour is dominated by kp and does not
      change. H3, if steering_oscillation rises above 0.5 without a gain in progress,
      kd is too high and the optimum lies between 0.6 and 0.8.


      Next measurements: completion and progress per track (whether slalom finishes
      at all), max_error and rms_error (is the lag reduced), steering_oscillation
      (is the derivative amplifying jitter), line_loss_events (dropouts on tight bends),
      and completion_time.


