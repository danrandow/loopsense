  - id: entity0
    label: Lighter robot, mass 0.4
    notes: 'Iteration 5''s best geometry and controller, with only mass cut from 0.5
      to 0.4 kg to reduce yaw inertia and bend lag. Chosen because s-bend off-track
      failures at max_error just above 0.06 m point to lag rather than jitter, and
      the speed and gain sweeps have already shown the current controller is near
      its optimum.


      ### Rationale


      Evidence: iteration 5 (score 521.7) is still the best design. Seven sensors
      at x = -0.075 to +0.075 m, y = 0.07 m, sensor size 0.016 m, kp 5.0, kd 0.6,
      ki 0, base_speed 1.1. It finishes the oval 20/20 at about 1.99 s. Its s-bend
      progress is 0.78 and its slalom progress is 0.40. All failures are off_track
      with max_error 0.059 to 0.064 m, just past the fixed 0.06 m limit. Steering
      oscillation is moderate (0.24 to 0.43), so the robot lags on bends rather than
      jittering.


      What the later iterations established. Iteration 6 (wider, forward array) hurt.
      Iteration 7 (base_speed 1.0) hurt, so slower is not safer. Iteration 8 (base_speed
      1.2) scored 501, slightly below iteration 5, so the speed optimum sits near
      1.1. Gain increases in iterations 3 and 4 hurt the oval, though those runs also
      changed other variables.


      Change (one variable, geometry only): mass 0.5 -> 0.4 kg, the lower bound. Yaw
      inertia scales with mass, so a lighter robot should turn faster in response
      to the same wheel-speed difference. That should reduce the lag on bends that
      produces max_error just above 0.06 m. Sensors, gains, speed and line_loss stay
      as in iteration 5, so any change in s-bend and slalom progress can be attributed
      to mass. Earlier mass drops (0.6 to 0.5, iteration 2) came with other changes,
      so this isolates its effect.


      Expected result: s-bend progress rises to 0.85 or more with more finishes than
      5/20. Slalom progress rises toward 0.45. The oval stays near 20/20 with completion_time
      about 2.0 s. Steering oscillation should stay below about 0.45.


      Hypotheses: H1, lower yaw inertia reduces bend lag and max_error. H2, the oval
      finish rate holds because the controller gains are unchanged. H3, if max_error
      does not fall, the limit is sensing range or gain balance rather than inertia,
      and the next step should test kd between 0.6 and 0.8.


      Next measurements: completion and progress per track, max_error and rms_error
      (is the lag reduced), steering_oscillation (is the response too fast), line_loss_events,
      and completion_time.


