map:
  id: race-133-randow-maps
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: 60mm span at 0.10 track
    notes: 'Keeps wheel_track 0.10 (oval progress 0.995 in iteration 7) and widens
      the sensor span from 50 to 60 mm to test whether s-bend and slalom max_error,
      still at 0.0676 and 0.0608 m, can fall below 0.06 m. Follows the agreed decision
      rule and rests on iterations 0 to 7, which show the bend-track max_error plateau
      is unchanged by span, footprint, lead and wheel_track alone.


      ### Rationale


      Iteration 7 (wheel_track 0.10 m, 50 mm span, 12 mm footprint, y 0.05) scored
      399.7, the best so far. Oval progress is 0.995 with 20 of 20 finishes and oval
      max_error 0.032 m, so the oval is solved and the 0.65 floor holds with a wide
      margin. The wheel_track change did not move the s-bend and slalom excursions
      below the off-track line. s-bend max_error went from 0.0682 to 0.0676 m, essentially
      unchanged. Slalom max_error improved from 0.0645 to 0.0608 m, close to 0.06
      m but not under it. Neither track finished. s-bend steering oscillation rose
      to 0.317, which is above the 0.3 threshold, but this is a steering-gain signal
      on a track where oval progress still holds, so it is a tuning matter for the
      Integrator and not a reason to revert geometry. Across iterations 0 to 7, max_error
      on the bend tracks has stayed on a 0.059 to 0.068 m plateau under every span,
      footprint, lead, wheel_track and controller change. Line losses on the development
      tracks are about 1 per run, so the tape is not being lost. The agreed rule applies:
      s-bend and slalom max_error still at or above 0.06 m while oval progress holds
      means the next geometry test is a sensor span change from 50 mm to 60 mm. I
      keep wheel_track at 0.10 m, which the oval result supports, and move to 60 mm
      span (x = -0.03, -0.015, 0, 0.015, 0.03) with 12 mm footprints at y 0.05. The
      main risk is that iteration 3 (60 mm, 12 mm, wheel 0.12, weaker controller)
      fell to oval progress 0.275. The current controller has a much larger oval margin,
      so I judge that result worth testing, but the Integrator should be ready to
      lower kp or fall back to 50 mm if oval progress drops below about 0.65. Body,
      wheel radius and mass stay fixed so that the span is the only geometry variable.


      - [Open this output](iteration-8/entity0/versions/8e35b738579d4393933e04d939e76b6e/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-87a8ef8af3a96489/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-6979dd93c8a2fcf2/payload.json)'
  - id: entity1
    label: Complete Robot Package
    notes: 'Complete Robot Package. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      The Builder''s candidate keeps the iteration 7 wheel_track of 0.10 m and widens
      the sensor span from 50 mm to 60 mm (x = -0.03, -0.015, 0, 0.015, 0.03) at 12
      mm footprints and y 0.05. The Builder asked for this as the next geometry test
      because s-bend and slalom max_error stayed on the 0.059 to 0.068 m plateau across
      every earlier span, footprint, lead, speed and wheel_track change. I adopt the
      geometry as written. I keep the controller at the iteration 7 values (base_speed
      1.15, kp 3.75, ki 0.21, kd 0.375, weights -2, -1, 0, 1, 2, last_direction),
      so the span is the only variable changed from the best run so far (399.7). I
      considered raising kp to offset a span-related drop in steering gain, but the
      Builder''s stated rule is to lower kp if oval progress falls, not raise it,
      and iteration 3 (60 mm, kp 6) showed that higher gain at 60 mm did not help.
      Holding the gains keeps the attribution clean. Expected behaviour is that line
      losses stay near 1 per run and oval progress stays at or above 0.9. The s-bend
      and slalom excursions are the open question, and this race will show whether
      the wider array changes them.


      - [Open this output](iteration-8/entity1/versions/ef506356bff14059be1ba01d43f6d55f/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/8e35b738579d4393933e04d939e76b6e/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-6979dd93c8a2fcf2/payload.json)'
  - id: entityR1
    label: Integration Feedback
    notes: 'Integration Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      evidence behind this design is iteration 7 (wheel_track 0.10, 50 mm span, 12
      mm footprint, y 0.05, kp 3.75, ki 0.21, kd 0.375, base 1.15), which scored 399.7
      with oval progress 0.995 and 20 of 20 finishes. Its s-bend and slalom max_error
      were 0.0676 and 0.0608 m, and neither track finished. Line losses stayed near
      1 per run on the bend tracks (iteration 7: 1.65 and 1.0), so the tape is not
      being lost. Across iterations 0 to 7, bend max_error has stayed on a 0.059 to
      0.068 m plateau under every span, footprint, lead, speed and wheel_track change.
      Iteration 0 (40 mm) and iteration 4 (50 mm) show progress is near its best at
      40 to 50 mm, and iteration 3 (60 mm, 12 mm, weaker controller) fell to 0.275
      on the oval, which is the risk for this candidate. Decide from the next race
      as follows. If oval progress holds at 0.65 or more and s-bend and slalom max_error
      both fall below about 0.06 m, keep the 60 mm span and tune the controller only.
      If oval progress falls below about 0.65 while steering oscillation is above
      about 0.35, the span has reduced the effective steering gain or added oscillation,
      so return to the 50 mm span (the current best) and tell the Integrator to lower
      kp first. If oval progress holds but bend max_error stays at or above 0.06 m
      with line losses near 1, the wider span does not limit the excursions, so the
      next test is a lead change to y 0.04 on the bend tracks only, not a further
      span change.


      ### Requested changes


      - If oval progress is at or above 0.65 and s-bend and slalom max_error are both
      below 0.06 m, keep the 60 mm span (x = -0.03, -0.015, 0, 0.015, 0.03) and wheel_track
      0.10. Iteration 7 showed wheel_track 0.10 holds the oval at 0.995, and this
      result would be the first span-driven reduction in bend excursions.

      - If oval progress falls below about 0.65 with steering oscillation above about
      0.35, revert to the 50 mm span at x = -0.025, -0.0125, 0, 0.0125, 0.025 with
      12 mm footprints, y 0.05 and wheel_track 0.10. Iteration 4 (50 mm) reached oval
      progress 0.710 and iteration 3 (60 mm) fell to 0.275, so 60 mm is only worth
      keeping if it holds the oval.

      - If bend max_error stays at or above 0.06 m with oval progress held, keep the
      60 mm span and change the lead only on the next candidate: sensor y from 0.05
      to 0.04 with the same x positions and 12 mm footprints. Iteration 1 showed that
      y 0.03 collapses progress, so do not go below 0.04.


      - [Open this output](iteration-8/entityR1/versions/ef506356bff14059be1ba01d43f6d55f/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/8e35b738579d4393933e04d939e76b6e/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-6979dd93c8a2fcf2/payload.json)'
