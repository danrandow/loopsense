  - id: entity0
    label: Baseline 5-sensor
    notes: 'First geometry: five 12 mm sensors at 10 mm pitch, 50 mm ahead of the
      axle, on a compact 0.12 m track body. No race data exists yet, so this rests
      on the contract''s sensing and off-track rules, and it sets a baseline for the
      Integrator to test.


      ### Rationale


      This is iteration 0, so there is no race telemetry or integration feedback yet.
      The design therefore rests on the contract''s physics and sensing rules, not
      on observed results. Five sensors at 10 mm pitch (x = -0.02, -0.01, 0, 0.01,
      0.02) give a 40 mm sensing span across a 25 mm tape. With 12 mm footprints,
      the outer sensors still see the tape edge during moderate offsets, so the signal
      changes smoothly and the controller gets a graded error rather than a binary
      one. Sensors sit at y = 0.05 m, ahead of the axle, so the signal reads the line
      before the wheels reach it. That lead time should reduce oscillation at speed.
      Wheel track 0.12 m and wheel radius 0.03 m give a moderate turn rate per unit
      wheel difference and keep the base speed capable of ~1.5 m/s. Body width 0.12
      m is the off-track limit at max(0.06, 0.0125 + 0.03) = 0.06 m, and widening
      the body cannot lift it above 0.06 m within the allowed range, so width is chosen
      for compactness. Body length 0.14 m and mass 0.7 kg keep yaw inertia low, which
      favours quick response on bends. Sensor weights are antisymmetric (-2, -1, 0,
      1, 2), so the signal is zero when centred and scales with offset. The expected
      result is a completed run on the development tracks with moderate line-loss
      counts, with the main risk being oscillation from the lead sensors. I expect
      the Integrator to report whether the 0.05 m lookahead and 10 mm pitch are a
      usable base.


      - [Open this output](iteration-0/entity0/versions/a0f98fc066f74c3fb51a8e11816642e7/payload.json)'
