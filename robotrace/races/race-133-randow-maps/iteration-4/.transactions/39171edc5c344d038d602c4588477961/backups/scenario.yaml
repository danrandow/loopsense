map:
  id: race-133-randow-maps
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: 12mm footprint, 60mm span
    notes: 'Keeps the 60 mm span and y = 0.05 lead that recovered progress in iteration
      2, and changes only sensor_size from 16 mm to 12 mm. Oval progress sat at 0.405
      with line losses near 1, which is right at the threshold in last iteration''s
      feedback rule for trying a narrower footprint.


      ### Rationale


      Iteration 2 restored the y = 0.05 lead while keeping the 60 mm span and 16 mm
      footprint. It recovered most of the progress lost in iteration 1: oval progress
      rose from 0.273 to 0.405, s-bend from 0.109 to 0.423, and the score from 64.6
      to 133.7. So the shorter lead (y = 0.03) was the main cause of the collapse.
      Line losses stayed near 1 (1.2, 1.1, 1.0), which the wide span keeps under control.
      max_error stayed at 0.062 to 0.065 m on every track, so off-track excursions
      are still transient and are not caused by tape loss.


      The feedback rule I wrote last iteration says that if progress stays below about
      0.4 with line losses near 1, the 16 mm footprint is probably blurring the centre
      signal, and the next step is a 12 mm footprint with the 60 mm span. Oval progress
      is 0.405 and s-bend is 0.423, right at that threshold. Iteration 0, with a 12
      mm footprint, had the best oval progress (0.664), although its span was 40 mm.
      The footprint is the one sensing variable not yet isolated at the 60 mm span.


      I therefore change only the footprint, from 0.016 to 0.012, and keep the 60
      mm span (x = -0.03, -0.015, 0, 0.015, 0.03), y = 0.05, and all body, wheel and
      mass values. With a 15 mm pitch and 12 mm footprints, the 25 mm tape is always
      covered by at least one sensor across the array, and the outer sensors keep
      a graded signal. I expect progress to move back toward 0.5 or higher, line losses
      to stay near 1 to 1.3, and max_error to remain near 0.06 m. max_error is the
      untested lever for the next step, which is wheel_track 0.10 if progress recovers
      and max_error stays on its plateau.


      - [Open this output](iteration-3/entity0/versions/5c7d714fa0d3491aa8daf82b94ea96d4/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-3e5ec2440de48882/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-943ecee6ee448297/payload.json)'
  - id: entity1
    label: 12mm footprint test
    notes: 'Changes only sensor_size from 16 mm to 12 mm, keeping the 60 mm span,
      y = 0.05 lead and iteration 2 gains. Tests whether the footprint was blurring
      the centre signal, using iteration 2 (oval 0.405) as the baseline.


      ### Rationale


      Iteration 2 (60 mm span, 16 mm footprint, y = 0.05, kp 6, ki 0.3, kd 0.45) recovered
      most of the progress lost in iteration 1. Oval progress rose from 0.273 to 0.405
      and s-bend from 0.109 to 0.423, and line losses stayed at 1.0 to 1.2. Iteration
      1 changed span, footprint and lead together, so the 16 mm footprint is still
      an unisolated suspect. Iteration 0 (12 mm footprint, 40 mm span, y = 0.05) reached
      0.664 on the oval, so the footprint and span effects are not yet separated.
      The Builder''s proposal for this iteration changes only the footprint, from
      16 mm to 12 mm, and keeps the 60 mm span and y = 0.05 lead. I therefore keep
      the controller exactly as in iteration 2 (base 1.5, kp 6, ki 0.3, kd 0.45, weights
      -2, -1, 0, 1, 2, last_direction). Changing gains now would confound the footprint
      test. Five sensors at 15 mm pitch with 12 mm footprints leave a 3 mm gap between
      neighbours, but the 25 mm tape is always covered by at least one footprint across
      the array, so I expect no dead zone that the controller cannot handle. The measurement
      request adds noise_robustness and completion_time so the next race can be compared
      with iteration 2 on the same metrics.


      - [Open this output](iteration-3/entity1/versions/adc04227b59542af8fb0a22a53983167/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/5c7d714fa0d3491aa8daf82b94ea96d4/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-943ecee6ee448297/payload.json)'
  - id: entityR1
    label: Footprint then span steps
    notes: 'Gives the Builder two conditional next steps: wheel_track 0.10 if progress
      recovers, or a 50 mm span if it does not. Both rest on iteration 0 (oval 0.664,
      40 mm span) and iteration 2 (oval 0.405, 60 mm span).


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. Iteration
      2 (60 mm span, 16 mm footprint, y = 0.05) restored oval progress to 0.405 and
      s-bend to 0.423, while line losses held at 1.0 to 1.2. Iteration 0 (40 mm span,
      12 mm footprint, y = 0.05) reached oval progress 0.664. That gap is the question
      this iteration tests: the wider span, the 16 mm footprint, or both. Iteration
      1 showed that shortening the lead to y = 0.03 collapses progress, so the lead
      should stay at 0.05. I kept the controller gains at the iteration 2 values (kp
      6, ki 0.3, kd 0.45), which I scaled up when the span widened from 40 to 60 mm,
      so the footprint change is the only variable. max_error has sat at 0.0615 to
      0.065 m across iterations 0, 1 and 2, so it does not respond to span, footprint
      or lead alone. Decide from the next race as follows. If oval progress rises
      above about 0.45 with line losses near 1, the footprint was blurring the signal:
      keep sensor_size 0.012 and try the wheel_track change to address max_error.
      If progress stays at or below about 0.4, the footprint is not the limit and
      the span is the likely cause, so try the narrower span below.


      ### Requested changes


      - If oval progress rises above about 0.45 with line losses near 1, keep sensor_size
      0.012 and set wheel_track to 0.10. max_error has stayed at 0.0615 to 0.065 m
      across iterations 0 to 2, so turn rate is the untested lever for it.

      - If progress stays at or below about 0.4 on the oval, keep sensor_size 0.012
      and y 0.05 but narrow the span to x = -0.025, -0.0125, 0, 0.0125, 0.025 (50
      mm span). Iteration 0 used a 40 mm span at y 0.05 and reached oval progress
      0.664, while iteration 2 used 60 mm and reached 0.405. The 50 mm span tests
      whether the wider array is what cost progress, and it should still cover the
      tape edge at 12 mm footprints.

      - Do not change the lead from y = 0.05. Iteration 1 showed that y = 0.03 cuts
      progress sharply (oval 0.273), and iteration 2 showed that restoring y = 0.05
      recovers it (oval 0.405).


      - [Open this output](iteration-3/entityR1/versions/adc04227b59542af8fb0a22a53983167/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/5c7d714fa0d3491aa8daf82b94ea96d4/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-943ecee6ee448297/payload.json)'
