overrides:
  entities:
  - id: entity0
    label: Revert to iter 7 geometry
    notes: 'Holds the best raced geometry (50 mm span, 12 mm footprints, y 0.05, wheel_track
      0.10) unchanged, so this race isolates the controller. Rests on iteration 7
      scoring 399.7 with oval progress 0.995, and iteration 8 showing 60 mm collapses
      the oval.


      ### Rationale


      The evidence across ten iterations shows that the 50 mm span, 12 mm footprint,
      y 0.05 lead and wheel_track 0.10 m design (iteration 7) is the best base so
      far, scoring 399.7 with oval progress 0.995 and 20 of 20 oval finishes. Iteration
      8 repeated the 60 mm span with wheel_track 0.10 and collapsed oval progress
      to 0.301, matching the iteration 3 collapse at 60 mm. So 60 mm is rejected.
      The Integrator''s iteration 9 feedback accepts the revert and asks to keep the
      controller unchanged, so this race should reproduce the best known result. Bend
      max_error has stayed on a 0.059 to 0.068 m plateau under every span, footprint,
      lead, wheel_track and controller change. Line losses on the bend tracks are
      about 1 per run, so sensing is not losing the tape. Changing geometry now would
      only confound the Integrator''s controller evidence. I therefore hold the geometry
      identical to iteration 7. The next untested lever is the lead (y 0.04) on the
      bend tracks, which the Integrator will request only if the controller is stable
      (oval progress at or above 0.95 and s-bend oscillation at or below 0.3). The
      16 mm footprint at 50 mm stays untested and is deferred. Expected result: a
      score near 400 with oval progress at or above 0.95.


      - [Open this output](iteration-10/entity0/versions/ce86ae25201a4ab0848737062f9099a2/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-4069bf0bedf7b2ad/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-6979dd93c8a2fcf2/payload.json)'
  - id: entity1
    label: Revert to iter 7 geometry
    notes: 'Accepts the Builder''s 50 mm, 12 mm, y 0.05, wheel_track 0.10 revert and
      keeps the iteration 7 controller (kp 3.75, kd 0.375) as a clean reproduction
      baseline. Rests on iteration 7 scoring 399.7 and iteration 8 collapsing at 60
      mm.


      ### Rationale


      Iteration 7 is the best raced design (399.7; oval progress 0.995, 20 of 20 finishes).
      Iteration 8 showed that 60 mm span collapses oval progress to 0.301, matching
      iteration 3, so I accept the Builder''s revert to the 50 mm span with 12 mm
      footprints, y 0.05 and wheel_track 0.10. I keep the iteration 7 controller unchanged
      (base_speed 1.15, kp 3.75, ki 0.21, kd 0.375, weights -2, -1, 0, 1, 2, last_direction).
      This race therefore reproduces the best-known configuration as a baseline, so
      any change in the next result can be attributed to the geometry revert. I considered
      lowering kd to reduce the s-bend steering oscillation of 0.317, which is above
      the 0.3 threshold. I did not, because a gain change now would confound the reproduction
      check and iteration 7 gave the best oval result with a 0.23 oscillation. The
      s-bend oscillation is the first thing to address in the next controller step.
      Expected result: score near 400, oval progress at or above 0.95, and bend max_error
      still on the 0.06 to 0.068 m plateau.


      - [Open this output](iteration-9/entity1/versions/3b82ff2a4f8e49968df49479e65adbd3/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/7421e62e81ce4f6696f101811c34058e/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-5bdf09d29aea4dde/payload.json)'
  - id: entityR1
    label: Lead test gated on
    notes: 'Tells the Builder the y 0.04 lead test is acceptable once the revert holds
      oval progress at or above 0.95 and bend max_error stays on its plateau. Lists
      the earlier evidence for each requested change.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. I accept
      your revert to the iteration 7 geometry, and I keep the iteration 7 controller
      unchanged so this race reproduces the best known result. Evidence: iteration
      7 (50 mm, 12 mm, y 0.05, wheel_track 0.10) scored 399.7 with oval progress 0.995.
      Iteration 8 (60 mm) fell to oval progress 0.301, as did iteration 3 (60 mm),
      so 60 mm is rejected. Bend max_error has stayed at 0.059 to 0.068 m across every
      span, footprint, lead, speed and wheel_track change, so it is not explained
      by sensing geometry alone. Decide from the next race as follows. If oval progress
      is at or above 0.95 and s-bend steering oscillation is at or below 0.3, the
      controller is stable on this base, and I will test a lead change. If s-bend
      steering oscillation stays above 0.3, I will lower kp or kd on the controller,
      not the geometry. If bend max_error stays on its plateau with the controller
      stable, you may test the lead change you asked about.


      ### Requested changes


      - Yes to your y 0.04 lead test on the bend tracks, with no other change, only
      once the next race shows oval progress at or above 0.95 and bend max_error still
      on the 0.059 to 0.068 m plateau. Iteration 1 showed that y 0.03 collapses progress
      (0.273 at 60 mm), so do not go below 0.04.

      - Hold the 50 mm span with 12 mm footprints and wheel_track 0.10. Iteration
      4 (50 mm) and iteration 7 (50 mm, wheel 0.10) both held oval progress above
      0.7, while iteration 8 (60 mm) fell to 0.301.

      - A 16 mm footprint at 50 mm span is untested at wheel_track 0.10. Propose it
      only if the lead test does not move bend max_error, because iteration 2 (16
      mm, 60 mm span) showed that footprint size alone is not the limit.


      - [Open this output](iteration-9/entityR1/versions/3b82ff2a4f8e49968df49479e65adbd3/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/7421e62e81ce4f6696f101811c34058e/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-5bdf09d29aea4dde/payload.json)'
