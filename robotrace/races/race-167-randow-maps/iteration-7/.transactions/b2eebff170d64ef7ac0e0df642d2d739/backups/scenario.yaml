  id: race-167-randow-maps
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Test wheel_track 0.14
    notes: 'Reverts the narrower-track test (wheel_track 0.10 scored 496.4, worse
      than 561.6 at 0.12) and tests the other direction: wheel_track 0.14 at the best
      lookahead y 0.08. The contract''s turn-rate equation and the measured track-width
      gradient at y 0.08 support the test, and the Integrator''s wheel_track 0.10
      advice is contradicted by iteration 6 data.


      ### Rationale


      Iteration 6 tested wheel_track 0.10 at y 0.08 and scored 496.4, below the 561.6
      of iteration 5 at wheel_track 0.12. The narrower track made the s-bend worse:
      off-track exits rose from 9 to 15 of 20, max_error rose from 0.047 to 0.057,
      control_effort rose from 12.2 to 12.5, and oscillation rose from 0.32 to 0.32
      (no change). Oval finish held at 20 of 20, and slalom stayed 0 of 20. The Integrator''s
      entityR1 advice to keep wheel_track 0.10 was written before this race, and the
      race contradicts its premise, so I am not following it. The data now gives a
      monotone direction for track width at y 0.08: 0.10 gives 496.4 and 0.12 gives
      561.6. A narrower track gives more yaw per PWM count, which here causes overshoot
      and off-track exits rather than helping. The natural next single-variable test
      is the other direction: wheel_track 0.14. This is a test of an extrapolated
      trend rather than a settled fact, and it contradicts my own earlier advice in
      this thread (I had called wheel_track 0.14 physically backwards). The race data
      should decide it, not the earlier theory. I will keep sensor y 0.08 (the top
      of the allowed range and the best lookahead), the 16 mm footprints, the ±0.024
      m span, body, mass and wheels as in iteration 5. Slalom is 0 of 20 at every
      setting tried, so I am not chasing it with span or footprint changes here; the
      span widening (iteration 2) and the 12 mm footprint (iteration 0) have already
      been tested and did not help. Expected result: s-bend off-track exits fall below
      9 of 20 and control_effort falls below 12.2, with oval finish at 1.0 and oscillation
      below 0.4. Risk: a wider track reduces yaw per command and may make bends sluggish,
      which would raise max_error. If the s-bend gets worse, the best known design
      is iteration 5 (wheel_track 0.12, y 0.08).


      - [Open this output](iteration-7/entity0/versions/8c4849996512485082f835f55f3bf076/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-b2a810d8c9f5f48c/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-9d3443d67766baa6/payload.json)'
  - id: entity1
    label: Wider track 0.14 test
    notes: 'Iteration 5 controller and geometry with wheel_track raised to 0.14 at
      y 0.08. Iteration 6 (wheel_track 0.10, score 496.4) showed the narrower track
      is worse, so this tests the other direction.


      ### Rationale


      Iteration 5 (wheel_track 0.12, y 0.08, score 561.6) is the best design. Iteration
      6 tested wheel_track 0.10 and scored 496.4: s-bend off-track exits rose from
      9 to 15 of 20, max_error rose from 0.047 to 0.057, and control_effort rose from
      12.2 to 12.5. That makes the score move monotonically with track width at y
      0.08 (0.10 gives 496.4, 0.12 gives 561.6), and the narrower direction is the
      wrong one. The Builder''s candidate tests the other direction, wheel_track 0.14.
      I accept that test, because the contract''s turn-rate equation (wheel speed
      difference divided by wheel_track) means a wider track gives less yaw per PWM
      count and should reduce overshoot in bends. This is an extrapolation from two
      points, so I treat it as a test rather than a settled result. I keep the controller
      identical to iteration 5 (kp 4.0, ki 0.1, kd 0.5, base_speed 1.6, last_direction,
      weights [2,1,0,-1,-2]). Raising kp to offset the roughly 14 percent smaller
      yaw per command would confound the one-variable test, and the 0.10 result showed
      that changing yaw gain without evidence hurts. Sensors stay at y 0.08, 16 mm
      footprints and x = ±0.024, 0.012, 0. Expected: s-bend off-track exits below
      9 of 20, lower control_effort, oval finish near 1.0, oscillation below about
      0.4. Risk: a sluggish response on the bends would show up as higher max_error;
      if that happens, revert to wheel_track 0.12.


      - [Open this output](iteration-7/entity1/versions/a4a948eb96f0439eb0417099cf6cc6ee/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/8c4849996512485082f835f55f3bf076/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-9d3443d67766baa6/payload.json)'
  - id: entityR1
    label: 'Feedback: track 0.14 next'
    notes: 'Feedback on the wheel_track 0.14 test, with decision rules for the next
      race. It corrects my earlier 0.10 advice, which iteration 6 showed did not hold.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Evidence
      from iteration 5 (wheel_track 0.12, y 0.08, score 561.6): the oval finished
      20 of 20 with oscillation 0.20, the s-bend finished 11 of 20 with 9 off-track
      exits, max_error 0.047 and control_effort 12.2, and slalom was 0 of 20 with
      line_loss 1.35. Iteration 6 (wheel_track 0.10, score 496.4) showed that the
      narrower track is worse, with s-bend off-track exits rising from 9 to 15 and
      max_error from 0.047 to 0.057. Your earlier wheel_track 0.10 advice was therefore
      tested and did not hold. The wider track is the direction the data now points
      to. The controller is unchanged at kp 4.0 so the wheel_track change stays isolated.
      Next race: if s-bend off-track exits fall below 9 of 20 and control_effort falls
      below 12.2 with oval finish at 1.0 and oscillation below about 0.4, keep wheel_track
      0.14 and try the first requested change. If max_error rises above 0.047 or the
      s-bend has more off-track exits than iteration 5, the wider track is too sluggish,
      so revert to wheel_track 0.12 and try the second change. If the oval finish
      falls below 0.85, revert to 0.12 at once.


      ### Requested changes


      - If the s-bend improves at wheel_track 0.14 with oscillation below about 0.4,
      try wheel_track 0.16 at y 0.08, keeping kp 4.0. Evidence: track width is monotone
      (0.10: 496.4, 0.12: 561.6), so the gain should continue if the trend holds.

      - If max_error rises above 0.047 at wheel_track 0.14 (sluggish bends), keep
      wheel_track 0.14 and raise kp to 4.5 to restore yaw authority. Evidence: iteration
      5 max_error was 0.047 at kp 4.0 and wheel_track 0.12; kp 4.5 was harmful only
      at the wider span in iteration 2, not at the track width.

      - If the wider track does not help (off-track exits unchanged or worse), revert
      to wheel_track 0.12 at y 0.08 as the baseline, and test kd 0.8 at that baseline
      to damp bend overshoot. Evidence: iteration 5 oscillation was 0.32 on the s-bend,
      so there is some room before jitter becomes the limit.


      - [Open this output](iteration-7/entityR1/versions/a4a948eb96f0439eb0417099cf6cc6ee/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/8c4849996512485082f835f55f3bf076/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-9d3443d67766baa6/payload.json)'
