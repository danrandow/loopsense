map:
  id: race-167-randow-maps
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Test wheel_track 0.14
    notes: 'Reverts the narrower-track test (wheel_track 0.10 scored 496.4, worse
      than 561.6 at 0.12) and tests the other direction: wheel_track 0.14 at the best
      lookahead y 0.08. The contract''s turn-rate equation and the measured track-width
      gradient at y 0.08 support the test, and the Integrator''s wheel_track 0.10
      advice is contradicted by iteration 6 data.


      ### Rationale


      Iteration 6 tested wheel_track 0.10 at y 0.08 and scored 496.4, below the 561.6
      of iteration 5 at wheel_track 0.12. The narrower track made the s-bend worse:
      off-track exits rose from 9 to 15 of 20, max_error rose from 0.047 to 0.057,
      control_effort rose from 12.2 to 12.5, and oscillation rose from 0.32 to 0.32
      (no change). Oval finish held at 20 of 20, and slalom stayed 0 of 20. The Integrator''s
      entityR1 advice to keep wheel_track 0.10 was written before this race, and the
      race contradicts its premise, so I am not following it. The data now gives a
      monotone direction for track width at y 0.08: 0.10 gives 496.4 and 0.12 gives
      561.6. A narrower track gives more yaw per PWM count, which here causes overshoot
      and off-track exits rather than helping. The natural next single-variable test
      is the other direction: wheel_track 0.14. This is a test of an extrapolated
      trend rather than a settled fact, and it contradicts my own earlier advice in
      this thread (I had called wheel_track 0.14 physically backwards). The race data
      should decide it, not the earlier theory. I will keep sensor y 0.08 (the top
      of the allowed range and the best lookahead), the 16 mm footprints, the ±0.024
      m span, body, mass and wheels as in iteration 5. Slalom is 0 of 20 at every
      setting tried, so I am not chasing it with span or footprint changes here; the
      span widening (iteration 2) and the 12 mm footprint (iteration 0) have already
      been tested and did not help. Expected result: s-bend off-track exits fall below
      9 of 20 and control_effort falls below 12.2, with oval finish at 1.0 and oscillation
      below 0.4. Risk: a wider track reduces yaw per command and may make bends sluggish,
      which would raise max_error. If the s-bend gets worse, the best known design
      is iteration 5 (wheel_track 0.12, y 0.08).


      - [Open this output](iteration-7/entity0/versions/8c4849996512485082f835f55f3bf076/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-b2a810d8c9f5f48c/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-9d3443d67766baa6/payload.json)'
  - id: entity1
    label: Narrow track 0.10 (test)
    notes: 'Single-variable test: wheel_track 0.12 to 0.10 on the best sensor layout
      (y 0.08), controller unchanged. Narrower track gives more yaw per PWM count,
      per the contract''s turn-rate equation, and iteration 5 shows s-bend control_effort
      12.2 with 9 of 20 off-track exits.


      ### Rationale


      Iteration 5 (y 0.08, wheel_track 0.12, score 561.6) is the best design so far.
      The lookahead sweep is monotone: y 0.04 gave 131.9, y 0.06 gave 454.6, y 0.07
      gave 534.0, and y 0.08 gave 561.6. Oscillation stayed low (oval 0.20, s-bend
      0.32), the oval finished 20 of 20, and the controller raised no errors. The
      s-bend is still the main loss, with 9 of 20 off-track exits and the highest
      control_effort of any track (12.2). Slalom is 0 of 20 with line_loss 1.35, which
      lookahead alone is unlikely to fix. The Builder''s intent is to change only
      wheel_track, from 0.12 to 0.10. The contract defines turn rate as the wheel
      speed difference divided by wheel_track, and the PWM difference is set by turn
      times 350. A narrower track therefore gives about 20 percent more yaw per unit
      of steering command. I am keeping the controller identical to iteration 5 (kp
      4.0, ki 0.1, kd 0.5, base_speed 1.6, last_direction, weights [2,1,0,-1,-2]).
      This keeps the race a clean one-variable test, and control_effort stays comparable
      because it scales with kp. Risk: the extra yaw gain may raise steering_oscillation,
      so if it rises above about 0.4 or the oval finish falls below 0.85, the next
      step is either wheel_track 0.12 (the best known design) or a lower kp at the
      narrower track. I expect the s-bend off-track count and control_effort to fall,
      with the oval holding near 1.0.


      - [Open this output](iteration-6/entity1/versions/e2ba364484ec413cad87213365dee64a/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/78ee6d1edcaa4ba9a56fd869c98cccee/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-cf4d414734b61893/payload.json)'
  - id: entityR1
    label: Track and gain next steps
    notes: 'Feedback written before the race, citing iteration 5 and the monotone
      lookahead sweep. It proposes wheel_track 0.10 with fallbacks for oscillation
      and slalom line loss, and corrects my earlier wheel_track 0.14 advice.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Evidence
      from iteration 5 (y 0.08, wheel_track 0.12, score 561.6): the oval finished
      20 of 20 with oscillation 0.20, the s-bend finished 11 of 20 with 9 off-track
      exits, max_error 0.047 and control_effort 12.2 (the highest of any track), and
      the slalom finished 0 of 20 with line_loss 1.35. The lookahead sweep (iterations
      3, 1, 4, 5) is monotone, so lookahead is no longer the lever. Your proposed
      wheel_track 0.10 is physically sound: turn rate is the wheel speed difference
      divided by wheel_track, so the narrower track adds yaw per unit of steering
      command, and this corrects the wheel_track 0.14 advice I gave earlier. Next
      race: if s-bend off-track exits fall below 9 of 20 and control_effort falls
      from 12.2 while the oval finish stays at or near 1.0 and oscillation stays below
      about 0.4, keep wheel_track 0.10 and try the first requested change. If oscillation
      rises above about 0.4 or the oval finish falls below 0.85, the extra yaw gain
      is too high, so try the second change. If slalom line_loss stays at about 1.3
      or above with the track fixed, try the third change.


      ### Requested changes


      - If the s-bend off-track exits fall with steering_oscillation below about 0.4
      at wheel_track 0.10, keep y 0.08 and hold wheel_track at 0.10 as the new best
      track width. Evidence: iteration 5 s-bend control_effort was 12.2 with 9 of
      20 off-track exits, and a narrower track adds yaw per PWM count, so it should
      reduce the effort needed in bends.

      - If steering_oscillation rises above about 0.4 or the oval finish falls below
      0.85 at wheel_track 0.10, try wheel_track 0.11 as a compromise, or keep wheel_track
      0.10 and lower kp to 3.5 to cancel the extra yaw gain. Evidence: iteration 5
      oscillation was 0.20 on the oval and 0.32 on the s-bend at wheel_track 0.12,
      so the gain increase should be moved in small steps.

      - If slalom line_loss_events stay at about 1.3 or above with the track fixed,
      do not widen the sensor span beyond x ±0.024. Evidence: iteration 2 at ±0.032
      with kp 4.5 cut the oval finish to 8 of 20 and did not fix the bends. Instead,
      test a 12 mm footprint at the same ±0.024 x positions, since iteration 0 (12
      mm, y 0.06) had line_loss 1.9 on slalom and that was the worst value, so this
      should be treated as a test rather than an expected fix.


      - [Open this output](iteration-6/entityR1/versions/e2ba364484ec413cad87213365dee64a/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/78ee6d1edcaa4ba9a56fd869c98cccee/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-cf4d414734b61893/payload.json)'
