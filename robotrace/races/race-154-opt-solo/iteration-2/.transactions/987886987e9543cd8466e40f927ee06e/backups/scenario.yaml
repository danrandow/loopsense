  entities:
  - id: entity0
    label: Lower kd, kp, speed
    notes: 'Cuts kd from 0.5 to 0.2 to reduce derivative chatter, kp from 4.0 to 3.0
      to reduce overshoot, and base_speed from 1.4 to 1.2 to survive bends. Sensors
      move 0.02 m further ahead. Based on all 60 trials ending off-track at max_error
      about 0.061 m, with oscillation rising when kd went up.


      ### Rationale


      Evidence: all 60 development trials across oval, s-bend and slalom ended off_track
      with zero completions. Iteration 1 raised oval progress to 0.20 but left s-bend
      at 0.04 and slalom at 0.10. Max error sits at about 0.061 m on every track,
      which is the off-track limit, so the robot leaves the tape by a consistent overshoot
      rather than slow drift. Line-loss events fell to 0 on oval, so the wider sensor
      spread and 16 mm sensors are working. Steering oscillation rose from 0.075 to
      0.117 on oval when kd went from 0.1 to 0.5 with kp raised to 4. The likely cause
      is that kd is acting on a signal that changes very quickly, because a sensor
      crossing takes about 0.03 s at about 1 m/s. That makes kd*(d signal/dt) large
      and noisy, so it adds chatter instead of damping. Changes: (1) kd 0.5 to 0.2
      to cut derivative jitter; (2) kp 4.0 to 3.0 to reduce overshoot per unit of
      offset; (3) base_speed 1.4 to 1.2 because survival matters more than speed while
      no run finishes, since a completion is worth 500 points; (4) sensor y moved
      from 0.03 to 0.05 m ahead of the axle so the sensors see the line earlier, which
      reduces the lag that produces overshoot at a given speed. Geometry x-spread,
      sensor size, wheel_track and mass are kept so the effect of the controller changes
      can be read cleanly. Expected result: max_error below 0.05 on s-bend and slalom,
      steering_oscillation back near 0.07 or lower, and progress above 0.3 on all
      tracks. Hypotheses to check next: (H1) if s-bend still stops at about 0.04 progress,
      the first bend is too tight for this speed and base_speed should drop to about
      1.0; (H2) if oscillation is still high, the sensor noise is driving kd and kd
      should go to 0; (H3) if the robot survives but does not finish, base_speed must
      rise, since finishing needs about 1.5 m/s average. Measurements wanted: completion,
      progress, completion_time, max_error, line_loss_events, steering_oscillation
      and noise_robustness per track.


