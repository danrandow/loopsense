  entities:
  - id: entity0
    label: 'Iter3: kp4.5 ki0.3 kd0.6'
    notes: 'Returns the sensor row to y 0.03 (best progress so far) and raises kp
      and kd slightly, adding a small integral term to cancel the fixed motor mismatch.
      Based on iteration 1 being the best race and every run hitting the 0.06 m off-track
      limit.


      ### Rationale


      Evidence: all 60 development trials across the three tracks ended off_track
      with zero completions. Max error sits at about 0.060 to 0.064 m on every design,
      which is the off-track limit, so the robot leaves the tape by a consistent overshoot.
      Iteration 1 (kp 4.0, kd 0.5, base 1.4, sensor y 0.03) gave the best scores and
      the most oval progress (0.20). Iteration 2 lowered kd to 0.2, kp to 3.0, base
      to 1.2 and moved the sensors to y 0.05. That cut oscillation but lost progress
      on oval (0.11) and slalom (0.10), so the forward sensor offset and weaker gains
      probably cost more than they saved. Iteration 2 also reported zero line losses
      on oval, so the wider 16 mm sensor spread is working and I keep it. Changes:
      (1) return the sensor row to y 0.03, the setting that gave the best progress;
      (2) kp 4.0 to 4.5 for a stronger correction per unit of offset; (3) kd 0.5 to
      0.6, a small increase in damping against the faster response; (4) ki 0.0 to
      0.3. A fixed left/right motor mismatch acts as a steady bias, and a small integral
      term can cancel it so the robot stops sitting off-centre on straights; the integral
      is clamped at +/-2, so the added turn is bounded. base_speed stays at 1.4 because
      survival still matters more than speed. Expected result: progress above 0.2
      on all tracks and max_error somewhat below 0.06, with steering_oscillation near
      0.12 or lower. Hypotheses to check next: (H1) if steering_oscillation rises
      above about 0.2, kp is too high for kd and kd should go to about 1.0; (H2) if
      max_error still reaches 0.06 on the same bend in every trial, the cause is the
      speed-to-curvature limit and base_speed should drop to about 1.0; (H3) if the
      integral pushes the robot off-line, set ki back to 0. Measurements wanted per
      track: completion, progress, completion_time, max_error, rms_error, line_loss_events,
      steering_oscillation and noise_robustness.


