  - id: entity0
    label: kd 1.2 damping step
    notes: 'Raises kd from 0.9 to 1.2 on the best design (iteration 10, score 311),
      keeping every other value fixed. Earlier damping increases improved bend progress
      and reduced oval oscillation, and s-bend and slalom still stall at the 0.06
      m off-track limit.


      ### Rationale


      Evidence from iteration 10 (score 311.2, best so far): oval now finishes 17
      of 20 with progress 0.94, and s-bend (0.11) and slalom (0.07) still stall at
      the off-track limit, with max_error about 0.06 m on every track. Across the
      history, each damping increase (kd 0.6 to 0.9) raised progress and cut oscillation
      on oval (0.31 to 0.20 after the geometry changes). Raising kp alone (iteration
      9) did little for the bends, and the speed cut (1.1 to 1.0) helped oval and
      s-bend. The bends are therefore still overshoot-limited, and the most consistent
      lever so far is damping. Change: kd 0.9 to 1.2, the only controller change.
      Speed (1.0), kp (5.0), ki (0.3), sensor layout and wheel track stay fixed so
      the damping effect can be read cleanly. Expected result: s-bend and slalom max_error
      drops below 0.06 on some bends, slalom progress rises above 0.1, and oval completions
      hold at 15 or more of 20 with steering_oscillation at or below about 0.25. Risk:
      higher kd amplifies sensor noise on the sharpest bends. Hypotheses for the measurements:
      (H1) if oval oscillation rises above 0.3 and completions fall, kd has passed
      its useful range and 0.9 is the ceiling. (H2) If s-bend and slalom still stall
      near 0.1 with max_error at 0.06, the limit is speed on tight bends, not damping,
      and base_speed should drop to about 0.9 in the next design. (H3) If all tracks
      survive but none finish, base_speed should rise slightly. This is the final
      iteration, so the design is chosen to be a safe, evidence-backed step from the
      best result rather than a large untested change.


