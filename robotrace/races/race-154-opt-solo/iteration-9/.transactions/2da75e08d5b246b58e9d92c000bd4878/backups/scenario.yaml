  entities:
  - id: entity0
    label: Wider sensor row, ±0.08m
    notes: 'Single change from iteration 7: sensor spread widened from ±0.06 m to
      ±0.08 m to stop the whole array losing tape on slalom excursions (slalom line-loss
      rose to 0.9). Evidence is the iteration 7 race, where narrower wheel_track improved
      oval completions and max_error.


      ### Rationale


      Evidence from iteration 7 (score 216.4, best so far): narrowing wheel_track
      from 0.14 to 0.11 m lifted oval completions from 5 to 6 of 20, cut oval max_error
      from 0.059 to 0.054 m, and lowered oval oscillation from 0.307 to 0.262. Slalom
      is still the weakest track, at 0.07 progress, and its line-loss events rose
      from 0.05 to 0.9. Line loss happens only when every sensor reads below 0.05,
      which needs the robot centre to move about 0.07 m or more off the tape. The
      current sensor row spans only ±0.06 m, so on slalom excursions the whole array
      can leave the tape. Change: widen the sensor row to x = -0.08, -0.04, 0, 0.04,
      0.08 m, keeping the same weights, y = 0.03 m, 16 mm sensors and all controller
      values. Widening the spread keeps the tape under a sensor at larger offsets,
      and the same weights mean the signal is a little larger per unit offset, a modest
      gain increase. This is a single-variable change, so the slalom line-loss and
      progress change can be read cleanly. Expected result: slalom line_loss_events
      fall well below 0.9 and slalom progress rises above 0.1, while oval completions
      hold near 6 of 20. Hypotheses for the next race: (H1) if slalom line-loss stays
      near 0.9 with the wider row, the excursion is from steering lag, not sensor
      coverage, so kp should rise to about 5.0 with kd at 0.9. (H2) If oval oscillation
      rises above 0.35 from the larger signal, the spread is adding gain and the outer
      weights should drop to ±0.75. (H3) If all tracks survive but none finish, base_speed
      should move to about 1.2. Measurements wanted per track: completion, progress,
      completion_time, max_error, rms_error, line_loss_events, steering_oscillation,
      control_effort and noise_robustness.


