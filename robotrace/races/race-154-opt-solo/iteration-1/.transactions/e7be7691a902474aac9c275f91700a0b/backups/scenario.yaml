  entities:
  - id: entity0
    label: Wider, stiffer, slower
    notes: 'Baseline left the track on every trial at about 6 cm error, so this candidate
      lowers base_speed to 1.4, raises kp to 4.0 and kd to 0.5, widens the sensor
      spread to ±0.06 m, enlarges sensors to 16 mm and widens the wheel track. The
      evidence is the zero-completion, off-track baseline race at max error about
      0.061 m.


      ### Rationale


      Evidence from the development race: all 60 trials on oval, s-bend and slalom
      ended off_track with zero completions. Progress reached only 0.04 to 0.115,
      and each run recorded one line-loss event. Max error was about 0.061 m, right
      at the off-track limit of max(0.06, 0.0125 + 0.12/4) = 0.06 m. The robot is
      leaving the tape quickly, not drifting slowly. Likely causes: (1) base_speed
      1.8 is too fast for the steering authority, so the robot slides wide on curves;
      (2) kp 2.5 with kd 0.1 gives too little correction and too little damping; (3)
      the sensor array spans only ±0.04 m, so on a moderate offset the outer sensors
      can drop off the tape and trigger a line loss. Changes: base_speed 1.8 to 1.4
      to reduce slide-out on bends; kp 2.5 to 4.0 for a stronger correction per unit
      of offset; kd 0.1 to 0.5 to damp the faster response; ki stays 0 to avoid windup.
      Geometry: sensor x spread widened to ±0.06 m (-0.06, -0.03, 0, 0.03, 0.06) so
      the tape stays under a sensor at larger offsets; sensor_size raised to 0.016
      so each sensor sees more tape and the sum stays above the 0.05 line-loss threshold.
      Wheel_track widened to 0.14 m for more yaw stability, mass lowered to 0.6 kg
      to lower yaw inertia and speed up turn response. Expected result: fewer off-track
      exits, more progress on all three tracks, and possibly the first completions.
      Trade-off: slower base speed may make it hard to finish under 3 s, so if the
      robot survives but does not finish, base_speed should rise again. Hypotheses
      to check: (H1) if steering_oscillation rises sharply, kp is too high relative
      to kd; (H2) if line_loss_events stay at 1 or more, the sensor spread or size
      is still too narrow; (H3) if max_error is still near 0.06 on curves, the robot
      is too fast for its grip and base_speed should drop further. Measurements to
      see next: completion, progress, completion_time, max_error, line_loss_events
      and steering_oscillation per track.


