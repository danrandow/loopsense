  entities:
  - id: entity0
    label: Narrower track, more
    notes: 'Keeps the iteration 6 controller (kd 0.9) and narrows wheel_track from
      0.14 to 0.11 m to raise steering authority, since max_error sits at the off-track
      limit on every track. Iteration 6 scored 211.8, with 5 oval completions and
      slalom progress of only 0.07.


      ### Rationale


      Evidence: iteration 6 is the best design so far (score 211.8). Raising kd from
      0.6 to 0.9 with speed 1.1, kp 4.5 and ki 0.3 unchanged gave 5 oval completions
      out of 20, s-bend progress of 0.36, and oval progress of 0.75. Every track still
      ends at max_error of about 0.059 to 0.064 m, which is the off-track limit, so
      the robot overshoots the tape on bends rather than drifting slowly. Slalom is
      the weakest track at 0.07 progress, with almost no line loss, which points to
      a slow steering response on alternating bends. Line-loss events are near zero,
      so the 16 mm sensors at ±0.06 m are adequate and I keep them. Oval oscillation
      is 0.31, so there is little margin to raise kd again. Iteration 6 H2 said that
      if max_error stays at the limit, steering authority is the constraint. Turn
      rate is the wheel-speed difference divided by wheel_track, so a narrower track
      gives more yaw rate per unit of PWM differential. Change: wheel_track 0.14 to
      0.11 m, the only change, so the effect on overshoot and slalom can be read cleanly.
      Controller stays at base 1.1, kp 4.5, ki 0.3, kd 0.9. Expected result: effective
      steering gain rises by about 27 percent, max_error falls below 0.06 on some
      bends, slalom progress rises above 0.15, and oval completions hold or increase.
      Risk: higher effective gain could increase oscillation above 0.4 on oval. Hypotheses
      for next race: (H1) if oscillation rises above 0.4 with no gain in max_error,
      the extra authority is the problem and kp should fall back to about 4.0. (H2)
      if max_error is unchanged at about 0.06 on the same bend, speed is the limit
      and base_speed should drop to about 1.0 while kd stays at 0.9. (H3) if all tracks
      survive but do not finish, base_speed should rise to about 1.2. Measurements
      wanted per track: completion, progress, completion_time, max_error, rms_error,
      line_loss_events, steering_oscillation, control_effort and noise_robustness.


