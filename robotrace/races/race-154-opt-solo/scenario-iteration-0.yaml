  entities:
  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'First candidate with no race data yet: five 12 mm sensors at 0.02 m spacing,
      linear weights, kp 2.5, kd 0.1, base_speed 1.8. Chosen as a conservative starting
      point to collect baseline telemetry on all development tracks.


      ### Rationale


      Iteration 0 has no race telemetry, so this is a conservative baseline meant
      to produce the first measurements, not a tuned design. Geometry: five line sensors
      spaced 0.02 m apart across x = -0.04 to +0.04 and placed 0.03 m ahead of the
      axle, so the steering signal is measured slightly ahead of the wheels. Sensor
      size 0.012 m is about half the 25 mm tape width, which gives a clean, graded
      response as the line moves under the array. Wheel track 0.12 m and radius 0.03
      m are mid-range, and mass 0.8 kg keeps yaw inertia moderate. Controller: sensor
      weights are linear in x (-1, -0.5, 0, 0.5, 1), so signal is about the line''s
      lateral offset, positive meaning left. kp = 2.5 gives a moderate steering response
      (signal 1 produces a 875 PWM differential), ki = 0 avoids integral windup on
      curves, and kd = 0.1 adds light damping against oscillation. base_speed = 1.8
      is high enough to approach the 1.5 m/s average needed to finish in 3 s, but
      leaves margin below full drive. line_loss = last_direction so the robot searches
      toward the side it last saw the line. Expected result: completion on the oval
      and s-bend with a small rms_error. The main risks are overshoot on the slalom
      and off-track exits on tight bends at this speed. Hypotheses to check next:
      (1) if the robot oscillates, kp is too high or kd too low; (2) if it leaves
      the line on bends, speed is too high or kp too low; (3) if it is too slow to
      finish, base_speed should rise. The next measurements to see are completion_time,
      max_error, steering_oscillation and line_loss_events per track.


      - [Open this output](iteration-0/entity0/versions/273882bbf6d747bea64de6b25979de4c/payload.json)'
