overrides:
  entities:
  - id: entity0
    label: Speed 1.5, kp 2.0 test
    notes: 'Keeps the best raced geometry and base_speed 1.5 from iteration 8 (score
      46.13), and lowers kp from 2.5 to 2.0 to test whether oval oscillation and line
      loss (1.7 per run) fall at speed. Based on the iteration 8 telemetry: oval progress
      rose to 0.266, but line loss and oscillation rose too.


      ### Rationale


      Evidence from iteration 8 (base_speed 1.4 to 1.5, geometry and other gains as
      iteration 7): the score rose from 42.87 to 46.13, the best raced result. Oval
      progress rose from 0.226 to 0.266, while s-bend (0.042) and slalom (0.036) stayed
      flat. The cost was oval line_loss_events, which rose from 0.6 to 1.7 per run,
      and oval steering_oscillation (0.17 vs 0.12) and control_effort (6.1 vs 3.8).
      Those rises look like speed-driven oversteer and slip, not a missing lever.
      The Evaluator''s rule (b) would return speed to 1.4, but that would discard
      a measured score gain, so I do not revert it. Iterations 3 to 5 showed that
      kp, ki and kd each move the score by under 0.5 at 1.4, but at 1.5 the oval is
      now dominated by oscillation and line loss, where gain can matter more. I therefore
      keep the best raced design (iteration 8: base_speed 1.5, outer sensors at +/-0.07,
      weights +/-1.5/+/-0.75/0, ki 0.5, kd 0.2, last_direction) and change one group:
      controller.kp from 2.5 to 2.0. Expected, not measured: oval steering_oscillation
      and line_loss_events fall while oval progress holds near 0.25 or more, because
      the effective gain on the outer sensors drops from 3.75 to 3.0. Risk: under-steering
      on tight bends could lower s-bend and slalom progress, and line loss could still
      rise at speed. If progress falls or line_loss_events stays at or above 1.7,
      the next step is to restore kp 2.5 (iteration 8), not to lower speed further.
      If oval progress exceeds 0.27 with line loss under 1.5, consider base_speed
      1.6 in a later iteration. Measurements requested: all metrics plus noise_robustness,
      to separate line-loss and oscillation effects from sensor noise and to compare
      against iteration 8.


      - [Open this output](iteration-9/entity0/versions/8f268d65c2ea42309dc08c6308545a39/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-5083b673692562e4/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-28b044089b50d77e/payload.json)'
  - id: entityR1
    label: Approve kp 2.0 at speed
    notes: 'Approves the single-group change kp 2.5 to 2.0 on the best raced design
      (iteration 8, score 46.13), aimed at the oval oscillation and line loss that
      rose with base_speed 1.5. The evidence is iteration 8''s oval line_loss_events
      of 1.7 and steering_oscillation of 0.17, and iterations 3 to 5, where kp changes
      moved the score by under 0.5.


      ### Feedback


      Pre-race review. Nothing has raced for this candidate, so this states no outcome
      for it. The candidate is valid: five sensors match five weights, outer x-positions
      are +/-0.07 (inside +/-0.08), y = 0.03, and kp 2.0, ki 0.5, kd 0.2, base_speed
      1.5 and last_direction are all inside their limits. It changes one group from
      the best raced design (iteration 8, score 46.13 at kp 2.5): controller.kp from
      2.5 to 2.0, with geometry and all other controller fields unchanged. Iteration
      8 showed the oval''s line_loss_events rising from 0.6 to 1.7 per run and steering_oscillation
      rising to 0.17 when base_speed went from 1.4 to 1.5. Iterations 3 to 5 showed
      kp changes moved the score by under 0.5, so lowering kp is a cheap test of whether
      the speed-driven oscillation and line loss can be tamed without giving up the
      oval progress gain from iteration 8. Approve it: the change is a single field,
      it is valid, and it costs one race run, so the telemetry is more useful than
      another round of reading numbers. After the race, use the telemetry as follows.
      (a) If oval line_loss_events falls below 1.7 and steering_oscillation falls
      below 0.17, while oval progress holds at or above about 0.25 and s-bend and
      slalom progress stay near 0.042 and 0.037, keep kp 2.0 and consider base_speed
      1.6 in a later iteration. (b) If oval progress falls below about 0.25 or s-bend
      progress falls below 0.0416, under-steering is the limit: restore kp 2.5 (iteration
      8). (c) If line_loss_events stays at or above 1.7 with kp 2.0, do not lower
      speed first; restore kp 2.5 and test kd (for example 0.3) on its own. Change
      one group of fields per revision.


      ### Requested changes


      - After the race, if oval line_loss_events falls below iteration 8''s 1.7 and
      oval progress holds at or above about 0.25, keep controller.kp at 2.0 and consider
      controller.base_speed 1.6 in a later iteration, with all other fields unchanged,
      citing iteration 8''s speed gain.

      - If oval progress falls below about 0.25 or s-bend progress falls below iteration
      8''s 0.0416, set controller.kp back to 2.5, since iteration 8 is the best raced
      design at 46.1311.

      - If oval line_loss_events stays at or above 1.7 with kp 2.0, keep kp at 2.5
      and test controller.kd at 0.3 alone, citing iterations 3 to 5, where gain changes
      moved the score by under 0.5 but speed changes moved it by more.


      - [Open this output](iteration-9/entityR1/versions/2b6eedebe9ae4c19ae349aa74266b7a2/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/8f268d65c2ea42309dc08c6308545a39/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-28b044089b50d77e/payload.json)'
