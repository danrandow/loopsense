map:
  id: race-136-opt-eval
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Wider span + integral
    notes: 'Widened the sensor span to +/-0.04 m, added ki = 0.3 to cancel the fixed
      motor-mismatch drift, raised kd to 0.1, and lowered base_speed to 1.4. Iteration
      0 went off track on all 60 trials with one line loss each and low oscillation,
      which points to drift and loss of sensor coverage rather than jitter.


      ### Rationale


      Evidence from iteration 0: every trial on all three tracks ended off_track (0
      of 60 finished). Progress was only 0.04 to 0.12, and max_error sat at about
      0.061 m, right at the 0.06 m off-track limit. Each run recorded one line-loss
      event and very low steering_oscillation (0.06 to 0.07). The robot is not jittering.
      It drifts steadily off the line and falls out of sensor coverage. The five sensors
      span only +/-0.02 m, so once the robot is roughly 0.03 m off centre all readings
      go to background, and last_direction then steers the wrong way for the rest
      of the run. Two causes fit this. First, the contract''s fixed left/right motor
      mismatch produces a constant bias. With ki = 0, proportional-only control leaves
      a steady offset of about bias/kp, which grows until the line is lost. Second,
      base_speed 1.6 leaves little margin for correction. Changes in this candidate:
      (1) widen the sensor span to +/-0.04 m (positions 0.04, 0.02, 0, -0.02, -0.04)
      with the same weights, so the line stays visible at about 0.05 m offset; (2)
      add ki = 0.3 to cancel the constant motor-mismatch bias (the integral is capped
      at +/-2, so the added turn stays bounded); (3) raise kd from 0.05 to 0.1 for
      damping; (4) lower base_speed from 1.6 to 1.4 to give the loop more correction
      margin. kp stays at 3.0 because oscillation is low. Expected result: the robot
      stays on the line through the bends and completes at least some oval and s-bend
      trials. Completion time may be a little above 3 s at 1.4, so if progress is
      near 1 but completion_time is above 3 s, raise base_speed to about 1.7. Hypotheses
      to test next: (a) the off-track drift is caused by the motor mismatch, so ki
      should cut max_error and line_loss_events sharply; (b) if line_loss_events stays
      above 0 with the wider span, the sensors are still too narrow or too far forward,
      and last_direction may need to change to search_left or search_right. Measurements
      requested: all metrics, so the next review can compare max_error and line_loss_events
      against iteration 0.


      - [Open this output](iteration-1/entity0/versions/843431fa230f4a4e9994e495b63dac3a/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-132d56dfed7d284f/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-c5943fe6f94e07a9/payload.json)'
  - id: entityR1
    label: 'Approve: wider sensors'
    notes: 'Approved the candidate because it is valid and tests the two fixes the
      iteration 0 failures point to: a wider sensor span and an integral term for
      the motor-mismatch bias. The race result will show whether either helps, and
      the next review can tune speed, span, or ki from that telemetry.


      ### Feedback


      Candidate review based only on iteration 0, where all 60 trials ended off_track
      (progress 0.04 to 0.12, max_error about 0.061 m, one line-loss event per run,
      low steering_oscillation of 0.06 to 0.07). The candidate is valid: five sensors
      match five weights, x-positions of ±0.04 are inside the ±0.08 limit, y = 0.03
      is in range, and every controller field is within its limit. Its changes address
      the failure mode seen in iteration 0. Widening the span to ±0.04 m keeps the
      line visible at larger offsets, which should reduce the line losses that started
      every failure. Adding ki = 0.3 targets the constant left/right motor-mismatch
      bias that proportional control alone cannot remove. Raising kd to 0.1 adds damping,
      and lowering base_speed to 1.4 gives more correction margin. The rationale''s
      claims about performance are hypotheses, not measurements. Nothing has raced
      for this candidate yet, so do not assume completion. This is the first real
      test of the wider sensor span and integral term, and the race is needed to see
      whether either helps. Next review, use the telemetry as follows. If progress
      is near 1 but completion_time is above 3 s, raise controller.base_speed to about
      1.7 and keep the other fields. If line_loss_events is still above 0 with max_error
      near 0.06, widen the sensor set further (for example x = ±0.06 with weights
      ±1.5 or add sensors) or change line_loss to search_left or search_right, depending
      on the side where the line is lost. If the robot drifts steadily with low oscillation,
      raise ki to 0.5 before changing speed. Change one group of fields per revision
      so the effect stays readable.


      ### Requested changes


      - If completion_time is above 3 s with progress near 1, set controller.base_speed
      to 1.7 and keep the other controller and geometry fields, because iteration
      0 shows speed is the constraint once the robot stays on the line.

      - If line_loss_events stays above 0 with max_error near 0.06, extend the sensor
      span to x = ±0.06 with weights scaled to about ±1.5 at the outer sensors, or
      change controller.line_loss to search_left, comparing against iteration 0''s
      one loss per run.

      - If the robot drifts with low steering_oscillation and max_error still grows
      over the run, raise controller.ki from 0.3 to 0.5 to remove more of the constant
      motor-mismatch bias, keeping kp at 3.0.


