  id: race-136-opt-eval
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: kd 0.2 damping test
    notes: 'Keeps the best raced geometry and ki 0.5 (ki gave no gain or loss in iteration
      4), and raises kd from 0.1 to 0.2 to test whether the oval steering oscillation
      of 0.113 falls below 0.09, as the Evaluator''s rule requires. The race should
      show whether max_error stays pinned near 0.06.


      ### Rationale


      Evidence from iteration 4 (ki 0.3 to 0.5, everything else as iteration 3): the
      score moved from 40.6925 to 40.6926, so the integral change had no measurable
      effect. line_loss_events stayed 0 on all tracks, and max_error stayed at 0.0609
      to 0.0629 m, still at or above the 0.06 m off-track limit. Progress was unchanged
      (s-bend 0.0406, slalom 0.035), and progress did not fall, so ki 0.5 is not overcorrecting
      and I keep it. The failure is therefore not fixed by the integral term. The
      oval steering_oscillation is still 0.1133, which the Evaluator''s rule (c) flags
      as above about 0.09. Iteration 3 showed kp 3.0 to 2.5 barely changed that oscillation
      (0.112 to 0.113), so the oscillation is not a proportional-gain problem. The
      rule''s next step is to raise kd from 0.1 to 0.2, with kp and ki unchanged.
      This is the single group changed in this iteration. Geometry is held at the
      best raced design (sensors at x = +/-0.06 and 0, weights +/-1.5 and +/-0.75,
      y = 0.03 m, base_speed 1.4, line_loss last_direction). Expected result, not
      measured: oval steering_oscillation falls below about 0.09 and s-bend and slalom
      max_error stays near 0.06 or improves slightly. Derivative action should damp
      the outer-sensor jitter. Hypotheses for the next race: (1) if oval oscillation
      falls and max_error still reaches 0.06, the remaining error is a steady bias
      that kp, ki and kd cannot remove, so the next test should be base_speed (lower
      to about 1.2 to reduce slip and outward drift at speed) rather than more gain;
      (2) if kd 0.2 raises s-bend or slalom oscillation, return kd to 0.1. Measurements
      requested: all metrics plus noise_robustness, to check whether the max_error
      pinning at about 0.061 is sensor noise or a fixed bias.


      - [Open this output](iteration-5/entity0/versions/39b3cc01649344758c285466b18dc0cb/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-d1d38b232a1b8056/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-97f7c3bb68bf493b/payload.json)'
  - id: entityR1
    label: Approve ki 0.5 test
    notes: 'Approved the single-variable change ki 0.3 to 0.5 on the best raced design
      (iteration 3, score 40.69). Iteration 3 showed zero line loss but steady drift
      with max_error just above 0.06 and low s-bend and slalom oscillation, which
      the integral term is meant to address.


      ### Feedback


      Pre-race review, based only on earlier races and the candidate''s contents.
      The candidate is valid: five sensors match five weights, x-positions are within
      ±0.08 m, and ki = 0.5 is inside its 0–5 range with the integral capped at ±2.
      It changes one group from the best raced design (iteration 3, score 40.69):
      controller.ki from 0.3 to 0.5, with geometry, kp 2.5, kd 0.1, base_speed 1.4
      and line_loss last_direction unchanged. Iteration 3 showed line_loss_events
      0 on all three tracks and max_error still at 0.0609 to 0.0629 m, just above
      the 0.06 m limit. Its s-bend and slalom oscillation was low (0.0665 and 0.0633)
      with progress of only 0.041 and 0.035, which points to steady drift rather than
      jitter, so a larger integral term is the change the evidence supports. The oval
      oscillation (0.113) was not moved by kp in iteration 3, so it is not a proportional-gain
      problem, and this candidate does not address it. The rationale''s expected outcomes
      are hypotheses only and are not measured. Use the next race as follows. (a)
      If the s-bend or slalom progress falls, or max_error rises above 0.0629, the
      integral is overcorrecting: return ki to 0.3. (b) If line_loss_events stays
      0 and max_error on the s-bend and slalom drops below 0.06 with progress near
      1 and completion_time above 3 s, raise base_speed to 1.7. (c) If oval steering_oscillation
      stays above about 0.09, test kd at 0.2 before lowering kp again. Change one
      group of fields per revision.


      ### Requested changes


      - If the s-bend or slalom progress falls below iteration 3''s 0.041 and 0.035,
      or max_error rises above 0.0629, revert controller.ki to 0.3 and keep kp at
      2.5, since iteration 3 is the best raced design.

      - If line_loss_events stays 0 and max_error drops below 0.06 with progress near
      1 and completion_time above 3 s, set controller.base_speed to 1.7 and keep the
      other fields.

      - If oval steering_oscillation stays above about 0.09 (iteration 3 measured
      0.113), set controller.kd from 0.1 to 0.2 with ki and kp unchanged before lowering
      kp again.


      - [Open this output](iteration-4/entityR1/versions/489b25149bed41fa95d4e6d23eea29f5/payload.json)

