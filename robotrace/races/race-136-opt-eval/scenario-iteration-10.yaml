overrides:
  entities:
  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence from iteration 9 (kp 2.5 to 2.0 at base_speed 1.5): score 41.30, below
      iteration 8''s 46.13. Oval progress fell from 0.2657 to 0.2315, below the roughly
      0.25 threshold in the Evaluator''s rule (b). Oval line_loss_events dropped from
      1.7 to 1.6 and steering_oscillation from 0.171 to 0.149, but the progress loss
      outweighs them. s-bend progress held at 0.0418, above iteration 8''s 0.0416.
      The Evaluator''s rule (b) therefore says to restore kp 2.5, the best raced gain.
      I restore kp 2.5 with geometry and base_speed 1.5 exactly as iteration 8, so
      the base is the best raced design (46.13). Iterations 3 to 5 showed gain changes
      move the score by under 0.5, but the speed-driven oval line loss at 1.5 is still
      open. The Evaluator''s requested test (c) is to keep kp 2.5 and test kd alone
      at 0.3. I change only controller.kd from 0.2 to 0.3. Expected, not measured:
      oval steering_oscillation and line_loss_events fall toward the 1.6 to 1.7 range
      while oval progress stays at or above 0.26. The risk is that the extra derivative
      action amplifies sensor noise and cuts oval progress, which would show in noise_robustness
      and in progress. If progress falls below 0.2657 or line_loss_events rises above
      1.7, revert kd to 0.2 (iteration 8). Measurements requested: all metrics plus
      noise_robustness, to separate kd effects on oscillation and line loss from sensor
      noise and to compare directly with iteration 8.


      - [Open this output](iteration-10/entity0/versions/67b7f3653b9a44eaa3a628b827cd056c/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-3449802fae057042/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-e7e96444a9c3e27f/payload.json)'
  - id: entityR1
    label: Approve kd 0.3 test
    notes: 'Approved a single-field test (kd 0.2 to 0.3) on the best raced design,
      iteration 8 (46.13). It targets the speed-driven oval oscillation (0.17) and
      line loss (1.7) that appeared when base_speed rose to 1.5, and it is cheap to
      race. The feedback sets revert and speed-step rules for the final iteration.


      ### Feedback


      Pre-race review. Nothing has raced for this candidate, so this states no outcome
      for it. The candidate is valid: all five sensor positions are inside the limits,
      sensor weights match the five sensors, and kp 2.5, ki 0.5, kd 0.3, base_speed
      1.5 and last_direction are inside their ranges. It changes one field from the
      best raced design (iteration 8, score 46.1311): controller.kd from 0.2 to 0.3,
      with geometry, kp, ki, base_speed and line_loss unchanged. The evidence for
      trying more derivative action is that iteration 8''s oval steering_oscillation
      rose to 0.17 and line_loss_events to 1.7 when base_speed went from 1.4 to 1.5
      (iteration 7 to 8). Iterations 3 to 5 showed that gain changes at base_speed
      1.4 moved the score by under 0.5, but kd 0.1 to 0.2 at 1.4 (iteration 4 to 5)
      did reduce oval oscillation slightly (0.113 to 0.111) with no harm to s-bend
      or slalom progress. Iteration 9 is not used as a base because kp 2.0 lowered
      the score to 41.30. This is a cheap, single-field test of the best design, so
      approve it. Do not treat the rationale''s expected oscillation and line-loss
      reductions as measured. Use the next race as follows. (a) If oval line_loss_events
      is at or below 1.7 and oval progress is at or above 0.2657, with s-bend progress
      near 0.0416, keep kd 0.3. Only one iteration remains after this one, so consider
      base_speed 1.6 in that final iteration with kd 0.3 unchanged, since the 1.4
      to 1.5 step gave the largest measured gain (oval progress 0.2261 to 0.2657).
      (b) If oval progress falls below 0.2657 or line_loss_events rises above 1.7,
      revert kd to 0.2, which is the best raced design. (c) If noise_robustness drops
      clearly while oscillation does not fall, the derivative is amplifying sensor
      noise; revert kd to 0.2 rather than raising it further.


      ### Requested changes


      - After the race, if oval line_loss_events stays at or below iteration 8''s
      1.7 and oval progress is at or above 0.2657, keep controller.kd at 0.3 and,
      in the final iteration, test controller.base_speed 1.6 with all other fields
      unchanged, citing the 1.4 to 1.5 step''s oval progress gain (0.2261 to 0.2657).

      - If oval progress falls below iteration 8''s 0.2657 or line_loss_events rises
      above 1.7, set controller.kd back to 0.2 with kp 2.5, ki 0.5 and base_speed
      1.5, since iteration 8 is the best raced design at 46.1311.

      - If noise_robustness falls while steering_oscillation does not drop, do not
      raise kd further; revert to kd 0.2 (iteration 8), since derivative action at
      the outer sensors may be amplifying sensor noise.


      - [Open this output](iteration-10/entityR1/versions/0f3bb9304c2b4c77a925fdf047cf2785/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/67b7f3653b9a44eaa3a628b827cd056c/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-e7e96444a9c3e27f/payload.json)'
