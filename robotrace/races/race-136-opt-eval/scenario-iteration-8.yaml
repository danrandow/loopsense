map:
  id: race-136-opt-eval
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Speed 1.5 on wide span
    notes: 'Keeps the best raced geometry (outer sensors at +/-0.07 m, score 42.87)
      and changes only base_speed from 1.4 to 1.5. Iteration 6 showed that dropping
      speed to 1.2 cut oval progress sharply, so a modest speed increase is the next
      lever to test for the oval, which carries most of the score.


      ### Rationale


      Evidence from iteration 7 (outer sensors at x = +/-0.07, all else as iteration
      5) is the best raced result at 42.8697. Progress rose on both s-bend (0.0409
      to 0.0424) and slalom (0.035 to 0.0374). The oval also gained progress (0.2126
      to 0.2261). Line loss appeared once per run on the oval (0.6 events on average,
      up from 0), so the wider outer span is near the edge of usable sensing on tight
      bends, but it is still net positive. max_error stayed at 0.0614 to 0.0622 on
      every track, so the off-track limit is still exceeded. The gain and ki/kd changes
      in iterations 3 to 6 moved the score by under 0.5 in total. Iteration 6 showed
      that base_speed 1.2 cut oval progress from 0.213 to 0.124 with s-bend and slalom
      flat, so speed is the lever with the largest measured effect on the oval, which
      carries most of the score. I keep the best design''s geometry (+/-0.07 outer,
      +/-0.03 inner, 0 centre, weights +/-1.5 / +/-0.75 / 0) and controller gains
      (kp 2.5, ki 0.5, kd 0.2, last_direction). I change one group: base_speed from
      1.4 to 1.5. Expected result, not measured: oval progress rises above 0.226 because
      the trend from 1.2 to 1.4 was strongly positive, while s-bend and slalom remain
      near 0.042 and 0.037. Risk: higher speed may increase slip and outward drift,
      so max_error could exceed 0.0622 and line loss could rise on the oval. If progress
      falls or line_loss_events rises above 0.6, return base_speed to 1.4 (iteration
      7). Measurements requested: all metrics plus noise_robustness, to see whether
      the oval gain comes from speed and whether max_error is sensor noise or a fixed
      bias.


      - [Open this output](iteration-8/entity0/versions/799520ab5a7944d2becab2f39d010769/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-78378ed181e74811/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-305b1938ba04e757/payload.json)'
  - id: entityR1
    label: Approve base_speed 1.5
    notes: 'Approves a single-field test of base_speed 1.4 to 1.5 on the best raced
      design (iteration 7, 42.87), since iteration 6 showed speed is the only lever
      with a large measured effect on the oval. Revert to 1.4 if line-loss events
      rise above 0.6 or oval progress falls.


      ### Feedback


      Pre-race review. Nothing has raced for this candidate, so this states no outcome
      for it. The candidate is valid: five sensors match five weights, all x-positions
      are within ±0.08 m, and base_speed 1.5 is inside its 0.05 to 2 range. It changes
      one field from the best raced design (iteration 7, score 42.8697): controller.base_speed
      from 1.4 to 1.5, with geometry (outer ±0.07, inner ±0.03, centre 0), weights,
      kp 2.5, ki 0.5, kd 0.2 and line_loss last_direction unchanged. The evidence
      for speed is the strongest lever measured so far. Iteration 6 showed base_speed
      1.2 cut oval progress from 0.213 to 0.124 with s-bend and slalom flat, and iterations
      3 to 5 moved kp, ki and kd by under 0.5 in total. Speed is the one lever with
      a large measured effect on the oval, which carries most of the score. Iteration
      7 also showed line_loss_events of 0.6 per run on the oval, so the risk here
      is that higher speed raises slip and line loss on the oval. Watch line_loss_events
      and max_error together. Do not treat the rationale''s expected progress gains
      as measured. After the race, use the telemetry as follows. (a) If oval progress
      rises above 0.226 with line_loss_events at or below 0.6 and the s-bend and slalom
      progress near 0.042 and 0.037, keep 1.5 and consider a single further step to
      1.6 next. (b) If line_loss_events rises above 0.6 or oval progress falls below
      0.226, return base_speed to 1.4 (iteration 7), since it is the best raced design.
      (c) If max_error stays at about 0.0622 with progress flat on every track, speed
      is not the limit and the next test should be a single sensing or controller
      field, not more speed. Change one group of fields per revision.


      ### Requested changes


      - After the race, if oval progress rises above iteration 7''s 0.2261 and line_loss_events
      stays at or below 0.6, keep controller.base_speed at 1.5 and consider 1.6 in
      a later iteration, with all other fields unchanged.

      - If line_loss_events rises above iteration 7''s 0.6 on the oval, or oval progress
      falls below 0.2261, set controller.base_speed back to 1.4, since iteration 7
      is the best raced design at 42.8697.

      - If max_error stays at about 0.0622 with flat progress on every track, do not
      raise speed further; test one controller field in isolation (for example kp
      from 2.5 to 2.0) with the iteration 7 geometry, citing iterations 3 to 5 where
      gain changes moved the score by under 0.5.


      - [Open this output](iteration-8/entityR1/versions/5456c8c7940e48f2b58f7f99d64d31c0/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/799520ab5a7944d2becab2f39d010769/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-305b1938ba04e757/payload.json)'
