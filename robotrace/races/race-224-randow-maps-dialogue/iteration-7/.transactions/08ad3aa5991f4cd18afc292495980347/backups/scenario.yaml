map:
  id: race-224-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Hold ±0.03 m row
    notes: 'Holds the best-raced geometry (±0.03 m, 16 mm, y = 0.04) so the restored
      kp 1.2 controller is confirmed, as the Integrator requested. The ±0.04 m row
      test at kp 1.2 is queued for the next iteration, since the widening was confounded
      with a gain change in iteration 4.


      ### Rationale


      The evidence in the race history is consistent. The best raced design is the
      ±0.03 m row at 16 mm with y = 0.04 (iteration 3, score 69.46). Iteration 5 reproduced
      that score exactly, and iteration 6 at kp 1.2 also scored 69.46. Every run still
      ends off track at max error about 0.062 m, against the 0.06 m limit. Body width
      cannot relax that limit inside the allowed range, so the limit is the binding
      failure. Line loss persists at 1.0 to 1.1 events per run on all tracks.


      Iteration 4 widened the row to ±0.04 m and cut kp from 1.2 to 1.0 in the same
      race. Progress fell on the s-bend (0.210 to 0.160) and oval (0.184 to 0.170),
      and line loss did not improve. The Integrator''s current feedback reads that
      as mainly a gain effect, and has restored kp 1.2 and kd 0.4 on the ±0.03 row.
      It asks that this race hold ±0.03 m so the controller is judged on the geometry
      it was tuned for. I am following that request. Changing the row now would confound
      the controller with a geometry change.


      The ±0.04 m row at kp 1.2 is still the one untested geometry question, and it
      is the next test. I am not repeating that test this iteration, because the Integrator
      asked for the hold and the result is already known to be 69.46 on this geometry.
      I am not committing to a forward offset, since slalom oscillation (0.145 to
      0.147) is still below the 0.15 trigger. Expected result: about 69.46, with max
      error near 0.062 m and line loss at 1.0 to 1.1 events per run.


      - [Open this output](iteration-7/entity0/versions/5da2f19edca04a4c9940d26330fe12b5/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-d490388e0564e568/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-1fb1119f78dd3564/payload.json)'
  - id: entity1
    label: Restored best controller
    notes: 'Keeps the ±0.03 m, 16 mm row with the iteration 3 controller (kp 1.2,
      kd 0.4). Iteration 5 reproduced the 69.46 score, so this is a confirmation race
      on the best-supported package.


      ### Rationale


      Iteration 5 reproduced the iteration 3 result (69.46) exactly on the ±0.03 m,
      16 mm, y = 0.04 row with kp 1.2, kd 0.4, base_speed 1.1, ki 0 and last_direction
      line loss. The simulator is deterministic for a given geometry and controller,
      so this controller is the best-supported package. Iteration 4 changed kp to
      1.0 and widened the row to ±0.04 m together, and progress fell on the s-bend
      (0.210 to 0.160) and oval (0.184 to 0.170). Line loss did not fall, so the lower
      gain is the more likely cause. Every run still ends off track near max error
      0.062 m, which is the binding failure, and line loss persists at 1.0 to 1.1
      events per run. In this iteration the Builder''s geometry is the same ±0.03
      m row, so I keep the restored controller unchanged. Changing kd, base_speed
      or the weights now would make this race a new controller test on a platform
      already measured, and the result would be harder to read. The purpose of this
      race is to confirm the restored controller. The next controller test should
      pair with the ±0.04 m row at kp 1.2, which the Builder plans for next iteration.
      I make no claim about how this package will score; the race will show it.


      - [Open this output](iteration-6/entity1/versions/c0adc34e418f46adb8e5a1b29644a30d/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/945396b82f10477f89d589b900cf6a69/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-1fb1119f78dd3564/payload.json)'
  - id: entityR1
    label: Test ±0.04 m at kp 1.2
    notes: 'Asks the Builder to test the wider ±0.04 m row at kp 1.2, which iteration
      4 did not isolate because it also cut kp to 1.0. Adds a 12 mm fallback if line
      loss persists.


      ### Feedback


      Written before this robot races. Iteration 3 (±0.03 m, 16 mm, kp 1.2, kd 0.4)
      scored 69.46, and iteration 5 reproduced it exactly, so this candidate''s geometry
      is the best-supported platform. Iteration 2 to 3 showed that the wider 16 mm
      row needs kp near 1.2 because it shallows the steering slope. Iteration 4 widened
      to ±0.04 m and cut kp to 1.0 in the same race; progress fell on the s-bend (0.210
      to 0.160) and oval (0.184 to 0.170), and line loss stayed at 1.0 per run. So
      the ±0.04 m row has not yet been tested at kp 1.2 on its own. Line loss persists
      at 1.0 to 1.1 events per run on all tracks and max error sits near 0.062 m,
      so the off-track limit is still the binding failure. Your current plan to hold
      ±0.03 m for this race is right. Do not expect a new best score from this candidate.


      ### Requested changes


      - Next iteration, race the ±0.04 m row at 16 mm with y = 0.04 at kp 1.2 and
      kd 0.4, which isolates the widening from the gain change that confounded iteration
      4.

      - If the ±0.04 m row at kp 1.2 still gives line loss of 1.0 or more per run,
      test a 12 mm footprint at the same ±0.04 m spacing, to check whether 16 mm edge
      noise is adding s-bend oscillation (iteration 3 s-bend oscillation was 0.168).

      - Keep y = 0.04 unless slalom steering oscillation reaches 0.15 or more; it
      has stayed at 0.145 to 0.147 across the row tests so far.


      - [Open this output](iteration-6/entityR1/versions/c0adc34e418f46adb8e5a1b29644a30d/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/945396b82f10477f89d589b900cf6a69/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-1fb1119f78dd3564/payload.json)'
