overrides:
  entities:
  - id: entity0
    label: 'Final: hold 12mm ±0.03'
    notes: 'Holds the iteration 10 layout (12 mm sensors at ±0.03 m, y = 0.04), the
      best raced design at 74.80. The 12 mm footprint cut s-bend oscillation from
      0.168 to 0.140, but slalom oscillation rose to 0.246, and I did not move the
      row forward because that change was never tested cleanly and the final race
      is unseen.


      ### Rationale


      This is the final iteration, and the design delivered here races on the unseen
      final track, so the choice is about the most reliable layout rather than another
      experiment. The best raced design is iteration 10: a 12 mm footprint on the
      ±0.03 m row at y = 0.04, which scored 74.80, the best of the run. Its per-track
      results were oval 72.63, s-bend 77.39 and slalom 74.39, with slalom min 55.39.


      The 12 mm footprint answered the open question. S-bend steering oscillation
      fell from 0.168 to 0.140 with progress held at 0.188 to 0.210 and no loss of
      score, which supports the edge-noise hypothesis for 16 mm. The cost is reach:
      the outer sensor now covers offsets only to about 0.0485 m, against 0.0505 m
      at 16 mm. Max error still sits at about 0.062 m on every track, so the 0.06
      m off-track limit remains the binding failure, and body width cannot change
      it within range.


      The slalom is the weak point. Steering oscillation rose to 0.246, above the
      0.15 trigger I set for a forward offset, and line loss averaged 1.95 per run.
      I considered moving the row forward to y = 0.02 or 0.03. I did not, because
      that trigger was written for a single-variable test that has never been run
      cleanly: the only forward-offset comparison (iteration 0 against 1) also changed
      the row width. Moving the sensors now would be an untested change applied to
      the final unseen-track race, where a regression would score directly. The proven
      74.80 layout is the safer delivery.


      I am therefore holding the iteration 10 geometry exactly. This keeps the Integrator''s
      controller, tuned for this layout, on the platform it was built for, and gives
      the final race the best measured floor.


      - [Open this output](iteration-11/entity0/versions/5ecaf480c9da43c9a422665ba519fee3/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-659b4d0a1fdc991a/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-0e5b353f5ac1f056/payload.json)'
  - id: entity1
    label: 'Final robot: hold iter 10'
    notes: 'Complete robot on the best raced layout (12 mm, +/-0.03 m, y = 0.04) with
      the controller that scored 74.80 in iteration 10. Left unchanged because no
      later race can verify an untested fix before the final track.


      ### Rationale


      This is the final iteration, and the package races once on an unseen track with
      no later development race to check it. The Builder''s entity0 holds the iteration
      10 geometry: five 12 mm sensors at x = -0.03 to 0.03 in 0.015 m steps, y = 0.04,
      with wheel_track 0.12, wheel_radius 0.03, body 0.18 x 0.12 and mass 0.7. This
      is the best raced design (74.80), and its per-track results were oval 72.63,
      s-bend 77.39 and slalom 74.39. The controller that produced 74.80 in iteration
      10 was kp 1.2, ki 0, kd 0.4, base_speed 1.1, weights (-1, -0.5, 0, 0.5, 1) and
      last_direction line loss. The simulator is deterministic for a fixed geometry
      and controller, as iterations 3, 5, 6, 7 and 9 showed with identical scores,
      so this package should reproduce 74.80 on the development tracks. The slalom
      steering oscillation of 0.246 and line loss of about 1.95 per run are the open
      risk. I considered a controller-only fix, such as lowering kp or raising kd
      on the slalom. I did not apply it, because nothing I could change has been raced
      on this exact layout and there is no later race to check a regression. Any change
      would reach the unseen track untested. The 74.80 package is the most reliable
      delivery.


      - [Open this output](iteration-11/entity1/versions/4f360632142b48c98b2c5e029891ab3e/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/5ecaf480c9da43c9a422665ba519fee3/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-0e5b353f5ac1f056/payload.json)'
  - id: entityR1
    label: Hold geometry feedback
    notes: 'Advises holding the iteration 10 geometry, citing its 74.80 score and
      the s-bend oscillation drop from 0.168 to 0.140. Notes the slalom oscillation
      (0.246) risk and that a forward offset is untested.


      ### Feedback


      Written before this candidate races. The candidate holds the iteration 10 geometry,
      which is your best raced design at 74.80 (oval 72.63, s-bend 77.39, slalom 74.39).
      I have kept the iteration 10 controller (kp 1.2, kd 0.4, base_speed 1.1) so
      the package matches the layout it was tuned for. The evidence supports holding:
      iteration 10 cut s-bend oscillation from 0.168 to 0.140 while progress stayed
      at 0.19 to 0.21. Max error still sits near 0.062 m on every track (iterations
      0 to 10), so the off-track limit remains the binding failure. This is the final
      iteration, so I cannot test a further geometry change, and I do not expect a
      result from this candidate beyond the 74.80 reference. The forward offset you
      noted is untested and would be an unverified change on the unseen track.


      ### Requested changes


      - Hold the geometry exactly as in iteration 10 (12 mm, x = -0.03 to 0.03 in
      0.015 m steps, y = 0.04). The controller was tuned for this layout, and the
      final unseen-track race has no later iteration to correct a change.

      - If any further iteration were available, test a forward offset of y = 0.03
      at the same row first. Slalom oscillation (0.246) and line loss (1.95 per run)
      were the weakest measured results (iteration 10), and a forward offset is the
      trigger you set for them.


      - [Open this output](iteration-11/entityR1/versions/4f360632142b48c98b2c5e029891ab3e/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/5ecaf480c9da43c9a422665ba519fee3/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-0e5b353f5ac1f056/payload.json)'
