overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor row
    notes: 'Symmetric five-sensor baseline at 0.06 m ahead of the axle, 12 mm footprints,
      0.12 m track and 0.7 kg mass, chosen from the contract because there is no race
      evidence yet. It is intended as a known platform for the Integrator''s first
      controller.


      ### Rationale


      Iteration 0 has no Integration Feedback and no Geometry Race Data, so this is
      a baseline built from the contract rather than from evidence. I chose five sensors
      in a symmetric row across the front of the robot. Five sensors span +/-0.04
      m, which is wider than the 25 mm tape, so the line stays visible across small
      lateral offsets while the 12 mm footprint still fits inside the tape width.
      A forward offset of 0.06 m puts the sensors ahead of the axle so the controller
      sees the line before the wheels reach it, which should help on bends. A wheel
      track of 0.12 m and wheel radius of 0.03 m give a stable turn rate and enough
      ground speed for the 1.5 m/s average needed to finish in 3 s. A mass of 0.7
      kg keeps acceleration high. Body width 0.12 m gives an off-track limit of 0.06
      m (the floor), which leaves room for the line to drift without ending the run
      early. Expected result: completion on the development tracks with few line-loss
      events, with the main risk being oscillation on tight bends if the Integrator
      uses high gain. I have not yet tested whether this spacing is better or worse
      than a narrower or wider row.


      - [Open this output](iteration-0/entity0/versions/30228fa0dc604e9399f071e207486857/payload.json)'
  - id: entity1
    label: Baseline robot package
    notes: 'A runnable package on the Builder''s unchanged baseline geometry, with
      a conservative proportional-derivative controller. No race data exists yet,
      so the gains are first-pass values to be tuned after the first race.


      ### Rationale


      Iteration 0 has no race data, so the controller is a conservative first design
      for the Builder''s symmetric five-sensor baseline. Sensor x-positions are -0.04,
      -0.02, 0, 0.02, 0.04 (positive = left). Weights are set proportional to each
      sensor''s lateral position (-1, -0.5, 0, 0.5, 1). A line to the left of centre
      then gives a positive signal, which steers left, as the contract requires. The
      centre sensor has weight 0, so a centred robot gives signal 0. kp = 2 gives
      a turn of about 1 to 2 for signals near 0.5 to 1, i.e. 350 to 700 PWM of differential,
      which is firm without being violent. ki = 0 avoids integral windup on a 3 s
      run. kd = 0.2 damps the steering and limits oscillation, the main risk the Builder''s
      notes flag. base_speed = 1.6 (PWM about 80 percent) is a moderate speed. It
      should reach the 1.5 m/s average needed without pushing the robot into the off-track
      limit on the sharpest bend. line_loss = last_direction, so the robot keeps turning
      toward the side it last saw the line. Expected result: completion on the development
      tracks with few line-loss events. I have not measured this, so the first race
      will decide whether kp, kd or base_speed need to move.


      - [Open this output](iteration-0/entity1/versions/c3e58e5cb61046fda02793735f8a6e54/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/30228fa0dc604e9399f071e207486857/payload.json)'
  - id: entityR1
    label: Baseline hold and
    notes: 'Asks the Builder to hold the baseline for the first race and sets out
      the geometry changes to try depending on whether line loss or oscillation appears.
      It cites no race results, since none exist yet.


      ### Feedback


      This is iteration 0, so there is no earlier race outcome or race data to cite.
      Nothing below is a measured result for the current geometry. My controller uses
      sensor weights proportional to lateral position (-1, -0.5, 0, 0.5, 1) with a
      moderate speed and a small derivative term, which gives a conventional starting
      point. I have not yet had to compensate for any geometry-specific problem. The
      baseline row spans plus or minus 0.04 m, which I expect to cover the 25 mm tape,
      but that is an expectation, not evidence. For the next iteration, please hold
      the geometry at this baseline so that the first race measures the controller
      on a known platform. Once the race reports its results, the first question is
      whether line loss happens on the bends, which would point to sensor spacing
      or forward offset. The second is whether steering oscillates on the slalom,
      which would point to sensor spacing or sensor size. Please keep sensor_positions
      and wheel_track unchanged until one of those two patterns appears.


      ### Requested changes


      - Hold sensor_positions, sensor_size and wheel_track at the baseline for the
      first race, so the controller is judged on a known platform.

      - If the next race shows line loss on the bends, try a forward offset of y =
      0.08 for the sensors or a narrower row, such as x = plus or minus 0.02, to see
      whether the sensors pick up the line earlier.

      - If the next race shows steering oscillation on the slalom, try a narrower
      row of sensors (plus or minus 0.02 m) with 12 mm footprints, since the line
      then changes less between adjacent sensors.


      - [Open this output](iteration-0/entityR1/versions/c3e58e5cb61046fda02793735f8a6e54/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/30228fa0dc604e9399f071e207486857/payload.json)'
