map:
  id: race-224-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 4 scored 61.49, down from 69.46 at iteration 3. The only geometry
      change was widening the row from ±0.03 m to ±0.04 m at 16 mm. Progress fell
      on the s-bend (0.210 to 0.160) and oval (0.184 to 0.170), and line loss stayed
      at 1.0 events per run on every track. Max error still reached about 0.062 m,
      so the 0.06 m off-track limit remains the binding failure. Two things changed
      together: the row widened and the Integrator lowered kp from 1.2 to 1.0. S-bend
      oscillation fell from 0.168 to 0.142, which fits a lower steering gain, but
      the lower gain also appears to have slowed progress. I cannot separate the geometry
      effect from the gain effect, but the wider row did not produce the line-loss
      improvement I predicted: line loss did not fall below one event per run. Because
      the only geometry that has produced the best score is ±0.03 m at 16 mm, I am
      reverting to that geometry. The reach from that row (about 0.0505 m) is still
      the best measured result. I am not repeating the ±0.04 row until a race isolates
      it at kp 1.2. I did not take the Integrator''s advice to hold the ±0.04 row,
      because its own kp change was part of the candidate and the result is worse.
      Expected result: a score near 69 if the kp 1.2 controller is restored, and no
      change in geometry from the best raced design. I am not committing to a forward
      offset, since slalom oscillation was 0.147 and below the 0.15 trigger.


      - [Open this output](iteration-5/entity0/versions/22b1fa91de9d4c0086200020807b3382/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-9e11f423b3f44938/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-37affa9e669704f3/payload.json)'
  - id: entity1
    label: Restore kp 1.2, ±0.03 row
    notes: 'Reverts to the iteration 3 best design (69.46): ±0.03 m, 16 mm row with
      kp 1.2 and kd 0.4 restored. Iteration 4''s drop to 61.49 is traced mainly to
      the kp 1.0 step, not the wider row.


      ### Rationale


      The best raced result is iteration 3 (69.46): the ±0.03 m row at 16 mm, y =
      0.04, with kp 1.2, kd 0.4, base_speed 1.1, ki 0 and last_direction line loss.
      The Builder''s current geometry is that same row, so I restore the iteration
      3 controller exactly. The race is deterministic per seed and track, so this
      should reproduce about 69.46. That secures the best known score while the Builder
      tests a new geometry. Iteration 4 (61.49) changed kp to 1.0 and widened the
      row to ±0.04 m together. Its progress fell on the s-bend (0.210 to 0.160) and
      oval (0.184 to 0.170), so the lower gain is the likely cause of the drop, not
      the wider row. Line loss stayed at 1.0 to 1.1 events per run and max error stayed
      near 0.062 m on every track, so the 0.06 m off-track limit is still the binding
      failure. I am not testing a new controller value in this race, because that
      would confound the geometry check the Builder has asked for. The Builder''s
      stated rule is that a score below 69 means the geometry is not the cause, so
      holding the controller at the iteration 3 values gives a clean check. Expected
      result: a score close to 69.46, with line loss and max error unchanged from
      iteration 3. I make no claim about the forward offset, because slalom oscillation
      (0.145) is below the 0.15 trigger.


      - [Open this output](iteration-5/entity1/versions/6ce5458db09b47b59b3045acd83e9d42/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/22b1fa91de9d4c0086200020807b3382/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-37affa9e669704f3/payload.json)'
  - id: entityR1
    label: Hold best row, test ±0.04
    notes: 'Asks the Builder to hold the ±0.03 m best design for this race and to
      test the ±0.04 m row only at kp 1.2 next. Line loss and max error evidence from
      iterations 3 and 4 supports this order.


      ### Feedback


      Written before this robot races. Your current candidate is the iteration 3 geometry
      (±0.03 m, 16 mm, y = 0.04), which is the best raced design at 69.46. I have
      restored the iteration 3 controller (kp 1.2, kd 0.4, base_speed 1.1), so this
      race should reproduce about 69.46 and confirms the geometry is not the cause
      of the iteration 4 drop. Iteration 4 (61.49) changed two things at once: the
      row widened to ±0.04 m and kp fell from 1.2 to 1.0. Progress dropped on the
      s-bend (0.210 to 0.160) and oval (0.184 to 0.170), so the lower gain is the
      likely cause, since your iteration 4 wider row gave no line-loss improvement
      (1.0 events per run) and max error stayed near 0.062 m. Do not expect a new
      result from the current candidate, because it repeats iteration 3. Your ±0.04
      m test is still open. It should be run only at kp 1.2, because a wider row gives
      a shallower steering slope and needs the iteration 3 gain. Line loss persists
      at 1.0 to 1.1 events per run on all tracks, so the off-track limit remains the
      binding failure.


      ### Requested changes


      - Hold the ±0.03 m row at 16 mm, y = 0.04, for this race, since it repeats the
      best raced design. If the score is near 69.46, the controller is confirmed.
      Next iteration, race the ±0.04 m, 16 mm row at kp 1.2 with kd 0.4, so the widening
      is tested on its own.

      - If the ±0.04 m row at kp 1.2 still leaves line loss at 1.0 or more per run,
      test a 12 mm footprint at the same ±0.04 m spacing to check whether 16 mm edge
      noise is adding oscillation on the s-bend.

      - Keep y = 0.04 unless slalom oscillation reaches 0.15 or more, which has not
      happened at any row tested so far.


      - [Open this output](iteration-5/entityR1/versions/6ce5458db09b47b59b3045acd83e9d42/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/22b1fa91de9d4c0086200020807b3382/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-37affa9e669704f3/payload.json)'
