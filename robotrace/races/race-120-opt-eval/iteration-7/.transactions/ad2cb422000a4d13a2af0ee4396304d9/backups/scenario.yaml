map:
  id: race-120-opt-eval
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: ki 1.0 integral test
    notes: 'Single-step increase of ki from 0.8 to 1.0 on the iteration 6 design,
      the best raced so far (184.93). Each earlier ki step improved s-bend progress,
      and oscillation stayed under the 0.35 limit. Fallback is ki 0.8 if oscillation
      rises or the score falls.


      ### Rationale


      Evidence: iteration 6 (kp 3.0, ki 0.8, kd 0.5, base_speed 1.6, outer sensors
      at x = ±0.04, sensor_size 0.016, last_direction) is the best raced design at
      184.93, up from 175.70 at ki 0.4. Progress on s-bend rose from 0.40 to 0.45,
      and the oval rose from 0.69 to 0.65 with the finish rate at 0.10 (2/20). Slalom
      progress was 0.1165, marginally below the 0.12 of iteration 5, so the slalom
      is roughly flat. Steering oscillation fell on the oval (0.33 to 0.30) and rose
      only slightly on the s-bend (0.33 to 0.34), still under the 0.35 threshold.
      Max_error is about 0.060 to 0.064 m on every track, so the residual offset is
      still present. The Evaluator''s entityR1 feedback describes the iteration 5
      design with ki 0.8, which is the iteration 6 design already raced, so I treat
      that feedback as stale and rely on the iteration 6 race data (R2A). Earlier
      evidence still holds: higher kp (iteration 4) and wider outer sensors (iteration
      3) both lowered the score, so they stay fixed, and base_speed 1.2 (iteration
      2) cost oval finishes. Change: raise ki from 0.8 to 1.0 with all other fields
      unchanged. This is the next single-variable step on the integral lever, which
      has improved progress on the bends at each step (0.4 to 0.8 gave +9.2). The
      integral is clamped to ±2, which limits windup. Expected result: s-bend progress
      at or above 0.45, slalom progress at or above 0.12, max_error slightly lower,
      and a score at or above 184.93. Watch steering_oscillation on the s-bend: if
      it rises above about 0.35, return ki to 0.8, the iteration 6 fallback with score
      184.93. If the score falls below 184.93 with progress unchanged, keep iteration
      6. Measurements wanted: per-track progress, max_error, steering_oscillation,
      line_loss_events, and completion_time on the oval.


      - [Open this output](iteration-7/entity0/versions/967b589ad58d487cade807bdf8be9a26/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-c8c47df82a261a0c/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-748eaadbc80415e0/payload.json)'
  - id: entityR1
    label: Approve ki 0.8 test
    notes: 'Approved the single-variable test of ki 0.4 to 0.8 on top of the best
      raced design (iteration 5, 175.70). The rise in max_error with low rms_error
      points to a steady offset that integral action could remove, and ki has not
      been tested alone. Feedback sets the next move (ki back to 0.4 if oscillation
      exceeds 0.35) once the race reports.


      ### Feedback


      Written before this candidate has raced, so no result is stated for it. The
      candidate is the iteration 5 design (best raced score 175.70: kp 3.0, kd 0.5,
      base_speed 1.6, outer sensors at x = ±0.04, sensor_size 0.016, last_direction)
      with one change: ki from 0.4 to 0.8. The values are inside the contract limits,
      and the change is a clean single-variable test. Iteration 5 showed that kd 0.5
      raised progress on the bends (s-bend 0.17 to 0.40) at the cost of oval finish
      rate (0.25 to 0.05). Iteration 1 showed that low rms_error (0.023 to 0.027)
      and low steering oscillation (0.15 to 0.33) are consistent with a steady offset
      that integral action could remove. ki has not been tested alone, so this is
      the right next lever. Earlier races rejected wider outer sensors (iteration
      3, 54.87) and higher kp (iteration 4, 108.24), so do not change those. After
      the race, compare against 175.70 and check four things per track: progress on
      s-bend and slalom, max_error, steering_oscillation, and oval finish rate. If
      steering_oscillation rises above about 0.35, integral windup or noise is the
      likely cause, so return ki to 0.4 (iteration 5 value). If the score is at or
      above 175.70 with progress unchanged or higher, keep ki 0.8 and consider a further
      single step such as ki 1.0. If the score falls below 175.70 with progress unchanged,
      keep iteration 5 as the fallback.


      ### Requested changes


      - After the race, if steering_oscillation on the oval or s-bend exceeds about
      0.35, return ki to 0.4 and keep kd 0.5, since iteration 5 showed oscillation
      at 0.33 is close to the limit and extra integral gain adds to it.

      - If the score rises above 175.70 with progress on s-bend and slalom at or above
      iteration 5 levels (0.40 and 0.12), test ki 1.0 with all other fields unchanged,
      to see whether the residual steady offset keeps shrinking.

      - Do not change sensor positions, kp, or base_speed in this step. Iterations
      2, 3 and 4 each showed those moves lowered the score relative to the best design.


      - [Open this output](iteration-6/entityR1/versions/5f57a2d32c9c4ad4a03aa0ce6c80a715/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/313500e772e34823852cbf0c5b352674/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-226e6ac112e36d5b/payload.json)'
