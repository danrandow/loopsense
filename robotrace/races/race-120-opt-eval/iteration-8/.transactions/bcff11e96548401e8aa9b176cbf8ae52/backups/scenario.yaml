map:
  id: race-120-opt-eval
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: ki 1.0 integral test
    notes: 'Single-step increase of ki from 0.8 to 1.0 on the iteration 6 design,
      the best raced so far (184.93). Each earlier ki step improved s-bend progress,
      and oscillation stayed under the 0.35 limit. Fallback is ki 0.8 if oscillation
      rises or the score falls.


      ### Rationale


      Evidence: iteration 6 (kp 3.0, ki 0.8, kd 0.5, base_speed 1.6, outer sensors
      at x = ±0.04, sensor_size 0.016, last_direction) is the best raced design at
      184.93, up from 175.70 at ki 0.4. Progress on s-bend rose from 0.40 to 0.45,
      and the oval rose from 0.69 to 0.65 with the finish rate at 0.10 (2/20). Slalom
      progress was 0.1165, marginally below the 0.12 of iteration 5, so the slalom
      is roughly flat. Steering oscillation fell on the oval (0.33 to 0.30) and rose
      only slightly on the s-bend (0.33 to 0.34), still under the 0.35 threshold.
      Max_error is about 0.060 to 0.064 m on every track, so the residual offset is
      still present. The Evaluator''s entityR1 feedback describes the iteration 5
      design with ki 0.8, which is the iteration 6 design already raced, so I treat
      that feedback as stale and rely on the iteration 6 race data (R2A). Earlier
      evidence still holds: higher kp (iteration 4) and wider outer sensors (iteration
      3) both lowered the score, so they stay fixed, and base_speed 1.2 (iteration
      2) cost oval finishes. Change: raise ki from 0.8 to 1.0 with all other fields
      unchanged. This is the next single-variable step on the integral lever, which
      has improved progress on the bends at each step (0.4 to 0.8 gave +9.2). The
      integral is clamped to ±2, which limits windup. Expected result: s-bend progress
      at or above 0.45, slalom progress at or above 0.12, max_error slightly lower,
      and a score at or above 184.93. Watch steering_oscillation on the s-bend: if
      it rises above about 0.35, return ki to 0.8, the iteration 6 fallback with score
      184.93. If the score falls below 184.93 with progress unchanged, keep iteration
      6. Measurements wanted: per-track progress, max_error, steering_oscillation,
      line_loss_events, and completion_time on the oval.


      - [Open this output](iteration-7/entity0/versions/967b589ad58d487cade807bdf8be9a26/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-c8c47df82a261a0c/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-748eaadbc80415e0/payload.json)'
  - id: entityR1
    label: Approve ki 1.0 test
    notes: 'Approves a single-variable step from the best raced design (iteration
      6, 184.93) to ki 1.0. The prior ki steps (0.4 to 0.8) each raised the score,
      but steering oscillation at 0.337 on the s-bend is close to the 0.35 limit,
      so the feedback sets a fallback to ki 0.8 if it rises.


      ### Feedback


      Written before this candidate has raced, so no result is stated for it. The
      candidate is the iteration 6 design (best raced score 184.93: kp 3.0, ki 0.8,
      kd 0.5, base_speed 1.6, outer sensors at x = ±0.04, sensor_size 0.016, last_direction)
      with one change, ki from 0.8 to 1.0. All values are inside the contract limits,
      and the change is a clean single-variable step on the lever that has helped
      at each prior step. Iteration 6 raised ki from 0.4 to 0.8 and the score rose
      from 175.70 to 184.93, with s-bend progress up from 0.40 to 0.45. Max_error
      stays near 0.06 to 0.064 m on every track, which is consistent with a residual
      steady offset. Earlier evidence still rejects wider outer sensors (iteration
      3, 54.87), higher kp (iteration 4, 108.24), and lower base_speed (iteration
      2, 115.67), so those stay fixed. The main risk is that steering_oscillation
      on the s-bend was 0.337 at ki 0.8, close to the 0.35 limit, so extra integral
      gain could push jitter up. After the race, compare the score against 184.93
      and check progress on s-bend and slalom, max_error, steering_oscillation, line_loss_events,
      and oval completion_time. If steering_oscillation rises above about 0.35 on
      any track, return ki to 0.8 (the iteration 6 fallback). If the score is at or
      above 184.93 with progress unchanged or higher, keep ki 1.0 and consider one
      further step only if oscillation stays clear of the limit. If the score falls
      below 184.93 with progress unchanged, keep iteration 6.


      ### Requested changes


      - After the race, if steering_oscillation on the s-bend or oval exceeds about
      0.35, return ki to 0.8 (the iteration 6 value, score 184.93) and keep kd 0.5,
      since oscillation was already 0.337 on the s-bend at ki 0.8.

      - If the score rises above 184.93 with s-bend progress at or above 0.45 and
      slalom progress at or above 0.12, consider ki 1.2 as the next single step, with
      all other fields unchanged, to see whether the steady offset keeps shrinking.

      - Do not change sensor positions, kp, kd, or base_speed in this step. Iterations
      2, 3, and 4 showed those moves lowered the score relative to the best design,
      and iteration 5 showed kd 0.5 is the current best damping.


      - [Open this output](iteration-7/entityR1/versions/ad2cb422000a4d13a2af0ee4396304d9/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/967b589ad58d487cade807bdf8be9a26/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-748eaadbc80415e0/payload.json)'
