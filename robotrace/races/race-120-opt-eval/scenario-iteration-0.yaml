overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor PD line
    notes: 'First candidate: five 12 mm sensors spaced 20 mm apart, antisymmetric
      weights, kp 2.5, kd 0.15, no integral, base speed 1.6. Chosen from the contract
      ranges with no race data yet, so it is a conservative starting point to measure
      against.


      ### Rationale


      Iteration 0 has no race data or evaluator feedback, so this is a conservative
      baseline built from the contract. Geometry: five sensors spaced 20 mm apart
      across x = -0.04 to +0.04, placed 50 mm ahead of the axle so they read the line
      before the wheels reach it. The 12 mm footprint is wide enough to see the 25
      mm tape from a centred line without saturating. Wheel track 0.12 m and a 0.8
      kg mass keep yaw inertia moderate for stable turning. Controller: antisymmetric
      weights [-2,-1,0,1,2] give a signal that scales with lateral offset. kp=2.5
      gives a moderate steering response (about 875 PWM per unit of signal). kd=0.15
      damps oscillation without amplifying sensor noise. ki=0 avoids integral windup
      on curves. base_speed=1.6 gives about 80 percent PWM, which should cover the
      course in under 3 s (needs about 1.5 m/s average) while leaving headroom for
      turns. line_loss=''last_direction'' makes the robot continue in the direction
      it was last steering when it leaves the tape. Expected result: the baseline
      completes the oval and s-bend, with some oscillation on the slalom. Measurements
      requested below will show whether speed or steering gain is the limiting factor.


      - [Open this output](iteration-0/entity0/versions/859624414b8a447ca20c4c2911bb6e53/payload.json)'
  - id: entityR1
    label: Baseline approved to race
    notes: 'The baseline candidate is valid and nothing is broken, and no earlier
      race exists to justify a revision, so I approve it for the first race. The feedback
      gives conditional tuning steps for speed, oscillation and line loss, to be applied
      after the race data arrives.


      ### Feedback


      Iteration 0 has no race history, so this review rests only on the contract and
      the candidate''s own contents. The geometry and controller are valid and internally
      consistent: five sensors at 20 mm spacing, a 12 mm footprint, antisymmetric
      weights [-2,-1,0,1,2], kp=2.5, kd=0.15, ki=0, and line_loss=''last_direction''.
      Nothing in it is obviously broken, so it is a reasonable first race. The main
      open question is speed, since base_speed=1.6 (about 3276 PWM) must still cover
      roughly 4 to 5 m in under 3 s, which needs about 1.5 m/s average. Battery sag
      and drivetrain lag could make that tight. The other open question is steering,
      since kp=2.5 gives a moderate response and kd=0.15 is a light damper. Once the
      race reports back, check completion_time and progress first. If the run finishes
      but completion_time is near 3 s, raise base_speed. If steering_oscillation is
      high, especially on the slalom, lower kp or raise kd. If line_loss_events is
      above zero, the outer sensors are probably losing the line on sharp bends, so
      consider more weight on the outer sensors or a higher kp. Do not change the
      sensor geometry until the race data says it is needed.


      ### Requested changes


      - If completion_time is close to 3.0 s or the run does not complete: raise base_speed
      in steps of about 0.2, up to 1.8, and check that rms_error and line_loss_events
      do not get worse (baseline values are not yet known).

      - If steering_oscillation is high, especially on the slalom: reduce kp by about
      20 percent, or raise kd from 0.15 toward 0.3, and keep sensor_weights unchanged.

      - If line_loss_events is above zero on sharp bends: increase kp moderately (for
      example to 3.0) or switch line_loss to ''search_left'' or ''search_right'' only
      if the direction of loss is clearly one-sided in the race data.


      - [Open this output](iteration-0/entityR1/versions/13d117522fbe496f8c1dcd0c2d637c56/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/859624414b8a447ca20c4c2911bb6e53/payload.json)'
