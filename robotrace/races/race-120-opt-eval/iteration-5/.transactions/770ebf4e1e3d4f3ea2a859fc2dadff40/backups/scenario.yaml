map:
  id: race-120-opt-eval
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: kd 0.5 on best design
    notes: 'Iteration 1 (best raced, 158.14) with kd raised from 0.3 to 0.5, a single-variable
      test of damping for bend overshoot. Iteration 4 showed that raising kp to 3.5
      lowered the score, so the Evaluator''s approved kp 3.5 candidate was not resubmitted.


      ### Rationale


      Evidence. The best raced design is iteration 1 (score 158.144): kp 3.0, ki 0.4,
      kd 0.3, base_speed 1.6, outer sensors at x = ±0.04, sensor_size 0.016. Every
      later single-variable change lowered the score. Lowering base_speed to 1.2 (iteration
      2) cut oval finishes from 5/20 to 0/20. Widening the outer sensors to ±0.06
      (iteration 3) dropped the score to 54.9 and removed all oval finishes. Raising
      kp to 3.5 (iteration 4) gave 108.2 and cut oval finishes to 1/20. Across all
      raced designs, max_error sits at 0.061 to 0.063 m against the 0.06 m off-track
      limit, steering oscillation is low (0.11 to 0.28), and the s-bend and slalom
      fail at progress 0.09 to 0.17. The failure is therefore drift into bends, not
      jitter, and more proportional authority made it worse.


      Evaluator note. The Evaluator''s approved entityR1 (kp 3.5, outer sensors ±0.04,
      all else as iteration 1) is identical to the iteration 4 design, which has already
      raced and scored 108.24. I am not resubmitting it, because it is a known worse
      design and its feedback predates the iteration 4 result.


      Change. I keep iteration 1 as the base and make one change: kd from 0.3 to 0.5.
      The hypothesis (H4) is that the robot overshoots each bend and then leaves the
      tape on the far side, so more derivative damping should reduce overshoot without
      the extra proportional gain that hurt in iteration 4. Steering oscillation is
      low, so the added damping should not be limited by jitter.


      Expected result. Progress on s-bend and slalom above about 0.2, max_error below
      about 0.06 m, and the oval finish rate at least 0.25. If steering_oscillation
      rises above about 0.35, damping is adding noise and kd should return to 0.3.
      If progress is unchanged, the next test is ki 0.8 (the remaining steady offset)
      or a seven-sensor layout with inner sensors at x = ±0.03.


      - [Open this output](iteration-5/entity0/versions/136f612c9af4452891053e0ab9135df0/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-b7c19c8be58afaf3/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-2a09bd8b2423c411/payload.json)'
  - id: entityR1
    label: Approve kp 3.5, sensors
    notes: 'Approved the iteration 1 design with kp raised from 3.0 to 3.5 and the
      outer sensors reset to ±0.04, because iteration 3 showed ±0.06 sensors hurt
      the oval finishes. The change is a single-variable test near the best raced
      design (158.144), and the telemetry shows max_error about 0.06 m with low oscillation,
      so racing it gives the next critique real evidence.


      ### Feedback


      Written before this candidate has raced. It is the iteration 1 design (best
      raced score 158.144) with two changes: the outer sensors return to x = ±0.04
      (the iteration 1 layout), and kp rises from 3.0 to 3.5. Iteration 3 showed that
      widening the outer sensors to ±0.06 lowered the score to 54.87 and removed all
      oval finishes (5/20 to 0/20), so H2 is rejected and the iteration 1 layout is
      the only one with evidence of oval finishes. kp has not been tested alone, but
      the iteration 1 telemetry shows max_error of about 0.061 to 0.063 m on every
      track with low steering oscillation (0.15 to 0.22), which points to drift on
      bends that a stronger proportional correction could address. The candidate is
      valid: all values are inside the contract ranges, and kp 3.5 is well inside
      the 0 to 20 limit. Its one change from the best raced design is a single-variable
      test, so it is worth racing now to learn whether kp is the lever. Approve it.
      After the race, check progress and max_error on s-bend and slalom, then steering_oscillation
      and line_loss_events. If steering_oscillation rises above about 0.35, the next
      lever is kd (for example 0.5 at kp 3.5) rather than more kp. If progress on
      s-bend and slalom is unchanged or lower than iteration 1 (about 0.17 and 0.11),
      kp is not the main limit, and the next test should be a seven-sensor layout
      that adds x = ±0.04 at a finer pitch, not further gain changes. If the oval
      finish rate rises above 0.25, keep kp 3.5 and tune kd.


      ### Requested changes


      - If steering_oscillation rises above about 0.35 with kp 3.5, keep the iteration
      1 sensor layout and try kd 0.5 at kp 3.5, since iteration 1 showed low oscillation
      (0.15 to 0.22) and so jitter is not yet the limit.

      - If progress on s-bend and slalom stays at or below the iteration 1 levels
      (about 0.17 and 0.11) with max_error still near 0.06 m, do not raise kp further.
      Try a seven-sensor layout that keeps x = ±0.04 and adds inner sensors at a finer
      pitch (for example x = ±0.03), since iteration 3 showed that outer-only widening
      does not help.

      - If the oval finish rate is at least 0.25 and progress on bends rises, keep
      kp 3.5 and hold the other fields, then consider a small base_speed increase
      to about 1.7 only if completion_time stays well under 3.0 s. Do not lower base_speed,
      because iteration 2 showed that 1.2 costs oval finishes.


      - [Open this output](iteration-4/entityR1/versions/6ef8a01001f540afab50e4be422a7abf/payload.json)

