map:
  id: race-192-randow-maps-muted
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Baseline + 8mm sensors
    notes: 'Keeps the best-scoring baseline (356.6) and changes only the sensor footprint
      from 12 mm to 8 mm, to test finer edge resolution on the s-bend and slalom.
      Iterations 1 to 4 showed that changing lead, spread, mass or drivetrain hurt
      the oval, so this isolates one variable.


      ### Rationale


      Race evidence: the iteration-0 baseline (0.6 kg, 0.12 m track, 0.03 m radius,
      five sensors at ±0.024 m on a 12 mm pitch, y=0.05 m, 12 mm footprint) is still
      the best design at 356.6. It finishes the oval 20/20 in about 1.65 s but goes
      off track on the s-bend (progress 0.17) and slalom (progress 0.12). Every change
      since then has hurt. Widening the array and narrowing the track or lightening
      the robot (iterations 1 and 2) cut oval finishes to 17/20 and 15/20. Moving
      the sensors forward to y=0.07 m (iteration 3) collapsed the oval to 0/20. Moving
      them back to y=0.03 m (iteration 4) also collapsed the oval to 0/20 and scored
      only 118.9. So the oval is very sensitive to sensor lead, and y=0.05 m is a
      tight optimum. Iteration 4 also shows that the bend failures were not fixed
      by a shorter lead, so the remaining untested lever on the bends is sensor sensing
      resolution. This iteration therefore returns to the baseline body, drivetrain,
      array spread, pitch and lead exactly, and changes only the sensor footprint
      from 12 mm to 8 mm. Each sensor then sees a smaller patch, so the edge of the
      tape is resolved more sharply and the signal may track the line more precisely
      at the bends. Coverage is not lost: with the 12 mm pitch, the 25 mm tape always
      covers at least one sensor, so gaps between footprints do not drop the sum below
      0.05. Expected result: the oval stays near 20/20 at about 1.65 s, and s-bend
      and slalom progress rises above 0.17 and 0.12. Risk: smaller footprints give
      a more binary, noisier signal, so steering oscillation may rise. If the oval
      falls, the 12 mm footprint stays the better choice and the next test should
      be a larger footprint (16 mm) with the same spread.


      - [Open this output](iteration-5/entity0/versions/4522f049d78e4b6aa82cdb2bc916648b/payload.json)

      - Based on: [entityR2A](iteration-5/entityR2A/versions/carried-13ba5d01b1d28c96/payload.json)'
  - id: entity1
    label: Shorter lead, y=0.03
    notes: 'Baseline geometry and controller with the sensor row moved back from y=0.05
      to y=0.03, so lead is the only change. Chosen because forward lead (y=0.07,
      iteration 3) collapsed the oval to 0/20 while the baseline finished 20/20.


      ### Rationale


      The evidence so far favours the iteration-0 baseline. It is the only design
      that finishes the oval (20/20, 1.65 s, oscillation 0.15). Moving the sensors
      forward to y=0.07 (iteration 3) collapsed the oval to 0/20 off-track at progress
      0.16 and barely moved the bends (s-bend 0.21, slalom 0.12), so forward lead
      is the wrong direction. The Builder''s proposal now moves the sensors back to
      y=0.03 with everything else at baseline. I have no race evidence for y=0.03
      itself, so I keep the controller identical to the baseline (kp 2.5, ki 0.05,
      kd 0.3, base_speed 1.8, weights [2,1,0,-1,-2], last_direction). That keeps the
      geometry change as the only variable and avoids confounding the lead test with
      a controller change. Reduced lead means the signal reacts later, so I do not
      add gain that could overshoot; the oval''s 1.65 s finish leaves time margin
      at 1.8 base_speed. Sensor x positions, pitch and footprint are unchanged from
      the proposal. Expected result is an oval finish rate at or near 20/20 with oscillation
      at or below 0.15. Bend progress is uncertain: lead may help or hurt, and I cannot
      yet tell which.


      - [Open this output](iteration-4/entity1/versions/bafee0edf8e5431da5f0cf9876fd3c7e/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/d3cb9032ab8743799db3e9a1ce6798a7/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-a56450aa165f89b1/payload.json)'
  - id: entityR1
    label: Lead test feedback
    notes: 'Pre-race feedback: the baseline oval finish (20/20, iteration 0) is the
      anchor, and forward lead (iteration 3) hurt it. Requested changes are footprint
      0.016 if bends still fail, widened spread if bends gain, and reverting to y=0.05
      if the oval drops.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Iteration
      0 (baseline, y=0.05) is the only design that finishes the oval, at 20/20 in
      1.65 s with oscillation 0.15. Its bends failed at progress 0.17 (s-bend) and
      0.12 (slalom), with max_error about 0.061 m at the 0.06 m limit. Iteration 3
      (y=0.07) collapsed the oval to 0/20 off-track and barely moved the bends (0.21,
      0.12), so forward lead is harmful. Iterations 1 and 2 (wide array with 0.5 kg
      mass) lost oval finishes too, and the mass effect was never isolated from the
      array. I kept the baseline controller so that only the lead changes. Interpret
      the next race as follows. If the oval finishes at 20/20 and steering oscillation
      is at or below 0.15, lead is not the problem, and the bend failure is likely
      footprint or coverage. If the oval finishes but bends still end at max_error
      near 0.06 with line loss, change sensor_size to 0.016 at the same y=0.03 layout.
      If the oval drops below baseline, shorter lead is also wrong, so return to y=0.05
      and test spread instead.


      ### Requested changes


      - If the oval holds at 20/20 at y=0.03 but the s-bend or slalom still end off-track
      with line_loss_events of 1 or more and max_error near 0.06 m, change sensor_size
      from 0.012 to 0.016 while keeping y=0.03. Iteration 0 showed max_error 0.061
      on both bends at y=0.05, and no run has yet tested footprint size.

      - If bend progress rises clearly above 0.17 and 0.12 while the oval stays at
      20/20, widen x to plus or minus 0.032 m at 16 mm pitch and keep mass at 0.6
      kg. Iteration 1 gave a partial bend gain from the wider array (s-bend 0.24,
      slalom 0.19), but the oval loss in iterations 1 and 2 was confounded with the
      0.5 kg mass.

      - If the oval falls below 20/20 at y=0.03 (for example 18/20 or fewer, with
      oscillation above 0.15), return the sensor row to y=0.05, the baseline that
      finished 20/20 in iteration 0. Iteration 3 showed that moving the row away from
      y=0.05 in either direction costs oval finishes, so the baseline lead may be
      near the optimum.


      - [Open this output](iteration-4/entityR1/versions/bafee0edf8e5431da5f0cf9876fd3c7e/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/d3cb9032ab8743799db3e9a1ce6798a7/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-a56450aa165f89b1/payload.json)'
