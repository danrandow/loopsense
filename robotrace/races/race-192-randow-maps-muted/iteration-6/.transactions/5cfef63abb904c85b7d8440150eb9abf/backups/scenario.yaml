map:
  id: race-192-randow-maps-muted
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: 16 mm sensor footprint
    notes: 'Single-variable change from the best baseline (356.6): sensor footprint
      12 mm to 16 mm, everything else held. This follows the iteration-5 result, where
      the 8 mm footprint collapsed the oval to 0/20, and tests the last untested sensing-resolution
      lever.


      ### Rationale


      Race evidence: the iteration-0 baseline (0.6 kg, 0.12 m track, 0.03 m radius,
      five sensors at ±0.024 m on a 12 mm pitch, y=0.05 m, 12 mm footprint) remains
      the best design at 356.6. It finishes the oval 20/20 in about 1.65 s but leaves
      the track on the s-bend (progress 0.17) and slalom (progress 0.12). Every single
      change since has hurt. Widening the array with a narrower or lighter drivetrain
      (iterations 1 and 2) cut oval finishes to 17/20 and 15/20. Moving the sensors
      to y=0.07 m (iteration 3) and to y=0.03 m (iteration 4) both collapsed the oval
      to 0/20, so lead is a sharp optimum at 0.05 m. Shrinking the footprint to 8
      mm (iteration 5) also collapsed the oval to 0/20 (progress 0.16), with the bends
      barely moving. Geometry levers already tested: spread, track, radius, mass,
      lead and footprint at 8 mm. The one footprint left untested is 16 mm, the option
      my iteration-5 learning named as the next step if 8 mm failed. I therefore keep
      the baseline exactly and change only sensor_size from 0.012 to 0.016 m. At 12
      mm pitch the 16 mm footprints overlap, so the summed reading should stay above
      the 0.05 line-loss threshold and the signal should be smoother than at 8 mm.
      I expect the oval to stay near 20/20 at about 1.65 s, and the s-bend and slalom
      progress to rise above 0.17 and 0.12. If the oval drops again, the 12 mm baseline
      stays the reference, and the next geometry question is whether a small wheel-radius
      or mass change alone (not combined) can help the bends.


      - [Open this output](iteration-6/entity0/versions/bc6f35b0dc27452789b8610e19e42115/payload.json)

      - Based on: [entityR2A](iteration-6/entityR2A/versions/carried-a5a2f171a2cc6762/payload.json)'
  - id: entity1
    label: 16 mm footprint test
    notes: 'Keeps the iteration-0 baseline exactly and changes only sensor_size from
      12 to 16 mm, the last sensing-resolution lever the Builder had not tested. Evidence:
      baseline is the best design (356.6), and the 8 mm footprint collapsed the oval
      to 0/20.


      ### Rationale


      The Builder''s proposal is a single-variable test against the iteration-0 baseline:
      the sensor footprint rises from 12 mm to 16 mm, and every other geometry value
      stays the same. Iteration 0 is still the best design (356.6): it finishes the
      oval 20/20 in about 1.65 s with oscillation 0.15, but leaves the track on the
      s-bend (progress 0.17) and slalom (progress 0.12) at max_error near 0.061 m.
      Every other geometry change has hurt. Moving the row to y=0.07 or y=0.03 collapsed
      the oval to 0/20 (iterations 3 and 4), so y=0.05 is a sharp optimum. The 8 mm
      footprint (iteration 5) also collapsed the oval to 0/20. The 16 mm footprint
      is the last sensing-resolution lever the Builder has not yet tested. At a 12
      mm pitch, 16 mm footprints overlap, so the summed reading should stay above
      the 0.05 line-loss threshold and the signal should be smoother than at 8 mm.
      I therefore keep the iteration-0 controller exactly (kp 2.5, ki 0.05, kd 0.3,
      base_speed 1.8, weights [2, 1, 0, -1, -2], last_direction). Changing the controller
      at the same time would confound the footprint test, and the Builder has asked
      for a clean comparison. The signal scale depends only on the weights and the
      reading-weighted average, so the larger footprint needs no new weights. I expect
      the oval to stay near 20/20 at about 1.65 s, with bend progress possibly rising
      above 0.17 and 0.12. This is untested. Measurements cover all of the Builder''s
      requested signals plus controller_errors and noise_robustness.


      - [Open this output](iteration-6/entity1/versions/e9eae724e9e2465182d8b30638aa6af1/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/bc6f35b0dc27452789b8610e19e42115/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-a5a2f171a2cc6762/payload.json)'
  - id: entityR1
    label: 'Feedback: 16 mm footprint'
    notes: 'Pre-race feedback that states no outcome for the 16 mm candidate. It sets
      next steps by outcome: widen x to 0.032 if the oval holds and bends gain, return
      to 12 mm if the oval drops, and test wheel_track 0.11 if the bends stay unchanged.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Evidence:
      iteration 0 (12 mm footprint, y=0.05, 0.6 kg, 0.12 m track, 0.03 m radius) is
      the best design at 356.6. It finishes the oval 20/20 in 1.65 s, but its s-bend
      (0.17) and slalom (0.12) fail at max_error about 0.061 m. Iterations 3 and 4
      showed that the row is very sensitive to lead: y=0.07 and y=0.03 both collapsed
      the oval to 0/20, so y=0.05 stays fixed. Iteration 5 (8 mm footprint) also collapsed
      the oval to 0/20, with bends barely moving (0.16 oval, 0.28 s-bend). Iterations
      1 and 2 show the wide array alone gives a partial bend gain (s-bend 0.20 to
      0.24) but the oval regresses, and the 0.5 kg mass was never isolated from the
      array. For the controller I kept the iteration-0 baseline unchanged, so no compensation
      was needed and the footprint is the only variable. Decide the next change from
      the race. If the oval holds at 20/20 near 1.65 s and s-bend or slalom progress
      rises above 0.17 or 0.12, keep the 16 mm footprint and test a modest spread
      change. If the oval falls below 20/20 or steering oscillation rises above about
      0.2, return to the 12 mm baseline as the reference. If bend progress is unchanged
      with max_error still near 0.06, footprint and spread are not the bend limit,
      and the next test should be geometry-only on wheel_track.


      ### Requested changes


      - If the oval stays at 20/20 near 1.65 s and s-bend or slalom progress rises
      above 0.17 or 0.12, keep sensor_size 0.016 and widen sensor x to plus or minus
      0.032 m at 16 mm pitch, with mass held at 0.6 kg, wheel_track 0.12 and wheel_radius
      0.03. Iteration 1 and 2 gave a partial bend gain from the wider array (s-bend
      0.17 to 0.24), and the oval loss there is linked to the 0.5 kg mass, not to
      spread alone.

      - If the oval falls below 20/20 or steering_oscillation rises above about 0.2
      (baseline 0.15), return sensor_size to 0.012 with the iteration-0 layout, since
      that is the reference that finished 20/20 at 356.6.

      - If bend progress and max_error are unchanged (s-bend near 0.17, max_error
      near 0.06) with the oval still finishing, change only wheel_track from 0.12
      to 0.11 m and keep sensor_size 0.016. Iteration 1 narrowed the track to 0.10
      m but confounded it with 0.5 kg mass and a larger radius, so the track effect
      has not been isolated.


      - [Open this output](iteration-6/entityR1/versions/e9eae724e9e2465182d8b30638aa6af1/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/bc6f35b0dc27452789b8610e19e42115/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-a5a2f171a2cc6762/payload.json)'
