overrides:
  entities:
  - id: entity0
    label: 'Final: proven baseline'
    notes: 'Reverts to the iteration-0 baseline (0.6 kg, 0.12 m track, 0.03 m radius,
      12 mm sensors at y=0.05 m), which is the only design that finishes the oval
      reliably (20/20, score 356.6, reproduced in iteration 9). The 0.7 kg mass test
      in iteration 10 fell to 6/20 oval finishes, so the hypothesis is refuted and
      the baseline is kept for robustness on the unseen final track.


      ### Rationale


      This is the final iteration, and the unseen-track race is scored on whatever
      design is delivered here, so robustness matters more than a speculative bend
      gain. Across ten races, the iteration-0 baseline (0.6 kg, 0.12 m track, 0.03
      m radius, five sensors at x = 0, ±0.012, ±0.024 m, y = 0.05 m, 12 mm footprint)
      is the only design that finishes any track. It finished 20/20 on the oval at
      about 1.65 s, and iteration 9 reproduced it exactly (score 356.57), so the platform
      is repeatable. The most recent change, mass 0.7 kg (iteration 10), cut oval
      finishes to 6/20 and the score to 204, so the hypothesis that extra mass damps
      oscillation is refuted. Every other single or combined lever (lead at y = 0.03
      and 0.07 m, footprints of 8 and 16 mm, the ±0.032 m array, body length 0.12
      m, and the lighter or narrower drivetrain) either collapsed the oval or reduced
      its finish rate. The s-bend and slalom never progressed beyond about 0.28 and
      0.12 under any geometry, so geometry alone is unlikely to make them complete.
      I therefore deliver the iteration-0 baseline unchanged. I expect the same behaviour
      as iteration 9: a repeatable oval finish and a score near 356, with the unseen
      track the main uncertainty.


      - [Open this output](iteration-11/entity0/versions/dc27931ace064489892e2beb967a0949/payload.json)

      - Based on: [entityR2A](iteration-11/entityR2A/versions/carried-7126cc715baa3281/payload.json)'
  - id: entity1
    label: Final baseline package
    notes: 'Delivers the iteration-0 baseline geometry and controller unchanged, because
      it is the only design that finished the oval repeatedly (20/20, reproduced in
      iteration 9 at 356.57). Every other geometry and mass change tested in iterations
      1 to 10 cut or collapsed the oval.


      ### Rationale


      This is the final iteration, and the unseen-track race is scored on this design,
      so I deliver the proven baseline without speculative changes. Across ten races,
      the iteration-0 geometry is the only one that finishes any track. It finished
      20/20 on the oval at about 1.65 s, and iteration 9 reproduced it exactly (score
      356.57). Every other tested change either collapsed the oval or cut its finish
      rate, including the 0.7 kg mass test (iteration 10, 6/20, score 204). The controller
      is therefore kept exactly as the baseline that the platform was tuned against:
      kp 2.5, ki 0.05, kd 0.3, base_speed 1.8, weights [2, 1, 0, -1, -2], last_direction.
      Changing gains now would be untested on any geometry and could break the one
      stable configuration. Sensor positions, footprint, drivetrain, mass and body
      are all baseline values. The bend failures (s-bend about 0.17 progress, slalom
      about 0.12) have not moved under any geometry tested, so I do not chase them
      here. The measurements requested cover completion, timing, error, line-loss
      and jitter, plus controller_errors and noise_robustness, so the race can be
      checked for exceptions and robustness.


      - [Open this output](iteration-11/entity1/versions/4e96aa8745ae431cbf65bbfa1f3098c2/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/dc27931ace064489892e2beb967a0949/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-7126cc715baa3281/payload.json)'
  - id: entityR1
    label: 'Final feedback: hold'
    notes: 'Written before racing. It asks the Builder to keep the baseline geometry,
      because iterations 1 to 10 showed that each single change cut the oval finish
      rate. It also records that the bend limit looks controller-side, not geometric.


      ### Feedback


      Written before this candidate has raced. The evidence is the baseline (iteration
      0, reproduced in iteration 9): the oval finished 20/20 at about 1.65 s, and
      the s-bend and slalom went off track at progress about 0.17 and 0.12. Every
      change from it has failed. Sensor lead at y = 0.03 and 0.07 m collapsed the
      oval (iterations 3 and 4). Footprints of 8 and 16 mm did too (iterations 5 and
      6). The wider +/-0.032 m array collapsed it at 0.6 kg (iteration 7), which overturns
      the earlier bend-gain reading from iteration 2. Body length 0.12 m collapsed
      it (iteration 8). Mass 0.7 kg cut finishes to 6/20 (iteration 10), which refutes
      the damping idea. The Integrator kept the controller unchanged, so the geometry
      is the only variable. This is the last iteration, so no further race can use
      these requests. They are given for the record: if the unseen track is bend-heavy
      and the oval holds, the bend limit is most likely controller-side and not fixable
      by geometry. Keep the baseline as the reference.


      ### Requested changes


      - Keep sensor_positions at x = 0, +/-0.012, +/-0.024 m with y = 0.05 m, sensor_size
      0.012 m, wheel_track 0.12 m, wheel_radius 0.03 m, body_length 0.16 m and mass
      0.6 kg. Iterations 3 to 10 show that changing any of these alone collapses or
      cuts the oval finish rate.

      - If the next race shows the oval finishing 20/20 at about 1.65 s with a score
      near 356, treat the baseline as robust and make no geometry change, since the
      unseen track is scored on this platform.

      - If the next race shows line loss at the bends with outer sensors near 0 and
      max_error near 0.06 m, record the bend limit as controller-side (kp, kd or base_speed)
      for future work, and do not widen the array, since iterations 1, 2 and 7 showed
      that the spread change cut the oval.


      - [Open this output](iteration-11/entityR1/versions/4e96aa8745ae431cbf65bbfa1f3098c2/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/dc27931ace064489892e2beb967a0949/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-7126cc715baa3281/payload.json)'
