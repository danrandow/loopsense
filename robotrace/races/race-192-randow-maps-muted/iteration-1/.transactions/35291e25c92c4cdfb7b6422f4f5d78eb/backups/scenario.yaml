overrides:
  entities:
  - id: entity0
    label: Wider array, narrower
    notes: 'Widened the sensor array to ±0.032 m, narrowed the wheel track to 0.10
      m, and reduced mass to 0.5 kg. The baseline finished the oval but left the s-bend
      and slalom at progress 0.12 to 0.17 with line loss, which points to the narrow
      array and slow turn response on bends. This change is untested.


      ### Rationale


      The baseline finishes the oval (mean score 950) but goes off track early on
      the s-bend (progress 0.17) and slalom (progress 0.12), each with one line-loss
      event. The failure is on the sharp bends, not a general speed problem. The off-track
      limit is 0.06 m, and the baseline''s outer sensors at ±0.024 m cover only about
      ±0.030 m of centre offset, so once the robot drifts toward the edge of the array
      on a bend it loses the line and cannot recover. Three geometry changes address
      this. (1) Widen the array to ±0.032 m at 16 mm pitch, so the line stays visible
      at larger offsets and line loss needs a bigger error. (2) Reduce wheel_track
      from 0.12 to 0.10 m. For a given wheel-speed difference, the turn rate is that
      difference divided by the track, so a narrower track gives more turn authority
      on tight bends. (3) Reduce mass from 0.6 to 0.5 kg and wheel_radius from 0.03
      to 0.033 m, to lower yaw inertia and raise top speed for the 3 s limit. The
      sensor footprint stays at 12 mm, so the 25 mm tape is still covered continuously,
      with only small gaps between 16 mm pitch sensors. I expect fewer line-loss events
      and a completed or nearly completed s-bend and slalom. This is untested. If
      the slalom still goes off track, the next step is probably the sensor lead (y)
      or the sensor size, not the spread.


      - [Open this output](iteration-1/entity0/versions/1670a2463ce64e0cbd41dfffd9269745/payload.json)

      - Based on: [entityR2A](iteration-1/entityR2A/versions/carried-c1a95fb07b581086/payload.json)'
  - id: entity1
    label: Complete Robot Package
    notes: 'Complete Robot Package. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 0 has no race data, so the controller is derived from the contract
      rather than from measured telemetry. The sensor layout is kept exactly as the
      Builder proposed. Sensor x offsets run +0.024 (left) to -0.024 (right), and
      a positive signal steers left, so weights are set in the same order as the sensors:
      [2, 1, 0, -1, -2]. The signal is then the reading-weighted average of those
      positions, which tracks the line offset directly. With readings near 0 or 1,
      the signal stays within about +/-2. kp = 2.5 gives a moderate steering response:
      a typical 0.3 signal gives turn 0.75, or about 260 PWM of differential. kd =
      0.3 damps the oscillation expected from a 50 mm forward sensor lead. ki = 0.05
      is kept small to avoid integral windup on long bends. base_speed = 1.8 gives
      PWM 3685 (about 90 percent), which targets the 1.5 m/s average needed to finish
      in 3 s while leaving headroom for turns. line_loss is ''last_direction'', so
      the robot searches toward the side it last saw the tape. Measurements requested
      cover completion, timing, error, line loss and jitter, so the Builder can compare
      the baseline against later geometry changes. I expect the oval and s-bend to
      be the most reliable cases, with the slalom as the hardest. This has not been
      tested.


      - [Open this output](iteration-0/entity1/versions/b0294fa480a940368ce02e73dd863004/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/cc14f005d2d34ff08ae93ba4abd5c969/payload.json)'
  - id: entityR1
    label: Integration Feedback
    notes: 'Integration Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Iteration 0 is a baseline with no race evidence, so this feedback is based on
      the contract rather than measured results. For the controller, I had to match
      the sensor weights to the sensor x order because the Builder''s array is symmetric
      about the centre; the outer sensors carry the largest weights, so the signal
      stays bounded at about +/-2. I also had to pick a moderate kp so that a 12 mm
      pitch array does not over-steer when readings sit between 0 and 1. The 50 mm
      forward offset means the signal leads the wheels, so I added a small kd to damp
      the oscillation this lead could cause. The next race will show whether the array
      saturates (readings stuck at 0 or 1) and whether the outer sensors ever see
      the line. If line_loss_events are frequent or max_error nears 0.06 m, widen
      the sensor spread (for example x = +/-0.032) before changing the wheels. If
      the robot completes but completion_time is above 3 s, change the drivetrain
      (wheel_radius or mass) to gain speed. If steering_oscillation is high with no
      line loss, move sensors back toward the axle (y near 0.03) to reduce lead.


      ### Requested changes


      - If line_loss_events > 0 on the s-bend or slalom, widen the sensor spread to
      x = +/-0.032 (keep pitch 16 mm) and keep sensor_size 0.012, since the outer
      pair at +/-0.024 may be missing the tape on offsets near 3 cm.

      - If completion_time exceeds 3 s on the oval with no line loss, reduce mass
      to 0.5 kg and/or wheel_radius to 0.035 to raise top speed; the baseline already
      uses the lowest in-range mass of 0.6 kg being at a usable minimum.

      - If steering_oscillation is high with a completed run, move the sensor row
      back to y = 0.03 to reduce the forward lead, as the 50 mm offset may cause lag
      on tight bends.


      - [Open this output](iteration-0/entityR1/versions/b0294fa480a940368ce02e73dd863004/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/cc14f005d2d34ff08ae93ba4abd5c969/payload.json)'
