map:
  id: race-174-opt-eval
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Offset kept, speed 1.6
    notes: 'Keeps the iteration 6 forward outer-sensor offset (best raced, 173.5)
      and raises base_speed from 1.4 to 1.6 as the only change. The oval finished
      in 2 of 20 runs at 1.4 s, about 1.97 s mean, so extra speed targets completions,
      which dominate the score.


      ### Rationale


      Evidence. Iteration 6 (outer sensors forward to y = 0.05, inner three at y =
      0.03, kd 0.5, kp 3.0, base_speed 1.4, sensor_size 0.012) is the best raced design
      at 173.5, up from 154.1. The oval improved (progress 0.67 to 0.74, mean finish
      time 1.97 s, 2 of 20 finishes against 1 of 20), and the s-bend improved (progress
      0.30 to 0.32). The s-bend line-loss count rose from 1.00 to 1.15, so the forward
      offset did not reduce line loss, but it did not stop progress. The entityR1
      feedback approved the iteration 6 geometry, but it was written against iteration
      1 (154.1), so its ''keep the offset'' rule is now satisfied by the score. Its
      line-loss condition (below 0.9 on the s-bend or slalom) is not met, so the rule
      is only partly applicable. Completions dominate the score (500 points each),
      and the oval is the only track that has finished. Oval finish time at base_speed
      1.4 was about 1.97 s, close to the 3.0 s cap with margin, so speed is the main
      lever for completions.


      Change. Keep the iteration 6 geometry and all controller gains. Raise controller.base_speed
      from 1.4 to 1.6, which is the single variable changed. The rationale is to raise
      the chance of finishing the oval and s-bend within 3.0 s. Expected result: oval
      finish time falls to about 1.6 s with more completions, and progress holds or
      rises on the s-bend and slalom. Risk: a faster robot may leave the track on
      bends (the off-track limit is 0.06 m), so line loss and max_error may rise.
      If runs go off track sooner (progress drops below about 0.3 on the s-bend, or
      oval progress falls below 0.70), revert to base_speed 1.4 and test ki 0.15 next
      to address line loss.


      Hypotheses. (a) Speed 1.6 converts oval near-finishes into completions; the
      oval has about 0.74 progress, so a shorter time may be enough. (b) Line loss
      stays at about 1.0 per run because the cause is turn-in lag rather than sensing
      lead; ki or a line-loss behaviour change is the next lever if speed does not
      help.


      Measurements wanted: completion, progress, completion_time, rms_error, max_error,
      line_loss_events, steering_oscillation and noise_robustness on each track, so
      that the speed effect can be separated from line loss and oscillation.


      - [Open this output](iteration-7/entity0/versions/04014ee3b29143f8895f7ec93d5bd793/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-ca16353cab217ad5/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-8afa375f9f539348/payload.json)'
  - id: entityR1
    label: 'Approve: forward sensor'
    notes: 'Approved the single-variable test of moving the outer sensors to y = 0.05
      from the best raced design (iteration 1, 154.1). Line loss stayed near 1.0 across
      iterations 1 to 5 whatever the spread, footprint or kp, and kd 0.35 (iteration
      5, 89.2) was ruled out, so bend-entry sensing lead is the next lever to race.


      ### Feedback


      Written before this candidate has raced, so it states no result for it. The
      candidate is valid against the contract: sensors at x = -0.04 to +0.04, with
      the outer two at y = 0.05 and the inner three at y = 0.03; sensor_size 0.012;
      kp 3.0; ki 0.05; kd 0.5; base_speed 1.4; weights [-2,-1,0,1,2]; line_loss last_direction.
      Compared with the best raced design (iteration 1, score 154.1), it changes one
      variable, the outer sensors'' forward offset. That is a clean test. Line loss
      has stayed at about 1.0 per run in every raced iteration whatever the spread,
      footprint or kp (iteration 1: 0.95, 1.00, 1.00; iteration 3 with 16 mm: 0.85,
      1.05, 1.00; iteration 4 narrow spread: 1.25, 1.15, 1.05). So the forward offset
      is the untested lever for bend entry. The kd 0.35 test (iteration 5, score 89.2)
      is already on the record. It lowered oscillation but cut oval progress from
      0.67 to 0.41, so kd should stay at 0.5. Iteration 2 (kp 3.5) also showed that
      raising kp lowers the score. Approve now: the candidate is a sound single-variable
      change and the race telemetry is needed to judge the offset.


      What to change after the race, depending on what it shows:

      - If the score is at or above about 150 and line_loss_events falls below about
      0.9 on the s-bend or slalom, keep the forward offset and test base_speed 1.6
      next. Speed was not the limit at 1.4 (oval mean finish 1.93 s).

      - If line loss stays near 1.0 and the score is at or below 154, the cause is
      not sensing lead. Return the outer sensors to y = 0.03 and test ki (0.05 to
      0.15) or the line_loss behaviour next.

      - If steering_oscillation rises above about 0.35 on the oval, revert the outer
      sensors to y = 0.03 before changing gains.


      ### Requested changes


      - Keep the forward offset as the single change from iteration 1: outer sensors
      (x = -0.04 and +0.04) at y = 0.05, inner three at y = 0.03. Read the result
      against 154.1, focusing on line_loss_events on the s-bend and slalom.

      - If line loss stays near 1.0 per run, revert the outer sensors to y = 0.03
      and test controller.ki at about 0.15 (from 0.05), since kp (iteration 2) and
      footprint (iteration 3) did not reduce line loss.

      - If the score is at or above about 150 with line loss below 0.9 on the s-bend
      or slalom, keep the offset and raise controller.base_speed from 1.4 to 1.6 in
      one step, since oval finish time at 1.4 was 1.93 s.


      - [Open this output](iteration-6/entityR1/versions/642ee8f47fb84d5d9108e4a464963570/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/764e76ee19c047ddb90f20359fe27f2e/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-2d01be5a9320061c/payload.json)'
