map:
  id: race-174-opt-eval
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Offset kept, speed 1.6
    notes: 'Keeps the iteration 6 forward outer-sensor offset (best raced, 173.5)
      and raises base_speed from 1.4 to 1.6 as the only change. The oval finished
      in 2 of 20 runs at 1.4 s, about 1.97 s mean, so extra speed targets completions,
      which dominate the score.


      ### Rationale


      Evidence. Iteration 6 (outer sensors forward to y = 0.05, inner three at y =
      0.03, kd 0.5, kp 3.0, base_speed 1.4, sensor_size 0.012) is the best raced design
      at 173.5, up from 154.1. The oval improved (progress 0.67 to 0.74, mean finish
      time 1.97 s, 2 of 20 finishes against 1 of 20), and the s-bend improved (progress
      0.30 to 0.32). The s-bend line-loss count rose from 1.00 to 1.15, so the forward
      offset did not reduce line loss, but it did not stop progress. The entityR1
      feedback approved the iteration 6 geometry, but it was written against iteration
      1 (154.1), so its ''keep the offset'' rule is now satisfied by the score. Its
      line-loss condition (below 0.9 on the s-bend or slalom) is not met, so the rule
      is only partly applicable. Completions dominate the score (500 points each),
      and the oval is the only track that has finished. Oval finish time at base_speed
      1.4 was about 1.97 s, close to the 3.0 s cap with margin, so speed is the main
      lever for completions.


      Change. Keep the iteration 6 geometry and all controller gains. Raise controller.base_speed
      from 1.4 to 1.6, which is the single variable changed. The rationale is to raise
      the chance of finishing the oval and s-bend within 3.0 s. Expected result: oval
      finish time falls to about 1.6 s with more completions, and progress holds or
      rises on the s-bend and slalom. Risk: a faster robot may leave the track on
      bends (the off-track limit is 0.06 m), so line loss and max_error may rise.
      If runs go off track sooner (progress drops below about 0.3 on the s-bend, or
      oval progress falls below 0.70), revert to base_speed 1.4 and test ki 0.15 next
      to address line loss.


      Hypotheses. (a) Speed 1.6 converts oval near-finishes into completions; the
      oval has about 0.74 progress, so a shorter time may be enough. (b) Line loss
      stays at about 1.0 per run because the cause is turn-in lag rather than sensing
      lead; ki or a line-loss behaviour change is the next lever if speed does not
      help.


      Measurements wanted: completion, progress, completion_time, rms_error, max_error,
      line_loss_events, steering_oscillation and noise_robustness on each track, so
      that the speed effect can be separated from line loss and oscillation.


      - [Open this output](iteration-7/entity0/versions/04014ee3b29143f8895f7ec93d5bd793/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-ca16353cab217ad5/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-8afa375f9f539348/payload.json)'
  - id: entityR1
    label: Speed 1.6 test, geometry
    notes: 'Approved the iteration 6 design with base_speed raised from 1.4 to 1.6
      as the only change, because oval finish time at 1.4 was 1.97 s, close enough
      to the 3.0 s cap that speed is the main lever for completions. Feedback sets
      revert and ki rules in case progress drops on the oval or s-bend.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      candidate keeps the iteration 6 geometry (outer sensors at x = ±0.04, y = 0.05;
      inner three at y = 0.03; sensor_size 0.012) and all iteration 6 controller gains
      (kp 3.0, ki 0.05, kd 0.5, weights [-2,-1,0,1,2], line_loss last_direction).
      The only change is base_speed from 1.4 to 1.6. It is valid against the contract.
      Iteration 6 is the best raced design at 173.5, and it finished 2 of 20 oval
      runs with mean oval finish time 1.97 s at base_speed 1.4 (iteration 1: 1.93
      s). Completions carry 500 points each, so the cap of 3.0 s is the main lever.
      Finish time scales roughly with 1/speed, so 1.6 should bring the oval near 1.6
      s, with margin. The risk is that a faster robot leaves the 0.06 m off-track
      limit sooner on bends. Iteration 0 at base_speed 1.6 cannot isolate that risk,
      because it also had a narrow spread and kd 0.3. Line loss has stayed near 1.0
      per run in every raced iteration whatever the spread, footprint, kp or kd, so
      the speed change should be judged mainly by progress and completions, not by
      line loss. Approve now: it is a clean single-variable step from the best design,
      and the race telemetry is needed to see whether speed converts oval near-finishes
      into completions.


      What to change after the race, depending on what it shows:

      - If oval progress falls below about 0.70 (iteration 6: 0.74) or s-bend progress
      falls below about 0.30 (iteration 6: 0.32), the robot is leaving the line too
      early. Revert base_speed to 1.4 and test ki at 0.15 next to address line loss.

      - If oval completions rise and the score exceeds 173.5 with progress held, keep
      base_speed 1.6 and consider a further step to 1.8, since the time term and completions
      both reward speed.

      - If line_loss_events stay at about 1.0 per run with off-track endings at 1.6,
      the cause is turn-in lag rather than speed. Keep 1.6 and test ki 0.15 on the
      same geometry.


      ### Requested changes


      - Keep the iteration 6 geometry and all controller gains. Change only controller.base_speed
      from 1.4 to 1.6, so the result can be read against 173.5. The oval finish time
      at 1.4 was 1.97 s (iteration 6), so 1.6 should bring completions within the
      3.0 s cap.

      - If oval progress falls below about 0.70 or s-bend progress falls below about
      0.30 (iteration 6: 0.74 and 0.32), revert controller.base_speed to 1.4 and test
      controller.ki at 0.15 next, since line loss has stayed near 1.0 through every
      change to geometry and kp.

      - If oval completions rise and the score exceeds 173.5 with progress held, keep
      base_speed 1.6 and try 1.8 in one step in the following iteration, since completion
      (500 points) and the time term both reward speed.


      - [Open this output](iteration-7/entityR1/versions/43dfc1bfaca148e4812e9b938b6c40fc/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/04014ee3b29143f8895f7ec93d5bd793/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-8afa375f9f539348/payload.json)'
