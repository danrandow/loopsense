map:
  id: race-174-opt-eval
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Outer sensors y=0.06
    notes: 'Iteration 7 design with only the outer sensors moved forward to y = 0.06,
      making the change the Evaluator flagged explicit. Based on iteration 6, where
      moving the outer sensors from y 0.03 to 0.05 raised oval progress from 0.67
      to 0.74 and the score from 154 to 173.


      ### Rationale


      Evidence: iteration 7 (outer sensors at y = 0.05, base_speed 1.6, kp 3.0, ki
      0.05, kd 0.5, sensor_size 0.012) is the best raced design at 219.96, with 6
      of 20 oval completions. Iteration 6 showed that moving the outer sensors forward
      from y = 0.03 to 0.05 lifted oval progress from 0.67 to 0.74 and the score from
      154.1 to 173.5. Iteration 8 (base_speed 1.8) fell to 136.1 with every run off
      track, and iteration 9 (ki 0.15) fell to 171.9 with oval progress 0.66, below
      the 0.70 revert threshold. Line loss has stayed near 1.0 per run on every track
      in every raced iteration.


      Change: the one change is the outer sensors'' y, from 0.05 to 0.06 at x = -0.04
      and +0.04. The geometry block now states y = 0.06 explicitly, which fixes the
      mismatch the Evaluator flagged. Inner sensors stay at y = 0.03. Controller stays
      at iteration 7: kp 3.0, ki 0.05, kd 0.5, base_speed 1.6, sensor_size 0.012,
      weights [-2,-1,0,1,2], line_loss last_direction. Body, wheels and mass are unchanged.


      Expected result: oval progress of 0.76 or more and a score above 220, if earlier
      sensing of the tape at bend entry keeps progress rising as it did from y = 0.03
      to 0.05. Risk: the sensors may lead too far and change signal phase, raising
      oscillation or off-track exits.


      Revert rule after the race: if oval progress is below 0.70 or s-bend progress
      is below 0.30, return the outer sensors to y = 0.05 (iteration 7) and use that
      design for the final iteration. If line_loss_events stay near 1.0 with progress
      unchanged, the next lever is a line_loss behaviour change (search_left or search_right),
      not more ki or kp.


      Hypotheses: (a) the outer sensors at y = 0.06 see the tape earlier, so oval
      progress rises further. (b) Line loss stays near 1.0 because it comes from turn-in
      geometry rather than steady offset. Measurements wanted: completion, progress,
      completion_time, rms_error, max_error, line_loss_events, steering_oscillation
      and noise_robustness on each track, so the result reads directly against iteration
      7.


      - [Open this output](iteration-10/entity0/versions/5c8cdadad16944a587dc0cc77d294629/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/990be4026acf402499149bc3611b68b1/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-6d073ec60f95a3bd/payload.json)'
  - id: entityR1
    label: Move outer sensors to y
    notes: 'Revise: the candidate''s geometry still shows y = 0.05 and matches iteration
      7, so the rationale''s y = 0.06 test is not actually in it. Ki stays at 0.05
      because ki 0.15 dropped oval progress to 0.66 (iteration 9), and base speed
      stays 1.6 because 1.8 caused off-track exits (iteration 8).


      ### Feedback


      Judged from iterations 0 to 9 and the candidate''s contents. Nothing here states
      an outcome for this candidate.


      Mismatch to fix first. The rationale says to move the outer sensors from y =
      0.05 to y = 0.06 and keep ki at 0.05, but the geometry block still shows y =
      0.05, and the controller matches iteration 7 exactly (score 219.96). Racing
      it as written would only repeat the best known design and test nothing new.
      The revision must make the y = 0.06 change explicit.


      Evidence behind the change. Iteration 7 (outer sensors y = 0.05, base_speed
      1.6, ki 0.05) is the best raced design at 219.96, with 6 of 20 oval completions.
      Iteration 6 showed that moving the outer sensors forward from y = 0.03 to 0.05
      lifted oval progress from 0.67 to 0.74 and the score from 154.1 to 173.5. Line
      loss stayed near 1.0 per run on every track, so the offset raises progress without
      fixing the loss count. Iteration 9 (ki 0.15) scored 171.9, with oval progress
      0.66, below the 0.70 revert threshold, so ki 0.15 is rejected and ki must stay
      at 0.05. Iteration 8 (base_speed 1.8) scored 136.1 with every run off track,
      so speed stays at 1.6.


      What the revised candidate must hold fixed: kp 3.0, kd 0.5, ki 0.05, base_speed
      1.6, sensor_size 0.012, weights [-2,-1,0,1,2], line_loss last_direction, inner
      sensors at y = 0.03, and outer sensors at x = -0.04 and +0.04. The only change
      is the outer sensors'' y, from 0.05 to 0.06.


      Decision reasoning. Racing this as written would repeat iteration 7, and another
      revision round costs two runs. Revising once is still affordable, leaving three
      action runs including the race, and the Optimizer must make the y = 0.06 change
      explicit. There is one iteration after this one, so the next iteration can bank
      the best verified design.


      After the race, read the result as follows. If oval progress is 0.76 or more
      and the score is above 220, keep y = 0.06 and consider it for the final iteration.
      If oval progress is below 0.70, or s-bend progress is below 0.30, revert the
      outer sensors to y = 0.05 (iteration 7) and use that design for the final iteration.
      If line_loss_events stay at about 1.0 with progress unchanged, the next lever
      is a line_loss behaviour change (search_left or search_right), which has not
      been tested, not more ki or kp.


      ### Requested changes


      - Make the only geometry change explicit: geometry.sensor_positions outer sensors
      (x = -0.04 and +0.04) from y = 0.05 to y = 0.06, inner three (x = -0.02, 0,
      0.02) at y = 0.03. Iteration 6 showed moving the outer sensors from y = 0.03
      to 0.05 lifted oval progress from 0.67 to 0.74 and the score from 154.1 to 173.5.

      - Set controller.ki back to 0.05 and keep base_speed 1.6, kp 3.0, kd 0.5, and
      sensor_size 0.012. Iteration 9 (ki 0.15) gave oval progress 0.66, below the
      0.70 threshold, and iteration 8 (base_speed 1.8) gave 136.1 with all runs off
      track. Both are reverts.

      - Keep the rest of the candidate identical to iteration 7 (score 219.96) so
      the result reads directly against it, and report the same measurements on each
      track, including line_loss_events and steering_oscillation.


      - [Open this output](iteration-10/entityR1/versions/990be4026acf402499149bc3611b68b1/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/3607f3e298874c2f81070161705e91b9/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-6d073ec60f95a3bd/payload.json)'
