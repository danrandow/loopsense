map:
  id: race-174-opt-eval
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Speed 1.6, ki 0.15 test
    notes: 'Reverts base_speed from the failed 1.8 (score 136.1) to the best 1.6 (score
      219.96) and tests ki 0.15 as the only change against iteration 7. The revert
      follows the approved revert rule, which fired on s-bend progress dropping to
      0.236.


      ### Rationale


      Evidence. Iteration 7 (base_speed 1.6, outer sensors at y = 0.05, inner at y
      = 0.03, kd 0.5, kp 3.0, ki 0.05) is the best raced design at 219.96, with 6
      of 20 oval completions. Iteration 8 raised base_speed to 1.8 and scored 136.1.
      Oval completions fell to 0 (progress 0.645), s-bend progress fell to 0.236,
      and slalom progress was 0.114. Every run ended off_track, so speed 1.8 is past
      the point where bends are survivable. Line loss stayed near 1.0 per run on every
      track, as it has in every raced iteration. The approved entityR1 for 1.8 was
      written before it raced, and its own revert rule (s-bend progress below 0.30)
      has now fired. The revert rule also says to test controller.ki at 0.15 next,
      since line loss has stayed near 1.0 through every geometry, kp, kd and speed
      change.


      Change. Revert controller.base_speed to 1.6. Test controller.ki at 0.15 (from
      0.05). Geometry and all other gains are identical to iteration 7, so the result
      reads directly against 219.96 and the only variable changed is ki. The integral
      term is limited to ±2, so with ki 0.15 it adds at most about 0.3 to turn, small
      next to kp*signal, which is why I expect it to be a gentle change rather than
      a destabiliser.


      Hypotheses. (a) A somewhat larger integral term corrects the small steady offset
      that builds on the long bends, so line-loss events fall below about 0.9 per
      run on the s-bend and slalom. (b) If line loss stays at about 1.0, the cause
      is turn-in lag or sensing coverage at bend entry, not steady offset, and the
      next lever is a forward sensor offset further than y = 0.05 or a line_loss behaviour
      change.


      Expected result. Score at or above about 215, with oval completions at 5 or
      more and progress held (oval about 0.76, s-bend about 0.36). Risk: a larger
      integral can overshoot after a bend and raise max_error. Revert rule: if oval
      progress falls below 0.70 or s-bend progress falls below 0.30, return ki to
      0.05 and keep base_speed 1.6.


      Measurements wanted: completion, progress, completion_time, rms_error, max_error,
      line_loss_events, steering_oscillation and noise_robustness on each track, so
      the ki effect on line loss and off-track endings can be separated.


      - [Open this output](iteration-9/entity0/versions/b344e6a993e34042afa76e5ee3844fbb/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-a7a3e10b19746f70/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-ab3c36dd600f6fe1/payload.json)'
  - id: entityR1
    label: Approve ki 0.15 test
    notes: 'Approves the single-variable change ki 0.05 to 0.15 on the best raced
      design (iteration 7, 219.96), since line loss stayed near 1.0 through every
      other lever and ki is the only untested one. Revert rules are set for oval and
      s-bend progress, with next steps for each outcome.


      ### Feedback


      Judged from iterations 0 to 8 and the candidate''s own contents. The candidate
      has not raced, so this states no outcome for it. It is valid against the contract:
      sensor x = -0.04 to +0.04 with the outer two at y = 0.05 and the inner three
      at y = 0.03; sensor_size 0.012; kp 3.0; kd 0.5; base_speed 1.6; weights [-2,-1,0,1,2];
      line_loss last_direction; ki 0.15, inside the 0 to 5 range.


      The candidate is iteration 7 (score 219.96, the best raced design) with one
      variable changed, controller.ki from 0.05 to 0.15. The change is clean, and
      the revert rule in the rationale is consistent with the record. Iteration 8
      (base_speed 1.8) fell to 136.1, and its runs all ended off_track, so the revert
      to 1.6 is correct. Line loss has stayed near 1.0 per run on every track in every
      raced iteration (iteration 7: 0.85, 1.00, 1.00), whatever the spread, footprint,
      kp, kd or forward offset. The integral term is the one controller lever not
      yet tested, so this is the right next single change, not another kp or kd step.
      The integral term is clamped to ±2, so at ki 0.15 it is a small correction,
      and the candidate''s reasoning about that is sound.


      The risk is that a larger integral overshoots after a bend and raises max_error
      or off-track endings. Because the revert rule is explicit, a result that breaks
      it can be undone in one step. Approve now: this is the best-supported untested
      variable, it leaves the score-driving geometry and speed unchanged, and the
      race telemetry will show whether line loss responds to ki.


      What to change after the race, depending on the result:

      - If oval progress falls below about 0.70 or s-bend progress falls below about
      0.30, return controller.ki to 0.05 and keep base_speed 1.6, as the rationale
      says.

      - If line_loss_events fall below about 0.9 on the s-bend or slalom and progress
      holds, try ki 0.3 in one step next, since the integral lever is working.

      - If line loss stays at about 1.0 with ki 0.15, ki is not the cause. The next
      lever is a further forward sensor offset on the outer sensors (y above 0.05,
      for example 0.06) or a line_loss behaviour change (search_left or search_right),
      not more ki or kp.


      ### Requested changes


      - Race controller.ki at 0.15 with every other field equal to iteration 7 (score
      219.96). Line loss has stayed near 1.0 through every geometry, kp, kd, footprint,
      offset and speed change, and ki is the only untested controller lever.

      - If oval progress falls below about 0.70 or s-bend progress falls below about
      0.30 (iteration 7: 0.76 and 0.36), return controller.ki to 0.05 and keep base_speed
      1.6. Iteration 8 showed that 1.8 causes off-track exits.

      - If line loss falls below about 0.9 per run on the s-bend or slalom with progress
      held, try controller.ki at 0.3 next. If line loss stays at about 1.0, move to
      a further outer-sensor forward offset (y 0.06) or a line_loss behaviour change
      rather than more ki.


      - [Open this output](iteration-9/entityR1/versions/a110acbe8f984a769cff4fb8ea1aa971/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/b344e6a993e34042afa76e5ee3844fbb/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-ab3c36dd600f6fe1/payload.json)'
