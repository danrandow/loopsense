map:
  id: race-174-opt-eval
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: 16mm sensors, kp 3.0
    notes: 'Reverts kp to 3.0 from the iteration 2 kp 3.5 run, which scored lower
      (125.8 vs 154.1), and enlarges sensor footprints from 12 mm to 16 mm to test
      whether line loss (about 1 per run) is caused by gaps between sensors. Only
      sensor_size changes from the best raced design.


      ### Rationale


      Evidence: iteration 2 (kp 3.5) scored 125.8, below iteration 1 (kp 3.0) at 154.1.
      Progress fell on every track (oval 0.67 to 0.58, s-bend 0.30 to 0.25, slalom
      0.08 to 0.08), and line_loss_events stayed at about 1.0 per run on all three
      tracks. Raising kp did not reduce line loss, so the ''raise kp to 4.0'' rule
      in the Evaluator feedback is not supported. The oval finish in iteration 1 was
      a single lucky run (1 of 20), and the iteration 2 mean dropped on all tracks,
      so kp 3.5 looks slightly worse, not better.


      Hypothesis: line loss is structural. With 12 mm footprints on a 20 mm pitch,
      the outer sensors often sit off the tape when the robot drifts, so the summed
      reading falls below 0.05 and the robot goes blind. Enlarging the footprint to
      16 mm, which closes the 8 mm gaps between footprints, should keep at least one
      sensor on the tape through drift and reduce line-loss events.


      Change: start from the best raced design (iteration 1) and change only sensor_size,
      from 0.012 to 0.016. kp returns to 3.0 because the iteration 2 result did not
      support 3.5. kd stays at 0.5, base_speed at 1.4, and the sensor positions, weights
      and line_loss mode are unchanged. Expected result: line_loss_events below about
      0.5 per run, more progress on the s-bend and slalom, and a higher score than
      154. Risk: a larger footprint averages the signal over more tape and may blunt
      steering sharpness at the bends. If oscillation stays around 0.3 or line loss
      persists, the next step is kd 0.3 to 0.4 or a 16 mm footprint with a narrower
      sensor spread.


      Measurements wanted: per-track line_loss_events, completion, progress, completion_time,
      max_error, rms_error and steering_oscillation, so I can separate the footprint
      effect from the controller effect.


      - [Open this output](iteration-3/entity0/versions/c96db495a4db4a6d9bcd377717547fbb/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-c47a358800ea48c9/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-0e76a1a580baa1dd/payload.json)'
  - id: entityR1
    label: 'Revise: match 16mm'
    notes: 'The candidate''s fields (sensor_size 0.012, kp 3.5) contradict its rationale
      (16 mm, kp 3.0), and the 0.012/3.5 design already scored 125.8 in iteration
      2. Revision is required so the race tests the footprint change against the iteration
      1 baseline (154.1).


      ### Feedback


      Judged from the earlier races and the candidate''s own contents, not from any
      race of this candidate. The rationale proposes the single-variable change from
      the best raced design (iteration 1, score 154.1): sensor_size 0.012 to 0.016,
      with kp 3.0, kd 0.5 and base_speed 1.4 kept. That hypothesis is reasonable.
      Line loss was about 1.0 event per run on every track in iterations 1 and 2 (0.95
      to 1.00 on the oval, s-bend and slalom), and raising kp to 3.5 in iteration
      2 did not reduce it and lowered the score to 125.8. The line-loss mechanism
      looks geometric, so a larger footprint is a fair test. However, the candidate
      block I was given does not match its own rationale. It still shows sensor_size
      0.012 and kp 3.5, which is the iteration 2 design that scored 125.8. If that
      block is raced as written, the result tests nothing new and repeats a known
      loser. Before this races, the design must match the stated change exactly: sensor_size
      0.016, kp 3.0, kd 0.5, base_speed 1.4, with geometry positions x = -0.04, -0.02,
      0.0, 0.02, 0.04 at y = 0.03, weights [-2,-1,0,1,2] and line_loss last_direction
      unchanged. Once that is fixed, the next race should be read as follows. If line_loss_events
      falls to about 0.5 or below per run and progress rises on the s-bend or slalom,
      keep sensor_size 0.016 and adjust kd next. If line loss stays near 1.0, the
      footprint is not the cause, so return to sensor_size 0.012 and try a narrower
      spread or kd 0.3 to 0.4. If oscillation rises well above 0.3 on the oval, lower
      kd before changing anything else. Keep the controller otherwise fixed so the
      footprint effect is clean.


      ### Requested changes


      - Make the candidate match its rationale: geometry.sensor_size 0.012 to 0.016,
      controller.kp 3.5 to 3.0, all other fields as in iteration 1 (kd 0.5, base_speed
      1.4, weights [-2,-1,0,1,2], line_loss last_direction). Iteration 2 at kp 3.5
      scored 125.8, below iteration 1 at 154.1.

      - After the race, if line_loss_events is at or below about 0.5 per run and progress
      rises on the s-bend or slalom, keep sensor_size 0.016 and test kd 0.3 to 0.4
      next, since oscillation was 0.11 to 0.30 in iteration 1.

      - If line_loss_events stays near 1.0 per run with the 16 mm footprint, the footprint
      is not the cause. Return to sensor_size 0.012 and try a narrower spread (x =
      -0.03 to +0.03) before touching kp again.


      - [Open this output](iteration-3/entityR1/versions/b44c1c8507ee41b380bbd29c225c3096/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/c96db495a4db4a6d9bcd377717547fbb/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-0e76a1a580baa1dd/payload.json)'
