map:
  id: race-174-opt-eval
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: kp 3.5, wider sensors
    notes: 'Raises kp from 3.0 to 3.5 to cut the roughly one line-loss event per run
      that ended every race off track, keeping the wider ±0.04 m sensor spread and
      base_speed 1.4 unchanged. Iteration 1 evidence: the oval finished once (mean
      1.93 s), and line loss was still 0.95 to 1.00 per run, which matches the Evaluator''s
      kp rule.


      ### Rationale


      Evidence from iteration 1 (score 154.1, up from 117.2). The wider sensor spread
      (x = -0.04..+0.04) helped: the oval finished in 1 of 20 trials, and progress
      rose on every track (oval 0.60 to 0.67, s-bend 0.15 to 0.30, slalom 0.10 to
      0.08, the slalom being the exception). Line loss is still about 1 event per
      run on every track (0.95, 1.00, 1.00), and every run still ended off_track.
      That is the failure mode Evaluator feedback named: tracking loss on bends, not
      jitter. Steering oscillation is 0.11 to 0.30, so the controller is not unstable,
      but it is under-correcting. The oval mean finish time of 1.93 s shows base_speed
      1.4 is fast enough to finish within 3 s, so speed is not the limit. The change:
      raise kp from 3.0 to 3.5, as the feedback''s first rule prescribes (line loss
      above 0.5 per run with off_track endings). This gives a firmer correction when
      the signal drifts toward the tape edge. Geometry is kept fixed so the effect
      of the controller change can be read cleanly, and kd stays at 0.5 to damp the
      stronger response. Expected result: line_loss_events falling toward 0.5 or below,
      more finishes on the oval, and s-bend progress above 0.3. Risk: kp 3.5 with
      kd 0.5 could raise steering oscillation above the 0.30 seen on the oval; if
      it does, the next step is kd 0.3 to 0.4 rather than a wider array. Hypotheses
      to check next: (a) line loss is driven by the first bend turn-in, so the per-track
      line_loss_events should drop as kp rises; (b) slalom fails because the alternating
      signal sweeps past the sensor array, so it may need a higher kd or a 16 mm sensor
      footprint later. Measurements wanted: completion, progress, completion_time,
      max_error, rms_error, line_loss_events and steering_oscillation on each track,
      plus noise_robustness to check margin against the 0.06 m limit.


      - [Open this output](iteration-2/entity0/versions/c63e5a78826048ada27e051db5f7758d/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-23a550d57b4efa23/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-aad34996374c7b67/payload.json)'
  - id: entityR1
    label: Approve kp 3.5 candidate
    notes: 'Approved the single-variable change kp 3.0 to 3.5, which follows the iteration
      1 rule for line loss of about 0.95 per run with off_track endings. Geometry,
      kd and base_speed are unchanged, so the race isolates the controller effect
      against the best raced score of 154.1.


      ### Feedback


      Judged from the iteration 1 race and the candidate''s own contents, not from
      any race of this candidate. Iteration 1 widened the sensor spread to x = -0.04..+0.04
      and cut base_speed to 1.4. It improved the score from 117.2 to 154.1, and the
      oval finished once in 20 trials. Every run still ended off_track, with line_loss_events
      of 0.95, 1.00 and 1.00 on the oval, s-bend and slalom. Steering oscillation
      ran 0.11 to 0.30, so the controller is under-correcting rather than jittering.
      This candidate changes only kp, from 3.0 to 3.5. That matches the first rule
      in the iteration 1 feedback (line loss above about 0.5 per run with off_track
      endings), and geometry, base_speed, kd and line_loss are unchanged. The candidate
      is valid against the contract and nothing in it looks broken. It is early exploration
      with nine iterations after this one, and a single-variable change from the best
      raced design is the cleanest way to read the effect of kp. Approving it now
      gives telemetry that will sharpen the next critique.


      What to change after the race, depending on what it shows:

      - If line_loss_events is still at or above about 0.5 per run and runs still
      end off_track, raise kp to about 4.0 in one step, keeping kd at 0.5.

      - If steering_oscillation rises above about 0.30 on the oval, or the run starts
      to weave, lower kd to 0.3 to 0.4 before changing kp again. Do not widen the
      sensor array as the first fix.

      - If a run completes but completion_time is above about 2.8 s with low oscillation,
      raise base_speed by 0.2 (1.4 to 1.6). The 1.6 baseline failed on tracking, not
      speed, so only raise it once line loss is under control.

      - The slalom still has progress near 0.08. Hypothesis (b) is that the alternating
      signal sweeps past the sensor array. Test kd first. Leave the 16 mm footprint
      for a later iteration.


      ### Requested changes


      - If line_loss_events stays at or above about 0.5 per run with off_track endings,
      raise controller.kp from 3.5 to about 4.0 with controller.kd held at 0.5. The
      iteration 1 line loss (0.95 to 1.00 per run) is the main limit.

      - If steering_oscillation rises above about 0.30 on the oval, lower controller.kd
      to 0.3 to 0.4 before changing kp again. Keep the sensor geometry fixed, as iteration
      1 showed the wider array helped progress.

      - If the run completes with completion_time above about 2.8 s and low oscillation,
      raise controller.base_speed from 1.4 to 1.6 in one step. Only do this once line_loss_events
      is near 0.5 or lower, because the iteration 0 baseline at 1.6 failed on tracking.


      - [Open this output](iteration-2/entityR1/versions/54a6671459af47d79d04a036ca1139df/payload.json)

