map:
  id: race-174-opt-eval
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Outer sensors y=0.06
    notes: 'Iteration 7 design with only the outer sensors moved forward to y = 0.06,
      making the change the Evaluator flagged explicit. Based on iteration 6, where
      moving the outer sensors from y 0.03 to 0.05 raised oval progress from 0.67
      to 0.74 and the score from 154 to 173.


      ### Rationale


      Evidence: iteration 7 (outer sensors at y = 0.05, base_speed 1.6, kp 3.0, ki
      0.05, kd 0.5, sensor_size 0.012) is the best raced design at 219.96, with 6
      of 20 oval completions. Iteration 6 showed that moving the outer sensors forward
      from y = 0.03 to 0.05 lifted oval progress from 0.67 to 0.74 and the score from
      154.1 to 173.5. Iteration 8 (base_speed 1.8) fell to 136.1 with every run off
      track, and iteration 9 (ki 0.15) fell to 171.9 with oval progress 0.66, below
      the 0.70 revert threshold. Line loss has stayed near 1.0 per run on every track
      in every raced iteration.


      Change: the one change is the outer sensors'' y, from 0.05 to 0.06 at x = -0.04
      and +0.04. The geometry block now states y = 0.06 explicitly, which fixes the
      mismatch the Evaluator flagged. Inner sensors stay at y = 0.03. Controller stays
      at iteration 7: kp 3.0, ki 0.05, kd 0.5, base_speed 1.6, sensor_size 0.012,
      weights [-2,-1,0,1,2], line_loss last_direction. Body, wheels and mass are unchanged.


      Expected result: oval progress of 0.76 or more and a score above 220, if earlier
      sensing of the tape at bend entry keeps progress rising as it did from y = 0.03
      to 0.05. Risk: the sensors may lead too far and change signal phase, raising
      oscillation or off-track exits.


      Revert rule after the race: if oval progress is below 0.70 or s-bend progress
      is below 0.30, return the outer sensors to y = 0.05 (iteration 7) and use that
      design for the final iteration. If line_loss_events stay near 1.0 with progress
      unchanged, the next lever is a line_loss behaviour change (search_left or search_right),
      not more ki or kp.


      Hypotheses: (a) the outer sensors at y = 0.06 see the tape earlier, so oval
      progress rises further. (b) Line loss stays near 1.0 because it comes from turn-in
      geometry rather than steady offset. Measurements wanted: completion, progress,
      completion_time, rms_error, max_error, line_loss_events, steering_oscillation
      and noise_robustness on each track, so the result reads directly against iteration
      7.


      - [Open this output](iteration-10/entity0/versions/5c8cdadad16944a587dc0cc77d294629/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/990be4026acf402499149bc3611b68b1/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-6d073ec60f95a3bd/payload.json)'
  - id: entityR1
    label: 'Approve: outer sensors'
    notes: 'Approved a single-variable step from the best raced design (iteration
      7, 219.96): outer sensors forward from y 0.05 to 0.06. The forward move from
      0.03 to 0.05 raised oval progress (iteration 6), while ki 0.15 (iteration 9)
      and speed 1.8 (iteration 8) both lost ground, so the controller stays put. Revert
      rules are set for the final iteration.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      candidate is iteration 7 (score 219.96, the best raced design) with one change:
      the outer sensors move from y = 0.05 to y = 0.06 at x = -0.04 and +0.04. The
      geometry block states y = 0.06 explicitly. Controller gains and speed are unchanged
      from iteration 7: kp 3.0, ki 0.05, kd 0.5, base_speed 1.6, weights [-2,-1,0,1,2],
      line_loss last_direction. The candidate is valid against the contract.


      The evidence for a further forward step is the earlier move from y = 0.03 to
      y = 0.05, which lifted oval progress from 0.67 to 0.74 (iteration 1 to iteration
      6). Iteration 9 (ki 0.15) fell to 171.9 with oval progress 0.66, below the 0.70
      threshold, so ki stays at 0.05. Iteration 8 (base_speed 1.8) fell to 136.1 with
      every run off track, so speed stays at 1.6. Line loss has stayed near 1.0 per
      run on every track in every raced iteration, and no lever so far has moved it.
      Iteration 6 showed the outer sensors can move forward without a loss of progress,
      so the y = 0.06 step is a reasonable test of the same effect. It is a single-variable
      change from the best design, and this is the second-last iteration, so the telemetry
      is needed for the final design.


      What to do after the race, depending on the result:

      - If oval progress is below 0.70 or s-bend progress is below 0.30, return the
      outer sensors to y = 0.05 (iteration 7). Use that design for the final iteration.

      - If progress holds or rises and completions rise, keep y = 0.06 and consider
      a small further move (y = 0.07) only if s-bend progress also holds.

      - If steering_oscillation rises well above the 0.35 seen on the oval in iteration
      7, return to y = 0.05 before changing any gain.

      - If line_loss_events stay near 1.0 with progress unchanged, the next lever
      is a line_loss behaviour change (search_left or search_right), not more ki or
      kp.


      ### Requested changes


      - Keep the iteration 7 controller (kp 3.0, ki 0.05, kd 0.5, base_speed 1.6,
      line_loss last_direction) and change only the outer sensors'' y from 0.05 to
      0.06 at x = -0.04 and +0.04, as iteration 6 (y 0.03 to 0.05) showed forward
      sensing lifted oval progress from 0.67 to 0.74.

      - If oval progress falls below 0.70 or s-bend progress falls below 0.30 after
      the race, revert the outer sensors to y = 0.05 (iteration 7). Keep ki at 0.05,
      since iteration 9 (ki 0.15) dropped progress to 0.66 on the oval.

      - If line_loss_events stay near 1.0 per run with progress unchanged, test controller.line_loss
      = search_left or search_right in the final iteration instead of more ki or kp.
      Iterations 2, 5 and 9 showed kp, kd and ki changes did not reduce line loss.


      - [Open this output](iteration-10/entityR1/versions/04f31bb889ff4621819bce635da0d15c/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/5c8cdadad16944a587dc0cc77d294629/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-6d073ec60f95a3bd/payload.json)'
