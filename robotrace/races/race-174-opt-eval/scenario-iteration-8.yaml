map:
  id: race-174-opt-eval
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Speed step to 1.8
    notes: 'Keeps the iteration 7 design, the best raced at 219.96, and changes only
      base_speed from 1.6 to 1.8. Oval completions rose from 2 to 6 of 20 at 1.6 with
      progress held, which meets the Evaluator''s rule for a further speed step. A
      revert to 1.6 is set if oval or s-bend progress drops below its threshold.


      ### Rationale


      Evidence. Iteration 7 (base_speed 1.6, with the iteration 6 geometry and gains)
      is the best raced design at 219.96, up from 173.5. The oval finished 6 of 20
      runs, against 2 of 20 at base_speed 1.4. Oval progress rose from 0.74 to 0.76,
      and s-bend progress rose from 0.32 to 0.36. Speed is therefore converting oval
      near-finishes into completions, and completions carry 500 points each. Line
      loss stayed at about 1.0 per run on every track, as in every raced iteration,
      so the speed change did not make line loss worse. The oval mean finish time
      (1.975 s) did not fall as 1/speed would predict, but the time term is worth
      at most 60 points, so completions dominate the score.


      The Evaluator''s stated rule for this case is: if oval completions rise and
      the score exceeds 173.5 with progress held, keep base_speed and try a further
      step to 1.8 in one step. Both conditions are met (score 219.96, oval completions
      6, progress held or rising). The entityR1 approval of the 1.6 design was written
      before it raced, so it is treated as background only.


      Change. Raise controller.base_speed from 1.6 to 1.8. This is the only change.
      Geometry (outer sensors at x = ±0.04, y = 0.05; inner three at y = 0.03; sensor_size
      0.012) and all gains (kp 3.0, ki 0.05, kd 0.5, weights [-2,-1,0,1,2], line_loss
      last_direction) are kept, so the result reads cleanly against 219.96.


      Expected result. More oval completions (target 8 or more of 20) and a score
      above 220. Risk: a faster robot leaves the 0.06 m off-track limit sooner on
      the s-bend and slalom, so s-bend progress may fall below its current 0.36. Revert
      rule: if oval progress falls below about 0.70 or s-bend progress falls below
      about 0.30, return base_speed to 1.6 and test controller.ki at 0.15 to address
      line loss.


      Hypotheses. (a) Speed 1.8 gives more oval completions, because the finish-time
      margin under the 3.0 s cap is still limited. (b) Line loss stays near 1.0 whatever
      the speed, so turn-in lag, not speed, is the cause of off-track endings on the
      s-bend and slalom. Measurements wanted: completion, completion_time, progress,
      max_error, line_loss_events, steering_oscillation and noise_robustness on each
      track, to see whether the off-track limit becomes the binding constraint at
      this speed.


      - [Open this output](iteration-8/entity0/versions/fb66c70e767c4df392a8ed9da20944e3/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-83b9af629222cc2c/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-4fb9124f2e6bf100/payload.json)'
  - id: entityR1
    label: Approve base_speed 1.8
    notes: 'Single-variable step from the best raced design (iteration 7, 219.96):
      base_speed 1.6 to 1.8, with geometry and gains unchanged. Iteration 7 raised
      oval completions from 2 to 6 of 20 and the score from 173.5 to 220, meeting
      the earlier rule for one further speed step; the off-track risk on the s-bend
      is named with a revert rule.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      candidate keeps the iteration 7 design (score 219.96, the best raced so far)
      and changes one field: controller.base_speed from 1.6 to 1.8. Geometry (outer
      sensors at x = ±0.04, y = 0.05; inner three at y = 0.03; sensor_size 0.012)
      and all gains (kp 3.0, ki 0.05, kd 0.5, weights [-2,-1,0,1,2], line_loss last_direction)
      are unchanged. It is valid against the contract.


      The evidence behind the step: raising base_speed from 1.4 to 1.6 (iteration
      7) lifted the score from 173.5 to 219.96. Oval completions rose from 2 of 20
      to 6 of 20, oval progress rose from 0.74 to 0.76, and s-bend progress rose from
      0.32 to 0.36. Line loss stayed at about 1.0 per run on every track, as in every
      raced iteration, so speed did not worsen it. The condition in the earlier rule
      (completions rising with score above 173.5 and progress held) is met, so one
      further step is justified.


      Risks to read in the race. A faster robot reaches the 0.06 m off-track limit
      sooner on bends. The s-bend and slalom are the tracks most exposed: s-bend progress
      is the one most likely to fall, and slalom progress (about 0.08) is already
      very low and is not expected to be limited by speed. Line loss is still the
      unresolved fault, and it has not responded to kp, kd, footprint or spread.


      What to do after the race, depending on the result:

      - If oval progress falls below about 0.70 or s-bend progress falls below about
      0.30, speed is now causing early exits. Revert base_speed to 1.6 and test controller.ki
      at 0.15 next.

      - If oval completions reach 8 or more and the score exceeds 220 with s-bend
      progress held, keep 1.8 and consider a small further step (1.9) in a later iteration
      only.

      - If completions do not rise but progress holds, speed is not the binding limit
      at this point; keep 1.8 and move to the line-loss lever (ki) rather than speed.


      ### Requested changes


      - Keep the iteration 7 geometry and all gains; change only controller.base_speed
      from 1.6 to 1.8 so the result reads cleanly against 219.96.

      - If oval progress falls below about 0.70 or s-bend progress falls below about
      0.30 (iteration 7: 0.76 and 0.36), revert controller.base_speed to 1.6 and test
      controller.ki at 0.15, since line loss has stayed near 1.0 through every geometry
      and kp/kd change.

      - If oval completions reach 8 or more and the score exceeds 220, keep base_speed
      1.8; a further step to 1.9 may be tried in a later iteration only if s-bend
      progress is held.


      - [Open this output](iteration-8/entityR1/versions/f22595563afa4de1b9a81bbf31dac9db/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/fb66c70e767c4df392a8ed9da20944e3/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-4fb9124f2e6bf100/payload.json)'
