  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Stiffer steer, slower
    notes: 'Raised kp from 4.0 to 4.5 and lowered base_speed from 1.5 to 1.4 to cut
      slalom off-track exits (max_error about 0.064, above the 0.06 limit) while keeping
      s-bend finish times under 3 s. Based on the iteration 1 race, where the slalom
      finished 0% and the s-bend 65%.


      ### Rationale


      Evidence from iteration 1 (score 574, the best so far): the oval finishes 80%
      of runs and the s-bend 65%, but the slalom never finishes (0%, mean progress
      0.39, every run ends off track). Slalom max_error is about 0.064, above the
      0.06 m off-track limit, with about 1.1 line-loss events per run. Body width
      cannot widen the limit: max(0.06, 0.0125 + body_width/4) is floored at 0.06
      across the whole body range, so the fix has to come from tighter tracking. Steering
      oscillation (0.26 to 0.35) is already moderate, and kd went from 0.4 to 0.8
      in iteration 1, which did not visibly add jitter.


      Changes: (1) Raise kp from 4.0 to 4.5 to correct lateral error faster on the
      sharp slalom bends. The sensor array and kd are kept, since the sensor change
      was not isolated and kd 0.8 appears to be stable. (2) Lower base_speed from
      1.5 to 1.4 to reduce lateral slip and sensor lag at the bends. Mean finish time
      on the s-bend was 2.45 s at 1.5, so this should give about 2.6 s, still inside
      the 3 s limit. Oval times (about 2.1 s) also stay within it.


      Expected result: slalom progress rises above 0.39 and fewer off-track exits
      occur, s-bend completion improves, and oval completion holds. Hypotheses to
      test: (a) the extra kp reduces slalom max_error below 0.06; (b) the 1.4 base
      speed keeps finish times under 3 s on the s-bend; (c) steering_oscillation stays
      near or below 0.35 with kp 4.5.


      - [Open this output](iteration-2/entity0/versions/5664d3652d074512b1d14fe2febbae9d/payload.json)

      - Based on: [entityR2A](iteration-2/entityR2A/versions/carried-33857f7110f0ac70/payload.json)'
  - id: entityR1
    label: Wider sensors, more
    notes: 'Approves the candidate that widens the sensor array to ±0.03 m, enlarges
      sensors to 16 mm, raises kd to 0.8 and lowers base_speed to 1.5. Iteration 0
      showed s-bend and slalom leaving the track with max_error above 0.06 m and 1.5
      to 2 line-loss events per run, which these changes target. Early exploration
      with a valid, evidence-based change, so the race is the next step.


      ### Feedback


      This candidate changes three things from iteration 0, each tied to that race''s
      evidence. (1) The sensor array is widened to x = -0.03 to +0.03 m in 15 mm steps,
      with 16 mm footprints. Iteration 0 showed the s-bend and slalom ending off track
      with max_error about 0.062 to 0.063 m, above the 0.06 m limit, and 1.55 to 2.0
      line-loss events per run, which points to tape being lost at lateral errors
      the old +/-0.02 m array could not cover. (2) kd rises from 0.4 to 0.8 to test
      whether more damping reduces steering_oscillation, which was about 0.27 on the
      oval and s-bend in iteration 0. (3) base_speed drops from 1.6 to 1.5 to reduce
      slip on the sharp sections. The oval finished at 1.9 s in iteration 0, so there
      is time margin. The sensor weights stay at (-2, -1, 0, 1, 2), so the signal
      scale is unchanged even though the physical spacing is wider. Nothing about
      this candidate''s performance is stated here; the race will show it. Plan the
      next revision from the telemetry as follows. If line_loss_events fall but max_error
      still exceeds 0.06 on the s-bend or slalom, the array is working and the next
      lever is kp or kd on those sections. If steering_oscillation stays above about
      0.2 with kd 0.8, raise kd further in steps of 0.2 before changing kp. If the
      oval no longer completes or completion_time rises well above 2 s, return base_speed
      to 1.6 and keep the sensor change. Approving this now is right for an early
      exploration iteration: the change is valid, specific and evidence-based, and
      the race will show whether the wider array addresses the main failure mode.


      ### Requested changes


      - If the s-bend or slalom still ends off track with max_error above 0.06 while
      line_loss_events drop, keep the wider array and raise kp in small steps (for
      example 4.0 to 5.0) to tighten tracking on the sharp bends. Basis: iteration
      0 showed max_error of 0.062 to 0.063 m on those tracks.

      - If steering_oscillation stays above about 0.2 with kd at 0.8, raise kd to
      about 1.0 to 1.2 and keep kp fixed. Basis: iteration 0 measured steering_oscillation
      of 0.27 with kd 0.4, and this candidate doubles kd to test whether damping is
      the limit.

      - If the oval fails to complete or completion_time rises above about 2.2 s,
      return base_speed to 1.6 and keep the sensor change. Basis: the oval finished
      in 1.9 s with 40% completion at base_speed 1.6, so speed is the lever for finish
      time.


      - [Open this output](iteration-1/entityR1/versions/8f47b3fd23494c39bfe4ff824f92e935/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/a0b2c3fbc37b4ce2bc37ba7efd92c794/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-ab6bd19f665c3105/payload.json)'
