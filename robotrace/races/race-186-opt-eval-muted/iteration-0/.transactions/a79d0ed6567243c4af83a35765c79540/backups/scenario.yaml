  entities:
  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'First candidate, with no race data yet: five 12 mm sensors spaced 10 mm
      across the line, weights proportional to x, kp 4, kd 0.4, base_speed 1.6. The
      values are mid-range and chosen from the contract''s physics rather than from
      race evidence, so the next race is needed to tune them.


      ### Rationale


      Iteration 0 has no race telemetry or Evaluator feedback yet, so this is a baseline
      built from first principles. Geometry: five line sensors spaced 10 mm apart
      across x = -0.02 to +0.02 m, placed 0.05 m ahead of the axle so steering reacts
      before the wheels reach the tape. Sensor size is 12 mm, which covers the 25
      mm tape with some margin. Sensor weights are proportional to sensor x (-2, -1,
      0, 1, 2), so the signal is the reading-weighted lateral position of the tape,
      with positive meaning left. Body and wheel values are a mid-range, stable platform:
      wheel_track 0.12 m for moderate yaw authority, wheel_radius 0.03 m, body 0.12
      x 0.16 m, mass 0.8 kg. Controller: kp = 4 gives a moderate steering response
      (about 1400 PWM per unit of signal). kd = 0.4 damps the oscillation from the
      sensor lag. ki = 0.05 is small, since the course has no persistent offset to
      remove. base_speed = 1.6 (throttle 0.8 of full PWM) aims at the roughly 1.5
      m/s average the 3 s limit requires, while leaving room to slow on the tighter
      bends. line_loss = last_direction, so the robot turns back toward the side it
      last saw the tape. Expected result: completion on the oval and s-bend, with
      some oscillation on the slalom. The next race should show whether speed is limiting
      finish time or whether the robot leaves the track on the sharper bends.


