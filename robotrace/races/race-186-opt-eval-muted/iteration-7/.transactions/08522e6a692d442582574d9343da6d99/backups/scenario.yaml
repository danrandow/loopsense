map:
  id: race-186-opt-eval-muted
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Sensor lead y=0.07, kd1.1
    notes: 'Extends the iteration 6 sensor lead from y=0.06 to 0.07 m and raises kd
      from 1.0 to 1.1, targeting the remaining slalom line-loss events and rms error.
      Based on the 937-point iteration 6 result, where oval and s-bend finished 20/20
      and slalom finished 20/20.


      ### Rationale


      Evidence: iteration 6 is the best design so far (937.1). Oval and s-bend finish
      20/20, and slalom now finishes 20/20 (925.7), up from 11/20 at iteration 5.
      The remaining loss is in slalom: 0.65 line-loss events per run, rms_error 0.011,
      max_error 0.021, and a mean finish time of 2.92 s, close to the 3 s limit. Score
      sensitivity: each line-loss event costs about 15 points (120/8), and the rms
      term is worth about 65 points on slalom. Time is worth only about 1.6 points
      on slalom, so speed is a secondary lever. Iteration 6 changed mass (0.45 to
      0.40) and sensor lead (y 0.05 to 0.06) together, and both moved in the right
      direction. Iteration 4 showed that raising kp to 6 collapses the oval and s-bend,
      so kp stays at 4.0. Mass is already at its 0.40 kg floor, so it cannot move
      further. Changes: (1) Move the sensor lead from y = 0.06 to y = 0.07 m, inside
      the 0.08 limit, to continue the lead trend that helped slalom. (2) Raise kd
      from 1.0 to 1.1 to damp the extra overshoot a larger lead can introduce. Sensor
      x positions, weights, kp, ki, base_speed (1.5) and line_loss (last_direction)
      are unchanged, so the effect is readable. Expected result: slalom line-loss
      events fall to about 0.4 or below and slalom rms_error drops by a few thousandths.
      Oval and s-bend stay near 100% completion. Steering_oscillation should stay
      near 0.3 or below. Hypotheses: (a) the y = 0.07 lead cuts slalom line-loss events;
      (b) kd 1.1 keeps oscillation at or below about 0.35; (c) completion holds at
      100% on all three tracks. If slalom max_error rises or oscillation exceeds 0.35,
      revert to y = 0.06 and kd 1.0, which is the iteration 6 design.


      - [Open this output](iteration-7/entity0/versions/97f602ff27754085bd6d96f8013e949a/payload.json)

      - Based on: [entityR2A](iteration-7/entityR2A/versions/carried-bc285ef93a5d3236/payload.json)'
  - id: entityR1
    label: 'Approve: mass 0.40'
    notes: 'Approved the candidate as-is: the iteration 5 best design with mass lowered
      to 0.40 kg (continuing the 0.6 to 0.45 gain) and sensors moved forward to y
      = 0.06 m. Feedback lists the next levers (mass back to 0.45, kd 1.2, base_speed)
      depending on slalom off-track, timeout and oval/s-bend results.


      ### Feedback


      Written before this candidate has raced. It is the iteration 5 design (best
      raced, score 851.5: oval 20/20, s-bend 20/20, slalom 11/20) with two changes.
      Mass drops from 0.45 to 0.40 kg, the contract lower bound. Iteration 3 to 5
      showed that cutting mass from 0.6 to 0.45 lowered slalom max_error and line-loss
      events while the oval and s-bend improved, so continuing that trend is a reasonable
      test. All five sensors move forward from y = 0.05 to y = 0.06 m. This is the
      lead lever the previous Evaluator review named after the mass change, and it
      has not been tested before. The sensor y change is untested, and the two changes
      together will not be separable on slalom, so read the result as a pair. Sensor
      x positions, 16 mm size, weights [-2,-1,0,1,2], kp 4.0, kd 1.0, ki 0.05, base_speed
      1.5 and last_direction line loss are unchanged from iteration 5. Kp stays at
      4.0 because iteration 4 (kp 6.0 with a 7-sensor array) and iteration 2 (kp 4.5)
      both cost oval and s-bend completion. The approval is for an early-to-mid exploration
      iteration with 5 iterations left, so racing this candidate gives the telemetry
      needed to isolate the next lever. Plan the revision from the race telemetry
      as follows. If oval or s-bend completion drops below 100% and 100% respectively,
      or steering_oscillation rises above about 0.35, the lighter robot is under-damped:
      return mass to 0.45 and keep the sensor lead. If slalom still leaves the track
      more than about 5 times in 20 with max_error near or above 0.042, raise kd to
      about 1.2 before touching kp. If slalom finishes but times out, the timeouts
      point to speed, so test base_speed in steps of 0.1.


      ### Requested changes


      - If oval or s-bend completion falls below iteration 5 (100% and 100%), or steering_oscillation
      rises above about 0.35, return geometry.mass to 0.45 and keep the sensor lead
      at y = 0.06. Basis: iteration 5 showed that mass 0.45 held both tracks at 100%
      with steering_oscillation of 0.23 to 0.31, and a lighter robot has less yaw
      damping.

      - If slalom still has 5 or more off-track exits out of 20 with max_error near
      or above 0.042, raise controller.kd from 1.0 to about 1.2 and keep kp at 4.0.
      Basis: iteration 5 slalom had 7 off-track exits and max_error 0.042, and kp
      increases in iterations 2 and 4 cost oval and s-bend completion, so kd is the
      untested damping lever.

      - If slalom completes but still shows timeouts, raise controller.base_speed
      in steps of 0.1 (1.5 to 1.6) while holding the gains. Basis: iteration 5 had
      2 slalom timeouts and a mean finish time of 2.92 s against the 3.0 s limit,
      and iteration 0 at base_speed 1.6 showed the oval still finishing in about 1.9
      s.


      - [Open this output](iteration-6/entityR1/versions/8181743e695c4a12b0d1a080134457e5/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/1da2cbde1a094e1b811693a62d5453b6/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-5cc25095d3956408/payload.json)'
