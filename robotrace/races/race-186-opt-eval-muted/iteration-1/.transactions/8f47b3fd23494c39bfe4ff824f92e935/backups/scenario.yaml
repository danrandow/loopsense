overrides:
  entities:
  - id: entity0
    label: Wider array, more damping
    notes: 'Widened the sensor array to +/-0.03 m with 16 mm sensors, raised kd to
      0.8 and cut base_speed to 1.5. The baseline failed on s-bend and slalom by leaving
      the track with 1.5-2 line-loss events per run, so this targets line retention
      and jitter.


      ### Rationale


      Evidence from iteration 0 (score 256): the oval finishes 40% of the time, but
      the s-bend and slalom both end by leaving the track, at mean progress 0.32 and
      0.12. Their max_error (0.063 and 0.062) is above the 0.06 m off-track limit,
      and line-loss events are 1.55 and 2.0 per run. The sensor spread of +/-0.02
      m is narrower than the excursions these bends cause, so the robot loses the
      tape and then reacquires it late. Steering oscillation is about 0.27, which
      points to too little damping. Body width cannot help: the off-track limit is
      max(0.06, 0.0125 + body_width/4), and the 0.06 floor binds across the whole
      body range, so I am leaving body_width alone.


      Changes: (1) Widen the sensor array to x = -0.03 to +0.03 m in 15 mm steps,
      and enlarge sensors to 16 mm so adjacent footprints overlap. This keeps tape
      visible at lateral errors up to about 0.04 m and should cut line-loss events.
      (2) Raise kd from 0.4 to 0.8 to damp the jitter from sensor lag. (3) Lower base_speed
      from 1.6 to 1.5. This is a small trade: it adds a little time, but it reduces
      the lateral slip and lag on the sharp s-bend and slalom sections, where the
      robot currently leaves the track. The oval already finishes at 1.9 s, so there
      is some time margin. Expected result: fewer off-track exits on the s-bend and
      slalom, a higher mean progress, and lower line-loss counts. Oval completion
      should hold. Hypotheses to test: (a) the wider array removes most line-loss
      events; (b) kd 0.8 cuts steering_oscillation below 0.2; (c) finish time stays
      under 3 s on the oval.


      - [Open this output](iteration-1/entity0/versions/a0b2c3fbc37b4ce2bc37ba7efd92c794/payload.json)

      - Based on: [entityR2A](iteration-1/entityR2A/versions/carried-ab6bd19f665c3105/payload.json)'
  - id: entityR1
    label: 'Baseline review: approve'
    notes: 'Approved the iteration-0 baseline because it is valid and first-principles
      sound, and there is no race evidence yet to justify revising. The feedback sets
      out what to change on speed, kd and kp depending on the first race''s telemetry.


      ### Feedback


      Iteration 0 has no race telemetry yet, so this review rests only on the contract
      and the candidate''s own contents. The candidate is valid: every value is inside
      its contract limit, and the sensor weights are antisymmetric (-2, -1, 0, 1,
      2), so the signal has the right sign and scale. Two points to watch once it
      races. (1) kp = 4 with weights up to |2| gives turn up to 8, or about 2800 PWM
      of differential. At a full-scale edge reading, the inner wheel command can clamp
      near zero, so sharp bends may be taken with one wheel nearly stopped. (2) base_speed
      = 1.6 gives a base PWM of about 2620. That is needed to reach the roughly 1.5
      m/s the 3 s limit requires, but it leaves little headroom on the tightest bends.
      Plan the next revision from the race, as follows. If the run goes off track
      or shows line_loss_events on the sharpest bend, lower base_speed to about 1.2
      to 1.4 before changing gains. If it completes with high steering_oscillation
      on the slalom, raise kd to about 0.6 to 0.8 before changing kp. If it completes
      with rms_error well above what the bends require and completion_time near 3
      s, the gains are sound and base_speed is the lever to push up. Because this
      is the first race, approving it now gives the telemetry that will sharpen every
      later critique.


      ### Requested changes


      - If the robot leaves the track or loses the line on the tightest bend, reduce
      base_speed to about 1.2 to 1.4 before touching the gains. Basis: base_speed
      1.6 was chosen from first principles, not measured, and the contract''s sharp-bend
      risk is the main unknown.

      - If steering_oscillation is high on the slalom, raise kd to about 0.6 to 0.8
      and hold kp at 4. Basis: kd = 0.4 was chosen to damp sensor lag, and no race
      has yet shown whether that is enough.

      - If the run completes but completion_time is close to 3 s with low rms_error,
      keep the gains and raise base_speed in small steps (about 0.1 to 0.2) while
      watching max_error. Basis: the 1.5 m/s average the limit requires is not yet
      confirmed as reachable.


      - [Open this output](iteration-0/entityR1/versions/a79d0ed6567243c4af83a35765c79540/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/093189bedfa6432fa6e7cff79266e16d/payload.json)'
