overrides:
  entities:
  - id: entity0
    label: 'Final: resubmit best'
    notes: 'Resubmits the iteration 6 design unchanged, the best measured build (937.1,
      60/60 finishes) and the one iteration 10 reproduced. Every single-variable follow-up
      scored lower, so no untested change is risked before the unseen-track race.


      ### Rationale


      This is the final iteration, so the priority is a robust, approvable build for
      the unseen track. The best measured design is iteration 6 (score 937.10), which
      iteration 10 reproduced exactly. It finished 60/60 across oval, s-bend and slalom
      (oval 944.7, s-bend 940.9, slalom 925.7). Every single-variable follow-up scored
      lower: kd 0.9 at y=0.06 gave 865.3, y=0.07 with kd 1.1 gave 930.9, and kd 1.1
      at y=0.06 gave 925.9. kp 6 collapsed the oval and s-bend in iteration 4. Mass
      is already at its 0.40 kg floor, and body_width cannot change the off-track
      limit because the 0.06 m floor binds. I therefore resubmit the iteration 6 design
      unchanged. The remaining loss is slalom line-loss events (about 0.65 per run),
      but no tested single change has reduced it without a cost elsewhere, so an untested
      tweak now would risk the unseen-track result for little expected gain. Expected
      result: about 937 on the development tracks with 60/60 finishes. Hypotheses
      for the record: (a) the design generalises to the unseen track because its margin
      is wide on all three shapes; (b) line-loss events remain the largest recoverable
      term. Measurements wanted: per-track completion, max_error, line_loss_events,
      completion_time, steering_oscillation and noise_robustness, to check how much
      of the margin survives on a different shape.


      - [Open this output](iteration-11/entity0/versions/5974f13e91244affb476515ae2eaa3b0/payload.json)

      - Based on: [entityR2A](iteration-11/entityR2A/versions/carried-bc285ef93a5d3236/payload.json)'
  - id: entityR1
    label: Approve iter-6 design
    notes: 'Final iteration: approves the iteration 6 design unchanged, which is the
      best raced design (937.10) and was reproduced in iteration 10 with 60/60 finishes.
      Every single-variable neighbour tested in iterations 7 to 9 scored lower, and
      kp increases in iterations 2 and 4 cost completions, so no further revision
      is justified.


      ### Feedback


      Written before this candidate has raced. The candidate is the iteration 6 design,
      resubmitted unchanged. Iteration 6 scored 937.10 with 60/60 finishes (oval 944.7,
      s-bend 940.9, slalom 925.7), and iteration 10 reproduced that score exactly,
      so the design is reproducible on the development tracks. Every single-variable
      neighbour tested scored lower: kd 0.9 at y=0.06 gave 865.3 (iteration 8), y=0.07
      with kd 1.1 gave 930.9 (iteration 7), and kd 1.1 at y=0.06 gave 925.9 (iteration
      9). Raising kp to 4.5 (iteration 2) and to 6.0 with a seven-sensor array (iteration
      4) both lost oval and s-bend completions. Mass is at its 0.40 kg floor, and
      the 0.06 m off-track floor binds, so body_width cannot widen the limit. This
      is the final iteration, so a further revise round would cost two action runs
      and leave no iteration to test its result. The best evidence available is this
      design, so approval is correct. Its remaining loss is slalom line-loss events
      (about 0.65 per run) and a slalom mean finish near 2.92 s. The unseen track
      is not measured, so the margin on it is unknown.


      ### Requested changes


      - Race the iteration 6 design unchanged: geometry sensor_positions at x = -0.03,
      -0.015, 0.0, 0.015, 0.03 with y = 0.06, sensor_size 0.016, mass 0.40, controller
      kp 4.0, ki 0.05, kd 1.0, base_speed 1.5, weights [-2,-1,0,1,2], line_loss last_direction.
      Basis: iterations 6 and 10 both measured 937.10 with 60/60 finishes.

      - Record per-track completion, max_error, line_loss_events, completion_time,
      steering_oscillation and noise_robustness, so the margin left on a different
      shape can be read. Basis: the unseen-track result is the only score left, and
      these measures show how much of the development margin survives.


      - [Open this output](iteration-11/entityR1/versions/2aebc091aace44f3a878189ce61d11ce/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/5974f13e91244affb476515ae2eaa3b0/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-bc285ef93a5d3236/payload.json)'
