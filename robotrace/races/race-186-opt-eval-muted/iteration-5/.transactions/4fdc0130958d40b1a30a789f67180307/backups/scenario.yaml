map:
  id: race-186-opt-eval-muted
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: 7-sensor wide array
    notes: 'Extends the array to 7 sensors at ±0.045 m with weights rescaled and kp
      raised to 6.0 to hold gain. Aimed at cutting slalom line loss (1.25 per run)
      and the 0% slalom finish, while keeping the 100% oval finish from iteration
      3.


      ### Rationale


      Evidence: iteration 3 (685.6, best so far) keeps oval at 100% finish and s-bend
      at 85%. Slalom still never finishes (0/20, progress 0.585, max_error 0.065,
      1.25 line-loss events), and every slalom run leaves the track. Iteration 1 showed
      that widening the sensor array was the change that most improved slalom progress
      (0.12 to 0.39), and line-loss events fell as coverage grew. Body width cannot
      widen the off-track limit, because the 0.06 m floor binds across the whole body
      range. Iteration 2 showed that raising kp to 4.5 hurt the oval and s-bend, so
      I keep kp near 4.0 in effect.


      Changes: (1) Extend the array from 5 to 7 sensors at x = -0.045 to +0.045 m
      in 15 mm steps. This keeps the tape visible at lateral errors near 0.05 m, which
      is the slalom excursion range, and should cut line-loss events. (2) Rescale
      the weights to x/0.0225, giving [-2, -1.33, -0.67, 0, 0.67, 1.33, 2]. The outer
      sensors therefore still reach the ±2 limit. (3) Raise kp to 6.0 so the inner-sensor
      steering gain stays at about the iteration 3 level (4.0 x 1.5 x 0.667 = 4.0).
      Outer-sensor gain rises modestly, which should help recovery from larger excursions.
      Mass 0.6, kd 1.0, base_speed 1.5, sensor size 16 mm, line_loss last_direction
      and the y position of 0.05 m are kept unchanged, so the effect of the array
      change is isolated as far as possible.


      Expected result: slalom line-loss events fall below 0.5, slalom progress rises
      above 0.6, and some slalom runs finish. Oval completion should hold at 100%.
      Hypotheses: (a) the wider 7-sensor array reduces line loss on slalom; (b) the
      matched kp keeps s-bend and oval behaviour close to iteration 3; (c) steering_oscillation
      stays at or below 0.35. Measurements wanted: per-track completion, max_error
      and line_loss_events on slalom, and steering_oscillation on all tracks.


      - [Open this output](iteration-4/entity0/versions/8dc61acbd50040fcbd635f406bebda47/payload.json)

      - Based on: [entityR2A](iteration-4/entityR2A/versions/carried-cbcbbf86af56d02f/payload.json)'
  - id: entityR1
    label: Approve 7-sensor kp 6
    notes: 'Approved the 7-sensor array (±0.045 m, weights rescaled) with kp 6.0,
      since the inner and mid-sensor gains match the best raced design (iteration
      3, 685.6). Sensor widening cut slalom line loss in iteration 1, so the array
      change is the lever that most plausibly helps slalom.


      ### Feedback


      Written before this candidate has raced. Iteration 1 is the evidence for the
      sensor change: widening the array from x = ±0.02 m to ±0.03 m took slalom progress
      from 0.12 to 0.39, and line-loss events fell from 2.0 to 1.1. This candidate
      extends the array to ±0.045 m, which is the next step on that same lever. The
      gain bookkeeping checks out. Inner sensors give kp x weight = 6.0 x 0.667 =
      4.0, matching the iteration 3 inner gain. The ±0.03 m sensors give 6.0 x 1.333
      = 8.0, matching iteration 3''s 4.0 x 2. Only the new ±0.045 m sensors (weight
      ±2, gain 12) are outside the earlier range, so the high-kp risk is confined
      to large excursions. That risk is the main unknown. Iteration 2 lost oval and
      s-bend completion at kp 4.5 (though base_speed also changed), and steering_oscillation
      rose to 0.34 to 0.39. Iteration 3 is the best raced design at 685.6 (oval 100%,
      s-bend 85%, slalom 0%). Mass 0.6, kd 1.0 and base_speed 1.5 are unchanged from
      it, so this race isolates the array and kp effect. Approving now is right: the
      candidate is valid, changes one mechanism with a clear rationale, and sits at
      the best-known base. Plan the next revision from the telemetry. If oval or s-bend
      completion drops below iteration 3 (100% and 85%), or steering_oscillation exceeds
      about 0.35, reduce kp to about 5.0 while keeping the 7-sensor array, since the
      high-gain outer sensors are the suspect. If slalom progress rises but still
      ends off track with max_error above 0.06, keep the array and raise kd in steps
      of 0.2 before touching kp again. If slalom line_loss_events fall below about
      0.5 while completions hold, extend the array further only if the geometry limits
      allow it.


      ### Requested changes


      - If oval or s-bend completion falls below iteration 3 (100% and 85%), or steering_oscillation
      rises above about 0.35, lower controller.kp to about 5.0 and keep the 7-sensor
      array. Basis: iteration 2 lost completions at kp 4.5 with steering_oscillation
      of 0.34 to 0.39, and this candidate''s ±0.045 m sensors carry gain 12.

      - If slalom progress rises but it still leaves the track with max_error above
      0.06, raise controller.kd from 1.0 to about 1.2 before changing kp. Basis: iteration
      1 slalom max_error was 0.0635 at kd 0.8, and kd damping is the untested lever
      on the slalom overshoot.

      - If slalom line_loss_events fall below about 0.5 while the oval and s-bend
      hold, keep this array and kp and test base_speed in steps of 0.1 upward for
      finish time. Basis: iteration 3 oval finished in 1.9 s and s-bend in 2.3 s,
      both inside the 3 s limit.


      - [Open this output](iteration-4/entityR1/versions/13dd6f10cd1b4af29b99da8ca0980686/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/8dc61acbd50040fcbd635f406bebda47/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-cbcbbf86af56d02f/payload.json)'
