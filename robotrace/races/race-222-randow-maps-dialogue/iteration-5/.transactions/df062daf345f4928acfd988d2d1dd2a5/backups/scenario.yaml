map:
  id: race-222-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Mass 0.6 kg test, 16mm
    notes: 'Keeps the best-known sensing (16 mm at ±0.05 m, y 0.04) and 0.12 m track,
      which iteration 4 showed to be neutral. Tests lower mass (yaw inertia) as the
      remaining lever on the stuck 0.061 m excursion, following the Integrator''s
      contingency.


      ### Rationale


      Evidence from iterations 0 to 4 points to the same conclusion. Span ±0.05 m
      removed line loss on the oval and slalom (iteration 1). The 16 mm footprint
      left max_error unchanged (iteration 2). Look-ahead y = 0.06 did not move max_error
      and brought back line loss on the s-bend and slalom (iteration 3). Iteration
      4 tested wheel_track 0.15 m with y = 0.04 and 16 mm footprints, and scored 26.9949,
      identical to iteration 2. Its max_error stayed at 0.0614, 0.0611 and 0.0609
      on oval, s-bend and slalom. Wheel track therefore does not set the excursion,
      and control effort was higher at 0.15 m. The Integrator''s note that kp 4.4
      is in its package means the gain change is theirs to carry; I am not changing
      the controller.


      I followed the Integrator''s contingency. I kept the best-known sensing (16
      mm footprints at x = ±0.05 m, y = 0.04 m) and returned wheel_track to 0.12 m,
      since 0.15 m gave no score gain and more control effort. I also took the next
      step they named: mass 0.6 kg, to reduce yaw inertia, which is the one geometry
      lever not yet tested. Yaw inertia is mass × (L² + W²)/12, so the change is about
      25 percent lower at the same body size. The off-track floor is max(0.06, 0.0125
      + body_width/4). With body_width at 0.18 m that is 0.0575 m, so the body cannot
      raise the limit and stays at 0.12 m.


      Expected result: if the 0.061 m excursion is a start-up transient or a fixed
      motor-mismatch bias, mass will change it little and max_error stays near 0.061
      m with line loss at zero. If yaw inertia is the limit, max_error should fall
      below about 0.058 m. My confidence in a large effect is low. If max_error does
      not move, the next geometry lever is a start-up geometry change, not further
      span, footprint or look-ahead tests.


      - [Open this output](iteration-5/entity0/versions/3bf4a9f9821f4163adaac1cfca1e1e7f/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-87e08329a12c3e1e/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-05b5410f2381ea2f/payload.json)'
  - id: entity1
    label: Mass 0.6 kg test package
    notes: 'Iteration-2 geometry and controller, with mass lowered from 0.8 to 0.6
      kg and wheel_track reset to 0.12 m. Built on iteration 2 (best, 26.99) and iteration
      4, which showed wheel_track 0.15 m gave no gain.


      ### Rationale


      Iteration 2 is the best-scoring pairing so far (26.9949): 16 mm sensors at x
      = ±0.05 m, y = 0.04 m, wheel_track 0.12 m, kp 3.5, ki 0, kd 0.05. Iteration
      4 showed that wheel_track 0.15 m with kp 4.4 gives the same max_error (0.0614
      oval, 0.0611 s-bend, 0.0609 slalom) and higher control effort, so I revert the
      track to 0.12 m. Iteration 3 showed that y = 0.06 brought back line loss and
      did not move max_error, so y stays at 0.04 m. The Builder''s one change is mass
      0.8 to 0.6 kg. That changes the dynamics, not the sensing or the steering gain,
      so I keep the iteration-2 controller unchanged (kp 3.5, ki 0, kd 0.05, base_speed
      1.6, last_direction, weights [-1, -0.5, 0, 0.5, 1]). I do not apply kp scaling
      for mass, because the Integrator has no evidence that mass changes the effective
      steering gain. Off-track limit is max(0.06, 0.0125 + 0.12/4) = 0.06 m, so body_width
      stays 0.12 m. Expected result is not stated: this race should show whether max_error
      responds to yaw inertia, with line loss expected to stay at zero, and I will
      report whether any excursion sits at the start of the run or at a particular
      bend.


      - [Open this output](iteration-5/entity1/versions/fd1911029c644336b24dfe868946b8f8/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/3bf4a9f9821f4163adaac1cfca1e1e7f/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-05b5410f2381ea2f/payload.json)'
  - id: entityR1
    label: Mass test and start-up
    notes: 'Feedback asks the Builder to test mass 0.6 kg alone, then a start-up geometry
      change if the 0.061 m excursion persists. Based on iterations 0 to 4, where
      span, footprint, y = 0.06 and wheel_track did not move max_error.


      ### Feedback


      Evidence so far: iterations 0 to 4 all ended off_track with max_error about
      0.061 m on every track. Iteration 1 (12 mm, x = ±0.05 m) removed line loss on
      the oval and slalom, so span fixed coverage. Iteration 2 (16 mm, same span,
      kp 3.5, y 0.04) gave zero line loss on oval and slalom and the best score, 26.99,
      but max_error stayed at 0.061 m, so footprint and kp do not set the excursion.
      Iteration 3 (y 0.06 with ki 0.3) brought back line loss on the s-bend and slalom
      and left max_error at 0.061 m, so y = 0.06 is not useful. Iteration 4 (wheel_track
      0.15 m, kp 4.4) gave the same max_error with higher control effort, so wheel_track
      does not set the excursion. I have built the integration to keep the iteration-2
      controller and y = 0.04. I make no prediction for the mass 0.6 kg robot. Once
      its race is in, the next decision depends on its max_error and line_loss_events.
      If max_error falls below about 0.058 m with line loss at zero, yaw inertia is
      a real limit: keep the lighter mass and tune sensor span or footprint around
      it. If max_error stays at 0.061 m, the excursion is probably a start-up transient
      or fixed bias. The next geometry lever is then the start-up position, and I
      would ask you to propose it with a stated hypothesis. Sensor y below 0.04 m
      is untested and would be an exploration, not supported by evidence.


      ### Requested changes


      - Keep the 16 mm footprint at x = ±0.05 m and y = 0.04 m, and test mass 0.6
      kg as the single change, with wheel_track back at 0.12 m.

      - If max_error stays at about 0.061 m with line loss at zero, propose one start-up
      geometry change (for example sensor y slightly below 0.04 m, untested) and state
      the hypothesis it tests.

      - If line loss returns at mass 0.6 kg, revert to 0.8 kg and hold the iteration-2
      geometry, since no other lever has shown a gain.


      - [Open this output](iteration-5/entityR1/versions/fd1911029c644336b24dfe868946b8f8/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/3bf4a9f9821f4163adaac1cfca1e1e7f/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-05b5410f2381ea2f/payload.json)'
