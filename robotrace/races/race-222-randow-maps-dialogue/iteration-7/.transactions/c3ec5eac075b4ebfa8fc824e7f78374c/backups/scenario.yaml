map:
  id: race-222-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Shorter look-ahead y=0.02
    notes: 'Reverts mass to 0.8 kg and tests sensor y = 0.02 m as one start-up geometry
      change, since mass 0.6 kg gave no gain and max_error stayed near 0.061 m across
      iterations 0 to 5. Evidence: the iteration 5 race and the iteration 3 y = 0.06
      line-loss result.


      ### Rationale


      Iterations 0 to 5 all ended off_track with max_error of about 0.061 m. Span
      ±0.05 m removed line loss (iteration 1), and footprint (16 mm), wheel_track
      (0.15 m) and mass (0.6 kg) left max_error unchanged. Iteration 5 (0.6 kg) scored
      26.9876 against 26.9949 at 0.8 kg, and its max_error was 0.0617, 0.0605 and
      0.0616 on oval, s-bend and slalom, so yaw inertia is not the excursion. Look-ahead
      y = 0.06 did not move max_error and brought line loss back. The Integrator''s
      contingency now applies: line loss is zero and max_error stays near 0.061 m,
      so I propose one start-up geometry change. I am taking the Integrator''s advice
      in part. I revert mass to 0.8 kg because the 0.6 kg gain was not measurable
      and 0.8 kg is the best-scoring row. I move sensor y from 0.04 to 0.02 m, a shorter
      look-ahead, which the Integrator named as untested. The hypothesis is that the
      excursion is a start-up or entry transient driven by the sensor row reading
      the line too far ahead of the axle, so a row nearer the axle should reduce the
      early overshoot. The lead-lag evidence is consistent with this: y = 0.06 added
      line loss, so a shorter look-ahead should reduce it. I expect line_loss_events
      to stay at zero and max_error to fall to or below about 0.058 m. If line loss
      returns, the shorter look-ahead is not usable, and I will revert to y = 0.04.


      - [Open this output](iteration-6/entity0/versions/93dc8cd6f1364500808bafc755696de3/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-a4c85959c0c292f9/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-2db07fa19eb38ad7/payload.json)'
  - id: entity1
    label: 'Robot: y=0.02 look-ahead'
    notes: 'Builder''s y=0.02 row on the iteration-2 controller (kp 3.5, ki 0, kd
      0.05), with no other changes so the race isolates look-ahead. Kept because the
      excursion has held at about 0.061 m through every gain, footprint, span, mass
      and wheel-track change.


      ### Rationale


      The Builder''s y = 0.02 proposal keeps the best-scoring pairing from iteration
      2 (16 mm sensors at x = ±0.05 m, kp 3.5, ki 0, kd 0.05, base_speed 1.6, last_direction
      recovery, weights [-1, -0.5, 0, 0.5, 1]). The only geometry change is sensor
      y, moving from 0.04 m to 0.02 m. Evidence: iteration 2 (y 0.04) gave zero line
      loss on oval and slalom and max_error of about 0.061 m. Iteration 3 (y 0.06
      with ki 0.3) brought line loss back on the s-bend and slalom and left max_error
      unchanged. Iteration 4 (wheel_track 0.15, kp 4.4) and iteration 5 (mass 0.6)
      left max_error at about 0.061 m. Across all controller and geometry changes,
      max_error has stayed at about 0.061 m, so the excursion does not look like a
      gain, footprint, span or mass limit. A start-up or entry transient is the most
      likely cause. The controller therefore stays at the iteration 2 values, so the
      race isolates the look-ahead change. I do not add ki, because iteration 3 confounded
      it with y. I do not change kp, because kp 3.0, 3.5 and 4.4 all gave the same
      max_error. Mass stays at 0.8 kg, as the Builder specified. I expect line_loss_events
      to stay at zero and max_error to move only if the shorter look-ahead changes
      the entry transient. This is a prediction, not a measurement.


      - [Open this output](iteration-6/entity1/versions/c933b464dd8946ffa71387b4a5ff193c/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/93dc8cd6f1364500808bafc755696de3/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-2db07fa19eb38ad7/payload.json)'
  - id: entityR1
    label: 'Feedback: test y=0.02'
    notes: 'Supports the y=0.02 test as a clean single change, since iteration 3 confounded
      look-ahead with ki. Gives decision rules for keeping, moving to y=0.00, or reverting
      to y=0.04 depending on line loss and max_error.


      ### Feedback


      Evidence: iterations 0 to 5 all ended off_track with max_error of about 0.061
      m on every track. Span ±0.05 m removed line loss on oval and slalom (iteration
      1). The 16 mm footprint kept line loss at zero but did not move max_error (iteration
      2). Sensor y 0.06 with ki 0.3 brought line loss back on the s-bend and slalom
      and left max_error at 0.061 m (iteration 3). wheel_track 0.15 m with kp 4.4
      kept max_error the same and raised control effort (iteration 4). Mass 0.6 kg
      (iteration 5) scored 26.9876, below iteration 2''s 26.9949, with no clear max_error
      gain. So far, nothing except span has changed line loss, and nothing has moved
      max_error. Your y = 0.02 test is the right next step: it shortens look-ahead
      without the ki confound from iteration 3, and the controller keeps the iteration-2
      gains. The outcome of this race is not known yet. Read the result as follows.
      If the excursion is at the start of the run and y = 0.02 leaves max_error unchanged,
      the excursion is a start-up effect, and no sensor or wheel change is likely
      to remove it alone. If line loss returns at y = 0.02, the shorter look-ahead
      is not usable, so revert to y = 0.04.


      ### Requested changes


      - Keep 16 mm footprints at x = ±0.05 m, mass 0.8 kg and wheel_track 0.12 m,
      and test y = 0.02 m as the single change. Report max_error and line_loss_events
      per track, and whether the excursion occurs at the start of the run.

      - If line_loss_events stay at zero and max_error falls below about 0.058 m,
      try y = 0.00 m as the next single change, since the shorter look-ahead is what
      helped.

      - If line loss returns at y = 0.02 m, revert to y = 0.04 m and keep the iteration-2
      row, since y = 0.06 m already reintroduced line loss.


      - [Open this output](iteration-6/entityR1/versions/c933b464dd8946ffa71387b4a5ff193c/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/93dc8cd6f1364500808bafc755696de3/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-2db07fa19eb38ad7/payload.json)'
