map:
  id: race-222-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Hold iteration-2 geometry
    notes: 'Geometry is held at the best-scoring row (26.9949), since no tested lever
      has moved the 0.061 m excursion and the Integrator is testing kd alone. Evidence
      is the nine-race record, including the wheel_track 0.10 m result, which matched
      the best score.


      ### Rationale


      Nine iterations have now been raced. The best geometry is the iteration-2 row
      (five 16 mm sensors at x = -0.05 to +0.05 m, y = 0.04 m, wheel_track 0.12 m,
      wheel_radius 0.03 m, mass 0.8 kg, body 0.12 x 0.18 m), which scored 26.9949.
      Iteration 8 (wheel_track 0.10 m) returned the same score and the same max_error
      (0.0614, 0.0611, 0.0609), so track width is settled. Across all runs, every
      trial ended off_track with max_error about 0.061 m. That sits just above the
      fixed off-track limit of max(0.06, 0.0125 + body_width/4), and the widest allowed
      body still gives only 0.0575 m, so no body change helps. Levers tested with
      no effect on max_error: footprint (12 vs 16 mm), wheel_track (0.10, 0.12, 0.15
      m), mass (0.6 vs 0.8 kg), wheel_radius (0.03 vs 0.04 m, where 0.04 m scored
      worse), and sensor y (0.02 and 0.04 m identical; 0.06 m reintroduced line loss).
      Span of ±0.05 m is the only change that mattered, because it removed line loss.


      The Integrator''s feedback from iteration 9 is to hold this geometry while they
      test kd (0.05 to 0.15). They have not yet reported whether that changes the
      excursion, so there is no new geometry evidence to act on. I take their advice
      and hold the geometry unchanged. I considered a wider span (±0.07 m) and a seven-sensor
      row, but neither has a hypothesis that the data supports: span has already removed
      line loss and has not moved max_error. Proposing either now would be an untested
      change without a reason.


      Expected result: the same score as the best row (about 26.99), zero line loss,
      and max_error near 0.061 m, unless the kd change moves the controller''s response.
      If max_error falls below about 0.058 m with line loss at zero, the Integrator''s
      damping result is real, and I will hold geometry while they tune gains. If it
      stays at 0.061 m, I will only propose a geometry change backed by a named start-up
      hypothesis, with the measurement that would confirm it.


      - [Open this output](iteration-10/entity0/versions/67801d2528a347d98ae2f1bf10dfcfb0/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-d9d5f65971330214/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-29348d80033de260/payload.json)'
  - id: entity1
    label: Complete Robot Package
    notes: 'Complete Robot Package. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      The best-scoring row (iteration 2, 26.9949) has zero line loss on oval and slalom,
      and max_error sits at about 0.061 m. That is just past the 0.06 m off-track
      limit. Across iterations 0 to 8, max_error has stayed at 0.0605 to 0.0617 under
      every change tried: span, footprint, kp from 2.6 to 4.4, ki 0.3 (confounded),
      y from 0.02 to 0.06, mass 0.6, wheel_track 0.10 and 0.15, and wheel_radius 0.04.
      Changes to kp and the sensor row therefore have not moved the excursion. The
      remaining untested controller lever is kd, the damping on signal rate. A start-up
      or entry transient that overshoots the 0.06 m limit would be the kind of disturbance
      more derivative damping can reduce. I therefore keep the iteration-2 geometry
      and controller exactly, and change only kd from 0.05 to 0.15. This is a modest
      increase, so steering noise should not grow much. Steering oscillation was about
      0.07 in every race, so there is margin. The other controller values stay at
      the iteration-2 settings. Expected result: line loss stays at zero. max_error
      moves only if the excursion is a transient that derivative action damps. This
      is a prediction, not a measurement.


      - [Open this output](iteration-9/entity1/versions/28f96317431a4f048c9dd28e487562fe/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/7a3d1cea15b54fc1a2942ccde65e78c1/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-6db45287ab7cd262/payload.json)'
  - id: entityR1
    label: Integration Feedback
    notes: 'Integration Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Holding the iteration-2 geometry is the right call. Across iterations 0 to 8,
      every run ended off_track with max_error between 0.0604 and 0.0617 m. The changes
      that moved line loss were span (iteration 1, removed it on oval and slalom)
      and y = 0.06 (iteration 3, brought it back). Footprint 12 vs 16 mm (iterations
      1 and 2), kp 2.6 to 4.4 (iterations 2, 4, 7), wheel_track 0.10 and 0.15 m (iterations
      4 and 8), mass 0.6 kg (iteration 5), wheel_radius 0.04 m (iteration 7) and y
      0.02 m (iteration 6) all left max_error at the same value. Iteration 3 changed
      y and ki together, so the ki effect is not separable. None of these levers has
      moved the excursion, so I do not expect further span, footprint, mass or track
      tests to help. The package this iteration changes only kd (0.05 to 0.15), since
      the excursion looks like a transient rather than a steering-gain or inertia
      limit. Read the result as follows. If max_error falls below about 0.058 m with
      line loss at zero, the damping lever is real, and you can hold the geometry
      while I tune gains further. If max_error stays at about 0.061 m, the excursion
      is not controlled by any tested lever, so do not propose further geometry changes
      on the same basis. In that case, propose only a change backed by a new hypothesis
      about the start-up condition, and say what evidence would confirm it.


      ### Requested changes


      - Hold the iteration-2 geometry this iteration (16 mm sensors at x = -0.05 to
      +0.05 m, y = 0.04 m, wheel_track 0.12 m, wheel_radius 0.03 m, mass 0.8 kg),
      since the excursion did not respond to any geometry change tested so far.

      - If max_error stays at about 0.061 m with kd 0.15, do not repeat span, footprint,
      mass, wheel_track, wheel_radius or y tests. Propose a geometry change only with
      a named start-up hypothesis and the measurement that would confirm it.

      - If line_loss_events return at any track, report which track shows it, so I
      can check whether the kd change or the geometry is responsible.


      - [Open this output](iteration-9/entityR1/versions/28f96317431a4f048c9dd28e487562fe/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/7a3d1cea15b54fc1a2942ccde65e78c1/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-6db45287ab7cd262/payload.json)'
