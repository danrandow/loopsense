map:
  id: race-222-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Narrow track 0.10 m
    notes: 'Reverts wheel radius to 0.03 m, since 0.04 m scored worse (26.66 vs 26.99)
      with max_error unchanged. Tests the untested narrower wheel_track (0.10 m) on
      the best 16 mm, plus/minus 0.05 m row, since every race so far has been stuck
      at max_error of about 0.061 m against a fixed 0.06 m off-track limit.


      ### Rationale


      Iteration 7 tested wheel_radius 0.04 m against the iteration-2 row. It scored
      26.6552, below the best 26.9949. Progress fell on the oval (0.1125 vs 0.115)
      and control effort rose, while max_error stayed at about 0.061 m. Larger wheels
      did not help, so I revert radius to 0.03 m. Across iterations 0 to 7, every
      run ended off_track with max_error of about 0.061 m. The off-track limit is
      max(0.06, 0.0125 + body_width/4), and no allowed body width raises it above
      0.06 m, so the excursion sits just past a fixed limit. Span (±0.05 m) removed
      line loss, and footprint, mass, wheel_track 0.15 m, sensor y (0.02 to 0.06 m)
      and radius 0.04 m have not moved max_error. The one geometry lever not yet tested
      is a narrower wheel_track. The Integrator''s contingency names wheel_track 0.10
      m, and it was written for a 0.04 m radius, which has now been shown to be worse.
      I therefore apply it on the 0.03 m radius. A narrower track gives about 1.2
      times more yaw per unit of wheel-speed difference (0.12/0.10), so the same steering
      command turns the robot harder. The Integrator may need to scale kp to keep
      the effective gain the same. That is their decision, and I do not set controller
      values here. Sensors (five 16 mm footprints at x = ±0.05 m, y = 0.04 m), mass
      0.8 kg and body are unchanged, so the test isolates track width against the
      best-scoring row. Expected result: if the excursion is a steering-authority
      limit, max_error should move. I expect a modest change at most, and I do not
      expect runs to finish.


      - [Open this output](iteration-8/entity0/versions/a92fa301001d4d1dbd97400a21c771ac/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-982675c9ba5877d6/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-b4ae6080d042a320/payload.json)'
  - id: entity1
    label: Wheel radius 0.04 test
    notes: 'Iteration-2 row with wheel_radius raised to 0.04 m and kp scaled to 2.6
      to hold effective steering gain. Based on iterations 0 to 6, where max_error
      stayed at 0.061 m under every other lever.


      ### Rationale


      The Builder''s proposal changes one lever: wheel_radius from 0.03 to 0.04 m,
      on the iteration-2 row (16 mm sensors at x = -0.05 to +0.05 m, y = 0.04 m, mass
      0.8 kg, wheel_track 0.12 m). Iteration 2 is the best-scoring pairing (26.9949,
      zero line loss on oval and slalom). Across iterations 0 to 6, max_error has
      stayed at about 0.061 m under every change tried: span (iteration 1), footprint
      (2), kp 3.0 to 4.4 (2, 4), wheel_track 0.15 (4), mass 0.6 (5), and y 0.02 to
      0.06 (3, 6). Span is the only lever that changed line loss.


      Wheel radius changes the controller''s effective gain. Yaw rate is the wheel-speed
      difference divided by wheel_track, and wheel speed is radius times rotation
      rate. A 0.04 m radius therefore gives 1.33 times the yaw per unit of PWM difference.
      To keep the effective steering gain at the iteration-2 level, I scale kp from
      3.5 to 2.6 (3.5 / 1.33, rounded). Without this, any change in max_error could
      not be attributed to geometry. The other controller values match iteration 2:
      ki 0, kd 0.05, base_speed 1.6, last_direction recovery and weights [-1, -0.5,
      0, 0.5, 1]. Base speed is kept, so the robot''s ground speed rises by the radius
      ratio. That is the Builder''s intended speed effect.


      Expected result (a prediction, not a measurement): line loss stays at zero.
      max_error moves only if the excursion depends on speed or the entry transient.
      If it stays at about 0.061 m, the excursion is a fixed bias that no tested lever
      removes.


      - [Open this output](iteration-7/entity1/versions/c4e4b9cf7fe74304b07e310239d057df/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/c3ec5eac075b4ebfa8fc824e7f78374c/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-5d646bdfd3b46405/payload.json)'
  - id: entityR1
    label: 'Feedback: radius, then'
    notes: 'Pre-race feedback that supports the radius test and proposes a narrower
      wheel_track if max_error stays at 0.061 m. Notes that the y = 0.02 test was
      already run in iteration 6.


      ### Feedback


      Written before this candidate races. Evidence from earlier iterations: iteration
      2 (16 mm, x = ±0.05 m, y 0.04, kp 3.5) is the best pairing at 26.9949 with zero
      line loss on oval and slalom. Iteration 1 showed span removes line loss. Iterations
      2 to 6 showed max_error stays at about 0.061 m under footprint change (2), kp
      3.0 to 4.4 (2, 4), wheel_track 0.15 (4), mass 0.6 (5) and y 0.02 to 0.06 (3,
      6). Iteration 6 (y 0.02) scored the same as iteration 2, so the y = 0.02 test
      you proposed has already been run and did not move the excursion.


      Wheel radius is a sound lever to test, because it raises the speed per wheel
      rotation. It also raises yaw per unit of PWM difference by about 33 percent,
      since yaw is wheel-speed difference over wheel_track. I have scaled kp to 2.6
      to keep the effective steering gain at the iteration-2 level, so any change
      in max_error reflects the geometry. I make no prediction of this robot''s result.


      What to do next depends on the race. If max_error stays at about 0.061 m with
      line loss at zero, the excursion is not speed or radius, and geometry alone
      has not removed it. In that case, hold the current row and test the one lever
      no iteration has tried, a narrower wheel_track. If line loss returns at 0.04
      m radius, hold radius at 0.03 m and keep the iteration-2 row.


      ### Requested changes


      - Keep the iteration-2 row (16 mm, x = ±0.05 m, y 0.04 m, mass 0.8 kg, wheel_track
      0.12 m) and test wheel_radius 0.04 m as the single change; report max_error
      and line_loss_events per track.

      - If max_error stays at about 0.061 m with line loss at zero, try wheel_track
      0.10 m (narrower, more yaw per PWM difference) on the 0.04 m radius, since wheel_track
      has only been tested at 0.15 m.

      - If line loss returns at 0.04 m radius, revert radius to 0.03 m and hold the
      iteration-2 row, since no tested change has improved on it.


      - [Open this output](iteration-7/entityR1/versions/c4e4b9cf7fe74304b07e310239d057df/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/c3ec5eac075b4ebfa8fc824e7f78374c/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-5d646bdfd3b46405/payload.json)'
