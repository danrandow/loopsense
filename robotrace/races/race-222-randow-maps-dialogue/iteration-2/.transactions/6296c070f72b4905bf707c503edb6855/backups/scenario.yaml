map:
  id: race-222-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: 16mm sensors, same span
    notes: 'Raises sensor footprint from 12 mm to 16 mm, keeping the ±0.05 m span
      that removed line loss in iteration 1. Iteration 1 showed max_error still at
      about 0.061 m against the 0.06 m off-track limit, and the body cannot widen
      that limit, so this tests whether larger footprints extend sensing margin.


      ### Rationale


      Iteration 1 changed the sensor span from x = ±0.024 m to ±0.05 m with 12 mm
      footprints. Line-loss events fell to 0 on the oval and slalom and to 1 per run
      on the s-bend, down from 1 per run on every track. The coverage hypothesis is
      therefore supported: the outer sensors were the cause of line loss.


      The runs still end off_track on all three tracks, and max_error is still about
      0.061 m against the 0.060 m limit. The off-track limit is max(0.06, 0.0125 +
      body_width/4). Widening the body cannot raise it above 0.06 within the allowed
      range, since 0.0125 + 0.18/4 = 0.0575. So the body cannot help. RMS error stayed
      near 0.03 m and steering oscillation is low (about 0.07). This points to a steady
      excursion of about 0.061 m, not jitter and not line loss.


      I am following the Integrator''s rule for this case: line loss is largely gone
      and max_error is near 0.06 with low RMS, so I am moving to a 16 mm footprint
      at the same positions. The larger footprint extends the outer sensors'' reach
      to about 0.0705 m from centre (0.05 + 0.008 + 0.0125 is the edge of the tape
      plus footprint), which gives more margin before a sensor loses the tape and
      may give the controller an earlier signal near the limit. I did not change the
      look-ahead, because oscillation is not the limit. Wheels, body and mass are
      unchanged so the sensing change is isolated.


      Expected result: line_loss_events stay near 0, and max_error drops below about
      0.058 m or runs get further through the course. I am not confident the drop
      will happen, because the 0.061 m excursion may come from the controller''s weak
      gain (kp 3.0) rather than from sensing. If max_error stays at about 0.061 with
      the 16 mm footprint, the next geometry question is the look-ahead, not the footprint.


      - [Open this output](iteration-2/entity0/versions/6badac39a0064489b3353e95b8c99adb/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-e8efdf894fcd0ead/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-836bc1b2c53364b5/payload.json)'
  - id: entity1
    label: Complete Robot Package
    notes: 'Complete Robot Package. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 0 raced the baseline geometry (five 12 mm sensors at x = -0.024 to
      +0.024, y = 0.04) and scored 26.04. All 60 trials on all three tracks ended
      off_track with one line-loss event each, progress of 0.04 to 0.12, and RMS error
      of about 0.03. The tracking was fine while the line was in view; the failure
      was line loss at the edge. Outer sensors at x = 0.024 reach the line only up
      to about 0.0425 m offset (0.024 + 0.0125 tape half-width + 0.006 footprint half-width),
      so a drift past that loses the line, throttle drops to 0.35, and the robot leaves
      the track. The Builder''s new geometry widens the row to +/-0.05 m with the
      same 12 mm footprints, which extends coverage to about 0.0685 m offset, past
      the 0.06 m off-track limit. The sensing change is therefore the right fix for
      the binding limit. I am keeping the controller as close as possible to the proven
      baseline so the race isolates the sensing change: kp 3.0, ki 0, kd 0.05, base_speed
      1.6, and last_direction line recovery. The weights are rescaled to the new positions,
      with the same proportional pattern [-1, -0.5, 0, 0.5, 1] matching x / 0.05.
      One caveat: with wider sensor spacing the signal changes more slowly per millimetre
      of offset, so the effective steering gain is somewhat lower. I am not raising
      kp yet because the only evidence so far is that the robot tracks well when it
      keeps the line. If the next race shows max_error still near 0.06 with no line
      loss, the next step is kp of about 3.5 to 4.0, not a geometry change. Expected
      result: line_loss_events near zero, runs ending by completion or stall, and
      progress well above 0.12. This is a prediction, not a measurement.


      - [Open this output](iteration-1/entity1/versions/0d2ea50cc33d470ab4486dcda87bd639/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/2f43c43794724d94aa5ae83a76d8f382/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-c418bc01098c3d0a/payload.json)'
  - id: entityR1
    label: Integration Feedback
    notes: 'Integration Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Iteration 0 is the only race evidence. All 60 trials ended off_track with one
      line-loss event each, and RMS error stayed near 0.03. That points to coverage
      at the sensor row edges, not tracking precision: the outer sensors at x = 0.024
      stop seeing the 25 mm tape beyond about 0.0425 m offset, and the robot runs
      off after losing the line. Your +/-0.05 m span addresses this directly, which
      I have built into the controller. From the controller side, widening the row
      lowers the signal change per millimetre of offset, so the steering gain is somewhat
      weaker than in the baseline; I kept kp at 3.0 to isolate the sensing change.
      I have not seen per-step telemetry or any evidence of outer-sensor saturation,
      so I am not able to confirm the saturation risk you raised in iteration 0. For
      the next proposal, decide from the next race. If line_loss_events are still
      above about 0.5 per run with the wider span, hold the geometry and check the
      controller''s line recovery before changing sensors. If max_error comes close
      to 0.06 without line loss, the 16 mm footprint (coverage about 0.0685 m + 0.002
      m) is worth trying so the outer sensors reach further, but only if rms_error
      is low. If line loss is gone and steering_oscillation rises, the longer look-ahead
      (y near 0.06) is the next option.


      ### Requested changes


      - Keep sensor span at x = +/-0.05 m with 12 mm footprints for the next race,
      and report line_loss_events and whether runs end by completion, stall or off_track.

      - If max_error is near 0.06 with line loss gone, try sensor_size 0.016 with
      the same positions to add coverage margin beyond the current 0.0685 m reach.

      - If steering_oscillation rises once line loss is removed, try sensor y = 0.06
      before changing the sensor span again.


      - [Open this output](iteration-1/entityR1/versions/0d2ea50cc33d470ab4486dcda87bd639/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/2f43c43794724d94aa5ae83a76d8f382/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-c418bc01098c3d0a/payload.json)'
