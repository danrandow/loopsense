map:
  id: race-129-randow-maps
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Agile body, narrow track
    notes: 'Keeps the iteration 2 sensors, since span, footprint and lead changes
      moved max_error by under 0.001 m. Reduces mass to 0.5 kg, body length to 0.12
      m and track to 0.10 m to test whether turning authority limits line following.


      ### Rationale


      Iteration 2 (lead moved to y = 0.04 m) scored 50.07, slightly below iteration
      1 (50.13). Line_loss_events stayed at 1 on the oval, s-bend and slalom, and
      max_error stayed at 0.061 to 0.069. Progress is still only 0.10 to 0.15 and
      oscillation is low. Across three iterations, the sensor span (±0.02 to ±0.03
      m), the footprint (12 to 16 mm) and the lead (0.05 to 0.04 m) have each changed
      max_error by less than 0.001 m. The sensor array is therefore not the binding
      limit. The robot is leaving the tape with a steady drift rather than oscillating,
      which suggests the body cannot turn quickly enough for the bends at its current
      speed. Two geometry levers affect turning directly. Yaw inertia is mass*(body_length²+body_width²)/12,
      so a shorter body and lighter mass reduce the inertia the wheels must overcome.
      Turn rate is the wheel-speed difference divided by wheel_track, so a narrower
      track gives more turn rate per unit of PWM difference. This iteration keeps
      the sensor array from iteration 2 exactly, so the score change can be attributed
      to the drivetrain and body. I reduce mass from 0.6 to 0.5 kg, shorten body_length
      from 0.18 to 0.12 m, and narrow wheel_track from 0.12 to 0.10 m. I expect line_loss_events
      to fall below 1 on the bends and max_error to drop below 0.06 on at least the
      s-bend and slalom. The completion_time question stays open until the robot holds
      the line.


      - [Open this output](iteration-3/entity0/versions/bc40344985f0401d8afb7a3b3cdc22d2/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-9706b82904ad5243/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-ca64e515d1c18faa/payload.json)'
  - id: entity1
    label: Lead 40mm, same
    notes: 'Moves the sensors to y = 0.04 m with the iteration 1 controller unchanged,
      to test whether the 50 mm lead is causing line loss on bends. Rests on iteration
      1 showing max_error of 0.0615 to 0.0687 and one line-loss event per track.


      ### Rationale


      Iteration 1 widened the array to x = ±0.03 m with 16 mm footprints, and the
      score rose only from 49.47 to 50.13. Every track still ends off-track, with
      max_error between 0.0615 and 0.0687 and one line-loss event per track. Progress
      is only 0.10 to 0.15, and steering oscillation stayed low (0.07 to 0.15), so
      the failure is drift away from the tape, not jitter. The Builder''s proposal
      moves the array from y = 0.05 m to y = 0.04 m and keeps the span, footprint,
      weights, body, mass and wheels unchanged. I therefore keep the iteration 1 controller
      (base_speed 1.6, kp 3.0, ki 0.05, kd 0.1, last_direction line loss) so that
      this race isolates the lead change. Shortening the lead gives the controller
      less delay between seeing the tape and steering, which is the rule set in iteration
      1. Steering oscillation may rise slightly with the shorter lead, but the iteration
      1 range gives room, so I do not lower kp yet. Expected result, which I will
      check against the race: line_loss_events falls to 0 on the slalom and s-bend,
      and max_error stays below 0.06.


      - [Open this output](iteration-2/entity1/versions/af2814f39427420db7661d24c1355f7c/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/d97accb7afbe42e9be0b7a219748c930/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-02a7d58de7769034/payload.json)'
  - id: entityR1
    label: Shorter lead, next steps
    notes: 'Pre-race feedback: keep the 0.04 m lead if line loss clears, widen to
      ±0.04 m if it persists, and move to mass or wheel radius if the robot holds
      the line but is slow. Iteration 0 and 1 results show the span alone did not
      fix drift.


      ### Feedback


      Written before this candidate has raced. Iteration 0 (no completions, all 60
      trials off-track, max_error 0.062 to 0.069, line loss 1 to 2, oscillation 0.07
      to 0.15) showed that the array''s span was the first limit. Iteration 1 (±0.03
      m, 16 mm, kp 3.0, kd 0.1) barely moved the score (49.47 to 50.13): line loss
      stayed at 1 per track and max_error stayed at 0.0615 to 0.0687, so the span
      is not the main limit. I built this package on the Builder''s y = 0.04 m lead
      and kept the iteration 1 controller so the lead change is isolated. Interpret
      the next race as follows. If line_loss_events reaches 0 on the slalom and s-bend
      and max_error stays below 0.06, keep the 0.04 m lead and move to speed (mass
      or wheel radius). If line loss or max_error ≥ 0.06 persists on the slalom or
      s-bend, the sensors are not reaching far enough to catch the tape at the bends,
      so widen the span further. If the robot finishes the course slowly, or holds
      the line and still exceeds 3.0 s, the limit is speed.


      ### Requested changes


      - If the next race still shows line_loss_events ≥ 1 or max_error ≥ 0.06 on the
      slalom or s-bend (iteration 1 showed this at y = 0.05 m), widen the span to
      x = ±0.04 m (x = -0.04, -0.02, 0, 0.02, 0.04) with sensor_size 0.016 and keep
      weights [-2,-1,0,1,2]; iteration 1 shows ±0.03 m alone did not stop line loss.

      - If the next race keeps the line (line_loss_events 0, max_error < 0.06) but
      completion_time stays above 3.0 s, reduce mass from 0.6 to 0.5 kg or raise wheel_radius
      from 0.03 to 0.035 m; iteration 1 progress of 0.10 to 0.15 with no completions
      suggests the robot is leaving the track before the speed limit matters, so change
      speed only after line loss is fixed.

      - If the next race shows max_error rising above the iteration 1 value (0.0615
      to 0.0687) after the lead change, return the sensors to y = 0.05 m and try sensor_size
      0.012 at ±0.03 m; iteration 0 (12 mm footprint) and iteration 1 (16 mm footprint)
      differed in both span and footprint, so the footprint effect is not yet isolated.


      - [Open this output](iteration-2/entityR1/versions/af2814f39427420db7661d24c1355f7c/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/d97accb7afbe42e9be0b7a219748c930/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-02a7d58de7769034/payload.json)'
