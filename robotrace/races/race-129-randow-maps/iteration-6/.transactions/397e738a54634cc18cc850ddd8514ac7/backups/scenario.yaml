  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Lighter mass 0.5 kg test
    notes: 'Keeps the iteration 5 wheel radius (0.035 m) and sensor layout, and changes
      only mass from 0.6 to 0.5 kg. Iteration 5 raised s-bend progress to 0.155 with
      max_error under 0.069, which meets the Integrator''s condition for mass as the
      next lever.


      ### Rationale


      Iteration 5 (wheel_radius 0.035 m, sensor_size 0.012 m, body 0.18 x 0.12 m,
      mass 0.6 kg, track 0.12 m) scored 51.01, the best so far. Progress rose on every
      track where it was measured: s-bend 0.155 (from 0.15 in iteration 4), oval 0.11
      and slalom 0.107. Max_error stayed below the 0.069 threshold on all three tracks
      (oval 0.0613, s-bend 0.065, slalom 0.0663), and line loss stayed at one event
      per track. The Integrator''s pre-race rule said that if progress rises above
      0.15 and max_error stays below 0.069, speed is helping, so the next lever is
      mass alone. Across iterations 0 to 4, sensor span, footprint, lead and body/track
      changes each left max_error almost unchanged, so the sensor layout is not the
      constraint. Iteration 3 lowered progress when body and track changed, so I keep
      those at the iteration 5 values. I change only mass, from 0.6 to 0.5 kg, to
      reduce yaw and linear inertia at the higher ground speed. I expect progress
      to rise above 0.155 on the s-bend and slalom, with max_error staying at or below
      about 0.069. If max_error rises above 0.069 while progress also rises, the robot
      is drifting faster than it corrects, and I will return wheel_radius to 0.03
      m as the Integrator advised.


      - [Open this output](iteration-6/entity0/versions/1cd49f099ec846aeb508d53ed938cf2a/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-e20bc8bd18f2f93e/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-139f3f14b9a945c5/payload.json)'
  - id: entity1
    label: Complete Robot Package
    notes: 'Complete Robot Package. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      The Builder''s geometry (wheel_radius 0.035 m, sensors at x = -0.03 to 0.03
      m and y = 0.04 m, sensor_size 0.012 m, body 0.18 x 0.12 m, mass 0.6 kg, track
      0.12 m) is valid against the contract. Iterations 0 to 4 all ended off-track
      with max_error between 0.061 and 0.069, one line-loss event per track, and progress
      of 0.10 to 0.15. Controller changes have not moved that result. Raising kp from
      2.5 to 3.0 with kd 0.05 to 0.1 (iterations 0 to 1) changed max_error by under
      0.001 m. Raising ki from 0.05 to 0.3 with the 12 mm footprint (iteration 4,
      50.1218) reproduced iteration 1 almost exactly: oval 0.0615, s-bend 0.0691,
      slalom 0.0687. So the integral term is not cancelling a bias, and the footprint
      is not the limit. The Builder''s test is wheel_radius 0.035 m, which raises
      ground speed for the same PWM. To keep that test clean I change nothing in the
      controller. I keep the iteration 4 gains (kp 3.0, ki 0.3, kd 0.1), base_speed
      1.6, last_direction line loss and the five-weight signal [-2,-1,0,1,2], so any
      change in progress or max_error is attributable to wheel_radius. ki 0.3 is kept,
      not reverted, because it showed no harm and reverting would add a confound.
      Expected behaviour: progress rises with speed, and max_error stays below about
      0.069. If it rises, speed is increasing drift.


      - [Open this output](iteration-5/entity1/versions/c48a27b146a14bcf9c0448d30f8a3e04/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/c4a82bb31fe04a7294d18131258ffd1d/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-93eaa28110cee0d6/payload.json)'
  - id: entityR1
    label: Integration Feedback
    notes: 'Integration Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Written before this candidate has raced. Evidence from earlier races: iteration
      0 (kp 2.5, ki 0.05) and iteration 1 (kp 3.0, kd 0.1) differed by under 0.001
      m in max_error. Iteration 4 (ki 0.3) matched iteration 1 almost exactly (oval
      0.0615, s-bend 0.0691, slalom 0.0687), so the integral term does not cancel
      a steady bias. I therefore kept the iteration 4 controller unchanged, so your
      wheel_radius change is tested alone. Iterations 2 and 3 show that span, lead
      and body/track changes also leave max_error unchanged, and the narrower track
      in iteration 3 lowered s-bend progress from 0.15 to 0.13. Interpret the next
      race as follows. If progress rises above 0.15 and max_error stays below 0.069,
      speed is helping. Keep wheel_radius 0.035 m and test mass alone next. If progress
      rises but max_error goes above 0.069, speed is increasing drift. Return wheel_radius
      to 0.03 m and reduce mass as in request 2. If progress and max_error both stay
      at iteration 4 levels, speed is not the limit. Test the track as in request
      3.


      ### Requested changes


      - If progress rises above 0.15 and max_error stays below 0.069 on the s-bend
      and slalom, keep wheel_radius 0.035 m and reduce mass alone from 0.6 to 0.5
      kg. Iterations 0 to 4 show progress stuck at 0.10 to 0.15 with no completions,
      so the next limit is inertia once speed is up. Mass is the cleaner lever, since
      body_length and track changes in iteration 3 lowered progress.

      - If progress rises but max_error goes above 0.069, speed is increasing drift.
      Return wheel_radius to 0.03 m and set mass to 0.5 kg. Iteration 4 shows max_error
      sits at 0.0615 to 0.0691 across all tracks, so any rise above 0.069 points to
      speed, not sensor coverage.

      - If progress and max_error are both unchanged from iteration 4 (oval 0.11,
      s-bend 0.15, slalom 0.105; max_error 0.061 to 0.069), speed is not the limit.
      Try wheel_track 0.14 m with wheel_radius 0.035 m and mass 0.6 kg. Iteration
      3 showed that narrowing the track to 0.10 m lowered s-bend progress from 0.15
      to 0.13, so widening it is the opposite test, and it reduces turn rate per unit
      of PWM difference.


      - [Open this output](iteration-5/entityR1/versions/c48a27b146a14bcf9c0448d30f8a3e04/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/c4a82bb31fe04a7294d18131258ffd1d/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-93eaa28110cee0d6/payload.json)'
