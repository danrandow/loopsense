map:
  id: race-205-randow-maps-muted
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Faster wheels, wider
    notes: 'Raises wheel_radius to 0.040 m and wheel_track to 0.10 m, keeping the
      radius-to-track ratio near the best s-bend value, with the iteration 4 sensor
      array unchanged. The change targets the slalom progress plateau (about 0.17
      across all designs), which points at ground speed rather than sensing. Evidence:
      iteration 4 (score 404.6) is the best design, and the 0.016 m and 0.008 m footprint
      tests both scored lower.


      ### Rationale


      Evidence across eight iterations. The best design is still iteration 4 (score
      404.6): 5 sensors at y=0.08 m, 0.015 m pitch, 0.012 m footprint, wheel_track
      0.09 m, wheel_radius 0.035 m, mass 0.6 kg. It finishes 20/20 on the oval, with
      s-bend progress 0.486 and slalom progress 0.177. Two sensor-footprint tests
      bracket the 0.012 m choice. At 0.016 m the oval collapsed to 0/20 (score 72.5).
      At 0.008 m the oval held at 20/20, but s-bend progress fell to 0.32 and the
      score dropped to 383.9. So 0.012 m stays. Wheel track is also tuned: 0.08 m
      cut s-bend progress to 0.33 and 0.10 m (iteration 1, at y=0.07) was weaker than
      0.09 m. The s-bend limit appears to depend on the ratio of wheel_radius to wheel_track,
      since yaw rate scales with wheel speed over track and wheel speed scales with
      radius. The slalom has stalled at progress 0.16 to 0.18 across every design
      tried (iterations 1, 3, 4, 5, 7), whatever the track, row position or footprint.
      Sensing and turn-rate levers look exhausted, so the untested lever is ground
      speed. The contract''s speed relation (wheel_radius times rotation rate) and
      the 3 s finish limit (about 1.5 m/s average needed) both point at the wheel
      radius. Radius scales both top speed and turn rate, so I raise wheel_radius
      from 0.035 to 0.040 m and widen wheel_track from 0.09 to 0.10 m. That keeps
      the radius-to-track ratio near 0.40, close to the 0.389 that gave the best s-bend
      result, so the turn authority should stay similar while ground speed rises about
      14 percent. Everything else stays at the iteration 4 values, so the effect is
      isolated. Expected result: a faster completion time (up to about 60 score points
      from the time term), slalom progress above 0.2, and s-bend progress at or near
      0.49. Main risk: higher speed could push the bends off track, and the Integrator
      should check max_error and line_loss_events first.


      - [Open this output](iteration-8/entity0/versions/46f9f5a5fd6c4dad8520d0fdfaf1c617/payload.json)

      - Based on: [entityR2A](iteration-8/entityR2A/versions/carried-b06a6bc3149ece65/payload.json)'
  - id: entity1
    label: Radius 0.04, track 0.10
    notes: 'Builder''s wheel_radius 0.040 m and wheel_track 0.10 m on the iteration
      4 sensing and controller, with the controller held unchanged to isolate the
      drivetrain change. Based on iteration 4 (404.6) and iteration 1''s weak 0.10
      m track result.


      ### Rationale


      Iteration 4 (404.6, best) is the reference: 5 sensors at y=0.08 m, 0.015 m pitch,
      0.012 m footprint, wheel_track 0.09 m, wheel_radius 0.035 m, mass 0.6 kg, with
      the controller base_speed 1.7, kp 2.5, ki 0.05, kd 0.4, weights -2 to +2, last_direction.
      Its oval finished 20 of 20 and s-bend progress was 0.486. The Builder''s proposal
      raises wheel_radius from 0.035 to 0.040 m (about 14% more wheel speed for the
      same PWM) and widens wheel_track from 0.09 to 0.10 m. Sensing is unchanged,
      so the drivetrain is the only variable. Iteration 1 (track 0.10, y=0.07) gave
      s-bend progress 0.236, against 0.446 at track 0.09 (iteration 3), so a 0.10
      m track alone has cost s-bend progress before. I keep the Builder''s geometry
      as proposed to test the speed lever. For the controller I keep kp 2.5 and kd
      0.4, since the ratio of radius to track is close to the iteration 4 value and
      the turn authority should stay similar. I keep base_speed at 1.7 so that speed
      comes only from the larger wheel radius and the effect stays isolated. ki 0.05
      and last_direction are unchanged. Expected result: a shorter completion time
      than iteration 4''s 1.73 s on the oval, and slalom progress above the 0.18 plateau
      if speed is the limit. s-bend progress is the main risk, because the wider track
      may cost turn authority again.


      - [Open this output](iteration-8/entity1/versions/1279545f314b4b8c822257abd48911e9/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/46f9f5a5fd6c4dad8520d0fdfaf1c617/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-b06a6bc3149ece65/payload.json)'
  - id: entityR1
    label: Track 0.09 fallback, mass
    notes: 'Feedback gives conditional next steps: fall back to track 0.09 m if s-bend
      collapses, try mass 0.5 kg if the slalom stays flat, and revert radius if oval
      stability drops. Each step is tied to iteration 1, 3, 4 and 5 results.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Evidence
      from earlier races: iteration 4 (404.6, best) gave 20 of 20 oval finishes and
      s-bend progress 0.486 at wheel_radius 0.035 m and wheel_track 0.09 m. Iteration
      1 (337.6) showed that wheel_track 0.10 m alone, at y=0.07 m, left s-bend progress
      at 0.236, against 0.446 at 0.09 m (iteration 3). So the track width matters
      for the s-bend independently of the radius-to-track ratio, and the ratio argument
      is not yet proven. The slalom has stayed at progress 0.16 to 0.18 across iterations
      1, 3, 4 and 5 whatever the track, row position or footprint, which points to
      speed or lag, not sensing. Iteration 6 showed that a 0.016 m footprint collapsed
      the oval, and iteration 2 showed a wider array raised oscillation, so sensing
      stays fixed. Depending on the next race: if the s-bend holds at 0.45 or above
      and the oval keeps 18 or more finishes, keep radius 0.040 m and try lower mass
      for acceleration. If the s-bend falls below about 0.4 with track 0.10 m, the
      track is the cause, so return it to 0.09 m. If the oval finishes fall below
      17 or oscillation exceeds about 0.3, return radius to 0.035 m, as the speed
      gain is then costing stability.


      ### Requested changes


      - If s-bend progress falls below about 0.4 with wheel_track 0.10 m (iteration
      1 gave 0.236 at 0.10 m versus 0.446 at 0.09 m in iteration 3), keep wheel_radius
      0.040 m but set wheel_track to 0.09 m, which separates the speed effect from
      the track effect.

      - If the slalom stays at 0.17 to 0.18 progress with max_error near 0.06 (iterations
      1, 3, 4 and 5), try mass 0.5 kg at wheel_radius 0.040 m, since acceleration
      is untested and sensing and track changes have not moved the slalom.

      - If oval finishes fall below 17 of 20 or steering_oscillation exceeds about
      0.3, return wheel_radius to 0.035 m and wheel_track to 0.09 m, the iteration
      4 values that gave 20 of 20 oval finishes.


      - [Open this output](iteration-8/entityR1/versions/1279545f314b4b8c822257abd48911e9/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/46f9f5a5fd6c4dad8520d0fdfaf1c617/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-b06a6bc3149ece65/payload.json)'
