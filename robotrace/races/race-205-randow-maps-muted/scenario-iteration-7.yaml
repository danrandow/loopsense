map:
  id: race-205-randow-maps-muted
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Smaller sensor footprint
    notes: 'Reverts the 0.016 m footprint that collapsed the oval (score 72.5) and
      tests 0.008 m on the iteration 4 base (score 404.6), the best design so far.
      Only sensor_size changes, so the result isolates whether a sharper edge reading
      lifts the slalom plateau of about 0.17.


      ### Rationale


      Iteration 6 is a clear negative result. Enlarging the sensor footprint from
      0.012 m to 0.016 m collapsed the oval from 20/20 finishes to 0/20 (score 72.5,
      down from 404.6), with line-loss and off-track ends everywhere. A larger footprint
      therefore blurs the edge of the tape and weakens the steering signal, so I revert
      to 0.012 m and the iteration 4 base, which is the best design so far (404.6).
      The reverse direction is untested. Since 0.016 m hurt, a smaller footprint (0.008
      m) should give a sharper, more edge-localised reading on the tight bends where
      the slalom stalls. Slalom progress has sat at about 0.16 to 0.18 across every
      design, and the s-bend stalls at max_error about 0.062 to 0.063. The clearest
      unexplored sensing lever is the footprint in that direction. Everything else
      stays at the iteration 4 values (wheel_track 0.09, wheel_radius 0.035, mass
      0.6, row at y=0.08, 5 sensors at 0.015 m pitch) so the effect can be isolated.
      I expect slalom progress above 0.2 and s-bend progress at or above 0.49, with
      the oval still finishing 20 of 20. The risk is that a smaller footprint sees
      less tape at bend entries and raises line-loss events, which the Integrator
      should check first.


      - [Open this output](iteration-7/entity0/versions/be237167d0eb4b5fb779004ae8f18dae/payload.json)

      - Based on: [entityR2A](iteration-7/entityR2A/versions/carried-180b46ae5cf623d8/payload.json)'
  - id: entity1
    label: Smaller footprint 0.008 m
    notes: 'Iteration 4 base with only sensor_size changed from 0.012 to 0.008 m,
      as the Builder proposed, to isolate the footprint direction. The 0.016 m footprint
      collapsed the oval in iteration 6, so the smaller size is the remaining sensing
      direction to test.


      ### Rationale


      Iteration 4 (404.6, best) is the reference: 5 sensors at y=0.08 m, 0.015 m pitch,
      0.012 m footprint, wheel_track 0.09 m, with the iteration 4 controller. It finished
      20 of 20 oval runs with steering_oscillation 0.205 and s-bend progress 0.486.
      Iteration 5 (wheel_track 0.08) cut s-bend progress to 0.330, so 0.09 m stays.
      Iteration 6 (0.016 m footprint, same controller) collapsed the oval to 0 of
      20 (score 72.5), so a larger footprint is ruled out. The untested direction
      is a smaller footprint. The Builder''s proposal sets sensor_size to 0.008 m
      and changes nothing else, which isolates the footprint effect. The controller
      is therefore kept identical to iteration 4 (base_speed 1.7, kp 2.5, ki 0.05,
      kd 0.4, weights -2 to +2, last_direction) so the signal scale and gains do not
      change. Sensor weights are proportional to x and a reading-weighted average,
      so the signal scale is independent of footprint. The main risk is that a 0.008
      m footprint sees less tape at bend entries, so the sum of readings may fall
      below 0.05 and raise line_loss_events. I check that first. Expected behaviour
      is a sharper edge response, but this is a prediction that the race has not tested.


      - [Open this output](iteration-7/entity1/versions/5654757202754d4991ee96852abad80e/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/be237167d0eb4b5fb779004ae8f18dae/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-180b46ae5cf623d8/payload.json)'
  - id: entityR1
    label: Footprint test feedback
    notes: 'Feedback on the 0.008 m test: iteration 4 (20/20 oval, s-bend 0.486) is
      the base, 0.08 m track (iteration 5) and 0.016 m footprint (iteration 6) are
      ruled out, and the slalom plateau at 0.16 to 0.18 points to speed as the next
      lever. Each requested change names the earlier evidence behind it.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. The Integrator
      kept your iteration 4 controller and drivetrain exactly (base_speed 1.7, kp
      2.5, kd 0.4, wheel_track 0.09, row at y=0.08 m), so the footprint is the only
      variable against iteration 4 (404.6). Evidence: iteration 4 gave 20 of 20 oval
      finishes and s-bend progress 0.486. Iteration 5 showed that wheel_track 0.08
      m cut s-bend progress to 0.330, so 0.09 m stays. Iteration 6 showed that a 0.016
      m footprint collapsed the oval to 0 of 20 (score 72.5), so a larger footprint
      is ruled out. Iteration 2 showed that a wider array raised oscillation to 0.37
      and cut finishes, so the span stays. Slalom progress has held at 0.16 to 0.18
      in iterations 1, 3, 4 and 5 with max_error near 0.06, which points away from
      track width and row position. Depending on the next race: if line_loss_events
      stay at or below about 0.95 per run and the oval keeps 20 of 20 with s-bend
      progress at or above 0.45, keep 0.008 m and test wheel_radius next, since speed
      is the remaining untested lever on the slalom. If line_loss_events rise above
      1.0 per run or the oval drops below 17 finishes, the smaller footprint is missing
      bend-entry edges, so return to 0.012 m (the iteration 4 base) and test wheel_radius
      on that footprint.


      ### Requested changes


      - If line_loss_events stay at or below about 0.95 per run and oval finishes
      hold at 20 of 20 with s-bend progress at or above 0.45, keep sensor_size 0.008
      m and try wheel_radius 0.04 m. This is supported by iteration 4 (404.6, 20 of
      20 at 0.012 m) and by the plateau of slalom progress at 0.16 to 0.18 across
      iterations 1, 3, 4 and 5, which does not respond to sensing or track width.

      - If line_loss_events rise above 1.0 per run or oval finishes fall below 17
      of 20 with sensor_size 0.008 m, return sensor_size to 0.012 m (the iteration
      4 value) and keep wheel_track 0.09 m. Iteration 6 (0.016 m) showed that changing
      the footprint in either direction can collapse the oval, so the change must
      be checked on the oval first.

      - If the slalom progress stays at about 0.17 to 0.18 with max_error near 0.06
      under either footprint, try mass 0.5 kg with wheel_radius 0.035 m for faster
      yaw response. Iteration 5 showed that turn response, not track width alone,
      is what the s-bend depends on, and the slalom has not moved under any sensing
      or track change so far.


      - [Open this output](iteration-7/entityR1/versions/5654757202754d4991ee96852abad80e/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/be237167d0eb4b5fb779004ae8f18dae/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-180b46ae5cf623d8/payload.json)'
