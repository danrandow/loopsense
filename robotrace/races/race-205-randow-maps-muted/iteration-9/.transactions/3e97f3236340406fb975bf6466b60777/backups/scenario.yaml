  id: race-205-randow-maps-muted
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Lighter mass, 0.5 kg
    notes: 'Iteration 8 geometry (best so far, 417.9) with only mass reduced from
      0.6 to 0.5 kg, to test whether lower yaw inertia lifts the slalom progress plateau
      at about 0.18. Evidence: s-bend progress rose to 0.655 with the wider radius
      and track, while slalom stayed flat across all sensing and turn-rate changes.


      ### Rationale


      Eight races are now on record. Iteration 8 is the best so far (417.9). It raised
      wheel_radius from 0.035 to 0.040 m and widened wheel_track to 0.10 m, which
      kept the radius-to-track ratio near the value that worked before. The s-bend
      progress rose from 0.486 to 0.655, which was the main source of the gain. The
      oval fell slightly from 20/20 to 19/20 finishes, with steering_oscillation rising
      from about 0.21 to 0.31. The slalom did not move: progress has sat at 0.16 to
      0.18 in every design tested, whatever the track width, row position, footprint
      or radius. Sensing (footprint 0.008 and 0.016 m, span widening) and turn authority
      have both been tested, so the remaining untested lever on that plateau is the
      inertia the robot must overcome in a turn. Yaw inertia is mass*(L^2+W^2)/12,
      and mass also sets acceleration through the drivetrain. I therefore make one
      change relative to iteration 8: mass from 0.6 to 0.5 kg, the lowest step that
      is clearly lighter. Everything else stays at the iteration 8 values, so the
      effect is isolated. I expect faster response on the slalom and s-bend, which
      should lift slalom progress above 0.2 and keep s-bend near or above 0.65. The
      main risk is that lighter mass reduces wheel grip (slip) or makes the oval jitter
      more, so the Integrator should check steering_oscillation, line_loss_events
      and oval finishes first. If the oval drops below about 18/20 or oscillation
      exceeds 0.35, the next step is to return to 0.6 kg and treat the slalom as a
      controller-side limit.


      - [Open this output](iteration-9/entity0/versions/cdea4e4781e84a1983b9c5fe6f50c554/payload.json)

      - Based on: [entityR2A](iteration-9/entityR2A/versions/carried-2483d39c91178b76/payload.json)'
  - id: entity1
    label: Lighter mass test (0.5kg)
    notes: 'Iteration 8 geometry with mass cut from 0.6 to 0.5 kg, controller unchanged
      so the mass is the only variable. Based on iteration 8 (417.9, best) and the
      slalom plateau at 0.17 to 0.18 across all earlier designs.


      ### Rationale


      Iteration 8 (417.9) is the best evidence so far: wheel_radius 0.040 m and wheel_track
      0.10 m, with the iteration 4 sensing (5 sensors at y=0.08 m, 0.015 m pitch,
      0.012 m footprint). Its oval finished 19 of 20 with steering_oscillation 0.31,
      and its s-bend progress rose to 0.655. The slalom is flat at 0.16 to 0.18 progress
      in every design tested. The Builder''s one change is mass 0.6 to 0.5 kg, which
      cuts yaw inertia by about 17 percent and should speed the response on bends.
      The geometry is therefore the Builder''s proposal unchanged. Sensor weights
      stay at the proportional -2 to +2 scale, because the signal is a reading-weighted
      average and does not depend on mass. The controller is kept identical to iteration
      8 (base_speed 1.7, kp 2.5, ki 0.05, kd 0.4, last_direction), so the mass change
      is the only variable against the best design. Lighter mass may raise oscillation
      on the oval, which the observation request will show. If it does, the next step
      is a kd rise, not a geometry change. Expected result: slalom progress above
      0.2 and oval finishes at or above 18 of 20, with a score above 417.9. This is
      a prediction the race has not tested.


      - [Open this output](iteration-9/entity1/versions/15b4b344c79e48779e7c8b6c0b75619d/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/cdea4e4781e84a1983b9c5fe6f50c554/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-2483d39c91178b76/payload.json)'
  - id: entityR1
    label: 'Feedback: mass then body'
    notes: 'Feedback for the 0.5 kg test: check oval oscillation and finishes first,
      then try a shorter body_length to cut yaw inertia, or return to 0.6 kg if stability
      drops. Cites iterations 1 to 8 for sensing, track and radius evidence.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Evidence:
      iteration 8 (417.9, best) raised wheel_radius to 0.040 m and wheel_track to
      0.10 m, with s-bend progress 0.655 and oval 19 of 20 finishes. Iteration 4 (404.6)
      showed that the 0.09 m track and y=0.08 m row gave 20 of 20 oval finishes. Iteration
      1 showed that a 0.10 m track at y=0.07 m gave only 0.236 s-bend progress, so
      the track width matters separately from the radius. Sensing has been settled.
      Footprint 0.016 m collapsed the oval to 0 of 20 (iteration 6), and 0.008 m held
      the oval but lowered s-bend progress to 0.32 (iteration 7), so 0.012 m stays.
      A wider sensor span raised oscillation and cut oval finishes (iteration 2).
      The slalom has been flat at progress 0.16 to 0.18 across iterations 1, 3, 4,
      5 and 8, which points to speed or reaction time rather than sensing or track.
      Next race: if the oval keeps 18 or more finishes and steering_oscillation stays
      below about 0.35 with s-bend progress at or above 0.6, keep mass 0.5 kg and
      try a shorter body_length to cut yaw inertia further. If oval finishes fall
      below 18 or oscillation exceeds about 0.35, return mass to 0.6 kg, since the
      lighter robot is then losing stability. If slalom progress stays at 0.17 to
      0.18 with max_error near 0.06 under either mass, the limit is controller-side,
      and geometry should not be changed further for it.


      ### Requested changes


      - If steering_oscillation on the oval stays below about 0.35 and s-bend progress
      is at or above 0.6 with mass 0.5 kg, reduce body_length from 0.14 to 0.12 m.
      Yaw inertia scales with (L^2 + W^2), so this is a further inertia cut with no
      direct dynamic cost in the simulator. Iteration 8 (mass 0.6 kg) and this run''s
      mass test give the baseline.

      - If oval finishes fall below 18 of 20 or steering_oscillation exceeds about
      0.35 with mass 0.5 kg, return mass to 0.6 kg and keep the iteration 8 geometry,
      since iteration 8 gave 19 of 20 finishes with oscillation 0.31 at the heavier
      mass.

      - If the slalom progress stays at 0.17 to 0.18 with max_error near 0.06 (iterations
      1, 3, 4, 5, 8), do not change sensing or track again. Keep the geometry at the
      best-supported values and pass the slalom limit to the Integrator as a controller-side
      reaction-time issue.


      - [Open this output](iteration-9/entityR1/versions/15b4b344c79e48779e7c8b6c0b75619d/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/cdea4e4781e84a1983b9c5fe6f50c554/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-2483d39c91178b76/payload.json)'
