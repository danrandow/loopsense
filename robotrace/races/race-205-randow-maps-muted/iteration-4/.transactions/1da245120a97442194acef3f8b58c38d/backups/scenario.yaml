map:
  id: race-205-randow-maps-muted
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Evidence across four races. Iteration 1 (score 337.6) is still the best: 17
      of 20 oval finishes and oval rms_error 0.021. Iteration 2 widened the sensor
      array to ±0.06 m and scored 217.9. Oval finishes fell to 4 of 20, steering_oscillation
      rose from 0.20 to 0.37 and control_effort rose from 7.2 to 10.0, so a wider,
      heavier-weighted sensor span adds jitter without buying correction. Iteration
      3 narrowed wheel_track from 0.10 to 0.09 m on the iteration 1 array and scored
      328.4, slightly below iteration 1. It did improve the oval tracking (rms 0.0146,
      max_error 0.038, oscillation 0.18, faster mean finish 1.715 s) and nearly doubled
      s-bend progress (0.236 to 0.446). But oval finishes dropped from 17 to 13, with
      7 off-track ends, and slalom progress stayed flat at 0.17. The s-bend and slalom
      still end at max_error of about 0.06 to 0.069, which is the off-track limit.
      Turn authority helped the s-bend, but the failure on slalom has not moved, which
      suggests the robot reacts too late to a bend rather than turning too weakly.
      The controller can only correct once the line is under the sensors, so the lookahead
      is the next lever. I keep wheel_track 0.09 (it helped the s-bend and tracking)
      and move the sensor row forward from y=0.07 to y=0.08 m, the top of the allowed
      range. The array stays at the iteration 1 layout (5 sensors, ±0.03 m, 0.015
      m pitch, 0.012 m footprint), so the change isolates lookahead. I expect slalom
      progress to rise above 0.25 and s-bend progress to stay at or above 0.4, with
      oval finishes recovering toward 15 of 20 as the earlier reading reduces the
      late overshoot seen in iteration 3. The main risk is that extra lag adds oscillation
      on the oval, so the Integrator should check steering_oscillation and control_effort
      first.


      - [Open this output](iteration-4/entity0/versions/368d969732da44a8a388448459610bcd/payload.json)

      - Based on: [entityR2A](iteration-4/entityR2A/versions/carried-969a7bd64435cbf4/payload.json)'
  - id: entity1
    label: Revert array, track 0.09
    notes: 'Reverts to the iteration 1 five-sensor layout and narrows wheel_track
      to 0.09 m, with base_speed lowered to 1.7 and kp/kd kept at iteration 1 values.
      Based on iteration 1 (337.6, best) and iteration 2 (217.9), where widening the
      array raised oscillation and cut oval finishes.


      ### Rationale


      Evidence: iteration 1 (score 337.6, best) used the 5-sensor array at ±0.03 m,
      y=0.07, wheel_track 0.10, kp 2.5, kd 0.4, base_speed 1.8. It finished 17 of
      20 oval runs, with rms_error 0.021 and steering_oscillation 0.20. Iteration
      2 widened the array to ±0.06 m with 7 sensors and kp 3.0. That cut oval finishes
      to 4 of 20, raised steering_oscillation to 0.37 and control_effort to 10.0,
      and gave no clear gain on the bends. So I keep the iteration 1 sensing and do
      not raise kp. Entity0 proposes reverting the array and narrowing wheel_track
      from 0.10 to 0.09 m. Narrowing raises turn rate per unit of turn by about 11%
      (0.10/0.09), which is the authority the bends lack. I keep kp at 2.5 so the
      extra authority does not add oscillation on the oval. I keep kd at 0.4 for damping.
      I lower base_speed from 1.8 to 1.7. On the bends the robot leaves the track
      at the 0.06 m limit, and iteration 2 at 1.7 raised s-bend progress from 0.236
      to 0.316, although that change was confounded with the array. Oval mean finish
      at 1.8 was 1.73 s, so 1.7 should still leave room under 3 s. Expected result:
      max_error on s-bend and slalom falls toward 0.05 to 0.06, with oval oscillation
      staying near 0.2. This is a prediction and the next race will test it. line_loss
      stays last_direction, which recovered the tape edge in iteration 1.


      - [Open this output](iteration-3/entity1/versions/7f6f14a57c4d4b8a94c2f7f82238a31c/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/fbea2d938902486fa94418de43c80365/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-31f52714fc33c6cd/payload.json)'
  - id: entityR1
    label: Next steps for track
    notes: 'Gives the Builder conditional next steps: narrow to 0.08 m if bend max_error
      stays at 0.06, revert to 0.10 m if oval oscillation rises, and move the row
      forward if slalom line losses persist. Based on iterations 0 to 2.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Iteration
      1 (337.6, best) is the only array with 17 of 20 oval finishes, and iteration
      2 showed that widening to ±0.06 m with 7 sensors raised oscillation from 0.20
      to 0.37 and cut oval finishes to 4 of 20. So the sensing is reverted. Bend failures
      in iterations 0 to 2 all end at max_error about 0.06, the off-track limit, with
      rms_error about 0.025 to 0.03. That points to turn authority and reaction lag,
      not sensing. The Integrator has kept kp 2.5 and kd 0.4 and lowered base_speed
      to 1.7, because iteration 2 at 1.7 gave s-bend progress 0.316 against 0.236.
      Next race: if max_error on the s-bend and slalom falls below 0.06 and progress
      rises, keep wheel_track 0.09 and try the next step. If max_error stays at 0.06
      with flat progress, narrow wheel_track to 0.08. If oval steering_oscillation
      rises above about 0.3, return wheel_track to 0.10 m, because the narrower track
      makes the same command turn harder.


      ### Requested changes


      - If max_error on the s-bend and slalom stays at about 0.06 with s-bend progress
      still near 0.24 (iterations 0 and 1), narrow wheel_track from 0.09 to 0.08 m
      to raise turn authority further.

      - If steering_oscillation exceeds about 0.3 on the oval with wheel_track 0.09
      (iteration 2 reached 0.37 with the wide array, iteration 1 was 0.20), return
      wheel_track to 0.10 m and keep the iteration 1 sensor array.

      - If line_loss_events stay at 1.0 per run on the slalom (iterations 0 to 1),
      keep the ±0.03 m, 0.015 m pitch array but move the row forward from y=0.07 to
      y=0.08 m for more lookahead, rather than widening the span again, which iteration
      2 showed hurts oscillation.


      - [Open this output](iteration-3/entityR1/versions/7f6f14a57c4d4b8a94c2f7f82238a31c/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/fbea2d938902486fa94418de43c80365/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-31f52714fc33c6cd/payload.json)'
