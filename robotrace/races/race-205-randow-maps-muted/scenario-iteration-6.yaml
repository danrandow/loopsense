map:
  id: race-205-randow-maps-muted
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: 16mm footprint, track
    notes: 'Reverts wheel_track to 0.09 m, the best s-bend setting after 0.08 m cut
      s-bend progress from 0.486 to 0.330 in iteration 5. Changes sensor footprint
      from 0.012 to 0.016 m, the only change from iteration 4, to test whether a smoother
      signal lifts the slalom plateau at about 0.17.


      ### Rationale


      Five iterations of evidence point the same way. Iteration 4 (score 404.6, best
      so far) used the 5-sensor row at y=0.08 m, spanning ±0.03 m at 0.015 m pitch
      with 0.012 m footprints, and wheel_track 0.09 m. It finished 20 of 20 oval runs
      and gave s-bend progress 0.486. Iteration 5 narrowed wheel_track to 0.08 m with
      everything else unchanged, and scored lower (384.4). The oval stayed at 20 of
      20 and its mean score rose slightly, but s-bend progress fell from 0.486 to
      0.330 and line_loss_events rose to 1.0. So 0.08 m overshoots the turn-authority
      sweet spot on the s-bend, and I revert to 0.09 m. Slalom progress has sat at
      0.16 to 0.18 across iterations 1, 3, 4 and 5, whatever the wheel track, sensor
      row position or array span. That makes the slalom stall look like a sensing
      problem rather than a turn-rate one. Two candidate causes fit: the 0.012 m footprint
      sees the 25 mm tape only partially at bend entries, and the oval still shows
      0.95 line-loss events per run. Iteration 2 showed that widening the array to
      ±0.06 m hurts, so I leave span alone. I make one change relative to iteration
      4: sensor_size from 0.012 to 0.016 m, the largest allowed footprint. A larger
      footprint covers more of the 25 mm tape at each sensor, which should give a
      smoother, less dropout-prone signal at bend entries. Expected result: fewer
      line-loss events, slalom progress above the 0.18 plateau, and s-bend progress
      held at or near 0.49. The risk is that a larger footprint blurs the response
      to a sharp bend, so the s-bend could drop, and the Integrator should check that
      first.


      - [Open this output](iteration-6/entity0/versions/392b8d7920c0428da60bf689d4f3144b/payload.json)

      - Based on: [entityR2A](iteration-6/entityR2A/versions/carried-afc889e86335b0e7/payload.json)'
  - id: entity1
    label: Larger footprint 0.016 m
    notes: 'Builder''s geometry adopted with sensor_size raised from 0.012 to 0.016
      m and the iteration 4 controller unchanged, isolating the footprint effect.
      Based on iteration 4 (404.6), which had 20 of 20 oval finishes, and the slalom
      plateau at 0.16 to 0.18 across iterations 1 to 5.


      ### Rationale


      Evidence: iteration 4 (score 404.6, best) ran the 5-sensor row at y=0.08 m,
      0.012 m footprint, wheel_track 0.09 m, with the controller now used unchanged
      here (base_speed 1.7, kp 2.5, ki 0.05, kd 0.4, weights -2 to +2, last_direction).
      It finished 20 of 20 oval runs, with steering_oscillation 0.205 and s-bend progress
      0.486. Its slalom progress was 0.177 and s-bend and slalom still ended at max_error
      about 0.062 to 0.063, with line_loss_events of 1.0 per run on both. Iteration
      5 showed that wheel_track 0.08 m cut s-bend progress to 0.330, so 0.09 m is
      kept. Slalom progress has sat at 0.16 to 0.18 across iterations 1, 3, 4 and
      5 whatever the track width or row position, so it is not a turn-authority problem.
      The Builder''s one change is sensor_size from 0.012 to 0.016 m, the largest
      allowed footprint. A larger footprint covers more of the 25 mm tape at each
      sensor, which may reduce line-loss dropouts at bend entries. Because the signal
      is a reading-weighted average, the larger footprint should not change its scale,
      so I keep the weights and every controller gain unchanged. That isolates the
      footprint effect against iteration 4. Expected result: line_loss_events below
      0.95 per run, slalom progress above 0.18 if sensing was the limit, and s-bend
      progress held near 0.49. The risk is that a blurred edge costs the s-bend, which
      is the first thing to check.


      - [Open this output](iteration-6/entity1/versions/c804df22577d4ba48b1a34747be839f8/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/392b8d7920c0428da60bf689d4f3144b/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-afc889e86335b0e7/payload.json)'
  - id: entityR1
    label: Footprint test and next
    notes: 'Feedback written before the race: keep the 0.016 m footprint if line-loss
      events fall and the s-bend holds, otherwise revert and test mass. Slalom has
      stayed at 0.16 to 0.18 across every sensing and track change, so wheel_radius
      is the next speed lever to try.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. The Integrator
      kept your iteration 4 controller unchanged (base_speed 1.7, kp 2.5, ki 0.05,
      kd 0.4, last_direction) so that the footprint change is the only variable against
      iteration 4 (404.6). Evidence for each area: the 0.09 m track gave the best
      s-bend result (iteration 4, progress 0.486), and 0.08 m cut it to 0.330 (iteration
      5), so the track stays. The forward row at y=0.08 m fixed the oval (20 of 20
      in iteration 4, against 13 of 20 at y=0.07 in iteration 3), so the row stays.
      Slalom progress has held at 0.16 to 0.18 across iterations 1, 3, 4 and 5 with
      max_error near 0.06, so turn authority and row position have been ruled out
      as the limit. Iteration 2 showed that widening the span to ±0.06 m raised oscillation
      to 0.37 and cut oval finishes, so the span stays. Depending on the next race:
      if line_loss_events drop below 0.95 per run and the s-bend stays near 0.49,
      keep sensor_size 0.016 m and test wheel_radius 0.04 m to add speed, since the
      slalom plateau points to speed or lag. If the s-bend falls below about 0.45,
      the blurred edge is costing bend response, so return sensor_size to 0.012 m
      and test mass 0.5 kg instead. If the slalom stays flat at 0.17 to 0.18 with
      either footprint, sensing is not the limit, so the next step is speed.


      ### Requested changes


      - Keep sensor_size at 0.016 m and sensor_positions at y=0.08 m if line_loss_events
      fall below 0.95 per run and s-bend progress stays at or above 0.45. This tests
      the footprint change against iteration 4 (404.6), which had 0.95 line-loss events
      per run on the oval and s-bend progress 0.486.

      - If s-bend progress falls below 0.45 with sensor_size 0.016 m, return sensor_size
      to 0.012 m and try mass 0.5 kg for faster yaw response, since iteration 4 with
      0.012 m gave s-bend progress 0.486 and iteration 5 showed the s-bend is sensitive
      to turn response.

      - If slalom progress stays at 0.17 to 0.18 with max_error near 0.06 (seen in
      iterations 1, 3, 4 and 5), try wheel_radius 0.04 m to add ground speed. Sensing
      and track-width changes have not moved the slalom, and the oval finish time
      of about 1.73 s leaves room for more speed.


      - [Open this output](iteration-6/entityR1/versions/c804df22577d4ba48b1a34747be839f8/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/392b8d7920c0428da60bf689d4f3144b/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-afc889e86335b0e7/payload.json)'
