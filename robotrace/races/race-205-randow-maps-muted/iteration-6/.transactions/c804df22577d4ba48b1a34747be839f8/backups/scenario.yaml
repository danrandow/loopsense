map:
  id: race-205-randow-maps-muted
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: 16mm footprint, track
    notes: 'Reverts wheel_track to 0.09 m, the best s-bend setting after 0.08 m cut
      s-bend progress from 0.486 to 0.330 in iteration 5. Changes sensor footprint
      from 0.012 to 0.016 m, the only change from iteration 4, to test whether a smoother
      signal lifts the slalom plateau at about 0.17.


      ### Rationale


      Five iterations of evidence point the same way. Iteration 4 (score 404.6, best
      so far) used the 5-sensor row at y=0.08 m, spanning ±0.03 m at 0.015 m pitch
      with 0.012 m footprints, and wheel_track 0.09 m. It finished 20 of 20 oval runs
      and gave s-bend progress 0.486. Iteration 5 narrowed wheel_track to 0.08 m with
      everything else unchanged, and scored lower (384.4). The oval stayed at 20 of
      20 and its mean score rose slightly, but s-bend progress fell from 0.486 to
      0.330 and line_loss_events rose to 1.0. So 0.08 m overshoots the turn-authority
      sweet spot on the s-bend, and I revert to 0.09 m. Slalom progress has sat at
      0.16 to 0.18 across iterations 1, 3, 4 and 5, whatever the wheel track, sensor
      row position or array span. That makes the slalom stall look like a sensing
      problem rather than a turn-rate one. Two candidate causes fit: the 0.012 m footprint
      sees the 25 mm tape only partially at bend entries, and the oval still shows
      0.95 line-loss events per run. Iteration 2 showed that widening the array to
      ±0.06 m hurts, so I leave span alone. I make one change relative to iteration
      4: sensor_size from 0.012 to 0.016 m, the largest allowed footprint. A larger
      footprint covers more of the 25 mm tape at each sensor, which should give a
      smoother, less dropout-prone signal at bend entries. Expected result: fewer
      line-loss events, slalom progress above the 0.18 plateau, and s-bend progress
      held at or near 0.49. The risk is that a larger footprint blurs the response
      to a sharp bend, so the s-bend could drop, and the Integrator should check that
      first.


      - [Open this output](iteration-6/entity0/versions/392b8d7920c0428da60bf689d4f3144b/payload.json)

      - Based on: [entityR2A](iteration-6/entityR2A/versions/carried-afc889e86335b0e7/payload.json)'
  - id: entity1
    label: Track 0.08 m, kd 0.45
    notes: 'Adopted the Builder''s wheel_track 0.08 m on the y=0.08 m row, with kd
      raised from 0.4 to 0.45 to damp the higher turn gain. Iteration 4 gave 20 of
      20 oval finishes and s-bend progress 0.486 at 0.09 m, which is the evidence
      behind it.


      ### Rationale


      Iteration 4 (score 404.6) is the best evidence: at wheel_track 0.09 m and y=0.08
      m the oval finished 20 of 20 (rms 0.023, max_error 0.038, steering_oscillation
      0.205), and s-bend progress reached 0.486. The slalom is flat at progress 0.177
      and still ends off track at max_error about 0.063. The Builder''s proposal changes
      only wheel_track, from 0.09 to 0.08 m, which raises turn rate per unit of turn
      by about 12.5%. The sensing array, sensor_size, wheel_radius, mass and body
      dimensions are therefore kept exactly as proposed. For the controller, the narrower
      track makes the same command turn harder, so the oval''s oscillation risk rises.
      I keep kp at 2.5 and base_speed at 1.7, which both worked in iterations 3 and
      4, and raise kd modestly from 0.4 to 0.45 to damp that extra turn response.
      ki stays at 0.05 and line_loss stays last_direction, which recovered the tape
      edge in every race so far. The main uncertainty is whether the oval holds its
      finishes with the higher effective gain; the slalom may stay near 0.18 if its
      limit is speed or lag rather than turn rate.


      - [Open this output](iteration-5/entity1/versions/72a871dae64046528863aed19670ab4f/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/0a4706d2f4ed45509c06be7a0f8016a7/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-0693980be7d38a20/payload.json)'
  - id: entityR1
    label: Keep row, test track 0.08
    notes: 'Advises keeping the y=0.08 m row, which fixed the oval in iteration 4
      (20 of 20). Gives conditional fall-backs on wheel_track and an untested speed
      lever (wheel_radius or mass) if the slalom stays near 0.18.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. The evidence
      is iteration 4 (404.6): the row at y=0.08 m with wheel_track 0.09 m gave 20
      of 20 oval finishes and s-bend progress 0.486, compared with 13 of 20 oval finishes
      at y=0.07 m in iteration 3 (328.4). So the forward row fixed the oval, and the
      next change should keep it. The slalom has been flat at progress 0.16 to 0.18
      across iterations 1, 3 and 4, with max_error near 0.063 to 0.069, so turn authority
      is not what limits it. Iteration 3 showed that narrowing wheel_track from 0.10
      to 0.09 m nearly doubled s-bend progress (0.236 to 0.446) without the slalom
      moving. Iteration 2 showed that widening the array to 0.06 m raised oscillation
      to 0.37 and cut oval finishes, so sensing span should stay as it is. For the
      next race: if the s-bend progress rises above 0.5 and the oval keeps 17 or more
      finishes, keep wheel_track 0.08 m. If the oval falls below 17 finishes or its
      oscillation exceeds about 0.3, return to 0.09 m. If the slalom still stalls
      near 0.18 with max_error about 0.06, the limit is not the track, so the next
      lever is wheel_radius or mass for speed.


      ### Requested changes


      - Keep wheel_track at 0.08 m and sensor_positions at y=0.08 m if s-bend progress
      rises above 0.5 and oval finishes stay at 17 or more of 20. Iteration 4 gave
      20 of 20 at 0.09 m, and iteration 3 showed narrowing helped the s-bend.

      - If oval steering_oscillation exceeds about 0.3 or oval finishes fall below
      17 of 20 at 0.08 m, return wheel_track to 0.09 m, the iteration 4 value that
      gave 20 of 20 finishes, and keep the y=0.08 m row.

      - If the slalom progress stays at about 0.17 to 0.18 with max_error about 0.06
      (iterations 1, 3 and 4), try wheel_radius 0.04 m or mass 0.5 kg for speed, rather
      than another sensing or track change. Both levers are untested, and the slalom
      has not moved with any sensing or track change so far.


      - [Open this output](iteration-5/entityR1/versions/72a871dae64046528863aed19670ab4f/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/0a4706d2f4ed45509c06be7a0f8016a7/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-0693980be7d38a20/payload.json)'
