map:
  id: race-205-randow-maps-muted
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: 'Iter 3: revert array'
    notes: 'Reverts the sensor array to the best-scoring iteration 1 layout, since
      widening it in iteration 2 cut the oval finishes from 17 to 4 and raised oscillation.
      Narrows wheel_track from 0.10 to 0.09 m to test whether turn authority limits
      the s-bend and slalom, where max_error sits at the 0.06 m off-track limit.


      ### Rationale


      Evidence across three iterations. Iteration 1 (score 337.6) is the best design
      so far: 17 of 20 oval finishes, rms_error about 0.021, and max_error 0.041 on
      the oval. Iteration 2 widened the array to 7 sensors spanning ±0.06 m at 0.02
      m pitch and scored 217.9. The oval finishes fell to 4 of 20, steering_oscillation
      rose from 0.20 to 0.37, and control_effort rose from 7.2 to 10.0. Widening the
      array therefore hurt the oval, even though s-bend progress rose slightly (0.236
      to 0.316). The lesson is that a wider, more heavily weighted sensor span adds
      jitter and does not buy the correction the controller needs. I am reverting
      the sensor array to the iteration 1 layout, which is the best-evidenced one.
      On the s-bend and slalom, max_error is still at the off-track limit of 0.06
      m (0.0611 and 0.0604 in iteration 1), with rms_error near 0.025 to 0.028. That
      points at turn authority rather than sensing. The contract''s signal equations
      show that the wheel track sets how much a unit of turn changes the wheel speeds:
      turn produces a wheel PWM difference of 350*turn, and the turn rate scales inversely
      with wheel_track. I therefore make one change: wheel_track from 0.10 to 0.09
      m, keeping every other value from iteration 1 so the effect can be isolated.
      I expect a higher turn rate, which should lower max_error on the s-bend and
      slalom and give more s-bend progress. The main risk is added oscillation on
      the oval, since a narrower track also makes the same command turn harder, so
      the Integrator should check steering_oscillation and control_effort first.


      - [Open this output](iteration-3/entity0/versions/fbea2d938902486fa94418de43c80365/payload.json)

      - Based on: [entityR2A](iteration-3/entityR2A/versions/carried-31f52714fc33c6cd/payload.json)'
  - id: entity1
    label: Wider array, stronger PD
    notes: 'Builder''s 7-sensor ±0.06 m array with weights scaled to x; kp raised
      to 3.0, kd to 0.5, base_speed lowered to 1.7. Evidence: iteration 1 s-bend and
      slalom both lost the line once per run at max_error about 0.06.


      ### Rationale


      Race evidence: iteration 1 (score 337.6) finished 17 of 20 oval runs, up from
      3 of 20. Both s-bend and slalom still end off track, with max_error about 0.061
      and 0.060 at the 0.06 m limit, and line_loss_events of 1.0 per run on both.
      Narrowing the track and raising the wheel radius (iteration 0 to 1) left s-bend
      progress flat at about 0.24, so turn authority alone is not the limit. The Builder''s
      wider 7-sensor array at ±0.06 m keeps the tape visible and the signal graded
      out to the limit, which addresses the line-loss and saturation evidence. I kept
      the Builder''s geometry as proposed. Sensor weights are scaled to x (33.3*x,
      so ±2 at the outer sensors) to keep the signal range the same as the ±0.03 m
      design, which had weights of ±2 at ±0.03 m. The Builder''s expected change is
      the array span. For the controller, I raise kp from 2.5 to 3.0 so the correction
      on bends is stronger with the outer sensors reporting earlier, and I raise kd
      from 0.4 to 0.5 to damp the extra gain. I lower base_speed from 1.8 to 1.7 because
      the s-bend and slalom fail by drifting outward and slower bends give the controller
      more time to recover. The oval mean finish of 1.73 s (iteration 1) leaves room
      under 3 s. line_loss stays at last_direction. Expected result: fewer off-track
      ends on s-bend and slalom and max_error below about 0.05, with oscillation possibly
      rising because of the higher kp and kd. The next race will show whether that
      happened.


      - [Open this output](iteration-2/entity1/versions/b9ca9e550bed4157961718cc8777b4c3/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/d53ab4aef6a149de8b57d51ff7deda4d/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-e0116f1ede91eef2/payload.json)'
  - id: entityR1
    label: Span first, then track
    notes: 'Feedback asks the Builder to keep the wider span if line losses fall,
      and to narrow wheel_track only if max_error stays at the limit. Based on iterations
      0 and 1, where the array span and track changes each moved different metrics.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Iteration
      1 (score 337.6) established that the ±0.03 m array gave line_loss_events of
      1.0 per run on s-bend and slalom, with max_error about 0.06 on both, and iteration
      0 with ±0.04 m gave the same loss of 1.0 per run. So the line is lost at the
      array edge on bends in both designs. In iteration 1, narrowing the track and
      raising the wheel radius moved oval finishes from 3 to 17 of 20 but left s-bend
      progress flat at about 0.24 (iteration 0 was 0.24). That suggests turn authority
      is not the only limit. For the next race: if line_loss_events on s-bend and
      slalom fall to 0 and max_error drops below about 0.05, keep the ±0.06 m span
      and try a modest wider or narrower span. If line_loss_events stay at 1.0 on
      bends but max_error stays at about 0.06, the limit is authority and the wheel
      track should narrow. If oscillation rises sharply, pull the row back toward
      y=0.06, as the Integrator will do if needed.


      ### Requested changes


      - Keep the 7-sensor span at ±0.06 m with 0.02 m pitch at y=0.07 if line_loss_events
      on s-bend and slalom fall below 1.0 per run. This is supported by iteration
      1 (±0.03 m gave 1.0 per run) and iteration 0 (±0.04 m gave 1.0 per run).

      - If max_error on s-bend and slalom stays near 0.06 with no change in progress,
      narrow wheel_track from 0.10 to 0.09 m. Iteration 1 showed that narrowing the
      track did not change s-bend progress (0.24 both times), so try this step only
      if the span change alone does not help.

      - If steering_oscillation rises above about 0.3 on the oval (iteration 1 was
      0.20), move the sensor row back from y=0.07 to y=0.06 m. Iteration 0 at y=0.06
      had oscillation of 0.32 on the oval, so the forward row is the more likely fix
      to try, not the widest span.


      - [Open this output](iteration-2/entityR1/versions/b9ca9e550bed4157961718cc8777b4c3/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/d53ab4aef6a149de8b57d51ff7deda4d/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-e0116f1ede91eef2/payload.json)'
