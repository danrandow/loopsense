    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      This is the first iteration, so there is no race telemetry or integration feedback
      yet. The design is a baseline built from the contract''s limits. Five sensors
      at 0.012 m footprint, spaced 0.02 m apart and spanning ±0.04 m, cover about
      80 mm across, which is more than three times the 25 mm tape width. That gives
      the controller a smooth, graded reading across the line and avoids the all-or-nothing
      loss of a narrow array. The sensors sit 0.06 m ahead of the axle, near the forward
      limit, so the robot reads the line before the wheels reach a bend. Wheel track
      is 0.12 m and wheel radius 0.03 m, which are mid-range values that keep turn
      authority moderate. Mass is 0.7 kg and body length 0.14 m, which keeps yaw inertia
      low so the robot can turn quickly. Body width 0.12 m is enough: the off-track
      limit is max(0.06, 0.0125 + body_width/4), which evaluates to 0.06 m for any
      width up to about 0.19 m, so width has little effect on the limit. I expect
      a completable run on the development tracks, with the main uncertainty being
      whether the 0.06 m lookahead causes lag on tight slalom bends.


      - [Open this output](iteration-0/entity0/versions/6157c6592aa646f3b4054697af534083/payload.json)'
  actions:
  - id: action0
