  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Stabler, earlier steering
    notes: 'Lower speed (1.4), stronger proportional gain (3.0), more derivative damping
      (0.4), and sensors moved closer to the axle, aimed at the baseline''s early
      off-track exits (progress 0.10 to 0.15, all runs off track). The changes rest
      on the summary metrics only, with no per-step telemetry.


      ### Rationale


      Evidence: the baseline (iteration 0) never finished on any development track.
      Every trial ended off track, with progress only 0.10 to 0.15, max_error about
      0.06 m (the off-track limit), and one line-loss event per run. The robot is
      losing the line early, not slowly drifting. Likely causes: (1) at base_speed
      1.6 with a 0.04 m sensor look-ahead, the correction arrives late, so the robot
      overshoots each bend; (2) kd 0.1 gives too little damping against that overshoot;
      (3) the body is heavier than needed for quick turn response. Changes: base_speed
      1.6 to 1.4, which trades some speed for stability while keeping a path to about
      1.4 m/s. kp 2.0 to 3.0 for a stronger correction at the bend edges. kd 0.1 to
      0.4 to damp the overshoot. ki 0.05 to 0.02 to limit integral windup on bends.
      Sensor look-ahead y 0.04 to 0.03 to cut the reaction lag. Mass 0.8 to 0.6 kg
      to speed up turn response. Geometry otherwise unchanged (5 sensors at x = -0.03
      to 0.03, 12 mm footprint, weights -2 to 2, last_direction line loss). Expected
      result: fewer off-track exits and progress above 0.5 on the oval and s-bend.
      Hypotheses to check: if max_error still reaches 0.06 on the s-bend, the cause
      is turn overshoot and kd should rise further; if progress stalls on the slalom,
      kp is too high. Measurements wanted next: progress, max_error, rms_error, line_loss_events,
      steering_oscillation, completion_time, and control_effort.


      - [Open this output](iteration-1/entity0/versions/26eae974cad448e685b04f46580d1b7b/payload.json)

      - Based on: [entityR2A](iteration-1/entityR2A/versions/carried-6ff2a69eba349257/payload.json)'
  - id: entityR1
    label: 'Approve: retune to race'
    notes: 'The candidate is valid and changes the baseline''s failure points (base
      speed, kp/kd damping, sensor look-ahead, mass). It is approved for the first
      race because no build has raced yet and the bar is validity. The feedback sets
      conditional next steps based on max_error, line loss and oscillation from that
      race.


      ### Feedback


      Written before this candidate races, so no outcome is claimed for it. The evidence
      is iteration 0 (score 49.8, 0 of 60 trials finished). Every trial went off track
      at progress 0.10 to 0.15, with max_error about 0.06 m and one line-loss event
      each. That pattern points to the robot losing the line early, not drifting slowly.
      The candidate is valid: all values are inside their contract limits, and its
      sign convention is correct (negative x weights steer right, positive signal
      steers left). The changes are coherent with the baseline failure: base_speed
      drops from 1.6 to 1.4, kd rises from 0.1 to 0.4 for damping, sensor look-ahead
      moves from y 0.04 to 0.03 to cut reaction lag, and mass falls to 0.6 kg. One
      risk is that kp rises from 2.0 to 3.0 at the same time. That raises the maximum
      turn command by 50%, and with base_speed still at 1.4 it could cause oscillation
      on the slalom. Body width cannot help the off-track limit much: at body_width
      0.18 the limit is about 0.0575 m, which is still below the current 0.06 m. This
      is early exploration with 10 iterations left and no raced build yet, so the
      bar is validity and not obvious breakage. The candidate meets that bar, and
      only a race will show whether the combined change works. Approve it so the race
      produces per-track telemetry. After the race, use the numbers to decide the
      next step. If line_loss_events is still 1 or more with max_error near 0.06 on
      the s-bend, the cause is turn overshoot: raise kd further before anything else.
      If progress stalls on the slalom or steering_oscillation is high, kp is too
      high: bring it back toward 2.0 and keep kd at 0.4. If the run completes cleanly
      with low rms_error, raise base_speed in steps of 0.2 to find the limit.


      ### Requested changes


      - If the race shows max_error near 0.06 m or line_loss_events of 1 or more on
      the s-bend, keep kp at 3.0 and raise kd from 0.4 toward 0.6 to damp turn overshoot,
      because the baseline failed on all three tracks at the same early point.

      - If the race shows high steering_oscillation or progress stalling on the slalom,
      reduce kp from 3.0 toward 2.0 while keeping kd at 0.4, because the candidate
      raised kp by 50% at the same time as base_speed fell.

      - If the race completes with low max_error and rms_error and completion_time
      well under 3 s, raise base_speed from 1.4 toward 1.6 in steps of 0.2 with the
      same gains, to find the speed limit before tracking fails.


      - [Open this output](iteration-1/entityR1/versions/53cb5f309046418cb3e218c5ab071018/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/26eae974cad448e685b04f46580d1b7b/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-6ff2a69eba349257/payload.json)'
