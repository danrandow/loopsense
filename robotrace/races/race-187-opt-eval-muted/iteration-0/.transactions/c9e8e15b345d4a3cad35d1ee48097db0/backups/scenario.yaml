map:
  id: race-187-opt-eval-muted
  schema: v0.2
  scenario: Iteration 0
  inherits: base.yaml
  notes: Initial prepared state before either AI role or the simulator has acted.
dimensions:
  time_horizon: prepared
  iteration: '0'
overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'Conservative first candidate: five sensors spanning the tape, linear weights
      of -2 to 2, moderate kp 2.0 with light kd, and base_speed 1.6. No race data
      exists yet, so the values come from the contract''s limits and the speed target.


      ### Rationale


      Iteration 0 has no race data, so this is a conservative baseline built from
      the contract. Geometry: five line sensors spread across the 25 mm tape at x
      = -0.03, -0.015, 0, 0.015, 0.03 m (0.012 m footprint, which covers the tape
      width with margin), all at y = 0.04 m ahead of the axle so the robot reads the
      line before it reaches the wheels. Sensor weights are -2, -1, 0, 1, 2, proportional
      to sensor x. This makes the signal positive when the line is to the left, which
      steers left as the contract requires, and it gives a signal scale of about ±2.
      Controller: base_speed 1.6 (about 80% PWM) to aim for the roughly 1.5 m/s average
      needed to finish in 3 s while leaving headroom for bends. kp 2.0 gives a moderate
      correction (turn about 4 at full signal, roughly 1400 PWM differential). ki
      0.05 is small, so it can remove steady bias from the motor mismatch without
      winding up. kd 0.1 adds light damping against oscillation. line_loss ''last_direction''
      lets the robot recover toward the side it last saw the line. Chassis: wheel_track
      0.12 m, wheel_radius 0.03 m, body 0.12 x 0.16 m, mass 0.8 kg, a moderate, stable
      inertia. Expected result: completion on the oval and s-bend with few line-loss
      events. The main risk is overshoot in the slalom at this speed. Next measurements:
      rms_error and max_error to check tracking margin against the 0.06 m off-track
      limit, steering_oscillation to judge whether kd is adequate, and completion_time
      to see whether base_speed can rise.


      - [Open this output](iteration-0/entity0/versions/7b4f1d9570df48279ef64c918f454f94/payload.json)'
  - id: entityR1
    label: 'Baseline review: approve'
    notes: 'Approved the iteration 0 baseline because it is valid and nothing is broken,
      and no race data exists yet to justify a revision. The feedback names the telemetry
      to read next and the changes to try depending on what that race shows.


      ### Feedback


      Iteration 0 has no race data, so this review rests only on the public contract
      and the baseline''s own contents. The candidate is valid: all sensor positions
      and weights are inside their limits, base_speed 1.6 and kp 2.0 are in range,
      and line_loss ''last_direction'' is an allowed option. Its sign convention is
      consistent with the contract: sensors at negative x carry negative weights,
      so a line on the left gives a positive signal, which steers left. Nothing in
      it looks obviously broken, and no earlier race exists to show it is worse than
      anything else, so the bar is validity. Approve it so the first race produces
      telemetry. Nothing here predicts how it will perform. When the race reports
      back, use the measurements to choose the next change. If rms_error or max_error
      is large, or line_loss_events is above zero, reduce base_speed or raise kp and
      kd. If steering_oscillation is high, raise kd before raising kp. If completion_time
      is well under 3 s with a clean track, raise base_speed. If the run stalls or
      goes off track on the slalom, lower kp and check that the sensor_size and sensor
      spacing cover the 25 mm tape.


      ### Requested changes


      - If the race shows high steering_oscillation, increase kd from 0.1 toward 0.3
      and keep kp at 2.0, because kd is the only damping term in the baseline.

      - If the race shows line_loss_events above zero or max_error near 0.06 m, reduce
      base_speed from 1.6 toward 1.2 before changing any gains, because the slalom
      is the most likely place for the line to be lost.

      - If the race completes with low max_error and completion_time well under 3
      s, raise base_speed in steps of 0.2 while keeping the same gains, to find the
      speed limit before tracking fails.


      - [Open this output](iteration-0/entityR1/versions/5457222857c34865933af8224a9f5694/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/7b4f1d9570df48279ef64c918f454f94/payload.json)'
  - id: entity1
    label: Approved Robot Build
    notes: 'Approved Robot Build. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-0/entity1/versions/5457222857c34865933af8224a9f5694/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/7b4f1d9570df48279ef64c918f454f94/payload.json)'
  actions:
  - id: action0
  - id: action1
measurements: {}
