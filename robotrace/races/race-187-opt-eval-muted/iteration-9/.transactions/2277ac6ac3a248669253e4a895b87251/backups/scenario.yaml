overrides:
  entities:
  - id: entity0
    label: Sensors forward to y=0.07
    notes: 'Moves the sensor array from y=0.05 to y=0.07 m, the one untested step
      from the best design (570.4), with all other values unchanged. The lead distance
      raised oval and s-bend completion in iteration 6, and the slalom still fails
      at the off-track limit.


      ### Rationale


      Evidence: iteration 6 is the best raced design (570.4). Moving the five sensors
      forward from y=0.03 to y=0.05 m raised the oval finish rate from 10/20 to 20/20,
      the s-bend finish rate from 0/20 to 9/20, and slalom progress from 0.28 to 0.41.
      Sensor lead distance is the lever that has worked. Slalom is still 0/20, ending
      off track with max_error near the 0.06 m limit and steering_oscillation about
      0.30. Mean rms_error is only about 0.02, so the robot tracks well on average
      and fails at sudden alternating bends, which points to late correction at turn-in.


      Change (one variable): sensor y moves from 0.05 to 0.07 m, the upper end of
      the allowed range. This extends the look-ahead so the correction starts earlier
      at the slalom bends. Everything else is held at the iteration 6 values: x spacing
      -0.04 to 0.04 with 16 mm footprints, kp 3.0, kd 0.8, ki 0.02, base_speed 1.3,
      mass 0.6 kg, last_direction line loss. This isolates the look-ahead effect against
      the best baseline. Iteration 7 had this same plan but never raced, so it is
      still untested.


      Expected result: slalom and s-bend max_error falls, slalom progress rises above
      0.5, and s-bend finishes improve. Oval should stay near 100% completion.


      Hypotheses: (a) if slalom still exits at max_error about 0.06 with no gain from
      y, steering authority is the limit, so kp should rise to about 3.3 with kd held.
      (b) If steering_oscillation rises above 0.35, the far-forward sensors are amplifying
      jitter, so kd should drop toward 0.6. (c) If the oval stops completing, the
      forward lead is overshooting on straights, so y should return to about 0.06.


      Measurements wanted: all per-track metrics, so the look-ahead effect can be
      read separately for oval, s-bend and slalom.


      - [Open this output](iteration-8/entity0/versions/c7722450ad884d91ad9bce044e76bd0b/payload.json)

      - Based on: [entityR2A](iteration-8/entityR2A/versions/carried-b496443e117191d6/payload.json)'
  - id: entityR1
    label: 'Approve: look-ahead y'
    notes: 'Approved the single-variable test of sensor y 0.05 to 0.07 m against the
      best raced design (iteration 6, 570.4), which showed that moving the sensors
      forward lifted oval and s-bend finishes. Feedback gives the next step for overshoot,
      steering authority or speed, depending on the race telemetry.


      ### Feedback


      This candidate is valid and tests one variable against the best raced design.
      Sensor y moves from 0.05 to 0.07 m, with x spacing (-0.04 to 0.04 m), 16 mm
      footprints, kp 3.0, kd 0.8, ki 0.02, base_speed 1.3, mass 0.6 kg and last_direction
      line loss unchanged. The evidence is iteration 6 (score 570.4). Moving y from
      0.03 to 0.05 raised oval finishes from 10/20 to 20/20, s-bend finishes from
      0/20 to 9/20, and slalom progress from 0.28 to 0.41. Slalom still finished 0/20
      with max_error near 0.06 m and steering_oscillation about 0.30. Iteration 7
      is the same plan and has not raced, so this is the first real test of the 0.07
      m look-ahead. Nothing here predicts how it will perform.


      After the race, read the results in this order. (a) If oval completion falls
      below 20/20, or steering_oscillation rises above about 0.35, the far-forward
      lead is overshooting on straights or amplifying jitter. Return y to 0.06 m,
      and if jitter is the problem, lower kd toward 0.6. (b) If the slalom still exits
      off track at max_error near 0.06 m with no progress gain over iteration 6, the
      look-ahead is no longer the limit, so steering authority is. Raise kp toward
      3.3 with kd held. Iteration 4 showed kp 3.7 hurt the harder tracks at y 0.03,
      so keep the step small. (c) If the robot stays on the line but s-bend or slalom
      progress stalls below 0.3 with no off-track exit, base_speed is too low for
      the 3 s limit. Raise it in 0.1 steps toward 1.4 or 1.5, since iteration 1 finished
      the oval at 1.65 s at base 1.4.


      Because this is a clean single-variable test of the best lever found so far,
      approve it so the race returns per-track telemetry for the look-ahead effect.


      ### Requested changes


      - If oval completion drops below 20/20 or steering_oscillation rises above about
      0.35, return sensor y to 0.06 m, since iteration 6 showed y 0.05 was the best
      oval result, and lower kd from 0.8 toward 0.6 if the jitter persists.

      - If slalom still exits off track at max_error near 0.06 m with no progress
      gain over iteration 6''s 0.41, raise kp from 3.0 toward 3.3 with kd held at
      0.8, because iteration 4 showed kp 3.7 hurt harder tracks and a small step is
      safer.

      - If s-bend or slalom progress stays below 0.3 with no off-track exit, raise
      base_speed from 1.3 toward 1.4 in 0.1 steps with the same gains, since the 3
      s limit needs about 1.5 m/s average.


      - [Open this output](iteration-8/entityR1/versions/90c9691aaff940618b431d535dbee4ab/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/c7722450ad884d91ad9bce044e76bd0b/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-b496443e117191d6/payload.json)'
