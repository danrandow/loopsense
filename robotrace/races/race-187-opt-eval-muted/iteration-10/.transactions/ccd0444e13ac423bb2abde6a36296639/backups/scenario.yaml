map:
  id: race-187-opt-eval-muted
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Slower base speed 1.1
    notes: 'Keeps the iteration 9 geometry (sensor y 0.08) and cuts base_speed from
      1.3 to 1.1 to reduce bend overshoot on the slalom, the only track still at 0/20.
      Oval and s-bend still finish within the 3 s cap by the timing estimate, and
      the per-track metrics will show whether speed or steering authority is the limit.


      ### Rationale


      Evidence: iteration 9 (score 703.4) is nearly tied with iteration 8 (708.5).
      Oval (20/20) and s-bend (20/20) still complete reliably. Slalom is still 0/20
      and ends off track at max_error about 0.063, just over the 0.06 m limit. Its
      progress rose from 0.56 (y=0.07) to 0.56 at y=0.08 with a small drop in s-bend
      and oval margin, so sensor look-ahead has reached diminishing returns. Mean
      rms_error on slalom is about 0.02, so the robot tracks on average and loses
      the line at sudden alternating bends. Raising kp was ruled out earlier (kp 3.7
      hurt slalom and s-bend). Oval finishes in about 1.84 s and s-bend in about 2.09
      s, so there is time margin under the 3.0 s cap.


      Change (one variable): base_speed 1.3 to 1.1, with sensor y held at 0.08 m (iteration
      9 geometry). Lower speed gives the correction more time at each bend and reduces
      lateral overshoot, which is the failure mode seen at max_error near the limit.
      Expected effect: slalom max_error falls below 0.06 more often and slalom progress
      rises; oval completion time rises to about 2.2 s and s-bend to about 2.4 s,
      still under 3.0 s. The time term in the score falls slightly, but completions
      should be more reliable. Hypotheses: (a) if slalom still exits at max_error
      near 0.06 with no progress gain, steering authority is the limit, so kp should
      move to about 3.3 with kd held. (b) If oval or s-bend completion falls below
      20/20 or completion_time exceeds 2.8 s, base_speed is too low and should return
      to about 1.2. (c) If steering_oscillation rises above 0.35, kd should drop toward
      0.6.


      - [Open this output](iteration-10/entity0/versions/8f325a50a0664f298967fa123b37e418/payload.json)

      - Based on: [entityR2A](iteration-10/entityR2A/versions/carried-7d1944418b3a474e/payload.json)'
  - id: entityR1
    label: 'Approve: sensor y 0.08'
    notes: 'Approved the single-variable step of sensor y from 0.07 to 0.08 m, the
      upper limit, with all else held at the best raced design (iteration 8, score
      708.5). Evidence: y 0.05 to 0.07 raised slalom progress from 0.41 to 0.56 with
      oval and s-bend still complete, so one more look-ahead step is worth racing.


      ### Feedback


      This candidate is valid and changes one variable against the best raced design.
      Sensor y moves from 0.07 to 0.08 m, the upper limit of the allowed range. Everything
      else matches iteration 8 (score 708.5): x at -0.04 to 0.04 m in 0.02 m steps,
      16 mm footprints, kp 3.0, kd 0.8, ki 0.02, base_speed 1.3, mass 0.6 kg and last_direction
      line loss. The evidence is iteration 6 to iteration 8. Moving y from 0.03 to
      0.05 raised oval completion from 10/20 to 20/20 and s-bend completion from 0/20
      to 9/20. Moving y from 0.05 to 0.07 raised slalom progress from 0.41 to 0.56
      and lowered slalom steering_oscillation from 0.30 to 0.26, with oval and s-bend
      both still 20/20. Slalom is still 0/20 with max_error near 0.063 m, and the
      candidate does not predict its own result.


      After the race, read the results in this order. (a) If oval completion falls
      below 20/20, or steering_oscillation on any track rises above about 0.35, the
      forward lead is overshooting on straights or amplifying jitter. Return y to
      0.07 m and, if jitter persists, lower kd toward 0.6. (b) If slalom still exits
      at max_error near 0.06 m with progress no higher than about 0.6, the look-ahead
      has stopped being the limit, because y is now at its maximum. Steering authority
      is the next limit, so raise kp to about 3.3 with kd held. Iteration 4 showed
      kp 3.7 hurt the harder tracks at y 0.03, so keep the step small. (c) If the
      robot stays on the line but s-bend or slalom progress stalls below 0.3 with
      no off-track exit, base_speed is too low for the 3 s limit, so raise it in 0.1
      steps toward 1.4.


      This is a low-risk single-variable step from the best design, and the race will
      return the per-track telemetry the next revision needs. Approve it.


      ### Requested changes


      - If the oval drops below 20/20 completions or any track''s steering_oscillation
      rises above about 0.35, return sensor y to 0.07 m, since iteration 8 kept the
      oval at 20/20 and steering_oscillation at 0.23 to 0.28, and lower kd from 0.8
      toward 0.6 if jitter persists.

      - If slalom still exits off track at max_error near 0.06 m with progress no
      better than about 0.6 at y 0.08, raise kp from 3.0 toward 3.3 with kd held at
      0.8, because y is now at its limit and iteration 4 showed kp 3.7 hurt the harder
      tracks, so the step should stay small.

      - If s-bend or slalom progress stays below 0.3 with no off-track exit, raise
      base_speed from 1.3 toward 1.4 in 0.1 steps with the same gains, since iteration
      1 finished the oval at 1.65 s at base_speed 1.4 and the 3 s limit needs about
      1.5 m/s on average.


      - [Open this output](iteration-9/entityR1/versions/b1ee5a02b47149f989fa79f36626dfa8/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/2277ac6ac3a248669253e4a895b87251/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-2d24dff1eed969cb/payload.json)'
