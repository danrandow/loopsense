map:
  id: race-187-opt-eval-muted
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Wider array, kp 3.7, kd
    notes: 'Widens the sensor array to ±0.04 m with 16 mm footprints to stop tape
      slipping past the sensors at bends, raises kp to 3.7 to hold the effective steering
      gain, and raises kd to 0.5 to damp oval oscillation. Based on iteration 1 (score
      134), whose failures were all off-track exits with 1.15–1.45 line-loss events
      per run.


      ### Rationale


      Evidence: iteration 1 is the best raced design (score 134.06). It finished once
      in 20 oval trials and left the track in all other trials, with progress about
      0.50 on the oval, 0.28 on the s-bend and 0.14 on the slalom. Line-loss events
      ran at 1.15 to 1.45 per run and steering_oscillation reached 0.29 on the oval.
      Every failure is an off-track exit at max_error about 0.06 m (the limit), so
      the tape is slipping past the 5-sensor array at bends. Iterations 2 and 3 were
      never raced, so their ideas are untested. Iteration 2 used base_speed 1.1, which
      is too slow for the 3 s limit (about 1.5 m/s average needed). I am therefore
      carrying forward iteration 3''s plan, with one correction.


      Changes: (1) Widen the array to x = -0.04, -0.02, 0, 0.02, 0.04 m and use 16
      mm footprints. The 0.02 m spacing with 16 mm footprints means the 25 mm tape
      always overlaps at least one sensor, which should cut line-loss events toward
      0.5 per run. (2) Keep base_speed at 1.4, the level that produced the only oval
      finish. (3) Raise kp from 3.0 to 3.7. The wider spacing lowers the signal per
      metre of tape offset (about 50 per m instead of about 67 per m), so this keeps
      the effective steering gain near 185 versus 200 before, instead of the 3.5 I
      planned earlier. (4) Raise kd from 0.4 to 0.5 to damp the oval oscillation.
      (5) Keep ki at 0.02 to avoid windup, keep mass 0.6 kg, keep sensor y at 0.03
      m and keep last_direction line loss so that only the array width, kp and kd
      move.


      Expected result: line_loss_events at or below 0.5 per run, fewer off-track exits,
      and progress above 0.4 on the s-bend and slalom with more oval completions.


      Hypotheses to test: (a) if line-loss events stay above 0.8 with the wider array,
      turn-in lag is the cause, so kd or sensor y must change next; (b) if max_error
      reaches 0.06 on the s-bend with no line loss, kp is too low for the sharp bends;
      (c) if the robot is steady but progress is under 0.5 at the 3 s cap, base_speed
      must rise toward 1.6 with kd holding the line.


      Measurements wanted: completion, progress, completion_time, rms_error, max_error,
      line_loss_events, steering_oscillation and control_effort, so the array width,
      gain and damping effects can be separated.


      - [Open this output](iteration-4/entity0/versions/4407449b4745432399702c4c24bad343/payload.json)

      - Based on: [entityR2A](iteration-4/entityR2A/versions/carried-f6d91f0fce75cec5/payload.json)'
  - id: entityR1
    label: Approve wider array, kp
    notes: 'Approved the iteration 4 candidate: sensors widened to ±0.04 m with 16
      mm footprints, kp 3.7, kd 0.5, base_speed held at 1.4. This targets the 1.15
      to 1.45 line-loss events per run in iteration 1, the best raced design (score
      134.06). Next-step rules are given for line loss, bend max_error and speed.


      ### Feedback


      Written before this candidate races, so no outcome is claimed for it. The evidence
      is iteration 1 (score 134.06, the best raced so far). Its oval finished once
      in 20 trials at 1.65 s, so base_speed 1.4 is fast enough to finish. Its s-bend
      and slalom runs all went off track, with 1.15 to 1.25 line-loss events per run,
      and max_error sat at the 0.06 m limit. Line loss is the main failure, so the
      wider array (x = ±0.04 m, 16 mm footprints, 0.02 m spacing) is the right change:
      the 25 mm tape always overlaps at least one sensor. Keeping base_speed at 1.4
      holds speed constant, which the oval finish supports. Raising kp to 3.7 and
      kd to 0.5 is a reasonable response to the oscillation of 0.29 seen on the oval.
      The gain change is large, though, and kp 3.7 at base 1.4 could overshoot on
      the slalom, so the race needs to be read carefully. This is early exploration
      with 7 iterations left after this one, and the candidate is valid and evidence-based,
      so racing it gives more useful telemetry than another review round. After the
      race, read line_loss_events first. If they are still above 0.8 per run, the
      array did not cure turn-in lag: raise kd toward 0.6 before raising kp further.
      If max_error reaches 0.06 on the s-bend with few line-loss events, kp is too
      low for the sharp bends: raise kp toward 4.0. If the robot stays on the line
      but progress is under 0.5 at the 3 s cap, raise base_speed in 0.1 steps toward
      1.6 with the same gains. If steering_oscillation rises above about 0.3 with
      no line loss, kp is too high: bring it back toward 3.5.


      ### Requested changes


      - If line_loss_events stay above 0.8 per run after the wider array, keep the
      array and raise kd from 0.5 toward 0.6 before raising kp, because iteration
      1 showed 1.15 to 1.45 line-loss events per run and the turn-in lag is the likely
      cause.

      - If max_error reaches 0.06 m on the s-bend while line_loss_events are low,
      raise kp from 3.7 toward 4.0, since iteration 1 failed at the bends at kp 3.0
      and the sharper bends need more correction.

      - If the robot stays on the line with no off-track exit but progress is under
      0.5 at the 3 s cap, raise base_speed from 1.4 toward 1.5 or 1.6 in 0.1 steps
      with the same gains, because the 3 s limit needs about 1.5 m/s on average.


      - [Open this output](iteration-4/entityR1/versions/f62514cbb4fe48e5a2d7fb5635412483/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/4407449b4745432399702c4c24bad343/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-f6d91f0fce75cec5/payload.json)'
