overrides:
  entities:
  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence. Iteration 6 already raced base_speed 1.25 (with ki 0, kd 0.15, last_direction,
      x = +/-0.03 with 16 mm footprints). Its max_error was 0.0606, 0.0653 and 0.0657
      m, against 0.0607, 0.0648 and 0.0621 at 1.4, so speed made no measurable difference
      to the excursion. Every design so far has ended off track on all 60 trials with
      exactly one line-loss event per trial. Progress was 0.11 to 0.165 and there
      were no completions. The Evaluator''s authorised feedback for this candidate
      was written as if 1.25 had not yet raced, but the race data shows it has, so
      its guidance (a) does not apply. Its guidance (b) does apply: max_error and
      line-loss count are unchanged, so speed is not the limit. Following that guidance,
      I restore base_speed to 1.4 and make one controller change: kp from 1.5 to 2.0,
      with kd 0.15, ki 0 and last_direction unchanged. The fixed-bias (ki), damping
      (kd), recovery-direction (line_loss) and speed hypotheses have each been tested
      with no effect on the 0.060 to 0.065 m excursion. Stiffer proportional steering
      is the one controller variable not yet isolated, and the robot is drifting toward
      the line edge before the first loss. Expected result: max_error falls to 0.06
      m or below on some seeds, or line-loss events drop, and progress is at least
      unchanged. The risk is that kp 2.0 with kd 0.15 adds oscillation (steering_oscillation
      rising sharply with no gain). I am not changing geometry: widening the sensors
      to +/-0.05 previously cut progress, and the off-track limit cannot be raised
      with body_width. Measurements wanted: max_error and line_loss_events per track
      to test whether stiffer steering holds the line; steering_oscillation to check
      for jitter; progress and completion_time to see whether the run gets further;
      completion to check for any finish. If max_error is still about 0.060 to 0.065
      m with one loss per trial, the next step is to add sensor spacing or footprint
      changes at the outer sensors, not further gain tuning.


      - [Open this output](iteration-7/entity0/versions/d8f863a360a44618a10cbbed5075cbab/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-d69b390cdf74ea63/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-9b16795c0650aa35/payload.json)'
  - id: entityR1
    label: 'Approve: kp 2.0 test'
    notes: 'Approved the iteration 4 design with base_speed back to 1.4 and kp raised
      to 2.0, a single clean test of the one controller gain not yet isolated. Iteration
      6 showed speed has no effect on max_error (about 0.060 to 0.065 m in both),
      and the race is more informative than another revision.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      candidate is the iteration 4 design (kd 0.15, ki 0, last_direction, x = +/-0.03
      with 16 mm footprints) with base_speed restored to 1.4 and kp raised from 1.5
      to 2.0. The base_speed change is a revert, and iteration 6 (base_speed 1.25)
      gave max_error of 0.0606, 0.0653 and 0.0657 m against 0.0607, 0.0648 and 0.0621
      at 1.4, so speed is not the limit. The kp change is the one controller variable
      not yet tested cleanly. Iteration 0 used kp 2.0 but also had kd 0.05, a 12 mm
      footprint and base_speed 1.6, so it does not isolate kp. Every race so far has
      ended off track on all 60 trials with one line-loss event per trial and max_error
      of about 0.060 to 0.065 m. Geometry changes (iteration 2) and the integral and
      recovery-direction changes (iterations 3 and 5) did not move that figure. The
      candidate is valid, differs from the best raced design by one field (kp), and
      is cheap to race, so racing it is more useful than another revision.


      Risk to watch: kp 2.0 with kd 0.15 may add oscillation. Each unit of turn is
      about 350 PWM, and signal can reach about 2, so turn can reach about 4.


      What to change after the race, depending on its telemetry. (a) If max_error
      falls to 0.06 m or below, or line_loss_events drops to 0 or 1 on some seeds,
      keep kp 2.0 and check progress and completion_time against the iteration 4 values
      (progress 0.11 to 0.16, no completions). (b) If steering_oscillation rises sharply
      with no gain in max_error, revert kp to 1.5 and kd to 0.1 (the iteration 1 values).
      (c) If max_error and line-loss count are unchanged (about 0.060 to 0.065 m,
      one loss per trial), gain tuning is exhausted. Then test outer-sensor footprint
      or spacing changes, keeping the spread near +/-0.03 because the +/-0.05 spread
      cut progress in iteration 2.


      ### Requested changes


      - If max_error falls to 0.06 m or below, or line_loss_events falls to 0 or 1,
      keep controller.kp = 2.0 with kd 0.15 and ki 0, and check progress and completion_time
      against iteration 4 (progress 0.11 to 0.16, no completions) before changing
      anything else.

      - If steering_oscillation rises sharply with no gain in max_error (iteration
      4 showed kd 0.15 alone at about 0.073 to 0.148), revert controller.kp to 1.5
      and controller.kd to 0.1 so the controller returns to the iteration 1 values.

      - If max_error and line_loss_events are unchanged (about 0.060 to 0.065 m, one
      loss per trial), gain tuning is exhausted. Keep base_speed 1.4 and test a smaller
      outer-sensor footprint (sensor_size 0.012) with sensor_positions still near
      x = +/-0.03, since the 16 mm footprint sees the tape only within about 0.02
      m of the line.


      - [Open this output](iteration-7/entityR1/versions/b37cbf5ccc8b454d9ba54652052e46f8/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/d8f863a360a44618a10cbbed5075cbab/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-9b16795c0650aa35/payload.json)'
