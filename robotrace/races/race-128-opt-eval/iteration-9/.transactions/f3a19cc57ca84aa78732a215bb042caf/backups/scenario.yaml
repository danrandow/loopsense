map:
  id: race-128-opt-eval
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Tighter outer spacing
    notes: 'Iteration 4 controller with the sensor spread narrowed to plus or minus
      0.025 at 16 mm footprints, as the single change. Iterations 1 to 8 all left
      max_error at 0.060 to 0.065 m with one line loss per trial, and the Evaluator''s
      untested outer-spacing branch is the next step.


      ### Rationale


      Evidence. Iterations 1 to 8 all went off track on all 60 trials, with one line-loss
      event per trial and max_error of 0.060 to 0.065 m. Tested changes have not moved
      that excursion: the wider spread to +/-0.05 cut progress (iteration 2); ki 0.4
      changed nothing (iteration 3); kd 0.15 gave only a small gain (iteration 4);
      line_loss search_right matched last_direction exactly (iteration 5); base_speed
      1.25 changed max_error by about 0.001 to 0.004 m (iteration 6); kp 2.0 did not
      help (iteration 7); and sensor_size 0.012 gave 53.05 against 53.71, with max_error
      unchanged (iteration 8). The off-track limit is max(0.06, 0.0125 + body_width/4),
      so body_width cannot raise it. Iteration 8 is therefore a repeat of the sensor-footprint
      test, and the Evaluator''s pending feedback for this design describes that test
      as not yet raced. Its branch (a) applies: max_error and line-loss count are
      unchanged, so footprint is not the limit. The next untested geometry variable
      is outer sensor spacing, which the Evaluator asked to test in isolation.


      Change. Against iteration 4 (best-measured controller: kp 1.5, kd 0.15, ki 0,
      base_speed 1.4, last_direction), I change only sensor_positions, from x = +0.03,
      +0.015, 0, -0.015, -0.03 to x = +0.025, +0.0125, 0, -0.0125, -0.025, all at
      y = 0.03. sensor_size goes back to 0.016 (the 0.012 footprint gave no benefit
      and the Evaluator''s rule (c) favours 0.016). Spread stays near +/-0.03 because
      the wider +/-0.05 spread weakened steering.


      Expected result. A tighter spread gives a steeper signal for small offsets,
      which may correct the drift earlier, so max_error may fall slightly. The result
      is more likely a near-null: max_error about 0.060 to 0.065 m with one loss per
      trial. If progress falls, spacing has cut the usable signal and +/-0.03 is the
      better geometry.


      Hypotheses and measurements. (1) Tighter outer spacing reduces the drift before
      the first loss, so max_error and line_loss_events improve. (2) If nothing moves,
      the excursion is set by the disturbance or the course, and the next candidate
      should test wheel_track (narrower track raises yaw rate per PWM difference)
      or a mass change. Measurements: max_error and line_loss_events per track to
      test the drift; progress and completion_time to check that the run gets further;
      steering_oscillation to check for jitter from the steeper signal; completion
      to check for any finish.


      - [Open this output](iteration-9/entity0/versions/2e5acb1ab3104cf1a76c5e936969436e/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-c6f64670e535535f/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-d9ff9759fbd33215/payload.json)'
  - id: entityR1
    label: Evaluator Feedback
    notes: 'Evaluator Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      candidate is the iteration 4 design (best-measured controller: kp 1.5, kd 0.15,
      ki 0, base_speed 1.4, last_direction) with one geometry change: sensor_size
      goes from 0.016 to 0.012, positions unchanged at x = +0.03 to -0.03 with y =
      0.03. Evidence: all 60 trials in every iteration since 1 went off track with
      one line-loss event each and max_error of about 0.060 to 0.065 m. Iterations
      3 (ki), 4 (kd), 5 (line_loss), 6 (base_speed) and 7 (kp 2.0) each left that
      excursion essentially unchanged, so gain and speed tuning look exhausted for
      this geometry. Iteration 2 showed that widening the spread to plus or minus
      0.05 weakens steering and cuts progress, so the spread should stay near plus
      or minus 0.03. The candidate is valid and differs from iteration 4 by a single
      field. Racing it is more informative than another revision round, and the scores
      of all designs sit within about 1.5 points, so the cost of a null result is
      small.


      A caution on the hypothesis. A 12 mm footprint reaches the tape only to about
      0.0185 m from the line, against about 0.0205 m for 16 mm, so the main expected
      effect is if anything a slightly earlier loss, not a later one. A worse result
      would therefore be informative: it would confirm that reach matters and point
      to larger footprints, not smaller ones.


      What to change after the race, depending on telemetry. (a) If max_error and
      line_loss_events are unchanged (about 0.060 to 0.065 m, one loss per trial),
      sensing footprint is not the limit either. The excursion is set by the disturbance
      or the course, so test a different outer spacing (for example plus or minus
      0.025) with sensor_size 0.016 as a single change. (b) If max_error or line-loss
      count gets worse, restore sensor_size 0.016, since reach is the limiting factor.
      (c) If steering_oscillation rises with no gain, restore 0.016 as well, because
      the signal is noisier. Completion remains unlikely at 1.4, so progress and completion_time
      are the measurements to watch.


      ### Requested changes


      - If max_error and line_loss_events are unchanged from iteration 4 (about 0.060
      to 0.065 m, one loss per trial), keep sensor_size 0.012 or return it to 0.016,
      and test sensor_positions at x = +0.025, +0.0125, 0, -0.0125, -0.025 (y = 0.03)
      as a single change, since the outer-spacing effect has not been tested in isolation.

      - If max_error or line_loss_events gets worse with sensor_size 0.012, restore
      controller and geometry to iteration 4 with sensor_size 0.016, because the smaller
      footprint''s shorter reach (about 0.0185 m against 0.0205 m) is limiting the
      first line loss.

      - If steering_oscillation rises with no gain in max_error, set sensor_size back
      to 0.016 and keep kp 1.5, kd 0.15, ki 0, base_speed 1.4, so the controller stays
      at the best-measured values.


      - [Open this output](iteration-8/entityR1/versions/87df26dd6213491b9276a0bdf61ebcd0/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/4b59c5f0a372459b89dfdeb9bb473a08/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-93f28b175114addc/payload.json)'
