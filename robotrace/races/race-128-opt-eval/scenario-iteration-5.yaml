  id: race-128-opt-eval
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Search-right recovery
    notes: 'Keeps the iteration 4 best design (kd 0.15, ki 0) and changes only line_loss
      to search_right, since max_error and line-loss count were unchanged by damping.
      Evidence: iteration 4 scored 53.7076 with max_error about 0.061 to 0.065 m and
      one line loss per trial.


      ### Rationale


      Evidence: every design so far has gone off track on all 60 trials with exactly
      one line-loss event per trial and max_error of about 0.060 to 0.065 m. Iteration
      4 (kd 0.15, ki 0) scored 53.7076, the best so far, but its max_error (0.0607,
      0.0648, 0.0621) and line-loss count are essentially unchanged from iteration
      1. Damping is therefore not the main limit. Iteration 3 showed ki 0.4 changes
      nothing, so the fixed-bias hypothesis is not supported. Iteration 2 showed the
      wider +/-0.05 sensor spread weakens steering and cuts progress, so geometry
      stays at +/-0.03 with 16 mm footprints. Off-track limit is max(0.06, 0.0125
      + 0.12/4) = 0.06 m, so a wider body does not help; body_width 0.18 gives only
      0.0575 m.


      Change (single variable against iteration 4): controller.line_loss from last_direction
      to search_right. Iteration 4 already has ki 0 and kd 0.15, which is the Evaluator''s
      approved baseline for this step. Every run loses the line once, and the excursion
      after that loss is what pushes max_error over 0.06 m. The recovery steering
      direction is the one remaining untested variable that acts exactly at that moment.
      Geometry, kp 1.5, base_speed 1.4 and sensor weights are kept so the result is
      attributable to line_loss alone.


      Expected result: if the post-loss excursion is direction-dependent, max_error
      should drop to 0.06 m or below on some seeds and line_loss_events should stay
      at 1 or fall. If max_error and line-loss count are unchanged, recovery direction
      is not the limit, and the next test is base_speed 1.2 to 1.3 for bend entry
      speed. Completion is still unlikely at 1.4, so completion_time will be the next
      limit once the line is held.


      - [Open this output](iteration-5/entity0/versions/ad93b95d5ed04b66bdc90a072b276949/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-78f6d7b16b65ff6c/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-9576b021f57331df/payload.json)'
  - id: entityR1
    label: 'Approve: line_loss search'
    notes: 'Approved the iteration 4 design with one change, line_loss set to search_right,
      to test whether recovery direction limits the first line loss seen on all 60
      trials. Ki and kd tests in iterations 3 and 4 left max_error and line-loss count
      unchanged, and the test is cheap and single-variable.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      candidate is the iteration 4 design (best raced, 53.7076, kd 0.15, ki 0, kp
      1.5, base_speed 1.4, x = +/-0.03 with 16 mm footprints). Its only change is
      controller.line_loss from last_direction to search_right. Evidence: every design
      so far has gone off track on all 60 trials with one line-loss event each and
      max_error of about 0.060 to 0.065 m. Iteration 3 (ki 0.4, 52.8064) and iteration
      4 (kd 0.15, 53.7076) both left rms_error, max_error and line-loss count essentially
      unchanged, so neither the fixed-bias hypothesis nor damping is the main limit.
      The recovery direction is the one untested variable that acts at the moment
      of the first loss. One caution: search_right always steers left during a loss,
      so it helps only if the excursions that cause the loss are mostly on the right.
      last_direction is the physically sensible choice in general. The test is cheap,
      the candidate is valid, and it differs from the best raced design by one field,
      so racing it is more informative than another revision. Next-race guidance:
      if max_error falls to 0.06 m or below, or line_loss_events falls to 0 or 1 on
      some seeds, keep search_right and test base_speed 1.6 for progress and completion_time.
      If max_error and line-loss count are unchanged, the recovery direction is not
      the limit, so revert to last_direction and test base_speed 1.2 to 1.3 for bend-entry
      speed. If the excursions get worse, the loss is one-sided in the other direction,
      so revert to last_direction and do the same speed test.


      ### Requested changes


      - If max_error drops to 0.06 m or below, or line_loss_events falls to 0 or 1,
      keep controller.line_loss = search_right and test controller.base_speed = 1.6
      to raise progress and completion_time.

      - If max_error and line_loss_events are unchanged from iteration 4 (max about
      0.060 to 0.065 m, one loss per trial), set controller.line_loss back to last_direction
      and test controller.base_speed = 1.2 to 1.3 to see whether bend-entry speed
      is causing the line loss.

      - If max_error rises above the iteration 4 values, revert controller.line_loss
      to last_direction and keep kd 0.15 and ki 0, so that the only remaining change
      is base_speed.


      - [Open this output](iteration-5/entityR1/versions/f175821b73944ec88d4a176f220c8afc/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/ad93b95d5ed04b66bdc90a072b276949/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-9576b021f57331df/payload.json)'
