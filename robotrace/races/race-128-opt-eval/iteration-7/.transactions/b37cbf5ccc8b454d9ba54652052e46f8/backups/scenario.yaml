map:
  id: race-128-opt-eval
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence. Iteration 6 already raced base_speed 1.25 (with ki 0, kd 0.15, last_direction,
      x = +/-0.03 with 16 mm footprints). Its max_error was 0.0606, 0.0653 and 0.0657
      m, against 0.0607, 0.0648 and 0.0621 at 1.4, so speed made no measurable difference
      to the excursion. Every design so far has ended off track on all 60 trials with
      exactly one line-loss event per trial. Progress was 0.11 to 0.165 and there
      were no completions. The Evaluator''s authorised feedback for this candidate
      was written as if 1.25 had not yet raced, but the race data shows it has, so
      its guidance (a) does not apply. Its guidance (b) does apply: max_error and
      line-loss count are unchanged, so speed is not the limit. Following that guidance,
      I restore base_speed to 1.4 and make one controller change: kp from 1.5 to 2.0,
      with kd 0.15, ki 0 and last_direction unchanged. The fixed-bias (ki), damping
      (kd), recovery-direction (line_loss) and speed hypotheses have each been tested
      with no effect on the 0.060 to 0.065 m excursion. Stiffer proportional steering
      is the one controller variable not yet isolated, and the robot is drifting toward
      the line edge before the first loss. Expected result: max_error falls to 0.06
      m or below on some seeds, or line-loss events drop, and progress is at least
      unchanged. The risk is that kp 2.0 with kd 0.15 adds oscillation (steering_oscillation
      rising sharply with no gain). I am not changing geometry: widening the sensors
      to +/-0.05 previously cut progress, and the off-track limit cannot be raised
      with body_width. Measurements wanted: max_error and line_loss_events per track
      to test whether stiffer steering holds the line; steering_oscillation to check
      for jitter; progress and completion_time to see whether the run gets further;
      completion to check for any finish. If max_error is still about 0.060 to 0.065
      m with one loss per trial, the next step is to add sensor spacing or footprint
      changes at the outer sensors, not further gain tuning.


      - [Open this output](iteration-7/entity0/versions/d8f863a360a44618a10cbbed5075cbab/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-d69b390cdf74ea63/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-9b16795c0650aa35/payload.json)'
  - id: entityR1
    label: 'Approve: speed 1.25 test'
    notes: 'Approved the iteration 4 design with base_speed lowered from 1.4 to 1.25
      and line_loss reverted to last_direction, the only untested variable left at
      the point of drift. Iteration 5 showed search_right had no effect, and every
      race so far has left the robot off track at about 0.06 m with one loss per trial.
      Racing this gives the speed evidence the next critique needs.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      candidate is the iteration 4 design (best raced, 53.7076: kd 0.15, ki 0, kp
      1.5, x = +/-0.03 with 16 mm footprints) with two changes: base_speed goes from
      1.4 to 1.25, and line_loss is back to last_direction. The line_loss change is
      a revert, not a new test: iteration 5 (search_right) matched iteration 4 to
      four decimal places on all three tracks, so recovery direction has no measured
      effect. The speed change is the only variable not yet isolated. The 1.6 baseline
      in iteration 0 was run with kp 2.0, kd 0.05 and 12 mm footprints, so it never
      tested speed alone. Every race so far has ended off track on all 60 trials with
      one line-loss event each and max_error of about 0.060 to 0.065 m. The geometry
      (iteration 2) and ki (iteration 3) changes did not help, and kd 0.15 (iteration
      4) gave only a small gain. The off-track limit cannot be raised with body_width
      (iteration 5 analysis), so the excursion has to be reduced by the controller
      or by speed. The candidate is valid, differs from the best raced design only
      by base_speed, and is cheap to race. Racing it gives the speed evidence the
      next critique needs, and the iteration has enough runs left for one more revision
      if the race points to a clear fix. Next-race guidance: (a) If max_error falls
      to 0.06 m or below, or line_loss_events drops to 0 or 1 on some seeds, keep
      base_speed 1.25 and check whether progress and completion_time improve. (b)
      If max_error and line_loss_events are unchanged (about 0.060 to 0.065 m, one
      loss per trial), speed is not the limit. Restore base_speed 1.4 and test kp
      2.0 with kd 0.15 as a single change, to see whether stiffer steering corrects
      the drift before the 0.05 m loss. (c) If progress falls below about 0.11 with
      no reduction in line loss, the slower speed costs more than it gains, so revert
      to 1.4.


      ### Requested changes


      - If max_error falls to 0.06 m or below, or line_loss_events falls to 0 or 1,
      keep controller.base_speed = 1.25 and check progress and completion_time against
      iteration 4 (progress 0.11 to 0.16, no completions) before any further change.

      - If max_error stays at about 0.060 to 0.065 m with one loss per trial, set
      controller.base_speed back to 1.4 and test controller.kp = 2.0 with kd = 0.15
      and ki = 0 as a single change. Iteration 0 is the only kp 2.0 run and it had
      a different kd and footprint, so this has not been tested cleanly.

      - If progress falls below about 0.11 with no drop in line-loss events, revert
      controller.base_speed to 1.4, since the slower run is losing distance without
      reducing the excursion.


      - [Open this output](iteration-6/entityR1/versions/c8e9c4ca1694418a9c13137db4286dc1/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/33dca60274d646d7a8898233d514663d/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-50c7bf0c8239ffdd/payload.json)'
