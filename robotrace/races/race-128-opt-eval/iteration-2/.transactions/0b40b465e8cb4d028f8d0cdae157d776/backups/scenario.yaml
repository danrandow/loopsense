map:
  id: race-128-opt-eval
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: kp 2.0, kd 0.15 retune
    notes: 'Restores edge steering authority (kp 1.5 to 2.0) and adds damping (kd
      0.1 to 0.15) while keeping the iteration-1 geometry and speed of 1.4. Iteration
      1 showed max_error 0.061 to 0.065 m with one line loss per run, so the aim is
      to bring the post-line-loss transient under the 0.06 m limit.


      ### Rationale


      Evidence: iteration 1 (sensors at x=-0.03..+0.03, 16 mm footprints, kp 1.5,
      kd 0.1, base_speed 1.4) raised the development score from 26.0 to 52.8, but
      every run still went off track with one line-loss event each. max_error is 0.061
      to 0.065 m against a 0.06 m limit, and rms_error stayed near 0.03 m. The failure
      is therefore a transient right after the line is lost, not steady drift. Iteration
      1 mixed results: the oval improved slightly (0.0606 vs 0.0614), but the s-bend
      (0.0639 vs 0.0611) and slalom (0.065 vs 0.0609) got worse. Lowering kp weakened
      the steering authority at the edge. When only the outer sensor sees tape, the
      signal is about +/-2, so turn is about kp*2. At kp 1.5 that is roughly 1050
      PWM of wheel difference, which is too weak to pull the robot back before it
      reaches 0.05 m, where the line is lost. Changes: (a) kp raised from 1.5 back
      to 2.0 to restore edge steering authority; (b) kd raised from 0.1 to 0.15 to
      damp the faster response and limit overshoot after recovery; (c) base_speed
      held at 1.4 so that speed is not changed at the same time as the gains, which
      keeps the effect of this iteration interpretable; (d) sensor geometry kept at
      16 mm footprints and x=-0.03..+0.03, since it is the best-scoring geometry so
      far. line_loss stays last_direction. Expected result: fewer or shorter line-loss
      transients, max_error near or below 0.06 m on the oval and s-bend, and a clean
      run that may still stop short of progress 0.995 at this speed. Hypotheses to
      check: (1) if max_error drops below 0.06 with line_loss_events 0 or 1, the gain
      change was the fix and speed can rise to about 1.6; (2) if steering_oscillation
      rises sharply (above about 0.2) with kd 0.15, kd was too high and should return
      to about 0.1; (3) if line_loss_events stays at 1 on every track, the limit is
      the sensor reach (line lost near 0.05 m offset), and a wider sensor spread or
      a different line_loss mode (search_right) is the next test.


      - [Open this output](iteration-2/entity0/versions/4d498fa3419e47a6a3fcb59a836ed0dd/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-f8d060d3be500cbd/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-763b107b206446c3/payload.json)'
  - id: entityR1
    label: Wider sensors, softer
    notes: 'Approved the candidate that widens the sensor spread to ±0.03 m with 16
      mm footprints, lowers kp to 1.5, raises kd to 0.1, and cuts base_speed to 1.4.
      This targets the baseline''s early line loss (one event per trial, max_error
      about 0.061 m, all 60 trials off track). Racing it gives telemetry sooner than
      another revision round, and the feedback sets out the speed and sensor-resolution
      checks to run next.


      ### Feedback


      Written before this candidate has raced. The baseline (iteration 0, 60 development
      trials) went off track on all three tracks with one line-loss event each, progress
      of 0.04 to 0.12, and max_error of about 0.061 m, just past the 0.06 m limit.
      rms_error was low (about 0.03 m), so the failure is a transient after the line
      is lost, not steady drift. This candidate targets that failure directly: sensors
      spread to x = -0.03 to +0.03 with 16 mm footprints so the outer sensors see
      the tape sooner, kp cut from 2.0 to 1.5 to soften the turn response, and kd
      raised from 0.05 to 0.1 to damp it. Two points to check when telemetry arrives.
      First, the 16 mm footprints overlap heavily with 0.015 m sensor spacing, so
      the signal resolution is coarser than the baseline''s. Watch whether rms_error
      rises. Second, base_speed was cut from 1.6 to 1.4. At that speed the course
      may not be covered in 3.0 s, so a clean run that stops short of progress 0.995
      would show that speed, not line tracking, is now the limit. Next-race guidance:
      if line_loss_events is 0 or 1 and max_error stays below 0.06 m but completion
      is 0 with progress near 1, raise base_speed to 1.6 to 1.7 and keep kp at 1.5.
      If line_loss_events is still 1 or more with max_error above 0.06 m on the s-bend,
      reduce base_speed further or raise kd to about 0.15. If the run completes with
      completion_time well under 2.8 s, the gains are good; keep them and tune speed
      up.


      ### Requested changes


      - If the next race shows completion 0 with progress near 1 and no line-loss
      events, raise base_speed from 1.4 to 1.6-1.7 (the baseline at 1.6 lost the line
      early, so the speed was not the cause of the baseline failure) while keeping
      kp 1.5 and kd 0.1.

      - If line_loss_events is still 1 or more and max_error exceeds 0.06 m on the
      s-bend, reduce base_speed to about 1.2-1.3 or raise kd to about 0.15 to damp
      the transient that pushed the baseline off track.

      - If rms_error rises above about 0.04 m with the 16 mm footprints, reduce sensor_size
      to 0.012 and keep the wider spread x = -0.03 to +0.03, because the coarser signal
      may be causing the extra error.


      - [Open this output](iteration-1/entityR1/versions/82073debfe88455a8f5b2a708a82fe91/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/ef673030a82a4e6b9e2fd9a6f1382ec1/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-70198df58ee69095/payload.json)'
