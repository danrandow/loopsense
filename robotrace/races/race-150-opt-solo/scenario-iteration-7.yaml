  entities:
  - id: entity0
    label: Lighter mass + ±0.05
    notes: 'Combines the iteration 4 sensor spread (±0.05 m, best slalom progress)
      with the iteration 3 base speed (1.1, 20/20 s-bend), and drops mass to 0.7 kg
      to reduce yaw inertia at sharp slalom corners. Confounded single-variable test;
      the race will show whether the slalom progresses past its first failing bend.


      ### Rationale


      Evidence. Iteration 3 (score 680.6) is the best so far: oval and s-bend finish
      20/20 at 1.998 s and 2.387 s, but the slalom goes off track in every trial (progress
      0.35, about one line loss per run, max_error 0.063 m). Iteration 4 (669.9) widened
      the sensor spread to ±0.05 m with kp 1.0 and base_speed 1.0. Slalom progress
      rose to 0.42, but s-bend completion fell to 18/20. Iteration 5 (7 sensors, 16
      mm) cut slalom line losses to 0.45 but reduced progress to 0.29 and added jitter.
      Iteration 6 (speed 0.9, kp 0.9, kd 1.0) regressed to 610, with s-bend completion
      down to 12/20. Slower speed and more kd therefore did not help, and the slalom
      is still the limiting track. The off-track limit stays at 0.06 m because body
      width cannot widen it. The robot must track tighter, so I am combining the two
      best levers: the ±0.05 m sensor spread from iteration 4, which gave the most
      slalom progress, with base_speed 1.1 from iteration 3, which kept the s-bend
      at 20/20. kp 1.0 and kd 0.8 are kept from iteration 4. Change: mass 0.8 -> 0.7
      kg. Lower mass reduces yaw inertia, so the robot should respond faster through
      the sharp slalom corners. This is a confounded test, and it is the one new variable
      I am adding. Expected result: s-bend completion back near 20/20, slalom progress
      above 0.42, and line_loss_events on the slalom below 1.0. Risks: lighter mass
      may increase steering jitter, and the mass change may not be separable from
      the sensor change in one race. Hypotheses to test: (a) slalom failure is driven
      by late line detection, so the ±0.05 m reach helps and the 12 mm footprint is
      adequate; (b) yaw inertia sets the lag at the sharpest bend. Measurements wanted:
      per-track progress, max_error and line_loss_events on the slalom, steering_oscillation
      to check the jitter cost, and completion_time to confirm the 3 s budget. If
      the slalom still leaves the track at the same bend, the next test is line_loss
      ''search_left'' or ''search_right''.


