map:
  id: race-176-opt-eval
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Revert kd, speed 1.2
    notes: 'Reverts kd to 0.3 because kd 0.25 dropped the score from 354.2 to 163.3,
      with oval completion falling from 16/20 to 1/20 and line loss rising. Tests
      base_speed 1.2 alone on the best baseline (kp 2.0, kd 0.3, speed 1.1), following
      the Evaluator''s fallback.


      ### Rationale


      Evidence: iteration 7 tested kd 0.25 alone against the iteration 6 baseline
      (kp 2.0, kd 0.3, base_speed 1.1). It scored 163.3, down from 354.2. Oval completion
      fell from 16/20 to 1/20, oval line_loss_events rose from 0.85 to 1.3, and oval
      max_error rose from 0.048 to 0.063, reaching the 0.06 off-track limit. Oval
      steering_oscillation also rose, from 0.327 to 0.365, so the hypothesis that
      lower kd would reduce jitter is contradicted. Lower kd gave less damping on
      the bends, which is the risk the Evaluator flagged. Following the Evaluator''s
      rule, I revert kd to 0.3. The narrow five-sensor geometry, sensor_weights [2,1,0,-1,-2],
      ki 0 and last_direction stay unchanged, and kp stays at 2.0, the value that
      improved line retention in iteration 6.


      Change: base_speed 1.1 to 1.2, as the single variable. This restores the best
      raced controller (iteration 6) and adds one speed step. Speed 1.1 is the only
      tested setting between 0.9 (worse, iteration 5) and 1.3 (worse at kp 2.5 and
      kd 0.3, iteration 1), and 1.2 has not been tested. Oval mean finish time was
      about 1.96 s at 1.1, so there is time margin under 3.0 s. The aim is to lift
      oval and s-bend progress and completion time while keeping line loss at or below
      iteration 6 levels.


      Expected result: oval completion holds near 80% with line_loss_events at or
      below 0.85 and max_error at or below 0.048. Oval completion_time may fall slightly.
      The s-bend and slalom still have line loss near 1 per run, so they may stay
      off track. Risk: higher speed could raise line loss on the tight bends. If line_loss_events
      or max_error rise, the next step is to return to base_speed 1.1 and test a small
      kp change (about 1.8) alone, since iteration 6 showed kp reduction helped line
      retention.


      Hypotheses to test: (a) the kp 2.0 and kd 0.3 controller is near a local optimum,
      and a modest speed increase will shorten run time without raising line loss;
      (b) the s-bend and slalom failures come from line loss on the bends, not from
      sensor coverage.


      Measurements requested: per-track completion, progress, completion_time, line_loss_events,
      max_error and steering_oscillation, plus noise_robustness.


      - [Open this output](iteration-8/entity0/versions/fd5f0f3efe0c4bc99973594e02a88023/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-6b2b3bd168f9ce7c/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-3c1bf5c582ca0a45/payload.json)'
  - id: entityR1
    label: Approve kd 0.25 test
    notes: 'Approves the single-variable step kd 0.3 to 0.25 on the iteration 6 best
      design (354.2), with kp 2.0 and base_speed 1.1 held. Oscillation is the main
      jitter reading (0.327 at kd 0.3), and iteration 6 showed kp 2.0 cut line loss,
      so this is a clean test with budget left for a revision if needed.


      ### Feedback


      Pre-race review of the iteration 7 candidate. It keeps the iteration 6 design
      (best raced at 354.2: narrow five-sensor array at x = 0.03, 0.015, 0, -0.015,
      -0.03; sensor_weights [2,1,0,-1,-2]; base_speed 1.1; kp 2.0; ki 0; last_direction)
      and changes one variable, kd from 0.3 to 0.25. Iteration 6 showed that kp 2.5
      to 2.0 cut oval line_loss_events (0.95 to 0.85), oval max_error (0.054 to 0.048)
      and s-bend line loss (1.25 to 1.1), while oval completion rose to 16 of 20.
      Its oval steering_oscillation of 0.327 is the highest jitter reading, and iteration
      4 (kd 0.3, kp 2.5) gave the same 0.327, so kd is the next untested lever. Iteration
      3 (kd 0.25 with kp 2.2 at base_speed 1.3) lost line and scored 106.7, but it
      also changed kp and speed, so it does not isolate kd. Iteration 5 showed that
      base_speed 0.9 hurts completion, so speed stays at 1.1. Iteration 2 showed that
      the wide array does not help, so the geometry is kept. The candidate is valid,
      within contract limits, and a clean one-variable step from the best design,
      so it is approved. Nothing about its performance can be read from the earlier
      races; the race is the test. Next step, depending on the race: if oval steering_oscillation
      falls and line_loss_events and max_error stay at or below iteration 6 levels,
      keep kd 0.25 and test a larger line-loss fix for the s-bend and slalom, such
      as a separate small kp change. If line_loss_events or max_error rise, revert
      kd to 0.3 and test base_speed 1.2 alone, since 1.1 and 1.3 are the only tested
      speeds near that range.


      ### Requested changes


      - If the race shows line_loss_events and max_error at or below iteration 6 levels
      (0.85 and 0.048 on the oval) with lower oscillation, keep kd 0.25 and vary kp
      only in a small step (about 1.8) to see whether the s-bend (line loss 1.1) and
      slalom (line loss 1.0) improve, since iteration 6 showed kp reduction helped
      line retention.

      - If line_loss_events or max_error rise with kd 0.25, revert kd to 0.3 and test
      base_speed 1.2 alone, since iteration 6 at kd 0.3 is the best raced baseline
      and iteration 1 at 1.3 and iteration 4 at 1.1 are the only controlled speed
      comparisons.

      - Keep the narrow five-sensor geometry and sensor_weights [2,1,0,-1,-2] unchanged
      in either case, since iteration 2 (wide array, 22.5 mm spacing) dropped the
      score to 81.1 without improving line loss.


      - [Open this output](iteration-7/entityR1/versions/ce0a738283774077ba0df3380aa5a9c6/payload.json)

