map:
  id: race-176-opt-eval
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Revert kd, speed 1.2
    notes: 'Reverts kd to 0.3 because kd 0.25 dropped the score from 354.2 to 163.3,
      with oval completion falling from 16/20 to 1/20 and line loss rising. Tests
      base_speed 1.2 alone on the best baseline (kp 2.0, kd 0.3, speed 1.1), following
      the Evaluator''s fallback.


      ### Rationale


      Evidence: iteration 7 tested kd 0.25 alone against the iteration 6 baseline
      (kp 2.0, kd 0.3, base_speed 1.1). It scored 163.3, down from 354.2. Oval completion
      fell from 16/20 to 1/20, oval line_loss_events rose from 0.85 to 1.3, and oval
      max_error rose from 0.048 to 0.063, reaching the 0.06 off-track limit. Oval
      steering_oscillation also rose, from 0.327 to 0.365, so the hypothesis that
      lower kd would reduce jitter is contradicted. Lower kd gave less damping on
      the bends, which is the risk the Evaluator flagged. Following the Evaluator''s
      rule, I revert kd to 0.3. The narrow five-sensor geometry, sensor_weights [2,1,0,-1,-2],
      ki 0 and last_direction stay unchanged, and kp stays at 2.0, the value that
      improved line retention in iteration 6.


      Change: base_speed 1.1 to 1.2, as the single variable. This restores the best
      raced controller (iteration 6) and adds one speed step. Speed 1.1 is the only
      tested setting between 0.9 (worse, iteration 5) and 1.3 (worse at kp 2.5 and
      kd 0.3, iteration 1), and 1.2 has not been tested. Oval mean finish time was
      about 1.96 s at 1.1, so there is time margin under 3.0 s. The aim is to lift
      oval and s-bend progress and completion time while keeping line loss at or below
      iteration 6 levels.


      Expected result: oval completion holds near 80% with line_loss_events at or
      below 0.85 and max_error at or below 0.048. Oval completion_time may fall slightly.
      The s-bend and slalom still have line loss near 1 per run, so they may stay
      off track. Risk: higher speed could raise line loss on the tight bends. If line_loss_events
      or max_error rise, the next step is to return to base_speed 1.1 and test a small
      kp change (about 1.8) alone, since iteration 6 showed kp reduction helped line
      retention.


      Hypotheses to test: (a) the kp 2.0 and kd 0.3 controller is near a local optimum,
      and a modest speed increase will shorten run time without raising line loss;
      (b) the s-bend and slalom failures come from line loss on the bends, not from
      sensor coverage.


      Measurements requested: per-track completion, progress, completion_time, line_loss_events,
      max_error and steering_oscillation, plus noise_robustness.


      - [Open this output](iteration-8/entity0/versions/fd5f0f3efe0c4bc99973594e02a88023/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-6b2b3bd168f9ce7c/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-3c1bf5c582ca0a45/payload.json)'
  - id: entityR1
    label: 'Revise: hold speed at 1.1'
    notes: 'Revise because base_speed 1.2 repeats a speed rise that earlier races
      (1.3 at kp 2.5, iteration 1 vs 4) show costs oval completion and line retention.
      Iteration 6 (354.2) stays the baseline, and the requested test is kp 1.8 alone,
      following the kp 2.5 to 2.0 gain.


      ### Feedback


      Pre-race review of the iteration 8 candidate. It keeps the iteration 6 design
      (narrow five-sensor array at x = 0.03, 0.015, 0, -0.015, -0.03; sensor_weights
      [2,1,0,-1,-2]; kp 2.0; kd 0.3; ki 0; last_direction) and changes one variable,
      base_speed from 1.1 to 1.2. Iteration 6 (kp 2.0, kd 0.3, base_speed 1.1) is
      the best raced design at 354.2, with 16 of 20 oval finishes. The speed evidence
      points the wrong way for an increase. At kp 2.5 and kd 0.3, base_speed 1.3 (iteration
      1) gave 3 of 20 oval finishes and 1.25 oval line-loss events, while base_speed
      1.1 (iteration 4) gave 11 of 20 and 0.95. Iteration 5 showed that 0.9 also hurt,
      so 1.1 is the only tested speed that works, and nothing so far shows a benefit
      above it. Iteration 7 showed that kd 0.25 alone cut oval completion to 1 of
      20, so kd 0.3 stays. Each line-loss event costs about 15 points per unit progress,
      so a speed rise that adds line loss would cost more than the small time gain
      (the 60*(1 - t/3) term is worth about 20 points at the oval time of about 1.96
      s). The candidate is valid and within contract limits, but its one change is
      the speed step that the earlier races argue against. Revise: restore base_speed
      to 1.1 and test kp alone at a smaller value. kp reduction from 2.5 to 2.0 cut
      oval line loss, max_error and s-bend line loss, so the same direction is the
      cleanest next test. If the race then shows line loss at or below iteration 6
      levels, keep kp there and test base_speed 1.15 later, not 1.2 yet.


      ### Requested changes


      - Set base_speed back to 1.1 and keep kd 0.3, ki 0, last_direction and the narrow
      geometry, since iteration 6 at 1.1 (354.2) is the best raced result and iteration
      7 showed kd 0.25 drops oval completion to 1 of 20.

      - Change kp alone from 2.0 to 1.8. Iteration 4 to iteration 6 showed kp 2.5
      to 2.0 cut oval line_loss_events from 0.95 to 0.85, max_error from 0.054 to
      0.048, and s-bend line loss from 1.25 to 1.1, so further reduction is the next
      untested step in the same direction.

      - If kp 1.8 raises line_loss_events or max_error above the iteration 6 levels
      (0.85 and 0.048 on the oval), return to kp 2.0 and do not test speed above 1.1
      until a speed step is supported by a line-loss result. Iteration 1 at 1.3 and
      iteration 4 at 1.1 show that the higher speed loses line.


      - [Open this output](iteration-8/entityR1/versions/874750a730564ead9e4a56367b1a439b/payload.json)

