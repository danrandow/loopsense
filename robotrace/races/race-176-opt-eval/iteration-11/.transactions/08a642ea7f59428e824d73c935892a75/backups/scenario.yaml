map:
  id: race-176-opt-eval
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: Hold iter 9 best design
    notes: 'Resubmits the iteration 9 design unchanged (16 mm sensors, kp 1.8, kd
      0.3, base_speed 1.1), the best raced score at 403.3. The Evaluator''s kp 1.6
      step was not triggered because s-bend line loss rose to 2.0 rather than falling
      below 1.0, so the design is held rather than stacked with a new change.


      ### Rationale


      Evidence. Iteration 9 (sensor_size 0.016, kp 1.8, kd 0.3, base_speed 1.1, narrow
      five-sensor array) is the best raced design at 403.3, up from 366.7. On the
      oval it finished 20 of 20 (iteration 8: 18 of 20), with line_loss_events 0.15
      (0.30), max_error 0.0376 (0.0438) and progress 0.998. The s-bend improved in
      progress (0.55 vs 0.34) but its line_loss_events rose from 1.0 to 2.0, and it
      still finished 0 of 20. The slalom progress fell from 0.17 to 0.10 with line
      loss still at 1.0. The Evaluator''s conditions for the next step are not cleanly
      met. The oval held or improved, so the footprint change stays. The s-bend and
      slalom line loss did not fall below 1.0, so the Evaluator''s kp 1.6 step is
      not triggered.


      Change. None. I resubmit the iteration 9 design unchanged (sensor_size 0.016,
      kp 1.8, kd 0.3, base_speed 1.1, ki 0, last_direction, sensor_weights [2,1,0,-1,-2],
      narrow five-sensor array). The reasons: it is the best raced design, the oval
      is the most reliable track, and the one remaining variable (a kp step) would
      be a stacked change against an unresolved s-bend result. Two single-variable
      tests are possible, but the race is the scored output, so I hold the proven
      design.


      Expected result. Oval completion near 20 of 20 with line_loss_events of about
      0.15 to 0.3 and max_error near 0.04. The s-bend and slalom remain the gap, with
      progress 0.5 to 0.6 on the s-bend and about 0.1 to 0.2 on the slalom.


      Hypotheses. (a) The larger 16 mm footprint lets sensors see the line further
      off-centre on the oval, which is why oval line loss fell. (b) On the s-bend,
      the larger footprint blends readings on tight bends, so line loss rose to 2.0
      even though progress improved. (c) The s-bend and slalom are sensitive to kp,
      and kp 1.6 would test whether the kp trend continues there. Measurements requested:
      completion, progress, completion_time, line_loss_events, max_error and steering_oscillation
      on each track, plus noise_robustness, against the iteration 9 baseline.


      - [Open this output](iteration-10/entity0/versions/5e63a5bdf7d54127967e889cb3f386f0/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-a1616d1d5b6f2b5d/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-5ea5dffc6eb54ce8/payload.json)'
  - id: entityR1
    label: Approve iter 9 design
    notes: 'Approves the unchanged iteration 9 design (best raced at 403.3, oval 20
      of 20 with line loss 0.15). Requested changes set the next step: kp 1.6 if s-bend
      line loss stays at 2.0, or a revert to sensor_size 0.012 if the oval regresses.


      ### Feedback


      Pre-race review of the iteration 10 candidate. It resubmits the iteration 9
      design unchanged: narrow five-sensor array at x = 0.03, 0.015, 0, -0.015, -0.03
      with y = 0.05, sensor_size 0.016, base_speed 1.1, kp 1.8, kd 0.3, ki 0, last_direction,
      and sensor_weights [2,1,0,-1,-2]. It is the best raced design at 403.3, up from
      366.7 in iteration 8. The oval finished 20 of 20 with line_loss_events 0.15
      and max_error 0.038, both better than iteration 8. The s-bend improved in progress
      (0.55 vs 0.34) but its line loss rose from 1.0 to 2.0, and it still finished
      0 of 20. Slalom progress fell from 0.17 to 0.10 with line loss at 1.0. The candidate
      is valid, within contract limits, and not a stacked change, so it is the right
      baseline to race. A further revision would cost two action runs, and the one-variable
      alternatives (kp 1.6, or reverting the footprint) are already covered by the
      requested changes below, so approving now gives the clearest telemetry. Next
      race, interpreted as follows. If the oval holds at 20 of 20 with line loss near
      0.15 to 0.3 and the s-bend line loss stays at 2.0, the footprint may be blending
      readings on tight bends, so the next revision should test kp 1.6 alone with
      sensor_size 0.016 held. If the s-bend or slalom line loss falls below 1.0 while
      the oval holds, keep the design and test a single further change. If the oval
      completion drops below 18 of 20 or the oval max_error rises above 0.044, revert
      sensor_size to 0.012 with kp 1.8, since that is the iteration 8 baseline.


      ### Requested changes


      - If the s-bend line_loss_events stay at 2.0 while the oval holds at 20 of 20,
      make a single change to kp 1.6 with sensor_size 0.016 held, since the kp trend
      (2.5 to 2.0 to 1.8) cut line loss on every track and iteration 9''s s-bend progress
      rose to 0.55.

      - If the oval completion falls below 18 of 20 or oval max_error rises above
      0.044, revert sensor_size to 0.012 and keep kp 1.8, base_speed 1.1 and kd 0.3,
      since iteration 8 (sensor_size 0.012) is the fallback baseline at 366.7.

      - Keep the five-sensor spacing (x = 0.03, 0.015, 0, -0.015, -0.03), sensor_weights
      [2,1,0,-1,-2], kd 0.3, ki 0 and last_direction unchanged, since iteration 2
      (22.5 mm spacing) dropped the score to 81.1 and iteration 7 (kd 0.25) dropped
      it to 163.3.


      - [Open this output](iteration-10/entityR1/versions/e6ec39a5d6964bfaad43ec9551969727/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/5e63a5bdf7d54127967e889cb3f386f0/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-5ea5dffc6eb54ce8/payload.json)'
