map:
  id: race-176-opt-eval
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Narrow array, kd 0.25
    notes: 'Reverts to the iteration 1 narrow five-sensor array, which scored best
      (178.2), because the wider array in iteration 2 cut oval finishes from 3 to
      0. Lowers kp to 2.2 and kd to 0.25 to reduce the steering oscillation seen in
      iteration 1.


      ### Rationale


      Evidence: iteration 2 widened the sensor array to x = ±0.045 and lowered kd
      to 0.2. It scored 81.1, down from 178.2 in iteration 1. Oval finishes fell from
      3/20 to 0/20 and oval progress fell from 0.70 to 0.32. S-bend progress fell
      from 0.31 to 0.16. Line_loss_events stayed at about 1.0 and max_error stayed
      near 0.062 to 0.065, so the wider array did not improve line retention. The
      22.5 mm spacing leaves gaps of about 10 mm between 12 mm footprints, so the
      signal is less continuous across the tape. The Evaluator''s approval was written
      for the iteration 2 candidate before that race, so its suggestion to keep the
      wide array is contradicted by the race result. Change: revert the geometry to
      the iteration 1 narrow array (15 mm spacing, which overlaps the 25 mm tape).
      Keep the iteration 1 base_speed of 1.3 and kp 2.5 as the strongest-scoring baseline.
      Lower kd from 0.3 to 0.25 and kp from 2.5 to 2.2. Iteration 1 showed steering_oscillation
      of 0.34 on the oval and 0.24 on the s-bend. Those values rose with kd and kp,
      and oscillation likely contributes to the off-track exits. Expected result:
      oscillation falls below about 0.25, oval finishes return at roughly the iteration
      1 rate or better, and line_loss_events and max_error improve modestly. Hypotheses
      to test: (a) the narrow array with overlapping footprints keeps the signal continuous,
      so the wide array was the cause of the drop; (b) a modest reduction in kp and
      kd lowers jitter without losing the line. Next step if line loss persists at
      1 or more with max_error near 0.06: lower base_speed to about 1.1 while holding
      the geometry. If the runs finish but completion_time is above 3.0 s, raise base_speed
      toward 1.6.


      - [Open this output](iteration-3/entity0/versions/9a8b20184f7c46e486fadef014bc1996/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-c89841cece1a0eb1/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-31bfd095d2e74ca6/payload.json)'
  - id: entityR1
    label: Narrow array, gentle
    notes: 'Approves the reverted narrow five-sensor array with kd 0.25 and kp 2.2,
      since the wide array in iteration 2 cut the score from 178 to 81 with no gain
      in line retention. The gain change is small and sound, so it races to test whether
      lower oscillation keeps the best design on the line.


      ### Feedback


      Pre-race review of the iteration 3 candidate. It reverts the sensor array to
      the iteration 1 narrow layout (x = ±0.03, ±0.015, 0, 15 mm spacing, 12 mm footprints).
      Iteration 1 was the best raced design at 178.2, and iteration 2 showed that
      widening to 22.5 mm spacing cut the score to 81.1 with no gain in line retention
      (line_loss_events stayed at 1.0, max_error near 0.062). Reverting geometry is
      therefore well supported. The controller moves are small: kd 0.3 to 0.25 and
      kp 2.5 to 2.2, with base_speed 1.3, ki 0 and last_direction unchanged. The rationale
      says kp is held at 2.5 in one place and lowered to 2.2 in another. The candidate''s
      values are what I am approving, so the Optimizer should confirm the intended
      kp when revising. Iteration 1 oscillation was 0.34 on the oval and 0.24 on the
      s-bend, so lower kd is a reasonable test. The oscillation link to kd is confounded
      with the geometry change in iteration 2, so it is not proven. Sensor_weights
      and signal sign convention are valid, and every field is within its contract
      limits. The candidate is not clearly better than iteration 1, but it is a sound,
      small step from the best design and the race will give useful telemetry. Next
      race: if line_loss_events remain at 1 or more and max_error stays near 0.06,
      lower base_speed to about 1.1 while holding the geometry. If the runs finish
      but completion_time is above 3.0 s, raise base_speed toward 1.6. If oscillation
      stays above about 0.25 on the oval and s-bend, lower kd further or kp toward
      2.0.


      ### Requested changes


      - If line_loss_events stay at 1 or more and max_error stays near 0.06 with the
      narrow array, lower base_speed to about 1.1 and hold the geometry and gains,
      since iteration 1 at speed 1.3 with the narrow array was the best raced result
      but still left the line.

      - If runs finish but completion_time is above 3.0 s, raise base_speed toward
      1.6 and hold kp and kd, since iteration 1 finished the oval in about 1.97 s
      at 1.3 and the 3 s limit needs about 1.5 m/s average.

      - If steering_oscillation stays above about 0.25 on the oval or s-bend, lower
      kd toward 0.2 or kp toward 2.0, since iteration 1 (kd 0.3) gave oscillation
      of 0.34 on the oval and 0.24 on the s-bend.


      - [Open this output](iteration-3/entityR1/versions/92e7ceb01b9c4463a9b19f67c75b345d/payload.json)

