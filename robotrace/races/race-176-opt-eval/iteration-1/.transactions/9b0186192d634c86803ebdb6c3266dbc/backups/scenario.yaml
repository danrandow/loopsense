  schema: v0.2
  scenario: Iteration 1
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 0.
dimensions:
  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Slower, damped controller
    notes: 'Lowered base_speed to 1.3 and kp to 2.5, and raised kd to 0.3, to address
      the iteration 0 failures (all 60 trials went off track after line loss, with
      max_error at the 0.06 m limit). Sensor geometry is unchanged so the controller
      effect can be isolated.


      ### Rationale


      Evidence: all 60 development trials went off track (0 finishes). Progress was
      only 0.11 to 0.16, with one line-loss event per run and max_error about 0.06
      to 0.067 m. That max_error sits right at the off-track limit of max(0.06, 0.03
      + 0.03) = 0.06 m. Steering oscillation was highest on the s-bend (0.15), which
      points to over-correction in bends. The robot is losing the line in the first
      curves, so the stability margin is the first problem. Following the Evaluator''s
      guidance, I lowered base_speed from 1.6 to 1.3 to give the controller more time
      to correct on tight bends. I also made a moderate gain change: kp from 3.0 to
      2.5 to reduce over-correction, and kd from 0.15 to 0.3 to damp the oscillation
      that the s-bend shows. Sensor geometry and sensor_weights are unchanged, so
      the sensor layout is not a variable in this race. Expected result: the robot
      stays on the tape through the s-bend and slalom, line_loss_events falls to 0
      or near it, and progress rises well above 0.2. Completion within 3 s may still
      be out of reach at this speed. If the next race completes with small rms_error
      but completion_time above 3 s, I will raise base_speed toward 1.9 with kp and
      kd held. Hypotheses to test: (1) the line loss is caused by speed in bends,
      not by sensor coverage; (2) kd 0.3 reduces the steering_oscillation seen on
      the s-bend. Measurements requested: per-track progress, line_loss_events, max_error,
      and steering_oscillation, plus completion_time for any completed run.


      - [Open this output](iteration-1/entity0/versions/f97a71b773d84edbbb5bcda5edf9183f/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-615b7471e237ccb7/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-061d69798d355b79/payload.json)'
  - id: entityR1
    label: Slower, damped gains
    notes: 'Approved the candidate that lowers base_speed to 1.3, kp to 2.5 and raises
      kd to 0.3, to address the baseline''s line loss on bends (0/60 finishes, max_error
      near the 0.06 m off-track limit). The next revision depends on the race result,
      with the speed and gain fallbacks listed in the requested changes.


      ### Feedback


      This candidate changes three fields from the iteration-0 baseline, which raced
      0 of 60 trials: base_speed 1.6 to 1.3, kp 3.0 to 2.5, and kd 0.15 to 0.3. The
      baseline evidence is clear. Every run went off track with one line-loss event
      and progress of 0.11 to 0.16. Max_error sat at 0.062 to 0.067 m, just above
      the off-track limit of 0.06 m, so the robot is losing the line on the first
      curves. Steering_oscillation was highest on the s-bend (0.15), which fits over-correction.
      The change is consistent with that evidence: lower speed gives the controller
      more time on tight bends, and the higher kd damps the jitter. Sensor geometry
      and sensor_weights are unchanged and the sign convention is unchanged, so the
      candidate is valid and not obviously broken. The off-track limit for body_width
      is max(0.06, 0.0125 + body_width/4). Because body_width cannot exceed 0.18,
      that limit stays at 0.06 m, so widening the body will not buy margin. Approve
      it so the race gives telemetry on whether speed or gain is the cause of the
      line loss. Before the next race, the outcome determines the next step. If it
      still goes off track with line_loss_events of 1 or more and max_error near 0.06,
      the next revision should lower base_speed further (about 1.0) and keep the gains.
      If it completes with small rms_error but completion_time above 3.0 s, raise
      base_speed toward 1.9 with kp and kd held. If it runs but steering_oscillation
      stays high (above about 0.1), raise kd further (about 0.5) or lower kp (about
      2.0).


      ### Requested changes


      - If the next race still goes off track with max_error near 0.06 and line_loss_events
      of 1 or more, lower base_speed to about 1.0 and keep kp 2.5 and kd 0.3, since
      the baseline at base_speed 1.6 was 0 of 60 finished.

      - If the next race completes with small rms_error but completion_time above
      3.0 s, raise base_speed toward 1.9 and hold kp and kd, since the 3 s limit needs
      about 1.5 m/s average.

      - If the next race runs but steering_oscillation stays above about 0.1 on the
      s-bend, raise kd to about 0.5 or lower kp to about 2.0, since the s-bend baseline
      oscillation was 0.15.


      - [Open this output](iteration-1/entityR1/versions/bae4a50e01a14c95a782ce509b32037e/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/f97a71b773d84edbbb5bcda5edf9183f/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-061d69798d355b79/payload.json)'
