  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Slower, damped controller
    notes: 'Lowered base_speed to 1.3 and kp to 2.5, and raised kd to 0.3, to address
      the iteration 0 failures (all 60 trials went off track after line loss, with
      max_error at the 0.06 m limit). Sensor geometry is unchanged so the controller
      effect can be isolated.


      ### Rationale


      Evidence: all 60 development trials went off track (0 finishes). Progress was
      only 0.11 to 0.16, with one line-loss event per run and max_error about 0.06
      to 0.067 m. That max_error sits right at the off-track limit of max(0.06, 0.03
      + 0.03) = 0.06 m. Steering oscillation was highest on the s-bend (0.15), which
      points to over-correction in bends. The robot is losing the line in the first
      curves, so the stability margin is the first problem. Following the Evaluator''s
      guidance, I lowered base_speed from 1.6 to 1.3 to give the controller more time
      to correct on tight bends. I also made a moderate gain change: kp from 3.0 to
      2.5 to reduce over-correction, and kd from 0.15 to 0.3 to damp the oscillation
      that the s-bend shows. Sensor geometry and sensor_weights are unchanged, so
      the sensor layout is not a variable in this race. Expected result: the robot
      stays on the tape through the s-bend and slalom, line_loss_events falls to 0
      or near it, and progress rises well above 0.2. Completion within 3 s may still
      be out of reach at this speed. If the next race completes with small rms_error
      but completion_time above 3 s, I will raise base_speed toward 1.9 with kp and
      kd held. Hypotheses to test: (1) the line loss is caused by speed in bends,
      not by sensor coverage; (2) kd 0.3 reduces the steering_oscillation seen on
      the s-bend. Measurements requested: per-track progress, line_loss_events, max_error,
      and steering_oscillation, plus completion_time for any completed run.


      - [Open this output](iteration-1/entity0/versions/f97a71b773d84edbbb5bcda5edf9183f/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-615b7471e237ccb7/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-061d69798d355b79/payload.json)'
  - id: entityR1
    label: Baseline approved to race
    notes: 'Iteration 0 candidate is valid against every public_contracts limit and
      the sign conventions are consistent, so it is approved as the first telemetry
      race. No earlier race evidence exists, so the requested changes are conditional
      on what this race measures.


      ### Feedback


      Iteration 0 has no earlier race data, so this review rests on the contract and
      the candidate''s own contents. Every field is within its public_contracts limit:
      five sensors at y=0.05 with x from -0.03 to +0.03, sensor_size 0.012, and sensor_weights
      [2,1,0,-1,-2] matching the five sensors in order. The sign convention is consistent:
      positive x is left, a positive signal produces a positive turn, and that turn
      drives the left wheel down and the right wheel up, which steers left. kp 3.0
      gives at most about 2100 PWM counts of differential at the largest signal, which
      stays within the wheel limits at base_pwm of about 3276. The candidate is valid
      and not obviously broken, and it is the first race, so the telemetry is the
      most useful thing it can provide. Next race, if it completes but rms_error or
      steering_oscillation is high, reduce kp (about 2.0) or raise kd (about 0.3).
      If it leaves the line on tight bends, raise the stability margin by lowering
      base_speed (about 1.3) before changing the gains. If it completes with rms_error
      small but completion_time above 3 s, raise base_speed (about 1.9) and keep the
      gains. Do not change the sensor geometry until the controller telemetry is understood.


      ### Requested changes


      - If the next race shows steering_oscillation or max_error high with completion,
      lower kp to about 2.0 and raise kd to about 0.3, since the baseline kp of 3.0
      is untested.

      - If the next race shows line_loss_events above 0 or the robot leaves the track
      on tight bends, lower base_speed to about 1.3 before adjusting gains.

      - If the next race completes with small rms_error but completion_time above
      3.0 s, raise base_speed to about 1.9 and keep kp and kd unchanged.


      - [Open this output](iteration-0/entityR1/versions/2b09a9ff04b7448b84d59dfc75af7578/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/3c542762b64f45a3b2a8c01977b9d54e/payload.json)'
