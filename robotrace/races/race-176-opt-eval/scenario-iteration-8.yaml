map:
  id: race-176-opt-eval
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: kp 1.8, speed 1.1, kd 0.3
    notes: 'Reverts the speed step to base_speed 1.1 and the kd change to 0.3, keeping
      iteration 6 as the base, then tests kp 1.8 alone. Iteration 6 (354.2) is the
      best raced design, and iteration 7 showed kd 0.25 drops oval completion to 1
      of 20.


      ### Rationale


      Evidence. Iteration 6 (kp 2.0, kd 0.3, base_speed 1.1, narrow five-sensor array)
      is the best raced design at 354.2, with 16 of 20 oval finishes, oval line_loss_events
      0.85 and oval max_error 0.048. Iteration 7 changed only kd (0.3 to 0.25) and
      fell to 163.3, with oval completion dropping to 1 of 20 and oval line loss rising
      to 1.3. So kd 0.3 stays. Iteration 8''s pending candidate (base_speed 1.2) is
      not supported: iteration 1 at 1.3 and iteration 4 at 1.1 show line loss rising
      with speed, and iteration 5 at 0.9 also hurt. The Evaluator''s revision request
      is followed. This candidate restores base_speed to 1.1, keeps kd 0.3, ki 0,
      last_direction and the narrow geometry, and changes kp alone from 2.0 to 1.8.
      The step follows the direction that cut line loss from kp 2.5 to 2.0 (oval line
      loss 0.95 to 0.85, max_error 0.054 to 0.048, s-bend line loss 1.25 to 1.1).
      Expected result: oval line_loss_events and max_error at or below the iteration
      6 levels (0.85 and 0.048), oval completion at or above about 80%, and some gain
      on the s-bend (line loss 1.1) and slalom (line loss 1.0). Risk: kp 1.8 may be
      too weak to correct the tightest bends, which would raise max_error. If that
      happens, the next revision should return to kp 2.0 and keep speed at 1.1. Hypotheses:
      (a) further kp reduction continues to cut over-correction-driven line loss;
      (b) the s-bend and slalom failures are line loss at the bends, not sensor coverage.
      Measurements requested are per-track completion, progress, completion_time,
      line_loss_events, max_error and steering_oscillation, so the kp effect can be
      read against the iteration 6 baseline.


      - [Open this output](iteration-8/entity0/versions/37950d0b06c34064878194d17970efe9/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/874750a730564ead9e4a56367b1a439b/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-3c1bf5c582ca0a45/payload.json)'
  - id: entityR1
    label: Approve kp 1.8 single
    notes: 'Approved the iteration 8 candidate, which changes only kp from 2.0 to
      1.8 on the best raced design (354.2). The step follows the iteration 6 trend,
      where lowering kp cut oval line loss and max_error, and kd 0.3 is kept because
      kd 0.25 dropped the score in iteration 7.


      ### Feedback


      Pre-race review of the iteration 8 candidate. It keeps the iteration 6 design,
      the best raced result at 354.2, and changes one variable: kp from 2.0 to 1.8.
      Geometry (five sensors at x = 0.03, 0.015, 0, -0.015, -0.03; 12 mm footprints),
      sensor_weights [2,1,0,-1,-2], base_speed 1.1, kd 0.3, ki 0 and last_direction
      are unchanged. The step continues the direction that helped in iteration 6:
      kp 2.5 to 2.0 cut oval line_loss_events (0.95 to 0.85), oval max_error (0.054
      to 0.048) and s-bend line loss (1.25 to 1.1), and raised oval completion from
      11 to 16 of 20. Kd is held at 0.3 because iteration 7 showed that kd 0.25 alone
      dropped the score to 163.3 and oval completion to 1 of 20, so kd 0.3 stays.
      Speed is held at 1.1 because iteration 5 (0.9) hurt completion and iteration
      1 (1.3) left more line loss. The candidate is valid, within contract limits,
      and a clean single-variable step from the best design, so it is approved. Nothing
      about its performance can be read from the earlier races; the race is the test.
      Next step depends on the result. If oval line_loss_events and max_error stay
      at or below iteration 6 levels (0.85 and 0.048) and completion holds, the s-bend
      and slalom remain the gap, and the next revision should test a separate small
      change rather than stacking kp and kd together. If line loss or max_error rise,
      kp 1.8 is too weak for the tightest bends, so return to kp 2.0 with base_speed
      1.1 and kd 0.3, which is the iteration 6 baseline.


      ### Requested changes


      - If oval line_loss_events and max_error stay at or below iteration 6 levels
      (0.85 and 0.048) with kp 1.8, keep kp near 1.8 and test a single further change
      on the s-bend and slalom, since their line loss was 1.1 and 1.0 at kp 2.0 and
      the kp trend has been favourable.

      - If line_loss_events or max_error rise with kp 1.8, return to kp 2.0 (the iteration
      6 baseline) and keep base_speed 1.1 and kd 0.3, since kp 1.8 may be too weak
      to correct the tightest bends.

      - Keep the narrow five-sensor geometry, sensor_weights [2,1,0,-1,-2], kd 0.3,
      ki 0 and last_direction unchanged, since iteration 2 (wide array) cut the score
      to 81.1 and iteration 7 (kd 0.25) cut it to 163.3.


      - [Open this output](iteration-8/entityR1/versions/68f5b79e69a34414bd137677a3114048/payload.json)

