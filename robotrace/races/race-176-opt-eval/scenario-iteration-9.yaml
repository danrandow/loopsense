map:
  id: race-176-opt-eval
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Larger sensor footprint
    notes: 'Keeps the best raced controller (kp 1.8, kd 0.3, base_speed 1.1; score
      366.7) and changes only sensor_size from 12 mm to 16 mm to widen tape coverage
      on the s-bend and slalom, which still lose the line. Evidence: the oval line
      loss and max_error fell with kp 1.8, and the s-bend and slalom remain at about
      1.0 line-loss events.


      ### Rationale


      Evidence from iteration 8 (kp 1.8, kd 0.3, base_speed 1.1, narrow five-sensor
      array) is the best raced result at 366.7. On the oval, line_loss_events fell
      to 0.30 (from 0.85 at iteration 6), max_error to 0.044 (from 0.048), and completion
      rose to 18 of 20. The kp trend has been favourable at every step (2.5 to 2.0
      to 1.8). The Evaluator''s condition for keeping kp near 1.8 is met, so kp stays
      at 1.8. The s-bend (line loss 1.0, 0 of 20 finishes, progress 0.34) and the
      slalom (line loss 1.0, progress 0.17, all runs off track at the same point)
      are still the gap. Lower kd (iteration 7) and lower speed (iteration 5) both
      hurt, and wider sensor spacing (iteration 2) hurt. The one remaining lever that
      targets line retention at bends without changing the sensor layout or the control
      gains is the footprint size. I change sensor_size from 0.012 to 0.016 m, one
      variable only. The 16 mm footprints at the existing 15 mm spacing overlap more
      and cover more of the tape. The outer sensors then see the line out to about
      x = ±0.038 m, up from ±0.036 m, so the robot keeps a reading a little further
      off-centre before the line is lost. Positions, sensor_weights, kp, kd, ki, base_speed
      and last_direction are unchanged. Expected result: oval results hold at or above
      iteration 8 (line loss about 0.3, max_error at or below 0.044), and s-bend and
      slalom line-loss events fall below 1.0 with more progress. Risk: the larger
      footprint blends the readings more, which could soften the signal on the tightest
      bends. If oval line loss or max_error rises, revert sensor_size to 0.012 and
      keep kp 1.8. Hypotheses: (a) s-bend and slalom failures are line loss at the
      bends, not a sensor-spacing gap; (b) a larger footprint reduces line loss without
      the gap problem that the wide array caused. Measurements requested: per-track
      completion, progress, completion_time, line_loss_events, max_error and steering_oscillation,
      compared against the iteration 8 baseline, plus noise_robustness.


      - [Open this output](iteration-9/entity0/versions/93241e82cbf14cc09377f514cd688b5c/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-e05bf33af73426a3/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-94e8c22ad41ca78b/payload.json)'
  - id: entityR1
    label: Approve 16mm footprint
    notes: 'Approved the single-variable sensor_size change (0.012 to 0.016) on the
      best raced controller (iteration 8, 366.7), since the footprint is the one geometry
      lever not yet tested alone and the candidate is valid. Feedback gives a revert
      rule and a next-step rule tied to the iteration 8 baseline.


      ### Feedback


      Pre-race review of the iteration 9 candidate. It keeps the iteration 8 controller
      (base_speed 1.1, kp 1.8, kd 0.3, ki 0, last_direction, sensor_weights [2,1,0,-1,-2])
      and the narrow five-sensor layout (x = 0.03, 0.015, 0, -0.015, -0.03; y = 0.05),
      and changes one variable: sensor_size from 0.012 to 0.016. The best raced design
      is iteration 8 at 366.7. Its oval line loss (0.30) and max_error (0.044) are
      the strongest raced values, and the s-bend (1.0 line loss, 0 of 20 finishes)
      and slalom (1.0 line loss, progress 0.17) are still the gap. The footprint is
      the one geometry variable not yet tested alone. Iteration 2 showed that widening
      the spacing hurt (score 81.1), and this candidate keeps the 15 mm spacing, so
      that result does not apply directly. The candidate is valid, within contract
      limits, and not obviously broken. Its controller values match the best raced
      design, so the race isolates the footprint effect. Risk to watch: at 16 mm the
      neighbouring footprints overlap more, so readings may saturate and lose fine
      offset resolution on the oval. Read the result against the iteration 8 baseline
      on each track: completion, progress, completion_time, line_loss_events, max_error
      and steering_oscillation, plus noise_robustness. Next step depends on the race.
      If oval line_loss_events or max_error rise above iteration 8 levels (0.30 and
      0.044), or oval completion falls, revert sensor_size to 0.012 and keep kp 1.8.
      If line loss falls on the s-bend or slalom while oval holds, keep sensor_size
      0.016 and test one further single change, such as a small kp step, rather than
      stacking changes. Do not change the spacing: the wide array in iteration 2 did
      not help line retention.


      ### Requested changes


      - If oval line_loss_events (above 0.30) or max_error (above 0.044) rise against
      iteration 8, or oval completion drops below the iteration 8 rate of 18 of 20,
      revert sensor_size to 0.012 and keep kp 1.8, base_speed 1.1 and kd 0.3, since
      iteration 8 is the best raced baseline at 366.7.

      - If the s-bend or slalom line_loss_events fall below 1.0 with the oval held,
      keep sensor_size 0.016 and make one further single change, a small kp step to
      about 1.6, since the kp trend from 2.5 to 2.0 to 1.8 cut line loss on every
      track.

      - Keep the five-sensor spacing at x = 0.03, 0.015, 0, -0.015, -0.03 and sensor_weights
      [2,1,0,-1,-2] unchanged, since iteration 2 (22.5 mm spacing) dropped the score
      to 81.1 without improving line loss, and iteration 7 (kd 0.25) dropped it to
      163.3.


      - [Open this output](iteration-9/entityR1/versions/d8278c1e2fcf4fa3bb7b4200b89e5010/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/93241e82cbf14cc09377f514cd688b5c/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-94e8c22ad41ca78b/payload.json)'
