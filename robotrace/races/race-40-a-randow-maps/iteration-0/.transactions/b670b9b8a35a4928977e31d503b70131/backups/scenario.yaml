map:
  id: race-40-a-randow-maps
  schema: v0.2
  scenario: Iteration 0
  inherits: base.yaml
  notes: Initial prepared state before either AI role or the simulator has acted.
dimensions:
  time_horizon: prepared
  iteration: '0'
overrides:
  entities:
  - id: entity0
    label: Initial balanced geometry
    notes: 'Proposed a 5-sensor layout with moderate sensor size and balanced body
      and wheel dimensions to provide a stable and well-sensed platform for line following.
      Measurement requests target key performance indicators for line tracking and
      stability.


      ### Rationale


      Starting with a balanced and well-spaced sensor array to maximize line detection
      and steering precision. Using 5 sensors spaced evenly across the front of the
      robot to cover the tape width and some margin on each side, with a sensor size
      of 0.012 m to balance resolution and coverage. The wheel track is set to 0.14
      m for stability and maneuverability, with a moderate wheel radius of 0.035 m
      to balance speed and torque. The body width is 0.14 m to allow some tolerance
      for off-track limits without being too wide, and the body length is 0.18 m to
      keep the robot compact but stable. Mass is set to 0.8 kg to keep inertia manageable
      while allowing some robustness. The intent is to provide the integrator with
      a stable, well-sensed platform that can detect the line accurately and respond
      quickly to steering commands. Hypotheses include that the 5 sensors will provide
      sufficient resolution to detect line edges and curvature, and that the chosen
      body and wheel dimensions will balance speed and control. Measurement requests
      focus on completion, progress, line loss events, rms error, and steering oscillation
      to evaluate line tracking quality and stability.


      - [Open this output](iteration-0/entity0/versions/311bb2ca69d7494d8bfc48682f35ad38/payload.json)'
  - id: entity1
    label: Complete Robot Package
    notes: 'Integrated the supplied geometry with a PID controller tuned for balanced
      responsiveness and stability, using sensor weights to emphasize line edges.
      Requested key performance metrics for evaluation.


      ### Rationale


      The geometry provides a balanced and well-spaced sensor array with 5 sensors
      evenly distributed across the front, each with a moderate size of 0.012 m, to
      maximize line detection and steering precision. The wheel track of 0.14 m and
      wheel radius of 0.035 m are chosen to balance stability, maneuverability, and
      speed. The controller uses a PID control scheme with tuned gains to respond
      effectively to sensor signals, and sensor weights are set to emphasize the center
      sensors for accurate line following. The line loss strategy is set to ''search_left''
      to steer right when the line is lost, which is a common recovery tactic. The
      observation request includes all key metrics to evaluate performance comprehensively.


      - [Open this output](iteration-0/entity1/versions/ad0f3a8dddea4aa48c58a33619a6d730/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/311bb2ca69d7494d8bfc48682f35ad38/payload.json)'
  - id: entityR1
    label: Integration Feedback
    notes: 'Provided conditional feedback based on expected race outcomes, with specific
      geometry changes tied to prior evidence to improve line detection and control
      stability.


      ### Feedback


      Based on prior experience with similar sensor layouts and wheel configurations,
      the controller compensates for the moderate sensor size and spacing by emphasizing
      outer sensors to detect line edges effectively. If the next race shows frequent
      line loss events, consider increasing sensor size or adjusting sensor positions
      to cover more of the tape edges. If steering oscillation is high, reduce kp
      or kd gains or adjust sensor weights to smooth control. If progress is low but
      line loss is minimal, consider increasing base_speed or tuning integral gain
      to reduce steady-state error.


      ### Requested changes


      - sensor_size to 0.016 to improve line coverage if line loss events are high,
      based on prior evidence that larger sensors reduce line loss.

      - adjust sensor_positions y-coordinates forward by +0.01 m to improve early
      line detection if steering oscillation is low but progress is poor.

      - reduce kp from 10 to 7 if steering oscillation is high, as seen in earlier
      races with aggressive proportional control.


      - [Open this output](iteration-0/entityR1/versions/ad0f3a8dddea4aa48c58a33619a6d730/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/311bb2ca69d7494d8bfc48682f35ad38/payload.json)'
  actions:
  - id: action0
  - id: action1
measurements: {}
