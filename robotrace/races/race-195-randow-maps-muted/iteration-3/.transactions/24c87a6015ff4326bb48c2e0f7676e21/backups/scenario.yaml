  id: race-195-randow-maps-muted
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Wider 16mm sensor array
    notes: 'Widened the sensor array to 16 mm footprints at 12 mm spacing, moved sensors
      to y = 0.05 m, and reduced mass and wheel radius. This responds to the baseline''s
      uniform off-track failures (progress 0.10 to 0.16, max_error about 0.065 m)
      and the finding that body width cannot change the 0.06 m off-track floor.


      ### Rationale


      The development evidence (entityR2A) is uniform. All 60 trials ended off track,
      with progress only 0.105 to 0.155 and no finishes. Mean max_error is 0.062 to
      0.069 m, just past the off-track limit. The rms_error (about 0.028 m) is similar
      on every track, so the drift is not a single-track problem. Line loss happened
      once or twice per run, which points at the robot leaving the tape on the first
      bend rather than oscillating for long. Steering oscillation is modest (0.07
      to 0.15).


      Body width cannot help. The limit is max(0.06, 0.0125 + body_width/4), and the
      largest allowed body_width of 0.18 m gives 0.0575, so the 0.06 m floor stays
      in force across the whole range. Body length has no dynamic effect. So the geometry
      levers left are the sensor array and the drive dynamics.


      Changes made, with reasons:

      1. Sensor footprint 12 mm to 16 mm. A larger footprint covers more of the 25
      mm tape at once, which smooths the signal and reduces the sudden dropouts that
      cause line loss.

      2. Sensor spacing 10 mm to 12 mm, at x = +0.024, +0.012, 0, -0.012, -0.024.
      The array spans 48 mm, so at least one or two sensors stay on the tape when
      the robot drifts by up to about 0.03 m. This widens the capture range that the
      prior design lacked.

      3. Sensors moved slightly back to y = 0.05 m. This reduces the lead between
      sensing and steering, which should cut overshoot on the s-bend and slalom. The
      0.04 m offset was an untested guess.

      4. Mass 0.6 kg to 0.5 kg and wheel radius 0.035 m to 0.03 m. Lower inertia helps
      the robot reach the roughly 1.5 m/s average speed needed to finish in 3 s. The
      smaller wheel gives more turn authority per unit of wheel command, which helps
      the tighter bends.

      5. Wheel track kept at 0.12 m and body width at 0.12 m (no effect on the limit,
      kept as a neutral value). Sensor weights kept at [2, 1, 0, -1, -2] so the sign
      convention is unchanged.


      Expected result: fewer line-loss events and a larger off-track margin on the
      development tracks. The robot should get further along each track (progress
      above 0.3 is the first milestone), and the Integrator should be able to tune
      gains against a steadier signal.


      - [Open this output](iteration-1/entity0/versions/c378bf040a0c44529afb86652038ff39/payload.json)

      - Based on: [entityR2A](iteration-1/entityR2A/versions/carried-71eaad24661e0caa/payload.json)'
  - id: entity1
    label: Retuned controller v1
    notes: 'Complete robot for the Builder''s 16 mm, 12 mm spacing, y = 0.05 m, 0.5
      kg, 0.03 m wheel geometry. Speed lowered to 1.2 and kp raised to 2.0 with kd
      0.4, because the baseline (iteration 0) left the tape on the first bends at
      speed 1.6.


      ### Rationale


      The Builder''s new geometry (16 mm footprints at 12 mm spacing, sensors at y
      = 0.05 m, mass 0.5 kg, wheel radius 0.03 m) is the first change to the sensing
      and drive dynamics, so there is no measured result for it yet. The baseline
      race (iteration 0, all 60 trials off track) gives the controller evidence: progress
      only 0.105 to 0.155, max_error 0.062 to 0.069 m (just past the 0.06 m floor),
      1 to 2 line-loss events per run, and steering_oscillation 0.07 to 0.15. The
      failures happen early on the first bends rather than through long oscillation,
      which suggests the robot runs too fast for its steering authority. For this
      geometry I therefore lower base_speed from 1.6 to 1.2 so the robot can corner
      within its tape margin, and raise kp from 1.2 to 2.0 so the wheel differential
      gives more turn per unit of error. The lighter, smaller-wheel robot should accelerate
      faster, so the lower speed should not cost much time. kd rises from 0.1 to 0.4
      to damp the larger proportional response, and ki stays small (0.05) to avoid
      integral windup on the bends. Sensor weights stay at [2, 1, 0, -1, -2] to match
      the Builder''s sign convention, and the signal magnitude stays within about
      2, so kp = 2.0 gives a turn of at most about 4 (a PWM differential of about
      1400, which does not saturate at base PWM 2457). line_loss stays last_direction,
      which recovers toward the side the tape was last seen. Expected: fewer off-track
      failures on the first bends. I expect the main remaining risk to be the speed-versus-authority
      balance, which the next race will show.


      - [Open this output](iteration-1/entity1/versions/87042e6c3bbd4a0ab974db02a9468f9f/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/c378bf040a0c44529afb86652038ff39/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-71eaad24661e0caa/payload.json)'
  - id: entityR1
    label: Wider track and sensor
    notes: 'Feedback written before the race: it cites the iteration 0 off-track failures
      and gives three requested geometry changes with conditional triggers. No outcome
      is claimed for the current candidate.


      ### Feedback


      Written before this robot has raced, so no outcome is stated for it. (1) Evidence
      from iteration 0 (all 60 trials off track, progress 0.105 to 0.155, max_error
      0.062 to 0.069 m, 1 to 2 line-loss events) shows the baseline could not hold
      the tape through the first bends. To make the robot hold the line I had to lower
      base_speed to 1.2 and raise kp to 2.0 with kd 0.4; the signal stays within about
      +/-2 so this does not saturate the wheels at 0.6 kg, but it means the controller
      is working hard at the bends. (2) The 0.05 m sensor offset and 16 mm footprints
      mean the signal is less laggy than at 0.04 m, so kd is needed less for lag and
      more for jitter; if steering_oscillation rises with progress, that points to
      the speed and gain balance rather than the geometry. (3) The 0.06 m off-track
      floor still governs (body_width 0.12 m gives 0.0425 m), so body_width is not
      a lever. Change rules for the next race: if line_loss_events stays at 1 or more
      and max_error is still near 0.06 m, widen wheel_track to 0.15 m to add turn
      authority at the bends. If progress is high but completion_time is long with
      no losses, keep the 0.5 kg mass and raise base_speed in steps rather than changing
      geometry. If the outer sensors read near 1 on the tape edge (saturation), try
      sensor x of +/-0.020 m with 16 mm footprints to keep the signal monotonic.


      ### Requested changes


      - Try wheel_track 0.15 m if the next race still shows line_loss_events of 1
      or more with max_error near 0.06 m, since iteration 0 showed the robot leaving
      the tape on the first bends and a wider track adds turn authority (H3, untested).

      - Try sensor x of +/-0.020 m (outer) and +/-0.010 m (inner) with sensor_size
      0.016 if the outer sensors saturate, since the 16 mm footprints at 0.024 m could
      read full tape early and reduce steering authority; iteration 0 showed sensor
      coverage was the weak point at 12 mm.

      - Try mass 0.45 kg if completion_time is above about 2.5 s without line losses,
      since iteration 0 showed the wheels were not slipping at 0.6 kg and lower mass
      speeds acceleration without changing the off-track limit (H4, untested).


      - [Open this output](iteration-1/entityR1/versions/87042e6c3bbd4a0ab974db02a9468f9f/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/c378bf040a0c44529afb86652038ff39/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-71eaad24661e0caa/payload.json)'
