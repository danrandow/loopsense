  - id: entity0
    label: Baseline 5-sensor
    notes: 'Neutral first design: five 12 mm sensors at 10 mm spacing, 0.04 m ahead
      of the axle, with symmetric weights, a 0.12 m track, 0.035 m wheels and 0.6
      kg mass. No race evidence exists yet, so this rests on the contract''s physics
      and sets up the Integrator''s first controller tuning.


      ### Rationale


      This is iteration 0, so there is no race telemetry or Integrator feedback yet.
      The design is a neutral baseline built from the contract''s physics, not from
      evidence. Five sensors at 10 mm spacing (x = +0.02 to -0.02 m) with 12 mm footprints
      give a tape-covering window of about 25 mm, so at least two or three sensors
      read the line at any offset. Weights are proportional to sensor x (+2, +1, 0,
      -1, -2), which matches the sign convention: sensors on the left (positive x)
      carry positive weight and steer left when the tape is under them. Sensors sit
      0.04 m ahead of the axle to reduce the lag between sensing and steering on bends.
      Wheel track 0.12 m and wheel radius 0.035 m give a moderate turn response and
      a higher ground speed per rotation. Mass 0.6 kg keeps acceleration high for
      the 1.5 m/s average-speed requirement. Body width 0.12 m sits well inside the
      off-track limit (it stays at the 0.06 m floor until the width exceeds about
      0.19 m). Body length 0.18 m is a neutral envelope with no direct dynamic effect.
      Expected result: the robot should complete the development tracks with few line
      losses, though I expect rms_error to be dominated by how fast the Integrator''s
      controller can turn at the tighter bends.


