  notes: Authoritative state carried forward after iteration 0.
dimensions:
  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Wider 16mm sensor array
    notes: 'Widened the sensor array to 16 mm footprints at 12 mm spacing, moved sensors
      to y = 0.05 m, and reduced mass and wheel radius. This responds to the baseline''s
      uniform off-track failures (progress 0.10 to 0.16, max_error about 0.065 m)
      and the finding that body width cannot change the 0.06 m off-track floor.


      ### Rationale


      The development evidence (entityR2A) is uniform. All 60 trials ended off track,
      with progress only 0.105 to 0.155 and no finishes. Mean max_error is 0.062 to
      0.069 m, just past the off-track limit. The rms_error (about 0.028 m) is similar
      on every track, so the drift is not a single-track problem. Line loss happened
      once or twice per run, which points at the robot leaving the tape on the first
      bend rather than oscillating for long. Steering oscillation is modest (0.07
      to 0.15).


      Body width cannot help. The limit is max(0.06, 0.0125 + body_width/4), and the
      largest allowed body_width of 0.18 m gives 0.0575, so the 0.06 m floor stays
      in force across the whole range. Body length has no dynamic effect. So the geometry
      levers left are the sensor array and the drive dynamics.


      Changes made, with reasons:

      1. Sensor footprint 12 mm to 16 mm. A larger footprint covers more of the 25
      mm tape at once, which smooths the signal and reduces the sudden dropouts that
      cause line loss.

      2. Sensor spacing 10 mm to 12 mm, at x = +0.024, +0.012, 0, -0.012, -0.024.
      The array spans 48 mm, so at least one or two sensors stay on the tape when
      the robot drifts by up to about 0.03 m. This widens the capture range that the
      prior design lacked.

      3. Sensors moved slightly back to y = 0.05 m. This reduces the lead between
      sensing and steering, which should cut overshoot on the s-bend and slalom. The
      0.04 m offset was an untested guess.

      4. Mass 0.6 kg to 0.5 kg and wheel radius 0.035 m to 0.03 m. Lower inertia helps
      the robot reach the roughly 1.5 m/s average speed needed to finish in 3 s. The
      smaller wheel gives more turn authority per unit of wheel command, which helps
      the tighter bends.

      5. Wheel track kept at 0.12 m and body width at 0.12 m (no effect on the limit,
      kept as a neutral value). Sensor weights kept at [2, 1, 0, -1, -2] so the sign
      convention is unchanged.


      Expected result: fewer line-loss events and a larger off-track margin on the
      development tracks. The robot should get further along each track (progress
      above 0.3 is the first milestone), and the Integrator should be able to tune
      gains against a steadier signal.


      - [Open this output](iteration-1/entity0/versions/c378bf040a0c44529afb86652038ff39/payload.json)

      - Based on: [entityR2A](iteration-1/entityR2A/versions/carried-71eaad24661e0caa/payload.json)'
  - id: entity1
    label: Baseline 5-sensor robot
    notes: 'Baseline package: the Builder''s symmetric 12 mm five-sensor geometry
      with a proportional-led controller (kp 1.2, ki 0.05, kd 0.1, base_speed 1.6).
      Gains are derived from the contract''s turn and PWM scaling because no race
      data exists yet.


      ### Rationale


      Iteration 0 has no race telemetry, so the controller is built from the contract''s
      physics and the Builder''s stated hypotheses, not from measured results. Geometry
      is used as proposed: five 12 mm sensors at x = +0.02 to -0.02 m (10 mm spacing,
      which covers the 25 mm tape with two to three sensors at any small offset),
      placed 0.04 m ahead of the axle. Sensor weights are set proportional to sensor
      x (+2, +1, 0, -1, -2) so that a positive signal means the tape is on the left
      and the robot should steer left, which matches the contract''s sign convention.
      Because the signal is a weighted average of the weights where tape is seen,
      its magnitude stays within about 2. With kp = 1.2, turn is at most about 2.4,
      giving a wheel differential of about 840 PWM counts at full error, which is
      strong enough to turn without saturating at base_speed 1.6. base_speed 1.6 gives
      PWM 4095 * 0.8 = 3276, leaving headroom for the wheel command to add or subtract
      the steering term without clipping at 4095. ki is kept small (0.05) so the integral
      does not wind up on the long bends. kd = 0.1 damps the jitter from the 10 ms
      signal updates. line_loss is set to last_direction so that the robot searches
      toward the side it last saw the tape, which is the safest default on curved
      tracks. I expect the run to complete the development tracks with few line losses,
      but I expect rms_error and steering_oscillation to be the main weak points on
      the tightest bend, since the controller has not yet been tuned against measured
      data.


      - [Open this output](iteration-0/entity1/versions/8ab9f920196c4cc2bdc8dff25030161a/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/d63087f8cfe64b1ebdaba6c45056e651/payload.json)'
  - id: entityR1
    label: Baseline feedback and
    notes: 'Feedback written before any race, so it cites only contract physics and
      states no outcome. It gives three requested geometry changes (wheel track, sensor
      forward offset, mass), each tied to a stated change rule for the next race.


      ### Feedback


      No race has been run yet for this geometry lineage, so there is no outcome evidence
      to cite. The points below rest only on the contract physics and the baseline
      I built. (1) The controller needed the sensor weights set proportional to sensor
      x with a signal bounded near 2, and kp about 1.2 keeps the wheel differential
      below the 4095 PWM limit at base_speed 1.6; with a wider wheel track or lower
      mass the same gains may oscillate less, so I would expect the steering effort
      to depend mainly on wheel_track and mass. (2) The 0.04 m forward sensor offset
      gives the controller a short lag, so kd can stay small; if the next race shows
      steering_oscillation rising at speed, that points to too much forward offset
      for the current gains rather than to the sensors themselves. (3) The body_width
      of 0.12 m is well inside the off-track limit (0.06 m floor, tape_half_width
      + body_width/4 = about 0.0425 m is below the floor), so body_width has no effect
      on the limit at this value and should not be the first thing changed. Change
      rules for the next race: if line_loss_events is above zero and max_error is
      large, widen wheel_track toward 0.15 m (H3) to add turn authority. If steering_oscillation
      is high and rms_error is low, move the sensors forward (y around 0.06 m) or
      lower mass toward 0.5 kg to reduce lag. If completion_time is too long without
      losses, lower mass (H4) before raising base_speed.


      ### Requested changes


      - Try wheel_track 0.15 m (H3) if the next race shows line_loss_events above
      zero or max_error rising on the tight bend, since a wider track adds turn authority
      at the cost of agility; no current evidence confirms this yet.

      - Try sensor y of 0.06 m (H2) if steering_oscillation is high with low rms_error,
      since further-forward sensors reduce lag at speed; keep sensor_size at 0.012
      unless the signal is noisy across the 25 mm tape.

      - Try mass 0.5 kg (H4) if completion_time is above about 2.5 s without line
      losses, since lower mass speeds up acceleration without changing the off-track
      limit.


      - [Open this output](iteration-0/entityR1/versions/8ab9f920196c4cc2bdc8dff25030161a/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/d63087f8cfe64b1ebdaba6c45056e651/payload.json)'
