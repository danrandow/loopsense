overrides:
  entities:
  - id: entity0
    label: Faster, damped baseline
    notes: 'Draft raises base_speed to 1.4 and kp to 3.0 for pace and tracking, with
      kd 0.5 to damp the added swing. No race data exists yet, so the change rests
      on the timing and control contract rather than telemetry.


      ### Rationale


      No race telemetry exists yet. Iteration 0''s draft was never raced, so this
      is still a reasoned design rather than a tuned one. Evidence used: the contract''s
      timing rule (about 4 to 5 m in under 3 s, so roughly 1.5 m/s average) and the
      sensing and control equations. Changes from the iteration 0 draft: base_speed
      rises from 1.3 to 1.4 for more margin on the 3 s limit (PWM base about 2870,
      70% of full). kp rises from 2.5 to 3.0 so the robot corrects faster at speed;
      a full-scale signal of 2 then gives about 2100 PWM of differential. kd rises
      from 0.3 to 0.5 to damp the extra oscillation that a higher kp causes. Sensors
      stay at 5 across x = -0.04 to +0.04 with y = 0.04, so the line is seen ahead
      of the axle and the signal is roughly linear over the 25 mm tape. Weights -2,
      -1, 0, 1, 2 keep positive signal meaning steer left. ki stays 0 to avoid windup
      on bends. line_loss stays last_direction so the robot recovers toward the side
      it last saw the tape. Geometry is unchanged except that body_width 0.12 and
      mass 0.8 remain in mid-range. Expected result: completion on the development
      tracks, few line-loss events, rms_error about 0.02 to 0.035 m, and completion_time
      about 2.4 to 2.6 s. Main risk: overshoot on the slalom from the higher kp, which
      the Evaluator and the next race should show.


      - [Open this output](iteration-1/entity0/versions/7e3e2f58b37b4d2ea606b0fc977686de/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Round-1 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-1/entityC1/versions/93235249f78f447b923347415eea5f1a/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/7e3e2f58b37b4d2ea606b0fc977686de/payload.json)'
  - id: entity1
    label: Revised Design
    notes: 'Revised Design. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence: still no race telemetry. Every expected value below is a guess to
      be tested in the race, not a prediction.


      Accepted from the round-1 critique:

      - Sensor span (critique item 1, the strongest point). Sensors move from x =
      +/-0.04 to +/-0.06 at 0.03 m spacing. At x = 0.06 the outer sensor still reads
      the tape when the line centre is about 0.07 m from the robot''s centre (footprint
      half 0.006 plus tape half 0.0125 plus 0.06). That gives a real margin before
      the 0.06 m off-track limit, so recovery can start while the robot is still on
      the track.

      - Derivative gain (critique items 1 and 4). kd drops from 0.3 to 0.15. The critique
      is right that a derivative on a noisy, quantised signal can add jitter, and
      I cannot show a damping mechanism that outweighs it. Halving kd limits the single-step
      kick (about 50 x dS, so roughly 440 PWM per 0.05 step at 350 PWM per turn unit).
      I keep some kd so the slalom still has a damping term to test.

      - Motor-mismatch bias (critique item 7). ki stays at 0.1, not 0. The contract''s
      fixed left/right mismatch is a steady bias the integral can remove. The integral
      is capped at +/-2, so its maximum contribution is 0.2 turn units, which limits
      windup on bends.

      - Speed (critique item 5). base_speed rises from 1.3 to 1.4, giving base_pwm
      4095 x 0.70 = about 2870 (the critique''s arithmetic is right; the earlier 2550
      figure was wrong). The 2.4 to 2.6 s target needs about 1.7 to 2.0 m/s average,
      which is above the 1.5 m/s minimum, so base_speed 1.4 gives margin for slip,
      drag and bends. It is still not proven to be reachable.

      - Yaw inertia (critique item 6). 0.8 x (0.16^2 + 0.12^2) / 12 = about 0.0027
      kg m^2. With kp 2.5 and kd 0.15 the turn response should be responsive without
      a large inertia-driven overshoot.


      Partly accepted:

      - kp (critique items 3 and 4). kp drops from 3.0 (the earlier draft) to 2.5.
      A full-scale signal of 2 gives 1750 PWM of differential. At base_pwm 2870 this
      leaves the inner wheel at about 1120, which still allows a sweeping turn without
      near-pivoting. The critique''s worry about a 2100 PWM pivot is avoided.

      - Line-loss handling (critique item 2). I keep last_direction because the critique
      gives no better option within the contract. The derivative kick at line loss
      is reduced by the lower kd. I do not change the line_loss rule.


      Rejected:

      - 16 mm sensors. The critique gave no evidence that a larger footprint would
      help, and it would increase overlap and change the signal scale.

      - Changing wheel_track or wheel_radius. No evidence was given that these mid-range
      values fail, so they stay at 0.12 and 0.03.

      - Body_width. The off-track limit is max(0.06, 0.0125 + body_width/4). At 0.12
      that is 0.06 m, so body_width does not set it; I keep 0.12 and make no claim
      that it adds margin.


      Expected result (guesses): completion on all development tracks, 0 to 2 line-loss
      events, rms_error about 0.02 to 0.04 m, completion_time about 2.5 to 2.8 s.
      Main risks: slalom overshoot from kp, and speed too low for the time limit at
      base_speed 1.4. Diagnostics: high max_error with few line-loss events points
      to gain or overshoot; line-loss events with max_error near 0.06 points to recovery;
      high steering_oscillation with kd 0.15 points to noise amplification by the
      derivative term.


      - [Open this output](iteration-1/entity1/versions/96ad10d4e77c4b53abf5b78ac732685c/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/7e3e2f58b37b4d2ea606b0fc977686de/payload.json),
      [entityC1](iteration-1/entityC1/versions/93235249f78f447b923347415eea5f1a/payload.json)'
  actions:
  - id: action0
  - id: action1
  - id: action2
