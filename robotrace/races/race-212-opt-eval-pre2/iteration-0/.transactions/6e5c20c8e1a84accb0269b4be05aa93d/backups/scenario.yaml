overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor draft
    notes: 'First draft with no prior telemetry: five 12 mm sensors at 20 mm spacing,
      base_speed 1.3, kp 2.5, kd 0.3, ki 0, last_direction line-loss recovery. Chosen
      to meet the roughly 1.5 m/s pace needed to finish in 3 s while keeping steering
      damped. Expected to complete the development tracks with small rms error; overshoot
      on the slalom is the main risk.


      ### Rationale


      No race telemetry exists yet (iteration 0, first draft), so this is a reasoned
      baseline rather than a tuned design. Speed: the course is about 4 to 5 m and
      must be covered in under 3 s, so average speed needs to be about 1.5 m/s or
      more. base_speed 1.3 gives a PWM base of about 2550 (62% of full), which should
      reach that pace with margin for slowdowns in bends, while leaving room to brake.
      Sensing: five sensors spaced 20 mm apart (x = -0.04 to +0.04) at y = 0.04, ahead
      of the axle so the robot sees the line before it reaches the wheels. The 12
      mm footprint is smaller than the 25 mm tape, so the outer sensors read tape
      only when the line is near them, which gives a clear, roughly linear error signal.
      Weights -2, -1, 0, 1, 2 make the signal sign match the line side: a line to
      the left gives positive signal and steers left. Control: kp 2.5 gives a moderate
      turn gain (a full-scale signal of 2 yields about 1750 PWM of wheel differential).
      kd 0.3 damps the swing that a pure proportional law causes at speed. ki is 0
      because the course has no steady bias to remove and the integral term risks
      windup on bends. line_loss ''last_direction'' lets the robot recover toward
      the side it last saw the tape. Geometry: wheel_track 0.12 and wheel_radius 0.03
      are mid-range; body_width 0.12 keeps the off-track limit comfortable (about
      0.06 m or more); mass 0.8 kg with a 0.16 m body keeps yaw inertia moderate.
      Expected result: completion on the development tracks with a few line-loss events
      at most, small rms_error (around 0.02 to 0.04 m), and completion_time near 2.5
      s. The main risk is overshoot on the slalom and s-bend, which the next race
      will show.


