  - id: entityR1
    label: Integration Feedback
    notes: 'Feedback on the geometry''s performance indicates improvements in stability
      but suggests further adjustments are necessary to reduce line loss events.


      ### Feedback


      The increased body width and wheel track improved stability, but the robot still
      experienced 3 line loss events. The rms error slightly increased to 0.028936,
      indicating that while the changes helped, further adjustments are needed.


      ### Requested changes


      - body_width: 0.18

      - wheel_track: 0.16

      - sensor_size: 0.016


