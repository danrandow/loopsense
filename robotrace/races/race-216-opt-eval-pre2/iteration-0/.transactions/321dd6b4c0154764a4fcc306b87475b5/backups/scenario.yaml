  id: race-216-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 0
  inherits: base.yaml
  notes: Initial prepared state before either AI role or the simulator has acted.
dimensions:
  time_horizon: prepared
  iteration: '0'
overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor draft
    notes: 'First draft with no prior telemetry: five 12 mm sensors across the front,
      moderate proportional gain with light damping, base speed 1.6 and last-direction
      line recovery. Chosen conservatively so the Evaluator and the next race can
      test whether speed or gain is limiting.


      ### Rationale


      No race telemetry exists yet (iteration 0), so this is a conservative first
      draft built from the contract. Geometry: five line sensors spread across the
      front of the body (x = -0.03 to +0.03 m, y = 0.04 m ahead of the axle) with
      12 mm footprints, so the line is seen by at least one or two sensors across
      the 25 mm tape at normal offsets. A 0.12 m wheel track, 0.03 m wheels, 0.12
      m body width and 0.8 kg mass keep the yaw inertia moderate and the off-track
      limit comfortable. Controller: weights are scaled to the sensor spacing (about
      50 times the x position), so the signal runs roughly -1.5 to +1.5. kp = 2 gives
      a proportional turn of about 1 for a 1 cm offset, which is a firm but not twitchy
      correction. kd = 0.2 damps the swing across the line at speed. ki = 0 avoids
      integral windup on the bends. base_speed = 1.6 (about 80 percent of full PWM)
      is chosen to reach the roughly 1.5 m/s average needed to finish in under 3 s
      while leaving room to hold the line. line_loss = last_direction, so the robot
      turns back toward the side it last saw the tape. Expected result: completion
      on the oval and s-bend, with some risk on the slalom where the proportional
      gain may be too weak for tight alternation. The next race should show whether
      the speed or the gain is the limiting factor.


      - [Open this output](iteration-0/entity0/versions/2cc512f44e9747f3a56b1928465d5060/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Round-1 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-0/entityC1/versions/fd96342426a14a7797e93fbd49592bdc/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/2cc512f44e9747f3a56b1928465d5060/payload.json)'
  - id: entity1
    label: Lower kd, same speed
    notes: 'Reduced kd from 0.2 to 0.05 to limit noise amplification and steering
      jitter, as the critique argued; kept speed, kp and line-loss policy so the race
      isolates the derivative change. The critique''s off-track and body-width claim
      was corrected, not carried forward.


      ### Rationale


      Round-1 critique, point by point:


      1. Off-track limit. Accepted. The contract gives max(0.06, 0.0125 + body_width/4).
      For every body width in the allowed range this is 0.06 m, so body width gives
      no extra margin. I keep body_width at 0.12 m only as a physical value, and I
      no longer cite it as a safety margin.


      2. Derivative gain. Accepted. kd = 0.2 can produce derivative turns several
      times larger than the proportional term on a single-step change, and sensor
      noise and tape-edge transitions would be amplified. I reduce kd to 0.05, a quarter
      of the previous value. This keeps some damping while limiting noise-driven steering
      jitter. It is a judgement, not a measured value, and the first race should confirm
      it through steering_oscillation.


      3. Speed. Partly accepted. I keep base_speed at 1.6 rather than cutting it.
      The 3 s limit needs about 1.5 m/s on average, and cutting speed risks failing
      the completion term (500 points) and the time term. I have no drivetrain estimate
      that would justify a specific speed, so the race data is what will settle it.
      If line_loss_events or max_error rise on the sharpest bend, the next iteration
      should reduce speed before adding gain.


      4. Sensor layout. Accepted as a note. The geometry is plausible and I keep it
      unchanged, since changing geometry together with the controller would confound
      the result.


      5. Line-loss policy. Partly accepted. I keep last_direction. The critique gives
      no evidence that a search direction is better, and last_direction is the reasonable
      default for a line that is lost after a bend. I expect line_loss_events to be
      low on the oval and s-bend, and possibly higher on the slalom. I will check
      that in the race.


      6. Ki. Rejected for this iteration. A small ki could correct a steady motor
      mismatch, but the 2 percent disturbance is small, and adding ki together with
      a kd change would make the result harder to read. I keep ki = 0 and will revisit
      it once the kd effect is known.


      Rationale critique: I also state that the expected results are hypotheses. The
      change is deliberately narrow (kd only, from 0.2 to 0.05), so the next race
      can attribute any change in oscillation or error to kd. Expected outcome: completion
      on the oval and s-bend, lower steering_oscillation than the draft, and the slalom
      as the main risk. Measurements: completion_time, line_loss_events and max_error
      show whether speed or gain is limiting.


      - [Open this output](iteration-0/entity1/versions/3132c503dccf49c28ed64c2ab0c682a5/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/2cc512f44e9747f3a56b1928465d5060/payload.json),
      [entityC1](iteration-0/entityC1/versions/fd96342426a14a7797e93fbd49592bdc/payload.json)'
  actions:
