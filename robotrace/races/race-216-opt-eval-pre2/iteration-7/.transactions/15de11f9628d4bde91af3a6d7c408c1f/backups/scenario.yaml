  - id: entity2
    label: Sensors y=0.08 test
    notes: 'Iteration-4 raced design with sensor y moved from 0.07 to 0.08 m and nothing
      else changed. Decision rules set in advance against the iteration-4 track means
      (s-bend progress 0.156, oval finish rate 0.10), since the forward-lead gain
      is expected to be small.


      ### Rationale


      Evidence: the raced design with the most progress is iteration 4 (score 129.05).
      It had 2 of 20 oval finishes, 0 of 20 on the s-bend and slalom, and progress
      of 0.553 (oval), 0.156 (s-bend) and 0.101 (slalom). Every trial ended off track,
      with about one line-loss event per run on every track. Max_error stayed near
      0.06 m on all tracks, so the failure is systematic.


      Critique response, point by point:

      1. Accepted. The decision rule is now stated in both directions and for every
      track, not only the s-bend (see below).

      2. Accepted. I do not attribute the iteration-4 gain to geometry alone.

      3. Accepted in part. The one line-loss per run is still untested. I cannot locate
      it from the current data, so I do not change line_loss or start behaviour in
      this race, since that would be a second variable.

      4. Accepted. base_speed stays at 1.5. A 300-step run needs about 1.5 m/s to
      finish, and this is the value that produced both raced finishes.

      5. Accepted. kd 0.6 and ki 0.5 are not used. kp 4.0, ki 0.2 and kd 0.3 are kept,
      so this design differs from the best raced design in one variable only.

      6. Rejected. The +/-0.05 m, 16 mm, 0.025 m-pitch layout has never been raced
      and changes the steering scale per centimetre by about 20 percent, so it would
      confound this test.


      Change from iteration 4: sensor y moves from 0.07 to 0.08 m (the contract maximum).
      Nothing else changes. The prior for a large gain is low, since a 1 cm lead at
      1.5 m/s is only about 7 ms, so this race is mainly a cheap check of forward
      sensing direction.


      Decision rules, set before the race. Compare against the iteration-4 track means
      (oval progress 0.553, finish rate 0.10; s-bend progress 0.156; slalom progress
      0.101). With 20 trials per track, changes of a few thousandths are within noise,
      so I will only act on clear moves. If s-bend progress falls below 0.156, or
      oval finish rate falls below 0.10, y = 0.08 is worse and I revert to y = 0.07.
      If progress rises on all tracks and the oval finish rate holds or rises, I keep
      y = 0.08. If the result is neutral, the next race tests the line-loss or launch
      hypothesis, with sensors held fixed.


      - [Open this output](iteration-6/entity2/versions/00f706ab693a442aa3a41d273138ceef/payload.json)

      - Based on: [entity1](iteration-6/entity1/versions/7fe11331a36b40febdb96fe819bd6763/payload.json),
