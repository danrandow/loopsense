map:
  id: race-216-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Wider sensor span draft
    notes: 'Widens the sensor span to +/-0.07 m and raises kp to 5.0 to keep correction
      strength, aiming to cut the line-loss events seen on the s-bend. Built on iteration
      6, the best design so far (score 138.6), which had one oval finish and s-bend
      progress 0.295.


      ### Rationale


      Evidence: the best design so far (iteration 6, score 138.6) has 5 sensors at
      y=0.08 with a +/-0.05 m span, weights [-2,-1,0,1,2], base_speed 1.0, kp 4.0,
      ki 0.5, kd 0.6. Across the 60 development trials of that design, the oval had
      1 finish in 20, s-bend progress was 0.295 (up from 0.156 at y=0.07), and slalom
      progress was 0.097. The main remaining problems are that every run still leaves
      the line (max error ~0.062 m against a 0.06 m limit), the s-bend logs 1.25 line-loss
      events per run, and oval steering oscillation is 0.30. Line loss on bends suggests
      that at larger offsets no sensor sees the tape, so the signal drops out. Forward
      placement at y=0.08 is already at the contract maximum, so the remaining lever
      is lateral coverage.


      Changes: (1) widen the sensor span to x = -0.07 to +0.07 m in 0.035 m steps,
      so the tape stays under a sensor at larger offsets and line loss on bends should
      fall; (2) keep the 16 mm footprint and 5 sensors; (3) weights [-2,-1,0,1,2]
      are kept, which lowers the signal slope from about 40 to about 29 per metre,
      so kp rises from 4.0 to 5.0 to restore correction strength per centimetre; (4)
      ki 0.5, kd 0.6 and base_speed 1.0 are unchanged, since these are the settings
      that produced the only oval finishes; (5) wheel track, radius, body and mass
      are unchanged.


      Expected result: fewer line-loss events (toward 0.5 or less on the s-bend),
      progress above 0.3 on the s-bend and slalom, and more oval completions. A full
      finish on the s-bend or slalom is unlikely this round. If the robot still exits
      at a fixed point, the next race should point to the kd term or to the speed.


      - [Open this output](iteration-7/entity0/versions/23f92a0ce6f74c4f9f0bd0197aafe9d9/payload.json)

      - Based on: [entityR2A](iteration-7/entityR2A/versions/carried-dbad8061c79eaad7/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critique finds that kp 5.0 with 29/m slope gives 143/m versus 160/m before,
      so steering gain falls about 11 percent, and that sensors at +/-0.05 m already
      see the tape at the observed exit offset, so widening the span does not explain
      the failure. Based on the authorized iteration 6 data and the sensor geometry
      in the contract.


      - [Open this output](iteration-7/entityC1/versions/f2f06cd26cb74b9bb42311a93967f259/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/23f92a0ce6f74c4f9f0bd0197aafe9d9/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-dbad8061c79eaad7/payload.json)'
  - id: entity1
    label: Iter 4 design, sensors
    notes: 'Keeps the raced iteration 4 controller and span, changing only sensor
      y from 0.07 to 0.08 for a clean test. Reverts the draft''s unraced span, speed
      1.0 and kd/ki changes, which the critique showed were unsupported or would forfeit
      completion.


      ### Rationale


      Evidence. The only raced design with completions is iteration 4 (score 129.05):
      base_speed 1.5, kp 4.0, ki 0.2, kd 0.3, sensors at y=0.07 with x = -0.04 to
      +0.04 (0.02 m pitch), 16 mm footprints, weights [-2,-1,0,1,2]. Its two oval
      finishes came from that configuration. The draft''s claim that the finishes
      were at base_speed 1.0 with a +/-0.05 m span is wrong, and the +/-0.05 m, kd
      0.6, ki 0.5 layout has never been raced. Iteration 5 was never raced either.


      Critique, point by point:

      1. Accepted. The draft''s ''progress above 0.16'' target had no basis, so I
      state the decision rule instead: a fall below 0.156 on the s-bend means y=0.08
      is worse.

      2. Accepted. Iteration 4 changed geometry and span together, so I do not claim
      geometry alone caused the gain.

      3. Accepted in part. The one-line-loss-per-run pattern is recorded, but the
      current evidence cannot locate it. I requested per-step telemetry so the next
      iteration can check whether the loss occurs at the start.

      4. Accepted. The draft''s base_speed 1.0 cannot finish in 300 steps (about 1.5
      m/s is needed), so the 500-point completion bonus is lost. Speed returns to
      1.5, the value that produced both finishes.

      5. Accepted. kd 0.6 and ki 0.5 are reverted to the raced values kp 4.0, ki 0.2,
      kd 0.3, so this design differs from the best raced design in one variable only.

      6. Rejected. I did not adopt the +/-0.05 m, 16 mm, 0.025 m-pitch layout, since
      it was never raced and changes the per-centimetre steering scale by about 20
      percent.


      Change from iteration 4: sensor y moves from 0.07 to 0.08, the contract maximum,
      and nothing else. This is a clean one-variable test of forward sensing. Expected
      result: a small rise in s-bend and slalom progress, around 0.16 or more. If
      progress falls below 0.156 on the s-bend, revert to y=0.07 in the next iteration.
      I do not expect a large gain; the critique is right that a 1 cm lead is small.


      - [Open this output](iteration-6/entity1/versions/7fe11331a36b40febdb96fe819bd6763/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/51d7164d28ab470fb7e2594bc4e0a50f/payload.json),
      [entityC1](iteration-6/entityC1/versions/1934f6519c914dba93f28f935a913c07/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-224356461ca3031e/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Round-2 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-6/entityC2/versions/65fee65e446541c7a162e154f8a1aa74/payload.json)

      - Based on: [entity1](iteration-6/entity1/versions/7fe11331a36b40febdb96fe819bd6763/payload.json),
