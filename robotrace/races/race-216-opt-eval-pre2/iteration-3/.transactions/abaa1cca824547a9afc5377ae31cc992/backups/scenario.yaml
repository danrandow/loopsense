map:
  id: race-216-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Slower base speed 0.9
    notes: 'Drops base speed from 1.3 to 0.9 with gains and geometry unchanged, to
      test whether speed is what drives the early line departure. Evidence: 0 of 60
      trials finished, and progress stayed at 0.04 to 0.12 across three gain sets.


      ### Rationale


      Evidence: across iterations 0 and 2, 0 of 60 development trials finished. Every
      run ended off track, with progress of only 0.04 to 0.12 and max error pinned
      just past the 0.06 m limit. RMS error is about 0.03 m on every track, and steering
      oscillation is low (about 0.07), so the controller is not jittering. The robot
      departs the line early and fast, at nearly the same point regardless of gain
      changes. Because progress barely moved across three different gain sets, gain
      alone is not the limiting factor. Speed is the most likely cause: at base_speed
      1.3 to 1.6 the robot carries too much momentum into the bends and overshoots
      the 6 cm limit before the sensors can correct. Completion is worth 500 points
      and the time term is worth at most 60, so staying on the line matters far more
      than finishing fast. The off-track limit is max(0.06, 0.0125 + body_width/4),
      which stays at 0.06 for any body width up to about 0.18, so widening the body
      does not help. Changes: (1) base_speed lowered from 1.3 to 0.9 so the robot
      has time to correct at each bend; (2) kp held at 4.0 and ki at 0.5, the iteration
      2 values, to isolate the speed effect; (3) kd kept at 0.6 for damping; (4) sensor
      geometry, wheel track, body and mass unchanged, so the speed change is the only
      variable. Expected result: the robot should hold the line through the bends
      and reach progress well above 0.12. Completion is possible but may take longer
      than 3 s, which trades some time points for the much larger completion bonus.
      If the robot still leaves the line at 0.9, the next race should point to the
      sensor footprint or the gains.


      - [Open this output](iteration-3/entity0/versions/279266b42e0848e4b8b3dca1e38b054b/payload.json)

      - Based on: [entityR2A](iteration-3/entityR2A/versions/carried-477754cedb798d78/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Round-1 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-3/entityC1/versions/995f18fcaac2431c80540fd4cc3ab95d/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/279266b42e0848e4b8b3dca1e38b054b/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-477754cedb798d78/payload.json)'
  - id: entity1
    label: 'Revised: speed 1.5, gains'
    notes: 'Restores base_speed to 1.5 and trims kp to 3.5, ki to 0.15 and kd to 0.3
      in response to the critique''s speed and gain concerns. Keeps the wider 16 mm
      sensor layout, since iteration 0 showed a steady 3 cm drift and max_error at
      the 0.06 m limit.


      ### Rationale


      Evidence: the iteration-0 race (26.04) had 0 of 60 finishes. Every trial ended
      off track with progress of 0.04 to 0.12, RMS error of about 0.03 m on all tracks,
      and max_error of about 0.061 m, just past the 0.06 m limit. Oscillation was
      low (about 0.07), so the robot leaves the line steadily rather than jittering.


      Critique, point by point:

      1. Speed: accepted. I restore base_speed to 1.5 (from the draft''s 1.3). The
      3 s limit needs about 1.5 m/s on average, and no race evidence shows speed is
      the limit. The 500-point completion bonus depends on finishing.

      2. Changing many variables at once: partly accepted. I keep the draft''s sensing
      and gain changes but size them more conservatively, so the next race stays interpretable.

      3. Integral (bias) term: accepted in part. The critique''s point that ki = 0.5
      is a large untested probe is fair. I reduce ki to 0.15, which is a cheap test
      for the about 2 percent motor mismatch. With the integral capped at +/-2, the
      maximum contribution is 0.3 turn units, a small and safe correction.

      4. Proportional gain: kp 4.0 reduced to 3.5. At the 3 cm offset seen in iteration
      0, the signal is about 1.5, so kp 3.5 gives about 5 turn units (about 1800 PWM).
      The weights saturate at +/-2, so kp 4 pushes the signal further into saturation
      without adding authority. The lower value keeps the same correction at offsets
      under 3 cm.

      5. Derivative gain: partly accepted. kd 0.6 was not supported by data, and derivative
      action amplifies sensor noise and tape-edge transitions. I set kd to 0.3, which
      damps the swing without a large noise term.

      6. Sensing: kept. Sensors at x = -0.04 to +0.04 m with 16 mm footprints and
      weights [-2, -1, 0, 1, 2] keep sensors on the tape at larger offsets, and the
      signal stays about 50 times the lateral offset with a valid range.

      7. Line loss: kept as last_direction. No evidence favours a search direction.


      Expected result: fewer off-track exits, and progress well above 0.12 on the
      oval and s-bend. Completion is possible but not assured. The check is max_error
      below 0.06, line_loss_events below 1 per track, and completion_time under 3
      s. If the robot still leaves early, the next race should show whether the gain
      or the speed is limiting.


      - [Open this output](iteration-2/entity1/versions/d28ba71dd66f4c4399c57c1e3eafc5f6/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/3e8a46bf02a1496b8c37b5d5731e3862/payload.json),
      [entityC1](iteration-2/entityC1/versions/c407f5ae7da64d41ab6cda61673b6512/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-8b8503bb1eded61d/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Critiques the revised design and rationale. It flags that seven values
      change at once from the raced baseline, that effective steering gain rises about
      2.3 times, and that the uniform 0.061 m max_error failure is not diagnosed.
      Based on the iteration-0 race data and the revision''s stated values.


      - [Open this output](iteration-2/entityC2/versions/fc187ffb808e460cbd79fde775d4a0e2/payload.json)

      - Based on: [entity1](iteration-2/entity1/versions/d28ba71dd66f4c4399c57c1e3eafc5f6/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-8b8503bb1eded61d/payload.json)'
  - id: entity2
    label: Gain-only step (kp 3, kd
    notes: 'Keeps the raced iteration-0 geometry, speed and weights, changing only
      kp (2.0 to 3.0) and kd (0.05 to 0.10) so the race can attribute any change.
      The critique''s point that the revision changed seven values at once and raised
      effective gain about 2.3 times is accepted; the raced all-off-track, max_error
      about 0.061 result is the evidence for a stronger lateral correction.


      ### Rationale


      Evidence: the raced iteration-0 design scored 26.04 with 0 of 60 finishes. All
      60 trials ended off track (progress 0.04 to 0.12, RMS about 0.03 m, max_error
      about 0.061 m on every track), with one line-loss event per trial. Failures
      were off-track, not time-outs, so the raced speed of 1.6 is not shown to be
      too high.


      Critique response, point by point:

      1. Multi-variable change: accepted. The revision changed seven values at once,
      so its result could not be attributed. This design changes only two controller
      values from the raced iteration-0 baseline: kp and kd. Geometry, base_speed,
      sensor_weights, ki and line_loss are kept exactly as raced.

      2. Effective gain: accepted. The revision''s kp times weight scale rose about
      2.3 times. Here kp goes 2.0 to 3.0, a 1.5 times increase, which is the smallest
      step that gives a measurable change in lateral correction.

      3. Speed: rejected as a change. The raced speed of 1.6 failed on off-track exit,
      not on time, so the 1.5 reduction in the revision has no evidence behind it.
      Keeping 1.6 also protects the time term.

      4. Derivative: partly accepted. kd goes 0.05 to 0.10, a modest increase for
      damping. The critique is right that kd amplifies noise at tape edges, so I keep
      it small. The race should show whether steering_oscillation rises.

      5. Ki: rejected for this iteration. The 2 percent mismatch gives about 0.19
      turn units, too small to explain a 6 cm excursion. Adding ki now would blur
      the result.

      6. Sensing: kept as raced. The critique''s concern about sensor-count jumps
      between 0.02 and 0.04 m is noted; I do not change geometry until the gain effect
      is known.


      Diagnosis: max_error sits near 0.061 on all tracks. Since line loss is counted
      once per trial and the outer sensors reach about 0.04 m, the robot probably
      loses the line and drifts past 0.06 m. Stronger proportional steering should
      reduce the lateral error that starts that drift.


      Expected result (hypothesis, not measured): max_error below 0.06 on some trials
      and at least one completion on the oval or s-bend. Decision rule for the next
      iteration: if max_error falls but still fails, the next change is kd or kp;
      if max_error is unchanged, the failure is not gain-limited and the next test
      is sensing geometry; if completion occurs but time is above 3 s, the next change
      is base_speed upward.


      - [Open this output](iteration-2/entity2/versions/9ddc3b1caa4641ffa57b416481530655/payload.json)

      - Based on: [entity1](iteration-2/entity1/versions/d28ba71dd66f4c4399c57c1e3eafc5f6/payload.json),
      [entityC2](iteration-2/entityC2/versions/fc187ffb808e460cbd79fde775d4a0e2/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-8b8503bb1eded61d/payload.json)'
