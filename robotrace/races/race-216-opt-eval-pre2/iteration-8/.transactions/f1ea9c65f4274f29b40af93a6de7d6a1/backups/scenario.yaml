map:
  id: race-216-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Iter 6 base, kp 4.5 kd
    notes: 'Returns to the best-raced sensor layout (iteration 6, 138.6) and raises
      kp and kd modestly to cut max error and oscillation. Iteration 7''s wider span
      scored 96, so it is not reused.


      ### Rationale


      Evidence: iteration 6 is the best raced design (138.6). It has five 16 mm sensors
      at y=0.08 spanning x=-0.05 to +0.05 m, weights [-2,-1,0,1,2], kp 4.0, ki 0.5,
      kd 0.6 and base_speed 1.0. Its oval has 1 finish in 20 and s-bend progress is
      0.295. Remaining faults are max error at about 0.062 m (just past the 0.06 m
      limit), 1.25 line-loss events per s-bend run, and oval steering oscillation
      of 0.30.


      Iteration 7 widened the span to +/-0.07 m and raised kp to 5.0. That scored
      96.0: oval progress fell from 0.55 to 0.39, slalom line losses rose from 1.0
      to 1.95, and no run finished. Widening the sensor spacing with unchanged weights
      lowers the steering signal per centimetre, so the wider layout did not help.
      I therefore return to the iteration 6 geometry, which is the proven base.


      Changes on the controller only: kp raised from 4.0 to 4.5 to restore some correction
      strength at the bends, and kd raised from 0.6 to 0.8 to damp the overshoot that
      shows up as oscillation and max error. ki 0.5 and base_speed 1.0 are kept, since
      they produced the only oval finishes.


      Expected result: max error near or below 0.06 m, fewer line-loss events on the
      s-bend, and oval completions at or above the iteration 6 rate. Completion on
      the s-bend or slalom is still unlikely in this round.


      - [Open this output](iteration-8/entity0/versions/cc518b6183f3407f92781b04708f842a/payload.json)

      - Based on: [entityR2A](iteration-8/entityR2A/versions/carried-c2b6e379d7fc5665/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critique finds the kd rise to 0.8 unsupported (no overshoot measured,
      oscillation already high) and the kp and kd changes confounded in one race.
      It also notes max error is flat across every gain set and line loss is a fixed
      1.0 per run, so gains alone may not reach the 0.06 m limit.


      - [Open this output](iteration-8/entityC1/versions/066b5a6dd8c743e894e5045697695951/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/cc518b6183f3407f92781b04708f842a/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-c2b6e379d7fc5665/payload.json)'
  - id: entity1
    label: kp 4.5 single-change test
    notes: 'Returns to the iteration 6 best design (138.6) and changes only kp from
      4.0 to 4.5, with speed reverted to 1.5 because iteration 7 showed 1.6 hurt.
      kd is back at the raced 0.3; the earlier kd 0.8 change was rejected as unsupported.


      ### Rationale


      Evidence. The outcome table, not the authorized-input description, is the reliable
      record. Iteration 6 (score 138.6, the best raced design) used sensors at y=0.08
      with x = -0.04 to +0.04 m at 0.02 m pitch, 16 mm footprints, weights [-2,-1,0,1,2],
      base_speed 1.5, kp 4.0, ki 0.2, kd 0.3 and last_direction. Its oval had 1 finish
      in 20 and its s-bend progress was 0.295. The authorized entity0 text describes
      a +/-0.05 m, kd 0.6, ki 0.5, base 1.0 layout, which does not match the raced
      table, so I treat that layout as untested. Iteration 7 changed only base_speed
      (1.5 to 1.6) on the iteration 6 geometry and scored 96.0, with oval progress
      down from 0.55 to 0.39. That is the one controlled comparison available, so
      higher speed hurts and I return to base_speed 1.5.


      Critique, point by point:

      1. kd 0.8 (my earlier change): accepted. No measured overshoot supports it,
      and kd amplifies noise and tape-edge jumps. kd returns to the raced 0.3.

      2. Changing several variables at once: accepted. This revision changes one controller
      variable against iteration 6, so any result is attributable.

      3. kp arithmetic: accepted. kp 4.5 with the same weights is about 12 percent
      more correction per metre (180 against 160 per m). It is modest, and I say so.

      4. Max error floor: accepted as a risk. Max error has sat at 0.061 to 0.067
      across kp 2 to 5, so a gain change may not move it. I keep kp 4.5 as the single
      test because it is the smallest step that is still informative.

      5. ki and speed: ki stays at 0.2 (the raced value). Speed stays at 1.5, the
      value that produced the only finishes and the best score. I reject the iteration
      7 speed.

      6. Geometry: kept at the iteration 6 layout. I reject the wider span, since
      it was not shown to help.


      Expected result: max_error near or just below 0.060, with s-bend line_loss_events
      at or below 1.25 and oval progress at or above 0.55. The change is small, so
      I do not expect a large gain. Decision rule for the next iteration: if max_error
      rises above 0.063 or progress falls below 0.55, revert to kp 4.0. If the result
      is unchanged, the limit is not gain-limited, and the next test should target
      the line-loss event at launch or at the first bend.


      - [Open this output](iteration-8/entity1/versions/59e06348a2ba47819c681d4095bed1a2/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/cc518b6183f3407f92781b04708f842a/payload.json),
      [entityC1](iteration-8/entityC1/versions/066b5a6dd8c743e894e5045697695951/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-c2b6e379d7fc5665/payload.json)'
  - id: entityC2
    label: Speed-only review
    notes: 'Reviews the base_speed 1.5 to 1.6 revision on the iteration 6 geometry.
      It flags a miscounted finish total (1, not 2), a speed effect tested only on
      failing designs, a negligible time-term gain, and a revert threshold sitting
      on the baseline mean. Evidence is the iteration 0 to 6 race tables.


      - [Open this output](iteration-7/entityC2/versions/298c76159c1d4b1e9d755fc3cedc014e/payload.json)

      - Based on: [entity1](iteration-7/entity1/versions/15de11f9628d4bde91af3a6d7c408c1f/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-dbad8061c79eaad7/payload.json)'
  - id: entity2
    label: kp 5.0 at raced geometry
    notes: 'Reverts speed to the raced 1.5 and tests kp 4.0 to 5.0 as the single change
      from iteration 6, the best raced design (138.6). It responds to the critique
      that the speed change was untested at this geometry and worth about 0.1 points
      per trial, and it targets the bend-authority limit suggested by max_error sitting
      at the off-track limit.


      ### Rationale


      Evidence: the best raced design is iteration 6 (score 138.64). Its oval finish
      count is 1 of 20 (the 2 finishes belong to iteration 4, not iteration 6). Progress
      is 0.554 on the oval, 0.295 on the s-bend and 0.097 on the slalom. Every trial
      ended off track, max_error sits at about 0.062 m on all tracks (about the 0.06
      m off-track limit), and line loss occurs about once per run.


      Critique response, point by point:

      1. Accepted. The finish count is corrected to 1 of 20 on the oval, so the baseline
      is one finish.

      2. Accepted. Speed was never varied at the y=0.08 geometry, so the earlier claim
      that speed does not move progress is not shown for the raced design. I do not
      rely on it.

      3. Accepted. A 1.5 to 1.6 m/s change only saves about 2.4 points per oval finish,
      roughly 0.1 point per trial. It cannot move the score measurably.

      4. Accepted. Higher speed increases lateral displacement per unit of fixed turn
      command, and that risk is untested. base_speed returns to the raced value of
      1.5.

      5. Accepted in part. The revert threshold is widened from the 0.063 max_error
      cut, since seed noise is not quantified. Thresholds are now stated on progress
      and finish rate, not max_error alone.

      6. Accepted. Progress is now part of the decision rule.

      7. Partly accepted. Line loss is not addressed by this race. last_direction
      is kept, since no evidence favours another policy.


      Change from iteration 6: kp 4.0 to 5.0, with base_speed back at 1.5. Lateral
      error reaches the off-track limit on every track, while progress is nearly fixed
      across speed and across kp 2 to 4 at the earlier geometry. This suggests the
      failure is at tight bends where steering authority is limited. With 0.02 m sensor
      pitch and weight step 1, kp 5 raises steering slope from about 200 to about
      250 per metre, a 25 percent increase. This is a single-variable test on a raced
      geometry.


      Decision rules, set before the race. Compare with iteration 6 track means (oval
      progress 0.554 and finish rate 0.05; s-bend progress 0.295; slalom progress
      0.097). With 20 trials per track, changes of a few thousandths are within noise.
      Revert to kp 4.0 if s-bend progress falls below 0.28, or the oval finish rate
      falls below 0.05, or steering_oscillation rises above about 0.4 on the oval.
      If progress rises clearly on the s-bend and oval, keep kp 5.0. If the result
      is neutral, the next race tests line-loss handling or start-up behaviour with
      geometry and gains fixed.


      Expected result: s-bend progress at or above 0.30, with max_error near 0.06
      and slightly higher steering oscillation.


      - [Open this output](iteration-7/entity2/versions/0268c5c1bc87467083fb9109cc9814a4/payload.json)

      - Based on: [entity1](iteration-7/entity1/versions/15de11f9628d4bde91af3a6d7c408c1f/payload.json),
      [entityC2](iteration-7/entityC2/versions/298c76159c1d4b1e9d755fc3cedc014e/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-dbad8061c79eaad7/payload.json)'
