map:
  id: race-216-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Wider sensor span draft
    notes: 'Widens the sensor span to +/-0.07 m and raises kp to 5.0 to keep correction
      strength, aiming to cut the line-loss events seen on the s-bend. Built on iteration
      6, the best design so far (score 138.6), which had one oval finish and s-bend
      progress 0.295.


      ### Rationale


      Evidence: the best design so far (iteration 6, score 138.6) has 5 sensors at
      y=0.08 with a +/-0.05 m span, weights [-2,-1,0,1,2], base_speed 1.0, kp 4.0,
      ki 0.5, kd 0.6. Across the 60 development trials of that design, the oval had
      1 finish in 20, s-bend progress was 0.295 (up from 0.156 at y=0.07), and slalom
      progress was 0.097. The main remaining problems are that every run still leaves
      the line (max error ~0.062 m against a 0.06 m limit), the s-bend logs 1.25 line-loss
      events per run, and oval steering oscillation is 0.30. Line loss on bends suggests
      that at larger offsets no sensor sees the tape, so the signal drops out. Forward
      placement at y=0.08 is already at the contract maximum, so the remaining lever
      is lateral coverage.


      Changes: (1) widen the sensor span to x = -0.07 to +0.07 m in 0.035 m steps,
      so the tape stays under a sensor at larger offsets and line loss on bends should
      fall; (2) keep the 16 mm footprint and 5 sensors; (3) weights [-2,-1,0,1,2]
      are kept, which lowers the signal slope from about 40 to about 29 per metre,
      so kp rises from 4.0 to 5.0 to restore correction strength per centimetre; (4)
      ki 0.5, kd 0.6 and base_speed 1.0 are unchanged, since these are the settings
      that produced the only oval finishes; (5) wheel track, radius, body and mass
      are unchanged.


      Expected result: fewer line-loss events (toward 0.5 or less on the s-bend),
      progress above 0.3 on the s-bend and slalom, and more oval completions. A full
      finish on the s-bend or slalom is unlikely this round. If the robot still exits
      at a fixed point, the next race should point to the kd term or to the speed.


      - [Open this output](iteration-7/entity0/versions/23f92a0ce6f74c4f9f0bd0197aafe9d9/payload.json)

      - Based on: [entityR2A](iteration-7/entityR2A/versions/carried-dbad8061c79eaad7/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critique finds that kp 5.0 with 29/m slope gives 143/m versus 160/m before,
      so steering gain falls about 11 percent, and that sensors at +/-0.05 m already
      see the tape at the observed exit offset, so widening the span does not explain
      the failure. Based on the authorized iteration 6 data and the sensor geometry
      in the contract.


      - [Open this output](iteration-7/entityC1/versions/f2f06cd26cb74b9bb42311a93967f259/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/23f92a0ce6f74c4f9f0bd0197aafe9d9/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-dbad8061c79eaad7/payload.json)'
  - id: entity1
    label: Iter 6 design, speed 1.6
    notes: 'Reverts to the best raced geometry and gains (iteration 6, score 138.6)
      and changes only base_speed from 1.5 to 1.6. The draft''s wider span and kp
      change were rejected because the kp x slope product falls and the draft''s cited
      best-design settings do not match the outcome table.


      ### Rationale


      Evidence. The outcome table shows that the best raced design (iteration 6, score
      138.6, 2 of 60 finishes, both on the oval) used sensors at y=0.08 with x = -0.04
      to +0.04 m at 0.02 m spacing, 16 mm footprints, weights [-2,-1,0,1,2], base_speed
      1.5, kp 4.0, ki 0.2, kd 0.3 and last_direction. The draft''s claim that the
      best design used a +/-0.05 m span, base_speed 1.0, ki 0.5 and kd 0.6 does not
      match that table, so I treat the draft''s controller and geometry as untested.
      Across the 60 trials, progress was unchanged by speed (0.9 to 1.6) and by gains,
      which points to a fixed spatial exit point. Line loss occurs once per run on
      almost every track.


      Critique, point by point:

      1. kp arithmetic: accepted. The draft has 0.035 m spacing and a weight step
      of 1, so the signal slope is about 29/m and kp 5 gives about 143/m, less than
      the 200/m of the raced best (kp 4 at 50/m). The draft''s kp change therefore
      reduces steering gain, and I reject it.

      2. Coverage explanation: accepted. Widening the span is not shown to fix the
      exit. The best raced design already covers the tape out to about 0.05 m.

      3. Spacing and gaps: accepted. The 35 mm pitch makes the centroid jumpy, and
      I reject that geometry.

      4. Saturation: accepted as a reason to reject the wider span.

      5. Confounding: accepted. The draft changes span, spacing, kp and implied gain
      together, so I return to a raced configuration.

      6. Speed: partly accepted. Completion needs about 1.5 m/s, so I do not drop
      speed. I raise it from 1.5 to 1.6 as the single change, since the exit is spatial
      and speed does not move progress. A small rise in speed should cut completion
      time if the robot finishes, and it is the one controller variable not yet shown
      to hurt the best design.

      7. Line-loss pattern: partly accepted. The constant one loss per run is noted.
      I keep last_direction, since no evidence favours another policy.


      Change from iteration 6: base_speed 1.5 to 1.6. Everything else is identical
      to the best raced design, so the result is attributable to speed.


      Expected result: progress and max_error near the iteration 6 values (s-bend
      progress about 0.30, max_error about 0.062), with a modest reduction in completion
      time on any oval finish. Decision rule: if s-bend or oval max_error rises above
      0.063, or off-track exits occur earlier than in iteration 6, revert to base_speed
      1.5. If progress is unchanged, the failure is spatial and the next test should
      target the first bend or the start-up transient.


      - [Open this output](iteration-7/entity1/versions/15de11f9628d4bde91af3a6d7c408c1f/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/23f92a0ce6f74c4f9f0bd0197aafe9d9/payload.json),
      [entityC1](iteration-7/entityC1/versions/f2f06cd26cb74b9bb42311a93967f259/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-dbad8061c79eaad7/payload.json)'
  - id: entityC2
    label: Speed-only review
    notes: 'Reviews the base_speed 1.5 to 1.6 revision on the iteration 6 geometry.
      It flags a miscounted finish total (1, not 2), a speed effect tested only on
      failing designs, a negligible time-term gain, and a revert threshold sitting
      on the baseline mean. Evidence is the iteration 0 to 6 race tables.


      - [Open this output](iteration-7/entityC2/versions/298c76159c1d4b1e9d755fc3cedc014e/payload.json)

      - Based on: [entity1](iteration-7/entity1/versions/15de11f9628d4bde91af3a6d7c408c1f/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-dbad8061c79eaad7/payload.json)'
  - id: entity2
    label: kp 5.0 at raced geometry
    notes: 'Reverts speed to the raced 1.5 and tests kp 4.0 to 5.0 as the single change
      from iteration 6, the best raced design (138.6). It responds to the critique
      that the speed change was untested at this geometry and worth about 0.1 points
      per trial, and it targets the bend-authority limit suggested by max_error sitting
      at the off-track limit.


      ### Rationale


      Evidence: the best raced design is iteration 6 (score 138.64). Its oval finish
      count is 1 of 20 (the 2 finishes belong to iteration 4, not iteration 6). Progress
      is 0.554 on the oval, 0.295 on the s-bend and 0.097 on the slalom. Every trial
      ended off track, max_error sits at about 0.062 m on all tracks (about the 0.06
      m off-track limit), and line loss occurs about once per run.


      Critique response, point by point:

      1. Accepted. The finish count is corrected to 1 of 20 on the oval, so the baseline
      is one finish.

      2. Accepted. Speed was never varied at the y=0.08 geometry, so the earlier claim
      that speed does not move progress is not shown for the raced design. I do not
      rely on it.

      3. Accepted. A 1.5 to 1.6 m/s change only saves about 2.4 points per oval finish,
      roughly 0.1 point per trial. It cannot move the score measurably.

      4. Accepted. Higher speed increases lateral displacement per unit of fixed turn
      command, and that risk is untested. base_speed returns to the raced value of
      1.5.

      5. Accepted in part. The revert threshold is widened from the 0.063 max_error
      cut, since seed noise is not quantified. Thresholds are now stated on progress
      and finish rate, not max_error alone.

      6. Accepted. Progress is now part of the decision rule.

      7. Partly accepted. Line loss is not addressed by this race. last_direction
      is kept, since no evidence favours another policy.


      Change from iteration 6: kp 4.0 to 5.0, with base_speed back at 1.5. Lateral
      error reaches the off-track limit on every track, while progress is nearly fixed
      across speed and across kp 2 to 4 at the earlier geometry. This suggests the
      failure is at tight bends where steering authority is limited. With 0.02 m sensor
      pitch and weight step 1, kp 5 raises steering slope from about 200 to about
      250 per metre, a 25 percent increase. This is a single-variable test on a raced
      geometry.


      Decision rules, set before the race. Compare with iteration 6 track means (oval
      progress 0.554 and finish rate 0.05; s-bend progress 0.295; slalom progress
      0.097). With 20 trials per track, changes of a few thousandths are within noise.
      Revert to kp 4.0 if s-bend progress falls below 0.28, or the oval finish rate
      falls below 0.05, or steering_oscillation rises above about 0.4 on the oval.
      If progress rises clearly on the s-bend and oval, keep kp 5.0. If the result
      is neutral, the next race tests line-loss handling or start-up behaviour with
      geometry and gains fixed.


      Expected result: s-bend progress at or above 0.30, with max_error near 0.06
      and slightly higher steering oscillation.


      - [Open this output](iteration-7/entity2/versions/0268c5c1bc87467083fb9109cc9814a4/payload.json)

      - Based on: [entity1](iteration-7/entity1/versions/15de11f9628d4bde91af3a6d7c408c1f/payload.json),
      [entityC2](iteration-7/entityC2/versions/298c76159c1d4b1e9d755fc3cedc014e/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-dbad8061c79eaad7/payload.json)'
