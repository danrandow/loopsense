  - id: entity2
    label: Forward sensors y=0.07
    notes: 'Keeps the draft''s forward sensor move (y 0.04 to 0.07 m) with 16 mm footprints
      at 0.02 m pitch, and the kp 4.0, ki 0.2, kd 0.3 controller, base speed 1.5.
      The rationale admits the baseline is multi-variable against the last raced design,
      and it sets the next step if progress stays below 0.15 with one line-loss event.
      Evidence: 0 of 60 finishes across iterations, with max_error near 0.061 and
      one line-loss event per run.


      ### Rationale


      Evidence: 0 of 60 development trials finished in any raced iteration (scores
      26.04 and 36.31). Every trial ended off track. Progress stayed at about 0.115
      (oval), 0.04 (s-bend) and 0.035 to 0.11 (slalom). Max_error was about 0.061
      m on every track and seed, with exactly one line-loss event per run. These numbers
      barely moved across base_speed 1.5 to 1.6 and kp 2 to 4, so gain and speed are
      not the limiting factors.


      Critique response, point by point:

      1. Speed 1.0: accepted earlier and kept reversed. A 300-step run needs about
      1.5 m/s on average to finish, so base_speed stays at 1.5.

      2. Forward sensor move (y 0.04 to 0.07 m): kept, as the one geometry variable
      not yet isolated. The critique is right that a 3 cm lead gives only about 20
      ms at 1.5 m/s, and that sensing lead is a weak prior. The race is still the
      cheapest way to rule it in or out.

      3. Signal scale: kept at the 0.02 m pitch, so the steering signal per centimetre
      of offset matches the earlier design.

      4. Coverage: kept. 16 mm footprints at 20 mm pitch cover the 25 mm tape at small
      offsets, and the x span of plus or minus 0.04 m covers offsets beyond the 0.03
      m reached before.

      5. kd and ki: accepted. kd 0.6 and ki 0.5 are dropped. kp 4.0, ki 0.2 and kd
      0.3 are kept.

      6. Baseline (critique on the rationale): accepted. This design is not a clean
      single-variable change from the last raced design. The last race used base 1.6,
      kp 3.0, ki 0, kd 0.1, sensors at y 0.02 with 12 mm footprints and weights [-1.5,
      -0.75, 0, 0.75, 1.5]. This design changes kp, ki, kd, sensor size, weights and
      sensor y together. Any result is therefore attributable only to the combined
      controller and sensing change, not to sensor lead alone.

      7. Overshoot risk from earlier sensing: noted. Earlier steering sensing could
      increase lateral oscillation on tight bends, and steering_oscillation is logged
      to check this.


      Decision rule for the next race: if progress is still below 0.15 with one line-loss
      event, the failure is structural (launch transient or line-loss handling). The
      next race should then change line_loss (search_right or stop) with the sensor
      geometry held fixed, not gains or speed.


      Expected result (hypothesis, low confidence): progress above 0.12 and max_error
      below 0.06 on the oval. Completion is not expected.


      - [Open this output](iteration-4/entity2/versions/75cad11047ed4dac8574740b24812bde/payload.json)

