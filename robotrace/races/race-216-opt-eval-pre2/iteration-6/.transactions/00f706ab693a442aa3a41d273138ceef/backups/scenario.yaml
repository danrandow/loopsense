map:
  id: race-216-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Sensors moved to y=0.08
    notes: 'Keeps the best-so-far design (iteration 4, score 129) and moves its five
      sensors to the contract maximum y=0.08, so the correction starts earlier. Forward
      sensing was the one change that raised progress, and the gains and speed stay
      as they were.


      ### Rationale


      Evidence: 60 development trials across iterations 0, 2, 3 and 4 gave 2 finishes,
      both on the oval at base_speed 1.0. The best design so far (iteration 4, score
      129.05) moved the sensors forward to y=0.07 with a +/-0.05 m span. That raised
      s-bend progress to 0.156 and slalom progress to 0.10, against 0.04 and 0.035
      at y=0.04, so forward sensing is the change that has helped. Speed (0.9 to 1.6)
      and gains (kp 2 to 4) did not move the failure point, so the limit appears to
      be how early the robot sees the line. Iteration 5 was never raced, so its seven-sensor
      layout has no evidence. Change: move the sensors to y=0.08, the contract maximum,
      so the correction starts about 1 cm earlier than in iteration 4. Keep the proven
      5-sensor layout at +/-0.05 m, with 16 mm footprints and weights [-2,-1,0,1,2].
      Keep kp 4.0, ki 0.5, kd 0.6 and base_speed 1.0, since these were the settings
      that produced the two oval finishes. Wheel track, radius, body and mass are
      unchanged. Expected result: progress above 0.16 on the s-bend and slalom, and
      more oval completions than 2 of 20. The change is small, so a large gain is
      not expected; if the robot still exits at the same point, the next race should
      point to the line-loss handling or the kd term.


      - [Open this output](iteration-6/entity0/versions/51d7164d28ab470fb7e2594bc4e0a50f/payload.json)

      - Based on: [entityR2A](iteration-6/entityR2A/versions/carried-224356461ca3031e/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critiques the y=0.08 draft as a 1 cm move from the iteration 4 result,
      which was confounded by the span and speed changes. Flags the constant one-line-loss-per-run
      pattern and the unsized progress target as the main gaps, citing the 60-trial
      race data.


      - [Open this output](iteration-6/entityC1/versions/1934f6519c914dba93f28f935a913c07/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/51d7164d28ab470fb7e2594bc4e0a50f/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-224356461ca3031e/payload.json)'
  - id: entity1
    label: Iter 4 design, sensors
    notes: 'Keeps the raced iteration 4 controller and span, changing only sensor
      y from 0.07 to 0.08 for a clean test. Reverts the draft''s unraced span, speed
      1.0 and kd/ki changes, which the critique showed were unsupported or would forfeit
      completion.


      ### Rationale


      Evidence. The only raced design with completions is iteration 4 (score 129.05):
      base_speed 1.5, kp 4.0, ki 0.2, kd 0.3, sensors at y=0.07 with x = -0.04 to
      +0.04 (0.02 m pitch), 16 mm footprints, weights [-2,-1,0,1,2]. Its two oval
      finishes came from that configuration. The draft''s claim that the finishes
      were at base_speed 1.0 with a +/-0.05 m span is wrong, and the +/-0.05 m, kd
      0.6, ki 0.5 layout has never been raced. Iteration 5 was never raced either.


      Critique, point by point:

      1. Accepted. The draft''s ''progress above 0.16'' target had no basis, so I
      state the decision rule instead: a fall below 0.156 on the s-bend means y=0.08
      is worse.

      2. Accepted. Iteration 4 changed geometry and span together, so I do not claim
      geometry alone caused the gain.

      3. Accepted in part. The one-line-loss-per-run pattern is recorded, but the
      current evidence cannot locate it. I requested per-step telemetry so the next
      iteration can check whether the loss occurs at the start.

      4. Accepted. The draft''s base_speed 1.0 cannot finish in 300 steps (about 1.5
      m/s is needed), so the 500-point completion bonus is lost. Speed returns to
      1.5, the value that produced both finishes.

      5. Accepted. kd 0.6 and ki 0.5 are reverted to the raced values kp 4.0, ki 0.2,
      kd 0.3, so this design differs from the best raced design in one variable only.

      6. Rejected. I did not adopt the +/-0.05 m, 16 mm, 0.025 m-pitch layout, since
      it was never raced and changes the per-centimetre steering scale by about 20
      percent.


      Change from iteration 4: sensor y moves from 0.07 to 0.08, the contract maximum,
      and nothing else. This is a clean one-variable test of forward sensing. Expected
      result: a small rise in s-bend and slalom progress, around 0.16 or more. If
      progress falls below 0.156 on the s-bend, revert to y=0.07 in the next iteration.
      I do not expect a large gain; the critique is right that a 1 cm lead is small.


      - [Open this output](iteration-6/entity1/versions/7fe11331a36b40febdb96fe819bd6763/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/51d7164d28ab470fb7e2594bc4e0a50f/payload.json),
      [entityC1](iteration-6/entityC1/versions/1934f6519c914dba93f28f935a913c07/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-224356461ca3031e/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Round-2 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-6/entityC2/versions/65fee65e446541c7a162e154f8a1aa74/payload.json)

      - Based on: [entity1](iteration-6/entity1/versions/7fe11331a36b40febdb96fe819bd6763/payload.json),
