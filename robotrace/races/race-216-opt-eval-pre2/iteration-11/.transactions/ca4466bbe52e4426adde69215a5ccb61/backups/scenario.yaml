map:
  id: race-216-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: Narrower track, lighter
    notes: 'Pushes the iteration 10 trend further: wheel track 0.09 to 0.08 m, mass
      0.55 to 0.45 kg, kp 5.0 to 5.5 for more yaw authority. Based on iteration 10''s
      gain in oval finishes (1 to 5 of 20) when track and mass were reduced.


      ### Rationale


      Evidence: iteration 10 is the best raced design (231.83). Its oval finish rate
      rose to 5 of 20 from 1 of 20, and max error fell to about 0.0585 m on the oval,
      just inside the 0.06 m limit. Its s-bend and slalom still end off track, with
      s-bend progress at 0.49 and 1.3 line-loss events on the slalom. The change that
      moved the result was the physical yaw response (wheel_track 0.12 to 0.09 and
      mass 0.8 to 0.55), so steering authority per PWM count is the lever that is
      working. Earlier sensor, gain and footprint changes had no measurable effect,
      and the off-track limit cannot rise because body_width/4 + 0.0125 stays below
      0.06 m for every allowed width.


      Changes: (1) wheel_track reduced from 0.09 to 0.08 m, the contract minimum.
      Turn rate per unit wheel-speed difference rises by about 12.5 percent, which
      gives more correction at the bends where the line is lost. (2) mass reduced
      from 0.55 to 0.45 kg, which lowers yaw inertia and speeds the response to the
      same turn command. (3) kp raised from 5.0 to 5.5 to match the stronger steering
      per PWM. (4) kd kept at 0.8 to damp the faster yaw, and ki 0.5 and base_speed
      1.0 are kept as the proven settings. Sensors and weights are unchanged, so only
      the physical response and the proportional gain move.


      Expected result: lower max error and fewer line-loss events on the s-bend, which
      should lift the oval finish rate above 5 of 20 and raise s-bend progress. Some
      risk of oscillation from the faster yaw, which kd 0.8 should contain. Completion
      on the s-bend or slalom remains unlikely this round.


      - [Open this output](iteration-11/entity0/versions/0e12a8541f544f7fb8e9b1c9d7710c7e/payload.json)

      - Based on: [entityR2A](iteration-11/entityR2A/versions/carried-5c3fe6ee39fb8e08/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critique of the iteration 11 draft (wheel_track 0.08, mass 0.45, kp 5.5).
      It argues the three-way change is unattributable, that effective loop gain rises
      about 1.83x while kd/kp falls, that max error exceeds 0.06 m on s-bend and slalom,
      and that the final unseen-track race needs a robustness argument. Evidence is
      the iteration 10 and earlier outcome table.


      - [Open this output](iteration-11/entityC1/versions/d18c25cae3bf489a95cd1da82b402b7c/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/0e12a8541f544f7fb8e9b1c9d7710c7e/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-5c3fe6ee39fb8e08/payload.json)'
  - id: entity1
    label: Revert to best raced
    notes: 'Resubmits the iteration 10 design (score 231.83) unchanged, rejecting
      the draft''s untested bundled changes to wheel_track, mass, kp, base_speed,
      ki and kd. Chosen because it is the only design with a measured 60-trial record,
      and the final score is on an unseen track.


      ### Rationale


      Evidence. The raced record is the outcome table, and it shows iteration 10 (wheel_track
      0.09, mass 0.8, kp 4.0, kd 0.3, ki 0.2, base_speed 1.5, sensors at y=0.08 spanning
      x=-0.04 to +0.04 at 0.02 m pitch, 16 mm footprints, weights [-2,-1,0,1,2], last_direction)
      as the best design at 231.83. It finished 5 of 20 oval runs, with oval max_error
      0.0585 and s-bend progress 0.49. The draft''s controller (base_speed 1.0, ki
      0.5, kd 0.8, kp 5.0) and its mass of 0.55 or 0.45 kg have not been raced on
      this geometry. The draft''s rationale also cites iteration 10 as a mass 0.8
      to 0.55 change, which the outcome table does not support.


      Critique, point by point:

      1. Loop gain arithmetic: accepted. Narrowing wheel_track from 0.12 to 0.09 already
      raises yaw per PWM count by about 1.33x. Raising kp on top of that stacks loop
      gain. The draft''s kp 5.5 with wheel_track 0.08 would give about 1.83x the iteration
      6 gain, and I cannot defend that.

      2. Bundled changes and unattributable result: accepted. The draft changes wheel_track,
      mass, kp, and base_speed/ki/kd relative to any raced design. A single race cannot
      attribute the result to any one of them.

      3. Oscillation trend and kd/kp ratio: accepted. Oval steering_oscillation has
      risen with each yaw-authority step, and kd/kp falls as the loop stiffens. There
      is no measured threshold that justifies the draft.

      4. Mass: accepted. Mass 0.45 kg is below the 0.55 kg minimum the team tested,
      and the draft gives no traction argument. Mass returns to the raced 0.8 kg.

      5. Final-race robustness: accepted and decisive. This is the final iteration,
      and the score that counts is an unseen track. The only design with a measured
      multi-track record across 60 trials is iteration 10. An untested, more aggressive
      design is more likely to leave the line on a new shape.

      6. Speed and line-loss contingencies: partly accepted. Base speed 1.5 is the
      raced value that produced finishes, so I keep it. The draft''s base_speed 1.0
      is not proven to help. The persistent single line-loss event is not solved by
      any gain change I can justify, so I do not claim it is fixed.


      Decision: I reject the draft''s changes and resubmit the iteration 10 design
      unchanged. It is the only design whose behaviour is measured on the development
      tracks and its score is known. The draft''s improvements are speculative and
      would be raced blind on the final unseen track. Expected result: roughly the
      iteration 10 record, with an oval finish rate near 0.25 and an s-bend progress
      near 0.49. Completion on s-bend or slalom remains unlikely at base speed 1.5
      in 3.0 s.


      - [Open this output](iteration-11/entity1/versions/36df78c722e3480599c18de2d319e3b1/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/0e12a8541f544f7fb8e9b1c9d7710c7e/payload.json),
      [entityC1](iteration-11/entityC1/versions/d18c25cae3bf489a95cd1da82b402b7c/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-5c3fe6ee39fb8e08/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Critiques the unchanged iteration 10 resubmission and its rationale against
      the race table. Key evidence: oval max_error 0.0585 sits at the 0.06 m off-track
      limit, and s-bend max_error 0.0631 exceeds it. The rationale''s ''only multi-track
      record'' claim is corrected, since iterations 4, 6, 8 and 9 also have 60-trial
      records.


      - [Open this output](iteration-11/entityC2/versions/a89be0d568e84c01993afd416c857870/payload.json)

      - Based on: [entity1](iteration-11/entity1/versions/36df78c722e3480599c18de2d319e3b1/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-5c3fe6ee39fb8e08/payload.json)'
  - id: entity2
    label: Wider track test (0.14 m)
    notes: 'Rejects the 0.09 m track change, since it acts like a kp rise and kp 5.0
      hurt progress (iteration 7). Keeps the raced best design and tests wheel_track
      0.14 m, the only change, to see whether less steering authority helps.


      ### Rationale


      Evidence: the outcome table is the reliable record. The best raced design (iterations
      6, 8 and 9, score 138.6391) uses five 16 mm sensors at y=0.08 spanning x=-0.04
      to +0.04 m, weights [-2,-1,0,1,2], base_speed 1.5, kp 4.0, ki 0.2, kd 0.3, and
      last_direction, on wheel_track 0.12.


      The revised design (wheel_track 0.09 m) is rejected. Narrowing the track raises
      the yaw gain per unit of turn by about 1.33x, which is equivalent to a kp increase
      to about 5.3. The only measured kp increase on this geometry (kp 4.0 to 5.0,
      iteration 7) lowered oval progress from 0.554 to 0.393, s-bend progress from
      0.295 to 0.180, and raised s-bend line-loss events from 1.25 to 1.95. The critique''s
      point 3 is therefore correct, and the 0.09 m change is expected to hurt. It
      also increases the constant motor-mismatch drift by about 1.33x (critique point
      4), which is a second reason to reject it. The kp 4.5 revision is rejected for
      the same reason.


      I keep the rest of the raced design and test the mirror image of the iteration
      7 result: wheel_track widened from 0.12 to 0.14 m. This lowers effective steering
      gain by about 0.86x and reduces the motor-mismatch drift per metre. It is the
      only change against iteration 6. The design is a single variable, so any result
      is attributable to steering authority.


      Expected result: if the effective gain is too high, as the kp 5.0 result suggests,
      max_error and oval progress should move slightly in the right direction. The
      most likely result is a small change (within seed noise) because the gain effect
      on this geometry was flat between kp 2 and 4. The line_loss_events count is
      not expected to change, because the loss sits near the 0.06 m off-track boundary
      and that boundary does not move with track width.


      Decision rule: if oval progress falls below 0.52 or s-bend progress falls below
      0.27, revert to wheel_track 0.12. If the results are unchanged, the failure
      is not gain-limited, and the next test should target the timing of the single
      line-loss event rather than gains. Completion on the s-bend or slalom remains
      unlikely at base_speed 1.5, since speed 1.0 cannot finish and speed 1.6 cut
      oval progress.


      - [Open this output](iteration-10/entity2/versions/3dafba2a3db44c198155f06ad98ccadf/payload.json)

      - Based on: [entity1](iteration-10/entity1/versions/99affee7e3fb498e88e9de6a5c6ea345/payload.json),
