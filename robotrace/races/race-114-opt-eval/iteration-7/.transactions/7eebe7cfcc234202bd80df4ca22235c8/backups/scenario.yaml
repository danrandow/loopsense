map:
  id: race-114-opt-eval
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Sensor row y=0.01 test
    notes: 'Iteration 6''s best design (255.7) at base_speed 1.3, with only the sensor
      row moved from y=0.03 to y=0.01 m to test whether lag drives the persistent
      max_error near 0.06 m. Evidence: iteration 6 had zero line loss and 9 of 20
      oval finishes, and the approved review set this as the next single-variable
      test.


      ### Rationale


      Evidence from iteration 6 (score 255.7, best so far): base_speed 1.3 on the
      iteration 5 design gave 9 of 20 oval finishes (up from 2 of 20), line_loss_events
      0 on all tracks, oval mean finish time 1.89 s, and oval max_error down to 0.0535
      m (from 0.060). Speed did not cause the drift; it helped finishes. The approved
      review for this iteration sets the next test: with line loss at 0 and finishes
      held, keep base_speed 1.3 and move only the sensor row toward the axle. Max_error
      has sat at 0.060 to 0.064 m in every earlier design, and sensors at y = 0.03
      m sit 3 cm ahead of the axle, so lag is a plausible cause. Change: sensor_positions
      y from 0.03 to 0.01 m for all seven sensors. x positions, weights, base_speed
      1.3, kp 5.0, ki 0.02, kd 0.8 and last_direction are unchanged, so this race
      isolates the row move against the 255.7 baseline. Expected result: max_error
      below about 0.055 m on the s-bend and slalom, with oval finishes at or above
      9 of 20 and no line-loss events. Risks: the row is closer to the axle, so the
      sensor-to-line reading may change more abruptly on sharp bends, which could
      add oscillation, and the slalom still logged about one line-loss event per run
      in iteration 5. Hypotheses: (a) max_error is lag-limited by sensors placed far
      ahead of the axle; (b) the y move alone reduces off-track exits without touching
      finishes. Measurements requested: completion, progress, completion time, rms
      and max error, line-loss events, steering oscillation, control effort, controller
      errors and noise robustness. If finishes drop to 0 with line loss still 0, revert
      to y = 0.03 m and test base_speed 1.2 alone. If steering oscillation exceeds
      about 0.4 while max_error is below 0.05 m, lower kd to about 0.5.


      - [Open this output](iteration-7/entity0/versions/3cae05e4961046cc9fafff41434ed4e3/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-095e260ed842dbe3/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-8e9f0822926e3f44/payload.json)'
  - id: entityR1
    label: 'Approve: row y 0.03 to'
    notes: 'Approved the iteration 6 design with only sensor row y moved from 0.03
      to 0.01 m, to test whether lag from sensors ahead of the axle drives max_error
      (0.053 to 0.064 m across all earlier races). Valid within limits, with follow-up
      branches set for line loss, finishes and oscillation.


      ### Feedback


      Written before this candidate has raced, so it states no result for it. The
      candidate is the iteration 6 design (best raced so far, 255.7) with one change:
      sensor_positions y moved from 0.03 to 0.01 m for all seven sensors. Everything
      else is unchanged: x at +/-0.06 m, inner weights [-1, -0.75, -0.5, 0, 0.5, 0.75,
      1], base_speed 1.3, kp 5.0, ki 0.02, kd 0.8, last_direction. Iteration 6 is
      the reference, so this race isolates the row move. The candidate is valid: every
      y is within the -0.06 to 0.08 m limit, and the weights are antisymmetric and
      within +/-2. Iterations 1 to 6 all held max_error at 0.053 to 0.064 m whatever
      the speed or gain (iterations 1 to 3, 5 and 6), which points to a geometry or
      lag cause rather than steering gain. Iteration 4 showed that the weights, not
      the wider x spread, cost finishes, so this candidate keeps the weights that
      gave iteration 5 and 6 their line-loss result of 0. Approval is for telemetry
      and a clean test of the lag hypothesis, not a performance claim.


      What to change after the race, depending on what it shows:

      - If line_loss stays at 0, oval finishes hold at 9 of 20 or more, and max_error
      falls below about 0.055 m on the s-bend and slalom, keep y at 0.01 m and move
      on to small tuning of kd or base_speed.

      - If finishes drop to 0 while line_loss stays at 0, revert y to 0.03 m (iteration
      6 as raced) and test base_speed 1.2 alone, since the row move hurt finishes.

      - If steering_oscillation rises above about 0.4 while max_error is below 0.05
      m, lower kd from 0.8 to about 0.5 with y at 0.01 m, since a row closer to the
      axle changes the sensor-to-line reading more abruptly on bends.


      ### Requested changes


      - Keep the iteration 6 design and change only sensor_positions y from 0.03 to
      0.01 m for all seven sensors. Evidence: max_error has stayed at 0.053 to 0.064
      m across iterations 1 to 6 whatever the speed or gain, and sensors at y = 0.03
      m sit 3 cm ahead of the axle, so lag is a plausible cause.

      - If the race shows line_loss at 0 and max_error below about 0.055 m with finishes
      at 9 of 20 or more: keep y at 0.01 m and next test kd 0.5 only if steering_oscillation
      exceeds about 0.4. Evidence: iteration 6 oscillation was 0.32 on the oval and
      iteration 0 with kd 0.3 gave 0.07 to 0.16.

      - If finishes fall to 0 with line_loss still 0: revert y to 0.03 m and test
      base_speed 1.2 alone. Evidence: iteration 4 showed finishes can be lost when
      sensor geometry changes, and iteration 2 showed speed cuts alone did not fix
      drift, so this is a check on the speed side only.


