map:
  id: race-114-opt-eval
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: kd 0.8 restored, speed
    notes: 'Reverts kd to 0.8 after kd 0.5 collapsed oval finishes from 9 to 0 (iteration
      9, score 56.8). Raises base_speed from 1.3 to 1.4 on the best raced design (255.7)
      to improve the completion-time term; all other values are unchanged.


      ### Rationale


      Evidence. Iteration 9 (kd 0.5 on the iteration 6 design) collapsed to 56.8.
      Oval finishes fell from 9 of 20 to 0, progress fell from 0.90 to 0.12, and every
      run went off track. Oscillation dropped to 0.08, so lower damping did not add
      jitter but let the robot overshoot off the tape. The Evaluator''s stated rule
      was to return kd to 0.8 if finishes fell below 9 of 20, and that rule applies
      here. The approval text for kd 0.5 was written before the race and does not
      reflect this result, so I do not follow it. Iteration 8 (ki 0.15) left max_error
      unchanged, so ki stays at 0.02. Iteration 7 (y = 0.01 m) lowered the score,
      so the row stays at y = 0.03 m.


      Change: restore kd to 0.8 on the iteration 6 design (best raced, 255.7, 9 of
      20 oval finishes, mean finish time 1.89 s). Also raise base_speed from 1.3 to
      1.4 and change nothing else. Speed is the only lever left for the completion-time
      term (60 points, scaled by completion_time/3). Iteration 5 to 6 showed that
      raising speed from 1.2 to 1.3 lifted finishes, so a further step may help, but
      the drift could return.


      Expected result: oval finishes at or above 9 of 20, mean finish time below 1.89
      s, and a small gain in the time term. Hypotheses: (a) the oval finish time falls
      to about 1.75 to 1.8 s without losing finishes; (b) line_loss stays at 0. Risk:
      speed 1.4 pushes max_error past 0.06 m and cuts finishes. If that happens, return
      base_speed to 1.3 on the iteration 6 design, which is the best measured state.
      Measurements requested: completion, progress, completion time, rms and max error,
      line-loss events, steering oscillation, control effort, controller errors and
      noise robustness.


      - [Open this output](iteration-10/entity0/versions/797996cc87d54ab9a02a97b6b8111cfa/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-26a377b6943b748a/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-1b9f220d0910bfea/payload.json)'
  - id: entityR1
    label: Approve speed 1.4 test
    notes: 'Approved the iteration 6 design with base_speed raised to 1.4 and kd restored
      to 0.8, since speed steps 1.2 to 1.3 lifted finishes and kd 0.5 and the row
      move both lost score. The feedback sets a fallback to base_speed 1.3 if finishes
      fall below 9 of 20.


      ### Feedback


      Written before this candidate has raced, so it states no result for it. The
      candidate is the iteration 6 design (best raced, 255.7, 9 of 20 oval finishes)
      with base_speed raised from 1.3 to 1.4 and kd restored to 0.8. Geometry (7 sensors
      at y = 0.03 m, x = ±0.06 m), the inner weights, kp 5.0, ki 0.02 and last_direction
      are unchanged. The candidate is valid: every field is inside its contract limit.
      Evidence: iteration 6 showed that speed 1.2 to 1.3 lifted oval finishes from
      2 to 9 of 20 with line_loss at 0 (iteration 5 to 6). Iteration 9 showed kd 0.5
      is not an improvement to pursue, so restoring kd 0.8 is correct. Iterations
      7 and 8 showed that the row move and ki 0.15 did not help, so they are not carried
      forward. The main risk is that speed 1.4 pushes max_error past 0.06 m and cuts
      finishes, as iteration 2 showed the drift is sensitive at the speed margin.
      The race is the cheapest way to test this, and one iteration remains after this,
      so approve now for telemetry on the speed step.


      What to do after the race, depending on what it shows:

      - If line_loss stays at 0 and oval finishes hold at 9 of 20 or more with a lower
      oval mean finish time than 1.89 s, keep base_speed 1.4 as the candidate for
      the final iteration.

      - If finishes fall below 9 of 20 or line_loss rises above 0, return base_speed
      to 1.3 on the iteration 6 design, which is the best measured state.

      - Do not change ki, the sensor row, or kd in the next iteration; those were
      tested and did not help.


      ### Requested changes


      - If the race keeps line_loss at 0 and oval finishes at 9 of 20 or more with
      completion_time below the 1.89 s mean: keep base_speed 1.4 and kd 0.8 for the
      final iteration. Evidence: iteration 6 (base 1.3) gave 9 of 20 finishes and
      speed 1.2 to 1.3 lifted finishes from 2 to 9.

      - If finishes fall below 9 of 20 or line_loss rises above 0: return base_speed
      to 1.3 on the iteration 6 design (kd 0.8, ki 0.02, y 0.03 m). Evidence: iteration
      6 is the best raced state at 255.7, and iteration 2 showed that the drift is
      speed-sensitive.

      - Do not raise ki or move the sensor row to y 0.01 m again. Evidence: ki 0.15
      (iteration 8) left oval max_error at 0.0536 m against 0.0535 m, and y 0.01 m
      (iteration 7) dropped the score to 179.1.


      - [Open this output](iteration-10/entityR1/versions/29284d021f484f688daebc52f4d674b5/payload.json)

