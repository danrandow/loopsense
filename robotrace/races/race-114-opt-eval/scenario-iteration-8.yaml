map:
  id: race-114-opt-eval
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Iter 6 + ki 0.15 test
    notes: 'Reverts the y = 0.01 m row move, which cut oval finishes from 9 to 5 (score
      179.1), and returns to the best raced design (255.7). Raises ki from 0.02 to
      0.15 to test whether the persistent max_error of about 0.06 m is a steady motor-mismatch
      bias.


      ### Rationale


      Evidence. Iteration 7 (the y = 0.01 m row) scored 179.1, below iteration 6 (255.7).
      Oval finishes fell from 9 of 20 to 5 of 20, and the oval max_error rose from
      0.0535 to 0.0612 m. The s-bend and slalom max_error stayed at 0.063 and 0.0635
      m, so the row move did not reduce edge exits. The lag hypothesis is not supported,
      and I revert the row to y = 0.03 m. Line loss stayed at 0 in iteration 7, so
      the sensing array itself is fine.


      The off-track limit is max(0.06, 0.0125 + body_width/4). Even at body_width
      0.18 the limit is 0.0575, so it stays at 0.06 m and body width cannot relax
      it. Max_error sits at 0.060 to 0.064 m across every design, whatever the speed
      or kp. That points to a steady bias the controller does not remove, such as
      the fixed left/right motor mismatch in the contract. Integral action is the
      only term that can cancel a constant bias, and ki has stayed at 0.02 since iteration
      1.


      Change: restore the iteration 6 design (y = 0.03 m, 7 sensors at x = ±0.06 m,
      weights [-1, -0.75, -0.5, 0, 0.5, 0.75, 1], base_speed 1.3, kp 5.0, kd 0.8,
      last_direction) and raise ki from 0.02 to 0.15. This is one variable against
      the best raced design. The integral is capped at ±2, so the change limits windup
      while it works on a constant offset.


      Expected result: oval finishes at or above 9 of 20, and oval and s-bend max_error
      down toward 0.05 m if a bias is present. If the score falls and max_error does
      not move, the bias hypothesis is wrong and the next test is base_speed 1.2 or
      kd 0.5 on the iteration 6 design.


      Hypotheses to check: (a) max_error includes a steady offset that ki can remove;
      (b) steering_oscillation stays near 0.32 on the oval, so the higher ki does
      not add jitter. Measurements requested: completion, progress, completion time,
      rms and max error, line-loss events, steering oscillation, control effort, controller
      errors and noise robustness.


      - [Open this output](iteration-8/entity0/versions/2182d85f76e449bb9503ee2127b181e0/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-e7cdece8c69ee79b/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-585493ff653cf873/payload.json)'
  - id: entityR1
    label: Approve ki 0.15 test
    notes: 'Approved a single-variable test: the best raced design (iteration 6, 255.7)
      with ki raised from 0.02 to 0.15 to test a steady-offset hypothesis. Revert
      the y = 0.01 m row move, which lowered the score in iteration 7; the max_error
      range cited in the rationale is weaker than stated (oval 0.0535 m).


      ### Feedback


      Written before this candidate races, so it states no result for it. The candidate
      is the iteration 6 design (best raced so far, 255.7) with one change: ki raised
      from 0.02 to 0.15. Geometry (7 sensors at y = 0.03 m, x = ±0.06 m, weights [-1,
      -0.75, -0.5, 0, 0.5, 0.75, 1]), base_speed 1.3, kp 5.0, kd 0.8 and last_direction
      are unchanged. The candidate is valid: ki is within 0 to 5, and the integral
      cap of ±2 limits windup. Iteration 7 showed that moving the row to y = 0.01
      m alone lowered the score (255.7 to 179.1), so that move is reverted here. Iteration
      6 is the reference, so this race isolates ki.


      Two points in the rationale need care. First, the 0.060 to 0.064 m max_error
      range it cites is not uniform: iteration 6 oval max_error was 0.0535 m, so the
      ''steady bias on every track'' claim is weaker than stated. Second, a ki of
      0.15 gives at most about 0.3 of turn from the integral, against kp*signal of
      up to 5, so the effect may be small; it could still push the robot into integral
      windup on long one-sided bends. The race is the best test of the bias hypothesis,
      and approval is for telemetry, not a performance claim.


      What to do after the race, depending on what it shows:

      - If oval finishes stay at 9 of 20 or more with max_error at or below 0.0535
      m on the oval and s-bend, keep ki 0.15 and test base_speed 1.4 alone to recover
      completion_time.

      - If the score falls and max_error does not move, the bias hypothesis is wrong.
      Return ki to 0.02 and test kd 0.5 or base_speed 1.2 on the iteration 6 design.

      - If steering_oscillation rises above about 0.4 on the oval, reduce ki to 0.08
      before touching kp or kd, since the integral is the new term.


      ### Requested changes


      - Keep the iteration 6 design and change only ki, from 0.02 to 0.15. Evidence:
      max_error stayed at 0.0535 to 0.064 m across iterations 1 to 6, and the steady-offset
      hypothesis needs an integral term to test it.

      - If the race keeps 9 of 20 or more oval finishes with max_error at or below
      0.0535 m and no line-loss events: keep ki 0.15 and test base_speed 1.4 alone.
      Evidence: iteration 6 (base 1.3) gave the best finishes and a mean oval finish
      time of 1.89 s, so speed is the next lever for the time term.

      - If the score falls with max_error unchanged, or steering_oscillation exceeds
      about 0.4 on the oval: return ki to 0.02 and test kd 0.5 on the iteration 6
      design. Evidence: iteration 0 with kd 0.3 gave low oscillation (0.07 to 0.16),
      and iteration 6 oscillation was 0.32.


      - [Open this output](iteration-8/entityR1/versions/55fdea419b6c44718790e9622d31fb72/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/2182d85f76e449bb9503ee2127b181e0/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-585493ff653cf873/payload.json)'
