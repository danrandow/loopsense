  entities:
  - id: entity0
    label: Refined sensors and gains
    notes: 'Kept sensor size and positions from last iteration to maintain coverage;
      reduced kp and increased kd to reduce oscillations and rms error; requested
      alternative line loss strategies to improve recovery on slalom track.


      ### Rationale


      The previous iteration increased sensor size to 0.016 m and widened sensor lateral
      positions to [-0.05, -0.025, 0, 0.025, 0.05], which improved line detection
      coverage and reduced line loss events on the oval and s-bend tracks but the
      slalom track still shows no finishes and high line loss events (0.45). Steering
      oscillation and rms error remain relatively high on the slalom track, indicating
      instability. Integration feedback recommends further increasing sensor size
      is not possible (already max 0.016), so we keep sensor size at 0.016 m and sensor
      positions as is to maintain coverage. To address oscillations and rms error,
      we reduce kp from previous values to 5.0 and increase kd to 4.0 to damp steering
      oscillations. We also request the integrator to try alternative line loss strategies
      (''search_right'' or ''last_direction'') if line loss events persist, as different
      strategies affect recovery success. Chassis dimensions and mass remain unchanged
      to preserve stability and off-track tolerance. We request detailed measurements
      including completion, progress, line_loss_events, rms_error, steering_oscillation,
      and completion_time to monitor improvements in stability and line recovery.
      The intent is to reduce line loss events and steering oscillations on the challenging
      slalom track, improving progress and completion rates without compromising performance
      on other tracks.


      - [Open this output](iteration-2/entity0/versions/37bb74cf09d346d1b8d7a0ed06082a3d/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-973ad97a77215407/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-ed3aac285dbd9b75/payload.json)'
