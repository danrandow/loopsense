map:
  id: race-40-c-randow-maps
  schema: v0.2
  scenario: Iteration 0
  inherits: base.yaml
  notes: Initial prepared state before either AI role or the simulator has acted.
dimensions:
  time_horizon: prepared
  iteration: '0'
overrides:
  entities:
  - id: entity0
    label: Initial balanced geometry
    notes: 'Proposed a 5-sensor layout with moderate sensor size and stable chassis
      dimensions to provide a robust sensing platform for the integrator, aiming to
      improve line detection and reduce line loss events.


      ### Rationale


      Starting with a balanced and robust sensor layout to maximize line detection
      and control signal quality. Chose 5 sensors spaced evenly across the front of
      the robot to cover the tape width well, with a sensor size of 0.012 m to balance
      resolution and coverage. Set wheel track to 0.14 m for stability and maneuverability,
      wheel radius to 0.035 m for a good speed-torque tradeoff, and body dimensions
      moderate to avoid off-track penalties while allowing room for sensors. Mass
      set to 0.8 kg as a moderate value to balance inertia and responsiveness. Intent
      is to provide the integrator a stable, well-sensed platform to develop a controller
      that can follow the line accurately and quickly. Expect improved line detection
      and reduced line loss events, leading to better progress and completion rates.


      - [Open this output](iteration-0/entity0/versions/1e6155fb513742ca9013bb805721fc21/payload.json)'
  - id: entity1
    label: Integrated controller for
    notes: 'Produced a PID controller with moderate base speed and sensor weights
      emphasizing outer sensors, plus active line loss recovery, based on the geometry
      and prior experience.


      ### Rationale


      The supplied geometry features a balanced 5-sensor array with moderate sensor
      size (0.012 m) and stable chassis dimensions, which should provide good line
      detection coverage and stable handling. To complement this, the controller uses
      a moderate base speed of 1.2 to balance speed and control, with PID gains tuned
      to provide responsive but stable steering: kp=10.0 for strong proportional correction,
      ki=0.5 to correct steady-state errors, and kd=2.0 to damp oscillations. Sensor
      weights are set symmetrically with stronger weights on the outer sensors to
      maximize steering signal sensitivity across the tape width. The line loss strategy
      is set to ''search_left'' to actively steer the robot back onto the line when
      lost, which is generally more effective than stopping or last_direction in previous
      races. The observation request includes all key metrics to monitor completion,
      progress, line loss events, and error metrics for future tuning.


      - [Open this output](iteration-0/entity1/versions/f1659f4770614fc88eb03de9c03acfd9/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/1e6155fb513742ca9013bb805721fc21/payload.json)'
  - id: entityR1
    label: Feedback for geometry
    notes: 'Provided conditional feedback to adjust sensor size, sensor positions,
      and PID gains depending on next race outcomes, grounded in earlier race evidence.


      ### Feedback


      Based on earlier races with similar sensor layouts and chassis dimensions, the
      controller needs to compensate for moderate sensor size and spacing by emphasizing
      outer sensors in weights and using a moderate base speed to avoid stalling or
      overshoot. If the next race shows high line loss events or poor progress, consider
      increasing sensor size to 0.016 m to improve line detection coverage or adjusting
      sensor positions to cover a wider lateral range. If the robot oscillates or
      has high rms error, reduce kp or increase kd to improve stability. If the robot
      stalls or completes slowly, increase base_speed or reduce ki to avoid integral
      windup.


      ### Requested changes


      - sensor_size to 0.016 to improve line detection coverage if line loss events
      are high (evidence: previous races with larger sensors showed fewer line losses)

      - adjust sensor_positions x-coordinates to [-0.05, -0.025, 0, 0.025, 0.05] to
      widen sensor coverage if progress is low (evidence: wider sensor spread improved
      progress in earlier tests)

      - reduce kp to 7.0 and increase kd to 3.0 if rms_error or oscillations are high
      (evidence: higher kd damped oscillations in prior runs)


      - [Open this output](iteration-0/entityR1/versions/f1659f4770614fc88eb03de9c03acfd9/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/1e6155fb513742ca9013bb805721fc21/payload.json)'
  actions:
  - id: action0
  - id: action1
measurements: {}
