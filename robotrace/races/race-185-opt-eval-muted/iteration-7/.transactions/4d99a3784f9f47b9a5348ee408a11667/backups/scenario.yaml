map:
  id: race-185-opt-eval-muted
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Speed 1.0→1.1 on best
    notes: 'Keeps iteration 6''s geometry and gains, which finished all 60 development
      trials (score 929.4), and raises base_speed to 1.1 to recover the oval and s-bend
      time lost to the lighter body. The slalom''s max_error margin (0.02 vs a 0.06
      limit) supports the change.


      ### Rationale


      Evidence: iteration 6 (score 929.4, the best so far) finishes all 60 development
      trials. Per track, oval finished 20/20 at 2.36 s, s-bend 20/20 at 2.45 s, and
      slalom 20/20 at 2.66 s (previously 0/20 to 1/20). The slalom max_error is 0.0215
      against an off-track limit of 0.06 m, so there is real margin. The score is
      now close to its ceiling for this geometry: about 500 for completion, 250 for
      progress, roughly 105 from line loss (1 event), roughly 65 from rms_error (about
      0.01), and about 12 from time (2.4 s). The remaining levers are small: time
      (each 0.1 s is about 2 points), and line-loss events (one per run, worth up
      to about 15 points). Lighter mass and shorter body fixed the slalom but made
      the oval slower (2.10 s to 2.36 s), so the speed setting is the cheapest lever
      to recover time. Change: base_speed 1.0 to 1.1, a 10% increase. The slalom has
      about 0.04 m of margin and the oval and s-bend have time budget, so this should
      cut roughly 0.1 to 0.15 s per track, worth about 2 to 3 points. Everything else
      is unchanged (geometry, kp 4.5, ki 0.02, kd 1.0, sensor layout, line_loss) so
      the effect of speed is isolated. Expected result: score about 930 to 935 with
      all tracks still finishing, and slalom max_error still well below 0.06. Risk:
      higher speed may push slalom max_error up; if slalom finishes fall below 20/20,
      revert to 1.0. Hypotheses: (1) the single line-loss event per run probably occurs
      at the start or the finish when the sensors leave the tape, so it may not be
      fixable with gains; (2) if oscillation stays low, kd could drop slightly to
      reduce lag; (3) rms_error on the s-bend (0.016) is the main remaining tracking
      term. Measurements requested: completion, completion_time and progress to confirm
      the speed gain, line_loss_events to see when the loss occurs, and max_error
      and steering_oscillation to check slalom margin.


      - [Open this output](iteration-7/entity0/versions/df806a7e613e41b5b8595c80027d1feb/payload.json)

      - Based on: [entityR2A](iteration-7/entityR2A/versions/carried-422467f122d0d713/payload.json)'
  - id: entityR1
    label: 'Approve: lighter, shorter'
    notes: 'Approved unchanged: wheel_track restored to 0.12, mass 0.8 to 0.5 kg and
      body_length 0.16 to 0.12 m to cut yaw inertia about 45 percent. Iterations 3
      to 5 plateaued near 720 with the slalom the only failing track, and the narrower
      track in iteration 5 did not help, so this is the next untested lever with the
      rest of the best design held fixed.


      ### Feedback


      Approved for racing, unchanged. The candidate restores wheel_track to 0.12 and
      changes mass 0.8 to 0.5 kg and body_length 0.16 to 0.12 m, which lowers yaw
      inertia by the stated formula. The other fields (kp 4.5, ki 0.02, kd 1.0, base_speed
      1.0, the sensor layout at y 0.08 with x ±0.05, sensor_size 0.016, line_loss
      last_direction) match the best-supported settings. Iteration 3 (724.5) and iteration
      4 (719.4) were near-identical, and iteration 5 showed that narrowing wheel_track
      to 0.10 did not help the slalom (progress 0.68 against about 0.67) and cost
      one s-bend finish. So the wheel_track hypothesis is already settled, and this
      candidate tests the inertia hypothesis on a clean base. Nothing is obviously
      broken: all values are inside the contract ranges, and the iteration 5 oval
      at speed 1.0 (2.10 s) leaves time margin. Its main untested risk is traction
      loss from the lighter mass, which the race will show. Read the race in this
      order: slalom progress and completions, then completion_time and completion
      on the oval and s-bend, then line_loss_events and steering_oscillation. Decide
      the next step from those numbers.


      ### Requested changes


      - If the slalom still ends off_track with progress below 0.75 while the oval
      and s-bend finish under 2.8 s, try base_speed 0.9 with the inertia change kept.
      Iteration 3 to 5 show slalom progress is stuck near 0.63 to 0.68 at speeds 1.0
      to 1.1, so speed is the lever not yet isolated.

      - If steering_oscillation rises above about 0.4 (iteration 3 slalom 0.33, s-bend
      0.20 to 0.25), raise kd from 1.0 to 1.2 with kp kept at 4.5, rather than changing
      kp. Iteration 4 showed raising kp to 5.0 added oscillation on the s-bend without
      a slalom gain.

      - If the oval or s-bend stops finishing, line_loss_events rise above the iteration
      3 level (about 0.9 to 1.0 per run), or the robot slips at the start, restore
      mass to 0.8 and keep body_length 0.12. This isolates whether the mass drop,
      not the length change, caused the problem.


      - [Open this output](iteration-6/entityR1/versions/8f1cb2d660e74903865d2ed3dd2b947a/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/449c9f9fe7d14139a6b72b15def5d132/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-c81aaaaccef20767/payload.json)'
