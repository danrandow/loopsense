  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Speed 1.2 for time gain
    notes: 'Keeps the iteration 7 design (score 929.8, all 60 trials finished) and
      raises base_speed 1.1 to 1.2 to cut completion time. Slalom max_error had about
      0.04 m of margin, so the risk is limited, and the revert trigger is set at 1.1
      if slalom finishes drop.


      ### Rationale


      Evidence: iteration 7 (score 929.76, best so far) finished 60/60 trials. Oval
      took 2.39 s, s-bend 2.44 s and slalom 2.63 s. Slalom max_error is 0.023 against
      an off-track limit of 0.06 m, so there is margin. The score is near its ceiling:
      500 for completion, 250 for progress, about 105 from one line-loss event per
      run, about 65 from rms_error (about 0.011), and about 12 from time. Time is
      the cheapest remaining lever: each 0.1 s is worth about 2 points. Going from
      speed 1.0 to 1.1 gave only +0.4 points, so the trade is small but positive.
      Change: base_speed 1.1 to 1.2. I expect oval and s-bend to finish near 2.2 s
      and the slalom near 2.45 s, with slalom max_error rising only a few thousandths
      (about 0.03). That should add roughly 2 to 4 points. Everything else is unchanged
      (geometry, kp 4.5, ki 0.02, kd 1.0, sensor layout and weights, line_loss), so
      the effect of speed is isolated. Risk: slalom off-track exits at the higher
      speed. If slalom finishes fall below 20/20 or max_error exceeds about 0.04,
      revert to 1.1. Hypotheses: (1) the single line-loss event per run probably occurs
      at the start or finish when sensors leave the tape, so gains may not remove
      it; (2) s-bend rms (0.016) is the largest tracking term, and a slightly higher
      kd could reduce it if oscillation stays low. Measurements requested: completion,
      completion_time and progress to confirm the speed gain; line_loss_events to
      see whether it is a start or finish event; max_error and steering_oscillation
      to check slalom margin; rms_error to track the s-bend term.


      - [Open this output](iteration-8/entity0/versions/ec0c615a5fd544cdb96acc97c9aae447/payload.json)

      - Based on: [entityR2A](iteration-8/entityR2A/versions/carried-00db802b3d301c15/payload.json)'
  - id: entityR1
    label: 'Approve: speed 1.0 to 1.1'
    notes: 'Approved the iteration 6 design (best raced, 929.4, all tracks 20/20)
      with base_speed raised 1.0 to 1.1 to recover about 0.1 s per track. Slalom max_error
      margin (0.0215 against 0.06) and the oval/s-bend time budget support a small,
      reversible change; the feedback sets a revert rule if the slalom slips.


      ### Feedback


      Judged from earlier races only. The candidate is iteration 6''s design (score
      929.37, the best raced so far) with one change: base_speed 1.0 to 1.1. Everything
      else is unchanged: light body (mass 0.5, body_length 0.12), wheel_track 0.12,
      kp 4.5, ki 0.02, kd 1.0, sensors at y 0.08 with x spread ±0.05, sensor_size
      0.016, line_loss last_direction. All values are inside the contract ranges.


      The evidence: in iteration 6, all three tracks finished 20/20. Oval took 2.36
      s, s-bend 2.45 s and slalom 2.66 s. Slalom max_error was 0.0215 against the
      0.06 m off-track limit, so there is margin. Iteration 6 also showed that lighter
      mass and a shorter body fixed the slalom that failed in iterations 3 to 5 (mean
      progress about 0.63 to 0.68, 19/20 off-track). Iteration 5 showed that oval
      time scales with speed (2.14 s at 1.1 with the heavier body, 2.10 s at 1.0 with
      wheel_track 0.10). So a 10% speed increase should save roughly 0.1 to 0.15 s
      per track, worth about 2 to 3 points. That is a small gain on a score already
      near its ceiling. The main risk is that the slalom''s sharp bends at higher
      speed push max_error toward the limit. Iteration 3 at speed 1.1 failed the slalom,
      but it was on the heavier body, so that evidence is only partly relevant.


      What to do after the race: if slalom completion falls below 20/20 or slalom
      max_error rises well above about 0.03, revert base_speed to 1.0, since the final
      unseen track is a different shape and robustness matters more than 2 points.
      If all tracks finish and completion_time falls by about 0.1 s, keep 1.1. The
      next lever is steering_oscillation: if it stays low (about 0.2 to 0.27), kd
      could drop slightly (for example 1.0 to 0.9) to reduce lag, one change at a
      time. Line-loss events (one per run, about 15 points at most) are not addressed
      by gains here, so do not spend runs on them unless a later race shows the loss
      is avoidable.


      ### Requested changes


      - If slalom completion is below 20/20 or slalom max_error rises above about
      0.03 (iteration 6 value 0.0215), revert base_speed to 1.0, because the slalom
      is the only track where speed has been shown to matter.

      - If all tracks finish and completion_time drops by about 0.1 s per track with
      max_error stable, keep base_speed 1.1 and test kd 0.9 with kp 4.5, since iteration
      6 steering_oscillation (0.17 to 0.27) suggests there is room to reduce damping
      lag.

      - Do not change the sensor layout or line_loss on the next iteration: sensor
      y is at its maximum 0.08, and the single line-loss event per run (iterations
      3 to 6) has not responded to any gain or geometry change.


      - [Open this output](iteration-7/entityR1/versions/4d99a3784f9f47b9a5348ee408a11667/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/df806a7e613e41b5b8595c80027d1feb/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-422467f122d0d713/payload.json)'
