map:
  id: race-185-opt-eval-muted
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Forward sensors, more
    notes: 'Moves sensors to y=0.08 for more bend lead, raises kd to 1.0 to damp corrections,
      and lowers base_speed to 1.1 to give steering margin on the slalom. Based on
      iteration 2 (score 625), where the slalom finished 0/20 and the s-bend 15/20,
      with the forward move from 0.05 to 0.07 having been the main gain.


      ### Rationale


      Evidence from the last race (iteration 2, score 625.2): the oval finished 20/20
      at 2.06 s, the s-bend finished 15/20 (5 off-track), and the slalom finished
      0/20, every failure off_track at progress about 0.36. max_error sits near the
      0.06 m off-track limit on the failing tracks. Steering oscillation is moderate
      (0.17 oval, 0.35 s-bend, 0.26 slalom) and control effort is high on the slalom
      (10.7), so the robot is correcting hard and still lagging through bends. The
      forward move from y=0.05 to y=0.07 helped (score 185 to 625), which suggests
      more sensing lead still pays off. Changes: (1) sensor y 0.07 -> 0.08, the maximum
      allowed, for the most lead time on bends. (2) kd 0.8 -> 1.0 to damp the faster
      corrections the extra lead produces. (3) base_speed 1.2 -> 1.1 so the robot
      has more steering margin on tight bends. The oval (2.06 s at 1.2) should still
      finish near 2.25 s and the s-bend near 2.6 s, both under 3 s. kp 4.5, ki 0.02,
      sensor x spread, weights, geometry and line_loss are unchanged so the effect
      of these three changes is isolated. Expected result: slalom completions begin
      to appear and s-bend finishes rise toward 18-20/20, with steering_oscillation
      staying below about 0.4. Risk: base_speed 1.1 costs time on the oval and s-bend,
      and if kd 1.0 causes sluggish correction the slalom may still leave the line.
      Hypotheses for next iteration: if the slalom still exits at low progress, the
      bottleneck is steering authority and kp should rise to about 5; if oscillation
      exceeds 0.4, kd is too high; if completion_time on the oval exceeds 2.5 s, base_speed
      should go back to about 1.2. Measurements requested: completion, progress and
      completion_time for the speed trade-off, max_error and line_loss_events for
      recovery, and steering_oscillation and control_effort for gain stability.


      - [Open this output](iteration-3/entity0/versions/6c096f3135b8472f901739e40ed97b49/payload.json)

      - Based on: [entityR2A](iteration-3/entityR2A/versions/carried-55c106d41e90ab43/payload.json)'
  - id: entityR1
    label: 'Approve: sensor y 0.08 +'
    notes: 'Approved for racing: a three-field step from the best raced design (iteration
      2, score 625.2) toward more sensing lead and damping, with the change isolated
      to sensor y, kd and base_speed. Iteration 2 telemetry (oval 20/20, s-bend 15/20,
      slalom 0/20, all failures off_track) and the forward-sensor gain from 185 to
      625 support it, and the candidate is at least as good as the best raced design.


      ### Feedback


      This candidate changes three things from the iteration 2 design (score 625.2,
      the best raced so far): sensor y 0.07 to 0.08 (the contract maximum), kd 0.8
      to 1.0, and base_speed 1.2 to 1.1. kp 4.5, ki 0.02, the sensor x spread, weights,
      wheel geometry, sensor_size and line_loss are unchanged, so the effect of these
      three changes is isolated. All values are inside the contract ranges. Iteration
      2 showed the oval finishing 20/20 at 2.06 s and the s-bend finishing 15/20,
      with every failure off_track. The slalom finished 0/20, with every run ending
      off_track at progress about 0.36. Iteration 1 to 2 showed that moving the sensors
      forward and widening the spread paid off (185 to 625), so more sensing lead
      is the direction to keep pushing. Iteration 2 also showed steering_oscillation
      of 0.35 on the s-bend and control_effort of 12.8, so the robot is correcting
      hard. The kd increase is meant to damp the stronger corrections that the extra
      lead produces. The base_speed reduction gives steering margin on tight bends.
      The cost is time: at 1.1 the oval should still finish under 3 s, but with less
      slack than at 1.2. I cannot judge the outcome from numbers, so this should be
      read from the race. Read these first: completion_time on the oval, whether the
      slalom produces any completions, max_error and line_loss_events on the slalom
      and s-bend, and steering_oscillation. If the slalom still leaves at low progress
      with max_error near 0.06, steering authority is the limit: raise kp to about
      5.0 before adding more lead, since sensor y is already at its maximum. If steering_oscillation
      exceeds about 0.4, lower kd to about 0.8 before touching kp. If the oval completion_time
      exceeds 2.5 s, return base_speed toward 1.2.


      ### Requested changes


      - If the slalom still ends off_track at progress below 0.5 with max_error near
      0.06, raise kp from 4.5 to 5.0 and keep sensor y at 0.08, because the sensor
      position is already at its maximum (iteration 2 slalom progress 0.36).

      - If steering_oscillation rises above about 0.4 (iteration 2 s-bend was 0.35
      with kd 0.8), reduce kd from 1.0 to 0.8 before changing kp.

      - If the oval completion_time exceeds 2.5 s or the oval fails to finish, return
      base_speed to 1.2, the iteration 2 value that gave 2.06 s finishes on the oval.


      - [Open this output](iteration-3/entityR1/versions/5e5197067cf64862bd011acb511358e5/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/6c096f3135b8472f901739e40ed97b49/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-55c106d41e90ab43/payload.json)'
