map:
  id: race-185-opt-eval-muted
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Narrower track, slower
    notes: 'Narrows wheel_track 0.12 to 0.10 m for more yaw authority, trims kp to
      4.5 and base_speed to 1.0 to limit oscillation and slalom speed. Based on iteration
      4, where slalom progress stalled at about 0.63 despite higher kp, and oval/s-bend
      still finish with time to spare.


      ### Rationale


      Evidence: iteration 4 (719.4) and iteration 3 (724.5) are nearly identical.
      The oval (20/20 at about 2.15 s) and s-bend (20/20 at about 2.35 s) finish comfortably.
      The slalom is the bottleneck: 19/20 runs leave the track at mean progress about
      0.63, and steering_oscillation (0.31) and control_effort (16.5) are both high.
      Raising kp from 4.5 to 5.0 did not help the slalom (progress fell from 0.67
      to 0.63) and added oscillation, so simply adding gain has reached its limit.
      The sensor move from y=0.07 to y=0.08 and the kd rise to 1.0 both helped, so
      I keep them. Hypothesis: the robot lacks yaw authority per unit of controller
      output. The turn rate is the wheel speed difference divided by wheel_track,
      so a 0.12 m track is sluggish for the slalom''s sharp alternating bends. Change
      1: wheel_track 0.12 -> 0.10 m, which raises yaw response per PWM difference
      by about 20%. Change 2: kp 5.0 -> 4.5, so the effective gain (kp/wheel_track,
      about 45 versus 42 now) rises only modestly and the oscillation does not grow.
      Change 3: base_speed 1.1 -> 1.0, to cut the speed needed through the sharp slalom
      bends. The oval and s-bend have time budget (about 2.3 s and 2.6 s predicted,
      both under 3 s). Expected result: slalom progress above 0.8 with some completions,
      and oval/s-bend still completing. Risks: the narrower track may increase oscillation
      (watch steering_oscillation above about 0.4), and speed 1.0 may push the oval
      near 3 s. Next hypotheses: if oscillation rises, raise kd to about 1.3 rather
      than lowering kp; if the slalom still exits at low progress, reduce speed further
      to about 0.9; if the oval exceeds 2.7 s, speed is too low. Measurements requested:
      completion, progress and completion_time for the speed trade-off; max_error
      and line_loss_events for recovery; steering_oscillation and control_effort for
      gain stability.


      - [Open this output](iteration-5/entity0/versions/e6ee7db70009423dbb0f6999c42b8ccc/payload.json)

      - Based on: [entityR2A](iteration-5/entityR2A/versions/carried-39673357d4a8973f/payload.json)'
  - id: entityR1
    label: 'Stronger steering: kp 5.0'
    notes: 'Single change from the best raced design (iteration 3, score 724.5): kp
      4.5 to 5.0 to add steering authority on the slalom, where 19 of 20 runs left
      the track at progress 0.67. Approved because the change is small, isolated,
      and the iteration needs a race to produce telemetry.


      ### Feedback


      This candidate changes one field from the iteration 3 design (score 724.5, the
      best raced so far): kp 4.5 to 5.0. Sensor geometry, weights, ki 0.02, kd 1.0,
      base_speed 1.1 and line_loss are unchanged, so the effect of the gain change
      is isolated. All values are inside the contract ranges. Iteration 3 showed the
      oval (20/20, 2.14 s) and s-bend (20/20, 2.30 s) finishing comfortably under
      3 s. The slalom is the bottleneck: 19 of 20 trials ended off_track at mean progress
      0.67, with control_effort 15.2 and steering_oscillation 0.33. That points to
      limited steering authority on the sharp alternating bends, since sensor y is
      already at its contract maximum of 0.08. Raising kp is the next step that the
      evidence supports, and it is a small step. I cannot state how it will perform.
      Read the race as follows. If the slalom completes more often or progress rises
      above 0.8, keep kp near 5.0 and consider a small base_speed reduction only if
      the slalom still exits at low progress. If steering_oscillation rises above
      about 0.4, raise kd slightly (for example 1.0 to 1.2) rather than lowering kp,
      because iteration 3 shows kd helped damp the faster corrections. If the oval
      or s-bend stops finishing, or the oval completion_time moves toward 2.5 s or
      more, return kp toward 4.5 before changing speed. Watch max_error and line_loss_events
      on the slalom to see whether recovery improves.


      ### Requested changes


      - If the slalom still ends off_track with progress below 0.8 and max_error near
      0.06, try base_speed 1.0 with kp 5.0 kept, because iteration 3 slalom progress
      of 0.67 at speed 1.1 suggests the bends are taken too fast.

      - If steering_oscillation rises above about 0.4 with kp 5.0 (iteration 3 value
      0.33), raise kd from 1.0 to 1.2 before lowering kp, since kd 0.8 to 1.0 in iterations
      2 to 3 came with better slalom and s-bend results.

      - If the oval or s-bend stops finishing or the oval completion_time exceeds
      2.5 s, return kp to 4.5, the iteration 3 value that finished 20/20 on both tracks.


      - [Open this output](iteration-4/entityR1/versions/ff7650e544024489903fa57954638ccd/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/95798c3255344a288a6119a6b10b9769/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-b551839dc8b1688e/payload.json)'
