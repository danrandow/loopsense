  id: race-185-opt-eval-muted
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Narrower track, slower
    notes: 'Narrows wheel_track 0.12 to 0.10 m for more yaw authority, trims kp to
      4.5 and base_speed to 1.0 to limit oscillation and slalom speed. Based on iteration
      4, where slalom progress stalled at about 0.63 despite higher kp, and oval/s-bend
      still finish with time to spare.


      ### Rationale


      Evidence: iteration 4 (719.4) and iteration 3 (724.5) are nearly identical.
      The oval (20/20 at about 2.15 s) and s-bend (20/20 at about 2.35 s) finish comfortably.
      The slalom is the bottleneck: 19/20 runs leave the track at mean progress about
      0.63, and steering_oscillation (0.31) and control_effort (16.5) are both high.
      Raising kp from 4.5 to 5.0 did not help the slalom (progress fell from 0.67
      to 0.63) and added oscillation, so simply adding gain has reached its limit.
      The sensor move from y=0.07 to y=0.08 and the kd rise to 1.0 both helped, so
      I keep them. Hypothesis: the robot lacks yaw authority per unit of controller
      output. The turn rate is the wheel speed difference divided by wheel_track,
      so a 0.12 m track is sluggish for the slalom''s sharp alternating bends. Change
      1: wheel_track 0.12 -> 0.10 m, which raises yaw response per PWM difference
      by about 20%. Change 2: kp 5.0 -> 4.5, so the effective gain (kp/wheel_track,
      about 45 versus 42 now) rises only modestly and the oscillation does not grow.
      Change 3: base_speed 1.1 -> 1.0, to cut the speed needed through the sharp slalom
      bends. The oval and s-bend have time budget (about 2.3 s and 2.6 s predicted,
      both under 3 s). Expected result: slalom progress above 0.8 with some completions,
      and oval/s-bend still completing. Risks: the narrower track may increase oscillation
      (watch steering_oscillation above about 0.4), and speed 1.0 may push the oval
      near 3 s. Next hypotheses: if oscillation rises, raise kd to about 1.3 rather
      than lowering kp; if the slalom still exits at low progress, reduce speed further
      to about 0.9; if the oval exceeds 2.7 s, speed is too low. Measurements requested:
      completion, progress and completion_time for the speed trade-off; max_error
      and line_loss_events for recovery; steering_oscillation and control_effort for
      gain stability.


      - [Open this output](iteration-5/entity0/versions/e6ee7db70009423dbb0f6999c42b8ccc/payload.json)

      - Based on: [entityR2A](iteration-5/entityR2A/versions/carried-39673357d4a8973f/payload.json)'
  - id: entityR1
    label: Narrow track, slower
    notes: 'Approved for the race: wheel_track 0.12 to 0.10 for more yaw per PWM difference,
      kp 5.0 back to 4.5 because iteration 4 showed kp gains had stalled, and base_speed
      1.1 to 1.0 for slalom bend margin. The feedback gives the follow-up changes
      to try (kd 1.2, wheel_track 0.11, speed 1.1) depending on what the race shows.


      ### Feedback


      This candidate changes three fields from iteration 3 (score 724.5, best raced
      so far): wheel_track 0.12 to 0.10, kp 5.0 to 4.5, and base_speed 1.1 to 1.0.
      Sensor geometry, weights, ki 0.02, kd 1.0, sensor_size and line_loss are unchanged.
      All values are inside the contract ranges. The sign convention and weights match
      every earlier design.


      The evidence is that the oval (20/20, 2.14 s, iteration 3) and s-bend (20/20,
      2.30 s) finish with time to spare, while the slalom is the bottleneck: 19 of
      20 runs leave the track at mean progress 0.67 in iteration 3 and 0.63 in iteration
      4. Iteration 4 showed that raising kp from 4.5 to 5.0 did not help the slalom
      (progress fell from 0.67 to 0.63) and raised steering_oscillation (0.33 to 0.31
      slalom, 0.20 to 0.25 s-bend), so more kp alone has reached its limit. Iteration
      3 showed that moving sensors forward to y 0.08 and raising kd to 1.0 both helped
      (625 to 724), so those stay.


      The hypothesis is that yaw authority per unit of PWM difference is the limit.
      The contract''s physics makes turn rate proportional to the wheel speed difference
      divided by wheel_track, so a narrower track should give more yaw per control
      output. Reducing kp to 4.5 keeps the oscillation risk down while that change
      takes effect. Lowering base_speed to 1.0 gives the slalom bends more margin.
      The cost is time. Scaling from iteration 3''s oval (2.14 s at speed 1.1) suggests
      roughly 2.4 s at speed 1.0, and the s-bend roughly 2.6 s, so both should stay
      under 3 s.


      Three fields change at once, so if the result is mixed the cause is harder to
      isolate. Read the race in this order: completion and progress on the oval and
      s-bend (is time still under 3 s?), then slalom progress and max_error (does
      the bend exit improve?), then steering_oscillation (is the narrower track causing
      jitter?). Decide next steps from those measurements. This candidate is a reasonable
      test of the yaw-authority hypothesis and is not obviously broken, so it should
      race now.


      ### Requested changes


      - If the slalom still ends off_track with progress below 0.8 while the oval
      and s-bend still finish under 3 s, raise kd from 1.0 to 1.2 with wheel_track
      0.10 and base_speed 1.0 kept. Iteration 3 showed kd 0.8 to 1.0 gave better slalom
      and s-bend results, and kd damps the stronger corrections a narrower track produces.

      - If steering_oscillation rises above about 0.4 (iteration 3 slalom 0.33, s-bend
      0.20 to 0.25), set wheel_track to 0.11 as a midpoint between 0.10 and 0.12 before
      lowering kp further, so the yaw gain rise is moderated rather than removed.

      - If the oval or s-bend stops finishing, or completion_time on either exceeds
      2.8 s, return base_speed to 1.1 with wheel_track 0.10 kept, because iteration
      3 at speed 1.1 finished both tracks 20/20.


      - [Open this output](iteration-5/entityR1/versions/f08f6dd925a54a16aa0247c37cab0c50/payload.json)

