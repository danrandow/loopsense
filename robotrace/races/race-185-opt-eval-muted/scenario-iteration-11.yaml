  entities:
  - id: entity0
    label: Iter 7 design, final
    notes: 'Resubmits the best verified design (iteration 7, score 929.76, 60/60 finishes),
      with ki reverted to 0.02 after iteration 10 showed ki 0.10 was slightly worse.
      Speed 1.1 is the safe limit, since 1.2 caused slalom off-track exits.


      ### Rationale


      Final iteration. The best verified design is iteration 7 (score 929.76, 60/60
      finishes). Iteration 8 (base_speed 1.2) lost 2 of 20 slalom runs to off-track
      exits, so speed 1.1 is the safe ceiling. Iteration 10 (ki 0.02 to 0.10) scored
      929.42, slightly below iteration 7, so the integral change did not help and
      is reverted. Iteration 9 was the same design as iteration 7 and confirmed its
      score. With one race left and an unseen final track, I choose the verified design
      over an untested change. Its margins are: slalom max_error 0.023 against the
      0.06 m off-track limit, and s-bend max_error 0.030. Expected result: about 930,
      all tracks finishing, one line-loss event per run. Hypotheses not acted on:
      the line-loss event occurs at the start or finish, so gains alone may not remove
      it; the s-bend rms_error of about 0.016 is the largest tracking term, and a
      small kd change could reduce it if oscillation stays low. Measurements requested:
      completion, progress and completion_time to confirm performance; line_loss_events
      to locate the loss; max_error and steering_oscillation for margin; rms_error
      for the s-bend term; controller_errors to confirm no exceptions.


      - [Open this output](iteration-11/entity0/versions/35ea2ee52d5344f0a45f4c3aa1c83429/payload.json)

      - Based on: [entityR2A](iteration-11/entityR2A/versions/carried-f9f56b5289c2976f/payload.json)'
  - id: entityR1
    label: Approve verified design
    notes: 'Approved the iteration 7/9 design unchanged, the best raced score (929.76,
      60/60 finishes). Iteration 8 showed speed 1.2 cost slalom finishes, and iteration
      10 showed ki 0.10 did not help, so the verified settings are kept for the final
      unseen track.


      ### Feedback


      Judged from earlier races only; this candidate has not raced. Its geometry and
      controller match iteration 7 and iteration 9 exactly (mass 0.5, body_length
      0.12, wheel_track 0.12, kp 4.5, ki 0.02, kd 1.0, base_speed 1.1, five sensors
      at y 0.08 with x spread of ±0.05, sensor_size 0.016, line_loss last_direction).
      Those settings finished 60/60 trials in both iterations, scoring 929.76, the
      best raced score. Iteration 8 showed that base_speed 1.2 cost slalom finishes
      (18/20, score 908.2), so 1.1 is the safe speed ceiling. Iteration 10 showed
      that ki 0.10 scored 929.42, slightly below the verified design, so the integral
      change is reverted. The candidate is valid and is the best-supported design
      available. Another revision round would cost two action runs for a change with
      a few points of expected gain at most, and the verified design is the safer
      choice for an unseen final track. Nothing in the candidate is obviously broken.
      Line-loss events (about one per run, worth up to roughly 100 points) have not
      responded to any gain, sensor or speed change in iterations 3 to 10, so this
      race will not be used to chase them.


      ### Requested changes


      - No change is requested because the candidate is approved unchanged. Read the
      race output in this order: completion and progress on all three tracks, then
      max_error and steering_oscillation on the slalom (iteration 7 values 0.0233
      and 0.25) to confirm margin, then line_loss_events and rms_error for the record.

      - If a future race is run with this design, keep base_speed at 1.1, because
      iteration 8 showed that 1.2 lost slalom finishes, and keep ki at 0.02, because
      iteration 10 showed that ki 0.10 did not help.

      - Do not change the sensor layout or line_loss in any follow-up, because sensor
      y is already at its maximum of 0.08 and the single line-loss event per run has
      not moved under any tested change.


      - [Open this output](iteration-11/entityR1/versions/7cbb99a17d52428cac4fc05021cae156/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/35ea2ee52d5344f0a45f4c3aa1c83429/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-f9f56b5289c2976f/payload.json)'
