overrides:
  entities:
  - id: entity0
    label: Iter 7 design resubmitted
    notes: 'Resubmits the best verified design (iteration 7, score 929.76, 60/60 finishes)
      unchanged, because raising base_speed to 1.2 in iteration 8 caused slalom off-track
      exits (score 908). Remaining levers, line-loss timing and s-bend rms, are listed
      as hypotheses for the next iteration.


      ### Rationale


      Evidence: iteration 7 (base_speed 1.1, kp 4.5, ki 0.02, kd 1.0, 5 sensors at
      y 0.08 with x spread ±0.05, sensor_size 0.016, wheel_track 0.12, mass 0.5, body_length
      0.12) finished 60/60 trials with a score of 929.76, the best so far. Oval, s-bend
      and slalom all completed 20/20 at 2.39, 2.44 and 2.63 s. Iteration 8 raised
      base_speed to 1.2 and the slalom fell to 18/20 with 2 off-track exits (score
      908), so 1.2 is past the safe limit. Iteration 6 at speed 1.0 scored 929.37,
      so the speed gain between them is small. The score is close to its ceiling for
      this design: about 500 for completion, 250 for progress, about 105 from one
      line-loss event, about 65 from rms_error (about 0.011), and about 12 from time.
      Change: none to the design. I resubmit iteration 7 unchanged, because it is
      the best verified candidate and the one remaining lever (speed) is shown to
      be unsafe above 1.1. Expected result: about 930 with all tracks finishing and
      slalom max_error near 0.023, well inside the 0.06 m off-track limit. Hypotheses
      for next iteration, not acted on now: (1) the single line-loss event per run
      probably happens at the start or finish when the sensors leave the tape, so
      gains may not remove it; (2) the s-bend rms_error (0.016) is the largest tracking
      term, and a small kd increase might reduce it if oscillation stays low. Measurements
      requested: completion, progress and completion_time to confirm the design is
      unchanged in performance; line_loss_events; max_error and steering_oscillation
      for slalom margin; rms_error for the s-bend term; controller_errors to confirm
      no exceptions.


      - [Open this output](iteration-9/entity0/versions/5c1fc0c03b6d4293b5200986f4414190/payload.json)

      - Based on: [entityR2A](iteration-9/entityR2A/versions/carried-0066496eebf6c62d/payload.json)'
  - id: entityR1
    label: Approve speed 1.2 test
    notes: 'Approved the iteration 7 design with base_speed raised from 1.1 to 1.2,
      unchanged. Iteration 7 finished 60/60 with slalom max_error 0.0233, which leaves
      margin under the 0.06 m limit, so the expected gain (2 to 4 points) is worth
      the race. The feedback sets a revert-to-1.1 trigger if slalom completion drops.


      ### Feedback


      Judged from earlier races and the candidate''s contents only. This candidate
      is iteration 7''s design (score 929.76, the best raced so far) with one change:
      base_speed 1.1 to 1.2. Everything else is unchanged: light body (mass 0.5, body_length
      0.12), wheel_track 0.12, kp 4.5, ki 0.02, kd 1.0, sensors at y 0.08 with x spread
      of ±0.05, sensor_size 0.016, line_loss last_direction. All values are inside
      the contract ranges.


      Evidence: iteration 7 finished 60/60 trials at base_speed 1.1 (oval 2.39 s,
      s-bend 2.44 s, slalom 2.63 s). Slalom max_error rose from 0.0215 at speed 1.0
      (iteration 6) to 0.0233 at 1.1, about 0.002 per 0.1 of speed. That trend leaves
      room below the 0.06 m off-track limit at 1.2. Iteration 2 failed the slalom
      at speed 1.2, but on the heavier body with lower kd and sensors further back,
      so it is only weakly relevant. The expected gain is small, about 2 to 4 points,
      from roughly 0.1 s per track. The main risk is slalom off-track exits, which
      would cost far more than the gain. Approval is justified because the margin
      is adequate and the race will show the real effect of speed.


      After the race, read slalom completion and max_error first, then completion_time.
      If slalom completion falls below 20/20, or slalom max_error passes about 0.03,
      the next design should return base_speed to 1.1, the best-supported value. Line_loss_events
      (one per run, worth up to about 100 points) have not moved under any gain, sensor
      or speed change, so the next gain or geometry test should not be spent on them
      unless the race shows when the loss occurs.


      ### Requested changes


      - If slalom completion is below 20/20 or slalom max_error exceeds about 0.03,
      revert base_speed to 1.1, since iteration 7 finished 20/20 on all tracks at
      that speed.

      - If all tracks finish and completion_time drops by about 0.1 s per track with
      max_error stable, keep base_speed 1.2 and test kd 0.9 with kp 4.5, because steering_oscillation
      (0.17 to 0.27 in iterations 6 and 7) leaves room to reduce damping lag.

      - Do not change the sensor layout or line_loss on the next iteration: sensor
      y is at its maximum of 0.08, and the single line-loss event per run has not
      responded to any gain or geometry change in iterations 3 to 7.


      - [Open this output](iteration-8/entityR1/versions/0ea8438a6ab54d1dbf441686ed66999e/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/ec0c615a5fd544cdb96acc97c9aae447/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-00db802b3d301c15/payload.json)'
