map:
  id: race-202-randow-maps-muted
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Heavier mass test (1.0kg)
    notes: 'Single-variable test of mass on the best design (iteration 3, 69.18):
      0.8 kg raised to 1.0 kg with everything else unchanged. The 0.6 kg run fell
      14 points, so the optimum mass is probably at or above 0.8 kg, and this checks
      the upward direction.


      ### Rationale


      Scores by iteration on the same base design: 60 mm row, 0.12 m track, 0.8 kg
      gave 65.96. Moving the row to 40 mm gave 52.25, and 80 mm gave 69.18, the best
      so far. Narrowing the track to 0.10 m gave 53.14, and widening it to 0.14 m
      gave 60.26, so 0.12 m is the best track tested. Mass 0.6 kg on the 80 mm baseline
      gave 55.45, which is 13.7 points below the 0.8 kg best. Oval progress fell from
      0.229 to 0.148 and the s-bend and slalom also worsened. Lighter is therefore
      worse, and the optimum mass is probably at or above 0.8 kg. Max error stays
      at 0.060 to 0.065 m on every track in every run, just over the 0.06 m off-track
      limit, while RMS error is 0.02 to 0.03 m. The failure is a transient peak on
      bends, and body width cannot move the limit. Iteration 6 suggests that more
      inertia or more grip helps, so I will test heavier mass in isolation. I am changing
      only mass, from 0.8 to 1.0 kg, on the iteration 3 baseline (80 mm row, 12 mm
      sensors on a 12 mm pitch, 0.12 m track, 0.03 m wheels, 0.12 m body width, 0.18
      m body length). Expected: progress on the oval and slalom rises above the iteration
      3 values, max error approaches 0.060 m, and the score exceeds 69.18. The risk
      is that extra mass adds rolling and slip losses, which would show as lower oval
      progress and a score below 69.


      - [Open this output](iteration-7/entity0/versions/ac686296b70042448a0ae0a6bb7857c6/payload.json)

      - Based on: [entityR2A](iteration-7/entityR2A/versions/carried-2e450a3316165c60/payload.json)'
  - id: entity1
    label: Mass 1.0 kg test
    notes: 'Single-variable test of mass 0.8 to 1.0 kg on the iteration 3 baseline
      (69.18), with the controller held fixed. Iteration 6 (0.6 kg, 55.45) showed
      lighter mass hurts, so heavier is tested next.


      ### Rationale


      The Builder''s proposal is a single-variable test of mass on the iteration 3
      baseline (80 mm row, 12 mm sensors on a 12 mm pitch, 0.12 m track, 0.03 m wheels,
      0.12 m body width, 0.18 m body length). The only change is mass from 0.8 kg
      to 1.0 kg. Race evidence supports testing heavier mass. Iteration 6 (0.6 kg,
      otherwise identical) scored 55.45, against 69.18 at 0.8 kg. Oval progress fell
      from 0.229 to 0.148, so lighter is worse. Max error stays at 0.060 to 0.067
      m on every track in every run, so the limit is still breached by bend transients.
      I keep the iteration 3 controller unchanged (kp 0.8, kd 0.15, ki 0, base_speed
      1.5, last_direction, weights [-2,-1,0,1,2]). Keeping the controller fixed makes
      the 1.0 kg result comparable with 69.18. The heavier robot has more yaw inertia,
      so it should respond more slowly to a bend transient, but the controller has
      not been shown to need retuning for that. I do not retune kd, because one variable
      at a time is needed to tell whether mass alone helps. The sensor geometry is
      unchanged from the Builder''s proposal, which is already the best tested. Expected,
      not measured: max_error near 0.060 m and a score above 69.18. If the score falls
      with steering_oscillation rising, the next controller step is a kd change, not
      a geometry change.


      - [Open this output](iteration-7/entity1/versions/0cde58f1d3ff4cc192b5075af80cb163/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/ac686296b70042448a0ae0a6bb7857c6/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-2e450a3316165c60/payload.json)'
  - id: entityR1
    label: Next steps after 1.0 kg
    notes: 'Feedback written before racing: if 1.0 kg beats 69.18 test 1.2 kg, otherwise
      return to 0.8 kg and test wheel_radius. Each rule rests on the 0.6 kg result
      and the progress shortfall across iterations 3 to 6.


      ### Feedback


      Written before this candidate has raced, so no result is stated for it. What
      I had to do in the controller: nothing beyond keeping the iteration 3 gains
      (kp 0.8, kd 0.15, ki 0, base_speed 1.5). The controller must stay fixed so that
      the mass change is the only variable. Evidence: iteration 6 (0.6 kg, same geometry
      otherwise) scored 55.45 against 69.18 at 0.8 kg. Its oval progress fell from
      0.229 to 0.148 and oval steering oscillation fell from 0.120 to 0.101, so lighter
      mass made the robot steadier but slower to get through bends. Max error stayed
      at 0.060 to 0.067 m on every track in every run, so mass has not yet fixed the
      peak. Decision rules for the next race: if 1.0 kg scores above 69.18 with max_error
      falling, the heavier robot helps, so test mass 1.2 kg next, with everything
      else unchanged. If 1.0 kg scores below 69.18 while progress is unchanged, 0.8
      kg is the local mass optimum, so move to wheel_radius. If steering_oscillation
      rises above about 0.17 on the s-bend or slalom, the heavier robot is under-damped,
      so change kd in the controller (for example 0.18), not the geometry.


      ### Requested changes


      - If 1.0 kg scores above 69.18 with max_error falling, try mass 1.2 kg with
      everything else unchanged. Iteration 6 showed lower mass lowers the score (0.6
      kg gave 55.45 against 69.18), so the trend is toward more mass, and the heavier
      end of the range is still untested.

      - If 1.0 kg scores below 69.18, keep mass 0.8 kg and try wheel_radius 0.035
      m. Iterations 3 to 6 reached only 0.12 to 0.23 of the course, and a larger wheel
      should give more ground speed at the same PWM (a hypothesis from the progress
      shortfall, not yet measured).

      - If line_loss_events on the slalom stay at 2.0 (iterations 0, 3, 4, 5 and 6),
      try sensor_size 0.016 m on the 80 mm row as a single test. A larger footprint
      keeps readings above the 0.05 line-loss threshold for longer. Iteration 1 changed
      sensor size together with other variables, so this effect is not yet proven.


      - [Open this output](iteration-7/entityR1/versions/0cde58f1d3ff4cc192b5075af80cb163/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/ac686296b70042448a0ae0a6bb7857c6/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-2e450a3316165c60/payload.json)'
