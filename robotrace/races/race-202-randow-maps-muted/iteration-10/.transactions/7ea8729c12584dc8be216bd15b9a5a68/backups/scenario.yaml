  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Scores so far: the best design is iteration 7 (80 mm sensor row, 12 mm sensors
      on a 12 mm pitch, 0.12 m track, 0.03 m wheels, 1.0 kg) at 73.33. Lookahead (40
      to 80 mm), track (0.10 to 0.14 m) and mass (0.6 to 1.2 kg) have each been tested
      in isolation and each shows a peak or a monotone optimum near the current values.
      Iteration 9 raised wheel_radius from 0.030 to 0.035 m and scored 64.78, a 8.6-point
      drop. Oval progress rose (0.227 to 0.273), but s-bend (0.194 to 0.078 progress
      in the authorised per-track data) and slalom fell. Every run still ends off
      track with max_error at 0.060 to 0.066 m, just over the 0.06 m limit, while
      rms_error stays at 0.02 to 0.03 m, so the failure is a transient bend peak rather
      than a steady offset. The wheel-radius result is consistent with the earlier
      track results: the radius-to-track ratio (0.25 at baseline, 0.29 at iteration
      9) appears to govern bend response. Larger wheels make the robot faster on the
      straight but less able to correct on tight bends. I therefore reverse the direction:
      wheel_radius goes from 0.030 to 0.025 m (ratio about 0.21), holding every other
      value at the iteration 7 baseline. Expected result: s-bend and slalom progress
      recover and max_error moves toward or below 0.06 m, at some cost to oval speed.
      The score should land above 73.33 if the ratio hypothesis holds. If it falls
      again, the ratio is not the main lever, and the next single-variable test is
      sensor size (16 mm) at the baseline radius.


      - [Open this output](iteration-10/entity0/versions/98764076913442379b1b36197cbbed53/payload.json)

      - Based on: [entityR2A](iteration-10/entityR2A/versions/carried-d0ecc6ff5eac44b3/payload.json)'
  - id: entity1
    label: Smaller wheels 0.025 m
    notes: 'Tests wheel_radius 0.025 m on the 73.33 design, with kp raised to 0.96
      to offset the roughly 17 percent lower turn gain. Based on iteration 9, where
      0.035 m raised oval progress but cut s-bend progress.


      ### Rationale


      Iteration 9 tested wheel_radius 0.035 m with kp 0.7 and scored 64.78, below
      the 73.33 best at 0.030 m. Oval progress rose (0.227 to 0.273) while s-bend
      (0.194 to 0.078) and slalom fell, so larger wheels help straight-line speed
      and hurt bend response. The Builder''s intent is to test the other side at 0.025
      m. Turn rate per unit PWM difference scales with wheel radius, so 0.025/0.030
      = 0.833 lowers effective steering gain by about 17 percent. I raise kp from
      0.8 to 0.96 to hold the iteration 7 bend response, the reverse of the iteration
      9 adjustment. kd stays 0.15 and ki 0 because no steady offset has been observed.
      base_speed 1.5, last_direction and the sensor weights are unchanged. Expected,
      not measured: s-bend and slalom progress recover, oval progress falls slightly,
      and max_error moves toward 0.060 m. The main risk is that the smaller wheels
      cut ground speed enough that the course cannot be covered in time at base_speed
      1.5.


      - [Open this output](iteration-10/entity1/versions/105fceaf409943e48c739188a9fa5d8f/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/98764076913442379b1b36197cbbed53/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-d0ecc6ff5eac44b3/payload.json)'
  - id: entityR1
    label: Wheel radius next steps
    notes: 'Feedback written before the race: if 0.025 m beats 73.33, try 0.022 m;
      otherwise return to 0.030 m and test a 16 mm sensor. Evidence is the iteration
      9 result (64.78) and the sensor and mass trends across iterations 0 to 9.


      ### Feedback


      Written before this candidate has raced, so no result is stated for it. What
      I had to do in the controller: wheel radius sets turn rate per unit PWM difference,
      so going from 0.030 to 0.025 m lowers effective steering gain by about 17 percent.
      I raised kp from 0.8 to 0.96 to match it, and kept kd 0.15, ki 0, base_speed
      1.5 and last_direction. Evidence: iteration 9 (0.035 m, kp 0.7) scored 64.78,
      with oval progress rising from 0.227 to 0.273 and s-bend progress falling from
      0.194 to 0.078 and slalom from 0.126 to 0.125 (slalom roughly flat). Every run
      still ends with max_error 0.060 to 0.067 m and RMS 0.019 to 0.036 m, so the
      peak is a bend transient. Decision rules for the next race: if the score is
      above 73.33 with s-bend and slalom progress recovering, the smaller wheel is
      helping bends, so try wheel_radius 0.022 m next. If the score falls while oval
      progress drops below about 0.20, the ground speed loss is the limit, so return
      to 0.030 m and test sensor_size 0.016 m. If steering_oscillation rises above
      about 0.18 on the s-bend or slalom, the kp match is too high, so change kp in
      the controller, not the geometry.


      ### Requested changes


      - If wheel_radius 0.025 m beats 73.33 with s-bend and slalom progress above
      the iteration 7 values, try wheel_radius 0.022 m with kp scaled to about 1.1.
      Iteration 9 (0.035 m) showed larger wheels cut bend progress (s-bend 0.194 to
      0.078), so the bend trend points toward smaller wheels.

      - If wheel_radius 0.025 m falls below 73.33 while max_error stays at 0.060 to
      0.067 m, return to wheel_radius 0.030 m and try sensor_size 0.016 m on the 80
      mm row. The slalom has shown 2.0 line-loss events in most runs, and a larger
      footprint keeps readings above the 0.05 line-loss threshold longer (unproven;
      iteration 1 changed sensor size with other variables).

      - If the smaller wheel lowers oval progress below about 0.20 while max_error
      is unchanged, try mass 1.1 kg at wheel_radius 0.025 m. Mass peaked near 1.0
      kg (1.2 kg scored 60.1), so 1.1 kg is a narrow test of whether the optimum sits
      slightly above 1.0 kg.


      - [Open this output](iteration-10/entityR1/versions/105fceaf409943e48c739188a9fa5d8f/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/98764076913442379b1b36197cbbed53/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-d0ecc6ff5eac44b3/payload.json)'
