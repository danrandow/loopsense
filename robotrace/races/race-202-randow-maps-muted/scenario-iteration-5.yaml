map:
  id: race-202-randow-maps-muted
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Wider track 0.14 m test
    notes: 'Changes only wheel_track from 0.12 m to 0.14 m on the best design so far
      (iteration 3, score 69.18), since the 0.10 m track cost about 16 points in iteration
      4. Rests on the track trend across iterations 1, 3 and 4 and the s-bend progress
      drop (0.156 to 0.081) at the narrow track.


      ### Rationale


      Scores by iteration: 0 (60 mm row, 0.12 m track) 65.96; 2 (40 mm row) 52.25;
      3 (80 mm row) 69.18, the best so far; 4 (80 mm row, 0.10 m track) 53.14. Iteration
      1 changed four variables at once and also used a 0.10 m track, and it scored
      53.33. Two separate runs with the 0.10 m track both fell by about 16 points
      relative to the 0.12 m baseline, so narrowing the track is the strongest evidence
      so far. The authorized iteration 4 result shows the damage was concentrated
      on the s-bend (progress 0.156 to 0.081) and the slalom, with the oval less affected
      (progress 0.229 to 0.183). Steering oscillation on the s-bend also fell (0.148
      to 0.067), so the narrow track looks sluggish or under-damped on the bends rather
      than oscillatory. Max error stays at 0.060 to 0.065 m on every track in every
      run, so the off-track limit is still the binding constraint. Lookahead is at
      its contract maximum (80 mm), so it cannot be pushed further. The next single-variable
      step is the other side of the track trend: widen wheel_track from 0.12 m to
      0.14 m (within the 0.18 m limit) and hold everything else at the iteration 3
      values. A wider track lowers turn rate per unit wheel difference, which should
      damp the bend response, reduce the sluggish-to-overshoot swing, and keep the
      robot straighter at speed. I expect progress to rise on the s-bend and slalom
      relative to 0.12 m, with max error approaching or dropping below 0.060 m, and
      a score above 69.18. The risk is that a wider track lowers turn authority on
      the tightest bend, so max error could rise instead, which would show as a drop
      in oval progress.


      - [Open this output](iteration-5/entity0/versions/04b1b14c9c8548c1b5fc5dedfee01396/payload.json)

      - Based on: [entityR2A](iteration-5/entityR2A/versions/carried-ca6a653f18b61f29/payload.json)'
  - id: entity1
    label: Wider track 0.14 m, kp
    notes: 'Integrates the Builder''s single-variable test (wheel_track 0.12 to 0.14
      m) on the iteration 3 baseline (69.18), with kp raised to 0.93 to offset the
      roughly 14 percent lower effective steering gain. Narrow-track evidence from
      iteration 4 (score 53.14, s-bend progress falling) motivates widening.


      ### Rationale


      Evidence: iteration 3 (80 mm row, 0.12 m track, kp 0.8, kd 0.15) is the best
      so far at 69.18. Max error sits at 0.062 to 0.067 m on every track while RMS
      stays at 0.019 to 0.033 m, so the failure is a transient peak on bends. Lookahead
      has now been tested at 40, 60 and 80 mm and is at its contract maximum. Iteration
      4 narrowed the track to 0.10 m (with kp lowered to 0.7) and scored 53.14. Its
      oval progress fell from 0.229 to 0.183 and s-bend progress from 0.156 to 0.081,
      while s-bend steering oscillation fell to 0.067. That points to sluggish, under-damped
      bends rather than jitter. The Builder''s proposal widens wheel_track to 0.14
      m with all else unchanged. Turn rate per unit wheel difference scales as 1/track,
      so 0.14 m reduces effective steering gain by about 0.12/0.14 = 0.857. I hold
      effective gain near the iteration 3 level by raising kp from 0.8 to 0.93 (0.8/0.857,
      about 16 percent). kd stays at 0.15 and ki at 0, because no steady offset has
      been seen and the damping question is still open. base_speed (1.5), line_loss
      (last_direction) and sensor weights are unchanged from the best run. Expected
      result, not yet measured: a narrower gap in the s-bend and slalom progress relative
      to 0.12 m, with max error near or below 0.060 m. The main risk is reduced turn
      authority on the tightest bend, which would show as an oval progress drop.


      - [Open this output](iteration-5/entity1/versions/29082fe648b8428396abb582b0f2abd3/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/04b1b14c9c8548c1b5fc5dedfee01396/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-ca6a653f18b61f29/payload.json)'
  - id: entityR1
    label: 'Track 0.14 m: next steps'
    notes: 'Feedback written before the race: it explains the kp compensation, sets
      decision rules by score and progress, and requests three tied to iteration 3
      and 4 evidence (wheel_radius 0.035 m, mass 0.7 kg fallback, sensor_size 0.016
      m). Progress shortfall and slalom line-loss counts are the main evidence.


      ### Feedback


      What I had to do in the controller: a wider track lowers effective steering
      gain by about 14 percent (0.12/0.14), so I raised kp from 0.8 to 0.93 to hold
      the iteration 3 gain. I kept kd at 0.15 and ki at 0 because no steady offset
      has appeared in any run (RMS 0.019 to 0.033 m) and the damping question is still
      open. The narrow-track evidence from iteration 4 (0.10 m, score 53.14, s-bend
      progress 0.156 to 0.081 with oscillation falling to 0.067) suggests that the
      robot is sluggish on bends when the track is narrow, so widening it is the right
      direction to test. Decision rules for the next race: if the score is above 69.18
      and max_error falls toward 0.06 m with s-bend and slalom progress rising, keep
      wheel_track 0.14 m and move to the first requested change. If the score falls
      below 69.18 while oval progress drops (the tightest bend losing turn authority),
      return to wheel_track 0.12 m, since iteration 3 is the best known track. If
      steering_oscillation rises above the iteration 3 level (0.12 to 0.17) with max_error
      unchanged, the extra gain from kp 0.93 is the issue, so change kp in the controller,
      not the geometry.


      ### Requested changes


      - If wheel_track 0.14 m raises the score above 69.18 and max_error falls, try
      wheel_radius 0.035 m with everything else unchanged. Iteration 3 progress was
      only 0.12 to 0.23 across tracks, far short of the full course, and a larger
      wheel gives more ground speed at the same PWM (a hypothesis from the progress
      shortfall, not yet measured).

      - If wheel_track 0.14 m drops oval progress below the iteration 3 level of about
      0.23 while max_error is unchanged, return to wheel_track 0.12 m and try mass
      0.7 kg alone. Iteration 1 (0.6 kg) cut oval oscillation to 0.074 but also cut
      progress, so mass 0.7 is a milder test of the same trade-off.

      - If line_loss_events on the slalom stay at 2.0 (iterations 0, 3 and 4) with
      max_error still above 0.06 m, try sensor_size 0.016 m at the 80 mm row as a
      single test. A larger footprint keeps the readings above the 0.05 line-loss
      threshold for longer. Iteration 1 changed sensor size together with other variables,
      so this effect is not yet proven.


      - [Open this output](iteration-5/entityR1/versions/29082fe648b8428396abb582b0f2abd3/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/04b1b14c9c8548c1b5fc5dedfee01396/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-ca6a653f18b61f29/payload.json)'
