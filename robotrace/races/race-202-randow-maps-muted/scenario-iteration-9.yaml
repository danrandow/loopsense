  id: race-202-randow-maps-muted
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Evidence across iterations 0 to 8 (all on the 0.8 kg-ish, 0.12 m track, 0.03
      m wheel baseline unless noted):


      - Every run ends off track with max_error at 0.060 to 0.066 m, just over the
      0.06 m limit, while rms_error stays at 0.02 to 0.03 m. The failure is a transient
      peak on bends, not a steady offset. Body width cannot change the limit (it is
      pinned at 0.06 m across the allowed range), so body width is not a lever.

      - Lookahead is monotone (40 mm 52.3, 60 mm 66.0, 80 mm 69.2) and now sits at
      the 0.08 m contract maximum.

      - Track peaks at 0.12 m (0.10 m gave 53.1, 0.14 m gave 60.3).

      - Mass peaks near 1.0 kg. The latest result, 1.2 kg, scored 60.14, down from
      73.33 at 1.0 kg. The 0.6 kg, 0.8 kg and 1.0 kg points were 55.4, 69.2 and 73.3,
      so the curve has turned over. The best mass is about 1.0 kg, and I will hold
      it there.


      With lookahead, track and mass now at or near their best values, the untested
      single variable with a plausible path to fixing the bend peak is wheel_radius.
      I will keep the best design (80 mm row, 12 mm sensors on a 12 mm pitch, 0.12
      m track, 1.0 kg, 0.18 m body length, 0.12 m body width) and change only wheel_radius
      from 0.030 to 0.035 m. A larger radius raises ground speed for a given PWM,
      which should lift progress and help the robot cover the course in time. It also
      changes the radius-to-track ratio from 0.25 to 0.29. The track series suggests
      the turn response is sensitive to that ratio, so this is a real risk: the bend
      peak could get worse, not better. I am taking a moderate step rather than a
      large one so the effect stays readable.


      Expected result: oval and slalom progress at or above the 1.0 kg values (oval
      0.227, slalom 0.126), max_error near 0.060 m, and a score above 73.33. If the
      score falls, the ratio sensitivity dominates and the optimum wheel radius is
      at or below 0.03 m.


      - [Open this output](iteration-9/entity0/versions/d8fdf677f9544b9d84088a2adc3dcffa/payload.json)

      - Based on: [entityR2A](iteration-9/entityR2A/versions/carried-ff13c0f3a30c34d8/payload.json)'
  - id: entity1
    label: Wheel radius 0.035 m test
    notes: 'Single-variable wheel_radius test (0.030 to 0.035 m) on the iteration
      7 best design (73.33). kp is cut from 0.8 to 0.7 to offset the roughly 17 percent
      higher turn gain from the larger wheel, following the track-gain mismatch seen
      in iterations 4 and 5.


      ### Rationale


      Iteration 7 (1.0 kg, 80 mm row, 0.12 m track, 0.03 m wheels, kp 0.8, kd 0.15)
      is the best design so far at 73.33. Max error sits at 0.060 to 0.067 m on every
      track while RMS stays at 0.019 to 0.036 m, so the failure is a transient bend
      peak, not a steady offset. The Builder''s single change is wheel_radius 0.030
      to 0.035 m. For a given PWM, ground speed and wheel-speed difference both scale
      with radius, so turn rate per unit PWM difference rises by about 0.035/0.030
      = 1.17. The effective steering gain therefore rises by about 17 percent. I lower
      kp from 0.8 to 0.7 (about 12 percent) to hold the bend response near the iteration
      7 level, the same approach used for the 0.10 m track in iteration 4. Iteration
      5 showed that a gain mismatch with track width changes the bend response. kd
      stays at 0.15 and ki at 0 because no steady offset has appeared. base_speed
      stays at 1.5 and line_loss stays last_direction. Expected, not measured: oval
      and slalom progress at or above the iteration 7 values (0.227 and 0.126), max_error
      near 0.060 m, and a score above 73.33. Main risk: the radius-to-track ratio
      rises from 0.25 to 0.29, and the bend peak could worsen if the gain match is
      off.


      - [Open this output](iteration-9/entity1/versions/3f65ed16e8bb4b27b59886977271b599/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/d8fdf677f9544b9d84088a2adc3dcffa/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-ff13c0f3a30c34d8/payload.json)'
  - id: entityR1
    label: Radius next steps
    notes: 'Feedback written before the race, with decision rules for the wheel_radius
      test. Requested changes follow the mass trend (iteration 6 to 8), the progress
      shortfall (all runs under 0.23 of the course) and the persistent 2.0 slalom
      line-loss events.


      ### Feedback


      Written before this candidate has raced, so no result is stated for it. What
      I had to do in the controller: a larger wheel raises turn rate per unit PWM
      difference by about 17 percent (0.035/0.030), so I lowered kp from 0.8 to 0.7
      and kept kd 0.15, ki 0, base_speed 1.5 and last_direction. Evidence: iteration
      7 (1.0 kg, 0.030 m wheels) scored 73.33, the best so far, with max_error 0.060
      to 0.066 m and RMS 0.019 to 0.036 m, so the peak is a bend transient. Iteration
      4 showed that a change in effective turn gain without matching kp lowers bend
      progress (s-bend 0.156 to 0.081), so the kp match matters. Decision rules for
      the next race: if the score is above 73.33 and oval and slalom progress rise,
      keep 0.035 m and try wheel_radius 0.040 m next. If the score falls while max_error
      is unchanged and progress stays flat, the ground-speed gain is not the lever,
      so return to 0.030 m and test sensor_size 0.016 m. If steering_oscillation rises
      above about 0.18 on the s-bend or slalom, the effective gain is still too high,
      so change kp in the controller, not the geometry.


      ### Requested changes


      - If wheel_radius 0.035 m beats 73.33 with progress rising on the oval and slalom,
      try wheel_radius 0.040 m with everything else unchanged. Iterations 3 to 7 reached
      only 0.12 to 0.23 of the course, so more ground speed at the same PWM is the
      main lever left (a hypothesis from the progress shortfall, not yet measured).

      - If wheel_radius 0.035 m falls below 73.33 while max_error is unchanged at
      0.060 to 0.066 m, return to wheel_radius 0.030 m and try sensor_size 0.016 m
      on the 80 mm row. The slalom has shown 2.0 line-loss events in iterations 0,
      3, 4, 5, 6 and 7, and a larger footprint keeps readings above the 0.05 line-loss
      threshold for longer (iteration 1 changed sensor size with other variables,
      so this is unproven).

      - If the larger wheel raises s-bend or slalom steering_oscillation above about
      0.18 (iteration 7 values 0.177 and 0.168), keep wheel_radius 0.035 m and try
      mass 1.2 kg alone. Mass rose monotonically from 0.6 to 1.0 kg (55.4, 69.2, 73.3),
      so a heavier robot may add the yaw damping that the higher effective gain needs.


      - [Open this output](iteration-9/entityR1/versions/3f65ed16e8bb4b27b59886977271b599/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/d8fdf677f9544b9d84088a2adc3dcffa/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-ff13c0f3a30c34d8/payload.json)'
