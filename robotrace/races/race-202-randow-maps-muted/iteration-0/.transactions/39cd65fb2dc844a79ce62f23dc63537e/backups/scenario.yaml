  entities:
  - id: entity0
    label: Baseline 5-sensor array
    notes: 'Neutral starting geometry with five 12 mm sensors at 12 mm spacing, 60
      mm lookahead, and a moderate 0.12 m track and 0.8 kg body. No race evidence
      exists yet, so this is a baseline to measure against. Next step is to read the
      first race telemetry and the Integrator''s feedback.


      ### Rationale


      Iteration 0 has no race telemetry or Integrator feedback, so this is a neutral
      baseline built from the contract. Five sensors at 12 mm spacing span 48 mm across
      the front of the body. That is wider than the 25 mm tape, so the line stays
      visible across the array during bends and small lateral errors, and the centre-of-array
      reading gives a usable signal for weighted-average steering. The sensors sit
      60 mm ahead of the axle to give lookahead, which helps on curves, but not at
      the 80 mm limit, which would add lag and sensitivity to noise. Sensor size is
      12 mm, a middle choice that covers part of the tape in every sensor so readings
      change smoothly as the robot moves. Wheel track is 0.12 m and wheel radius 0.03
      m, a moderate turn authority with a common ground speed. Body width of 0.12
      m keeps the off-track limit at its 0.06 m floor, which is comparable to the
      tape-plus-quarter-body value. Mass of 0.8 kg and a 0.18 m body length give moderate
      yaw inertia, so the robot can turn without sluggishness. I expect this to complete
      the development tracks with a few line-loss events at most, but the real test
      is the first race. The most likely failure modes are overshoot on the slalom
      and loss of the line on sharp bends, and the race data should show which.


