map:
  id: race-202-randow-maps-muted
  schema: v0.2
  scenario: Iteration 1
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 0.
dimensions:
  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Lighter, narrower
    notes: 'Cuts mass to 0.6 kg and track to 0.10 m for faster correction, and uses
      16 mm sensors on a ±0.02 m array to keep the line visible at larger offsets.
      Based on iteration 0, where all runs left the track at max error 0.063 to 0.066
      m, just above the fixed 0.06 m off-track limit. Body width is held at 0.12 m
      because widening it cannot raise that limit.


      ### Rationale


      The iteration 0 race ended every run off track on all three development tracks
      (20 of 20 trials each, no finishes). The RMS error was small (0.019 to 0.032
      m), but max error reached 0.063 to 0.066 m, just over the off-track limit of
      0.06 m. Track progress was low (0.12 to 0.20). So the failure is a large transient
      excursion, not a steady offset. Steering oscillation was also high (0.11 to
      0.16), which points to jitter and overshoot on bends.


      I checked whether body width can help. The limit is max(0.06, tape_half_width
      + body_width/4). With tape half-width 0.0125 m and body width at its maximum
      of 0.18 m, the second term is only 0.0575 m, so the limit stays at 0.06 m across
      the whole allowed range. Widening the body therefore cannot save these runs,
      and I keep body_width at 0.12 m. The fix has to come from lower peak error.


      Changes: (1) Reduce mass from 0.8 to 0.6 kg. Lower yaw inertia should let the
      robot correct faster and reduce overshoot. (2) Reduce wheel_track from 0.12
      to 0.10 m. A narrower track gives more turn rate per unit of wheel difference,
      so the controller has more authority on tight bends, the slalom in particular.
      (3) Increase sensor_size from 0.012 to 0.016 m, so each sensor keeps a partial
      reading when the line drifts toward the edge of the array and the signal drops
      out less often. (4) Keep five sensors but move the array to ±0.02 m spacing
      (0.01 m steps) at y = 0.06 m, so the outer sensors still see the tape at larger
      offsets while the centre sensors keep resolution.


      Expected result: max error drops below 0.06 m on the oval and s-bend, which
      gives the first finishes, and progress rises well above 0.2. The slalom should
      improve least. Uncertainty: I am changing several things together, so the race
      will not isolate which one helped. The Integrator''s feedback on controller
      gains should show whether the remaining error is lag or saturation.


      - [Open this output](iteration-1/entity0/versions/f90e5675d9ae41a6b1f56ec310fdec04/payload.json)

      - Based on: [entityR2A](iteration-1/entityR2A/versions/carried-eb7a064aa4846f52/payload.json)'
  - id: entity1
    label: Baseline robot package
    notes: 'Builder''s 5-sensor 12 mm baseline paired with a PD controller (kp 0.8,
      kd 0.15, no integral), position-proportional weights and last_direction recovery.
      Built from the contract only because no race evidence exists yet.


      ### Rationale


      Iteration 0 has no race telemetry and no earlier Integrator feedback, so the
      controller is built from the contract and the Builder''s baseline geometry.
      The five sensors sit at x = -24, -12, 0, 12, 24 mm, so the weights are set proportional
      to lateral position, scaled to [-2, 2]: [-2, -1, 0, 1, 2]. Because a positive
      signal steers left and a sensor on the left (positive x) sees tape when the
      line is to the left, these weights steer the robot toward the line. Gains are
      moderate: kp 0.8 gives about 280 PWM of differential at a typical 1 signal unit,
      which is enough to correct offsets without saturating. kd 0.15 adds damping
      for the 60 mm lookahead, which the Builder flagged as a possible source of oscillation.
      ki is 0 because the integral term can wind up on the oval and s-bend curves,
      and the baseline should be tested without it. base_speed 1.5 gives PWM about
      75 percent of full, which should keep average speed near the 1.5 m/s needed
      to finish in 3 s while leaving some headroom for the 0.12 m track and 0.8 kg
      mass. line_loss is last_direction so that a robot that leaves the tape on a
      bend tries to recover in the direction it was already turning. Expected result,
      unverified: completion on the oval and s-bend, with line-loss risk on the slalom.
      The real test is the first race.


      - [Open this output](iteration-0/entity1/versions/39cd65fb2dc844a79ce62f23dc63537e/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/12fda5f07c3343e0af60ea337fb66b5e/payload.json)'
  - id: entityR1
    label: Iteration 0 integration
    notes: 'Written before any race, so it cites no results: it gives decision rules
      for the first race covering lookahead, sensor size and track width. Each requested
      change is a hypothesis to check against that race''s telemetry.


      ### Feedback


      No race evidence exists yet (iteration 0), so nothing here is a result for this
      geometry. What I had to do: I set sensor weights proportional to lateral sensor
      position ([-2,-1,0,1,2]) because the array is 48 mm wide and the tape is 25
      mm, so a wider array gives a clean signal across the line without saturating
      the weights. I kept ki at 0 and used kd 0.15 as a precaution against the 60
      mm lookahead causing oscillation. Decision rules for the next race: if steering_oscillation
      is high or max_error grows on the slalom, change the lookahead by moving the
      sensor y-position closer to the axle (about 0.045 m) rather than adding more
      kd, since the lookahead is what creates lag. If line_loss_events are frequent
      on tight bends, try sensor_size 0.016 so each sensor covers more of the 25 mm
      tape and readings stay non-zero longer. If the robot completes but progress
      stalls or completion_time is near 3 s, try a wider wheel_track (0.14 m) for
      more turn authority before raising base_speed, since the 0.12 m track may be
      causing slip on bends.


      ### Requested changes


      - Test sensor y-position at 0.045 m instead of 0.06 m if steering oscillation
      or slalom max_error is high, because the 60 mm lookahead is the most likely
      source of lag once the baseline has run.

      - Test sensor_size 0.016 if line_loss_events occur on tight bends, because a
      larger footprint keeps readings above the 0.05 line-loss threshold for longer;
      this is a hypothesis from the contract, not from race data.

      - Test wheel_track 0.14 if the robot finishes slowly or slips on bends, because
      a wider track gives more turn authority at the same base speed; this is a hypothesis
      to check against the first race''s completion_time and max_error.


      - [Open this output](iteration-0/entityR1/versions/39cd65fb2dc844a79ce62f23dc63537e/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/12fda5f07c3343e0af60ea337fb66b5e/payload.json)'
