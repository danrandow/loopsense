map:
  id: race-221-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      The geometry has been mapped across iterations 0 to 9. The best-measured layout
      is five 12 mm sensors at x = -0.03, -0.015, 0, 0.015, 0.03 m, y = 0.05 m, on
      a 0.12 m track with 0.03 m wheels, 0.6 kg mass and a 0.16 x 0.14 m body. It
      scored 69.3241 in iterations 1, 4 and 6 under the same controller, so it reproduces.
      Every single-variable geometry change away from it lowered the score: the 16
      mm footprint (54.45), y = 0.03 m (59.64) and the ±0.04 m span (52.47). Line
      loss has stayed at about 1 per run (1.0 to 1.65) under every geometry, and steering
      oscillation (0.07 to 0.15) is not limiting. Across iterations 7, 8 and 9, the
      same geometry scored 61.77, 56.44 and (pending) with only the controller changing,
      so the score swings are controller-driven. The Integrator''s feedback asks me
      to hold the geometry while the kd 0.2 test runs, because a geometry change would
      confound that controller-only test. I am taking that advice. I am not testing
      wheel_track or mass now, since that would confound the test and the evidence
      gives no direction for them. Body width does not move the off-track limit, which
      is max(0.06, 0.0125 + body_width/4) = 0.06 m across the allowed range, so it
      is not a lever. Expected result: no geometry-driven change, so the score reflects
      the kd 0.2 controller change.


      - [Open this output](iteration-10/entity0/versions/3b4dd9637e084a70895dfcc42d05f240/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-714d7f8cc21a6580/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-48f38c4008bb8827/payload.json)'
  - id: entity1
    label: Reference robot, kd 0.3
    notes: 'Packages the best-measured geometry and controller (69.32, reproduced
      three times) unchanged. Every single-variable change tested since has lowered
      the score, so this is the safe reference race.


      ### Rationale


      Evidence: the iteration 1 controller on this geometry (base_speed 1.3, kp 2.5,
      ki 0, kd 0.3, last_direction, weights -1, -0.5, 0, 0.5, 1) scored 69.3241 in
      iterations 1, 4 and 6, so it is reproducible. Every controller change tested
      on it lowered the score: base_speed 1.15 gave 61.77 (iteration 7, oval line
      loss rose to 1.45), kd 0.4 gave 56.44 (iteration 8, oscillation rose to about
      0.14), and kd 0.2 gave 63.59 (iteration 9). That puts kd 0.3 at a local optimum
      among the values tested. Every geometry change tested also lowered the score:
      16 mm footprint 54.45, y = 0.03 m 59.64, span ±0.04 m 52.47. Line loss has stayed
      at about 1 per run (1.0 to 1.65) under every design, and steering oscillation
      (0.07 to 0.15) is not limiting. I therefore package the best-measured robot
      exactly, with the geometry and controller unchanged, so the race gives a known-good
      score and a clean reference. Sign check: positive x (left) carries a positive
      weight, so a line on the left steers left, as the contract requires. Expected
      result: a score near 69.3 with line loss about 1 per run. This is a prediction
      from repeated measurement, not a new outcome. The one lever not yet tested is
      line-loss handling (search_left or search_right in place of last_direction),
      which I leave for a later single-variable test because changing it now would
      move the reference.


      - [Open this output](iteration-10/entity1/versions/a4b98e43a13e4d1e9fdcbb5c35f47e7d/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/3b4dd9637e084a70895dfcc42d05f240/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-48f38c4008bb8827/payload.json)'
  - id: entityR1
    label: Hold geometry, test
    notes: 'Asks the Builder to hold the reference geometry, since all geometry and
      controller changes so far have lowered the score. Names wheel_track or mass
      as the only untested dynamics levers, to be tried only if line loss falls.


      ### Feedback


      Evidence: iteration 1 (69.32, 12 mm, y = 0.05 m, ±0.03 m span), reproduced in
      iterations 4 and 6, is the reference, and your current geometry matches it.
      Geometry changes lowered the score in iterations 2 (16 mm, 54.45), 3 (y = 0.03
      m, 59.64) and 5 (±0.04 m, 52.47). Controller changes also lowered it, in iterations
      7 (base_speed 1.15, 61.77), 8 (kd 0.4, 56.44) and 9 (kd 0.2, 63.59), so the
      layout is mapped and the controller is at a local optimum. Line loss has stayed
      at about 1 per run through iterations 0 to 9, and steering oscillation (0.07
      to 0.15) is not limiting. Do not change the geometry in response to the next
      race. Body width does not move the off-track limit, max(0.06, 0.0125 + body_width/4)
      = 0.06 m across your range. For the next geometry, the untested dynamics levers
      are wheel_track and mass, which the evidence neither supports nor rules out.
      Test one of them only if a later race shows line loss clearly falling, so the
      controller is held fixed.


      ### Requested changes


      - Hold the iteration 1 geometry unchanged: five 12 mm sensors at x = -0.03,
      -0.015, 0, 0.015, 0.03 m, y = 0.05 m, with wheel, body and mass values as they
      are.

      - Do not move the forward offset (y = 0.03 m cost about 10 points in iteration
      3) or the footprint (16 mm cost about 15 points in iteration 2) without a controller-based
      reason.

      - If a later race shows line_loss_events clearly below 1 per run, test one dynamics
      change such as wheel_track 0.10 or 0.14 m, with the controller held fixed. Otherwise
      leave the geometry as it is.


      - [Open this output](iteration-10/entityR1/versions/a4b98e43a13e4d1e9fdcbb5c35f47e7d/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/3b4dd9637e084a70895dfcc42d05f240/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-48f38c4008bb8827/payload.json)'
