map:
  id: race-221-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Revert to ±0.03 m span
    notes: 'Reverts the sensor span from ±0.04 m back to the best-measured ±0.03 m
      at y=0.05 m with 12 mm footprints. Iteration 5 (±0.04 m) scored 52.47 against
      the 69.32 reference, with oval progress halved, and the Integrator''s revert
      rule applies.


      ### Rationale


      Iteration 5 widened the span to ±0.04 m (20 mm spacing, 12 mm footprints, y=0.05
      m) and scored 52.47, down 16.9 points from the 69.32 reference. Line loss fell
      on oval (1.65 to 1.0 per run) but stayed at 1.0 on s-bend and slalom, so it
      did not fall clearly below 1 per run. Oval progress roughly halved (0.254 to
      0.127), and mean progress fell on every track except s-bend, which was roughly
      flat (0.150 to 0.150). The Integrator''s rule applies: because the score and
      progress fell with ±0.04 m, revert to the ±0.03 m span at y=0.05 m. I took that
      advice. Iterations 1 and 4 used this exact geometry and both scored 69.3241,
      so this is the best-measured design. I am not testing any new geometry this
      iteration: wheel track, wheel radius, mass and body have no evidence pointing
      to them, and the off-track limit stays at 0.06 m because body width does not
      move it. The expected result is a score near 69 if the controller is unchanged,
      and a return to the reference if the controller changes.


      - [Open this output](iteration-6/entity0/versions/92dfec0ae4644ee58383d4557684c04a/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-39ab2a17a7a13c94/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-492bb11544670ded/payload.json)'
  - id: entity1
    label: ±0.04 m span, iter-1 ctrl
    notes: 'Widens the sensor span from ±0.03 m to ±0.04 m at y=0.05 m, keeping the
      iteration 1 controller exactly so the span is the only change. Iteration 1 (69.32)
      and iteration 4 (same score) are the reference, and line loss has stayed at
      about 1 per run.


      ### Rationale


      The Builder''s geometry widens the sensor span from ±0.03 m to ±0.04 m at y=0.05
      m, with 12 mm footprints and all wheel, body and mass values unchanged. The
      best measured controller is iteration 1 (score 69.32). Iteration 4 reproduced
      that score exactly, and iteration 3 showed that moving the offset to y=0.03
      m cost about 10 points with the same controller, so the offset rather than the
      controller explains that drop. Line loss has stayed near 1 per run through every
      geometry tested, and steering_oscillation (0.09 to 0.15) is not the limiting
      factor, so I see no controller-side fix that the evidence supports. I therefore
      keep the iteration 1 controller exactly (base_speed 1.3, kp 2.5, ki 0, kd 0.3,
      last_direction) so that any score change is attributable to the span alone.
      The sensor weights stay at -1, -0.5, 0, 0.5, 1. These are matched to the new
      x positions in order: a positive x (left) gets a positive weight, so a line
      on the left steers left, as the contract requires. Keeping the same weights
      also keeps the signal scale the same as in the reference run. Coverage check:
      with 12 mm footprints at 20 mm spacing there is an uncovered 8 mm gap between
      the centre and the ±0.02 m sensors. The 25 mm tape is always at least partly
      under one footprint, so the sum stays above the 0.05 line-loss threshold, but
      readings may dip as the line crosses that gap. Expected result: fewer line-loss
      events than the 1.0 to 1.65 per run measured at ±0.03 m, and progress at or
      above iteration 1. This is a prediction, not a measurement.


      - [Open this output](iteration-5/entity1/versions/d17a211ad2c9415fbda136cf96deb51f/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/43a7cab619714a1c8b4c030ccb0f0bcf/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-2a024531fceb669c/payload.json)'
  - id: entityR1
    label: Span test feedback
    notes: 'Pre-race feedback: hold y=0.05 m and 12 mm footprints, test ±0.04 m, and
      only consider ±0.05 m if line loss clearly falls. Each point is tied to the
      iteration 1 to 4 evidence, and no outcome is claimed for this candidate.


      ### Feedback


      Written before this candidate has raced. The evidence is iteration 1 (±0.03
      m span, y=0.05 m, 12 mm; score 69.32, reproduced exactly in iteration 4), which
      is the reference for this single-variable change. Line loss has stayed at about
      1 per run across iterations 0 to 4 (1.0 to 1.65 per run), and it did not fall
      when the footprint went to 16 mm (iteration 2, score 54.45). The span change
      from ±0.024 to ±0.03 m raised the score by about 15 points in iteration 1, though
      that change was paired with a controller change, so the span effect is only
      partly isolated. Iteration 3 showed that y=0.03 m lost about 10 points with
      the same controller, so keep y=0.05 m. Steering oscillation has stayed between
      0.09 and 0.15, so it is not the limiting factor. Please note that at ±0.04 m
      with 20 mm spacing and 12 mm footprints there is an 8 mm gap between the centre
      and the ±0.02 m sensors. This should not cause line loss, since the 25 mm tape
      always covers at least one footprint, but it may make readings dip as the line
      crosses that gap. Do not treat any of this as a result for the current candidate.
      Next race: if line_loss_events falls clearly below about 1 per run and progress
      rises, a wider 5-sensor span of ±0.05 m is worth considering as a later separate
      test. If line loss stays at about 1 per run, return to the ±0.03 m span and
      hold the geometry; do not move the forward offset again without a controller
      explanation.


      ### Requested changes


      - Keep sensor_size at 0.012 m and the forward offset at y=0.05 m, since iteration
      2 (16 mm, score 54.45) and iteration 3 (y=0.03 m, score 59.64) both scored below
      the iteration 1 reference of 69.32.

      - If line_loss_events falls clearly below about 1 per run with ±0.04 m, consider
      a single later test of a wider 5-sensor span of ±0.05 m at y=0.05 m. If it does
      not fall, return to ±0.03 m and hold the geometry.

      - If progress or score fall with ±0.04 m, revert to the iteration 1 span of
      ±0.03 m (sensor x at -0.03, -0.015, 0, 0.015, 0.03 m) at y=0.05 m before testing
      any other geometry change.


      - [Open this output](iteration-5/entityR1/versions/d17a211ad2c9415fbda136cf96deb51f/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/43a7cab619714a1c8b4c030ccb0f0bcf/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-2a024531fceb669c/payload.json)'
