map:
  id: race-221-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Hold iteration-1 geometry
    notes: 'Kept the best-measured five-sensor 12 mm layout at y = 0.05 m, ±0.03 m
      span, unchanged, as the Integrator requested. Five races on this geometry (69.32,
      61.77, 56.44) show the score moves with the controller, not the geometry, and
      every geometry change tested lowered the score.


      ### Rationale


      Iterations 1, 4, 6, 7 and 8 all used this geometry: five 12 mm sensors at x
      = -0.03, -0.015, 0, 0.015, 0.03 m, y = 0.05 m, on a 0.12 m track with 0.03 m
      wheels, 0.6 kg mass and a 0.16 x 0.14 m body. Scores were 69.32 (iterations
      1, 4 and 6, same controller), 61.77 (iteration 7, base_speed 1.15) and 56.44
      (iteration 8, kd 0.4). Only the controller changed across those races, so the
      geometry is reproducible and the score swings are controller-driven. Every geometry
      change I tested lowered the score: the 16 mm footprint (54.45, controller held),
      y = 0.03 m (59.64, controller held) and the ±0.04 m span (52.47, controller
      held). Line loss has stayed at about 1 per run (1.0 to 1.65) across every geometry,
      and steering oscillation (0.07 to 0.15) is not limiting. The Integrator''s feedback
      asks me to hold this geometry while the kd test runs, and I take that advice.
      I considered testing an untried dynamics lever, such as wheel_track or mass.
      I am not doing it now, because it would confound the controller test that the
      Integrator is running on this geometry, and the evidence gives no direction
      for it. Body width does not move the off-track limit (max(0.06, 0.0125 + body_width/4)
      = 0.06 m across the allowed range), so I am not using it as a lever. Expected
      result: no geometry-driven change, with the score depending on the controller.
      If the kd 0.4 result shows line loss clearly below 1 per run, I can test one
      later geometry change in a subsequent iteration.


      - [Open this output](iteration-9/entity0/versions/392ccad8e4e94bc0b80a78c2a22df8c2/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-ae5070d675e3b900/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-2c5dd6043b5bbd9d/payload.json)'
  - id: entity1
    label: kd 0.2 controller test
    notes: 'Reference geometry held, with kd lowered from 0.3 to 0.2 as the only change.
      This follows iteration 8, where kd 0.4 scored 56.44 against the 69.32 reference,
      so the derivative direction is tested the other way.


      ### Rationale


      The reference geometry (iterations 1, 4, 6: 69.32, reproducible) is held unchanged,
      as the Builder proposed. Controller evidence so far: kd 0.4 (iteration 8) scored
      56.44, down 12.9 points, with steering_oscillation rising to 0.14 on s-bend
      and slalom and no drop in line loss. base_speed 1.15 (iteration 7) scored 61.77,
      with oval line loss rising to 1.45. Every controller change tested so far has
      lowered the score, and line loss has stayed near 1 per run under every geometry.
      Since kd went up and lost ground, the single untested direction on this gain
      is down. This iteration therefore tests kd 0.2, with every other value at the
      iteration 1 reference (base_speed 1.3, kp 2.5, ki 0, last_direction, weights
      -1, -0.5, 0, 0.5, 1). Sign check: positive x (left) has a positive weight, so
      a line on the left steers left, as the contract requires. Expected result: a
      score near 69 if kd has little effect, or a gain if less derivative damping
      helps. This is a prediction, not a measurement. If the score falls below 69,
      kd 0.3 is the best-supported value and the next test should be line-loss handling
      rather than gain tuning.


      - [Open this output](iteration-9/entity1/versions/00c96b48930d4c71b298fc533a2c4cfc/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/392ccad8e4e94bc0b80a78c2a22df8c2/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-2c5dd6043b5bbd9d/payload.json)'
  - id: entityR1
    label: Hold geometry, test kd
    notes: 'Holds the reference geometry because the score has tracked the controller
      since iteration 4, and every geometry change tested so far lowered it. It also
      asks the Builder not to confound the kd 0.2 test with a geometry change.


      ### Feedback


      Evidence: iteration 1 (69.32, 12 mm, y = 0.05 m, span ±0.03 m, base_speed 1.3,
      kp 2.5, kd 0.3), reproduced in iterations 4 and 6. Each geometry change away
      from it lowered the score: the 16 mm footprint (iteration 2, 54.45), y = 0.03
      m (iteration 3, 59.64) and the ±0.04 m span (iteration 5, 52.47). Controller
      changes have also lowered it: base_speed 1.15 (iteration 7, 61.77) and kd 0.4
      (iteration 8, 56.44). Line loss has stayed near 1 per run through iterations
      0 to 8, so the geometry layout has been mapped and the controller is the lever
      now. Hold the geometry. Do not change the geometry in response to the next race,
      because the Integrator''s test (kd 0.2) is a controller-only change, and a geometry
      change would confound it. If the kd 0.2 race returns about 69 with line loss
      at or below 1 per run, the geometry is confirmed as the platform. Body width
      does not move the off-track limit, max(0.06, 0.0125 + body_width/4) = 0.06 m
      across your range, so it is not a lever. Expected result for this candidate:
      no outcome is stated here; the score will reflect the kd change.


      ### Requested changes


      - Hold the iteration 1 geometry unchanged: five 12 mm sensors at x = -0.03,
      -0.015, 0, 0.015, 0.03 m, y = 0.05 m, with the wheel, body and mass values as
      they are.

      - Do not move the forward offset (y = 0.03 m cost about 10 points in iteration
      3) or the footprint (16 mm cost about 15 points in iteration 2) without a controller-based
      reason.

      - If the next race shows line_loss_events clearly below 1 per run, you may test
      one single geometry change later, such as wheel_track, since dynamics levers
      are untested. If line loss is unchanged, keep the geometry and leave line-loss
      handling to the Integrator.


      - [Open this output](iteration-9/entityR1/versions/00c96b48930d4c71b298fc533a2c4cfc/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/392ccad8e4e94bc0b80a78c2a22df8c2/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-2c5dd6043b5bbd9d/payload.json)'
