map:
  id: race-221-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: 16mm sensors, ±0.03 span
    notes: 'Keeps the ±0.03 m span that raised the score from 54.4 to 69.3 and changes
      only sensor_size to 0.016, following the Integrator''s rule for persistent line
      loss at about 1 event per run. The controller also changed this iteration, so
      the result will mix both effects.


      ### Rationale


      Iteration 1 (sensor span widened from ±0.024 m to ±0.03 m) raised the race score
      from 54.37 to 69.32, so the span change helped. It did not remove the failure.
      Every trial still ended off track at 0.10 to 0.25 progress, with line_loss_events
      at about 1 per run on s-bend and slalom and 1.65 on oval. max_error still reaches
      the 0.06 m limit, and rms_error (0.026 to 0.034 m) and steering_oscillation
      (about 0.14) are modest. The failure is still an abrupt loss of the tape, not
      jitter.


      The Integrator''s rule for this case applies. Line loss persists at about 1
      per run after the span change, so I am testing sensor_size 0.016 with the span
      held at ±0.03 m and the forward offset at 0.05 m. A 16 mm footprint keeps the
      25 mm tape under each sensor for longer as the line moves across the array,
      which should reduce the sudden loss. This race also carries the Integrator''s
      lower base_speed and kp, so the result will mix the controller and the geometry.
      I am keeping the geometry change to one variable so its effect can still be
      read.


      I took the Integrator''s advice this time. I also correct my iteration 0 and
      1 limit arithmetic: the off-track limit is max(0.06, 0.0125 + body_width/4).
      Even at body_width 0.18 that is 0.06 m, so body_width is not a lever and I am
      not changing it. Wheel track, wheel radius, mass and body stay unchanged because
      the evidence does not point at them.


      Expected result: line_loss_events falls toward 0 to 0.5 per run, progress rises,
      and max_error stays under about 0.06 m for more of each run. Hypothesis: the
      failures come from the footprint losing the tape at the array edges, not from
      the array span alone.


      - [Open this output](iteration-2/entity0/versions/b162d964dd364cf7b9733f24583a5206/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-2f0b03ed4ae07fd4/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-2a024531fceb669c/payload.json)'
  - id: entity1
    label: Wider span, gentler gains
    notes: 'Uses the Builder''s ±0.03 m span as supplied, and lowers base speed and
      kp while raising kd to reduce the line-loss-then-drift failure. Based on the
      baseline where all 60 trials lost the line once and went off track at about
      0.15 progress.


      ### Rationale


      The baseline (iteration 0, score 54.37) failed the same way on all three development
      tracks. Every one of the 60 trials lost the line once, drifted to max_error
      of about 0.062 to 0.064 m, and went off track at 10 to 15 percent progress.
      rms_error (0.02 to 0.028 m) and steering_oscillation (0.10 to 0.14) are modest,
      so the robot is not oscillating itself into failure. The failure is a single
      abrupt loss of the tape followed by drift past the 0.06 m limit. Because progress
      is only about 0.15, most of the score comes from the 250*progress term, so the
      priority is surviving longer. The Builder''s geometry now widens the sensor
      span to ±0.03 m, which should reduce line loss. I am not changing the geometry,
      since it is the Builder''s proposal and I must integrate it as supplied. On
      the controller side, I lower base_speed from 1.5 to 1.3 so the robot spends
      less distance at a speed where one overshoot can take it off the tape. I also
      lower kp from 3.0 to 2.5 to reduce the aggression that can cause the overshoot,
      and raise kd from 0.25 to 0.3 for damping. The signal weights stay at -1, -0.5,
      0, 0.5, 1 because they match the widened span''s sign and scale. line_loss stays
      at last_direction, which suits bends. The trade-off is that a slower base_speed
      may fall short of the 1.5 m/s needed to finish within 3 s. I accept that for
      now, because no run has finished yet and surviving longer is the bigger gain.
      The expected result is fewer line-loss events and higher progress, but this
      is a design prediction, not a measured outcome. The change is confounded with
      the geometry change, so the next iteration should compare against the baseline
      with that in mind.


      - [Open this output](iteration-1/entity1/versions/16eaeee2b7f341c9b80f2a0ae7f2ef61/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/c771f35dd460414f8f593653d8cc7b70/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-ca41e5e4cf960173/payload.json)'
  - id: entityR1
    label: Span test, footprint next
    notes: 'Feedback cites the baseline line-loss failure and asks for the wider span
      with the offset held, then a larger footprint if loss persists. It also corrects
      the off-track limit arithmetic (0.06 m, not 0.0525 m).


      ### Feedback


      The baseline result (iteration 0, score 54.37) is the evidence for this feedback.
      All 60 trials on oval, s-bend and slalom lost the line once, reached max_error
      of about 0.062 to 0.064 m, and went off track at 10 to 15 percent progress.
      rms_error and steering_oscillation were modest, so the failure is an abrupt
      line loss, not steady jitter. Widening the span to ±0.03 m is a sound response
      to that. The Integrator has also lowered base_speed and kp slightly in this
      iteration, so any change in result will be partly due to the controller and
      not only the geometry. Your off-track limit arithmetic should read max(0.06,
      0.0125 + 0.14/4) = max(0.06, 0.0475) = 0.06 m, not 0.0525 m, so body_width does
      not move the limit at this width. Do not treat that as a lever. Next race: if
      line_loss_events falls and progress rises, keep the ±0.03 m span and test the
      forward offset as a separate change. If line loss persists at ±0.03 m, the footprint
      is more likely the limit than the span, so test sensor_size 0.016 with the span
      held. Hold the wheel track, mass and body, because the evidence does not point
      at them.


      ### Requested changes


      - Keep the ±0.03 m span and 15 mm spacing, and hold the forward offset at 0.05
      m for this race so the span effect can be read alongside the controller change.

      - If line_loss_events is still about 1 per run after this race, test sensor_size
      0.016 with the span unchanged, since larger footprints keep the 25 mm tape under
      a sensor for longer.

      - If steering_oscillation rises at speed after the span change, test a forward
      offset of about 0.03 m as a separate change, not together with a footprint change.


      - [Open this output](iteration-1/entityR1/versions/16eaeee2b7f341c9b80f2a0ae7f2ef61/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/c771f35dd460414f8f593653d8cc7b70/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-ca41e5e4cf960173/payload.json)'
