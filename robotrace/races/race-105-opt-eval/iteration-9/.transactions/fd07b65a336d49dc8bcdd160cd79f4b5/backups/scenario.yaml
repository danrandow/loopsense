map:
  id: race-105-opt-eval
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: kd 0.6 at y 0.07, base
    notes: 'Reverts the sensors to y 0.07 (y 0.075 cut slalom progress to 0.328 in
      iteration 8, below the 0.39 threshold) and tests kd 0.6 as the single change
      from the best design, iteration 6 (683.7). Based on the iteration 6 and 8 race
      telemetry and the Evaluator''s suggested next lever.


      ### Rationale


      Evidence. Iteration 8 (sensors y 0.075, base 0.9, kp 1.4, kd 0.5) scored 671.4,
      below the iteration 6 best of 683.7 (sensors y 0.07, same controller). The oval
      and s-bend both finished 20/20 with s-bend oscillation down to 0.26 (from 0.29),
      so the extra lead was mildly helpful on the s-bend. The slalom, however, fell
      from progress 0.392 to 0.328, with max_error still at the 0.064 mean and off_track
      in all 20 runs. The Evaluator''s rule (keep y 0.075 only if slalom progress
      is at or above 0.39) is not met, so the sensors return to y 0.07. The entityR1
      approval of y 0.075 was written before this race and is superseded by the result.
      Off-track limit is max(0.06, 0.0125 + 0.12/4) = 0.06 m, so body width cannot
      help.


      Change. Single-variable step from the best measured design (iteration 6): sensors
      back to y 0.07, base_speed 0.9, kp 1.4, ki 0, line_loss last_direction, weights
      [-2,-1,0,1,2], sensor x positions and 16 mm footprints unchanged. Only kd moves,
      from 0.5 to 0.6. This is the lever the Evaluator named after base_speed 0.85
      and y 0.075 both failed to lift the slalom. Speed 0.85 cut slalom progress to
      0.364, and lead y 0.075 cut it to 0.328, so the 0.9 / y 0.07 point looks like
      a local optimum for the slalom, and extra damping is the untested variable there.


      Expected result. Oval and s-bend stay at 20/20 finishes (about 2.0 s and 2.25
      s). Slalom progress is at or above 0.39, with a chance of some finishes if the
      extra damping reduces the sharpest-bend overshoot. Hypotheses: (1) kd 0.6 keeps
      the slalom progress near or above 0.39 with lower oscillation; (2) if oval or
      s-bend completion time rises above 2.4 s or oscillation rises above about 0.35
      on the s-bend, damping is over-sensitive and kd returns to 0.5; (3) if slalom
      progress stays near 0.39 with no finishes, the limit is the slalom''s sharpest
      turn geometry, and the next probe would be a sensor span change, not gain.


      Measurements wanted, per track: completion, progress, completion_time, rms_error,
      max_error, line_loss_events, steering_oscillation, control_effort, controller_errors
      and noise_robustness, so the kd effect on the slalom can be separated from the
      s-bend and oval.


      - [Open this output](iteration-9/entity0/versions/267ddac98e1e4ee4935c8a0a967f9c2a/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-757151d909e1ae2c/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-59d7b2e8fb7d7b77/payload.json)'
  - id: entityR1
    label: Approve sensors y 0.075
    notes: 'Approved a single-variable step from the best raced design (iteration
      6, 683.7): sensors moved from y 0.07 to 0.075 with base_speed 0.9 held. Iteration
      5 showed lead helped the s-bend and iteration 7 showed base_speed 0.9 is the
      best slalom speed, so the candidate is valid and at least as plausible as the
      best design.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      best raced design is iteration 6 (score 683.7): base_speed 0.9, kp 1.4, kd 0.5,
      sensors at y 0.07, weights [-2,-1,0,1,2], line_loss last_direction. Iteration
      7 (base_speed 0.85, score 679.8) finished 20/20 on the oval and s-bend, but
      slalom progress was 0.364 against 0.392 at base_speed 0.9, so 0.9 is the best
      measured speed for the slalom. Iteration 5 (y 0.05 to 0.07 at base 1.0) showed
      that lead improved the s-bend (finishes 15 to 19 of 20, oscillation 0.38 to
      0.32) and left the slalom at about 0.31. This candidate is a single-variable
      step from the best design: it keeps iteration 6''s controller and moves the
      sensors from y 0.07 to y 0.075. The gain is expected to be small, and the slalom
      remains the limiting track. The off-track limit is max(0.06, 0.0125 + 0.12/4)
      = 0.06 m, and widening the body cannot raise it above 0.0575 m. The candidate
      is valid and at least as plausible as the best design, so approve it to race.
      After the race, read it as follows. If s-bend finishes hold at 19 to 20 of 20
      with oscillation under about 0.4, and the slalom progress is at or above 0.39,
      keep y 0.075. If s-bend finishes fall below 18 of 20 or s-bend steering_oscillation
      exceeds about 0.5, return the sensors to y 0.07. If the slalom stays near 0.39
      with low oscillation, the next lever is kd 0.6 at base_speed 0.9, not further
      speed reduction, because base_speed 0.85 already showed that speed no longer
      helps.


      ### Requested changes


      - Keep base_speed 0.9, kp 1.4, kd 0.5 and line_loss last_direction as in iteration
      6. Move all five sensors to y 0.075 and keep the x positions and 16 mm footprints,
      since iteration 5 showed lead helped the s-bend without moving the slalom.

      - If s-bend finishes fall below 18 of 20 or steering_oscillation exceeds about
      0.5, return the sensors to y 0.07. Iteration 5 showed the s-bend tolerated y
      0.07 with 19 of 20 finishes.

      - If slalom progress stays near 0.39 with low oscillation, test kd 0.6 at base_speed
      0.9 with the sensors at the better of y 0.07 or 0.075. Iteration 7 showed that
      base_speed 0.85 reduced slalom progress to 0.364, so speed is no longer the
      lever.


      - [Open this output](iteration-8/entityR1/versions/13d9ec4f722a4ec59db708ab104ee34a/payload.json)

