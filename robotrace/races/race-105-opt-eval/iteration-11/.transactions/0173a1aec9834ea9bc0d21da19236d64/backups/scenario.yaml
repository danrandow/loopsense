map:
  id: race-105-opt-eval
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: 'Final: lock iteration 6'
    notes: 'Locks the best raced design (iteration 6, score 683.7) with sensors at
      x ±0.032 m, since widening to ±0.040 m (iteration 10) cut slalom progress from
      0.392 to 0.248. The Evaluator''s stale ±0.040 approval was superseded by that
      race result.


      ### Rationale


      Final iteration. The outer-span lever has now been tested. Iteration 10 (outer
      sensors at x ±0.040 m, otherwise iteration 6) scored 661.1, below iteration
      6''s 683.7. Its slalom progress fell from 0.392 to 0.248, so the Evaluator''s
      approval of the ±0.040 candidate, written before it raced, is stale. The Evaluator''s
      decision rule also says to lock iteration 6''s settings if the slalom does not
      move past 0.39, and that condition is met. Earlier single-variable tests all
      either lowered the slalom or left it flat: base_speed 0.85 (0.364), y 0.075
      (0.328), kd 0.6 (0.351). Iteration 6 is the best raced design. It finished 20/20
      on the oval (1.99 s) and 20/20 on the s-bend (2.25 s), and the s-bend margin
      is comfortable. Because this design produces the final unseen-track race and
      no later iteration can correct it, I lock iteration 6''s settings exactly: base_speed
      0.9, kp 1.4, ki 0, kd 0.5, sensors at y 0.07 with x ±0.032 m and 16 mm footprints,
      weights [-2,-1,0,1,2], and line_loss last_direction. Body, wheel and mass values
      are unchanged. Expected result: about 20/20 on the oval and s-bend, and slalom
      progress near 0.39 with off_track still the likely end. The off-track limit
      is max(0.06, 0.0125 + 0.12/4) = 0.06 m, so body width cannot help. Hypotheses
      to check if further data existed: the slalom is limited by its sharpest turns,
      where max_error reaches the 0.06 m limit, and no tested single lever has moved
      it past 0.39. Measurements requested per track are the full set, so the held-back-track
      robustness of this design can be read.


      - [Open this output](iteration-11/entity0/versions/7aecba73165c4a63a087e5d3fe863664/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-31b5742ff6ea0e42/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-a224d808545f9b5f/payload.json)'
  - id: entityR1
    label: Approve wider outer
    notes: 'Approves the single-variable test of outer sensor span (x ±0.032 to ±0.040
      m) on the best raced design (iteration 6, 683.7). The slalom, which goes off-track
      on every run, is the only track not yet passing, and iterations 7 to 9 showed
      that speed, sensor lead and damping do not lift it past about 0.39 progress.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      candidate is iteration 6''s controller (base_speed 0.9, kp 1.4, ki 0, kd 0.5,
      line_loss last_direction, weights [-2,-1,0,1,2]) with sensor y held at 0.07
      and only the outer sensors widened from x = ±0.032 to ±0.040 m. Geometry is
      valid: x is within ±0.08, the footprint is 16 mm, and there are five sensors
      matching five weights. Iteration 6 is the best raced design (683.7). Its slalom
      went off_track in all 20 runs at progress 0.392, while its oval and s-bend both
      finished 20/20. Iteration 9 (kd 0.6) lowered slalom progress to 0.351, and iterations
      7 and 8 (base_speed 0.85; y 0.075) also lowered it. Lateral reach is the lever
      not yet tested on the slalom. The off-track limit is max(0.06, 0.0125 + 0.12/4)
      = 0.06 m, so body width cannot help. The change is a single-variable step from
      the best design, so any shift in results is attributable to sensor span. Approve
      it: it is valid, it tests the one remaining lever, and only one iteration follows
      this one, so race telemetry is worth more than another review round. Read the
      race as follows. If s-bend finishes fall below 18 of 20, or s-bend steering_oscillation
      exceeds about 0.35, the outer sensors are reacting to the tape on curves too
      early, so return x to ±0.032 m and keep iteration 6''s settings for the final
      iteration. If slalom progress rises above about 0.40 while the oval and s-bend
      stay at 20/20, keep ±0.040 m for the final iteration. If slalom progress stays
      near 0.39 with no change, the slalom geometry is the limit, and the final iteration
      should lock iteration 6''s settings.


      ### Requested changes


      - Keep base_speed 0.9, kp 1.4, ki 0, kd 0.5, y 0.07 and line_loss last_direction
      as in iteration 6. Widen the outer sensors from x ±0.032 to ±0.040 m, because
      iteration 6 is the best design (683.7) and its slalom progress (0.392) is the
      only lever left untested.

      - If the s-bend finishes fall below 18 of 20, or s-bend steering_oscillation
      exceeds about 0.35, return x to ±0.032 m. Iteration 5 (y 0.07, x ±0.032) held
      s-bend finishes at 19 of 20, and iteration 9 (kd 0.6) showed that extra turn
      gain costs the slalom.

      - If slalom progress rises above about 0.40 with the oval at 20/20 and the s-bend
      at 18/20 or better, keep x ±0.040 m for the final iteration. If slalom progress
      stays at about 0.39 or below, lock iteration 6''s settings (x ±0.032 m) for
      the final iteration, since no tested lever has moved the slalom past 0.39.


      - [Open this output](iteration-10/entityR1/versions/e10014886b704047aeb11975316a47aa/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/d3bc12bfd1d948649edf498ce4620df6/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-19aa338416466ea7/payload.json)'
