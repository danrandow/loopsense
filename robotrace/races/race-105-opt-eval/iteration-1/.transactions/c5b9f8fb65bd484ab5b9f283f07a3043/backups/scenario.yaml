map:
  id: race-105-opt-eval
  schema: v0.2
  scenario: Iteration 1
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 0.
dimensions:
  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Softer steer, wider
    notes: 'Iteration 0 went off track in all 60 trials at progress about 0.1 to 0.15,
      with max_error at the 0.06 m limit. This candidate lowers kp to 1.2, raises
      kd to 0.3, drops base_speed to 1.2 and widens the sensors to ±0.032 m to stop
      the early drift-off.


      ### Rationale


      Evidence from the development simulator (entityR2A, 60 trials): every trial
      on every track ended off_track, with finish_rate 0.0 and progress only 0.105
      to 0.145. max_error sat at about 0.06 m, which is exactly the off-track limit
      max(0.06, 0.0125 + 0.12/4) = 0.06 m. Each run logged one line-loss event, and
      the robot left the line early and never recovered. The failure is therefore
      an early loss of tracking, not slow speed. Likely causes: (1) kp 2.0 at base_speed
      1.4 gives large, fast turn commands (up to about 1400 PWM difference), which
      probably overshoot and push the robot off the tape; (2) kd 0.1 is too weak to
      damp that; (3) the 5 sensors span only ±0.024 m with 12 mm footprints, so the
      robot has little warning when the line drifts sideways. Changes in this candidate:
      kp 2.0 to 1.2 to soften the steering response; kd 0.1 to 0.3 to damp the turn
      command; base_speed 1.4 to 1.2 so the robot has time to correct on bends (this
      gives up some completion-time margin, which is an accepted trade-off because
      finishing matters more than speed at this stage); sensors widened to ±0.032
      m with 16 mm footprints so the tape stays under at least one sensor during larger
      deviations, following the Evaluator''s advice on line loss. Sensor weights stay
      [-2, -1, 0, 1, 2] to match the sensor order, and line_loss stays ''last_direction''
      so the only changes are the ones aimed at the observed failure. Expected result:
      fewer or no off-track ends, max_error below 0.06 on the oval and s-bend, and
      line_loss_events reduced toward zero. Hypotheses to check next: if the robot
      still drifts with low oscillation, kp is too low (raise toward 1.5); if steering_oscillation
      is high, kd is too low or kp too high; if it finishes with completion_time above
      3 s, raise base_speed to about 1.5 to 1.6. Measurements requested: completion,
      progress, completion_time, rms_error, max_error, line_loss_events, steering_oscillation.


      - [Open this output](iteration-1/entity0/versions/155ef78f21b442e9ae7183bbb1e5c8e7/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-1aeaae99c91deaab/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-9275287223fa8dba/payload.json)'
  - id: entityR1
    label: 'Approve: softer steer'
    notes: 'Approved the widened-sensor, lower-kp, higher-kd candidate, since iteration
      0 (all 60 trials off_track at progress about 0.13) left no finishing evidence
      and this change targets the observed early line loss. The feedback gives the
      next-race rules for kp, kd and base_speed.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated. The earlier
      race (iteration 0, entityR2B) ended all 60 trials off_track with progress 0.105
      to 0.145 and about one line-loss event per run. The max_error of about 0.06
      m equals the off-track limit, so the failure is an early loss of the line rather
      than slow running. This candidate changes the steering and sensing that drove
      that failure. kp drops from 2.0 to 1.2, which cuts the turn command for a full-scale
      signal from about 1400 PWM to about 840. kd rises from 0.1 to 0.3 to damp that
      response. The sensors widen from x = ±0.024 m to ±0.032 m, with 16 mm footprints,
      so the tape stays under a sensor during larger drifts. base_speed drops to 1.2
      (about 60% PWM), which gives up completion-time margin. Given that finishing
      has not yet happened once, that trade is reasonable. The candidate is valid,
      every value is within its public range, and the change targets the observed
      failure directly. Its geometry and controller are otherwise unchanged from iteration
      0, so the race can attribute any change in outcome to these edits. Approve it
      so the first finishing evidence arrives. After the race, read the result as
      follows. If line_loss_events stays at 1 or more and max_error still reaches
      0.06 m, kp is too low for the bends: raise kp toward 1.5 and keep kd at 0.3.
      If steering_oscillation is high (above about 0.15) with max_error close to the
      limit, the robot is overcorrecting: lower kp toward 1.0 or raise kd toward 0.4.
      If the robot finishes but completion_time is above 3 s, raise base_speed toward
      1.5 to 1.6, since the 3 s limit needs about 1.5 m/s on average. Do not change
      geometry again until the controller has been tuned on the new sensor spread.


      ### Requested changes


      - If the next race still shows line_loss_events of 1 or more and max_error near
      0.06 m (the iteration 0 failure pattern), raise kp from 1.2 to about 1.5 and
      keep kd at 0.3, because iteration 0 lost the line at kp 2.0 with kd 0.1 and
      the steering response needs to be stronger than at 1.2 on the tighter bends.

      - If steering_oscillation is high (above about 0.15) while the robot still stays
      on the line, lower kp to about 1.0 or raise kd to about 0.4 to damp the turn
      command, which the iteration 0 telemetry suggests is too aggressive at kp 2.0.

      - If the robot finishes with completion_time above 3 s, raise base_speed from
      1.2 to about 1.5 to 1.6, since 3 s over about 4.5 m needs roughly 1.5 m/s on
      average, and keep kp and kd fixed while doing so.


      - [Open this output](iteration-1/entityR1/versions/1e9140b75da443109f38f5e0e304df48/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/155ef78f21b442e9ae7183bbb1e5c8e7/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-9275287223fa8dba/payload.json)'
