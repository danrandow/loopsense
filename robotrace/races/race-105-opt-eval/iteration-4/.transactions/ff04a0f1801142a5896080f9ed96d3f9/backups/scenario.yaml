map:
  id: race-105-opt-eval
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: kp 1.6 for slalom drift
    notes: 'Raises kp from 1.4 to 1.6 and holds kd 0.4 and base_speed 1.0, with geometry
      unchanged, to target the slalom failure (progress 0.17, off-track on every trial).
      The oval finished 20/20 and the s-bend 17/20 at iteration 2, so the change is
      aimed at the one track that fails.


      ### Rationale


      Evidence from iteration 2 (entityR2A, 60 trials, score 625.2): the oval finished
      20 of 20 at a mean of 1.95 s, which is well inside the 3 s limit. The s-bend
      finished 17 of 20 (progress 0.97) but its steering_oscillation was high at 0.42.
      The slalom failed on every trial (progress 0.17, off_track, max_error about
      0.0615 m, one line-loss event per run), and its oscillation was 0.15, which
      is at the Evaluator''s threshold. The failure is an early drift off the line
      on the slalom, not jitter. Iteration 1 (kp 1.2) and iteration 2 (kp 1.4) both
      stopped the slalom at about 17% progress, so the robot is not holding the line
      through the slalom''s sharp direction changes at these gains. Following the
      Evaluator''s rule for low-jitter off-track failures, this candidate raises kp
      from 1.4 to 1.6 and keeps kd at 0.4 and base_speed at 1.0. The kp step should
      give a stronger correction on the slalom. Keeping kd at 0.4 avoids adding damping
      on top of the change, so the race isolates the kp effect. Geometry is unchanged,
      so any change in the result comes from the controller. Expected result: slalom
      progress rises above 0.17 and some runs finish, with max_error below 0.06 m
      and line_loss_events falling toward zero. Oval should still finish under 2.2
      s. Risk: the s-bend oscillation (0.42) may rise with kp. If it does, the next
      step is kd toward 0.5 with kp held at 1.6. Hypotheses to check: (1) kp 1.6 should
      reduce slalom off-track events; (2) if s-bend oscillation rises above 0.5 while
      the robot stays on the line, kd is the limiting term; (3) if the oval completion
      time rises above 3 s, base_speed is too low. Measurements requested: completion,
      progress, completion_time, rms_error, max_error, line_loss_events, steering_oscillation,
      control_effort, controller_errors, and noise_robustness, all per track.


      - [Open this output](iteration-3/entity0/versions/53579d79f00240668a0a06fed112aad1/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-bf091be94c9fb21d/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-bfe89d494e4c0272/payload.json)'
  - id: entityR1
    label: Approve kp 1.6 step
    notes: 'Approves the single-field kp step from 1.4 to 1.6 on the best raced geometry,
      targeting the slalom drift seen in iteration 2 (score 625.2, slalom progress
      0.17 with low jitter). Next-step rules cover slalom drift, s-bend oscillation
      above 0.42, and oval completion time.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated. The best raced
      design is iteration 2 (score 625.2): the oval finished 20 of 20 at a mean of
      1.95 s, the s-bend finished 17 of 20 with steering_oscillation 0.42, and the
      slalom went off_track on every trial with progress 0.17, max_error about 0.0615
      m and one line-loss event per run. This candidate changes one field, kp from
      1.4 to 1.6, and keeps kd 0.4, base_speed 1.0, line_loss ''last_direction'' and
      the iteration 2 geometry. Any change in result therefore comes from kp. The
      slalom failure is an early drift at low jitter (0.15), and iteration 1 (kp 1.2)
      and iteration 2 (kp 1.4) both stopped it near 17% progress, so a stronger correction
      is the right direction. The main risk is the s-bend, which already oscillates
      at 0.42 (above the 0.15 threshold), and a higher kp may push that further. Approve
      it: it is a single-step change from the best design, it is valid, and the race
      will show whether kp is the limit on the slalom. After the race, read the result
      as follows. If the slalom still ends off_track with steering_oscillation at
      or below about 0.15 and progress is still low, raise kp toward 1.8 with kd held
      at 0.4. If the s-bend oscillation rises above about 0.5 while the robot stays
      on the line, raise kd toward 0.5 with kp held at 1.6, since kd is the damping
      term that is missing. If the oval completion_time rises above about 2.5 s or
      the oval fails, base_speed is too low and should move toward 1.1 to 1.2.


      ### Requested changes


      - If the slalom still ends off_track at low steering_oscillation (at or below
      about 0.15), raise kp from 1.6 toward 1.8 and keep kd at 0.4, because kp 1.2
      and kp 1.4 both stopped the slalom at about 17% progress with max_error near
      0.06 m.

      - If s-bend steering_oscillation rises above about 0.5 (iteration 2 measured
      0.42) while the robot stays on the line, raise kd from 0.4 to about 0.5 with
      kp held at 1.6, to damp the turn command without removing the steering gain.

      - If the oval completion_time rises above about 2.5 s or the oval stops finishing,
      raise base_speed from 1.0 toward 1.1 to 1.2, keeping kp and kd fixed, since
      base_speed 1.2 gave 1.88 s and base_speed 1.0 gave 1.95 s on the oval.


      - [Open this output](iteration-3/entityR1/versions/8baeb83458344ef4bde345d5e3ae27cd/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/53579d79f00240668a0a06fed112aad1/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-bfe89d494e4c0272/payload.json)'
