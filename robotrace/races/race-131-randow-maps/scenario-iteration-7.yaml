  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Sensor bar to y=0.06 m
    notes: 'Moves the sensor bar forward from y=0.04 to y=0.06 m for lead and restores
      wheel_radius to 0.030 m, since iteration 6 gave no progress gain and the lowest
      score (53.1057). Follows the Integrator''s rule that a non-rising progress points
      to the sensor-lag test, and rests on the 420 trials showing max_error pinned
      at the 0.06 m floor across all earlier geometry changes.


      ### Rationale


      Evidence from iterations 0 to 6 (420 trials, all off_track): max_error stays
      pinned at the 0.060 to 0.068 m off-track floor, and line_loss_events stays at
      1 per run after the footprint change. Pitch (10 to 20 mm), footprint (12 to
      16 mm), track (0.12 to 0.10 m), gain (kp 1.4), and mass (0.8 to 0.4 kg) have
      each left these unchanged. Iteration 6, which raised wheel_radius to 0.035 m,
      was the lowest score so far (53.1057). Its progress (0.110 to 0.163) did not
      rise, and the oval and slalom progress fell slightly. The Integrator''s rule
      for this case says that if progress does not rise, the speed hypothesis is weakened
      and the sensor bar move is the next step. I therefore revert wheel_radius to
      0.030 m, since the larger wheel gave no benefit and cost some score. I keep
      mass 0.4 kg, the 0.016 m footprint, the 20 mm pitch (x = -0.04 to +0.04), and
      track 0.10 m. I move the sensor bar forward from y = 0.04 m to y = 0.06 m. The
      sensors then read the line 0.06 m ahead of the axle instead of 0.04 m, which
      adds roughly 9 ms of lead at 1.5 m/s and gives earlier correction on the bends.
      This is the only geometry change, so the race attributes any result to lead.
      Expected result: line_loss_events falls toward 0 and max_error drops below about
      0.06 m. The off-track limit stays fixed at 0.06 m, since body_width cannot lift
      it in range. If the line loss persists at 1 per run with max_error still at
      the floor, the next step is to test whether the controller, not the geometry,
      is the limit, which is outside this role.


      - [Open this output](iteration-7/entity0/versions/3f8f50d1438846f0bf0269d4934eb236/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-9906dfe4bf59a7f4/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-68b4fb0d6f5b466e/payload.json)'
  - id: entity1
    label: Complete Robot Package
    notes: 'Complete Robot Package. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iterations 0 to 6 (420 trials, all off_track) show max_error pinned at the 0.060
      to 0.068 m off-track floor and one line-loss event per run from iteration 3
      onward. Pitch (10 to 20 mm), footprint (12 to 16 mm), track (0.12 to 0.10 m),
      kp (1.2 to 1.4), mass (0.8 to 0.4 kg) and wheel_radius (0.030 to 0.035 m) each
      left these unchanged. Iteration 6 raised wheel_radius with no progress gain
      (0.10 to 0.16 band), so the speed hypothesis is weakened. The Builder''s entity0
      moves the sensor bar forward from y = 0.04 m to y = 0.06 m, the only geometry
      change from iteration 5 apart from reverting wheel_radius to 0.030 m. I build
      exactly that geometry: x = -0.04 to +0.04 at 20 mm pitch, sensor_size 0.016,
      wheel_track 0.10 m, wheel_radius 0.030 m, body 0.18 x 0.12 m, mass 0.4 kg. The
      controller is held at the iteration 5 and 6 values (kp 1.4, ki 0.05, kd 0.15,
      base_speed 1.6, weights [-2,-1,0,1,2], last_direction) so any change is attributable
      to sensor lead. Expected: line_loss_events toward 0 and max_error below about
      0.06 m, but I make no claim about the outcome, since nothing has raced for this
      design.


      - [Open this output](iteration-7/entity1/versions/4215dcd8007040fa957f650082c534f5/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/3f8f50d1438846f0bf0269d4934eb236/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-68b4fb0d6f5b466e/payload.json)'
  - id: entityR1
    label: Integration Feedback
    notes: 'Integration Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Iterations
      0 to 6 (entityR2B scores 53.612, 53.3955, 53.3054, 53.2728, 53.5316, 53.6775,
      53.1057) all ended off_track in every trial. max_error stayed at 0.060 to 0.068
      m, and line_loss_events was 1 per run from iteration 3 on. Steering_oscillation
      stayed at 0.07 to 0.16, so the robot drifts rather than jitters. Pitch (iterations
      0 to 2), footprint (iteration 3), track (iteration 1), gain (iteration 2), mass
      (iterations 4 and 5) and wheel_radius (iteration 6, no progress gain) have not
      moved max_error. The lead test is the only remaining geometry lever. Read the
      next race as follows. If line_loss_events falls to 0 and max_error drops below
      about 0.06 m, keep y = 0.06 m and test further lead. If line losses persist
      at 1 per run with max_error still at the floor, lead alone is not enough, so
      do not repeat pitch, footprint, track, mass or wheel_radius changes, since each
      has been tested. Instead, test the footprint extreme.


      ### Requested changes


      - If line_loss_events is 0 and max_error is below about 0.06 m, try sensor positions
      at y = 0.08 m (the contract maximum) with x = -0.04 to +0.04 and the other fields
      unchanged. Evidence: the iteration 7 lead move from y = 0.04 to 0.06 m is the
      only lever that could reduce lag, and steering_oscillation of 0.07 to 0.16 leaves
      room for more lead.

      - If line_loss_events is still 1 per run and max_error stays at the floor, try
      sensor_size 0.008 at y = 0.06 m with the same x positions. Evidence: 12 mm and
      16 mm footprints both gave 1 line loss per run (iterations 2 and 3), so the
      8 mm finer footprint is the one size not yet tested.

      - Do not raise wheel_radius above 0.030 m again or narrow wheel_track below
      0.10 m. Evidence: wheel_radius 0.035 gave no progress gain and a lower score
      (iteration 6, 53.1057), and narrowing the track gave no max_error gain (iteration
      1).


      - [Open this output](iteration-7/entityR1/versions/4215dcd8007040fa957f650082c534f5/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/3f8f50d1438846f0bf0269d4934eb236/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-68b4fb0d6f5b466e/payload.json)'
