map:
  id: race-131-randow-maps
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Wider bar, narrower track
    notes: 'Widens the sensor bar to 15 mm pitch (+/-0.03 m) and narrows the wheel
      track to 0.10 m with mass 0.7 kg. Iteration 0 drifted off the line on every
      track (off_track 60/60, max_error at the 0.06 m limit), so this targets sensor
      coverage and turn authority. Evidence is the R2A trial summary.


      ### Rationale


      The iteration-0 race evidence (entityR2A) shows all 60 trials ended off_track
      on every development track, with progress of only 10 to 18 percent. The max_error
      of about 0.06 m sits on the off-track limit, and rms_error is about 0.03 m.
      Line_loss_events averaged 1 to 2 per run, and steering_oscillation stayed low
      (0.07 to 0.16). So the robot is not jittering. It drifts steadily off the line
      and loses it, and the line is lost only once it is already far from centre.
      The 5-sensor bar spans only +/-0.02 m. With a 12 mm footprint, all sensors go
      dark at a tape-centre offset of about 0.045 m, which is close to the 0.06 m
      limit and leaves almost no recovery margin. I therefore widen the bar to 15
      mm pitch, spanning +/-0.03 m. This keeps the tape visible to the sensors at
      larger offsets, so the signal does not drop out before the controller can respond.
      Second, the drift could partly reflect weak turn authority. Turn rate is the
      wheel speed difference divided by wheel_track, so narrowing the track from 0.12
      to 0.10 m gives more yaw per unit of PWM command. I also lower mass to 0.7 kg
      to reduce yaw inertia. I keep the forward offset at 0.04 m and the footprint
      at 12 mm so that the two changes can be attributed separately. The wheel radius
      stays at 0.03 m. Expected result: fewer line_loss_events, lower max_error, and
      progress above 0.5 on the oval and s-bend. The next race will show whether the
      pitch change or the track change does most of the work.


      - [Open this output](iteration-1/entity0/versions/71799e5c673d4e9eac5a9277b8b397c2/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-6ec26a1753e17d82/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-32824ce60e8061cb/payload.json)'
  - id: entity1
    label: 15mm pitch, 0.10m track
    notes: 'Applies the Builder''s proposed 15 mm sensor pitch, 0.10 m wheel track
      and 0.7 kg mass, with the controller unchanged to isolate the geometry effect.
      Based on iteration 0''s off-track drift with max_error near 0.06 m and 1 to
      2 line-loss events.


      ### Rationale


      Iteration 0 (entityR2A/entityR2B) ended off_track in all 60 trials on oval,
      s-bend and slalom, with progress 0.10 to 0.18 and steering_oscillation of only
      0.07 to 0.16. The robot is not jittering. It drifts steadily away from the line
      and loses it, with max_error about 0.061 to 0.066 m, right at the 0.06 m off-track
      limit, and 1 to 2 line-loss events per run. The 5-sensor bar at 10 mm pitch
      spans only ±0.02 m, so all sensors go dark at a tape-centre offset of roughly
      0.045 m, leaving almost no recovery margin. I follow the Builder''s proposed
      fix in this iteration and widen the pitch to 15 mm (x = -0.03 to +0.03 m, ±0.03
      m span). I also narrow wheel_track from 0.12 to 0.10 m, which raises yaw per
      unit PWM by about 1.2x, and lower mass to 0.7 kg to reduce yaw inertia. The
      sensor weights stay at [-2,-1,0,1,2], the same as iteration 0, so the signal
      scale is unchanged and the geometry change is the only change in signal coverage.
      Gains stay at kp 1.2, ki 0.05, kd 0.1, base_speed 1.6 and line_loss last_direction,
      so the next race isolates the geometry change. The extra yaw authority from
      the narrower track partly offsets the drift, so I do not raise kp yet. Expected:
      fewer line_loss_events and lower max_error. If progress stays low while off_track
      endings persist, the next step is to raise kp or lower the forward offset, not
      to change the sensor pitch again. I make no claim about the outcome of this
      design.


      - [Open this output](iteration-1/entity1/versions/cd7d52878ced4144b1b3a5a75953e3f9/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/71799e5c673d4e9eac5a9277b8b397c2/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-32824ce60e8061cb/payload.json)'
  - id: entityR1
    label: Next-step geometry plan
    notes: 'Gives conditional changes for the next race: widen the pitch to 20 mm
      if line losses persist, narrow the track to 0.09 m if progress stays off_track
      limited, or shorten the forward offset if oscillation rises. Each condition
      is tied to the iteration 0 race evidence.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Iteration
      0 (entityR2A) showed all 60 trials ending off_track with max_error about 0.061
      to 0.066 m, line_loss_events of 1 to 2, and steering_oscillation of only 0.07
      to 0.16. The robot drifts steadily rather than oscillating, so the controller
      is not the main limit. For this candidate the Integrator widened the signal''s
      reach by moving to 15 mm pitch, but kept the weights at [-2,-1,0,1,2] and gains
      unchanged, so the race isolates the geometry change. Next race: if line_loss_events
      falls to 0 and max_error drops clearly below 0.06 m, keep the 15 mm pitch and
      try the 0.10 m track with a smaller forward offset, 0.02 m, to cut lag. If line_loss_events
      stays at 1 or more with max_error still near 0.06 m, the coverage is still too
      narrow, so widen the pitch to 20 mm (x = ±0.04) only if the footprint stays
      at 12 mm. If line losses are gone but progress stays low and endings are off_track,
      the limit is steering authority, so narrow the track further to 0.09 m before
      changing sensors again.


      ### Requested changes


      - If line_loss_events is still at 1 or more and max_error stays near 0.06 m,
      widen the pitch from 15 mm to 20 mm (x = -0.04, -0.02, 0, 0.02, 0.04 at y =
      0.04), since iteration 0 showed all sensors going dark at about 0.045 m offset
      with a 10 mm pitch.

      - If line_loss_events reaches 0 and progress is still limited by off_track,
      try wheel_track 0.09 m, since iteration 0''s steady drift and the 0.10 m track
      change point to too little yaw per unit PWM.

      - If steering_oscillation rises above about 0.2 after the track change, reduce
      forward offset from y = 0.04 to y = 0.02 m to cut lag, since iteration 0''s
      oscillation of 0.07 to 0.16 gives room to act only if the new yaw authority
      overshoots.


      - [Open this output](iteration-1/entityR1/versions/cd7d52878ced4144b1b3a5a75953e3f9/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/71799e5c673d4e9eac5a9277b8b397c2/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-32824ce60e8061cb/payload.json)'
