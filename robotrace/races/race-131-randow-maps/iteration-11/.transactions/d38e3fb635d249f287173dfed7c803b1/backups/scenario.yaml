overrides:
  entities:
  - id: entity0
    label: Revert to iter-9 platform
    notes: 'Final handover restores the best-raced geometry (iteration 9, score 363.7):
      ±0.04 m span, 16 mm footprint, y = 0.04 m, 0.10 m track, 0.4 kg. The wider ±0.06
      m span in iteration 10 cut the oval finish rate from 95 to 25 percent, so it
      is rejected.


      ### Rationale


      This is the final iteration, so the job is to hand the Integrator the geometry
      with the strongest race evidence. Iteration 9 (the best raced design, 363.7)
      ran on the 0.016 m footprint, 20 mm pitch at x = -0.04 to +0.04, y = 0.04 m,
      track 0.10 m, wheel radius 0.03 m and mass 0.4 kg. Its oval finished 19 of 20
      runs, and max_error on the oval fell to 0.037 m. Iteration 10 widened the span
      to x = ±0.06 m (30 mm pitch) and scored 209.7. The oval finish rate dropped
      to 25 percent and steering_oscillation rose to 0.32, while the s-bend line losses
      fell only from 1.0 to 0.1 and still ended off_track. So the wider span is a
      net loss on the tracks that matter most for the score. Every earlier geometry
      test (pitch, footprint, track, mass, wheel radius and lead) left max_error at
      the floor, so none of them offers a proven gain. I therefore revert the geometry
      to the iteration 9 platform. Its span of ±0.04 m is the only one with a measured
      oval finish rate near 95 percent. An untested intermediate span (for example
      ±0.05 m) would be a gamble on the final unseen track, so I do not propose it.
      Expected result: a score near the iteration 9 level on the development tracks,
      with the oval finishing reliably and the s-bend and slalom still limited by
      the single line loss per run.


      - [Open this output](iteration-11/entity0/versions/068b450f0a77400890d322fbd34b1b00/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-7b84eadd35eb7c6d/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-842cbbb2b39f970f/payload.json)'
  - id: entity1
    label: Complete Robot Package
    notes: 'Complete Robot Package. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      The Builder''s iteration 10 geometry widens the sensor span to ±0.06 m at 30
      mm pitch, keeping the iteration 9 platform otherwise fixed. Iteration 9 showed
      that the controller change (base_speed 1.0, kp 2.5, kd 0.4) cleared the oval
      line loss, with 19 of 20 finishes at 0.1 line-loss events, but the s-bend and
      slalom still ended off_track with one line loss per run and max_error at the
      0.062 to 0.063 m floor. Those are the tracks where the line leaves the old ±0.04
      m span, so the wider span is the untested lever for them. Five sensors at these
      x positions still span the tape across the wider range, so I keep sensor_weights
      at [-2,-1,0,1,2]. Because the reading-weighted average is bounded by the largest
      weight, this keeps the signal scale in the range the controller was tuned for,
      and the same weight pattern is the Builder''s own suggestion. I leave the controller
      gains unchanged (base_speed 1.0, kp 2.5, ki 0.05, kd 0.4, last_direction) so
      that any change in s-bend or slalom line losses is attributable to span. I expect
      line_loss_events on the s-bend and slalom to fall toward 0 and max_error to
      drop below about 0.06 m, with the oval finish rate held near 95 percent. I make
      no claim about the result, since nothing has raced for this design.


      - [Open this output](iteration-10/entity1/versions/d9b5fd3d28e0455eb2759aca1b126c90/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/b26caa0aeff0444b9d5e207cf9f003a8/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-6839e91f34b1b0a2/payload.json)'
  - id: entityR1
    label: Integration Feedback
    notes: 'Integration Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Iterations
      0 to 8 (scores 53.61 to 53.21) all ended off_track in every trial, with max_error
      at 0.060 to 0.068 m, one line loss per run from iteration 3 on, and steering_oscillation
      of 0.07 to 0.16. Pitch of 10 to 20 mm (iterations 0 to 2), footprint of 8 to
      16 mm (iterations 2, 3, 8), track of 0.10 to 0.12 m (iterations 0, 1), mass
      of 0.4 to 0.8 kg (iterations 0, 4, 5), wheel_radius of 0.030 to 0.035 m (iteration
      6) and lead of y 0.04 to 0.06 m (iteration 7) left max_error and line losses
      unchanged. Every pitch and footprint tested kept the span at or below ±0.04
      m. Iteration 9 is the only design that moved the score (363.7), and that came
      from the controller, which cleared the oval line loss. Its s-bend and slalom
      still end at the off_track floor with one line loss per run. Read the next race
      as follows. If the s-bend and slalom line losses fall to 0 with max_error below
      0.06 m, the wider span works, so keep it. If one line loss per run persists
      with max_error at the floor, widen the span further. If the oval finish rate
      drops with steering_oscillation above about 0.3, the wider bar is adding overshoot.


      ### Requested changes


      - If line_loss_events stays at 1 per run on the s-bend or slalom with max_error
      at the floor, widen the sensor span to x = -0.08, -0.04, 0, 0.04, 0.08 at y
      = 0.04 with sensor_size 0.016. Evidence: every pitch tested so far kept the
      span at or below ±0.04 m, and the 10 mm bar gave 2 line losses in iteration
      0, so a span beyond ±0.06 m is untested.

      - Keep wheel_track at 0.10 m and wheel_radius at 0.030 m. Evidence: narrowing
      the track (iteration 1) and raising wheel_radius to 0.035 m (iteration 6, score
      53.11) did not lift progress or max_error.

      - Keep y at 0.04 m. Evidence: moving the bar to y = 0.06 m (iteration 7, score
      53.40) and changing the footprint to 8 mm (iteration 8, score 53.21) did not
      clear the line loss, so lead is not the lever.


      - [Open this output](iteration-10/entityR1/versions/d9b5fd3d28e0455eb2759aca1b126c90/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/b26caa0aeff0444b9d5e207cf9f003a8/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-6839e91f34b1b0a2/payload.json)'
