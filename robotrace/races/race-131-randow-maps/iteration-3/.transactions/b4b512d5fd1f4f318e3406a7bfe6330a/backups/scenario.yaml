map:
  id: race-131-randow-maps
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: 16mm footprint test
    notes: 'Keeps the 20 mm pitch and changes only the sensor footprint from 12 mm
      to 16 mm, following the Integrator''s contingency rule because one line loss
      per run persisted. The evidence is that pitch changes (10, 15, 20 mm) and track
      narrowing have not moved max_error off the 0.06 m off-track floor, so this tests
      coverage at the outer sensors.


      ### Rationale


      Evidence so far: iterations 0, 1 and 2 all ended off_track in every one of 60
      trials per design. Max_error sits at about 0.06 to 0.066 m, which is the off-track
      floor, and progress is only 0.10 to 0.18. Line_loss_events is 1 to 2 per run,
      and steering_oscillation is low (0.07 to 0.16), so the robot drifts steadily
      off the line rather than oscillating. Sensor pitch has now been tested at 10,
      15 and 20 mm, and none of them changed max_error or line losses, so pitch is
      not the lever. Iteration 2 (20 mm pitch) scored 53.3054, slightly below iteration
      0''s 53.612, so the wider bar did not help. The off-track limit is max(0.06,
      0.0125 + body_width/4), which stays at 0.06 for any body_width in range, so
      it cannot be raised. The Integrator''s contingency rule says that if line losses
      stay at 1 or more with the 20 mm pitch, the 12 mm footprint is probably too
      small for the 25 mm tape at the outer sensors. That condition is met: every
      design so far has had 1 line loss per run. This iteration therefore changes
      only the footprint, from 12 mm to 16 mm, keeping the 20 mm pitch (x = -0.04
      to +0.04), y = 0.04, track 0.10 m, mass 0.7 kg and wheel radius 0.03 m. A larger
      footprint should keep more sensors partly on tape at a given offset, so the
      line should drop out less often. I expect line_loss_events to fall toward 0,
      but max_error is likely to stay near 0.06 m, because the drift is probably a
      lag or steering-authority limit. Next iteration, if line losses are gone and
      max_error is still near 0.06 m, I plan to move the sensor bar forward to y =
      0.06 m to add lead. The forward offset is also a plausible lag lever, since
      at 1.5 m/s a 0.04 m offset gives only about 27 ms of lead.


      - [Open this output](iteration-3/entity0/versions/d8ba7ef3c51b4fc687243b97c92effac/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-8e50eb2451607172/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-d7a4e6ae751689df/payload.json)'
  - id: entity1
    label: 20mm pitch, kp 1.4
    notes: 'Builds the Builder''s 20 mm pitch geometry with kp raised from 1.2 to
      1.4 and kd from 0.1 to 0.15 for more steering authority. Based on iteration
      1 showing steady drift, low oscillation and no max_error gain from the 15 mm
      pitch or the narrower track.


      ### Rationale


      Iteration 1 (entityR2B, score 53.3955) changed the sensor pitch from 10 mm to
      15 mm and the track from 0.12 to 0.10 m. Max_error stayed at 0.062 to 0.066
      m, line_loss_events stayed at 1 to 2 per run, and steering_oscillation stayed
      low at 0.07 to 0.16. All 60 trials still ended off_track. So the 15 mm bar did
      not close the coverage gap, and narrowing the track did not raise yaw authority
      enough to change max_error (oval 0.0608 to 0.0621). The robot drifts steadily
      at low oscillation, which points to too little corrective steering rather than
      jitter. Geometry follows the Builder''s entity0 exactly: 20 mm pitch (x = -0.04,
      -0.02, 0, 0.02, 0.04 at y = 0.04), 12 mm footprints, 0.12 m body width, 0.7
      kg mass, 0.10 m track and 0.03 m wheels. Only the sensor pitch changes from
      iteration 1, so the pitch effect is isolated. Controller: I keep the sensor
      weights at [-2,-1,0,1,2] so the signal scale does not change. I raise kp from
      1.2 to 1.4 to add steering authority, because the drift is steady and the oscillation
      evidence (max 0.16) leaves room. I raise kd from 0.1 to 0.15 to damp the extra
      gain. ki and base_speed stay the same, and line_loss stays last_direction so
      the line-recovery behaviour is unchanged. Expected: line_loss_events fall toward
      0 with the wider bar. max_error may fall below 0.06 m if the extra kp helps;
      this is an assumption, not a measured result.


      - [Open this output](iteration-2/entity1/versions/148a9bf077b84377a8a2adaf848ce97e/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/cd021fbaa7e54bc388a96a1250094e8c/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-7d50f29a90e738c7/payload.json)'
  - id: entityR1
    label: Sensor size and lead
    notes: 'Feedback sets out a footprint change if line losses persist and a forward-offset
      change if max_error stays near 0.06 m. It also advises against narrowing the
      track further because iteration 1 showed no max_error gain from that change.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Iteration
      0 (entityR2B, score 53.612) and iteration 1 (entityR2B, score 53.3955) both
      ended off_track in all 60 trials, with max_error at 0.061 to 0.066 m, 1 to 2
      line-loss events, and steering_oscillation of 0.07 to 0.16. Moving from 10 mm
      to 15 mm pitch did not reduce line losses or max_error, so sensor pitch is not
      the only limit. Narrowing the track from 0.12 to 0.10 m also did not improve
      max_error (oval 0.0608 to 0.0621), so track narrowing is not an effective steering
      lever. For this candidate I widen the bar to 20 mm pitch and keep the footprint
      at 12 mm, and I raise kp in the controller to test steering authority. Next
      race: if line_loss_events drop to 0 and max_error stays near 0.06 m, the limit
      is lag or steering rather than coverage, so move the forward offset to y = 0.06
      m to give the sensors more lead. If line_loss_events still reach 1 or more,
      the 12 mm footprint is too small for the 25 mm tape at the outer sensors, so
      try sensor_size 0.016 with the same 20 mm pitch. If line losses are gone and
      progress is still low with off_track endings, do not narrow the track further,
      since that did not help max_error.


      ### Requested changes


      - If line_loss_events is still 1 or more with the 20 mm pitch, try sensor_size
      0.016 at the same x positions (-0.04 to +0.04, y = 0.04). Evidence: 15 mm pitch
      in iteration 1 still gave 1 line loss per run, and the 12 mm footprint may be
      too small at the outer sensors.

      - If line_loss_events reach 0 and max_error stays near 0.06 m, move the sensor
      bar forward to y = 0.06 m to add lead and earlier correction. Evidence: iteration
      1 showed steady drift (oscillation 0.07 to 0.16) with no max_error gain from
      track narrowing, so the limit looks like lag rather than coverage.

      - Do not narrow wheel_track below 0.10 m. Evidence: iteration 1 narrowed the
      track from 0.12 to 0.10 m and max_error did not improve (oval 0.0608 to 0.0621).


      - [Open this output](iteration-2/entityR1/versions/148a9bf077b84377a8a2adaf848ce97e/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/cd021fbaa7e54bc388a96a1250094e8c/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-7d50f29a90e738c7/payload.json)'
