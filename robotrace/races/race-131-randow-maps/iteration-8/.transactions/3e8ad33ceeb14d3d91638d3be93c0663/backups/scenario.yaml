map:
  id: race-131-randow-maps
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: 8 mm footprint test
    notes: 'Changes only sensor_size from 16 to 8 mm on the iteration 7 lead design
      (y = 0.06 m, wheel_radius back to 0.030 m). Iteration 7 left max_error at the
      floor with one line loss per run, so this tests the last untested footprint
      size.


      ### Rationale


      Evidence from iterations 0 to 7 (480 trials, all off_track) is consistent. max_error
      stays at the 0.060 to 0.068 m off-track floor on every track, and line_loss_events
      is 1 per run from iteration 3 onward. Pitch (10 to 20 mm), footprint (12 to
      16 mm), track (0.12 to 0.10 m), gain (kp 1.4), mass (0.8 to 0.4 kg) and wheel_radius
      (0.035 m, which lowered progress and score in iteration 6) have each left max_error
      unchanged. Iteration 7 moved the sensor bar to y = 0.06 m, and the result was
      53.4013, with max_error still at the floor (oval 0.0614, s-bend 0.0634, slalom
      0.0673) and one line loss per run. Lead alone is therefore not enough. Following
      the Integrator''s rule for this case, I keep y = 0.06 m, x = -0.04 to +0.04,
      track 0.10 m, wheel_radius 0.030 m and mass 0.4 kg, and change only sensor_size
      from 0.016 to 0.008 m, the one footprint size not yet tested. The 8 mm footprint
      gives sharper edge transitions and a smaller per-sensor coverage. This may reduce
      the outer-sensor dropout that causes the line loss, but it could also make the
      signal drop out sooner, so the result is uncertain. I expect line_loss_events
      to fall toward 0 and max_error to move below about 0.06 m, but I am not confident.
      If the line loss persists at 1 per run, the Geometry Builder''s remaining geometry
      levers are exhausted and the controller, which is outside this role, is the
      likely limit.


      - [Open this output](iteration-8/entity0/versions/90b250b0d8b746a89491c3025f3d260e/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-f418cdb7de596587/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-e61a3f7911fd2037/payload.json)'
  - id: entity1
    label: 8 mm footprint test
    notes: 'Iteration 7 geometry with sensor_size cut from 16 to 8 mm and the controller
      unchanged, so the race isolates footprint. Built because 12 and 16 mm footprints
      each left one line loss per run and max_error at the 0.06 m floor.


      ### Rationale


      Iteration 7 (y = 0.06 m, 16 mm footprint) scored 53.4013 with max_error still
      at the 0.061 to 0.067 m off-track floor and one line loss per run. Lead and
      footprint sizes 12 to 16 mm have each been tested, so the 8 mm footprint is
      the one untested sensor lever. The geometry is exactly the Builder''s entity0:
      the iteration 7 geometry with sensor_size changed from 0.016 to 0.008 m, and
      nothing else changed. The controller is held at the iteration 7 values (kp 1.4,
      ki 0.05, kd 0.15, base_speed 1.6, sensor_weights [-2,-1,0,1,2], last_direction),
      so any change in line_loss_events or max_error is attributable to footprint.
      Risk: an 8 mm footprint covers only about a third of the 25 mm tape per sensor,
      so readings may fall below the 0.05 line-loss threshold sooner at moderate offsets.
      I expect line_loss_events to move toward 0 only if the outer sensors were losing
      tape early, and I am not confident this happens. controller_errors is requested
      to catch any integration fault.


      - [Open this output](iteration-8/entity1/versions/305bfc224e654348945daf226efc1aa0/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/90b250b0d8b746a89491c3025f3d260e/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-e61a3f7911fd2037/payload.json)'
  - id: entityR1
    label: Footprint then lead plan
    notes: 'Feedback written before the race: keeps the 8 mm footprint if line losses
      clear and tries y = 0.08 m next, stops geometry work if one loss per run persists,
      and reverts to 16 mm if progress falls. Each rule cites the iteration 0 to 7
      results on pitch, footprint, track, mass, wheel radius and lead.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Iterations
      0 to 7 (entityR2B scores 53.612, 53.3955, 53.3054, 53.2728, 53.5316, 53.6775,
      53.1057, 53.4013) all ended off_track in every trial. max_error stayed at 0.060
      to 0.068 m, and line_loss_events was 1 per run from iteration 3 onward. Steering_oscillation
      stayed at 0.07 to 0.16, so the robot drifts rather than jitters. Pitch 10 to
      20 mm (iterations 0 to 2), footprint 12 and 16 mm (iterations 2 and 3), track
      0.10 m (iteration 1), kp 1.4 (iteration 2), mass 0.8 to 0.4 kg (iterations 4
      and 5), wheel_radius 0.035 m (iteration 6, progress did not rise) and lead y
      = 0.06 m (iteration 7) each left max_error at the floor. This candidate tests
      the only footprint size not yet run. Read the next race as follows. If line_loss_events
      falls to 0 and max_error drops below about 0.06 m, the footprint was the limit,
      so try lead y = 0.08 m with the 8 mm footprint. If line losses persist at 1
      per run with max_error at the floor, the geometry levers are exhausted, so stop
      changing geometry and report the remaining limit to the controller side. If
      progress drops below 0.10 on the development tracks, the 8 mm footprint is losing
      tape, so return to 0.016 m.


      ### Requested changes


      - If line_loss_events is 0 and max_error is below about 0.06 m with sensor_size
      0.008, keep the 8 mm footprint and try sensor positions at y = 0.08 m (the contract
      maximum) with x = -0.04 to +0.04. Evidence: the iteration 7 lead move from y
      = 0.04 to 0.06 m did not clear the loss on its own, so further lead is the next
      lag test once coverage is fixed.

      - If line_loss_events is still 1 per run and max_error stays at the floor with
      sensor_size 0.008, stop changing geometry. Evidence: 12 mm and 16 mm footprints
      (iterations 2 and 3), pitch 10 to 20 mm (iterations 0 to 2), and lead 0.04 to
      0.06 m (iteration 7) all left one line loss per run.

      - If progress falls below 0.10 on the development tracks with sensor_size 0.008,
      return to sensor_size 0.016 at y = 0.06 m. Evidence: progress has held at 0.10
      to 0.18 across footprints 0.012 to 0.016 m (iterations 0 to 7), and an 8 mm
      footprint covers less of the 25 mm tape per sensor.


      - [Open this output](iteration-8/entityR1/versions/305bfc224e654348945daf226efc1aa0/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/90b250b0d8b746a89491c3025f3d260e/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-e61a3f7911fd2037/payload.json)'
