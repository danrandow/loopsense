map:
  id: race-213-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 1
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 0.
dimensions:
  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Gentler steering, slower
    notes: 'Cut kp from 4 to 2.5 and base_speed from 1.8 to 1.5, with more damping
      (kd 0.8). Every iteration-0 trial left the track at 13 to 20% progress with
      high steering oscillation, which points to over-aggressive correction.


      ### Rationale


      Evidence: the iteration-0 design (kp 4, kd 0.5, base_speed 1.8, weights -2..2)
      left the course on all 60 trials across oval, s-bend and slalom. Progress stalled
      at 0.13 to 0.20, so the robot went off track after roughly 0.6 to 0.9 m. Steering
      oscillation was high (0.11 to 0.16) and line-loss events occurred in 1 to 2
      runs per track. The max_error of about 0.06 is the off-track limit itself, so
      the robot was diverging, not just wandering.


      Diagnosis: the effective steering gain is very high. With kp 4 and weights up
      to ±2, a single sensor on the tape gives turn up to ±8, which is about ±2800
      PWM of wheel differential. Combined with base_speed 1.8 (PWM about 3685), each
      correction overshoots and the oscillation grows until the tape is lost. Slalom
      was worst, which fits sharper direction changes amplifying the overshoot.


      Changes: (1) kp 4 to 2.5, roughly halving the proportional response so corrections
      are smaller and less overshoot. (2) kd 0.5 to 0.8 to add damping against the
      faster signal changes that cause the oscillation. (3) ki 0.1 to 0.05 to limit
      integral windup on long bends, since the drift is oscillatory, not a steady
      offset. (4) base_speed 1.8 to 1.5: the robot needs time to correct on bends,
      and it can still reach about 1.3 to 1.5 m/s on average. Completion inside 3
      s is worth less than staying on track, which is worth 500 points. (5) Geometry
      is kept as before. Sensor spacing already covers the 25 mm tape, and the off-track
      allowance is capped at 0.06 m regardless of body width, so widening the body
      gains nothing. Weights and line_loss stay as they were.


      Expected result: fewer off-track ends and lower steering oscillation. I expect
      progress to rise well above 0.2 on the development tracks, with completion possible
      on oval. Completion time may be about 3.2 to 3.6 s, so the speed term may be
      lost. The main uncertainty is whether kp 2.5 is too weak for the sharpest slalom
      bends, which the next round should check.


      - [Open this output](iteration-1/entity0/versions/721acc27b47240899e63d97ad6961c97/payload.json)

      - Based on: [entityR2A](iteration-1/entityR2A/versions/carried-c04f4ac84fe14ad2/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critique of the baseline draft: the gain looks too aggressive for ±1 signal,
      the body-width off-track argument is wrong (limit is always 0.06 m), and the
      speed and performance numbers are unsupported with no telemetry. Based on the
      contract formulas and geometry only.


      - [Open this output](iteration-0/entityC1/versions/e39e637e64c04e759ed22c6b9c7a047d/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/14dc10d17b1b4875904cf10c94288f7e/payload.json)'
  - id: entity1
    label: 'Revised: softer gains'
    notes: 'Lowered kp from 4.0 to 2.5 and kd from 0.5 to 0.2 to stop the 350-PWM-per-unit
      turn from saturating wheels and to limit noise-driven derivative jitter, and
      tightened sensor pitch to 10 mm. Kept base speed and line-loss handling, since
      the critique''s speed and body-width points were either unsupported by the contract
      or not decisive. Expected results are unverified, as no telemetry exists yet.


      ### Rationale


      Kept: the base design''s sensor layout (five 12 mm sensors, 12 mm pitch, 50
      mm ahead of the axle), the weight signs (-2..2, so tape to the left gives a
      positive signal that steers left), base_speed 1.8, ki 0.1, line_loss last_direction,
      and the chassis geometry. The critique''s main points are sound, and I accepted
      them where the contract supports them. Changed: (1) kp from 4.0 to 2.5. Each
      unit of turn is 350 PWM, so kp 4 gives a 1400 PWM differential at signal 1 against
      a base of 3685, which nearly stalls one wheel and risks oscillation. kp 2.5
      keeps a 1-unit signal to about 875 PWM and leaves room for the controller to
      correct. (2) kd from 0.5 to 0.2. At 100 Hz, 2% sensor noise produces large derivative
      spikes (kd times the signal slope), so a smaller kd limits jitter while still
      damping overshoot. (3) Sensor pitch from 12 mm to 10 mm (x = -0.02 to +0.02).
      This keeps the 25 mm tape covered by at least two central sensors across more
      of the range and reduces the edge-sensor dropout the critique raised. Sensor
      size stays at 12 mm. Rejected: I kept base_speed at 1.8 rather than lowering
      it, because the 3 s limit needs about 1.5 m/s on a 4.5 m course (the contract
      gives 4 to 5 m), and cutting speed risks a timeout. I kept body_width at 0.12,
      accepting the critique''s point that it does not change the off-track limit
      (fixed at 0.06 m across the allowed range); it is a neutral choice, not a benefit.
      Expected result, unverified because no telemetry exists: completion with rms_error
      reduced versus the baseline because of lower gain, and fewer oscillation events.
      The main unknown is whether 1.8 base speed holds the line on the slalom with
      kp 2.5. The next revision should use steering_oscillation and max_error to decide
      whether to raise kp or lower base_speed. If max_error approaches 0.06 m, reduce
      base_speed. If rms_error is high and oscillation is low, raise kp in steps of
      0.5.


      - [Open this output](iteration-0/entity1/versions/0275ba90357e42d99024da98d60b891c/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/14dc10d17b1b4875904cf10c94288f7e/payload.json),
      [entityC1](iteration-0/entityC1/versions/e39e637e64c04e759ed22c6b9c7a047d/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Round-2 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-0/entityC2/versions/891c4d09612c48cdba1c44a4ec207f55/payload.json)

      - Based on: [entity1](iteration-0/entity1/versions/0275ba90357e42d99024da98d60b891c/payload.json)'
  - id: entity2
    label: 'Final: gentler kd, 10mm'
    notes: 'Keeps kp 2.5 and 1.8 base speed from the revision, with 10 mm sensor pitch
      and kd raised from 0.2 to 0.3 to restore damping the critique flagged. Partly
      accepts the critique; base_speed and body_width are unchanged because the evidence
      does not support changing them.


      ### Rationale


      Kept: the revised design''s kp 2.5, ki 0.1, base_speed 1.8, last_direction line
      loss, sensor weights [-2,-1,0,1,2], five 12 mm sensors, and the chassis geometry.
      The sign convention is correct: tape to the left gives a positive signal, which
      steers left. Changed: kd from 0.2 to 0.3. The critique is right that kd 0.2
      weakens damping on a 100 Hz loop with the sensor 50 mm ahead of the axle, and
      the revision gave no evidence that derivative noise dominated. kd 0.3 is a compromise:
      it stays well below the original 0.5, so noise spikes are still limited, but
      it restores some phase margin. Kept: sensor pitch 10 mm (x = -0.02 to +0.02),
      which the critique called plausible but unquantified. I accept that it is unverified,
      and I keep it because the sensors still span 40 mm, and a 25 mm tape stays under
      at least one central sensor across a wider lateral offset than a 12 mm pitch.
      Rejected: lowering base_speed. The 3 s limit on a 4 to 5 m course needs about
      1.5 m/s or more, and the contract gives no ground-speed mapping to check a margin,
      so I keep 1.8 and rely on max_error to decide whether to slow down. Not changed:
      body_width 0.12 and wheel_track 0.12 are neutral choices, since body_width affects
      only the off-track limit. Expected result, unverified: completion with lower
      rms_error and fewer oscillation events than the original kp 4.0 design. Next-step
      rule: if max_error approaches 0.06 m, reduce base_speed; if rms_error is high
      and steering_oscillation is low, raise kp in steps of 0.5 and re-check kd.


      - [Open this output](iteration-0/entity2/versions/d47f61452eb34d0585aea17e042356f9/payload.json)

      - Based on: [entity1](iteration-0/entity1/versions/0275ba90357e42d99024da98d60b891c/payload.json),
      [entityC2](iteration-0/entityC2/versions/891c4d09612c48cdba1c44a4ec207f55/payload.json)'
