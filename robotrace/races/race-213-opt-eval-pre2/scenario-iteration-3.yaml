map:
  id: race-213-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Wider sensor array draft
    notes: 'Widens the sensor row to ±0.04 m with 16 mm footprints, rescales kp and
      kd for the new spacing, and lowers base_speed to 1.1. The aim is to fix the
      slalom, which lost the line at about 0.15 progress because the old ±0.024 m
      array could not see the tape beyond that offset. Based on iteration 2 telemetry
      (oval 20/20 finished, slalom 0/20).


      ### Rationale


      Evidence: iteration 2 (kp 2.0, ki 0, kd 1.2, base_speed 1.3, 12 mm sensors at
      x -0.024..0.024, y 0.05, weights -2..2, last_direction) finished 20/20 on the
      oval with mean score 955 and 1.91 s finish time. It failed on the s-bend (1/20
      finished, progress 0.52) and on the slalom (0/20, progress 0.15, 1.3 line-loss
      events per run). Off-track was the only end condition on the hard tracks. Lowering
      kp from 4 to 2 and adding kd fixed the oval, but it did not change the slalom:
      progress there was about 0.13 to 0.15 in both iterations 0 and 2, so the slalom
      failure has a different cause from the gain level.


      Diagnosis: the five sensors span only ±0.024 m, which is less than the ±0.0305
      m needed to keep the 25 mm tape under a sensor when the robot drifts sideways.
      Once the tape moves outside the array, the sum drops below 0.05, the robot counts
      a line loss, and it continues in the last direction, which overshoots on the
      slalom''s quick reversals. The spread is also narrow for the 12 mm footprints,
      so sensor readings change abruptly at the edges. A wider array with larger footprints
      should keep at least one sensor on the tape across larger lateral errors and
      reduce line losses.


      Changes: (1) Geometry: sensor x positions move to -0.04, -0.02, 0, 0.02, 0.04
      (same y 0.05), and sensor_size goes to 0.016. Every offset up to about ±0.045
      m then keeps some tape under a sensor. (2) Gains are rescaled for the wider
      20 mm spacing. The signal per metre of offset falls from about 83 to 50 per
      m, so kp rises from 2.0 to 3.0 to keep roughly the same steering authority,
      and kd falls from 1.2 to 0.9 so that kd/kp stays near the 0.6 ratio that gave
      the stable oval run. ki stays 0. (3) base_speed drops from 1.3 to 1.1 to give
      more time to correct on the slalom''s sharp bends. The oval has about 1 s of
      margin (1.9 s measured at 1.3), so it should still finish. (4) Weights (-2..2)
      and line_loss (last_direction) stay the same.


      Expected result: the slalom should progress well beyond 0.15 and possibly finish.
      The s-bend should finish more often. Oval completion is likely with a finish
      time of about 2.2 to 2.5 s. The main risk is that the wider array makes steering
      noisier on the oval, so I will check steering_oscillation and line_loss_events
      on the oval and slalom in the next round.


      - [Open this output](iteration-3/entity0/versions/3625fa9992684b5bafb58728253b7ae4/payload.json)

      - Based on: [entityR2A](iteration-3/entityR2A/versions/carried-5951d3a57993cd0a/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Flags a kd/kp arithmetic error (0.3 not 0.6), the uncalculated +/-0.0305
      m coverage figure, the overstated oval margin, and the lack of single-variable
      testing. Based on the contract geometry and iteration 2 race data.


      - [Open this output](iteration-3/entityC1/versions/5050577273f5404bb083918e0dcb2421/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/3625fa9992684b5bafb58728253b7ae4/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-5951d3a57993cd0a/payload.json)'
  - id: entity1
    label: Wider array, kd/kp 0.4
    notes: 'Keeps the wider ±0.04 m sensor array to test the line-loss diagnosis,
      with kp 3.0 and kd 1.2 (ratio 0.4, the ratio that ran stably in iteration 2).
      Speed stays at 1.3 and footprint at 12 mm to avoid confounding a result that
      already gave 20/20 oval finishes. Evidence: iteration 2 oval and slalom progress
      data, and corrected coverage arithmetic.


      ### Rationale


      Evidence: iteration 2 (kp 2.0, kd 0.8, base 1.3, 12 mm sensors at x -0.024..0.024)
      finished 20/20 on the oval (mean 1.91 s), but progress on the slalom stayed
      at 0.15 and the s-bend finished 1/20. Iteration 0 showed that kp 4 diverges.
      Slalom progress was about 0.13 to 0.15 at both kp 4 and kp 2, so gain level
      does not explain the slalom failure. The geometric diagnosis (the array spans
      only ±0.024 m, so the tape leaves the array at lateral offsets of about ±0.03
      m and triggers line loss) is the hypothesis this round tests.


      The round-1 critique is right on the arithmetic, and I accept it. The draft''s
      kd/kp = 0.9/3.0 = 0.3, not 0.6. The ratio that actually ran stably was iteration
      2''s 0.8/2.0 = 0.4, so I use that ratio: kd 1.2 with kp 3.0. I also check the
      coverage claim. With 12 mm footprints at x = -0.04..0.04 (20 mm pitch), each
      sensor sees tape for offsets within about 0.0185 m of its position, so the union
      covers lateral offsets of about ±0.0585 m with no gaps. The draft''s ±0.045
      m figure was understated, and the 12 mm footprint already gives full coverage.


      Kept: the wider array (x ±0.04, y 0.05), because it addresses the diagnosed
      line-loss cause directly. Weights -2..2, line_loss last_direction, ki 0, and
      body geometry are unchanged.


      Changed or rejected: (1) sensor_size goes back to 0.012, not 0.016. The critique
      is right that a footprint change confounds the test. Coverage is already complete
      at 12 mm, so the footprint change is not needed to test the array width. (2)
      base_speed stays at 1.3, not 1.1. The critique''s points hold: oval completion
      (500 points) is the largest term and was 20/20 at 1.3. A cut to 1.1 would probably
      cost completions on the s-bend and slalom, and it is a second variable on top
      of the geometry test. (3) kp rises to 3.0 with the wider 20 mm pitch to hold
      similar steering authority per unit of offset (about 2.0×83 ≈ 3.0×50). This
      is approximate, and I say so.


      Expected result (guesses, not measured): the oval still finishes at about 1.9
      to 2.1 s. Slalom progress should rise clearly above 0.15, and line_loss_events
      on the slalom should fall from 1.3 per run. Falsification rule: if slalom progress
      stays below 0.3 with line_loss_events still above 1, the tape-coverage hypothesis
      is wrong and the next round should look at the sensor lead (y) or the line-loss
      setting. If steering_oscillation on the oval rises above about 0.3 (iteration
      2 was 0.22), reduce kd toward 0.9. If the oval fails, return kp to 2.5.


      - [Open this output](iteration-3/entity1/versions/4f6ea6e0397f4970a632bb3acc042240/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/3625fa9992684b5bafb58728253b7ae4/payload.json),
      [entityC1](iteration-3/entityC1/versions/5050577273f5404bb083918e0dcb2421/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-5951d3a57993cd0a/payload.json)'
  - id: entityC2
    label: Round-2 critique
    notes: 'Flags that the revision''s baseline and pitch claims conflict with the
      iteration 0 outcome table (10 mm pitch, kp 2.5, kd 0.2), so the evidence does
      not match the changes. Also notes the unverified speed, the weak ki effect,
      and the untestable decision rule.


      - [Open this output](iteration-2/entityC2/versions/eccaaaf722e2477287581c4c39b9c098/payload.json)

      - Based on: [entity1](iteration-2/entity1/versions/e689dc4a0cd54d70ad8e9685a803ab24/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-c04f4ac84fe14ad2/payload.json)'
  - id: entity2
    label: Tested geometry, kp 2.0
    notes: 'Returns sensor pitch to the tested 10 mm and lowers kp to 2.0, base to
      1.5, ki to 0.05 and raises kd to 0.5 to cut the oscillation (0.11 to 0.16) that
      caused every off-track end. The critique''s claim that the geometry was unchanged
      was correct, and the rationale rejects the 12 mm change. Four controller changes
      are made together, so attribution is limited.


      ### Rationale


      Evidence: iteration 0 (kp 2.5, kd 0.3, ki 0.1, base 1.8, 10 mm sensor pitch)
      went off track in all 60 trials. Progress was 0.13 to 0.20, rms_error 0.02 to
      0.03, max_error 0.06 at the off-track limit, and steering_oscillation 0.11 to
      0.16. Oscillation is the clearest symptom, and the robot leaves the line before
      it reaches the finish. No run has completed, so completion (500 points) is still
      unproven.


      The round-2 critique is right on the main point. My previous revision claimed
      the geometry was unchanged, but it moved sensor pitch from the tested 10 mm
      to 12 mm. I reject that change and return to the tested 10 mm layout. That way
      this race is a clean test of the controller changes, and any gain in progress
      can be attributed to them.


      Changed: (1) kp 2.5 to 2.0. Oscillation is the dominant failure, and at signal
      2 the turn term is 5 x 350 = 1750 PWM at kp 2.5, which overshoots the line.
      A 20% cut is a modest step that keeps some correction on bends. (2) kd 0.3 to
      0.5. This adds damping against the overshoot that produced the oscillation.
      The derivative noise gain rises, but 0.5 was the original value and is within
      the range I can justify without a noise test. (3) base_speed 1.8 to 1.5. Lower
      speed gives the controller more time per bend and reduces the chance of leaving
      the line on the sharpest slalom bends. Completion inside 3 s is less likely,
      so this is a trade-off. I accept it because a finish requires staying on the
      line first, and the time term is worth at most 60 points. (4) ki 0.1 to 0.05,
      to reduce integral windup on bends, which the critique flagged as a risk. The
      integral is clamped at +/-2 and the motor mismatch is about 2%, so ki 0.05 still
      gives a small correction.


      Kept: five 12 mm sensors, weights [-2,-1,0,1,2], last_direction line loss, wheel_track
      0.12, body_width 0.12, body_length 0.18, mass 0.8, wheel_radius 0.03. These
      are neutral choices or were not varied.


      Rejected: raising kp above 2.0 without evidence. The critique''s stability estimate
      is unverified, and oscillation is already too high.


      I am changing four controller values at once, so the next telemetry cannot isolate
      each effect. I accept that and prioritise a first finish over clean attribution.
      Expected result (unverified): fewer line_loss_events, lower steering_oscillation
      (below 0.1), progress above 0.3, and possibly an oval finish. Next-step rule:
      if oscillation is still above 0.1 with max_error at 0.06, lower kp by 0.5. If
      the oval finishes slowly (completion_time above 2.5 s), raise base_speed by
      0.2. If progress stalls below 0.5 with low oscillation, raise kp by 0.5.


      - [Open this output](iteration-2/entity2/versions/9670648c272847faa2ddf5d219030ed5/payload.json)

      - Based on: [entity1](iteration-2/entity1/versions/e689dc4a0cd54d70ad8e9685a803ab24/payload.json),
      [entityC2](iteration-2/entityC2/versions/eccaaaf722e2477287581c4c39b9c098/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-c04f4ac84fe14ad2/payload.json)'
