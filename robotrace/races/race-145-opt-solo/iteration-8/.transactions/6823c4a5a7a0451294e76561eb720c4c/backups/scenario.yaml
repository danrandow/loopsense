  entities:
  - id: entity0
    label: Sensors forward to y=0.08
    notes: 'Moves all sensors from y=0.06 to the 0.08 m limit, continuing the forward-shift
      trend that raised the score from 385 to 655. Controller and other geometry are
      unchanged to isolate the lever; the slalom, which fails in every trial, is the
      target.


      ### Rationale


      Evidence: iteration 7 (sensors moved forward to y = 0.06 m) is the best design
      so far at 654.8, up from 384.9 at y = 0.03 m. The oval finishes 20 of 20 at
      1.91 s with rms 0.005 m. The s-bend finishes 18 of 20 (mean 868). The slalom
      still fails in all 20 trials by going off track, with progress 0.35 and about
      1.1 line-loss events per run. Steering oscillation is moderate (0.22 oval, 0.43
      s-bend, 0.24 slalom). Forward sensor position is the only lever that has produced
      a large gain: it moved the sensors from 0.03 to 0.06 m ahead of the axle and
      added about 307 points. Earlier levers (base_speed, sensor spacing, sensor size,
      kp/kd at 3.5/1.0) either had no effect or hurt. Change (one variable): move
      all five sensors from y = 0.06 m to y = 0.08 m, the upper geometry limit. Geometry
      x positions, sensor size, wheel_track, mass and all controller values stay as
      in iteration 7. The added look-ahead should reduce the lag at direction changes
      that causes slalom line losses. Expected result: slalom progress rises (goal
      above 0.5) with fewer line-loss events, the oval still finishes at about 1.9
      to 2.0 s, and s-bend completions hold or improve. Risk: the loop may become
      less stable, which would show as steering_oscillation above about 0.5 on the
      s-bend. If that happens, the next step is to lower kp slightly (to about 2.7)
      at y = 0.08 rather than reverting the sensor move. Hypotheses to check: (a)
      the slalom failure is lag at the first sign change, so more look-ahead recovers
      progress; (b) if progress does not move beyond the y = 0.06 result, the limit
      is the steering response and the next test should change wheel_track or mass
      alone. Next measurements: progress, line_loss_events, max_error and steering_oscillation
      per track, plus completion_time on the oval and s-bend.


