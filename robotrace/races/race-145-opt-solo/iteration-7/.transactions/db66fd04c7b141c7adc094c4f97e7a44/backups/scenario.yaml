  entities:
  - id: entity0
    label: Sensors forward to y=0.06
    notes: 'Iteration 5 controller, with the five sensors moved from y=0.03 to y=0.06
      m for earlier line sensing. This tests whether look-ahead fixes the s-bend and
      slalom line losses, since iteration 6''s higher gain scored lower (348 vs 385).


      ### Rationale


      Evidence: iteration 5 (kp 3.0, ki 0.5, kd 0.8, base 1.3, 12 mm sensors at x
      = -0.04..0.04, y = 0.03) is the best design so far at 384.9. The oval finishes
      19 of 20 runs at about 1.97 s, so the controller is sound on gentle curves.
      The s-bend (progress 0.43) and slalom (progress 0.12) still fail by going off
      track after about one line-loss event per run, with max_error reaching the 0.06
      m limit. Steering oscillation is low (0.16 on the slalom), so the robot is not
      jittering. It drifts out at direction changes and does not recover. Iteration
      6 (kp 3.5, kd 1.0) scored lower at 348, so the extra gain did not help and I
      am reverting to the iteration-5 controller. Earlier changes to base_speed, sensor
      spacing and sensor footprint did not fix the bend failures. Iteration 2 was
      confounded (wider sensors plus narrower wheel_track), so the untested single
      levers are sensor forward position, mass and wheel_track. I am testing one lever:
      sensor forward position y. Each sensor moves from y = 0.03 m to y = 0.06 m,
      ahead of the axle, with x positions, sensor size, weights and all controller
      values unchanged from iteration 5. The sensors then see the line earlier, which
      adds lead against the lag in the steering response at direction changes. Expected
      result: lower max_error and fewer line-loss events on the s-bend and slalom,
      with the oval still finishing in about 2 s. Risk: a larger lead can make the
      loop less stable, which would show as higher steering_oscillation. Hypotheses
      to check: (a) slalom losses happen at the first sign change, where lag is largest,
      so more look-ahead should reduce them; (b) if steering_oscillation rises above
      about 0.4 with no progress gain, the loop lag is not the limit and the next
      test is wheel_track or mass; (c) if the oval stops finishing, the forward shift
      has pushed the sensors past the useful range. Next measurements: progress, line_loss_events,
      max_error and steering_oscillation per track, plus completion_time on the oval.


