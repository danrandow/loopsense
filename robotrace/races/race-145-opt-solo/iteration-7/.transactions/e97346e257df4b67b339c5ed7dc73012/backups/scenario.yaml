  entities:
  - id: entity0
    label: kp 3.5, kd 1.0 steer tune
    notes: 'Keeps the iteration-5 geometry and ki 0.5, which helped the oval, and
      raises kp and kd to tackle s-bend and slalom line losses. Based on the iteration-5
      race: oval 95% finish, s-bend progress 0.43, slalom progress 0.12.


      ### Rationale


      Evidence from iteration 5 (score 384.9, best so far). The oval now finishes
      19 of 20 runs at 1.97 s with rms 0.011 m, so the controller works on gentle
      curves. ki 0.5 helped there (oval mean 926 vs 808 in iteration 1). The s-bend
      (progress 0.43, about 1.0 line-loss event per run, steering oscillation 0.37)
      and slalom (progress 0.12, about 1.25 line-loss events per run) still leave
      the track by reaching the 0.06 m limit. Slalom progress is very low, so the
      robot fails at the first direction change. Earlier experiments that changed
      geometry or speed (sensor spacing, sensor size, base_speed) did not help, so
      I am leaving geometry alone. Change (controller only): kp 3.0 -> 3.5 for a firmer
      steer on sharp bends, and kd 0.8 -> 1.0 to damp the faster response and limit
      overshoot across the s-bend sign changes. ki stays at 0.5 because it helped
      the oval. Expected result: fewer line-loss events on the s-bend and slalom,
      with progress on those tracks rising by roughly 0.1 or more. The oval should
      still finish in under 2.1 s. Risk: steering_oscillation may rise above 0.4 on
      the s-bend, and if it does, kp should go back toward 3.0. Hypotheses to check:
      (a) slalom failures occur at the first sign change, where lateral error grows
      fastest; (b) higher kp with kd 1.0 reduces max_error without raising jitter;
      (c) if progress does not move, the limit is yaw response (wheel_track or mass),
      so the next test should change mass or wheel_track alone. Next measurements:
      progress, line_loss_events, max_error and steering_oscillation per track, plus
      completion_time on the oval.


