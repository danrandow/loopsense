  entities:
  - id: entity0
    label: Slower entry, base 1.1
    notes: 'Reverts to the best iteration-1 geometry and lowers base_speed from 1.3
      to 1.1 as the only change. Iterations 2 and 3 showed that sensor spacing and
      footprint changes hurt, while the speed reduction from 1.6 to 1.3 gave the largest
      gain, so line loss on the s-bend and slalom should fall while the oval still
      finishes.


      ### Rationale


      Evidence. Iteration 1 (score 351.8) is still the best design. Its oval finishes
      15 of 20 runs in about 1.97 s, but the s-bend (progress 0.49, about 1.05 line-loss
      events per run) and slalom (progress 0.12, about 1.1 line-loss events per run)
      both leave the track. Each change since then has made things worse or no better.
      Iteration 2 (wider sensors at ±0.06 m, narrower track) dropped the oval finish
      rate to 0.65 and the s-bend progress to 0.39. Iteration 3 (12 mm to 16 mm sensors)
      gave a small drop on the oval finish rate (0.70) and s-bend progress (0.39).
      So a larger sensor footprint did not fix the line-loss problem. The iteration-0
      to iteration-1 step (base 1.6 to 1.3, kp 2 to 3, kd 0.3 to 0.8) produced the
      largest gain, which points to entry speed into bends as the main driver. Change
      (one variable, relative to iteration 1): base_speed 1.3 to 1.1. Geometry is
      returned to iteration 1 (sensors at x = -0.04 to 0.04 m in 0.02 m steps, y =
      0.03 m, 12 mm sensors, wheel_track 0.12 m). Controller otherwise matches iteration
      1 (kp 3.0, ki 0, kd 0.8, weights -2, -1, 0, 1, 2, line_loss last_direction).
      Expected result: fewer line-loss events and higher progress on the s-bend and
      slalom, with the oval still finishing at about 2.2 to 2.4 s (under the 3 s limit).
      Hypotheses to check: (a) if s-bend and slalom progress rises as speed drops,
      entry speed is the limiting factor and the next step is kp/kd retuning at this
      speed; (b) if progress does not change, the failure is in steering response
      (kp/kd or sensor geometry) rather than speed; (c) if the oval stops finishing,
      base_speed 1.2 is the floor. Next measurements: completion, progress, max_error
      and line_loss_events per track, plus steering_oscillation and completion_time
      on the oval.


