overrides:
  entities:
  - id: entity0
    label: Robot Candidate
    notes: 'Updated the robot''s controller parameters to improve line tracking stability,
      increasing kp to 0.8 and adjusting sensor weights.


      ### Rationale


      The robot''s performance indicated issues with line tracking stability, evidenced
      by 2 line loss events and a maximum error of 0.060533. To address this, I increased
      the kp value from 0.7 to 0.8 to enhance responsiveness. Additionally, I reduced
      the side sensor weights to 0.8 to prioritize the center sensor, which should
      improve tracking stability and reduce line loss events. I expect these changes
      to lead to a decrease in line loss events and a lower maximum error in future
      trials.


      - [Open this output](iteration-2/entity0/versions/f89d73c48be24c72912368ca9304d6fb/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-828bce8bd4e06ccd/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-9975325dda857285/payload.json)'
  - id: entity1
    label: Approved Robot Build
    notes: 'The candidate robot design has been approved for racing, as it meets the
      necessary criteria despite needing further adjustments.


      - [Open this output](iteration-2/entity1/versions/0532a1a9235a4178a0be341c84b1ea8b/payload.json)

