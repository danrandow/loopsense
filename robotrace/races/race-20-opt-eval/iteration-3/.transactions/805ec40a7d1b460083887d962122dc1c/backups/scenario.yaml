  entities:
  - id: entity0
    label: Robot Candidate
    notes: 'Updated the robot''s controller parameters to improve line tracking stability
      and overall performance based on previous telemetry data.


      ### Rationale


      The robot''s performance indicated issues with line tracking stability, evidenced
      by 2 line loss events and a maximum error of 0.060533. To address this, I increased
      the kp value from 0.8 to 0.9 to enhance responsiveness. I also reduced the side
      sensor weights to 0.7 to prioritize the center sensor, which should improve
      tracking stability. Additionally, I increased the base speed to 0.15 to enhance
      overall progress without compromising control. These changes are expected to
      reduce line loss events and improve the maximum error.


      - [Open this output](iteration-3/entity0/versions/a1705c309107496785647cb5af3365b8/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-ee215b62820a528a/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-2ce8978df1821ccf/payload.json)'
  - id: entity1
    label: Approved Robot Build
    notes: 'The current candidate has been approved for racing, as it meets the necessary
