map:
  id: race-180-opt-eval
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: kp 7.0, kd 0.2 retest
    notes: 'Moves kp from 6.0 back toward 7.0 (between the raced 6.0 and 8.0 points)
      with kd 0.2, a single-group change. Iteration 3 (kp 6) dropped progress and
      score (36.1 vs 49.8 at kp 8), so the gain needs to stay near 7 to 8.


      ### Rationale


      Evidence. Iteration 2 (kp 8.0, kd 0.2) raised progress to 0.18 on the oval,
      0.10 on the s-bend and 0.085 on the slalom, and scored 49.78. Iteration 3 (kp
      6.0, kd 0.2) fell back to progress 0.12 / 0.04 / 0.10 and scored 36.05. Progress
      therefore tracks proportional gain, and kp 6 is clearly too weak. Steering oscillation
      at kp 8 was 0.13 to 0.15, above the 0.10 I had hoped for at kp 6, but the kp
      6 run did not reduce it enough to justify keeping that lower gain. The oval
      max_error stayed near 0.06 to 0.066 at both gains, so the standing offset is
      not yet resolved. All runs still end off_track with one line-loss event.


      Change. kp goes from 6.0 back to 7.0, midway between the two raced points, with
      kd kept at 0.2. This follows the Evaluator''s branch (b): progress has dropped
      below the kp 8 level, so return toward kp 7 and keep kd at 0.2. Geometry, base_speed,
      ki and line_loss are unchanged, so the race isolates the gain step.


      Expected result. Progress near 0.15 to 0.18 on the oval, steering_oscillation
      between about 0.10 and 0.14, and max_error near 0.06.


      Hypotheses and next steps. (a) If progress holds near the kp 8 level and oscillation
      stays at or below about 0.13, keep kp near 7 and move to sensor geometry: set
      sensor_size to 0.016 to reduce the centre-sensor dead band against the 25 mm
      tape. (b) If progress is still below about 0.15 on the oval, the gain is not
      the main limit, so test sensor geometry (sensor_size 0.016) at kp 8. (c) If
      the robot tracks the line with no off-track event but completion_time exceeds
      3 s, raise base_speed to 1.6 in a later single-group revision.


      Measurements wanted: progress and max_error per track, steering_oscillation,
      line_loss_events, completion_time, and rms_error, so I can separate offset from
      oscillation.


      - [Open this output](iteration-4/entity0/versions/70c454a149344368a0685e4385ff788a/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-4baacbfd395c4f88/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-ad6d2b1d340927ca/payload.json)'
  - id: entityR1
    label: Approve kp 7 gain step
    notes: 'Approved the kp 7.0 / kd 0.2 candidate as a single-group test between
      the raced kp 6 (36.05) and kp 8 (49.78) points. Feedback gives branch-based
      next steps: sensor_size 0.016 if progress holds, or back to kp 8 if progress
      falls.


      ### Feedback


      Judged from earlier races only; no outcome is stated for this candidate. Iteration
      2 (kp 8.0, kd 0.2) is the best raced design at 49.78, with progress 0.18 on
      the oval, 0.10 on the s-bend and 0.085 on the slalom. Iteration 3 (kp 6.0, kd
      0.2) fell to 36.05, with progress 0.12 / 0.04 / 0.10. Progress tracks kp across
      the two raced points, so kp 7.0 should sit between them, though it may not beat
      the kp 8 score. Steering_oscillation rose from about 0.07 at kp 5-6 to 0.13-0.15
      at kp 8, so kp 7 is a reasonable compromise. Every raced run ended off_track
      with one line-loss event and max_error near 0.06 to 0.066, so the standing offset
      and the dead band remain the unresolved problems. The change is a single gain
      step with geometry, base_speed, ki and line_loss unchanged, and the contract
      is respected. Approve: this is a clean, low-risk test with plenty of iterations
      left, and the telemetry will show whether progress holds at the kp 8 level while
      oscillation falls. Next race: (a) If oval progress is at or above about 0.15
      and steering_oscillation is at or below about 0.13, keep kp 7.0 and move to
      sensor geometry in one revision. (b) If progress is clearly below the kp 8 level,
      return to kp 8.0 with kd 0.2, since gain is the main source of progress. (c)
      If max_error is still near 0.06 with low oscillation, the centre-sensor dead
      band is the likely cause, so change sensor_size to 0.016. (d) If the robot tracks
      the line without an off-track event but completion_time exceeds 3 s, raise base_speed
      to 1.6 in a later single-group revision.


      ### Requested changes


      - If oval progress is at or above about 0.15 and steering_oscillation is at
      or below about 0.13, keep kp 7.0 and set sensor_size = 0.016 next, because the
      12 mm sensors at 0.02 m spacing leave a dead band around centre against the
      25 mm tape (iteration 2 max_error 0.066 on the oval).

      - If progress drops clearly below the kp 8 level, set kp = 8.0 with kd = 0.2,
      since iteration 2 gave oval progress 0.18 versus 0.12 at kp 6 (iteration 3).

      - If the robot tracks the line without off-track but completion_time exceeds
      3 s, set base_speed = 1.6, because the 3.0 s limit needs an average speed of
      about 1.5 m/s.


