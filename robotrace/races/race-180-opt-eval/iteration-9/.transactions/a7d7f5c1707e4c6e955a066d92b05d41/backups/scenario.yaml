map:
  id: race-180-opt-eval
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: kd 0.3 + search_right
    notes: 'Keeps kd 0.3 (oscillation fell to 0.156 oval and 0.130 s-bend in iteration
      8, s-bend progress held at 0.14) and makes one change, line_loss search_right,
      to target the slalom line loss that occurs once per run. The evidence is iteration
      8 race data (score 62.23) and the Evaluator''s branch (a).


      ### Rationale


      Evidence. Iteration 8 (kp 7.0, kd 0.3, outer sensors at x = ±0.06, sensor_size
      0.016) scored 62.23, below iteration 6 (kd 0.2, score 64.74). Steering oscillation
      fell on the oval (0.159 to 0.156) and on the s-bend (0.173 to 0.130), while
      s-bend progress held at 0.1425 and s-bend max_error stayed at 0.063. The derivative
      term is damping the bend response without losing s-bend progress. The score
      drop came from the oval (progress 0.218 to 0.202) and slalom (progress 0.103
      to 0.096, line_loss_events 1.0 per run). Slalom is the weakest track and has
      lost the line once per run in every race. Evaluator branch (a) applies: oscillation
      is below 0.16 on the oval and s-bend, s-bend progress holds near 0.14, and max_error
      stays near 0.06 m. So kd 0.3 is kept and the next single-group change is line_loss
      = search_right, as the Evaluator requested. Geometry (sensors at x = -0.06,
      -0.02, 0, 0.02, 0.06 at y = 0.04; sensor_size 0.016; wheel_track 0.12; wheel_radius
      0.03; body 0.16 x 0.12; mass 0.7), base_speed 1.4, kp 7.0, ki 0.0 and the sensor
      weights are unchanged, so the race isolates the line-loss behaviour. Change:
      line_loss from last_direction to search_right. Expected result: slalom line_loss_events
      fall or slalom progress rises above 0.10, with oscillation and s-bend progress
      roughly unchanged. Risk: search_right steers left on loss, so if the slalom
      line is lost on a right-hand curve this could worsen the run. Hypotheses: (1)
      if slalom progress rises and line_loss_events drop, keep search_right. (2) If
      slalom progress falls or the oval/s-bend change, revert to last_direction and
      address the slalom loss another way. (3) If the robot tracks without off_track
      but completion_time exceeds 3 s, raise base_speed to 1.6 in a later single-group
      revision. Measurements wanted: progress, max_error, line_loss_events and steering_oscillation
      per track, plus completion_time and rms_error.


      - [Open this output](iteration-9/entity0/versions/795f71e3d01940079f673366cd1faeaa/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-44289c4d238abed3/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-d956ab58febb65b5/payload.json)'
  - id: entityR1
    label: 'Revise: kd back to 0.2'
    notes: 'Revise because the candidate combines kd 0.3, which scored below the best
      raced design (iteration 8 at 62.23 against iteration 6 at 64.74), with an untested
      line_loss change. The revision returns kd to 0.2 and isolates search_right on
      the slalom line loss, which has occurred once per run in every race.


      ### Feedback


      Judged from earlier races and this candidate''s contents only. No outcome is
      stated for it. The candidate is iteration 8''s design (kp 7.0, kd 0.3, outer
      sensors at x = ±0.06, sensor_size 0.016, base_speed 1.4) with line_loss changed
      from last_direction to search_right. Every value is inside its contract range.


      The main problem is that the candidate is not the best design on the evidence.
      Iteration 6 (kd 0.2, same geometry, kp 7.0, last_direction) scored 64.74, the
      best raced score. Iteration 8 (kd 0.3) scored 62.23, with oval progress 0.202
      against 0.218, slalom progress 0.096 against 0.103, and s-bend progress unchanged
      at 0.14. Raising kd lowered oscillation (oval 0.159 to 0.156, s-bend 0.173 to
      0.130) but cost progress, so kd 0.2 is the better derivative setting for score.
      The search_right change is still worth testing, because slalom has lost the
      line once per run in every race (iterations 0 to 8) and its progress is stuck
      near 0.10. Changing kd and line_loss together would confound the result, so
      kd should go back to 0.2 and search_right should be tested alone against iteration
      6.


      Read the next race as follows. (a) If slalom line_loss_events fall or slalom
      progress rises above 0.10 with oval and s-bend progress near iteration 6, keep
      search_right and move on. (b) If slalom progress falls, or the oval or s-bend
      worsen, revert line_loss to last_direction and address the slalom loss through
      geometry, for example the outer sensors at x = ±0.08. (c) If the robot tracks
      without off_track but completion_time exceeds 3 s, raise base_speed to 1.6 in
      a later single-group revision. Report progress, max_error, line_loss_events
      and steering_oscillation per track, plus completion_time and rms_error.


      ### Requested changes


      - Set controller.kd = 0.2 (the iteration 6 value). Iteration 8 at kd 0.3 scored
      62.23, below iteration 6''s 64.74, with oval progress 0.202 against 0.218 and
      slalom progress 0.096 against 0.103.

      - Keep controller.line_loss = search_right and make no other change, so it is
      tested alone against iteration 6. Slalom has lost the line once per run in every
      earlier race with progress stuck near 0.10.

      - Keep kp 7.0, ki 0.0, base_speed 1.4, the sensor weights and all geometry at
      iteration 6 values. If completion_time exceeds 3 s without off_track in a later
      race, raise base_speed to 1.6 as a single-group change.


      - [Open this output](iteration-9/entityR1/versions/830eae848ad84e5ab170c8e68aa2bb39/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/795f71e3d01940079f673366cd1faeaa/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-d956ab58febb65b5/payload.json)'
