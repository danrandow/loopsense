map:
  id: race-180-opt-eval
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: kd 0.3 at kp 7 (revert)
    notes: 'Reverts kp from 6.5 to 7.0, since iteration 7 dropped s-bend progress
      from 0.14 to 0.06, and raises kd from 0.2 to 0.3 to damp the 0.16 oval oscillation.
      This is a single-group change from the best raced design (iteration 6, score
      64.74).


      ### Rationale


      Evidence. Iteration 6 (outer sensors at x = ±0.06, sensor_size 0.016, kp 7.0,
      kd 0.2, ki 0.0) is the best raced design at 64.74. Iteration 7 changed only
      kp, to 6.5, and scored 53.37. Its s-bend progress fell back from 0.140 to 0.059,
      with s-bend score spread from 18.1 to 59.2, so kp is contributing to the bend
      stall. Oval steering_oscillation was unchanged at 0.1589, so the kp drop did
      not reduce oscillation. The Evaluator''s branch (b) applies: return to kp 7.0
      and reduce oscillation through kd instead.


      Change. kp goes back to 7.0 and kd rises from 0.2 to 0.3, the Evaluator''s suggested
      kd range. Relative to the best design (iteration 6), this is a single-group
      change to kd. Geometry (outer sensors at ±0.06, sensor_size 0.016), base_speed
      1.4, ki 0.0, the weights and line_loss last_direction are unchanged.


      Expected result. s-bend progress returns near 0.14, and steering_oscillation
      falls below about 0.16 on the oval and s-bend because the derivative term damps
      the response. Max_error should stay near 0.06 m.


      Hypotheses. (1) If oscillation falls and s-bend progress holds at about 0.14,
      kd is the right lever. The next single-group test is line_loss search_right,
      since slalom has lost the line once per run in every race with progress stuck
      near 0.10. (2) If kd 0.3 adds jitter without lowering oscillation, the derivative
      is amplifying sensor noise, so return to kd 0.2 and accept the oscillation.
      (3) If the robot tracks without off_track but completion_time exceeds 3 s, raise
      base_speed to 1.6 in a later single-group revision.


      Measurements wanted: progress, max_error, line_loss_events and steering_oscillation
      per track (oval, s-bend, slalom), plus completion_time and rms_error. These
      separate the oval trade-off from the slalom line loss.


      - [Open this output](iteration-8/entity0/versions/e4a08b2a18d542d08aa42767e6898d2a/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-c96197018a7ffbc4/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-fdc968ea5572f036/payload.json)'
  - id: entityR1
    label: Approve kd 0.3 test
    notes: 'Approved a single-group change from the best raced design (iteration 6,
      64.74): kd 0.2 to 0.3, with kp kept at 7.0 because iteration 7 showed kp 6.5
      cut s-bend progress. The race tests whether derivative damping lowers the 0.16
      to 0.17 steering oscillation without losing progress.


      ### Feedback


      Written before this candidate races, so no outcome is stated for it. The candidate
      is a single-group change from iteration 6, the best raced design (score 64.74):
      kd 0.2 to 0.3, with kp 7.0, ki 0.0, outer sensors at x = ±0.06, sensor_size
      0.016, base_speed 1.4 and line_loss last_direction unchanged. Every value is
      inside its contract range. Iteration 6 had steering_oscillation of 0.159 on
      the oval and 0.173 on the s-bend, against about 0.07 at kp 5 to 6 (iterations
      0 and 3), so oscillation is the cost to reduce. Iteration 7 showed that lowering
      kp to 6.5 pulled s-bend progress back from 0.140 to 0.059 and dropped the score
      to 53.37, so the kp 7.0 level should be kept. Read the next race as follows.
      (a) If steering_oscillation falls below about 0.16 on the oval and s-bend while
      s-bend progress holds near 0.14 and max_error stays near 0.06 m, kd is the right
      lever. Keep kd 0.3 and test line_loss = search_right in a single-group revision,
      because slalom has lost the line once per run in every race with progress stuck
      near 0.10. (b) If oscillation does not fall, or jitter rises with no progress
      gain, the derivative is amplifying sensor noise, so return to kd 0.2 and accept
      the oscillation. (c) If the robot tracks without off_track but completion_time
      exceeds 3 s, raise base_speed to 1.6 in a later single-group revision. Report
      progress, max_error, line_loss_events and steering_oscillation per track, plus
      completion_time and rms_error. Approve: this is the best raced design with one
      low-risk change, and with three iterations left the race telemetry is worth
      more than another paper revision.


      ### Requested changes


      - If steering_oscillation drops below about 0.16 with s-bend progress near 0.14
      (iteration 6 baseline), keep kd = 0.3 and test line_loss = search_right in a
      single-group revision, since slalom has lost the line once per run in every
      earlier race with progress near 0.10.

      - If oscillation does not fall, or s-bend progress or max_error worsens, return
      to kd = 0.2 (the iteration 6 value) and keep kp 7.0, since iteration 7 showed
      that kp 6.5 cut s-bend progress from 0.140 to 0.059.

      - If the robot tracks without off_track but completion_time exceeds 3 s, set
      base_speed = 1.6 in a single-group revision, because the 3.0 s limit needs an
      average speed of about 1.5 m/s.


      - [Open this output](iteration-8/entityR1/versions/b56f6eb260e842888efe6544b406f7cb/payload.json)

