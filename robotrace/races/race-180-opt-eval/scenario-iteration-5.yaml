overrides:
  entities:
  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence. Iteration 4 (kp 7.0, kd 0.2, ki 0.0) is the middle point between the
      two earlier gain tests. It scored 45.59, with oval progress 0.193, steering_oscillation
      0.128 and max_error 0.063. Progress has tracked kp (kp 6 gave 0.12, kp 8 gave
      0.18), and kp 7 keeps oscillation at or below 0.13. The Evaluator''s branch
      (c) applies: progress is good, oscillation is low, and max_error still sits
      at about 0.06 m on the oval, so the standing offset looks geometric, not a gain
      problem. The s-bend progress is flat at about 0.04 for kp 5, 6 and 7, which
      points to a fixed stall point caused by the sensor footprint rather than the
      gain. Every run still ends off_track with one line-loss event.


      Change. sensor_size goes from 0.012 to 0.016 m. The 25 mm tape is wider than
      the 12 mm footprint, and with sensors spaced 0.02 m apart the centre sensor
      can read only part of the tape, so there is a dead band near centre where the
      signal stays near zero. A 16 mm footprint reads a larger share of the tape at
      each offset and should shrink that dead band. Everything else is unchanged (kp
      7.0, kd 0.2, ki 0.0, base_speed 1.4, sensor positions, weights and line_loss),
      so this race isolates the sensor change.


      Expected result. max_error on the oval falls below about 0.06 m, line_loss_events
      falls toward 0 on the s-bend, and s-bend progress rises above the flat 0.04.
      Oscillation should stay near 0.13 or below, since kp is unchanged.


      Hypotheses. (a) If max_error drops and s-bend progress rises, the dead band
      was the limit, and the next step is to reduce kp to about 6.5 or widen the outer
      sensors to x = ±0.06 to cut oscillation. (b) If max_error and s-bend progress
      do not change, the stall is at a bend the sensors cannot follow, so test outer
      sensors at x = ±0.06 next. (c) If the robot tracks the line without an off-track
      event but completion_time exceeds 3 s, raise base_speed to 1.6 in a later single-group
      revision.


      Measurements wanted: progress, max_error and line_loss_events per track, steering_oscillation,
      completion_time and rms_error, to separate offset from oscillation and to see
      whether the s-bend stall moves.


      - [Open this output](iteration-5/entity0/versions/133d897c9b5c454fa15648c1b4362107/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-2122abee9046a8f1/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-af35435544af15b8/payload.json)'
  - id: entityR1
    label: Sensor 16mm test at kp 7
    notes: 'Approved as a single-group test: sensor_size raised from 0.012 to 0.016
      with kp 7.0 and kd 0.2 unchanged. Evidence: every earlier race ended off_track
      with max_error near 0.06 m and flat s-bend progress, which points to a centre
      dead band from the 12 mm footprint against the 25 mm tape. Feedback sets the
      next revision by how max_error and s-bend progress respond.


      ### Feedback


      Written before this candidate races, so no outcome is stated for it. The candidate
      is a single-group test: sensor_size 0.012 to 0.016 at kp 7.0, kd 0.2, ki 0.0,
      with geometry positions, weights, base_speed 1.4 and line_loss last_direction
      unchanged. Each field is inside its contract range, and 0.016 is an allowed
      sensor_size. The earlier evidence supports the change. Iterations 0 to 4 all
      ended off_track with one line-loss event per run and max_error at 0.060 to 0.066
      m, and kp alone moved progress (kp 6 gave oval 0.12, kp 7 gave 0.19, kp 8 gave
      0.18). With 12 mm sensors at 0.02 m spacing and a 25 mm tape, a centre dead
      band is plausible, so this race tests it directly. Read the next race as follows.
      (a) If max_error falls below about 0.06 m and the s-bend progress rises above
      the flat 0.04 seen at kp 5 to 7, keep sensor_size 0.016 and reduce kp to 6.5
      or widen the outer sensors to x = ±0.06 to cut steering_oscillation, which was
      0.13 to 0.15 at kp 8. (b) If max_error and s-bend progress are unchanged, the
      stall is at a bend the sensors cannot follow, so test outer sensors at x = ±0.06
      with sensor_size 0.016. (c) If the robot tracks without off_track but completion_time
      exceeds 3 s, raise base_speed to 1.6 in a later single-group revision. Change
      one group per revision.


      ### Requested changes


      - If max_error falls below about 0.06 m and s-bend progress rises above 0.04,
      keep sensor_size 0.016 and set kp to 6.5 with kd 0.2, since kp 8 raised steering_oscillation
      to 0.13 to 0.15 (iteration 2) while kp 6 gave oval progress only 0.12 (iteration
      3).

      - If max_error and s-bend progress are unchanged with sensor_size 0.016, keep
      kp 7.0 and move the outer sensors to x = ±0.06 (positions at y 0.04), citing
      the flat s-bend progress of about 0.04 across kp 5, 6 and 7 (iterations 0, 3,
      4).

      - If the robot tracks the line without off_track but completion_time exceeds
      3 s, set base_speed = 1.6 in a single-group revision, since the 3.0 s limit
      needs an average speed of about 1.5 m/s.


      - [Open this output](iteration-5/entityR1/versions/8e9034e071e446abb288f1f9f74d97ab/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/133d897c9b5c454fa15648c1b4362107/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-af35435544af15b8/payload.json)'
