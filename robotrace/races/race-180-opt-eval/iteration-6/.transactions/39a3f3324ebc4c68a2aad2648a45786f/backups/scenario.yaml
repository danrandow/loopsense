map:
  id: race-180-opt-eval
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Outer sensors at x=±0.06
    notes: 'Single-group change from iteration 5: outer sensors moved from x=±0.04
      to ±0.06, with sensor_size 0.016 and kp 7.0 kept. Iteration 5 left s-bend progress
      flat at 0.040 and max_error near 0.062, which points to a bend the sensors cannot
      reach, so this tests whether wider outer sensors see the line earlier.


      ### Rationale


      Evidence from iteration 5 (sensor_size 0.016, kp 7.0, kd 0.2, ki 0.0): the best
      raced score so far at 60.49. Oval progress rose to 0.30 (from 0.19 at sensor_size
      0.012), and oval max_error held at 0.061. The s-bend, however, is unchanged:
      progress is still 0.040, and max_error is 0.0616 with one line-loss event per
      run. Every track still ends off_track, and steering_oscillation is 0.07 to 0.17.
      Because the s-bend stall did not move after the sensor-size change, the dead-band
      explanation no longer accounts for it. The likely cause is a bend that the sensors
      cannot follow: the outer sensors at x = ±0.04 see the tape too late when the
      line curves sharply, so the robot leaves it. This is branch (b) of the Evaluator''s
      plan. Change: move the two outer sensors from x = ±0.04 to x = ±0.06 (y stays
      0.04), keeping sensor_size 0.016, kp 7.0, kd 0.2, ki 0.0, base_speed 1.4, the
      weights [-1, -0.5, 0, 0.5, 1] and line_loss last_direction. This is a single-group
      geometry change. Expected result: s-bend progress rises clearly above 0.04 and
      max_error falls below about 0.06 m on the s-bend, because the outer sensors
      see the line earlier on the bend. Oval progress should hold near 0.30. Hypotheses:
      (1) if s-bend progress rises, the sensor reach was the limit, and the next step
      is to lower kp to about 6.5 to reduce steering_oscillation. (2) If s-bend progress
      is still flat at 0.04, the limit is elsewhere (base_speed or the line-loss behaviour
      at the bend), and the next revision should test line_loss search_right or a
      lower base_speed. (3) If the robot tracks without off_track but completion_time
      exceeds 3 s, raise base_speed to 1.6 in a later single-group revision. Measurements
      wanted: progress, max_error and line_loss_events per track (especially s-bend),
      steering_oscillation, completion_time and rms_error.


      - [Open this output](iteration-6/entity0/versions/bda24f2deb874edd9a9e8c59fd2bd6fe/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-3581074ed80ea499/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-caae00a11b62129d/payload.json)'
  - id: entityR1
    label: Sensor 16mm test at kp 7
    notes: 'Approved as a single-group test: sensor_size raised from 0.012 to 0.016
      with kp 7.0 and kd 0.2 unchanged. Evidence: every earlier race ended off_track
      with max_error near 0.06 m and flat s-bend progress, which points to a centre
      dead band from the 12 mm footprint against the 25 mm tape. Feedback sets the
      next revision by how max_error and s-bend progress respond.


      ### Feedback


      Written before this candidate races, so no outcome is stated for it. The candidate
      is a single-group test: sensor_size 0.012 to 0.016 at kp 7.0, kd 0.2, ki 0.0,
      with geometry positions, weights, base_speed 1.4 and line_loss last_direction
      unchanged. Each field is inside its contract range, and 0.016 is an allowed
      sensor_size. The earlier evidence supports the change. Iterations 0 to 4 all
      ended off_track with one line-loss event per run and max_error at 0.060 to 0.066
      m, and kp alone moved progress (kp 6 gave oval 0.12, kp 7 gave 0.19, kp 8 gave
      0.18). With 12 mm sensors at 0.02 m spacing and a 25 mm tape, a centre dead
      band is plausible, so this race tests it directly. Read the next race as follows.
      (a) If max_error falls below about 0.06 m and the s-bend progress rises above
      the flat 0.04 seen at kp 5 to 7, keep sensor_size 0.016 and reduce kp to 6.5
      or widen the outer sensors to x = ±0.06 to cut steering_oscillation, which was
      0.13 to 0.15 at kp 8. (b) If max_error and s-bend progress are unchanged, the
      stall is at a bend the sensors cannot follow, so test outer sensors at x = ±0.06
      with sensor_size 0.016. (c) If the robot tracks without off_track but completion_time
      exceeds 3 s, raise base_speed to 1.6 in a later single-group revision. Change
      one group per revision.


      ### Requested changes


      - If max_error falls below about 0.06 m and s-bend progress rises above 0.04,
      keep sensor_size 0.016 and set kp to 6.5 with kd 0.2, since kp 8 raised steering_oscillation
      to 0.13 to 0.15 (iteration 2) while kp 6 gave oval progress only 0.12 (iteration
      3).

      - If max_error and s-bend progress are unchanged with sensor_size 0.016, keep
      kp 7.0 and move the outer sensors to x = ±0.06 (positions at y 0.04), citing
      the flat s-bend progress of about 0.04 across kp 5, 6 and 7 (iterations 0, 3,
      4).

      - If the robot tracks the line without off_track but completion_time exceeds
      3 s, set base_speed = 1.6 in a single-group revision, since the 3.0 s limit
      needs an average speed of about 1.5 m/s.


      - [Open this output](iteration-5/entityR1/versions/8e9034e071e446abb288f1f9f74d97ab/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/133d897c9b5c454fa15648c1b4362107/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-af35435544af15b8/payload.json)'
