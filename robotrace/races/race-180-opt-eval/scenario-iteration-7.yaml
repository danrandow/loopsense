map:
  id: race-180-opt-eval
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Outer sensors ±0.06, kp
    notes: 'Keeps the ±0.06 outer-sensor geometry that lifted s-bend progress from
      0.04 to 0.14 and cuts line losses to zero there, and lowers kp from 7.0 to 6.5
      to bring steering oscillation (0.16 to 0.17) down. Based on iteration 6 race
      data (score 64.74).


      ### Rationale


      Evidence from iteration 6 (outer sensors at x = ±0.06, sensor_size 0.016, kp
      7.0, kd 0.2, ki 0.0; score 64.74, the best raced design). The s-bend progress
      rose from the flat 0.04 seen in iterations 0 to 5 to 0.14, and its line_loss_events
      fell from 1.0 to 0.0. The outer-sensor reach was therefore the limit at the
      bend, as the Evaluator''s branch (a) predicted. The s-bend max_error is 0.0605,
      essentially at the 0.06 m off-track limit. Oval progress fell from 0.30 to 0.22
      and oval line_loss_events fell to 0. Slalom is unchanged at progress 0.10 with
      one line loss per run. The main remaining cost is steering_oscillation, which
      is 0.159 on the oval and 0.173 on the s-bend, against about 0.07 at kp 5 to
      6. Following the Evaluator''s plan (a), this candidate keeps the ±0.06 outer
      sensors and sensor_size 0.016, and changes one group only: kp from 7.0 to 6.5
      with kd kept at 0.2. Expected result: steering_oscillation falls to roughly
      0.13 to 0.15 on the oval and s-bend, max_error stays near or below 0.06 m, and
      s-bend progress holds near 0.14. Oval progress may dip slightly (about 0.18
      to 0.22), which is the trade-off to watch. Hypotheses: (1) if s-bend progress
      holds and oscillation drops, the next single-group revision is line_loss search_right
      or a test of the slalom line loss. (2) If s-bend progress falls back toward
      0.04, kp is contributing to the bend stall, so return to kp 7.0 and address
      oscillation with kd. (3) If the robot tracks without off_track but completion_time
      exceeds 3 s, raise base_speed to 1.6 in a later single-group revision. Slalom
      remains the weakest track (line_loss 1.0 per run, progress 0.10), so its line-loss
      behaviour is the next thing to examine.


      - [Open this output](iteration-7/entity0/versions/0ec382edca62486191cf03fb7bb8504b/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-91436b476a29108c/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-6f1adbcda2e5cb6d/payload.json)'
  - id: entityR1
    label: Lower kp to 6.5 (approve)
    notes: 'Approves a single-group step from the best raced design (iteration 6,
      score 64.74): kp 7.0 to 6.5 to cut steering_oscillation (0.16 to 0.17 at kp
      7 in iteration 6). The change is low risk and gives telemetry on whether s-bend
      progress holds at 0.14.


      ### Feedback


      Judged from earlier races and the candidate''s contents only; no outcome is
      stated for this candidate. The candidate changes one group from iteration 6,
      the best raced design (score 64.74): kp 7.0 to 6.5, with kd 0.2, ki 0.0, outer
      sensors at x = ±0.06, sensor_size 0.016, base_speed 1.4 and line_loss last_direction
      unchanged. All values are inside the contract ranges. The change is supported
      by the evidence. Iteration 6 showed steering_oscillation of 0.159 on the oval
      and 0.173 on the s-bend, against about 0.07 at kp 5 to 6 (iterations 0 and 3).
      Iteration 3 (kp 6, sensor 0.012) showed that a lower kp costs progress on the
      oval (0.12 against 0.19 at kp 7, iteration 4), so this is a trade-off to watch,
      not a clear gain. Read the next race as follows. (a) If s-bend progress holds
      near 0.14 and oscillation falls toward 0.13 to 0.15, keep kp 6.5 and make one
      next single-group change: line_loss search_right to probe the slalom line loss,
      which has been 1.0 per run on every earlier race with progress stuck at 0.10.
      (b) If s-bend progress falls back toward 0.04, kp is contributing to the bend
      stall, so return to kp 7.0 and address oscillation through kd instead (for example
      kd 0.25 to 0.3). (c) If the robot tracks without off_track but completion_time
      exceeds 3 s, raise base_speed to 1.6 in a later single-group revision. Report
      progress, max_error, line_loss_events and steering_oscillation per track, so
      the oval trade-off and the slalom line loss can be separated.


      ### Requested changes


      - If s-bend progress holds near 0.14 and steering_oscillation falls toward 0.13
      to 0.15 at kp 6.5, keep kp 6.5 and test line_loss = search_right in a single-group
      revision, since slalom has lost the line once per run in every race (iterations
      0 to 6) with progress stuck near 0.10.

      - If s-bend progress falls back toward 0.04 at kp 6.5, return to kp = 7.0 and
      reduce oscillation through kd (try kd = 0.3), since kp 7 gave s-bend progress
      0.14 at iteration 6 and kp 6 at the 0.012 sensor size gave a flat 0.04 (iteration
      3).

      - If the robot tracks without off_track but completion_time exceeds 3 s, set
      base_speed = 1.6 in a single-group revision, because the 3.0 s limit needs an
      average speed of about 1.5 m/s.


      - [Open this output](iteration-7/entityR1/versions/1406f1dfbd6c4719b45db8dd9983dab7/payload.json)

