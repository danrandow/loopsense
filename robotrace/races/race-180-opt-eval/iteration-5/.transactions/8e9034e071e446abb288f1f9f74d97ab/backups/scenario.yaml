map:
  id: race-180-opt-eval
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence. Iteration 4 (kp 7.0, kd 0.2, ki 0.0) is the middle point between the
      two earlier gain tests. It scored 45.59, with oval progress 0.193, steering_oscillation
      0.128 and max_error 0.063. Progress has tracked kp (kp 6 gave 0.12, kp 8 gave
      0.18), and kp 7 keeps oscillation at or below 0.13. The Evaluator''s branch
      (c) applies: progress is good, oscillation is low, and max_error still sits
      at about 0.06 m on the oval, so the standing offset looks geometric, not a gain
      problem. The s-bend progress is flat at about 0.04 for kp 5, 6 and 7, which
      points to a fixed stall point caused by the sensor footprint rather than the
      gain. Every run still ends off_track with one line-loss event.


      Change. sensor_size goes from 0.012 to 0.016 m. The 25 mm tape is wider than
      the 12 mm footprint, and with sensors spaced 0.02 m apart the centre sensor
      can read only part of the tape, so there is a dead band near centre where the
      signal stays near zero. A 16 mm footprint reads a larger share of the tape at
      each offset and should shrink that dead band. Everything else is unchanged (kp
      7.0, kd 0.2, ki 0.0, base_speed 1.4, sensor positions, weights and line_loss),
      so this race isolates the sensor change.


      Expected result. max_error on the oval falls below about 0.06 m, line_loss_events
      falls toward 0 on the s-bend, and s-bend progress rises above the flat 0.04.
      Oscillation should stay near 0.13 or below, since kp is unchanged.


      Hypotheses. (a) If max_error drops and s-bend progress rises, the dead band
      was the limit, and the next step is to reduce kp to about 6.5 or widen the outer
      sensors to x = ±0.06 to cut oscillation. (b) If max_error and s-bend progress
      do not change, the stall is at a bend the sensors cannot follow, so test outer
      sensors at x = ±0.06 next. (c) If the robot tracks the line without an off-track
      event but completion_time exceeds 3 s, raise base_speed to 1.6 in a later single-group
      revision.


      Measurements wanted: progress, max_error and line_loss_events per track, steering_oscillation,
      completion_time and rms_error, to separate offset from oscillation and to see
      whether the s-bend stall moves.


      - [Open this output](iteration-5/entity0/versions/133d897c9b5c454fa15648c1b4362107/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-2122abee9046a8f1/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-af35435544af15b8/payload.json)'
  - id: entityR1
    label: Approve kp 7 gain step
    notes: 'Approved the kp 7.0 / kd 0.2 candidate as a single-group test between
      the raced kp 6 (36.05) and kp 8 (49.78) points. Feedback gives branch-based
      next steps: sensor_size 0.016 if progress holds, or back to kp 8 if progress
      falls.


      ### Feedback


      Judged from earlier races only; no outcome is stated for this candidate. Iteration
      2 (kp 8.0, kd 0.2) is the best raced design at 49.78, with progress 0.18 on
      the oval, 0.10 on the s-bend and 0.085 on the slalom. Iteration 3 (kp 6.0, kd
      0.2) fell to 36.05, with progress 0.12 / 0.04 / 0.10. Progress tracks kp across
      the two raced points, so kp 7.0 should sit between them, though it may not beat
      the kp 8 score. Steering_oscillation rose from about 0.07 at kp 5-6 to 0.13-0.15
      at kp 8, so kp 7 is a reasonable compromise. Every raced run ended off_track
      with one line-loss event and max_error near 0.06 to 0.066, so the standing offset
      and the dead band remain the unresolved problems. The change is a single gain
      step with geometry, base_speed, ki and line_loss unchanged, and the contract
      is respected. Approve: this is a clean, low-risk test with plenty of iterations
      left, and the telemetry will show whether progress holds at the kp 8 level while
      oscillation falls. Next race: (a) If oval progress is at or above about 0.15
      and steering_oscillation is at or below about 0.13, keep kp 7.0 and move to
      sensor geometry in one revision. (b) If progress is clearly below the kp 8 level,
      return to kp 8.0 with kd 0.2, since gain is the main source of progress. (c)
      If max_error is still near 0.06 with low oscillation, the centre-sensor dead
      band is the likely cause, so change sensor_size to 0.016. (d) If the robot tracks
      the line without an off-track event but completion_time exceeds 3 s, raise base_speed
      to 1.6 in a later single-group revision.


      ### Requested changes


      - If oval progress is at or above about 0.15 and steering_oscillation is at
      or below about 0.13, keep kp 7.0 and set sensor_size = 0.016 next, because the
      12 mm sensors at 0.02 m spacing leave a dead band around centre against the
      25 mm tape (iteration 2 max_error 0.066 on the oval).

      - If progress drops clearly below the kp 8 level, set kp = 8.0 with kd = 0.2,
      since iteration 2 gave oval progress 0.18 versus 0.12 at kp 6 (iteration 3).

      - If the robot tracks the line without off-track but completion_time exceeds
      3 s, set base_speed = 1.6, because the 3.0 s limit needs an average speed of
      about 1.5 m/s.


      - [Open this output](iteration-4/entityR1/versions/dcebde4395074e439028bf72d28cdbfc/payload.json)

