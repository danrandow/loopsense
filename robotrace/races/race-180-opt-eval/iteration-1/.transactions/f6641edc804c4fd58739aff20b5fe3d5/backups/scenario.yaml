overrides:
  entities:
  - id: entity0
    label: Add integral (ki 0.6)
    notes: 'Keeps geometry and kp/kd unchanged and adds integral action (ki = 0.6)
      to cancel the steady drift seen in the baseline. The baseline had zero finishes,
      max error at the 0.06 m off-track limit, and low oscillation, which points to
      a constant bias such as motor mismatch.


      ### Rationale


      Evidence from the baseline (entityR2A, 60 trials, zero finishes): every trial
      went off track, with progress of only 0.04 to 0.125 and one line-loss event
      per run. Max error sat at about 0.06 m, the off-track limit, while steering_oscillation
      stayed low (about 0.07). The robot is not jittering. It drifts steadily away
      from the line, and the drift is similar on all three tracks, including the oval,
      which is the easiest. A steady drift like this points to a constant bias. The
      likely source is the fixed left/right motor mismatch in the simulator. With
      proportional-only control, a constant bias leaves a standing offset of roughly
      bias/kp in signal, so the robot never returns to centre and eventually leaves
      the tape, then loses the line. Geometry is kept unchanged so this race isolates
      the controller. The change is one group only: add integral action with ki =
      0.6 to cancel the constant bias. The integral is clamped at ±2 by the contract,
      so it cannot wind up badly. kp stays at 5 and kd at 0.1, and base_speed stays
      at 1.4 because speed does not appear to be the cause. Expected result: rms_error
      falls well below 0.03 m, max_error stays clear of 0.06 m, and progress rises
      toward 1.0 on the oval. Hypotheses to test next: (1) if progress still stalls
      near the same point, the bias is larger than ki can handle, or the robot is
      losing the line at a specific bend, which would point to widening the outer
      sensors to x = ±0.06; (2) if the robot now oscillates, reduce kp to 4 and keep
      kd at 0.1; (3) if it finishes with a time above about 3 s, raise base_speed
      to 1.6. Measurements requested: completion, progress, completion_time, rms_error,
      max_error, line_loss_events, steering_oscillation.


      - [Open this output](iteration-1/entity0/versions/ac408c33a8c34ce39125c180d14fee81/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-9ffefa9bf8402330/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-197d6eb8d0b6ee70/payload.json)'
  - id: entityR1
    label: Approve ki=0.6 bias fix
    notes: 'Approved the integral-action candidate (ki 0.6) to race now, since the
      baseline showed a steady drift on all tracks with zero finishes, which points
      to a constant motor bias. Requested changes are conditional on the next race:
      widen sensors, lower kp, or raise base_speed, depending on what the telemetry
      shows.


      ### Feedback


      Judged from the baseline race (iteration 0, 60 trials, zero finishes, progress
      0.04 to 0.125, one line-loss event per run, max_error about 0.06 m, steering_oscillation
      about 0.07). The baseline shows a steady drift off the line on all three tracks,
      not jitter, which fits a constant bias from the motor mismatch. Adding ki =
      0.6 is a single-group change aimed at that bias, and every field is inside its
      contract range (ki 0 to 5, integral clamped at ±2). The candidate is valid and
      addresses the diagnosed failure, so it is worth racing now, while this is still
      early exploration. This feedback states no outcome for the candidate. Next race:
      if progress still stalls at the same point on the oval, the bias or a bend is
      beyond what ki can correct, so widen the outer sensors to x = ±0.06 before changing
      gains. If the robot now oscillates (steering_oscillation rises well above about
      0.07, or max_error clusters near 0.06 m on the s-bend or slalom), lower kp to
      4.0 and keep kd at 0.1. If it finishes with completion_time above about 3 s,
      raise base_speed to 1.6. Change one group per revision so each race stays readable.


      ### Requested changes


      - If progress stalls near the same point with ki = 0.6 and no oscillation, widen
      the outer sensors to x = ±0.06 (keep sensor_size 0.012), citing the baseline''s
      line_loss_events of 1.0 per run on all tracks.

      - If steering_oscillation rises or max_error approaches 0.06 m with ki = 0.6
      in place, set kp = 4.0 and keep kd = 0.1, citing the iteration 0 max_error of
      about 0.060 m.

      - If the run completes with completion_time above about 3 s, set base_speed
      = 1.6, since the 3 s limit needs an average speed near 1.5 m/s.


      - [Open this output](iteration-1/entityR1/versions/dd7bd2246c19460f998af40466f11b7d/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/ac408c33a8c34ce39125c180d14fee81/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-197d6eb8d0b6ee70/payload.json)'
