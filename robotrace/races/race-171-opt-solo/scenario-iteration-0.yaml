  entities:
  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'Baseline candidate built from the contract, not from race data (iteration
      0 has none): five 12 mm sensors ahead of the axle, kp 4, kd 0.3, base speed
      1.3, last-direction line loss. It is intended to produce the first telemetry
      for revision.


      ### Rationale


      Iteration 0 has no race telemetry yet, so this is a conservative baseline built
      from the contract rather than from evidence. Geometry: five line sensors spread
      across the centre (x = -0.04 to +0.04 m in 0.02 m steps) and placed 0.04 m ahead
      of the axle, so the steering signal is read slightly before the wheels reach
      the tape. A 12 mm footprint is used so that the 25 mm tape is always covered
      by at least one or two sensors, which avoids false line-loss events on bends.
      Wheel track 0.12 m, radius 0.03 m, body 0.12 x 0.18 m and mass 0.8 kg are mid-range
      values that give a stable yaw inertia and a body width that keeps the off-track
      limit at about 0.07 m. Controller: sensor weights are antisymmetric and scaled
      to +/-1 at the outside sensors, so the signal stays within about +/-1. kp =
      4 gives a strong but not saturating steering response (about 1400 PWM counts
      at full deflection). kd = 0.3 damps the overshoot that kp alone would cause
      on the curves. ki = 0.1 is kept small to avoid integral windup on long bends.
      base_speed = 1.3 (about 2.6 m/s of commanded speed scale, throttle-limited in
      practice) aims at the roughly 1.5 m/s average needed to finish in 3 s while
      leaving margin for the slalom. line_loss = last_direction, so the robot keeps
      turning the way it was last steering when the tape is lost. Expected result:
      completion on the oval and s-bend tracks, with the main risks being oscillation
      at high speed on the slalom and a possible line loss on the sharpest bend. The
      next iteration should reduce base_speed or kd if steering_oscillation is high,
      and raise kp or base_speed if completion_time is too long.


      - [Open this output](iteration-0/entity0/versions/8006d3395d9a457ba4d0b99718be7963/payload.json)'
