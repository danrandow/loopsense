  - id: entity0
    label: 'Final: reverted to iter 9'
    notes: 'Reverts to the best measured design (iteration 9, score 917.2, 20/20 oval
      and s-bend, 18/20 slalom). Iteration 10''s narrower track and lighter mass reduced
      slalom completions and raised oscillation, so they are not carried forward.


      ### Rationale


      Iteration 11 is the final iteration, so this design is the one the unseen-track
      race will use. Iteration 9 is the best measured design (score 917.2). On development
      tracks it finished 20/20 on the oval (2.26 s) and 20/20 on the s-bend (2.41
      s). On the slalom it finished 18/20. Iteration 10 tried a narrower track (0.08
      m), lighter mass (0.45 kg) and base_speed 0.80. That lowered the score to 907.3:
      the slalom fell to 17/20, with steering oscillation rising from 0.41 to 0.43
      and mean time from 2.80 s to 2.87 s. So the extra agility gained was outweighed
      by instability, and the lower-speed, slightly heavier setting is the more robust
      choice. I therefore revert to the iteration 9 design unchanged. Given the single
      remaining race, I prefer a measured, robust design over an untested tweak. The
      slalom off-track failures (max_error about 0.06 m against a 0.06 m limit) and
      the oscillation (about 0.41) are the known weak points. Expected result: about
      917 on the development tracks, with the unseen track likely to behave similarly
      if its curvature is within the range already tested. Hypotheses for the record:
      H1, the kp 6.5 / kd 2.0 pair is near the stability limit at this inertia, so
      further gain or agility changes need a damping check. H2, the 0.75 base speed
      is the right trade-off between slalom completion and time. Measurements wanted:
      per-track completion, progress and max_error on the unseen track, plus steering_oscillation
      and line_loss_events on the slalom-type bends.


