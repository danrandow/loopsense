  entities:
  - id: entity0
    label: Forward sensors, sharper
    notes: 'Moves sensors forward to y=0.06, raises kp to 6.5 and kd to 2.0, and narrows
      the track to 0.10 m with base_speed 1.0. This targets the slalom and s-bend
      off-track exits seen in iteration 4 (score 428.6), where the oval finished 20/20
      but the slalom reached only 0.18 progress.


      ### Rationale


      Evidence from iteration 4 (score 428.6, best so far): the oval finishes in 20/20
      trials (1.97 s, no line losses), the s-bend finishes in 2/20 (progress 0.47),
      and the slalom never finishes (progress 0.18, 0.05 line-loss events per run).
      The slalom and s-bend runs end off_track, not by losing the line, so the robot
      is leaving the tape on sharp bends and direction changes. Iterations 3 and 4
      show that raising kp and kd improved bend tracking (s-bend progress 0.16 to
      0.44 to 0.47 for slalom gains), while ki changes had no benefit. Oscillation
      on the oval is low (0.26), so there is room for more correction. Three changes
      are made together to target the bend-entry lag:

      (1) Sensors move forward from y = 0.04 to y = 0.06 m. Readings arrive earlier,
      which reduces the lag between seeing the tape and turning, the main limit on
      sharp bends at speed.

      (2) kp rises from 6.0 to 6.5 and kd from 1.5 to 2.0. This continues the trend
      that helped the s-bend, and the extra kd damps the larger swing that the stronger
      kp causes.

      (3) base_speed drops from 1.1 to 1.0 and wheel_track narrows from 0.12 to 0.10
      m. Lower speed gives more time to correct on tight bends, and a narrower track
      gives more yaw per unit of wheel-speed difference, so the robot can turn more
      sharply. The oval should still finish (about 2.1 to 2.2 s), so the time term
      loses little.

      Expected result: slalom progress above 0.4 and a higher s-bend finish rate,
      with the oval still finishing. Risks: kp 6.5 with kd 2.0 could chatter; if oval
      steering_oscillation exceeds about 0.4, the next step is kd 1.7 with kp 6.0.
      If the robot holds the line but is too slow, raise base_speed in steps of 0.05.
      Hypotheses: H1, the sensors are too far back, so the robot reacts late on bends
      (tested by the forward move). H2, the robot lacks turning agility on the slalom
      (tested by the narrower track). Measurements wanted next: progress and completion
      per track to see how far the slalom and s-bend runs now get, max_error to see
      how much of the off-track margin is used, steering_oscillation for chatter,
      and completion_time on the oval to check the speed cost.


