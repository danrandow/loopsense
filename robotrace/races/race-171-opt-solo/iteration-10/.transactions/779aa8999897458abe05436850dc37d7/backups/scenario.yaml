  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence from iteration 8 (score 754.5, best so far). The oval finishes 20/20
      at 1.96 s, and the s-bend finishes 20/20 at 2.14 s. The slalom is the only failure:
      2/20 finishes, progress 0.73, 0.36 steering oscillation, and every failed run
      ends off_track at max_error about 0.061 m, against a limit of 0.06 m. The slalom
      has improved at every step where yaw inertia and speed were reduced: progress
      went 0.16 (iter 6), 0.56 (iter 7), 0.73 (iter 8). Sensor reach is not the limit,
      since widening the array did not move the slalom. The off-track limit is max(0.06,
      0.0125 + 0.12/4) = 0.06 m, and widening the body to 0.18 m only gives 0.0575
      m, so body width stays at 0.12 m.


      Changes, continuing the agility direction that has worked: (1) body_length 0.12
      -> 0.10 m (the minimum), and mass 0.6 -> 0.5 kg. Yaw inertia scales with mass*(L^2+W^2)/12,
      so this cuts it by roughly another 25 percent. (2) wheel_track 0.10 -> 0.09
      m. A narrower track gives more yaw per unit of wheel-speed difference, which
      helps the slalom''s direction changes. (3) base_speed 0.8 -> 0.75. Less speed
      gives more correction time on the fast swings. Sensors, weights, kp 6.5, kd
      2.0 and ki 0.2 are unchanged, so the effect of the change is mainly the body
      and drivetrain agility.


      Expected result: slalom progress above 0.85, with more finishes (target 5 or
      more of 20). The oval should still finish, at about 2.05 to 2.15 s. That costs
      about 1 to 2 points of time score, which is small against the 500-point completion
      term.


      Risks: a light, short, narrow-track robot may oscillate on straights (watch
      steering_oscillation, currently 0.19 oval, 0.26 s-bend, 0.35 slalom). A lower
      mass may reduce traction on the lateral slip. If oscillation exceeds 0.4 on
      the oval, the next step is kd 1.7. If the slalom still exits with progress under
      0.85, the next step is kp 7.0 with kd 2.2.


      Hypotheses: H1, slalom failure is still limited by yaw inertia and turn agility,
      so more reduction keeps helping. H2, the narrower track adds turn authority
      without destabilising the straights. Measurements wanted next: progress, completion
      and max_error per track to see how far the slalom runs get and how much margin
      they use. Also line_loss_events on the slalom, steering_oscillation for chatter
      from the lighter body, and completion_time on the oval and s-bend to check the
      speed cost.


