  id: race-182-opt-eval-muted
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: kd 1.6 damping step
    notes: 'Single change from the best design (iteration 9, score 619): kd raised
      from 1.4 to 1.6 to continue the monotonic s-bend gain from kd sweeps (0.46 to
      0.96). Oval steering oscillation has stayed flat near 0.2, so the risk of added
      jitter is low.


      ### Rationale


      Evidence: iteration 9 (kd 1.4) is the best design so far at 619.0. The oval
      finishes 20/20 at 1.80 s with max_error 0.017 and steering_oscillation 0.20,
      so it is not ringing. The s-bend now finishes 17/20 (progress 0.96), up from
      5/20 at kd 1.2. The slalom is still 0/20, with progress 0.143 (flat since kd
      1.2, 0.146). Body width is already at its maximum, so the 0.06 m off-track limit
      cannot move.


      Single-variable kd trend at fixed geometry and gains: kd 0.8 gave s-bend progress
      0.46; kd 1.0 (with sensors at y=0.06) gave 0.61; kd 1.2 gave 0.84; kd 1.4 gave
      0.96. Oval steering oscillation has stayed near 0.19 to 0.20 across this range,
      so the extra damping adds no visible jitter. Earlier changes to kp, base_speed,
      wheel_track, mass and sensor span all reduced oval reliability, so I keep them
      fixed.


      Change: kd 1.4 to 1.6, nothing else. I expect the s-bend to finish 18 to 20
      of 20 with progress near 0.98 and fewer line-loss events. The slalom may gain
      a little, but it has plateaued, so I do not expect a large jump there. Risk:
      higher kd amplifies sensor noise. If oval steering_oscillation rises above about
      0.3 or oval completion drops below 1.0, I will revert to kd 1.4.


      Hypotheses: (H1) derivative damping still limits alternating bends, so s-bend
      completion keeps rising with kd. (H2) The slalom is limited by something other
      than damping, most likely entry speed on the sharpest alternations; a base_speed
      reduction only for slalom-type bends, or a different line_loss mode, is the
      next lever to test if kd stops helping.


      Measurements next: per-track completion, progress, max_error against 0.06, line_loss_events,
      steering_oscillation, and oval completion_time.


      - [Open this output](iteration-10/entity0/versions/41058c39c592447d9342559dd882034d/payload.json)

      - Based on: [entityR2A](iteration-10/entityR2A/versions/carried-929d8bed629e4785/payload.json)'
  - id: entityR1
    label: Approve kd 1.4 step
    notes: 'Approved the single-field change kd 1.2 to 1.4 on the best raced design
      (iteration 8, score 495.2). The s-bend progress trend across kd 0.8, 1.0 and
      1.2 (0.46, 0.61, 0.84) with the oval holding at 20/20 supports one more derivative
      step, and the feedback sets revert rules if oscillation rises.


      ### Feedback


      Written before this candidate races, so no result is stated for it. The candidate
      is iteration 8 (kd 1.2, score 495.2, the best raced design) with one change:
      kd 1.2 to 1.4. The evidence for raising kd is a clean trend on the same geometry
      and gains. S-bend progress went 0.46 (kd 0.8, iter 3), 0.61 (kd 1.0 with y 0.06,
      iter 7), and 0.84 (kd 1.2, iter 8), and the oval stayed at 20/20 with steering_oscillation
      falling slightly (0.197 to 0.189, iter 7 to 8). Iteration 4 cut the oval to
      13/20 when kp went to 5.5 and base_speed to 1.05 together with kd 1.0, so that
      damage is not evidence against kd alone. Iteration 6 showed that widening the
      sensor span hurts the oval, so the geometry stays fixed. The candidate is valid,
      every value is inside the contract, and it changes one field. Approve it. The
      race is the next source of information, and the single-field trend has been
      monotonic so far.


      After the race, read the results in this order. (a) If the oval holds at 20/20
      with steering_oscillation at or below about 0.3 and s-bend progress rises above
      0.9 with line_loss_events below 1, the kd trend still holds. Consider a small
      further step such as kd 1.6 in the final revision, not a kp change. (b) If oval
      steering_oscillation rises above about 0.3 or oval completion drops below 1.0,
      higher kd is amplifying sensor noise. Revert to kd 1.2, which is the best raced
      design, and do not raise kp. (c) If s-bend progress is flat within about 0.05
      of 0.84 while the oval holds, derivative damping is no longer the limit. Test
      a narrower wheel_track of 0.09 with mass held at 0.6, because iteration 5 showed
      that wheel_track 0.09 combined with mass 0.5 cost oval reliability. Slalom remains
      the hardest track at progress about 0.15. If it stays there, the next lever
      is a lower base_speed or a different line_loss mode, tested one field at a time.


      ### Requested changes


      - If the oval holds at 20/20 with steering_oscillation at or below about 0.3
      and s-bend progress rises above 0.9 with line_loss_events below 1: keep kd 1.4
      and try kd 1.6 next, since kd alone improved s-bend progress from 0.61 (kd 1.0)
      to 0.84 (kd 1.2) without losing the oval.

      - If oval steering_oscillation exceeds about 0.3 or oval completion drops below
      1.0: revert kd to 1.2, the best raced design, and keep y 0.06, because higher
      derivative gain may amplify sensor noise. Do not raise kp, since iteration 4
      showed kp 5.5 with speed 1.05 cut the oval to 13/20.

      - If s-bend progress stays within about 0.05 of 0.84 with the oval holding:
      return kd to 1.2 and test wheel_track 0.09 with mass held at 0.6, because iterations
      1 to 3 showed a narrower track raised bend progress without losing the oval.
      Keep mass at 0.6, since mass 0.5 with wheel_track 0.09 cut the oval to 25% in
      iteration 5.


      - [Open this output](iteration-9/entityR1/versions/1c81be5c15af498cbe8247691e57fffd/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/1706b94fd14740cfabc7f9bf4cbd658d/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-064ed0d72d5d3153/payload.json)'
