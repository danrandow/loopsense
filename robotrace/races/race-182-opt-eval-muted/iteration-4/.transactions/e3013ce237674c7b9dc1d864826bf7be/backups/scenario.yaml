  id: race-182-opt-eval-muted
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Slower, stiffer steering
    notes: 'Keeps iteration 3''s geometry and cuts base_speed to 1.05, with kp 5.5
      and kd 1.0 for stronger correction on sharp bends. Iteration 3 finished every
      oval trial but went off track on s-bend (progress 0.46) and slalom (0.09) at
      speed 1.2, so slowing down is the main lever.


      ### Rationale


      Evidence: iteration 3 (score 396.3) is the best design so far. Its oval finish
      rate is 100% at 1.7 s mean, so the layout and turn rate work on gentle curves.
      The s-bend fails at progress 0.46 and the slalom at 0.09, both ending off track
      with max_error about 0.062 just above the 0.06 m limit. Body width is already
      at 0.18 m, which gives the maximum allowance (the limit is the 0.06 floor),
      so the fix has to come from control. Steering oscillation (0.18 oval, 0.30 s-bend)
      and RMS error are small, so the robot is not ringing. It is being pushed outward
      on tight alternating bends, which means it reacts too slowly or lacks authority.
      Slalom is the worst case: it fails within about 9% of the course, so the robot
      is probably entering the sharp direction changes at too high a speed. Iteration
      2 moved sensor width, wheel track, speed and kp together, and that run was worse,
      so I keep the sensor layout and wheel track that worked best.


      Changes: (1) base_speed 1.2 -> 1.05 to give more time to correct on slalom and
      s-bend bends. The oval mean time should rise from about 1.7 s to about 2.0 s,
      still within the 3 s limit, costing about 3 score points on the finish term.
      (2) kp 5.0 -> 5.5 for stronger correction of the outward drift. (3) kd 0.8 ->
      1.0 to damp the higher kp, since the signal changes fast on alternating bends.
      (4) ki stays at 0.2 for the fixed motor mismatch. (5) Geometry is unchanged
      from iteration 3 (12 mm sensors at x = -0.03 to +0.03, y = 0.05, wheel track
      0.10, mass 0.6), so the result isolates the speed and gain effect.


      Expected result: s-bend progress above 0.6 and slalom progress above 0.3, with
      line_loss_events below 1 on both. Oval should still complete, at roughly 2.0
      s. Hypotheses: (H1) lower speed is the main factor on slalom, so its progress
      should rise sharply as base_speed drops. (H2) kd 1.0 keeps steering_oscillation
      below about 0.4 with the higher kp. (H3) if oval completion falls below 1.0
      or steering_oscillation exceeds 0.5, kp is too high and should drop to about
      5.0. Measurements next: per-track completion, progress, max_error against the
      0.06 limit, line_loss_events, and oval completion_time, to decide whether the
      next step is more speed or more gain.


      - [Open this output](iteration-4/entity0/versions/d84eee81efe04cde9412734b1475d08a/payload.json)

      - Based on: [entityR2A](iteration-4/entityR2A/versions/carried-9b113cc61da1b751/payload.json)'
  - id: entityR1
    label: Evaluator Feedback
    notes: 'Evaluator Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Written before this candidate races, so it states no outcome for it. The evidence
      is iteration 1 (score 289, the best so far: oval finish 0.65 at base_speed 1.2,
      kp 4, kd 0.6, 12 mm sensors at x ±0.03, y 0.05, wheel_track 0.12) and iteration
      2 (score 263: oval finish fell to 0.45 after sensors, speed and gains changed
      together; s-bend progress rose from 0.22 to 0.31). Every s-bend and slalom trial
      in both iterations still left the track with max_error about 0.062 to 0.064,
      just above the 0.06 m limit, and steering_oscillation stayed at 0.15 to 0.30,
      so the robot is being pushed outward on bends rather than oscillating. This
      candidate returns to the iteration 1 sensor layout and base_speed 1.2, which
      kept the oval result, and changes only the turn-rate and correction group: wheel_track
      0.12 to 0.10, kp 4 to 5, kd 0.6 to 0.8. That isolates the turn-rate and gain
      effect from the sensor and speed changes that confused iteration 2. Approving
      it is the right use of the remaining budget, because the race will show whether
      the turn-rate change helps bends without losing the oval.


      After the race, read the results in this order. If s-bend or slalom progress
      rises above 0.3 and line_loss_events drop below 1 while oval completion holds
      at 0.6 or better, keep wheel_track 0.10 and try kp 5.5 or kd 1.0 for further
      bend gain. If oval completion falls below 0.5 with steering_oscillation above
      0.5, the kp increase is too strong, so return kp to 4.5 and keep track at 0.10.
      If oval completion holds but bends still hit max_error near 0.06 with few line-loss
      events, the limit is steering authority, so try a narrower wheel_track of 0.09
      or 0.08 before touching sensors again.


      ### Requested changes


      - If s-bend and slalom progress rise above 0.3 with line_loss_events below 1
      and oval completion at 0.6 or better: keep wheel_track 0.10 and try kp 5.5 with
      kd 1.0, since the turn-rate change is the likely driver.

      - If oval completion falls below 0.5 or steering_oscillation exceeds 0.5: reduce
      kp to 4.5 and keep kd 0.8 and wheel_track 0.10, because iteration 2 showed the
      extra gain was costly on the oval.

      - If bends still reach max_error near 0.06 with line_loss_events of 1 or more:
      try wheel_track 0.09 or 0.08 with kp 5 and kd 0.8 held, to test whether steering
      authority is the limit before changing the sensor layout again.


      - [Open this output](iteration-3/entityR1/versions/2390e4838838429c90824b0aab2c69f2/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/7abbb83c3d214a41bd13c0a55d90b69f/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-4d811322c2451453/payload.json)'
