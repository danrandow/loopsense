overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'Conservative first candidate: five 12 mm sensors spaced 1 cm, antisymmetric
      weights, kp 3.0, kd 0.2, base_speed 1.6, last_direction line loss. Built from
      the contract only, since no race data exists yet.


      ### Rationale


      Iteration 0 has no race data or Evaluator feedback yet, so this is a conservative
      baseline built from the contract, not a tuned design. Geometry: five line sensors
      in a row at y = 0.03 m (ahead of the axle, so they see the line before the wheels
      reach it), spaced 1 cm apart from x = -0.02 to +0.02 m. The 12 mm footprint
      overlaps neighbours and always covers part of the 25 mm tape. Wheel track 0.12
      m and radius 0.03 m give a moderate turn rate. Mass 0.8 kg is mid-range. Body
      width 0.18 m sets the off-track limit to about 0.0575 m (tape half-width 0.0125
      + 0.045), which is just inside the 0.06 m floor and gives some margin. Controller:
      sensor weights are antisymmetric (-1, -0.5, 0, 0.5, 1), so the signal is zero
      on the centre line and grows with offset, with positive signal steering left
      as the contract requires. kp = 3.0 gives a moderate steering response; ki =
      0 avoids integral windup on curves; kd = 0.2 adds light damping. base_speed
      = 1.6 (about 80% of full PWM) aims for the roughly 1.5 m/s average needed to
      finish within 3 s, leaving headroom for slower bends. line_loss = last_direction,
      so the robot keeps turning toward where the line was last seen. Expected result:
      completion on the oval, with some oscillation on the slalom. If progress stalls
      or the robot leaves the track on sharp bends, I expect to reduce base_speed
      or raise kd. Hypotheses to check: (1) kp = 3 is not oscillatory at 1.6 speed;
      (2) the 5-sensor spread is enough to keep the line under the array on the s-bend;
      (3) completion time is under 3 s.


      - [Open this output](iteration-0/entity0/versions/2e4ff7fd80f94d4baae4f65d3e89b6a6/payload.json)'
  - id: entityR1
    label: 'Baseline review: approve'
    notes: 'Approved the conservative iteration-0 baseline because it is valid (all
      values inside contract limits, wheel commands in range) and there is no race
      data yet. Feedback sets conditional fixes (base_speed, kd, kp) to apply once
      the race shows whether it leaves the track, oscillates, or runs too slow.


      ### Feedback


      Iteration 0 has no earlier race outcomes, so this critique rests only on the
      candidate''s contents and the public contract. It states no expected or actual
      performance. The geometry and controller values are inside every contract limit.
      Sensor spacing (1 cm, 12 mm footprints) covers the 25 mm tape. The off-track
      limit is max(0.06, 0.0125 + 0.18/4) = 0.06 m. Wheel commands stay within ±4095
      at base_speed 1.6 (base PWM about 3276, turn at most ±3 so about ±1050 differential).
      Nothing is obviously broken, so this is a valid baseline for early exploration.
      Approve it so the race produces telemetry for the next critique.


      What to change after the race, depending on what it shows:

      (a) If the robot leaves the track or progress stalls on the sharp bends, lower
      base_speed to about 1.3 or raise kd to about 0.5, which damps the response on
      the bends.

      (b) If the robot completes but steering_oscillation or max_error is high on
      the slalom, lower kp to about 2.0 and keep kd at 0.2 or higher.

      (c) If the robot completes with completion_time well above 3 s, or the run is
      clean with low rms_error, raise base_speed toward 1.8 to gain time.

      (d) If line_loss_events is more than 0, consider a wider sensor spread (for
      example x out to ±0.03) before changing gains.

      Change one group of fields per revision so the cause of each change stays clear.


      ### Requested changes


      - If progress stalls or the robot leaves the track on the sharp bends: reduce
      base_speed from 1.6 to about 1.3 and/or raise kd from 0.2 to about 0.5. No iteration-0
      race exists yet, so this is the planned response to the baseline''s stated risk.

      - If the run completes with high steering_oscillation or max_error on the slalom:
      lower kp from 3.0 to about 2.0, keeping kd at 0.2 or higher.

      - If the run completes with completion_time above 3 s and low rms_error: raise
      base_speed toward 1.8 to meet the roughly 1.5 m/s average needed.


      - [Open this output](iteration-0/entityR1/versions/484842233d0c4051ac258ec927e0af7c/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/2e4ff7fd80f94d4baae4f65d3e89b6a6/payload.json)'
