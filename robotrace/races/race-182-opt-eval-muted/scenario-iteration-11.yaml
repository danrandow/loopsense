overrides:
  entities:
  - id: entity0
    label: kd 1.8 on best base
    notes: 'Final-iteration candidate: the iteration 10 design with kd raised from
      1.6 to 1.8, the only change. The kd trend from 0.8 to 1.6 raised s-bend completion
      with no oval jitter, and the oval stayed at 20/20 at about 1.8 s.


      ### Rationale


      Evidence: iteration 10 (kd 1.6) is the best design so far at 632.9. The oval
      finishes 20/20 at 1.81 s with max_error 0.013 and steering_oscillation 0.20,
      so it is not ringing. The s-bend finishes 18/20 with progress 0.98, and the
      slalom is still 0/20 with progress 0.16 and max_error 0.061. Body width is already
      at its maximum, so the 0.06 m off-track limit cannot move. Earlier single-variable
      kd steps (0.8 to 1.6) each raised s-bend completion with no measurable oval
      jitter. Changes to kp, base_speed, wheel_track, mass and sensor span all reduced
      oval reliability in earlier iterations, so I keep them fixed. This is the final
      iteration and the unseen track is scored once, so I keep the design close to
      the proven one and change one variable. Change: kd 1.6 to 1.8. Everything else
      is identical to iteration 10. Expected result: s-bend completion stays at 18
      to 20 of 20 with progress near 0.98 to 1.0, the oval stays at 20/20 near 1.8
      s, and the slalom progress changes little (it has plateaued near 0.14 to 0.16).
      Risk: higher kd amplifies sensor noise and may shift the unseen track''s behaviour.
      If oval steering_oscillation exceeds about 0.3 or oval completion falls below
      1.0, the fallback is kd 1.6. Hypotheses: (H1) derivative damping still limits
      alternating bends, so s-bend completion keeps improving with kd. (H2) The slalom
      is limited by entry speed or the 0.06 m off-track limit rather than damping,
      so it will not improve much from kd alone. Measurements next: per-track completion,
      progress, max_error against 0.06, line_loss_events, steering_oscillation and
      oval completion_time.


      - [Open this output](iteration-11/entity0/versions/8bc21c386934433192bd8cef22edd439/payload.json)

      - Based on: [entityR2A](iteration-11/entityR2A/versions/carried-ddc436b7daae7510/payload.json)'
  - id: entityR1
    label: Revert kd to proven 1.6
    notes: 'Revise kd 1.8 back to the best raced design (iteration 10, kd 1.6, score
      632.9). The s-bend gain from kd is flattening (0.96 to 0.98 from kd 1.4 to 1.6),
      and kd 1.8 is untested and risky on an unseen track.


      ### Feedback


      Written before this candidate has raced. The candidate is iteration 10 (kd 1.6,
      score 632.9, the best raced design) with kd raised to 1.8 and nothing else changed.
      The kd trend at fixed geometry and gains is clear: s-bend progress was 0.46
      at kd 0.8 (iteration 3), 0.61 at kd 1.0 with sensors at y 0.06 (iteration 7),
      0.84 at kd 1.2 (iteration 8), 0.96 at kd 1.4 (iteration 9), and 0.98 at kd 1.6
      (iteration 10). The gain per step is shrinking, from about +0.23 to +0.12 to
      +0.02, so the s-bend is near saturation. Oval steering_oscillation stayed at
      0.19 to 0.20 across the range, so no noise penalty has appeared yet. Slalom
      has been 0/20 in every iteration, with progress flat at 0.14 to 0.16 since kd
      1.2, so damping is not what limits it. kd 1.8 has never raced, and it is a further
      extrapolation on a trend that is already flattening. The unseen track differs
      from the development tracks, so the gain from 1.6 to 1.8 is small and uncertain,
      and noise amplification at higher kd is untested. The proven kd 1.6 design is
      the safer choice for a single scored race on an unseen track. Revise to that
      exact design. Do not change kp, base_speed, wheel_track, mass or sensor span,
      because iterations 2, 4, 5 and 6 showed those reduce oval reliability.


      ### Requested changes


      - Set controller.kd to 1.6 and keep every other field identical to iteration
      10 (kp 5.0, ki 0.2, base_speed 1.2, sensor_weights [-1.0, -0.5, 0.0, 0.5, 1.0],
      line_loss last_direction; geometry wheel_track 0.10, mass 0.6, body_width 0.18,
      sensors at y 0.06 with x -0.03 to +0.03 and sensor_size 0.012). This is the
      best raced design (632.9), and kd 1.4 to 1.6 showed the s-bend gain flattening
      (0.96 to 0.98).

      - Do not raise kp or base_speed to chase the slalom. Iteration 4 showed kp 5.5
      with base_speed 1.05 cut the oval to 13/20, and the slalom has stayed at 0/20
      through every kd change, so the slalom needs a separate test that cannot be
      run before the single final race.


      - [Open this output](iteration-11/entityR1/versions/b74feaba18864ffb9c45d03657154f36/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/8bc21c386934433192bd8cef22edd439/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-ddc436b7daae7510/payload.json)'
