map:
  id: race-182-opt-eval-muted
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Iter 3 + kd 1.0, sensors
    notes: 'Starts from iteration 3, the best raced design (396), and changes only
      kd (0.8 to 1.0) and sensor y (0.05 to 0.06 m). Widening the array (iteration
      6) and raising kp (iteration 4) both hurt the oval, so neither is repeated.


      ### Rationale


      Evidence: iteration 3 (score 396.3) is still the best design. It finishes the
      oval 20/20 at 1.70 s with max_error 0.016 and zero line-loss events. Its failures
      are on the s-bend (progress 0.46, max_error 0.064, 1.25 line-loss events) and
      the slalom (progress 0.09, max_error 0.062). Body width is already at its maximum,
      so the off-track limit cannot move. Steering oscillation and RMS error are small,
      so the robot is not ringing; it is pushed outward on sharp alternating bends.
      Iteration 6 widened the outer sensors to +/-0.04 and fell to 290 (oval 13/20,
      s-bend progress 0.25), so widening the array is rejected. Iteration 5 (wheel_track
      0.09, mass 0.5) and iteration 4 (kp 5.5, kd 1.0, speed 1.05) both lost oval
      reliability, so the turn-rate and gain changes already tried should not be repeated.


      Changes from iteration 3, limited to two: (1) kd 0.8 to 1.0 adds damping for
      the faster response on alternating bends without raising kp, which is the gain
      change that hurt the oval in iteration 4. (2) All sensors move forward from
      y = 0.05 to y = 0.06 m, so the array sees the tape earlier and the controller
      reacts before the wheels reach the outward drift. Sensor x spacing (1.5 cm,
      12 mm footprint, +/-0.03 span), wheel track 0.10, mass 0.6, base_speed 1.2,
      kp 5.0, ki 0.2 and last_direction line loss are unchanged.


      Expected result: the oval holds at 20/20 near 1.7 s, and s-bend progress rises
      above 0.5 with line-loss events below 1. The sensor move is untested, so if
      the oval finish rate drops, revert y to 0.05 and keep kd 1.0. Hypotheses: (H1)
      kd 1.0 reduces the overshoot that pushes the robot off the s-bend; (H2) the
      forward sensors cut line-loss events on the slalom. Measurements next: per-track
      completion, progress, max_error against 0.06, line_loss_events, steering_oscillation,
      and oval completion_time.


      - [Open this output](iteration-7/entity0/versions/c7ffe16cb71841d8bb10107eec0baf9c/payload.json)

      - Based on: [entityR2A](iteration-7/entityR2A/versions/carried-4f87a59344cdf503/payload.json)'
  - id: entityR1
    label: Approve kd 1.0, sensor y
    notes: 'The candidate is the best raced design (iteration 3, score 396) with kd
      0.8 to 1.0 and sensors moved forward to y 0.06. Both changes are small and untested
      alone, so the race will show which one helps, with clear rules for reverting
      if the oval slips.


      ### Feedback


      Written before this candidate has raced, so it states no outcome for it. The
      candidate is iteration 3 with two small changes: kd 0.8 to 1.0, and all sensors
      moved from y = 0.05 to y = 0.06 m. Iteration 3 (score 396.3) remains the best
      raced design. It finishes the oval 20/20 with zero line-loss events, but fails
      on the s-bend (progress 0.46, max_error 0.064) and the slalom (progress 0.09).
      Iteration 4 raised kd to 1.0 together with kp 5.5 and base_speed 1.05, and the
      oval fell to 13/20, so the oval damage in that run came from the kp and speed
      changes, not from kd. kd 1.0 alone is therefore untested, and the sensor move
      is untested too. The sensor move is small (1 cm forward) and keeps the x layout
      that iteration 3 used. Iteration 6 showed that changing the sensor x span cut
      the oval to 13/20, so the x layout must stay as it is. Body width is already
      at its maximum and the 0.06 m limit cannot move, so bend survival has to come
      from control and sensing. Approve it, because the change is a minimal step from
      the best design and the race is the only way to learn whether kd or the earlier
      sensor position helps.


      After the race, read the results in this order. (a) If the oval still completes
      20/20 with line_loss_events at 0 and s-bend progress rises above 0.5, keep kd
      1.0 and y 0.06, then try kd 1.2 next. (b) If the oval completion drops below
      1.0 or steering_oscillation rises above about 0.3, revert y to 0.05 and keep
      kd 1.0, because the forward sensor move is the likely cause. (c) If the oval
      holds but s-bend progress does not move, neither change is the limit; return
      to y 0.05 and kd 0.8, and test wheel_track 0.09 alone before changing gains
      again.


      ### Requested changes


      - If the oval holds at 20/20 and s-bend progress rises above 0.5: keep kd 1.0
      and y 0.06, then try kd 1.2 with other fields fixed, because kd is the damping
      lever that did not hurt the oval when tested alone.

      - If the oval completion drops below 1.0 or steering_oscillation exceeds 0.3:
      revert all sensor y to 0.05 and keep kd 1.0, because iteration 6 showed that
      changing the sensor layout can reduce oval finish, and iteration 4 showed that
      kp 5.5 and speed 1.05 are the costly changes.

      - If s-bend progress is flat with the oval holding: return to y 0.05 and kd
      0.8 and test wheel_track 0.09 alone, because iterations 1 to 3 showed that a
      narrower track raised bend progress without losing the oval, while iteration
      5 showed that mass 0.5 with wheel_track 0.09 cut the oval to 25%.


      - [Open this output](iteration-7/entityR1/versions/fb9e4b25aa8c488489196fcfcc7846ca/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/c7ffe16cb71841d8bb10107eec0baf9c/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-4f87a59344cdf503/payload.json)'
