  id: race-182-opt-eval-muted
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: kd 1.6 damping step
    notes: 'Single change from the best design (iteration 9, score 619): kd raised
      from 1.4 to 1.6 to continue the monotonic s-bend gain from kd sweeps (0.46 to
      0.96). Oval steering oscillation has stayed flat near 0.2, so the risk of added
      jitter is low.


      ### Rationale


      Evidence: iteration 9 (kd 1.4) is the best design so far at 619.0. The oval
      finishes 20/20 at 1.80 s with max_error 0.017 and steering_oscillation 0.20,
      so it is not ringing. The s-bend now finishes 17/20 (progress 0.96), up from
      5/20 at kd 1.2. The slalom is still 0/20, with progress 0.143 (flat since kd
      1.2, 0.146). Body width is already at its maximum, so the 0.06 m off-track limit
      cannot move.


      Single-variable kd trend at fixed geometry and gains: kd 0.8 gave s-bend progress
      0.46; kd 1.0 (with sensors at y=0.06) gave 0.61; kd 1.2 gave 0.84; kd 1.4 gave
      0.96. Oval steering oscillation has stayed near 0.19 to 0.20 across this range,
      so the extra damping adds no visible jitter. Earlier changes to kp, base_speed,
      wheel_track, mass and sensor span all reduced oval reliability, so I keep them
      fixed.


      Change: kd 1.4 to 1.6, nothing else. I expect the s-bend to finish 18 to 20
      of 20 with progress near 0.98 and fewer line-loss events. The slalom may gain
      a little, but it has plateaued, so I do not expect a large jump there. Risk:
      higher kd amplifies sensor noise. If oval steering_oscillation rises above about
      0.3 or oval completion drops below 1.0, I will revert to kd 1.4.


      Hypotheses: (H1) derivative damping still limits alternating bends, so s-bend
      completion keeps rising with kd. (H2) The slalom is limited by something other
      than damping, most likely entry speed on the sharpest alternations; a base_speed
      reduction only for slalom-type bends, or a different line_loss mode, is the
      next lever to test if kd stops helping.


      Measurements next: per-track completion, progress, max_error against 0.06, line_loss_events,
      steering_oscillation, and oval completion_time.


      - [Open this output](iteration-10/entity0/versions/41058c39c592447d9342559dd882034d/payload.json)

      - Based on: [entityR2A](iteration-10/entityR2A/versions/carried-929d8bed629e4785/payload.json)'
  - id: entityR1
    label: Approve kd 1.6 step
    notes: 'Approved the single-field kd 1.4 to 1.6 step on the best geometry, based
      on a monotonic s-bend trend (0.46, 0.61, 0.84, 0.96 across kd 0.8 to 1.4) with
      the oval holding 20/20 and steering oscillation flat. Feedback names a revert
      trigger and a slalom-speed test for the final iteration, since slalom has been
      stuck at 0/20 with progress about 0.15.


      ### Feedback


      This candidate is iteration 9 with one field changed: kd goes from 1.4 to 1.6.
      Geometry, kp, ki, base_speed, line_loss and sensors stay as in the best raced
      design (iteration 9, score 619.0). The evidence is a clean single-variable trend
      at fixed geometry and gains. S-bend progress rose 0.46 (kd 0.8, iter 3), 0.61
      (kd 1.0 with y 0.06, iter 7), 0.84 (kd 1.2, iter 8) and 0.96 (kd 1.4, iter 9,
      17/20 finished). The oval stayed at 20/20 across that range, with steering_oscillation
      between 0.19 and 0.20 (iter 7 to 9), so the extra damping has not added visible
      jitter. Iteration 4 showed that kp 5.5 with base_speed 1.05 cut the oval to
      13/20, so kp and speed are the costly levers, and this candidate leaves them
      alone. Iteration 6 showed that widening the sensor span also hurts the oval,
      so the geometry stays fixed. Slalom is the weak point: it has been 0/20 in every
      iteration, with progress flat at 0.143 to 0.15 since kd 1.2, so more derivative
      is unlikely to fix it. Approve so the race measures kd 1.6 directly; the risk
      is noise amplification, which would appear as oval steering_oscillation above
      about 0.3 or oval completion below 1.0.


      After the race, read the results in this order. (a) If the oval holds at 20/20
      with steering_oscillation at or below about 0.3 and s-bend progress is at least
      0.97, kd 1.6 is the new best. Keep it. Use the final iteration to test one slalom
      lever only, such as base_speed 1.1 with everything else fixed, because the slalom
      has not moved with damping. (b) If the oval loses completion or steering_oscillation
      exceeds about 0.3, revert to kd 1.4, which is the best raced design, and do
      not raise kp. (c) If s-bend progress is flat within about 0.02 of 0.96 but slalom
      is still 0/20, damping has reached its limit. Keep kd 1.4 or 1.6 and test base_speed
      1.1 alone on the slalom.


      ### Requested changes


      - If the oval holds at 20/20 with steering_oscillation at or below about 0.3
      and s-bend progress is at least 0.97: keep kd 1.6 as the new best. Then test
      base_speed 1.1 alone in the final iteration, because the slalom progress (0.143
      to 0.15) has stayed flat since kd 1.2 while damping has helped the s-bend.

      - If oval steering_oscillation exceeds about 0.3 or oval completion drops below
      1.0: revert kd to 1.4, the best raced design (iteration 9, 619.0), and keep
      the sensors at y 0.06. Do not raise kp, since iteration 4 showed kp 5.5 with
      base_speed 1.05 cut the oval to 13/20.

      - If s-bend progress is flat within about 0.02 of 0.96 while the oval holds
      and the slalom stays at 0/20: damping is no longer the limit. Keep kd at the
      better of 1.4 or 1.6, and test base_speed 1.1 alone, since the slalom has not
      responded to kd in any iteration.


      - [Open this output](iteration-10/entityR1/versions/6de6abd19ed7469bb9f9e9bf82eee932/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/41058c39c592447d9342559dd882034d/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-929d8bed629e4785/payload.json)'
