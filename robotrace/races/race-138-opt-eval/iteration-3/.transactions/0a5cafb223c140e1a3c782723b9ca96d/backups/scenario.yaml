map:
  id: race-138-opt-eval
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence: iteration 1 (base_speed 1.3, kp 3.5, kd 0.6) scored 556.7, the best
      so far. Its oval finished 20/20 at 2.03 s, s-bend finished 9/20 with progress
      0.88, and slalom ended off track in 20/20 at progress 0.30 with max_error 0.064
      and 1.15 line-loss events. Iteration 2 (base_speed 1.2, otherwise identical)
      scored 521.7, lower. The oval fell to 19/20, and the s-bend finish rate dropped
      from 45% to 25% with progress 0.86. Only the slalom improved, from 0.30 to 0.39
      progress. Net, lowering speed cost more on the s-bend and oval than it gained
      on the slalom, so I am returning to base_speed 1.3. The Evaluator''s conditional
      plan (keep 1.2 and test kp 3.8) does not hold cleanly, because the s-bend progress
      fell rather than rose. I am therefore reverting speed and testing steering authority
      at the best speed. Change: kp 3.5 to 3.8 and kd 0.6 to 0.7, with base_speed
      1.3, ki 0, line_loss last_direction, and geometry unchanged. The higher kp gives
      a harder correction at the tight arcs where the robot currently leaves the tape
      at about 0.06 m. The slightly higher kd is there to damp the extra gain and
      limit the oscillation that rose on the s-bend (0.37). Expected result: s-bend
      finish rate above 45%, slalom progress above 0.30, and a score above 556.7.
      The oval should still finish near 2.0 s. Risks: kp 3.8 may increase steering
      oscillation and push the oval off track. Hypotheses: (a) steering authority,
      not speed, limits the slalom, so progress rises with kp; (b) line_loss_events
      fall below 1.0 on bends. Measurements requested: all metrics, so I can compare
      per-track max_error, line-loss events and completion_time against iterations
      1 and 2. If the oval shows off-track exits or steering_oscillation rises well
      above 0.37, next step is kp 3.5 with kd 0.8 rather than further kp increases.
      If the slalom still ends off track with max_error above 0.06 and line_loss_events
      near 1.0, test line_loss ''search_left'' or ''search_right'' only if the last
      valid signal shows a consistent one-sided exit.


      - [Open this output](iteration-3/entity0/versions/abed50db48e14541bdac43798de614c1/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-b2f01e85aca92e15/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-9b2ad3f288ca3281/payload.json)'
  - id: entityR1
    label: Approve speed 1.2 test
    notes: 'Approved the iteration 2 candidate, which lowers base_speed from 1.3 to
      1.2 and keeps kp 3.5, kd 0.6 and the geometry unchanged. The evidence is iteration
      1: the oval finished in 100% of trials, but the s-bend and slalom ran off track,
      with slalom max_error 0.064 and 1.15 line-loss events. The feedback sets next
      steps depending on the race result.


      ### Feedback


      I reviewed the iteration 2 candidate: base_speed 1.2, kp 3.5, kd 0.6, ki 0,
      line_loss last_direction, with geometry and sensor weights unchanged from iteration
      1. It has not raced, so I state no outcome for it. The design is valid: all
      values are inside the contract ranges and the sensor layout is unchanged. The
      change is a single variable, base_speed 1.3 to 1.2, which follows the requested
      change from iteration 1. The evidence behind it is iteration 1 (score 556.7).
      The oval finished in 100% of trials at mean 2.03 s, so it has time margin. On
      the s-bend, 11 of 20 trials ended off track, and the slalom ended off track
      in all 20 trials at progress 0.30 with max_error 0.064 and 1.15 line-loss events
      per run. Lowering speed should reduce centripetal and slip error on the tight
      arcs and cut line loss. Approve this now. It is a minimal, well-isolated test,
      and the race will show whether speed was the limiting factor. Once the race
      reports back, read these numbers together. If the oval completion_time stays
      under about 2.5 s and the slalom or s-bend progress rises above the iteration
      1 values (0.30 slalom, 0.88 s-bend), keep base_speed at 1.2 and test kp 3.8
      with kd 0.7 to see whether steering authority is now the limit. If the oval
      completion_time rises above about 2.5 s, or the average speed looks too low
      for the 3.0 s limit, return to base_speed 1.3 and change the controller instead.
      If the slalom still ends off track with max_error above 0.06 and line_loss_events
      near 1.0, the next test is line_loss ''search_left'' or ''search_right'' only
      if the last-direction signal shows the robot leaving the tape on one side. Keep
      ki at 0 unless a one-sided offset appears.


      ### Requested changes


      - After the race: if the oval completion_time stays under about 2.5 s and the
      slalom or s-bend progress rises above the iteration 1 values (0.30 slalom, 0.88
      s-bend), keep base_speed 1.2 and try kp 3.8 with kd 0.7 to test whether steering
      authority is now the limit.

      - After the race: if the oval completion_time goes above about 2.5 s or average
      speed looks too low for 3.0 s, return to base_speed 1.3 (the iteration 1 value
      that gave 556.7) and change kp or kd instead, not speed.

      - After the race: if line_loss_events stay near 1.0 on the bends, test line_loss
      ''search_left'' or ''search_right'' only if the last valid signal shows the
      robot consistently leaving the tape on one side; keep ki at 0 unless a one-sided
      offset appears.


      - [Open this output](iteration-2/entityR1/versions/fcf9d94acbb04bb2b4892453094b45f0/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/94d414e39b3d4ea7a0e9e17bcc2c403c/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-a30f6ec660ae308f/payload.json)'
