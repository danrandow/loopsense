  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence: iteration 1 (base_speed 1.3, kp 3.5, kd 0.6) scored 556.7, the best
      so far. Its oval finished 20/20 at 2.03 s, s-bend finished 9/20 with progress
      0.88, and slalom ended off track in 20/20 at progress 0.30 with max_error 0.064
      and 1.15 line-loss events. Iteration 2 (base_speed 1.2, otherwise identical)
      scored 521.7, lower. The oval fell to 19/20, and the s-bend finish rate dropped
      from 45% to 25% with progress 0.86. Only the slalom improved, from 0.30 to 0.39
      progress. Net, lowering speed cost more on the s-bend and oval than it gained
      on the slalom, so I am returning to base_speed 1.3. The Evaluator''s conditional
      plan (keep 1.2 and test kp 3.8) does not hold cleanly, because the s-bend progress
      fell rather than rose. I am therefore reverting speed and testing steering authority
      at the best speed. Change: kp 3.5 to 3.8 and kd 0.6 to 0.7, with base_speed
      1.3, ki 0, line_loss last_direction, and geometry unchanged. The higher kp gives
      a harder correction at the tight arcs where the robot currently leaves the tape
      at about 0.06 m. The slightly higher kd is there to damp the extra gain and
      limit the oscillation that rose on the s-bend (0.37). Expected result: s-bend
      finish rate above 45%, slalom progress above 0.30, and a score above 556.7.
      The oval should still finish near 2.0 s. Risks: kp 3.8 may increase steering
      oscillation and push the oval off track. Hypotheses: (a) steering authority,
      not speed, limits the slalom, so progress rises with kp; (b) line_loss_events
      fall below 1.0 on bends. Measurements requested: all metrics, so I can compare
      per-track max_error, line-loss events and completion_time against iterations
      1 and 2. If the oval shows off-track exits or steering_oscillation rises well
      above 0.37, next step is kp 3.5 with kd 0.8 rather than further kp increases.
      If the slalom still ends off track with max_error above 0.06 and line_loss_events
      near 1.0, test line_loss ''search_left'' or ''search_right'' only if the last
      valid signal shows a consistent one-sided exit.


      - [Open this output](iteration-3/entity0/versions/abed50db48e14541bdac43798de614c1/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-b2f01e85aca92e15/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-9b2ad3f288ca3281/payload.json)'
  - id: entityR1
    label: Approve kp 3.8 / kd 0.7
    notes: 'Approved the iteration 3 candidate (base_speed 1.3, kp 3.8, kd 0.7) because
      it is a small, valid step from the best raced design (556.7, iteration 1), and
      the race will show whether the extra steering authority helps. Feedback sets
      the next move depending on oval finish, steering oscillation and slalom max_error.


      ### Feedback


      Approving this candidate so it races. It has not raced, so I state no outcome
      for it. The design is valid: all values are inside the contract ranges, and
      the sensor layout, base_speed 1.3, ki 0 and line_loss ''last_direction'' match
      the best raced design (iteration 1, score 556.7). The only changes are kp 3.5
      to 3.8 and kd 0.6 to 0.7. Iteration 1 showed that a stronger correction (kp
      2.5 to 3.5, with kd 0.3 to 0.6) raised the score from 317.4 to 556.7, with the
      oval finishing 20/20. Iteration 2 showed that cutting speed to 1.2 lowered the
      score to 521.7, so speed is not the lever to pull now. The main risk is that
      kp 3.8 raises steering oscillation, which was already 0.37 on the s-bend in
      iteration 1, and that it pushes the oval off track. Once the race reports back,
      compare per-track completion, max_error, line_loss_events and steering_oscillation
      against iterations 1 and 2 before choosing the next step. If the oval still
      finishes and steering_oscillation stays near or below 0.37, keep kp 3.8 and
      test whether kd 0.8 or line_loss ''search_left''/''search_right'' helps the
      slalom. If the oval shows off-track exits or steering_oscillation rises well
      above 0.37, step back to kp 3.5 with kd 0.8 rather than raising kp again.


      ### Requested changes


      - After the race: if the oval still finishes 20/20 and steering_oscillation
      stays at or below about 0.37, keep kp 3.8 and try kd 0.8 to damp the stronger
      correction, since iteration 1 showed oscillation rising on the s-bend.

      - After the race: if the oval shows off-track exits or steering_oscillation
      rises well above 0.37, return to kp 3.5 with kd 0.8 instead of increasing kp
      further, because kp 3.5 with kd 0.6 gave the best score (556.7) so far.

      - After the race: if the slalom still ends off track with max_error above 0.06
      and line_loss_events near 1.0, test line_loss ''search_left'' or ''search_right''
      only if the last valid signal shows a consistent one-sided exit, and keep ki
      at 0 unless a one-sided offset appears.


      - [Open this output](iteration-3/entityR1/versions/0a5cafb223c140e1a3c782723b9ca96d/payload.json)

