overrides:
  entities:
  - id: entity0
    label: 'Best design: mass 0.6'
    notes: 'Resubmits the iteration 10 design unchanged (mass 0.6, kp 3.8, kd 0.8,
      y 0.08, ±0.03 m sensors), the best raced score at 700.01 and the build the Evaluator
      approved. Mass 0.5 was not tested because this is the final iteration and an
      unapproved or untested build cannot be reverted.


      ### Rationale


      Evidence: iteration 10 (mass 0.6, all else as iteration 7) is the best raced
      design at 700.01, up from 687.06. Its oval finished 20/20 (max_error 0.008,
      steering_oscillation 0.21) and its s-bend finished 20/20 (steering_oscillation
      0.31, progress 0.998). The slalom is still the binding track: 0/20 finishes,
      progress 0.52 (up from 0.45), max_error 0.065, 1.35 line-loss events, all ending
      off track. The mass change moved the slalom the most of any lever tested since
      iteration 3.


      What the record rules out: kp 4.0 (slalom progress down), kd 0.7 vs 0.8 (kd
      helps the s-bend but cuts slalom progress), base_speed 1.2 (cost on oval and
      s-bend), sensor y 0.06 vs 0.08 (0.08 helped), 16 mm footprints (neutral), lateral
      widening to 0.045 m (slalom progress down) and narrowing to 0.02 m (slalom progress
      down, 676.7). The geometry and gain levers are exhausted at the current settings.


      Decision: submit the iteration 10 design unchanged, mass 0.6. The Evaluator
      approved this exact build, and it is the best measured result (700.01) with
      all three development tracks finishing or nearly so on oval and s-bend. I considered
      the Evaluator''s suggested next test (mass 0.5), but this is the final iteration:
      no later race can revert it, and an unapproved build scores 0. The untested
      0.5 value carries an unmeasured risk to the oval and s-bend, so it is not worth
      that exposure now.


      Expected result: about 700 on the development tracks, with the same profile
      as iteration 10. The unseen track is the main uncertainty. Measurements requested:
      all metrics, so the final race can be compared per track against iteration 10.


      - [Open this output](iteration-11/entity0/versions/ef66f0041ec9439e937200cf4318f39c/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-6c72f12e3fd8b9e1/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-887e01d61bd0a883/payload.json)'
  - id: entityR1
    label: Approve final design
    notes: 'Approved the mass 0.6 design unchanged, because it is the best raced result
      (700.0, iteration 10) and this is the final iteration, so an unapproved build
      would score 0. Earlier races ruled out the other gain, speed and geometry levers,
      and the untested mass 0.5 was held back as too risky for the final race.


      ### Feedback


      Approving the candidate as submitted. It is the iteration 10 design (mass 0.6,
      all other fields as iteration 7), and no earlier race has beaten it. Iteration
      10 scored 700.0, up from 687.1 in iteration 7. Its oval finished 20/20 (max_error
      0.008) and its s-bend finished 20/20 (steering_oscillation 0.31). The slalom
      still ends off track in every run (progress 0.52, max_error 0.065, 1.35 line-loss
      events), so it remains the binding track. Earlier races rule out the other levers:
      kp 4.0 (iteration 5, slalom progress down), kd 0.7 (iteration 3 vs 4, slalom
      progress down), base_speed 1.2 (iteration 2, cost on oval and s-bend), wider
      or narrower lateral spacing (iterations 6 and 9), and the 16 mm footprint (iteration
      8, neutral). Mass 0.5 is the untested next step, but this is the final iteration
      and an unapproved build scores 0. Mass 0.5 carries an unmeasured risk to the
      oval and s-bend, so it is not worth that exposure now. Do not change any field
      before the race.


      ### Requested changes


      - No change before the race: keep mass 0.6, kp 3.8, kd 0.8, ki 0, base_speed
      1.3, line_loss last_direction and the current geometry, since iteration 10 is
      the best measured result (700.0).

      - If another build is ever produced in a future race, test mass 0.5 as the single
      change, using iteration 10 as the fallback, as iteration 10''s own telemetry
      (slalom progress up from 0.45 to 0.52) suggests that lower inertia is the direction
      that helps.


      - [Open this output](iteration-11/entityR1/versions/074982b5f68b420cada267935b4af154/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/ef66f0041ec9439e937200cf4318f39c/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-887e01d61bd0a883/payload.json)'
