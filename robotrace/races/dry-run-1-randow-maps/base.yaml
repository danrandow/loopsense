map:
  id: dry-run-1-randow-maps
  schema: v0.2
  title: Robot Race dry-run-1 — Randow Maps
  scenario: Moving Parts
  is_moo: true
  notes: 'The producer–integrator entrant: geometry and controller work pass through
    explicit handoffs, with integration feedback and separately addressed race evidence.'
  dimension_axes:
  - time_horizon
  - iteration
actors:
- id: actor0
  label: Geometry Builder
  notes: Designs geometry using integration feedback and addressed race evidence.
- id: actor1
  label: Robot Integrator
  notes: Integrates geometry with a controller and gives feedback upstream.
- id: actor2
  label: Race Simulator
  notes: Deterministic software actor that races and records evidence.
actions:
- id: action0
  label: Design Geometry
  actor: actor0
  notes: Produces bounded geometry, intent, hypotheses, and measurement requests.
  measures:
  - id: input_tokens
    name: Model input tokens
    unit: tokens
  - id: output_tokens
    name: Model output tokens
    unit: tokens
  - id: repair_calls
    name: Format repair calls
    unit: calls
    better: lower
  - id: invalid_artifacts
    name: Invalid model artifacts
    unit: artifacts
    better: lower
- id: action1
  label: Integrate Robot
  actor: actor1
  notes: Produces a runnable package, then returns post-race integration feedback.
  measures:
  - id: input_tokens
    name: Model input tokens
    unit: tokens
  - id: output_tokens
    name: Model output tokens
    unit: tokens
  - id: repair_calls
    name: Format repair calls
    unit: calls
    better: lower
  - id: invalid_artifacts
    name: Invalid model artifacts
    unit: artifacts
    better: lower
- id: action2
  label: Race and Measure
  actor: actor2
  notes: Runs development trials and produces an outcome and addressed evidence.
entities:
- id: entity0
  label: Geometry Proposal
  system_boundary: internal
  notes: Geometry, intent, hypotheses, and measurement requests; not a runnable robot.
  measures:
  - id: requested_measurements
    name: Requested measurements
    unit: measurements
- id: entity1
  label: Complete Robot Package
  system_boundary: internal
  notes: Supplied geometry, controller, integration notes, and observation request.
  measures:
  - id: requested_measurements
    name: Requested measurements
    unit: measurements
- id: entity2
  label: Race Outcome
  system_boundary: internal
  notes: Human-facing result; upstream learning uses addressed returns.
  measures:
  - id: score
    name: Composite race score
    unit: points
    better: higher
  - id: completion
    name: Completed trial proportion
    unit: proportion
    better: higher
  - id: progress
    name: Normalized track progress
    unit: proportion
    better: higher
  - id: completion_time
    name: Completion time
    unit: seconds
    better: lower
  - id: rms_error
    name: RMS centre-line error
    unit: metres
    better: lower
  - id: max_error
    name: Maximum centre-line error
    unit: metres
    better: lower
  - id: line_loss_events
    name: Line-loss events
    unit: events
    better: lower
  - id: steering_oscillation
    name: Steering oscillation
    unit: index
    better: lower
  - id: control_effort
    name: Controller effort
    unit: index
    better: lower
  - id: controller_errors
    name: Controller errors
    unit: errors
    better: lower
  - id: noise_robustness
    name: Noise robustness
    unit: proportion
    better: higher
  - id: held_out_gap
    name: Development held-out gap
    unit: points
    better: lower
- id: entityR1
  label: Integration Feedback
  notes: Integrator judgement and requested geometry changes.
- id: entityR2A
  label: Geometry Race Data
  notes: Measurement-only evidence addressed to the Geometry Builder.
  measures:
  - id: supplied_requests
    name: Supplied requested measures
    unit: measurements
    better: higher
- id: entityR2B
  label: Integration Race Data
  notes: Measurement-only evidence addressed to the Robot Integrator.
  measures:
  - id: supplied_requests
    name: Supplied requested measures
    unit: measurements
    better: higher
- id: entity3
  label: Working Agreement
  system_boundary: private
  notes: Shared responsibilities, handoffs, feedback practice, and coordination state.
  measures:
  - id: agreement_revisions
    name: Working agreement revisions
    unit: revisions
- id: entityPrv0
  label: Geometry Expertise
  system_boundary: private
  notes: Private geometry knowledge and judgement.
- id: entityPrv1
  label: Integration Expertise
  system_boundary: private
  notes: Private controller and integration knowledge.
- id: entityPub0
  label: Design Constraints
  system_boundary: public
  notes: Permitted robot bounds, scoring criteria, and measurement vocabulary.
- id: entityPub2
  label: Track Conditions
  system_boundary: public
  notes: Tracks, seeds, noise, trial order, and held-out configuration.
