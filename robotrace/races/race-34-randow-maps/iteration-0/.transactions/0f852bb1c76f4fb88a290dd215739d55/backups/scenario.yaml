      ### Rationale


      Starting with a balanced and robust sensor layout to maximize line detection
      and control precision. Chose 5 sensors spaced evenly across the front of the
      robot to cover the tape width well, with a sensor size of 0.012 m to balance
      resolution and coverage. Set wheel track and body width to 0.14 m to allow stable
      turning and off-track tolerance. Wheel radius at 0.035 m for a good balance
      of speed and torque. Body length at 0.18 m and mass at 0.8 kg to keep the robot
      agile yet stable. Intent is to provide the integrator a geometry that offers
      good line sensing and stable dynamics, expecting improved line following and
      fewer line loss events. Feedback requested includes completion, progress, line
      loss events, rms error, and max error to evaluate line tracking and stability.


