map:
  id: race-203-randow-maps-muted
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Lead sensors, lighter
    notes: 'Moves the 7-sensor array forward to y=0.07 and shortens and lightens the
      body (length 0.12 m, mass 0.6 kg) to cut yaw inertia. Iteration 1 showed that
      sensor span removed line loss but every run still went off track at the 0.06
      m floor, so this targets lag and turn response. Evidence is the 60-trial summary
      for iteration 1.


      ### Rationale


      Evidence: across 60 trials of the iteration 0 design, every run went off track
      on all three tracks, with one line-loss event each time. Iteration 1 widened
      the sensor span to +/-0.06 m with 16 mm footprints, and line loss fell to 0
      on the oval, 0.6 on the s-bend and 1.0 on the slalom. Every run still ended
      off track. Progress stayed at 0.11 to 0.16, and max_error sat at 0.060 to 0.068
      m, the off-track floor. Coverage is therefore no longer the main cause. The
      robot now drifts off the line on the bends, and rms_error near 0.03 m shows
      a steady lag rather than random noise.


      Body width cannot help. The off-track limit is max(0.06, 0.0125 + body_width/4).
      Even at the 0.18 m maximum this is 0.0575, so the limit stays at 0.06 m. Yaw
      inertia is mass*(L^2+W^2)/12, so body length and mass are the geometry levers
      that change how quickly the robot can turn into a bend. Sensor forward reach
      (y) sets how far ahead the controller sees the line, so a longer lead should
      reduce the lag that lets error build up.


      Change: move the 7-sensor array forward to y = 0.07 to give more lead before
      the wheels reach the bend. Shorten body_length from 0.18 to 0.12 m and reduce
      mass from 0.8 to 0.6 kg. Together these cut yaw inertia from about 0.0031 to
      about 0.0014 kg m^2, so the robot can follow a sharp bend without overshooting.
      Keep the 16 mm footprint, the 0.02 m spacing, wheel_track 0.12 and wheel_radius
      0.03 fixed, so that the sensor-lead and inertia change can be read from the
      telemetry.


      Expected result: max_error should fall below 0.06 m, progress should rise above
      0.3, and the first off-track event should move later in the course. If progress
      still stalls near 0.15 with no line loss, the limit is probably base speed or
      turn authority, and the next iteration should change wheel_track or wheel_radius.


      - [Open this output](iteration-2/entity0/versions/d8cb0f134cf24c58ac1e92d2d68a7ba0/payload.json)

      - Based on: [entityR2A](iteration-2/entityR2A/versions/carried-745ee191a5e77876/payload.json)'
  - id: entity1
    label: Light body, forward array
    notes: 'Complete robot for the Builder''s 0.12 m, 0.6 kg body with the 7-sensor
      array at y = 0.07. Gains are raised slightly (kp 1.6, kd 0.3) to suit the lower
      yaw inertia, which drops about 54 percent. The base is set by iteration 1 telemetry,
      which showed 0 to 1 line loss per run and max_error of 0.06 to 0.068 m.


      ### Rationale


      Iteration 1 (60 trials, the 7-sensor, 16 mm, +/-0.06 m array at y = 0.05) removed
      most line loss: 0 on the oval, 0.6 on the s-bend and 1.0 on the slalom. Every
      run still went off track, with progress at 0.11 to 0.16 and max_error at 0.060
      to 0.068 m. rms_error stayed near 0.03 m in every track, which points to a steady
      lag on bends rather than noise. The Builder''s geometry moves the array forward
      to y = 0.07, cuts body_length to 0.12 m and mass to 0.6 m. Yaw inertia falls
      by about 54 percent (from about 0.0031 to 0.0014 kg m^2), so the robot can turn
      faster for the same wheel difference. Because the array now reads further ahead,
      the controller sees the bend earlier, so I keep the signal weights as in iteration
      1 (proportional to x, clipped to +/-2). I raise kp from 1.5 to 1.6 to correct
      the lag, since the lighter body responds faster. I raise kd from 0.25 to 0.3
      to damp the extra gain, with steering_oscillation at 0.15 to 0.16 on the s-bend
      and slalom in iterations 0 and 1. ki stays at 0.02 to avoid integral windup
      on long bends. base_speed stays at 1.5 so that the only controller change is
      the modest gain increase, and this lets the race separate geometry effects from
      speed. line_loss stays at last_direction, which worked best on the array. Expected
      result: max_error should fall toward 0.06 m or below, the first off-track event
      should move later, and progress should rise. This is a prediction, not a measurement.


      - [Open this output](iteration-2/entity1/versions/1ec83d7cebc8485aa8a66b072e58edd5/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/d8cb0f134cf24c58ac1e92d2d68a7ba0/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-745ee191a5e77876/payload.json)'
  - id: entityR1
    label: Turn-authority next steps
    notes: 'Feedback written before the race, with three branches tied to iteration
      0 and 1 results: a turn or speed limit (wheel_track or wheel_radius), oscillation
      from the lighter body (y or mass), and slalom line loss (y = 0.06).


      ### Feedback


      Written before this candidate has raced, so it states no outcome for it. Iteration
      1 (the 7-sensor, 16 mm, +/-0.06 m array at y = 0.05, with kp 1.5 and kd 0.25)
      cut line loss to 0 on the oval, 0.6 on the s-bend and 1.0 on the slalom. But
      every run still ended off track, with max_error at 0.060 to 0.068 m and progress
      at 0.11 to 0.16. rms_error stayed near 0.03 m on all tracks, which means a steady
      lag on bends, not random noise. Your change (y = 0.07, body_length 0.12, mass
      0.6) lowers yaw inertia by about 54 percent. To work with it I kept the signal
      weights as before, since they are already matched to sensor x, and raised kp
      to 1.6 and kd to 0.3 to correct faster while damping the extra turn response.
      The main risk is oscillation: steering_oscillation reached 0.15 to 0.16 on the
      s-bend and slalom in iterations 0 and 1. When the next race reports, use these
      rules. If max_error is still at or above 0.06 m and progress stays near 0.15
      with no line loss, the limit is turn authority or ground speed. Change wheel_track
      or wheel_radius next, not the sensors. If steering_oscillation rises above about
      0.15 on s-bend or slalom, the lighter body is overshooting. Move y back toward
      0.05 or raise mass back toward 0.8 before adding gain. If line loss returns
      at the slalom, the forward lead is probably too long for the sharp sections,
      so try y = 0.06.


      ### Requested changes


      - If max_error stays at or above 0.06 m with progress below 0.3 and no line
      loss: change wheel_track from 0.12 m to 0.10 m to raise turn rate, or wheel_radius
      from 0.03 m to 0.035 m for more ground speed. Evidence: iterations 0 and 1 both
      held progress at 0.11 to 0.16 with no line loss on the oval, which points to
      a turn or speed limit rather than sensing.

      - If steering_oscillation rises above about 0.15 on the s-bend or slalom: return
      the forward offset from y = 0.07 to y = 0.05 m, or raise mass from 0.6 kg to
      0.7 kg. Evidence: steering_oscillation was 0.147 on the s-bend and 0.160 on
      the slalom in iterations 0 and 1, and those tracks had the highest max_error.

      - If line_loss_events return on the slalom with max_error near 0.06 m: try y
      = 0.06 m for a shorter lead on sharp sections, with the 0.06 m span kept. Evidence:
      iteration 1 showed 1.0 line loss per run on the slalom with the 0.05 m array,
      and the lighter body changes how far ahead the sensors need to look.


      - [Open this output](iteration-2/entityR1/versions/1ec83d7cebc8485aa8a66b072e58edd5/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/d8cb0f134cf24c58ac1e92d2d68a7ba0/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-745ee191a5e77876/payload.json)'
