map:
  id: race-203-randow-maps-muted
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Larger wheel radius 0.04
    notes: 'Raises wheel_radius from 0.03 to 0.04 m on the best layout so far, with
      all other values held. Iteration 4 showed that off-track ends pin max_error
      at the 0.06 m floor and progress stays near 0.12 to 0.18, and a larger radius
      raises both ground speed and turn rate.


      ### Rationale


      Evidence: every run in every iteration ends off_track, with progress stuck at
      0.10 to 0.19 and max_error pinned at the 0.06 m off-track floor. Line loss is
      now rare (oval 0, s-bend about 0.95, slalom about 0.85 in iteration 4), so sensor
      coverage is no longer the main limit. Iteration 2 showed that moving the sensors
      to y=0.07 and shortening and lightening the body both hurt, so those stay reverted.
      Body width cannot widen the off-track limit, because max(0.06, 0.0125 + body_width/4)
      stays at 0.06 m. Narrowing wheel_track from 0.12 to 0.09 to 0.08 m gave the
      best scores so far (57.9, then 58.5), but the gain is flattening (+0.7 in the
      last step). Turn rate is (vR - vL)/wheel_track, and ground speed is wheel_radius
      times wheel rotation rate. Both turn rate and ground speed therefore scale with
      wheel_radius, so enlarging the wheel should add forward speed and turn authority
      together. The contract needs an average of about 1.5 m/s to finish in 3 s, and
      progress is far below that pace. Change: wheel_radius from 0.03 to 0.04 m, with
      everything else held at iteration 4 values (wheel_track 0.08 m, 7 sensors at
      y=0.05, 16 mm footprints, body 0.18 x 0.12 m, mass 0.8 kg). Expected result:
      ground speed and turn rate both rise about 33 percent, so progress should move
      above 0.2 and completion_time should be measurable on at least one track. Risk:
      higher speed may raise steering_oscillation and push max_error past the floor
      sooner.


      - [Open this output](iteration-5/entity0/versions/a64db5efddb447779d4437dc01121c79/payload.json)

      - Based on: [entityR2A](iteration-5/entityR2A/versions/carried-a52f9e5c19e21ad4/payload.json)'
  - id: entity1
    label: Wheel radius 0.04 package
    notes: 'Complete robot with wheel_radius 0.04 m on the iteration 4 layout, with
      turn gains scaled by 0.75 to hold yaw gain. Based on wheel_track gains in iterations
      3 and 4, and the sensor and body losses in iteration 2.


      ### Rationale


      Iteration 4 (wheel_track 0.08 m, kp 1.35, kd 0.25, 7 sensors at y=0.05, 16 mm,
      body 0.18 x 0.12 m, mass 0.8 kg) is the best design so far at 58.5. Every run
      ends off_track with max_error pinned at the 0.06 m floor, and progress is 0.12
      to 0.19. Line loss is now rare (oval 0, s-bend 0.95, slalom 0.85), so coverage
      is not the main limit. Iterations 2 and 3 show that the turn-rate levers (narrower
      track) helped, while a longer sensor lead and a lighter body hurt. Body width
      cannot widen the off-track limit. The Builder proposes wheel_radius 0.03 to
      0.04 m with everything else at iteration 4 values. I accept that geometry. Turn
      rate is (vR - vL)/wheel_track and wheel speed scales with wheel_radius, so turn
      authority rises by 4/3 for the same PWM differential. To keep the yaw gain near
      the iteration 4 level, I scale the turn gains by 0.75: kp 1.35 x 0.75 = 1.0,
      kd 0.25 x 0.75 = 0.19, ki 0.02 x 0.75 = 0.015. base_speed stays at 1.5 because
      ground speed comes from the wheel radius, not the PWM demand. line_loss stays
      last_direction. Expected result: ground speed and turn rate both rise about
      33 percent, so progress should move above 0.2 and completion_time should become
      measurable on at least one track. This is a prediction, not a measurement. The
      risk is higher steering_oscillation and an earlier off-track event.


      - [Open this output](iteration-5/entity1/versions/a2ad558ae2854899a8f3f7ece72af9ad/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/a64db5efddb447779d4437dc01121c79/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-a52f9e5c19e21ad4/payload.json)'
  - id: entityR1
    label: Speed-test feedback
    notes: 'Pre-race feedback: keep the narrow track and y=0.05 sensors, and choose
      the next step (mass or wheel radius) from whether steering oscillation rises
      or progress improves. Evidence is iterations 2 to 4.


      ### Feedback


      Written before this candidate has raced, so it states no outcome for it. Your
      wheel_track narrowing is the only geometry change that has raised the score:
      0.12 to 0.09 m (iteration 3) took the score from 55.1 to 57.9, and 0.09 to 0.08
      m (iteration 4) took it to 58.5. Iteration 2 showed that a forward sensor lead
      at y=0.07 and a lighter body (0.6 kg, shorter) both cut s-bend progress from
      0.163 to 0.119, so keep y=0.05 and mass 0.8 kg. Body width has no effect on
      the off-track limit, since max(0.06, 0.0125 + body_width/4) stays at 0.06 m.
      For wheel_radius 0.04 m, I scaled kp to 1.0 and kd and ki by 0.75 to keep yaw
      gain near iteration 4, so the race reads speed rather than extra turn gain.
      When the race reports: if progress rises above 0.2 and steering_oscillation
      stays at or below about 0.2, keep wheel_radius 0.04 m. If steering_oscillation
      rises above about 0.2 with max_error still at 0.06 m, the speed gain is causing
      overshoot, so raise mass before adding gain.


      ### Requested changes


      - If steering_oscillation rises above about 0.2 with max_error still at the
      0.06 m floor: raise mass from 0.8 kg to 0.9 kg, with the other geometry held.
      Evidence: iteration 2''s lighter body (0.6 kg) cut s-bend progress from 0.163
      to 0.119, so added inertia is the safer damping lever.

      - If progress rises above 0.2 with steering_oscillation at or below about 0.2:
      keep wheel_track 0.08 m and wheel_radius 0.04 m, and test wheel_radius 0.045
      m next. Evidence: iterations 3 and 4 showed narrowing the track raised progress
      on the s-bend (0.163 to 0.178 to 0.185), so turn and speed gains are working
      together.

      - Do not return wheel_track to 0.12 m or move the sensors to y=0.07 m. Evidence:
      iteration 2 (y=0.07 with a lighter body) scored 47.8, the lowest of the five
      iterations, and iteration 1 (wheel_track 0.12 m) scored 55.1, below both narrower-track
      iterations.


      - [Open this output](iteration-5/entityR1/versions/a2ad558ae2854899a8f3f7ece72af9ad/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/a64db5efddb447779d4437dc01121c79/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-a52f9e5c19e21ad4/payload.json)'
