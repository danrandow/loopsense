  id: race-203-randow-maps-muted
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Smaller wheel radius test
    notes: 'Reverts to the best design (iteration 4, 58.5) and lowers wheel_radius
      from 0.03 to 0.025 m, the opposite of the iteration 5 change that scored 41.4.
      Iteration 6 (mass 1.0 kg, 42.7) also hurt, so the test keeps mass at 0.8 kg
      to isolate speed.


      ### Rationale


      Race evidence from the last three iterations is consistent. Iteration 4 (wheel_track
      0.08 m, wheel_radius 0.03 m, mass 0.8 kg, 7 sensors at y=0.05 m, 16 mm footprints,
      body 0.18 x 0.12 m) is still the best design at 58.5. Iteration 5 raised wheel_radius
      to 0.04 m and fell to 41.4, with s-bend progress collapsing from 0.185 to 0.0625.
      Iteration 6 raised mass to 1.0 kg and fell to 42.7, with s-bend progress dropping
      to 0.065. Both changes hurt the s-bend most, and control effort stayed high.
      Every run still ends off_track with max_error pinned at the 0.06 m floor, and
      line loss is now rare, so sensor coverage is not the limit. The off-track floor
      cannot be moved by body width, since max(0.06, 0.0125 + body_width/4) stays
      at 0.06 m. Both extra speed (radius) and extra inertia (mass) reduced usable
      progress, which suggests the robot is overshooting or lagging on bends rather
      than being too slow. The one lever that has not been tested in this direction
      is lower ground speed. I therefore revert to iteration 4 and reduce wheel_radius
      from 0.03 to 0.025 m (the lower end of the range I have tested is 0.03, and
      0.025 is an unexplored step), keeping mass at 0.8 kg. This lowers ground speed
      and turn rate together, so it tests whether the overshoot that drives the off-track
      ends eases at lower speed. Expected result: s-bend and slalom progress rise
      above 0.185 and max_error drops below 0.063 m, at the cost of some completion_time.
      Risk: slower ground speed may leave progress too low to finish within 3 s, in
      which case the speed/turn trade-off has a sweet spot near 0.03 m.


      - [Open this output](iteration-7/entity0/versions/ce8e04b86db648efaae760a16fca9472/payload.json)

      - Based on: [entityR2A](iteration-7/entityR2A/versions/carried-407a606970319ce8/payload.json)'
  - id: entity1
    label: Smaller wheel radius test
    notes: 'Iteration 4 layout with wheel_radius cut to 0.025 m and controller unchanged,
      as the Builder asked. Evidence: the 0.04 m and 1.0 kg trials both lost progress,
      so overshoot at speed is the suspected limit.


      ### Rationale


      Iteration 4 (wheel_track 0.08 m, wheel_radius 0.03 m, kp 1.35, kd 0.25, ki 0.02,
      mass 0.8 kg, seven 16 mm sensors at y=0.05 m) is the best design so far at 58.5.
      Every run still ends off_track with max_error at the 0.06 m floor. Iteration
      5 (wheel_radius 0.04 m) fell to 41.4, with s-bend progress collapsing from 0.185
      to 0.0625. Iteration 6 (mass 1.0 kg) fell to 42.7, with s-bend progress at 0.065.
      Both results point the same way: extra speed or extra inertia reduces usable
      progress, which suggests overshoot and lag at speed rather than too little speed.
      The Builder''s intent is to test that direction by lowering wheel_radius to
      0.025 m. The Builder asked for only that one change, so I keep the iteration
      4 controller unchanged. Turn rate scales with wheel radius, so the effective
      yaw gain falls by about 17 percent (0.025/0.03). That is the intended test:
      if overshoot limits the robot, the off-track ends should ease. The risk is that
      progress falls because the robot is too slow to cover the course. Expected result,
      not measured: max_error below 0.063 m on the s-bend and slalom, with steering_oscillation
      and control_effort lower than iteration 4.


      - [Open this output](iteration-7/entity1/versions/e9375339facd40b2b49422e453f751a6/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/ce8e04b86db648efaae760a16fca9472/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-407a606970319ce8/payload.json)'
  - id: entityR1
    label: Radius and mass next
    notes: 'Feedback written before the race: it cites iterations 4, 5 and 6, gives
      the rule for reading the next result, and proposes wheel_radius 0.02 m or mass
      0.6 kg as the follow-up test.


      ### Feedback


      Written before this candidate has raced, so it states no outcome for it. The
      evidence is iteration 4 (58.5, best; wheel_radius 0.03 m, wheel_track 0.08 m),
      iteration 5 (wheel_radius 0.04 m, 41.4, with s-bend progress falling from 0.185
      to 0.0625) and iteration 6 (mass 1.0 kg, 42.7, with s-bend progress at 0.065).
      Both speed-raising and inertia-raising changes cut usable progress, so overshoot
      at speed looks like the limit. I kept the iteration 4 controller so your wheel_radius
      change is isolated, which also lowers effective yaw gain by about 17 percent.
      When the race reports: if max_error or steering_oscillation falls on the s-bend
      and slalom while progress holds near 0.185, the overshoot limit is confirmed.
      If progress falls below about 0.12 on the s-bend, the robot is too slow for
      the course, so the radius should stay near 0.03 m.


      ### Requested changes


      - If max_error and steering_oscillation fall on the s-bend and slalom while
      progress holds at or above 0.18: try wheel_radius 0.02 m (the contract minimum)
      with wheel_track 0.08 m. Evidence: iteration 5 showed that larger radius cut
      progress, so the downward direction is the one still untested.

      - If progress falls below about 0.12 on the s-bend with no drop in max_error:
      return wheel_radius to 0.03 m and test mass 0.6 kg at that radius. Evidence:
      iteration 6 (mass 1.0 kg) also cut s-bend progress to 0.065, so mass is the
      other lever to check with speed held constant.

      - Do not move the sensors back to y=0.07 m or return wheel_track to 0.12 m.
      Evidence: iteration 2 (y=0.07 with a lighter body) scored 47.8, and iteration
      1 (wheel_track 0.12 m) scored 55.1, both below iteration 4.


      - [Open this output](iteration-7/entityR1/versions/e9375339facd40b2b49422e453f751a6/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/ce8e04b86db648efaae760a16fca9472/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-407a606970319ce8/payload.json)'
