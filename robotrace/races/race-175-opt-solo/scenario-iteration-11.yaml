  - id: entity0
    label: Speed 1.55, iter 10 base
    notes: 'Keeps the iteration 10 robot (best raced score 931, all 60 trials finished
      on dev tracks) and raises base_speed 1.5 to 1.55 to cut completion time. Expected
      gain is about 1 to 2 points per track; the change is reverted if any track loses
      finishes.


      ### Rationale


      Evidence from iteration 10 (score 931.1, best so far): every trial finished
      on all three development tracks (oval 20/20 at 2.11 s, s-bend 20/20 at 2.44
      s, slalom 20/20 at 2.65 s). Mean rms_error is 0.007 to 0.016 m, and steering
      oscillation is 0.20 to 0.35. The score gap to the maximum now comes from three
      terms. Line-loss events are about 1.0 per trial on every track, which costs
      about 15 points each through 120*(1 - LL/8). Completion time costs about 18
      points on the time term (60*(1 - t/3)). The rms term is already near its ceiling.
      Iteration 5 showed that cutting base_speed hurt, and iterations 4 to 10 did
      not show that raising kp or kd helps, so I am not changing gains. Geometry is
      already at the contract minimum for mass (0.4 kg) and body_length (0.10 m),
      which is the lever that made the slalom finish. Change: base_speed 1.5 to 1.55,
      a small step toward the time term. It should cut about 0.05 to 0.1 s on each
      track, worth about 1 to 2 points per track. Everything else is held fixed (geometry,
      weights, kp 3.0, ki 0.05, kd 1.2, last_direction) so the effect of speed can
      be read cleanly. Risk: the final track is unseen, so a faster robot might leave
      the line on a sharper bend. Expected result: all tracks still finish 20/20,
      completion time about 0.05 to 0.1 s lower, and score about 932 to 934 on the
      development tracks. Hypotheses: (a) if any track drops below 20/20 finishes
      or slalom off-track exits return, revert to base_speed 1.5, which is the measured
      best; (b) if line_loss_events stay near 1.0, the event is probably a start or
      sensor-reach artefact, not speed, and the next step is to test sensor y back
      to 0.06 for a 0.5 LL reduction at the cost of some phase lead; (c) if completion_time
      falls with no added losses, base_speed 1.6 would be the next test. Measurements
      wanted: completion, progress, completion_time, rms_error, max_error, line_loss_events,
      steering_oscillation, control_effort, and controller_errors.


