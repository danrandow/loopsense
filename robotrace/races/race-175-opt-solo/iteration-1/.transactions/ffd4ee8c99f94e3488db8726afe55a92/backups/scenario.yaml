  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'Conservative first candidate: five sensors at 2 cm spacing, kp 4, kd 0.3,
      base speed 1.8, built from the contract with no race data yet. Expected to complete
      the oval and s-bend, with oscillation as the first thing to check on the slalom.


      ### Rationale


      Iteration 0 has no race telemetry, so this is a conservative baseline built
      from the contract, not a tuned design. Geometry: five sensors spread across
      the body (x = +0.04, +0.02, 0, -0.02, -0.04 m) at y = 0.03 m ahead of the axle,
      so the line is seen before the wheels reach it. Sensor size 0.012 m is about
      half the 25 mm tape width, which gives a clean, roughly linear response across
      the line. Wheel track 0.12 m and radius 0.03 m are mid-range; body 0.12 x 0.18
      m is inside the off-track limit with margin; mass 0.8 kg keeps yaw inertia moderate.
      Controller: sensor weights [2, 1, 0, -1, -2] make the signal linear in lateral
      offset, with positive (left) for a line to the left. base_speed 1.8 (PWM about
      90 percent) targets the roughly 1.5 m/s average needed to finish in 3 s while
      leaving headroom for the bends. kp 4 gives about 700 PWM counts of differential
      per unit of signal, which should correct offsets without saturating. kd 0.3
      damps the oscillation expected from kp at this speed. ki 0.05 is small, to handle
      the fixed motor mismatch without windup. line_loss last_direction recovers in
      the direction the robot was last turning. Expected result: completion on the
      oval and s-bend, with some oscillation on the slalom. Hypotheses to test: (1)
      if steering_oscillation is high, kp is too large or kd too small; (2) if completion_time
      is above 3 s with no line loss, base_speed is too low; (3) if max_error approaches
      0.06 m on tight bends, base_speed or kp is too high. Next measurements: completion,
      completion_time, rms_error, max_error, line_loss_events, steering_oscillation.


      - [Open this output](iteration-0/entity0/versions/9f27f8f34b2e497fb2d51becbf25ed99/payload.json)'
