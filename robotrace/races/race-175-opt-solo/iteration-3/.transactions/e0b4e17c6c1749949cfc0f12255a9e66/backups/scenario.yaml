  entities:
  - id: entity0
    label: Forward sensors, more kd
    notes: 'Moves the seven sensors forward to y = 0.06 m for more look-ahead and
      raises kd to 0.9 to damp it, with kp, base speed and weights kept. The s-bend
      and slalom ended off-track at progress 0.26 and 0.17 in iteration 2 with low
      oscillation, which points to a lack of steering lead.


      ### Rationale


      Evidence from the race of iteration 2 (score 219.76, best so far): oval finished
      6/20 with progress 0.76, but s-bend (progress 0.26) and slalom (progress 0.17)
      ended off_track in every trial. max_error sits at the 0.06 m off-track limit,
      line_loss_events is 0 on the s-bend and oval, and steering_oscillation is moderate
      (0.23 to 0.40). The robot is not jittering. It is reaching the limit on bends
      and leaving the tape before it can correct, which points to too little phase
      lead in the steering rather than too much gain. The sensors sit 0.03 m ahead
      of the axle, so the controller reacts only after the wheels have already reached
      the tape. Changes: (1) move all seven sensors forward to y = 0.06 m, giving
      about 3 cm more look-ahead so turn commands start earlier on bends; (2) raise
      kd from 0.6 to 0.9 to add damping for the extra lead, since oscillation is low
      and there is room; (3) keep kp at 3.0, the value that gave the best oval result,
      and keep base_speed at 1.5 and the 7-sensor array with weights unchanged, so
      only the phase lead changes. Expected result: higher progress on the s-bend
      and slalom (target above 0.4), fewer off_track exits, and no rise in oscillation
      above about 0.5. Hypotheses: (a) if s-bend progress stays under 0.3 with max_error
      at 0.06, the bends need more kp rather than more lead; (b) if steering_oscillation
      rises above 0.5, kd 0.9 is too high and should come back toward 0.6; (c) if
      the robot finishes but completion_time is above 3 s, base_speed should rise
      toward 1.7. Measurements wanted next: completion, progress, completion_time,
      rms_error, max_error, line_loss_events, steering_oscillation, control_effort.


