  entities:
  - id: entity0
    label: Lighter robot, more kd
    notes: 'Mass cut from 0.5 to 0.45 kg to keep reducing yaw inertia, which lifted
      slalom finishes from 0 to 7 of 20 in iteration 8. kd raised from 1.0 to 1.1
      to damp the over-response that showed as higher oscillation on the oval and
      s-bend.


      ### Rationale


      Evidence from iteration 8 (score 799.5, best so far): the oval finished 20/20
      at 1.88 s, the s-bend finished 20/20 at 2.34 s, and the slalom finished 7/20
      (progress 0.82 mean, 13 off-track exits). Lowering mass and body_length in iterations
      7 and 8 is what moved the slalom from 0 to 7 finishes, so reduced yaw inertia
      is the lever that is working. Iteration 8 also made the gentle tracks worse:
      oval and s-bend steering_oscillation rose to 0.17 and 0.36, control effort rose,
      oval line-loss events reached 1.0 per trial, and oval and s-bend times got slower.
      This fits the hypothesis from iteration 8 that the lighter robot is over-responding,
      so the remaining slalom failures are at least partly overshoot on reversals.
      Changes: (1) kd 1.0 to 1.1, to add damping against the faster yaw response;
      (2) mass 0.5 to 0.45 kg, a further step in the same direction as the change
      that helped the slalom, which cuts yaw inertia by roughly 10 percent. Body length
      (0.12 m), body width, wheel geometry, sensors, weights, kp 3.0, ki 0.05, base_speed
      1.5 and last_direction are unchanged, so the effect of these two changes can
      be read against iteration 8. I did not narrow wheel_track: that would raise
      effective steering gain by about 20 percent, which is close to the kp 3.5 change
      that did not help in iteration 6. Expected result: slalom finishes rise from
      7/20 toward 10 or more, with progress above 0.9, and oval and s-bend oscillation
      stay at or below about 0.2 and 0.35. Hypotheses: (a) if the oval or s-bend lose
      finishes or oscillation rises above 0.4, the lighter robot is still over-responding
      and kd should rise to about 1.2 with mass held at 0.45; (b) if slalom progress
      stays under 0.85 with off-track exits, the next lever is wheel_track narrowed
      to 0.10 m to add yaw authority, paired with kp back at 2.8 to hold the effective
      gain; (c) if the slalom finishes at 15 or more of 20 with oval time under 1.9
      s, base_speed can be tested at 1.6 for the time term. Measurements wanted: completion,
      progress, completion_time, rms_error, max_error, line_loss_events, steering_oscillation,
      control_effort.


