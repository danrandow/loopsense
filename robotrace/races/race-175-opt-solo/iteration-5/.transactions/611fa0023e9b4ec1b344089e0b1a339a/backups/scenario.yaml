  entities:
  - id: entity0
    label: Slower base speed 1.3
    notes: 'Lowers base_speed from 1.5 to 1.3 with the iteration-4 geometry and gains
      unchanged, to test whether speed is what drives slalom line loss and s-bend
      off-track exits. Oval has time margin (1.87 s against 3 s), so it should still
      finish.


      ### Rationale


      Evidence from iteration 4 (score 573.5, best so far). The oval finished 20/20
      with rms 0.011 m, so the steering gains and sensor geometry work on gentle curves.
      The s-bend finished 12/20 with 8 off-track exits and progress 0.92. The slalom
      failed in all 20 trials (progress 0.19, 0.5 line-loss events per trial, off_track
      every time). Steering oscillation is moderate (0.18 to 0.39) and not jittering.
      The failures are on fast direction changes and on bends where the robot drifts
      past the 0.06 m limit before it can correct. Speed is the most likely cause.
      At base_speed 1.5 the robot has large lateral momentum when it enters a reversal,
      and the rear sensors lose the tape. The oval has time margin (finish time 1.87
      s against a 3 s limit), so a slower base speed still finishes. Change: lower
      base_speed from 1.5 to 1.3 (about 65 percent PWM). Everything else stays fixed
      (7 sensors, y 0.08 m, footprint 0.016 m, weights, kp 3.0, ki 0.05, kd 1.0, last_direction)
      so the effect of speed can be read cleanly. Expected result: oval still completes,
      with finish time about 2.1 s, costing roughly 3 to 4 score points on the time
      term. The s-bend should finish 14 or more of 20, slalom progress should rise
      above 0.35, and line-loss events should fall. Hypotheses: (a) if slalom still
      goes off track with progress under 0.3, speed is not the main limit and kp must
      rise (to about 3.5) to give more steering authority on reversals; (b) if oval
      completion_time exceeds 2.3 s or the oval stops finishing, base_speed should
      return to about 1.4; (c) if steering_oscillation rises above 0.4, kd should
      come down toward 0.8. Measurements wanted next: completion, progress, completion_time,
      rms_error, max_error, line_loss_events, steering_oscillation, control_effort.


