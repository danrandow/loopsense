  entities:
  - id: entity0
    label: Look-ahead 0.08, kd 1.0
    notes: 'Moves the seven sensors to the maximum forward position (y = 0.08 m),
      raises kd to 1.0 and enlarges the sensors to 16 mm to reduce slalom line loss.
      Rests on iteration 3, where forward placement and kd 0.9 gave the best score
      so far (476.9), while the slalom still lost the line in nearly every trial.


      ### Rationale


      Evidence from iteration 3 (score 476.9, best so far): oval finished 20/20 with
      rms 0.012 m. The s-bend finished 4/20 (progress 0.71) and the slalom finished
      0/20 (progress 0.18, about 0.95 line-loss events per trial). Iteration 2 to
      3 was the only change that helped the bends, so the phase lead from forward
      sensor placement is working. Steering oscillation stayed moderate (0.18 to 0.33),
      so the controller is not jittering. The remaining failures are line loss on
      fast direction changes (slalom) and off-track drift on the s-bend, which points
      to too little look-ahead and too little damping for quick reversals. Changes:
      (1) move all seven sensors forward from y = 0.06 m to y = 0.08 m, the contract
      maximum, for the most look-ahead available; (2) raise kd from 0.9 to 1.0 to
      damp the faster phase response; (3) enlarge the sensor footprint from 0.012
      m to 0.016 m, so that the tape stays under at least one sensor during sharp
      lateral excursions and the sum of readings falls below 0.05 less often, which
      should cut line-loss events. Kept unchanged: 7 sensors with x spanning +/-0.075
      m, the weights, kp 3.0, ki 0.05, base_speed 1.5 and line_loss last_direction.
      Expected result: line_loss_events on the slalom below 0.5, slalom progress above
      0.4, and s-bend finishes at 8 or more of 20. Hypotheses: (a) if line-loss events
      remain near 1 on the slalom, the larger footprint is not enough and the recovery
      mode or lower base_speed is the next lever; (b) if steering_oscillation rises
      above 0.5, the 0.016 m footprint has blurred the signal and kd should return
      toward 0.9; (c) if the oval completion time stays near 1.85 s and bends still
      time out, base_speed can rise toward 1.7 for the finish-time term.


