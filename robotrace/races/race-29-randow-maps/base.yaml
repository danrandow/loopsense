map:
  id: race-29-randow-maps
  schema: v0.2
  title: Robot Race 29 — Randow Maps
  scenario: Moving Parts
  is_moo: true
  notes: 'The producer–integrator entrant: geometry and controller work pass through
    explicit handoffs, with integration feedback and separately addressed race evidence.'
  dimension_axes:
  - time_horizon
  - iteration
actors:
- id: actor0
  label: Geometry Builder
  notes: Designs geometry using integration feedback and addressed race evidence.
- id: actor1
  label: Robot Integrator
  notes: Integrates geometry with a controller and gives the Geometry Builder specific
    feedback on what the geometry needs to change.
- id: actor2
  label: Race Simulator
  notes: Deterministic software actor that races and records evidence.
actions:
- id: action0
  label: Design Geometry
  actor: actor0
  notes: 'Produces bounded geometry, intent, hypotheses, and measurement requests.


    ## Common to every agent

    Your team builds a line-following robot, and the race simulator scores it. Your
    goal is to maximise the team''s score. The score is shared: the team only does
    well if every member does their own job fully and well. The score that counts
    is measured once, after the last iteration, on an unseen track of a different
    shape from the development track, so favour designs that generalise over designs
    tuned to the development track. After each iteration you receive the full telemetry
    of the development races of the design built in the previous iteration. Use it
    to diagnose what went wrong and improve the design.


    Winning the race is your job. Everything you can do is a lever toward it: what
    you design, critique, request or approve. Choose between your levers by what each
    is likely to do to the team''s score, not by what looks most thorough. Decide
    from the evidence you have (telemetry, if any, and your teammate''s work), your
    remaining budget (runs, tokens and iterations; see remaining_budget and iteration_plan)
    and how far through the race you are. Having no evidence yet is not a reason to
    wait: a race result is the main way the team learns, and an iteration that produces
    no scored race teaches nothing. A measurement beats an opinion, including your
    own predictions.


    Work from the evidence. Diagnose from what you are given, change something that
    addresses what you found, and say why, what result you expect, and which measurements
    would confirm or refute it. Do not resubmit unchanged work unless the evidence
    shows it is working, and say so. Feedback outputs exist so your teammate can do
    better next time: make them specific and evidence-based, cite numbers from the
    telemetry or from your teammate''s work, and name the exact fields and values
    you want tried; never generic advice. Where an output has a rationale field, write
    it first and think it through there.


    ## This team: Geometry Builder and Robot Integrator

    You work in sequence. The Geometry Builder''s proposal goes to the Robot Integrator,
    who adds a controller, and the resulting complete robot races every iteration.
    The Builder never sees the controller, so the Integrator''s feedback is the Builder''s
    only view of how its geometry works in practice.


    ## Your role: Geometry Builder

    Design the sensor and body geometry that gives your teammate, the Robot Integrator,
    the best possible platform to build a controller on, and that the race simulator
    rewards. Deliver a Geometry Proposal every iteration. Read the Integration Feedback
    from the Integrator (they work with your geometry directly and know what it costs
    them) and the Geometry Race Data (telemetry from the last race), and work out
    what in that evidence points at geometry. In the proposal''s intent say what you
    changed, why, and what result you expect. Include your hypotheses and the measurements
    you want to see next. Do not produce a controller.'
  measures:
  - id: input_tokens
    name: Model input tokens
    unit: tokens
  - id: output_tokens
    name: Model output tokens
    unit: tokens
  - id: repair_calls
    name: Format repair calls
    unit: calls
    better: lower
  - id: invalid_artifacts
    name: Invalid model artifacts
    unit: artifacts
    better: lower
- id: action1
  label: Integrate Robot
  actor: actor1
  notes: 'Produces a runnable package and returns integration feedback to the Geometry
    Builder every iteration, before and after races.


    ## Common to every agent

    Your team builds a line-following robot, and the race simulator scores it. Your
    goal is to maximise the team''s score. The score is shared: the team only does
    well if every member does their own job fully and well. The score that counts
    is measured once, after the last iteration, on an unseen track of a different
    shape from the development track, so favour designs that generalise over designs
    tuned to the development track. After each iteration you receive the full telemetry
    of the development races of the design built in the previous iteration. Use it
    to diagnose what went wrong and improve the design.


    Winning the race is your job. Everything you can do is a lever toward it: what
    you design, critique, request or approve. Choose between your levers by what each
    is likely to do to the team''s score, not by what looks most thorough. Decide
    from the evidence you have (telemetry, if any, and your teammate''s work), your
    remaining budget (runs, tokens and iterations; see remaining_budget and iteration_plan)
    and how far through the race you are. Having no evidence yet is not a reason to
    wait: a race result is the main way the team learns, and an iteration that produces
    no scored race teaches nothing. A measurement beats an opinion, including your
    own predictions.


    Work from the evidence. Diagnose from what you are given, change something that
    addresses what you found, and say why, what result you expect, and which measurements
    would confirm or refute it. Do not resubmit unchanged work unless the evidence
    shows it is working, and say so. Feedback outputs exist so your teammate can do
    better next time: make them specific and evidence-based, cite numbers from the
    telemetry or from your teammate''s work, and name the exact fields and values
    you want tried; never generic advice. Where an output has a rationale field, write
    it first and think it through there.


    ## This team: Geometry Builder and Robot Integrator

    You work in sequence. The Geometry Builder''s proposal goes to the Robot Integrator,
    who adds a controller, and the resulting complete robot races every iteration.
    The Builder never sees the controller, so the Integrator''s feedback is the Builder''s
    only view of how its geometry works in practice.


    ## Your role: Robot Integrator

    Your job has two equally important parts, and you deliver both every iteration.


    1. Complete Robot Package: turn the supplied Geometry Proposal into a complete
    runnable robot by adding a controller for that exact geometry. Use the Integration
    Race Data (telemetry from the last race) to improve the controller. Preserve supported
    upstream measurement requests and add your own.


    2. Integration Feedback for the Geometry Builder: they cannot see your controller
    and rely on you to tell them how to improve. Say concretely how this geometry
    helped or hurt your controller (what you had to compensate for, and how), and
    give one to three specific requested_changes, naming the geometry fields and the
    values you want tried next and why. You can give this feedback as soon as you
    have read the geometry, before any race; add what the race data shows when you
    have it.'
  measures:
  - id: input_tokens
    name: Model input tokens
    unit: tokens
  - id: output_tokens
    name: Model output tokens
    unit: tokens
  - id: repair_calls
    name: Format repair calls
    unit: calls
    better: lower
  - id: invalid_artifacts
    name: Invalid model artifacts
    unit: artifacts
    better: lower
- id: action2
  label: Race and Measure
  actor: actor2
  notes: Runs development trials and produces an outcome and addressed evidence.
entities:
- id: entity0
  label: Geometry Proposal
  system_boundary: internal
  notes: Geometry, intent, hypotheses, and measurement requests; not a runnable robot.
  measures:
  - id: requested_measurements
    name: Requested measurements
    unit: measurements
- id: entity1
  label: Complete Robot Package
  system_boundary: internal
  notes: Supplied geometry, controller, integration notes, and observation request.
  measures:
  - id: requested_measurements
    name: Requested measurements
    unit: measurements
- id: entity2
  label: Race Outcome
  system_boundary: internal
  notes: Human-facing result; upstream learning uses addressed returns.
  measures:
  - id: score
    name: Composite race score
    unit: points
    better: higher
  - id: completion
    name: Completed trial proportion
    unit: proportion
    better: higher
  - id: progress
    name: Normalized track progress
    unit: proportion
    better: higher
  - id: completion_time
    name: Completion time
    unit: seconds
    better: lower
  - id: rms_error
    name: RMS centre-line error
    unit: metres
    better: lower
  - id: max_error
    name: Maximum centre-line error
    unit: metres
    better: lower
  - id: line_loss_events
    name: Line-loss events
    unit: events
    better: lower
  - id: steering_oscillation
    name: Steering oscillation
    unit: index
    better: lower
  - id: control_effort
    name: Controller effort
    unit: index
    better: lower
  - id: controller_errors
    name: Controller errors
    unit: errors
    better: lower
  - id: noise_robustness
    name: Noise robustness
    unit: proportion
    better: higher
  - id: held_out_gap
    name: Development held-out gap
    unit: points
    better: lower
- id: entityR1
  label: Integration Feedback
  notes: 'Direct feedback from the Robot Integrator to the Geometry Builder: how the
    geometry helped or hindered the controller, what the Integrator had to compensate
    for, and the specific geometry changes to try next. The Geometry Builder cannot
    see the controller, so this is their main way to learn what the Integrator needs.'
- id: entityR2A
  label: Geometry Race Data
  notes: Measurement-only evidence addressed to the Geometry Builder.
  measures:
  - id: supplied_requests
    name: Supplied requested measures
    unit: measurements
    better: higher
- id: entityR2B
  label: Integration Race Data
  notes: Measurement-only evidence addressed to the Robot Integrator.
  measures:
  - id: supplied_requests
    name: Supplied requested measures
    unit: measurements
    better: higher
- id: entityPub0
  label: Design Constraints
  system_boundary: public
  notes: Permitted robot bounds, scoring criteria, and measurement vocabulary. Its
    contract is the exact shape of a design (geometry and controller).
- id: entityPub2
  label: Track Conditions
  system_boundary: public
  notes: Tracks, seeds, noise, trial order, and held-out configuration.
