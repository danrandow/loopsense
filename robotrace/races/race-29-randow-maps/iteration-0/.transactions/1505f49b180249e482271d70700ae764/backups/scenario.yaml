      ### Rationale


      With no prior telemetry, I designed a moderate-sized robot with 5 sensors spaced
      evenly across the front to maximize line detection coverage and symmetry, which
      should help the controller maintain line position on varied track shapes. The
      sensor size is medium (0.012) to balance resolution and noise robustness. The
      body dimensions and mass are moderate to ensure stability without excessive
      inertia. Wheel radius and track width are chosen to allow stable turning and
      speed. This geometry aims to generalize well across the development tracks and
      unseen tracks, providing a solid platform for the integrator. The requested
      measurements focus on completion, progress, rms_error, line_loss_events, and
      steering_oscillation to evaluate line following performance and control smoothness.


