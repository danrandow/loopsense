map:
  id: race-214-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Slower, more damped draft
    notes: 'Lower base speed (1.0), kp 2.0, kd 1.0, ki 0 and a 5-sensor 16 mm array
      at y=0.05 m, aimed at fewer line losses and longer progress. Based on all 60
      trials going off track at progress 0.11-0.16 with max_error just over 0.06 m,
      and on the score being driven by progress.


      ### Rationale


      Evidence: all 60 development trials on the three tracks went off track with
      zero completions. Progress was only 0.11 to 0.16, each run had one line-loss
      event, and max_error (0.061 to 0.068 m) passed the 0.06 m off-track floor, while
      rms_error stayed near 0.03 m and steering oscillation was low (0.07 to 0.16).
      The robot tracks reasonably on average, then makes one large excursion, loses
      the tape, and the 0.35-throttle last_direction search carries it off. Base speed
      did not change the outcome: 1.2 to 1.8 all gave similar progress, so speed is
      not the main cause. The score is dominated by progress (250*progress plus a
      progress-weighted term), so staying on the line longer matters more than finish
      time, which is out of reach at this stage.


      Changes: (1) Base speed lowered from 1.2 to 1.0 to reduce lateral drift in the
      fast bends. Even this is a modest cut, since a clean run at a slower speed is
      worth more than a fast run that leaves the track. (2) kp set to 2.0 and kd raised
      to 1.0 for stronger damping of overshoot at the edge. With edge signal of 2,
      turn is 4, which gives about 1400 PWM of differential, below the 2047 base PWM
      at speed 1.0, so the wheels do not reverse. (3) ki set to 0 to remove integrator
      windup on the bends. (4) Sensors moved to y = 0.05 m, 16 mm footprint kept,
      spacing 0.02 m across x = -0.04 to +0.04, so the array covers the tape at larger
      offsets while staying close to the axle for quicker reaction. (5) Mass reduced
      to 0.6 kg to lower yaw inertia so the body turns more readily. Geometry otherwise
      unchanged; line_loss stays last_direction.


      Expected result: fewer line-loss events, max_error under 0.06 m on most seeds,
      and progress above 0.3 on the development tracks. Completion remains unlikely.
      The main risk is that the lower speed and extra damping slow the response enough
      to hurt rms_error; the revision round should check this.


      - [Open this output](iteration-4/entity0/versions/e2d3961c8f4c4967947079667df6b0ac/payload.json)

      - Based on: [entityR2A](iteration-4/entityR2A/versions/carried-22596f928a458be0/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Round-1 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-4/entityC1/versions/d236309136ce4d55bac623307dacbff2/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/e2d3961c8f4c4967947079667df6b0ac/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-22596f928a458be0/payload.json)'
  - id: entity1
    label: Isolated kd test (r2)
    notes: 'Reverts the draft to the best-raced iteration-2 design and changes only
      kd (0.2 to 0.4), following the critique''s one-factor request. Keeps kp 2.5
      and ki 0.2 to correct under-steering and motor mismatch, and rejects the speed
      cut and the unsupported mass and sensor-height changes.


      ### Rationale


      Response to the round-1 critique. I partly accept it and reject one part.


      Evidence: the raced iteration-2 design (16 mm sensors, x = -0.04..+0.04 at 0.02
      m pitch, y = 0.04, kp 2.5, kd 0.2, ki 0.2, base 1.6, body 0.18, mass 0.8) is
      the best-scoring run (52.11). All 60 trials went off track at progress 0.11
      to 0.16, with one line-loss event each and max_error 0.061 to 0.068 m. rms_error
      stayed near 0.03 m and steering oscillation was low (0.07 to 0.16). The excursion
      peak is under-corrected, not oscillating. Iteration 0 (kp 3.0) failed the same
      way, so gain changes alone have not moved the outcome.


      Accepted from the critique: (a) the draft''s kp cut to 2.0 works against the
      under-correction evidence, so I restore kp to 2.5, the raced value. (b) ki 0.02
      cannot cancel the fixed motor mismatch, so I restore ki 0.2 (integral maximum
      about 0.4 turn, roughly 140 PWM). (c) The unexplained mass 0.6, body_length
      0.16 and y 0.05 changes had no evidence, so I revert them to the raced values
      (mass 0.8, body_length 0.18, y 0.04). (d) The draft''s kd 1.0 has no noise bound,
      so I use a moderate kd 0.4. With a signal-rate noise of about 2 units/s, that
      gives about 0.8 turn (about 280 PWM), below the base PWM of about 3276 at speed
      1.6.


      Rejected from the critique: I do not drop base_speed to 1.0. The critique''s
      own point is that speed reduction costs progress, and progress is what the score
      rewards. I keep 1.6, the raced value.


      The design now differs from the raced iteration-2 design in one controller parameter
      only: kd 0.2 to 0.4. This follows the critique''s request to change one main
      factor per race, so any result change can be attributed to damping.


      Expected results (hypotheses, not data): progress close to or above 0.16, and
      max_error nearer 0.06 m if damping reduces the excursion. A small or no change
      is the likely outcome, since the failure mode is not yet explained. Completion
      remains unlikely at this speed. Test: compare progress, max_error and line_loss_events
      on the s-bend and slalom tracks against iteration 2. If the change is neutral,
      the next round should test the line-loss recovery mode, which the critique flagged
      as untested.


      - [Open this output](iteration-4/entity1/versions/8037c9356f654abe83b7a673d8590590/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/e2d3961c8f4c4967947079667df6b0ac/payload.json),
      [entityC1](iteration-4/entityC1/versions/d236309136ce4d55bac623307dacbff2/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-22596f928a458be0/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Critiques the kd 0.2 to 0.4 revision as a one-factor test that probably
      cannot fix the line-loss-triggered excursion seen in all 60 raced trials. Points
      to line-loss recovery as the likelier cause and notes that the rationale gives
      no measurable decision rule.


      - [Open this output](iteration-4/entityC2/versions/7be070bc2979494fa58638d7eb51b38b/payload.json)

      - Based on: [entity1](iteration-4/entity1/versions/8037c9356f654abe83b7a673d8590590/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-22596f928a458be0/payload.json)'
  - id: entity2
    label: 16mm footprint, single
    notes: 'Reverts to the raced iteration-0 controller and geometry, changing only
      the sensor footprint from 12 mm to 16 mm to test whether gap-free coverage reduces
      line losses. The critique showed the earlier six-parameter revision could not
      isolate its effect, and the raced max_error of 0.06 to 0.07 m sets the baseline.


      ### Rationale


      Round-2 critique: I accept most of it and revert to the raced design, changing
      one variable.


      Accepted: (1) The footprint explanation is weak. Line loss needs the summed
      readings below 0.05, which only happens when all sensors are almost off the
      tape, at about the 0.06 m off-track limit. A larger footprint therefore cannot
      prevent the early loss on its own. (2) The revision changed six things at once,
      so its race could not test the footprint. (3) The kp reduction (3.0 to 2.5)
      and the speed reduction (1.7 to 1.6) have no supporting evidence. The critique
      is right that they work against correcting drift and against the 3 s completion
      limit. I restore kp 3.0 and base_speed 1.7. (4) The ki and kd values rest on
      rough estimates, so I keep the raced values (ki 0.3, kd 0.1) rather than adjusting
      them on unmeasured bounds.


      Rejected: I keep the sensor span at x = +/-0.03 rather than widening it. The
      critique is right that widening the span changes the signal gain, and I have
      no evidence either way. I keep line_loss last_direction. search_left and stop
      would also need evidence, and only one design races per iteration.


      What I changed: only the sensor footprint, from 12 mm to 16 mm. The 15 mm pitch
      then gives full, gap-free coverage of the tape across the array, instead of
      3 mm gaps. This is a single-variable test of whether sensor coverage affects
      line-loss events and progress. Mass, body length and all controller values match
      the raced iteration-0 design, so any change in results can be attributed to
      the footprint.


      Decision rule for the next race: if progress or line_loss_events on the s-bend
      and slalom tracks improves over the raced design (progress above 0.16 or line_loss
      below 1), keep the 16 mm footprint. If not, revert to 12 mm. Completion is still
      the main test, and the 3 s limit remains untested.


      Expected results (hypotheses, not data): a modest change in progress and line_loss_events
      at most. Completion is unlikely with this single change, and the design does
      not address tracking-error growth directly. Main risk: the raced failure mode,
      lateral error growth to the 0.06 m limit, is unchanged.


      - [Open this output](iteration-2/entity2/versions/e6c1fbed6e91447ba01a51db38b95f99/payload.json)

      - Based on: [entity1](iteration-2/entity1/versions/f4cdc672bebc47b3a0f5d032dbbcbd83/payload.json),
      [entityC2](iteration-2/entityC2/versions/5b18716c0bb64fb1a11cd0feb10febd5/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-d16920ae07e572b2/payload.json)'
