  - id: entity2
    label: 'Final: unchanged tuned'
    notes: 'Resubmits the revised design with the same geometry and controller values
      (base_speed 1.7, kp 3, ki 0.3, kd 0.1, last_direction). The rationale accepts
      the critique''s analysis of line loss, integral wind-up and noise, but defers
      sensor and speed changes until race data exists, since no evidence in the inputs
      supports them.


      ### Rationale


      Round-2 critique: I kept the revised design unchanged. I accept its main points
      and reject its proposed alternatives.


      Accepted:

      (a) The speed claim is unsupported. base_speed is not mapped to ground speed,
      so 1.7 is a judgement, not a measured result. I keep it, but I label the ''margin
      for battery sag'' claim as untested.

      (b) Line loss is under-analysed. With last_direction, signal is +/-1 and throttle
      is 0.35, so base_pwm is about 1218. With kp=3 the turn is 1050 PWM, giving wheel
      commands of about 168 (inner) and 2268 (outer). This is a near-pivot that keeps
      the robot moving forward. I keep last_direction because search_left and search_right
      produce the same pivot in the opposite direction, and stop would lose all forward
      progress. I cannot justify the change without race data, so the design stays
      as it is.

      (c) The integral has no decay. Its maximum is about 210 PWM (ki=0.3, limit +/-2).
      I keep ki=0.3 because the fixed left/right mismatch must be cancelled on straights,
      and ki=0.05 could not do that. The post-bend unwinding is a real risk. I will
      check it in max_error and steering_oscillation on the s-bend and slalom tracks.

      (d) Noise near the line-loss threshold: the ratio denominator makes signal noise
      larger when readings are small. My kd estimate of about 70 PWM therefore holds
      only with a strong signal. This is a known limit of the estimate.


      Rejected or deferred:

      - Changing sensor geometry (forward-shifted or wider array) is deferred. The
      critique gives no race evidence that it helps, and only one design races per
      iteration.

      - Changing base_speed to 1.4 is not done here. I cannot run the comparison within
      this iteration. The result is in max_error on the sharpest track, which I will
      check after this race.

      - Scoring: completion carries 500 points, so completing matters more than a
      small time gain. I keep the speed at 1.7, which is fast enough to finish, not
      the maximum. Dropping speed to reduce risk would hurt the time term only slightly,
      but a slow robot may not finish inside 300 steps, so I do not cut speed further
      without evidence.


      Changes: none to the numbers. The rationale is clarified on the points above.


      Expected results (hypotheses, not data): completion on the development tracks,
      a small number of line-loss events, and rms_error below about 0.05 m. Main risks:
      overshoot on the sharpest bend at base_speed 1.7, and post-bend integral overshoot.
      The rms_error target has no basis yet, since no race data exists.


      - [Open this output](iteration-0/entity2/versions/d7645ea07ab94641a9523c0d30ed4fcb/payload.json)

      - Based on: [entity1](iteration-0/entity1/versions/ec0137599cd648d798ebb1f349cb91a9/payload.json),
      [entityC2](iteration-0/entityC2/versions/6d9fc4057f5b413695234d07a4064bc6/payload.json)'
