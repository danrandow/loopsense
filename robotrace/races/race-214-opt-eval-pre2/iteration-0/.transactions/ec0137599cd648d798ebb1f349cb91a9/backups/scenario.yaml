  - id: entity0
    label: 'Draft: 5-sensor, kp 3'
    notes: 'A first draft with five 12 mm sensors spanning ±3 cm, kp 3, kd 0.3, base
      speed 1.8 and last-direction line-loss recovery. No race telemetry was supplied,
      so the values come from the contract''s physics and are a prior, not a fit to
      past results.


      ### Rationale


      No race telemetry was supplied with this prompt, so this first draft rests on
      the contract''s physics and sensing description rather than on past results.
      The main risks are going off track on the sharper bends and failing to cover
      the course within 3 s. The design therefore aims for a moderate speed with enough
      steering authority and damping to stay on the line.


      Geometry: five sensors spread across x = -0.03 to +0.03 m in 0.015 m steps,
      all at y = 0.04 m ahead of the axle. This gives a 6 cm sensing span, wide enough
      to catch the 25 mm tape at speed and to keep a line in view through bends. The
      12 mm footprint is smaller than the tape, so readings vary smoothly as the line
      moves across. Wheel track 0.12 m and wheel radius 0.03 m are mid-range. Body
      width 0.12 m keeps the off-track limit at its 0.06 m floor, and the mass is
      0.8 kg.


      Controller: sensor_weights [-2, -1, 0, 1, 2] make the signal scale with the
      lateral offset of the line (about 1 unit per 15 mm), and the sign follows the
      contract (positive = left). kp = 3 gives roughly 875 PWM of differential for
      a 12 mm offset, which should correct firmly without saturating. kd = 0.3 damps
      the response to limit oscillation on the bends. ki = 0.05 is small, to avoid
      integrator wind-up on long bends. base_speed = 1.8 (about 90 percent of full
      PWM) is chosen to reach the average of about 1.5 m/s needed to finish in under
      3 s while leaving some headroom for slowing on tight bends. line_loss = last_direction,
      so the robot keeps turning toward the side it last saw the line.


      Expected result: completion on the development tracks, a few line-loss events
      at most, and rms_error well under 0.05 m. The main uncertainty is whether 1.8
      is too fast for the sharpest bend; the revision rounds should check this against
      the Evaluator''s critique.


