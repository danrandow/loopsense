map:
  id: race-214-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 1
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 0.
dimensions:
  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Wider sensors, damped PD
    notes: 'Widened sensor span to ±0.04 m, lowered kp to 2.0, raised kd to 0.8, and
      cut base speed to 1.4 to stop the early off-track exits seen in all 60 trials
      (progress 0.11 to 0.16, max_error about 0.06 m). Expect fewer line losses and
      off-track exits, at some cost in lap time.


      ### Rationale


      Evidence: all 60 development trials went off track early (progress 0.11 to 0.16,
      zero completions). Each run had one line-loss event, and max_error (0.062 to
      0.068 m) exceeded the 0.06 m off-track floor, while rms_error stayed near 0.03
      m. The robot therefore tracked reasonably on average but drifted out at the
      first sharp excursion. With body_width 0.12 the off-track limit is the 0.06
      m floor, and body_width cannot raise it because the allowed range tops out at
      0.18 m, which only reaches about 0.0575 m. The most likely causes are an overshooting,
      under-damped response at 1.8 base speed with kp 3.0, and a 6 cm sensor span
      with 12 mm sensors that loses the tape at the edges and triggers line loss.


      Changes: (1) Sensor spacing widened to 0.02 m (x = -0.04 to +0.04) so the array
      keeps the line in view further out, reducing line-loss events. A 16 mm footprint
      would help edge coverage, but I kept 12 mm to limit changes to one main factor.
      (2) kp reduced from 3.0 to 2.0 and kd raised from 0.3 to 0.8 to cut overshoot
      and jitter, since steering oscillation was 0.07 to 0.15. Because the sensor
      spacing is larger, the signal per mm is smaller, so kp 2.0 remains a firm correction.
      (3) base_speed reduced from 1.8 to 1.4 to give the controller room to track
      the bends. (4) ki set to 0.02 to limit integrator windup on the long bends.


      Trade-off: slowing the robot lowers the chance of finishing within 3 s, since
      about 1.5 m/s average is needed. I accept that to stop leaving the track, because
      finishing is worth 500 points and a run that leaves the track scores almost
      nothing. Expected result: fewer off-track exits, progress well above 0.5 on
      the development tracks, and possibly the first completions. Finish time may
      be near the 3 s limit, so completion is uncertain.


      - [Open this output](iteration-1/entity0/versions/1acf87aea5cf4ef78a78337f638a8c72/payload.json)

      - Based on: [entityR2A](iteration-1/entityR2A/versions/carried-d16920ae07e572b2/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Round-1 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-0/entityC1/versions/235d280398534ff3a04283114824b6ca/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/0d2c78118a52492295e771a9ae8acd60/payload.json)'
  - id: entity1
    label: Revised design v2
    notes: 'Lowers base_speed to 1.7 for bend margin, raises ki to 0.3 to cancel the
      motor mismatch, and cuts kd to 0.1 to limit noise jitter. The changes respond
      to the critique''s points on speed, mismatch and derivative noise; the geometry
      is kept unchanged, and the performance figures are hypotheses to test.


      ### Rationale


      What the critique got right, and what I changed.


      (1) Speed. The contract does not map base_speed to ground speed, so 1.5 m/s
      is an estimate, not a result. Base PWM is 4095*min(1, base_speed/2), so 1.8
      gives 3686 PWM (90%). The critique also called that ''moderate'' speed wrong,
      and it is right. I lower base_speed to 1.7 (3482 PWM, 85%). This is still fast,
      but it keeps more margin for the sharpest bend and for battery sag, while staying
      near the speed needed to finish within 300 steps on a 4 to 5 m course. The 3
      s limit is still a hypothesis to test, not a result.


      (2) Sharp bends. Turn demand is kp*signal*350 PWM. At kp=3 and signal near 2
      the differential is about 2100 PWM, so the inner wheel command falls to about
      1380 PWM and does not stall. Lowering base_speed reduces the risk of overshooting
      the 0.06 m off-track limit. I keep kp=3, since 1 signal unit gives 1050 PWM,
      which is firm but not saturating.


      (3) Motor mismatch. The critique is correct that ki=0.05 caps the integral contribution
      at about 35 PWM, which cannot cancel the fixed left/right mismatch. I raise
      ki to 0.3. The integral is limited to +/-2, so its maximum is 0.6 turn, about
      210 PWM, enough to remove a realistic steady drift. The wind-up risk is bounded
      by that limit.


      (4) Derivative noise. The critique is also right that kd=0.3 would multiply
      the 2 percent sensor noise. A noise step of about 0.02 in signal per 10 ms is
      about 2 units/s, and kd=0.3 would then give about 0.6 turn (about 210 PWM) of
      jitter. I reduce kd to 0.1, which caps this at about 70 PWM while keeping some
      damping on real bends. These figures are estimates from the stated noise, not
      measurements.


      (5) Sensors. The critique notes that all sensors share y=0.04 and that the signal
      is a coarse weighted average. I keep the geometry, because the 6 cm span and
      12 mm footprints still give a smooth enough response and changing it is not
      justified without race data. The 15 mm pitch with 12 mm footprints leaves 3
      mm gaps, which I accept for now.


      (6) Line loss. The critique asks what happens on a straight after a loss. With
      last_direction, the robot keeps the sign of the last valid signal at 0.35 throttle,
      so a loss on a straight will steer toward the side last seen, which should recover
      on the next bend. I keep last_direction.


      What I rejected: I did not move to search_left or stop, since they add risk
      on bends and the critique gave no evidence for them.


      Expected results (hypotheses, not data): completion on the development tracks,
      a small number of line-loss events, and rms_error below about 0.05 m. Main risk:
      the sharpest development track at base_speed 1.7 may still overshoot. Test:
      compare completion, max_error and line_loss_events on the sharpest track at
      1.7 against a run at about 1.4 if the first result shows large max_error.


      - [Open this output](iteration-0/entity1/versions/ec0137599cd648d798ebb1f349cb91a9/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/0d2c78118a52492295e771a9ae8acd60/payload.json),
      [entityC1](iteration-0/entityC1/versions/235d280398534ff3a04283114824b6ca/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Round-2 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-0/entityC2/versions/6d9fc4057f5b413695234d07a4064bc6/payload.json)

