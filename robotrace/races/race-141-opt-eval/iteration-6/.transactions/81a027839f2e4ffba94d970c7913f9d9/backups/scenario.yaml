map:
  id: race-141-opt-eval
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: kd 0.9 on kp 2.6 base 1.2
    notes: 'Keeps geometry and the iteration 4 gains, and raises kd from 0.8 to 0.9
      to damp slalom overshoot. Iteration 4 cut slalom max_error to 0.0618 (still
      above the 0.06 limit, 0/20 finishes), and the Evaluator''s next step was more
      derivative damping at this speed.


      ### Rationale


      Evidence. Iteration 4 (kp 2.6, base_speed 1.2, kd 0.8) scored 679.86, just below
      iteration 3 (683.18). The oval stayed 20/20 (mean 1.83 s) and the s-bend fell
      to 19/20 (one off-track, mean 2.13 s). The slalom is still 0/20, but its max_error
      dropped from 0.0646 to 0.0618 and its line_loss_events held at 1.0, down from
      1.45. So lowering corner gain and speed helped the slalom without breaking the
      other tracks. The slalom is still 0.0018 m above the 0.06 m limit, and every
      slalom failure is still an off-track end. Geometry has not changed since iteration
      2, and the Evaluator asked to keep it fixed until the controller question is
      settled.


      Change. kd 0.8 to 0.9, with kp 2.6, base_speed 1.2, ki 0.05, sensor_weights,
      line_loss and all geometry unchanged. The slalom alternates left and right,
      so extra derivative damping should cut overshoot between bends and pull max_error
      below 0.06. This is the next lever named in iteration 4''s Evaluator feedback.
      Oval steering_oscillation was 0.14 at kd 0.8, so the jitter cost of higher kd
      should be small.


      Expected result. Slalom max_error between 0.055 and 0.06, some slalom finishes,
      slalom line_loss_events at or below 1.0, oval still 20/20 with completion_time
      under 2.0 s, and s-bend finish rate at or above 0.95.


      Decision rule for the next iteration. If the slalom max_error falls below 0.06
      with any slalom finishes, hold these values and test a small ki change (0.05
      to 0.1) only if line losses stay high. If the slalom still ends off track with
      max_error at or above 0.06 and kd 0.9 does not reduce it, return kd to 0.8 and
      test kp 2.4 at base_speed 1.2. If the s-bend or oval finish rate drops below
      0.95, return kd to 0.8.


      Hypotheses to test. (a) Higher kd reduces slalom overshoot enough to bring max_error
      under 0.06. (b) Slalom failures come from overshoot on alternating bends, not
      from speed alone. Measurements requested: full set, read per track, especially
      slalom max_error, line_loss_events and steering_oscillation.


      - [Open this output](iteration-5/entity0/versions/21ae6e5a33d947d191bae02377d7be68/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-8b3b5e125abbda74/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-86fdf3ffe1025dbe/payload.json)'
  - id: entityR1
    label: Approve kd 0.9 test
    notes: 'Approved the single-variable kd 0.8 to 0.9 step on the iteration 4 controller,
      which had slalom max_error 0.0618 and 0/20 slalom finishes. The step is low-risk
      on the oval and s-bend, and the feedback gives decision rules for the next race
      based on per-track results.


      ### Feedback


      Approved to race. The candidate is valid and changes only kd, from 0.8 to 0.9,
      relative to iteration 4 (kp 2.6, base_speed 1.2, score 679.86). Geometry, ki
      0.05, kp, base_speed, sensor_weights and line_loss are unchanged, so the race
      isolates derivative damping. Iteration 4 cut the slalom max_error from 0.0646
      (iteration 3) to 0.0618, with line_loss_events down from 1.45 to 1.0, but it
      still ended 0/20 off track. The oval (20/20, mean 1.83 s) and s-bend (19/20,
      mean 2.13 s) show that speed is not the limit on those tracks. Because the slalom
      is 0.0018 m above the limit and it is the only track with no finishes, a small
      kd step is a low-risk test. Two cautions from history: kd 0.8 coincided with
      higher slalom line losses in iteration 3 (1.45 at kp 3.0, base_speed 1.3), and
      oval steering_oscillation was 0.14 at kd 0.8, so the jitter cost of kd 0.9 should
      be small. After the race, read the result by track. If the slalom max_error
      falls below 0.06 with any slalom finishes, hold kp 2.6, base_speed 1.2 and kd
      0.9, and test ki 0.1 only if slalom line_loss_events stay at or above 1.0. If
      the slalom still ends off track with max_error at or above 0.06 and kd 0.9 does
      not reduce it, return kd to 0.8 and test kp 2.4 at base_speed 1.2. If the s-bend
      or oval finish rate drops below 0.95, return kd to 0.8. Keep geometry fixed
      until the slalom finishes at least once.


      ### Requested changes


      - If the slalom max_error falls below 0.06 with any slalom finishes, hold kp
      2.6, base_speed 1.2 and kd 0.9, and test ki 0.05 to 0.1 only if slalom line_loss_events
      stay at or above 1.0 (iteration 4: 1.0 at kd 0.8).

      - If the slalom still ends off track with max_error at or above 0.06 and kd
      0.9 does not reduce it, return kd to 0.8 and test kp 2.4 at base_speed 1.2,
      since iteration 4 moved max_error from 0.0646 to 0.0618 when kp and speed fell
      together.

      - If the s-bend or oval finish rate drops below 0.95 (iteration 4: s-bend 19/20,
      oval 20/20), return kd to 0.8. Keep geometry fixed until the slalom finishes
      at least once.


      - [Open this output](iteration-5/entityR1/versions/2b18595bb298425dbe2edcc591789112/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/21ae6e5a33d947d191bae02377d7be68/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-86fdf3ffe1025dbe/payload.json)'
