map:
  id: race-141-opt-eval
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: 'Final: search_right'
    notes: 'Keeps the iteration 10 design unchanged (search_right, base_speed 1.1,
      kp 2.6, kd 0.9, x +/-0.03 m). It has the lowest measured slalom max_error (0.0646)
      and line losses (1.15), with oval and s-bend unchanged. Chosen for robustness
      on the final unseen track, since no iterations remain to test further.


      ### Rationale


      Final iteration. The race of this design is the last development race and the
      basis of the final unseen-track score, so robustness matters more than another
      experiment.


      Evidence: Iteration 10 (search_right, otherwise identical to iteration 9) scored
      703.76 against 704.85 for iteration 9 (last_direction). The oval and s-bend
      statistics are identical to iteration 9 to the last digit, so the loss response
      did not change those tracks. On the slalom, search_right lowered max_error from
      0.0661 to 0.0646 and line_loss_events from 1.35 to 1.15, while the slalom still
      ended 0/20 off track. The score gap of about 1 point is within noise. Across
      iterations 3 to 10 the slalom max_error has stayed between 0.0618 and 0.0661
      under every gain, speed, coverage and loss setting tried, so no tested lever
      has produced a slalom finish.


      Decision: keep the iteration 10 design unchanged (base_speed 1.1, kp 2.6, ki
      0.05, kd 0.9, sensor_weights [-2,-1,0,1,2], line_loss search_right, x +/-0.03
      m at y 0.06, 16 mm footprint, mass 0.6, wheel_track 0.12, wheel_radius 0.03,
      body 0.16 x 0.16). It is the design with the lowest slalom max_error and line-loss
      count measured, it matches the best oval and s-bend results, and the Evaluator
      approved it. I considered the search_left test the Evaluator suggested, but
      with no iterations left there is no later use for its result, and an untested
      loss direction could hurt an unseen track that resembles the s-bend or oval.


      Expected result: oval and s-bend near 20/20 with completion times near 1.9 s
      and 2.25 s; slalom still off track at max_error about 0.064 to 0.066, unless
      the unseen track is easier. Hypotheses: (a) search_right gives a small slalom
      gain over last_direction; (b) speed 1.1 keeps s-bend completion_time under 2.5
      s. Measurements requested: the full set, read per track, with emphasis on completion,
      completion_time, max_error and line_loss_events on any track that shows losses.


      - [Open this output](iteration-11/entity0/versions/197bf12aefcf466cb90e3adf515fbcda/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-a1658716213c50aa/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-e459c38aaa2fcae1/payload.json)'
  - id: entityR1
    label: 'Approve: search_right'
    notes: 'Approved the single-variable change line_loss last_direction to search_right
      on the iteration 9 design, because the slalom max_error has stayed at 0.0618
      to 0.0661 under every controller and geometry change tried, and line-loss response
      is the untested lever. Oval and s-bend losses are rare, so the score base is
      unlikely to move much, and the race is the best use of the remaining runs.


      ### Feedback


      Approved to race. The candidate is valid and is a single-variable test against
      iteration 9, the best raced design (704.85). Geometry stays at x ±0.03 m at
      y 0.06 with the 16 mm footprint, mass 0.6, and the same wheels. The controller
      stays at base_speed 1.1, kp 2.6, ki 0.05, kd 0.9, and sensor_weights [-2,-1,0,1,2].
      Only line_loss changes, from last_direction to search_right. Iterations 3 to
      9 show that the slalom max_error has stayed between 0.0618 and 0.0661 under
      every kp, kd, ki, x-coverage and speed setting tried. Slalom line_loss_events
      have stayed between about 1.0 and 1.45 throughout. The line-loss response is
      therefore the untested lever, and this race isolates it. The oval and s-bend
      have rare line losses (0.5 and 0.15 per run in iteration 9), so the score base
      is unlikely to move much. The main risk is that a fixed left sweep worsens s-bend
      or oval recovery. Read the result by track. If the oval or s-bend finish rate
      falls below 0.95, or s-bend completion_time exceeds about 2.8 s, return line_loss
      to last_direction and keep the other values. If the slalom still goes off track
      with max_error at or above 0.06 and line_loss_events stay near 1.0 or higher,
      test search_left next with everything else unchanged. If any slalom run finishes,
      hold all values and confirm the score rather than change gains.


      ### Requested changes


      - If the oval or s-bend finish rate drops below 0.95, or s-bend completion_time
      exceeds about 2.8 s, set line_loss back to last_direction. Iteration 9 reference:
      oval 20/20 (mean 1.87 s), s-bend 20/20 (mean 2.25 s), with 0.5 and 0.15 line-loss
      events per run.

      - If the slalom still ends off track with max_error at or above 0.06 and line_loss_events
      remain near 1.0 or higher, test line_loss search_left with everything else unchanged.
      Iterations 3 to 9 keep the slalom max_error between 0.0618 and 0.0661, so a
      different fixed sweep direction is the next structural test.

      - If any slalom run finishes under search_right, hold all values and use the
      next race to confirm the score, rather than changing gains or geometry.


