  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence from the development simulator (60 trials, baseline design): the oval
      finishes 40% of the time, with 0.75 line-loss events per run and max_error 0.055.
      The s-bend and slalom never finish. They end off-track with about 2 line-loss
      events per run, and s-bend max_error reaches 0.0635, above the 0.06 m limit.
      The failure mode is losing the line on bends, not running out of time. Evaluator
      feedback says the candidate has no race telemetry yet, so this change is based
      on the simulator aggregates, not a race of this candidate.


      Changes and reasons:

      1. Geometry: widen sensor coverage from x = ±0.024 to ±0.030 (spacing 0.015
      m) and enlarge the footprint from 12 mm to 16 mm. The original array lost the
      line once the robot drifted about 0.03 m from centre, which matches the line-loss
      events. A 16 mm footprint covers more of the 25 mm tape, so the readings stay
      non-zero during larger offsets.

      2. Controller kp from 2.5 to 3.5: the bends are where max_error exceeds the
      limit, so tighter proportional response should keep the robot nearer the centre
      line.

      3. Controller kd from 0.3 to 0.6: the baseline oscillation (about 0.2 to 0.25)
      will probably rise with higher kp, so more derivative damping is included now
      rather than after a failure.

      4. base_speed stays at 1.5. The oval mean finish time of 1.87 s shows that 1.5
      m/s is needed to finish within 3 s, so lowering speed would likely lose completion.

      5. ki, sensor_weights, line_loss, wheel geometry and mass are unchanged, so
      the race isolates the sensor-coverage and gain effects.


      Expected result: fewer line-loss events on the s-bend and slalom, max_error
      below 0.06, and better finish rate on the oval. Hypotheses to test next: (a)
      wider coverage reduces line-loss events; (b) kd 0.6 keeps steering_oscillation
      below about 0.2 with the higher kp. If line_loss_events stays high, reduce base_speed
      to about 1.3 and accept a slower finish. If oscillation rises above 0.3, raise
      kd to about 0.8.


      - [Open this output](iteration-1/entity0/versions/8f6df28c25694e5d9c82ccc869ce1295/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-40c920e86d433a08/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-850c0edce754d632/payload.json)'
  - id: entityR1
    label: 'Baseline review: approve'
    notes: 'Iteration 0 has no race data, so the candidate was checked only against
      the contract. It is valid and not obviously broken, so it is approved to race
      and produce telemetry. Next-race changes are tied to the speed and oscillation
      measurements requested.


      ### Feedback


      Iteration 0 has no race data yet, so this review rests only on the public contract
      and the candidate''s own contents. The candidate is valid: five sensors and
      five weights match, all values sit inside their limits, and line_loss is a permitted
      option. Sensor x-positions run from -0.024 to +0.024 m, and the weights (-2
      to +2) have the correct sign convention, with left-side sensors positive. The
      12 mm footprint is close to half the 25 mm tape width, which gives a usable
      gradient. Nothing here looks obviously broken, so it should race now to produce
      telemetry. Its weakest assumption is base_speed 1.5. The contract requires an
      average of about 1.5 m/s to finish inside 3 s, and the candidate has no margin
      for line losses or slowdowns in bends. Its gains (kp 2.5, kd 0.3) are untested,
      so the next race should decide which one to change. If the run does not complete,
      first check progress and completion_time to see whether speed is the limit.
      If it completes with high steering_oscillation, raise kd. If it completes with
      high rms_error but few line-loss events, raise kp. If line_loss_events is high,
      reconsider line_loss or lower base_speed. Keep the geometry unchanged until
      the controller has been tuned.


      ### Requested changes


      - If the race shows completion 0 with progress short of 0.995 and a low completion_time,
      raise base_speed in small steps (for example 1.5 to 1.7) before changing gains.
      The 3 s limit needs about 1.5 m/s average, and the baseline is not yet shown
      to reach it.

      - If the race shows high steering_oscillation or max_error near the 0.06 m off-track
      limit, raise kd from 0.3 to about 0.5 and keep kp at 2.5. Derivative action
      is the first lever for oscillation.

      - If the race shows high rms_error with few line_loss_events and no oscillation,
      raise kp from 2.5 to about 3.5 to tighten tracking on bends, keeping kd at or
      above 0.3 to avoid new oscillation.


      - [Open this output](iteration-0/entityR1/versions/d3ffad21290040ee88cd001f976e398a/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/a3df23ab8af64a0dad5dfe70175491f2/payload.json)'
