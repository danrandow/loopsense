map:
  id: race-141-opt-eval
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: kd 0.9 on kp 2.6 base 1.2
    notes: 'Keeps geometry and the iteration 4 gains, and raises kd from 0.8 to 0.9
      to damp slalom overshoot. Iteration 4 cut slalom max_error to 0.0618 (still
      above the 0.06 limit, 0/20 finishes), and the Evaluator''s next step was more
      derivative damping at this speed.


      ### Rationale


      Evidence. Iteration 4 (kp 2.6, base_speed 1.2, kd 0.8) scored 679.86, just below
      iteration 3 (683.18). The oval stayed 20/20 (mean 1.83 s) and the s-bend fell
      to 19/20 (one off-track, mean 2.13 s). The slalom is still 0/20, but its max_error
      dropped from 0.0646 to 0.0618 and its line_loss_events held at 1.0, down from
      1.45. So lowering corner gain and speed helped the slalom without breaking the
      other tracks. The slalom is still 0.0018 m above the 0.06 m limit, and every
      slalom failure is still an off-track end. Geometry has not changed since iteration
      2, and the Evaluator asked to keep it fixed until the controller question is
      settled.


      Change. kd 0.8 to 0.9, with kp 2.6, base_speed 1.2, ki 0.05, sensor_weights,
      line_loss and all geometry unchanged. The slalom alternates left and right,
      so extra derivative damping should cut overshoot between bends and pull max_error
      below 0.06. This is the next lever named in iteration 4''s Evaluator feedback.
      Oval steering_oscillation was 0.14 at kd 0.8, so the jitter cost of higher kd
      should be small.


      Expected result. Slalom max_error between 0.055 and 0.06, some slalom finishes,
      slalom line_loss_events at or below 1.0, oval still 20/20 with completion_time
      under 2.0 s, and s-bend finish rate at or above 0.95.


      Decision rule for the next iteration. If the slalom max_error falls below 0.06
      with any slalom finishes, hold these values and test a small ki change (0.05
      to 0.1) only if line losses stay high. If the slalom still ends off track with
      max_error at or above 0.06 and kd 0.9 does not reduce it, return kd to 0.8 and
      test kp 2.4 at base_speed 1.2. If the s-bend or oval finish rate drops below
      0.95, return kd to 0.8.


      Hypotheses to test. (a) Higher kd reduces slalom overshoot enough to bring max_error
      under 0.06. (b) Slalom failures come from overshoot on alternating bends, not
      from speed alone. Measurements requested: full set, read per track, especially
      slalom max_error, line_loss_events and steering_oscillation.


      - [Open this output](iteration-5/entity0/versions/21ae6e5a33d947d191bae02377d7be68/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-8b3b5e125abbda74/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-86fdf3ffe1025dbe/payload.json)'
  - id: entityR1
    label: Approve kp 2.6 at 1.2 m/s
    notes: 'Approved the candidate that lowers kp to 2.6 and base_speed to 1.2 from
      the best raced design (683.18, iteration 3), with geometry and kd unchanged.
      The slalom failed at max_error 0.0646 and 1.45 line losses in iteration 3, so
      the untested corner-gain lever gets a race, with a kd 0.7 fallback if line losses
      persist.


      ### Feedback


      Approved to race. The candidate is valid and changes only kp (3.0 to 2.6) and
      base_speed (1.3 to 1.2) from iteration 3, the best raced design (683.18). Geometry,
      ki 0.05, kd 0.8, sensor_weights and line_loss are unchanged, so the race isolates
      corner gain and speed. Evidence for the change: iteration 3 cut base_speed from
      1.4 to 1.3 and raised kd to 0.8, and the slalom still went off track at max_error
      0.0646 (0/20 finishes) with line_loss_events up from 1.0 to 1.45. Lowering speed
      alone did not bring slalom max_error under 0.06, so the untested lever is kp.
      Oval (20/20, mean 1.79 s) and s-bend (20/20, mean 2.21 s) both have time margin
      for 1.2 m/s, but the 3 s limit still has to be met on the s-bend. Read the result
      by track. If the oval or s-bend finish rate falls below 1.0, return base_speed
      to 1.3 and keep kp 2.6. If the slalom still goes off track with max_error above
      0.06 while line_loss_events stay at or above about 1.4, the line-loss increase
      may come from kd 0.8 rather than speed, so test kd 0.7 with kp 2.6 at base_speed
      1.2 to see whether the loss count falls. Do not change geometry until the controller
      question is settled.


      ### Requested changes


      - If the oval or s-bend finish rate drops below 1.0, or the s-bend completion_time
      rises above about 2.7 s, set base_speed back to 1.3 and keep kp 2.6. Iteration
      3 finished both tracks 20/20 at base_speed 1.3.

      - If the slalom still ends off track with max_error above 0.06 and line_loss_events
      stay near or above 1.4, set kd from 0.8 to 0.7 with kp 2.6 and base_speed 1.2.
      Iteration 2 (kd 0.7) had 1.0 slalom line losses against 1.45 at kd 0.8.

      - If the slalom max_error falls below 0.06 with some slalom finishes, keep kp
      2.6 and base_speed 1.2 and hold geometry fixed, then test a small kd or ki change
      only if line losses remain high.


      - [Open this output](iteration-4/entityR1/versions/d2c9651cd57448cd96be3e5fa77e850d/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/03d133e46aa24f20b191952b31242d57/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-191c2ca57b634814/payload.json)'
