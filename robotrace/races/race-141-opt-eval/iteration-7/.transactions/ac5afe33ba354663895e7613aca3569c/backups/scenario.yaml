map:
  id: race-141-opt-eval
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: ki 0.1 integral test
    notes: 'Keeps kp 2.4, kd 0.8, base_speed 1.2 and geometry from iteration 6 and
      raises ki from 0.05 to 0.1. Iteration 6 left slalom max_error at 0.0632 with
      1.05 line losses, which is the case the Evaluator''s ki rule targets, and the
      oval and s-bend stayed at 20/20.


      ### Rationale


      Evidence: iteration 6 (kp 2.4, kd 0.8, ki 0.05, base_speed 1.2) scored 679.10.
      The oval (20/20, mean 1.82 s) and s-bend (20/20, mean 2.14 s) both held at 1.0.
      The slalom is still 0/20 off-track, with mean max_error 0.0632 (above the 0.06
      m limit) and 1.05 line-loss events per run. Lowering kp from 2.6 to 2.4 did
      not reduce slalom max_error; at kd 0.8 it was 0.0618 at kp 2.6 and 0.0632 at
      kp 2.4. Changing kd from 0.8 to 0.9 also did not help (0.0634). Neither proportional
      gain nor derivative damping is the lever that clears the slalom limit. The Evaluator''s
      rule for this case (slalom max_error at or above 0.06 with line-loss events
      at or above 1.0) points to ki.


      Change: ki 0.05 to 0.10. kp 2.4, kd 0.8, base_speed 1.2, sensor_weights, line_loss
      and all geometry stay as in iteration 6, so the race isolates the integral term.
      The integral should correct the small sustained lateral offset the robot carries
      through the alternating slalom bends, which the proportional and derivative
      terms are not removing.


      Expected result: slalom max_error below about 0.063 and line_loss_events at
      or below about 1.0. A slalom finish is possible but not expected yet. Oval and
      s-bend should stay at 1.0 finish rate, since ki 0.1 at this speed should not
      cause windup (the integral is limited to plus or minus 2).


      Decision rules for iteration 8: if the slalom still ends off track with max_error
      at or above 0.06 and ki 0.1 does not reduce it, return ki to 0.05 and keep kp
      2.6 with kd 0.9, the best-scoring controller so far (699.16). If the oval or
      s-bend finish rate drops below 0.95, return ki to 0.05. If the slalom max_error
      falls below 0.06 with any finishes, hold the controller and keep geometry fixed.


      Hypotheses: (a) the slalom failure includes a steady bias that integral action
      removes; (b) ki 0.1 does not raise oval or s-bend oscillation above about 0.3.
      Measurements requested: full set, read per track, with emphasis on slalom max_error,
      line_loss_events, completion and steering_oscillation.


      - [Open this output](iteration-7/entity0/versions/770046a9fb6f4cada00ebefd7c1a098e/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-b9a76170eefdb984/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-bc760128eb204250/payload.json)'
  - id: entityR1
    label: Approve kp 2.4, kd 0.8
    notes: 'Approved a single-lever test of kp 2.6 to 2.4 with kd returned to 0.8,
      following the iteration 5 decision rule. Iteration 5 (kd 0.9) raised slalom
      max_error from 0.0618 to 0.0634 with 0/20 finishes, so the corner gain is the
      untested lever; the risk to s-bend finishes is noted.


      ### Feedback


      Approved to race. The candidate is valid and changes two controller values from
      iteration 5 (score 699.16, the best raced so far): kd 0.9 to 0.8 and kp 2.6
      to 2.4. Geometry, base_speed 1.2, ki 0.05, sensor_weights and line_loss are
      unchanged. This follows the decision rule from iteration 5. Slalom max_error
      rose from 0.0618 (iteration 4, kd 0.8) to 0.0634 (iteration 5, kd 0.9) while
      the slalom still finished 0/20, so more derivative damping is not reducing the
      slalom failure. Iteration 4 (kp 2.6, kd 0.8) also had s-bend 19/20 against 20/20
      at kd 0.9, so the candidate may give back some s-bend and score. Its main purpose
      is to test whether lower proportional gain cuts slalom overshoot. Approving
      now gives the telemetry that the next critique needs, and five iterations remain.
      Read the result by track. If the oval or s-bend finish rate falls below 0.95,
      return kp to 2.6 and keep kd 0.8, since the oval and s-bend are where the score
      is earned. If the slalom max_error falls below 0.06 with any slalom finishes,
      hold these values and geometry fixed. If the slalom still ends off track with
      max_error at or above 0.06 and line_loss_events at or above 1.0, test ki 0.05
      to 0.1 next, with kp 2.4 and kd 0.8. Do not change geometry until the slalom
      finishes at least once.


      ### Requested changes


      - If the oval or s-bend finish rate drops below 0.95 (iteration 4 at kd 0.8
      and kp 2.6: s-bend 19/20; iteration 5 at kd 0.9 and kp 2.6: 20/20), set kp back
      to 2.6 and keep kd 0.8.

      - If the slalom still ends off track with max_error at or above 0.06 and line_loss_events
      at or above 1.0 (iteration 4: max_error 0.0618, line losses 1.0), test ki 0.05
      to 0.1 with kp 2.4, kd 0.8 and base_speed 1.2.

      - If the slalom max_error falls below 0.06 with any slalom finishes, hold kp
      2.4, kd 0.8, base_speed 1.2 and geometry fixed, and use the next race to confirm
      the score rather than change gains.


