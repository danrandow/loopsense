map:
  id: race-141-opt-eval
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Search-right line loss
    notes: 'Iteration 9 (704.85, best so far) with one change: line_loss ''last_direction''
      becomes ''search_right''. Slalom max_error stayed at or above 0.06 under every
      gain and speed setting tried (0.0618 to 0.0661), so the untested line-recovery
      lever is next.


      ### Rationale


      Evidence. Iteration 9 (base_speed 1.1, kp 2.6, kd 0.9, ki 0.05, x ±0.03 m, last_direction)
      scored 704.85, the best raced design so far. Oval finished 20/20 (mean 1.87
      s) and s-bend 20/20 (mean 2.25 s), so the speed margin to the 3 s limit holds.
      The slalom still ended 0/20 off track, and its max_error rose to 0.0661 from
      0.0618 at base_speed 1.2. Line-loss events rose to 1.35. Lower speed therefore
      did not clear the slalom limit. Its score gain came from the oval and s-bend,
      not from the slalom. Across iterations 3 to 9 the slalom max_error has stayed
      between 0.0618 and 0.0661 under every kp, kd, ki, x-coverage and speed setting
      tried. The Evaluator''s decision rule for this case says the controller levers
      are largely exhausted and the next structural test is line_loss ''search_right''.
      Slalom line-loss events have stayed near 1.0 to 1.35 throughout, so the way
      the robot re-acquires the line after a loss is the untested lever.


      Change. line_loss changes from ''last_direction'' to ''search_right'', and nothing
      else changes. Geometry stays at iteration 9 (x ±0.03 m at y 0.06, 16 mm footprint,
      mass 0.6, wheel_track 0.12, wheel_radius 0.03). Controller stays at base_speed
      1.1, kp 2.6, ki 0.05, kd 0.9, sensor_weights [-2,-1,0,1,2]. This is a single-variable
      test against iteration 9. ''search_right'' fixes the loss signal at +1, which
      steers the robot to its LEFT. The hypothesis is that a fixed sweep direction
      may recover the line on the slalom better than repeating the last signal, which
      may be the wrong side after an alternating bend.


      Expected result. Oval and s-bend stay near 20/20 because line losses there are
      rare (0.5 and 0.15 per run). The slalom line-loss count may fall or change pattern.
      A slalom finish is possible but not expected. Risk: the fixed left sweep could
      worsen s-bend or oval recovery, in which case the next step is to return to
      ''last_direction'' at base_speed 1.1.


      Decision rules for the next iteration. If oval or s-bend finish rate falls below
      0.95, or s-bend completion_time exceeds about 2.8 s, return line_loss to ''last_direction''.
      If the slalom still ends off track with max_error at or above 0.06, test ''search_left''
      with everything else unchanged, which is the other fixed-direction option. If
      any slalom run finishes, hold all values and confirm the score.


      Hypotheses. (a) The line-loss response, not the gains, sets slalom max_error.
      (b) ''search_right'' changes the slalom line-loss count compared with the 1.35
      seen in iteration 9. Measurements requested: full set, read per track, with
      emphasis on slalom line_loss_events, max_error, progress and completion, and
      on oval and s-bend completion_time.


      - [Open this output](iteration-10/entity0/versions/43ccfc07963141ba8b4b7990ae80d0b8/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-a0b6c7904185aced/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-2ac5751390779a9a/payload.json)'
  - id: entityR1
    label: 'Approve: speed 1.1 test'
    notes: 'Approved the iteration 5 layout with base_speed lowered from 1.2 to 1.1,
      the only lever not yet isolated against the best raced design (699.16). Slalom
      max_error has stayed 0.0618 to 0.0646 across iterations 3 to 8, and speed was
      the untested variable, so this is a clean low-risk read with timing margin under
      3 s.


      ### Feedback


      Approved to race. The candidate is valid and is a single-variable test against
      iteration 5, the best raced design (699.16). Geometry is the iteration 5 layout
      (x ±0.03 m at y 0.06, 16 mm footprint, mass 0.6, wheels unchanged). Only base_speed
      moves, from 1.2 to 1.1, with kp 2.6, kd 0.9, ki 0.05 and sensor_weights [-2,-1,0,1,2]
      held. Speed is the one lever not yet isolated. Iteration 3 to 4 cut speed and
      kp together and moved slalom max_error from 0.0646 to 0.0618, while kd and ki
      alone moved it little (iterations 5 to 7). Iteration 5 finished oval and s-bend
      20/20 at 1.2, and the timing margin to the 3 s limit is still comfortable at
      1.1. The main risk is a small score loss from longer completion times, not a
      finish failure. Approving now gives a clean read on speed and is the most useful
      use of the remaining runs. Read the next race by track. If oval or s-bend finish
      rate falls below 0.95, or completion_time exceeds about 2.8 s, return base_speed
      to 1.2. If the slalom still goes off track with max_error at or above 0.06 at
      1.1, the controller levers are largely exhausted, so the next structural test
      is line_loss ''search_right'' (or a 3-sensor layout). If any slalom run finishes,
      hold all values and confirm the score.


      ### Requested changes


      - If oval or s-bend finish rate drops below 0.95, or s-bend completion_time
      exceeds about 2.8 s, set base_speed back to 1.2 with kp 2.6, kd 0.9, ki 0.05
      (iteration 5: both tracks 20/20, s-bend mean 2.23 s).

      - If the slalom still ends off track with max_error at or above 0.06 at base_speed
      1.1, test line_loss ''search_right'' with everything else unchanged. Slalom
      line-loss events have stayed near 1.0 across iterations 3 to 8, and a different
      loss response is the untested structural lever.

      - If any slalom run finishes, hold geometry and controller fixed and use the
      next race to confirm the score rather than change gains (iteration 5 is the
      reference at 699.16).


      - [Open this output](iteration-9/entityR1/versions/81d0e3bdc881419393d8b25df7f8a29a/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/e27bfe519d1743b89d207456139c7d29/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-1e2b242a6f8da9b4/payload.json)'
