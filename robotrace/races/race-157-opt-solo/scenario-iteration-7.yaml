  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence: iteration 3 (score 600.4, best) is the only design where the oval
      and s-bend both work well: oval 20/20 at 1.68 s, s-bend 14/20. Its slalom still
      fails 20/20 at progress 0.23 with about 1.8 line-loss events. Iterations 4,
      5 and 6 each changed one or more variables from that baseline and none improved
      the score. Widening to ±0.04 m (iteration 6) cut the s-bend from 14/20 to 6/20
      and dropped the score to 517. Moving sensors to y=0.07 and raising kp to 2.6
      (iteration 4) collapsed the s-bend to 0/20. Lowering base_speed to 0.9 (iteration
      5) gave a similar slalom result (progress 0.25) and a weaker s-bend (12/20).
      So lateral reach and speed are not the slalom limit. Steering_oscillation on
      the s-bend is high (0.37) and rises with difficulty, which suggests the loop
      responds too slowly at sharp alternations and lacks damping.


      Change: revert to the iteration 3 geometry and controller exactly, and change
      only kd from 0.8 to 1.1. The derivative term is the one gain that acts on how
      fast the signal is changing, so a higher kd should damp the lag at left-right
      alternations without changing the steady gain that the oval relies on.


      Expected result: slalom progress rises from about 0.23 toward 0.3 or more, and
      slalom line-loss events fall below about 1.5. The s-bend should hold at 14/20
      or better, and the oval should stay near 1.7 s. If steering_oscillation rises
      above 0.45 on any track, kd is too high and should come back to about 0.9.


      Hypotheses for the next race: H1, the slalom failure is steering lag at sharp
      alternations, so more kd helps. H2, a small kd increase will not break the oval,
      because the oval has few sharp changes. H3, if the slalom is still stuck near
      0.25, the limit is controller authority or sensor resolution, and the next test
      should vary sensor_size (0.012) at the iteration 3 layout.


      Measurements wanted: slalom progress and line_loss_events, s-bend completion
      and off-track count, oval completion_time, and steering_oscillation and max_error
      on all tracks.


