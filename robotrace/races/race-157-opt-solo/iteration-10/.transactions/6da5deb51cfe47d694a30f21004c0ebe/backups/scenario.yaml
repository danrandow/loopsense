  - id: entity0
    label: kd 2.4 for slalom damping
    notes: 'Keeps the iteration 9 geometry and controller but raises kd from 1.8 to
      2.4 to push slalom progress further (0.47 to 0.67 across the last kd steps).
      Oval and s-bend stability held as kd rose, so the risk is limited to noise,
      which the observation request will check.


      ### Rationale


      Evidence from iteration 9 (score 736.5, best so far): the oval (20/20, 1.86
      s, max_error 0.010 m) and s-bend (20/20, steering_oscillation 0.29) both finish
      reliably. The slalom is still the bottleneck: 1/20 finishes, mean progress 0.67
      (up from 0.47 at kd 1.5), and about 1.4 line-loss events per run. Across the
      kd sweep on the slalom, progress went 0.23 (kd 0.8), 0.42 (kd 1.1), 0.47 (kd
      1.5), 0.67 (kd 1.8, with base_speed also cut to 0.95). Earlier geometry and
      speed changes (wider array, forward sensors, higher kp, lower speed alone) all
      hurt or did not help, so geometry stays fixed. Steering_oscillation has not
      risen with kd (oval 0.23, s-bend 0.29, both similar to iteration 8), so there
      is no sign yet that derivative gain is amplifying noise. Change: kd 1.8 to 2.4,
      with every other value held (geometry, kp 2.2, ki 0.15, base_speed 0.95, last_direction
      line loss). Hypothesis H1: slalom failure is still lag at sharp alternations,
      so further damping pushes slalom progress toward 0.8 or more and gives the first
      consistent slalom finishes. H2: the oval and s-bend stay stable, since their
      steering_oscillation has been flat across the kd increases. H3 (risk): at kd
      2.4 sensor noise is amplified and steering_oscillation rises above about 0.4
      on the s-bend, or the oval loses completions. If that happens, the next step
      is kd about 2.0, or the speed stays at 0.95 while sensor_size is tested at 0.012.
      Expected result: slalom progress 0.75 or more with line_loss_events below 1.0,
      s-bend 18/20 or better, oval completion_time about 1.9 s. Next measurements:
      slalom progress, completion and line_loss_events; s-bend completion and off-track
      count; steering_oscillation and max_error on all tracks; noise_robustness to
      see whether noise is becoming the limit.


