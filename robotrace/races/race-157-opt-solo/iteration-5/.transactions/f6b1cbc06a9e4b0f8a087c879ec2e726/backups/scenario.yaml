  entities:
  - id: entity0
    label: Revert geometry, speed
    notes: 'Reverts to the iteration 3 sensor layout and kp, which scored best at
      600, and lowers base_speed from 1.0 to 0.9 to reduce slalom and s-bend line
      loss. The iteration 4 change to a wider, forward array and higher kp scored
      worse (412), so it is dropped.


      ### Rationale


      Evidence: iteration 3 (score 600.4, best) used 7 sensors at y=0.05 m spanning
      ±0.03 m, kp 2.2, ki 0.15, kd 0.8, base_speed 1.0. It finished the oval 20/20
      and the s-bend 14/20, but the slalom still failed 20/20 at progress 0.23 with
      about 1.8 line-loss events. Iteration 4 changed three things at once: the span
      widened to ±0.04 m, the sensors moved to y=0.07 m, and kp rose to 2.6. The score
      fell to 412 and the s-bend dropped to 0/20 (progress 0.43), so that combined
      change made things worse. Iteration 2 vs 3 also showed speed matters a lot:
      base_speed 1.2 gave 5/20 on the s-bend, while 1.0 gave 14/20. Plan: revert geometry
      to the iteration 3 layout, which is the best known. Keep kp 2.2, ki 0.15, kd
      0.8, and change only base_speed from 1.0 to 0.9. Expectation: the s-bend finish
      rate holds at or above 14/20, slalom progress rises above 0.3 and line-loss
      events fall, and the oval still finishes with a time of about 1.85 to 1.9 s,
      which costs only about 3 points of time score. Hypotheses: H1, speed is still
      the main limit on sharp alternations, so a small speed cut helps the slalom;
      H2, if the slalom still fails at progress about 0.25, the limit is lateral reach,
      and the next step is a wider but unshifted array at y=0.05 tested alone; H3,
      kp 2.2 is near the stable limit, so the earlier kp rise was harmful. Next measurements:
      slalom progress and line_loss_events, s-bend completion and off-track count,
      completion_time on the oval, and steering_oscillation and max_error on all tracks.


      - [Open this output](iteration-5/entity0/versions/e3b03330df6643419d4a6ff880c78c1d/payload.json)

