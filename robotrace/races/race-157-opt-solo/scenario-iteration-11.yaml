  - id: entity0
    label: kd 2.8 final candidate
    notes: 'Keeps the iteration-10 geometry and controller and raises kd from 2.4
      to 2.8, continuing the slalom trend (mean progress 0.23 to 0.94 across the kd
      sweep). Oval and s-bend steering_oscillation stayed flat as kd rose, so the
      step is low-risk.


      ### Rationale


      Evidence from iteration 10 (score 896.7, best so far): the oval (20/20, 1.89
      s, max_error 0.006 m) and s-bend (20/20, steering_oscillation 0.22) both finish
      reliably. The slalom has improved to 15/20 finishes with mean progress 0.94
      and 0.35 line-loss events per run. Across the derivative sweep on the slalom,
      mean progress went 0.23 (kd 0.8), 0.42 (kd 1.1), 0.47 (kd 1.5), 0.67 (kd 1.8,
      base_speed 0.95), 0.94 (kd 2.4). Steering_oscillation has stayed flat as kd
      rose (oval 0.25, s-bend 0.22), so there is no sign yet that the derivative term
      is amplifying sensor noise. Geometry is fixed because every geometry change
      in iterations 4 to 6 hurt the score. Change: kd 2.4 to 2.8, with everything
      else held (geometry, kp 2.2, ki 0.15, base_speed 0.95, last_direction line loss).
      This is a single-variable step along the trend, which is the lowest-risk change
      for the final unseen-track race. Hypothesis H1: slalom failures are still lag
      at sharp alternations, so more damping lifts slalom finish rate toward 0.9 and
      cuts off-track exits. H2: oval and s-bend stay stable, since their steering_oscillation
      has not risen with kd. H3 (risk): at kd 2.8 noise amplification pushes steering_oscillation
      above about 0.4 on the s-bend or drops oval completions. The final race is unseen
      and cannot be followed up, so if the iteration-10 design is at least as robust,
      the risk is worth little; the gain on the development slalom is the main reason
      for the step. Expected result: slalom finish rate 0.85 or more, oval and s-bend
      20/20, score about 920 or more. Measurements wanted: completion and progress
      on the slalom, line_loss_events, steering_oscillation and max_error on all tracks,
      and noise_robustness to check whether noise is becoming the limit.


