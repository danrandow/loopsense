  - id: entity0
    label: kd 1.1 to 1.5 damping
    notes: 'Keeps the iteration-7 geometry and all other controller values, raising
      only kd from 1.1 to 1.5. Iteration 7 showed kd 0.8 to 1.1 lifted slalom progress
      from 0.23 to 0.42 and s-bend finishes from 14/20 to 18/20, so more derivative
      damping is the next test.


      ### Rationale


      Evidence from iteration 7 (score 673.1, best so far, up from 600.4): raising
      kd from 0.8 to 1.1 with the iteration-3 geometry gave a clear gain. The oval
      still finishes 20/20 at 1.81 s with max_error 0.016 m. The s-bend improved to
      18/20 finishes (from 14/20). The slalom progress rose from 0.23 to 0.42, the
      largest improvement on any track, though it still fails 20/20 with 1.8 line-loss
      events per run. Earlier geometry and speed changes (iterations 4-6) all hurt,
      so the derivative term is the lever that has helped. steering_oscillation on
      the s-bend rose to 0.35, but this is still acceptable and the oval''s control
      effort fell to 2.28, which suggests the extra damping is not adding noise. Change:
      keep the iteration-7 geometry and every other controller value, and raise kd
      from 1.1 to 1.5. Hypothesis H1: slalom failure is steering lag at sharp left-right
      alternations, so more derivative damping keeps raising slalom progress, with
      a reasonable chance of pushing it past 0.6. H2: the oval and s-bend stay stable,
      because their gentle curves change the signal slowly. H3 (risk): at kd 1.5 sensor
      noise is amplified, so steering_oscillation rises above about 0.45 on the s-bend
      and the oval loses completions. If that happens, the next step is kd about 1.3,
      or testing sensor_size 0.012 for the slalom. Expected result: slalom progress
      0.5 or more with line_loss_events below 1.2, s-bend at 18/20 or better, and
      oval time near 1.8 s. Next measurements: slalom progress and line_loss_events,
      s-bend completion and off-track count, steering_oscillation and max_error on
      all tracks, and noise_robustness to check whether noise is becoming the limit.


