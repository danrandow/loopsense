  entities:
  - id: entity0
    label: Wider sensors, more
    notes: 'Seven 16 mm sensors span +/-3 cm with kd raised to 0.5 and base speed
      lowered to 1.2, because all baseline runs left the line (max_error about 0.067
      m, 2 line-loss events each). The aim is to stop the line loss first, then raise
      speed toward the roughly 1.5 m/s needed to finish.


      ### Rationale


      Evidence: all 60 development trials ended off track (0 finishes) at progress
      0.09 to 0.19. rms_error was small (0.025 to 0.029 m), but max_error reached
      about 0.067 m, just past the 0.06 m off-track limit, and every run logged 2
      line-loss events. So the robot tracks the line well on average, then loses it
      during a transient (most likely a curve or a sensor dropout) and departs. The
      baseline''s five sensors span only +/-0.02 m, and the 12 mm footprints leave
      the outer sensors blind once the robot drifts about 1 cm. Speed (base_speed
      1.3) and the lack of damping on sharp bends are the other suspects. Changes:
      (1) widen the sensor array to seven sensors over +/-0.03 m at 0.01 m spacing,
      with 16 mm footprints so at least one sensor always sits on the 25 mm tape;
      (2) keep weights linear in x (scaled to +/-1) so kp keeps its meaning; (3) raise
      kd from 0.3 to 0.5 to damp the overshoot that causes the max_error peaks; (4)
      lower base_speed from 1.3 to 1.2 to reduce the lateral transients that push
      the robot past 6 cm; (5) reduce mass to 0.6 kg for quicker response, with a
      wider body (0.12 m) to keep the off-track allowance. Expected result: fewer
      line-loss events and max_error under 0.06, so runs reach progress well above
      0.5, though finishing in 3 s may still need a higher speed later. Hypotheses
      to check next: H1, wider sensor coverage removes the line-loss events; H2, kd
      0.5 cuts max_error on the s-bend; H3, the speed needed to finish is about 1.5
      m/s, which will need a higher base_speed once the robot stays on the line. Next
      measurements: line_loss_events, max_error, progress and completion_time, to
      separate sensing from speed effects.


