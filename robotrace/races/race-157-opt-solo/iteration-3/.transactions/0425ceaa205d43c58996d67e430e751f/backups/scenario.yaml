  entities:
  - id: entity0
    label: Slower base speed 1.0
    notes: 'Keeps the iteration 2 geometry and gains, and lowers base_speed from 1.2
      to 1.0 so the robot can hold the tape through the s-bend and slalom transitions.
      The oval still finishes at about 2 s, based on the 1.69 s finish and 20/20 completions
      at the previous speed.


      ### Rationale


      Evidence from iteration 2 (score 475.9, the best so far). The oval now finishes
      20/20 in 1.69 s with 0.15 line-loss events and max_error 0.040 m, so the controller
      works on gentle curves and the speed is sufficient there. The s-bend finishes
      5/20 (progress 0.67) and the slalom finishes 0/20 (progress 0.16). Both failing
      tracks end off track with about one line-loss event per run. The likely cause
      is that base_speed 1.2 is too fast for the sharp transitions, so the robot leaves
      the tape before the steering can correct. Geometry cannot fix this: the off-track
      limit is max(0.06, 0.0125 + body_width/4), which stays at 0.06 for any body
      width up to about 0.19 m. Changes: base_speed 1.2 to 1.0, with all geometry
      and the other gains (kp 2.2, ki 0.15, kd 0.8) held fixed so the effect is isolated.
      Expected result: the s-bend finish rate rises above 0.5 and slalom progress
      rises above 0.3. The oval still finishes at about 2.0 s, which costs roughly
      6 points of time score but gains completions worth 500 each. Hypotheses for
      the next race: H1, speed is the main cause of the s-bend and slalom departures;
      H2, if the slalom still fails early, steering authority at the sharp alternations
      is the limit and kp needs revisiting; H3, steering_oscillation stays near 0.2
      to 0.3 because of sensor quantisation, and kd is already adequate. Next measurements:
      completion and completion_time on the s-bend, progress and line_loss_events
      on the slalom, and max_error and steering_oscillation on all tracks.


