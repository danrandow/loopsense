  entities:
  - id: entity0
    label: Wider, forward sensors
    notes: 'Widens the sensor array to +/-0.04 m, moves it forward to y=0.07 m, and
      raises kp to 2.6 to offset the lower signal gain. Aimed at slalom line loss
      (1.8 events per run, 0/20 finishes) seen in iteration 3, which scored 600.4.


      ### Rationale


      Evidence from iteration 3 (score 600.4, best so far): the oval finishes 20/20
      in 1.68 s, with max_error 0.023 m and 0.05 line-loss events. The s-bend finishes
      14/20 (progress 0.92), and its 6 failures are off-track exits. The slalom still
      fails every run (0/20), ending at progress 0.23 with about 1.8 line-loss events
      per run. Slalom is now the bottleneck, and its failures are sensing-limited:
      the robot loses the tape during sharp left-right alternations, so the sum of
      readings drops below 0.05. The sensor array spans only +/-0.03 m, so a lateral
      excursion of about 4 to 5 cm leaves every sensor off the tape. The sensors also
      sit at y = 0.05 m, so the steering reacts late to the curve. Steering oscillation
      of about 0.25 to 0.37 suggests the loop is lagging rather than overshooting
      badly. The changes below address this. (1) Widen the array to +/-0.04 m (7 sensors,
      13.3 mm spacing) so the line stays visible at larger offsets. The weights stay
      proportional to x, scaled to +/-1 at the outer sensors. (2) Move the sensors
      forward to y = 0.07 m, which gives about 2 cm more lookahead and reduces the
      phase lag at alternations. (3) Scale kp from 2.2 to 2.6. Widening the span lowers
      the signal per metre of offset by about 25%, so kp is raised to keep the steering
      authority roughly constant, and the increase is kept modest to limit oscillation.
      base_speed stays at 1.0, kd 0.8, ki 0.15 and line_loss last_direction are unchanged,
      so the sensing and lookahead effects are the main variables. Expected result:
      slalom line-loss events fall from about 1.8 toward 0.5 or below, slalom progress
      rises above 0.4, and s-bend finishes stay at 14/20 or better. Oval time should
      stay under 2 s. Hypotheses for the next race: H1, slalom line loss is caused
      by lateral reach, so the wider array removes most loss events; H2, the forward
      sensors reduce the steering lag and cut steering_oscillation; H3, if oscillation
      rises above 0.4 on the slalom, kd or kp is too high for the new span. Next measurements:
      slalom progress and line_loss_events, s-bend completion and off-track count,
      and steering_oscillation and max_error on all tracks.


