  - id: entity0
    label: Initial balanced geometry
    notes: 'Proposed a symmetric 5-sensor layout with moderate sensor size and balanced
      body dimensions to maximize line detection and handling stability. Requested
      key performance metrics to evaluate tracking and control quality.


      ### Rationale


      Starting with a balanced and symmetric sensor layout to maximize line detection
      and steering precision. Using 5 sensors spaced evenly across the front of the
      robot, centered around the axle midpoint, to cover the tape width and some margin
      on each side. Sensor size set to 0.012 m (12 mm) to balance resolution and coverage.
      Wheel track set to 0.14 m for stability and maneuverability. Wheel radius at
      0.035 m to allow good speed and torque balance. Body width at 0.14 m to allow
      a reasonable off-track margin without excessive drag. Body length at 0.18 m
      to keep the robot compact but stable. Mass at 0.8 kg to balance inertia and
      responsiveness. Intent is to provide the integrator with a stable, well-sensed
      platform that can detect the line accurately and respond quickly to turns. Expect
      improved line tracking and fewer line loss events compared to minimal sensor
      setups. Hypotheses: 1) A symmetric 5-sensor array with moderate sensor size
      improves line detection and steering accuracy. 2) Moderate wheel track and radius
      balance speed and stability. 3) Moderate mass and body size improve handling
      without excessive inertia. Measurements requested: completion, progress, line_loss_events,
      rms_error, max_error, steering_oscillation, control_effort to evaluate tracking
      quality and control effort.


      - [Open this output](iteration-0/entity0/versions/44627387e3004f6ea99def369ebe20be/payload.json)'
