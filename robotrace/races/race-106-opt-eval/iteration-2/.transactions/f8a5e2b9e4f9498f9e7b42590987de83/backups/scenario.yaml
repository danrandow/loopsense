map:
  id: race-106-opt-eval
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Add integral (ki 0.5)
    notes: 'Keeps iteration 1 geometry and speed, and adds ki 0.5 to remove the steady
      drift from the motor mismatch that is holding max_error at about 0.061 on all
      tracks. Based on the iteration 1 race, where max_error stayed just above the
      0.06 limit even as speed and damping changed.


      ### Rationale


      Evidence from iteration 1''s race (60 trials, 0 finishes): progress rose to
      0.12 to 0.15, but max_error stayed at 0.061 to 0.0645, just past the 0.06 m
      off-track limit. Line loss occurred once on s-bend and slalom and not on oval.
      The error barely moved when base_speed, kp and kd changed (0.0614 in iteration
      0, 0.0609 to 0.0645 now), so the cause is probably not speed or damping. Steering_oscillation
      is low (0.08 to 0.14), so this is not jitter. The most likely cause is a steady
      drift: the fixed left/right motor mismatch, plus the start, produce a constant
      heading bias that a proportional-only controller can only offset with a steady
      error. Integral action should remove that bias. Change: controller.ki from 0.0
      to 0.5 (integral limited to +/-2, so the maximum integral contribution to turn
      is about 1). Everything else is held at iteration 1 values (base_speed 1.2,
      kp 1.5, kd 0.2, sensors at x = +/-0.05, last_direction) so the effect is isolated.
      Expected result: max_error falls below 0.06 on all three tracks and line_loss_events
      drop toward 0. Risk: integral windup on the tighter bends could cause overshoot,
      so I will watch s-bend and slalom max_error. Hypotheses: (a) the swing is a
      steady bias from the motor mismatch and ki removes it; (b) if max_error is still
      near 0.06 with ki 0.5, the error is a start transient, which would need a different
      test (e.g. a larger kd or a search direction on line loss). Next measurements:
      max_error, line_loss_events and steering_oscillation per track, and progress.
      If max_error is below 0.05 with progress above 0.5, the next step is to raise
      base_speed in steps of 0.2 (1.2 to 1.4) with ki kept at 0.5. completion_time
      is expected to stay near or above 3 s at this speed, so progress and max_error
      are the main signals.


      - [Open this output](iteration-2/entity0/versions/730ce0c1e7d84d07ad787ddfa4b15cac/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-c598137e4247b7f2/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-12669e8de129473f/payload.json)'
  - id: entityR1
    label: Approve slower, damped
    notes: 'Approved the candidate because it targets the iteration 0 off-track swing
      (max_error 0.061, one line loss per run on every track) with lower speed, more
      damping, lower kp and wider outer sensors. The race is needed for telemetry,
      and the approved build races unchanged.


      ### Feedback


      Iteration 0 is the only raced evidence. All 60 trials ended off_track with 0
      finishes, progress 0.04 to 0.115, max_error about 0.061 (just past the 0.06
      m limit), and exactly one line-loss event per run. The error was nearly identical
      on oval, s-bend and slalom, which points to a systematic early or start-up swing
      rather than a track-shape problem. Steering_oscillation was low (about 0.07),
      so jitter is not the cause. This candidate changes base_speed 1.6 to 1.2, kd
      0.05 to 0.2, kp 2.0 to 1.5, and moves the outer sensors to plus or minus 0.05
      m. Each change targets the iteration 0 failure. The candidate is valid and not
      obviously broken, and it is a sensible test of the overshoot hypothesis, so
      I am approving it to race for telemetry. Be aware that base_speed 1.2 gives
      a PWM fraction of 0.6, so finishing within 3.0 s (about 1.5 m/s average) is
      unlikely at this speed. The main score this race can show is progress and line-loss
      behaviour. Once it races, read progress, max_error and line_loss_events per
      track first. If max_error is now below 0.05 with progress above 0.5 but completion_time
      near 3 s, raise base_speed in steps of 0.2 while watching max_error. If the
      swing persists at the same magnitude on all tracks, suspect the start transient
      or the fixed motor mismatch, and test ki at 0.5 or a larger kd.


      ### Requested changes


      - If progress is above 0.5 and max_error is below 0.05 after this race, raise
      controller.base_speed in steps of 0.2 (1.2 to 1.4, then 1.6) and keep kp 1.5
      and kd 0.2 so the speed effect is isolated. Iteration 0 shows that base_speed
      1.6 with kp 2.0 and kd 0.05 left the line on every track.

      - If max_error stays near 0.06 with one line-loss event on all tracks, the swing
      is probably a start transient or the motor mismatch. Try controller.ki 0.5 (integral
      limited to +/-2) or raise controller.kd to 0.3, since iteration 0 showed the
      same error on all three tracks.

      - If line_loss_events is still one per run, keep the outer sensors at plus or
      minus 0.05 and try controller.line_loss set to search_left or search_right to
      match the side the robot drifts toward, since iteration 0 tracked a single one-sided
      swing.


      - [Open this output](iteration-1/entityR1/versions/256fcc4f83e2422fb61ef3d5c8a383df/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/75bdc59770d348f09e225079abbf5226/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-67d2affc254926ed/payload.json)'
