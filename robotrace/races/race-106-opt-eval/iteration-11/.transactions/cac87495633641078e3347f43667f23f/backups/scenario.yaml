overrides:
  entities:
  - id: entity0
    label: 'Final: iter 9 best design'
    notes: 'Reverts to the iteration 9 design (best raced, 432.15) with sensor x spread
      back to ±0.05, after the ±0.04 test scored 260.62 with lower oval finish and
      s-bend and slalom progress. No untested changes are added, since this final
      design is scored unseen.


      ### Rationale


      Final iteration, so the goal is the most reliable design to race on the unseen
      track, not a new experiment. The best raced design is iteration 9 (score 432.15):
      sensors at x = -0.05, -0.025, 0, 0.025, 0.05 with y = 0.07, sensor_size 0.012,
      kp 1.8, ki 0.5, kd 0.4, base_speed 1.2, last_direction. Iteration 9 finished
      the oval 20 of 20 at 1.88 s, with s-bend progress 0.68 and slalom progress 0.186.


      The Evaluator''s narrower-spread test (iteration 10, x = ±0.04) lost ground,
      scoring 260.62. Oval finish fell to 7 of 20, s-bend progress fell from 0.68
      to 0.53, and slalom progress fell from 0.186 to 0.182. Its requested fallback
      applies: slalom and s-bend both fell below iteration 9, so the spread returns
      to ±0.05. Iteration 4 (±0.07) and iteration 6 (sensor_size 0.016) also hurt,
      so neither is reintroduced.


      I considered untested tweaks such as kd 0.5 for s-bend oscillation (0.36) or
      kp 2.0. Neither has race evidence, and the unseen-track race is scored once
      with no later check, so I kept the proven design unchanged.


      Expected result: roughly the iteration 9 profile, with the oval completing reliably
      and s-bend and slalom progress near 0.68 and 0.19 on the development tracks.
      The unseen track may differ. Measurements requested are the standard set so
      the outcome can be read against iteration 9.


      - [Open this output](iteration-11/entity0/versions/18e1c5c2f4024cfbbbc893b933ffa15b/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-5f23cbcce7260bec/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-6f1638ba1021eb44/payload.json)'
  - id: entityR1
    label: Approve best design
    notes: 'Approves the unchanged iteration 9 design (score 432.15, best raced),
      which the evidence shows is the most reliable for the final unseen race. Narrower
      spread, larger footprint, and lower speed each lowered the score in earlier
      races, so no further changes are made.


      ### Feedback


      Approve. This is the final iteration, so the candidate is kept as the most reliable
      raced design. It matches iteration 9 (score 432.15, the best raced): sensors
      at x = -0.05, -0.025, 0, 0.025, 0.05 with y = 0.07, sensor_size 0.012, kp 1.8,
      ki 0.5, kd 0.4, base_speed 1.2, last_direction. Iteration 9 was the only design
      that combined a reliable oval finish with the best s-bend progress. Iteration
      10 (x spread ±0.04) lost oval finishes and tight-track progress, and iteration
      4 (±0.07) and iteration 6 (sensor_size 0.016) both hurt, so none of those are
      reintroduced. Untested tweaks (kd 0.5, kp 2.0) have no race evidence, and the
      unseen track is scored once with no later check, so changing them now is an
      unmeasured risk. The Optimizer should ship this design unchanged.


      ### Requested changes


      - Ship the iteration 9 design unchanged: controller.kp 1.8, kd 0.4, ki 0.5,
      base_speed 1.2, line_loss last_direction, sensor y 0.07, x -0.05 to 0.05, sensor_size
      0.012. Iteration 9 is the best raced score (432.15) and the only design finishing
      the oval 20 of 20 while raising s-bend progress to 0.68.

      - Do not narrow the x spread to ±0.04 or widen it to ±0.07, and do not change
      sensor_size to 0.016 or base_speed to 1.0. Iterations 4, 6, 8 and 10 each lowered
      the score against iteration 9.


      - [Open this output](iteration-11/entityR1/versions/8dec6516318048989fbb232d8b933c2b/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/18e1c5c2f4024cfbbbc893b933ffa15b/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-6f1638ba1021eb44/payload.json)'
