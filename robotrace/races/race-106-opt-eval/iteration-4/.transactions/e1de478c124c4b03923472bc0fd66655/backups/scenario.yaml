overrides:
  entities:
  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence from iteration 3 (kd 0.4, ki 0.5, base_speed 1.2, kp 1.5, sensors at
      x = ±0.05, score 342.03): the oval now finishes 16 of 20 runs with progress
      0.97 and max_error 0.043, down from about 0.061. That confirms derivative damping
      was the lever on the oval. The s-bend and slalom still end off track with progress
      0.28 and 0.19. Their line_loss_events are 0.55 and 1.0 per run, and max_error
      is about 0.062 to 0.064, so the robot loses the tape on tight bends and then
      drifts past the 0.06 m limit. Steering_oscillation is 0.20 to 0.28, which is
      acceptable and not the failure. ki has had no measurable effect in any iteration,
      so I keep it at 0.5 to isolate the geometry change. The remaining problem is
      sensor coverage: the outer sensors at ±0.05 lose the tape when the robot is
      tilted or offset on sharp bends. Change: widen the sensor array to x = -0.07,
      -0.035, 0, 0.035, 0.07 (outer sensors at ±0.07, within the ±0.08 limit). Every
      other field is unchanged, so the effect of the wider footprint is isolated.
      Expected result: fewer line-loss events on the s-bend and slalom (ideally below
      0.3 and below 0.5), progress above 0.4 on those tracks, and max_error below
      0.06. The oval should hold near 0.04 to 0.05 max_error. Risk: wider spacing
      gives the robot less precise centring on straights, which could raise oval oscillation,
      so I will watch oval steering_oscillation (currently 0.28). Hypotheses: (a)
      sensor spread, not controller gain, limits s-bend and slalom; (b) if line_loss
      stays at 1 per run with the wider array, the line is lost at the bend entry
      and the next test is sensor_size 0.016 or a sensor shift forward to y = 0.07.
      Next measurements: per-track progress, line_loss_events, max_error, steering_oscillation,
      and distance before the first off-track event.


      - [Open this output](iteration-4/entity0/versions/3b0544ab631244828ba5388f86d7f48a/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-a9467c1722c71b73/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-689a6be47994d647/payload.json)'
  - id: entityR1
    label: Approve wider sensor
    notes: 'Approved the single-field test of widening the outer sensors from ±0.05
      to ±0.07 on the best raced design (342.03, iteration 3). The s-bend and slalom
      line-loss and off-track evidence from that race supports trying spread before
      controller changes.


      ### Feedback


      Approved. This candidate changes one geometry field from iteration 3: the outer
      sensor x positions move from ±0.05 to ±0.07, with the inner sensors at ±0.035
      and 0. Controller, sensor_size, sensor y and line_loss are unchanged, so any
      effect comes from the wider footprint. Iteration 3 (kd 0.4, ki 0.5, base_speed
      1.2, kp 1.5, sensors at ±0.05, score 342.03) is the best raced design. Its oval
      finished 16 of 20 runs with max_error 0.043. Its s-bend and slalom both ended
      off track with progress 0.28 and 0.19, line_loss_events 0.55 and 1.0, and max_error
      about 0.062 to 0.064. Iterations 0 to 2 showed max_error fixed near 0.061 to
      0.065 across changes to kp, kd, ki and base_speed, so the controller is not
      the main limit on the tighter tracks. The sensor spread is the cheapest untested
      lever, and the new value is inside the ±0.08 limit. Because the candidate is
      valid and a clean single-variable test of the best design, approve it so the
      race returns per-track telemetry. Read the result in this order. (1) If s-bend
      and slalom line_loss_events fall and their progress rises above 0.4, keep the
      wider spread and next test sensor y 0.07 to add steering lead. (2) If line_loss
      stays at 1 per run on the slalom with the wider array, the loss happens at bend
      entry, so next test sensor_size 0.016 with the same positions. (3) If oval steering_oscillation
      rises well above 0.28 or the oval finish rate drops below 0.8, the wider spacing
      is hurting centring on straights, so return the outer sensors to ±0.06 as a
      compromise.


      ### Requested changes


      - If s-bend or slalom line_loss_events fall but max_error stays near 0.06, keep
      geometry.sensor_positions at ±0.07 and move the sensors forward by setting every
      y to 0.07, to give earlier steering lead on bend entry.

      - If slalom line_loss_events stay at 1 per run with the wider array, keep the
      ±0.07 spread and set geometry.sensor_size to 0.016 with the same positions,
      since iteration 3 showed the outer sensors losing the tape on sharp bends.

      - If oval steering_oscillation rises well above 0.28 or the oval finish rate
      drops below 0.8, reduce the outer sensor x values to ±0.06 as a compromise between
      bend coverage and straight-line centring.


      - [Open this output](iteration-4/entityR1/versions/6588b927bc4145bb958adf0f441122f4/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/3b0544ab631244828ba5388f86d7f48a/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-689a6be47994d647/payload.json)'
