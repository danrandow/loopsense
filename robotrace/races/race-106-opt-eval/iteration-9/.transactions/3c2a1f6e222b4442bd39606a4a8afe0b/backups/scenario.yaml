map:
  id: race-106-opt-eval
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Slower speed 1.0 test
    notes: 'Reverts line_loss to the iteration 5 baseline, since search_right gave
      identical scores in iteration 7, and lowers base_speed from 1.2 to 1.0 to test
      whether bend-entry overshoot limits the slalom. Iteration 5 geometry and gains
      are otherwise unchanged, so the speed effect is isolated.


      ### Rationale


      Evidence. Iteration 7 (search_right) returned exactly the iteration 5 scores
      on every track: score 417.2455, slalom progress 0.1859 and 1.0 line-loss events,
      oval 20/20 and s-bend 0.564. Changing the line-loss recovery direction therefore
      had no measurable effect. The slalom fails at the same point with the same single
      loss whichever recovery mode is used, so recovery direction is not the lever.
      Iteration 6 showed the larger 0.016 footprint hurt (oval finish 0.9, slalom
      0.12), so the footprint stays at 0.012. Iteration 4 showed the wider x spread
      (±0.07) hurt, and iteration 5 showed forward sensors (y 0.07) doubled s-bend
      progress (0.28 to 0.56), so the iteration 5 geometry is the baseline.


      Change. I revert controller.line_loss to last_direction, the iteration 5 baseline,
      since search_right was neutral and the identical numbers give no reason to keep
      it. I then change one controller field: base_speed from 1.2 to 1.0. The slalom
      loss happens at a fixed bend point with progress stuck near 0.19. That pattern
      fits a bend-entry overshoot, where the robot carries too much momentum off the
      tape and then drifts past 0.06 m. Slowing the robot should reduce the centrifugal
      drift and give the kd 0.4 damping more time to act. The oval finished at 1.88
      s with the 3.0 s limit, so a lower speed still leaves time margin. kp, ki, kd
      and the geometry are unchanged, so the speed effect is isolated.


      Expected result. Slalom progress rises above 0.22 with line_loss_events at or
      near 1, and s-bend progress holds near 0.5 or better. The oval still finishes,
      though with a longer completion time. Risk: a slower robot might lose the tape
      on straights or have lower progress through the stall window. If slalom progress
      is unchanged or lower, the next test is kp 1.8 at base_speed 1.2 to check whether
      turn authority is limiting. If the oval finish falls below 0.8, return to base_speed
      1.2.


      Hypotheses. (a) The slalom loss is a speed-limited overshoot at the first sharp
      bend. (b) Lower speed improves the slalom without breaking the oval. Measurements
      wanted: per-track progress, finish rate, line_loss_events, max_error, steering_oscillation,
      and completion_time to confirm the oval margin.


      - [Open this output](iteration-8/entity0/versions/10aace848c61498b9480c43d684d020c/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-38c3b72aff8a9ab1/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-0d00aef51b23dbb1/payload.json)'
  - id: entityR1
    label: 'Approve: slower base'
    notes: 'Approves the iteration 5 baseline with base_speed cut from 1.2 to 1.0
      to test whether bend-entry overshoot limits the slalom. Evidence: iteration
      5 (417.25) finished the oval reliably, iteration 7 showed search_right changed
      nothing, and iteration 3 to 7 slalom always lost the line once at progress about
      0.19.


      ### Feedback


      Written before this candidate races. The candidate is the iteration 5 baseline
      (best raced, 417.25: sensors at x = -0.05 to 0.05 and y = 0.07, sensor_size
      0.012, kp 1.5, ki 0.5, kd 0.4, last_direction) with one controller change, base_speed
      1.2 to 1.0. The line_loss field is already last_direction, so the search_right
      test from iteration 7 is correctly reverted. Iteration 7 returned identical
      numbers to iteration 5, so the recovery-mode change had no measurable effect
      and is not a lever.


      What the evidence supports: iterations 0 to 2 showed max_error near 0.061 whatever
      base_speed, kp or ki was, but iteration 3 showed kd 0.4 cut oval max_error to
      0.043 and lifted oval finish to 0.8. Iteration 5 showed forward sensors (y 0.07)
      doubled s-bend progress (0.28 to 0.56). Iterations 4 and 6 showed the wider
      x spread (±0.07) and the larger footprint (0.016) both hurt. Slalom has stuck
      at 1 line-loss event per run with progress near 0.19 across iterations 3 to
      7. The stated hypothesis, that the slalom loss is a speed-limited overshoot
      at bend entry, is plausible and is a clean single-variable test. The oval finished
      in 1.88 s at base_speed 1.2, so a slower run should still finish inside the
      3.0 s limit, but it will lose some time score. The candidate is valid and not
      obviously broken, and the test is cheap, so I approve it to race for telemetry.


      What to do next depends on the race. If slalom progress rises above 0.2 and
      the oval still finishes at 1.0, keep base_speed 1.0 and step the speed back
      up cautiously, since the gain shows speed was the limit. If slalom progress
      is unchanged or lower, speed is not the limit: keep base_speed 1.2 and test
      kp 1.8 to check whether turn authority is limiting. If the oval finish falls
      below 0.8, return to base_speed 1.2 and keep the iteration 5 baseline.


      ### Requested changes


      - If slalom progress rises above 0.2 with base_speed 1.0 and the oval finish
      stays at 1.0, keep base_speed 1.0 and try base_speed 1.1 to find the speed that
      balances slalom progress against oval completion time, with all other fields
      held at iteration 5 values.

      - If slalom progress is unchanged or lower at base_speed 1.0, return base_speed
      to 1.2 and test controller.kp 1.8 alone, since iterations 0 to 2 showed kp and
      speed barely moved max_error and turn authority may be the limit on the slalom.

      - If the oval finish falls below 0.8 or oval completion time rises above about
      2.5 s at base_speed 1.0, revert to base_speed 1.2 and keep the iteration 5 design
      as the baseline, since iteration 5 showed that design finishes the oval reliably.


