overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'A conservative first candidate: five 12 mm sensors at 2 cm spacing, antisymmetric
      weights, kp 2.0, kd 0.05, base speed 1.6, last-direction line recovery. No race
      data exists yet, so the values are mid-range and chosen to finish the course
      and expose oscillation and speed limits.


      ### Rationale


      Iteration 0 has no race data or evaluator feedback, so this is a conservative
      baseline meant to finish the course and produce telemetry. Geometry: five sensors
      spaced 2 cm apart across the line (x = -0.04 to +0.04 m) and 5 cm ahead of the
      axle, so the robot sees the line early enough to steer. Sensor size 12 mm is
      about half the 25 mm tape width, giving a clear, graded response. The 120 mm
      wheel track, 30 mm wheel radius, 120 mm body width and 0.8 kg mass are mid-range
      values that keep the off-track limit at 0.06 m and the yaw inertia moderate.
      Controller: weights are antisymmetric (-1.5 to +1.5), so the signal is signed
      and centred on zero. kp = 2.0 gives a turn of up to about 3 units (about 1000
      PWM difference at full signal), which is firm enough to follow bends without
      a large integral term. ki = 0 avoids windup on the bends. kd = 0.05 adds mild
      damping against overshoot. base_speed = 1.6 (PWM fraction 0.8) is chosen to
      target roughly 1.5 m/s average while leaving room for steering. line_loss =
      last_direction, so the robot turns back toward the side it last saw the line.
      Expected result: the robot completes the oval and s-bend with few line-loss
      events. I expect the slalom to be the hardest, with the most oscillation and
      the most risk of line loss. Hypotheses to test: (1) kp = 2 is near the oscillation
      limit, so steering_oscillation will rise if kd is too low; (2) base_speed 1.6
      can reach the 3 s time limit; (3) the sensor spacing is adequate for the tightest
      bend. Next measurements: completion_time and progress to check speed; rms_error
      and max_error to check tracking; steering_oscillation to check damping; line_loss_events
      to check sensor coverage on the slalom.


      - [Open this output](iteration-0/entity0/versions/4baca33ea2f04654ab9bb41e8623df8d/payload.json)'
  actions:
  - id: action0
