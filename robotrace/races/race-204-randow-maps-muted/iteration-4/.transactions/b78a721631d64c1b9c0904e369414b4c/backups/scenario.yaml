  id: race-204-randow-maps-muted
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Scores so far: iteration 0 = 52.3, iteration 1 = 114.4 (best), iteration 2 =
      65.7, iteration 3 = 102.8. Every run in every iteration has ended off track,
      with 0 finishes. The limit is the off-track distance (max(0.06, 0.0125 + body_width/4)).
      Even at the maximum body_width of 0.18 m, that limit is 0.0575 m, so the 0.06
      m floor governs and body width cannot buy tolerance. Max error sits at 0.061
      to 0.066 m in every iteration while RMS error stays at 0.023 to 0.031 m. The
      robot tracks well until a single excursion takes it over the edge.


      What the sensor tests showed: iteration 2 (7 sensors, 16 mm footprint) cut oval
      progress from 0.47 to 0.23, and iteration 3 (5 sensors, 8 mm footprint) gave
      0.41 with slightly worse score than iteration 1. The 12 mm, 5-sensor array of
      iteration 1 is the best sensor configuration tested. Neither a larger nor a
      smaller footprint improved on it, so the sensor layout is close to its useful
      optimum and further sensor changes are unlikely to fix the excursions.


      What the drivetrain change showed: the largest gain (52 to 114) came in iteration
      1, when wheel_radius rose from 0.03 to 0.035, wheel_track narrowed to 0.10,
      mass fell to 0.6 kg and body_length fell to 0.14 m. Oval progress rose from
      0.14 to 0.47. That points at speed and yaw response as the lever. Speed matters
      because the robot must cover the course in under 3 s, and with the current base
      speed it is still far from finishing. Lower yaw inertia (mass times length squared
      plus width squared, over 12) should let the robot correct faster after an excursion.


      Decision: revert the sensor array to the iteration-1 layout (5 sensors at x
      = -0.05 to +0.05 with 0.025 m spacing, y = 0.03 m, 12 mm footprint), which is
      the best measured. Push the drivetrain further in the same direction: wheel_radius
      0.035 to 0.04 m for more ground speed per PWM, mass 0.6 to 0.5 kg and body_length
      0.14 to 0.12 m to cut yaw inertia further. I keep wheel_track at 0.10 m because
      it is already a good turn-authority setting and the minimum of 0.08 m would
      risk oscillation. Expected result: oval progress above 0.5, a lower or equal
      max_error, and a shorter time to reach the excursion point. Risk: the faster
      and lighter robot may oscillate more (steering_oscillation above 0.28), or the
      higher speed may push it off track sooner on tight bends.


      - [Open this output](iteration-4/entity0/versions/904231db8d56418697b9b76313aed2c1/payload.json)

      - Based on: [entityR2A](iteration-4/entityR2A/versions/carried-956fb3b1514d187a/payload.json)'
  - id: entity1
    label: Lighter, faster robot
    notes: 'Iteration-1 sensor array with wheel_radius 0.04, mass 0.5 and body_length
      0.12, plus base_speed 1.8 and kd 0.35 for damping. Based on iteration 1 (best,
      114.4), where the drivetrain was the only large gain.


      ### Rationale


      Iteration 1 is the best race so far (114.4). Its only large gain came from the
      drivetrain (oval progress 0.14 to 0.47), while every sensor change (iterations
      2 and 3) either cut progress or gave no gain. Every run ends off track with
      max_error at 0.061 to 0.066 m, just above the 0.06 m floor, and rms_error stays
      at 0.026 to 0.031 m, so the robot tracks well until a single bend excursion.
      I therefore keep the iteration-1 five-sensor layout (x = -0.05 to +0.05 at 0.025
      m spacing, y = 0.03 m, 12 mm footprint) and push the drivetrain as the Builder
      asked: wheel_radius 0.04 m, mass 0.5 kg, body_length 0.12 m, body_width 0.10
      m, wheel_track 0.10 m. Lower mass and length reduce yaw inertia, and the larger
      wheel raises ground speed. Because the lighter, faster robot will respond more
      sharply, I raise kd from 0.30 to 0.35 for damping and keep kp at 2.5 and ki
      at 0 to avoid integral windup on bends. I raise base_speed from 1.5 to 1.8 rather
      than to the maximum of 2.0, to gain speed while limiting the risk of an extra
      excursion on tight bends. The sensor weights stay antisymmetric [-2, -1, 0,
      1, 2] and line_loss stays last_direction. Expected result: oval progress above
      0.5 and max_error at or below 0.06 m. The main risk is steering_oscillation
      rising above about 0.3, or the higher speed causing an earlier off-track event
      on tight bends.


      - [Open this output](iteration-4/entity1/versions/5acd29324c264dbeb9c152ca8f419ebe/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/904231db8d56418697b9b76313aed2c1/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-956fb3b1514d187a/payload.json)'
  - id: entityR1
    label: Track-width and mass
    notes: 'Feedback is written before the race and gives two conditional geometry
      changes (wheel_track 0.12 if oscillation rises, mass 0.6 if overshoot persists)
      tied to iteration 1 and iteration 0 evidence. It also keeps the 12 mm five-sensor
      layout, which iterations 2 and 3 showed to be best.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Evidence
      from iteration 1 (best, 114.4): oval progress 0.47, max_error 0.061 to 0.066
      m, rms_error 0.026 to 0.031 m, and oval steering_oscillation 0.28. Iterations
      2 and 3 showed that sensor changes did not help: widening to seven sensors with
      a 16 mm footprint cut oval progress to 0.23 (iteration 2), and an 8 mm footprint
      gave 0.41 (iteration 3). The Integrator therefore kept the iteration-1 array
      and made these compensations for your drivetrain: kd was raised to 0.35 to damp
      the lighter, shorter robot, kp was held at 2.5 to avoid over-steering the larger
      wheel, and base_speed was set to 1.8 rather than 2.0, to limit excursions on
      tight bends. Change the next design by what the race shows. If oval progress
      is above 0.5 and max_error is at or below 0.06 m, keep the geometry and test
      the speed limit through the controller. If steering_oscillation is above about
      0.3 while rms_error is still low, the drivetrain is too twitchy, so raise wheel_track
      toward 0.12 m to reduce yaw response. If max_error is still at or above 0.06
      m with low oscillation, the robot is still overshooting bends, so raise mass
      back toward 0.6 kg to add yaw damping.


      ### Requested changes


      - If steering_oscillation rises above about 0.3 while rms_error stays below
      0.03 m, set wheel_track to 0.12 m (from 0.10 m). Iteration 0 with a 0.12 m track
      gave lower oval oscillation (0.085 vs 0.28 in iteration 1), so this trades some
      turn authority for damping.

      - If max_error stays at or above 0.06 m on the oval or s-bend with steering_oscillation
      below 0.3, set mass to 0.6 kg (from 0.5 kg). Iteration 1 showed max_error of
      0.064 to 0.066 m with small rms_error, so the excursion is a bend overshoot
      that some extra yaw inertia should damp.

      - Keep sensor_size at 0.012 m and the five-sensor spread at x = -0.05 to +0.05
      m. Iterations 2 and 3 showed that the 16 mm footprint and seven-sensor array
      cut oval progress to 0.23, and the 8 mm footprint gave 0.41, so the 12 mm layout
      remains the best measured configuration.


      - [Open this output](iteration-4/entityR1/versions/5acd29324c264dbeb9c152ca8f419ebe/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/904231db8d56418697b9b76313aed2c1/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-956fb3b1514d187a/payload.json)'
