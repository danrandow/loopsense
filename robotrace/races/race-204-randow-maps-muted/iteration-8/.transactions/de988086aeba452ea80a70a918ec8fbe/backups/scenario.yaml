  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Narrower track 0.09 m
    notes: 'Single-variable test of wheel_track from 0.10 to 0.09 m on the iteration-1
      design, the best measured. Iteration 7 showed that widening to 0.11 m lowered
      oscillation but cost oval and s-bend progress, so narrowing should recover progress.
      Evidence: the iteration 1 and iteration 7 race results.


      ### Rationale


      Scores so far are 52.3, 114.4 (iteration 1, best), 65.7, 102.8, 110.2, 91.8,
      109.9 and 107.6. Every run in every iteration ended off track with zero finishes.
      Max error sits at 0.061 to 0.068 m, just above the 0.06 m off-track floor, while
      RMS error stays at 0.023 to 0.031 m. The robot tracks well until a single excursion
      takes it over the edge.


      Iteration 7 isolated wheel_track by widening it from 0.10 to 0.11 m against
      the iteration-1 design. The result was mixed. Oval oscillation fell from 0.282
      to 0.259 and line-loss events fell from 0.30 to 0.25. But oval progress fell
      from 0.471 to 0.416, s-bend progress from 0.256 to 0.236, and the total score
      dropped by 6.8. So a wider track trades turn authority for damping, and on balance
      it costs progress. This suggests the optimum lies at or below 0.10 m rather
      than above it.


      The sensor lead has a peak near 0.03 m (0.02 m gave 91.8, 0.03 m gave 114.4,
      0.04 m gave 109.9). The sensor footprint and spread were tested only in combination,
      and neither beat the 5-sensor, 12 mm layout. Body width cannot help, because
      the off-track floor of 0.06 m governs across the allowed range.


      Decision: keep the iteration-1 design and change only wheel_track, narrowing
      it from 0.10 to 0.09 m. This moves in the direction that iteration 7 implies
      should raise progress, since the wider track cost progress. The cost is that
      yaw rate per wheel differential rises, so oscillation may increase above the
      iteration-1 level of about 0.28. Expected result: oval progress at or above
      0.47 and s-bend progress at or above 0.26. Max error may stay near 0.06 m, because
      it is the controller''s response to excursions that limits the run. Risk: oscillation
      and max error rise, so the robot leaves the track sooner.


      - [Open this output](iteration-8/entity0/versions/1092fe89149b4bc09406e26f9cf35a28/payload.json)

      - Based on: [entityR2A](iteration-8/entityR2A/versions/carried-308391d2cd5173b8/payload.json)'
  - id: entity1
    label: Complete Robot Package
    notes: 'Complete Robot Package. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Evidence: iteration 1 (wheel_track 0.10, lead 0.03 m, kp 2.5, kd 0.30) is the
      best measured design at 114.4, with oval progress 0.47 and oval steering_oscillation
      0.28. Every run ends off track with max_error 0.061 to 0.068 m, just above the
      0.06 m floor, while rms_error stays at 0.023 to 0.031 m. Sensor changes (iterations
      2, 3, 5, 6) did not beat iteration 1: the 0.02 m lead gave 91.8 with s-bend
      progress 0.11, and the 0.04 m lead gave 109.9 with s-bend progress 0.246 against
      0.256 at 0.03 m. Iteration 4 showed that a faster, lighter drivetrain raises
      oscillation to 0.33 without gaining progress. The wheel_track lever has not
      been isolated. Iteration 7 changes only wheel_track, from 0.10 to 0.11 m, which
      lowers yaw rate per wheel differential by about 9 percent. Decision: keep the
      iteration-1 controller exactly (base_speed 1.5, kp 2.5, ki 0, kd 0.30, weights
      [-2,-1,0,1,2], last_direction). I considered raising kp to 2.75 to hold the
      effective gain constant, but that would confound the single-variable test the
      Builder asked for, so I leave it unchanged and let the race show whether the
      lower effective gain damps the oscillation. Expected: oscillation below 0.28,
      max_error near or below 0.06 m, oval progress near 0.47. Risk: lower turn authority
      may lose progress on the slalom and tightest bends.


      - [Open this output](iteration-7/entity1/versions/86f97ab3949546ae9271bbf6c6a9a1b9/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/4b363577893e4a99b2d33e2cee7a2c57/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-a28b6e2cde0b9ed4/payload.json)'
  - id: entityR1
    label: Integration Feedback
    notes: 'Integration Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Evidence
      from earlier races: iteration 1 (best, 114.4) had oval progress 0.47, oval steering_oscillation
      0.28 and max_error 0.061 to 0.066 m. Iteration 4 (lighter, faster drivetrain)
      raised oscillation to 0.33 without a progress gain, so extra responsiveness
      is not helping. Iterations 5 and 6 showed the sensor lead is near its optimum
      at 0.03 m: 0.02 m dropped s-bend progress to 0.11, and 0.04 m gave 109.9 with
      s-bend progress 0.246 against 0.256 at 0.03 m. The sensor array and footprint
      should stay at the iteration-1 layout. For this candidate the Integrator kept
      the iteration-1 controller unchanged (kp 2.5, kd 0.30, base_speed 1.5, last_direction),
      so the only variable is wheel_track. Integration point: a wider track lowers
      yaw rate per wheel differential by about 9 percent, so the controller sees a
      softer turn response with the same gains. Change the next design by what the
      race shows. If steering_oscillation falls below about 0.28 while oval progress
      holds at or above 0.47 and max_error is at or below 0.06 m, keep the wider track
      and try mass 0.7 kg for bend damping. If oscillation falls but oval progress
      drops below about 0.44, the track has gone too far, so return to 0.10 m or try
      0.105 m. If oscillation is unchanged or rises, the wheel track is not the limit,
      and mass or the drivetrain must change instead.


      ### Requested changes


      - If steering_oscillation falls below 0.28 on the oval while progress holds
      at or above 0.47 but max_error stays at or above 0.06 m, set mass to 0.7 kg
      (from 0.6). Iteration 1 showed max_error of 0.064 to 0.066 m with small rms_error,
      so the excursion looks like bend overshoot that extra yaw inertia should damp.

      - If oval progress falls below 0.44 with lower oscillation, set wheel_track
      to 0.105 m (between 0.10 and 0.11). Iteration 1 at 0.10 m gave oval progress
      0.47, so a smaller step should keep most of that progress while reducing oscillation.

      - Keep sensor y at 0.03 m and the five-sensor 12 mm layout. Iteration 5 (0.02
      m lead) gave 91.8 and iteration 6 (0.04 m lead) gave 109.9, both below iteration
      1 (114.4).


      - [Open this output](iteration-7/entityR1/versions/86f97ab3949546ae9271bbf6c6a9a1b9/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/4b363577893e4a99b2d33e2cee7a2c57/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-a28b6e2cde0b9ed4/payload.json)'
