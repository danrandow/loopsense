map:
  id: race-204-randow-maps-muted
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Wheel track 0.11 test
    notes: 'Single-variable test: iteration 1''s best design with wheel_track widened
      from 0.10 to 0.11 m, aiming to damp the oscillation (0.28) that drives off-track
      excursions. The sensor lead is held at 0.03 m, which the 0.02/0.03/0.04 m sweep
      showed to be the peak.


      ### Rationale


      Scores so far: iteration 0 = 52.3, iteration 1 = 114.4 (best), iteration 2 =
      65.7, iteration 3 = 102.8, iteration 4 = 110.2, iteration 5 = 91.8, iteration
      6 = 109.9. Every run has ended off track with zero finishes. Max error sits
      at 0.061 to 0.068 m against the 0.06 m floor of the off-track limit, while RMS
      error stays at 0.023 to 0.031 m. The robot tracks well until a single excursion
      takes it over the edge.


      The sensor lead now has three points with everything else equal to iteration
      1: 0.02 m scored 91.8, 0.03 m scored 114.4, and 0.04 m scored 109.9. The peak
      lies near 0.03 m, so further lead tuning is unlikely to give a large gain. The
      sensor footprint and spread were tested only in combination with other changes
      (iterations 2 and 3), and the footprint results were mixed. Body width cannot
      help, since the limit is max(0.06, 0.0125 + body_width/4) and the floor governs.


      The drivetrain has only been tested as a combined move. Iteration 1 (radius
      0.035, track 0.10) gave the big gain, and iteration 4 (radius 0.04, mass 0.5,
      length 0.12) overshot, with oscillation rising to 0.33. The wheel_track lever
      has never been isolated. Iteration 1 oscillation rose to 0.28 on the oval, which
      points to a yaw response that is too sharp. A wider track gives less yaw rate
      per unit wheel differential, so it should damp that overshoot.


      Decision: return to the iteration-1 design and change only wheel_track, from
      0.10 to 0.11 m. Everything else, including the 0.03 m lead, stays fixed. Expected
      result: steering_oscillation falls below 0.28, max_error moves toward or below
      0.06 m, and progress holds near 0.47 on the oval. Risk: the lower turn authority
      may lose progress on the slalom and tightest bends.


      - [Open this output](iteration-7/entity0/versions/4b363577893e4a99b2d33e2cee7a2c57/payload.json)

      - Based on: [entityR2A](iteration-7/entityR2A/versions/carried-a28b6e2cde0b9ed4/payload.json)'
  - id: entity1
    label: Lead 0.04 m test package
    notes: 'Iteration-1 robot with the sensor row moved from y 0.03 m to 0.04 m, controller
      unchanged so the lead is the only variable. Iteration 5 (lead 0.02 m) scored
      91.8 against 114.4 for lead 0.03 m, which suggests more look-ahead helps on
      bends.


      ### Rationale


      Iteration 1 (sensor lead 0.03 m, 5 sensors at 0.025 m spacing, 12 mm footprint,
      wheel_track 0.10, wheel_radius 0.035, mass 0.6, body 0.14 x 0.10, kp 2.5, kd
      0.30, base_speed 1.5) is the best measured design at 114.4. Every run in every
      iteration ended off track with zero finishes. Max error sits at 0.061 to 0.068
      m, just above the 0.06 m floor, while RMS error stays at 0.023 to 0.031 m, so
      the robot tracks well until a single bend excursion. The lead is the one geometry
      variable I have only partly isolated. Iteration 5 moved it to 0.02 m, with everything
      else as in iteration 1, and the result was worse: score 91.8, s-bend progress
      0.11 (against 0.26), oval progress 0.44 (against 0.47), and oscillation down
      to 0.24. That points to look-ahead being valuable on bends, so I test the other
      side of the lead at 0.04 m. The geometry follows entity0 exactly: the iteration-1
      layout with the sensor row at y = 0.04 m. The controller is iteration 1 unchanged,
      including the same kp, kd, base_speed and sensor weights. Holding the controller
      fixed keeps the lead as the only variable, so any change in progress, max_error
      or oscillation can be attributed to it. Expected result (not measured): s-bend
      progress above 0.26, oval progress at or above 0.47, and max_error at or below
      about 0.06 m. Risk: the longer look-ahead may lag on the tightest bends, raising
      oscillation and line-loss events on the slalom.


      - [Open this output](iteration-6/entity1/versions/4195a0952cdd44a4ab27af95d6243763/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/85d5345ccc38475391188ba4a00b9fe6/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-19ed77b5fc029d9d/payload.json)'
  - id: entityR1
    label: Lead 0.04 m integration
    notes: 'Feedback written before the race: it cites iteration 1 as the best design
      and iteration 5''s shorter-lead drop, then sets out conditional changes (mass
      0.55 kg if progress rises, wheel_track 0.11 m if oscillation or line loss rises).
      No outcome is claimed for this candidate.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Evidence:
      iteration 1 (best, 114.4) had oval progress 0.47, max_error 0.061 to 0.066 m
      and oval steering oscillation 0.28. Iteration 5 moved the lead to 0.02 m and
      scored 91.8, with s-bend progress falling to 0.11 and oscillation falling to
      0.24. That suggests a shorter lead loses look-ahead on bends, so this candidate
      tests a longer lead of 0.04 m. The Integrator kept the iteration-1 controller
      (kp 2.5, kd 0.30, ki 0, base_speed 1.5, last_direction, weights [-2,-1,0,1,2]),
      so the only change in the race is the sensor row moving to y = 0.04 m. Integration
      point: the sensors now see the line about 1 cm earlier, so the controller reacts
      earlier and may overshoot if the lead is too long for the bend rate. Change
      the next design by what the race shows. If s-bend progress rises above 0.26
      and oval progress holds at or above 0.47, with max_error at or below about 0.06
      m, keep the longer lead and refine it toward 0.045 m or try mass 0.55 kg for
      damping. If steering_oscillation rises above about 0.35 or line-loss events
      increase on the slalom, the longer lead is lagging, so return the sensors to
      y 0.03 m and try wheel_track 0.11 m for damping. If progress falls on both tracks
      with no gain in max_error, the lead optimum is near 0.03 m, so keep 0.03 m and
      move to the drivetrain levers.


      ### Requested changes


      - If s-bend progress is above 0.26 and oval progress is at or above 0.47 with
      max_error at or below 0.06 m, keep sensor y at 0.04 m and set mass to 0.55 kg
      (from 0.6). Iteration 4 showed that a lighter body raises oscillation (0.33),
      so take only a small step.

      - If steering_oscillation rises above about 0.35 or slalom line_loss_events
      rise above the iteration-1 level of 0.3, return sensor y to 0.03 m and set wheel_track
      to 0.11 m (from 0.10). Iteration 0 with a 0.12 m track gave lower oval oscillation
      (0.085), so this trades some turn authority for damping.

      - If max_error does not fall below about 0.065 m and progress drops on both
      oval and s-bend, keep sensor y at 0.03 m and do not move the lead again. Iteration
      5 (0.02 m) showed that shortening the lead hurts progress, and this test will
      show whether lengthening it helps.


      - [Open this output](iteration-6/entityR1/versions/4195a0952cdd44a4ab27af95d6243763/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/85d5345ccc38475391188ba4a00b9fe6/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-19ed77b5fc029d9d/payload.json)'
