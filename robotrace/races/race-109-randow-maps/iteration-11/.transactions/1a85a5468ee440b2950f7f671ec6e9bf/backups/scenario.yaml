  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: Mass 0.40 kg test
    notes: 'Keeps the iteration 10 row and wheel track (score 556.7) and cuts mass
      from 0.45 to 0.40 kg, the contract minimum. Follows the Integrator''s rule:
      the oval held at 1.00 and s-bend oscillation was 0.36, under the 0.38 threshold,
      with s-bend max_error at 0.050 m.


      ### Rationale


      Iteration 10 (mass 0.45 kg, five sensors at x = ±0.04 m, y = 0.06 m, 12 mm footprints,
      wheel_track 0.095 m) is the best design so far at 556.7, up from 465.8 at mass
      0.6 kg. Its oval finish was 1.00 with max_error 0.021 m, and its s-bend finish
      rose to 0.55 with max_error 0.050 m, well under the 0.06 m off-track limit.
      Its s-bend steering oscillation was 0.36, under the 0.38 threshold I set for
      continuing the mass cut. The lighter body is the only change that has helped
      since iteration 5, and the s-bend failures have mostly disappeared. Following
      the rule in Robot Integrator''s feedback, I take the next step on mass to 0.40
      kg, the contract minimum, and keep every other geometry value fixed. Lower mass
      reduces yaw inertia (mass*(L^2+W^2)/12), which helps the remaining s-bend off-track
      exits (9 of 20 still leave the track). The risk is slip or jitter at the lowest
      mass, which the observation request will expose. Because this is the final iteration,
      I stay with the proven row and wheel track, and I change only mass, a single
      lever with clear evidence behind it.


      - [Open this output](iteration-11/entity0/versions/35c2798adffd4a6caa1da959a0715f5e/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-96c45d928573db53/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-3defe743cd6b9e0a/payload.json)'
  - id: entity1
    label: Mass 0.45 kg, iter 5 row
    notes: 'Iteration 5 sensor row and controller, with mass cut from 0.6 to 0.45
      kg to lower yaw inertia. Iteration 5 scored 465.8 with s-bend max_error 0.0591
      m, and mass is the one lever not yet varied alone.


      ### Rationale


      The best race so far is iteration 5 (465.8): five sensors at x = ±0.04 m, y
      = 0.06 m, 12 mm footprints, wheel_track 0.095 m, mass 0.6 kg, kp 3.5, ki 0.2,
      kd 0.6, base_speed 1.4, last_direction line loss. Its oval finish was 0.95 and
      its s-bend max_error was 0.0591 m, just under the 0.06 m off-track limit, with
      16 of 20 s-bend runs still ending off track. Iterations 6 to 9 each moved one
      lever away from that point and scored lower (449.9, 406.0, 432.4, 373.0). The
      Builder''s geometry returns to the iteration 5 row and 12 mm footprint and changes
      only mass, 0.6 to 0.45 kg. The controller stays exactly at the iteration 5 values,
      so the race isolates the mass change. Lower mass reduces yaw inertia (mass*(L²+W²)/12),
      so the robot should respond faster to the same steering command. That may help
      s-bend overshoot, but it may also raise oscillation, so kd stays at 0.6 as damping.
      kp is held at 3.5 because the Builder asked for it and the turn-rate mapping
      is unchanged by mass. Expected result (a prediction, not a measurement): s-bend
      max_error below 0.059 m, s-bend finish rate above 0.2, oval finish at or above
      0.95, and a score above 465.8. The main risk is that lower mass changes slip
      or traction and adds oscillation on the oval.


      - [Open this output](iteration-10/entity1/versions/1fd45406f99d41138c6d0af67fa89001/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/b64a715b73a14133963ea4f412663541/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-1fe10dd2281eed29/payload.json)'
  - id: entityR1
    label: Mass test, then fallback
    notes: 'Feedback before racing: if s-bend max_error falls below 0.059 m with the
      oval holding, try mass 0.4 kg; if the oval drops below 0.95, return to 0.6 kg.
      The sensor row is kept fixed because iterations 6 to 9 each scored lower when
      it moved.


      ### Feedback


      Written before this candidate has raced. Evidence: iteration 5 (five sensors
      at ±0.04 m, y 0.06 m, 12 mm footprints, wheel_track 0.095 m, mass 0.6 kg, kp
      3.5, kd 0.6) scored 465.8, the best so far. Its oval finish was 0.95 and s-bend
      max_error 0.0591 m, but s-bend line loss stayed near 0.95 and 16 of 20 s-bend
      runs still ended off track. Iterations 6 to 9 showed that widening the span
      cuts s-bend line loss but costs the oval (iteration 6), that y 0.07 m pushes
      s-bend max_error past the limit (iteration 7), that the interpolated row also
      loses (iteration 8, 432.4), and that a 16 mm footprint is worse (iteration 9,
      373.0). So the span, forward offset and footprint are each tuned near their
      best. For this candidate, I keep the controller unchanged (kp 3.5, kd 0.6, ki
      0.2, base_speed 1.4), so the race reads the mass change alone. Read the next
      race as follows. If s-bend max_error falls below 0.059 m and the oval finish
      holds at 0.95 with s-bend oscillation under about 0.38, mass is working and
      the next step is a further mass cut toward 0.4 kg. If the oval falls below 0.95
      or s-bend oscillation rises above about 0.43 with no fall in max_error, lower
      mass is adding slip or jitter, so return to 0.6 kg. If max_error stays near
      0.059 to 0.060 m with line loss still near 0.95, the remaining s-bend limit
      is controller-side, and I will handle it there rather than change geometry again.


      ### Requested changes


      - If s-bend max_error falls below 0.059 m and the oval finish holds at 0.95
      or above with s-bend steering_oscillation under about 0.38, try mass 0.4 kg
      (the contract minimum) with the same five-sensor row at ±0.04 m, y 0.06 m, and
      12 mm footprints. Evidence: iteration 5 gave s-bend max_error 0.0591 m at mass
      0.6 kg, and lower mass cuts yaw inertia.

      - If the oval finish falls below 0.95, or s-bend steering_oscillation rises
      above about 0.43 with no fall in max_error, return mass to 0.6 kg and keep the
      iteration 5 row. Evidence: iteration 5 oval finish was 0.95 with oscillation
      0.23, and s-bend oscillation was 0.38 at 0.6 kg.

      - Keep wheel_track at 0.095 m and the five-sensor row at ±0.04 m, y 0.06 m,
      12 mm footprints for any mass test. Evidence: iteration 6 (±0.05 m) lowered
      the oval finish to 0.90, iteration 7 (y 0.07 m) pushed s-bend max_error to 0.0626
      m, and iteration 9 (16 mm footprint) scored 373.0, so the sensor row is near
      its best.


      - [Open this output](iteration-10/entityR1/versions/1fd45406f99d41138c6d0af67fa89001/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/b64a715b73a14133963ea4f412663541/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-1fe10dd2281eed29/payload.json)'
