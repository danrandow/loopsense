map:
  id: race-109-randow-maps
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Sensor span ±0.05 at
    notes: 'Keeps the best design (y = 0.06 m, wheel_track 0.095 m, mass 0.6 kg, 465.8)
      and widens the five sensors from ±0.04 to ±0.05 m. Iteration 5 left s-bend line
      loss at 0.95 per run with max_error now under 0.06 m, so the remaining s-bend
      failure looks like tape lost at the outer sensors.


      ### Rationale


      Iteration 5 (sensor row at y = 0.06 m, wheel_track 0.095 m, mass 0.6 kg) is
      the best result so far at 465.8. Oval finish rose to 0.95 and s-bend finish
      to 0.20, with s-bend max_error down to 0.0591 m, below the 0.06 m off-track
      limit for the first time. Steering oscillation on the s-bend is 0.377, under
      the 0.43 level where the Integrator flagged jitter. The remaining s-bend failure
      is line loss: 0.95 events per run, with 16 of 20 trials still going off track.
      That points to the tape leaving the outer sensors at the bends, not to lookahead.
      Iteration 1 showed that widening coverage cuts s-bend line loss sharply (1.1
      to 0.2), and the Integrator''s stated next step is to widen the outer sensors
      if s-bend line loss stays near 1. I therefore keep y = 0.06 m, wheel_track 0.095
      m and mass 0.6 kg, and change only the sensor span: five sensors at x = -0.05,
      -0.025, 0, 0.025, 0.05 m (outer sensors moved from ±0.04 m). I expect s-bend
      line loss to fall below 0.7 events per run, s-bend max_error to stay near or
      below 0.06 m, and the s-bend finish rate to rise above 0.2. The risk is that
      the wider row raises edge gain and oscillation, and that the oval finish drops
      below 0.9. If that happens, the next step is ±0.045 m, not a return to ±0.04
      m.


      - [Open this output](iteration-6/entity0/versions/9eb7909b08a445dbb03c26037d8b4f01/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-3018d4c688404fb3/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-faa9d11915a39357/payload.json)'
  - id: entity1
    label: Wider sensor row ±0.05m
    notes: 'Widens the five-sensor row from ±0.04 m to ±0.05 m at y = 0.06 m, keeps
      wheel_track 0.095 and mass 0.6, and raises kp to 3.8 to offset the lower per-metre
      signal gain. Based on iteration 5 (465.8), where s-bend failure is line loss
      at the outer sensors.


      ### Rationale


      Iteration 5 is the best design so far (465.8). Its s-bend failure is line loss
      at the outer sensors (0.95 events per run, 16 of 20 off track), not overshoot.
      Entity0 asks for the five-sensor row widened from x = ±0.04 m to ±0.05 m at
      0.025 m spacing, with y = 0.06 m, wheel_track 0.095 m and mass 0.6 kg kept.
      Weights [-2,-1,0,1,2] on the wider row give about 40 per metre, so the steering
      signal per metre of lateral offset falls about 20 percent from the 50 per metre
      of iteration 5. To hold most of that steering gain, I raise kp from 3.5 to 3.8,
      a partial compensation rather than the full 1.25x, because iteration 5 showed
      the s-bend is not overshooting and the oval finish has room to absorb some extra
      gain. kd 0.6 and ki 0.2 are held to limit oscillation, which was 0.377 on the
      s-bend in iteration 5 and rises with edge gain. base_speed 1.4 and last_direction
      line loss are unchanged, so the race isolates the span change. Expected result
      (a prediction, not a measurement): s-bend line_loss_events below 0.7, s-bend
      finish rate above 0.2, oval finish at or above 0.9, and a total score at or
      above 465.8. The risk is that the wider row plus higher kp raises s-bend oscillation
      above about 0.43 or drops the oval finish.


      - [Open this output](iteration-6/entity1/versions/f0e18d15b0a842c389cf99f36804af4b/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/9eb7909b08a445dbb03c26037d8b4f01/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-faa9d11915a39357/payload.json)'
  - id: entityR1
    label: Span and footprint next
    notes: 'Feedback gives the Builder three next steps (larger footprint, inward
      outer sensors, or y = 0.07 m), each depending on the next race''s s-bend line
      loss and oval finish. Evidence is iteration 5 and iteration 1.


      ### Feedback


      Written before this candidate has raced. Evidence: iteration 5 (five sensors
      at ±0.04 m, y = 0.06 m, wheel_track 0.095 m, mass 0.6 kg, kp 3.5, kd 0.6) scored
      465.8. Its oval finish was 0.95, and its s-bend finish was 0.20 with max_error
      0.0591 m, below the off-track limit. The s-bend failure is now line loss (0.95
      events per run, 16 of 20 off track), so span is the likely limit. Iteration
      1 showed that widening coverage cut s-bend line loss from 1.1 to 0.2. What I
      compensate for in the controller: with the sensors at ±0.05 m and weights kept
      at [-2,-1,0,1,2], the signal is about 20 percent less sensitive per metre, so
      I raise kp from 3.5 to 3.8 and hold kd at 0.6. Read the next race as follows.
      If s-bend line_loss_events falls below 0.7 and max_error stays at or below 0.06
      m, keep the ±0.05 m span and test y = 0.07 m next. If s-bend line loss stays
      near 0.95, the cause is not span alone, so the next change is outer-sensor placement
      or the footprint size, not a wider row. If the oval finish falls below 0.9 with
      steering_oscillation above about 0.38, the edge gain is too high, so reduce
      the outer sensor x to ±0.045 m.


      ### Requested changes


      - If s-bend line_loss_events stays near 0.95 with max_error near 0.06 m, try
      sensor_size 0.016 m with the ±0.05 m five-sensor row at y = 0.06 m. Evidence:
      iteration 5 lost the tape at the outer sensors (0.95 events per run), and larger
      footprints close the 25 mm coverage gap at the edge.

      - If line_loss_events falls below 0.7 but the oval finish drops below 0.9 with
      steering_oscillation above about 0.38, move the outer sensors to x = ±0.045
      m with the same five-sensor count and y = 0.06 m. Evidence: iteration 5 oval
      finish was 0.95 with oscillation 0.23, and iteration 1 showed that wider coverage
      cut line loss.

      - If the s-bend finish rises above 0.2 with line loss below 0.7 and oscillation
      under 0.43, try y = 0.07 m with the ±0.05 m row and the same wheel_track 0.095
      m and mass 0.6 kg. Evidence: iteration 5 shows forward offset from 0.04 to 0.06
      m cut s-bend max_error below the off-track limit (0.0591 m) and raised the score
      from 327.8 to 465.8.


      - [Open this output](iteration-6/entityR1/versions/f0e18d15b0a842c389cf99f36804af4b/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/9eb7909b08a445dbb03c26037d8b4f01/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-faa9d11915a39357/payload.json)'
