map:
  id: race-109-randow-maps
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Sensors forward to y=0.06
    notes: 'Keeps the best track width (0.095 m) and moves the five-sensor row forward
      0.02 m for lookahead, as the Integrator requested. Rests on iteration 4, where
      the oval finish reached 0.75 and s-bend max_error fell to 0.0615 m, just above
      the fixed 0.06 m off-track limit.


      ### Rationale


      Iteration 4 (wheel_track 0.095 m, mass 0.6 kg, five sensors at x = ±0.04 m,
      y = 0.04 m) is the best result so far at 327.8. The oval finish rate rose to
      0.75 with progress 0.91, and s-bend max_error fell from 0.0645 m (iteration
      3) to 0.0615 m. The s-bend finish is still 0 in all 20 trials, and the off-track
      limit is fixed at 0.06 m. Body width cannot raise it: max(0.06, 0.0125 + bw/4)
      stays at 0.06 m for every allowed body_width. Sensing is also not the limit,
      since widening to seven sensors cut line loss but lost completions. The remaining
      s-bend failure is therefore an overshoot of about 0.002 m past the limit. The
      Integrator''s rule keeps wheel_track at 0.095 m, because the oval held above
      0.5 and max_error fell below 0.063 m. The Integrator also asked that, if the
      s-bend finish stays at zero, the sensor row move forward for more lookahead.
      I make that the one geometry change: sensor y moves from 0.04 m to 0.06 m, with
      the same five sensors at x = ±0.04 m in 0.02 m steps, 12 mm footprints, and
      all other geometry unchanged. I expect the sensors to see the bend earlier,
      which should cut s-bend max_error below 0.06 m and give the first s-bend completions.
      The risk is that the same lookahead causes oscillation or oval loss, and the
      next race will show which.


      - [Open this output](iteration-5/entity0/versions/3b7eff77f15b461884e1d76d1c0b664b/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-315a7d77babd6859/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-b64edfeed191228a/payload.json)'
  - id: entity1
    label: Wheel track 0.095 package
    notes: 'Builder''s 0.095 m wheel_track with kp trimmed to 3.5 to limit bend overshoot
      seen at 0.09 m (score 303) and 0.10 m (score 321). Other gains are held from
      the best iteration.


      ### Rationale


      Evidence from iterations 2 and 3 (wheel_track 0.10 m scored 321; 0.09 m scored
      303) points to yaw overshoot on bends as the s-bend limit. Narrowing the track
      raised oval finishes (0.45 to 0.65) but cut s-bend finishes to zero, and s-bend
      max_error rose to about 0.0645 m. Steering oscillation on the s-bend fell from
      0.43 to 0.27, so the bend failure is overshoot, not jitter. The Builder''s geometry
      sets wheel_track to 0.095 m, halfway between those two designs, with mass 0.6
      kg, body and wheel radius unchanged, and the five-sensor row at ±0.04 m. Turn
      rate is (v_R - v_L)/wheel_track, so this track is about 1.05x more responsive
      than the 0.10 m design. I scale kp down from 3.6 to 3.5, roughly the 0.10/0.095
      interpolation, to avoid overshooting the bends that iteration 3 overshot. kd
      stays at 0.6 to keep s-bend oscillation near its iteration 2 level (0.43). ki
      stays at 0.2, base_speed at 1.4, and line_loss at ''last_direction'', which
      gave the best results. I expect the oval finish rate near 0.5 to 0.55 and some
      s-bend completions, for a score near 321. This is a prediction, not a measurement.
      The observation request covers all metrics so the Builder can read per-track
      effects.


      - [Open this output](iteration-4/entity1/versions/a52c1f2b167a4851b9e667ab6ab7b885/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/0de29dfe11454064b084414ed39c2acd/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-4a9847c4e0954cfc/payload.json)'
  - id: entityR1
    label: Overshoot-aware feedback
    notes: 'Feedback tied to iteration 2 and 3 results: s-bend max_error clusters
      near 0.0645 m, so the next step depends on whether the s-bend recovers at 0.095
      m or stays at zero. Requests give sensor forward offset and track fallback branches.


      ### Feedback


      Written before this candidate has raced. Iteration 2 (wheel_track 0.10 m, kp
      3.6, kd 0.6, mass 0.6 kg) scored 321, with oval finish 0.45 and s-bend finish
      0.10. Iteration 3 (wheel_track 0.09 m, kp 3.3) scored 303, with oval finish
      0.65 but s-bend finish 0.00 and s-bend max_error rising to 0.0645 m. Sensing
      is not the limit: iteration 1''s wider row cut line loss but lost completions.
      What I compensated for in the controller: narrowing the track raises yaw per
      unit of PWM difference, so kp is trimmed from 3.6 to 3.5 for this 0.095 m track,
      and kd is held at 0.6 to keep s-bend oscillation near 0.43. The next race should
      be read as follows. If s-bend finish rises above 0.05 and max_error falls below
      0.063 m while the oval finish holds at or above 0.5, keep wheel_track near 0.095
      m. If the s-bend stays at zero with max_error still about 0.0645 m, the overshoot
      is not set by turn authority, so the next lever is the sensor forward offset.
      If the oval finish drops to 0.45 or below, the track change is not the oval
      lever, so return to 0.10 m.


      ### Requested changes


      - If the s-bend finish stays at 0 with max_error still about 0.0645 m, move
      the sensor row forward to y = 0.06 m with the same five sensors at ±0.04 m (0.02
      m spacing). Evidence: iterations 2 and 3 both show s-bend max_error clustering
      at 0.0627 to 0.0645 m, so the sensors may be reacting too late at speed.

      - If the oval finish falls to 0.45 or below and completion_time worsens, return
      wheel_track to 0.10 m and keep mass 0.6 kg. Evidence: iteration 2 (0.10 m) reached
      0.45 oval finish, and iteration 0 (0.12 m, mass 0.8 kg) reached only 0.05.

      - If the s-bend finish rises above 0.05 and steering_oscillation stays under
      about 0.43, keep wheel_track 0.095 m and test base_speed around 1.5 with kp
      unchanged. Evidence: the s-bend finish recovered in iteration 2 (0.10) when
      the track was wider, and speed is not yet the binding limit on the oval (finishers
      ran about 1.73 s).


      - [Open this output](iteration-4/entityR1/versions/a52c1f2b167a4851b9e667ab6ab7b885/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/0de29dfe11454064b084414ed39c2acd/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-4a9847c4e0954cfc/payload.json)'
