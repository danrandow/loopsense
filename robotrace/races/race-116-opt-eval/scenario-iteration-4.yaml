map:
  id: race-116-opt-eval
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: kp 1.7 on kd 0.5 base
    notes: 'Keeps the best raced design (iteration 3, score 326.7, kd 0.5) and lowers
      kp from 2.0 to 1.7 as the single change. Oscillation stayed under 0.4 and line
      loss on the s-bend and slalom stayed near 1 per run, so the test is whether
      weaker correction reduces overshoot-driven off-track ends.


      ### Rationale


      Evidence from iteration 3 (kd 0.5, score 326.7, the best raced design so far):
      the oval improved sharply, with 11 of 20 finishes, progress 0.94, line_loss_events
      0.55 and max_error 0.045, compared with 1.1 line-loss events at kd 0.3. Steering
      oscillation stayed below the Evaluator''s 0.4 revert threshold on every track
      (0.34 oval, 0.30 s-bend, 0.25 slalom), so the derivative term is not amplifying
      noise. The s-bend and slalom still go off track. Their line loss stayed at about
      1 per run (1.1 and 1.0), and max_error was 0.063 and 0.071, above the 0.06 m
      limit. The Evaluator''s conditional rule for the next step is: keep kd 0.5 and
      test kp 1.7 alone. Its condition (line loss near 1 or below on both tracks with
      max_error under 0.06) is only partly met, since the slalom max_error is above
      0.06. Still, the rule''s intent holds: kd 0.5 is stable, so the next question
      is whether the proportional correction is too strong. The kp trend supports
      this. Raising kp from 2.0 to 2.5 made slalom line loss worse (1.0 to 1.85) and
      cut oval progress, so a modest reduction is the direction most likely to help.
      Change: controller.kp 2.0 to 1.7, with everything else held at the iteration
      3 values (kd 0.5, ki 0.02, base_speed 1.2, line_loss last_direction, same sensing
      geometry and sensor_weights). This isolates one variable against the best raced
      design. Expected result: line_loss_events on the s-bend and slalom fall toward
      1.0 or below, max_error drops under about 0.06 m on the slalom, and oval progress
      holds at or above about 0.9. Risk: kp 1.7 may under-correct on the tight oval
      bends, reducing finishes. Hypotheses: (H1) kp 2.0 is slightly too strong for
      the s-bend and slalom curvature, so a lower kp reduces overshoot-driven line
      loss. (H2) Speed is not yet the limit, because the failures occur mid-course.
      Next measurements: per-track line_loss_events, max_error, progress, steering_oscillation,
      completion and completion_time. If the robot tracks cleanly and progress stalls
      below full coverage, the next step is a small base_speed increase (1.2 to 1.4).


      - [Open this output](iteration-4/entity0/versions/0aaf640e732b4394afb66e65a7021e62/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-d2ffb75f9bfe3e78/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-3c2e17d0d3c17adf/payload.json)'
  - id: entityR1
    label: Approve kp 1.7 test
    notes: 'Approved a single-variable test of kp 2.0 to 1.7 at kd 0.5 against the
      best raced design (iteration 3, score 326.7). Iteration 2 showed higher kp worsened
      slalom line loss and oval progress, so a lower kp is the most plausible next
      step. The feedback sets what to do next depending on whether the oval holds
      and the s-bend and slalom line loss falls.


      ### Feedback


      Reviewed before racing, so no outcome is stated for this candidate. It changes
      one value from the best raced design (iteration 3, score 326.7): controller.kp
      2.0 to 1.7, with kd 0.5, ki 0.02, base_speed 1.2, line_loss last_direction and
      all geometry and sensor_weights unchanged. The contract fields are all within
      range. The evidence supports a single-variable test of gain direction. In iteration
      3, kd 0.5 cut oval line loss to 0.55 and produced 11 of 20 finishes, but the
      s-bend and slalom still lost the line about once per run (1.1 and 1.0) with
      max_error of 0.063 and 0.071. In iteration 2, raising kp to 2.5 made slalom
      line loss worse (1.0 to 1.85) and reduced oval progress (0.70 to 0.57), so a
      lower kp is the direction most likely to help the s-bend and slalom. The main
      risk, from the same evidence, is that kp 1.7 under-corrects the tight oval bends
      and loses finishes. The rationale''s own condition for this step is only partly
      met, because slalom max_error is above 0.06, but this is a cheap, informative
      test against the best design, so it is worth racing. Read the next race as follows.
      If oval finishes and progress hold (progress about 0.9 or more) and s-bend or
      slalom line_loss_events fall toward 1.0 or below, keep kp 1.7 and then test
      base_speed 1.4 for the speed limit. If oval finishes or progress fall clearly,
      revert kp to 2.0, which is the best raced value, and do not lower kp further.
      If line loss rises on any track, the correction is not the limit at this kd,
      so return to kp 2.0 and examine kd or line_loss next.


      ### Requested changes


      - If oval progress stays about 0.9 or higher and s-bend or slalom line_loss_events
      fall toward 1.0 or below with kd 0.5 kept, keep controller.kp 1.7 and test controller.base_speed
      1.4 as the next single change, since iteration 2 showed speed is the next limit
      once line loss is controlled.

      - If oval finishes or progress fall clearly below the iteration 3 values (0.55
      finishes, progress 0.94), revert controller.kp to 2.0 with kd 0.5, because iteration
      2 showed that moving kp away from 2.0 in either direction hurt the oval.

      - If line_loss_events rise on the slalom or s-bend at kp 1.7, do not lower kp
      further; keep kp 2.0 and test controller.kd 0.6 or 0.7 with steering_oscillation
      as the guard, since iteration 3 kept oscillation below 0.4 at kd 0.5.


      - [Open this output](iteration-4/entityR1/versions/c55d18547d8745abac005352d3bd7bc3/payload.json)

