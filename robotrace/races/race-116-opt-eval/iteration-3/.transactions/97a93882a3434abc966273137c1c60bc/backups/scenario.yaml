map:
  id: race-116-opt-eval
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Stronger kp 2.5 test
    notes: 'Keeps iteration 1''s sensor geometry and kd 0.3, raising kp from 2.0 to
      2.5 to test whether correction strength limits line-following. Iteration 1 showed
      about one line loss and max_error near 0.06 m per run, with low oscillation,
      so drift rather than jitter is the target.


      ### Rationale


      Evidence from iteration 1 (score 163.8, up from 49.2): the wider sensor spacing
      (1.5 cm, 16 mm footprints) raised progress to 0.70 on the oval, with one finish
      in 20 trials, and slalom and s-bend progress rose too. But every run still ends
      off-track with about one line-loss event and max_error near 0.061 to 0.064 m,
      the 0.06 m limit. Steering oscillation is low on slalom and s-bend (0.12 and
      0.28), so the failure is lateral drift, not jitter. Sensing coverage was the
      first suspect and has been partly addressed, but line loss persists, so correction
      strength is now the likely limit. Evaluator feedback recommended testing kp
      2.0 to 2.5 with kd 0.3 when line loss stays near 1 per run, and that is what
      I do here. Change: controller.kp 2.0 to 2.5, all else unchanged (sensor geometry,
      sensor_weights, kd 0.3, ki 0.02, base_speed 1.2, line_loss last_direction).
      This isolates the correction-strength hypothesis. Expected result: max_error
      drops below about 0.05 m, line_loss_events falls toward 0 on the s-bend and
      slalom, and progress on those tracks rises above 0.34 and 0.09. Risk: the oval
      showed steering_oscillation of 0.32, so the higher kp could increase jitter;
      kd 0.3 is kept to damp it. Base speed stays at 1.2, so completion within 3 s
      is still unlikely on the slower tracks; speed will be raised only after line
      loss is controlled. Hypotheses: (H1) kp is the main limit on lateral error;
      (H2) kd 0.3 is enough to keep oscillation below about 0.35 at kp 2.5. Measurements
      requested: progress, line_loss_events, max_error, rms_error, steering_oscillation,
      plus completion and completion_time, per track.


      - [Open this output](iteration-2/entity0/versions/e930367ede6c4d908af41092736bafdb/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-60e58c307650ce57/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-462dfc46ee417163/payload.json)'
  - id: entityR1
    label: 'Evaluator review: kp 2.5'
    notes: 'Approved the single-variable test of kp 2.0 to 2.5 on the best raced design
      (163.8). Iteration 1 showed about one line-loss event per run and max_error
      at the 0.06 m limit, which meets the stated trigger for testing correction strength.
      Feedback sets the next steps by race outcome: speed, kd, or the speed-limited
      track.


      ### Feedback


      The candidate changes one controller value from the best raced design (iteration
      1, score 163.8): kp 2.0 to 2.5, with all sensing geometry, sensor_weights, kd
      0.3, ki 0.02, base_speed 1.2 and line_loss last_direction unchanged. Iteration
      1 showed line loss was not fixed by sensing alone. Across 60 trials, line_loss_events
      averaged 1.1 on the oval, 1.0 on the s-bend and 1.0 on the slalom, and max_error
      stayed at 0.061 to 0.064 m, which is the off-track limit. Steering oscillation
      was 0.32 on the oval, 0.28 on the s-bend and 0.12 on the slalom, so drift is
      the main failure and jitter is a secondary risk. The iteration 1 condition for
      testing kp is met, so this isolates correction strength. Before the race, the
      risk is that kp 2.5 could raise oscillation on the oval, where it was already
      0.32. Speed is also a limit: base_speed 1.2 is below the roughly 1.5 m/s needed
      to finish in 3 s, and the oval''s 1 finish in 20 trials came with progress of
      only 0.70. Read the race as follows. If line_loss_events falls toward 0 and
      max_error drops below about 0.05 m, correction strength was the limit, so keep
      kp 2.5 and raise base_speed in small steps. If line_loss_events stays near 1
      but steering_oscillation rises above about 0.4, the gain is too aggressive,
      so raise kd before lowering kp. If line loss is controlled but progress stalls
      below full coverage, speed is the limit, so raise base_speed.


      ### Requested changes


      - If the race shows line_loss_events near 0 and max_error below about 0.05 m,
      keep controller.kp at 2.5 and raise controller.base_speed in small steps (1.2
      to 1.4) to reach completion within 3 s, since iteration 1 gave progress 0.70
      on the oval with no speed-limited finish.

      - If line_loss_events stays near 1 per run and steering_oscillation rises above
      about 0.4 (the oval was 0.32 at kp 2.0), raise controller.kd from 0.3 to 0.4
      or 0.5 before changing kp again.

      - If line loss is controlled but progress on the s-bend stays below about 0.5,
      test controller.kp 2.5 with controller.base_speed 1.2 unchanged and check whether
      the slower track limits progress; do not change sensor_weights or sensor geometry,
      which iteration 1 already tested.


      - [Open this output](iteration-2/entityR1/versions/772744616b064ceb994f0b9dda47bc89/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/e930367ede6c4d908af41092736bafdb/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-462dfc46ee417163/payload.json)'
