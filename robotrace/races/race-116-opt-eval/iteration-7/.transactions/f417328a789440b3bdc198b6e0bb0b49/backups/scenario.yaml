map:
  id: race-116-opt-eval
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Search-right line loss
    notes: 'Keeps the best raced design (kd 0.6, kp 1.5, score 604) and changes only
      line_loss to search_right to test whether a directed search recovers the slalom
      line, which has stayed at 1.0 loss per run across kp and kd changes. Oscillation
      on the s-bend (0.397) is the guard to watch.


      ### Rationale


      Evidence: iteration 6 (kd 0.6, kp 1.5, base_speed 1.2, last_direction) is the
      best raced design at 604.0. Oval is at 18/20 finishes with progress 0.97. S-bend
      is at 15/20 finishes, but its steering_oscillation is 0.397, right at the 0.4
      guard. Slalom still ends off track in 20/20 runs with progress 0.33 (up from
      0.24 at kd 0.5), and line_loss_events stay at exactly 1.0 per run. Across iterations
      4 to 6 the slalom line loss has not responded to kp (1.7 and 1.5 both gave 1.0)
      or to kd (0.5 and 0.6 both gave 1.0). kd did raise slalom progress, so damping
      is helping, but the single line loss per run is not being recovered. The Evaluator''s
      rule for this case is to stop changing kp and kd and test line_loss as a comparison
      on the same kd.


      Change: controller.line_loss from ''last_direction'' to ''search_right'' (signal
      fixed at +1, steering the robot to its left). Everything else is held at the
      iteration 6 best values: kp 1.5, ki 0.02, kd 0.6, base_speed 1.2, sensor geometry
      and sensor_weights unchanged. I chose search_right over search_left without
      direct evidence of which side the slalom loses the line on, so this is a gamble
      on direction. The change touches only the lost-line segments, so the oval and
      s-bend steering behaviour should be largely unchanged.


      Expected result: slalom line_loss_events should fall below 1.0 or the slalom
      should go further (progress above 0.33), and the oval should hold near 18/20
      finishes. Risks: search_right may push the robot the wrong way on a slalom bend,
      which would leave slalom results unchanged or worse, and s-bend oscillation
      may stay near 0.4. If slalom loss does not change, the next test should be a
      forward sensor shift (y 0.06) or search_left, not more gain changes. If s-bend
      oscillation goes above 0.4, revert to kd 0.5.


      Hypotheses: H1, the slalom loss happens on one side of the course, so a directed
      search recovers the line where last_direction does not. H2, kd 0.6 keeps the
      non-slalom oscillation below 0.4.


      - [Open this output](iteration-7/entity0/versions/36404f05330b4dcaac34d74b4e020725/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-8c6ae8b13d625c87/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-b5a5d78057d09477/payload.json)'
  - id: entityR1
    label: Approve kd 0.6 test
    notes: 'Approved a single-variable change from the best raced design (iteration
      5, kp 1.5, kd 0.5) to kd 0.6, aimed at slalom line loss that gain reduction
      did not fix. Iteration 3 showed kd raises score and keeps oscillation under
      0.4, though s-bend oscillation at 0.38 leaves little headroom.


      ### Feedback


      Reviewed before racing, so no outcome is stated for this candidate. It changes
      one value from the best raced design (iteration 5, score 506.7): controller.kd
      0.5 to 0.6, with kp 1.5, ki 0.02, base_speed 1.2, line_loss last_direction and
      all geometry and sensor_weights unchanged. All fields are within the contract
      ranges, and the single-variable change keeps the result attributable.


      The evidence supports this test. Raising kd from 0.3 to 0.5 (iteration 3) cut
      oval line loss from 1.1 to 0.55 and lifted the score from 163.8 to 326.7, with
      steering oscillation still below 0.4 on every track. Lowering kp from 2.0 to
      1.7 to 1.5 (iterations 4 and 5) then helped the oval and s-bend, but slalom
      line loss stayed at 1.0 per run and slalom progress at about 0.24 in both. That
      pattern points to a damping or overshoot issue at the slalom direction changes
      that gain reduction has not fixed, so kd is the next untested lever.


      The main risk is steering oscillation. At kd 0.5 it was 0.38 on the s-bend in
      iteration 5 and 0.40 at kp 1.7 in iteration 4, so kd 0.6 is close to the 0.4
      guard, and the derivative term may amplify the roughly 2 percent sensor noise.
      Read the next race as follows. If s-bend or slalom steering_oscillation rises
      above 0.4 with no gain in line-loss events or progress, revert kd to 0.5 and
      keep kp 1.5. If slalom line_loss_events fall below 1.0 and progress rises above
      about 0.24 while oval finishes hold near 18 of 20, keep kd 0.6 as the new best.
      If slalom line loss stays at about 1.0 with oscillation under 0.4, the cause
      is not overshoot, so the next test should be controller.line_loss ''search_left''
      or ''search_right'' on the same kd, as a comparison, rather than further kd
      or kp changes.


      ### Requested changes


      - If steering_oscillation on the s-bend or slalom exceeds 0.4 without a fall
      in line_loss_events, revert controller.kd to 0.5 (the iteration 5 value) and
      keep kp 1.5, because kd 0.5 gave 0.38 s-bend oscillation and kd 0.6 is close
      to the guard.

      - If slalom line_loss_events fall below 1.0 with oscillation under 0.4 and oval
      finishes hold near 18 of 20, keep controller.kd 0.6 and kp 1.5, then test controller.base_speed
      1.4 as the next single change, since speed becomes the limit once line loss
      is controlled.

      - If slalom line_loss_events stay at about 1.0 with kd 0.6, do not change kp
      or kd again; test controller.line_loss ''search_left'' or ''search_right'' with
      kd 0.6 as a comparison, because iterations 4 and 5 showed slalom line loss does
      not respond to kp.


