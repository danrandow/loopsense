map:
  id: race-116-opt-eval
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: kd 0.7 on best design
    notes: 'Reverts speed to 1.2 (iteration 9 at 1.4 lost s-bend finishes, 17 of 20,
      and scored 639 against 687) and tests kd 0.7 as a single change on the iteration
      8 design. Slalom progress rose with each kd step, and s-bend oscillation (0.31)
      leaves room for one more step.


      ### Rationale


      Evidence. Iteration 8 (sensors at y 0.06, base_speed 1.2, kp 1.5, kd 0.6) is
      the best raced design at 686.6. Oval and s-bend finished 20 of 20, and slalom
      progress rose from 0.33 to 0.40 when the sensors moved forward. Iteration 9
      raised base_speed to 1.4 and scored lower (639.2). Oval time fell from 2.00
      s to 1.79 s, but s-bend finishes dropped to 17 of 20 with 3 off-track ends.
      Each lost finish costs about 900 points, far more than the time term gains,
      and the revert rule (finishes below 18 of 20) is met. The entityR1 feedback
      describes 1.4 as the untested candidate, but that step has now been raced, so
      it is rejected. Speed stays at 1.2. Slalom is still the bottleneck: it ends
      off track in 20 of 20 runs and has 1.15 line-loss events per run. Gain, line_loss
      and sensor-y changes have not fixed it. Across iterations 3 to 8, each kd increase
      (0.3 to 0.5 to 0.6) raised slalom progress (0.23 to 0.24 to 0.33 at y 0.04).
      The s-bend oscillation in iteration 8 was 0.31, which leaves room for one more
      damping step.


      Change. From iteration 8, one value: controller.kd 0.6 to 0.7. Everything else
      is held at the iteration 8 values: sensors at y 0.06, x -0.03 to 0.03, size
      0.016, kp 1.5, ki 0.02, base_speed 1.2, sensor_weights unchanged, line_loss
      last_direction.


      Expected result. Slalom progress should rise above 0.40 and its line-loss events
      should fall slightly. Oval and s-bend should keep 20 of 20 finishes, with oscillation
      at or below about 0.35.


      Risks and fallback. kd 0.7 may amplify sensor noise, and the 0.4 oscillation
      guard is close. If s-bend or oval finishes fall below 18 of 20, or steering_oscillation
      exceeds 0.4 on either track, revert kd to 0.6, which reproduces the iteration
      8 best design (686.6). If slalom progress falls below 0.40 with the finishes
      held, kd 0.6 is also the better choice.


      Hypotheses. H1: slalom overshoot at direction changes is still limited by damping,
      so kd 0.7 raises slalom progress. H2: kd 0.7 keeps s-bend oscillation below
      0.4 at speed 1.2. Measurements: per-track completion, progress, completion_time,
      rms_error, max_error, line_loss_events, steering_oscillation, control_effort,
      and noise_robustness, so the kd effect can be separated from the track results.


      - [Open this output](iteration-10/entity0/versions/81c2a5603b014968af6e9721379172f5/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-2cf26127f0ac4b30/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-ccdb2592f8cf1bd9/payload.json)'
  - id: entityR1
    label: Approve kd 0.7 test
    notes: 'Approved one-value change kd 0.6 to 0.7 on the iteration 8 best design
      (686.6), with a revert rule for lost finishes or oscillation above 0.4. Evidence:
      damping raised slalom progress in iterations 5 to 6, while speed 1.4 in iteration
      9 cost s-bend finishes and scored 639.2.


      ### Feedback


      Reviewed before racing, so no outcome is stated for this candidate. It is the
      iteration 8 best design (score 686.6: sensors at y 0.06, kp 1.5, ki 0.02, base_speed
      1.2, line_loss last_direction) with one change, controller.kd 0.6 to 0.7. Every
      field is within the contract ranges. The iteration 9 test of base_speed 1.4
      scored 639.2, below the best. Its s-bend finishes fell to 17 of 20 and its oval
      time gain did not repay the lost finishes, so speed stays at 1.2 and this candidate
      does not change it. Damping has helped across the raced history: kd 0.3 to 0.5
      cut oval line loss from 1.1 to 0.55 (iteration 3), and kd 0.5 to 0.6 raised
      slalom progress from 0.24 to 0.33 (iterations 5 to 6). Slalom has not finished
      in any race, so its gain is in progress only, and the score on the held-back
      tracks depends mainly on oval and s-bend finishes (about 950 points each). The
      risk is that the s-bend oscillation rises past the 0.4 guard. In iteration 6
      it was 0.397 at y 0.04 and kd 0.6, and it fell to 0.314 when the sensors moved
      to y 0.06 (iteration 8). The kd 0.7 step is one value on the best design, so
      the result will be attributable. Read the next race as follows. If oval and
      s-bend both finish 20 of 20 (or hold at 18 or more) with steering_oscillation
      at or below 0.4, and slalom progress rises above 0.40, keep kd 0.7 as the new
      best. If any s-bend or oval finish is lost, or oscillation exceeds 0.4 on either
      track, revert kd to 0.6, which reproduces iteration 8''s 686.6 result.


      ### Requested changes


      - If oval and s-bend finishes hold (20 of 20, or at least 18 of 20) with steering_oscillation
      at or below 0.4 and slalom progress above 0.40, keep controller.kd at 0.7 and
      keep sensors at y 0.06 with base_speed 1.2; iteration 8 showed these fields
      give the best score (686.6), so the next change should be small.

      - If any oval or s-bend finish is lost or steering_oscillation exceeds 0.4 on
      either track, revert controller.kd to 0.6, since iteration 8 gave 20 of 20 finishes
      on both tracks at kd 0.6 and iteration 6 showed s-bend oscillation at 0.397
      at y 0.04.

      - If slalom progress falls below 0.40 while finishes hold, kd 0.6 is the better
      choice; do not change base_speed again, because iteration 9 (base_speed 1.4)
      cost s-bend finishes (17 of 20) and scored 639.2.


      - [Open this output](iteration-10/entityR1/versions/15e6a6e35d84444ea06a3832bb7929f5/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/81c2a5603b014968af6e9721379172f5/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-ccdb2592f8cf1bd9/payload.json)'
