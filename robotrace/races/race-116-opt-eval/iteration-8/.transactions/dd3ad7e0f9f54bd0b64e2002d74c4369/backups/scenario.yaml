map:
  id: race-116-opt-eval
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Forward sensors y=0.06
    notes: 'Iteration 6''s best controller with the five sensors moved 2 cm forward,
      to test whether earlier steering fixes slalom line loss. Iteration 7 showed
      the search direction changes nothing (identical scores), so sensing geometry
      is the remaining lever, with the risk that s-bend oscillation (0.397) rises.


      ### Rationale


      Evidence. Iteration 6 (kp 1.5, kd 0.6, base_speed 1.2, last_direction, y=0.04
      sensors) is the best raced design at 604.0. Oval is 18/20 finishes with progress
      0.97, and s-bend is 15/20 with steering_oscillation 0.397, right at the 0.4
      guard. Slalom ends off track in 20/20 runs with progress 0.33 and exactly 1.0
      line-loss event per run. Across iterations 4 to 6, slalom line loss did not
      respond to kp (1.7 and 1.5) or kd (0.5 and 0.6). Iteration 7 then changed only
      line_loss to search_right, and every metric and the score matched iteration
      6 exactly on all three tracks. The lost-line recovery direction therefore has
      no effect on the outcome. The likely reason is that the robot leaves the track
      within the first few steps of each line loss, so the 0.35 throttle and fixed
      signal never act. The lever for slalom must be sensing or geometry, not the
      recovery rule or gains.


      Change. Revert controller.line_loss to last_direction, the iteration 6 value,
      so the candidate matches the best raced controller exactly. Then make one geometry
      change: move all five sensors forward from y=0.04 to y=0.06 (within the allowed
      -0.06 to 0.08). Lateral x positions, sensor_size 0.016, sensor_weights, kp 1.5,
      ki 0.02, kd 0.6 and base_speed 1.2 are unchanged. The forward shift gives the
      steering loop about 2 cm more lead before the wheels reach each bend. That is
      the earlier warning the slalom needs if its line loss comes from reacting too
      late to direction changes, which kp and kd could not fix.


      Expected result. Slalom line_loss_events should fall below 1.0 and slalom progress
      should rise above 0.33. Oval finishes should hold near 18/20. Risk: the longer
      lead can increase steering oscillation on the s-bend and oval, which were already
      at 0.397 and 0.356. If s-bend or oval steering_oscillation exceeds 0.4 with
      no fall in slalom line_loss_events, revert sensor y to 0.04 and keep the controller
      as in iteration 6. If slalom line_loss_events stay at 1.0 under the forward
      shift, the next step is a separate test of base_speed 1.0 on the slalom-limited
      design, since the robot may be leaving the track at speed on the tight bends.


      Hypotheses. H1: slalom line loss comes from late steering at the direction changes,
      and a forward sensor shift fixes it. H2: kd 0.6 with the forward shift keeps
      s-bend oscillation at or below 0.4. Measurements requested: per-track completion,
      progress, completion_time, rms_error, max_error, line_loss_events, steering_oscillation,
      control_effort and noise_robustness, so the slalom change can be separated from
      the oval and s-bend effects.


      - [Open this output](iteration-8/entity0/versions/cacafa6be0b54dabbb74f997cefed31b/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-9cbf06c7917c8ae8/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-7bb474bcdd4a323d/payload.json)'
  - id: entityR1
    label: 'Approve: search_right'
    notes: 'Approved the single-variable test of line_loss ''search_right'' on the
      iteration 6 best design (score 604). Slalom line loss has been stuck at 1.0
      per run across all gain changes since iteration 2, so the untested lost-line
      direction is the cheapest informative test.


      ### Feedback


      Reviewed before racing, so no outcome is stated for this candidate. It changes
      one value from the best raced design (iteration 6, score 604.0): controller.line_loss
      from ''last_direction'' to ''search_right'', with kp 1.5, ki 0.02, kd 0.6, base_speed
      1.2, sensor geometry and sensor_weights unchanged. All fields are within the
      contract ranges, and the single-variable change keeps any result attributable.


      The evidence supports this test. Slalom line_loss_events have been 1.0 per run
      in every raced design since iteration 2 (iterations 4 to 6 at 1.0 across kp
      1.7, 1.5 and kd 0.5, 0.6), so gain changes have not moved it. Iteration 6 slalom
      progress is 0.33 and every slalom run ends off track, so the lost-line recovery
      is the untested lever. The contract says search_right steers left with a fixed
      +1 signal, and the candidate''s own rationale admits the direction is a gamble
      with no direct evidence. The change only affects lost-line segments, so oval
      finishes (18/20 in iteration 6) and s-bend should be broadly unchanged.


      Risks: search_right may steer the wrong way on slalom bends, leaving slalom
      unchanged or worse. Also, s-bend steering_oscillation was 0.397 in iteration
      6, right at the 0.4 guard, so kd 0.6 gives no margin. Read the race as follows.
      If slalom line_loss_events fall below 1.0 or slalom progress rises above 0.33,
      keep search_right and test base_speed 1.4 as the next single change. If slalom
      is unchanged or worse, do not change kp or kd. Test controller.line_loss ''search_left''
      with the same gains as a comparison, or a forward sensor shift to y 0.06 if
      line loss stays at 1.0 under both directions. If s-bend or oval steering_oscillation
      rises above 0.4 without a gain in line-loss events, revert kd to 0.5 (iteration
      5 value).


      ### Requested changes


      - If slalom line_loss_events fall below 1.0 or slalom progress rises above 0.33
      with oval finishes near 18/20, keep controller.line_loss ''search_right'' and
      test controller.base_speed 1.4 as the next single change, since iteration 6
      shows speed becomes the limit once line loss is controlled.

      - If slalom line loss is unchanged or worse under search_right, do not change
      kp or kd; test controller.line_loss ''search_left'' with kp 1.5 and kd 0.6 as
      a comparison, because the direction of recovery is untested (iterations 4 to
      6 show slalom loss does not respond to gain).

      - If s-bend or oval steering_oscillation exceeds 0.4 (iteration 6 s-bend was
      0.397) without a fall in line_loss_events, revert controller.kd to 0.5 with
      line_loss ''search_right'', keeping kp 1.5.


      - [Open this output](iteration-7/entityR1/versions/f417328a789440b3bdc198b6e0bb0b49/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/36404f05330b4dcaac34d74b4e020725/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-b5a5d78057d09477/payload.json)'
