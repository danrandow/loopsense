  id: race-116-opt-eval
  schema: v0.2
  scenario: Iteration 1
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 0.
dimensions:
  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Wider sensing, gentler
    notes: 'Overlapping 16 mm sensors spaced 1.5 cm across the tape, with base_speed
      1.2, kp 2.0, ki 0.02 and kd 0.3, to fix the baseline''s line loss and drift.
      Every trial in the development evidence (60 runs, no finishes, progress about
      0.1) ended off track with max_error near 0.06 m, so sensing coverage and over-steering
      are the targets.


      ### Rationale


      Evidence: all 60 development trials (oval, s-bend, slalom; 20 each) ended off_track
      with 0 finishes. Progress reached only 0.10 to 0.14, and max_error hit about
      0.06 m, which is the off-track limit. Steering oscillation was low (0.07 to
      0.14), so the failure is drift away from the line, not jitter. Each run logged
      about one line-loss event early on.


      Diagnosis: with 2 cm sensor spacing and 12 mm footprints, the gaps between footprints
      are wider than the 25 mm tape can bridge. A 1 cm lateral offset is handled,
      but an offset of 2 to 3 cm can lose the line, and the robot then drifts out.
      Meanwhile kp=3 with signal up to +/-2 gives up to 2100 PWM of differential,
      and base_speed 1.6 gives little time to correct. The robot is over-driven for
      its sensing.


      Changes: (1) Sensors at x = -0.03, -0.015, 0, 0.015, 0.03 with sensor_size 0.016,
      so footprints overlap and cover the tape continuously across the whole band.
      The outer sensors still see the line before it leaves the track. Sensor y stays
      at 0.04. (2) Weights stay proportional to x (-2, -1, 0, 1, 2), so the sign convention
      is unchanged. (3) base_speed 1.6 to 1.2 so the robot can correct on bends; the
      3 s limit may be missed, so this is a trade-off. (4) kp 3.0 to 2.0 to reduce
      over-steering. (5) kd 0.15 to 0.3 to damp the faster response. (6) ki 0.05 to
      0.02 to limit windup on the bends. (7) Mass, wheels and body unchanged, so the
      geometry change is limited to sensing.


      Expected result: longer progress (target over 0.5) and fewer off-track ends,
      with line_loss_events near 0 and rms_error below 0.03 m. If the run now completes
      but slowly, raise base_speed in small steps. Hypotheses to test: (H1) sensor
      coverage is the main cause of line loss; (H2) kp 2.0 with kd 0.3 is stable at
      1.2 m/s. Measurements requested: progress per track, line_loss_events, max_error,
      and steering_oscillation, so I can tell whether drift is from sensing or from
      speed.


      - [Open this output](iteration-1/entity0/versions/daaa70fa116e4081943582c066baad55/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-137391bd04d4f18b/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-d4faff9ae4c6d97a/payload.json)'
  - id: entityR1
    label: Approve baseline for race
    notes: 'Approved the valid iteration-0 baseline because it meets every contract
      range and no race data exists yet to justify revision. The feedback names the
      speed, kd and line-loss changes to make once telemetry from this race is in.


      ### Feedback


      This is the first candidate, so there is no earlier race outcome or Evaluator
      Race Data to cite. The review rests on the public contract. Every field is inside
      its stated range: five sensors at x = -0.04 to 0.04 with y = 0.04 (within -0.06
      to 0.08), sensor_size 0.012, and wheel_track, wheel_radius, body_width, body_length
      and mass all in range. sensor_weights (-2, -1, 0, 1, 2) match the sensor order,
      so a positive signal steers left as the contract requires. line_loss ''last_direction''
      is a valid option. The candidate is valid and not obviously broken, which is
      the bar when nothing has raced. The stated speed target (about 1.5 m/s average)
      is an assumption from the contract''s 3 s limit, not a measured value, so the
      main unknowns are whether base_speed 1.6 keeps the robot on the line through
      the tighter bends and whether kp=3 with kd=0.15 oscillates. Read the race telemetry
      before choosing the next change. If the run does not complete because it is
      too slow, raise base_speed. If it leaves the track or shows line-loss events
      on the sharpest bend, lower base_speed or raise kd. If it completes with high
      steering_oscillation, raise kd before changing kp. Keep sensor geometry fixed
      for this first race so its result can be attributed to the controller.


      ### Requested changes


      - If the next race does not complete or progress stalls below full coverage,
      raise controller.base_speed (for example to 1.8) and keep the other fields as
      they are, so speed is the only variable.

      - If steering_oscillation is high or the robot drifts on the slalom, raise controller.kd
      (for example from 0.15 to 0.3) before changing kp, which the contract scales
      by 350 PWM per unit of turn.

      - If line_loss_events is above zero, test controller.line_loss ''search_right''
      or ''search_left'' only as a comparison, and keep the same kp, ki and kd so
      the change in line-loss count is attributable.


      - [Open this output](iteration-0/entityR1/versions/b01c61d19e0e4e57be9b179aecaffbff/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/2ed47f028b404eaca2a6de31e775be50/payload.json)'
