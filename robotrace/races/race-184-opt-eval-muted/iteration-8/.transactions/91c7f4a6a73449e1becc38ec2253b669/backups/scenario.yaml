  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: kp 2.0 softer steering
    notes: 'Iteration 6 geometry and kd 1.2 kept; kp lowered from 2.25 to 2.0 to test
      whether overshoot causes the slalom off-track exits (4 of 20 in iteration 6).
      Based on the slalom low-rms, low-line-loss pattern in the race data.


      ### Rationale


      Evidence: iteration 6 (kp 2.25, kd 1.2, base 1.2, sensors at +/-3 cm, 16 mm
      footprints) is the best design so far at 909.8. The oval finishes 20/20 at 2.05
      s with 0.15 line-loss events, and the s-bend finishes 20/20 at 2.38 s. The slalom
      finishes 16/20 and goes off track in 4 runs, with 0.2 line-loss events, rms
      0.012 m and steering oscillation 0.26. Slalom failures cost about 700 points
      each, so they dominate the remaining gap. The time term is worth only about
      60 points over 3 s, and each line-loss event costs about 15 points. Iteration
      6 showed that raising kd from 0.9 to 1.2 gave a small gain. Oscillation is still
      low (0.26), so the loop is not jittering. The slalom off-track exits happen
      with low rms error and few line losses, which points to overshoot or too aggressive
      turn response on the tightest bends rather than to a lost line. Change: kp 2.25
      to 2.0, a single-variable change, with kd 1.2, base 1.2, geometry and sensor
      layout unchanged from iteration 6. The lower proportional gain should soften
      the turn command on sharp bends and reduce overshoot. Expected result: slalom
      finish rate 0.85 or higher with a mean above 850, and the oval and s-bend close
      to iteration 6. Risk: if kp is too low, the robot undershoots corners and line
      loss rises, which would show as line_loss_events above 0.3 on the slalom. Hypotheses:
      (H1) overshoot causes the slalom off-track exits, so lowering kp reduces them
      without raising oscillation above 0.3; (H2) if kp 2.0 cuts finishes or raises
      line loss, the next step is kp back to 2.25 with ki 0.3 to remove steady-state
      drift on curves; (H3) completion_time on the s-bend and oval stays under 2.5
      s. Measurements wanted per track: completion, progress, completion_time, rms_error,
      max_error, line_loss_events, steering_oscillation, control_effort and noise_robustness,
      to separate overshoot from line loss.


      - [Open this output](iteration-7/entity0/versions/9b0c5e961b86455ea6261cafc51693d1/payload.json)

      - Based on: [entityR2A](iteration-7/entityR2A/versions/carried-211b5a226efdd455/payload.json)'
  - id: entityR1
    label: Softer kp 2.0 test
    notes: 'Approved a single-variable change from the best raced design (iteration
      6, 909.8): kp 2.25 to 2.0 with kd 1.2 held. The evidence is that higher kp (iteration
      5, kp 3.0) hurt slalom finishes, and the slalom failures look like overshoot
      with low oscillation and low line loss.


      ### Feedback


      Written before this candidate has raced, so no outcome is claimed. The best
      raced design is iteration 6 (909.8): kp 2.25, kd 1.2, base 1.2, sensors at +/-3
      cm with 16 mm footprints. It finishes the oval 20/20 and the s-bend 20/20. On
      the slalom it finishes 16/20, with 4 off-track ends, 0.2 line-loss events, rms
      0.012 m and steering oscillation 0.26. Iteration 3 (kd 0.9) had the same slalom
      finish count, so the kd increase was a small gain, not a fix. Iteration 5 showed
      that kp 3.0 with a wider spread cut slalom finishes to 14/20 and raised control
      effort to 8.0. Higher kp therefore looks like the wrong direction for the slalom.


      The candidate is valid and is a clean single-variable change from iteration
      6: kp 2.25 to 2.0, with kd 1.2, base 1.2, ki 0, geometry and sensor layout unchanged.
      Its line-loss and oscillation evidence is consistent with overshoot on the tightest
      bends, not a lost line. Oscillation is low, and line loss is at 0.2 per slalom
      run. The race will test whether softer proportional action cuts the slalom off-track
      exits. Approve now: the change is well grounded, and the remaining budget is
      better spent on the race and the next iteration than on a further review round.


      Read the next race this way. If the slalom finish rate reaches 0.85 or more
      and the slalom mean rises above iteration 6''s 829, keep kp 2.0. If the slalom
      line_loss_events rise above 0.3 or the finish rate falls, the proportional gain
      has become too weak to hold the line, so return to kp 2.25 and add a small ki
      (0.3) to remove steady-state drift on curves. Check max_error and line_loss_events
      on the failing slalom runs to tell overshoot from line loss.


      ### Requested changes


      - If slalom finishes reach 17/20 or more with line_loss_events at or below 0.25:
      keep kp 2.0 and kd 1.2, and consider a small base_speed rise from 1.2 to 1.25
      to recover completion time, since iteration 6 slalom finish times were 2.50
      s.

      - If slalom line_loss_events rise above 0.3 or finishes fall below 15/20: return
      controller.kp to 2.25 and set controller.ki to 0.3, since iteration 6 at kp
      2.25 gave 16/20 and kp 3.0 in iteration 5 was worse.

      - If steering_oscillation rises above 0.35 on any track: lower controller.kd
      from 1.2 toward 1.0 with kp 2.0 held, since iteration 3 oscillation was 0.21
      to 0.28 at kd 0.9 and iteration 5 was 0.28 to 0.30 at kd 1.2.


      - [Open this output](iteration-7/entityR1/versions/f5847fb5f7914a8294f2317ed71f6742/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/9b0c5e961b86455ea6261cafc51693d1/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-211b5a226efdd455/payload.json)'
