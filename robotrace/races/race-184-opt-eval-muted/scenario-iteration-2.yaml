  id: race-184-opt-eval-muted
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Smaller mass, wider
    notes: 'Iteration 2 raises sensor size to 16 mm to reduce line loss, lowers mass
      to 0.6 kg and body length to 0.14 m to cut yaw inertia, and reduces base speed
      to 1.2. The changes target the slalom, which had 1.25 line-loss events per run
      and 0 finishes; the oval margin (1.97 s) is kept.


      ### Rationale


      Evidence (iteration 1, 60 trials): the oval finishes 20/20 at 1.97 s with rms
      0.005 m, so the lower kp and higher kd stabilised the controller. The s-bend
      finishes 12/20 and goes off track in the other 8, and the slalom finishes 0/20
      with progress only 0.29, 1.25 line-loss events per run and runs off track. The
      slalom failure is line loss followed by drift, not oscillation: steering_oscillation
      there is 0.18 and rms is 0.020 m. The line-loss mechanism is the main problem,
      and it has three contributors: (1) the 12 mm sensors cover the 25 mm tape only
      when the robot is within about 18.5 mm of centre, so the sum of readings drops
      below 0.05 on sharp bends; (2) the robot is at 1.3 base speed on tight bends,
      which makes the drop-out more likely; (3) mass 0.8 kg and body length 0.16 m
      give yaw inertia that resists quick turns. Changes: (a) sensor_size 0.012 to
      0.016 m, so each sensor keeps seeing tape out to about 20.5 mm off centre and
      the line is less often lost; the readings also change more smoothly. (b) base_speed
      1.3 to 1.2. The oval has time margin (1.97 s against a 3 s limit), so the speed
      cut mainly helps the slalom and s-bend; a small time cost on those tracks is
      acceptable because finishing is worth 500 points. (c) mass 0.8 to 0.6 kg and
      body_length 0.16 to 0.14 m, which lowers yaw inertia (mass*(L^2+W^2)/12) so
      the robot turns faster into bends and recovers from errors sooner. Kept unchanged:
      kp 1.5, ki 0, kd 0.6, sensor weights and spread, wheel_track 0.14, wheel_radius
      0.03, sensor y 0.05, last_direction line loss, so the effect of the change is
      easy to read. Expected result: the oval stays at finish rate 1.0; the s-bend
      finish rate rises above 0.6; the slalom gets its first finishes or at least
      progress above 0.5 with line_loss_events below 0.5. Hypotheses to test next:
      (H1) the 16 mm sensors cut line_loss_events on the slalom by more than half;
      (H2) lower mass and inertia improve the slalom without adding oscillation (steering_oscillation
      stays below 0.3); (H3) base_speed 1.2 is still fast enough to finish the s-bend
      in under 3 s, with completion_time near 2.5 s. If the slalom still drifts, the
      next step is to widen the sensor spread to about plus or minus 3 cm, with the
      gain rescaled to match.


      - [Open this output](iteration-2/entity0/versions/4fdcac7d434c40108dec05501d5fad4c/payload.json)

      - Based on: [entityR2A](iteration-2/entityR2A/versions/carried-a5c2392468a96a32/payload.json)'
  - id: entityR1
    label: 'Approve: 16mm sensors'
    notes: 'Approved the iteration 2 candidate, which takes the best raced design
      (score 583) and widens sensors to 16 mm, drops base_speed to 1.2 and lowers
      mass and length to cut line loss on the slalom and s-bend. The change is valid
      and targets the failure that iteration 1 showed (1.25 line-loss events per slalom
      run), so racing it gives the most useful telemetry early in the race.


      ### Feedback


      Written before this candidate has raced, so I state no outcome for it. The best
      raced design so far is iteration 1 (score 583.13): the oval finishes 20/20 at
      1.97 s, the s-bend finishes 12/20 and the slalom 0/20, with 1.25 line-loss events
      per run on the slalom. The candidate is valid against the contract: sensor_size
      0.016 is an allowed option, mass 0.6 and body_length 0.14 are in range, and
      line_loss stays ''last_direction''. It changes four things at once: sensor_size
      0.012 to 0.016, base_speed 1.3 to 1.2, mass 0.8 to 0.6 and body_length 0.16
      to 0.14. Only the sensor change is aimed directly at the line-loss mechanism,
      so the race will not cleanly separate the effects of the mass and speed changes.
      Two risks: at 1.2 the s-bend''s 2.39 s mean finish time from iteration 1 would
      scale to roughly 2.6 s, which is still under 3 s but leaves little margin; and
      16 mm sensors at 10 mm spacing overlap heavily, so the signal may be less sharp
      on tight bends. Read the next race this way. If the s-bend finish rate rises
      above 0.6 and the slalom gets finishes or progress above 0.5, keep this geometry
      and approach the 3 s limit by nudging base_speed back toward 1.25. If the slalom
      still goes off track with line_loss_events above 0.5, widen the sensor spread
      (x = plus or minus 0.03 m, weights scaled to plus or minus 3) before changing
      kp again. If the oval or s-bend drops in finish rate with steering_oscillation
      above 0.3, revert mass to 0.8 kg and keep the sensor change.


      ### Requested changes


      - If the slalom still shows line_loss_events above 0.5 or goes off track: widen
      controller and geometry sensor spread to x = -0.03, -0.015, 0, 0.015, 0.03 m
      and rescale sensor_weights to -3, -1.5, 0, 1.5, 3, since iteration 1 slalom
      losses were 1.25 per run with 12 mm sensors.

      - If completion_time on the s-bend exceeds 2.8 s with finishes: raise controller.base_speed
      from 1.2 to 1.25 in small steps, keeping kp at 1.5 and kd at 0.6, since iteration
      1 s-bend mean finish was 2.39 s at base_speed 1.3.

      - If steering_oscillation rises above 0.3 on any track after the mass and length
      change: return geometry.mass to 0.8 and body_length to 0.16 while keeping sensor_size
      0.016, to isolate the sensor effect.


      - [Open this output](iteration-2/entityR1/versions/0661ed26b48f4e6ab99f21a1cf5eae06/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/4fdcac7d434c40108dec05501d5fad4c/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-a5c2392468a96a32/payload.json)'
