map:
  id: race-184-opt-eval-muted
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Smaller mass, wider
    notes: 'Iteration 2 raises sensor size to 16 mm to reduce line loss, lowers mass
      to 0.6 kg and body length to 0.14 m to cut yaw inertia, and reduces base speed
      to 1.2. The changes target the slalom, which had 1.25 line-loss events per run
      and 0 finishes; the oval margin (1.97 s) is kept.


      ### Rationale


      Evidence (iteration 1, 60 trials): the oval finishes 20/20 at 1.97 s with rms
      0.005 m, so the lower kp and higher kd stabilised the controller. The s-bend
      finishes 12/20 and goes off track in the other 8, and the slalom finishes 0/20
      with progress only 0.29, 1.25 line-loss events per run and runs off track. The
      slalom failure is line loss followed by drift, not oscillation: steering_oscillation
      there is 0.18 and rms is 0.020 m. The line-loss mechanism is the main problem,
      and it has three contributors: (1) the 12 mm sensors cover the 25 mm tape only
      when the robot is within about 18.5 mm of centre, so the sum of readings drops
      below 0.05 on sharp bends; (2) the robot is at 1.3 base speed on tight bends,
      which makes the drop-out more likely; (3) mass 0.8 kg and body length 0.16 m
      give yaw inertia that resists quick turns. Changes: (a) sensor_size 0.012 to
      0.016 m, so each sensor keeps seeing tape out to about 20.5 mm off centre and
      the line is less often lost; the readings also change more smoothly. (b) base_speed
      1.3 to 1.2. The oval has time margin (1.97 s against a 3 s limit), so the speed
      cut mainly helps the slalom and s-bend; a small time cost on those tracks is
      acceptable because finishing is worth 500 points. (c) mass 0.8 to 0.6 kg and
      body_length 0.16 to 0.14 m, which lowers yaw inertia (mass*(L^2+W^2)/12) so
      the robot turns faster into bends and recovers from errors sooner. Kept unchanged:
      kp 1.5, ki 0, kd 0.6, sensor weights and spread, wheel_track 0.14, wheel_radius
      0.03, sensor y 0.05, last_direction line loss, so the effect of the change is
      easy to read. Expected result: the oval stays at finish rate 1.0; the s-bend
      finish rate rises above 0.6; the slalom gets its first finishes or at least
      progress above 0.5 with line_loss_events below 0.5. Hypotheses to test next:
      (H1) the 16 mm sensors cut line_loss_events on the slalom by more than half;
      (H2) lower mass and inertia improve the slalom without adding oscillation (steering_oscillation
      stays below 0.3); (H3) base_speed 1.2 is still fast enough to finish the s-bend
      in under 3 s, with completion_time near 2.5 s. If the slalom still drifts, the
      next step is to widen the sensor spread to about plus or minus 3 cm, with the
      gain rescaled to match.


      - [Open this output](iteration-2/entity0/versions/4fdcac7d434c40108dec05501d5fad4c/payload.json)

      - Based on: [entityR2A](iteration-2/entityR2A/versions/carried-a5c2392468a96a32/payload.json)'
  - id: entityR1
    label: Lower kp, higher kd
    notes: 'Approved for the race: kp cut from 2.5 to 1.5, kd raised to 0.6, ki set
      to 0, base_speed 1.3, wheel_track 0.14 and sensors at y 0.05. This responds
      to iteration 0, where all 60 trials went off track with oscillation of 0.10
      to 0.14, and the design is valid, so it is worth racing for telemetry. The base_speed
      drop is the main risk and is flagged with follow-up changes.


      ### Feedback


      Written before this candidate has raced, so no outcome is claimed. The only
      race evidence is iteration 0 (60 trials, 0 finishes, every run ended off track).
      Progress was 0.24 on the oval, 0.17 on the s-bend and 0.12 on the slalom, with
      steering_oscillation of 0.10 to 0.14. The candidate''s own arithmetic holds:
      kp 2.5 with weights of +/-2 gives turn up to 5 units, about 1750 PWM of differential,
      so cutting kp to 1.5 (max turn about 3) directly targets the instability that
      iteration 0 showed. It is valid against the contract: sensor y = 0.05 is in
      range, wheel_track 0.14 is in range, kd 0.6 is in range, and the sensor spread
      and weights are unchanged, so the comparison with iteration 0 is clean. The
      main risk is that base_speed 1.3 is well below the roughly 1.5 m/s needed to
      finish in 3 s, and this change is stacked with the kp and kd changes, so the
      race will not separate their effects. Read the race this way. If runs stay on
      track and progress rises above about 0.5, keep kp 1.5 and kd 0.6, then raise
      base_speed in steps toward 1.5 to 1.6 to recover completion time. If runs still
      leave the track on the slalom while steering_oscillation is high, raise kd further
      before touching kp. If runs leave the track with low oscillation, the robot
      is too slow to hold the curve, so return base_speed to 1.5 and keep kp at 1.5.


      ### Requested changes


      - If runs stay on track with progress above 0.5: keep kp at 1.5 and kd at 0.6,
      and raise controller.base_speed in steps (1.3 to 1.5, then to 1.6) to recover
      finish time, since iteration 0 showed the 3 s limit needs about 1.5 m/s.

      - If the slalom still goes off track with steering_oscillation above 0.08: raise
      controller.kd from 0.6 toward 1.0 before changing kp, because iteration 0 showed
      oscillation of 0.10 to 0.14 that kd was meant to damp.

      - If runs go off track with low oscillation and progress stalled: return controller.base_speed
      to 1.5 and keep kp at 1.5, since the iteration 0 slalom failures came from overshoot
      and the 1.3 speed may be too slow to hold the curve.


      - [Open this output](iteration-1/entityR1/versions/58b6241a5ee7430c852e08cd353bac51/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/0eb0c44736e3430da054b2cc9e6cc6ae/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-5236c8bcb97bfe77/payload.json)'
