overrides:
  entities:
  - id: entity0
    label: Wider sensor spread
    notes: 'Widens the sensor array from +/-2 cm to +/-3 cm so the slalom keeps the
      line visible on larger errors, with kp and kd rescaled to keep the per-cm response
      the same. Based on iteration 2, where the oval and s-bend finished but the slalom
      lost the line about 1 time per run.


      ### Rationale


      Evidence: iteration 2 (best so far, 713.6) finishes the oval 20/20 and the s-bend
      19/20. The slalom finishes 0/20, ends off track in every run, and reaches only
      0.63 progress with about 1.05 line-loss events per run. Steering oscillation
      on the slalom is 0.31, so the loop is not jittering. The failure is the robot
      losing the line on the sharper bends and then drifting. The 5-sensor array spans
      only +/-2 cm, and a 16 mm footprint leaves the tape when the robot is more than
      about 2 cm off centre. Change: widen the sensor spread to +/-3 cm (x = -0.03,
      -0.015, 0, 0.015, 0.03), so the line stays under at least one sensor for larger
      errors. Weights must stay within +/-2 (the last attempt failed on -3), so I
      scale them to -2, -1, 0, 1, 2 for the new spread. That gives 0.67 weight per
      cm instead of 1.0, so I rescale the gains to keep the effective response per
      cm the same: kp 1.5 -> 2.25 (kp x weight-per-cm stays 1.5) and kd 0.6 -> 0.9
      (kd x weight-per-cm stays 0.6). ki stays 0. base_speed, mass, body, wheel track,
      sensor size and y are unchanged so the effect is isolated. Expected result:
      line_loss_events on the slalom fall below 0.5, slalom progress rises above 0.8,
      and the first slalom finishes appear. Oval and s-bend should stay near their
      current results because the per-cm gain is unchanged. Hypotheses: (H1) a wider
      spread removes most line-loss events on the slalom; (H2) the gain rescale keeps
      steering_oscillation near 0.3 or below; (H3) if the slalom still drifts, the
      next step is to lower base_speed to 1.1 on the slalom-like bends. Measurements
      wanted: completion, progress, completion_time, rms_error, max_error, line_loss_events,
      steering_oscillation, control_effort, noise_robustness, per track.


      - [Open this output](iteration-3/entity0/versions/84ddf0fd09d046fb8fbea75ff7bfbc6f/payload.json)

      - Based on: [entityR2A](iteration-3/entityR2A/versions/carried-6396593ca70f39ba/payload.json)'
  - id: entityR1
    label: 'Approve: wider sensor'
    notes: 'The candidate widens the sensor spread to +/-3 cm, rescales weights to
      +/-2, and rescales kp and kd to keep the per-cm response unchanged. It targets
      the slalom''s 1.05 line-loss events per run from iteration 2 (score 713.6),
      and it is approved because it is a targeted, valid change and there is little
      budget for further revision.


      ### Feedback


      Written before this candidate has raced, so I state no outcome for it. The best
      raced design so far is iteration 2 (score 713.62): the oval finishes 20/20 at
      1.85 s, the s-bend 19/20 at 2.18 s, and the slalom 0/20, with progress 0.63,
      1.05 line-loss events per run, and steering_oscillation 0.31. The slalom failure
      is line loss followed by drift, not jitter. Iteration 2''s 16 mm sensors at
      +/-2 cm spread cannot see the 25 mm tape once the robot is more than about 2
      cm off centre.


      The candidate addresses that directly. It widens the sensor spread to x = -0.03,
      -0.015, 0, 0.015, 0.03 m, keeps the weights inside the contract limit of +/-2
      (-2, -1, 0, 1, 2), and rescales the gains so the per-cm response is unchanged:
      kp 1.5 to 2.25 and kd 0.6 to 0.9. Oval and s-bend should therefore stay close
      to iteration 2, and the change is isolated to the slalom line-loss mechanism.
      base_speed, mass, body, wheel track, sensor size and sensor y are unchanged,
      so the race will show the effect of the spread alone.


      Read the next race this way. If slalom line_loss_events fall below 0.5 and slalom
      progress rises above 0.8, keep the spread and gains, and only then consider
      a small base_speed increase to recover completion time. If the slalom still
      goes off track with line_loss_events above 0.5, lower base_speed to 1.1 on the
      same geometry before changing gains again. If steering_oscillation rises above
      0.35 on any track, the rescaled kd is too high for the new spread, so return
      kd toward 0.7 while keeping kp at 2.25.


      ### Requested changes


      - If slalom line_loss_events remain above 0.5 or the slalom still goes off track:
      lower controller.base_speed from 1.2 to 1.1 with the widened spread, since iteration
      2 showed the slalom losing the line at 1.2 and iteration 1 showed drop-outs
      at 1.3.

      - If steering_oscillation rises above 0.35 on any track: lower controller.kd
      from 0.9 toward 0.7 and keep kp at 2.25, since iteration 2 oscillation was 0.25
      to 0.33 and the rescaled kd could add jitter.

      - If the race finishes the slalom cleanly with completion_time under 2.8 s:
      keep the geometry and gains, and raise controller.base_speed in small steps
      (1.2 to 1.25) to recover time, since iteration 2 finish times were under 2.2
      s on the s-bend.


      - [Open this output](iteration-3/entityR1/versions/385a84830bd34e6b8067e57ec8fd3527/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/84ddf0fd09d046fb8fbea75ff7bfbc6f/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-6396593ca70f39ba/payload.json)'
