  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Wider sensor spread
    notes: 'Widens the sensor array from +/-2 cm to +/-3 cm so the slalom keeps the
      line visible on larger errors, with kp and kd rescaled to keep the per-cm response
      the same. Based on iteration 2, where the oval and s-bend finished but the slalom
      lost the line about 1 time per run.


      ### Rationale


      Evidence: iteration 2 (best so far, 713.6) finishes the oval 20/20 and the s-bend
      19/20. The slalom finishes 0/20, ends off track in every run, and reaches only
      0.63 progress with about 1.05 line-loss events per run. Steering oscillation
      on the slalom is 0.31, so the loop is not jittering. The failure is the robot
      losing the line on the sharper bends and then drifting. The 5-sensor array spans
      only +/-2 cm, and a 16 mm footprint leaves the tape when the robot is more than
      about 2 cm off centre. Change: widen the sensor spread to +/-3 cm (x = -0.03,
      -0.015, 0, 0.015, 0.03), so the line stays under at least one sensor for larger
      errors. Weights must stay within +/-2 (the last attempt failed on -3), so I
      scale them to -2, -1, 0, 1, 2 for the new spread. That gives 0.67 weight per
      cm instead of 1.0, so I rescale the gains to keep the effective response per
      cm the same: kp 1.5 -> 2.25 (kp x weight-per-cm stays 1.5) and kd 0.6 -> 0.9
      (kd x weight-per-cm stays 0.6). ki stays 0. base_speed, mass, body, wheel track,
      sensor size and y are unchanged so the effect is isolated. Expected result:
      line_loss_events on the slalom fall below 0.5, slalom progress rises above 0.8,
      and the first slalom finishes appear. Oval and s-bend should stay near their
      current results because the per-cm gain is unchanged. Hypotheses: (H1) a wider
      spread removes most line-loss events on the slalom; (H2) the gain rescale keeps
      steering_oscillation near 0.3 or below; (H3) if the slalom still drifts, the
      next step is to lower base_speed to 1.1 on the slalom-like bends. Measurements
      wanted: completion, progress, completion_time, rms_error, max_error, line_loss_events,
      steering_oscillation, control_effort, noise_robustness, per track.


      - [Open this output](iteration-3/entity0/versions/84ddf0fd09d046fb8fbea75ff7bfbc6f/payload.json)

      - Based on: [entityR2A](iteration-3/entityR2A/versions/carried-6396593ca70f39ba/payload.json)'
  - id: entityR1
    label: 'Approve: 16mm sensors'
    notes: 'Approved the iteration 2 candidate, which takes the best raced design
      (score 583) and widens sensors to 16 mm, drops base_speed to 1.2 and lowers
      mass and length to cut line loss on the slalom and s-bend. The change is valid
      and targets the failure that iteration 1 showed (1.25 line-loss events per slalom
      run), so racing it gives the most useful telemetry early in the race.


      ### Feedback


      Written before this candidate has raced, so I state no outcome for it. The best
      raced design so far is iteration 1 (score 583.13): the oval finishes 20/20 at
      1.97 s, the s-bend finishes 12/20 and the slalom 0/20, with 1.25 line-loss events
      per run on the slalom. The candidate is valid against the contract: sensor_size
      0.016 is an allowed option, mass 0.6 and body_length 0.14 are in range, and
      line_loss stays ''last_direction''. It changes four things at once: sensor_size
      0.012 to 0.016, base_speed 1.3 to 1.2, mass 0.8 to 0.6 and body_length 0.16
      to 0.14. Only the sensor change is aimed directly at the line-loss mechanism,
      so the race will not cleanly separate the effects of the mass and speed changes.
      Two risks: at 1.2 the s-bend''s 2.39 s mean finish time from iteration 1 would
      scale to roughly 2.6 s, which is still under 3 s but leaves little margin; and
      16 mm sensors at 10 mm spacing overlap heavily, so the signal may be less sharp
      on tight bends. Read the next race this way. If the s-bend finish rate rises
      above 0.6 and the slalom gets finishes or progress above 0.5, keep this geometry
      and approach the 3 s limit by nudging base_speed back toward 1.25. If the slalom
      still goes off track with line_loss_events above 0.5, widen the sensor spread
      (x = plus or minus 0.03 m, weights scaled to plus or minus 3) before changing
      kp again. If the oval or s-bend drops in finish rate with steering_oscillation
      above 0.3, revert mass to 0.8 kg and keep the sensor change.


      ### Requested changes


      - If the slalom still shows line_loss_events above 0.5 or goes off track: widen
      controller and geometry sensor spread to x = -0.03, -0.015, 0, 0.015, 0.03 m
      and rescale sensor_weights to -3, -1.5, 0, 1.5, 3, since iteration 1 slalom
      losses were 1.25 per run with 12 mm sensors.

      - If completion_time on the s-bend exceeds 2.8 s with finishes: raise controller.base_speed
      from 1.2 to 1.25 in small steps, keeping kp at 1.5 and kd at 0.6, since iteration
      1 s-bend mean finish was 2.39 s at base_speed 1.3.

      - If steering_oscillation rises above 0.3 on any track after the mass and length
      change: return geometry.mass to 0.8 and body_length to 0.16 while keeping sensor_size
      0.016, to isolate the sensor effect.


      - [Open this output](iteration-2/entityR1/versions/0661ed26b48f4e6ab99f21a1cf5eae06/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/4fdcac7d434c40108dec05501d5fad4c/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-a5c2392468a96a32/payload.json)'
