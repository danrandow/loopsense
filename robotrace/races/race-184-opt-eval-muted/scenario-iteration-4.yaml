overrides:
  entities:
  - id: entity0
    label: Slower base speed 1.1
    notes: 'Iteration 3 geometry and gains are kept, and base_speed drops from 1.2
      to 1.1 to cut the 5 of 20 slalom off-track failures. The slalom finishes 15/20
      with low oscillation, so speed is the likely cause, and the time cost is small.


      ### Rationale


      Evidence from iteration 3 (score 893.6, best so far): the oval finishes 20/20
      at 2.04 s, the s-bend finishes 20/20 at 2.25 s, and the slalom finishes 15/20.
      The five slalom failures all end off track, and the slalom minimum score of
      170 shows these runs fail late. Steering oscillation (0.25) and rms error (0.012
      m) on the slalom are low, so the loop is stable. The remaining loss is off-track
      drift on the sharpest bends at base_speed 1.2. Expected value: each slalom failure
      costs roughly 700 points, and a 25% failure rate costs about 175 points on average.
      Change: base_speed 1.2 -> 1.1, a single-variable change. Geometry and gains
      stay as in iteration 3 so the effect is readable. Trade-off: completion time
      rises by roughly 0.1 to 0.2 s per track, which costs only about 2 to 4 points
      per run in the time term. Hypotheses: (H1) at 1.1 the slalom off-track rate
      falls from 25% to under 10%, raising the slalom mean above 900; (H2) oval and
      s-bend stay at 100% and 95 to 100% finish, with completion_time under 2.5 s
      on the slalom; (H3) if slalom failures persist at 1.1, the cause is not speed,
      and the next step is a sensor-spread or kd change, not a further speed cut.
      Measurements wanted per track: completion, completion_time, progress, line_loss_events,
      max_error, and steering_oscillation, to confirm whether off-track events now
      come from line loss or from overshoot.


      - [Open this output](iteration-4/entity0/versions/9910c299759a4c24b28dac50cf178ec2/payload.json)

      - Based on: [entityR2A](iteration-4/entityR2A/versions/carried-4de9a5b491120204/payload.json)'
  - id: entityR1
    label: 'Approve: base_speed 1.1'
    notes: 'Approved the single-variable change base_speed 1.2 to 1.1 on the iteration
      3 geometry and gains, which had 5 of 20 slalom runs leave the track. The evidence
      is iteration 3 (score 893.56), where the slalom had low oscillation and rms
      error, so speed is the most likely cause of the off-track drift.


      ### Feedback


      Written before this candidate has raced, so I state no outcome for it. The best
      raced design is iteration 3 (score 893.56): the oval finishes 20/20 at 2.04
      s, the s-bend 20/20 at 2.25 s, and the slalom 15/20, with all five slalom failures
      ending off track. Slalom steering_oscillation (0.25) and rms_error (0.012 m)
      are low, so the loop is stable and the remaining loss is off-track drift on
      the sharpest bends. The candidate is a single-variable change: base_speed 1.2
      to 1.1, with geometry and gains (kp 2.25, kd 0.9, ki 0, sensor spread ±3 cm,
      sensor_size 0.016, mass 0.6, body_length 0.14) held at iteration 3 values. Iteration
      1 and 2 showed the slalom losing the line at higher speeds, which supports trying
      a lower speed. The cost is small, since the oval and s-bend have time margin
      under 3 s. Read the race this way. If slalom finishes rise above 18/20 and the
      score beats 893.56, keep base_speed at 1.1. If slalom off-track events persist
      with base_speed at 1.1, speed is not the cause: the next change should be kd
      or the sensor spread, not a further speed cut. Check line_loss_events and max_error
      on the failing slalom runs to tell line loss from overshoot.


      ### Requested changes


      - If slalom off-track failures persist at base_speed 1.1 (iteration 3 showed
      5 of 20 failing at 1.2): leave speed as is and change controller.kd from 0.9
      toward 1.1 or the sensor spread, since speed is then not the cause.

      - If the slalom and s-bend finish at 1.1 with completion_time well under 3 s:
      raise controller.base_speed in small steps (1.1 to 1.15) to recover time, since
      iteration 3 oval and s-bend finish times were 2.04 and 2.25 s.

      - If steering_oscillation rises above 0.35 on any track at 1.1: lower controller.kd
      from 0.9 toward 0.7 with kp 2.25 held, since the iteration 3 slalom oscillation
      was 0.25.


      - [Open this output](iteration-4/entityR1/versions/084dfe986c35496da1f2923792bddef8/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/9910c299759a4c24b28dac50cf178ec2/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-4de9a5b491120204/payload.json)'
