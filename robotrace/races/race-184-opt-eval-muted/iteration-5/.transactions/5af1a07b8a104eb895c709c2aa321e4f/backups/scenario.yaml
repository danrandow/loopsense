map:
  id: race-184-opt-eval-muted
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Wider 4cm sensor array
    notes: 'Widens the sensor array from +/-3 cm to +/-4 cm and rescales kp to 3.0
      and kd to 1.2 to keep the per-cm response. Base speed returns to 1.2, the best
      setting, since the 1.1 test in iteration 4 lowered the score. The aim is to
      cut slalom line-loss off-track events.


      ### Rationale


      Evidence: iteration 3 (base_speed 1.2, sensors at +/-3 cm, kp 2.25, kd 0.9)
      scored 893.6, the best so far. Oval finished 20/20, s-bend 20/20, slalom 15/20.
      Iteration 4 cut base_speed to 1.1 and scored 879.5: the oval and s-bend were
      unchanged, and the slalom got worse (13/20 finished, 7 off-track). So speed
      is not the cause of the slalom failures, and base_speed should go back to 1.2.
      The slalom failures are off-track events after line loss on sharp bends, with
      low steering oscillation (about 0.25) and low rms error (about 0.012 m). The
      line is lost because the outermost sensors at +/-3 cm stop seeing tape when
      the robot drifts past about 2 cm. Change: widen the sensor array to +/-4 cm
      (x = -0.04, -0.02, 0, 0.02, 0.04), so the outer sensors still see tape at larger
      offsets. Weights stay at -2..2. Each weight now covers 0.5 weight per cm instead
      of 0.67, so I rescale the gains to keep the per-cm response: kp 2.25 -> 3.0
      (kp times weight-per-cm stays 1.5) and kd 0.9 -> 1.2 (stays 0.6). ki stays 0.
      base_speed returns to 1.2. Everything else (sensor size 16 mm, sensor y 0.05,
      wheel track 0.14, mass 0.6, body, line_loss last_direction) is unchanged, so
      the effect of the wider spread is isolated. Expected result: slalom line_loss_events
      drop below 0.25 and slalom finish rate rises above 0.85, lifting the slalom
      mean above 850. Oval and s-bend should stay near their iteration 3 values, because
      the per-cm gain is unchanged. Hypotheses: (H1) the wider spread removes most
      slalom off-track events; (H2) the gain rescale keeps steering_oscillation at
      or below 0.3; (H3) if the slalom still fails, the cause is overshoot on tight
      bends rather than line loss, and the next step is more kd or a lower kp, not
      more speed cuts. Measurements wanted per track: completion, completion_time,
      progress, line_loss_events, max_error, steering_oscillation, control_effort
      and noise_robustness, so I can separate line loss from overshoot.


      - [Open this output](iteration-5/entity0/versions/86554f5c36b54975ba994a9f323f5f89/payload.json)

      - Based on: [entityR2A](iteration-5/entityR2A/versions/carried-78f2e494f295ae58/payload.json)'
  - id: entityR1
    label: Wider sensors +/-4cm
    notes: 'Approves widening the sensor array to +/-4 cm with gains rescaled (kp
      3.0, kd 1.2) to keep the per-cm response, base_speed back at 1.2. Rests on iteration
      3 (893.6, best) showing slalom off-track failures, and iteration 4 showing speed
      cuts made the slalom worse.


      ### Feedback


      Written before this candidate has raced, so I state no outcome for it. The best
      raced design is iteration 3 (score 893.56): base_speed 1.2, sensors at ±3 cm,
      kp 2.25, kd 0.9. It finished the oval 20/20 and the s-bend 20/20, and the slalom
      15/20. Its slalom failures were all off-track (5 of 20), with slalom steering_oscillation
      of 0.25 and rms_error of 0.012 m. Iteration 4 cut base_speed to 1.1 and scored
      879.5, with the slalom worse (13/20 finished, 7 off-track). Speed is therefore
      not the cause of the slalom failures, and base_speed 1.2 is correct.


      The candidate is valid and well reasoned. The spread widens to ±4 cm with 16
      mm sensors, which are in range. The weights stay at -2..2. The gains are rescaled
      to keep the per-cm response: kp 2.25 to 3.0 gives 2.25×(2/3) ≈ 1.5 per cm, now
      3.0×0.5 = 1.5, and kd 0.9 to 1.2 gives 0.6 per cm, which holds. The change is
      single-axis (sensor spread, with gain compensation), so the race should isolate
      the line-loss mechanism. Oval and s-bend should stay near iteration 3, since
      the per-cm gain is unchanged.


      Read the race this way. If slalom line_loss_events fall and slalom finishes
      rise above 17/20 with the mean above 893, keep this design and consider a small
      base_speed rise (1.2 to 1.25) to recover completion time. If slalom off-track
      events persist while line_loss_events are low and max_error is high, the cause
      is overshoot on tight bends, not line loss. Then the next step is more kd (toward
      1.4), or a slightly lower kp (toward 2.6), not more speed cuts. If steering_oscillation
      rises above 0.35 on any track, the larger kp and kd are too aggressive for the
      wider spread, so return kd toward 1.0 and keep kp at 3.0.


      ### Requested changes


      - If slalom off-track failures persist with line_loss_events below 0.25 (overshoot
      rather than line loss): raise controller.kd from 1.2 toward 1.4 with kp 3.0
      held, because iteration 3 slalom oscillation was 0.25 and the failures came
      from drift on sharp bends.

      - If steering_oscillation rises above 0.35 on any track: lower controller.kd
      from 1.2 toward 1.0 and keep kp at 3.0, so the rescaled gains do not add jitter
      on the wider spread (iteration 3 oscillation was 0.21 to 0.28).

      - If the slalom finishes cleanly with completion_time under 2.8 s: keep the
      geometry and gains, and raise controller.base_speed from 1.2 to 1.25 in one
      step to recover time, since iteration 3 slalom mean finish time was 2.43 s and
      the oval/s-bend finish times were 2.04 s and 2.25 s.


      - [Open this output](iteration-5/entityR1/versions/cbe463628b594873bb73959482ba30e1/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/86554f5c36b54975ba994a9f323f5f89/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-78f2e494f295ae58/payload.json)'
