  entities:
  - id: entity0
    label: Slower, more damped run
    notes: 'Cuts base_speed from 1.3 to 1.15 and raises kd from 1.1 to 1.4 to give
      the steering more time on the tight bends and contain overshoot from kp 5.0.
      Based on iteration 3, where the s-bend and slalom still leave the line at max_error
      near 0.06 while oscillation stays moderate.


      ### Rationale


      Evidence from iteration 3 (score 484.4, up from 372.5): the robot still leaves
      the line on bends rather than oscillating. Oval finishes 14 of 20 with progress
      0.94. The s-bend improved to progress 0.79 with 5 of 20 finishes, but 15 runs
      still went off track. The slalom is unchanged at progress 0.53, ending off track
      in all 20 runs, with max_error around 0.064 and 1.0 line-loss events per run.
      steering_oscillation is moderate (0.29 to 0.39), so damping is not the limit.
      The kp increase from 4.0 to 5.0 and the sensor_size increase from 0.012 to 0.016
      both helped, since the s-bend progress rose and the oval finish rate rose. The
      remaining failures are on the tight bends, where the robot reaches the 0.06
      m limit before the correction catches up.


      Changes: (1) base_speed 1.3 to 1.15. This gives the steering more time per bend,
      which is hypothesis (b) from iteration 3. Oval time should rise from about 1.9
      s to about 2.3 s, still under the 3 s limit. (2) kd 1.1 to 1.4. The added damping
      is meant to contain the overshoot that the higher kp causes on the slalom''s
      alternating bends. Oscillation is well below the 0.5 warning level, so this
      is a safe step. (3) kp stays at 5.0, and geometry, ki, sensor_weights and line_loss
      are unchanged, so the effect of the speed and damping change can be read cleanly.


      Expected result: fewer off-track ends on the s-bend and slalom, with slalom
      progress above 0.7 and s-bend completion above 0.3. Oval completion may dip
      slightly because of the lower speed.


      Hypotheses to test: (a) if the slalom still leaves at max_error near 0.06 with
      speed reduced, the slalom needs wider sensor coverage (spread to about 0.04
      m, spacing 0.02 m, still under the 0.025 m tape width). (b) If oval completion
      falls below 0.6 because of the speed drop, base_speed should return to about
      1.25 with kd kept at 1.4. (c) If steering_oscillation rises above 0.5, kd is
      too high relative to kp and should go back to about 1.2.


      Next measurements: completion, progress, completion_time, max_error, rms_error,
      line_loss_events, steering_oscillation and control_effort per track, so I can
      separate the speed effect from the damping effect.


