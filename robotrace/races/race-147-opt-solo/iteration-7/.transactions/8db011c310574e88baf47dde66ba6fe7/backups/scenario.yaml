  entities:
  - id: entity0
    label: Sensors pushed to y=0.07
    notes: 'Moves the sensor row 1 cm further ahead (y 0.06 to 0.07 m), continuing
      the lead trend that lifted slalom finishes from 1 to 6 of 20 in iteration 6.
      All other values are held at iteration 6 so the effect can be isolated.


      ### Rationale


      Evidence from iteration 6 (score 790.9, best so far): oval finishes 20 of 20
      (progress 0.998), s-bend finishes 20 of 20 (progress 0.997), and slalom finishes
      6 of 20 (progress 0.76, 14 off-track ends, 0.75 line-loss events, max_error
      0.055). Moving the sensors forward from y=0.04 to y=0.06 gave the largest gain
      of any change so far: slalom progress rose from 0.53 to 0.76 and the slalom
      finish rate from 0.05 to 0.30. Steering oscillation stayed at 0.24 to 0.37,
      well below the 0.5 warning level, so damping is not the limit. Slalom control_effort
      rose to 15.2, which suggests the robot is still correcting hard on alternating
      bends. The sensor lead is therefore the lever that is working. Body width cannot
      widen the off-track limit (max(0.06, 0.0125 + body_width/4) stays at 0.06),
      and edge coverage was shown to be a small effect in iteration 5.


      Change: move all five sensors forward again, from y=0.06 to y=0.07 m (within
      the 0.08 limit), keeping the same x spread (-0.04 to +0.04 m), sensor size 0.016
      and spacing. This extends the phase lead on alternating bends so the correction
      starts earlier. Everything else is held at iteration 6 values (kp 5.0, kd 1.4,
      ki 0.01, base_speed 1.2, mass 0.6, wheel_track 0.12, wheel_radius 0.03, sensor
      weights, line_loss last_direction), so the change can be read cleanly against
      iteration 6.


      Expected result: slalom progress above 0.85 and slalom finishes rising to about
      10 of 20 or more, with oval and s-bend completion holding near 1.0. Hypotheses:
      (a) if steering_oscillation rises above about 0.5 on any track, the lead is
      overcorrecting and kd should go up to about 1.6 or kp down to about 4.6. (b)
      If slalom progress is flat versus iteration 6, lag is no longer the limit and
      the next step is more steering authority, either kp about 5.5 with kd 1.5 or
      a narrower wheel_track of about 0.11 m to raise turn rate per unit turn. (c)
      If oval or s-bend completion drops, the sensors are now too far ahead on the
      sharp bends and y should return to 0.06. Next measurements: completion, progress,
      completion_time, max_error, rms_error, line_loss_events, steering_oscillation
      and control_effort per track, so the lead effect can be separated from the gain
      effects.


