  entities:
  - id: entity0
    label: Slower, damped tracker
    notes: 'Cuts base_speed from 1.6 to 1.3 and raises kd from 0.3 to 0.6 with kp
      3.5, because every iteration-0 run left the track at about 0.06 m error with
      only 11-15% progress. Sensors are tightened and moved forward, and mass is reduced
      to 0.7 kg, to sharpen the response.


      ### Rationale


      Evidence from iteration 0: every development trial on all three tracks ended
      off_track (60 of 60 runs). Progress stalled at 0.11 to 0.15, and max_error sat
      at about 0.06 m, which is the off-track limit (max(0.06, 0.0125 + 0.12/4) =
      0.06). The robot is not failing through jitter, since steering_oscillation is
      small (0.07 to 0.14). It is failing by drifting off the line on bends and never
      recovering. The most likely causes are (1) base_speed 1.6 is too fast for the
      steering to follow the tape through the bends, and (2) kd 0.3 gives too little
      damping, so the correction overshoots. Changes: base_speed reduced from 1.6
      to 1.3 to give the steering more time per bend. kp raised slightly from 3.0
      to 3.5 for a firmer correction, and kd raised from 0.3 to 0.6 to damp the overshoot.
      ki is cut to 0.01 to avoid integral windup on the longer runs. The sensor spread
      is tightened to x = -0.03 to +0.03 m and moved forward to y = 0.04 m, so the
      sensors read the line closer to the axle with less lag. Mass is reduced to 0.7
      kg so the yaw inertia falls and the robot turns more easily. The other geometry
      is kept unchanged. Expected result: fewer off-track ends, with some runs finishing
      or progressing much further (progress above 0.5). Completion time may get longer
      because of the lower speed, so the finish is not yet guaranteed. Hypotheses
      to test: (a) if the runs still leave on the sharpest bends, kp needs to go up
      or base_speed down further; (b) if steering_oscillation rises above about 0.5,
      kd is too high; (c) if line_loss_events are above 1, the sensors are losing
      the tape at the edges and the spread needs widening. Next measurements: progress,
      completion, max_error and rms_error on each track, plus steering_oscillation
      and line_loss_events, so I can see where the robot leaves the line.


