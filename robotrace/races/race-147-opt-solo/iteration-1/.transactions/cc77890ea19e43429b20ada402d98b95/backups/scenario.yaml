  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'First candidate with no prior telemetry: five sensors across 0.08 m, symmetric
      weights, moderate speed (1.6) and kp 3 with light damping. It is a conservative
      baseline to establish completion, error and oscillation measurements for the
      next revision.


      ### Rationale


      Iteration 0 has no race telemetry, so this is a conservative baseline meant
      to finish the course and generate measurements. Geometry: five sensors spread
      across x = -0.04 to +0.04 m at y = 0.05 m ahead of the axle, so the line is
      seen by several sensors at once on bends. Sensor size 0.012 m is a middle value
      that covers the 25 mm tape without washing out the signal. Wheel track 0.12
      m and radius 0.03 m give a moderate turn authority, and mass 0.8 kg with a 0.12
      m body width keeps the off-track margin reasonable. Controller: symmetric weights
      [-1.5, -0.75, 0, 0.75, 1.5] make the signal sign follow the tape side (positive
      = left). base_speed 1.6 gives about 80 percent of full PWM, which should reach
      the roughly 1.5 m/s needed for the 3 s limit without being so fast that the
      robot leaves the line. kp 3.0 gives a strong steering response (about 1050 PWM
      per unit signal). kd 0.3 damps oscillation and ki 0.02 is small to avoid integral
      windup. line_loss ''last_direction'' keeps the robot turning toward the side
      it last saw the tape. Expected result: completion on the oval and s-bend, with
      the slalom possibly showing oscillation or some line loss. Hypotheses to test:
      (1) if steering_oscillation is high, kp is too large or kd too small; (2) if
      max_error approaches the off-track limit on sharp bends, base_speed is too high;
      (3) if completion_time is above 3 s, base_speed needs to go up. Next measurements:
      rms_error, max_error, completion_time, line_loss_events and steering_oscillation
      on each development track.


      - [Open this output](iteration-0/entity0/versions/7ba8f248f7a34d52a9c2155d5aea6cf4/payload.json)'
