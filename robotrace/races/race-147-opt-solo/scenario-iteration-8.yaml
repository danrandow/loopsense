  entities:
  - id: entity0
    label: Sensors y=0.08, kp 5.5
    notes: 'Moves the sensors to the forward limit (y=0.08) and raises kp to 5.5 with
      kd 1.5 for more steering authority. Iteration 7 showed the forward sensor shift
      still raises slalom progress (0.76 to 0.87), and oscillation (about 0.25) leaves
      headroom for the gain increase.


      ### Rationale


      Iteration 7 scored 827.5, the best so far. Oval and s-bend finished 20 of 20
      each, with steering_oscillation at 0.22 to 0.29. Slalom finished 9 of 20 (progress
      0.87, up from 0.76), so moving the sensors forward (y 0.04 to 0.06 to 0.07)
      is still the strongest lever. The gain per 0.01 m is falling (0.23 then 0.11
      progress), so lag is becoming less of the limit. Slalom still ends off-track
      in 11 runs with 0.9 line-loss events and control_effort 14.5, which means the
      robot is correcting hard on alternating bends and running out of authority.


      Changes: (1) Sensors moved forward from y = 0.07 to y = 0.08 m, the top of the
      allowed range, keeping the x spread (-0.04 to +0.04 m), sensor size 0.016 and
      spacing. This adds the last available phase lead. (2) kp raised from 5.0 to
      5.5 for more steering authority on the sharpest alternating bends, with kd raised
      from 1.4 to 1.5 to damp the extra overshoot. Oscillation is well below the 0.5
      warning level, so this is a safe step. base_speed 1.2, ki 0.01, sensor weights,
      mass, wheel geometry and line_loss are unchanged.


      Expected result: slalom progress about 0.9 or more with slalom finishes rising
      to about 12 of 20, while oval and s-bend stay near 1.0 completion. Hypotheses:
      (a) if oval or s-bend completion drops, the sensors are too far ahead for sharp
      bends, so y should return to 0.07. (b) If steering_oscillation rises above about
      0.5, kd should go to about 1.7. (c) If slalom progress is flat versus iteration
      7, the limit is turn rate, so the next step is a narrower wheel_track of about
      0.11 m. Next measurements: completion, progress, completion_time, max_error,
      rms_error, line_loss_events, steering_oscillation and control_effort per track.


