  entities:
  - id: entity0
    label: Wider sensor spread
    notes: 'Widens the sensor spread to +/-0.04 m (spacing 0.02 m) to cut slalom line-loss
      events, which were about one per run, and raises base_speed to 1.2 to recover
      oval finishes lost at 1.15. The iteration 4 evidence shows the slalom is the
      weakest track, with progress 0.42 and max_error about 0.064.


      ### Rationale


      Evidence from iteration 4 (score 528.4, the best so far): the robot still leaves
      the line rather than oscillating. Oval finishes 11 of 20 (progress 0.94). The
      s-bend finishes 12 of 20 (progress 0.96). The slalom ends off track in all 20
      runs at mean progress 0.42, with about 1.05 line-loss events per run and max_error
      around 0.064, above the 0.06 m limit. steering_oscillation is 0.23 to 0.39,
      well below the 0.5 warning level, so damping is not the limit. The step from
      speed 1.3 to 1.15 helped the s-bend (progress 0.79 to 0.96) but lowered oval
      completion (14 to 11 finishes), which suggests the speed is near a trade-off
      point. The slalom is the weakest track. Its alternating bends push the robot
      past the outer sensors, which lose the tape (about one loss per run), and then
      it drifts past the limit. Hypothesis (a) from iteration 4 points to wider sensor
      coverage. Changes: (1) Sensor spread widened from +/-0.035 m to +/-0.04 m, with
      spacing 0.02 m. This is still under the 0.025 m tape width, so the centre sensors
      keep overlapping coverage, and the edge sensors keep seeing tape at larger offsets,
      which should cut slalom line-loss events. (2) base_speed raised from 1.15 to
      1.2, a compromise to recover oval finishes while keeping most of the s-bend
      gain. Oval time should stay well under 3 s. kp 5.0, kd 1.4, ki 0.01, sensor_size
      0.016, mass 0.6, body and wheel geometry, sensor weights and line_loss are unchanged,
      so the effect of the wider spread can be read against iteration 4. Expected
      result: slalom line-loss events under 0.5 and slalom progress above 0.6, with
      oval and s-bend completion holding near iteration 4 levels. Hypotheses: (a)
      if slalom max_error still reaches 0.06 with line losses fixed, the limit is
      steering authority on the sharpest alternating bends, so kp should rise to about
      5.5 with kd 1.5. (b) If oval completion falls below 0.5, base_speed should return
      to 1.15 and the slalom gain should come from geometry alone. (c) If steering_oscillation
      rises above 0.5, kd is too high relative to kp. Next measurements: completion,
      progress, completion_time, max_error, rms_error, line_loss_events, steering_oscillation
      and control_effort per track, so the spread effect can be separated from the
      speed change.


