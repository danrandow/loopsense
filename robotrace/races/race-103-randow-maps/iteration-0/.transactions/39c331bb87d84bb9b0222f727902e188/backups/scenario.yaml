  entities:
  - id: entity0
    label: Baseline 5-sensor
    notes: 'A symmetric five-sensor array at 10 mm pitch with 12 mm footprints, lookahead
      at 0.06 m, on a 0.8 kg body with a 0.12 m track. Built from the contract alone,
      since no race or integration evidence exists yet at iteration 0.


      ### Rationale


      Iteration 0 has no race telemetry or integration feedback yet, so this proposal
      rests on the contract alone. Three geometry choices are argued from the simulator
      rules. (1) Sensor footprint: the tape is 25 mm wide, so a 12 mm sensor can sit
      fully on the tape when centred and still leave a clear reading gradient when
      the line is offset. The 8 mm option is noisier in relative terms and the 16
      mm option blurs the edge. (2) Sensor layout: five sensors spaced 10 mm apart
      across x = -0.02 to +0.02 cover the full tape width plus margin, so the line
      stays visible at moderate lateral offsets and the weighted-average signal is
      smooth. Placing them at y = +0.06, ahead of the axle, gives lookahead, which
      helps at speed because the wheels respond with lag. (3) Body and drivetrain:
      the race needs about 1.5 m/s average speed over roughly 4 to 5 m, so the robot
      needs to reach full voltage at base_speed 2 with headroom. A 0.8 kg mass with
      a 0.12 m wheel track and a 0.03 m wheel radius keeps yaw inertia low (about
      0.0037 kg·m²) so turns respond quickly, while the track width still gives a
      usable differential turn authority. Body width 0.12 m leaves the off-track limit
      at about max(0.06, 0.0125 + 0.03) = 0.06 m, which is the binding constraint
      and should be reviewed once RMS error data arrives. I expect a stable, completable
      platform, though not a tuned one. The main uncertainty is whether 0.06 m of
      allowed lateral error is enough margin on sharp bends, and the feedback request
      targets that.


      - [Open this output](iteration-0/entity0/versions/37ee3be282eb416f924a7d2374b536e7/payload.json)'
