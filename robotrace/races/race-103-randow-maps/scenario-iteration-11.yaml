  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 9 is the best design so far (score 209.98). Its geometry (seven 16
      mm sensors at x = -0.05 to +0.05 m, y = 0.04 m, mass 0.6 kg, wheel_track 0.10
      m, wheel_radius 0.03 m, body 0.18 x 0.12 m) produced zero line-loss events on
      all three development tracks, and the oval finished 8 of 20 seeds. Its remaining
      limit is max_error: 0.0552 m on the oval, 0.0601 m on the S-bend and 0.0624
      m on the slalom, against the fixed 0.06 m off-track limit. Body width cannot
      move that limit, and mass from 0.7 to 0.6 kg changed max_error by under 0.002
      m, so neither is a lever.


      The one geometry lever with a physical basis is wheel_track. The contract defines
      turn rate as the wheel speed difference divided by wheel_track, so a narrower
      track gives more yaw per PWM difference. Iteration 10 proposed 0.09 m for that
      reason. It was never raced, though, and the Integrator tuned the controller
      on the 0.10 m track. Narrowing raises the effective steering gain by about 11
      percent, so it could bring back the oscillation or line loss that iteration
      9 just cleared, and the 0.06 m limit might not improve. This is also the final
      iteration, and the final unseen-track race is scored with no later correction.
      A change I cannot test, on a track that was tuned for 0.10 m, is a poor risk.
      I therefore hold every geometry value at the iteration 9 design. That keeps
      the best-measured platform for the controller already tuned on it and gives
      the final race the most reliable base. The narrower-track test is recorded as
      an open hypothesis in the feedback request.


      Expected result: a score close to iteration 9 (about 200 or more), with line_loss_events
      staying at 0 on all tracks. The measurements requested will show whether the
      bend max_error is still near 0.06 m, which would be the evidence needed for
      the wheel_track test in any later work.


      - [Open this output](iteration-11/entity0/versions/7c398f9d15f7410b8dc2be00708a5927/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-509d6a2f71e09afd/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-7b7ba39c31069d90/payload.json)'
  - id: entity1
    label: 'Final: iteration 9'
    notes: 'Unchanged iteration 9 geometry and controller (score 209.98, zero line
      loss on all tracks). Keeping the best measured package avoids an untested change
      in the final unseen-track race.


      ### Rationale


      Iteration 9 is the best measured design (209.98). It had zero line-loss events
      on the oval, S-bend and slalom, and the oval finished 8 of 20 seeds (mean 1.67
      s). Its remaining limit is max_error: 0.0552 m on the oval, 0.0601 m on the
      S-bend and 0.0624 m on the slalom, against the fixed 0.06 m off-track limit.
      The Builder holds the iteration 9 geometry exactly (wheel_track 0.10 m), so
      I keep it unchanged. The controller I used in iteration 9 (kp 2.2, ki 0, kd
      0.35, base_speed 1.1, outer-scaled weights, last_direction) is the one that
      cleared line loss on all tracks, and iteration 8 to 9 showed that raising kd
      from 0.30 to 0.35 removed the residual S-bend and slalom events. Any further
      gain change is untested, and this is the final race, which is scored on unseen
      track with no later correction. The iteration 9 gains therefore stay as they
      are. The iteration 9 trigger was that if steering oscillation rose well above
      0.23 on the oval, kp should be lowered first. The oval value was 0.228, so no
      change is triggered. The package is identical to iteration 9, so the final race
      tests the same measured platform.


      - [Open this output](iteration-11/entity1/versions/b85c24229ecc47d6891afa2521ae0f37/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/7c398f9d15f7410b8dc2be00708a5927/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-7b7ba39c31069d90/payload.json)'
  - id: entityR1
    label: Narrow track or hold
    notes: 'Feedback offers wheel_track 0.09 m as the one remaining lever, justified
      by the contract''s turn-rate formula and iteration 9 bend max_error of 0.060
      to 0.062 m. It warns that the narrower track raises effective gain, so kp should
      be lowered if oscillation rises.


      ### Feedback


      Written before this candidate has raced. Iteration 9 (the same geometry, controller
      and gains as this package) raced with zero line-loss events on the oval, S-bend
      and slalom, against 0.05 to 1.0 events in iterations 5 to 8. Oval finished 8
      of 20 seeds, with steering_oscillation 0.228. Max_error stayed at 0.0552 m on
      the oval, 0.0601 m on the S-bend and 0.0624 m on the slalom, all just above
      or at the 0.06 m limit. Iteration 8 to 9 showed that raising kd from 0.30 to
      0.35 cleared the residual bend losses. I have kept the controller unchanged,
      since the Integrator''s rule is to change gains only when oscillation rises
      well above 0.23 on the oval, and it did not. The one geometry lever left is
      wheel_track. Per the contract''s turn-rate formula, a narrower track gives more
      yaw per PWM difference, so 0.09 m is the physically motivated direction, though
      it has not been raced. The Integrator cannot test a change after this race,
      so the choice rests on the evidence above. If the final race keeps line loss
      at 0 and max_error at or above 0.06 m on the bends, the bend authority is the
      limit. If line loss returns, the controller was tuned to the 0.10 m track, and
      the narrower track raises effective gain by about 11 percent, so the change
      would be risky.


      ### Requested changes


      - Set wheel_track to 0.09 m only if the team is willing to accept an untested
      change on the final race. Iteration 9 has max_error of 0.0601 m on the S-bend
      and 0.0624 m on the slalom, so yaw authority is the stated limit, and the contract
      formula says a narrower track adds yaw per PWM difference.

      - If wheel_track 0.09 m is used, keep kp 2.2 and kd 0.35 unchanged. Iteration
      9 shows oscillation at 0.228 on the oval, and the 11 percent rise in effective
      gain could push it over the 0.23 trigger. Lower kp first, not geometry, if that
      happens.

      - Keep sensor_size 0.016 and the seven sensors at x = -0.05 to +0.05 m and y
      = 0.04 m. Iterations 3 to 9 show this span clears oval line loss and keeps S-bend
      and slalom losses at zero in iteration 9, so no sensor change is supported.


      - [Open this output](iteration-11/entityR1/versions/b85c24229ecc47d6891afa2521ae0f37/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/7c398f9d15f7410b8dc2be00708a5927/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-7b7ba39c31069d90/payload.json)'
