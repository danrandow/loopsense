map:
  id: race-103-randow-maps
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: 16 mm sensor footprint
    notes: 'Keeps the iteration 1 seven-sensor layout and changes only the footprint
      from 12 mm to 16 mm, to clear the line loss seen on the oval and S-bend. The
      12 mm footprint loses the tape at about 0.019 m offset, and the Integrator''s
      feedback reported line loss on those tracks.


      ### Rationale


      Iteration 1 raced zero finishes. Every trial ended off_track, with line_loss_events
      of 2 on the oval and 1 on the S-bend and slalom, and max_error of about 0.064
      to 0.068 m. The off-track limit is max(0.06, 0.0125 + body_width/4). With body_width
      0.12 m that is 0.06 m, and widening the body cannot raise it above 0.06 m within
      the contract, so body_width stays at 0.12 m.


      The Integrator''s feedback sets a clear order. Line loss is still occurring
      on the oval and S-bend, so the footprint rule applies before any mass change.
      The 12 mm footprint is too small: a sensor only sees tape while the centre offset
      is below about 0.0185 m, and the seven-sensor span covers offsets only to about
      0.0365 m. Increasing the footprint to 16 mm (half-size 8 mm) widens the detection
      window for each sensor and makes the line visible at larger offsets. At 10 mm
      pitch the adjacent footprints overlap, which should give a smoother weighted
      signal. Keeping the sensor positions, body, wheel_track (0.10 m) and mass (0.7
      m/kg) fixed isolates the footprint effect on the next race. Mass reduction to
      0.6 kg is held back until line loss is confirmed gone; if max_error still nears
      0.06 m with no line loss, that is the next lever.


      Expected result: line_loss_events falls to 0 or near 0 on the oval and S-bend,
      max_error stays below 0.06 m, and the first completions appear. Hypothesis H1
      (footprint sets the detection window) is now the main test. If line loss persists
      at 16 mm, the sensor span or y position is the next thing to change.


      - [Open this output](iteration-2/entity0/versions/15c55526c684465b82dcb7ad8d75a897/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-10f64a3ca289d7a5/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-e20c78d20dd66f68/payload.json)'
  - id: entity1
    label: 16mm footprint, damped PD
    notes: 'Keeps the Builder''s 16 mm footprint and seven-sensor array, and lowers
      kp to 2.5, raises kd to 0.20 and base_speed to 1.3. Iteration 1 showed kp 3.0
      raised steering oscillation to 0.186 and max_error to 0.068 m, and 16 mm widens
      each sensor''s detection window.


      ### Rationale


      Iteration 1 raced zero finishes. All 60 trials ended off_track, with line_loss_events
      of 2 on the oval and 1 on the S-bend and slalom, and max_error of 0.064 to 0.068
      m. That is worse than iteration 0 (max_error about 0.061 m), and steering_oscillation
      rose from about 0.075 to 0.186 when kp went from 2.5 to 3.0 and base_speed fell.
      So the higher kp is likely overshooting and adding oscillation, not helping.
      The Builder''s iteration 2 geometry changes only the sensor footprint, from
      12 mm to 16 mm, so I keep the sensor positions, the 0.10 m track, the 0.7 kg
      mass and body_width 0.12 m fixed. A 16 mm footprint (half-size 8 mm) lets each
      sensor see tape out to a centre offset of about 20.5 mm, against about 18.5
      mm at 12 mm, and it makes the adjacent footprints overlap more at 10 mm pitch.
      That should reduce the line-loss events on the oval and S-bend. For the controller
      I keep the outer-weighted sensor scaling, which is monotonic across the span,
      but reduce kp from 3.0 to 2.5 to damp the oscillation seen in iteration 1, and
      raise kd from 0.15 to 0.20 to add damping against the short lookahead at y =
      0.04 m. I reduce base_speed from 1.4 to 1.3 so the robot has more time to correct
      on the bends where max_error peaked. ki stays at 0.05 to remove small motor-mismatch
      bias and remains well inside its limit. line_loss stays at last_direction. Expected
      result: line_loss_events at or near 0, max_error below 0.06 m, and the first
      completions on the oval or S-bend. Whether the lower speed still allows a 3
      s finish is untested, so the next race''s completion_time will show it.


      - [Open this output](iteration-2/entity1/versions/ffb477a1510f4d16bf9d348ae62fb684/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/15c55526c684465b82dcb7ad8d75a897/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-e20c78d20dd66f68/payload.json)'
  - id: entityR1
    label: Next-race change rules
    notes: 'Feedback written before the race: keep 16 mm and move the sensors forward
      if line loss persists, cut mass to 0.6 kg if max_error stays near 0.06 m, and
      raise wheel_radius if completions run slow. Each rule is tied to iteration 0
      and 1 telemetry.


      ### Feedback


      Written before this candidate has raced. Iteration 1 (the only raced design
      with the seven-sensor array) raced zero finishes. Its line_loss_events were
      2 on the oval and 1 on the S-bend and slalom, max_error was 0.064 to 0.068 m,
      and steering_oscillation rose to 0.186 from 0.075 in iteration 0 when kp went
      from 2.5 to 3.0. The Integrator therefore lowers kp to 2.5 and raises kd to
      0.20 to damp the oscillation, and lowers base_speed to 1.3 so the robot can
      correct on bends. The 12 mm footprint is the common factor in the line-loss
      events, since a 12 mm sensor sees tape only to about 18.5 mm offset, and that
      is why 16 mm is the requested change. Decide the next geometry from what the
      next race shows. If line_loss_events is still above zero on the oval or S-bend
      with 16 mm footprints, widen the span or move y forward before changing mass,
      because the footprint alone did not close the gap. If line_loss_events is zero
      but max_error still approaches 0.06 m, reduce mass to 0.6 kg rather than changing
      body_width, because body_width cannot move the off-track limit above 0.06 m.
      If runs complete but completion_time exceeds 2.5 s, test wheel_radius 0.035
      m for more top speed, since the lower base_speed may be slowing the robot.


      ### Requested changes


      - Keep sensor_size at 0.016 m with the seven sensors at x = -0.03 to +0.03 m
      and y = 0.04 m. If line_loss_events stays above zero on the oval or S-bend,
      move the sensors forward to y = 0.06 m or widen the span, since iteration 1
      showed a 12 mm footprint loses the tape at offsets of about 0.019 m and above.

      - If max_error still approaches 0.06 m with line_loss_events at zero, reduce
      mass to 0.6 kg, because iteration 1 showed max_error of 0.068 m from controller
      lag and body_width cannot raise the 0.06 m off-track limit.

      - If runs complete but completion_time exceeds 2.5 s, test wheel_radius 0.035
      m, because the Integrator lowered base_speed to 1.3 and top speed now limits
      the finish time.


      - [Open this output](iteration-2/entityR1/versions/ffb477a1510f4d16bf9d348ae62fb684/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/15c55526c684465b82dcb7ad8d75a897/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-e20c78d20dd66f68/payload.json)'
