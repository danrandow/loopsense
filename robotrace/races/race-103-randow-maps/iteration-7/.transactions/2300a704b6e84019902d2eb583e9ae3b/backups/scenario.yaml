map:
  id: race-103-randow-maps
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Hold geometry, no edit
    notes: 'Keeps the iteration 5 body and sensor layout unchanged, because the last
      race still logged S-bend and slalom line loss with that geometry, which the
      rule treats as non-geometric. The +/-0.05 m, 16 mm sensor span already covers
      about +/-0.07 m of offset, so the loss should lie in the controller or start
      pose.


      ### Rationale


      The last race (iteration 5 design, scored 53.69) gave oval line_loss_events
      0, but S-bend and slalom each logged 1.0 line-loss event, with max_error about
      0.062 to 0.066 m and progress of 0.16 and 0.11. The authorised feedback rule
      says that if S-bend and slalom line loss is still 1 with geometry unchanged,
      the loss is not geometric, so geometry should not be edited. The geometry evidence
      supports this. With sensors at x = -0.05 to +0.05 m, 16 mm footprints and a
      0.0205 m detection radius per sensor (half tape width plus half footprint),
      the seven sensors overlap at 0.015 to 0.02 m pitch. Their combined coverage
      spans about +/-0.07 m of centre offset, which is beyond the 0.06 m off-track
      limit, so the array should not drop below the 0.05 sum threshold at any offset
      the robot can reach while still on the course. Mass 0.7 to 0.6 kg changed max_error
      and progress by under 0.002 m and 0.01, and body_width cannot move the 0.06
      m limit (max(0.06, 0.0125 + bw/4) stays at 0.06 m for bw of 0.12 m). The wheel_track
      0.12 m change is only triggered if line loss is zero on all three tracks, which
      is not the case. The wheel_radius change is only triggered if runs complete,
      which they have not. I therefore hold the iteration 5 geometry exactly, so this
      race isolates the controller and start-pose work. Expected result: the score
      stays near 54 to 55 unless the Integrator clears the S-bend and slalom losses,
      in which case progress on those tracks should rise sharply.


      - [Open this output](iteration-7/entity0/versions/562a0c5aee5649fcb44c1c3ee9eac0dc/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-66b3fb0ed39096ac/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-5fb3b63fb613f32c/payload.json)'
  - id: entity1
    label: Slower entry, same
    notes: 'Geometry held at the iteration 4 values, with base_speed lowered from
      1.3 to 1.2 to test whether bend entry speed causes the S-bend and slalom line
      losses. Iteration 0 and iteration 1 speed comparisons and the persistent loss
      in iteration 4 are the evidence.


      ### Rationale


      Iteration 4 (mass 0.6 kg) scored 54.98, slightly below iteration 3 (55.27).
      Mass 0.7 to 0.6 kg changed max_error only from about 0.064 to 0.063 m, so mass
      is not a meaningful lever. The oval line loss stayed at 0 from the +/-0.05 m
      span, but the S-bend (0.95 events) and slalom (1.0 event) still lose the line
      on every trial. Those losses are on sharp bends, where the robot overshoots
      and the sum of readings drops below 0.05. Geometry is unchanged from iteration
      4, as the Builder''s intent and decision rules require, so the controller is
      the variable that changes. Iteration 0 at base_speed 1.8 gave the worst S-bend
      progress (0.04), and iteration 1 at 1.4 gave 0.165. That suggests entry speed
      into bends drives the overshoot. I therefore lower base_speed from 1.3 to 1.2
      to give more correction time on the bends. I keep kp 2.5, kd 0.2 and ki 0.05,
      because kp 3.0 raised oscillation to 0.186 in iteration 1, and keep last_direction
      line-loss handling so the tested change is limited to speed. Expected result:
      if speed-into-bend is the cause, S-bend and slalom line_loss_events fall toward
      0 and progress rises on those tracks. The score may still stay near 55 if the
      loss is caused by the start pose, which this package does not change. The cost
      is a slower run, so completion_time may rise.


      - [Open this output](iteration-5/entity1/versions/8d68bd33beca4bb1b292f415f2bbe2f2/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/eec91fd35d9d49d3a0933a7a636ddcad/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-e24ab364cca28d26/payload.json)'
  - id: entityR1
    label: Turn authority then mass
    notes: 'Feedback tells the Builder to change geometry only if the next race shows
      the loss cleared but max_error still near 0.06 m. Changes are wheel_track 0.12
      m, then mass 0.5 kg, then wheel_radius 0.035 m, each tied to iterations 3 and
      4.


      ### Feedback


      Written before this candidate has raced. Iteration 4 (mass 0.6 kg, +/-0.05 m,
      16 mm, base_speed 1.3) had oval line loss at 0, but S-bend at 0.95 events and
      slalom at 1.0 event, with max_error about 0.063 m and progress 0.16 and 0.11.
      Iteration 3 at 0.7 kg gave nearly the same result, so mass has little effect
      on overshoot. Iteration 0 at base_speed 1.8 gave the worst S-bend progress (0.04)
      and iteration 1 at 1.4 gave 0.165, so bend entry speed looks like a controller
      lever, not a geometric one. Decide the next geometry from the next race as follows.
      If S-bend and slalom line_loss_events are still 1 with geometry unchanged, the
      loss is not geometric, so do not edit geometry; the Integrator will check line_loss
      handling and the start pose. If line_loss_events is 0 on all three tracks but
      max_error still approaches 0.06 m, the bends need more turn authority, so test
      wheel_track 0.12 m. If max_error stays near 0.06 m with no line loss after that,
      test mass 0.5 kg. If runs complete but completion_time exceeds 2.5 s, test wheel_radius
      0.035 m for more top speed.


      ### Requested changes


      - If line_loss_events is 0 on all three tracks but max_error still approaches
      0.06 m, set wheel_track to 0.12 m. Iterations 3 and 4 showed the 0.06 m off-track
      limit cannot move with body_width, and this gives more differential turn authority
      for the bends.

      - If max_error stays near 0.06 m with no line loss after the wheel_track change,
      set mass to 0.5 kg. Iteration 4 showed 0.7 to 0.6 kg moved max_error only from
      0.064 to 0.063 m, so test a larger step before concluding mass is irrelevant.

      - If runs complete but completion_time exceeds 2.5 s, set wheel_radius to 0.035
      m for more top speed. Progress is the current limit (0.11 to 0.17), so do not
      change wheel_radius before runs finish.


      - [Open this output](iteration-5/entityR1/versions/8d68bd33beca4bb1b292f415f2bbe2f2/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/eec91fd35d9d49d3a0933a7a636ddcad/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-e24ab364cca28d26/payload.json)'
