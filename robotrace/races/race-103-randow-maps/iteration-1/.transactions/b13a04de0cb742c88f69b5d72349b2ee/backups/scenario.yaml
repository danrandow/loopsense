map:
  id: race-103-randow-maps
  schema: v0.2
  scenario: Iteration 1
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 0.
dimensions:
  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Wide 7-sensor, narrow
    notes: 'Widens the array to seven sensors at x = +/-0.03 m, moves it to y = 0.04
      m, narrows the track to 0.10 m and lightens to 0.7 kg. Iteration 0 went off
      track at max_error 0.061 m on every run, and body width cannot raise the 0.06
      m limit, so the change targets sensor recovery and turn authority.


      ### Rationale


      Iteration 0 raced zero finishes. All 60 trials ended off_track on every track,
      with max_error about 0.061 m against a 0.06 m limit, one line-loss event per
      run, and progress of only 0.04 to 0.12. The robot drifts off the line on the
      first bends and never recovers. Three corrections follow from the contract.


      (1) Body width cannot relieve the limit. The off-track limit is max(0.06, tape_half_width
      + body_width/4) = max(0.06, 0.0125 + body_width/4). Across the allowed range
      the second term tops out at 0.0575 m at body_width 0.18, so the limit stays
      at 0.06 m. The Integrator''s request to widen body_width to 0.14 m for a 0.065
      m limit is not achievable, so I am not making that change. The limit is fixed
      at 0.06 m, and the fix must come from keeping the robot closer to the line.


      (2) Sensor span is too narrow for recovery. With 12 mm footprints (half-size
      6 mm) and a 12.5 mm tape half-width, a sensor sees tape only while the centre
      offset is below about 0.0185 m. The current outer sensors at x = +/-0.02 therefore
      lose the line at about 0.019 m, well before the 0.06 m failure. I widen the
      array to x = -0.03 to +0.03 at 10 mm pitch, which needs 7 sensors (the contract
      maximum). This keeps the line visible to about 0.0365 m offset and gives the
      controller time to correct.


      (3) Lookahead and track width. The sensors at y = 0.06 m add phase lag, which
      the Integrator reports as hard to tune with kd. I move them to y = 0.04 m to
      reduce lag while keeping some lookahead. Yaw rate is (wheel speed difference)/wheel_track,
      so for the same PWM differential a narrower track turns faster. I reduce wheel_track
      from 0.12 m to 0.10 m to add turn authority, which the previous feedback had
      attributed to a wider track. I also reduce mass from 0.8 kg to 0.7 kg to speed
      acceleration and cut yaw inertia while keeping enough traction.


      Expected result: max_error should fall below 0.06 m on the oval and S-bend,
      line_loss_events should drop to 0 or near it, and at least some runs should
      finish. Hypothesis H1 (12 mm footprint gives a clean gradient) is still open.
      H2 (off-track limit is the binding failure) is supported by the data. H3 (mass
      0.8 kg is enough) is revised: a lighter robot with a narrower track should be
      tested.


      - [Open this output](iteration-1/entity0/versions/9193dee448d04eb3987983c11ea463fa/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-026b22ef48733177/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-3c6e6e60cbdff056/payload.json)'
  - id: entity1
    label: Seven-sensor robot
    notes: 'Complete robot on the 7-sensor, 0.10 m track geometry with outer-weighted
      steering, base_speed 1.4 and kp 3.0. Iteration 0 drifted off the line at 0.061
      m on every track, so the controller now gives more correction and lower speed.


      ### Rationale


      Evidence from iteration 0: all 60 trials ended off_track on every track, with
      max_error about 0.061 m, one line-loss event per run and progress of only 0.04
      to 0.12. The robot leaves the line early and never recovers, so the first priority
      is keeping it on the line, not speed. Geometry follows the Builder''s iteration
      1 proposal: seven sensors at 10 mm pitch from x = -0.03 to +0.03 m at y = 0.04
      m, 12 mm footprint, wheel_track 0.10 m, wheel_radius 0.03 m, body_width 0.12
      m (the off-track limit is 0.06 m regardless), mass 0.7 m, body_length 0.18 m.
      Controller: sensor_weights are the normalised sideways positions scaled to +/-1.5
      at the outer sensors, [-1.5, -1.0, -0.5, 0, 0.5, 1.0, 1.5], so the signal stays
      monotonic across the 0.03 m span and the outer sensors can respond before the
      line is lost. The lookahead is shorter (y = 0.04 m) than iteration 0 (y = 0.06
      m), which the Builder moved to reduce phase lag, so kd is kept small (0.15)
      to damp without amplifying noise. kp is raised to 3.0 from 2.5 so a moderate
      offset produces enough correction on the narrower track (about 1050 PWM counts
      of wheel difference at a full signal of 1.0). ki is 0.05, a small value to remove
      any steady bias from the motor mismatch while keeping the integral well inside
      its +/-2 limit. base_speed is reduced to 1.4 from 1.8 because iteration 0 failed
      early, so lower speed gives the controller more time per bend; this still gives
      roughly 1.1 m/s at full throttle, and the Builder''s feedback allows an increase
      later if completion is reached. line_loss is last_direction, as the baseline.
      Expected: fewer or no line-loss events and max_error below 0.06 m, with the
      first completions on the S-bend or oval if the lower speed and better sensing
      hold. Whether the speed is high enough for a 3 s finish is still untested.


      - [Open this output](iteration-1/entity1/versions/8d0d337d30ce4d819debc61814368ae0/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/9193dee448d04eb3987983c11ea463fa/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-3c6e6e60cbdff056/payload.json)'
  - id: entityR1
    label: Span and footprint next
    notes: 'Feedback on the seven-sensor, 0.10 m track proposal, with three branches
      tied to iteration 0 evidence: footprint, mass and wheel radius. The branch taken
      depends on whether line loss persists, max_error stays near 0.06 m, or completion
      is too slow.


      ### Feedback


      Written before this candidate has raced. Iteration 0 (the only raced design)
      gave zero completions: every trial ended off_track with max_error about 0.061
      m and one line-loss event, so the robot lost the line early on every track.
      This is the basis for the widened seven-sensor array and the narrower 0.10 m
      track. The Integrator had to scale the sensor weights to the wider span (outer
      weights 1.5) so the signal stays monotonic, and to lower base_speed to 1.4 and
      raise kp to 3.0 to give the controller more correction per bend. The shorter
      lookahead at y = 0.04 m was chosen so kd does not add too much lag, which the
      iteration 0 feedback reported as hard to tune at y = 0.06 m. Decide the next
      geometry from what the next race shows. If line_loss_events is still above zero
      on the oval or S-bend, the sensor footprint is too small to bridge the gap,
      so try sensor_size 0.016 before changing the span again. If max_error still
      approaches 0.06 m with no line loss, the limit is being reached through controller
      lag, not sensor coverage, so reduce mass or base_speed rather than widening
      body_width, which cannot move the limit above 0.06 m. If runs complete but completion_time
      exceeds 2.5 s, increase top speed by moving to wheel_radius 0.035 m.


      ### Requested changes


      - If line_loss_events stays above zero on the oval or S-bend with seven sensors,
      test sensor_size 0.016 at the same x = -0.03 to +0.03 m positions, since iteration
      0 showed the 12 mm footprint loses the tape at moderate offsets.

      - If max_error still approaches 0.06 m with no line loss, reduce mass to 0.6
      kg rather than widening body_width, because iteration 0 showed body_width cannot
      raise the 0.06 m off-track limit and the failure is from lag.

      - If runs complete but completion_time exceeds 2.5 s, test wheel_radius 0.035
      m for more top speed, because iteration 0 had no completions to show the speed
      headroom.


      - [Open this output](iteration-1/entityR1/versions/8d0d337d30ce4d819debc61814368ae0/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/9193dee448d04eb3987983c11ea463fa/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-3c6e6e60cbdff056/payload.json)'
