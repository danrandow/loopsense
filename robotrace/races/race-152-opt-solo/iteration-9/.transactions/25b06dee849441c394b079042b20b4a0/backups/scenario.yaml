  - id: entity0
    label: kd 1.5 damping test
    notes: 'Keeps iteration 7 geometry and all controller values except kd, raised
      from 1.2 to 1.5 to damp bend overshoot. Iteration 7 showed kd 0.9 to 1.2 lifted
      the score from 382 to 451, so the same lever is tested again with the oval''s
      2 s finish as a safety margin.


      ### Rationale


      Evidence. Iteration 7 is the best design so far (score 450.8). Its oval finishes
      19 of 20 runs at 2.01 s, so there is about 1 s of time margin. The s-bend improved
      to 0.77 progress with 2 finishes, and the slalom is still at 0.16 progress with
      1.15 line-loss events per run. The one change from iteration 5 to 7 was kd 0.9
      to 1.2, and it raised the score by 69. Oscillation fell slightly on the oval
      and rms error fell from 0.018 to 0.015. max_error still sits near the off-track
      limit on the s-bend and slalom, with low rms, which fits transient overshoot
      into bends.


      Decision. Keep the geometry from iteration 7 unchanged so the effect is clean,
      and continue the direction that has worked: kd 1.2 to 1.5 to add more damping
      to the bend entries. kp (5.0), ki (4.0), base_speed (1.2) and line_loss (last_direction)
      are unchanged. The ki=5 test in iteration 6 hurt the oval, so ki stays at 4.


      Expected result. Oval finish rate holds near 0.95 and time stays near 2 s. The
      s-bend progress should rise above 0.77 and the slalom line-loss count should
      fall. Score should rise above 450 if overshoot is still the limit.


      Hypotheses. H1: the s-bend and slalom failures are transient overshoot, so kd
      1.5 raises their progress. H2: if kd gives less gain than before (a diminishing
      return), turn-in speed is the limit, and base_speed should drop to about 1.1
      next, which costs little on the oval. H3: slalom line loss comes from fast direction
      changes at the ±0.04 m array edge, so the next geometry test is a 7-sensor array
      at ±0.045 m with linear weights, to be tried only after the kd effect is read.


      Measurements requested per track: completion, progress, completion_time, rms_error,
      max_error, line_loss_events, steering_oscillation, control_effort, controller_errors
      and noise_robustness. These separate overshoot, edge loss and speed effects.


