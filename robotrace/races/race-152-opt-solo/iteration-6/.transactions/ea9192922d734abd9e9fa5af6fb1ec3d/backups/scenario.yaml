  entities:
  - id: entity0
    label: Wider array, ki 5
    notes: 'Widens the sensor array to ±0.06 m to stop slalom line loss (1.4 events
      per run in iteration 5), and raises ki from 4 to its maximum of 5 to keep removing
      the steady motor bias. Controller gains are otherwise unchanged so the effect
      can be read cleanly. Evidence: oval progress rose steadily with ki, and the
      wider array removed line loss on the oval in iteration 1.


      ### Rationale


      Evidence from iteration 5 (score 382.3): the oval now finishes 19 of 20 runs
      (mean time 1.95 s, progress 0.997, 0.6 line-loss events). The s-bend (progress
      0.44, 20/20 off track) and slalom (progress 0.12, 1.4 line-loss events per run)
      still fail. Max error sits at the 0.06 m off-track limit on every track, and
      steering oscillation is low (0.17 to 0.33), so the robot is not jittering. It
      loses the line and drifts out. The integral term has been the strongest lever:
      oval progress went 0.12, 0.21, 0.27, 0.76, 0.997 as ki rose 0, 1, 2, 3, 4. Slalom
      line loss points to the sensor array: at ±0.04 m the outer sensors can read
      nothing when the tape swings beyond the array on fast direction changes. Iteration
      1 showed that widening to ±0.06 m cut line-loss events to zero on the oval,
      and the signal gain does not depend on sensor position, so widening changes
      only which offsets are seen, not the steering gain. Changes: (1) widen the sensor
      array to x = -0.06, -0.03, 0, 0.03, 0.06 at y = 0.06 so the tape stays in view
      on sharp bends; (2) ki 4.0 to 5.0, the maximum allowed, to keep removing the
      steady motor-mismatch bias; (3) kp, kd, base_speed and line_loss held at iteration
      5 values (5.0, 0.9, 1.2, last_direction), so the two changes can be read cleanly.
      Expected result: fewer line-loss events and later off-track endings on the s-bend
      and slalom, with the oval still finishing. Oval completion time should stay
      near 2 s, well under 3 s. Risks: ki at its limit may overshoot on sustained
      curves, and the wider array may reduce edge resolution, which could raise rms
      on the oval. Hypotheses: (H1) the slalom line loss is caused by sensor span,
      so line_loss_events on the slalom should drop below 1; (H2) ki 5 still leaves
      a residual bias, so the s-bend progress should rise above 0.44; (H3) if the
      s-bend still ends off track with low rms, the limit is turn-in speed, and base_speed
      should drop to about 1.1 or kp should rise. Measurements requested: all metrics,
      including completion_time and line_loss_events per track, to separate span,
      bias and speed effects.


