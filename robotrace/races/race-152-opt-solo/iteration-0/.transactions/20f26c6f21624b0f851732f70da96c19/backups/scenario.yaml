  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'First candidate built from the contract alone, since no race data exists
      yet. It uses five sensors, kp 3, kd 0.2, base speed 1.8 and last-direction line
      recovery, and it targets finishing under 3 s with low error.


      ### Rationale


      No race telemetry exists yet (iteration 0), so this is a conservative baseline
      built from the contract. Geometry: five sensors spaced 15 mm apart across x
      = -0.03 to +0.03 m, placed 0.05 m ahead of the axle so they read the line before
      the wheels reach it. A 12 mm footprint is used because it spans the 25 mm tape
      while still resolving the centre position. The track is 0.12 m, the wheel radius
      is 0.03 m, and the body is 0.12 by 0.16 m at 0.8 kg, a moderate, stable platform.
      Controller: antisymmetric weights [-1.0, -0.5, 0, 0.5, 1.0] give a signal scaled
      to about +/-1. kp = 3 turns the signal into roughly 1050 PWM counts of wheel
      difference at full error, which should steer without saturating. kd = 0.2 damps
      oscillation, and ki = 0 avoids integral windup on curves. base_speed = 1.8 (about
      3685 PWM) targets the roughly 1.5 m/s average needed to finish within 3 s. line_loss
      = last_direction recovers toward the side the robot last saw the tape. Expected
      outcome: completion on the oval and s-bend, with the main risk being overshoot
      on the slalom at this speed. Hypotheses to test: (1) kp is too low or too high
      for the chosen speed; (2) kd is too small to damp the slalom; (3) base_speed
      trades completion time against off-track or line-loss events. Next measurements:
      completion, completion time, rms and max error, line-loss events, and steering
      oscillation, which together separate speed-limited from control-limited failures.


      - [Open this output](iteration-0/entity0/versions/c5559ae731524d7899224f0eff5cfd17/payload.json)'
  actions:
  - id: action0
