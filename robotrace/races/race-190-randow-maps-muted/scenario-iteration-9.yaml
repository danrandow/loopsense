  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 8 is the best design so far (score 939.3). All 60 development trials
      finished on oval, s-bend and slalom, with progress of about 0.996 to 0.998.
      The score now comes mainly from three terms: line_loss_events (about 0.85 to
      1.05 per run, worth up to 15 points), completion_time (about 1.9 to 2.3 s, worth
      about 16 points at 2.2 s), and rms_error (about 0.006 to 0.010 m, worth about
      65 points). Agility has been the lever since iteration 3, and wheel_track was
      the last step with a clear gain. Further yaw-inertia cuts are at their limits:
      body_length 0.10 m, mass 0.40 kg, body_width 0.08 m (off-track floor unchanged).
      The remaining evidence points at line loss rather than yaw response. Line loss
      occurs about once per run even though the robot finishes, which suggests brief
      dropouts when the outer sensors lose the 12 mm footprint on the 25 mm tape during
      bend entries. A larger sensor footprint should keep the sum of readings above
      the 0.05 threshold and smooth the signal. The change is a single variable: sensor_size
      goes from 0.012 to 0.016 m, the largest allowed value, and everything else stays
      as in iteration 8 so the Integrator''s controller carries over and the effect
      is attributable. Expected result: line_loss_events fall from about 1 toward
      0.5 or below, rms_error stays near or below 0.01 m, and completions hold at
      60/60. Risk: a wider footprint blurs the signal on the sharpest bends and raises
      rms_error or steering_oscillation. If that happens, I will return to 0.012 m
      and look at wheel_radius for speed instead.


      - [Open this output](iteration-9/entity0/versions/b723ec82b52847e5879a56c05a9c6de7/payload.json)

      - Based on: [entityR2A](iteration-9/entityR2A/versions/carried-bcc85b8a24662e08/payload.json)'
  - id: entity1
    label: Wider sensor footprint
    notes: 'Single-variable step from iteration 8 (score 939.3, 60/60 finishes): sensor_size
      0.012 to 0.016 m, controller unchanged. Aims to cut line_loss_events (about
      1 per run) without raising rms_error.


      ### Rationale


      Iteration 8 (score 939.3) is the best design. All 60 development trials finished,
      with oval 20/20, s-bend 20/20 and slalom 20/20, and rms_error of 0.0056 to 0.0099
      m. The remaining score terms are line_loss_events (0.85 to 1.05 per run, up
      to about 15 points), completion_time (1.85 to 2.26 s) and rms_error. Iteration
      8 showed that the controller has enough turn authority. The Builder''s single-variable
      step raises sensor_size from 0.012 to 0.016 m, the largest allowed footprint,
      to keep the summed readings above the 0.05 line-loss threshold on bend entries.
      Because the change is only in sensing, the controller should carry over unchanged,
      so I keep iteration 8''s gains: kp 3.8, ki 0.15, kd 0.65, base_speed 1.4, the
      same x/0.015 sensor weights (positive = left) and last_direction line loss.
      Holding the controller fixed makes the sensor effect attributable. Expected
      result, not yet measured: line_loss_events near 0.5 to 0.85, rms_error near
      0.01 m and completions at or near 60/60. The main risk is that a wider footprint
      blurs the signal on the sharpest bends and raises rms_error or steering_oscillation,
      which would show in the s-bend and slalom numbers.


      - [Open this output](iteration-9/entity1/versions/5b260792196d4a899419308f65fe4661/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/b723ec82b52847e5879a56c05a9c6de7/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-bcc85b8a24662e08/payload.json)'
  - id: entityR1
    label: 'Feedback: sensor and'
    notes: 'Pre-race feedback that ties the next track and footprint choices to iteration
      7 and 8 oscillation and line-loss numbers. Each branch names what to change
      if the wider footprint lowers line loss or blurs the signal.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Evidence
      from earlier iterations: iteration 8 (wheel_track 0.105 m, mass 0.40 kg, body
      0.10 x 0.08 m, kp 3.8, kd 0.65, sensor_size 0.012 m) finished 60/60 with rms_error
      0.0056 to 0.0099 m and line_loss_events 0.85 to 1.05 per run. Iteration 7 showed
      s-bend steering_oscillation at 0.347 once the track narrowed, so damping is
      now close to its limit. I kept the controller from iteration 8 unchanged so
      the sensor step is the only variable. For the integration I had to compensate
      for the fixed left/right motor mismatch with ki 0.15 and for the faster heading
      response from the narrow track with kd 0.65, and I kept the signal sign-correct
      with x/0.015 weights. Next race, the change depends on the result. If line_loss_events
      fall below about 0.85 and rms_error stays at or below 0.01 m, the wider footprint
      is working: keep sensor_size 0.016 m and, if slalom finishes are below 20/20,
      try a further track narrowing. If rms_error rises above 0.01 m or s-bend steering_oscillation
      rises above about 0.36, the footprint is blurring the signal on sharp bends:
      return sensor_size to 0.012 m. If line_loss_events stay near 1 per run, footprint
      is not the cause, so widen the outer sensors instead.


      ### Requested changes


      - If line_loss_events fall below 0.85 and rms_error stays at or below 0.01 m
      on the slalom and s-bend: keep sensor_size 0.016 m and try wheel_track 0.10
      m, since iteration 7 to 8 showed slalom progress rising with each track narrowing
      while s-bend oscillation rose only to 0.34.

      - If rms_error rises above 0.01 m or s-bend steering_oscillation rises above
      about 0.36 with sensor_size 0.016 m: return sensor_size to 0.012 m and keep
      wheel_track 0.105 m, since iteration 8 at 0.012 m gave s-bend rms_error 0.0058
      m and oscillation 0.34.

      - If line_loss_events stay near 1 per run (iteration 8: 1.0 oval, 0.85 s-bend,
      1.05 slalom) with sensor_size 0.016 m: widen the outer sensor spread to x =
      -0.035 to +0.035 m with 0.0117 m spacing, since iteration 0 (narrow spread)
      had 2 line losses per slalom run and the outer sensors are the ones losing the
      tape at bend entries.


      - [Open this output](iteration-9/entityR1/versions/5b260792196d4a899419308f65fe4661/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/b723ec82b52847e5879a56c05a9c6de7/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-bcc85b8a24662e08/payload.json)'
