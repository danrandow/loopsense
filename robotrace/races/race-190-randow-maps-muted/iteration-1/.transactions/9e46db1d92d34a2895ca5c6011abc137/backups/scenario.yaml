overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor array
    notes: 'First geometry: five 12 mm sensors spaced 10 mm across x = ±0.02 m, 0.04
      m ahead of the axle, with weights proportional to x. No race data exists yet,
      so this is a mid-range baseline chosen from the contract alone; the next iteration
      should revise it from race and integration evidence.


      ### Rationale


      Iteration 0 has no race telemetry and no Integrator feedback yet, so this is
      a baseline design built from the contract alone. Five sensors span x = -0.02
      to +0.02 m at 0.01 m spacing, all 0.04 m ahead of the axle, so they read the
      line slightly ahead of the wheels. The 0.012 m footprint is a little smaller
      than the 25 mm tape, so one sensor can sit fully on the tape while the outer
      ones still see an edge. Weights are set proportional to sensor x (-2, -1, 0,
      1, 2), so the signal is a direct, sign-correct lateral error: a line to the
      left gives a positive signal and steers left, as the contract requires. Wheel
      track 0.12 m and body width 0.12 m keep the off-track limit at its 0.06 m floor,
      which gives a comfortable margin. A 0.03 m wheel radius and 0.8 kg mass sit
      in the middle of their ranges, keeping yaw inertia moderate so the robot can
      turn on the tighter bends without excessive overshoot. I expect a run that completes
      the oval with a modest rms_error, with the main risk being speed limits on the
      slalom.


      - [Open this output](iteration-0/entity0/versions/2cf608a418554dc589b67522614bd22c/payload.json)'
  - id: entity1
    label: Complete Robot Package
    notes: 'Complete Robot Package. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 0 has no race telemetry and no Integrator feedback, so the controller
      is a conservative first design for the Builder''s baseline geometry. The five
      sensors sit at x = -0.02 to +0.02 m, 0.04 m ahead of the axle, and the weights
      are proportional to sensor x (-2, -1, 0, 1, 2). A positive signal therefore
      means the line is to the left and steers left, as the contract requires. The
      signal is a reading-weighted average, so its magnitude stays within about ±2
      and kp = 2 keeps the peak turn command near 4 (about ±1400 PWM counts) without
      saturating the wheels. ki = 0 avoids integral windup on the first race. kd =
      0.05 adds mild damping for the slalom. base_speed = 1.6 gives PWM 3276 (80%
      of full) to aim at the roughly 1.5 m/s average the 3 s limit needs, while leaving
      margin for turning losses. line_loss = last_direction keeps the robot turning
      toward the side it last saw the line instead of stopping or searching blindly.
      Geometry is passed through unchanged, so the Builder''s intent is tested as
      written. Expected result: the oval should complete, with the slalom and the
      sharpest bends as the main risk. Those are the cases the next iteration''s telemetry
      should answer.


      - [Open this output](iteration-0/entity1/versions/225844841a9d4007a5ff4126952afcb6/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/2cf608a418554dc589b67522614bd22c/payload.json)'
  - id: entityR1
    label: Integration Feedback
    notes: 'Integration Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      No race has been run for this geometry or for any earlier design, so there is
      no outcome evidence yet. The integration work so far is only what the contract
      required. The sensor weights are set to the signed lateral positions (-2 to
      +2) so the signal is sign-correct, and I used a conservative kp of 2 with ki
      0 to avoid overshoot on a first race. Next race, the change depends on what
      it shows. If line_loss_events are nonzero and they cluster at bend entries,
      the sensors are seeing the line too late. Widen the array to x = ±0.03 or move
      the sensors further ahead (y = 0.06) so the line is seen earlier. If the sharpest
      bends saturate or drop out (the outer sensors read 1 and the signal stops changing),
      use sensor_size 0.016 so the footprint covers more of the 25 mm tape, or reduce
      the sensor spread. If the rms_error is high on gentle bends with no line loss,
      the array is too narrow for a stable signal, so widen it. If the robot is stable
      but misses the 3 s finish, reduce the mass or the yaw inertia (body_length or
      body_width) so the robot can carry speed through turns.


      ### Requested changes


      - If line_loss_events cluster at bend entries in the next race: move sensor_positions
      y from 0.04 to 0.06 so the array reads the line earlier, and keep the x spread
      at ±0.02.

      - If the sharpest bends saturate or drop out (signal stops changing as the outer
      sensors read fully on tape): set sensor_size to 0.016 so each footprint covers
      more of the 25 mm tape, keeping the current x spread.

      - If steering_oscillation is high on the slalom while completion is good: reduce
      body_length to 0.15 and mass to 0.7 to lower yaw inertia, so the robot does
      not overshoot each direction change.


      - [Open this output](iteration-0/entityR1/versions/225844841a9d4007a5ff4126952afcb6/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/2cf608a418554dc589b67522614bd22c/payload.json)'
