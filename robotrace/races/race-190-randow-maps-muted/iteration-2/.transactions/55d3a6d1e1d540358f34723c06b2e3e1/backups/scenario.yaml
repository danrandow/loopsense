map:
  id: race-190-randow-maps-muted
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: 7-sensor, larger wheel
    notes: 'Seven sensors at y=0.07 m spanning ±0.03 m, wheel radius raised to 0.035
      m for speed, and track widened to 0.11 m for turn stability. This responds to
      all 120 development trials ending off-track with max_error at the 0.06 m floor
      and runs stalling well short of the speed needed to finish.


      ### Rationale


      The evidence is consistent across both geometries. All 120 development trials
      (60 per design, across iterations 0 and 1) ended off_track with progress between
      0.04 and 0.15. Max error sits at about 0.06 m, which is the off-track floor,
      and rms_error is about 0.02 to 0.03 m. Steering oscillation is low (0.07 to
      0.16), so the robot is not jittering. It is drifting steadily outward, and the
      s-bend fails earliest. Iteration 1 improved on iteration 0 (score 55.8 vs 35.8),
      and its changes (sensors further ahead at y=0.06, wider span of ±0.03 m, a lighter
      and shorter body, and a narrower track) moved in the right direction. The remaining
      gap is mainly lookahead and speed, not sensing failure. Line loss is rare (about
      1 event per run), so the sensors are still seeing the tape.


      Changes in this proposal, each tied to that evidence:

      1. Lookahead: move the sensors from y=0.06 to y=0.07 m. Seeing the line earlier
      gives the controller more time to react before the robot reaches a bend, and
      the s-bend failure is the clearest sign that reaction time is short.

      2. Sensor count: move to 7 sensors at x = -0.03, -0.02, -0.01, 0, 0.01, 0.02,
      0.03 m. A 0.01 m spacing with a 0.012 m footprint gives overlapping coverage,
      so the signal stays usable as the robot drifts sideways. The extra sensors add
      noise averaging without adding much cost. Weights will be set by the Integrator.

      3. Speed: raise wheel_radius from 0.03 to 0.035 m. Ground speed equals wheel
      radius times rotation rate, so a larger wheel gives more forward speed at the
      same PWM. The average speed needed to finish in 3 s is about 1.5 m/s, and every
      run so far has stalled far short of that. This is the main lever for completion_time,
      which the score rewards only if the run finishes.

      4. Stability: widen wheel_track from 0.10 to 0.11 m. Turn rate is the wheel
      speed difference divided by track, so a wider track makes each unit of wheel
      differential turn the robot more slowly. That gives back some stability on the
      sharp s-bend, offsetting the faster response from the lighter body. Mass stays
      at 0.6 kg and body_length at 0.14 m to keep yaw inertia low.

      5. Body width stays at 0.12 m. The off-track limit is max(0.06, tape_half_width
      + body_width/4), which is 0.06 m at this width, so widening the body gives no
      benefit.


      Expected result: fewer off_track endings and more progress on s-bend and slalom,
      with the first completions possible on the oval. Completion is the main risk,
      because the larger wheel and longer lookahead must be matched by controller
      speed. I expect the Integrator to need a lower base_speed on the s-bend.


      - [Open this output](iteration-2/entity0/versions/cc7afaa30dd24d15997ddcff021ff84a/payload.json)

      - Based on: [entityR2A](iteration-2/entityR2A/versions/carried-0b9b93186432a33e/payload.json)'
  - id: entity1
    label: Seven-sensor robot, kp
    notes: 'Integrates the Builder''s seven-sensor, larger-wheel geometry with kp
      4.0, kd 0.3, base_speed 1.4. Iteration 1 showed steady outward drift to the
      0.06 m floor, so turn authority is raised. Weights are scaled to the new lateral
      spread.


      ### Rationale


      Iteration 1 evidence (60 trials, all off_track): progress 0.11 to 0.15, max_error
      at the 0.06 m floor on every track, rms_error about 0.025, line_loss about 1
      per run, and steering_oscillation 0.10 to 0.14. The robot drifts outward steadily
      and is not jittering, so the controller is still too soft on bends. Iteration
      1 changed gains and geometry together, so I cannot separate their effects, but
      raising kp from 3.2 to 4.0 is the most direct response to steady outward drift.
      The Builder''s new geometry (7 sensors at y=0.07, 0.01 m spacing, wheel_radius
      0.035, wheel_track 0.11) is kept unchanged so its intent is tested as written.
      The sensor weights are scaled to the new lateral positions as x/0.015, giving
      -2, -1.33, -0.67, 0, 0.67, 1.33, 2. This keeps the signal sign-correct (positive
      = left) and within the weight limit. kp rises to 4.0 for more turn authority,
      and kd rises from 0.2 to 0.3 to damp the faster response. ki stays at 0.15 to
      cancel the fixed motor mismatch. base_speed drops from 1.6 to 1.4, as the Builder
      expects, because off_track ends every run and a slower approach should keep
      the robot on the line. The larger wheel gives more speed at the same PWM, so
      1.4 should still give a reasonable pace toward the 3 s limit. line_loss stays
      last_direction. Expected result: fewer off_track endings and higher progress
      on the s-bend. Completion is still unlikely and is not claimed.


      - [Open this output](iteration-2/entity1/versions/55e140b289c0431b9689fc3f8d6cdb3b/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/cc7afaa30dd24d15997ddcff021ff84a/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-0b9b93186432a33e/payload.json)'
  - id: entityR1
    label: Sensor y and footprint
    notes: 'Feedback for the next geometry, based on iteration 1: all trials off_track,
      progress 0.11 to 0.15, max_error at 0.06 m. It proposes sensor y=0.08, sensor_size
      0.016 and wheel_track 0.10 m, each tied to a named signal in the next race.


      ### Feedback


      Based only on iteration 1 (sensors at y=0.06, five sensors at x=±0.03 m, wheel_radius
      0.03, wheel_track 0.10, kp 3.2, ki 0.15, kd 0.2, base_speed 1.6). All 60 trials
      ended off_track. Progress was 0.11 to 0.15, max_error was at the 0.06 m floor
      on every track, and rms_error was about 0.025 m. Line loss averaged about 1
      per run, and steering_oscillation stayed low (0.10 to 0.14). Iteration 1 improved
      the s-bend progress from 0.04 to 0.15 over iteration 0, but the robot still
      drifts outward. What I had to compensate for in the controller: the weights
      are scaled to the new lateral spread to keep the signal sign-correct, the kp
      is raised for turn authority, and kd is raised to damp the faster response.
      Next race, the change depends on the result. If max_error still reaches 0.06
      m on the s-bend with seven sensors at y=0.07, the bend is still being seen too
      late or the turn is still too slow, so try sensor y=0.08 (the contract maximum).
      If line_loss_events stay at about 1 per run with the seven-sensor array, the
      0.012 m footprint may be too small to hold the tape at the edges, so try sensor_size
      0.016. If steering_oscillation rises above about 0.16 with the wider track,
      the turn response is too slow to damp, so return wheel_track toward 0.10 m.
      I expect the completion risk to come from the speed limit, not the sensing.


      ### Requested changes


      - If max_error stays at about 0.06 m on the s-bend with the seven-sensor array
      at y=0.07: move sensor y to 0.08 m (the contract maximum), keeping x at -0.03
      to +0.03 m, since iteration 1 showed the robot still drifting outward at y=0.06
      m.

      - If line_loss_events remain at about 1 per run (iteration 1: 1.0 on oval and
      s-bend, 2.0 on slalom in iteration 0): set sensor_size to 0.016 so each footprint
      covers more of the 25 mm tape and the edge sensors keep a usable reading.

      - If steering_oscillation rises above the iteration 1 range (0.10 to 0.14) with
      wheel_track 0.11 m: return wheel_track to 0.10 m, since iteration 1 ran at 0.10
      m with low oscillation and the same max_error floor.


      - [Open this output](iteration-2/entityR1/versions/55e140b289c0431b9689fc3f8d6cdb3b/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/cc7afaa30dd24d15997ddcff021ff84a/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-0b9b93186432a33e/payload.json)'
