  id: race-190-randow-maps-muted
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 3 is the best design so far (score 503.2). Its three changes (sensors
      at y=0.08 m, wheel_track 0.13 m, wheel_radius 0.04 m) produced the first real
      completions: 16 of 20 oval runs and 7 of 20 s-bend runs finished. The slalom
      still fails in all 20 trials, with progress 0.34 and every run ending off_track.
      Three signals guide this iteration:


      1. Slalom and s-bend fail by leaving the line, not by stalling. Slalom max_error
      is 0.064, above the 0.06 floor, and s-bend max_error is 0.053, close to it.
      The robot is not responding quickly enough to alternating bends.

      2. Steering oscillation rose slightly (0.31, up from 0.27) and control_effort
      rose (7.6 to 10.3 on the s-bend), so the controller is working harder without
      gaining much accuracy.

      3. Speed is no longer the constraint on the oval, where completions now happen.
      The remaining gap is turn agility on tight, alternating curvature.


      The wider track (0.13 m) slows the turn response per unit of wheel differential.
      That helps damping but limits how fast the robot can change heading on the slalom.
      Yaw inertia is mass*(L^2+W^2)/12. At mass 0.6 kg and L=0.14 m it is about 0.0017.
      Lowering mass to 0.5 kg and body_length to 0.12 m cuts it to about 0.0011, a
      roughly 35% reduction, so the same wheel differential turns the robot faster.
      I am also narrowing wheel_track from 0.13 to 0.12 m, which gives back some turn
      authority while keeping more damping than the 0.11 m track from iteration 2.
      Keeping wheel_radius at 0.04 m preserves the ground speed that produced the
      oval completions. Sensor layout (7 sensors, x = ±0.03 m, y = 0.08 m, 0.012 m
      footprint) stays unchanged so the Integrator''s controller carries over. Body
      width stays at 0.12 m because the off-track floor of 0.06 m is set by max(0.06,
      tape_half_width + body_width/4).


      Expected result: lower max_error and more progress on the slalom and s-bend,
      with more s-bend completions. Risk: a lighter, shorter, more agile body may
      raise steering_oscillation further. If it does, the Integrator will need more
      kd, and I will then move wheel_track back toward 0.13 m.


      - [Open this output](iteration-4/entity0/versions/e7020700b5e64e1992cc4a8da0a29497/payload.json)

      - Based on: [entityR2A](iteration-4/entityR2A/versions/carried-c50d5fd2b036f5f0/payload.json)'
  - id: entity1
    label: 'Robot package: damped'
    notes: 'Runs the Builder''s iteration 3 geometry (y=0.08, track 0.13, wheel 0.04)
      with kd raised from 0.3 to 0.4 to damp the overshoot seen in iteration 2 (steering_oscillation
      0.27, control_effort about 8.5). kp, ki and base_speed are held to isolate the
      geometry effect.


      ### Rationale


      The Builder''s iteration 3 geometry is kept exactly as proposed: seven sensors
      at y=0.08 m spanning x=-0.03 to +0.03 m, wheel_radius 0.04 m, wheel_track 0.13
      m, mass 0.6 kg, body_length 0.14 m, body_width 0.12 m, sensor_size 0.012 m.
      The evidence from iteration 2 (score 171.3, 2 of 20 oval trials finished) shows
      that kp 4.0 with kd 0.3 gave steering_oscillation of about 0.27 to 0.28 and
      control_effort of about 8 to 8.5, which points to overshoot rather than too
      little turn authority. The Builder''s geometry lowers the turn rate per unit
      wheel differential, because the track widens from 0.11 to 0.13 m (about 15%
      less turn per command). I therefore keep kp at 4.0 so the effective turn gain
      stays close to iteration 2''s, and raise kd from 0.3 to 0.4 to add damping against
      the overshoot the wider track was meant to reduce. ki stays at 0.15 to cancel
      the fixed motor mismatch. The sensor weights are scaled to the lateral spread
      (x/0.015), so the signal stays sign-correct with positive meaning left. base_speed
      stays at 1.4 so that the only changes from iteration 2 are the geometry and
      kd, which keeps the race readable. The larger 0.04 m wheel should raise ground
      speed at this PWM, so completion_time on the oval is the check. Line loss stays
      last_direction. Expected result: steering_oscillation below 0.27 and fewer off_track
      endings on the s-bend and slalom. This is not a claim of outcome.


      - [Open this output](iteration-3/entity1/versions/2a9e34d8aeb64006afaa7c2309a06c9e/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/6ec7878d26144024b6f43635d8e0b12e/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-6f4d114c00fbbfa0/payload.json)'
  - id: entityR1
    label: 'Feedback: track and'
    notes: 'Feedback written before racing, citing iteration 2''s overshoot (oscillation
      0.27 to 0.28) and iteration 0 to 1''s off_track floor. Three requested changes
      cover track width, sensor lookahead and wheel radius, each tied to a measured
      signal.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. The evidence
      so far: iteration 0 (symmetric five sensors at y=0.04 m, kp 2.0) and iteration
      1 (five sensors at y=0.06 m, kp 3.2, ki 0.15, kd 0.2) all ended off_track, with
      max_error at the 0.06 m floor and low steering_oscillation (0.07 to 0.16). Iteration
      2 (seven sensors at y=0.07 m, wheel_radius 0.035, wheel_track 0.11, kp 4.0,
      kd 0.3) raised oval progress to about 0.63 and finished 2 of 20 oval trials,
      but steering_oscillation rose to 0.27 to 0.28 and control_effort to about 8
      to 8.5, and s-bend progress stayed at 0.34. So sensing and lookahead were not
      the limit in iteration 2; overshoot was. Integration work I had to do: scaled
      the seven sensor weights to x/0.015 to keep the signal sign-correct, kept ki
      0.15 for the motor mismatch, and raised kd to 0.4 against overshoot. For the
      next race: if steering_oscillation falls below 0.27 and max_error still reaches
      0.06 m on the s-bend, the wider track is adding damping but turn authority is
      the limit, so try a moderately higher wheel_track is not the answer; instead
      try the sensor y, below. If steering_oscillation stays at or above 0.27 with
      the wider track, the turn response is still too fast and the track should go
      back toward 0.11 m. If line_loss_events rise at y=0.08 m, the far sensors are
      losing the tape and the lookahead is too far.


      ### Requested changes


      - If steering_oscillation is still at or above 0.27 on the oval and s-bend,
      with max_error at 0.06 m: set wheel_track to 0.12 m as a middle value between
      iteration 2''s 0.11 m and this 0.13 m, since iteration 2 showed overshoot at
      0.11 m with kp 4.0.

      - If line_loss_events rise above about 1 per run at y=0.08 m (iteration 2 at
      y=0.07 m gave 1.2 on the oval and 1.3 on the s-bend): set sensor y to 0.075
      m, since the far sensors may be losing the 25 mm tape at maximum lookahead.

      - If the robot is stable (steering_oscillation below 0.27) but completion_time
      on the oval stays above 3 s, or completions stay rare: raise wheel_radius to
      0.045 m for more ground speed, since iteration 2''s 0.035 m wheel gave an oval
      mean finish time of 1.7 s only in the two finishing runs and most runs stalled
      off_track.


      - [Open this output](iteration-3/entityR1/versions/2a9e34d8aeb64006afaa7c2309a06c9e/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/6ec7878d26144024b6f43635d8e0b12e/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-6f4d114c00fbbfa0/payload.json)'
