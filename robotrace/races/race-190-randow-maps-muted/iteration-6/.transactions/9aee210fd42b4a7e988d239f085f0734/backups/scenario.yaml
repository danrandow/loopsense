map:
  id: race-190-randow-maps-muted
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Narrower, lighter body
    notes: 'Narrows the body to 0.08 m and mass to 0.42 kg to cut yaw inertia about
      38%, since body width only affects the off-track floor. This targets the slalom,
      which still leaves the line in all 20 trials (progress 0.53), while keeping
      the sensor array and wheel radius that complete the oval and s-bend.


      ### Rationale


      Iteration 5 is the best design so far (score 684.9). Oval finishes 20/20 and
      s-bend 18/20, but slalom still fails in all 20 trials (off_track, progress 0.53,
      max_error 0.064). Across iterations 3 to 5, every change that made the body
      more agile (lower mass, shorter body, narrower track) raised slalom progress
      (0.34, 0.43, 0.53) without hurting the oval, so yaw response on alternating
      bends is still the limit. Steering oscillation on the s-bend rose only to 0.31
      and control_effort fell, so there is room for more agility before damping becomes
      the problem.


      The contract says body_width only enters the off-track limit, max(0.06, 0.0125
      + body_width/4). At body_width 0.12 m that limit is at its 0.06 m floor, and
      it stays at the floor for any width down to 0.08 m (0.0325, still under 0.06).
      So narrowing the body costs no off-track margin. Yaw inertia is mass*(L^2 +
      W^2)/12, so narrowing the body from 0.12 to 0.08 m cuts the W^2 term by about
      45%. With body_length at 0.10 m, the combined term drops from 0.0244 to 0.0164,
      about a third lower. Together with a mass reduction from 0.45 to 0.42 kg, yaw
      inertia falls from about 0.00092 to about 0.00057, roughly 38% lower.


      Changes: body_width 0.12 to 0.08 m (the main lever, since it is the only yaw-inertia
      term that is free for the off-track limit), mass 0.45 to 0.42 kg, and wheel_track
      held at 0.115 m so the turn authority per unit of wheel differential does not
      increase further. Body_length stays at 0.10 m, which is the minimum. Sensors
      (7 at x = ±0.03 m, y = 0.08 m, 12 mm footprint) and wheel_radius (0.04 m) are
      unchanged, so the oval and s-bend completions and the Integrator''s controller
      carry over.


      Expected result: slalom max_error below 0.06 and slalom progress above 0.6,
      with oval completion_time near 1.7 s and s-bend completions held at 17 or more
      of 20. Risk: the more agile body could raise steering_oscillation above 0.3
      and need more kd. If the slalom gets worse, the next step is to return wheel_track
      toward 0.12 m rather than change the body further.


      - [Open this output](iteration-6/entity0/versions/e72c73a90cf94bb29d3d2dcb3b501556/payload.json)

      - Based on: [entityR2A](iteration-6/entityR2A/versions/carried-b681524fe6da98e4/payload.json)'
  - id: entity1
    label: Agile body with more kd
    notes: 'Integrates the Builder''s lighter, shorter, narrower-track body (0.45
      kg, 0.10 m, 0.115 m) with kp 3.8 held and kd raised to 0.5 for damping. Evidence
      is iteration 4, which completed 20/20 oval and 17/20 s-bend runs and cut slalom
      oscillation to 0.24.


      ### Rationale


      Iteration 4 (score 657.9) is the best design so far. Oval completed 20/20 and
      s-bend 17/20, with the slalom still failing in all 20 trials at max_error 0.065
      and progress 0.43. Iteration 4 also cut steering_oscillation on the slalom (0.24)
      and oval (0.21) relative to iteration 3 (0.22 and 0.30), so the lighter, narrower
      body improved turn response without destabilising the robot. The Builder now
      proposes mass 0.45 kg, body_length 0.10 m and wheel_track 0.115 m, which lowers
      yaw inertia by roughly 25% again and makes each unit of wheel differential turn
      the robot about 4% faster. Sensors (7 at y=0.08, x within ±0.03 m), wheel_radius
      0.04 m and body_width 0.12 m are unchanged, so the sensing and speed that produced
      the completions carry over. Controller: the faster turn response means kp should
      not rise. I keep kp at 3.8 and ki at 0.15 (the fixed motor mismatch still needs
      it). I raise kd from 0.45 to 0.5 to add damping against the oscillation risk
      the Builder flagged, since the s-bend oscillation (0.32) is already close to
      the 0.31 level where iteration 3 began to overshoot. base_speed stays at 1.4
      so that the change in this race is only the geometry plus a small damping increase.
      Sensor weights stay at x/0.015 (-2 to +2), which keeps the signal sign-correct,
      and line_loss stays last_direction, which has produced about one event per run.
      Expected result, not yet measured: slalom max_error below 0.06 and steering_oscillation
      at or below about 0.32, with oval and s-bend completions held near iteration
      4 levels.


      - [Open this output](iteration-5/entity1/versions/7f957dc21aa74c4291ee7c2d5279c543/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/2cad39c6d32c47498aeadec1e15e4535/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-b6317b1f3f21e511/payload.json)'
  - id: entityR1
    label: Track and mass fallbacks
    notes: 'Feedback is written before racing and gives two conditional fallbacks:
      return wheel_track to 0.12 m if oscillation rises above 0.32, or try mass 0.4
      kg if slalom max_error stays above 0.06. Both rest on iteration 4''s slalom
      and oscillation numbers.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Evidence
      from earlier iterations: iteration 3 (y=0.08, wheel_track 0.13, wheel_radius
      0.04, mass 0.6, kp 4.0, kd 0.4) gave 16/20 oval and 7/20 s-bend completions,
      steering_oscillation about 0.30 to 0.31, and 0/20 slalom completions at max_error
      0.064. Iteration 4 (mass 0.5, body_length 0.12, wheel_track 0.12, kp 3.8, kd
      0.45) gave 20/20 oval and 17/20 s-bend completions, steering_oscillation 0.21
      on the oval and 0.24 on the slalom, and slalom progress 0.43 with max_error
      0.065. So the lighter body reduced oscillation while still improving completions,
      and the slalom failure is turn response on alternating bends rather than sensing
      or speed. Integration work: I kept the seven-sensor weights at x/0.015, kept
      ki 0.15 for the motor mismatch, and raised kd to 0.5 to damp the faster heading
      response. The next race decides the next change. If steering_oscillation rises
      above about 0.32 on the s-bend or slalom, the agility gain has outrun the damping,
      so return wheel_track toward 0.12 m. If slalom max_error stays at or above 0.06
      while oscillation stays at or below 0.32, the next lever is lower yaw inertia,
      not more track width. If oval or s-bend completions fall below iteration 4 levels,
      the lighter body has cost stability, so restore mass toward 0.5 kg.


      ### Requested changes


      - If steering_oscillation rises above 0.32 on the s-bend or slalom: set wheel_track
      back to 0.12 m, since iteration 4 at 0.12 m kept slalom oscillation at 0.24
      and oval oscillation at 0.21, while iteration 2 at 0.11 m with kp 4.0 overshot
      to 0.27 to 0.28.

      - If slalom max_error stays at or above 0.06 while steering_oscillation stays
      at or below 0.32: try mass 0.4 kg with body_length 0.10 m, since iteration 4
      moved slalom progress from 0.34 to 0.43 when yaw inertia fell and failure stayed
      at max_error 0.065.

      - If oval or s-bend completions drop below iteration 4''s 20/20 and 17/20: return
      mass to 0.5 kg, since the 0.5 kg body in iteration 4 completed every oval run
      and 85% of s-bend runs.


      - [Open this output](iteration-5/entityR1/versions/7f957dc21aa74c4291ee7c2d5279c543/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/2cad39c6d32c47498aeadec1e15e4535/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-b6317b1f3f21e511/payload.json)'
