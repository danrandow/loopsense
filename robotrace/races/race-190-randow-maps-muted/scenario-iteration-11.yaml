overrides:
  entities:
  - id: entity0
    label: Revert to iter 8 geometry
    notes: 'Reverts wheel_radius from 0.044 to 0.040 m and keeps all other values
      from iteration 8, the best design (939.3, 60/60 completions). Iteration 10''s
      larger wheel cut slalom finishes from 20/20 to 12/20, so the proven, robust
      geometry is the safer bet for the unseen final track.


      ### Rationale


      Iteration 10 scored 864.9, below the iteration 8 best of 939.3. Its only change
      was wheel_radius 0.040 to 0.044 m. That helped the oval (completion_time 1.85
      to 1.67 s) but broke the slalom: finishes fell from 20/20 to 12/20, with 8 off_track
      endings and mean slalom score 701. The larger wheel raised turn rate per unit
      of wheel differential, and the slalom''s alternating bends showed it first.
      Across iterations 3 to 8, every agility step that held the slalom together (lower
      mass, shorter body, narrower body, narrower track) raised or kept slalom progress,
      while the wheel-radius increase in iteration 10 reversed that. Iteration 9 also
      showed that a 0.016 m sensor footprint hurts slalom finishes, so sensor_size
      stays at 0.012 m. The evidence therefore favours the iteration 8 geometry, which
      completed 60/60 development trials with rms_error 0.0056 to 0.0099 m and progress
      of 0.996 to 0.998. Because the final score comes from an unseen track of a different
      shape, a design with 60/60 completions on known tracks is worth more than an
      untested compromise such as wheel_radius 0.042 m, which could land in the slalom
      failure zone. I am reverting wheel_radius to 0.040 m and keeping every other
      value from iteration 8. Expected result: about 939 on the development tracks,
      with completions held at 60/60 and slalom finishes near 20/20.


      - [Open this output](iteration-11/entity0/versions/2fc0d5715e9948a29ad3fda795605e4a/payload.json)

      - Based on: [entityR2A](iteration-11/entityR2A/versions/carried-9c961fe2bd7558a0/payload.json)'
  - id: entity1
    label: 'Final: iteration 8 robot'
    notes: 'Iteration 8''s geometry and controller, unchanged, as the most evidenced
      package (60/60 completions, score 939.3). The Builder''s final geometry matches
      it exactly, and no controller change was supported by the evidence.


      ### Rationale


      This is the final iteration, and the Builder''s proposal is the iteration 8
      geometry exactly: body 0.10 x 0.08 m, mass 0.40 kg, seven sensors at y=0.08
      m spanning x=-0.03 to +0.03 m, sensor_size 0.012 m, wheel_radius 0.040 m, wheel_track
      0.105 m. Iteration 8 is the only design with 60/60 completions and the best
      score (939.3), and its controller is the one that produced it. The Builder asked
      me to check kd against this geometry. The evidence does not justify changing
      it: kd 0.65 gave s-bend steering_oscillation of 0.34 with all 60 development
      trials finished and slalom max_error of 0.023. Iteration 9 (sensor_size 0.016
      m) and iteration 10 (wheel_radius 0.044 m) both lowered results, so neither
      change is carried over. I therefore keep kp 3.8, ki 0.15 (for the fixed left/right
      motor mismatch), kd 0.65, base_speed 1.4, last_direction line loss, and sensor
      weights x/0.015 (-2 to +2, positive = left). The signal remains sign-correct,
      and no untested controller change is added on an unseen track. Expected result,
      not claimed: about the iteration 8 level on the development tracks, with completions
      held at 60/60.


      - [Open this output](iteration-11/entity1/versions/f0b291e2011144c7aab590a308716899/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/2fc0d5715e9948a29ad3fda795605e4a/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-9c961fe2bd7558a0/payload.json)'
  - id: entityR1
    label: Keep iteration 8 geometry
    notes: 'Feedback endorses the Builder''s revert to iteration 8 and rejects the
      iteration 9 sensor and iteration 10 wheel changes using their race data. It
      states no outcome for this candidate and notes that no further race follows.


      ### Feedback


      Written before this candidate has raced, so I state no outcome for it. The Builder''s
      geometry is the iteration 8 design, which has the most evidence in this race:
      60/60 completions, oval and s-bend 20/20, slalom 20/20 with rms_error 0.0056
      to 0.0099 m (iteration 8, score 939.3). Iterations 9 and 10 tested one change
      each from it. The 0.016 m sensor footprint (iteration 9) cut s-bend line loss
      from 0.85 to 0.70 but caused 4 slalom off-track endings (16/20), so sensor blur
      on sharp bends outweighs the dropouts it removes. The 0.044 m wheel (iteration
      10) was the most recent test and is not carried forward. For this geometry I
      kept the iteration 8 controller: kp 3.8, ki 0.15 for the fixed motor mismatch,
      kd 0.65 (which damped s-bend oscillation to 0.34), base_speed 1.4, and sign-correct
      x/0.015 weights. This candidate is the final iteration, so no later geometry
      change can be tested. The requested changes below are the only remaining levers
      if the team wants them; they should be read as a note on the evidence, not as
      a plan for a further race.


      ### Requested changes


      - Keep sensor_size at 0.012 m and wheel_radius at 0.040 m: iteration 9 (sensor
      0.016 m) lost slalom finishes (16/20), and iteration 10 (wheel 0.044 m) left
      the line-loss and oscillation gap open, so neither change is supported.

      - Keep wheel_track at 0.105 m and body_width at 0.08 m: iteration 8 finished
      60/60 at this track, and iteration 7 to 8 showed that narrowing the track raised
      slalom finishes from 15/20 to 20/20 without losing the s-bend.

      - If the Builder were ever to test again on this geometry, the first candidate
      would be a small wheel_track change (0.10 m) with kd raised to about 0.70, because
      iteration 8''s s-bend oscillation of 0.34 is the nearest limit to a stability
      problem.


      - [Open this output](iteration-11/entityR1/versions/f0b291e2011144c7aab590a308716899/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/2fc0d5715e9948a29ad3fda795605e4a/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-9c961fe2bd7558a0/payload.json)'
