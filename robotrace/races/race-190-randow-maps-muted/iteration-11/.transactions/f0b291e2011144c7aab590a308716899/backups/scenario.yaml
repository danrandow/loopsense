overrides:
  entities:
  - id: entity0
    label: Revert to iter 8 geometry
    notes: 'Reverts wheel_radius from 0.044 to 0.040 m and keeps all other values
      from iteration 8, the best design (939.3, 60/60 completions). Iteration 10''s
      larger wheel cut slalom finishes from 20/20 to 12/20, so the proven, robust
      geometry is the safer bet for the unseen final track.


      ### Rationale


      Iteration 10 scored 864.9, below the iteration 8 best of 939.3. Its only change
      was wheel_radius 0.040 to 0.044 m. That helped the oval (completion_time 1.85
      to 1.67 s) but broke the slalom: finishes fell from 20/20 to 12/20, with 8 off_track
      endings and mean slalom score 701. The larger wheel raised turn rate per unit
      of wheel differential, and the slalom''s alternating bends showed it first.
      Across iterations 3 to 8, every agility step that held the slalom together (lower
      mass, shorter body, narrower body, narrower track) raised or kept slalom progress,
      while the wheel-radius increase in iteration 10 reversed that. Iteration 9 also
      showed that a 0.016 m sensor footprint hurts slalom finishes, so sensor_size
      stays at 0.012 m. The evidence therefore favours the iteration 8 geometry, which
      completed 60/60 development trials with rms_error 0.0056 to 0.0099 m and progress
      of 0.996 to 0.998. Because the final score comes from an unseen track of a different
      shape, a design with 60/60 completions on known tracks is worth more than an
      untested compromise such as wheel_radius 0.042 m, which could land in the slalom
      failure zone. I am reverting wheel_radius to 0.040 m and keeping every other
      value from iteration 8. Expected result: about 939 on the development tracks,
      with completions held at 60/60 and slalom finishes near 20/20.


      - [Open this output](iteration-11/entity0/versions/2fc0d5715e9948a29ad3fda795605e4a/payload.json)

      - Based on: [entityR2A](iteration-11/entityR2A/versions/carried-9c961fe2bd7558a0/payload.json)'
  - id: entity1
    label: Complete Robot Package
    notes: 'Complete Robot Package. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 8 (best so far, 939.3) finished 60/60 with rms_error 0.0056 to 0.0099
      m, slalom completion_time about 2.26 s, and line_loss_events about 1 per run.
      Iteration 9 showed that sensor_size 0.016 m cut s-bend line loss but caused
      4 slalom off_track endings, so I keep sensor_size 0.012 m, as the Builder''s
      intent specifies. The Builder''s single-variable step raises wheel_radius from
      0.040 to 0.044 m. Ground speed rises about 10% at the same PWM, and turn rate
      per unit wheel differential rises about 10% too. Iteration 8 had margin on oval
      and slalom, and s-bend steering_oscillation was 0.34, so the main risk is oscillation
      rising on the s-bend. I deliberately keep the iteration 8 controller unchanged
      (kp 3.8, ki 0.15, kd 0.65, base_speed 1.4, last_direction line loss, weights
      x/0.015). That keeps the wheel-radius effect readable, and the Builder''s intent
      expects the controller to carry over. ki 0.15 still cancels the fixed motor
      mismatch. Expected, not claimed: completion_time falls by about 0.1 to 0.2 s
      on slalom and oval, completions stay 60/60, and line_loss_events stay near 1.
      If s-bend steering_oscillation exceeds about 0.36 in the next race, the next
      controller step is kd about 0.70.


      - [Open this output](iteration-10/entity1/versions/7f2ec632171045f1af1dc30c9e8b6492/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/8639663eab3e48eca599e816e7beaba0/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-e5cdd3f182050e29/payload.json)'
  - id: entityR1
    label: Integration Feedback
    notes: 'Integration Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Written before this candidate has raced, so no outcome is claimed for it. Evidence:
      iteration 8 (wheel_track 0.105 m, wheel_radius 0.040 m, kd 0.65) finished 60/60
      with slalom at 2.26 s and s-bend steering_oscillation at 0.34. Iteration 9 (sensor_size
      0.016 m) lowered s-bend line loss from 0.85 to 0.70 but produced 4 slalom off_track
      endings (16/20), so the wider footprint is rejected for now. Iteration 2 (wheel_radius
      0.035 m, kp 4.0, kd 0.3) overshot, and iterations 3 to 5 showed that raising
      wheel_radius to 0.040 m with agility steps raised completions. Integration work:
      I kept the iteration 8 controller unchanged so this wheel step is isolated.
      The larger wheel adds about 10% ground speed and about 10% turn rate, and I
      have not yet compensated. Next race: if completion_time falls by 0.1 s or more
      on slalom and oval, with completions 60/60 and s-bend oscillation at or below
      about 0.36, try wheel_radius 0.047 m for more speed. If steering_oscillation
      rises above about 0.36 or any slalom run goes off_track, return wheel_radius
      to 0.040 m and try wheel_track 0.11 m instead. If line_loss_events stay near
      1 per run, sensing rather than speed is the remaining gap, so keep sensor_size
      0.012 m and widen the outer sensors.


      ### Requested changes


      - Keep sensor_size at 0.012 m and body_width 0.08 m, since iteration 9 showed
      the 0.016 m footprint caused slalom off_track endings (4 of 20).

      - If completion_time falls by at least 0.1 s with 60/60 completions and s-bend
      steering_oscillation at or below about 0.36: try wheel_radius 0.047 m, since
      iteration 8 to this step showed speed rising with radius and no oscillation
      problem yet.

      - If steering_oscillation exceeds about 0.36 or any slalom run goes off_track:
      return wheel_radius to 0.040 m and try wheel_track 0.11 m, since iteration 2
      at 0.11 m was stable with kd 0.6 to 0.7 in the later runs.


      - [Open this output](iteration-10/entityR1/versions/7f2ec632171045f1af1dc30c9e8b6492/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/8639663eab3e48eca599e816e7beaba0/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-e5cdd3f182050e29/payload.json)'
