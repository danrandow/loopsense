map:
  id: race-118-opt-eval
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: kd 0.45 damping test
    notes: 'Single change from the best raced design (iteration 5, score 160.4): kd
      0.3 to 0.45. Search_right left line losses unchanged, and max_error stayed near
      0.06 m with steering oscillation below 0.3, so the derivative term is the next
      lever to test.


      ### Rationale


      Evidence. The best raced design is iteration 5 (score 160.4): kp 2.5, sensor_size
      0.016, base_speed 1.3, kd 0.3, ki 0.05, weights [2,1,0,-1,-2], search_right.
      Its per-track results (entityR2A) show that search_right changed almost nothing.
      s-bend line_loss_events stayed at 2.0, slalom at 1.0, and oval rose slightly
      from 1.25 to 1.3. max_error stayed at about 0.060 to 0.062 m on every track,
      so every run still ends off_track. steering_oscillation is 0.14 to 0.28, which
      is low. The line-loss rule is therefore not the binding limit. The Evaluator''s
      branch (c) applies: line losses are unchanged and max_error is still about 0.06
      m with low oscillation, so the next lever is kd.


      Change. I raise controller.kd from 0.3 to 0.45 as the only change. This is partway
      to the Evaluator''s suggested 0.5, which keeps the oscillation risk smaller.
      Oval steering_oscillation was 0.282, close to the 0.3 threshold, so I stop short
      of 0.5. Everything else stays as in iteration 5: sensor_size 0.016, base_speed
      1.3, kp 2.5, ki 0.05, weights [2,1,0,-1,-2], search_right.


      Expected result. More derivative damping should reduce overshoot on bends, so
      max_error should fall toward 0.058 to 0.060 m on the oval and slalom. s-bend
      line_loss_events should fall below 2.0. steering_oscillation may rise slightly,
      and I expect it to stay below 0.3.


      Hypotheses and measurements. H1: kd is the lever that cuts max_error at about
      0.06 m. If max_error stays at 0.06 m, steering authority is capped by the geometry
      or the base speed. H2: if steering_oscillation exceeds 0.3, kd has passed its
      useful range and should go back to 0.3. Measurements needed per track: max_error,
      line_loss_events, steering_oscillation, progress, completion_time and completion.


      - [Open this output](iteration-6/entity0/versions/562225a6ac0f46a79e2a38376330df1c/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-70b29c04fe39b7f9/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-c4b140bd550e7c16/payload.json)'
  - id: entityR1
    label: 'Approve: line_loss test'
    notes: 'Approved the best raced design (iteration 3, score 159.2) with one change,
      line_loss last_direction to search_right, to test whether line losses are one-sided.
      Kp 3.0 raised s-bend line losses to 2.0 in iteration 4 (score 83.5), so the
      line-loss rule is the next clean lever.


      ### Feedback


      Written before this candidate races. It is the best raced design (iteration
      3, score 159.2: kp 2.5, sensor_size 0.016, base_speed 1.3, kd 0.3, ki 0.05,
      weights [2,1,0,-1,-2]) with one field changed, controller.line_loss from last_direction
      to search_right. The change is valid and isolates line-loss handling, which
      iteration 3 flagged: line_loss_events were 1.25 (oval), 2.0 (s-bend) and 1.0
      (slalom), with the 16 mm footprint already at its maximum. Iteration 4 showed
      that raising kp to 3.0 (score 83.5) overshoots and increases s-bend line loss
      (1.15 at kp 2.0, 2.0 at kp 2.5, 2.0 at kp 3.0), so the kp lever is exhausted
      and the line-loss rule is the right next test. Steering_oscillation has stayed
      low (0.11 to 0.28 across iterations 2 to 4), so the controller is not jittering
      and does not need extra damping for this test. Next race, depending on the telemetry:
      (a) if line_loss_events fall on the s-bend and slalom while max_error stays
      at or below about 0.061 m, keep search_right and test base_speed 1.5 as the
      only change, since iteration 3 suggests speed is adequate on the oval; (b) if
      line_loss_events rise above 2 on the s-bend, the losses are on the other side,
      so test search_left as the only change; (c) if max_error stays at about 0.06
      m with line losses unchanged, the binding limit is steering authority rather
      than line loss, so the next lever is kd toward 0.5 (only if steering_oscillation
      stays below about 0.3).


      ### Requested changes


      - If line_loss_events fall below 1.0 on the s-bend and slalom with max_error
      at or below about 0.061 m: keep controller.line_loss search_right and raise
      controller.base_speed from 1.3 to 1.5 as the only change, since iteration 3
      showed the oval finishes at 1.89 s and speed is adequate there.

      - If s-bend line_loss_events rise above 2.0 with search_right: revert controller.line_loss
      to last_direction and test controller.line_loss search_left as the only change,
      because line-loss side is the open question.

      - If line_loss_events are unchanged and max_error stays at about 0.06 m (iteration
      3 showed 0.0606 to 0.0623 m): change controller.kd from 0.3 toward 0.5 as the
      only change, provided steering_oscillation stays below about 0.3 (iteration
      3 peaked at 0.28).


      - [Open this output](iteration-5/entityR1/versions/87133f16937c4af49e2772d1779ce2a7/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/c4112602b87f47cc91f3a9db4a5f3cc6/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-b11a94c4cd9b5cca/payload.json)'
