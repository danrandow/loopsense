overrides:
  entities:
  - id: entity0
    label: Slower, damped, wider
    notes: 'Lowered base_speed to 1.3, raised kd to 0.3 and widened sensor footprints
      to 12 mm, to stop the roughly 6 cm off-track excursions seen in iteration 0.
      The evidence is that all runs ended off_track with max_error about 0.063 m and
      1 to 2 line-loss events, while rms_error stayed low.


      ### Rationale


      Evidence from iteration 0: no run finished on any track. Every run ended off_track
      after very little progress (0.105 oval, 0.15 s-bend, 0.11 slalom). The off-track
      limit here is effectively 0.06 m, and max_error was about 0.063 m, so the robot
      drifted just past the edge of the line. Line_loss_events were 1 to 2 per run
      and steering_oscillation was modest (0.08 to 0.15), while rms_error was low
      (about 0.026 to 0.029 m). The robot tracks the line well on average but fails
      at short, sharp excursions, which points to too little damping and a sensor
      footprint that gives a noisy edge signal. Changes: (1) base_speed 1.6 to 1.3,
      so the robot can corner and recover from the initial transient without exceeding
      its tracking margin. (2) kd 0.1 to 0.3, to damp the overshoot that produces
      the 6 cm excursions. (3) sensor_size 0.008 to 0.012, so the 12 mm sensor pitch
      overlaps fully and the signal stays nonzero at the tape edge, reducing line-loss
      events. kp, ki, sensor positions, weights and line_loss stay unchanged to isolate
      the effect of these three changes. Expected result: fewer line-loss events and
      lower max_error, with completion more likely. Cost: a slower base_speed may
      push completion_time toward or past 3 s, which would be the next thing to tune.
      Next measurements wanted: max_error and line_loss_events per track, steering_oscillation
      (to judge whether kd 0.3 is too much), and completion_time (to decide whether
      base_speed must rise again).


      - [Open this output](iteration-1/entity0/versions/db634394d1254d1fb32cc91c2f9d3ebc/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-d6622f950db0df77/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-38214270e6bf3817/payload.json)'
  - id: entityR1
    label: Baseline approved to race
    notes: 'First candidate with no race data: it is valid and not obviously broken,
      so approving it gets the first telemetry. The feedback sets contingent gain
      and speed changes for the next race to test on the slalom and sharp bends.


      ### Feedback


      Iteration 0 has no race telemetry, so this review rests only on the contract
      and the candidate''s own contents. The candidate is valid: five sensors within
      the position limits, five weights within [-2, 2], base_speed 1.6 and kp 2.0
      inside their ranges, and the sign convention matches the contract (positive
      weights on left-side sensors steer left). The sensor pitch of 12 mm with 8 mm
      footprints covers the 25 mm tape with overlap. Nothing in the candidate looks
      obviously broken, and no earlier race exists to show it is worse than anything
      else. Its main untested risks are on the slalom and sharp bends, where kd 0.1
      may be too little damping and base_speed 1.6 may be too high for the turns.
      Those risks can only be settled by racing. Next revision, if the race shows
      line loss or steering oscillation: raise kd, or lower base_speed. If the race
      shows completion with high rms_error on the bends: raise kp slightly. If the
      race shows completion_time well under 3 s with low rms_error: keep the controller
      and test the geometry only if a later iteration needs more margin.


      ### Requested changes


      - If line_loss_events or max_error spike on the slalom or sharp bends: lower
      controller.base_speed (for example 1.6 to 1.2) and raise controller.kd (for
      example 0.1 to 0.3), keeping the other fields as they are.

      - If steering_oscillation is high while completion is good: raise controller.kd
      only, in steps of about 0.1, and leave kp unchanged.

      - If completion is reached but completion_time is near 3 s with low rms_error:
      raise controller.base_speed (for example 1.6 to 1.8) before changing any gain.


      - [Open this output](iteration-0/entityR1/versions/a3fee6f6f42a4e2ba72ecc5d1ed3f468/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/8361211f1d07490fa8a4c4b6411fd1e9/payload.json)'
