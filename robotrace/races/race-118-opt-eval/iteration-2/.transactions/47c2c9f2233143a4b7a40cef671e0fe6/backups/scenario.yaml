map:
  id: race-118-opt-eval
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Wider sensors (16 mm)
    notes: 'Raises sensor_size from 0.012 to the maximum 0.016 m and leaves the controller
      unchanged, following the Evaluator''s rule for persistent line loss. Iteration
      1 still showed 1.0 to 1.9 line-loss events per run and max_error about 0.063
      m against the 0.06 m limit.


      ### Rationale


      Evidence from iteration 1 (score 128.9, up from 49.6): no run finished. The
      oval reached progress 0.61, the s-bend 0.26 and the slalom 0.10, and every run
      ended off_track with max_error about 0.062 to 0.063 m against the 0.06 m limit.
      Line-loss events fell from 1-2 to 1.0-1.9 per run, so the sensor_size and kd
      changes helped, but the robot still loses the tape. The body width cannot widen
      the limit: max(0.06, 0.0125 + body_width/4) stays at 0.06 m for any allowed
      width. The robot has to stay on the line. Steering oscillation rose to 0.28
      on the oval with kd 0.3, which is still low, so kd 0.3 is not too much. The
      Evaluator''s conditional rule applies: line loss persists at 1 or more events
      per run with sensor_size 0.012, so I raise sensor_size to the largest allowed
      value, 0.016 m. The 16 mm footprint covers the tape edge fully and should keep
      the signal non-zero when the robot drifts. I change only geometry.sensor_size
      and leave the controller unchanged (base_speed 1.3, kp 2.0, kd 0.3, ki 0.05,
      weights [2,1,0,-1,-2], last_direction), so the effect of the footprint can be
      isolated. Expected result: line_loss_events near 0 to 1 per run, max_error below
      about 0.055 m, and higher progress on all three tracks. Hypotheses and measurements
      for next: (1) if line loss drops but max_error still reaches 0.06 on sharp bends,
      kp is too low for the bend curvature, so raise kp in steps of about 0.5 next;
      (2) if the robot stays on the line with completion_time above 3 s, raise base_speed
      in steps of 0.2, as the Evaluator advised; (3) watch steering_oscillation to
      make sure kd 0.3 stays well-damped. I need per-track max_error, line_loss_events,
      progress, completion_time and steering_oscillation to decide the next step.


      - [Open this output](iteration-2/entity0/versions/71ac0e5d1534410191a5c3a0031664de/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-d4fb9e0405eeb96a/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-042a0398a15098a8/payload.json)'
  - id: entityR1
    label: Approve slower, damped
    notes: 'Approved the candidate as-is: base_speed 1.3, kd 0.3 and sensor_size 0.012
      target the off-track drift seen in iteration 0 (max_error about 0.063 m, 1 to
      2 line losses per run, zero completions). The main risk is that base_speed 1.3
      may miss the 3 s finish, so the next revision depends on the race telemetry.


      ### Feedback


      Written before this candidate races, so no outcome is claimed for it. The candidate
      is valid and changes only three fields from iteration 0: base_speed 1.6 to 1.3,
      kd 0.1 to 0.3, and sensor_size 0.008 to 0.012. Each change targets a failure
      seen in iteration 0. All 60 runs ended off_track, with max_error about 0.063
      m against a 0.06 m limit and 1 to 2 line-loss events per run (oval 1.0, s-bend
      1.0, slalom 2.0). The kd and sensor_size changes address that drift directly.
      The base_speed cut is the main risk. The course is about 4 to 5 m and must be
      covered in under 3 s, which needs roughly 1.5 m/s average. base_speed 1.3 may
      not reach that pace, so a clean run could still miss the time limit and score
      lower than a completed run would. That is acceptable for this first exploratory
      race, because the telemetry (completion_time, max_error, line_loss_events, steering_oscillation)
      decides the next step. Next revision, depending on the race: if the robot stays
      on the line (max_error well under 0.06 m, line_loss_events near 0) but completion_time
      is above 3 s, raise base_speed in steps of about 0.2 (to 1.5 or 1.6) and keep
      kd and sensor_size. If it still drifts off track on the slalom or s-bend, keep
      the lower speed and raise kd further (for example 0.3 to 0.5), but only if steering_oscillation
      stays low. If steering_oscillation rises sharply with kd 0.3, bring kd back
      toward 0.2 before changing anything else.


      ### Requested changes


      - If completion_time exceeds 3 s while max_error stays below about 0.05 m and
      line_loss_events is near 0: raise controller.base_speed in steps of about 0.2
      (1.3 to 1.5, then 1.6), keeping kd 0.3 and sensor_size 0.012.

      - If the robot still goes off_track with max_error near 0.06 m on the slalom
      or s-bend: keep base_speed at 1.3 and raise controller.kd from 0.3 toward 0.5,
      provided steering_oscillation stays low; if steering_oscillation rises sharply,
      lower kd to about 0.2 instead.

      - If line_loss_events stay at 1 or more per run even with sensor_size 0.012:
      raise geometry.sensor_size to 0.016 (the largest allowed value) so the footprint
      covers the tape edge fully, and leave the controller unchanged to isolate the
      effect.


      - [Open this output](iteration-1/entityR1/versions/06a160c04f7b4a908c51308aa889abfa/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/db634394d1254d1fb32cc91c2f9d3ebc/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-38214270e6bf3817/payload.json)'
