map:
  id: race-118-opt-eval
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Revert to iter 5 (ki
    notes: 'Reverts the ki 0.10 test from iteration 8, which lowered the score from
      160.4 to 109.8 by raising oval max_error and removing oval finishes. Reproduces
      the best raced design (iteration 5, score 160.41) exactly, since gain and line-loss
      levers are exhausted.


      ### Rationale


      Evidence. The best raced design is iteration 5 (score 160.41): kp 2.5, ki 0.05,
      kd 0.3, base_speed 1.3, sensor_size 0.016, weights [2,1,0,-1,-2], line_loss
      search_right. Every race since iteration 2 has ended off_track, with max_error
      at 0.060 to 0.063 m against the 0.06 m limit.


      The approved entityR1 is stale. Its feedback treats ki 0.10 as an untested candidate,
      but iteration 8 already raced exactly that change and scored 109.75. Oval max_error
      rose from 0.0604 to 0.0616, progress fell from 0.667 to 0.484, and the oval
      finish rate dropped from 3/20 to 0/20. The s-bend and slalom were unchanged.
      The pre-agreed rule therefore applies: revert ki to 0.05 and stop changing gains.
      Steering gain (kp 3.0, iteration 4), kd (0.45, iteration 6), line-loss direction
      (search_right and search_left, iterations 5 and 7) and integral gain (ki 0.10,
      iteration 8) have all been tested and do not improve on iteration 5.


      Change. I return to the iteration 5 design unchanged. This is the only candidate
      with a verified score above 160, and it has completed runs on the oval.


      Expected result. About 160 on the development tracks, matching iteration 5 (oval
      max_error 0.0604, s-bend 0.0623, slalom 0.0616). The next lever is geometry,
      not gain. If max_error is still about 0.06 m, the next single change should
      be the outer sensor spacing (x = plus or minus 0.020 m), since sensor_size is
      at its maximum.


      Measurements wanted per track: completion, progress, completion_time, max_error,
      line_loss_events, steering_oscillation.


      - [Open this output](iteration-9/entity0/versions/1e83e473f6d747aca4ad4ebe6fb98428/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-3836464cfae5f2bc/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-28cbbe1b1b6b7abe/payload.json)'
  - id: entityR1
    label: Approve ki 0.10 test
    notes: 'Approved the iteration 5 design with only controller.ki raised from 0.05
      to 0.10, the one controller lever not yet tested. Evidence: iteration 5 is the
      best raced score (160.41), iteration 7 showed line-loss direction changes nothing,
      and iterations 4 and 6 show kp and kd are exhausted.


      ### Feedback


      Written before this candidate races, so no outcome is claimed for it. The candidate
      is the iteration 5 design (best raced, score 160.41) with one field changed:
      controller.ki from 0.05 to 0.10. It is valid and isolates the integral lever,
      which has not been tested. Iteration 7 (line_loss search_left, score 159.12)
      changed nothing measurable against iteration 5 (oval, s-bend and slalom metrics
      matched to about 0.001 m), so line-loss direction is exhausted. Iteration 4
      (kp 3.0, score 83.5) showed steering gain is exhausted, and iteration 6 (kd
      0.45, score 143.1) pushed oval steering_oscillation to 0.333 and raised max_error
      on the oval and slalom. Every run since iteration 2 has ended off_track with
      max_error at 0.060 to 0.063 m against the 0.06 m limit, so the remaining question
      is whether a steady bias is responsible. Approval is justified because this
      is the best design raced so far, the change is one field, and a revision round
      would cost two of the three remaining action runs for little extra information.
      Next step, depending on the race: if max_error falls below about 0.060 m on
      the oval and slalom, or line_loss_events drop on the s-bend, keep ki 0.10 and
      consider base_speed 1.5 as the next single change only if completion_time is
      limiting. If max_error rises above the iteration 5 values (0.0604 oval, 0.0623
      s-bend, 0.0616 slalom), or steering_oscillation exceeds 0.3 on any track, revert
      ki to 0.05 and stop changing gains. If max_error and line_loss_events are both
      unchanged, the binding limit is likely geometry or sensor resolution, so test
      a single sensor-spacing change in the next iteration.


      ### Requested changes


      - If max_error falls below about 0.060 m on the oval and slalom and steering_oscillation
      stays below 0.3: keep controller.ki 0.10 and test controller.base_speed 1.5
      as the only change, but only if completion_time is limiting on any track (iteration
      5 oval finish at 1.89 s shows speed is adequate there).

      - If max_error rises above the iteration 5 values (0.0604 oval, 0.0623 s-bend,
      0.0616 slalom) or steering_oscillation exceeds 0.3 on any track: revert controller.ki
      to 0.05, since iteration 6 showed oscillation rising with added damping and
      gain changes have already been exhausted.

      - If max_error and line_loss_events are both unchanged from iteration 5 with
      ki 0.10: keep ki 0.10 and test one geometry change, such as moving the outer
      sensors (geometry.sensor_positions x = plus or minus 0.020 m) to widen the signal
      span, since sensor_size is already at its maximum 0.016 and line-loss direction
      gave no change in iterations 5 and 7.


      - [Open this output](iteration-8/entityR1/versions/b188f9ce6ce9428381048e78554318fd/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/d9710d0fd67f4a44a3050a5d83c3cf64/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-1b2e58353a019a66/payload.json)'
