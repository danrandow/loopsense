map:
  id: race-122-opt-eval
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: kd 0.4 damping test
    notes: 'Same geometry and controller as iteration 3, with kd raised from 0.3 to
      0.4 only. Iteration 3 showed steering_oscillation of about 0.14 on the s-bend
      and slalom, and the Evaluator''s rule calls for more derivative damping before
      changing kp or speed.


      ### Rationale


      Evidence: four races (iterations 0 to 3, 240 trials) all ended off track. Progress
      stays at 0.10 to 0.16 and max_error at 0.061 to 0.067 m whatever the base_speed
      (1.6, 1.4, 1.2, 1.0), kp (4.0, 3.5, 2.5), ki (0.05 to 0.2) or sensor footprint
      (0.012 or 0.016). So speed and gain are not the binding limit. The most recent
      race (iteration 3, score 52.06) shows steering_oscillation of 0.139 on the s-bend
      and 0.143 on the slalom, against 0.075 on the oval. The Evaluator''s rule for
      this case is to raise kd toward 0.4 before changing kp or base_speed, and iteration
      1 showed kd 0.3 reduced oval oscillation. Change: kd 0.3 to 0.4. Everything
      else stays as in iteration 3 (geometry unchanged, kp 2.5, ki 0.2, base_speed
      1.0, sensor_size 0.012, line_loss last_direction), so this is a single-lever
      test of damping on the bends. Expected result: steering_oscillation on the s-bend
      and slalom falls below about 0.12, and progress rises modestly, perhaps to 0.2
      or more on the s-bend. Completion in 3 s is not expected at base_speed 1.0.
      Hypotheses: (a) the bend drift is driven by a fast jitter/overshoot loop that
      derivative damping can remove; (b) if progress still sits near 0.15 with low
      oscillation, the limit is geometric (sensors only 0.05 m ahead of the axle,
      so the robot reacts late on curves), and the next test should move the sensor
      row forward (y 0.07) or change wheel_track. Measurements wanted per track and
      per seed: completion, progress, completion_time, rms_error, max_error, line_loss_events,
      steering_oscillation and control_effort, so I can see where on each track the
      run ends.


      - [Open this output](iteration-4/entity0/versions/f8668fc869c74f93bd360c6159ff0d25/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-55711a6addbb5849/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-50b4c3b46547a278/payload.json)'
  - id: entityR1
    label: 'Approve: low-gain test'
    notes: 'Approved the kp 2.5, ki 0.2, base_speed 1.0 candidate to race, because
      all three earlier designs failed identically (progress 0.10 to 0.16, max_error
      about 0.06 to 0.067) and this is the first large change to kp. Feedback gives
      gain-based next steps depending on whether progress rises, stays flat, or oscillates.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Evidence:
      in all three earlier races (iterations 0 to 2) every one of 180 trials ended
      off track, with progress between 0.10 and 0.16 and max_error 0.061 to 0.067
      m. Progress was nearly identical across designs. The s-bend stayed at about
      0.15 and the slalom at about 0.105 whether base_speed was 1.6, 1.4 or 1.2, and
      whether kp was 4.0 or 3.5. Sensor changes (iteration 1 and iteration 2) did
      not move it either. This points to a drift that none of the levers tried so
      far has addressed. The current candidate is the first to change kp substantially
      (4.0 to 2.5), and it pairs that with ki 0.2 and base_speed 1.0, so it tests
      a different regime. The geometry is unchanged from iteration 1 except for sensor_size
      0.012, so it is a clean controller test. It cannot finish the course in 3 s
      at base_speed 1.0, so judge it on progress and max_error. Approve it for telemetry.
      It is valid, early in the race, and the earlier variants share a failure that
      this one tests directly. Read the race as follows. If progress rises well above
      0.2 or the run survives longer on the s-bend and slalom, keep kp near 2.5 and
      raise base_speed in steps (1.2, then 1.4). If progress stays near 0.1 to 0.15
      with low steering_oscillation, the gain is not the limit, so raise ki toward
      0.5 to correct the fixed left/right mismatch. If steering_oscillation is high
      (0.14 or more), raise kd toward 0.4 before changing kp again.


      ### Requested changes


      - After race 3: if progress rises clearly above 0.2 on the s-bend and slalom
      with max_error below 0.06, keep kp near 2.5 and raise controller.base_speed
      in steps (1.0 to 1.2 to 1.4) to reach completion_time under 3 s.

      - After race 3: if progress stays near 0.10 to 0.15 with steering_oscillation
      below 0.10, the gain is not the limit. Raise controller.ki from 0.2 toward 0.5
      to cancel the fixed motor mismatch, keeping kp 2.5.

      - After race 3: if steering_oscillation is 0.14 or higher on any track, raise
      controller.kd from 0.3 to about 0.4 before changing kp or base_speed, since
      iteration 1 showed kd 0.3 reduced oval oscillation.


      - [Open this output](iteration-3/entityR1/versions/9724a9c01295418b85d85b573e553697/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/cece3926634842bf9b83ef1214acbd93/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-2d9d2edb79a38081/payload.json)'
