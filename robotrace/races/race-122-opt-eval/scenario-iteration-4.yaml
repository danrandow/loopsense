map:
  id: race-122-opt-eval
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: kd 0.4 damping test
    notes: 'Same geometry and controller as iteration 3, with kd raised from 0.3 to
      0.4 only. Iteration 3 showed steering_oscillation of about 0.14 on the s-bend
      and slalom, and the Evaluator''s rule calls for more derivative damping before
      changing kp or speed.


      ### Rationale


      Evidence: four races (iterations 0 to 3, 240 trials) all ended off track. Progress
      stays at 0.10 to 0.16 and max_error at 0.061 to 0.067 m whatever the base_speed
      (1.6, 1.4, 1.2, 1.0), kp (4.0, 3.5, 2.5), ki (0.05 to 0.2) or sensor footprint
      (0.012 or 0.016). So speed and gain are not the binding limit. The most recent
      race (iteration 3, score 52.06) shows steering_oscillation of 0.139 on the s-bend
      and 0.143 on the slalom, against 0.075 on the oval. The Evaluator''s rule for
      this case is to raise kd toward 0.4 before changing kp or base_speed, and iteration
      1 showed kd 0.3 reduced oval oscillation. Change: kd 0.3 to 0.4. Everything
      else stays as in iteration 3 (geometry unchanged, kp 2.5, ki 0.2, base_speed
      1.0, sensor_size 0.012, line_loss last_direction), so this is a single-lever
      test of damping on the bends. Expected result: steering_oscillation on the s-bend
      and slalom falls below about 0.12, and progress rises modestly, perhaps to 0.2
      or more on the s-bend. Completion in 3 s is not expected at base_speed 1.0.
      Hypotheses: (a) the bend drift is driven by a fast jitter/overshoot loop that
      derivative damping can remove; (b) if progress still sits near 0.15 with low
      oscillation, the limit is geometric (sensors only 0.05 m ahead of the axle,
      so the robot reacts late on curves), and the next test should move the sensor
      row forward (y 0.07) or change wheel_track. Measurements wanted per track and
      per seed: completion, progress, completion_time, rms_error, max_error, line_loss_events,
      steering_oscillation and control_effort, so I can see where on each track the
      run ends.


      - [Open this output](iteration-4/entity0/versions/f8668fc869c74f93bd360c6159ff0d25/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-55711a6addbb5849/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-50b4c3b46547a278/payload.json)'
  - id: entityR1
    label: 'Approve: kd 0.3 to 0.4'
    notes: 'Approved for racing as a single-lever damping test on iteration 3 (kd
      0.3 to 0.4, all else unchanged). Iteration 3 showed bend oscillation of 0.139
      to 0.143, and iterations 0 to 3 all ended off track, so the race is needed to
      learn whether damping or sensor geometry is the limit.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. The candidate
      is iteration 3 with one change: kd 0.3 to 0.4, with kp 2.5, ki 0.2, base_speed
      1.0, sensor_size 0.012 and the geometry unchanged. Iterations 0 to 3 all ended
      off track (240 trials), with progress 0.10 to 0.16 and max_error 0.061 to 0.067
      m. Iteration 3 (score 52.06) had steering_oscillation 0.139 on the s-bend and
      0.143 on the slalom, against 0.075 on the oval. Its progress stayed near 0.15
      on the s-bend despite kp dropping from 4.0 to 2.5, so gain is not the main limit.
      Iteration 1 suggested kd 0.3 reduced oval oscillation, but that run also changed
      base_speed and ki, so the damping effect is plausible rather than proven. This
      candidate is a clean single-lever test of damping on the bends. It is valid,
      and it is the best test available for the oscillation hypothesis. Read the race
      as follows. If steering_oscillation on the s-bend and slalom falls clearly below
      0.12 and progress rises above 0.2, keep kd 0.4 and raise base_speed in steps
      (1.2, then 1.4), since a finish needs about 1.5 m/s. If oscillation drops but
      progress stays near 0.15, the limit is geometric: the sensors sit only 0.05
      m ahead of the axle, so the robot reacts late on curves. Then move the sensor
      row forward (y to about 0.07) before changing gains again. If oscillation is
      unchanged, the damping hypothesis is weak and kd should not be pushed further.


      ### Requested changes


      - After race 4: if steering_oscillation on the s-bend and slalom falls below
      about 0.12 and progress rises above 0.2, keep controller.kd at 0.4 and raise
      controller.base_speed in steps (1.0 to 1.2 to 1.4). Iteration 3 showed the bend
      oscillation at 0.139 and 0.143.

      - After race 4: if progress stays near 0.15 on the s-bend while oscillation
      falls, change geometry.sensor_positions y from 0.05 to about 0.07 for all five
      sensors, keeping the x values and weights. The sensors sit only 0.05 m ahead
      of the axle, and every gain change so far has left progress near 0.15.

      - After race 4: if steering_oscillation does not fall below 0.139 on the s-bend,
      do not raise kd further. Return kd to 0.3 and treat the drift as geometric or
      as a fixed motor-mismatch problem, which may need ki above 0.2 (iteration 3
      used 0.2).


      - [Open this output](iteration-4/entityR1/versions/37074e1f802a4914988f065997db0c21/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/f8668fc869c74f93bd360c6159ff0d25/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-50b4c3b46547a278/payload.json)'
