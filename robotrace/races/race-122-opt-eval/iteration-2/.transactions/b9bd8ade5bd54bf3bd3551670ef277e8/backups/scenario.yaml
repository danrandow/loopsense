map:
  id: race-122-opt-eval
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Lower kp, larger sensors
    notes: 'Iteration 1 kept the robot off track on every trial with max_error about
      0.062 m, just above the 0.06 m limit, so this build lowers kp to 3.5 and base_speed
      to 1.2, restores ki to 0.1, and enlarges the sensor footprint to 16 mm. The
      changes rest on the iteration 1 race data showing that line loss was not the
      failure and that overshoot in the bends was.


      ### Rationale


      Evidence from iteration 1 (R2A, 60 trials): every run still ended off track
      on all three tracks, and the score fell from 56.08 to 54.27. Widening the sensors
      removed line loss on the oval (0 events) but did not keep the robot on the line.
      Max_error stayed at 0.061 to 0.065 m, just above the 0.06 m limit, on every
      track, and progress was only 0.11 to 0.15. Oscillation on the oval fell to 0.072,
      but on the s-bend and slalom it stayed near 0.14. So the failure is not sensor
      loss. The robot drifts about 6 cm from the line through the bends, probably
      from overshoot at kp 4.0 (a full-scale signal gives about 1400 PWM of differential)
      and the fixed motor mismatch, which the integral term must cancel.


      Changes: (1) kp 4.0 to 3.5, to reduce overshoot and the oscillation that pushes
      the error past 0.06 m. (2) ki 0.05 back to 0.1. Iteration 0 had ki 0.1 and similar
      max_error, and the integral is needed to cancel the constant left/right mismatch,
      so lowering it did not help. (3) base_speed 1.4 to 1.2. Survival comes before
      speed: a run that stays on track and reaches progress 1 is worth far more than
      an early exit, and the 3 s finish needs about 1.5 m/s, which I will raise to
      once the robot survives. (4) Sensor footprint 0.012 to 0.016, so each sensor
      sees more tape at the 6 cm offsets and the signal is smoother. Geometry positions
      and weights stay as in iteration 1, so the steering sign is unchanged. kd stays
      at 0.3 to damp the jitter.


      Expected result: max_error below 0.06 on the oval and s-bend, line_loss_events
      near 0, and completion on at least the oval. Finish time will be well over 3
      s at this speed. Risks: lower kp may leave the robot slow to correct on the
      sharpest slalom bends, and the larger footprint may blur the edges of the tape.
      Hypotheses to check next: (a) kp is the main driver of the 0.06 m overshoot;
      (b) survival at base_speed 1.2 is enough to get completion=1 or progress near
      1. Measurements wanted: completion, progress, completion_time, rms_error, max_error,
      line_loss_events and steering_oscillation, per track and per seed.


      - [Open this output](iteration-2/entity0/versions/ed3aeaa1204041879d42552b83218647/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-dc81f5368ce841a1/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-0da50b2a0d22dc2c/payload.json)'
  - id: entityR1
    label: Approve wider sensors
    notes: 'Approved the wider five-sensor array (x up to ±0.05) with base_speed 1.4,
      kd 0.3 and ki 0.05, because it directly targets the off-track failure seen in
      R2B (all 60 trials off track, max_error just above 0.06 m). Feedback sets next
      steps by race outcome and makes no claims about this candidate''s performance.


      ### Feedback


      This candidate responds directly to the failure in iteration 0 (R2B: 60 of 60
      trials ended off track, mean max_error 0.062 to 0.067 m, against the 0.06 m
      limit; line_loss_events 1 to 2 per run). Its changes are: sensors widened to
      x = -0.05 to 0.05 (keeping the antisymmetric weights -1, -0.5, 0, 0.5, 1 so
      the steering sign is unchanged), base_speed lowered from 1.6 to 1.4, kd raised
      from 0.2 to 0.3, and ki lowered from 0.1 to 0.05. kp stays at 4.0 and line_loss
      stays ''last_direction''. The geometry and controller values are all inside
      their contract limits. Nothing here predicts how it will race. The main reasoning
      is that survival matters more than speed: a run that stays on track and reaches
      full progress is worth far more than an early off-track exit, so a lower base
      speed is a reasonable trade. The main risk is that base_speed 1.4 may be too
      slow to finish under 3 s, so completion is uncertain even if the robot survives.
      Because iteration 0 has no approved candidate that ran well and there are many
      iterations left, this is the right build to race for telemetry. After the race:
      (a) if line_loss_events is near 0 and max_error is under 0.06 on the oval and
      s-bend, but completion_time is above 3 s or completed=0 with progress near 1,
      raise base_speed in small steps (1.5 to 1.6) and keep the wider sensors. (b)
      If max_error is still above 0.06 on the slalom, raise kp toward 5 as the hypothesis
      states, and keep kd at 0.3 to avoid added oscillation. (c) If steering_oscillation
      rises after the kd change, reduce kd back toward 0.2 before changing kp.


      ### Requested changes


      - After race 1: if the robot survives (completion 0 but progress near 1, or
      completion 1) with line_loss_events near 0, raise controller.base_speed in steps
      (1.4 to 1.5 to 1.6) to reach completion_time under 3 s, keeping the wider sensor
      array.

      - After race 1: if max_error stays above 0.06 on the slalom, raise controller.kp
      from 4.0 to about 5.0 and keep kd at 0.3, since the wider spread should already
      have cut line-loss events.

      - After race 1: if steering_oscillation rises above the 0.14 to 0.17 range seen
      in iteration 0, lower controller.kd from 0.3 to 0.2 before changing kp or base_speed.


      - [Open this output](iteration-1/entityR1/versions/f95832d626a045949c94b7afd37fe52e/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/72780450bf55476baf4dc7197c67ab16/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-94d003d770a942ef/payload.json)'
