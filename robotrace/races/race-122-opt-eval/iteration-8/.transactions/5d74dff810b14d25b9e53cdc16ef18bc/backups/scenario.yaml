map:
  id: race-122-opt-eval
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: kd 0.35 on kp 3.0 build
    notes: 'Single-lever test: iteration 7''s best raced build (kp 3.0, ki 0.2, kd
      0.4, y=0.07) with kd lowered to 0.35 as the Evaluator requested. It targets
      the oval oscillation rise (0.341 in iteration 7) while checking that progress
      holds (oval 0.741, s-bend 0.312).


      ### Rationale


      Evidence: the best raced build is iteration 7 (kp 3.0, ki 0.2, kd 0.4, y=0.07,
      base_speed 1.0, score 162.45). Forward sensors (y 0.05 to 0.07) raised oval
      and s-bend progress, and kd 0.4 raised progress on every track. Iteration 6
      showed that ki 0.3 lowered the score with no progress gain, so ki stays at 0.2.
      The Evaluator''s requested change is the clean test: keep the iteration-7 controller
      and change only kd, from 0.4 to 0.35. The evidence on kd is mixed. kd 0.3 to
      0.4 raised progress on every track, but it also raised oval steering_oscillation
      (0.075 to 0.283). Lowering kd to 0.35 is a test of whether oscillation can fall
      while progress holds. Changes from iteration 7: controller.kd 0.4 to 0.35, and
      nothing else. Geometry is unchanged (y=0.07, x = -0.05 to 0.05, sensor_size
      0.012, weights [-1, -0.5, 0, 0.5, 1]), base_speed stays at 1.0, and line_loss
      stays ''last_direction''. Survival still comes before speed. Expected result:
      oval steering_oscillation below the 0.341 measured in iteration 7, with s-bend
      progress near 0.31 and oval progress near 0.74. The risk is that progress falls
      below the Evaluator''s thresholds (s-bend 0.31, oval 0.67), in which case kd
      returns to 0.4. Hypotheses: (a) kd 0.35 reduces bend jitter without losing much
      damping, so oscillation falls with progress held; (b) line loss and max_error
      stay near 0.06, so the drift is still geometric or a mismatch problem. Measurements
      wanted per track and per seed: completion, progress, completion_time, rms_error,
      max_error, line_loss_events, steering_oscillation and control_effort, so the
      kd effect can be compared with iteration 7 on each track.


      - [Open this output](iteration-8/entity0/versions/bdecd42ac3ca4446ab4bf9fbfe7a93f6/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/c6959d1c6cbd42a8a78d9caaed0110ce/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-9a0202638004e62d/payload.json)'
  - id: entityR1
    label: 'Revise: kp3.0, kd 0.35'
    notes: 'Rejected the kp 2.5 / kd 0.35 build because iteration 7 (kp 3.0) is the
      best raced design at 162.45. The revision moves kd alone from that best build,
      so the next race is a clean damping test. Evidence: iteration 4 (kd 0.4) raised
      progress on all tracks, while the oval oscillation rise points to a trade-off.


      ### Feedback


      Revise. The candidate is the iteration-5 build (kp 2.5, kd 0.4, ki 0.2, y=0.07,
      base_speed 1.0) with kd 0.4 changed to 0.35. Iteration 7 raised kp to 3.0 on
      the same build and reached the best raced score (162.45, vs 160.17 at kp 2.5).
      Lowering kd to 0.35 on the kp 2.5 build would therefore be a test against a
      weaker baseline, and the candidate does not carry the best measured kp. Evidence
      on kd is mixed: kd 0.3 to 0.4 (iteration 3 to 4) raised progress on every track
      (oval 0.12 to 0.48, s-bend 0.15 to 0.26), but the same change raised oval steering_oscillation
      from 0.075 to 0.283. A drop to 0.35 may therefore reduce oscillation at some
      cost in progress. The clean test is to hold the best-raced controller (kp 3.0,
      ki 0.2) and move only kd, so the race compares directly with iteration 7. Nothing
      here predicts how the revised design will race. Keep y=0.07 sensors and base_speed
      1.0; survival still comes before speed, since no track has more than one finish
      across 60 trials per race.


      ### Requested changes


      - Set controller.kp to 3.0 and keep controller.ki at 0.2 (the iteration-7 best
      raced build, score 162.45), then set controller.kd to 0.35 as the only change
      from that build. This makes the race a clean kd test against iteration 7.

      - After the race: if s-bend progress falls below 0.31 or oval progress falls
      below 0.67 with kd 0.35, return controller.kd to 0.4 and keep kp 3.0. Iteration
      4 showed that kd 0.3 to 0.4 raised progress on every track.

      - After the race: if oval steering_oscillation falls clearly below 0.272 with
      progress held (at or above the iteration-7 values), keep kd 0.35 and only then
      test base_speed 1.1. Keep geometry.sensor_positions at y=0.07, because iteration
      5 confirmed the forward-sensor lever.


      - [Open this output](iteration-8/entityR1/versions/c6959d1c6cbd42a8a78d9caaed0110ce/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/b68966090d474cc5b77d87b04b7bb6c7/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-9a0202638004e62d/payload.json)'
