map:
  id: race-122-opt-eval
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Forward sensors y=0.07
    notes: 'Keeps race 4''s best gains (kd 0.4, kp 2.5, ki 0.2, base 1.0) and moves
      the sensor row from y 0.05 to 0.07 as a single geometric test. Race 4 raised
      progress (score 120.36) but bend oscillation rose, so the drift looks geometric
      (late reaction on curves), not a damping problem.


      ### Rationale


      Evidence from race 4 (score 120.36, up from 52.06): progress rose on every track
      (oval 0.48, s-bend 0.26, slalom 0.125), so kd 0.4 helped the robot cover more
      of the course. The damping hypothesis for bend oscillation did not hold, though.
      steering_oscillation on the s-bend rose from 0.139 to 0.202, the slalom stayed
      at 0.143, and the oval rose from 0.075 to 0.283. The Evaluator''s rule says
      that if bend oscillation does not fall below about 0.139, kd should not be pushed
      further. I am keeping kd at 0.4 rather than reverting to 0.3, because it is
      the best measured setting and reverting would likely lose progress. I am not
      raising kd further. The oval and s-bend failures are now more likely geometric.
      The sensors sit only 0.05 m ahead of the axle, so the robot reacts late on curves.
      This matches the feedback''s second branch: progress stayed near 0.15 on the
      s-bend while the gains changed, and kd alone has only partly moved it. Change
      (single lever on geometry): move all five sensor rows forward from y 0.05 to
      y 0.07, keeping the x values and weights [-1, -0.5, 0, 0.5, 1]. The sensors
      then see the tape roughly 2 cm earlier, which gives the controller more lead
      on bends. Controller gains, base_speed (1.0), ki (0.2), line_loss and sensor_size
      (0.012) stay as in race 4, so the race isolates the sensor-position effect.
      Expected result: s-bend and slalom progress rises above 0.26, and oval progress
      holds near or above 0.48 with oscillation at or below the race-4 level. Completion
      in 3 s is still not expected at base_speed 1.0. Hypotheses: (a) forward sensors
      reduce the late-reaction overshoot on bends; (b) if progress does not rise,
      the drift is a fixed motor mismatch that needs ki above 0.2, and the next test
      should be ki 0.3 with kd 0.4. Measurements wanted per track and per seed: completion,
      progress, completion_time, rms_error, max_error, line_loss_events, steering_oscillation
      and control_effort, so I can see where each run ends.


      - [Open this output](iteration-5/entity0/versions/107c2468d6e045a3a8214b311e77dea3/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-39a886b0a7d10ae5/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-a4377a4aec9a3432/payload.json)'
  - id: entityR1
    label: 'Approve: sensors to'
    notes: 'Approved the best-raced build (score 120.36) with one change, sensor rows
      moved forward from y=0.05 to y=0.07, to test whether late bend reaction is geometric.
      Evidence is iteration 4, where progress stayed near 0.15 to 0.26 on bends while
      gains changed and bend oscillation rose.


      ### Feedback


      This candidate is the best raced design (iteration 4, score 120.36) with one
      geometry change: all five sensor rows move from y=0.05 to y=0.07 m. The x values
      and weights [-1, -0.5, 0, 0.5, 1] are unchanged, and the y value is inside the
      allowed range. It keeps kd at 0.4 even though the iteration-4 rule said to return
      to 0.3 if bend oscillation did not fall. The Optimizer explains that kd 0.4
      gave the best measured progress on all three tracks (oval 0.48, s-bend 0.26,
      slalom 0.125), so I accept that override for this race. The earlier evidence
      supports this lever: iteration 4 showed progress stuck near 0.15 to 0.26 on
      the bends while the gains changed, and it did not move the bend oscillation
      down (s-bend 0.139 to 0.202). This points to late reaction on bends as a geometric
      limit, not a gain limit. I am approving this race because it is a clean single-lever
      test on the best build, and the telemetry will show whether forward sensors
      help. Read the race as follows. If s-bend and slalom progress rises above the
      iteration-4 values (0.26 and 0.125) with oscillation at or below the iteration-4
      level, keep y=0.07 and then test ki 0.3 with kd 0.4. If progress does not rise,
      the drift is more likely a fixed motor mismatch, so raise ki and keep the sensors
      at y=0.07. If oscillation rises sharply on the oval, lower kd back to 0.3 before
      any further geometry change.


      ### Requested changes


      - After race 5: if s-bend and slalom progress rises above 0.26 and 0.125 with
      steering_oscillation at or below the iteration-4 values, keep geometry.sensor_positions
      at y=0.07 and test controller.ki at 0.3 with kd 0.4, since the drift may then
      be a fixed motor mismatch.

      - After race 5: if progress does not rise on the s-bend (still about 0.26 or
      lower), keep y=0.07 and raise controller.ki from 0.2 to 0.3 to cancel the fixed
      left/right mismatch, because the iteration-4 gain changes did not move progress.

      - After race 5: if steering_oscillation on the oval rises above the iteration-4
      value of 0.283, lower controller.kd from 0.4 to 0.3 and keep y=0.07, because
      iteration 1 showed kd 0.3 reduced oval oscillation.


      - [Open this output](iteration-5/entityR1/versions/d2a4074ae5344a539bdfc966ee31dec1/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/107c2468d6e045a3a8214b311e77dea3/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-a4377a4aec9a3432/payload.json)'
