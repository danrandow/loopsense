  entities:
  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'First iteration with no race data: a conservative five-sensor, antisymmetric-weight
      baseline at 1.6 base speed with kp 4, ki 0.1, kd 0.2. Chosen to finish the course
      and produce telemetry to guide the next revision.


      ### Rationale


      Iteration 0 has no race data or Evaluator feedback, so this is a conservative
      baseline meant to finish the course and gather telemetry. Geometry: five line
      sensors spread across 0.06 m at the front of the body (y=0.05 m ahead of the
      axle), 12 mm footprint so the 25 mm tape always covers at least one or two sensors.
      Weights are antisymmetric and scale with sensor position (-1.0 to +1.0), so
      a left-of-centre tape gives a positive signal that steers left, as the contract
      requires. Wheel track 0.12 m and radius 0.03 m give a moderate turn rate and
      speed; mass 0.8 kg keeps yaw inertia modest. Controller: base_speed 1.6 (about
      80% PWM) to aim for the roughly 1.5 m/s needed to finish in under 3 s; kp 4.0
      gives a strong but not violent correction (a full-scale signal gives about 1400
      PWM of differential); ki 0.1 is small to avoid integral windup on bends; kd
      0.2 damps oscillation with little noise amplification; line_loss ''last_direction''
      lets the robot recover toward the side it was last on. Expected result: completion
      on the oval and s-bend, with some wobble on the slalom. I expect rms_error to
      be a few millimetres and line_loss_events near zero. The first race should show
      whether speed or kp is the limit. Hypotheses to test: (1) finish time is limited
      by base_speed, not steering; (2) kp 4 is enough without kd-induced jitter; (3)
      the 0.06 m outer sensors are not needed on gentle bends.


      - [Open this output](iteration-0/entity0/versions/9c12c3b9129443eba19dd27565111ef9/payload.json)'
  actions:
