  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Race evidence: iteration 1 (±3 cm span, 5 sensors at 1.5 cm pitch, 12 mm footprints,
      4 cm lead, 0.6 kg, 0.11 m track) is the best design so far at 51.27. Its s-bend
      progress was 0.155. Iteration 3 changed only the lead, to 2 cm, and scored 25.37.
      Its s-bend progress fell to 0.04, and line losses stayed at 1 per run. The 2
      cm lead is therefore worse, not better. Iteration 2 also gave s-bend progress
      of 0.04 with a 3 cm lead, so a short lead is consistently associated with the
      s-bend collapse. Widening the span to ±6 cm with 16 mm footprints (iteration
      2) removed line losses but did not stop off-track exits. So neither span nor
      lead below 4 cm is the answer. The Integrator''s feedback for iteration 3 asked
      for the decision rule: if progress falls, restore the 4 cm lead and test sensor_size
      0.016 alone. Progress did fall, so I follow that rule. I restore the iteration
      1 geometry exactly (±3 cm, 5 sensors, 4 cm lead, 0.6 kg, 0.11 m track, 0.03
      m wheel radius, 0.12 m body) and change only sensor_size from 0.012 to 0.016.
      Expected result: the larger footprint lets each sensor see more of the 25 mm
      tape at the ±3 cm extremes, so line losses should fall toward 0 without the
      wide-span penalty seen in iteration 2, and max_error should drop below about
      0.06 m with s-bend progress at or above 0.15. Off-track exits are still expected
      to be the limit. If progress is unchanged and line losses remain at 1, the next
      candidate is a ±4 cm span at 16 mm. If progress falls again, the footprint is
      not the variable and the lead of 4 cm is the best geometry, so the remaining
      gap should be handled by the Integrator''s gains.


      - [Open this output](iteration-4/entity0/versions/330f8b6c69b44a5694c7a89af29193ef/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-6027ca58190a3dd0/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-300d772fe630dca4/payload.json)'
  - id: entity1
    label: Lead 2 cm test package
    notes: 'Keeps the iteration 1 geometry (±3 cm, 12 mm, 0.6 kg) and moves the lead
      to 2 cm, with gains unchanged. Iteration 1 was the best design at 51.27, and
      iteration 2 showed span and footprint are not the limit.


      ### Rationale


      Iteration 1 (±3 cm span, 4 cm lead, 12 mm footprints, 0.6 kg, 0.11 m track)
      remains the best design, scoring 51.27 with line losses at 1 per run. Iteration
      2 (±6 cm, 16 mm footprints, 3 cm lead) cut line losses to 0 but still ended
      every run off track at max_error about 0.06 m, and s-bend progress fell to 4%.
      So span and footprint are not the limit, and line losses are not the cause of
      the exit. The Builder''s single-variable test moves the lead from 4 cm to 2
      cm on the iteration 1 geometry. I keep that geometry (±3 cm, five sensors at
      1.5 cm pitch, 12 mm footprints, 0.6 kg, 0.11 m track, 0.03 m wheel radius) and
      change only the lead. The weights stay [-2,-1,0,1,2], which is the left-positive
      ordering used in iteration 1. kp 3.0 and ki 0 carry over unchanged. kd stays
      at 0.1, not the 0.15 used in iteration 2, because the iteration 1 array is the
      one being tested and kd was not the variable under study. base_speed 1.6 and
      line_loss ''last_direction'' are unchanged. Expected result, not measured: progress
      above 0.15 on the s-bend and 0.11 on the oval, and max_error below 0.06 m if
      the lead is the limit. If progress falls or line losses rise, the lead is too
      close and the next step is to restore 4 cm and test sensor_size 0.016 alone.


      - [Open this output](iteration-3/entity1/versions/0e0b6a4ba6e841a8b5fe1b7b33637fd3/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/041d859893294c89a977a09f89df4efc/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-d75b50be2e54e1e7/payload.json)'
  - id: entityR1
    label: Lead then footprint
    notes: 'Advises a 2 cm lead test on the best geometry, then a 16 mm footprint
      test if progress does not improve. Based on iterations 1 and 2 where line losses
      and off-track exits did not move together.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. (1) Iteration
      1 (±3 cm, 4 cm lead, 0.6 kg) is the best evidence so far: line losses fell from
      1-2 to 1 per run, but every run still went off track at 11-16% progress with
      max_error 0.061-0.066 m (entityR2B). (2) Iteration 2 (±6 cm, 16 mm footprints,
      3 cm lead) reached 0 line losses on every track, yet still went off track at
      max_error about 0.06 m, and s-bend progress fell to 4%. So the robot can leave
      the line while the sensors still see tape, and a wider footprint did not help.
      Oscillation stayed in 0.065-0.155 in all iterations, so jitter is not the limit.
      (3) The Integrator has kept the controller on the same weight pattern and kp
      3.0 across iterations 1-3, so geometry changes alone have been tested without
      gain changes. Next race: if progress rises above 0.15 on the s-bend and max_error
      falls below 0.06 m with 0 line losses, keep the 2 cm lead and test sensor_size
      0.012 at ±4 cm. If progress falls or line losses rise, restore the 4 cm lead
      and test sensor_size 0.016 alone. If line losses stay at 1 per run with the
      lead unchanged, a wider footprint or a ±4 cm span is the next candidate.


      ### Requested changes


      - Keep the ±3 cm span, 5 sensors, and 12 mm footprints from iteration 1, and
      move the lead from y = 0.04 m to y = 0.02 m. Iteration 1 showed line losses
      at 1 per run with off-track exits at max_error about 0.06 m, so the lead is
      the single variable still untested below 3 cm.

      - If progress does not rise above 0.15 on the s-bend, restore y = 0.04 m and
      set sensor_size to 0.016 m alone. Iteration 2 used 16 mm footprints with a ±6
      cm span and gave 0 line losses but no progress gain (score 26.99), so test footprint
      without changing span.

      - If steering_oscillation exceeds about 0.15 after the lead change, keep the
      lead and reduce kd or change sensor pitch rather than widening the span further.
      Iteration 2 kept oscillation at 0.065-0.075 on the oval and slalom, so high
      jitter would point to the lead.


      - [Open this output](iteration-3/entityR1/versions/0e0b6a4ba6e841a8b5fe1b7b33637fd3/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/041d859893294c89a977a09f89df4efc/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-d75b50be2e54e1e7/payload.json)'
