map:
  id: race-121-randow-maps
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: ±4 cm span, 16 mm, 4 cm
    notes: 'Widens the five-sensor span from ±3 cm to ±4 cm at a 2 cm pitch, keeping
      the 4 cm lead and 16 mm footprint. Iteration 4 showed the footprint change was
      neutral (score 51.12, progress 0.155, one line loss per run), so this tests
      the span as the Integrator asked. Expect line losses to fall to 0 with progress
      held.


      ### Rationale


      Iteration 4 (±3 cm span, 4 cm lead, 16 mm footprints) scored 51.12, essentially
      level with iteration 1 (51.27). The s-bend progress was 0.155 in both, and line_loss_events
      stayed at 1 per run. So the footprint change did nothing measurable, and sensor_size
      0.016 is neutral. The rule I set last iteration now applies: progress is unchanged
      and line losses remain at 1, so the next geometry test is a ±4 cm span at 16
      mm with 5 sensors. Iteration 2''s s-bend collapse (progress 0.04) came with
      a 3 cm lead as well as the ±6 cm span. Iteration 3 showed a short lead is harmful,
      so that collapse is not clean evidence against a wider span at a 4 cm lead.
      I therefore keep the 4 cm lead, 0.6 kg, 0.11 m track, 0.03 m wheel radius and
      0.12 m body, and change only the span: x = -0.04, -0.02, 0, 0.02, 0.04 at y
      = 0.04 m, with sensor_size 0.016 m. Expected result: the outermost sensors reach
      the tape on bends that currently drop one line loss per run, so line_loss_events
      should fall toward 0 and max_error should stay below about 0.06 m. Progress
      should hold at or above 0.15 on the s-bend. If progress falls below 0.11 on
      the oval, the span is too wide and I return to ±3 cm. The steady rms_error of
      about 0.03 on every track is probably a motor-mismatch offset, which is a controller
      question for the Integrator, not something geometry can fix.


      - [Open this output](iteration-5/entity0/versions/932a831b8a964b65b1fd4c6cc89b1dcc/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-42ed15ef4c13ecc7/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-b1c7254b488a34e5/payload.json)'
  - id: entity1
    label: ±4 cm span test package
    notes: 'Runnable package for the Builder''s ±4 cm, 2 cm pitch, 16 mm, 4 cm lead
      geometry, with the iteration 4 controller unchanged so only span varies. Weights
      x/0.02 keep the proven ordering from iteration 4.


      ### Rationale


      Iteration 4 (±3 cm span, 4 cm lead, 12 mm footprints) was the best reference,
      with s-bend progress 0.155, oval 0.11 and one line loss per run. Iteration 2
      (±6 cm, 3 cm lead) removed line losses but collapsed s-bend progress to 0.04.
      Iteration 3 (2 cm lead) also collapsed s-bend progress to 0.04. The 3 cm lead
      and the wide span were confounded in iteration 2, so the ±4 cm span at 4 cm
      lead is still untested. I keep the Builder''s geometry as proposed: five sensors
      at x = -0.04 to +0.04 in 2 cm steps, y = 0.04 m, 16 mm footprints, 0.6 kg, 0.11
      m track, 0.03 m wheel radius, 0.18 x 0.12 m body. Weights are [-2, -1, 0, 1,
      2], which equal x/0.02. This is the same signal ordering and per-sensor weight
      pattern that worked in iteration 4, so the controller needs no rescaling. Gains
      stay at kp 3.0, ki 0, kd 0.1, base_speed 1.6 and line_loss ''last_direction'',
      so the Builder''s single-variable test is preserved. rms_error stays near 0.03
      on all tracks in every iteration, which points to a motor-mismatch offset. I
      do not add ki here because the test is geometry-only and integral action on
      a curved course is untested. Expected result, not measured: line_loss_events
      falls toward 0 with progress at or above 0.155 on the s-bend. If the oval falls
      below 0.11, the span is too wide.


      - [Open this output](iteration-5/entity1/versions/16d213eaa8b24f1f8b19d71ac91484d0/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/932a831b8a964b65b1fd4c6cc89b1dcc/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-b1c7254b488a34e5/payload.json)'
  - id: entityR1
    label: Span and lead feedback
    notes: 'Pre-race feedback: keep the 4 cm lead, test ±4 cm span, and use the next
      race''s line losses and oval progress to decide between wider span and return
      to ±3 cm. Evidence from iterations 2, 3 and 4 is cited.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. (1) Iteration
      4 (±3 cm, 4 cm lead, 16 mm, kp 3.0, kd 0.1) gave s-bend 0.155, oval 0.11 and
      one line loss per run (entityR2B), so the controller works at this lead and
      footprint. (2) Iteration 3 (2 cm lead) and iteration 2 (3 cm lead) both collapsed
      s-bend progress to 0.04, so leads below 4 cm are harmful. Iteration 2 also had
      a wider span, so its collapse cannot be assigned to span alone. (3) Iteration
      2 at ±6 cm with 0 line losses still ended off track at max_error about 0.06
      m, so line loss is not the only exit cause. (4) rms_error held near 0.03 on
      all tracks in every iteration and steering_oscillation stayed between 0.065
      and 0.155, so the controller has no jitter problem and the remaining offset
      is probably a motor-mismatch term. Next race: if line losses fall to 0 and s-bend
      progress stays at or above 0.155, keep the ±4 cm span and try a 4 cm lead at
      2 cm pitch. If progress falls below 0.11 on the oval, the span is too wide,
      so return to ±3 cm at 16 mm. If line losses stay at 1 with progress unchanged,
      the line_loss setting or the gains are the next lever, not geometry.


      ### Requested changes


      - Keep the 4 cm lead (y = 0.04 m) and 16 mm footprint from iteration 4, and
      widen the span to ±4 cm at 2 cm pitch (x = -0.04, -0.02, 0, 0.02, 0.04). Iteration
      4 at ±3 cm still lost the line once per run, and iteration 2 at ±6 cm removed
      losses but was confounded by its 3 cm lead.

      - If line losses are 0 but oval progress falls below 0.11, return to ±3 cm at
      2 cm pitch is not required; instead restore the ±3 cm span at 1.5 cm pitch with
      16 mm footprints, which is the iteration 4 reference (progress 0.155 on the
      s-bend).

      - Do not move the lead below 4 cm. Iterations 2 and 3 both show s-bend progress
      collapsing to 0.04 when the lead is 3 cm or 2 cm (entityR2B).


      - [Open this output](iteration-5/entityR1/versions/16d213eaa8b24f1f8b19d71ac91484d0/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/932a831b8a964b65b1fd4c6cc89b1dcc/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-b1c7254b488a34e5/payload.json)'
