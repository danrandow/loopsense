map:
  id: race-121-randow-maps
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 7 tested footprint at 1 cm pitch: seven 12 mm sensors at x = -0.03
      to +0.03, y = 0.04 m. It scored 51.1159, against 51.1083 for the 16 mm footprint
      in iteration 6. Per-track results were unchanged: s-bend progress 0.155, oval
      0.11, slalom 0.1075, one line loss per run and max_error about 0.061 to 0.067
      m. Footprint is therefore neutral at 1 cm pitch, as it was at 1.5 cm pitch in
      iterations 1 and 4. The pitch collapse (2 cm or wider) and the lead collapse
      (below 4 cm) are both established, and no geometry tested so far has removed
      the one line loss per run or the off-track exit at about 0.06 m. The Geometry
      Realm''s own decision rule for this case is met: s-bend progress is at least
      0.15 and line losses are at most 1, so the next geometry test is a narrower
      footprint. I therefore propose sensor_size 0.008 m with the same seven-sensor,
      1 cm pitch, 4 cm lead layout. The only change is the footprint, which tests
      whether the 12 mm footprint over-weights the outer sensors. A 8 mm footprint
      at 10 mm pitch still covers the 25 mm tape (about 4 mm gap between footprints).
      Body, mass, track and wheel radius stay fixed. Expected result: s-bend progress
      stays at or above 0.15 and line losses stay at or below 1, with the score close
      to 51. If progress falls below 0.11 on the oval or s-bend, the footprint was
      needed and I restore 0.012 m. If the result is unchanged, geometry has reached
      its plateau and the remaining lever is the controller (line_loss setting or
      gains), which I will say so in the next feedback request. Iterations 1 and 7
      differ by only 0.15 points, so I do not treat the 0.272 best score in iteration
      1 as a meaningful improvement.


      - [Open this output](iteration-8/entity0/versions/911fb7e8bed64ba3a083488465328338/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-f30aeb51b79d2e74/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-a2b74324ccef1718/payload.json)'
  - id: entity1
    label: 12 mm footprint test
    notes: 'Iteration 6 layout with sensor_size cut from 16 to 12 mm, controller unchanged
      so footprint is the only variable. Based on iteration 6 (s-bend 0.155, one line
      loss per run) and the neutral footprint result at 1.5 cm pitch.


      ### Rationale


      The Builder''s proposal is a single-variable test from iteration 6 (score 51.11).
      Only sensor_size changes, from 0.016 to 0.012 m. The layout stays at seven sensors,
      1 cm pitch, x from -0.03 to +0.03 m, y = 0.04 m, with the 0.6 kg mass, 0.11
      m track and 0.03 m wheel radius. Evidence: iteration 6 gave s-bend 0.155, oval
      0.11, slalom 0.1075 and one line loss per run. Iterations 2, 3 and 5 all collapsed
      s-bend progress to 0.04 at 2 cm pitch or a 2 to 3 cm lead, while 1 cm and 1.5
      cm pitch held 0.155. Footprint at 1.5 cm pitch made no measurable difference
      (iterations 1 and 4). Footprint at 1 cm pitch is untested, so the controller
      is kept byte-for-byte identical to iteration 6 (kp 3.0, ki 0, kd 0.1, base_speed
      1.6, last_direction line loss, weights x/0.015). That keeps any change in the
      race attributable to sensor_size. The weight vector already matches the iteration
      4 and 6 slope, so no rescaling is needed. Expected result, not measured: s-bend
      progress at or above 0.15 and line losses at or below 1 per run. If progress
      falls below 0.11, the 16 mm footprint was needed, and the next lever is the
      controller''s line_loss handling or gains, not geometry. rms_error stayed near
      0.03 on all tracks in every iteration, which points to a steady motor-mismatch
      offset. I am not adding ki in this single-variable test, because integral action
      on a curved course is untested.


      - [Open this output](iteration-7/entity1/versions/1cf529fc73ca496e96a9fc020dd2351b/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/7879ac3a8ec344d4a23eeb859792541f/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-ef65235c4fd6a84b/payload.json)'
  - id: entityR1
    label: Footprint next steps
    notes: 'Feedback on what to do next depending on the 12 mm race: keep it and try
      8 mm if progress holds, or restore 16 mm if progress falls below 0.11. Also
      records that leads below 4 cm and 2 cm pitch caused the s-bend collapse.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. (1) Iteration
      6 (seven 16 mm sensors, 1 cm pitch, 4 cm lead, x/0.015 weights, kp 3.0, kd 0.1)
      is the best current reference: s-bend 0.155, oval 0.11, slalom 0.1075, one line
      loss per run, score 51.11 (entityR2B). The controller works at this layout.
      (2) Iterations 2, 3 and 5 all collapsed s-bend progress to 0.04. Iteration 3
      changed only the lead (2 cm), so leads below 4 cm are harmful on their own.
      Iteration 5 kept the 4 cm lead but used 2 cm pitch, so pitch is the likely cause
      of its collapse. (3) Footprint has been neutral at 1.5 cm pitch (iterations
      1 and 4, both 0.155 s-bend), so 12 mm versus 16 mm is not yet known to matter
      at 1 cm pitch. (4) Iteration 2 at plus or minus 6 cm removed line losses but
      still left the track at max_error about 0.06 m, so line losses are not the only
      exit cause. (5) rms_error stayed near 0.03 and steering_oscillation between
      0.065 and 0.155 in every iteration, so the offset looks like a motor-mismatch
      term rather than geometry. Next race: if s-bend progress stays at or above 0.15
      and line losses are at or below 1, footprint is neutral at 1 cm pitch too. Keep
      12 mm, and the next geometry test is a narrower footprint (0.008 m) to see whether
      the outer sensors are over-weighted. If s-bend progress falls below 0.11, the
      16 mm footprint was needed, so restore 0.016 m. If progress is unchanged and
      line losses stay at 1, geometry is no longer the lever, and the line_loss setting
      or gains are the next tests.


      ### Requested changes


      - Keep the iteration 6 layout (seven sensors at x = -0.03 to +0.03 in 0.01 m
      steps, y = 0.04 m) and set sensor_size to 0.012 m, as proposed. If s-bend progress
      is at least 0.15 and line losses are at or below 1, next try sensor_size 0.008
      m with the same layout to test whether a narrower footprint sharpens the edge
      signal (iteration 4 showed footprint neutral at 1.5 cm pitch).

      - If s-bend progress falls below 0.11 or the oval falls below 0.11, restore
      sensor_size 0.016 m. Iteration 6 at 16 mm gave s-bend 0.155 and oval 0.11, so
      the larger footprint is needed at 1 cm pitch.

      - Do not move the lead below 4 cm (y = 0.04 m). Iterations 2, 3 and 5 show s-bend
      progress collapsing to 0.04 at 2 cm and 3 cm leads, and the lead is not the
      limit at 4 cm (iteration 4 and 6 both 0.155).


      - [Open this output](iteration-7/entityR1/versions/1cf529fc73ca496e96a9fc020dd2351b/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/7879ac3a8ec344d4a23eeb859792541f/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-ef65235c4fd6a84b/payload.json)'
