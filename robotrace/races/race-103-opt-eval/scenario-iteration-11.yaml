  entities:
  - id: entity0
    label: Iter 7 best, resubmitted
    notes: 'Resubmits the approved iteration 7 best (688.5) unchanged, since the Evaluator''s
      approval covers only that build and no revision can race. It finished oval and
      s-bend 20 of 20 but the slalom still 0 of 20, so this is the baseline to protect.


      ### Rationale


      This is the final iteration, and the only remaining model action is the Evaluator''s
      review. The Evaluator approved the iteration 7 best (688.5) resubmitted unchanged,
      and said no revision can be reviewed and raced. Any edit would be unreviewed
      and could not race, so I resubmit that approved build exactly: kp 2.8, kd 0.9,
      ki 0, base_speed 1.1, sensor_weights [-2,-1,0,1,2], line_loss ''last_direction'',
      sensor_size 0.012, and the iteration 4 spread (x = -0.024, -0.012, 0, 0.012,
      0.024 m at y = 0.04 m). Body, wheel and mass values are unchanged.


      Evidence: this design is the best raced candidate. It finished the oval 20 of
      20 (mean 1.96 s) and the s-bend 20 of 20 (mean 2.57 s), with rms_error low on
      both. The slalom still finished 0 of 20, with max_error about 0.062 and about
      1 line-loss event per run. Speed, spread, kd, kp and sensor_size have each been
      tried against the slalom without clearing it, and iterations 5 and 8 lowered
      the score, so those changes are ruled out. The expected result is about 688
      on the development tracks, with the slalom still the main loss. The requested
      measurements are slalom max_error and line_loss_events, which show whether the
      edge excursions persist, plus oval and s-bend completion to confirm the baseline
      holds on the unseen track.


      - [Open this output](iteration-11/entity0/versions/c35d49f5fba54272b59aa159ff8e969b/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-d5eae680f9dbd585/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-838d6107f6de8ef7/payload.json)'
  - id: entityR1
    label: 'Final approve: iteration'
    notes: 'Approved the iteration 7 best (688.5) unchanged because this is the last
      iteration and only one run remains, so any revision could not race. The evidence
      is oval and s-bend at 20 of 20 with the slalom still at 0 of 20 across all tried
      levers.


      ### Feedback


      Approved because this is the final iteration and one run remains, so a revise
      decision could not be reviewed and raced. The candidate is the iteration 7 best
      (688.5), resubmitted unchanged: kp 2.8, kd 0.9, ki 0, base_speed 1.1, sensor_weights
      [-2,-1,0,1,2], line_loss ''last_direction'', sensor_size 0.012, and the iteration
      4 spread (x = -0.024 to 0.024 m at y = 0.04 m). Every field is inside its contract
      range. I make no prediction of how it will perform on the unseen track.


      Evidence: iteration 7 is the best raced design. It finished the oval 20 of 20
      (1.96 s) and the s-bend 20 of 20 (2.57 s), with rms_error low on both. The slalom
      has finished 0 of 20 in every iteration, with max_error between 0.061 and 0.064
      and about 1 line-loss event per run. Base_speed (iteration 4), the wider spread
      (iteration 5), kd 0.9 (iteration 6), kp 2.8 (iteration 7) and sensor_size 0.016
      (iteration 8, score 610.4, s-bend down to 13 of 20) have each been tested without
      clearing the slalom. Because the final track is unseen, the oval and s-bend
      completions are the most reliable evidence of a robust baseline, and the design
      should not be altered without a race result.


      ### Requested changes


      - Race this design unchanged. No further edits are possible in this iteration,
      and iteration 7 is the only design with oval and s-bend both at 20 of 20 (iterations
      4 to 8 all lost completions or score).

      - For any later iteration, if the slalom max_error is still at or above 0.06
      with line_loss_events near 1, test a forward sensor offset (geometry.sensor_positions
      y from 0.04 to 0.06) with the iteration 7 x values. The y position has not been
      tested in any iteration, and the spread (iteration 5) and sensor_size (iteration
      8) changes did not clear the slalom.

      - Keep the wider spread (x = ±0.03 m) ruled out unless new evidence appears,
      because iteration 5 cut the score from 555.0 to 513.3 and lowered s-bend completion
      from 9 of 20 to 2 of 20.


      - [Open this output](iteration-11/entityR1/versions/1e5d3c627797475fa73188dfb3c310cb/payload.json)

