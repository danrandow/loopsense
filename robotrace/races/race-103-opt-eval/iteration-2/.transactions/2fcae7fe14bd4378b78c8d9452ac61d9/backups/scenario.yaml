map:
  id: race-103-opt-eval
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Higher kd, slower speed
    notes: 'Raised kd from 0.4 to 0.6 to damp the oscillation that rose sharply with
      kp 3.5, and cut base_speed from 1.4 to 1.2 because max_error still sits at or
      above 0.06 with off-track endings. Geometry and kp are unchanged, so the race
      isolates the controller change.


      ### Rationale


      Evidence from iteration 1 (the best so far, score 170.1): kp 3.5 with kd 0.4
      and base_speed 1.4 still ended almost every run off_track (58 of 60 trials,
      2 finishes, both on the oval). max_error stayed at or just above the 0.06 m
      limit on all three tracks (oval 0.063, s-bend 0.0672, slalom 0.0614). rms_error
      remained low (0.017 to 0.025), so average tracking is fine and the failure is
      excursions at bends. Line-loss events fell only modestly (oval 1.55, s-bend
      1.65, slalom 1.0). steering_oscillation rose sharply from 0.10 to 0.15 at iteration
      0 to 0.28 to 0.31 on the oval and s-bend, which fits the Evaluator''s warning
      that kd 0.4 is too low for kp 3.5.


      Changes, one of the two being the Evaluator''s conditional rule: (1) kd 0.4
      to 0.6, to damp the higher kp gain and reduce the oscillation build-up that
      is pushing the robot past the edge on bends. (2) base_speed 1.4 to 1.2. max_error
      is still at or above 0.06 with off_track endings, so the Evaluator''s rule says
      speed or recovery is the limit; less momentum into bends should let the 3.5
      kp recovery act before the sensor array loses the tape. kp stays 3.5, geometry
      is unchanged, and line_loss stays last_direction, which isolates the controller
      effect.


      Risk: at 1.2 m/s-equivalent command the oval mean finish time would be about
      2.2 s if it completes, still inside 3 s, but the contract''s roughly 1.5 m/s
      average may make completion marginal. If this race shows max_error below 0.06
      with line_loss near 0 but completion_time over 3 s, the next step is base_speed
      up in steps of 0.1. If max_error is still at or above 0.06 with kd 0.6, the
      next step is to test a lower kp (around 3.0) or to add a little ki-free damping
      rather than more speed reduction.


      Expected result: max_error below 0.06 on the oval and s-bend, steering_oscillation
      down from about 0.3 toward 0.15 to 0.2, fewer off_track endings, and more finishes
      than iteration 1 (which had 2 of 60).


      Hypotheses to check next: (a) kd 0.6 cuts steering_oscillation without slowing
      the response; (b) lower speed is the main lever for max_error on s-bend; (c)
      with the robot on the line, completion_time will show whether the speed reduction
      costs more than the robustness gain.


      - [Open this output](iteration-2/entity0/versions/76b4fbf8344e490e84ab59361e71a0af/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-e7713c6d4a46dd42/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-34493695f77a7d24/payload.json)'
  - id: entityR1
    label: Approve kp/speed/kd
    notes: 'Approved as the last available action, since a revise round could not
      race this iteration. Rests on iteration 0: all 60 trials ended off_track with
      max_error about 0.063 and rms_error about 0.025, so the proposed kp 3.5 and
      kd 0.4 target edge recovery, while base_speed 1.4 risks missing the 3 s finish.


      ### Feedback


      Approved because this is the last action run this iteration, so a revise round
      cannot be raced. Iteration 0 is the only evidence: all 60 trials went off_track
      with zero finishes, max_error sat at 0.062 to 0.064 (just past the 0.06 m limit)
      while rms_error stayed at 0.02 to 0.03, and line_loss_events were 1 to 2 per
      run. The failure is edge recovery on bends, not average tracking, and the proposed
      kp 2.5 to 3.5 targets that directly. The candidate''s controller-only change
      keeps geometry fixed, which isolates the controller effect. I cannot say how
      it will perform; the race will show it.


      Risk to watch: base_speed 1.6 to 1.4 lowers average speed. The contract needs
      roughly 1.5 m/s to finish in 3 s, so completion may become impossible even if
      the robot stays on the line. Judge the next iteration from the telemetry as
      follows. If max_error is still at or above 0.06 with the robot leaving the line,
      the limit is speed or recovery, so drop base_speed further in small steps. If
      the robot stays on the line (max_error below 0.06, line_loss_events near 0)
      but completion_time exceeds 3 s, raise base_speed in steps of about 0.1 while
      watching max_error. If steering_oscillation rises sharply with kp 3.5, kd is
      too low for the gain, so raise kd from 0.4 toward 0.6.


      ### Requested changes


      - If the next race shows max_error still at or above 0.06 with off_track endings,
      reduce controller.base_speed below 1.4 (for example 1.2) to test whether speed
      is the limit, since iteration 0 max_error sat at 0.062 to 0.064 at base_speed
      1.6.

      - If the robot stays on the line (max_error below 0.06, line_loss_events near
      0) but completion_time exceeds 3 s, raise controller.base_speed in steps of
      about 0.1 (1.4 to 1.5 to 1.6), because the contract needs about 1.5 m/s average
      to finish.

      - If steering_oscillation rises sharply with kp 3.5 (iteration 0 was 0.11 to
      0.15), raise controller.kd from 0.4 toward 0.6 to damp the higher gain, keeping
      kp at 3.5.


      - [Open this output](iteration-1/entityR1/versions/9bbdadd296aa4cac95960a95aa259d79/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/dc8f8b4330a24457aebe71a006d0fa11/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-22fa00f726ad5776/payload.json)'
