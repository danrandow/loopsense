  id: race-103-opt-eval
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: 'Authoritative state carried forward after iteration 6.


    [Read the race report](race-report.md) · [Leaderboard](leaderboard.svg)'
