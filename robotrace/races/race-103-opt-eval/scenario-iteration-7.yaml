overrides:
  entities:
  - id: entity0
    label: kp 2.8, kd 0.9 test
    notes: 'Keeps the iteration 6 best (669.1) and lowers kp from 3.0 to 2.8 to target
      the slalom, which still ends off track at max_error 0.063 with kd 0.9. Speed,
      sensor spread and kd were already tested without clearing the slalom, and the
      change is a single-parameter step as the Evaluator requested.


      ### Rationale


      Evidence from iteration 6 (kd 0.9, kp 3.0, base_speed 1.1, iteration 4 sensor
      spread; score 669.1, the best so far). The oval finished 20 of 20 at 1.96 s
      with max_error 0.015 and no line losses. The s-bend finished 18 of 20 with steering_oscillation
      0.40, so kd 0.9 is at the edge of the useful range. The slalom still finished
      0 of 20 with max_error 0.0634, which is above the 0.06 m limit, and 1.3 line-loss
      events per run. rms_error is low everywhere (0.006 to 0.018), so the failures
      are edge excursions on the slalom''s sharp alternating bends, not poor average
      tracking.


      What has been ruled out for the slalom: speed (1.2 to 1.1 gave no gain), a wider
      sensor spread (iteration 5 made the s-bend worse and did not fix the slalom),
      and kd 0.8 to 0.9 (max_error only moved from 0.0613 to 0.0634). Body width cannot
      help, because the off-track limit with body_width 0.18 is only 0.0575 and so
      stays at 0.06. The remaining lever the Evaluator named is kp. I take the Evaluator''s
      requested step: kp 3.0 to 2.8 with kd 0.9 held. Lower kp reduces the turn per
      unit of signal, which should cut the overshoot that is building up at the slalom''s
      alternating bends. I keep kd 0.9 because the s-bend completion (18 of 20) and
      oscillation (0.40) are still acceptable. The iteration 4 sensor spread, base_speed
      1.1, ki 0, sensor_weights and line_loss ''last_direction'' are unchanged, so
      the race isolates the kp effect.


      Expected result: slalom max_error below 0.06 with line_loss_events falling toward
      0.5, and some slalom finishes. Risk: less corrective turn on the tightest s-bend
      curves could cut s-bend completions, and the slalom could still fail if kp is
      the wrong lever. Measurements to check next: slalom max_error and line_loss_events;
      s-bend completion and steering_oscillation (revert kd to 0.8 if oscillation
      exceeds 0.4); oval completion_time.


      - [Open this output](iteration-7/entity0/versions/c392c18ab9cb4357a311f093b179897c/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-e964caa129cf213b/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-f728715cee25ac74/payload.json)'
  - id: entityR1
    label: Approve kp 2.8 test
    notes: 'Approved as the last run of the iteration, because a revise round could
      not be raced. The candidate tests kp 3.0 to 2.8 at kd 0.9 against the iteration
      6 best (669.1), since the slalom has never finished and its max_error has stayed
      at 0.061 to 0.064 across speed, spread, and kd changes.


      ### Feedback


      Approved as the last action run of this iteration. A revise round would need
      a review and a revision before the race, which leaves no run for racing, so
      approving is the only way this iteration gets a scored race.


      The candidate changes one controller field from the best raced design (iteration
      6, score 669.1): kp 3.0 to 2.8, with kd 0.9, base_speed 1.1, ki 0, sensor_weights
      [-2,-1,0,1,2], line_loss ''last_direction'' and the iteration 4 sensor spread
      (x = -0.024 to 0.024 m) all unchanged. Nothing here predicts how it will perform.


      What the earlier evidence shows: the slalom has not finished in any iteration
      (0 of 20 in iterations 0 to 6), and its max_error has sat at 0.061 to 0.064
      across every setting tried. Speed (1.2 to 1.1, iteration 4), sensor spread (iteration
      5) and kd (0.8 to 0.9, iteration 6, max_error 0.0613 to 0.0634) did not clear
      it. rms_error is low on every track (0.006 to 0.018), so the failures are edge
      excursions on the slalom''s sharp alternating bends, not poor average tracking.
      The kp step is the one lever the earlier Evaluator named that has not yet been
      tested in isolation at kd 0.9. Iteration 6 is the baseline to beat: oval 20
      of 20 at 1.96 s, s-bend 18 of 20 with steering_oscillation 0.40.


      How to read the next race: if the s-bend completion falls below 18 of 20 or
      its steering_oscillation rises above 0.4, revert kp to 3.0 with kd 0.9, since
      that is the best raced design. If the slalom max_error falls below 0.06 or its
      line_loss_events drop toward 0.5 while the s-bend holds, keep kp 2.8 and consider
      a further small step. If the slalom still ends off track with kp 2.8 and the
      s-bend holds, the next untested lever is sensor_size (0.008 or 0.016) with the
      iteration 4 spread, because it changes the edge detection without changing the
      signal scale.


      ### Requested changes


      - If s-bend completion falls below 18 of 20 or steering_oscillation rises above
      0.4 with kp 2.8, revert controller.kp to 3.0 with kd 0.9, the iteration 6 best
      (669.1), since the s-bend result at iteration 6 was 18 of 20 with oscillation
      0.40.

      - If the slalom max_error is still at or above 0.06 with kp 2.8 and kd 0.9,
      the slalom has not responded to speed, spread, kd or kp changes, so test geometry.sensor_size
      of 0.008 or 0.016 with the iteration 4 spread, base_speed 1.1 and kp 2.8 held,
      as an untested edge-detection lever.

      - If the slalom max_error falls below 0.06 and its line_loss_events drop toward
      0.5 at kp 2.8, keep kp 2.8 and hold base_speed at 1.1 and the iteration 4 spread,
      since iteration 5 showed the wider spread hurt the s-bend and oval.


      - [Open this output](iteration-7/entityR1/versions/f25b2398e64f4d18a6016fb5a34fd783/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/c392c18ab9cb4357a311f093b179897c/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-f728715cee25ac74/payload.json)'
