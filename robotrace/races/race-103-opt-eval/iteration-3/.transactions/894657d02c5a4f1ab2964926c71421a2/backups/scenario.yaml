map:
  id: race-103-opt-eval
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Higher kd, slower speed
    notes: 'Raised kd from 0.4 to 0.6 to damp the oscillation that rose sharply with
      kp 3.5, and cut base_speed from 1.4 to 1.2 because max_error still sits at or
      above 0.06 with off-track endings. Geometry and kp are unchanged, so the race
      isolates the controller change.


      ### Rationale


      Evidence from iteration 1 (the best so far, score 170.1): kp 3.5 with kd 0.4
      and base_speed 1.4 still ended almost every run off_track (58 of 60 trials,
      2 finishes, both on the oval). max_error stayed at or just above the 0.06 m
      limit on all three tracks (oval 0.063, s-bend 0.0672, slalom 0.0614). rms_error
      remained low (0.017 to 0.025), so average tracking is fine and the failure is
      excursions at bends. Line-loss events fell only modestly (oval 1.55, s-bend
      1.65, slalom 1.0). steering_oscillation rose sharply from 0.10 to 0.15 at iteration
      0 to 0.28 to 0.31 on the oval and s-bend, which fits the Evaluator''s warning
      that kd 0.4 is too low for kp 3.5.


      Changes, one of the two being the Evaluator''s conditional rule: (1) kd 0.4
      to 0.6, to damp the higher kp gain and reduce the oscillation build-up that
      is pushing the robot past the edge on bends. (2) base_speed 1.4 to 1.2. max_error
      is still at or above 0.06 with off_track endings, so the Evaluator''s rule says
      speed or recovery is the limit; less momentum into bends should let the 3.5
      kp recovery act before the sensor array loses the tape. kp stays 3.5, geometry
      is unchanged, and line_loss stays last_direction, which isolates the controller
      effect.


      Risk: at 1.2 m/s-equivalent command the oval mean finish time would be about
      2.2 s if it completes, still inside 3 s, but the contract''s roughly 1.5 m/s
      average may make completion marginal. If this race shows max_error below 0.06
      with line_loss near 0 but completion_time over 3 s, the next step is base_speed
      up in steps of 0.1. If max_error is still at or above 0.06 with kd 0.6, the
      next step is to test a lower kp (around 3.0) or to add a little ki-free damping
      rather than more speed reduction.


      Expected result: max_error below 0.06 on the oval and s-bend, steering_oscillation
      down from about 0.3 toward 0.15 to 0.2, fewer off_track endings, and more finishes
      than iteration 1 (which had 2 of 60).


      Hypotheses to check next: (a) kd 0.6 cuts steering_oscillation without slowing
      the response; (b) lower speed is the main lever for max_error on s-bend; (c)
      with the robot on the line, completion_time will show whether the speed reduction
      costs more than the robustness gain.


      - [Open this output](iteration-2/entity0/versions/76b4fbf8344e490e84ab59361e71a0af/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-e7713c6d4a46dd42/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-34493695f77a7d24/payload.json)'
  - id: entityR1
    label: Approve kd 0.6, speed 1.2
    notes: 'Approved as the only scored path, since one run remains and a revise round
      cannot race. The candidate raises kd to damp kp 3.5 and lowers base_speed to
      1.2, which targets the max_error at 0.06 and steering_oscillation of about 0.3
      seen in iteration 1 (score 170.1).


      ### Feedback


      Approved because only one action run remains this iteration. A revise round
      would need a review and a revision, and the race would then have no run left,
      so approving is the only way to get a scored race. The candidate is a controller-only
      change from the iteration 1 best (score 170.1): kd 0.4 to 0.6 and base_speed
      1.4 to 1.2, with kp 3.5, line_loss ''last_direction'' and geometry unchanged.
      Evidence: in iteration 1, max_error stayed at or just above 0.06 on all tracks
      (oval 0.063, s-bend 0.0672, slalom 0.0614) while rms_error stayed low (0.017
      to 0.025), so the failure is edge excursions on bends. steering_oscillation
      rose from 0.10 to 0.15 at iteration 0 to 0.28 to 0.31 on the oval and s-bend
      after kp went to 3.5 with kd 0.4, which supports raising kd to damp that gain.
      Iteration 0 showed that base_speed 1.6 with kp 2.5 also left the line on every
      run. Nothing here predicts how this candidate will perform. The next race will
      show whether the robot stays on the tape. Use the telemetry as follows. If max_error
      is below 0.06 with line_loss_events near 0 but completion_time exceeds 3 s,
      raise base_speed in steps of 0.1. If max_error is still at or above 0.06 with
      kd 0.6, the next step is a lower kp (around 3.0), not further speed reduction.
      If steering_oscillation falls clearly while completion stays at 0, the damping
      is working and the speed limit should be the next lever.


      ### Requested changes


      - If completion_time is over 3 s with max_error below 0.06 and line_loss_events
      near 0, raise controller.base_speed from 1.2 in steps of 0.1 (for example 1.3),
      since iteration 1 max_error was at the 0.06 limit and the contract needs about
      1.5 m/s average.

      - If max_error is still at or above 0.06 with kd 0.6, reduce controller.kp from
      3.5 to about 3.0 while keeping kd 0.6, since iteration 1 steering_oscillation
      of 0.28 to 0.31 at kp 3.5 suggests the gain is high relative to damping.

      - If steering_oscillation stays above 0.2 with kd 0.6, try controller.kd of
      0.8, since iteration 1 values of 0.28 to 0.31 at kd 0.4 show damping is still
      short at kp 3.5.


      - [Open this output](iteration-2/entityR1/versions/2fcae7fe14bd4378b78c8d9452ac61d9/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/76b4fbf8344e490e84ab59361e71a0af/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-34493695f77a7d24/payload.json)'
