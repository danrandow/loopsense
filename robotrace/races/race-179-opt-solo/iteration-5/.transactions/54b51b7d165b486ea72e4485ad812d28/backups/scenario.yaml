  entities:
  - id: entity0
    label: Wider sensors, kp 4 kd 2
    notes: 'Raises kp to 4.0 and kd to 2.0 for more slalom steering authority with
      damping, and widens the sensor spread to +/-0.06 m so outer sensors catch the
      tape earlier. Based on iteration 3, where slalom progress rose from 0.26 to
      0.48 but steering oscillation also rose to 0.27.


      ### Rationale


      Evidence from iteration 3 (score 697.4, best so far): the oval (20/20, 1.84
      s, rms 0.007) and s-bend (20/20, 2.08 s, rms 0.016) both finish cleanly. The
      slalom is the only failure: 20/20 off-track exits at mean progress 0.48, with
      one line-loss event per run and max_error at the 0.06 m limit. Iteration 3 changed
      kp 3.0 to 3.5, kd 1.4 to 1.6, and sensor_size 0.012 to 0.016. Slalom progress
      rose from 0.26 to 0.48, which supports the view that slalom exits come from
      losing the tape at direction reversals and from insufficient steering authority.
      Steering oscillation on the slalom rose to 0.27, which means the higher kp is
      starting to add some jitter. Changes: (1) kp 3.5 to 4.0 for more steering authority
      on the sharp slalom reversals. (2) kd 1.6 to 2.0 to keep the damping ratio in
      line with the higher kp and to limit the jitter that rose in iteration 3. (3)
      Sensor spread widened from x = +/-0.05 to +/-0.06 m (still at y = 0.07 m, inside
      the allowed limit). Outer sensors then see the tape earlier on the sharp reversals,
      which should reduce line-loss events. Sensor weights are unchanged, so the signal
      stays bounded within +/-1. base_speed 1.2, ki 0.02, mass 0.6, wheel geometry
      and sensor_size 0.016 are kept unchanged, so the effect of the steering and
      sensor-spread changes can be read directly. Expected result: slalom progress
      rising above 0.6 with line_loss_events falling toward 0.5 per run, while the
      oval and s-bend keep their finishes. The risk is that kp 4.0 brings back the
      oscillation seen in iteration 0, so the oscillation metric is the first thing
      to check. Hypotheses: (a) line-loss exits on the slalom are caused by outer
      sensors seeing no tape at the reversals, so the wider spread should cut line
      losses; (b) kd 2.0 is enough to hold steering oscillation near 0.2 at kp 4.0.
      Measurements I want next: per-track progress and completion, line_loss_events
      per track, steering_oscillation on the slalom, max_error location, and completion_time
      on the oval and s-bend, to check whether speed or steering is the limit.


