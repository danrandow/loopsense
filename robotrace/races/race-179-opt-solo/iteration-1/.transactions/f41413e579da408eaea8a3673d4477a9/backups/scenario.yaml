  entities:
  - id: entity0
    label: Softer steer, more
    notes: 'Reduced kp (4 to 3), raised kd (0.3 to 0.9), lowered base speed (1.6 to
      1.4), lighter body (0.8 to 0.6 kg) and widened sensor spread (+/-0.03 m). Based
      on iteration 0''s 0/60 finishes, where every trial hit max_error about 0.06
      m (the off-track limit) with high steering oscillation.


      ### Rationale


      Evidence: all 60 development trials ended off track (0 finishes). Progress was
      only 0.11 to 0.16, and max_error (0.061 to 0.067) reached the 0.06 m off-track
      limit in every case. RMS error was small (about 0.03), so the robot tracked
      the line closely until a sudden excursion. Each run lost the line once, and
      steering oscillation was 0.07 to 0.16. The failure pattern points to an aggressive
      steering loop: kp = 4 gives a full-scale differential of about 1400 PWM at signal
      1, and kd = 0.3 is too weak to damp the swing, so the robot overshoots at bends,
      loses the tape, and leaves the track. The sensors are also tight (x of +/-0.04
      m, 12 mm footprints), so the outer sensors drop off the tape early on sharper
      bends. Changes: (1) kp 4.0 -> 3.0 to soften the steering response and reduce
      overshoot; (2) kd 0.3 -> 0.9 to damp the change in signal; (3) ki 0.05 -> 0.02
      to limit integral windup on bends; (4) base_speed 1.6 -> 1.4 so the robot can
      make the bends at speed, accepting some risk on the 3 s finish time; (5) sensor
      x spread widened to +/-0.03 m with a 5-sensor layout (x = 0.03, 0.015, 0, -0.015,
      -0.03) for earlier warning of drift, and kept at y = 0.05 m; (6) body mass 0.8
      -> 0.6 kg to reduce yaw inertia so the robot responds faster to the steering.
      Expected result: fewer off-track exits, with progress rising above 0.5 on at
      least the oval and s-bend. The finish time may still be marginal. Hypotheses:
      (a) the off-track exits come from overshoot at bends caused by kp and kd, not
      from sensor coverage; (b) base_speed of 1.4 may be too slow to finish in 3 s;
      (c) line loss occurs at the sharpest bend when the outer sensors go blank. Next
      measurements I want: progress and completion per track, max_error and where
      it occurs, line_loss_events, and steering_oscillation, so I can tell whether
      the damping change worked and whether speed or tracking limits the finish.


