  entities:
  - id: entity0
    label: Wider sensor spread
    notes: 'Iteration 6''s best controller (base 0.85, kd 1.6, mass 0.5) with the
      sensor spread widened from +/-0.05 to +/-0.065 m, the only change. It targets
      the about 0.9 slalom line-loss events per run that cause the off-track exits,
      since speed is near its trade-off limit (0.85 times out, 0.9 overshoots).


      ### Rationale


      Evidence. Iteration 6 (score 866.3, best so far) had base_speed 0.85 and mass
      0.5, with oval 20/20 (2.06 s), s-bend 20/20 (2.36 s) and slalom 13/20 finished.
      Iteration 8 (score 834.9, the current authorised result) raised base_speed to
      0.90 and gave slalom 10/20, with 9 off-track exits. Speed is therefore a trade-off
      on the slalom: higher speed brings reversal overshoot, and lower speed pushes
      finishers toward the 3 s limit (slalom finishers averaged about 2.97 s at 0.85).
      Speed alone is now close to exhausted. Slalom line-loss events remain about
      0.9 per run, and each one ends in an off-track exit at the reversals.


      Change: return to the iteration 6 controller and geometry (base_speed 0.85,
      kp 3.5, kd 1.6, ki 0.02, mass 0.5) and widen the sensor spread from x = +/-0.05
      to +/-0.065 m (y = 0.07 m, 5 sensors, sensor_size 0.016). The aim is to see
      the tape earlier on sharp reversals and cut line-loss events. This is the only
      change from iteration 6, so its effect can be read directly. Widening the spread
      also lowers the effective steering slope (the signal changes more slowly per
      mm of offset), so it may reduce slalom steering oscillation, which rose to 0.37
      in iteration 6. I have not scaled kp to compensate, because the iteration 4
      evidence is confounded.


      Expected result: slalom line_loss_events below 0.7 per run and slalom finishes
      of 13 to 16 out of 20, with the oval and s-bend still at 20/20. Score about
      870 to 900 if it holds.


      Hypotheses: (a) slalom line losses occur because the outer sensors lose the
      tape at reversals, so a wider spread should cut them; (b) if the wider spread
      under-steers, slalom max_error will rise on the curves and the next step is
      kp up by about 40 percent to match the wider spacing; (c) if slalom progress
      does not change, the limit is steering overshoot, not sensor coverage, and the
      next lever is kd or the line-loss search direction.


      Measurements wanted next: per-track completion and completion_time (to check
      the 3 s budget on the slalom), slalom line_loss_events, slalom max_error location
      and steering_oscillation, and oval and s-bend completion, to confirm that the
      wider spread does not hurt the easy tracks.


