  entities:
  - id: entity0
    label: Stiffer steer, bigger
    notes: 'Raises kp to 3.5 with kd 1.6 for more steering authority on the slalom,
      and enlarges sensors to 16 mm to cut line-loss exits. Based on race 2, where
      the oval finished 20/20 and slalom progress was 0.26 with line losses.


      ### Rationale


      Evidence from race 2 (best so far, score 644.8): the oval finishes 20/20 in
      1.92 s with rms 0.009. The s-bend finishes 18/20 (2 off-track exits, progress
      0.98). The slalom fails 20/20, with progress 0.26, max_error at the 0.06 m off-track
      limit, and one line-loss event per run. Steering oscillation on the slalom is
      low (0.20), so the failure looks like under-correction on sharp direction changes
      rather than jitter. The wider sensor spread and kd 1.4 both helped: slalom progress
      rose from 0.16 to 0.26 and the s-bend score rose. Changes: (1) kp 3.0 -> 3.5
      for more steering authority on sharp direction changes; kd 1.4 -> 1.6 to keep
      the damping ratio roughly constant as kp rises. (2) sensor_size 0.012 -> 0.016
      m. Larger footprints keep at least one sensor on the 25 mm tape when the robot
      is off-centre, which should reduce line-loss events, the main slalom failure
      mode. (3) base_speed stays at 1.2, since the oval has time headroom and the
      slalom appears limited by steering rather than speed. Geometry (sensor spread
      +/-0.05 at y 0.07, mass 0.6, track 0.12, radius 0.03) is unchanged, so the effects
      of the controller and sensor-size changes can be read directly. Expected result:
      slalom progress above 0.4 with fewer line losses, and s-bend completion at or
      near 20/20 without losing the oval finish. Hypotheses: (a) slalom exits are
      caused by line loss at sharp reversals, so larger sensors should reduce line_loss_events;
      (b) kp 3.5 gives enough authority without the oscillation seen at kp 4 in race
      0. Measurements to check next: per-track progress and completion, line_loss_events
      per track, max_error location, steering_oscillation, and completion_time to
      see whether speed is becoming a limit.


