map:
  id: race-130-opt-eval
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: kd 0.6 damping test
    notes: 'Raises kd from 0.5 to 0.6 with kp 7.0 and all else unchanged, because
      iteration 4 kept oval steering_oscillation at 0.267 (above the 0.2 threshold)
      and the agreed plan says to raise kd before cutting kp. Evidence: iteration
      4 scored 94.32, the best so far, with max_error 0.064 and line losses of 1.6
      on the oval.


      ### Rationale


      Iteration 4 (kp 7.0, kd 0.5, 16 mm sensors at x = ±0.030 m, base_speed 1.4,
      ki 0.05, last_direction) is the best raced design so far at 94.32, but every
      trial still ran off track. Raising kd from 0.4 to 0.5 did not bring oval steering_oscillation
      below 0.2. It rose slightly from 0.250 to 0.267, so the damping step did not
      work on its own. The plan agreed with the Evaluator covers this case: if oscillation
      stays above 0.2 with kd 0.5, raise kd to 0.6 before lowering kp. Lowering kp
      now would weaken the edge response that keeps max_error near 0.064, which is
      still just over the 0.06 limit. Other evidence: s-bend oscillation is 0.16 and
      slalom is 0.12, both low. Line losses are 1.6 on the oval, 1.35 on the s-bend
      and 1.0 on the slalom. Progress is 0.46 on the oval, 0.15 on the s-bend and
      0.09 on the slalom. Body width cannot relax the off-track limit, so control
      has to fix it. Change: kd 0.5 to 0.6, with kp 7.0, geometry, base_speed 1.4,
      ki 0.05 and last_direction unchanged, so the result isolates damping. Expected
      result: oval steering_oscillation falls to about 0.2 or below, max_error holds
      at or below about 0.063, and oval progress holds or improves. Risk: kd 0.6 amplifies
      sensor noise and may slow the response at bend entries, which could raise max_error
      on the s-bend. Measurements wanted: steering_oscillation, max_error and line_loss_events
      per track, plus progress, rms_error and control_effort. Next steps depend on
      the result. If oscillation is now low and max_error is still at or above 0.06,
      widen the array to ±0.040 m and test kp near 8. If oscillation stays above 0.2
      at kd 0.6, reduce kp slightly toward 6.5. If line losses remain at the same
      bend entries, test line_loss search_left or search_right, favouring the side
      the failing bends turn towards. If progress is still below 1 with max_error
      under 0.06, raise base_speed toward 1.6.


      - [Open this output](iteration-5/entity0/versions/3488af65a3a04b26b50f9102b1791a10/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-9174e1da86c97f11/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-6421e0fdd001b242/payload.json)'
  - id: entityR1
    label: Approve kd 0.6 test
    notes: 'Approved the single-variable change kd 0.5 to 0.6 on the best raced design
      (iteration 4, score 94.32), because it is a low-risk next step and a race is
      more informative than more desk review. The feedback targets the oval steering_oscillation
      of 0.267 and max_error of 0.064 from iteration 4, with conditional next steps
      on kp, sensor width and line_loss.


      ### Feedback


      The candidate changes one variable from the best raced design, iteration 4 (kp
      7.0, kd 0.5, 16 mm sensors at x = ±0.030 m, base_speed 1.4, ki 0.05, last_direction).
      kd goes from 0.5 to 0.6, and kp, geometry, base_speed, ki and line_loss stay
      the same. Iteration 4 scored 94.32 but ran off track on all 60 trials. Its oval
      steering_oscillation was 0.267, still above the 0.2 concern level, and rose
      from 0.250 at kd 0.4 when kd moved to 0.5. The s-bend (0.162) and slalom (0.119)
      oscillation were low. Oval max_error was 0.064, just over the 0.06 limit. Line
      losses were 1.6 on the oval, 1.35 on the s-bend and 1.0 on the slalom, and progress
      was 0.46, 0.15 and 0.09. Body width cannot relax the off-track limit, so control
      must fix it. Nothing here states how this candidate will perform. It is a sound,
      low-risk next step with 4 review runs left, so approve it to race and get per-track
      telemetry. After the race: if oval steering_oscillation is still above 0.2,
      reduce kp toward 6.5 rather than raising kd further, since kd 0.6 already costs
      response speed. If oscillation falls and max_error is still at or above 0.06,
      widen the array to x = ±0.040 m and test kp near 8. If line losses stay at the
      same bend entries, test line_loss search_left or search_right, favouring the
      side the failing bends turn towards.


      ### Requested changes


      - After the race: if oval steering_oscillation stays above 0.2 at kd 0.6, reduce
      controller.kp toward 6.5, since iteration 4 showed oscillation rising with kd
      (0.250 at kd 0.4, 0.267 at kd 0.5) and further damping alone is not closing
      the gap.

      - After the race: if steering_oscillation is low but max_error stays at or above
      0.06 (iteration 4 oval max_error was 0.064), widen geometry.sensor_positions
      to x = ±0.040 m and test controller.kp near 8.0, because iteration 3 to 4 showed
      the edge response is what holds max_error near 0.06.

      - After the race: if line_loss_events stay at 1 or more at the same bend entries
      (iteration 4: 1.6 oval, 1.35 s-bend, 1.0 slalom), change controller.line_loss
      from last_direction to search_left or search_right, choosing the side the failing
      bends turn towards, and raise base_speed toward 1.6 only if progress is still
      below 1 with max_error under 0.06.


      - [Open this output](iteration-5/entityR1/versions/1a62230d79dc4338a9720d20a02cbf5b/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/3488af65a3a04b26b50f9102b1791a10/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-6421e0fdd001b242/payload.json)'
