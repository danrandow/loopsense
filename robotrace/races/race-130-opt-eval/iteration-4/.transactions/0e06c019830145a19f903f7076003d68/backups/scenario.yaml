map:
  id: race-130-opt-eval
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: kp 7, kd 0.4 on wider
    notes: 'Keeps the validated widened sensor array and raises kp from 6 to 7 and
      kd from 0.3 to 0.4 to pull max_error under the 0.06 off-track limit. Iteration
      2 showed line losses down to 1 per run, max_error about 0.062 and oscillation
      0.14 to 0.17, which is low enough to allow a stronger gain.


      ### Rationale


      Evidence from iteration 2 (widened sensors at x = ±0.030 m with 16 mm footprints,
      kp 6.0, kd 0.3, base_speed 1.4, ki 0.05, last_direction): all 60 trials still
      went off track, but line losses fell from 2 to 1 per run. Progress is 0.31 (oval),
      0.16 (s-bend) and 0.11 (slalom). max_error is 0.061 to 0.063, just over the
      0.06 off-track limit, and steering_oscillation is 0.14 to 0.17, which is low.
      So the failure is still the robot drifting past the edge at the first large
      offset, not jitter. Body width cannot relax the limit (it stays at 0.06 for
      body_width up to 0.18), so the fix must come from control.


      Changes: (1) kp 6.0 to 7.0. Feedback (d) allows this when oscillation stays
      low, and 0.14 to 0.17 is well below the 0.2 threshold. A stronger response at
      the edge should keep max_error under 0.06. (2) kd 0.3 to 0.4. The higher kp
      raises effective gain, so a little more damping limits any rise in oscillation.
      (3) Keep geometry, base_speed 1.4, ki 0.05 and last_direction. This isolates
      the gain change. Speed was lowered earlier and helped progress, and the single
      remaining line loss does not yet point to a different line_loss mode.


      Expected result: max_error below 0.06, line_loss_events at 1 or lower, steering_oscillation
      at or below about 0.2, and progress increasing on all tracks. Risks: kp 7 may
      oscillate on the slalom. If oscillation exceeds 0.2, next raise kd to 0.5 before
      cutting kp. If max_error stays above 0.06 with low oscillation, next test a
      wider array (±0.040 m) with kp near 8. If progress stalls below 1 while max_error
      stays under 0.06, raise base_speed toward 1.6. Measurements requested: max_error,
      line_loss_events, progress and steering_oscillation per track, plus rms_error
      and completion_time.


      - [Open this output](iteration-3/entity0/versions/a2d2c3d245b8429d8acf76702b495d4a/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-cccc0ad8bbba369f/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-2dc8c87bf0e72c2b/payload.json)'
  - id: entityR1
    label: Approve kp 7 / kd 0.4
    notes: 'Approved the controller-only step (kp 6 to 7, kd 0.3 to 0.4, geometry
      unchanged) because iteration 2 showed low oscillation (0.14 to 0.17) and one
      line loss per run, so the next gain step is justified and racing gives the needed
      telemetry. Feedback sets follow-up rules for oscillation, sensor width, and
      line-loss mode.


      ### Feedback


      The candidate changes only the controller: kp 6.0 to 7.0 and kd 0.3 to 0.4,
      with geometry, base_speed 1.4, ki 0.05 and last_direction unchanged from iteration
      2. The rationale matches the evidence. Iteration 2 (16 mm sensors at x = ±0.030
      m, kp 6.0, kd 0.3) ran off track on all 60 trials, with line_loss_events down
      from 2 to 1 per run, max_error 0.061 to 0.063, steering_oscillation 0.14 to
      0.17 and progress 0.31 (oval), 0.16 (s-bend) and 0.11 (slalom). Oscillation
      is well below the 0.2 concern, so raising kp is the justified next step, and
      the change isolates one variable. This is an early iteration with 8 left after
      this one, and a raced result is more useful than further desk review, so approve.
      Nothing here states how this candidate will perform. After the race, use the
      telemetry as follows. If steering_oscillation rises above about 0.2, raise kd
      to 0.5 before cutting kp, as the rationale says. If max_error stays at or above
      0.06 while oscillation is low, widen the array to ±0.040 m with 16 mm sensors
      and test kp near 8. If line_loss_events stay at 1 per run at the same bend entries,
      test line_loss search_right or search_left, choosing the side the failing bends
      favour. If progress is still below 1 while max_error is under 0.06, raise base_speed
      toward 1.6.


      ### Requested changes


      - After the race: if steering_oscillation rises above about 0.2 with kp 7.0,
      raise controller.kd to 0.5 before lowering kp, because iteration 2 showed low
      oscillation (0.14 to 0.17) at kp 6.0 and the widened array raises effective
      gain.

      - After the race: if max_error stays at or above 0.06 with oscillation low,
      widen geometry.sensor_positions to x = ±0.040 m and try kp near 8.0, since iteration
      2 cut line losses from 2 to 1 per run but max_error moved only from about 0.068
      to 0.063.

      - After the race: if line_loss_events stay at 1 per run at the same bend entries,
      change controller.line_loss from last_direction to search_right or search_left,
      and if progress is still below 1 with max_error under 0.06, raise controller.base_speed
      toward 1.6.


