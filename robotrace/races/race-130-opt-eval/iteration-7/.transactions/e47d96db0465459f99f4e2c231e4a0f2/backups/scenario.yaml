map:
  id: race-130-opt-eval
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: kp 6.5, kd 0.6 damping
    notes: 'Reduces kp from 7.0 to 6.5 with kd held at 0.6, because iteration 5 still
      had oval oscillation at 0.250 after raising kd. Oscillation did not fall with
      kd, so the change tests whether lower proportional gain removes the jitter.
      Geometry and the other controller values are unchanged, so the race isolates
      this one change.


      ### Rationale


      Evidence from iteration 5 (kp 7.0, kd 0.6, 16 mm sensors at x = ±0.030 m, base_speed
      1.4, ki 0.05, last_direction) is the best raced result at 107.76. All 60 trials
      still ran off track. The oval steering_oscillation was 0.250, still above the
      0.2 concern level. That is the same value as at kd 0.4 and only slightly below
      kd 0.5, so raising kd has stopped helping. The s-bend oscillation rose to 0.238,
      which suggests extra derivative action is amplifying sensor noise and edge transients.
      The oval max_error was 0.063, still just over the 0.06 limit. Line losses were
      1.2 on the oval, 1.65 on the s-bend and 1.0 on the slalom. Progress was 0.49,
      0.22 and 0.08. Body width cannot relax the off-track limit, so control has to
      fix it.


      Change: kp 7.0 to 6.5, with kd held at 0.6, and geometry, base_speed 1.4, ki
      0.05 and last_direction unchanged. This is the single-variable step the Evaluator''s
      plan prescribes when oscillation stays above 0.2 at kd 0.6. Reducing kp lowers
      the response to each unit of edge error, which should reduce overshoot-driven
      jitter. Expected result: oval steering_oscillation falls toward 0.2 or below,
      and the s-bend and slalom oscillation stay low. max_error may rise slightly,
      and I accept that risk while the off-track limit is the binding constraint.
      Progress should hold, since the robot is not finishing.


      Risks: kp 6.5 may weaken the edge recovery and raise max_error and line losses
      at bend entries. If that happens, the next step is to widen the array to ±0.040
      m with kp near 8 and kd 0.5, rather than adding more kd. Hypotheses: (1) oscillation
      is driven by kp overshoot combined with kd noise amplification, not by too little
      damping. (2) Line losses at the s-bend are the main limit on progress, so a
      line_loss search direction is the next lever. Measurements wanted: steering_oscillation,
      max_error, line_loss_events and progress per track, plus rms_error and control_effort.


      - [Open this output](iteration-6/entity0/versions/3dea1b8a334c4f7c817ef95dc2bd3cb4/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-f996a69f550a5ede/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-7522afc1058c25f4/payload.json)'
  - id: entityR1
    label: Approve kp 6.5 test
    notes: 'Approved the single-variable step kp 7.0 to 6.5 at kd 0.6, the plan set
      after iteration 5 (best raced at 107.76, oval oscillation 0.250 above the 0.2
      concern level). Feedback gives next steps by race outcome: widen the array,
      reduce kd, or test a line-loss search direction.


      ### Feedback


      The candidate changes one variable from the best raced design, iteration 5 (kp
      7.0, kd 0.6, 16 mm sensors at x = ±0.030 m, base_speed 1.4, ki 0.05, last_direction).
      kp goes from 7.0 to 6.5, and kd, geometry, base_speed, ki and line_loss stay
      the same. Iteration 5 scored 107.76 and still ran off track on all 60 trials.
      Its oval steering_oscillation was 0.250, above the 0.2 concern level, and the
      same value at kd 0.4 showed that more kd had stopped helping. Oval max_error
      was 0.063, just over the 0.06 limit. Line losses were 1.2 on the oval, 1.65
      on the s-bend and 1.0 on the slalom. Progress was 0.49, 0.22 and 0.08. Body
      width cannot relax the off-track limit, so control has to fix it. This follows
      the plan from iteration 5: when oscillation stays above 0.2 at kd 0.6, reduce
      kp rather than add more kd. Nothing here states how this candidate will perform.
      It is a single-variable, well-supported step from the best raced design, and
      this is the middle of the race with 5 iterations left after this one, so approve
      it to race and get per-track telemetry. After the race: if oval steering_oscillation
      is now at or below 0.2 but max_error is still at or above 0.06, widen geometry.sensor_positions
      to x = ±0.040 m with 16 mm sensors and test kp near 8.0 with kd 0.6. If oscillation
      is still above 0.2 at kp 6.5, reduce kd toward 0.5 and keep kp 6.5, because
      more damping has not reduced oscillation. If line_loss_events stay at 1 or more
      at the same bend entries, test line_loss search_left or search_right, choosing
      the side the failing bends turn towards, and raise base_speed toward 1.6 only
      if progress is still below 1 with max_error under 0.06.


      ### Requested changes


      - After the race: if oval steering_oscillation is at or below 0.2 but max_error
      stays at or above 0.06, widen geometry.sensor_positions to x = ±0.040 m with
      16 mm sensors and test controller.kp near 8.0 with kd 0.6, since iteration 5
      showed max_error of 0.063 with the edge response holding it near the limit.

      - After the race: if steering_oscillation stays above 0.2 at kp 6.5, reduce
      controller.kd toward 0.5 and keep kp at 6.5, because iteration 4 to 5 showed
      that raising kd from 0.4 to 0.6 did not bring oval oscillation below 0.25.

      - After the race: if line_loss_events stay at 1 or more at the same bend entries
      (iteration 5: 1.2 oval, 1.65 s-bend, 1.0 slalom), change controller.line_loss
      from last_direction to search_left or search_right, favouring the side the failing
      bends turn towards.


      - [Open this output](iteration-6/entityR1/versions/18a3b179d1c54d40bd4e5198d1464162/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/3dea1b8a334c4f7c817ef95dc2bd3cb4/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-7522afc1058c25f4/payload.json)'
