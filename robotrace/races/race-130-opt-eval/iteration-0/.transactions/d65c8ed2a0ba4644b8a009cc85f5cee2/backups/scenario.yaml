map:
  id: race-130-opt-eval
  schema: v0.2
  scenario: Iteration 0
  inherits: base.yaml
  notes: Initial prepared state before either AI role or the simulator has acted.
dimensions:
  time_horizon: prepared
  iteration: '0'
overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor
    notes: 'First candidate: five sensors 40 mm ahead of the axle with linear weights,
      base_speed 1.8, kp 4, light ki/kd, and last-direction line recovery. No race
      data yet, so values come from the contract''s speed and stability requirements;
      the requested measurements will show whether it oscillates, runs wide, or is
      too slow.


      ### Rationale


      Iteration 0 has no race data or Evaluator feedback yet, so this is a conservative
      baseline built from the contract. Geometry: five line sensors spaced 8 mm apart
      across x = -16..+16 mm, placed 40 mm ahead of the axle so the robot sees the
      line before it reaches the wheels. The 12 mm footprint covers the 25 mm tape
      with overlap, so at least one sensor reads strongly at all times. Sensor weights
      are linear in lateral position (-1, -0.5, 0, 0.5, 1) so the signal is a smooth,
      proportional estimate of the line offset. Controller: base_speed 1.8 (near full
      PWM, to meet the roughly 1.5 m/s average needed to finish in under 3 s); kp
      4 gives a full-scale steering correction of about 1400 PWM counts at signal
      1, which is strong enough to track the bends without saturating; ki 0.1 removes
      slow bias from the motor mismatch; kd 0.1 damps oscillation. line_loss ''last_direction''
      keeps the robot turning toward the side it last saw the tape. Wheel radius 0.035
      m and track 0.12 m are mid-range for speed and turning stability. Expected result:
      finishes the oval and s-bend with a low rms error. If the robot oscillates,
      reduce kp or raise kd. If it runs wide on sharp bends or slalom, raise kp. If
      it is too slow to finish, raise base_speed or wheel_radius. The measurements
      requested below will show which of these holds.


      - [Open this output](iteration-0/entity0/versions/ea3aa9563ff34326bd3558119dbebb25/payload.json)'
  - id: entityR1
    label: 'Baseline review: approve'
    notes: 'Approved the conservative baseline (kp 4, kd 0.1, base_speed 1.8) because
      it is valid and no earlier race data exists to argue against it. The feedback
      gives conditional kp, kd and base_speed changes to try once the race returns
      telemetry.


      ### Feedback


      Iteration 0 has no race data, so this review rests only on the public contract
      and the candidate''s own contents. Nothing here states how the candidate will
      perform. The candidate is a valid, conservative baseline: five sensors spaced
      8 mm apart at 40 mm ahead of the axle, linear weights (-1, -0.5, 0, 0.5, 1),
      a 12 mm footprint over the 25 mm tape, kp 4.0, ki 0.1, kd 0.1, base_speed 1.8
      and line_loss ''last_direction''. All values sit inside their contract limits,
      and the sensor layout and weights give a proportional line-offset signal. The
      main open question is whether the controller holds the line at the speed needed
      to finish in 3.0 s. Its kp is untested, and so are its base_speed and kd. Approve
      it so that it races and produces telemetry. Once the race reports back, revise
      as follows. If steering_oscillation or max_error are high on the oval or slalom,
      reduce kp to about 3.0 and raise kd to about 0.3, because the signal is a proportional
      estimate and kd damps the jitter. If the robot leaves the track on sharp bends,
      or rms_error is high on the s-bend, raise kp to about 5.0 to 6.0. If it does
      not complete, or completion_time is near 3.0 s with progress below 1, raise
      base_speed to 2.0, which is the saturation point of the PWM base. Only raise
      wheel_radius if the speed gain is not enough. If line_loss_events is above 0,
      consider search_left or search_right only after the other fixes, and keep last_direction
      until the telemetry shows it fails.


      ### Requested changes


      - After the race: if steering_oscillation or max_error is high on the oval or
      slalom, reduce controller.kp to about 3.0 and raise controller.kd to about 0.3.

      - After the race: if the robot leaves the track on sharp bends or rms_error
      is high on the s-bend, raise controller.kp to about 5.0 to 6.0 and keep kd at
      0.1 to 0.2.

      - After the race: if completion is 0 or completion_time is near 3.0 s with progress
      below 1, raise controller.base_speed to 2.0 before changing wheel geometry.


      - [Open this output](iteration-0/entityR1/versions/28afe7616c8d4e0ab46cfd7de26f8545/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/ea3aa9563ff34326bd3558119dbebb25/payload.json)'
