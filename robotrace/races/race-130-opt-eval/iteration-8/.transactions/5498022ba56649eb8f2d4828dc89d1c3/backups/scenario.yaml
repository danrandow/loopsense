map:
  id: race-130-opt-eval
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: kp 6.0, kd 0.6 retest
    notes: 'Keeps kd 0.6 from the best raced design (iteration 6, score 122.66) and
      lowers kp to 6.0, because kd 0.5 (iteration 7, score 91.44) left oval oscillation
      above 0.2. Evidence: oscillation has stayed at 0.25 to 0.27 across kp 6.5 to
      7.0. The Evaluator feedback in this iteration describes the already-raced kd
      0.5 design, so it was treated as stale.


      ### Rationale


      Evidence. Iteration 6 (kp 6.5, kd 0.6, 16 mm sensors at x = ±0.030 m, base_speed
      1.4, ki 0.05, last_direction) is the best raced design at 122.66. All 60 trials
      still went off track. Oval steering_oscillation was 0.270 and oval max_error
      was 0.064, just over the 0.06 limit. Line losses were 1.3 (oval), 1.6 (s-bend)
      and 1.0 (slalom). Iteration 7 changed kd to 0.5 with kp 6.5 and scored worse
      at 91.44. Its oval oscillation was 0.265, still above 0.2, and its line losses
      rose on the oval (1.55). So lowering kd did not reduce oscillation, and it cost
      score. The Evaluator''s R1 feedback describes the same kd 0.5 change, which
      has already raced, so I have treated it as stale for this iteration. Across
      kp 6.5 to 7.0 and kd 0.4 to 0.6, oval oscillation has stayed at 0.25 to 0.27.
      That suggests kp and kd are not the main driver. Still, the plan agreed earlier
      says that when oscillation stays above 0.2 at kd 0.5, return kd to 0.6 and reduce
      kp toward 6.0 rather than adding damping. Body width cannot relax the off-track
      limit, so control must hold max_error under 0.06.


      Change. I return kd to 0.6, the best-scoring value, and reduce kp from 6.5 to
      6.0. Geometry, base_speed 1.4, ki 0.05 and last_direction are unchanged, so
      the result isolates the gain change against the best raced design (iteration
      6).


      Expected result. Oval steering_oscillation falls toward 0.25 or below with the
      lower edge gain. max_error may rise slightly, so the risk is off-track earlier
      on the oval. Progress should hold on the oval and s-bend.


      Hypotheses. (1) The oscillation is set by edge response and sensor-edge transients,
      so a lower kp reduces jitter. (2) Line losses at the s-bend entries are the
      next limit on progress. If they persist at the same entries after this step,
      the next lever is line_loss search_left or search_right.


      Next steps after the race. If oscillation drops and max_error is still at or
      above 0.06, widen the sensor array to x = ±0.040 m (16 mm sensors) and test
      kp near 8.0 with kd 0.6. If oscillation stays above 0.2 at kp 6.0, the jitter
      is not gain-driven, so test ki or sensor footprint changes rather than further
      kp cuts. If line losses stay at 1 or more at the same bend entries, change line_loss
      toward the side the failing bends turn.


      Measurements wanted: steering_oscillation, max_error, line_loss_events, progress
      and completion_time per track, plus rms_error and control_effort.


      - [Open this output](iteration-8/entity0/versions/f9b76be4a6ab4de3ba0b9c89bed4e3e1/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-5bf8f3923f163cfc/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-407e41e9742e9c9f/payload.json)'
  - id: entityR1
    label: Approve kd 0.5 test
    notes: 'Approved the single-variable step kd 0.6 to 0.5 at kp 6.5, the best-raced
      base. Oscillation stayed at 0.25 to 0.27 across kd 0.4 to 0.6 (iterations 3
      to 6), so the next race tests whether less damping helps, and the feedback gives
      follow-ups for widening the sensors or changing line_loss.


      ### Feedback


      The candidate changes one variable from the best raced design, iteration 6 (kp
      6.5, kd 0.6, 16 mm sensors at x = ±0.030 m, base_speed 1.4, ki 0.05, last_direction,
      score 122.66). kd goes from 0.6 to 0.5, and kp, geometry, base_speed, ki and
      line_loss stay the same. The rationale matches the evidence. Oval steering_oscillation
      has stayed between 0.250 and 0.270 across kd 0.4, 0.5 and 0.6 (iterations 3
      to 6), so more kd has not reduced it, and the s-bend value rose with kd (0.238
      at kd 0.6 in iteration 5). Oval max_error has stayed at 0.063 to 0.064, just
      over the 0.06 off-track limit, and body_width cannot relax that limit, so control
      must fix it. Line losses are still 1.3 on the oval, 1.6 on the s-bend and 1.0
      on the slalom (iteration 6). Nothing here states how this candidate will perform.
      It is a low-risk, single-variable step, and with 4 iterations left after this
      one a raced result is more useful than another desk review, so approve it to
      race.


      After the race, use the telemetry as follows. If oval steering_oscillation falls
      to about 0.2 or below while max_error stays at or below 0.063, keep kd 0.5 and
      test a wider array (x = ±0.040 m, 16 mm sensors) with kp near 8. If oscillation
      is still above 0.2 at kd 0.5 and kp 6.5, return kd to 0.6 and reduce kp toward
      6.0 rather than adding damping. If max_error stays at or above 0.06 with oscillation
      low, widen the array as above. If line_loss_events stay at 1 or more at the
      same s-bend entries, test line_loss search_left or search_right, choosing the
      side the failing bends turn towards. Raise base_speed toward 1.6 only if progress
      is still below 1 with max_error under 0.06.


      ### Requested changes


      - After the race: if oval steering_oscillation falls to about 0.2 or below with
      max_error at or below 0.063, widen geometry.sensor_positions to x = ±0.040 m
      with 16 mm sensors and test controller.kp near 8.0 with kd 0.5, because iteration
      6 showed the edge response holds max_error near the limit.

      - After the race: if steering_oscillation stays above 0.2 at kd 0.5, restore
      controller.kd to 0.6 and reduce controller.kp toward 6.0, because oscillation
      was 0.250 to 0.267 across kd 0.4 to 0.6 and more damping has not helped.

      - After the race: if line_loss_events stay at 1 or more at the same s-bend entries
      (iteration 6: 1.6 s-bend, 1.3 oval), change controller.line_loss from last_direction
      to search_left or search_right, favouring the side the failing bends turn towards.


