map:
  id: race-130-opt-eval
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Wider array, kp 8.0
    notes: 'Widens the sensors to x = ±0.040 m and scales kp from 6.0 to 8.0 to keep
      the same effective edge gain. The best raced design (iteration 8, 123.04) still
      had oval max_error 0.0646 and oscillation rising as kp fell, so the reach at
      the edge is the limit. The entityR1 candidate was identical to iteration 8,
      so it was not resubmitted.


      ### Rationale


      Evidence. The entityR1 candidate (kp 6.0, kd 0.6, 16 mm sensors at x = ±0.030
      m) is identical to iteration 8, which has already raced and is the best result
      so far at 123.04. Its feedback was written against iteration 6, so I have not
      resubmitted it. Iteration 8 results: oval steering_oscillation 0.293, oval max_error
      0.0646 (still above the 0.06 off-track limit), line losses 1.4 (oval), 1.3 (s-bend)
      and 1.0 (slalom), progress 0.57, 0.24 and 0.09. Across kp 7.0, 6.5 and 6.0,
      oval oscillation rose (0.250, 0.270, 0.293) while max_error stayed at 0.061
      to 0.065. So cutting kp has not reduced jitter, and the edge response is what
      holds max_error near the limit. Body width cannot relax the off-track limit,
      so control must bring max_error under 0.06.


      Change. I widen the sensor array from x = ±0.030 m to x = ±0.040 m (spacing
      20 mm, from 15 mm), keeping 16 mm footprints and the same weights. The sensors
      then see the edge about 10 mm further out, which gives earlier warning before
      line loss. Because the signal is a normalised weighted average, widening the
      array by 4/3 reduces the signal per unit offset by about 4/3. I scale kp by
      the same factor, 6.0 to 8.0, so the effective edge gain stays as in iteration
      8. kd stays at 0.6 and the other controller fields are unchanged, so the result
      isolates the sensing change.


      Expected result. Line_loss_events fall below 1.4 on the oval, and oval max_error
      drops below 0.06 because the robot gets earlier edge information. Steering_oscillation
      may stay near 0.27 to 0.29, since the effective gain is unchanged.


      Risks. The higher raw kp (8.0) may raise oscillation if the sensor-to-signal
      gain is not as close to 4/3 as assumed. Edge noise may also rise with a wider
      footprint.


      Hypotheses. (1) max_error is limited by sensing reach at the first large offset,
      not by gain. (2) Oscillation is set by the effective gain and kd, so keeping
      the effective gain the same should keep it near the current level.


      Next steps after the race. If oval max_error is now below 0.06 and line losses
      fall, keep this geometry and test base_speed 1.6 for progress. If oscillation
      rises above 0.3 at kp 8.0, return kp toward 7.0 on this geometry. If line_loss_events
      stay at 1 or more at the same bend entries, change line_loss to search_left
      or search_right, favouring the side the failing bends turn towards.


      Measurements wanted: steering_oscillation, max_error, line_loss_events, progress
      and completion_time per track, plus rms_error and control_effort.


      - [Open this output](iteration-9/entity0/versions/31471e9a9fb14d82aa854245c96c30fc/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-b379a700ba702aff/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-d295313d343aece3/payload.json)'
  - id: entityR1
    label: Approve wider sensing
    notes: 'Approved the candidate to race: it widens the sensor array to ±0.040 m
      and sets kp 8.0, testing the sensing-reach hypothesis that iterations 2 to 8
      left untested. Max_error stayed at 0.061 to 0.065 across kp 6.0 to 7.0, and
      oscillation stayed at 0.25 to 0.29, so gain alone is not the lever. The feedback
      gives post-race branches for max_error, oscillation and line losses.


      ### Feedback


      Written before this candidate has raced, so no result is stated for it. The
      candidate changes two things from the best raced design, iteration 8 (score
      123.04): sensors widened from x = ±0.030 m to ±0.040 m with 16 mm footprints,
      and kp raised from 6.0 to 8.0. kd stays at 0.6 and base_speed, ki and line_loss
      are unchanged. The design is within every contract limit, and the sensor reach
      (about ±0.056 m including footprint) stays well inside the 0.06 m off-track
      limit. The rationale is sound on one point: the outer sensors now see the edge
      earlier. Its 4/3 gain-compensation assumption is only approximate, because the
      readings are normalised and the array is not linear, so the effective gain may
      differ from iteration 8. Evidence supports the approach. Oval max_error has
      stayed at 0.061 to 0.065 across kp 6.0 to 7.0 (iterations 2 to 8), so the edge
      response, not gain alone, is what limits it. Oscillation has stayed at 0.25
      to 0.29 on the oval across kp 6.0 to 7.0 and kd 0.4 to 0.6, so raising kp is
      not the main jitter driver. Approve it so it races: it tests the one hypothesis
      not yet tried (sensing reach), there are two iterations left after this one,
      and a race is the only way to measure the effective gain. After the race, use
      the telemetry as follows. If oval max_error falls below 0.06 and line_loss_events
      drop below 1.4, keep this geometry and test base_speed 1.6 for progress. If
      oval steering_oscillation rises above about 0.3 at kp 8.0, return kp toward
      7.0 on this geometry rather than adding kd. If line losses stay at 1 or more
      at the same bend entries, change line_loss to search_left or search_right, favouring
      the side the failing bends turn towards. If this geometry scores below 123 with
      max_error still at or above 0.06, return to the iteration 8 geometry (±0.030
      m) with kp 6.0 and kd 0.6.


      ### Requested changes


      - After the race: if oval max_error is below 0.06 and line_loss_events fall,
      keep geometry.sensor_positions at x = ±0.040 m and test controller.base_speed
      1.6 for progress, since iteration 8 showed max_error near 0.061 to 0.065 under
      the old reach.

      - After the race: if oval steering_oscillation rises above about 0.3 at kp 8.0,
      return controller.kp toward 7.0 on this geometry, not more kd, because oscillation
      has stayed at 0.25 to 0.29 across kd 0.4 to 0.6 (iterations 3 to 8).

      - After the race: if line_loss_events stay at 1 or more at the same bend entries
      (iteration 8: 1.4 oval, 1.3 s-bend, 1.0 slalom), change controller.line_loss
      from last_direction to search_left or search_right, favouring the side the failing
      bends turn towards.


      - [Open this output](iteration-9/entityR1/versions/2c417561b28944eb8c48664cb72fcc15/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/31471e9a9fb14d82aa854245c96c30fc/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-d295313d343aece3/payload.json)'
