map:
  id: race-211-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 1
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 0.
dimensions:
  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Damped, wider-sensor
    notes: 'Raises kd from 0.05 to 0.3 and kp to 3.0, enlarges sensors to 0.016 m
      and moves them forward to y=0.06, lowers base_speed to 1.2 and mass to 0.6.
      The aim is to stop the off-track exits seen in all 60 development trials (max_error
      reached the 0.06 m limit, progress under 0.12).


      ### Rationale


      Evidence: the iteration-0 design went off track in all 60 development trials
      (finish rate 0). Progress was only 0.04 to 0.115, so the robot left the line
      early on every track. max_error was about 0.061, which sits at the off-track
      limit of 0.06 m, and rms_error was about 0.03. The robot was therefore wandering
      toward the edge within a few tenths of a metre, not drifting slowly. Likely
      causes: too little damping (kd = 0.05 is very small against kp = 2.0 at base_speed
      1.4), so the steering overshoots on each bend, and a sensor array of 0.012 m
      footprints with 0.02 m spacing that gives a noisy, low-amplitude signal. The
      contract''s off-track limit is max(0.06, 0.0125 + body_width/4). With body_width
      0.12 that is 0.06, and a wider body does not help until about 0.19 m, which
      is outside the range, so body width stays at 0.12.


      Changes: (1) sensor_size 0.012 to 0.016, so the tape always covers at least
      one or two sensors and the signal is smoother. (2) Sensors moved forward to
      y = 0.06 for more look-ahead, which helps the robot react before the bend. (3)
      kd 0.05 to 0.3 to damp the overshoot on curves. (4) kp 2.0 to 3.0 so the robot
      still corrects hard enough at the wider 0.04 m spread. (5) base_speed 1.4 to
      1.2 to give the steering more time to settle. Mass drops to 0.6 kg to reduce
      yaw inertia and make turns more responsive. Wheel track, wheel radius and body
      are unchanged, and line_loss stays last_direction.


      Expected result: fewer off-track exits, with max_error below 0.05 m on the oval
      and s-bend, and progress rising well above 0.1. Finishing in 3 s at speed 1.2
      is still doubtful. The main goal of this draft is to stay on the line long enough
      to reach the end, so the next revision can raise base_speed.


      - [Open this output](iteration-1/entity0/versions/37e95a85b89247288c94543e876e190d/payload.json)

      - Based on: [entityR2A](iteration-1/entityR2A/versions/carried-5344f13f5235f14d/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Round-1 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-0/entityC1/versions/e3b7a764889647d4a5570cc813fdd612/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/61188e2ea48b49b9922b56f2457b6396/payload.json)'
  - id: entity1
    label: Faster, damped revision
    notes: 'Raises base_speed to 1.7 so the course can finish within 3 s, doubles
      kd to 0.10 to offset sensor lead, and adds a small ki of 0.02 for the motor
      mismatch. Speed and the predictions are judgements, since the PWM-to-speed mapping
      is not given; the kp and geometry are kept.


      ### Rationale


      What I kept, changed and why, in response to the round-1 critique.


      Accepted: (1) Speed is the largest risk. Finishing gives 500 points plus a time
      bonus, and a run that times out at 300 steps scores far less, so the baseline
      base_speed of 1.4 is too conservative. I raise base_speed to 1.7 (base PWM about
      3480, 85 percent). The PWM-to-ground-speed mapping is not given, so this is
      a judgement, not a calculation. I expect the higher demand to shorten the run,
      but it may also reduce line-following margin on tight bends. (2) Sensor coverage:
      the footprint gap is 0.008 m and the tape is 0.025 m, so the line is always
      seen by at least one sensor. Only the centre sensor covers a centred tape, and
      I no longer claim otherwise. (3) Body width: the critique is right that body_width
      does not change the off-track limit in the allowed range, which is set by the
      0.06 m floor. I keep 0.12 m only because it is a neutral, valid value, not for
      margin. (4) Lead: sensors sit 0.05 m ahead of the axle, which is about 30 ms
      of lead at 1.7 m/s. I raise kd from 0.05 to 0.10 so the controller reacts faster
      to changes in the signal on bends. (5) Motor mismatch: the critique is right
      that a fixed left/right mismatch gives a steady offset with ki = 0. I add a
      small ki = 0.02. With the integral capped at +/-2, its maximum contribution
      is about 0.02 x 2 x 350 = 14 PWM, so it removes bias slowly without risking
      windup.


      Rejected or kept: I keep kp = 2.0 and the symmetric sensor layout and weights.
      Nothing in the critique or the inputs shows that kp is wrong, and changing it
      without telemetry would be guesswork. I keep last_direction for line loss, since
      it suits curved courses.


      Predictions (guesses, not expectations): I expect the robot to complete the
      development tracks in roughly 2.5 to 3.0 s, with progress near 1, a few line-loss
      events on the slalom, and rms_error around 0.02 to 0.05 m. If the run times
      out or leaves the line, the next revision should lower base_speed toward 1.5
      before changing kp. If steering_oscillation is high, raise kd further before
      reducing kp.


      - [Open this output](iteration-0/entity1/versions/714d6972a1df4288af9a40d212464eab/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/61188e2ea48b49b9922b56f2457b6396/payload.json),
      [entityC1](iteration-0/entityC1/versions/e3b7a764889647d4a5570cc813fdd612/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Round-2 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-0/entityC2/versions/7a8235727a2d4a4bbbe104f1a3502a91/payload.json)

      - Based on: [entity1](iteration-0/entity1/versions/714d6972a1df4288af9a40d212464eab/payload.json)'
  - id: entity2
    label: 'Final: fast, kd 0.10'
    notes: 'Final design keeps the revision unchanged: base_speed 1.7, kp 2.0, ki
      0.02, kd 0.10, last_direction line loss. The critique''s concerns about unproven
      speed and a weak ki/kd effect are accepted as risks and tested next iteration,
      not fixed by guesswork. The 1.7 speed is unverified and is the main timeout
      risk.


      ### Rationale


      Final design: the revised design (entity1) with no changes to its values. I
      considered the round-2 critique and kept the revision as written.


      Accepted from the critique: (a) the rationale''s claim that the 0.12 m body
      width is neutral, not a margin gain, is correct and I have not claimed otherwise;
      (b) the ki = 0.02 term is kept, but I accept the critique''s point that it cannot
      correct the 2 percent motor mismatch. Its maximum contribution is about 14 PWM,
      while the mismatch is worth tens of PWM, so kp carries the steering and ki is
      a minor trim. The term is kept because it is harmless within the +/-2 integral
      cap.


      Rejected or unchanged: (c) I keep base_speed = 1.7. The critique gives no evidence
      that a lower speed would finish faster, and a 3 s timeout is costly, so the
      risk of running at 1.7 m/s must be weighed against the risk of being too slow.
      The next revision will test this directly. If the run times out or line_loss_events
      rises, I will lower base_speed toward 1.5 before changing anything else. (d)
      I keep kd = 0.10. The critique is right that its effect is modest (about 35
      PWM on a fast bend), and it will amplify sensor noise, so I will watch steering_oscillation
      before raising it further. (e) I keep last_direction for line loss, since the
      courses are curved and it recovers in the direction of the last valid signal.
      I did not add an integral reset on line loss, because the contract offers no
      such option; the integral cap limits the damage.


      Predictions (guesses, not expectations): completion in roughly 2.5 to 3.0 s
      with progress near 1 and a few line-loss events on the slalom. Timeout is an
      equally plausible outcome. rms_error around 0.02 to 0.05 m.


      - [Open this output](iteration-0/entity2/versions/0f799e6cc42c4dc5bce9c15a3eb28674/payload.json)

      - Based on: [entity1](iteration-0/entity1/versions/714d6972a1df4288af9a40d212464eab/payload.json),
      [entityC2](iteration-0/entityC2/versions/7a8235727a2d4a4bbbe104f1a3502a91/payload.json)'
