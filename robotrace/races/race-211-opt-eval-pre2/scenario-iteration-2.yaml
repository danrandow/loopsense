map:
  id: race-211-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Wide 7-sensor array
    notes: 'Widens the sensor span to ±0.075 m with linearly scaled weights, so the
      line stays visible past the off-track limit and the signal is proportional to
      offset. kp is raised to 4.5 to offset the smaller signal per metre. Based on
      iteration 1 going off track in every trial with its ±0.04 m span.


      ### Rationale


      Evidence: iteration 1 (score 37.04) still went off track in all 60 development
      trials, with progress only 0.04 to 0.125 and max_error at the 0.06 m off-track
      limit. The robot loses the line early, and the design gives it little help once
      it drifts.


      Diagnosis: the sensor span was ±0.04 m. Once the tape sits about 0.03 m or more
      from centre, the outer sensors read nothing. Only near-centre sensors then see
      tape, so the normalised signal is small or zero and the correction is weak.
      The robot then drifts to the limit. Iteration 0 had the same span, so it has
      the same weakness.


      Changes: (1) Widen the sensor array to x = ±0.075 m with 7 sensors at 0.025
      m spacing, so the tape stays visible out to about 0.09 m offset. The outer edge
      of the 0.016 m footprints then sits inside the off-track limit. (2) Scale the
      weights linearly with x, so the signal is roughly proportional to lateral offset
      (about d/0.075) over the whole range. Weights are -1.0, -0.67, -0.33, 0, 0.33,
      0.67, 1.0. (3) Because the signal is now about half as large per metre of offset,
      raise kp from 3.0 to 4.5 to keep similar steering authority. (4) Raise kd from
      0.3 to 0.4 to keep the same damping ratio as kp rises. (5) Keep sensor size
      0.016, sensor y 0.06, base_speed 1.2 (speed is the secondary issue while the
      robot stays on the line), mass 0.6, wheel track 0.12, wheel radius 0.03, body
      0.12 by 0.16, ki 0, and line_loss last_direction.


      Expected result: the robot should stay on the line through the bends, with max_error
      well under 0.06 and fewer line-loss events. I expect progress to rise clearly
      above 0.125 on the oval and s-bend, and possibly to complete some runs. Finishing
      in 3 s will likely need a higher base_speed in a later revision once tracking
      is stable.


      - [Open this output](iteration-2/entity0/versions/1c7b8a30996d492aa4d2ce8de1dc5d16/payload.json)

      - Based on: [entityR2A](iteration-2/entityR2A/versions/carried-2a389fcaa16692ed/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critiques the draft''s five-plus simultaneous changes, the incorrect spread
      claim, the speed cut that works against the finish requirement, and the kd 0.3
      saturation risk. Evidence is the iteration-0 telemetry (progress 0.04 to 0.115,
      all off-track, one line loss each) and the contract''s signal and PWM equations.


      - [Open this output](iteration-1/entityC1/versions/b68a8c533e2847e0af1d6d61d24e7f0a/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/37e95a85b89247288c94543e876e190d/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-5344f13f5235f14d/payload.json)'
  - id: entity1
    label: Speed-down, stiffer steer
    notes: 'Revised to base_speed 1.3 from the failed 1.7, kp 3.0, kd 0.15, with ki
      0.02 kept. Only steering and speed change, so the next race isolates them. The
      change rests on iteration-0 data: all 60 trials left the line at progress of
      0.115 or less.


      ### Rationale


      Evidence: the iteration-0 design (base_speed 1.7, kp 2.0, kd 0.1, ki 0.02, sensors
      at y 0.05, footprint 0.012, mass 0.8) went off track in all 60 trials. Progress
      was only 0.035 to 0.115, max_error reached the 0.06 m limit, and each run had
      one line-loss event. The robot left the line early, not gradually. I accept
      the critique''s main point: the failure happens too early for a slow drift,
      and the draft changed too many things at once to learn from. I also accept that
      base_speed 1.2 cuts the speed the time term needs, so I do not go that low.


      What I changed, and why:

      (1) base_speed 1.7 to 1.3. The race data show the robot cannot hold the line
      at 1.7 with this steering. Staying on the line is the precondition for any score,
      so I lower speed to a level between the failed 1.7 and the untested 1.2. This
      is a judgement, since no PWM-to-ground-speed mapping is given.

      (2) kp 2.0 to 3.0. Stronger steering correction is needed to hold the line at
      speed. kp 3 gives up to 1050 PWM of differential at full signal, which is within
      range.

      (3) kd 0.1 to 0.15. Damping is raised moderately. I reject the critique''s kd
      0.3 for now. At 0.3, a signal change of 0.02 per 10 ms step already gives a
      turn term of about 0.6, and sharper changes saturate the wheels. kd 0.15 is
      a bounded step up.

      (4) ki kept at 0.02 to offset the seeded left/right motor mismatch. Its maximum
      contribution is about 14 PWM, so windup is small.


      Kept unchanged, so the race isolates speed and steering gains: sensor size 0.012,
      sensor spacing and y = 0.05, sensor weights, mass 0.8, wheel geometry, body,
      and line_loss last_direction. I keep body_width 0.12. The off-track limit is
      0.06 m across the allowed range, so the value is neutral.


      Decision rule for the next revision: if the robot still leaves the line before
      progress 0.5 (line_loss_events of 1 or more, max_error at 0.06), lower base_speed
      to 1.1 before changing gains. If it stays on track but does not finish, raise
      base_speed in steps of 0.1. If steering_oscillation is high with max_error low,
      raise kd before lowering kp. Success means completion 1 with rms_error under
      0.03 m.


      Predictions are guesses, not expectations: progress should rise well above 0.115,
      and max_error should fall below 0.05 m on the oval and s-bend. The draft aims
      to reach the end of the course, not to finish in 3 s, so the time term is likely
      small until base_speed is raised.


      - [Open this output](iteration-1/entity1/versions/67f1235c5f944e808823a2ed7d82bb39/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/37e95a85b89247288c94543e876e190d/payload.json),
      [entityC1](iteration-1/entityC1/versions/b68a8c533e2847e0af1d6d61d24e7f0a/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-5344f13f5235f14d/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Round-2 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-1/entityC2/versions/9d313a7c43b54ff2b03e0dee30ae3b86/payload.json)

      - Based on: [entity1](iteration-1/entity1/versions/67f1235c5f944e808823a2ed7d82bb39/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-5344f13f5235f14d/payload.json)'
  - id: entity2
    label: Speed 1.3, kp 3.0 final
    notes: 'Final design keeps the revised controller (base_speed 1.3, kp 3.0, kd
      0.15, ki 0.02) with geometry unchanged, so the race isolates speed and steering.
      It rests on iteration 0, where every trial left the line at speed 1.7 with low
      oscillation and max_error at the limit; the rationale notes the speed and kp
      changes are confounded and sets a decision rule to separate them.


      ### Rationale


      Final rationale. I kept the revised design (entity1) with its controller values
      unchanged: base_speed 1.3, kp 3.0, kd 0.15, ki 0.02, last_direction line loss.
      Geometry is unchanged, so the race still isolates speed and steering gains.


      Evidence: the iteration-0 design (base_speed 1.7, kp 2.0, kd 0.1) left the line
      in all 60 trials, with progress 0.035 to 0.115 and one line-loss event per run.
      max_error reached the 0.06 m limit while steering_oscillation stayed low (0.064
      to 0.075). Low oscillation with a bend-entry departure points to insufficient
      steering authority as well as excess speed.


      Accepted from the round-2 critique: (a) the critique is right that base_speed
      and kp were changed together, so this race cannot fully attribute any improvement.
      I accept that cost, because the first priority is a design that stays on the
      line. The decision rule below separates the two effects in the next iteration.
      (b) The critique''s point that low oscillation with high max_error points to
      steering authority supports the kp increase. (c) The critique''s warning that
      base_speed 1.3 may fall short of the roughly 1.5 m/s needed to finish in 3 s
      is accepted. Completion is not expected in this iteration, and the time term
      is treated as secondary until the robot holds the line.


      Rejected or deferred: (d) I keep kd at 0.15 rather than the critique''s implied
      higher values. At 0.3, derivative action would saturate on sharp signal changes
      and amplify sensor noise. I will raise kd only if steering_oscillation is high
      while max_error is low. (e) I keep ki at 0.02. Its effect is small (about 14
      PWM maximum), so it is a bias trim, not a fix for the motor mismatch. (f) I
      keep last_direction, since the courses are curved and it recovers in the direction
      of the last valid signal. I do not add an integral reset, because the contract
      offers no such option.


      Decision rule for the next iteration: if line_loss_events is 1 or more, or max_error
      reaches 0.06 before progress 0.5, lower base_speed to 1.1 before changing any
      gain. If the robot stays on track but does not finish, raise base_speed in steps
      of 0.1. If steering_oscillation is high with max_error low, raise kd before
      lowering kp. Success means completion 1 with rms_error under 0.03 m.


      Predictions (guesses, not expectations): progress rises well above 0.115 on
      the oval and s-bend, and max_error falls below 0.05 m. Completion within 3 s
      is unlikely at this speed, and a timeout that stays on track would count as
      a useful result.


      - [Open this output](iteration-1/entity2/versions/9b7b241d5a4144a6840be70c2441f809/payload.json)

      - Based on: [entity1](iteration-1/entity1/versions/67f1235c5f944e808823a2ed7d82bb39/payload.json),
      [entityC2](iteration-1/entityC2/versions/9d313a7c43b54ff2b03e0dee30ae3b86/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-5344f13f5235f14d/payload.json)'
