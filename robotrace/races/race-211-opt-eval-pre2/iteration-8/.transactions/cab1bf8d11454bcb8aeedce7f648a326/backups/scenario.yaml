map:
  id: race-211-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Add integral to iter 6
    notes: 'Keeps the best-raced geometry and controller from iteration 6 (score 69.3)
      and adds ki = 1.0 to cancel the steady motor-mismatch drift that keeps pushing
      the robot to the 0.06 m edge. Evidence is the consistent max_error near the
      limit with low oscillation, and the best progress so far comes from the iteration-6
      design.


      ### Rationale


      Evidence: all 7 designs raced so far went off track in every development trial
      (finish rate 0). The off-track limit is max(0.06, 0.0125 + body_width/4), so
      it stays at 0.06 m across the allowed body widths, and max_error sits at that
      limit in every race. rms_error is about 0.03 and steering_oscillation is low
      (0.06 to 0.17). The robot therefore drifts steadily toward one edge rather than
      jittering. Iteration 6 (wide 7-sensor array, kd 1.2, base_speed 0.9, track 0.10,
      mass 0.5) is the best race at 69.3, with oval progress 0.24 and s-bend progress
      0.14. Iteration 7 lowered speed to 0.7 and raised kd to 1.6, and oval progress
      fell to 0.196, so that step was worse. Slalom progress is fixed at 0.1025 in
      every race since iteration 5, so kd and speed do not move that failure point.


      Diagnosis: a fixed left/right motor mismatch gives a steady bias. With ki =
      0, a purely proportional loop settles at an offset of about bias/kp, which is
      consistent with a constant drift to the edge. Iteration 3 tested ki = 0.6 on
      the narrow array and changed the score by only -0.58, but that test was confounded
      by a weak narrow sensor signal and kp 3.0. The wide array''s signal is roughly
      proportional to offset, so integral action should now act on the real bias.


      Change: keep the iteration-6 geometry and the kd 1.2, base_speed 0.9 and kp
      4.5 controller, and add ki = 1.0 to remove the steady motor-mismatch offset.
      The integral is capped at +/-2, so the maximum added turn is about 700 PWM (1.0
      x 2 x 350), which bounds windup on sustained curves. I am changing only ki so
      that the race isolates its effect.


      Expected result: the steady offset should shrink, so max_error should drop and
      oval and s-bend progress should rise above 0.24 and 0.14. Completion within
      3 s is still unlikely at speed 0.9. If tracking holds, a later revision should
      raise base_speed in steps. The main risk is integral overshoot on curves, which
      I will watch through steering_oscillation.


      - [Open this output](iteration-8/entity0/versions/13b5aaec376a4ef79ea7cd7587d0d6a2/payload.json)

      - Based on: [entityR2A](iteration-8/entityR2A/versions/carried-533af3326b32d7f7/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Round-1 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-8/entityC1/versions/007444423693422cb6c440a4cb26747c/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/13b5aaec376a4ef79ea7cd7587d0d6a2/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-533af3326b32d7f7/payload.json)'
  - id: entity1
    label: kd 0.6 on verified best
    notes: 'Restarts from the verified iteration-6 design (kp 7.0, score 69.3) and
      changes only kd from 0.4 to 0.6 to test whether more damping holds the oval
      steering oscillation down. I rejected the draft''s ki 1.0 and its stacked track,
      mass and speed changes, since the critique showed the mechanism and the stacking
      were unsupported.


      ### Rationale


      Evidence: the best verified race is iteration 6 (score 69.30): wide 7-sensor
      array, kp 7.0, kd 0.4, ki 0, base_speed 1.0, mass 0.6, wheel_track 0.12, last_direction.
      Iteration 7 (kp 8.5) fell to 63.45, with oval progress dropping from 0.242 to
      0.196, so kp 7.0 is near the useful limit. Every trial in every race still left
      the track at max_error about 0.06, with rms_error about 0.03 and low steering
      oscillation, so the failure is a steady drift to the edge rather than jitter.
      s-bend progress (0.14) and slalom progress (0.1025) have not moved with kp,
      kd, ki or sensor changes, which points to a fixed entry or start event.


      Response to the round-1 critique. I accept the main criticism: the draft I was
      given does not match the verified best. It sets kp 4.5, kd 1.2, speed 0.9, track
      0.10, mass 0.5 and ki 1.0, which stacks untested changes. I reject that design.
      I also reject ki 1.0. Iteration 3 showed integral action did not help, and the
      critique''s arithmetic shows a 2 percent motor mismatch cannot produce a 6 cm
      offset, so integral windup and post-bend overshoot are a larger risk than the
      claimed benefit. I also reject the draft''s track and mass changes, since they
      shift yaw gain in ways I cannot attribute.


      What I changed: I restart from the verified iteration-6 controller and geometry
      and change one variable, kd from 0.4 to 0.6. The aim is to test whether a modest
      increase in damping can hold kp 7.0 with less oscillation, since oval steering
      oscillation rose to 0.168 at kp 7.0. I accept the critique''s point that kd
      did not show a clear causal effect in iteration 5, so this is a small step,
      not a full correction. Everything else is unchanged, including kp 7.0, ki 0,
      base_speed 1.0, mass 0.6, wheel_track 0.12, and the wide array.


      Decision rule for the next revision: if oval progress is at least 0.26 and steering_oscillation
      stays under 0.2 with line_loss_events 0, keep kd 0.6. If progress falls below
      0.24 or oscillation rises above 0.2, revert to kd 0.4 (iteration 6). If s-bend
      progress stays at 0.14 and slalom at 0.1025, the cause is a start or entry event,
      and the next test should change the line-loss rule or the start, not the gains.


      Predictions (guesses, not expectations): oval progress near 0.24 to 0.27, and
      max_error near 0.06. Completion within 3 s is out of reach at speed 1.0 (about
      1.5 m/s is needed), so this race is a stability and progress test, not a completion
      candidate.


      - [Open this output](iteration-8/entity1/versions/456f33439d4642ca9e90b965936f5bc0/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/13b5aaec376a4ef79ea7cd7587d0d6a2/payload.json),
      [entityC1](iteration-8/entityC1/versions/007444423693422cb6c440a4cb26747c/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-533af3326b32d7f7/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Critiques the kd 0.6 revision on noise cost, the mismatch between a drift
      diagnosis and a damping test, the tight oscillation gate and the oval-only progress
      rule. Evidence comes from the iteration 6 and 7 race data and the contract''s
      noise and signal scales.


      - [Open this output](iteration-8/entityC2/versions/5fc737d8e88c4ee7999358f9c4f68b96/payload.json)

      - Based on: [entity1](iteration-8/entity1/versions/456f33439d4642ca9e90b965936f5bc0/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-533af3326b32d7f7/payload.json)'
  - id: entity2
    label: kd 0.5 on verified best
    notes: 'Final design changes only kd, from 0.3 to 0.5, on the raced iteration-6
      best (kp 7.0, ki 0.02, same wide array). The revision''s stated baseline (kd
      0.4, ki 0) did not match the raced record, and kd 0.5 rather than 0.6 limits
      the noise risk the critique raised.


      ### Rationale


      Evidence. The verified best is iteration 6 (score 69.30). Its raced controller
      was kp 7.0, kd 0.3, ki 0.02, base_speed 1.0, last_direction, with the 7-sensor
      array at x = -0.075 to 0.075 (0.025 m spacing), y 0.06, footprint 0.016, mass
      0.6, wheel_track 0.12. Oval progress was 0.242 and steering_oscillation 0.168.
      S-bend progress (0.1425) and slalom progress (0.1025) were flat across kp 5.5
      to 7.0, and kp 8.0 (iteration 7) dropped oval progress to 0.196 and the score
      to 63.45. Every trial ended off track at max_error about 0.06.


      Corrections. The round-2 revision says iteration 6 used kd 0.4 and ki 0. The
      raced record shows kd 0.3 and ki 0.02, so its baseline is wrong. I restart from
      the true raced values. The round-2 critique is right on four points: the kd
      0.4 noise cost was never estimated, the 0.2 oscillation gate sits close to the
      raced 0.168, the oval is the only track that moved, and the middle band of the
      decision rule was undefined. I accept all four.


      What I accepted and rejected. I reject the revision''s kd 0.4 and ki 0 as the
      baseline, and the critique''s point that the drift is steady so damping cannot
      fix it: damping does not address a steady offset, but oscillation and max_error
      under a gain change are the only measured effects I have. I accept that kd is
      a weak lever for the s-bend and slalom, which look like a start or entry event.
      I reject kp 8.5 (the revision''s value, which was not raced) and any speed change,
      because speed would confound a gain test and completion is out of reach at speed
      1.0 anyway.


      What I changed. One variable against the true best: kd 0.3 to 0.5 (+67 percent).
      I choose 0.5, not the revision''s 0.6, to limit derivative noise amplification,
      which the critique estimated as the main risk. ki stays 0.02, kp stays 7.0,
      and geometry, weights, base_speed and line loss are unchanged.


      Predictions (guesses). Oval progress 0.24 to 0.27. S-bend progress about 0.14
      and slalom about 0.10, because kd is not expected to move the entry event. steering_oscillation
      0.17 to 0.22. Line_loss_events on the slalom at 1 or fewer.


      Decision rule, applied to the seed mean on each track. Keep kd 0.5 if oval progress
      is at least 0.26 and oscillation is under 0.2 with no rise in max_error. If
      oval progress is 0.24 to 0.26 with oscillation under 0.2, keep kd 0.5 but do
      not count it as a gain. If progress falls below 0.24 or oscillation is above
      0.2, revert to kd 0.3 (iteration 6). If s-bend stays at 0.14 and slalom at 0.10,
      the next iteration changes the start or the line-loss rule (search_left or search_right)
      and does not touch the gains. The oval per-seed spread (about 97 to 117 score)
      is large, so no single seed decides the rule.


      This race tests stability and progress, not completion.


      - [Open this output](iteration-8/entity2/versions/4d6a9f5c0d214d2daef743d71bc25f77/payload.json)

      - Based on: [entity1](iteration-8/entity1/versions/456f33439d4642ca9e90b965936f5bc0/payload.json),
