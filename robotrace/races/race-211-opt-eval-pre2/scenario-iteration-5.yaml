map:
  id: race-211-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Wide array, slower, more
    notes: 'Tests the untested wide 7-sensor array at lower speed (0.9) with kd raised
      to 0.8. Every raced design has left the track at about 0.06 m with progress
      near 0.04, so the change targets early-bend overshoot and drift.


      ### Rationale


      Evidence: all three raced designs (iterations 0, 1 and 3) left the track in
      every development trial, with finish rate 0. max_error sits at about 0.06 m
      in every race, which is the off-track limit for body_width 0.12 and cannot be
      raised within the allowed range. rms_error is about 0.03 and steering_oscillation
      is small (0.06 to 0.15), so the robot drifts steadily to the edge rather than
      jittering. Progress is almost identical across kp, kd, ki, sensor size and line-loss
      settings (0.04 on the s-bend in every race). Adding ki (iteration 3) changed
      the score by only -0.58, so integral action is not the fix. Iteration 2''s wide
      7-sensor array and iteration 4''s lower speed were never raced, so both remain
      untested.


      Changes: (1) Use the wide 7-sensor array at x = -0.075 to +0.075 (0.025 m steps),
      y = 0.06, sensor size 0.016. This keeps the tape visible out to about 0.09 m
      of offset, before the 0.06 m limit is reached. (2) Lower base_speed from 1.2
      to 0.9 to test whether entry speed on the early bend is the failure point, and
      to give the steering more time to settle. (3) Keep kp 4.5 to match the halved
      signal per metre of offset from the wider array. (4) Raise kd from 0.4 to 0.8.
      The higher kp and lower speed raise the risk of overshoot, and extra damping
      should counter it. (5) Set ki to 0 to keep the test clean. Geometry otherwise
      matches iteration 1 (mass 0.6, wheel track 0.12, radius 0.03, body 0.12 x 0.16)
      and line_loss stays last_direction.


      Expected result: the robot should hold the line through the early bend, so max_error
      should fall below 0.06 and progress should rise above 0.04 on the s-bend. Finishing
      within 3 s is unlikely at 0.9 speed. If tracking holds, the next revision should
      raise base_speed in steps toward 1.5 to 2.0.


      - [Open this output](iteration-5/entity0/versions/20d6f2b2d38f4cfc88ffc9b6a46dc936/payload.json)

      - Based on: [entityR2A](iteration-5/entityR2A/versions/carried-0e958cc2bb2654e1/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Round-1 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-5/entityC1/versions/d5d66678362949b9ae6bee03a2a74066/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/20d6f2b2d38f4cfc88ffc9b6a46dc936/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-0e958cc2bb2654e1/payload.json)'
  - id: entity1
    label: Wide array, matched gain
    notes: 'Keeps the untested 7-sensor wide array and moves kp to 5.5 to match steering
      authority, with kd 0.4 instead of 0.8 and base_speed 1.0. Rests on the critique''s
      slope arithmetic and on the 0.040 s-bend progress seen in every prior race.


      ### Rationale


      Evidence: every raced design (iterations 0, 1 and 3) left the track in all 60
      trials. Progress on the s-bend is 0.040 in every race whatever kp, kd, ki, sensor
      size or base_speed (1.0 to 1.7) was used, and max_error sits at the 0.06 m off-track
      limit. A failure point that does not move with gains or speed points to a fixed
      early event, not a slow drift. Iteration 2''s wide array, which was never raced,
      is the only untested change that targets the visibility problem, so it is the
      one I keep.


      What I accept from the round-1 critique: (1) The draft changed several things
      at once, so I keep the wide-array geometry and change only the controller terms
      that the critique''s arithmetic flags. (2) kd 0.8 is rejected. It doubles the
      derivative with no signal-rate estimate, and it would amplify the about 2 percent
      noise. I use kd 0.4, which was the value in the untested iteration-2 design.
      (3) The gain-matching point is accepted. The wide array has about 13 signal
      units per metre against about 25 for iteration 1. Keeping steering authority
      of about 75 units per metre (kp times slope) needs kp of about 5.5, not 4.5.
      (4) The visibility point is accepted and stated: outer sensors see tape only
      beyond about 0.054 m offset, so the gain varies with offset. This is a limit
      of the layout, not something I can fix within the range.


      What I changed: base_speed 0.9 to 1.0, so the speed is no longer below the 1.0
      already raced and the time term is not dropped entirely. kp 4.5 to 5.5 for matched
      authority, kd 0.8 to 0.4, ki kept at 0, line_loss last_direction. Mass, wheel
      track and radius, body and sensor y = 0.06 are unchanged.


      Rejected: lowering speed further as the main test. Completion needs about 1.5
      m/s, so a 0.9 run cannot finish. The useful question now is whether the robot
      stays on the line at all.


      Predictions (guesses, not expectations): max_error below 0.06 and progress above
      0.04 on the s-bend. Finishing within 3 s is unlikely at this speed. Decision
      rule for the next revision: if max_error is below 0.05 with line_loss_events
      0 on the s-bend, raise base_speed in steps of 0.2 toward 1.5. If progress is
      still 0.040 on the s-bend, the cause is a start or entry transient, and the
      next test should change the line-loss rule or the start, not the gains.


      - [Open this output](iteration-5/entity1/versions/96534151735147158bdbc3ba5766dba9/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/20d6f2b2d38f4cfc88ffc9b6a46dc936/payload.json),
      [entityC1](iteration-5/entityC1/versions/d5d66678362949b9ae6bee03a2a74066/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-0e958cc2bb2654e1/payload.json)'
  - id: entityC2
    label: Round-2 critique
    notes: 'Critiques the wide-array revision (kp 5.5, kd 0.4, ki 0, base_speed 1.0).
      The main points: gain matching carries forward the steering strength that failed,
      kd 0.4 noise cost is not estimated, the ki change is unexplained, and the rationale
      does not follow through on the fixed-event evidence. Evidence is the iteration
      0, 1 and 3 race tables.


      - [Open this output](iteration-5/entityC2/versions/5c1e9d72af724a3391196bf035f155d8/payload.json)

      - Based on: [entity1](iteration-5/entity1/versions/96534151735147158bdbc3ba5766dba9/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-0e958cc2bb2654e1/payload.json)'
  - id: entity2
    label: Wide array, kp 5.5, kd
    notes: 'Final design keeps the untested 7-sensor wide array at 0.025 m spacing
      and matches steering authority with kp 5.5. It lowers kd to 0.3 to bound noise
      amplification and restores ki to 0.02 so only base_speed, kp and kd differ from
      the last raced design. Evidence: the s-bend stuck at progress 0.040 and max_error
      near 0.061 across all raced designs.


      ### Rationale


      Evidence: all three raced designs (iterations 0, 1 and 3) left the track in
      all 60 trials. On the s-bend, progress was 0.040 and max_error about 0.061 to
      0.062 in every race, whatever kp, kd, base_speed or sensor spacing was used.
      A failure point that does not move with gains or speed points to a fixed early
      event, most likely a sensing limit at the track edge, so I keep the wide-array
      geometry as the one change aimed at that limit.


      Accepted from the round-2 critique: (1) The ki change from 0.1 to 0 was unexplained.
      I set ki to 0.02, the value of the last raced design, so the only controller
      changes against that race are base_speed, kp and kd. Its maximum contribution
      is about 14 PWM, so it is a bias trim only. (2) Gain matching is kept: 7 sensors
      at 0.025 m spacing give about 13.3 signal units per metre, and kp 5.5 keeps
      steering authority near 73 units per metre, close to the 75 of iteration 1.
      (3) The visibility limit is accepted: outer sensors see tape only beyond about
      0.054 m offset, so they add little before the robot is near the 0.06 m limit.
      I state this as a limit of the layout.


      Partly accepted: kd. The critique''s noise estimate for kd 0.4 (about 280 PWM)
      is a guess built on an assumed signal jitter, not measured data. Even so, the
      noise risk is real, so I lower kd from 0.4 to 0.3 to bound the derivative term
      while keeping meaningful damping. Rejected: lowering base_speed further as the
      main test, because completion needs about 1.5 m/s and a 0.9 run cannot finish.
      base_speed stays at 1.0, the speed already raced, so the sensing change is the
      one new variable against it.


      Summary of changes against the last raced design (iteration 3): sensor layout
      widened to 7 sensors at 0.025 m spacing from x -0.075 to 0.075 with y 0.06 and
      footprint 0.016; mass 0.6; kp 5.5; kd 0.3; ki 0.02; base_speed 1.0. Line loss
      stays last_direction.


      Expected result (guess): max_error below 0.06 and progress above 0.04 on the
      s-bend. Decision rule: if max_error is below 0.05 with zero line-loss events
      on the s-bend, raise base_speed in steps of 0.2 toward 1.5. If progress is still
      0.040 on the s-bend, the cause is a start or entry transient, and the next test
      should change the line-loss rule (search_left or search_right) or the start,
      not the gains.


      - [Open this output](iteration-5/entity2/versions/4e223f7fde4a45148aae2ad0311e536c/payload.json)

      - Based on: [entity1](iteration-5/entity1/versions/96534151735147158bdbc3ba5766dba9/payload.json),
