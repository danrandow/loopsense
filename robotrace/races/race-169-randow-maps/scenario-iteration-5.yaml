map:
  id: race-169-randow-maps
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Wider span +/-0.036 m
    notes: 'Keeps the 0.10 m track, 12 mm footprints and 0.06 m lead, and widens the
      seven-sensor span to +/-0.036 m at 0.012 m pitch. Iteration 4 showed the slalom
      still exits at max_error about 0.062 with 1.0 line-loss events, which points
      to limited sensor reach, while the oval held 20/20 and s-bend jitter stayed
      at 0.32.


      ### Rationale


      Iteration 4 (lead 0.06 m, 12 mm footprints, +/-0.03 m span, wheel_track 0.10
      m) scored 629.5, close to the best 631.8. The oval finished 20/20 in 1.82 s,
      so the 0.10 m track does not hurt the oval and the time margin is intact. The
      s-bend finished 17/20 with steering_oscillation 0.319, below the 0.35 jitter
      threshold. The slalom is still 0/20. Its line_loss_events are 1.0 (not below
      1.0) and its max_error is 0.0619, just past the 0.06 m off-track limit. That
      limit is max(0.06, 0.0125 + body_width/4), which stays at 0.06 m for every allowed
      body_width, so body width cannot help. Across all five iterations, the slalom
      has failed at max_error 0.062 to 0.064 whatever the lead, footprint or track.
      The likely cause is reach: with a 12 mm footprint and the outermost sensor at
      0.03 m, the array sees the tape only to about 0.048 m from centre, so the robot
      loses the line before it reaches the 0.06 m limit. Lead 0.04 m hurt every track,
      so lead stays at 0.06 m. The 16 mm footprint gave no slalom gain. I therefore
      change only the span: widen it from +/-0.03 m to +/-0.036 m with seven 12 mm
      sensors at a 0.012 m pitch. Adjacent footprints then just abut, so the tape
      is still covered everywhere in the array. The line is visible out to about 0.054
      m from centre, which should cut slalom line loss before the limit. wheel_track
      stays at 0.10 m, which the oval shows is safe. Expected result: slalom line_loss_events
      fall clearly below 1.0 and max_error drops toward 0.055 to 0.06, with the first
      slalom finishes possible. Risk: the wider span raised s-bend jitter in iteration
      1 (0.25 to 0.34), so the next race must show whether steering_oscillation stays
      below about 0.35.


      - [Open this output](iteration-5/entity0/versions/0969c6dc6c6d44e1a2f9aa27a1a7cf86/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-4d5987dbfc7dba93/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-059c5dde6ea421e1/payload.json)'
  - id: entity1
    label: Wider span ±0.036m, kp
    notes: 'Widens the 12 mm sensor span to ±0.036 m at 0.012 m pitch with wheel_track
      0.10 m, and raises kp about 20 percent to offset the lower signal scale. Evidence:
      iterations 1 to 4 show the slalom fails at max_error 0.062 to 0.064 from sensor
      reach, and the oval is safe at 0.10 m track.


      ### Rationale


      Iterations 1 to 4 show the slalom failing at max_error 0.062 to 0.064 with line
      loss before exit (1.0 to 1.05 events) under every sensing and track variant.
      Iteration 3 showed lead 0.04 m hurts the oval and s-bend, so the lead stays
      at 0.06 m. Iteration 2 showed the 16 mm footprint gives no slalom gain. The
      Builder''s proposal widens the seven-sensor span to ±0.036 m at a 0.012 m pitch
      with 12 mm footprints, so the outer sensors reach about 0.054 m from centre.
      Because the span is wider, the signal scale falls from about 67/m to about 56/m.
      I therefore raise kp by about 20 percent, from 3.0 to 3.6, and scale kd in step,
      from 0.75 to 0.9. The weights stay linear at ±2 at the outer sensors, which
      keeps the same signal range. wheel_track stays at 0.10 m, which the iteration
      4 oval shows is safe at 1.82 s. ki stays 0, base_speed 1.6 and line_loss last_direction
      are unchanged, so the span and gain are the only changes under test. Expected:
      slalom line_loss_events fall clearly below 1.0 and max_error moves toward 0.055
      to 0.06. The main risk is s-bend steering_oscillation rising above about 0.35
      from the wider span and higher kp. No result is claimed for this package.


      - [Open this output](iteration-5/entity1/versions/02433f9ece5b4ba6a8a78d76bd6f91b9/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/0969c6dc6c6d44e1a2f9aa27a1a7cf86/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-059c5dde6ea421e1/payload.json)'
  - id: entityR1
    label: Span and lead feedback
    notes: 'Feedback written before the race: it cites iterations 1 to 4 as evidence
      that footprint and lead are ruled out, and gives next-race rules for slalom
      line loss and s-bend jitter. Requested changes are tied to the earlier span,
      lead and track results.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Evidence:
      in iteration 1, the ±0.03 m span with 12 mm footprints raised s-bend finishes
      from 5/20 to 16/20 and s-bend steering_oscillation from 0.25 to 0.34, but the
      slalom stayed at 0/20 with 1.05 line-loss events and max_error 0.064. In iteration
      2, the 16 mm footprint gave no slalom gain (0/20, max_error 0.0646) and cut
      s-bend finishes to 15/20. In iteration 3, lead 0.04 m dropped the oval to 14/20
      and the s-bend to 6/20. In iteration 4, wheel_track 0.10 m kept the oval at
      20/20 at 1.82 s, but the slalom still lost the line (1.0 events, max_error 0.0619).
      Footprint and lead are therefore ruled out as the slalom fix, and reach is the
      remaining suspect. Next-race rules: if slalom line_loss_events fall clearly
      below 1.0 and max_error drops toward 0.055 to 0.06, keep the span and try a
      finish-oriented step next. If slalom line loss is unchanged at about 1.0 with
      max_error still 0.06 or more, the span is not the limit, so return to ±0.03
      m and try the lead of 0.07 m. If s-bend steering_oscillation rises above about
      0.35 with no slalom gain, return to ±0.03 m with 0.01 m pitch.


      ### Requested changes


      - If slalom line_loss_events fall clearly below 1.0 and max_error drops toward
      0.055 to 0.06 with the ±0.036 m span, keep the span and report the slalom completion_time
      and max_error at exit, since that shows whether finishes are close.

      - If s-bend steering_oscillation rises above about 0.35 without a slalom gain
      (iteration 1 measured 0.34 at ±0.03 m), return the span to ±0.03 m at 0.01 m
      pitch and try lead 0.07 m, since lead 0.04 m was clearly worse in iteration
      3 and 0.07 m is untested.

      - If slalom line loss falls but no trial finishes, keep wheel_track 0.10 m and
      make no other geometry change, because the oval shows the drivetrain is safe
      at this track (iteration 4: 20/20 at 1.82 s).


      - [Open this output](iteration-5/entityR1/versions/02433f9ece5b4ba6a8a78d76bd6f91b9/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/0969c6dc6c6d44e1a2f9aa27a1a7cf86/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-059c5dde6ea421e1/payload.json)'
