overrides:
  entities:
  - id: entity0
    label: Lighter body, 0.45 kg
    notes: 'Keeps the best design so far (iteration 9, 741.9: 0.5 kg, 0.10 m track)
      and lowers mass to 0.45 kg to cut yaw inertia about 10 percent further. Evidence:
      iteration 9 raised slalom progress to 0.68 with 2 finishes, while s-bend jitter
      stayed at 0.295 and the oval held 20/20; fallback is 0.5 kg if jitter or score
      worsens.


      ### Rationale


      Iteration 9 (mass 0.5 kg, body_length 0.12 m, wheel_track 0.10 m, span ±0.036
      m at 0.012 m pitch, 12 mm footprints, lead 0.06 m) is the new best at 741.9,
      up from 707.2. The oval held 20/20 at 1.92 s and the s-bend held 20/20 with
      steering_oscillation 0.295, under the 0.35 jitter limit. The slalom moved again:
      mean progress rose from 0.53 to 0.68, line_loss_events fell from 1.3 to 1.15,
      and 2 of 20 trials finished (best 936.8). Max_error is still around the 0.06
      limit, so the slalom is close but not yet reliable. Iteration 8 showed that
      more turn authority (wheel_track 0.09 m) adds jitter without a slalom gain,
      so track stays at 0.10 m. Lower yaw inertia remains the only geometry lever
      that has moved the slalom in the right direction across three steps (0.7 to
      0.6 to 0.5 kg). Per the iteration 9 rule, the 0.5 kg design is kept as the new
      best. The next step is a modest continuation: mass 0.45 kg, about 10 percent
      less yaw inertia (0.45*(0.0144+0.0144)/12 ≈ 0.00108 kg·m² against 0.0012). Everything
      else is held fixed so the result isolates mass. Expected: slalom progress above
      0.68, line_loss_events toward 1.0, and more slalom finishes, while the oval
      stays 20/20 and the s-bend stays at 19/20 or better with steering_oscillation
      under 0.35. Fallback: if s-bend steering_oscillation exceeds 0.35, the oval
      loses trials, or the score falls below 741.9, return to mass 0.5 kg, which is
      the best measured design. Mass 0.4 kg is the lower bound and is not proposed
      yet, because the slalom overshoot risk grows as yaw inertia drops.


      - [Open this output](iteration-10/entity0/versions/2d99039a425141d08cf3ccd8ca469e4f/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-bdb63bbfa6bbe3e5/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-d61543750e0d60d9/payload.json)'
  - id: entity1
    label: Mass 0.45 kg test
    notes: 'Keeps the iteration 9 design (best 741.9) and changes only mass from 0.5
      to 0.45 kg, with the controller unchanged. Based on the slalom progress trend
      (0.30 to 0.53 to 0.68) and the s-bend jitter stable at 0.295.


      ### Rationale


      The Builder''s proposal keeps the iteration 9 design (mass 0.5 kg, body_length
      0.12 m, wheel_track 0.10 m, 7 sensors at +/-0.036 m, 0.012 m pitch, 12 mm footprints,
      lead 0.06 m) and changes only mass to 0.45 kg. Iteration 9 is the best measured
      design (741.9). Its oval held 20/20 at 1.92 s, its s-bend held 20/20 with steering_oscillation
      0.295, and its slalom reached progress 0.68 with 2/20 finishes and line_loss_events
      1.15. Across iterations 7 to 9, lower yaw inertia was the only change that raised
      slalom progress. Iteration 8 showed that narrowing wheel_track to 0.09 m adds
      s-bend jitter (0.342) and cuts slalom progress, so the track stays at 0.10 m.
      The controller that raced in iteration 9 (kp 3.6, kd 0.9, ki 0, base_speed 1.6,
      last_direction, linear weights -2 to +2) is kept unchanged, so the mass change
      is the only variable under test. Expected: slalom progress above 0.68 with line_loss_events
      trending toward 1.0, the oval at 20/20, and the s-bend at 19/20 or better with
      steering_oscillation under 0.35. Fallback: if s-bend steering_oscillation exceeds
      0.35, the oval loses trials, or the score falls below 741.9, return to mass
      0.5 kg. The measurements cover slalom and s-bend jitter, completion time and
      line loss so the next iteration can judge the result.


      - [Open this output](iteration-10/entity1/versions/88fe98edfb32443d9e520b21468c6aaa/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/2d99039a425141d08cf3ccd8ca469e4f/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-d61543750e0d60d9/payload.json)'
  - id: entityR1
    label: 'Feedback: mass 0.45 next'
    notes: 'Pre-race feedback: continue the yaw-inertia reduction if slalom progress
      rises and s-bend jitter stays under 0.35, otherwise fall back to 0.5 kg. Track
      0.10 m stays fixed because iteration 8 showed that narrowing it adds jitter
      without a slalom gain.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Evidence:
      iteration 7 (mass 0.6 kg, wheel_track 0.10 m) scored 707.2, with slalom progress
      0.53 and line_loss_events 1.3. Iteration 8 (wheel_track 0.09 m) scored 683.7:
      s-bend steering_oscillation rose to 0.342 and an s-bend trial was lost, while
      slalom progress fell to 0.42. Iteration 9 (mass 0.5 kg, wheel_track 0.10 m)
      scored 741.9, the best so far, with slalom progress 0.68, line_loss_events 1.15
      and 2/20 finishes, and the s-bend held 20/20 with steering_oscillation 0.295.
      Lower yaw inertia has been the only geometry lever that moves the slalom in
      the right direction, so continuing the mass reduction is the test. Next-race
      rules: if slalom progress rises above 0.68 and line_loss_events fall toward
      1.0 while the s-bend stays at 19/20 or better with steering_oscillation under
      0.35, keep the mass change and report slalom completion_time and finish count.
      If s-bend steering_oscillation exceeds 0.35, the oval loses trials, or the score
      falls below 741.9, return to mass 0.5 kg, the best measured design. If slalom
      progress rises but line_loss_events stay at about 1.15 or more, do not reduce
      mass further; report the heading and speed at first line loss so the controller
      entry speed can be the next lever.


      ### Requested changes


      - Keep mass at 0.45 kg with body_length 0.12 m and wheel_track 0.10 m if slalom
      progress rises above 0.68 and s-bend steering_oscillation stays under 0.35 (iteration
      9 measured 0.295). Report slalom finish count and completion_time.

      - If s-bend steering_oscillation exceeds 0.35 or the score falls below 741.9
      (iteration 9), return mass to 0.5 kg with body_length 0.12 m and wheel_track
      0.10 m. Iteration 8 showed that narrowing the track to 0.09 m adds jitter, so
      do not change the track.

      - If slalom line_loss_events stay near 1.15 or higher while progress rises,
      do not reduce mass or track further. Report the heading and speed at first line
      loss so the next step can target the controller''s entry speed.


      - [Open this output](iteration-10/entityR1/versions/88fe98edfb32443d9e520b21468c6aaa/payload.json)

