map:
  id: race-169-randow-maps
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Lighter 0.5 kg, track
    notes: 'Reverts wheel_track to the best-measured 0.10 m, after 0.09 m (683.7)
      cut s-bend finishes and slalom progress, and cuts mass to 0.5 kg to test further
      lower yaw inertia on the slalom. Fallback to the iteration 7 design (707.2)
      if the score drops or s-bend oscillation exceeds 0.35.


      ### Rationale


      Iteration 8 narrowed wheel_track from 0.10 to 0.09 m and scored 683.7, below
      the iteration 7 best of 707.2. The oval held 20/20 at 1.76 s, so the track change
      did not break the oval. The s-bend lost a finish (19/20, one off-track at min
      391.8) and its steering_oscillation rose from 0.311 to 0.342, close to the 0.35
      limit. The slalom improved only slightly: line_loss_events fell from 1.3 to
      1.2, but mean progress fell from 0.53 to 0.42 and max_error stayed at 0.0655,
      past the 0.06 limit. More turn authority from the narrower track therefore added
      s-bend jitter and cost slalom progress without fixing the slalom exit. The next
      step is to return wheel_track to 0.10 m, the best-measured value. The slalom
      still needs a change that it has not yet received. Lower yaw inertia (iteration
      7) was the only change that moved slalom progress (0.30 to 0.53). I therefore
      test one more step in that direction: mass 0.5 kg with body_length 0.12 m, about
      17 percent lower yaw inertia (0.5*(0.0144+0.0144)/12 = 0.0012 kg·m² against
      0.00144). Sensing (7 sensors at 0.012 m pitch, span ±0.036 m, 12 mm footprints,
      lead 0.06 m), wheel_radius 0.03 m and body_width 0.12 m stay as in iteration
      7. Expected result: slalom progress keeps rising above 0.53 and line_loss_events
      move toward 1.0, while the oval stays 20/20 and the s-bend stays at or above
      19/20 with steering_oscillation under 0.35. Risk: a lighter, faster-turning
      robot may overshoot at direction changes, as iteration 7 already hinted (line
      loss rose to 1.3). If that happens or the s-bend oscillation exceeds 0.35, the
      fallback is the iteration 7 design (mass 0.6 kg, track 0.10 m).


      - [Open this output](iteration-9/entity0/versions/07fa88507c2d4f41b707c5d3d3014c25/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-ca37d8fb60be5bae/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-eb7c6859e0f71b43/payload.json)'
  - id: entity1
    label: Mass 0.5 kg, track 0.10 m
    notes: 'Iteration 7 design with mass cut from 0.6 to 0.5 kg and wheel_track restored
      to 0.10 m, controller unchanged. Builds on iteration 7 (707.2) and iteration
      8, which showed narrowing the track to 0.09 m adds s-bend jitter without fixing
      the slalom.


      ### Rationale


      Evidence: iteration 7 (mass 0.6 kg, body 0.12 m, wheel_track 0.10 m, kp 3.6,
      kd 0.9) is the best design at 707.2. Its oval finished 20/20 at 1.79 s, its
      s-bend 20/20 with steering_oscillation 0.311, and its slalom 0/20 with progress
      up to 0.53 and line_loss_events 1.3. Iteration 8 (wheel_track 0.09 m) lost an
      s-bend finish and pushed jitter to 0.342, while slalom progress fell to 0.42.
      Narrowing the track is therefore ruled out, and the design returns to wheel_track
      0.10 m. Lower yaw inertia is the only lever that has moved slalom progress,
      so this step tests a further reduction by setting mass to 0.5 kg with body_length
      0.12 m (about 17 percent lower yaw inertia). Sensing (seven 12 mm sensors at
      0.012 m pitch, span plus or minus 0.036 m, lead 0.06 m), wheel_radius 0.03 m
      and body_width 0.12 m are unchanged. The controller is kept exactly as in iteration
      7 (kp 3.6, kd 0.9, ki 0, weights -2 to +2, base_speed 1.6, last_direction),
      so the race isolates mass. Mass 0.5 is inside the 0.4 to 1.5 kg range. Expected
      result: slalom progress above 0.53 with line_loss_events moving toward 1.0,
      the oval at 20/20, and the s-bend at 19/20 or better with steering_oscillation
      under 0.35. Risk: the faster-turning robot overshoots at direction changes.
      If the s-bend oscillation exceeds 0.35 or the score falls below 707, the fallback
      is the iteration 7 design (mass 0.6 kg, wheel_track 0.10 m).


      - [Open this output](iteration-9/entity1/versions/14144eb7bc404d71b89a66ca7bbceda4/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/07fa88507c2d4f41b707c5d3d3014c25/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-eb7c6859e0f71b43/payload.json)'
  - id: entityR1
    label: Mass 0.5 kg next-step
    notes: 'Gives conditional rules for the next race: keep mass 0.5 kg if slalom
      progress rises and s-bend jitter stays under 0.35, fall back to 0.6 kg otherwise,
      and look at controller entry speed if line loss stays near 1.3. Evidence is
      iterations 7 and 8.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Evidence:
      iteration 7 (mass 0.6 kg, body_length 0.12 m, wheel_track 0.10 m) scored 707.2,
      the best so far. Its oval was 20/20 at 1.79 s and its s-bend 20/20 with steering_oscillation
      0.311. Its slalom was 0/20, with progress up from 0.30 to 0.53 and line_loss_events
      1.3. Iteration 8 (wheel_track 0.09 m) showed that more turn authority cost s-bend
      finishes (19/20) and raised jitter to 0.342, while slalom progress fell to 0.42,
      so the track should stay at 0.10 m. Lowering yaw inertia (mass 0.5 kg) is the
      lever still moving the slalom. Next-race rules: if slalom progress rises above
      0.53 and line_loss_events fall toward 1.0 while the s-bend stays at 19/20 or
      better with steering_oscillation under 0.35, keep mass 0.5 kg and consider it
      the new best geometry. If slalom progress rises but line_loss_events stay at
      about 1.3 or more, do not reduce mass or track further; report the heading at
      first line loss so the next step can change controller entry speed instead of
      geometry. If the s-bend steering_oscillation exceeds 0.35 or the score falls
      below 707, return to mass 0.6 kg with wheel_track 0.10 m.


      ### Requested changes


      - If slalom progress rises above 0.53 and s-bend steering_oscillation stays
      under 0.35, keep mass 0.5 kg with body_length 0.12 m and wheel_track 0.10 m,
      and report the slalom completion_time if any trial finishes.

      - If s-bend steering_oscillation exceeds 0.35 or the oval loses any trials,
      return mass to 0.6 kg with body_length 0.12 m and wheel_track 0.10 m (the iteration
      7 design, score 707.2).

      - If slalom line_loss_events stay at about 1.3 with progress above 0.53, keep
      wheel_track 0.10 m and do not reduce mass or track further, because iteration
      8 shows that more turn authority adds jitter without a slalom gain; report the
      heading at first line loss.


      - [Open this output](iteration-9/entityR1/versions/14144eb7bc404d71b89a66ca7bbceda4/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/07fa88507c2d4f41b707c5d3d3014c25/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-eb7c6859e0f71b43/payload.json)'
