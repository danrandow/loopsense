map:
  id: race-169-randow-maps
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Lower yaw inertia test
    notes: 'Returns lead to 0.06 m, since 0.07 m left slalom line loss at 1.0 and
      max_error at 0.065. Cuts mass to 0.6 kg and body_length to 0.12 m, reducing
      yaw inertia about 40 percent, to test whether faster turning clears the slalom.


      ### Rationale


      Iteration 6 raced the 0.07 m sensor lead. The slalom stayed at 0/20 with line_loss_events
      1.0 and max_error 0.065, which is worse than the 0.0644 seen at lead 0.06. The
      oval held 20/20 at 1.81 s and the s-bend held 17/20 with steering_oscillation
      0.333, under the 0.35 limit, so the longer lead did not cause jitter problems
      but gave no slalom gain. The Integrator''s pre-written rule applies: slalom
      line loss is unchanged at about 1.0 with max_error at or above 0.06, so lead
      is not the limit. I therefore return the lead to y = 0.06 m, the best-measured
      value (iteration 5, score 653.3). Across six variants the slalom has failed
      at max_error 0.062 to 0.065 whatever the span, footprint, lead or track, so
      the remaining untested geometry is the robot''s yaw response. Yaw inertia is
      mass * (body_length^2 + body_width^2) / 12. The current value is 0.7 * (0.0256
      + 0.0144) / 12, about 0.00233 kg·m^2. I reduce mass to 0.6 kg and body_length
      to 0.12 m, giving 0.6 * (0.0144 + 0.0144) / 12, about 0.00144 kg·m^2, roughly
      40 percent lower. A lower yaw inertia should let the robot change heading faster
      at the slalom''s direction changes, which is where it leaves the line. I keep
      the iteration 5 span (±0.036 m, 7 sensors, 12 mm footprints, 0.012 m pitch),
      wheel_track 0.10 m and wheel_radius 0.03 m, so the only change is yaw inertia.
      body_width stays at 0.12 m, so the off-track limit is unchanged. Expected result:
      slalom line_loss_events fall below 1.0 and max_error drops toward 0.06, with
      the first slalom finishes possible. Risk: faster yaw response may add steering_oscillation
      on the s-bend, so that must be reported.


      - [Open this output](iteration-7/entity0/versions/21d102968a9d482d9cd5e55bb99c3771/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-59064186c5e8f624/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-d5bf67cd8907a2f8/payload.json)'
  - id: entity1
    label: Lead 0.07 m integration
    notes: 'Iteration 5 geometry with sensor lead moved to y=0.07 m; weights, kp 3.6,
      kd 0.9 unchanged so the lead is the only variable. Based on the 653.3 best score
      and five failed slalom variants at max_error 0.062 to 0.064.


      ### Rationale


      Iteration 5 is the best design so far (653.3). Its oval finished 20/20 at 1.85
      s and its s-bend finished 18/20 with steering_oscillation 0.335, under the 0.35
      limit. The slalom is still 0/20, with 1.0 line-loss events and max_error 0.0644.
      Across five variants (span, footprint, lead 0.04 m, wheel_track), the slalom
      has stayed at max_error 0.062 to 0.064. The Builder''s intent changes only the
      sensor lead, from 0.06 m to 0.07 m, to test whether a longer look-ahead helps
      the slalom. I keep the iteration 5 geometry and controller exactly as the Builder
      specified: kp 3.6, kd 0.9, ki 0, weights -2 to +2 linear, base_speed 1.6, last_direction.
      Changing only the lead keeps the race a clean test of lead. The observation
      request covers max_error and line_loss_events for the slalom exit, and steering_oscillation
      on all tracks, because a longer lead may add s-bend jitter. Expected: slalom
      line_loss_events fall below 1.0 or max_error drops below 0.06, and the oval
      stays 20/20. No outcome is claimed for this package.


      - [Open this output](iteration-6/entity1/versions/f6f09983c2d841e6a9370012ee5654fa/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/bc52968170e54d659b866c363f3fc90e/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-be60fabe7663eb2e/payload.json)'
  - id: entityR1
    label: Lead test feedback
    notes: 'Pre-race feedback: keep lead 0.07 m only if slalom line loss falls or
      max_error drops; otherwise return to 0.06 m and test lower yaw inertia. Based
      on iterations 3 and 5, where lead 0.04 m was worse and the slalom was stuck
      near max_error 0.064.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Evidence:
      iteration 5 (±0.036 m span, 12 mm footprints, lead 0.06 m, wheel_track 0.10
      m, kp 3.6, kd 0.9) scored 653.3, the best so far. Its oval was 20/20 at 1.85
      s and its s-bend 18/20 with steering_oscillation 0.335. Its slalom was 0/20
      with 1.0 line-loss events and max_error 0.0644. Iteration 3 showed that lead
      0.04 m hurt the oval (14/20) and the s-bend (6/20), so shortening the lead is
      ruled out. The 0.07 m lead is a single test of a longer look-ahead. Next-race
      rules: if slalom line_loss_events fall below 1.0 or max_error drops below 0.06,
      keep the lead at 0.07 m and try to tune for finishes, reporting slalom completion_time.
      If slalom line loss is unchanged at about 1.0 with max_error at 0.06 or more,
      lead is not the limit, so return the lead to 0.06 m and test the yaw response.
      If s-bend steering_oscillation rises above about 0.35 with no slalom gain, return
      the lead to 0.06 m, since jitter cost outweighs the benefit.


      ### Requested changes


      - Keep the lead at y = 0.07 m only if slalom line_loss_events fall below 1.0
      or max_error drops below 0.06. If it does not, return to y = 0.06 m (iteration
      5 values), since lead 0.04 m was worse on every track.

      - If the slalom is unchanged at about 1.0 line-loss events with max_error at
      or above 0.06 at lead 0.07 m, return to y = 0.06 m and test yaw inertia: mass
      0.6 kg with body_length 0.12 m, keeping the iteration 5 span and drivetrain.
      Evidence: the slalom has failed at max_error 0.062 to 0.064 across five variants.

      - If s-bend steering_oscillation rises above 0.35 at lead 0.07 m (iteration
      5 measured 0.335 at 0.06 m), return the lead to 0.06 m. Keep wheel_track at
      0.10 m, since the iteration 4 and 5 oval results (20/20 at about 1.82 to 1.85
      s) show the drivetrain is safe at that track.


      - [Open this output](iteration-6/entityR1/versions/f6f09983c2d841e6a9370012ee5654fa/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/bc52968170e54d659b866c363f3fc90e/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-be60fabe7663eb2e/payload.json)'
