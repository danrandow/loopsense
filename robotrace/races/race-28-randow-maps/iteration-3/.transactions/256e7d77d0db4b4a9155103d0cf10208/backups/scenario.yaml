overrides:
  entities:
  - id: entity0
    label: Rear sensors back, wider
    notes: 'Moved rear sensors further back to y=-0.03 and increased wheel track to
      0.18 to improve early turn detection and lateral stability, addressing persistent
      line loss and off-track failures seen in prior races.


      ### Rationale


      The previous iteration moved rear sensors to y = -0.02 and increased wheel track
      to 0.17, which improved stability and early turn detection but the robot still
      failed to complete tracks with one line loss event per run and off-track termination
      around 60% progress. The integrator feedback recommended further increasing
      wheel track to 0.18 and moving rear sensors further back to y = -0.03 to detect
      turns earlier. Moving sensors further back should allow the controller to anticipate
      turns sooner, reducing line loss events. Increasing wheel track enhances lateral
      stability, helping maintain control during turns and reducing off-track failures.
      Sensor size remains at 0.016 to keep noise robustness high. I expect these geometry
      changes to reduce line loss events, improve progress and completion rates, and
      provide a more stable and responsive platform for the controller to exploit.


      - [Open this output](iteration-3/entity0/versions/ec921bd2ad7040a8a5a850aa7cdb4bae/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-ed1a2a91c58a4eb1/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-b72c9d0ef79b7bc2/payload.json)'
  - id: entity1
    label: Tuned controller for new
    notes: 'Adjusted PID gains and sensor weights to exploit geometry changes (rear
      sensors moved back, wheel track increased). Added more measurements to monitor
      control effort and steering oscillation. Aims to reduce line loss and off-track
      events seen in last race.


      ### Rationale


      The race data shows the robot still fails to complete the tracks, with one line
      loss event per run and off-track termination around 60% progress. The rear sensors
      moved further back (y from -0.01 to -0.02) and the wheel track increased from
      0.16 to 0.17 as requested, aiming to improve early turn detection and lateral
      stability. However, the controller still experiences line loss and off-track
      failures, indicating the controller parameters need tuning to exploit the geometry
      changes. I increased the base_speed slightly from 0.14 to 0.145 to improve progress,
      and adjusted the PID gains to kp=0.20, ki=0.025, kd=0.04 to provide stronger
      and more responsive control, helping reduce line loss and off-track events.
      Sensor weights are slightly adjusted to emphasize the central and rear sensors
      more, aiding in earlier detection of line deviations. The line_loss strategy
      remains ''search_left'' as it suits the sensor layout. The observation request
      is extended to include all previously requested measurements plus steering_oscillation
      and control_effort to better monitor controller behavior and stability in future
      races. These changes aim to improve line following robustness, reduce line loss
      events, and increase completion and progress metrics on both tracks.


      - [Open this output](iteration-2/entity1/versions/796b0fc4aa584ba48f2879b212106e3f/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/28ef7e5b3a5d49d088b0a194bf091776/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-0c8f88657e77f1a7/payload.json)'
  - id: entityR1
    label: Feedback on geometry and
    notes: 'Geometry helped with earlier turn detection and stability but controller
      still struggles with line loss and off-track failures. Requested increasing
      wheel track and moving rear sensors further back to improve early line detection
      and stability.


      ### Feedback


      The geometry changes helped by moving the rear sensors further back (y from
      -0.01 to -0.02) and increasing the wheel track from 0.16 to 0.17, which should
      enable earlier detection of sharp turns and improve lateral stability. However,
      the race data shows the robot still fails to complete the tracks with one line
      loss event per run and off-track termination around 60% progress, indicating
      the controller has not fully exploited these geometry improvements yet. The
      controller had to compensate for the still challenging line loss events and
      off-track failures, suggesting the need for stronger and more responsive control
      parameters. Requested changes: 1) Increase wheel_track further to 0.18 to enhance
      stability during turns. 2) Move rear sensors even further back to y = -0.03
      to detect turns earlier. 3) Consider slightly increasing sensor_size to 0.016
      (already at max) or adjusting sensor x-positions to better cover the rear area
      for earlier line detection. These changes aim to provide the controller with
      better early line information and a more stable platform, reducing line loss
      events and improving completion and progress.


      ### Requested changes


      - geometry.wheel_track=0.18

      - geometry.sensor_positions[5].y=-0.03

      - geometry.sensor_positions[6].y=-0.03


      - [Open this output](iteration-2/entityR1/versions/796b0fc4aa584ba48f2879b212106e3f/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/28ef7e5b3a5d49d088b0a194bf091776/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-0c8f88657e77f1a7/payload.json)'
