overrides:
  entities:
  - id: entity0
    label: Rear sensors back, wider
    notes: 'Moved rear sensors further back to y=-0.03 and increased wheel track to
      0.18 to improve early turn detection and lateral stability, addressing persistent
      line loss and off-track failures seen in prior races.


      ### Rationale


      The previous iteration moved rear sensors to y = -0.02 and increased wheel track
      to 0.17, which improved stability and early turn detection but the robot still
      failed to complete tracks with one line loss event per run and off-track termination
      around 60% progress. The integrator feedback recommended further increasing
      wheel track to 0.18 and moving rear sensors further back to y = -0.03 to detect
      turns earlier. Moving sensors further back should allow the controller to anticipate
      turns sooner, reducing line loss events. Increasing wheel track enhances lateral
      stability, helping maintain control during turns and reducing off-track failures.
      Sensor size remains at 0.016 to keep noise robustness high. I expect these geometry
      changes to reduce line loss events, improve progress and completion rates, and
      provide a more stable and responsive platform for the controller to exploit.


      - [Open this output](iteration-3/entity0/versions/ec921bd2ad7040a8a5a850aa7cdb4bae/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-ed1a2a91c58a4eb1/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-b72c9d0ef79b7bc2/payload.json)'
  - id: entity1
    label: Controller tuned for
    notes: 'Controller gains increased to improve responsiveness and damping for the
      wider 0.18 wheel track and rear sensors moved to y=-0.03. Base speed slightly
      increased to improve progress. Observation request expanded to monitor steering
      oscillation and control effort.


      ### Rationale


      The telemetry from the last iteration shows the robot still fails to complete
      the tracks, with one line loss event per run and off-track termination around
      10% progress. The increased wheel track to 0.18 and moving the rear sensors
      further back to y = -0.03 have not yet eliminated early line loss or off-track
      failures, though the maximum error and RMS error remain low, indicating good
      control when on track. The controller must compensate for the wider wheel track
      by slightly increasing steering gains to maintain responsiveness. I increased
      base_speed slightly to 0.15 to improve progress without risking stability. I
      increased kp to 0.22 and kd to 0.045 to enhance steering responsiveness and
      damping, helping the robot react more quickly to line deviations detected earlier
      by the rear sensors. I kept ki at 0.025 to maintain integral correction without
      causing oscillations. Sensor weights are adjusted to slightly reduce negative
      weights on rear sensors to -0.2 from -0.25, to balance their influence and avoid
      oversteering from early turn detection. The line_loss strategy remains ''search_left''
      as it suits the track and controller behavior. Observation request includes
      all previously requested measurements plus ''steering_oscillation'' and ''control_effort''
      to monitor controller stability and effort in future races. These changes aim
      to leverage the improved geometry for earlier turn detection and better lateral
      stability, improving completion rates and reducing line loss events.


      - [Open this output](iteration-3/entity1/versions/256e7d77d0db4b4a9155103d0cf10208/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/ec921bd2ad7040a8a5a850aa7cdb4bae/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-b72c9d0ef79b7bc2/payload.json)'
  - id: entityR1
    label: Feedback on geometry
    notes: 'Geometry changes helped early turn detection and stability but robot still
      fails early. Controller needed higher gains to compensate. Requested to move
      rear sensors further back to y=-0.035 to improve early detection and keep wheel
      track at 0.18.


      ### Feedback


      The increased wheel track to 0.18 and moving the rear sensors further back to
      y = -0.03 helped the controller by providing earlier line detection and improved
      lateral stability, as intended. However, the robot still fails early with one
      line loss event per run and off-track termination around 10% progress, indicating
      the controller needs to respond more aggressively to early line deviations.
      The controller had to compensate for the wider wheel track by increasing steering
      gains to maintain responsiveness. The rear sensors'' influence was slightly
      reduced in weight to avoid oversteering from early detection. To improve further,
      the geometry should continue to support early turn detection and stability but
      allow the controller to maintain better control at higher speeds.


      ### Requested changes


      - wheel_track: 0.18 (keep current for stability)

      - sensor_positions: move rear sensors slightly further back to y = -0.035 to
      detect turns even earlier

      - sensor_size: keep at 0.016 for noise robustness


      - [Open this output](iteration-3/entityR1/versions/256e7d77d0db4b4a9155103d0cf10208/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/ec921bd2ad7040a8a5a850aa7cdb4bae/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-b72c9d0ef79b7bc2/payload.json)'
