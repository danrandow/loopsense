overrides:
  entities:
  - id: entity0
    label: Rear sensors back, wider
    notes: 'Moved rear sensors further back (y from -0.01 to -0.02) and increased
      wheel track from 0.16 to 0.17 as requested by integrator feedback to improve
      early turn detection and stability. Kept sensor size at 0.016 for noise robustness.
      These changes aim to reduce line loss events and off-track terminations, improving
      completion and progress.


      ### Rationale


      The race data shows the robot still fails to complete tracks with one line loss
      event per run, indicating the controller has not fully exploited the geometry
      improvements yet. The integrator requested moving rear sensors further back
      (y from -0.01 to -0.02) to detect turns earlier and increasing wheel track from
      0.16 to 0.17 for better stability. Moving rear sensors back should provide earlier
      line detection on sharp turns, allowing the controller to react sooner and reduce
      line loss. Increasing wheel track should improve stability during turns, helping
      maintain control and reduce off-track events. Sensor size remains at 0.016 to
      maintain noise robustness. I expect these changes to improve line following
      performance, reduce line loss events, and increase completion and progress metrics.
      I request measurements of completion, progress, completion_time, rms_error,
      and line_loss_events to verify these hypotheses in the next race.


      - [Open this output](iteration-2/entity0/versions/28ef7e5b3a5d49d088b0a194bf091776/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-1f20ebb34302aeba/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-0c8f88657e77f1a7/payload.json)'
  - id: entity1
    label: Tuned controller for new
    notes: 'Integrated new sensors behind front line and larger sensor size; tuned
      controller gains and sensor weights to improve early turn detection and stability.
      Added observation of steering oscillation and control effort for better monitoring.


      ### Rationale


      The geometry changes added two sensors behind the front line (y negative) to
      improve early detection of sharp turns, increased sensor size to 0.016 for noise
      robustness, and increased wheel track to 0.16 for stability. The race data shows
      the robot still fails to complete the tracks, terminating off track with 1 line
      loss event each run, but rms error improved slightly (from ~0.0226 to ~0.0208
      average) and progress increased (from ~0.0887 to ~0.095 average). The controller
      needs tuning to leverage the new sensor layout and larger sensor size. I increased
      base_speed to 0.14 to exploit improved stability and early sensing, increased
      kp to 0.18 for stronger proportional correction, slightly increased kd to 0.035
      to damp oscillations, and kept ki at 0.02 to avoid integral windup. Sensor weights
      are adjusted to emphasize the new rear sensors with moderate negative weights
      to balance the line position signal. Line loss strategy remains ''search_left''
      as it is effective. Observation request includes all previously requested measurements
      plus steering_oscillation and control_effort to monitor controller behavior
      and effort for further tuning.


      - [Open this output](iteration-1/entity1/versions/2a3369730733443398be5c676381ef18/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/66a3732ea58a44a5b62ccd1268b0d0bb/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-d03775410b096e0b/payload.json)'
  - id: entityR1
    label: Feedback on geometry
    notes: 'Geometry helped early turn detection and stability but robot still fails
      to complete. Requested moving rear sensors further back and increasing wheel
      track for better performance.


      ### Feedback


      The geometry changes helped by adding rear sensors behind the front line, which
      should allow earlier detection of sharp turns, and increasing sensor size to
      improve noise robustness. The wider wheel track likely improved stability. However,
      the race data shows the robot still fails to complete the tracks, with off-track
      terminations and one line loss event per run, indicating the controller has
      not fully exploited these geometry improvements yet. The rms error and progress
      improved slightly, showing some benefit. The controller had to compensate for
      the larger sensor size and new sensor positions by adjusting sensor weights
      and gains. To improve further, I request the following specific geometry changes:
      1) Increase sensor_size to 0.016 is already done, so keep it. 2) Try moving
      the rear sensors slightly further back (y from -0.01 to -0.02) to detect turns
      even earlier. 3) Increase wheel_track slightly to 0.17 to further enhance stability
      during turns. These changes should help the controller reduce line loss events
      and improve completion rates.


      ### Requested changes


      - sensor_positions: move rear sensors y from -0.01 to -0.02 for earlier turn
      detection

      - wheel_track: increase from 0.16 to 0.17 for better stability


      - [Open this output](iteration-1/entityR1/versions/2a3369730733443398be5c676381ef18/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/66a3732ea58a44a5b62ccd1268b0d0bb/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-d03775410b096e0b/payload.json)'
