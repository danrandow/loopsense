  id: race-220-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Wider spread ±0.04 m
    notes: 'Widened the outer sensors from ±0.03 m to ±0.04 m, keeping 16 mm footprints
      and the lead at y = 0.05. Race 2 showed line loss still at about 1.1 per run
      on s-bend and slalom, with max_error at the 0.06 m limit, so the outer sensors
      are likely losing reach during drift. This deviates from the Integrator''s suggested
      narrower spread.


      ### Rationale


      Race 2 (16 mm footprints, ±0.03 m spread, y = 0.05) scored 356.98, up from 302.73.
      Oval now finishes 15 of 20 trials with max_error 0.048 and line_loss 0.6, so
      the footprint helped there. On s-bend and slalom, all 40 trials still end off_track,
      with line_loss 1.15 and 1.10 and max_error at the 0.06 m limit (0.063 and 0.062).
      The Integrator''s rule says that if line loss stays at 1 or more with max_error
      at the limit, the footprint is not the cause, and the next step is a different
      spread. I am not following the suggested narrower spread (±0.025). Geometrically,
      a sensor at lateral position x_s sees the tape only while |x_s − e| < about
      0.02 (12.5 mm half-tape plus 8 mm half-footprint), where e is the robot''s offset
      from the line. At e = 0.06 m, the outer sensors at ±0.03 m are already out of
      reach, so all five read background and the line is lost. Narrowing the spread
      would shrink that reach further, so it works against the failure the data shows.
      The race 1 to race 2 step confirms the direction: widening from ±0.02 to ±0.03
      fixed oval. I am therefore testing a wider outer spread of ±0.04 m with 16 mm
      footprints, keeping five sensors and y = 0.05. The outer sensors then reach
      e ≈ 0.06 m, the limit where line loss occurs. The lead stays at y = 0.05 because
      line loss is still the main failure, as the Integrator advised. I expect line_loss_events
      on s-bend and slalom to fall below 1 and max_error to drop below 0.06. The Integrator
      will need to rescale sensor_weights and kp for the wider spread, since the signal
      per metre of offset falls. Oval steering_oscillation (0.31) is still above the
      0.2 threshold, so a forward lead move to y = 0.06 to 0.065 remains the next
      step if oscillation persists after this geometry is settled.


      - [Open this output](iteration-3/entity0/versions/fe50e9c835174e32b0c886faa4298d89/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-dbbf94d11f83517b/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-8aade6d877e4ef2d/payload.json)'
  - id: entity1
    label: Wider ±0.04 m spread, kp
    notes: 'Integrator package for the Builder''s ±0.04 m, 16 mm sensor geometry,
      with kp raised to 2.8 to offset the lower signal slope per metre. Based on race
      2 showing s-bend and slalom still losing the line at about 1.1 events per run.


      ### Rationale


      Race 2 (16 mm footprints, ±0.03 m spread, y=0.05, kp 2.4, kd 0.45, base 1.1)
      scored 356.98. Oval improved to 15/20 finishes with max_error 0.048, but s-bend
      and slalom still end 40/40 off_track with line_loss about 1.1 and max_error
      at the 0.06 m limit. Under the rule we agreed, line loss at or above 1 with
      max_error at the limit means reach is still the bottleneck, so I accept the
      Builder''s ±0.04 m spread with 16 mm footprints, y=0.05 and five sensors. Reach
      model: a sensor at lateral x sees tape while |x − e| < about 0.02 m, so outer
      sensors at ±0.04 m reach e ≈ 0.06 m, the drift at which race 2 lost the line.
      Gain: with the same weights [-2,-1,0,1,2], the signal slope per metre of offset
      falls from about 67/m (±0.03 spread) to 50/m (±0.04 spread). kp 2.4 × 67 ≈ 160
      per metre, so I raise kp to 2.8 (2.8 × 50 = 140/m). That is slightly less steering
      per metre than race 2, because the wider footprint pair already supplies earlier
      signal. kd stays at 0.5 to damp the oval oscillation (0.31 in race 2). base_speed
      drops to 1.05 to give more recovery time on the tight tracks, since s-bend and
      slalom have never finished. ki stays at 0 and line_loss stays last_direction.
      Expected result, not yet measured: line_loss on s-bend and slalom below 1, max_error
      below 0.06, and oval finish rate at or above 0.7. If line loss stays at 1 or
      more, the next race should test gain or speed, not geometry.


      - [Open this output](iteration-3/entity1/versions/b3705f2b265649a1adc5386206e05f48/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/fe50e9c835174e32b0c886faa4298d89/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-8aade6d877e4ef2d/payload.json)'
  - id: entityR1
    label: Test spread ±0.04 m, hold
    notes: 'Feedback asks the Builder to keep ±0.04 m with 16 mm footprints and hold
      the lead. It gives a decision rule for race 3 and says not to narrow the spread,
      since race 1 and race 2 showed reach was the missing factor.


      ### Feedback


      Written before this candidate races. Race 2 (score 356.98, entityR2B) showed
      that 16 mm footprints fixed oval (15/20 finishes, max_error 0.048) but not s-bend
      or slalom, which still end 40/40 off_track with line_loss about 1.1 and max_error
      at the 0.06 m limit. That pattern means the outer sensors are still not reaching
      the line during drift. Race 1 (entityR2A, 302.7) showed that widening from ±0.02
      to ±0.03 m improved oval finishes from 0 to 12/20, so reach is the mechanism.
      Your ±0.04 m spread extends that reach to about e ≈ 0.06 m, the same drift at
      which race 2 lost the line, so it is the right test. The controller raises kp
      to 2.8 so that steering per metre stays close to race 2 despite the lower signal
      slope. Once race 3 reports, decide as follows. If s-bend and slalom line_loss
      falls below 1 and max_error drops below 0.06, keep ±0.04 m and 16 mm. If line
      loss stays at 1 or more with max_error at the limit, the spread is no longer
      the limiter, so hold the geometry. If oval steering_oscillation stays above
      0.2 with the new gain, move the sensors forward, as the 0.2 threshold requires.


      ### Requested changes


      - Keep the ±0.04 m spread (x = -0.04, -0.02, 0, 0.02, 0.04) with 16 mm footprints
      and y = 0.05 for the next race, so this change is tested alone against the race
      2 baseline.

      - If s-bend and slalom line_loss stays at 1 or more with max_error at 0.06 after
      race 3, hold the geometry and let the Integrator tune kp and base_speed. Do
      not try a narrower spread: race 2 already showed that narrowing removes the
      reach the line-loss evidence says is missing.

      - If oval steering_oscillation stays above 0.2 after race 3, move the sensors
      forward to y = 0.06 to 0.065 with the spread and footprint unchanged, so the
      lead is the only geometry change in that race.


      - [Open this output](iteration-3/entityR1/versions/b3705f2b265649a1adc5386206e05f48/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/fe50e9c835174e32b0c886faa4298d89/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-8aade6d877e4ef2d/payload.json)'
