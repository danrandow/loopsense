  id: race-220-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Hold race-4 geometry
    notes: 'Kept the best-scoring geometry (score 578.99): ±0.03 m, 16 mm footprints,
      lead y = 0.06, with the controller left for the Integrator to tune. Race 4 showed
      oval 20/20 and s-bend 13/20, while slalom still loses the line at max_error
      at the limit, so holding geometry follows the agreed rule.


      ### Rationale


      Race 4 (entityR2A, score 578.99) is the best result so far. It kept the race
      2 geometry (±0.03 m spread, 16 mm footprints, wheels, body and mass unchanged)
      and moved the sensor lead from y = 0.05 to y = 0.06. Oval now finishes 20 of
      20 (mean progress 0.997, max_error 0.030, line loss 0.5), up from 15 of 20 in
      race 2. Oval steering_oscillation fell only slightly, from 0.311 to 0.302, and
      is still above the 0.2 threshold. Still, the Integrator''s rule was that the
      lead stays at y = 0.06 if oscillation falls and oval finishes hold or improve,
      and both held. I am therefore keeping y = 0.06. S-bend improved to 13 of 20
      finishes, with line loss at 0.55, but slalom still finishes 0 of 20 with 1.1
      line-loss events per run and max_error at the 0.06 m off-track limit. This meets
      the Integrator''s condition for holding geometry and tuning gains (line loss
      at 1 or more with max_error at the limit). Earlier spread changes already showed
      that widening to ±0.04 m hurt oval and did not fix slalom, and the off-track
      limit is fixed at 0.06 m for any allowed body_width, so body changes give no
      benefit here. The 7-sensor option the Integrator flagged as exploration has
      no race evidence. Testing it now would change coverage and force new weights
      while the controller is still being tuned, so I am deferring it.


      - [Open this output](iteration-5/entity0/versions/b4802f888c544f289cc79167ce60b89a/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-b73de98752ef7411/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-ca0434a47fb7ddeb/payload.json)'
  - id: entity1
    label: Race 4 geometry, tuned
    notes: 'Race 4 geometry held unchanged, with kp raised to 2.8, kd to 0.5 and base_speed
      lowered to 1.0 to target slalom line loss (1.1 per run in race 4). Based on
      race 4 telemetry and the Integrator''s agreed tuning rule.


      ### Rationale


      Race 4 (entityR2A, score 578.99) is the best measured geometry: five 16 mm sensors
      at x = -0.03 to +0.03 (15 mm pitch), y = 0.06, with kp 2.4, kd 0.45, base_speed
      1.1 and weights [-2,-1,0,1,2]. The Builder kept this geometry unchanged, so
      this iteration tests controller tuning alone. Race 4 evidence: oval finishes
      20 of 20 (max_error 0.030, line loss 0.5), s-bend finishes 13 of 20 (line loss
      0.55), and slalom finishes 0 of 20 with 1.1 line-loss events per run and max_error
      at the 0.06 m limit. The Integrator rule agreed in earlier iterations says that
      when line loss stays at 1 or more with max_error at the limit, the geometry
      is not the limiter and kp or base_speed should be tuned next (kp toward 2.8,
      base_speed toward 1.0). Race 3 showed that widening the spread to 0.04 m did
      not fix slalom, so I am not changing the spread. Changes from race 4: kp 2.4
      to 2.8 for about 17 percent more steering authority, to correct the drift that
      causes slalom line loss; kd 0.45 to 0.5 to damp the extra gain and the oval
      oscillation (0.30, still above 0.2); base_speed 1.1 to 1.0 to give more recovery
      time on tight bends. Oval finished in 2.09 s at base 1.1, so the 3 s limit should
      still be met at base 1.0 with some margin, and the completion-time term loses
      only a few points. ki stays at 0 to avoid windup on curves, and line_loss stays
      last_direction. Expected result, not yet measured: slalom line loss below 1
      per run and some slalom finishes, with oval finishes holding at 18 or more of
      20. Changing kp, kd and base_speed together is a deliberate multi-variable step,
      because slalom has never finished and a single small change is unlikely to move
      it.


      - [Open this output](iteration-5/entity1/versions/ca87684b3ab540eaad39fc84d274f744/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/b4802f888c544f289cc79167ce60b89a/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-ca0434a47fb7ddeb/payload.json)'
  - id: entityR1
    label: Hold geometry, tune gains
    notes: 'Advises holding the race 4 geometry and tuning controller gain first,
      since race 3 showed the wider spread did not fix slalom. Lists a conditional
      7-sensor exploration step only if slalom line loss persists.


      ### Feedback


      Written before this candidate races. Race 4 (entityR2A, 578.99) is the best
      result and shows that the y = 0.06 lead fixed oval (20 of 20) and improved s-bend
      (13 of 20), with s-bend line loss at 0.55. Slalom still lost the line at 1.1
      per run with max_error at the 0.06 m limit, and race 3 (entityR2B, 235.88) shows
      that widening to 0.04 m did not fix that failure, so the spread is not the limiter.
      Race 4 moved the lead from 0.05 to 0.06 and cut oval oscillation only from 0.311
      to 0.302, so the lead is a weak lever for oscillation. The next race should
      therefore test controller gain and speed, not geometry. Your 7-sensor coverage
      idea is untested in races, so treat it as exploration, to be tried only if slalom
      still fails. Once the race reports, use this rule. If slalom line loss falls
      below 1 and some slalom finishes appear, keep the geometry as it is. If slalom
      line loss stays at 1 or more with max_error at the limit, I will tune kp and
      base_speed first. If that still fails, the next geometry candidate is the 7-sensor
      layout at x = -0.03 to +0.03 (about 10 mm pitch) with 16 mm footprints and y
      = 0.06, which adds coverage without widening the spread. Keep y at 0.06 unless
      oval finishes fall below about 18 of 20.


      ### Requested changes


      - Hold the race 4 geometry unchanged for the next race (±0.03 m spread, 16 mm
      footprints, y = 0.06, 0.8 kg, 12 cm body and track, 3 cm wheels), so the controller
      change is tested alone against race 4.

      - If slalom line loss stays at 1 or more with max_error at 0.06 after controller
      tuning, try seven 16 mm sensors at x = -0.03, -0.02, -0.01, 0, 0.01, 0.02, 0.03
      with y = 0.06 as the next geometry test. Expect the sensor_weights and kp to
      be rescaled by the Integrator.

      - Do not move the lead further forward (y 0.065 to 0.07) unless oval steering_oscillation
      stays above 0.25 and oval finishes hold at 18 or more of 20. Race 4 showed the
      lead move from 0.05 to 0.06 changed oscillation by only about 0.01.


      - [Open this output](iteration-5/entityR1/versions/ca87684b3ab540eaad39fc84d274f744/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/b4802f888c544f289cc79167ce60b89a/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-ca0434a47fb7ddeb/payload.json)'
