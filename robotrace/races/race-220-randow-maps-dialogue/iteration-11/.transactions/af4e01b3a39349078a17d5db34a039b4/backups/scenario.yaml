overrides:
  entities:
  - id: entity0
    label: 'Final: hold race 10'
    notes: 'Holds the race 10 geometry unchanged (five 16 mm sensors at y 0.06, 0.12
      m track, 0.12 m body, 0.8 kg), the best measured result at 830.86 with slalom
      line loss down to 0.85. Mass 0.6 kg was not tested because this is the final
      iteration and an untested platform is too risky for the unseen-track race.


      ### Rationale


      Race 10 (entityR2A, score 830.86) is the best result so far, and its geometry
      is the race 8 platform: five 16 mm sensors at x = -0.03 to +0.03 with y = 0.06,
      body 0.12 m by 0.12 m, wheel_track 0.12 m, wheel_radius 0.03 m, mass 0.8 kg.
      The only change in that race was the controller (kd 0.6 to 0.8, kp 3.2, base_speed
      0.95). Oval finished 20/20 and s-bend 20/20, and slalom rose from 2/20 to 9/20
      finishes with line loss down from 1.0 to 0.85. This satisfies the Integrator''s
      own rule for keeping the geometry: slalom line loss fell to 0.85, below 1.0.
      The Integrator''s wheel_track 0.10 test (race 9) lost slalom finishes, and the
      wheel_track revert was accepted. Mass 0.6 kg was the one open exploration. I
      am not running it now. This is the final iteration, and a mass change would
      be a new, untested platform with no further iteration to correct it, while the
      final unseen-track race is scored on whatever robot is produced here. Holding
      the best measured geometry is the lower-risk choice for that race. The Integrator
      may still change the controller, and slalom line loss at 0.85 is the number
      to watch.


      - [Open this output](iteration-11/entity0/versions/ffb218215205423ca9ca2c91df4a4799/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-3bfea22b5c870b3c/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-d1c267ab0e7eeff6/payload.json)'
  - id: entity1
    label: Race 10 platform, final
    notes: 'Holds the race 10 geometry and controller exactly (score 830.86, oval
      and s-bend 20/20, slalom 9/20 with line loss 0.85). No untested change is made
      in the final iteration because the final unseen-track race is scored on this
      robot.


      ### Rationale


      Race 10 (score 830.86) is the best measured robot. Its geometry is exactly the
      Builder''s proposal: five 16 mm sensors at x = -0.03 to +0.03 with y = 0.06,
      body 0.12 m by 0.12 m, wheel_track 0.12 m, wheel_radius 0.03 m, mass 0.8 kg.
      Its controller is kp 3.2, kd 0.8, ki 0, base_speed 0.95, weights [-2,-1,0,1,2],
      line_loss last_direction. Oval finished 20/20 and s-bend 20/20. Slalom finished
      9/20, with line loss down to 0.85, under the 1.0 threshold I set for keeping
      the geometry. Race 9 showed that wheel_track 0.10 m loses slalom finishes, and
      the revert is already accepted. Race 3 (widening to 0.04 m) and race 6 (seven
      sensors) both failed. Mass 0.6 kg is untested, and this is the final iteration
      with no later race to correct a new platform, so I do not change geometry. For
      the controller, the race 10 settings produced the best measured score, and every
      change I could make is untested on this geometry, so I keep the controller identical
      to race 10. Expected result, not measured: the same platform should repeat close
      to race 10, with the slalom finish rate the main source of variance.


      - [Open this output](iteration-11/entity1/versions/fc4460217bb74e1d93f2b9ebc1f95621/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/ffb218215205423ca9ca2c91df4a4799/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-d1c267ab0e7eeff6/payload.json)'
  - id: entityR1
    label: Hold geometry, no mass
    notes: 'Asks the Builder to hold the race 10 geometry, since it is the best measured
      platform. It rejects wheel_track 0.10 (race 9) and does not test mass 0.6 kg
      now, because no later iteration could correct an untested platform.


      ### Feedback


      Written before this candidate races. The race 10 evidence (entityR2B, 830.86)
      supports holding this geometry. Oval (20/20) and s-bend (20/20) are both at
      ceiling, and slalom line loss fell to 0.85 with 9/20 finishes, so the body_length
      0.12 m and kd 0.8 changes that drove it are working. Race 9 (entityR2B, 700.30)
      showed that wheel_track 0.10 m lost slalom finishes (2 to 0) and raised line
      loss (1.0 to 1.25), so I keep wheel_track 0.12 m. Race 3 (235.88) and race 6
      (389.47) showed that the spread and sensor density do not help slalom, so the
      sensor layout stays. I have kept your geometry exactly and matched the controller
      to race 10. This is the final iteration, so any mass change would be tested
      only once, on an untested platform, with no later race to correct it. Mass 0.6
      kg therefore stays unexplored here. The outcome of this candidate is not known
      yet.


      ### Requested changes


      - Hold the race 10 geometry exactly: five 16 mm sensors at x = -0.03 to +0.03
      with y = 0.06, body_length 0.12 m, body_width 0.12 m, 0.8 kg, wheel_radius 0.03
      m, wheel_track 0.12 m. Race 10 is the only measured platform with slalom finishes
      at 9/20.

      - Do not return to wheel_track 0.10 m. Race 9 (entityR2B, 700.30) lost slalom
      finishes (2 to 0) and raised slalom line loss from 1.0 to 1.25.

      - If a further iteration exists after this one, test mass 0.6 kg alone against
      race 10, as the untested yaw-inertia idea, and do not combine it with any other
      change.


      - [Open this output](iteration-11/entityR1/versions/fc4460217bb74e1d93f2b9ebc1f95621/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/ffb218215205423ca9ca2c91df4a4799/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-d1c267ab0e7eeff6/payload.json)'
