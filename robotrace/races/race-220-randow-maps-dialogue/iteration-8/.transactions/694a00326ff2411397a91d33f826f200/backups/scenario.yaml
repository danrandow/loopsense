overrides:
  entities:
  - id: entity0
    label: Revert to 5-sensor
    notes: 'Reverts to the race 5 layout (five 16 mm sensors, ±0.03 m, y = 0.06) because
      the seven-sensor test cut oval to 4/20 and s-bend to 7/20 without fixing slalom.
      Evidence: race 5 scored 606.8 and race 6 scored 389.5.


      ### Rationale


      Race 6 (seven 16 mm sensors at 10 mm pitch, y = 0.06, score 389.47) was worse
      than race 5 (five sensors, same lead, score 606.82). Oval fell from 20/20 to
      4/20 and s-bend from 15/20 to 7/20, while slalom stayed at 0/20 with line loss
      rising to 1.25. The denser layout did not fix slalom and damaged the two tracks
      that were working. The Integrator''s rule was to keep the seven-sensor layout
      only if slalom line loss fell below 1; it did not, so the rule says to hold
      the geometry and move to gain and speed tuning. I am following that. I am reverting
      to the race 5 geometry (five 16 mm sensors at x = -0.03 to +0.03, 15 mm pitch,
      y = 0.06), the best measured platform. The evidence shows the sensor layout
      is not what limits slalom: widening to ±0.04 m (race 3) and densifying to seven
      sensors (race 6) both failed to fix it, and the lead move (race 4) helped oval
      and s-bend. Body, wheels and mass stay unchanged, since the off-track limit
      is at its 0.06 m floor. I expect this race to return to roughly race 5 performance
      (around 600) and to give the Integrator a clean baseline for gain and base_speed
      work on slalom.


      - [Open this output](iteration-7/entity0/versions/8b08896e774747f392f7ac4974822b9f/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-4480217beeb84571/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-0b705576df30f4bf/payload.json)'
  - id: entity1
    label: Race 5 geometry, faster
    notes: 'Holds the best race 5 sensor layout and raises kp to 3.2, kd to 0.6 and
      lowers base_speed to 0.95 to target slalom line loss, which stayed at 1.15 with
      max_error at the limit. Race 6 showed density is not the slalom limiter, so
      the change is to controller response.


      ### Rationale


      Race 5 (606.82) is the best measured design: five 16 mm sensors at x = -0.03
      to +0.03, y = 0.06, kp 2.8, kd 0.5, base_speed 1.0. Oval finished 20/20 and
      s-bend 15/20, but slalom finished 0/20 with 1.15 line-loss events and max_error
      at the 0.06 m limit. Race 6 (seven sensors, 389.47) lowered oval and s-bend
      and did not reduce slalom line loss (1.25), so sensor density is not the slalom
      limiter. The Builder has reverted to the race 5 geometry, so this iteration
      tests controller response alone. The agreed rule for line loss at 1 or more
      with max_error at the limit is to raise kp toward 3.2 or lower base_speed toward
      0.9. I do both moderately: kp 2.8 to 3.2 for more steering authority at the
      slalom bends, kd 0.5 to 0.6 to damp the extra gain and hold oval oscillation
      (0.29 in race 5), and base_speed 1.0 to 0.95 for more recovery time. Oval finished
      in about 2.2 s at base 1.0, so 0.95 should stay under 3 s with margin. s-bend
      mean finish was 2.49 s, so it is the tightest time margin. Expected result,
      not yet measured: slalom line loss below 1 and some slalom finishes, with oval
      holding at 18 or more of 20. If s-bend finish time becomes limiting, return
      base_speed to 1.0.


      - [Open this output](iteration-7/entity1/versions/eb0697b5ce2b4bde8b344561aa9f3887/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/8b08896e774747f392f7ac4974822b9f/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-0b705576df30f4bf/payload.json)'
  - id: entityR1
    label: Hold geometry, tune gains
    notes: 'Feedback asks the Builder to hold the race 5 platform because race 6 cut
      oval and s-bend without fixing slalom. It states no outcome for this candidate
      and sets the next steps based on the slalom line-loss result.


      ### Feedback


      Written before this candidate races. Race 5 (606.82) and race 6 (389.47) together
      show that the five-sensor layout at y = 0.06 with 16 mm footprints is the best
      platform. Race 6 was the seven-sensor density test: oval fell to 4/20, s-bend
      to 7/20, and slalom line loss rose to 1.25, so density is not the slalom limiter.
      Your decision to hold the race 5 geometry is supported. The controller is now
      tuned for slalom response (kp 3.2, kd 0.6, base_speed 0.95), so any change in
      slalom in the next race comes from gain and speed. Once the race reports: if
      slalom line loss falls below 1, keep the geometry and tell me which change to
      use. If slalom still loses the line at 1 or more with max_error at 0.06, the
      platform is limiting, so I will ask you for a geometry change with a clearer
      hypothesis.


      ### Requested changes


      - Hold the race 5 geometry (five 16 mm sensors at x = -0.03 to +0.03, y = 0.06,
      body 0.18 by 0.12, wheels 0.03 radius and 0.12 track, 0.8 kg) for the next race,
      so the gain and speed change is tested alone.

      - Do not move the lead further forward (y 0.065) unless oval steering_oscillation
      stays above 0.25 and oval finishes hold at 18 or more of 20, as your own rule
      requires. Race 4 showed the 0.05 to 0.06 move changed oscillation by only about
      0.01.

      - Optional exploration only, if slalom still loses the line at 1 or more after
      this race: test wheel_track at the low end (0.10 m) with the same sensors. This
      is untested and would sharpen yaw response on tight bends, but it changes the
      turning dynamics and needs a controller rescale.


      - [Open this output](iteration-7/entityR1/versions/eb0697b5ce2b4bde8b344561aa9f3887/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/8b08896e774747f392f7ac4974822b9f/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-0b705576df30f4bf/payload.json)'
