  id: race-220-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Seven-sensor coverage
    notes: 'Moves from five to seven 16 mm sensors at 10 mm pitch within the same
      ±0.03 m reach and y = 0.06, as the Integrator specified after controller tuning
      (race 5, 606.82) left slalom at 1.15 line-loss events with max_error at the
      limit. The benefit is a hypothesis: it tests whether signal gaps, not reach,
      cause slalom failure.


      ### Rationale


      Race 5 (entityR2A, 606.82) held the race 4 geometry and tuned the controller.
      Oval finished 20 of 20 and s-bend 15 of 20, both at or above race 4. Slalom
      still finished 0 of 20, with line_loss_events at 1.15 and max_error at the 0.06
      m limit. The Integrator''s rule says that when slalom line loss stays at 1 or
      more with max_error at the limit after controller tuning, the next geometry
      candidate is the seven-sensor layout. Race 5 meets that condition, so I am following
      that advice. Race 3 already showed that widening the spread to ±0.04 m does
      not fix slalom, so I am keeping ±0.03 m reach and adding sensors within it.
      The seven 16 mm sensors at 10 mm pitch from x = -0.03 to +0.03 keep the same
      outer reach. They should give a denser, smoother signal across the 25 mm tape
      and reduce gaps when the line sits between sensors. I expect this to help slalom
      only if the failure comes from signal gaps rather than from lack of reach. That
      is untested, and I am stating it as a hypothesis, not an expectation of a finish.
      Oval finishes and s-bend gains should hold at y = 0.06, which the Integrator''s
      oscillation rule supports. Body, wheels and mass are unchanged, because the
      off-track limit is at its 0.06 m floor for these body widths.


      - [Open this output](iteration-6/entity0/versions/15d941f980fe4ecfb14bc3dfd5d0a97c/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-fa5cad129a202b92/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-3d9da2aae3d9c278/payload.json)'
  - id: entity1
    label: Seven-sensor package
    notes: 'Seven 16 mm sensors at 10 mm pitch within the race 5 reach, with weights
      rescaled to keep the steering slope. Tests whether signal gaps caused the slalom
      line loss that race 5 left at 1.15 per run.


      ### Rationale


      Race 5 (entityR2A, 606.82) is the best measured design: five 16 mm sensors at
      x = -0.03 to +0.03, y = 0.06, kp 2.8, kd 0.5, base_speed 1.0. Oval finished
      20 of 20 and s-bend 15 of 20, but slalom still finished 0 of 20 with 1.15 line-loss
      events per run and max_error at the 0.06 m limit. Race 5 therefore meets the
      agreed condition: line loss at 1 or more with max_error at the limit after controller
      tuning. The Builder''s seven-sensor layout (x = -0.03 to +0.03 at 10 mm pitch,
      16 mm footprints, y = 0.06) is the next geometry step. Body, wheels, mass and
      reach are unchanged, so any change on slalom can be attributed to sensor density.


      Controller for seven inputs: the signal is a reading-weighted average, so its
      scale depends on the weight at the tape''s centre, not on the number of sensors.
      To keep the same steering slope per metre of offset as race 5 (weight = x /
      0.015), I set the seven weights to x/0.015: -2, -1.333, -0.667, 0, 0.667, 1.333,
      2. kp stays at 2.8, so steering per metre is unchanged. kd 0.5 and base_speed
      1.0 are kept so that the oval and s-bend results stay comparable to race 5.
      ki stays 0 and line_loss stays last_direction.


      Expected result, not measured: oval and s-bend near race 5 levels, and slalom
      line loss below 1 if signal gaps were the cause. If slalom still loses the line
      at 1 or more with max_error at the limit, the geometry is not the limiter on
      slalom, and the next step is gain or speed, not more sensors.


      - [Open this output](iteration-6/entity1/versions/12218f70e0364528b8b149345b1dbfa5/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/15d941f980fe4ecfb14bc3dfd5d0a97c/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-3d9da2aae3d9c278/payload.json)'
  - id: entityR1
    label: Seven-sensor feedback
    notes: 'Feedback written before the race: backs the seven-sensor test with race
      1, 3, 4 and 5 evidence, and sets a hold rule if slalom still loses the line
      at 1 or more. Makes no claim about this candidate''s result.


      ### Feedback


      Written before this candidate races. Race 5 (entityR2A, 606.82) is the best
      result: the controller change at race 4 geometry gave oval 20 of 20 and s-bend
      15 of 20, but slalom still finished 0 of 20 with 1.15 line-loss events and max_error
      at the 0.06 m limit. Race 1 (302.73) and race 3 (235.88) show that widening
      the spread to ±0.04 m cut oval finishes and did not fix slalom, so reach is
      not the limiter. Race 4 (356.98 to 578.99) showed that the y = 0.06 lead lifted
      oval and s-bend, so the lead should stay where it is. Your seven-sensor layout
      is the right next test: it adds coverage inside the ±0.03 m reach that already
      works on oval, which tests signal gaps directly. The Integrator has rescaled
      the weights so the steering slope per metre is unchanged. The outcome of this
      candidate is not known yet. Once the race reports: if slalom line loss falls
      below 1, keep the layout. If slalom still loses the line at 1 or more with max_error
      at the limit, the geometry is not the limiter on slalom, so hold it and move
      to gain and speed tuning.


      ### Requested changes


      - Keep the seven-sensor layout at x = -0.03 to +0.03 (10 mm pitch), 16 mm footprints,
      y = 0.06, with body, wheels and mass unchanged. Race 5 shows the ±0.03 m reach
      works on oval, so this is a single density change.

      - If slalom line loss stays at 1 or more with max_error at 0.06 after the seven-sensor
      race, hold the geometry. Do not widen the spread (race 3 showed it does not
      help) or move the lead further (race 4 showed a small oscillation gain only).

      - If slalom line loss falls below 1 but slalom still does not finish, keep the
      layout and let the Integrator tune base_speed and kp for completion time, since
      geometry is then no longer the limiter.


      - [Open this output](iteration-6/entityR1/versions/12218f70e0364528b8b149345b1dbfa5/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/15d941f980fe4ecfb14bc3dfd5d0a97c/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-3d9da2aae3d9c278/payload.json)'
