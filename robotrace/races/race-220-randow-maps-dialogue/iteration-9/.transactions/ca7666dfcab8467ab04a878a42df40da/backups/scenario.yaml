overrides:
  entities:
  - id: entity0
    label: Narrower track 0.10 m
    notes: 'Keeps race 8''s best platform (body 0.12 m, five 16 mm sensors) and changes
      only wheel_track from 0.12 to 0.10 m, as the Integrator advised for slalom yaw
      response. Race 8 scored 742 with slalom finishes rising from 0 to 2/20 and line
      loss falling from 1.2 to 1.0, so yaw response is still the limit on slalom.


      ### Rationale


      Race 8 (body_length 0.12 m, otherwise race 7) is the best result so far at 742.12,
      up from 636.91. Oval stayed at 20/20 with steering_oscillation 0.221, down from
      0.230. S-bend stayed strong at 20/20, and slalom rose from 0/20 to 2/20 finishes.
      Slalom line loss fell from 1.2 to 1.0 and its max_error stayed at the 0.06 limit.
      The Integrator''s rule was to keep body_length 0.12 if slalom line loss fell
      below 1. It is exactly 1.0, so the rule is not cleanly met. The improvement
      is real, though: slalom finishes appeared, the score rose, and oval oscillation
      improved. I am keeping body_length 0.12 m. The Integrator''s fallback is the
      next step: the yaw response is still limiting slalom. Here I follow the Integrator''s
      wheel_track 0.10 request, changing one geometry variable only. Mass stays at
      0.8 kg, as the Integrator asked. Lowering wheel_track from 0.12 to 0.10 m raises
      yaw gain per unit wheel-speed difference by about 1.2 times, so the Integrator
      should rescale kp from 3.2 to about 2.7 to hold steering authority. Sensors,
      wheel radius, body width and mass are unchanged, so the wheel_track effect can
      be read against race 8. Expected result: slalom line loss falls below 1 and
      slalom finishes rise, while oval and s-bend hold near race 8 levels. If oval
      steering_oscillation rises above 0.35 or slalom line loss rises, I will revert
      wheel_track to 0.12 m and hold the race 8 platform for gain tuning.


      - [Open this output](iteration-9/entity0/versions/5142dcc44dfd425da9a7137ab8dca67f/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-17b9a42ab2ceb717/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-e55160d02e20f069/payload.json)'
  - id: entity1
    label: Shorter body, race 7 tune
    notes: 'Race 7 controller unchanged with body_length 0.18 to 0.12 m, the only
      change against race 7 (636.91). Slalom line loss was 1.2 with max_error at the
      limit, so yaw inertia is the test.


      ### Rationale


      Race 7 (636.91) is the best measured design: five 16 mm sensors at x = -0.03
      to +0.03, y = 0.06, body_length 0.18, kp 3.2, kd 0.6, base_speed 0.95, weights
      [-2,-1,0,1,2]. Oval finished 20/20 and s-bend 16/20, but slalom finished 0/20
      with 1.2 line-loss events per run and max_error at 0.063. The Builder''s proposal
      changes only body_length from 0.18 to 0.12 m. Under the agreed rule, slalom
      line loss at 1 or more with max_error at the limit after gain tuning points
      to the platform, so this is the geometry test. Yaw inertia is mass*(L^2+W^2)/12,
      so the shorter body cuts it by about 38 percent. The contract says body_length
      has no direct dynamics effect, but it does enter yaw inertia, so this is a real,
      single-variable test. I keep the race 7 controller unchanged, so any change
      in slalom is attributable to body_length. Expected result, not measured: slalom
      line loss below 1 with max_error below 0.06, oval and s-bend close to race 7.
      If oval steering_oscillation rises above 0.35 with the same gains, the faster
      yaw response needs kd tuning before any further geometry change, as the Builder''s
      own rule states.


      - [Open this output](iteration-8/entity1/versions/6d1b1c5e909643b8883be4af6cc9decd/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/694a00326ff2411397a91d33f826f200/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-2af9cab4bb3fd6d2/payload.json)'
  - id: entityR1
    label: Hold sensors, test yaw
    notes: 'Feedback before racing: the sensor layout is ruled out by races 3 and
      6, so the next test is body length, then wheel_track 0.10 with a kp rescale
      if slalom still fails. Each step cites race evidence.


      ### Feedback


      Written before this candidate races. Race 7 (entityR2B, 636.91) is the best
      result: five 16 mm sensors at y = 0.06 with kp 3.2, kd 0.6 and base_speed 0.95.
      Oval finished 20/20 and s-bend 16/20, but slalom still finished 0/20 with 1.2
      line-loss events and max_error at the limit. Race 3 (235.88) showed that widening
      to 0.04 m did not fix slalom, and race 6 (389.47) showed that seven-sensor density
      did not either (line loss 1.25). So reach, spread and density are ruled out,
      and gain tuning in race 7 did not fix it. That makes the platform the limiter,
      which is why I took your body_length test. Your change is clean because the
      controller is unchanged. Once the race reports: if slalom line loss falls below
      1, keep body_length 0.12. If slalom line loss is unchanged or worse, yaw inertia
      is not the limiter, and the next step is wheel_track 0.10 with a controller
      rescale. Do not change mass in the same step.


      ### Requested changes


      - Keep the five 16 mm sensors at x = -0.03 to +0.03 and y = 0.06 with body_length
      0.12 m, so the body change is tested alone against race 7.

      - If slalom line loss is still 1 or more with max_error at 0.06, try wheel_track
      0.10 (the low end) with kp rescaled to about 2.7, since the smaller track raises
      yaw gain by about 1.2 times for the same command.

      - If oval steering_oscillation rises above 0.35 with the same gains, adjust
      kd (about +0.1 to +0.2) before any further geometry change.


      - [Open this output](iteration-8/entityR1/versions/6d1b1c5e909643b8883be4af6cc9decd/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/694a00326ff2411397a91d33f826f200/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-2af9cab4bb3fd6d2/payload.json)'
