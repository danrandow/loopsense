overrides:
  entities:
  - id: entity0
    label: Narrower track 0.10 m
    notes: 'Keeps race 8''s best platform (body 0.12 m, five 16 mm sensors) and changes
      only wheel_track from 0.12 to 0.10 m, as the Integrator advised for slalom yaw
      response. Race 8 scored 742 with slalom finishes rising from 0 to 2/20 and line
      loss falling from 1.2 to 1.0, so yaw response is still the limit on slalom.


      ### Rationale


      Race 8 (body_length 0.12 m, otherwise race 7) is the best result so far at 742.12,
      up from 636.91. Oval stayed at 20/20 with steering_oscillation 0.221, down from
      0.230. S-bend stayed strong at 20/20, and slalom rose from 0/20 to 2/20 finishes.
      Slalom line loss fell from 1.2 to 1.0 and its max_error stayed at the 0.06 limit.
      The Integrator''s rule was to keep body_length 0.12 if slalom line loss fell
      below 1. It is exactly 1.0, so the rule is not cleanly met. The improvement
      is real, though: slalom finishes appeared, the score rose, and oval oscillation
      improved. I am keeping body_length 0.12 m. The Integrator''s fallback is the
      next step: the yaw response is still limiting slalom. Here I follow the Integrator''s
      wheel_track 0.10 request, changing one geometry variable only. Mass stays at
      0.8 kg, as the Integrator asked. Lowering wheel_track from 0.12 to 0.10 m raises
      yaw gain per unit wheel-speed difference by about 1.2 times, so the Integrator
      should rescale kp from 3.2 to about 2.7 to hold steering authority. Sensors,
      wheel radius, body width and mass are unchanged, so the wheel_track effect can
      be read against race 8. Expected result: slalom line loss falls below 1 and
      slalom finishes rise, while oval and s-bend hold near race 8 levels. If oval
      steering_oscillation rises above 0.35 or slalom line loss rises, I will revert
      wheel_track to 0.12 m and hold the race 8 platform for gain tuning.


      - [Open this output](iteration-9/entity0/versions/5142dcc44dfd425da9a7137ab8dca67f/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-17b9a42ab2ceb717/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-e55160d02e20f069/payload.json)'
  - id: entity1
    label: Complete Robot Package
    notes: 'Complete Robot Package. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Race 8 (742.12, the best so far) is the evidence for this package. With body_length
      0.12 m and the race 7 controller, oval finished 20/20 with steering_oscillation
      0.221, s-bend finished 20/20, and slalom rose to 2/20 finishes. Slalom line
      loss fell from 1.2 to 1.0, which is exactly at the Integrator''s 1.0 threshold,
      so the rule is not cleanly met, but the shift is real. The Builder''s proposed
      change is wheel_track 0.12 to 0.10 m with mass and sensors held. Turn rate per
      unit wheel-speed difference is divided by wheel_track, so the yaw gain rises
      by about 1.2 times (0.12/0.10). To keep the same steering authority per unit
      of signal, I scale the gains by 1/1.2. kp goes from 3.2 to 2.7, as the Builder
      requested. kd goes from 0.6 to 0.5, the same scaling, which also reduces the
      derivative kick that could raise oval oscillation. base_speed stays at 0.95
      and ki at 0, with line_loss last_direction unchanged, so the geometry change
      is the main variable. Weights stay at [-2,-1,0,1,2] because the five sensors
      and 15 mm pitch are unchanged. Expected result, not measured: slalom line loss
      below 1, slalom finishes rising, max_error below 0.06, and oval finishes holding
      at 18 or more of 20. If slalom line loss is unchanged or worse, or oval steering_oscillation
      rises above about 0.35, the Builder''s revert path applies.


      - [Open this output](iteration-9/entity1/versions/ca7666dfcab8467ab04a878a42df40da/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/5142dcc44dfd425da9a7137ab8dca67f/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-e55160d02e20f069/payload.json)'
  - id: entityR1
    label: Integration Feedback
    notes: 'Integration Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Written before this candidate races. Race 8 (entityR2B, 742.12) is the best
      result: body_length 0.12 m gave oval 20/20 with steering_oscillation 0.221,
      s-bend 20/20, and slalom 2/20 finishes with line loss down from 1.2 to 1.0.
      That supports yaw inertia as part of the slalom limit, though not as the whole
      cause. Race 3 (235.88) and race 6 (389.47) already ruled out reach and density,
      so the yaw-response test is well-motivated. The wheel_track 0.10 change is a
      sound single-variable step. The Integrator has rescaled kp to 2.7 and kd to
      0.5, so this is a fair test of yaw authority. The candidate''s outcome is not
      known yet. Once race 9 reports: if slalom line loss falls below 1, keep wheel_track
      0.10 and tune base_speed. If slalom line loss is unchanged or worse, yaw authority
      is not the limit, and the next step is controller response, not more geometry.
      Note that max_error on slalom was 0.0594 in race 8, close to the 0.06 limit,
      so small drift changes can flip finishes.


      ### Requested changes


      - Keep the race 8 platform (five 16 mm sensors at x = -0.03 to +0.03, y = 0.06,
      body_length 0.12 m, mass 0.8 kg) and change only wheel_track to 0.10 m, with
      the Integrator''s kp 2.7 and kd 0.5 rescale, so the result can be read against
      race 8.

      - If slalom line loss stays at 1 or more after this race, hold the geometry
      and let the Integrator adjust kd and base_speed. Do not add further geometry
      in the same step.

      - Exploration only, if the slalom result is clear and it still does not finish:
      test mass at the low end (0.6 kg), since lower mass also cuts yaw inertia and
      adds traction-limited turning. This needs its own race and should not be combined
      with the wheel_track change.


      - [Open this output](iteration-9/entityR1/versions/ca7666dfcab8467ab04a878a42df40da/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/5142dcc44dfd425da9a7137ab8dca67f/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-e55160d02e20f069/payload.json)'
