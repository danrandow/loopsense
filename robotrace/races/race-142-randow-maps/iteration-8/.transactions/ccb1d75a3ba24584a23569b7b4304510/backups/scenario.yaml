map:
  id: race-142-randow-maps
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Sensor row forward to
    notes: 'Single-variable test: the five 16 mm sensors move from y=0.06 to y=0.07
      with everything else at the iteration 3 and 7 best (203.20). The move follows
      the Integrator''s conditional rule, since the restored run held oval progress
      at 0.87 and bend max_error stayed at 0.061 or above. Forward sensing is the
      only geometry lever that has improved the oval so far.


      ### Rationale


      The restored iteration 7 run reproduced the iteration 3 best exactly (score
      203.20). Oval progress was 0.87, which meets the Integrator''s 0.85 condition.
      S-bend and slalom max_error stayed at 0.0615 and 0.0611, still at or above 0.061,
      so the condition for the next geometry step is met. The only geometry change
      that has moved the oval is forward sensing. Moving the row from y=0.04 to y=0.06
      cut oval max_error from 0.0617 to 0.0598 and raised progress from 0.53 to 0.87.
      Outer spacing (x=±0.05), footprint size (12 mm) and track width (0.085 m) all
      cost progress without moving the bend exits. The bend exits have stayed at 0.061
      to 0.064 across every geometry since iteration 2, so the next single test is
      whether even earlier sensing lowers them. I therefore move the sensor row to
      y=0.07, keeping x=±0.04 at 16 mm, and hold every other geometry value at the
      iteration 7 best. Expected result: oval max_error slightly below 0.06 and oval
      progress at or above 0.87, with some risk that steering_oscillation rises above
      0.34 because the loop gains effectively increase. If the bend exits do not move,
      geometry should stop changing and the Integrator should carry the rest on the
      controller side.


      - [Open this output](iteration-8/entity0/versions/75934af002294aa8966f1989de801129/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-147e1b0287972ede/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-94717f63cda3ff20/payload.json)'
  - id: entity1
    label: y=0.07 sensors, damped
    notes: 'Builder''s forward sensor row at y=0.07 with the 16 mm array unchanged,
      paired with a modest controller change (kp 2.1, kd 0.35) to damp the oscillation
      that rose to 0.339 at iteration 3. Based on the iteration 2 to 4 results.


      ### Rationale


      The Builder''s y=0.07 proposal is the single change under test: the five 16
      mm sensors move from y=0.06 to y=0.07 with x and footprint unchanged. Earlier
      sensing has been the only geometry lever that moved the oval (iterations 2 to
      3: max_error 0.0617 to 0.0598, progress 0.53 to 0.87). The cost showed up in
      the controller: oval steering_oscillation rose to 0.339 at iteration 3 (kp 2.2,
      kd 0.30). Moving the row forward effectively raises loop gain, so jitter is
      likely to rise further, not fall. Iteration 4 softened the controller (kp 2.0,
      kd 0.35) but also widened the outer pair, so it is confounded. It moved oscillation
      only to 0.333, which says a small change is not enough. I therefore keep the
      Builder''s geometry exactly and make a moderate damping change: kp 2.2 to 2.1
      and kd 0.30 to 0.35. The slightly lower kp offsets the extra gain from the forward
      row, and the higher kd damps the jitter. ki stays 0 to avoid wind-up on bends.
      base_speed stays at 1.2, because progress has been limited by off-track exits,
      not speed. Line loss stays last_direction, since every loss has been a bend
      exit. Expected result: oval progress at or above 0.85 and oscillation at or
      below about 0.34. Bend exits may stay near 0.061, since they have not moved
      across geometries since iteration 2.


      - [Open this output](iteration-8/entity1/versions/c38ccd5d26ae4f6397640d3e3ed77321/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/75934af002294aa8966f1989de801129/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-94717f63cda3ff20/payload.json)'
  - id: entityR1
    label: Conditional steps for
    notes: 'Gives the Builder three race-dependent next steps: stop geometry if bend
      exits stay at 0.061, revert to y=0.06 if oval progress falls below 0.85, and
      tune kd rather than geometry if oscillation stays high. Each step cites iterations
      2 to 6.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for y=0.07.
      Evidence: moving the sensor row from y=0.04 to y=0.06 (iterations 2 to 3) lowered
      oval max_error from 0.0617 to 0.0598 and raised oval progress from 0.53 to 0.87,
      so forward sensing is the only geometry lever that has helped the oval. The
      cost showed in the controller: oval steering_oscillation rose to 0.339 at iteration
      3 (kp 2.2, kd 0.30). Softening the controller alone (iteration 4, kp 2.0, kd
      0.35) moved oscillation only to 0.333, though that run also widened the outer
      pair, so the result is confounded. Outer spacing of x=±0.05 (iteration 4) cut
      progress to 0.80, 12 mm footprints (iteration 5) cut it to 0.73, and wheel_track
      0.085 (iteration 6) cut it to 0.70, so those are rejected. Across every geometry
      since iteration 2, s-bend and slalom max_error has stayed at 0.061 to 0.064.
      Decide the next step from the race as follows. If oval progress is at or above
      0.85 and oval max_error is below 0.06, but s-bend or slalom max_error stays
      at 0.061 or above, bend exits are not sensing-limited and geometry should stop
      changing. If oval steering_oscillation stays above 0.34, keep y=0.07 and raise
      kd in steps (0.40, then 0.45) before any further geometry change. If oval progress
      falls below 0.85 at y=0.07, return the row to y=0.06, the 203.20 best.


      ### Requested changes


      - If oval progress is at or above 0.85 and s-bend or slalom max_error stays
      at 0.061 or above: hold sensor positions at y=0.07 and stop geometry changes,
      since bend exits have stayed at 0.061 to 0.064 across all geometries since iteration
      2. Evidence: iterations 2, 3, 4, 5 and 6 each left s-bend and slalom max_error
      in that range.

      - If oval progress falls below 0.85 at y=0.07: return the sensor row to y=0.06
      with x=±0.04 and 16 mm footprints, the 203.20 best. Evidence: iteration 3 gave
      oval progress 0.87 at y=0.06, and iteration 4 showed that wider outer spacing
      (x=±0.05) also cut progress to 0.80.

      - If oval steering_oscillation stays above 0.34 at y=0.07: keep the geometry
      and raise controller kd in steps (0.40, then 0.45) rather than changing sensors
      or wheel_track. Evidence: iteration 4 softened kp and raised kd only to 0.35
      and moved oscillation just from 0.339 to 0.333, so the change needs to be larger.


      - [Open this output](iteration-8/entityR1/versions/c38ccd5d26ae4f6397640d3e3ed77321/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/75934af002294aa8966f1989de801129/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-94717f63cda3ff20/payload.json)'
