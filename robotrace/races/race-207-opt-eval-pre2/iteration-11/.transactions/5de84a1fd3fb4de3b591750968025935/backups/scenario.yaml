  - id: entity2
    label: Keep kd 1.1 (best
    notes: 'Final design is the raced kd 1.1 configuration, unchanged, which scored
      395.35 with the oval finishing 20 of 20. Rejected further kd or speed steps
      because s-bend progress peaked below 1.1 and an oval finish loss would cost
      about 950 points.


      ### Rationale


      Evidence. The best measured design is the kd 1.1 run (base 1.5, kp 3.5, ki 0.05,
      weights [1, 0.5, 0, -0.5, -1], 12 mm sensors at y=0.06, last_direction). It
      scored 395.35 across 60 trials. The oval finished 20 of 20 with mean progress
      0.998, mean time 1.87 s and steering_oscillation 0.217. The s-bend (progress
      0.395) and slalom (progress 0.178) both ended off track in every trial. The
      oval term carries about 950 of the three-track mean, while s-bend and slalom
      contribute about 163 and 74.


      Critique handling:

      (1) Accepted: the round-2 critique is right that the revision is identical to
      a raced design and that re-racing it tests nothing new if the simulator is deterministic.
      I do not claim a gain from this iteration.

      (2) Rejected: the critique''s suggestion to move kd to 1.4 or to change base
      speed is not adopted. Progress on the s-bend fell from 0.424 (kd 0.8) to 0.395
      (kd 1.1), so the s-bend optimum may lie near 0.8 to 1.1. The kd 0.8 design also
      finished only 14 of 20 on the oval. Any step that breaks the 20-of-20 oval finish
      costs roughly 950 points of mean score, far more than an untested s-bend gain
      could return.

      (3) Accepted: the critique''s point that the decision rules are weak is correct.
      The rules below are made concrete. They are for the next development step, not
      for this race.

      (4) Rejected: the critique''s wider-sensor-row suggestion was already tested
      at a 0.07 m span with no s-bend gain, so it is not a new lever.

      (5) Partly accepted: the critique is right that s-bend and slalom are unsolved
      and that this design makes no change aimed at them. I keep the design unchanged
      because it is the only measured design with a clean oval finish, and the final
      evaluation runs on an unseen track where that robustness matters most.


      Expected result: about 395 on the development tracks, with oval finish 20 of
      20 and steering_oscillation near 0.22. No s-bend or slalom gain is predicted.


      Decision rules for the next development step: revert to kd 0.8 if oval finish
      falls below 0.6 or steering_oscillation exceeds 0.40 on any track. Otherwise,
      test a single change on the s-bend, such as kd 1.0, and judge it with paired
      seeds, since the disturbance is fixed per seed and track and oval scores vary
      widely.


      - [Open this output](iteration-10/entity2/versions/dd1d8855781a460dbb5b6c94be52753c/payload.json)

