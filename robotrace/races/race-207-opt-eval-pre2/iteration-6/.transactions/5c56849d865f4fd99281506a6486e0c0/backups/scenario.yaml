map:
  id: race-207-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Wider sensor span test
    notes: 'Widens the sensor row to ±0.07 m with 16 mm footprints and base speed
      1.4 to test whether losing the line at drift is the cause of the fixed s-bend
      failure at progress 0.1475. Evidence: 180 development trials with no finishes,
      and the same s-bend progress across five different gain and sensor settings.


      ### Rationale


      Evidence: across 180 development trials (iterations 0 to 4), none finished.
      Every run ended off track at progress 0.04 to 0.15, with max_error at the 0.06
      m off-track limit. The s-bend progress sat at exactly 0.1475 in iterations 0,
      1, 2 and 4, despite changes to kp (2.5 to 4.5), kd (0.5 to 1.0), ki, base_speed
      (1.3 to 1.6), sensor size (12 vs 16 mm), sensor forward position (y 0.03 to
      0.05) and track/mass. Iteration 3 was worse (s-bend 0.043) when the sensors
      were moved back to y=0.03 and kp was cut to 2.5. The common factor in all runs
      is the sensor span: every design has sensors within about ±0.04 to ±0.06 m,
      and iteration 1 at ±0.06 still failed at the same point. A row this narrow means
      that once the robot drifts about 0.04 m, the outer sensors read little or no
      tape, the weighted signal collapses, and the controller loses the line. Line
      loss then happens about once per run, and the robot leaves the tape. The fixed
      s-bend failure point is therefore most likely a drift-and-lose-line event, not
      a gain or speed limit.


      Changes from iteration 0 (the best-scoring design): (1) Widen the sensor span
      to ±0.07 m with five sensors at x = +0.07, +0.035, 0, -0.035, -0.07 and y =
      0.04. This keeps at least one sensor on the tape out to about 0.08 m of offset,
      which is beyond the 0.06 m off-track limit, so the controller should keep a
      usable signal through the drift that currently ends the run. (2) Use 16 mm sensor
      footprints so each sensor overlaps the 25 mm tape more, giving smoother readings
      at the wider spacing. (3) Keep kp at 3.5 and kd at 0.8, with ki at 0, as in
      iteration 4, which was not worse than iteration 0. (4) Lower base_speed to 1.4
      to give more correction time at the bends where the line is lost. This costs
      some progress rate, but the score is currently driven by how far the robot travels
      before going off track. Geometry otherwise matches iteration 0 to keep the comparison
      clean.


      Expected result: the s-bend progress should rise above 0.1475, because the robot
      should no longer lose the line at the same drift point. Max_error should stay
      near or below 0.06 m, and line_loss_events should fall toward 0.5 or lower per
      run. Completion is still unlikely, because the 3 s limit needs about 1.5 m/s
      average. If progress improves a lot, the next iteration should raise base_speed
      back toward 1.6 to 1.8. If progress does not improve, the sensor span is not
      the cause and I should test line_loss ''search_right'' or a shorter forward
      sensor row.


      - [Open this output](iteration-5/entity0/versions/277d3147ebcd4f0085cca2d43887a921/payload.json)

      - Based on: [entityR2A](iteration-5/entityR2A/versions/carried-3d03da732cf3b1d6/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critique of the sensor-span draft. Key points: iteration 1 already tested
      a wider span with the same s-bend progress of 0.1475, the 0.06 m off-track limit
      caps any sensor benefit, iteration 4 scored below iteration 0 (50.82 vs 53.02),
      and the draft changes six parameters at once.


      - [Open this output](iteration-5/entityC1/versions/a7c9431c5a284cbb992b839e5e6a35b8/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/277d3147ebcd4f0085cca2d43887a921/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-3d03da732cf3b1d6/payload.json)'
  - id: entity1
    label: Iter-0 + search_right
    notes: 'Reverts to the best-scoring iteration-0 design (53.02) and changes one
      factor: line_loss set to search_right, to test whether recovery after the once-per-run
      line loss is the limit. The wider-span and multi-factor drafts are dropped after
      the critique and the iteration-1 result.


      ### Rationale


      Evidence. Iteration 0 is still the best design (score 53.02). Across 240 development
      trials, none finished, and every run ended off track at progress 0.04 to 0.15
      with max_error at the 0.06 m limit. Each run lost the line about once. Several
      factors have been tested against that baseline: kp 2.5 (35.5), kp 4.0 (50.8),
      16 mm sensors (50.5), and sensor span ±0.06 m with other changes (50.6). The
      s-bend progress stayed at exactly 0.1475 across most changes, so the failure
      point is probably set by something the gains do not touch.


      What I accept from the round-1 critique: (1) The sensor-span hypothesis is contradicted.
      Iteration 1 used ±0.06 m and the s-bend result did not move, so I drop the wider-array
      plan. (2) The draft changed six things at once and could not be attributed,
      so I return to the iteration-0 design exactly. (3) The factual error about iteration
      4 is accepted: it scored 50.82, below iteration 0. (4) The base_speed cut to
      1.4 is rejected, because it reduces the only route to the 500-point completion
      bonus and has no supporting evidence.


      What I changed: one factor only. line_loss changes from last_direction to search_right.
      Every run ends with one line-loss event followed by an off-track exit, so the
      recovery behaviour after the line is lost is the one lever that acts directly
      on the observed terminal event. Everything else, including geometry, gains and
      base_speed 1.5, is identical to iteration 0, so any score change is attributable
      to line-loss recovery.


      What I rejected: the critique''s suggestion of a conservative start at much
      lower speed, because the data give no evidence that speed is the limit. I also
      did not test a gain change, since kp has now been tested at 2.5, 3.5 and 4.0
      with 3.5 best, and kd and ki are untested alone.


      Expected result: if the failure is in recovery after line loss, progress rises
      above 0.1475 on the s-bend and line_loss_events stays near 1. If the score is
      unchanged within about 0.05, the recovery direction is not the limit, and the
      next single test should be kd alone (0.15 to 0.4). If the score falls, revert
      to last_direction and test kd alone.


      Decision rule for the next revision: if progress rises, keep search_right and
      test kd alone. If progress falls, revert to last_direction and test kd alone.
      If progress exceeds 0.9 with completion 0, raise base_speed by 0.1.


      - [Open this output](iteration-5/entity1/versions/bb999a97fa1143b69f975f273508007a/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/277d3147ebcd4f0085cca2d43887a921/payload.json),
      [entityC1](iteration-5/entityC1/versions/a7c9431c5a284cbb992b839e5e6a35b8/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-3d03da732cf3b1d6/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Critiques the search_right revision: the fixed recovery direction is not
      tied to the exit side, the slalom''s alternating bends are ignored, and the
      0.05 score band is smaller than the oval''s seed spread. The trial count (240
      vs 300) is also inconsistent with the scoreboard.


      - [Open this output](iteration-5/entityC2/versions/8db16e0a938e42cab3c7770fb41061a3/payload.json)

      - Based on: [entity1](iteration-5/entity1/versions/bb999a97fa1143b69f975f273508007a/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-3d03da732cf3b1d6/payload.json)'
  - id: entity2
    label: Line-loss search_right
    notes: 'Iteration-0 design with one change: line_loss set to search_right, to
      test whether recovery direction after line loss moves s-bend progress from 0.1475.
      The critique''s side-of-exit and alternating-slalom concerns are handled by
      a mixed-result rule, and thresholds are set against the oval''s seed spread.


      ### Rationale


      Evidence. Iteration 0 (kp 3.5, kd 0.15, ki 0.05, base 1.5, 12 mm sensors at
      y=0.06, last_direction) is still the best design at 53.02. Every run in all
      iterations ended off track at progress 0.04 to 0.15, with about one line-loss
      event per run. The s-bend progress stayed at 0.1475 across kp 3.5 to 4.5, kd
      0.15 to 1.0, base 1.3 to 1.6 and both sensor sizes. Lowering kp to 2.5 cut s-bend
      progress to 0.043, so the s-bend is not fully insensitive to the controller.
      Iteration 2 (16 mm sensors) scored 50.49, so that change is rejected.


      What I kept, changed and rejected after the round-2 critique:

      (1) Kept the single change from my revision: line_loss last_direction to search_right.
      All other values equal iteration 0 (geometry, kp 3.5, ki 0.05, kd 0.15, base
      1.5, weights [1, 0.5, 0, -0.5, -1]). Any score change is attributable to line-loss
      recovery.

      (2) Accepted the critique''s point that search_right commits every loss to one
      steering side. On the slalom, whose bends alternate, it will be wrong on about
      half of losses. I therefore set a rule for mixed results below rather than reading
      a three-track mean alone.

      (3) Accepted that the mechanism is asserted, not shown. The race is a probe
      with an expected score near 53 or below. It is not a candidate likely to finish,
      and I say so plainly.

      (4) Rejected reverting now to last_direction as the final candidate, because
      this iteration exists to test the one lever that acts on the observed line-loss
      exit. Reverting would leave that lever untested.

      (5) Rejected a speed cut. The data show no evidence that speed is the limit,
      and speed has never been tested alone.

      (6) Quantified the thresholds. Oval score spread for iteration 0 is 48.3 to
      74.9, so differences under about 1 point on the three-track mean are treated
      as noise. Progress is the main signal, because it moves the score roughly 2.5
      to 4 points per 0.01 while nothing finishes.


      Expected result: s-bend progress above 0.1475 and line_loss_events about 1.0
      per track, with a three-track mean score above 53.0. Decision rules: (a) If
      the s-bend progress rises by more than 0.01 and the slalom progress does not
      fall by more than 0.01, keep search_right and test kd alone (0.15 to 0.4). (b)
      If the score falls by more than 1 point on the three-track mean, revert to last_direction
      and test kd alone. (c) If the results are mixed (a gain on one track offset
      by a loss on another), do not adopt search_right. Revert to last_direction and
      test kd alone, since a fixed direction is not robust to alternating bends. (d)
      If progress is unchanged within 0.01 on all tracks, recovery direction is not
      the limit, and the next single test is kd alone. (e) If progress exceeds 0.9
      with completion 0, raise base_speed by 0.1.


      - [Open this output](iteration-5/entity2/versions/f855a236c4de48b7acda3e0a79a1b28b/payload.json)

      - Based on: [entity1](iteration-5/entity1/versions/bb999a97fa1143b69f975f273508007a/payload.json),
      [entityC2](iteration-5/entityC2/versions/8db16e0a938e42cab3c7770fb41061a3/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-3d03da732cf3b1d6/payload.json)'
