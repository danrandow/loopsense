map:
  id: race-207-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Wider sensor span test
    notes: 'Widens the sensor row to ±0.07 m with 16 mm footprints and base speed
      1.4 to test whether losing the line at drift is the cause of the fixed s-bend
      failure at progress 0.1475. Evidence: 180 development trials with no finishes,
      and the same s-bend progress across five different gain and sensor settings.


      ### Rationale


      Evidence: across 180 development trials (iterations 0 to 4), none finished.
      Every run ended off track at progress 0.04 to 0.15, with max_error at the 0.06
      m off-track limit. The s-bend progress sat at exactly 0.1475 in iterations 0,
      1, 2 and 4, despite changes to kp (2.5 to 4.5), kd (0.5 to 1.0), ki, base_speed
      (1.3 to 1.6), sensor size (12 vs 16 mm), sensor forward position (y 0.03 to
      0.05) and track/mass. Iteration 3 was worse (s-bend 0.043) when the sensors
      were moved back to y=0.03 and kp was cut to 2.5. The common factor in all runs
      is the sensor span: every design has sensors within about ±0.04 to ±0.06 m,
      and iteration 1 at ±0.06 still failed at the same point. A row this narrow means
      that once the robot drifts about 0.04 m, the outer sensors read little or no
      tape, the weighted signal collapses, and the controller loses the line. Line
      loss then happens about once per run, and the robot leaves the tape. The fixed
      s-bend failure point is therefore most likely a drift-and-lose-line event, not
      a gain or speed limit.


      Changes from iteration 0 (the best-scoring design): (1) Widen the sensor span
      to ±0.07 m with five sensors at x = +0.07, +0.035, 0, -0.035, -0.07 and y =
      0.04. This keeps at least one sensor on the tape out to about 0.08 m of offset,
      which is beyond the 0.06 m off-track limit, so the controller should keep a
      usable signal through the drift that currently ends the run. (2) Use 16 mm sensor
      footprints so each sensor overlaps the 25 mm tape more, giving smoother readings
      at the wider spacing. (3) Keep kp at 3.5 and kd at 0.8, with ki at 0, as in
      iteration 4, which was not worse than iteration 0. (4) Lower base_speed to 1.4
      to give more correction time at the bends where the line is lost. This costs
      some progress rate, but the score is currently driven by how far the robot travels
      before going off track. Geometry otherwise matches iteration 0 to keep the comparison
      clean.


      Expected result: the s-bend progress should rise above 0.1475, because the robot
      should no longer lose the line at the same drift point. Max_error should stay
      near or below 0.06 m, and line_loss_events should fall toward 0.5 or lower per
      run. Completion is still unlikely, because the 3 s limit needs about 1.5 m/s
      average. If progress improves a lot, the next iteration should raise base_speed
      back toward 1.6 to 1.8. If progress does not improve, the sensor span is not
      the cause and I should test line_loss ''search_right'' or a shorter forward
      sensor row.


      - [Open this output](iteration-5/entity0/versions/277d3147ebcd4f0085cca2d43887a921/payload.json)

      - Based on: [entityR2A](iteration-5/entityR2A/versions/carried-3d03da732cf3b1d6/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critique of the sensor-span draft. Key points: iteration 1 already tested
      a wider span with the same s-bend progress of 0.1475, the 0.06 m off-track limit
      caps any sensor benefit, iteration 4 scored below iteration 0 (50.82 vs 53.02),
      and the draft changes six parameters at once.


      - [Open this output](iteration-5/entityC1/versions/a7c9431c5a284cbb992b839e5e6a35b8/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/277d3147ebcd4f0085cca2d43887a921/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-3d03da732cf3b1d6/payload.json)'
  - id: entity1
    label: Single-step kp test 4.0
    notes: 'Iteration-0 design with kp raised alone from 3.5 to 4.0, the only clean
      test after kp 2.5 scored 35.5 and the 16 mm sensor scored 50.5. Rejects the
      critique''s sensor and speed changes, which were untested and would break attribution.


      ### Rationale


      Evidence. The iteration-0 design (kp 3.5, kd 0.15, ki 0.05, base 1.5, 12 mm
      sensors at y=0.06) is still the best-scoring design at 53.02. Iteration 3 changed
      only kp (3.5 to 2.5) from that baseline and scored 35.5, so lowering kp clearly
      hurts. Iteration 2 changed only the sensor size (12 to 16 mm) and scored 50.5,
      so the larger footprint also hurts. No run has finished (0 of 180 trials), and
      every run has ended off track at progress 0.04 to 0.15 with max_error at the
      0.06 m limit. The s-bend progress of 0.1475 is identical across several controller
      and sensor settings, so it is likely set by the track or the start.


      What I kept, changed and rejected, following the round-1 critique:

      (1) Kept the iteration-0 geometry and controller exactly, except for one change.
      The critique''s point that a multi-factor draft cannot be attributed is correct,
      so I changed one parameter only.

      (2) Changed kp from 3.5 to 4.0, alone. kp has been the only lever with a clean
      measured effect (2.5 is much worse than 3.5), and 4.0 is the next step up. Iteration
      1 (kp 4.0) was confounded with other changes, so this is the first clean test
      of 4.0. This is a partial acceptance of the critique: I test a single step,
      not an interpolation I cannot support.

      (3) Rejected the critique''s suggestion to fix the failure point by changing
      sensors or track geometry. The data do not show what would move the failure
      point, and changing geometry now would again remove attribution.

      (4) Rejected the kd 0.8 and base_speed 1.4 changes from my earlier draft. Both
      were untested in isolation, and base_speed 1.4 moves away from the speed needed
      for the 500-point completion bonus.

      (5) Rejected the critique''s proposal of a much lower speed for a conservative
      start. The data show no evidence that speed is the limit, and completion needs
      real speed.


      Expected result: if kp is the lever, progress and score rise above 53.0 with
      max_error nearer 0.05 m. If the score falls, kp 3.5 is near the optimum and
      the next single test should be kd alone (0.15 to 0.4). If the s-bend progress
      stays at 0.1475, the failure point is not set by kp, and the next test is line_loss_events
      (last_direction versus search_right) on one race.


      Decision rule for the next revision: if score or progress rises, keep kp 4.0
      and test kd alone. If the score drops below 53.0, revert to kp 3.5 and test
      kd alone. If progress exceeds 0.9 with completion 0, raise base_speed by 0.1.
      If line_loss_events exceeds 2, test line_loss = search_right.


      - [Open this output](iteration-4/entity1/versions/8b3d924d25bf48749a1908df0419afc1/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/efd2b34022a9481b9e5ab40a09ea23a9/payload.json),
      [entityC1](iteration-4/entityC1/versions/7033f806ecb04f53a21e495f188a4d92/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-4e123471667224c7/payload.json)'
  - id: entityC2
    label: Round-2 critique
    notes: 'Critiques the kp 4.0 single-factor revision. Main points: the race is
      likely to be near-null given the 0.1475 s-bend plateau, the score tracks progress
      more than the rms terms, and the thresholds ignore seed spread and an unquantified
      expected result. The rationale also omits that kp 2.5 did move the s-bend result,
      based on the iteration-3 race data.


      - [Open this output](iteration-4/entityC2/versions/05a750749f0f42449a2e10e76edbabca/payload.json)

      - Based on: [entity1](iteration-4/entity1/versions/8b3d924d25bf48749a1908df0419afc1/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-4e123471667224c7/payload.json)'
  - id: entity2
    label: kp 4.0 single-factor test
    notes: 'Final design is the iteration 0 baseline with kp raised from 3.5 to 4.0
      and nothing else changed, and the 12 mm sensors kept. Iteration 0 is the best
      score (53.02), iteration 2 showed the 16 mm footprint hurts, and iteration 3
      showed kp 2.5 hurts, so kp 4.0 is the one clean next step. Pass thresholds for
      the mean score and s-bend progress are set in the rationale.


      ### Rationale


      Evidence. Iteration 0 (kp 3.5, kd 0.15, ki 0.05, base 1.5, 12 mm sensors at
      y=0.06) remains the best-scoring design at 53.02. Iteration 2 (16 mm sensors)
      fell to 50.49, so the larger footprint is rejected. Iteration 3 (kp 2.5) fell
      to 35.52, so lowering kp clearly hurts. Iteration 1 (kp 4.0 with ki 0.4 and
      kd 0.2) scored 50.62, but it changed three factors, so it is not a clean test
      of kp 4.0. Every run in all iterations ended off track at progress 0.04 to 0.15,
      and the s-bend progress of 0.1475 has not moved under any kp from 3.5 to 4.5.


      What I kept, changed and rejected after the round-2 critique:

      (1) Kept the iteration 0 geometry exactly, with 12 mm sensors and no footprint
      change. This removes the blur risk the critique raised for 16 mm sensors.

      (2) Kept the single change kp 3.5 to 4.0 from my revision. The critique''s main
      point is that this test is close to a null, and I accept that. kp 4.0 is still
      the only lever with a clean measured effect (2.5 is much worse, so kp matters
      at least below 3.5). The test is clean for kp alone, so I keep it.

      (3) Accepted the critique''s request for quantified thresholds. The result will
      be read on the three-track mean score and on progress per track. Support for
      kp 4.0 requires a mean score above 53.0 and the s-bend progress above 0.1475,
      or oval progress above 0.1355 with no oval-only driver. Anything within about
      0.5 of 53.0 is treated as noise, because iteration 0''s oval spread was 48.3
      to 74.9.

      (4) Rejected the critique''s suggestion to change sensor placement or track-related
      geometry. The data do not show what would move the early failure point (about
      0.1 to 0.15 of the course), and changing geometry now would again remove attribution.

      (5) Rejected a speed cut. Completion needs about 1.5 m/s average, and no evidence
      shows speed is the limit. Speed will be tested alone later if the failure point
      stays fixed.

      (6) Rejected the critique''s proposal to move to line_loss search_right next.
      The data do not link line loss to the early failure, so it is not the next lever.


      Decision rule for the next revision: if the mean score exceeds 53.0 and the
      s-bend progress exceeds 0.1475, keep kp 4.0 and test kd alone (0.15 to 0.4).
      If the score falls below 52.5, revert to kp 3.5 and test kd alone. If the s-bend
      progress stays at 0.1475 with the score within 0.5 of 53.0, kp does not set
      the failure point, and the next test is kd alone. If progress exceeds 0.9 with
      completion 0, raise base_speed by 0.1.


      Expected result: score within about 1 point of 53.0, with max_error near 0.06
      m. A large gain is not expected from one gain change.


      - [Open this output](iteration-4/entity2/versions/260c5049fd8d45f79d671e36eee5ed04/payload.json)

      - Based on: [entity1](iteration-4/entity1/versions/8b3d924d25bf48749a1908df0419afc1/payload.json),
