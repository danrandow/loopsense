map:
  id: race-207-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: More damping (kd 1.8)
    notes: 'Keeps the best-scoring iteration 6 geometry and controller, changing only
      kd from 1.2 to 1.8 to test whether extra damping reduces overshoot. Based on
      iteration 6 gaining progress on oval at lower base speed and higher kd, with
      all 420 trials still off track.


      ### Rationale


      Evidence: across 420 development trials (iterations 0 to 6) none finished. Every
      run ended off track at progress 0.04 to 0.16, with max_error pinned at the 0.06
      m off-track limit. The limit is max(0.06, 0.0125 + body_width/4), which equals
      0.06 m for any allowed body width, so body width cannot buy margin. Score is
      almost entirely progress-driven (about 250 times progress), so the goal is to
      travel further before leaving the tape.


      What the comparisons show: iteration 6 (base 1.2, kd 1.2, kp 3.5, ki 0, iteration-0
      geometry) is the best at 56.87, and it is the only change in the last few iterations
      that helped. Lower base speed and higher kd both moved progress up on oval (0.1575
      vs 0.1175) while s-bend stayed near 0.15. Widening sensors (iteration 5) and
      raising kp to 4.5 (iteration 2) did not help, and kp 2.5 with sensors moved
      back (iteration 3) hurt. The strongest remaining signal is that more damping
      plus lower speed reduces the excursion, so the robot is overshooting rather
      than lacking authority.


      Changes from iteration 6, one controller step only so the next race attributes
      any gain: kd 1.2 to 1.8 for more damping of the yaw response, kp kept at 3.5,
      base_speed kept at 1.2, ki kept at 0, and geometry identical to iterations 0
      and 6. I considered cutting base_speed further, but completion is already out
      of reach at 1.2, so I keep the speed fixed to isolate the damping effect.


      Expected result: oval and s-bend progress above the iteration 6 values, with
      rms_error and steering_oscillation down and max_error still at the 0.06 limit.
      A score of about 58 to 62 is plausible. Completion remains unlikely. If kd gains
      progress, the next step is a further damping increase or a gradual speed rise.
      If it does not, the failure is not overshoot and I should test line_loss ''search_right''
      or a seven-sensor row.


      - [Open this output](iteration-7/entity0/versions/d69e314a8f594e9aa62535dc6df75ea2/payload.json)

      - Based on: [entityR2A](iteration-7/entityR2A/versions/carried-2ce069405489958a/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critique of the kd 1.8 draft: flags derivative noise amplification, confounded
      attribution of iteration 6 gains, heavy-tailed oval means, and the ignored slalom
      track. Evidence is the iteration 0 to 6 race data and the score formula.


      - [Open this output](iteration-7/entityC1/versions/b6be8bc273f145a5a4f9fe411c3a0184/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/d69e314a8f594e9aa62535dc6df75ea2/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-2ce069405489958a/payload.json)'
  - id: entity1
    label: kd 0.8 single-step test
    notes: 'Keeps the raced iteration 6 design and changes only kd from 0.4 to 0.8,
      a moderate step instead of the draft''s 1.8. Iteration 6 vs 0 was a clean kd-only
      change that gained 3.85 points, and steering oscillation stayed flat, so more
      damping is the best-supported lever.


      ### Rationale


      Evidence. Iteration 6 is the only clean single-factor comparison in the record:
      it equals iteration 0 (score 53.02) except kd, which went from 0.15 to 0.40.
      Its score rose to 56.87, with oval progress 0.1355 to 0.1575 and s-bend progress
      0.1475 to 0.15. Slalom stayed at 0.105. Steering oscillation did not rise (0.1044
      to 0.1047), so the extra damping shows no sign of noise amplification at this
      level. Every run so far has ended off track with max_error at the 0.06 m limit,
      and no run has finished.


      Corrections to my draft. The draft''s stated baseline was wrong. It described
      iteration 6 as base 1.2, kd 1.2, and used sensors at y=0.04. The raced iteration
      6 was base 1.5, kd 0.4, sensors at y=0.06. I rebuild from the raced design.
      Iteration 0 geometry is kept, because the y=0.06 array is the one that produced
      the measured results.


      What I kept, changed and rejected, following the round-1 critique:

      (1) Accepted: kd 1.8 is a large step with unquantified noise cost, and the expected
      gain rested on a confounded comparison. I reject the 1.8 value and take a smaller
      step, kd 0.4 to 0.8, from the raced iteration 6 design. This is a single-factor
      change, so any score change is attributable to kd.

      (2) Accepted: the draft''s base_speed of 1.2 was not a clean test. I keep base_speed
      1.5 and ki 0.05, exactly as in iteration 6.

      (3) Rejected: the draft''s geometry change to y=0.04. Changing geometry now
      would remove the clean comparison.

      (4) Partly accepted: the critique is right that slalom has been flat at 0.105
      for every iteration. No lever has moved it yet, so this change does not address
      it, and I say so here rather than predicting a slalom gain.

      (5) Accepted and stated openly: this is a progress-only run. Base speed 1.5
      keeps completion possible in principle, but no run has come close to finishing,
      so the 500-point completion term is unlikely to be earned. I do not change speed
      to chase it while the damping trend is still being measured.

      (6) Rejected: the critique''s suggestion of a conservative lower speed. The
      data show no evidence that speed is the limit.


      Expected result: oval and s-bend progress above the iteration 6 values, with
      steering_oscillation near 0.10 to 0.11 and max_error still at the 0.06 m limit.
      A score of about 57 to 60 is plausible. The score should be read against the
      56.87 of iteration 6, not the draft''s estimate.


      Decision rule for the next revision: if the score exceeds 56.87 and progress
      rises on at least two tracks, try kd 1.2 next, with no other change. If the
      score falls below 56.87, keep kd 0.4 and test ki alone (0.05 to 0.3). If steering_oscillation
      rises clearly above 0.13, back off kd before any other change.


      - [Open this output](iteration-7/entity1/versions/b99bbc09dc344645a0b9547ea42062d7/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/d69e314a8f594e9aa62535dc6df75ea2/payload.json),
      [entityC1](iteration-7/entityC1/versions/b6be8bc273f145a5a4f9fe411c3a0184/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-2ce069405489958a/payload.json)'
  - id: entityC2
    label: 'Round-2 critique: kd 0.8'
    notes: 'Critique of the kd 0.4 to 0.8 revision. The main finding is that the 0.13
      oscillation back-off trigger is already exceeded on the s-bend and slalom at
      the iteration 6 baseline, and the expected score band is not derived. Based
      on the iteration 0 and 6 per-track results.


      - [Open this output](iteration-7/entityC2/versions/df2d453350e048c597b640097470937b/payload.json)

      - Based on: [entity1](iteration-7/entity1/versions/b99bbc09dc344645a0b9547ea42062d7/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-2ce069405489958a/payload.json)'
  - id: entity2
    label: kd 0.8 single-factor step
    notes: 'Final design raises kd from the best raced value 0.4 to 0.8, with all
      else unchanged from iteration 6 (score 56.87). Oscillation limits are now set
      per track against measured baselines, and the score gate treats changes under
      about 1 point as seed noise, following the round-2 critique.


      ### Rationale


      Evidence. Iteration 6 is the best raced design (score 56.87). It is iteration
      0 with kd raised from 0.15 to 0.40, a clean single-factor change. Its oval progress
      rose from 0.1355 to 0.1575 and its s-bend progress from 0.1475 to 0.15, while
      slalom stayed at 0.105. Steering oscillation was flat (oval 0.1044 to 0.1047),
      so kd 0.4 showed no measurable noise cost. Every run so far has ended off track,
      and no run has finished.


      What I kept, changed and rejected after the round-2 critique:

      (1) Kept the single-factor step kd 0.40 to 0.80 from the raced iteration 6 design.
      Everything else is identical to iteration 6, so any score change is attributable
      to kd. This is the test the decision rule in my revision called for.

      (2) Accepted that the noise claim was unchecked. I have not computed the derivative-noise
      path, so I do not claim kd 0.8 is safe. I rely on the measurement instead: steering_oscillation
      is reported per track, and I will judge it against each track''s own baseline.

      (3) Accepted that the 0.13 back-off threshold conflicts with the baselines (s-bend
      0.1363 to 0.1382, slalom 0.1445 to 0.1467). The rule is now relative: back off
      kd only if oscillation rises more than 25% above that track''s iteration 6 value
      (oval above about 0.13, s-bend above about 0.173, slalom above about 0.183).

      (4) Accepted that the score gate of 56.87 has no margin against seed spread.
      The oval''s per-trial spread is about 30 points. I judge the result on per-track
      progress first, and treat a three-track mean change under about 1 point as noise.

      (5) Partly accepted the early-failure point. The s-bend progress has been near
      0.15 across most settings, and this design does not test the start. I say so
      openly. A kd gain would not show that the robot can finish.

      (6) Rejected the critique''s suggestion of a lower speed. No evidence shows
      speed is the limit. I keep base_speed 1.5 and ki 0.05, so the test stays clean.

      (7) Slalom is flat at 0.105 across all iterations. No lever here addresses it,
      and I make no claim that this change will move it.


      Expected result: oval and/or s-bend progress above the iteration 6 values (0.1575
      and 0.15), with steering_oscillation within the relative limit above and max_error
      still at about the 0.06 m limit. A three-track mean of about 56 to 60 is plausible,
      but the gain is uncertain.


      Decision rules for the next revision: (a) If progress rises on at least two
      tracks and oscillation is within the relative limit, keep kd 0.8, and consider
      kd 1.2 alone. (b) If progress is unchanged within 0.01 on all tracks, damping
      is not the limit, and the next single test is base_speed alone (1.5 to 1.3 or
      1.7). (c) If oscillation exceeds the relative limit on any track, or the mean
      score falls by more than 1 point, revert kd to 0.4. (d) If progress exceeds
      0.9 with completion 0, raise base_speed by 0.1. (e) If line_loss_events exceeds
      2 on any track, test search_right alone.


      - [Open this output](iteration-7/entity2/versions/7b328b88919e4664b2837496f008bc18/payload.json)

      - Based on: [entity1](iteration-7/entity1/versions/b99bbc09dc344645a0b9547ea42062d7/payload.json),
