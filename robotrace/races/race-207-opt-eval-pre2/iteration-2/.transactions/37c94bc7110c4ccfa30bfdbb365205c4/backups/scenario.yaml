map:
  id: race-207-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Larger sensors, kp 4.5
    notes: 'Draft keeps the best-scoring iteration 0 geometry, enlarges sensor footprints
      to 16 mm to reduce line loss, and raises kp to 4.5 with kd 1.0 and base_speed
      1.5. Based on 120 development trials, all off-track with progress 0.10 to 0.15
      and about one line loss per run.


      ### Rationale


      Evidence: 0 of 120 development trials finished across iterations 0 and 1. Every
      run went off track at progress 0.10 to 0.15, and max_error reached about 0.06
      m, which is the off-track limit (max(0.06, 0.0125 + body_width/4) is 0.06 m
      for any allowed body width). Score is therefore driven almost entirely by how
      far the robot gets before it leaves the tape. Iteration 0 (score 53.0) beat
      iteration 1 (score 50.6). Iteration 1 changed several things at once (wider
      and forward sensors, kp 4.5, kd 1.0, base_speed 1.3, narrower track and lower
      mass), so I cannot attribute its loss to any one change. The s-bend progress
      was identical (0.1475) in both iterations, which suggests a fixed failure point,
      probably an early sharp bend or the start. Line loss happened about once per
      run, so the robot loses the tape at that point and does not recover. Changes
      from iteration 0: (1) sensor_size raised from 0.012 to 0.016 m, so each sensor
      covers more of the 25 mm tape and keeps a reading through the bend, which should
      reduce line-loss events. (2) Sensors kept at the iteration 0 geometry (x = +/-0.04,
      +/-0.02, 0; y = 0.04), so the comparison with iteration 0 stays clean. (3) kp
      raised from 3.0 to 4.5 for a stronger correction on drift, with kd raised from
      0.5 to 1.0 to damp it. (4) ki lowered to 0.02 to avoid windup on bends. (5)
      base_speed lowered from 1.6 to 1.5, a small cut to give the controller more
      time at bends while staying near the speed needed for a 3 s finish. Geometry
      and drivetrain otherwise match iteration 0. Expected result: progress somewhat
      above 0.15 and fewer line-loss events, so a score modestly above 53. Completion
      is still unlikely, because the robot is not yet tracking well enough to cover
      the full course.


      - [Open this output](iteration-2/entity0/versions/70dc69ab4de54dc9ba78a342ba082aa8/payload.json)

      - Based on: [entityR2A](iteration-2/entityR2A/versions/carried-63917e07de5d6273/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Round-1 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-2/entityC1/versions/d01e1b5094594cbc82a6b2b5c4702d2a/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/70dc69ab4de54dc9ba78a342ba082aa8/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-63917e07de5d6273/payload.json)'
  - id: entity1
    label: Iter 0 with bigger
    notes: 'Keeps the best-scoring iteration 0 design and changes only sensor_size
      (0.012 to 0.016), so any change is attributable. Rejects the multi-factor draft,
      following the critique that five or more simultaneous changes cannot be attributed.


      ### Rationale


      Evidence: iteration 0 (score 53.0) is the best design so far. Iteration 1 (score
      50.6) changed ki, kp, kd and base_speed together, and its s-bend result (progress
      0.1475, identical to iteration 0) did not move. The round-1 critique is right
      that my draft changed five or more factors at once (sensor size, sensor offset,
      kp, kd, ki, base_speed, mass and track). With one fixed-seed race per iteration,
      that draft could not be attributed to any cause, so I reject it.


      What I kept, changed and rejected:

      (1) Kept the iteration 0 controller exactly: base_speed 1.5, kp 3.5, ki 0.05,
      kd 0.15, weights [1, 0.5, 0, -0.5, -1], line_loss last_direction. Kept iteration
      0 geometry exactly: sensors at y=0.06, x = +/-0.04, +/-0.02, 0; wheel_track
      0.12, wheel_radius 0.03, mass 0.8, body 0.12 x 0.16.

      (2) Changed one factor only: sensor_size from 0.012 to 0.016. Each sensor covers
      more of the 25 mm tape, so the sum of readings is less likely to fall below
      the 0.05 line-loss threshold on bends. Line loss occurred about once per run
      in all data, so this is the one change with a clear mechanism for reducing it.

      (3) Rejected: the kp, kd, ki and base_speed changes from my draft, the wider
      or forward array, and the mass and track changes. Each is untested in isolation,
      and the critique showed none was tied to a measured signal value or speed.


      Expected result: line_loss_events at or below iteration 0 (about 1.0 per run),
      and progress at or above 0.15. The score should be near or above 53. A result
      below 53 with the same progress would point to the larger footprint overlapping
      the centre signal.


      Decision rule for the next revision: if line_loss_events falls and progress
      rises, keep sensor_size 0.016 and test kp next by itself. If line_loss_events
      is unchanged, sensor_size is not the limit, so revert it and test kp alone.
      If progress exceeds 0.9 with completion 0, raise base_speed by 0.1. If max_error
      exceeds 0.05 with low steering_oscillation, raise kp alone by 0.5.


      - [Open this output](iteration-2/entity1/versions/d989017f97d24368a5e69d9c10de0178/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/70dc69ab4de54dc9ba78a342ba082aa8/payload.json),
      [entityC1](iteration-2/entityC1/versions/d01e1b5094594cbc82a6b2b5c4702d2a/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-63917e07de5d6273/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Round-2 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-2/entityC2/versions/cc92e73b53d54869afe140214bba40fa/payload.json)

      - Based on: [entity1](iteration-2/entity1/versions/d989017f97d24368a5e69d9c10de0178/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-63917e07de5d6273/payload.json)'
  - id: entity2
    label: Offset test, moderate
    notes: 'Keeps the iteration-1 offset test (ki raised to 0.4 from 0.05, kp 4.0)
      but reverts base_speed to 1.5 and softens kd to 0.2, accepting the critique''s
      points on unsupported speed and derivative changes. Geometry is unchanged so
      the race attributes to the controller, and the decision rule is now measurable.


      ### Rationale


      Evidence: the iteration-0 design scored 53.0 with 0 of 60 finishes. Every run
      left the track at progress 0.11 to 0.15, with rms_error 0.025 to 0.031, max_error
      about 0.061 to 0.068, about 1 line loss per run, and low steering_oscillation
      (0.10 to 0.14). Large rms error without jitter suggests a steady lateral offset,
      which a proportional-only controller holds as bias/kp. The integral term is
      the lever for that offset, so I keep the offset test in this design.


      What I kept, changed and rejected, following the round-2 critique:

      (1) Geometry is unchanged from iteration 0. Changing geometry alongside the
      controller would make the result unattributable, and the critique''s sensor-spacing
      points are not yet tested.

      (2) kp stays at 4.0. It is a modest rise from 3.5, and the critique did not
      show it saturates.

      (3) ki is reduced from 0.5 to 0.4, partly accepting the critique''s bend-windup
      concern. At ki 0.4 the integral can reach about 0.8 turn units (about 280 PWM)
      at the clamp, which still tests whether a steady offset can be cancelled. I
      do not yet know the integral''s time weighting, so the sizing is an estimate.

      (4) kd is reduced from 0.3 to 0.2. The oscillation data do not justify doubling
      the derivative, and a smaller kd limits noise amplification. I accept the critique''s
      point that kd 0.3 was unsupported, but I keep a modest rise from 0.15 so the
      damping is not removed.

      (5) base_speed returns to 1.5 from 1.4. The critique is right that the 1.4 cut
      was not shown to help, and failure happens early (progress 0.11 to 0.15), so
      speed is not the evident cause. Completion within 3 s needs real speed, so I
      keep the speed and do not lower it while the tracking question is open.


      Decision rule for the next revision, made measurable: (a) if rms_error stays
      above 0.02 while steering_oscillation is below 0.2, the offset is not fixed,
      so raise ki toward 0.8 with a check on bend overshoot. (b) if steering_oscillation
      rises above 0.2, lower kd or kp first. (c) if progress exceeds 0.9 with completion
      0, raise base_speed by 0.1. (d) lower base_speed only when line_loss_events
      exceeds 2 and max_error exceeds 0.05 together, not on max_error alone. The early
      failure at progress 0.11 to 0.15 on all tracks may point to a start-up transient
      or a shared first bend, which this race will test through progress and max_error.


      Expected result: rms_error and max_error fall if the offset is the cause. Completion
      remains uncertain.


      - [Open this output](iteration-1/entity2/versions/4f5dae794f474f9e85343ed80b3446b8/payload.json)

      - Based on: [entity1](iteration-1/entity1/versions/abb8be593c4a4ba081ec6a8dbd2432d1/payload.json),
