map:
  id: race-207-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Kd 1.8 to 2.5 (damping)
    notes: 'Single-step increase in derivative damping from iteration 7, the first
      design to finish runs (oval 14/20). Geometry, kp, ki and base speed are held
      fixed to isolate the damping effect. Expected to lift s-bend and slalom progress,
      at the cost of higher oscillation.


      ### Rationale


      Evidence: iteration 7 raised kd from 1.2 to 1.8 (base 1.2, kp 3.5, ki 0, iteration-0
      geometry) and became the first design to finish any run. Oval finished 14 of
      20 trials at mean progress 0.97, scoring 774 on that track. The score rose from
      56.9 to 340.5, so damping is the lever that matters. Two problems remain: s-bend
      reaches only 0.42 progress and slalom only 0.18, both ending off track. Oval
      steering oscillation rose to 0.33 from about 0.10, which shows that more damping
      is working but that the robot is still not stable through the sharper sections.
      The trend across kd 0.8, 1.2 and 1.8 is strongly positive, so this draft takes
      one further step: kd 1.8 to 2.5. I keep base_speed at 1.2, kp at 3.5 and ki
      at 0, and keep the geometry identical, so the race isolates the damping effect.
      I expect the s-bend and slalom progress to rise, with oval completion holding
      or improving. Oscillation will likely rise further, and a noise-driven jitter
      penalty is the main risk. If the slalom still ends early, the next step is to
      test line_loss ''search_right'' or a further kd increase.


      - [Open this output](iteration-8/entity0/versions/504472d42cd44ac58d82536007384a9f/payload.json)

      - Based on: [entityR2A](iteration-8/entityR2A/versions/carried-ce064bb3c5459127/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critique of the kd 1.8 to 2.5 draft. It flags that kd is the only clean
      lever so far, but that oscillation has risen to 0.33, derivative noise at kd
      2.5 is unquantified, and the slalom and oval failures are unanalysed. The evidence
      is the iteration 6 to 7 race data and the per-track summaries.


      - [Open this output](iteration-8/entityC1/versions/3afa13ff01854f5b966a8015d2b71c91/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/504472d42cd44ac58d82536007384a9f/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-ce064bb3c5459127/payload.json)'
  - id: entity1
    label: kd 0.8 to 1.1 step
    notes: 'Keeps the raced iteration-7 design (340.5) and changes only kd, from 0.8
      to 1.1, in place of the draft''s kd 2.5. The draft''s baseline was misstated,
      and the critique''s point about an oversized step and unquantified oscillation
      is accepted.


      ### Rationale


      Evidence. The raced baseline is iteration 7 in the outcome table: base_speed
      1.5, kp 3.5, ki 0.05, kd 0.8, sensors at y=0.06 (x = +/-0.04, +/-0.02, 0), 12
      mm, last_direction. It scored 340.50, with oval finishing 14 of 20 at mean progress
      0.973, s-bend progress 0.424 and slalom progress 0.181, both ending off track.
      The round-1 critique is right that my draft''s stated baseline was wrong. The
      draft described iteration 7 as kd 1.8, base 1.2 and sensors at y=0.04, and those
      values were drafts, not raced designs. I rebuild from the raced design.


      What I kept, changed and rejected, following the critique:

      (1) Accepted: kd 2.5 is too large a step from the raced kd 0.8 (a 3x increase),
      with an unquantified noise cost and no peak location. I reject kd 2.5 and take
      a smaller step, kd 0.8 to 1.1 (about 37 percent). This keeps the one-factor
      comparison against iteration 7, and the step is small enough to show whether
      the damping peak lies above 0.8.

      (2) Accepted: the draft changed base_speed and kd together, so its result could
      not be attributed. I keep base_speed 1.5, kp 3.5, ki 0.05 and the iteration-7
      geometry exactly, so any change is attributable to kd alone.

      (3) Rejected: base_speed 1.2. Completion (500 points) is now within reach at
      1.5, since oval finishes 70 percent of trials. Lowering speed would give up
      the largest term to test a speed effect that is not supported by data.

      (4) Partly accepted: slalom has been flat at about 0.105 to 0.18 across designs,
      and this change does not target it. I state that openly rather than predicting
      a slalom gain.

      (5) Accepted: the critique''s call for a stated stopping rule. Below are the
      rules.


      Expected result: oval finish rate holds at or above 0.7, s-bend progress rises
      above 0.42, and steering_oscillation stays near or below 0.33. Oscillation rose
      from about 0.10 to 0.33 across kd 0.4 to 0.8, so it may keep rising. If it rises
      above about 0.40 with oval finish falling, the robot is past the damping peak
      and noise-driven.


      Decision rule for the next revision: keep kd 1.1 if oval finish rate is at least
      0.7 and s-bend or slalom progress rises. If oval finish falls below 0.6 or steering_oscillation
      exceeds 0.40, revert to kd 0.8. If progress rises on every track with oscillation
      flat, test kd 1.4 alone. Judge seeds in pairs, since the disturbance is fixed
      per seed and track and oval scores vary widely.


      - [Open this output](iteration-8/entity1/versions/1f6b83a5bf0e4d3d9bfdb6bd8f28ef78/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/504472d42cd44ac58d82536007384a9f/payload.json),
      [entityC1](iteration-8/entityC1/versions/3afa13ff01854f5b966a8015d2b71c91/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-ce064bb3c5459127/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Round-2 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-8/entityC2/versions/ec3ec596a76143268bbc51d413e941b3/payload.json)

      - Based on: [entity1](iteration-8/entity1/versions/1f6b83a5bf0e4d3d9bfdb6bd8f28ef78/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-ce064bb3c5459127/payload.json)'
  - id: entity2
    label: kd 0.8 single-factor step
    notes: 'Final design raises kd from the best raced value 0.4 to 0.8, with all
      else unchanged from iteration 6 (score 56.87). Oscillation limits are now set
      per track against measured baselines, and the score gate treats changes under
      about 1 point as seed noise, following the round-2 critique.


      ### Rationale


      Evidence. Iteration 6 is the best raced design (score 56.87). It is iteration
      0 with kd raised from 0.15 to 0.40, a clean single-factor change. Its oval progress
      rose from 0.1355 to 0.1575 and its s-bend progress from 0.1475 to 0.15, while
      slalom stayed at 0.105. Steering oscillation was flat (oval 0.1044 to 0.1047),
      so kd 0.4 showed no measurable noise cost. Every run so far has ended off track,
      and no run has finished.


      What I kept, changed and rejected after the round-2 critique:

      (1) Kept the single-factor step kd 0.40 to 0.80 from the raced iteration 6 design.
      Everything else is identical to iteration 6, so any score change is attributable
      to kd. This is the test the decision rule in my revision called for.

      (2) Accepted that the noise claim was unchecked. I have not computed the derivative-noise
      path, so I do not claim kd 0.8 is safe. I rely on the measurement instead: steering_oscillation
      is reported per track, and I will judge it against each track''s own baseline.

      (3) Accepted that the 0.13 back-off threshold conflicts with the baselines (s-bend
      0.1363 to 0.1382, slalom 0.1445 to 0.1467). The rule is now relative: back off
      kd only if oscillation rises more than 25% above that track''s iteration 6 value
      (oval above about 0.13, s-bend above about 0.173, slalom above about 0.183).

      (4) Accepted that the score gate of 56.87 has no margin against seed spread.
      The oval''s per-trial spread is about 30 points. I judge the result on per-track
      progress first, and treat a three-track mean change under about 1 point as noise.

      (5) Partly accepted the early-failure point. The s-bend progress has been near
      0.15 across most settings, and this design does not test the start. I say so
      openly. A kd gain would not show that the robot can finish.

      (6) Rejected the critique''s suggestion of a lower speed. No evidence shows
      speed is the limit. I keep base_speed 1.5 and ki 0.05, so the test stays clean.

      (7) Slalom is flat at 0.105 across all iterations. No lever here addresses it,
      and I make no claim that this change will move it.


      Expected result: oval and/or s-bend progress above the iteration 6 values (0.1575
      and 0.15), with steering_oscillation within the relative limit above and max_error
      still at about the 0.06 m limit. A three-track mean of about 56 to 60 is plausible,
      but the gain is uncertain.


      Decision rules for the next revision: (a) If progress rises on at least two
      tracks and oscillation is within the relative limit, keep kd 0.8, and consider
      kd 1.2 alone. (b) If progress is unchanged within 0.01 on all tracks, damping
      is not the limit, and the next single test is base_speed alone (1.5 to 1.3 or
      1.7). (c) If oscillation exceeds the relative limit on any track, or the mean
      score falls by more than 1 point, revert kd to 0.4. (d) If progress exceeds
      0.9 with completion 0, raise base_speed by 0.1. (e) If line_loss_events exceeds
      2 on any track, test search_right alone.


      - [Open this output](iteration-7/entity2/versions/7b328b88919e4664b2837496f008bc18/payload.json)

      - Based on: [entity1](iteration-7/entity1/versions/b99bbc09dc344645a0b9547ea42062d7/payload.json),
