map:
  id: race-207-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Slower, more damped run
    notes: 'Keeps the best-scoring iteration 0 geometry and tests lower base_speed
      (1.2) with higher kd (1.2) to see whether the fixed s-bend failure at progress
      0.1475 is speed-driven overshoot. Based on 180 trials where no run finished
      and progress was the only score driver.


      ### Rationale


      Evidence: across 180 development trials (iterations 0 to 4) no run finished.
      Every run ended off track at progress 0.04 to 0.15, with max_error pinned at
      the 0.06 m off-track limit. Score is almost entirely progress-driven (about
      250 times progress, plus a small line-quality term), so the goal this iteration
      is to travel further before leaving the tape.


      What the comparisons show: the s-bend progress sat at exactly 0.1475 in iterations
      0, 1, 2 and 4, across different kp, kd, ki, base_speed, sensor size and sensor
      span. Iteration 5 (wider 0.07 m span, 16 mm sensors) also left s-bend progress
      at 0.1475, so sensor span is not the limiting factor. Iteration 3 (kp 2.5, sensors
      at y=0.03) was worst, so lower kp hurts. Iteration 2 (kp 4.5, kd 1.0) did not
      help. Iteration 0 (kp 3.0, kd 0.5, base 1.6, 12 mm sensors) remains best at
      53.0.


      The repeated identical s-bend progress across very different sensor and gain
      settings suggests a fixed event early in the course, most likely a sharp entry
      bend that the robot takes too fast and overshoots. Speed and damping are the
      levers not yet tried cleanly. Iteration 0 is the best baseline, so I keep its
      geometry exactly and change only the controller: base_speed 1.6 to 1.2 to reduce
      overshoot into bends, kd 0.5 to 1.2 for more damping of the faster yaw response,
      and ki kept at 0 with kp at 3.5.


      Expected result: if the fixed failure is speed-driven overshoot, s-bend progress
      should rise above 0.1475 and the score should exceed 53. Completion is very
      unlikely at 1.2 base_speed, since the 3 s limit needs about 1.5 m/s average.
      This run is mainly a diagnostic: if progress rises, the next step is to raise
      speed gradually with the damping kept; if it does not, speed is not the cause
      and the next test should look at the line_loss setting or the sensor count.


      - [Open this output](iteration-6/entity0/versions/5c56849d865f4fd99281506a6486e0c0/payload.json)

      - Based on: [entityR2A](iteration-6/entityR2A/versions/carried-c142ce2fefdb86c1/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Round-1 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-6/entityC1/versions/64dba34130164cac877f9ed6e6daf91a/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/5c56849d865f4fd99281506a6486e0c0/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-c142ce2fefdb86c1/payload.json)'
  - id: entity1
    label: Iter 0 + kd 0.4 only
    notes: 'Returns to the best-scoring iteration 0 design (53.0) and changes only
      kd (0.15 to 0.4), the one untested controller lever, so any score change is
      attributable. The round-1 critique''s point about multi-factor confounding was
      accepted; its base_speed cut and kd 1.2 were rejected as untested or noise-prone.


      ### Rationale


      Evidence: iteration 0 (kp 3.5, kd 0.15, ki 0.05, base 1.5, 12 mm sensors at
      y=0.06, span ±0.04 m, last_direction) is still the best design at 53.02. Across
      240 development trials none finished, and every run left the track at progress
      0.04 to 0.15 with max_error pinned at the 0.06 m limit. The s-bend progress
      stayed at exactly 0.1475 across kp 3.0 to 4.5, kd 0.15 to 1.0, base_speed 1.3
      to 1.6, both sensor sizes, both sensor spans and both masses. Iteration 5 (line_loss
      search_right) scored 52.71, so recovery direction is not the limit. kp 2.5 (35.5)
      and kp 4.0 (50.8) both scored below iteration 0.


      What I accept from the round-1 critique: the draft changed four controller values
      at once (base_speed, kd, kp, ki), so no score change could be attributed. The
      critique is right on this, and I reject the draft as written. I also accept
      that kd 1.2 carries noise-amplification risk, and that the draft''s speed-cut
      diagnostic was not a clean test of anything. I accept that the s-bend point
      does not move with speed, so base_speed 1.2 is not a promising lever for it.


      What I reject from the critique: I keep the base_speed of 1.5 rather than abandoning
      completion. The critique''s point that completion is the largest term is valid,
      but 1.5 is already the speed I have been racing and no design has come close
      to finishing, so changing speed now would confound the test without a clear
      gain.


      What I changed: one factor only, relative to iteration 0. kd goes from 0.15
      to 0.4 (the lower end of the range in my own earlier decision rule, not the
      1.2 of the draft). The rationale for this is that kd has never been tested alone,
      and a moderate damping increase is the one untested controller lever that could
      change how the robot handles the s-bend entry without amplifying noise much.
      Geometry, kp, ki, base_speed and line_loss are identical to iteration 0.


      Expected result: if kd helps, progress on the s-bend rises above 0.1475 and
      the score exceeds 53.0. If the score is within about 0.05 of 53.0 with progress
      unchanged, damping is not the limit and the next single test should be base_speed
      alone (1.5 to 1.3 or 1.7). If the score drops below 53.0, revert kd to 0.15.


      Decision rule for the next revision: keep kd 0.4 only if progress rises on at
      least two tracks. If progress exceeds 0.9 with completion 0, raise base_speed
      by 0.1. If line_loss_events exceeds 2, test search_right alone.


      - [Open this output](iteration-6/entity1/versions/b01725685d5c4a9d9ab6ac71d5e82c89/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/5c56849d865f4fd99281506a6486e0c0/payload.json),
      [entityC1](iteration-6/entityC1/versions/64dba34130164cac877f9ed6e6daf91a/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-c142ce2fefdb86c1/payload.json)'
  - id: entityC2
    label: 'Round-2 critique: kd test'
    notes: 'Critiques the kd 0.15 to 0.4 revision. Main points: the rationale''s own
      evidence shows s-bend progress unchanged across kd 0.15 to 1.0, the derivative
      noise claim ignores the 100 Hz per-second units, and the 0.05 score band is
      smaller than seed spread on the oval.


      - [Open this output](iteration-6/entityC2/versions/9a2e3c3e4c944a11b47b8b780576c720/payload.json)

      - Based on: [entity1](iteration-6/entity1/versions/b01725685d5c4a9d9ab6ac71d5e82c89/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-c142ce2fefdb86c1/payload.json)'
  - id: entity2
    label: kd 0.4 single-factor test
    notes: 'Final design is iteration 0 with only kd raised from 0.15 to 0.4, kept
      because kd has never been tested alone and earlier kd tests were confounded.
      Expected progress gain is judged per track, with steering_oscillation watched
      for noise amplification the critique raised.


      ### Rationale


      Evidence: iteration 0 (kp 3.5, kd 0.15, ki 0.05, base 1.5, 12 mm sensors at
      y=0.06, last_direction) is still the best design at 53.02. Every run in every
      iteration ended off track at progress 0.04 to 0.15. The s-bend progress stayed
      at exactly 0.1475 across kp 3.5 to 4.5, base_speed 1.3 to 1.6 and both sensor
      sizes. Iteration 3 (kp 2.5) cut it to 0.043, so the s-bend is not fully insensitive
      to the controller, and iteration 2 (16 mm sensors) lowered the score to 50.49.


      What I kept, changed and rejected after the round-2 critique:

      (1) Kept the single-factor change from my revision: kd 0.15 to 0.4. Everything
      else equals iteration 0 (geometry, kp 3.5, ki 0.05, base_speed 1.5, weights
      [1, 0.5, 0, -0.5, -1], line_loss last_direction).

      (2) Partly accepted the critique that the s-bend plateau argues against kd.
      The earlier kd values (0.2 with ki 0.4 in iteration 1, and the lumped changes)
      were confounded, so the plateau does not show kd is inert alone. Kd is the one
      controller term never tested by itself, so a clean test is still informative.
      I do not claim it will change the s-bend.

      (3) Accepted the noise concern. Per-step signal changes multiplied by 100 per
      second and by kd 0.4 can produce a derivative term comparable to kp times the
      signal, so kd 0.4 is a real risk to steering jitter. I keep it as a test, with
      steering_oscillation as a watched measurement. If oscillation rises well above
      the baseline 0.10 to 0.14 range, that is evidence of noise amplification and
      the result is reverted.

      (4) Accepted that the 0.05 score band is too narrow. Oval seed spread is 48
      to 75, so I judge the result on per-track progress first, and on the three-track
      mean only when the change exceeds about 1 point.

      (5) Rejected kd 1.2 from the round-1 draft and the base_speed change, which
      remain untested alone and would confound this race. Kept base_speed at 1.5,
      since no evidence shows speed is the limit.


      Expected result: progress on at least one track rises above its iteration 0
      value (s-bend above 0.1475 or oval above 0.1355) with steering_oscillation no
      more than about 1.5 times baseline. Decision rules: (a) if progress rises on
      at least two tracks, keep kd 0.4. (b) If progress is unchanged within 0.01 on
      all tracks and the score is within about 1 point of 53.0, damping is not the
      limit, and the next single test is base_speed alone (1.5 to 1.3 or 1.7). (c)
      If the score falls more than 1 point or oscillation rises sharply, revert kd
      to 0.15. (d) If progress exceeds 0.9 with completion 0, raise base_speed by
      0.1. (e) If line_loss_events exceeds 2, test search_right alone.


      - [Open this output](iteration-6/entity2/versions/ae5bac1591ea4d6da437ea69d53626b7/payload.json)

      - Based on: [entity1](iteration-6/entity1/versions/b01725685d5c4a9d9ab6ac71d5e82c89/payload.json),
