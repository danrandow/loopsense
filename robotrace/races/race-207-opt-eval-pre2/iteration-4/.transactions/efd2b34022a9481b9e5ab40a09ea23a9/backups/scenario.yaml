map:
  id: race-207-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Lower gain, nearer
    notes: 'Draft returns kp to 2.5 and moves the sensor row forward only to y=0.03
      m, to cut overshoot and lag. The evidence is that kp 4.5 scored lower than kp
      3.0 in iterations 1 and 2, and every run went off track at max_error 0.06 m.


      ### Rationale


      Evidence: across 120 development trials (iterations 0 to 2), no run finished.
      Every run ended off track at progress 0.10 to 0.15, and max_error sat at about
      0.06 m, which is the off-track limit (max(0.06, 0.0125 + body_width/4) is 0.06
      m for any allowed body width). The s-bend progress was 0.1475 in every iteration,
      so the failure point is nearly fixed by the track and not by any one setting.
      Steering oscillation is low (0.07 to 0.15), so the robot is not jittering. It
      drifts off the tape in one large excursion, with RMS error of about 0.025 to
      0.03 m, which is about twice the half-width.


      What the comparisons show: iteration 0 (kp 3.0, kd 0.5, base 1.6, 12 mm sensors)
      scored best at 53.0. Iteration 2 raised kp to 4.5 and kd to 1.0, and its score
      fell to 50.5. Iteration 1 also used kp 4.5 and was the lowest at 50.6, although
      it changed several things at once. The most consistent signal is that the higher
      kp did not help, which suggests the robot overcorrects or reacts too late at
      speed.


      Changes: (1) Return kp to 2.5, between the best-scoring 3.0 and the lower value,
      to reduce overshoot. (2) Keep kd at 0.8 to damp the response without the heavier
      derivative of iteration 2. (3) Keep ki at 0.05, the iteration 0 value, since
      the integral has not been shown to matter. (4) Move the sensor row forward only
      to y = 0.03 m, from 0.04 m, to shorten the lag between the sensed line and the
      axle, which is the pivot. (5) Keep the 12 mm sensors and the iteration 0 geometry
      otherwise, and lower base_speed to 1.4 so there is more time to correct on the
      bends. This keeps the change set small and lets the next race attribute any
      gain to the gain and lag changes.


      Expected result: fewer large excursions, so max_error should stay nearer 0.05
      m and progress should rise somewhat above 0.15 on the s-bend. A score in the
      53 to 56 range is plausible. Completion is still unlikely, because the average
      speed needed for the 3 s limit is near 1.5 m/s, and base_speed 1.4 lowers it.
      If progress improves without a finish, the following iteration should raise
      base_speed again.


      - [Open this output](iteration-3/entity0/versions/0f91d996c2d440fab178bed8c513801a/payload.json)

      - Based on: [entityR2A](iteration-3/entityR2A/versions/carried-51d6f1cd1fa0cc7e/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critiques the draft''s five simultaneous changes, the unchanged s-bend
      progress of 0.1475 across all iterations, and the max_error pinned near the
      0.06 m limit. Also flags that the sensor move is described as forward when y=0.03
      moves it back toward the axle.


      - [Open this output](iteration-3/entityC1/versions/521b11fa51b244a68b5c182107f8e0bd/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/0f91d996c2d440fab178bed8c513801a/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-51d6f1cd1fa0cc7e/payload.json)'
  - id: entity1
    label: Single-factor kp test
    notes: 'Reverts to the best-scoring design (iteration 0, score 53.0) and changes
      only kp from 3.5 to 2.5. Evidence: the 16 mm sensor change cost 2.5 points,
      and each higher-kp run scored lower, while the s-bend failure point did not
      move.


      ### Rationale


      Evidence and what I changed.


      (1) Baseline correction. My draft for this iteration treated the iteration-0
      ''received'' values (kp 3.0, kd 0.5, base 1.6, sensors at y=0.04) as the design
      that raced. The outcome table shows the design that raced in iteration 0 was
      kp 3.5, kd 0.15, base 1.5, ki 0.05, sensors at y=0.06, 12 mm. That is the best-scoring
      design (53.02). The draft''s ''iteration 0 is kp 3.0'' premise was wrong, so
      I rebuild from the real baseline.


      (2) What the data show. Across 180 trials (iterations 0 to 2) no run finished.
      Every run left the track at progress 0.10 to 0.15. The s-bend progress was exactly
      0.1475 in every iteration, across kp 3.0 to 4.5, kd 0.15 to 1.0, base 1.3 to
      1.6, and both sensor sizes. Iteration 2 (12 mm to 16 mm sensors, all else as
      iteration 0) fell from 53.0 to 50.5, and oval progress dropped from 0.1355 to
      0.115. So the 16 mm footprint is the one change with a clean measured loss,
      and I revert it. Iteration 1 changed five or more factors at once and cannot
      be attributed.


      (3) Accepted from the critique: the draft changed five parameters at once and
      could not attribute any result. The critique is right that the sensor y change
      in my draft moved the row toward the axle, not forward, and that its mechanism
      is too small to test. I drop that change. I also accept that a single fixed-seed
      race per iteration can only support one-factor comparisons.


      (4) Rejected from the critique: I do not switch to a much lower speed for a
      conservative start. The objective is worth 500 points for completion, and the
      data show no evidence that speed is the limit. Base speed stays at 1.5.


      (5) This iteration''s single change: kp 3.5 to 2.5, all else exactly as the
      best iteration (kd 0.15, ki 0.05, base 1.5, sensors y=0.06, x=+/-0.04/0.02/0,
      12 mm, geometry unchanged). Reason: kp has been raised in every run that scored
      lower (kp 4.0 scored 50.6, kp 4.5 scored 50.5), which is consistent with overcorrection,
      and the s-bend failure point did not move with kp. The result is attributable
      to kp alone.


      Decision rule for the next revision. If progress or score rises above 53.0 with
      the same line_loss_events, keep kp 2.5 and next test kd alone (0.15 to 0.4).
      If progress falls or the score drops below 53.0, revert kp to 3.5 and test kd
      alone instead. If progress stays at 0.1475 on the s-bend, the failure point
      is not set by kp, and the next test should be line_loss, changing last_direction
      to search_right for a single race.


      Expected result: the score stays near 53, with progress within about 0.01 of
      the baseline. A large gain is not expected from one gain change. This is a clean
      experiment to locate the lever.


      - [Open this output](iteration-3/entity1/versions/cb940811e0b84f0bbcbe7a829c24b0ba/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/0f91d996c2d440fab178bed8c513801a/payload.json),
      [entityC1](iteration-3/entityC1/versions/521b11fa51b244a68b5c182107f8e0bd/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-51d6f1cd1fa0cc7e/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Critiques the kp 3.5 to 2.5 revision. The main finding is that the rationale''s
      claim that kp rose in every lower-scoring run is false, since iteration 2 scored
      lower with kp unchanged. The critique also notes that the s-bend failure is
      insensitive to all tested gains and that the shared early failure point is not
      examined.


      - [Open this output](iteration-3/entityC2/versions/5bbfc24695cd4b20b97b92a8b0d6e2c9/payload.json)

      - Based on: [entity1](iteration-3/entity1/versions/cb940811e0b84f0bbcbe7a829c24b0ba/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-51d6f1cd1fa0cc7e/payload.json)'
  - id: entity2
    label: kp 2.5 one-factor probe
    notes: 'Final design is the iteration-0 baseline with kp lowered from 3.5 to 2.5
      and nothing else changed, so the result is attributable to kp alone. The rationale
      retracts the critique-flagged false claim about kp in lower-scoring runs and
      states a three-track decision rule with a pre-set direction for rms and max
      error.


      ### Rationale


      Evidence. Iteration 0 is still the best design (score 53.02). Its 60 trials
      all ended off track, and the s-bend progress was 0.1475 in every iteration tested,
      across kp 2.5 to 4.5, kd 0.15 to 1.0, base speed 1.3 to 1.6 and both sensor
      sizes. The critique is right that the draft''s claim that kp was raised in every
      lower-scoring run is wrong. Iteration 2 kept kp 3.5 and changed only sensor
      size, so the kp ''overcorrection'' argument has no direct support. I therefore
      do not present kp 2.5 as a likely improvement. I keep it only as a clean one-factor
      probe, because the s-bend failure point has not moved under any gain change,
      and a clean test is the only way to learn whether kp sets it.


      What I kept, changed and rejected after the round-2 critique:

      (1) Kept the single change kp 3.5 to 2.5. All other values equal iteration 0:
      kd 0.15, ki 0.05, base_speed 1.5, line_loss last_direction, weights [1, 0.5,
      0, -0.5, -1], sensors at y=0.06 with x at +0.04, +0.02, 0, -0.02, -0.04, sensor_size
      0.012, and unchanged geometry. This is attributable to kp alone.

      (2) Retracted the ''kp raised in every lower run'' premise. I changed the rationale,
      not the design, to say so.

      (3) Accepted the critique''s point that a lower kp could increase steady lateral
      error, so the result can go either way. I now state the direction in advance.
      On the oval, rms_error and max_error should not fall; if they rise with progress
      flat, kp was supplying needed correction and I revert.

      (4) Rejected the speed cut for now. Completion needs about 1.5 m/s average,
      and nothing has shown speed is the limit. This is a judgement, and I say so.
      Speed will be tested alone after the kp result if the failure point stays fixed.

      (5) Accepted that the decision rule must name the track and metric. The oval
      alone moved in iteration 2, so a score change driven by the oval does not count
      as a general gain.


      Decision rule for the next revision. Use the three-track mean score and the
      s-bend progress. (a) If the s-bend progress rises above 0.1475, or the three-track
      mean score rises above 53.0 with no oval-only driver, keep kp 2.5 and test kd
      alone (0.15 to 0.4). (b) If the s-bend progress is 0.1475 and the score falls
      below 53.0, revert kp to 3.5 and test kd alone. (c) If the s-bend progress stays
      at 0.1475 with the score unchanged, kp does not set the failure point. The next
      test is line_loss, changing last_direction to search_right for one race.


      Expected result: score within about 0.5 of 53.0 and s-bend progress at 0.1475.
      A large gain is not expected from one gain change; the purpose is to locate
      the lever.


      - [Open this output](iteration-3/entity2/versions/5ce7f387284a47889109802cdc0ed954/payload.json)

      - Based on: [entity1](iteration-3/entity1/versions/cb940811e0b84f0bbcbe7a829c24b0ba/payload.json),
