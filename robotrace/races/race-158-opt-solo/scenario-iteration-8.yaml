  entities:
  - id: entity0
    label: Lighter robot, mass 0.4
    notes: 'Reverts to the iteration-6 design, which scored 680 with oval and s-bend
      completions, after iteration 7''s wider spread collapsed to 90. The only change
      is mass 0.5 to 0.4 kg, to improve agility at the slalom''s sharp turns, based
      on the trend that lower mass and higher kd helped in iterations 3 to 6.


      ### Rationale


      Evidence: iteration 7 regressed sharply (score 89.8, from 680.0). Its only changes
      were kp 5.5 to 6.0 and the sensor spread widened from +/-0.06 m to +/-0.08 m.
      The oval and s-bend went from full completion to 0 finishes, so that candidate
      is rejected. Iteration 6 (score 680.0) is the stable base: oval 20/20 at 2.08
      s, s-bend 20/20 at 2.61 s, slalom 0/20 with progress 0.42 and every failure
      off track. Iteration 5 (score 680.3) is equivalent in score, so the geometry
      and controller of iteration 6 are the reference. Across iterations 3 to 6, lowering
      mass (0.6 to 0.5) and raising kd both reduced steering oscillation and raised
      slalom progress. The remaining slalom failure is leaving the tape at sharp direction
      changes, which points to yaw inertia and turn agility rather than damping alone.
      Change, kept to one lever: mass 0.5 to 0.4 kg, the minimum allowed. This lowers
      yaw inertia and should speed the response at sharp slalom turns. Everything
      else is reverted to the iteration-6 geometry (sensors at y=0.08, x = -0.06 to
      +0.06, sensor_size 0.016, wheel_track 0.10, body 0.16 x 0.12). Controller: kp
      5.5, ki 0, kd 2.5, base_speed 1.0, line_loss last_direction. Expected result:
      slalom progress above 0.5 with some finishes, oval and s-bend completion held
      (oval time about 2.1 s, s-bend about 2.6 s, both within the 3 s limit), and
      steering_oscillation at or below about 0.3. Hypotheses: H1, lower mass improves
      slalom response, shown by slalom progress and line_loss_events improving over
      iteration 6. H2, if the lighter robot oscillates more on the s-bend, steering_oscillation
      will rise above 0.2 and kd will need to go higher, which would mean the damping
      limit is near. H3, if the slalom still fails at its first sharp turn with no
      change, the limit is authority or sensor reach, and the next lever is kp or
      the sensor geometry, not mass. Next measurements: progress and completion_time
      for speed versus stability, max_error and line_loss_events for stability, steering_oscillation
      for damping, control_effort for gain cost, and noise_robustness for margin on
      held-back tracks.


