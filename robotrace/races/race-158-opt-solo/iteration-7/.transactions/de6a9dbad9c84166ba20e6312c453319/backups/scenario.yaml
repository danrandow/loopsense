  - id: entity0
    label: kd 2.5 damping test
    notes: 'Raises kd from 2.0 to 2.5 on the iteration-5 geometry, the only change.
      Oscillation fell as kd rose across iterations 3 to 5, and slalom progress (0.50)
      and line-loss events (0.75) show the sharp bends are still the failure point.
      Evidence is 60 development trials per iteration.


      ### Rationale


      Evidence from iteration 5 (score 680.3, best so far): the oval finishes on all
      20 trials (mean 2.14 s, progress 0.997). The s-bend finishes 19 of 20 (progress
      0.985). The slalom still never finishes (0 of 20; 17 off-track, 3 timeouts),
      though its progress rose from 0.27 to 0.50 after sensor_size went from 0.012
      to 0.016 m. Slalom steering oscillation rose to 0.29 and its line-loss events
      fell to 0.75, so the larger footprint helped. The remaining slalom failure is
      leaving the tape on sharp direction changes, and some runs are too slow to finish
      inside 300 steps. Changes, kept to one lever: kd 2.0 to 2.5. Iteration 3 to
      5 showed that more kd lowered oscillation on the bends (kd 1.0 to 2.0 took s-bend
      oscillation from 0.28 to 0.18), so damping is still limiting. Geometry, kp 5.5,
      ki 0, base_speed 1.0 and line_loss last_direction are unchanged, so the effect
      of kd can be read directly. Expected result: slalom progress above 0.6 and some
      slalom completions, with s-bend and oval completion held. Hypotheses: H1, kd
      still limits the sharp bends, shown by steering_oscillation falling below 0.25
      on the slalom and max_error staying under 0.06 on more seeds. H2, the slalom
      timeouts come from a slow response at the sharp turns, shown by completion_time
      and progress on the slalom. H3, if kd 2.5 slows the response too much, the oval
      finish time will rise above 2.3 s and slalom progress will stall, which would
      mean kd is near its useful limit. Next measurements: progress and completion_time
      (speed versus stability), max_error and line_loss_events (stability), steering_oscillation
      (damping), control_effort (gain cost), noise_robustness (margin on held-back
      tracks).


