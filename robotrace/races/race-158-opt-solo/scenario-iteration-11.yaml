  - id: entity0
    label: Iter 8 design
    notes: 'Resubmits the best raced design (iteration 8, score 690.5) unchanged,
      because later single-lever changes regressed or did not improve it. Oval and
      s-bend finish 20/20 each; slalom remains the weak point at 0/20 (progress 0.52).


      ### Rationale


      Iteration 8 is the best raced design (690.5). It finishes the oval 20/20 (2.41
      s) and the s-bend 20/20 (2.79 s), with slalom at 0/20 (progress 0.52, 17 off-track,
      3 timeouts). Every later change either regressed or gave no clear gain. Iteration
      7 (kp 6.0 with a wider sensor spread) collapsed the oval and s-bend to 0 finishes.
      Iteration 9 (wheel_track 0.09) scored 676, and iteration 10 (kd 2.2) scored
      685, both below iteration 8. With no further iteration after this one, a single
      untested change to the final design carries real risk on the unseen track, so
      I am resubmitting the iteration-8 geometry and controller unchanged. Its evidence
      is 60 trials, with 40 of 40 finishes on the two bend-heavy tracks it can complete.
      The main weakness is the slalom, where failures are off-track exits at sharp
      direction changes (max_error about 0.06 m). If it were possible to test further,
      the next levers would be a lower base_speed on tight sections or a modest kd
      change, but I am not changing them here. Expected result: the same score as
      iteration 8, about 690 on the development tracks. Hypotheses: H1, the design
      is stable across seeds, shown by oval and s-bend completion holding at 100%.
      H2, the slalom remains the limit, shown by progress staying near 0.5. Measurements
      requested: completion, progress and completion_time for speed versus finishing,
      max_error and line_loss_events for stability, steering_oscillation for damping,
      and noise_robustness for margin on the unseen track.


