  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'Baseline candidate with five sensors spanning ±40 mm, proportional steering
      (kp 1.5, kd 0.05) and base speed 1.6 to target a sub-3 s finish. No race data
      exists yet, so values come from the contract alone; the next iteration should
      adjust kp and speed from the measured oscillation and completion time.


      ### Rationale


      Iteration 0 has no race telemetry, so this is a conservative baseline built
      from the contract. Geometry: five line sensors spread across the centre line
      at x = -0.04, -0.02, 0, 0.02, 0.04 m (positive = left), all at y = 0.05 m ahead
      of the axle so they read the line before the wheels reach it. The 12 mm footprint
      is wider than the 8 mm option, so the sensors keep reading the 25 mm tape through
      small lateral wobble. Wheel track 0.12 m and radius 0.03 m give a moderate turn
      authority. Body width 0.12 m keeps the off-track limit at max(0.06, 0.0125 +
      0.03) = 0.06 m, which is the binding limit. Mass 0.8 kg with a 0.16 m body keeps
      yaw inertia modest, so the robot can turn quickly. Controller: weights are proportional
      to sensor x (-2, -1, 0, 1, 2), so the signal scales with lateral offset and
      the sign steers toward the tape. kp = 1.5 gives a turn of about 262 PWM per
      unit of signal, enough to correct offsets without saturating. ki = 0 avoids
      integral windup on curves. kd = 0.05 adds mild damping. base_speed = 1.6 (about
      80 percent PWM) targets the roughly 1.5 m/s average needed to finish within
      3 s. line_loss = last_direction, so the robot turns back toward the side it
      last saw the line. Expected result: completion on the oval and s-bend, with
      slalom the likeliest place to show oscillation or line loss. Next measurements:
      completion_time and progress to check the speed margin, line_loss_events and
      max_error to test whether the gain is adequate on tight bends, and steering_oscillation
      to test whether kd is too small.


      - [Open this output](iteration-0/entity0/versions/f8798883d07942c5974bceb0aa3d3bab/payload.json)'
