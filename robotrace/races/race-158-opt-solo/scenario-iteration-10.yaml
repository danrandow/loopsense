  entities:
  - id: entity0
    label: Iter 8 with kd 2.2
    notes: 'Starts from the best raced design (iteration 8, 690.5) and reverts the
      wheel_track change from iteration 9, then lowers kd from 2.5 to 2.2 to test
      whether less damping helps the slalom''s sharp turns. Iteration 5 vs 6 showed
      slalom progress falling as kd rose, and the oval and s-bend have time margin
      to absorb it.


      ### Rationale


      Evidence: iteration 8 (mass 0.4, wheel_track 0.10, kp 5.5, kd 2.5, sensors at
      y=0.08, x=-0.06..0.06, sensor_size 0.016) is the best raced design at 690.5.
      Oval finishes 20/20 (2.41 s), s-bend 20/20 (2.79 s), slalom 0/20 (progress 0.52,
      17 off-track, 3 timeouts). Iteration 9 narrowed wheel_track to 0.09 and scored
      676, so the narrower track did not help and is reverted. Iteration 7 (kp 6.0
      with sensor spread +/-0.08) collapsed the oval and s-bend, so that spread and
      kp change is rejected. Across iterations 5 to 8, slalom progress was best with
      lower kd: kd 2.0 gave slalom progress 0.50 versus 0.42 at kd 2.5 (iteration
      5 vs 6), while kd 2.5 gave s-bend 20/20 versus 19/20. The slalom is failing
      by leaving the tape at sharp direction changes, and high kd may be slowing the
      response there. Change, kept to one lever: kd 2.5 to 2.2 on the iteration-8
      design, with geometry otherwise unchanged (wheel_track back to 0.10, mass 0.4).
      Expected result: slalom progress rising toward 0.55 to 0.6, oval and s-bend
      completion held, and steering_oscillation rising only modestly from the 0.12
      to 0.15 (oval) and 0.15 to 0.2 (s-bend) range. Hypotheses: H1, lower kd improves
      slalom progress at sharp turns, shown by slalom progress above 0.55 and off-track
      events falling. H2, lower kd lets s-bend oscillation rise, shown by s-bend steering_oscillation
      above 0.2 or s-bend finishes dropping below 20/20; if so, kd should return to
      2.5. H3, if slalom progress is unchanged, the limit is authority or speed at
      the sharp turn, and base_speed on the slalom is the next lever. Next measurements:
      progress and completion_time (speed versus stability), max_error and line_loss_events
      (stability), steering_oscillation (damping), control_effort (gain cost), and
      noise_robustness (margin on held-back tracks).


