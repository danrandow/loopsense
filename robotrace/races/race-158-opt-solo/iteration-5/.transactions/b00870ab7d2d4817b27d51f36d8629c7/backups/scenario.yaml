  entities:
  - id: entity0
    label: Larger sensors, kd 2.0
    notes: 'Raises kd from 1.5 to 2.0 to keep damping the bend oscillation, and enlarges
      sensor footprints from 12 mm to 16 mm to reduce line-loss events. Based on iteration
      4 (score 506), where kd and mass changes improved slalom progress and oval finish
      rate.


      ### Rationale


      Evidence from iteration 4 (score 505.8, best so far): the oval now finishes
      on all 20 trials (mean 2.10 s, so there is time margin under 3 s). The s-bend
      finishes 20% of runs and the slalom 0%. Every failure is off_track at max_error
      about 0.06 m, the binding limit. Steering oscillation is 0.19 (oval) to 0.26
      (s-bend), and it fell as kd rose from 1.0 to 1.5 and mass fell from 0.6 to 0.5.
      Slalom progress rose from 0.20 to 0.27. That supports the view that damping
      and turn agility, not raw speed, limit the bends. Speed is kept at base_speed
      1.0 because the oval''s time margin is small on tight sections and off-track
      exits dominate the score.


      Changes, kept to two levers: (1) kd 1.5 to 2.0, to continue the damping trend
      that reduced oscillation and raised slalom progress. (2) sensor_size 0.012 to
      0.016 m, so each footprint covers more tape at large lateral offsets. This should
      reduce the line-loss events (about 0.8 to 1.0 per run) that begin just before
      each off-track exit. Geometry positions, mass 0.5, wheel_track 0.10, kp 5.5,
      ki 0, base_speed 1.0 and line_loss last_direction are unchanged.


      Expected result: s-bend finish rate above 25%, slalom progress above 0.3, line_loss_events
      below 0.8, and oval completion held at or near 100%. Hypotheses: H1, kd is still
      the limit on bends, shown by steering_oscillation falling below 0.18 with max_error
      staying under 0.06 on more seeds. H2, the larger footprint reduces line loss
      at the first sharp direction change, shown by line_loss_events falling. H3,
      if the signal becomes too noisy or overshoots, steering_oscillation will rise
      above 0.25 and control_effort will climb, meaning kd or sensor_size has gone
      too far. Next measurements: progress and completion_time for speed versus stability,
      max_error and line_loss_events for stability, steering_oscillation for damping,
      control_effort for gain cost, and noise_robustness for margin on held-back tracks.


