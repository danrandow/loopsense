  entities:
  - id: entity0
    label: Narrower track, turn gain
    notes: 'Reverts to the iteration-8 best (score 690.5) and narrows wheel_track
      from 0.10 to 0.09 m to add turn authority for the slalom''s sharp bends. Oval
      and s-bend completion (20/20 each) should hold; slalom progress (0.52) is the
      target.


      ### Rationale


      Evidence: iteration 8 (mass 0.4 kg) is the best so far at 690.5. Oval finishes
      20/20 (2.41 s), s-bend 20/20 (2.79 s), and slalom 0/20 with progress 0.52, 17
      off-track and 3 timeouts. Iteration 8 is the reference because it has the highest
      score and the best slalom progress so far. Mass 0.5 to 0.4 slowed the oval and
      s-bend finish times, so mass is not the lever that limits the bends. Slalom
      failures are still off-track at max_error about 0.06 m, so the remaining limit
      is turn authority at sharp direction changes. Change, kept to one lever: wheel_track
      0.10 to 0.09 m (within the 0.08 to 0.18 range). For the same PWM difference
      this gives a larger turn rate, which is the same authority gain that the earlier
      kp increases tried to provide. kp 5.5 and kd 2.5 are unchanged because kp 6.0
      with a wider sensor spread (iteration 7) regressed sharply, and kd is near its
      useful limit. Mass stays at 0.4 since it is at the allowed minimum and reverting
      it adds no information. Expected result: slalom progress above 0.6 with a few
      finishes or fewer timeouts, oval and s-bend completion held at 100%, and steering_oscillation
      at or below about 0.3. Hypotheses: H1, the narrower track raises turn authority
      at sharp slalom bends, shown by slalom progress and line_loss_events improving.
      H2, if the narrower track overshoots, steering_oscillation rises above 0.3 and
      s-bend max_error approaches 0.06, which would mean authority is now too high
      and wheel_track should go back toward 0.10 with kd raised. H3, if slalom timeouts
      persist with the same progress, the limit is speed, and base_speed on slalom
      is the next lever. Next measurements: progress and completion_time for speed
      versus stability, max_error and line_loss_events for stability, steering_oscillation
      for damping, control_effort for gain cost, and noise_robustness for margin on
      held-back tracks.


