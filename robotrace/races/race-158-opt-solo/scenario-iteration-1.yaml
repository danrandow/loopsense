  entities:
  - id: entity0
    label: Stiffer steer, damped
    notes: 'Raised kp from 1.5 to 3.0 and kd to 0.2 and lowered base_speed to 1.3,
      because the baseline left the track at max_error of about 0.06 m on every trial.
      Geometry is unchanged so the controller effect is isolated; the next race will
      show whether the robot stays on the line.


      ### Rationale


      Evidence from the development simulator (60 trials, 0 finishes): every run ended
      off track. Progress was only 0.03 to 0.12, max_error sat at about 0.061 m (the
      0.06 m off-track limit), and each run recorded one line-loss event. The robot
      is leaving the tape early and does not recover. Steering oscillation is low
      (about 0.07), so the problem is not jitter. The likely cause is that the correction
      is too weak for the bends at this speed. kp = 1.5 gives a turn of only about
      1.5 x 350 PWM per unit of signal, and the signal is a weighted average that
      shrinks when only the outer sensors see tape. The robot reaches the limit before
      it can turn back.


      Changes: (1) kp 1.5 -> 3.0, roughly doubling steering authority so that a small
      lateral offset produces a faster correction. (2) kd 0.05 -> 0.2, adding damping
      so the stronger proportional term does not overshoot across the line. (3) base_speed
      1.6 -> 1.3, giving the stronger steering more time to act at each bend. This
      costs some speed, so the 3 s finish may be marginal. I will treat completion
      as a secondary goal and first confirm that the robot stays on the line. (4)
      Geometry unchanged, so the effect of the controller change is isolated. ki stays
      0 to avoid windup on curves. line_loss stays last_direction, so the robot returns
      toward the side it last saw.


      Expected result: fewer off-track exits, max_error below 0.06 on most seeds,
      and progress well above the baseline 0.12. A finish is possible but not assured.
      Hypotheses to test: H1, the baseline failure is insufficient kp, shown by max_error
      falling and line_loss_events dropping to 0 or 1. H2, the speed is too high for
      the bend radius, shown by off-track exits concentrated on tight sections. H3,
      kd is too small or too large, shown by steering_oscillation. Next measurements:
      progress and completion_time to see whether speed or stability is limiting,
      max_error and line_loss_events for stability, steering_oscillation for damping,
      and control_effort to check that the gain is not excessive.


