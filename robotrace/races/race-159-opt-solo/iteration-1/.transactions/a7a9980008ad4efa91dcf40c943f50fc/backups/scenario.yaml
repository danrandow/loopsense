  entities:
  - id: entity0
    label: Wider sensors, softer
    notes: 'Widened the sensor array to ±0.04 m so the line stays visible at larger
      offsets, and lowered kp and base_speed while raising kd for damping. The change
      responds to development runs where all 60 trials ran off track with max_error
      at the 0.06 m limit and 1 to 2 line-loss events.


      ### Rationale


      Evidence from the development runs: all 60 trials went off track (0 finishes).
      Progress stalled at 0.10 to 0.16, max_error was about 0.06 m (the off-track
      limit), and line_loss_events reached 1 to 2. Steering oscillation was 0.09 to
      0.14. The main failure is that the five sensors span only ±0.02 m. Once the
      line drifts about 3 cm from centre, it leaves the sensor array, the robot loses
      the line, and it runs off. Signal scale is about x_line/0.02, so kp=2.5 gives
      a turn of roughly 2.5 per 2 cm offset, which is aggressive. The combined effect
      is overshoot and oscillation followed by loss. Changes: (1) Widen the sensor
      array to ±0.04 m (five sensors at -0.04, -0.02, 0, 0.02, 0.04) so the line stays
      visible at larger offsets, and move the sensors to y=0.05 to give more lead.
      (2) Scale the weights to x/0.04, giving (-1, -0.5, 0, 0.5, 1), so the signal
      stays in the same range. (3) Reduce kp from 2.5 to 2.0 to soften the overshoot.
      (4) Raise kd from 0.3 to 0.6 for more damping of the oscillation. (5) Reduce
      base_speed from 1.3 to 1.1 so the robot can track bends before it leaves the
      line. The cost is a slower lap, but the first goal is to finish and stay on
      the line. (6) Lower mass to 0.6 kg to reduce yaw inertia and improve response.
      Expected result: no off-track events on the oval and s-bend, fewer line-loss
      events, and oscillation below 0.1. The slalom may still be the hardest track.
      Next iteration: if max_error is still near 0.06 with few line losses, the cause
      is steering lag, so kd or kp needs more change. If line losses dominate, widen
      the array further or lower base_speed. Once the robot finishes, raise base_speed
      to meet the 1.5 m/s needed to complete within 3 s.


