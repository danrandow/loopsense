  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'Initial conservative baseline with no race data yet: five sensors at 10
      mm spacing, proportional-plus-light-derivative steering and moderate base speed
      1.3. Expected to complete the oval and s-bend, with the slalom the likeliest
      source of line loss.


      ### Rationale


      Iteration 0 has no race telemetry, so this is a conservative baseline meant
      to finish the course, stay on the line and produce usable measurements. Geometry:
      five line sensors spaced 10 mm apart across x = -0.02 to +0.02 m, all at y =
      0.04 m ahead of the axle. That spacing is a little wider than the 25 mm tape,
      so at least one or two sensors always see the line, and the sensors sit ahead
      of the axle so steering reacts before the wheels reach the error. Sensor size
      12 mm is a middle choice between noise robustness and resolution. Wheel track
      0.12 m, radius 0.03 m and mass 0.8 kg are mid-range values for a stable, agile
      body. Controller: sensor weights are proportional to sensor x (-1, -0.5, 0,
      0.5, 1), so the signal is the reading-weighted lateral position of the tape,
      with positive meaning left, matching the steering convention. kp = 2.5 gives
      a moderate turn response (about 875 PWM counts per unit of signal). kd = 0.3
      damps oscillation without amplifying sensor noise much. ki = 0 avoids integral
      windup on curves. base_speed = 1.3 gives about 65% of full PWM, which should
      average near the 1.5 m/s needed to finish within 3 s while leaving margin before
      the robot leaves the line on tight bends. line_loss = last_direction keeps the
      robot searching toward the side it last saw the tape. Expected result: completion
      on the oval and s-bend, with some oscillation or slight line loss on the slalom.
      The next iteration should adjust kp/kd from the measured steering_oscillation
      and max_error, and base_speed from completion_time and line_loss_events.


      - [Open this output](iteration-0/entity0/versions/83b908ebb54c4f0aaab86b4ae4520016/payload.json)'
