  entities:
  - id: entity0
    label: Wider 7-sensor array
    notes: 'Widens the sensor array to ±0.06 m with seven sensors and keeps the steering
      gain (weights scaled to x/0.04, kp 2.0). Iteration 1 failed by drifting off
      the five-sensor array on s-bend and slalom, so this aims to cut line losses
      and off-track ends.


      ### Rationale


      Evidence: iteration 1 (score 368.9) finished 16/20 oval runs, but only 1/20
      s-bend and 0/20 slalom. Every failure was off_track, with max_error about 0.06
      m (the off-track limit) and 1 to 2 line-loss events. The oval shows speed is
      adequate (about 1.8 s), so the problem is tracking, not pace. Failures happen
      when the line drifts past the five-sensor array (+/-0.04 m). Once it leaves
      the array, the robot loses the line, searches, and runs off. Changes: (1) Widen
      the array to seven sensors at x = -0.06 to +0.06 in 0.02 m steps, all at y =
      0.05. With 12 mm sensors and 25 mm tape, a sensor always overlaps the tape across
      this span, so line loss should be rare. (2) Scale weights to x/0.04, giving
      (-1.5, -1.0, -0.5, 0, 0.5, 1.0, 1.5). This keeps the steering gain per metre
      of offset the same as iteration 1, so kp stays at 2.0 and the proven gain is
      not disturbed. (3) Keep kd at 0.6 because oscillation was low (0.35) and the
      damping seems adequate. (4) Lower base_speed from 1.1 to 1.0 to give the robot
      more time to correct on bends. The cost is a slightly slower lap, which is a
      small part of the score. Mass, wheel geometry and line_loss (last_direction)
      stay the same to limit confounding. Expected result: no line losses on the s-bend
      and slalom, fewer off-track ends, and s-bend finish rate well above 5%. Hypotheses
      to test next: (a) if max_error stays near 0.06 with few line losses, steering
      lag is the limit, so raise kd or kp; (b) if line losses persist on the slalom,
      the search behaviour or array reach is the limit; (c) if the robot finishes
      but completion_time exceeds 3 s, raise base_speed back toward 1.3 to 1.5 once
      completion is reliable.


