  entities:
  - id: entity0
    label: Iter 4 geometry, speed
    notes: 'Reverts the geometry to the best-scoring iteration 4 (663.5) after iteration
      6 regressed, and lowers base_speed from 1.0 to 0.85 as the single change to
      test whether slalom off-track failures are speed-limited. The oval has time
      margin to finish within 3 s.


      ### Rationale


      Evidence: iteration 4 (663.5) is the best design. Its oval is solved (20/20,
      about 1.8 s), the s-bend finishes 19/20, and the slalom fails 20/20 off-track
      at progress 0.32 with max_error about 0.064. Iteration 6 (644.3) changed three
      things at once (narrower track 0.09, mass 0.5, sensors at y=0.08) and scored
      lower. Its oval line-loss events rose to 1.0 and its s-bend finishes fell to
      18/20, so those changes did not help and I am reverting them. Steering-gain
      increases (iteration 5, kp 3.0) also gave only a small slalom gain (0.32 to
      0.35), and oscillation stays low (about 0.2 to 0.3), so the robot is not jittering.
      The slalom failure is therefore most likely speed-limited: at base_speed 1.0
      the robot enters fast alternating bends too quickly to correct within the 0.06
      m limit. Change: revert geometry to iteration 4 (wheel_track 0.10, mass 0.6,
      seven sensors at y=0.07, x from -0.08 to 0.08, weights x/0.04) and keep kp 2.6,
      kd 0.9, ki 0 and last_direction line loss. Lower base_speed from 1.0 to 0.85
      as the only change. Expected result: slalom progress rises above 0.4 with fewer
      off-track ends, s-bend finish rate stays at or above 0.9, and the oval still
      finishes with completion_time about 2.2 to 2.5 s, which is inside the 3 s limit.
      Hypotheses for the next race: (a) if the slalom still ends near progress 0.35
      with similar max_error, speed is not the main limit, so the next step is line_loss
      search_right or a different sensor reach; (b) if the oval completion_time exceeds
      2.6 s, base_speed should go back up to about 0.95; (c) if line_loss_events on
      slalom fall below 0.3 while progress stays low, the limit is steering authority
      and kp should rise toward 3.0 with kd 1.0 or more.


