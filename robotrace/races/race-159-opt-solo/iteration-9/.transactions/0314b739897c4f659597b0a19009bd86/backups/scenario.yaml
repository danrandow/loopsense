  entities:
  - id: entity0
    label: Stiffer steer, 16mm
    notes: 'Keeps the 16 mm sensor footprint that lifted slalom progress from 0.31
      to 0.42 and raises kp 2.6 to 3.2 with kd 1.1 for more slalom correction. Oval
      and s-bend were fully finished at 690 score, so their damping margin is used
      to test whether slalom off-track failures can be cut.


      ### Rationale


      Evidence from iteration 8 (score 690.4, best so far): the oval (20/20, about
      1.86 s) and s-bend (20/20, about 2.06 s) are both solved. The slalom still fails
      20/20 by off_track, but progress rose from 0.31 to 0.42 and line_loss_events
      fell to 0. The larger 16 mm sensor footprint therefore helped, and the line
      is no longer being lost. The remaining slalom failure is the robot drifting
      past the 0.06 m limit on fast alternating bends while still on the tape. Steering
      oscillation is low (0.16 oval, 0.27 slalom), so the robot is not jittering and
      has margin for more correction. Earlier, kp 3.0 with kd 1.1 gave only a small
      slalom gain (0.32 to 0.35), but that was with 12 mm sensors and a poorer signal.
      With the 16 mm footprint, the signal is smoother and stronger steering should
      now be more usable. Change: raise kp from 2.6 to 3.2 for more correction authority,
      and raise kd from 0.9 to 1.1 so damping keeps pace with the larger proportional
      term. Geometry, sensor weights, base_speed 0.85, ki 0 and last_direction line
      loss are unchanged, so the effect of the gain change is isolated. Expected result:
      slalom progress rises to about 0.45 to 0.55 with fewer off-track ends, and the
      oval and s-bend stay at or near 940 with no new oscillation. Hypotheses for
      the next race: (a) if slalom max_error stays near 0.063 with progress unchanged,
      steering gain is not the limit, so next I will test line_loss search_right or
      a lower base_speed of about 0.75 on the slalom; (b) if oval steering_oscillation
      rises above about 0.35, kd must rise further with kp; (c) if the slalom now
      fails later but line_loss_events rise, the 16 mm footprint is overlapping background
      too much on tight bends and I will test 12 mm with the new gains. Measurements
      requested: all available measurements, so that per-track progress, max_error
      and oscillation can be compared with iteration 8.


