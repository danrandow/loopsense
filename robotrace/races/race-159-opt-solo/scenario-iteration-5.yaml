  entities:
  - id: entity0
    label: Stronger steering on
    notes: 'Raises kp 2.6 to 3.0 and kd 0.9 to 1.1 on the iteration 4 geometry, because
      slalom fails at max_error about 0.064 with low oscillation (0.31), which points
      to steering authority rather than sensing. Sensing and speed are unchanged so
      the oval and s-bend results should hold.


      ### Rationale


      Evidence from iteration 4 (score 663.5, best so far): the oval is solved (20/20
      finished, max_error 0.021, about 1.8 s). The s-bend finishes 19/20 (0.95). The
      slalom still fails 20/20 by off_track at progress 0.32, with max_error about
      0.064 (just over the 0.06 m limit), 0.4 line-loss events per run, and low steering
      oscillation (0.31). Moving the sensors forward and widening the array (iteration
      4) moved slalom progress only from 0.31 to 0.32, so sensing reach and lead are
      no longer the main limit. The robot is jittering very little, so the failure
      is slow steering authority on fast alternating bends, which is the hypothesis
      (a) recorded in iteration 4. Change: raise kp from 2.6 to 3.0 (about 15%) for
      a stronger correction per unit of signal. Raise kd from 0.9 to 1.1 so damping
      keeps pace with the larger proportional gain; oscillation has margin (0.31 against
      the rough ceiling of about 0.5 flagged in earlier hypotheses). Geometry is unchanged
      from iteration 4 (seven sensors at y=0.07, x from -0.08 to +0.08, weights x/0.04,
      wheel_track 0.10, mass 0.6), and base_speed stays at 1.0 so the oval and s-bend
      finish time is not affected and the stall or timeout risk does not rise. Expected
      result: slalom max_error drops toward 0.05 to 0.055 and slalom progress rises
      above 0.5 with fewer off-track ends; s-bend finish rate holds at or above 0.95;
      oval stays near 950. Hypotheses to check next: (a) if slalom still ends off
      track with max_error near 0.06 and oscillation stays under 0.4, steering authority
      is still limiting, so try kp near 3.4 or a narrower wheel_track of 0.09; (b)
      if oscillation rises above 0.5 on the s-bend, kd needs to rise further relative
      to kp; (c) if the robot finishes reliably with completion_time above 2.5 s,
      raise base_speed toward 1.2.


