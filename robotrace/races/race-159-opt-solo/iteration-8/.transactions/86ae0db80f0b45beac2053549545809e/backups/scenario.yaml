  entities:
  - id: entity0
    label: Larger sensor footprint
    notes: 'Iteration 7 geometry and controller with sensor_size raised from 12 mm
      to 16 mm, to test whether a bigger footprint keeps the signal valid through
      sharp slalom bends. Slalom progress has stuck at about 0.31 across every gain
      and speed change, so the footprint is the only untested sensing lever left in
      this set.


      ### Rationale


      Evidence: iteration 7 (670.5, best) finishes the oval (20/20) and s-bend (20/20).
      The slalom still fails 20/20 off track at progress 0.3144, which is identical
      to iteration 3 and nearly identical to iterations 4 to 6 (0.30 to 0.35). Progress
      has not moved across changes to kp (2.6 to 3.0), kd, base_speed (1.0 to 0.85),
      sensor reach (y 0.05 to 0.07) and array width. That points to a fixed failure
      point on the slalom, not a gain or speed problem. Slalom line_loss_events fell
      to 0.2 in iteration 7, so the robot is not losing the line often. It is leaving
      the 0.06 m band on a sharp bend while still near the tape. Untested levers are
      sensor footprint and line-loss search behaviour. Change (only one): sensor_size
      from 0.012 to 0.016 m. A larger footprint gives more tape coverage per sensor,
      so the signal stays valid through sharp bends and the robot keeps a graded error
      rather than a sharp drop. Everything else is kept at iteration 7 (kp 2.6, kd
      0.9, ki 0, base_speed 0.85, wheel_track 0.10, mass 0.6, seven sensors at y 0.07
      from x -0.08 to 0.08, weights x/0.04, last_direction line loss), so the effect
      is isolated. Expected result: slalom progress above 0.4 with fewer off-track
      ends, and oval and s-bend finish rates at or above iteration 7. Risk: a larger
      footprint blurs the centre estimate on the oval, so if oval max_error rises
      above 0.025 I will revert to 0.012. Hypotheses for the next race: (a) if slalom
      progress stays near 0.31, the failure is a geometric or search limit, so I will
      test line_loss search_right; (b) if slalom line_loss_events rise, the footprint
      overlaps the background too much; (c) if the oval completion_time exceeds 2.5
      s, raise base_speed to 0.95. Measurements requested: all names in the observation
      list, so that per-track progress, max_error and line-loss events can be compared
      with iteration 7.


