  entities:
  - id: entity0
    label: Higher kp/kd for slalom
    notes: 'Raises kp 3.2 to 3.6 and kd 1.1 to 1.3, keeping geometry and speed fixed.
      Iteration 9 showed slalom progress rising 0.42 to 0.64 with kp, while oval and
      s-bend stayed solid, so more steering authority is the next test.


      ### Rationale


      Evidence from iteration 9 (score 719.6, best so far): the oval (20/20, 1.87
      s, rms 0.0076) and s-bend (20/20, 2.09 s, max_error 0.029) are both solved with
      margin. The slalom is the only failing track: 20/20 off_track, but progress
      rose from 0.42 to 0.64 and line_loss_events is 0.2, so the 16 mm footprint and
      the kp 3.2 / kd 1.1 step both helped. Slalom oscillation is 0.40 and control_effort
      is 12.6, which leaves some room but is climbing. The robot is still drifting
      past the 0.06 m limit on fast alternating bends while it stays on the tape,
      so steering authority is still the limit. Change: raise kp from 3.2 to 3.6 for
      more correction per unit of signal, and raise kd from 1.1 to 1.3 so damping
      keeps pace (kd/kp stays near 0.36, close to the 0.34 that gave clean oval and
      s-bend results). Geometry, sensor weights, base_speed 0.85, ki 0 and last_direction
      line loss are unchanged, so the gain change is isolated. Expected result: slalom
      progress about 0.7 to 0.8 with max_error near 0.055 to 0.06; oval and s-bend
      stay at or above about 940 with steering_oscillation under about 0.3. Risks:
      higher kp can raise oval oscillation and control_effort, which also feeds the
      score''s line-loss term. Hypotheses for the next race: (a) if slalom progress
      rises but still ends off_track near 0.75, the limit is speed on the tightest
      bends, so base_speed should drop to about 0.75 on the next step; (b) if oval
      steering_oscillation rises above 0.3, kd is too low relative to kp and should
      go to about 1.5; (c) if slalom line_loss_events rise above 0.5, the 16 mm footprint
      is overlapping background on sharp bends and 12 mm should be retested with these
      gains. Measurements requested: all available measurements, so per-track progress,
      max_error, oscillation and line-loss counts can be compared with iteration 9.


