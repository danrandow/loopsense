  entities:
  - id: entity0
    label: Agile body, forward
    notes: 'Narrower wheel track (0.09 m), lighter body (0.5 kg) and sensors moved
      to y=0.08 m, to add steering authority and lead on the slalom, where progress
      has stalled near 0.35 for two iterations. Gains are held at kp 3.0 and kd 1.1
      so the effect of the geometry change is isolated; expected slalom progress above
      0.4 with s-bend finish at or above 0.9.


      ### Rationale


      Evidence: iteration 4 (score 663.5) and iteration 5 (score 656.8) are on a plateau.
      The oval is solved (20/20, about 1.8-2.0 s, max_error about 0.02). The s-bend
      finishes 18-19/20. The slalom fails 20/20 off-track at progress 0.32-0.35, with
      max_error about 0.064 and 0.4-0.45 line-loss events per run. Steering oscillation
      is low (0.16 on oval, 0.31 on slalom), so the robot is not jittering. Raising
      kp from 2.6 to 3.0 with kd 1.1 moved slalom progress only from 0.32 to 0.35
      and slightly reduced s-bend finishes, so steering gain alone is near its useful
      limit. Moving the sensors forward and widening the array (iteration 4) also
      changed little, so reach and lead are not the main constraint. The remaining
      levers are the robot''s physical agility: how fast it can change heading for
      alternating bends. Narrowing wheel_track from 0.12 to 0.10 earlier helped (iteration
      3, 563.9 to 659.4), and the mass change from 0.8 to 0.6 kg was made in the same
      step as the array change, so its effect is not isolated. Changes: (1) wheel_track
      0.10 to 0.09 m, for more yaw rate per unit of wheel differential and more steering
      authority on tight bends. (2) mass 0.6 to 0.5 kg, to cut yaw inertia (mass times
      (L^2+W^2)/12) so the body turns faster. (3) Sensor row moved forward from y=0.07
      to y=0.08 m, the maximum allowed, to give the largest possible lead against
      the turning lag. Sensor x positions and weights (x/0.04) are unchanged, so the
      proven signal scale stays fixed. kp 3.0, kd 1.1, base_speed 1.0 and last_direction
      line loss are unchanged, so the gains are not retuned at the same time. Expected
      result: slalom progress above 0.4 with fewer off-track ends, s-bend finish at
      or above 0.9, and oval still about 940 to 955. Risks: a narrower track and lighter
      body could raise oscillation on the oval, so if oscillation exceeds about 0.4
      I will raise kd. Hypotheses to test next: (a) if slalom still fails at progress
      about 0.35 with similar max_error, the limit is base_speed or the line-loss
      search, so I will test line_loss search_right or a lower base_speed on the tight
      bends; (b) if oscillation rises above 0.4 on the oval, kd must rise with the
      higher agility; (c) if completion_time on the finishing runs stays above 2.0
      s, raise base_speed toward 1.2 once finish rates are reliable. Measurements
      requested: completion, progress, completion_time, rms_error, max_error, line_loss_events,
      steering_oscillation, control_effort, controller_errors and noise_robustness,
      so that the slalom failure point and line-loss timing can be compared against
      iteration 5.


