map:
  id: race-117-randow-maps
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Wider sensors, 0.10 m
    notes: 'Reverts the 0.08 m track, which cut the score from 493 to 356 by lowering
      finish rates, and widens the outer sensors to ±0.07 m to test whether slalom
      line loss (0.35 per run, max_error at 0.0624) comes from sensor reach. Built
      on the iteration-3 geometry, the best result so far.


      ### Rationale


      Iteration 4 narrowed wheel_track from 0.10 to 0.08 m, and the score fell from
      493.2 to 355.9. Oval finish rate dropped from 0.85 to 0.55, s-bend finish from
      0.30 to 0.05 with progress 0.75 to 0.66, and slalom progress from 0.34 to 0.19.
      Steering oscillation on the s-bend rose to 0.45, so the sharper turn was overshooting
      and the narrow track did not help any development track. The track change is
      therefore rejected and wheel_track returns to 0.10 m, the iteration-3 value.
      Iteration 3 is still the best design. Its remaining failure is the slalom, which
      finished 0 of 20 with line_loss_events 0.35 and max_error 0.0624, just over
      the 0.06 m off-track floor. Body width cannot move that floor (max(0.06, 0.0125
      + body_width/4) stays at 0.06 m for any body under 0.19 m). The Integrator''s
      feedback rule for this case (line loss at 0.3 or more with max_error at or above
      0.06 m means the outer sensors are losing the tape at the edge) applies to the
      iteration-3 slalom data. So I widen the outer sensors from x = ±0.06 to ±0.07
      m, keeping 7 sensors and 16 mm footprints, with spacing about 23 mm. Mass 0.6
      kg and body 0.12 x 0.10 m stay as in iteration 3, and lead stays at 0.05 m.
      Expected result: slalom line_loss_events fall toward 0, slalom progress rises
      above 0.34, and oval and s-bend finish rates hold near iteration 3. The risk
      is that the wider span adds steering oscillation, so I ask for the oscillation
      figures to be reported.


      - [Open this output](iteration-5/entity0/versions/dc7f22e0576c454387eaf17c0f10fc46/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-d6c02cca7fd27169/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-1aa78d17d2fb9687/payload.json)'
  - id: entity1
    label: Narrow track 0.08 m
    notes: 'Iteration 3 geometry with wheel_track cut from 0.10 to 0.08 m to add turn
      authority for the slalom. Controller held unchanged so the track effect is isolated,
      based on iteration 3''s 493 score and slalom progress of 0.34.


      ### Rationale


      Iteration 3 is the best result so far (score 493.2, from 39.5 in iteration 2).
      Its s-bend progress rose to 0.75 with zero line loss, and the oval finish rate
      reached 0.85. The slalom is now the binding track: 0 of 20 finishes, progress
      0.34, line loss 0.35 per run, and max_error 0.0624, just over the 0.06 m off-track
      floor. Sensing reach is not the limit, since the slalom line loss is small and
      the 7-sensor array at +/-0.06 m with a 0.05 m lead is working on the other tracks.
      The Builder''s proposed change is to narrow wheel_track from 0.10 to 0.08 m.
      Turn rate per unit of wheel difference rises by about 25%, so the slalom''s
      tight alternating bends should get more authority. Body width cannot help, because
      the off-track floor stays at 0.06 m for any body under 0.19 m. The Builder''s
      geometry is kept unchanged except for the track: 7 sensors at x = +/-0.06 m,
      y = 0.05 m, 16 mm footprints, mass 0.6 kg, body 0.12 x 0.10 m, wheel radius
      0.03 m. The controller is also kept unchanged (kp 2.0, ki 0, kd 0.6, base_speed
      1.4, proportional weights, last_direction). Holding the controller isolates
      the track effect, which is what this iteration tests. The main cost is that
      the same kp now produces about 25% more turn per unit of signal. Steering_oscillation
      is already 0.44 on the s-bend, so I expect the risk to show up there. I do not
      lower kp now, because doing so would cancel the turn authority the change is
      meant to add. If the next race shows oscillation above about 0.5 without any
      slalom gain, the response should be a controller change (kp down to about 1.6),
      not a geometry change. Expected: slalom progress clearly above 0.34 with fewer
      off-track ends, oval finish rate at or above 0.85, and s-bend max_error at or
      below 0.06 m.


      - [Open this output](iteration-4/entity1/versions/d67f4b0c92814d18929af924abe337b8/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/56c0dad477774f2999b2ae89c95733b2/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-0b9bb3f4bf3b37ed/payload.json)'
  - id: entityR1
    label: Slalom reach or turn next
    notes: 'Conditional feedback for the Builder: widen sensors if slalom line loss
      persists, back off track if steering oscillation rises, or lower mass if the
      slalom still fails. Each step cites iterations 1 to 3.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. Iteration
      3 (lead 0.05 m, 7 sensors at +/-0.06 m, 0.6 kg, body 0.12 x 0.10 m, track 0.10
      m, kd 0.6) is the best result so far at 493.2. It cut s-bend line loss to 0
      and lifted s-bend progress to 0.75, and it gave an oval finish rate of 0.85.
      The remaining failure is the slalom: 0 of 20 finishes, progress 0.34, line loss
      0.35, max_error 0.0624. The Integrator''s controller is unchanged from iteration
      3 so the track change can be read alone. Read the next race as follows. If slalom
      progress rises above 0.34 and its off-track ends fall with line loss near 0,
      keep the 0.08 m track and then test sensor reach. If slalom line loss stays
      at 0.3 or more with max_error still at or above 0.06 m, the outer sensors are
      losing the tape at the edge. Then widen to +/-0.07 m with 16 mm footprints,
      which iteration 1 and iteration 2 evidence supports. If steering_oscillation
      on the s-bend rises above about 0.5 (iteration 3 measured 0.44) and the slalom
      does not improve, the sharper turn is overshooting. Then the controller''s kp
      should come down (the Integrator would make that change), and the geometry should
      go back to the 0.10 m track.


      ### Requested changes


      - If slalom line_loss_events stay at 0.3 or more and max_error stays at or above
      0.06 m, widen the outer sensors to x = +/-0.07 m with 7 sensors and 16 mm footprints,
      since iteration 1 showed line loss near a 0.0565 m offset and the 0.06 m off-track
      floor cannot be moved by body width.

      - If s-bend steering_oscillation rises above about 0.5 (iteration 3: 0.44) without
      a slalom gain, step wheel_track back to 0.09 m rather than going further below
      0.08 m, since the sharper turn is overshooting.

      - If the slalom still fails with line loss at 0 and max_error near 0.06 m, try
      mass 0.5 kg with the 0.08 m track, since iteration 3 showed that lowering yaw
      inertia from 0.8 to 0.6 kg (with the lead restored) restored s-bend progress
      from 0.04 to 0.75.


      - [Open this output](iteration-4/entityR1/versions/d67f4b0c92814d18929af924abe337b8/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/56c0dad477774f2999b2ae89c95733b2/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-0b9bb3f4bf3b37ed/payload.json)'
