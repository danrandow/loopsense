  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: 12mm footprint, 0.45 kg
    notes: 'Keeps the 12 mm footprint that lifted oval and s-bend finishes in iteration
      7 (645.9) and tests mass 0.45 kg to lower yaw inertia for the slalom. Evidence:
      slalom progress 0.34 to 0.39 with 0.6 to 0.5 kg in iteration 6, and s-bend oscillation
      0.487 at 12 mm, below the 0.55 revert threshold.


      ### Rationale


      Iteration 7 (12 mm footprints, otherwise the iteration-6 design) is the best
      raced design at 645.9, up from 586.9. Oval finish rose to 1.00 (from 0.90) and
      s-bend finish to 0.85 (from 0.65), with s-bend steering_oscillation at 0.487,
      below the 0.55 revert threshold. The slalom did not improve: progress was 0.385
      (vs 0.391), finishes stayed at 0, max_error stayed at the 0.062 floor, and slalom
      line_loss_events rose from 0.05 to 0.45. The footprint change is therefore helping
      the oval and s-bend, but it is not the slalom limit, and the extra slalom line
      loss suggests some edge jitter. I keep 12 mm, because reverting to 16 mm would
      give up the oval and s-bend gains. The iteration-6 finding was that lowering
      mass from 0.6 to 0.5 kg raised slalom progress (0.34 to 0.39). The next geometry
      test is therefore a further, smaller mass step to 0.45 kg, which cuts yaw inertia
      by about 10 percent more. Expected result: slalom progress up to about 0.40
      or more, with s-bend steering_oscillation staying below about 0.55. Risk: s-bend
      oscillation rises past 0.55 with the 12 mm footprint, which would mean the lower
      inertia is overshooting. In that case I revert to 0.5 kg with 12 mm.


      - [Open this output](iteration-8/entity0/versions/192c38d91cad40d5956ce402b96d9ae6/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-145c80bd6a17dbaa/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-2e7c61ecada6d97d/payload.json)'
  - id: entity1
    label: 'Iter 7 package: 12mm'
    notes: 'Iteration-6 geometry and controller with sensor footprint cut from 16
      to 12 mm, as the only change. Controller is held fixed so the footprint effect
      is isolated, based on iteration 6 (586.9, slalom max_error at the 0.06 m floor).


      ### Rationale


      The Builder''s iteration-7 geometry changes only sensor_size from 0.016 to 0.012
      m against the iteration-6 design, which scored 586.9 and is the best so far.
      Iteration 6 showed that 0.5 kg raised slalom progress from 0.34 to 0.39 and
      oval finish to 0.90, but slalom still ends off track with max_error at about
      0.0618, the 0.06 m floor, and s-bend steering_oscillation reached 0.518. Iteration
      5 showed that +/-0.07 m reach cut slalom progress to 0.15 and s-bend finish
      to 0.10, so reach is not the limit and the +/-0.06 m, 7-sensor layout stays.
      Iteration 4 showed that a 0.08 m track overshoots (s-bend oscillation 0.45,
      score 355.9), so the 0.10 m track stays. The controller is kept exactly as in
      iteration 6 (kp 2.0, ki 0, kd 0.6, base_speed 1.4, proportional weights [-2,
      -1.333, -0.667, 0, 0.667, 1.333, 2], last_direction). Holding it isolates the
      footprint change, so this race measures only whether a sharper edge reading
      lifts the slalom. The weights are proportional to sensor x and stay within the
      ±2 limit. Sensor_size 0.012 is a permitted option. Expected result: slalom progress
      above 0.39 with possible first finishes, and oval and s-bend finish rates holding
      near 0.90 and 0.65. Risk: s-bend oscillation may rise if the sharper footprint
      increases edge-crossing jitter.


      - [Open this output](iteration-7/entity1/versions/6099c472c9164b0696169aae9345c4a5/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/d49e0120f2294f22953facdd70dd3447/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-35ac16f6123e714d/payload.json)'
  - id: entityR1
    label: 'Feedback: footprint test'
    notes: 'Conditional feedback on the 12 mm footprint test. It cites iteration 6
      (best, 586.9) and iteration 5 (reach rejected), states no outcome for this candidate,
      and gives keep, revert and controller-handoff rules.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. Evidence
      from earlier iterations: iteration 6 (0.5 kg, 0.10 m track, 7 sensors at +/-0.06
      m, 16 mm footprints, lead 0.05 m) is the best design at 586.9. Its slalom progress
      is 0.39 with line loss 0.05 and max_error 0.0618, so it still ends at the 0.06
      m floor. Its oval finish is 0.90 and s-bend finish 0.65, with s-bend oscillation
      0.518. Iteration 5 (+/-0.07 m reach) cut slalom progress to 0.15, so reach is
      not the slalom limit. Iteration 4 (0.08 m track) overshot, with s-bend oscillation
      0.45, so turn authority is not the limit either. The integration work for this
      candidate is to keep the iteration-6 controller unchanged, so that the footprint
      change is read alone. The sensor weights stay proportional to sensor x at the
      iteration-6 span. The main risk I am handling is edge-crossing jitter with a
      smaller footprint. Interpret the next race as follows. If slalom progress rises
      above 0.39 or a slalom finish appears, and s-bend steering_oscillation stays
      below about 0.55, keep 12 mm and move to the mass change in the requests below.
      If s-bend oscillation rises above about 0.55 while the slalom does not improve,
      revert to 16 mm, because the sharper footprint is adding jitter. If the slalom
      is unchanged with max_error still at about 0.06 m, the footprint is not the
      limit, so keep the geometry and let the Integrator adjust kd or base_speed.


      ### Requested changes


      - If slalom progress rises above 0.39 or finishes appear while s-bend steering_oscillation
      stays below about 0.55, keep sensor_size 0.012 m and hold mass at 0.5 kg, since
      iteration 6 showed that 0.5 kg gave the slalom its only gain (0.34 to 0.39).

      - If s-bend steering_oscillation rises above about 0.55 (iteration 6: 0.518)
      with no slalom gain, return sensor_size to 0.016 m and keep mass at 0.5 kg with
      the iteration-6 layout, since the smaller footprint is adding edge jitter and
      iteration 6 is the best tested design.

      - If the slalom max_error stays at about 0.06 m with line loss near 0.05 after
      the footprint change, do not make another geometry change; hold the iteration-6
      geometry and report the result, since iteration 5 showed that reach and track
      changes do not help the slalom and the remaining limit is the controller''s
      kd or base_speed.


      - [Open this output](iteration-7/entityR1/versions/6099c472c9164b0696169aae9345c4a5/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/d49e0120f2294f22953facdd70dd3447/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-35ac16f6123e714d/payload.json)'
