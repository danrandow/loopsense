overrides:
  entities:
  - id: entity0
    label: 12mm footprint, 0.45 kg
    notes: 'Keeps the 12 mm footprint that lifted oval and s-bend finishes in iteration
      7 (645.9) and tests mass 0.45 kg to lower yaw inertia for the slalom. Evidence:
      slalom progress 0.34 to 0.39 with 0.6 to 0.5 kg in iteration 6, and s-bend oscillation
      0.487 at 12 mm, below the 0.55 revert threshold.


      ### Rationale


      Iteration 7 (12 mm footprints, otherwise the iteration-6 design) is the best
      raced design at 645.9, up from 586.9. Oval finish rose to 1.00 (from 0.90) and
      s-bend finish to 0.85 (from 0.65), with s-bend steering_oscillation at 0.487,
      below the 0.55 revert threshold. The slalom did not improve: progress was 0.385
      (vs 0.391), finishes stayed at 0, max_error stayed at the 0.062 floor, and slalom
      line_loss_events rose from 0.05 to 0.45. The footprint change is therefore helping
      the oval and s-bend, but it is not the slalom limit, and the extra slalom line
      loss suggests some edge jitter. I keep 12 mm, because reverting to 16 mm would
      give up the oval and s-bend gains. The iteration-6 finding was that lowering
      mass from 0.6 to 0.5 kg raised slalom progress (0.34 to 0.39). The next geometry
      test is therefore a further, smaller mass step to 0.45 kg, which cuts yaw inertia
      by about 10 percent more. Expected result: slalom progress up to about 0.40
      or more, with s-bend steering_oscillation staying below about 0.55. Risk: s-bend
      oscillation rises past 0.55 with the 12 mm footprint, which would mean the lower
      inertia is overshooting. In that case I revert to 0.5 kg with 12 mm.


      - [Open this output](iteration-8/entity0/versions/192c38d91cad40d5956ce402b96d9ae6/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-145c80bd6a17dbaa/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-2e7c61ecada6d97d/payload.json)'
  - id: entity1
    label: Complete Robot Package
    notes: 'Complete Robot Package. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 7 (12 mm footprints, 0.5 kg) is the best raced design at 645.9. Its
      oval finish is 1.00, s-bend finish 0.85 with steering_oscillation 0.487 (under
      the 0.55 revert line), and slalom progress 0.385 with max_error at the 0.062
      floor. The slalom has not finished in any iteration. Across iterations 3 to
      7, the track (0.08 m, iteration 4), reach (+/-0.07 m, iteration 5) and mass
      (0.6 to 0.5 kg, iteration 6) each moved the slalom only a little, so the Builder''s
      single-variable step to 0.45 kg is the planned next test. I keep the iteration-7
      controller unchanged (kp 2.0, ki 0, kd 0.6, base_speed 1.4, proportional weights,
      last_direction) so that the mass change is read alone. If the slalom does not
      move, the next lever is kd or base_speed, not geometry. Expected result: slalom
      progress about 0.40 or more, with s-bend steering_oscillation possibly rising
      toward 0.55 as yaw inertia falls about 10 percent more. Risk: overshoot on the
      s-bend.


      - [Open this output](iteration-8/entity1/versions/dccd3d21ac2a4b95bb80a4036dc9efc1/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/192c38d91cad40d5956ce402b96d9ae6/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-2e7c61ecada6d97d/payload.json)'
  - id: entityR1
    label: Integration Feedback
    notes: 'Integration Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. Evidence:
      iteration 7 (12 mm footprint, 0.5 kg) is the best design at 645.9. Oval finish
      is 1.00 and s-bend finish 0.85, with s-bend steering_oscillation 0.487. The
      slalom still ends off track at max_error 0.062, the 0.06 m floor, with progress
      0.385 and line_loss 0.45. Iteration 6 showed 0.5 kg lifted slalom progress from
      0.34 to 0.39, and iteration 4 showed that a narrower track overshoots (s-bend
      oscillation 0.45). Iteration 5 showed that wider reach cuts slalom progress,
      so reach is not the limit. This candidate tests only the next mass step (0.5
      to 0.45 kg) with the controller unchanged. Interpret the next race as follows.
      If slalom progress rises above 0.39 or a slalom finish appears while s-bend
      steering_oscillation stays below about 0.55, keep 0.45 kg and keep the 12 mm
      footprint. If s-bend steering_oscillation rises above about 0.55 without a slalom
      gain, return to 0.5 kg, since the lower inertia is overshooting. If the slalom
      is unchanged with line loss near 0.45 and max_error near 0.06, stop changing
      geometry and report that the controller''s kd or base_speed is the limit.


      ### Requested changes


      - If slalom progress rises above 0.39 or any slalom finish appears while s-bend
      steering_oscillation stays below about 0.55, keep mass 0.45 kg and the 12 mm
      footprint, since mass 0.5 kg gave the slalom its only gain (0.34 to 0.39, iteration
      6).

      - If s-bend steering_oscillation rises above about 0.55 (iteration 7: 0.487)
      with no slalom gain, revert to mass 0.5 kg with the 12 mm footprint, since iteration
      7 is the best tested design and the lower inertia is overshooting.

      - If the slalom stays at about 0.385 progress with max_error at 0.06 m, do not
      change geometry again; report the result so the Integrator can adjust kd or
      base_speed, since reach (iteration 5), track width (iteration 4) and mass have
      all failed to move the slalom.


      - [Open this output](iteration-8/entityR1/versions/dccd3d21ac2a4b95bb80a4036dc9efc1/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/192c38d91cad40d5956ce402b96d9ae6/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-2e7c61ecada6d97d/payload.json)'
