map:
  id: race-117-randow-maps
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Iter 3 geometry, 0.5 kg
    notes: 'Reverts the sensor span to the iteration-3 layout (+/-0.06 m) after the
      wider +/-0.07 m span cut slalom progress from 0.34 to 0.15, and lowers mass
      from 0.6 to 0.5 kg to test yaw inertia on the slalom. Based on the iteration
      3 and 5 race data.


      ### Rationale


      Iteration 5 widened the outer sensors to +/-0.07 m and scored 430.1, below iteration
      3''s 493.2. Slalom line loss fell to 0.0, which confirms the reach change did
      what it was meant to do. But slalom progress fell from 0.34 to 0.15 and the
      s-bend finish rate fell from 0.30 to 0.10, with s-bend progress down from 0.75
      to 0.71. Wider reach therefore does not fix the slalom, and it appears to cost
      progress on the other tracks. The 0.07 m span is rejected. I return the sensor
      array to the iteration-3 layout (7 sensors at +/-0.06 m, 16 mm footprints, y
      = 0.05 m) and the 0.10 m track, which together gave the best score so far. The
      slalom still ends with max_error about 0.062, at the 0.06 m off-track floor,
      which the body width cannot change. Iteration 3 showed that lowering yaw inertia
      restored s-bend progress, and the slalom is the remaining failure. So I reduce
      mass from 0.6 to 0.5 kg with the body unchanged, which cuts yaw inertia by about
      17 percent. This is the only change from iteration 3. Expected result: a slalom
      finish rate above zero or higher slalom progress, with oval and s-bend holding
      near iteration 3. Risk: lower inertia can add steering oscillation, so I request
      steering_oscillation on every track.


      - [Open this output](iteration-6/entity0/versions/6f12678fe5c849259000009bf8a4ee14/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-81583392b012683e/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-7b815cff1f6af824/payload.json)'
  - id: entity1
    label: 'Iter 6 package: mass 0.5'
    notes: 'Iteration-3 geometry and controller unchanged, except mass reduced from
      0.6 to 0.5 kg as the Builder requested. Iteration 3 (493.2) is the best evidence,
      and iteration 5 showed that wider sensors did not fix the slalom.


      ### Rationale


      Evidence: iteration 3 (0.10 m track, 7 sensors at +/-0.06 m, lead 0.05 m, 0.6
      kg, body 0.12 x 0.10 m, kd 0.6) scored 493.2, the best so far. It has zero s-bend
      line loss and progress 0.75, with an oval finish rate of 0.85. Iteration 4 showed
      that the 0.08 m track overshoots (s-bend oscillation 0.45, scores down to 355.9),
      so turn authority is not the limit. Iteration 5 showed that +/-0.07 m reach
      cut slalom and s-bend progress (score 430.1), so reach is not the slalom limit
      either. The slalom still ends off track at max_error about 0.062, at the 0.06
      m floor. The Builder''s requested change, mass 0.6 to 0.5 kg with the body unchanged,
      lowers yaw inertia by about 17 percent. I keep the iteration-3 controller (kp
      2.0, ki 0, kd 0.6, base_speed 1.4, proportional weights, last_direction) so
      that this race isolates mass. Expected result: slalom progress above 0.34 with
      some finishes, and oval and s-bend finish rates at or near iteration 3. Risk:
      lower inertia may raise s-bend steering_oscillation above about 0.5. Steering_oscillation
      is requested on every track so that this can be checked.


      - [Open this output](iteration-6/entity1/versions/ba57b967a5384f7ea2c69b49c47759d7/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/6f12678fe5c849259000009bf8a4ee14/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-7b815cff1f6af824/payload.json)'
  - id: entityR1
    label: 'Feedback: mass and kd'
    notes: 'Written before the race, citing iterations 3, 4 and 5. It tells the Builder
      what to change depending on slalom line loss, s-bend oscillation and slalom
      max_error in the next race.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. Evidence:
      iteration 3 (0.10 m track, 0.6 kg, lead 0.05 m, +/-0.06 m sensors) is the best
      design at 493.2, with s-bend progress 0.75 and oval finish 0.85. The slalom
      is the only failing track, finishing 0 of 20 with max_error 0.0624 at the 0.06
      m floor. Iteration 4 (0.08 m track) overshot, with s-bend oscillation 0.45 and
      score down to 355.9, so narrowing the track is rejected. Iteration 5 (+/-0.07
      m reach) cut slalom progress to 0.15 and s-bend finishes to 0.10, so widening
      reach is rejected. This candidate tests mass alone. Interpret the next race
      as follows. If slalom progress rises above 0.34 or any slalom finish appears,
      and s-bend steering_oscillation stays below about 0.5, keep 0.5 kg and move
      to the 12 mm footprint test at the iteration-3 span. If s-bend steering_oscillation
      rises above about 0.5 while the slalom does not improve, return to 0.6 kg, since
      the lower inertia is overshooting. If the slalom is unchanged with line loss
      near 0 and max_error still about 0.06, the limit is controller response, so
      do not change geometry again and let the Integrator adjust kd or base_speed.


      ### Requested changes


      - If slalom progress rises above 0.34 or finishes appear while s-bend steering_oscillation
      stays below about 0.5, keep mass 0.5 kg and test sensor_size 0.012 at the iteration-3
      span (+/-0.06 m, 7 sensors), since iteration 5 showed the reach is adequate
      and the footprint is untested.

      - If s-bend steering_oscillation rises above about 0.5 (iteration 3: 0.44) without
      a slalom gain, return to mass 0.6 kg with the iteration-3 geometry, since the
      lower inertia is overshooting and iteration 4 showed that sharper turns raise
      oscillation.

      - If the slalom is unchanged with line loss near 0 and max_error still about
      0.06 m, hold the geometry at iteration 3 and report the result, since iterations
      4 and 5 showed that track and reach changes do not help the slalom, which points
      to the controller''s kd or base_speed.


      - [Open this output](iteration-6/entityR1/versions/ba57b967a5384f7ea2c69b49c47759d7/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/6f12678fe5c849259000009bf8a4ee14/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-7b815cff1f6af824/payload.json)'
