  entities:
  - id: entity0
    label: PI steer + more damping
    notes: 'Adds integral action (ki 0.4) and raises kp to 3.0 and kd to 0.2 to cancel
      the steady offset from motor mismatch. The evidence is rms ~0.027 and max_error
      pinned at the 0.06 m off-track limit across all 60 trials, with low oscillation.


      ### Rationale


      Evidence: all 60 development trials across oval, s-bend and slalom ended off_track
      with zero completions. Max error sits at about 0.061 m, which is the off-track
      limit (max(0.06, 0.0125 + 0.12/4)). RMS error stayed near 0.027 to 0.030 on
      every track and in both iterations, and steering oscillation was low (0.06 to
      0.20). The pattern is a persistent offset from the line, not jitter or instability.
      The most likely cause is the fixed left/right motor mismatch in the disturbance.
      With a proportional-only controller (ki = 0), that mismatch leaves a steady-state
      offset of roughly bias/kp, which pushes the robot toward the limit. Raising
      kp from 2.5 to 3.0 shrinks that offset. Adding a small integral term (ki = 0.4)
      removes it. The integral is clamped at +/-2, so windup on bends is bounded.
      Changes from iteration 1: kp 2.5 to 3.0, ki 0 to 0.4, kd 0.15 to 0.2 to damp
      the larger proportional and integral action, and base_speed kept at 1.2 so the
      change isolates the steering fix. Geometry and line_loss policy are unchanged
      so the race attributes the effect to the controller. Expected result: rms_error
      falls well below 0.027 and max_error drops below 0.06, so runs survive longer
      and progress rises above 0.3 on at least one track. Completion inside 3 s is
      still unlikely at this speed. Hypotheses to test: (H1) the failure is a steady
      drift from motor mismatch, so rms should drop with ki; (H2) if rms stays near
      0.027 with ki, the cause is sensor geometry (outer sensors losing the 25 mm
      tape on bends), and I would widen the sensor spread or enlarge sensor_size next.
      Measurements wanted next: per-track progress, max_error location, line_loss_events,
      and whether oscillation rises with the higher kp.


