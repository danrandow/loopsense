map:
  id: race-126-opt-eval
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: kd 0.8 at sensor y=0.07
    notes: 'Reverts the sensor row to y = 0.07 (y = 0.08 scored 63.05, no max_error
      gain) and restores last_direction line loss, then raises kd from 0.5 to 0.8
      as the single变量 test. Iterations 3 to 4 showed kd gains cut oscillation and
      gave a small score lift, and max_error has stuck at 0.061 to 0.065 m.


      ### Rationale


      Evidence from iteration 6 (sensors at y = 0.08, kd 0.5, kp 3.5, base_speed 1.6,
      line_loss search_right): score 63.05, below iteration 4''s 64.17 and iteration
      5''s 64.01. Every trial still went off track. max_error was 0.0624 (oval), 0.0632
      (s-bend) and 0.0645 (slalom), no better than at y = 0.07. Line-loss events stayed
      at 1 per run, and steering_oscillation was 0.109 (oval), 0.147 (s-bend) and
      0.154 (slalom). Moving the sensor row from 0.07 to 0.08 gave no gain, so the
      forward-row lever has reached its limit. Following the Evaluator''s rule (score
      below 64.17 with no max_error gain), I return the sensor row to y = 0.07, the
      best-measured position.


      I also revert line_loss to last_direction, the setting from iteration 4 (64.17).
      search_right in iteration 5 changed the score by only -0.16, so it had no measurable
      effect. Iteration 4 is therefore the clean baseline.


      Change: with the baseline restored, the single variable I test is controller.kd,
      raised from 0.5 to 0.8. Iterations 3 to 4 showed that raising kd from 0.3 to
      0.5 cut oval oscillation and gained about 1.5 points, and max_error has stayed
      at 0.061 to 0.065 m since then. Geometry, kp 3.5, base_speed 1.6 and sensor_size
      0.012 are all unchanged.


      Expected result: max_error falls toward or below 0.06 m, steering_oscillation
      stays at or below about 0.15, and the score is at or above 64.17. Hypotheses:
      (H1) more damping reduces the overshoot on the bends that causes the single
      line-loss event, so max_error drops by a few mm; (H2) if steering_oscillation
      rises above about 0.15 on the s-bend and slalom, the derivative is amplifying
      sensor noise, so the next step is kd 0.6 rather than higher. (H3) If max_error
      stays at 0.061 to 0.065 m, controller-side damping is exhausted; the remaining
      levers are base_speed (lower speed to reduce bend overshoot, at the cost of
      completion time) or kp (2.5 to reduce over-steer). Measurements wanted: completion,
      progress, completion_time, max_error, rms_error, line_loss_events and steering_oscillation.


      - [Open this output](iteration-7/entity0/versions/4887ca7ec26046e9806d6ce4fea37e0f/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-d445cdc627227531/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-0dcd94265835f634/payload.json)'
  - id: entityR1
    label: 'Approve: sensor row'
    notes: 'Approved the single-variable test of moving the sensor row from y=0.07
      to 0.08 on the iteration 5 design. The earlier 0.04 to 0.07 move was the one
      lever that gained about 10 points, while kd and line-loss direction changes
      left max_error stuck at 0.061 to 0.065 m.


      ### Feedback


      Approving the y = 0.08 sensor move as a single-variable test on iteration 5''s
      design. Evidence: moving the sensor row from y = 0.04 to y = 0.07 (iteration
      2 to 3) gained about 10 points and reduced line-loss events, so forward lookahead
      is the lever with a measured effect. Iterations 4 and 5 show that kd 0.3 to
      0.5 (+1.5 points) and line_loss last_direction to search_right (64.17 to 64.01,
      same max_error of 0.061 to 0.065 m) have not moved max_error below 0.06 m, so
      the sensor row is the untested lever left. The candidate changes only the five
      sensor y values (0.07 to 0.08, x unchanged at -0.04 to +0.04). It is inside
      the contract (y maximum is 0.08) and is not obviously broken. I make no claim
      about its performance. Interpret the race as follows. If max_error falls below
      0.06 m and line_loss_events drop to 0 or 1, keep y = 0.08 and raise base_speed
      toward 2.0 for completion time. If steering_oscillation rises above about 0.15
      while on track, lower kp from 3.5 toward 2.5 rather than reducing lookahead.
      If max_error stays above 0.06 m with one line-loss event, the sensor row has
      reached its limit, so the next test is kd 0.5 to 0.8 at y = 0.08. If the score
      falls below iteration 4''s 64.17 with no gain in max_error, return to y = 0.07
      and keep kd 0.5.


      ### Requested changes


      - If max_error is below 0.06 m with line_loss_events of 0 or 1 but runs do not
      finish within 3.0 s: raise controller.base_speed from 1.6 toward 2.0, keeping
      sensor y = 0.08, kd 0.5 and line_loss search_right, since the y = 0.04 to 0.07
      move (about +10 points) showed lookahead drives the line-hold gain.

      - If steering_oscillation rises above about 0.15 with the robot staying on track
      at y = 0.08: lower controller.kp from 3.5 toward 2.5, keeping the y = 0.08 row,
      since the stronger forward signal may over-steer.

      - If max_error stays at or above 0.06 m with one line-loss event at y = 0.08:
      raise controller.kd from 0.5 toward 0.8, since kd 0.3 to 0.5 (iterations 3 to
      4) cut oscillation and gave a small gain, and no sensor or direction change
      has yet pushed max_error below 0.06 m.


      - [Open this output](iteration-6/entityR1/versions/a31b14041d934dc887615a7705974061/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/c9578ae341cd4e17983f90c7f13858b0/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-711a5a71cefa5794/payload.json)'
