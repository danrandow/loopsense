map:
  id: race-126-opt-eval
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: 'Final: base_speed 1.2'
    notes: 'Iteration 10''s best design (458.0) with base_speed lowered from 1.4 to
      1.2, the only change. Speed cuts reduced s-bend overshoot (progress 0.35 to
      0.68) without slowing the oval (1.875 s both times), so the Evaluator''s speed
      rule applies; iteration 10 is the fallback.


      ### Rationale


      Final iteration. The best raced design is iteration 10 (base_speed 1.4, kd 1.0,
      kp 3.5, sensors y 0.07 at x -0.04 to +0.04, sensor_size 0.012, line_loss last_direction),
      scoring 457.99. On the oval it finished 20 of 20 at a mean of 1.87 s. Its s-bend
      finished 3 of 20 (progress 0.68, up from 0.35 at base_speed 1.6), and its steering_oscillation
      of 0.288 is still at or above the 0.25 level the Evaluator flagged as gain-limited
      overshoot. The slalom stayed at progress 0.18 with 0 finishes. Lowering speed
      from 1.6 to 1.4 cut bend overshoot and left the oval time almost unchanged (1.875
      s to 1.875 s), so speed reduction is not costing the oval anything. The Evaluator''s
      rule for this state applies: the bends still fail with steering_oscillation
      at or above 0.25 at base_speed 1.4, and the oval still finishes, so lower base_speed
      toward 1.2. The one change from iteration 10 is controller.base_speed 1.4 to
      1.2. Geometry, kp 3.5, kd 1.0, sensor_weights and line_loss last_direction are
      unchanged, so the race isolates speed again. Expected result: s-bend progress
      rises further and finishes increase, the oval holds 20 of 20, and the score
      is at or above 457.99. Risk: slower traversal could reduce completion-time credit,
      and a lower speed could leave the slalom unchanged. Fallback: if the oval drops
      below 20 of 20, or the score falls below 457.99, the final build should be iteration
      10 (base_speed 1.4), which is the best raced design. Hypotheses: (H1) bend overshoot
      falls with speed, so s-bend finishes rise above 3 of 20; (H2) the slalom progress
      stays near 0.18 because its failure is not speed-limited, so kd or sensor geometry
      would be the next lever, but no iterations remain. Measurements wanted: completion,
      progress, completion_time, rms_error, max_error, line_loss_events, steering_oscillation
      and controller_errors on all three tracks.


      - [Open this output](iteration-11/entity0/versions/9b7aa8f8f93048f799cbd9c31f43b760/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-43bec8b638a6b7c4/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-8eb308fbec55adcc/payload.json)'
  - id: entityR1
    label: 'Approve: slower base'
    notes: 'Approved the iteration 9 build with base_speed lowered from 1.6 to 1.4
      as a single-variable test of bend overshoot. The evidence is iteration 9 (387.98,
      oval 20 of 20, bends failing with oscillation about 0.2) and iteration 8, which
      showed kp reduction alone did not help.


      ### Feedback


      The candidate is the iteration 9 build (kd 1.0, kp 3.5, sensors y 0.07 at x
      -0.04 to +0.04, sensor_size 0.012, line_loss last_direction) with one change:
      controller.base_speed 1.6 to 1.4. Geometry, kp, kd and line_loss are unchanged,
      so the race isolates speed. Iteration 9 is the best raced design at 387.98:
      the oval finished 20 of 20 (mean 1.875 s), while the s-bend (progress 0.35)
      and slalom (progress 0.18) still ended off track with steering_oscillation of
      about 0.19 to 0.20. Iteration 8 showed that lowering kp alone did not help the
      bends, so speed is the remaining untested lever for bend overshoot. Read from
      the candidate itself, the change is valid and inside every contract limit, and
      it is not obviously broken. The main risk is the oval: at 1.4 its mean time
      should scale to about 2.1 s, still inside the 3.0 s limit, but the margin narrows
      and completion-time credit drops slightly. I make no claim about how this candidate
      will perform. Approve now: it is a clean single-variable test, and one iteration
      remains after this one, so the race telemetry can drive a final adjustment.
      Interpret the race as follows. If the oval still finishes 20 of 20 and the s-bend
      or slalom progress rises above 0.35 and 0.18 with the score at or above 387.98,
      keep base_speed 1.4 and test kd 1.2 next. If the oval drops below 20 of 20 or
      the score falls below 387.98, the speed reduction is not paying off, so return
      base_speed to 1.6 with kd 1.0, the best raced design.


      ### Requested changes


      - If the oval holds 20 of 20 and s-bend or slalom progress rises above 0.35
      and 0.18 with the score at or above 387.98: keep base_speed 1.4 and try controller.kd
      1.0 to 1.2 to test whether more damping clears the slalom, since iterations
      3 to 9 showed kd increases were the only large gains.

      - If the oval finishes fall below 20 of 20 or the score falls below 387.98 (iteration
      9 at base_speed 1.6): return controller.base_speed to 1.6 with kd 1.0 and kp
      3.5, since that is the best raced design.

      - If the bends still fail with progress at or below 0.35 and 0.18 at base_speed
      1.4 and steering_oscillation at or above 0.25: lower controller.base_speed further
      toward 1.2 only if the oval still finishes, since bend overshoot rather than
      gain has been the limit.


      - [Open this output](iteration-10/entityR1/versions/72122c7f19f046119deb322088895c28/payload.json)

