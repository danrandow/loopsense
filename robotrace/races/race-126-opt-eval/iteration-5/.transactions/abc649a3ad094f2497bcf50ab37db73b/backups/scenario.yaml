map:
  id: race-126-opt-eval
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Search-right line loss
    notes: 'Keeps the iteration 4 design (y = 0.07 sensors, kp 3.5, kd 0.5) and changes
      only line_loss to search_right, following the evaluator''s rule for max_error
      above 0.06 m with one line-loss event per run. Iteration 4 scored 64.17 with
      max_error 0.061 to 0.062 m on every track.


      ### Rationale


      Evidence from iteration 4 (kd 0.5, kp 3.5, base_speed 1.6, sensors at y = 0.07,
      x = -0.04 to +0.04, sensor_size 0.012, line_loss last_direction): score 64.17,
      the best so far, but all 60 trials still went off track. max_error was 0.0611
      (oval), 0.062 (s-bend) and 0.0619 (slalom), all just above the 0.06 m floor.
      Line_loss_events were 1 per run on every track. Steering_oscillation was 0.108
      on the oval and 0.151 on the s-bend and slalom. Raising kd from 0.3 to 0.5 gave
      about +1.5 points and cut oval oscillation, but it did not bring max_error under
      0.06 m. Lookahead (y = 0.07) and wider sensors were real gains, but neither
      has removed the single line-loss event per run. The evaluator''s rule for this
      state is: if max_error still exceeds 0.06 m with line loss of 1 or more at kd
      0.5, change line_loss from last_direction to search_left or search_right. That
      is the test I am making. Steering_oscillation sits at about 0.15 on two tracks,
      which is borderline for the kp reduction, so I hold kp at 3.5 to keep this a
      single-variable test. Change: controller.line_loss last_direction -> search_right
      (signal fixed at +1, steering the robot left). I chose search_right over search_left
      because the oval is a loop with mainly left-hand bends, so the outer-edge drift
      it recovers from should be to the right of the line; this direction is a judgement,
      not a measured result. Everything else is unchanged: geometry, kp 3.5, kd 0.5,
      base_speed 1.6. Expected result: line_loss_events fall to 0, which should keep
      max_error near or below 0.06 m and raise progress. Hypotheses: (H1) search_right
      reduces the single line-loss event per run, so max_error falls below 0.06 m
      on at least the s-bend and slalom; (H2) if search_right makes loss worse (more
      events or larger max_error), the opposite direction, search_left, is the next
      test; (H3) if line loss stays at 1 with no change, the blind spot is in sensing
      and the next lever is sensor geometry or kd. Measurements wanted: completion,
      progress, completion_time, max_error, rms_error, line_loss_events, steering_oscillation,
      controller_errors. Next step if runs stay on track but do not finish: raise
      base_speed toward 2.0. If steering_oscillation exceeds about 0.15 while on track:
      lower kp toward 2.5.


      - [Open this output](iteration-5/entity0/versions/48726fba1dd9468bb7eebd777a1153b7/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-0a7690a7e87ff8b7/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-052deba78fd48c3f/payload.json)'
  - id: entityR1
    label: 'Approve: search_right'
    notes: 'Approved the single-variable test of line_loss last_direction to search_right
      on the iteration 4 design (best raced at 64.17). Iterations 1 to 4 all kept
      max_error at 0.061 to 0.066 m with one line-loss event per run, so the line-loss
      response is the untested lever; the direction is a judgement, with search_left
      as the contingency.


      ### Feedback


      Approve on evidence, with the next race deciding the next step. The candidate
      is a single-variable change from iteration 4 (score 64.17, the best raced so
      far): controller.line_loss moves from last_direction to search_right. Geometry
      (sensors at y = 0.07, x = -0.04 to +0.04, sensor_size 0.012), kp 3.5, kd 0.5
      and base_speed 1.6 are unchanged. Iteration 4 went off track on all 60 trials,
      with max_error 0.061 to 0.062 m on every track and exactly 1 line-loss event
      per run. Iterations 1 to 3 show the same pattern (max_error 0.061 to 0.066 m)
      across gain and geometry changes, so the line-loss response is the lever left
      untested. The reasoning is sound and the change is valid and low-risk. I make
      no claim about its performance; the race will show it. Direction is a judgement,
      not a measured result: search_right steers the robot left, the sign that suits
      the oval''s mainly left-hand bends. Interpret the next telemetry as follows.
      If line_loss_events fall to 0 and max_error drops below 0.06 m, keep search_right
      and raise base_speed toward 2.0 to recover completion time. If line_loss_events
      rise or max_error grows, the direction is wrong, so test search_left next. If
      line_loss stays at 1 with no change, sensing is the blind spot, so the next
      lever is sensor geometry or kd. Do not raise kp unless steering_oscillation
      stays under about 0.15.


      ### Requested changes


      - If line_loss_events fall to 0 and max_error stays below 0.06 m but the robot
      does not finish within 3.0 s: raise controller.base_speed from 1.6 toward 2.0,
      keeping line_loss search_right, kp 3.5, kd 0.5 and the y = 0.07 sensor row,
      since iteration 4 shows the line is the limit, not speed.

      - If line_loss_events rise above 1 or max_error grows above about 0.062 m with
      search_right: change controller.line_loss from ''search_right'' to ''search_left''
      to test the opposite recovery direction, keeping all other fields as in iteration
      4.

      - If line_loss_events stay at exactly 1 and max_error stays near 0.061 m with
      search_right: keep the line-loss setting and try controller.kd from 0.5 toward
      0.8, or sensor_positions y from 0.07 toward 0.08, since no controller-side change
      has moved max_error below 0.06 m in iterations 1 to 4.


      - [Open this output](iteration-5/entityR1/versions/a5f38774b94a49b0a6d6c96d87f2a9ba/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/48726fba1dd9468bb7eebd777a1153b7/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-052deba78fd48c3f/payload.json)'
