map:
  id: race-126-opt-eval
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Lower kp, more damping
    notes: 'Cut kp from 4.0 to 2.5, raised kd to 0.3, and lowered base_speed to 1.6
      to stop the overshoot-driven line loss. Iteration 0 went off track in all 60
      trials, with 2 line-loss events per run and progress of at most 0.13, which
      points to over-aggressive steering.


      ### Rationale


      Evidence from iteration 0: all 60 development trials went off track (ended_by
      off_track: 20/20 on each track). Progress was only 0.05 to 0.13, so no run finished.
      Every run had 2 line-loss events, which means the robot lost the tape early
      and never recovered. max_error was about 0.06 to 0.068 m, right at the off-track
      limit of 0.0625 m, and rms_error was about 0.025 to 0.029 m. Steering oscillation
      was moderate (about 0.15). The likely cause is over-aggressive steering at high
      speed: kp = 4 gives up to 1400 PWM of differential for a full-scale signal,
      and kd = 0.1 is too weak to damp the swing. The robot overshoots across the
      line, loses it, and drifts off. Changes: (1) kp 4.0 to 2.5, to halve the steering
      gain and reduce overshoot. (2) kd 0.1 to 0.3, to add damping against the fast
      signal changes. (3) base_speed 1.8 to 1.6, to give the controller more time
      to correct on bends. The trade-off is a slower lap, so completion_time may rise,
      but staying on track matters more while the robot fails early. Geometry is unchanged
      so that the controller change is the only variable. Expected result: line_loss_events
      fall to 0 or 1, progress rises well above 0.13, and at least some runs complete.
      Hypotheses to test: (H1) the early off-track is caused by overshoot, so line_loss_events
      should drop with lower kp; (H2) with the line held, progress should reach at
      least 0.5 on the oval; (H3) if the runs still leave the track, the problem is
      sensor geometry or the line-loss response rather than gains. Next measurements
      to check: completion, progress, completion_time, line_loss_events, max_error
      and steering_oscillation. If the runs now stay on track but do not finish within
      3 s, raise base_speed toward 2.0. If oscillation is still high, lower kp further
      or raise kd.


      - [Open this output](iteration-1/entity0/versions/324dfe89121d4969b05ab223231bd0e4/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-b8dbcde0ef31debf/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-4424181dce0e460e/payload.json)'
  - id: entityR1
    label: Approve gain-fix
    notes: 'Approved the controller-only fix (kp 2.5, kd 0.3, base_speed 1.6) because
      iteration 0 showed every run leaving the track after 2 line losses with max_error
      at the limit. Racing it gives the first test of the overshoot hypothesis, and
      the feedback sets out the next change for each outcome.


      ### Feedback


      Approving this candidate as the first real test of the off-track diagnosis.
      Its evidence base is iteration 0 only: all 60 trials went off track after about
      2 line-loss events, with max_error near 0.06 m (the 0.0625 m limit) and rms_error
      about 0.025 to 0.029 m. That points to overshoot and loss of the line on bends.
      This candidate changes only the controller (kp 4.0 to 2.5, kd 0.1 to 0.3, base_speed
      1.8 to 1.6) and keeps the geometry fixed, so the race isolates the gain change.
      Nothing here predicts its outcome. Weigh the next telemetry this way. If line_loss_events
      fall and runs stay on track with progress well above 0.13, keep kp near 2.5
      and raise base_speed toward 2.0 to recover the time budget, since 1.6 may not
      reach the roughly 1.5 m/s average needed to finish in 3 s. If runs still leave
      the track with line_loss_events still near 2, the cause is more likely sensor
      geometry or the line-loss response than gain, so test line_loss ''search_left''
      or ''search_right'' before more gain changes. If steering_oscillation stays
      high, lower kp further or raise kd.


      ### Requested changes


      - If the runs stay on track (line_loss_events 0 or 1) but do not finish within
      3.0 s: raise controller.base_speed from 1.6 toward 2.0, keeping kp 2.5 and kd
      0.3, since iteration 0 showed speed was not the limit for leaving the track.

      - If runs still leave the track with line_loss_events near 2 and max_error near
      0.06: keep the gains and change controller.line_loss from ''last_direction''
      to ''search_left'' or ''search_right'' to test the line-loss response.

      - If steering_oscillation stays above about 0.15 while the robot stays on track:
      lower controller.kp from 2.5 toward 1.8 or raise controller.kd from 0.3 toward
      0.5.


      - [Open this output](iteration-1/entityR1/versions/6e045a56f0594b6b964fc5957ccf52f8/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/324dfe89121d4969b05ab223231bd0e4/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-4424181dce0e460e/payload.json)'
