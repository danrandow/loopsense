  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: kd 1.0 damping test
    notes: 'Keeps the iteration 7 geometry and kp 3.5 and raises kd from 0.8 to 1.0
      to test whether more damping lowers s-bend and slalom oscillation (0.23 to 0.25)
      without losing oval finishes. Falls back to the kd 0.8 build (iteration 7, 304.77)
      if the score drops or oval finishes fall below 13 of 20.


      ### Rationale


      Evidence: the iteration 7 build (kd 0.8, kp 3.5) is the best raced design at
      304.77. Its oval finishes 13 of 20 (mean finish 1.90 s), but the s-bend (progress
      0.30) and slalom (progress 0.19) still end off track with steering_oscillation
      of 0.23 and 0.25. The kp 3.0 test (iteration 8) dropped the score to 296.66
      without clearing the bends, so kp is not the lever to push. Earlier steps showed
      that raising kd (0.3 to 0.5 to 0.8) cut oscillation and produced the only large
      gains. Change: controller.kd 0.8 to 1.0, with kp 3.5, sensor y 0.07, x -0.04
      to +0.04, sensor_size 0.012, base_speed 1.6, line_loss last_direction and geometry
      all unchanged. This is a single-variable test of more damping on the bends.
      Expected result: steering_oscillation on the s-bend and slalom falls below about
      0.23, progress on those tracks rises above 0.30 and 0.19, and the oval keeps
      at least 13 of 20 finishes, for a score at or above 304.77. Fallback: if the
      score is below 304.77 or oval finishes fall below 13 of 20, the derivative is
      past its useful range, so the Evaluator should approve the iteration 7 build
      (kd 0.8, kp 3.5). Hypotheses: (H1) more kd damps the overshoot that drives the
      bend line losses; (H2) if oscillation rises further, the derivative is amplifying
      sensor noise and kd should stay near 0.8; (H3) if the bends still fail with
      lower oscillation, the next lever is base_speed (lower for bend overshoot),
      not gain. Measurements wanted: completion, progress, completion_time, rms_error,
      max_error, line_loss_events, steering_oscillation and controller_errors on all
      three tracks.


      - [Open this output](iteration-9/entity0/versions/a9b87ad02f274fd4af570ec3ef0bb3e3/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/2437d676f8ef49bcb74d2ed56c141bfa/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-e6e2b8d0773c0e7b/payload.json)'
  - id: entityR1
    label: 'Revise: test kd 1.0 at kp'
    notes: 'The candidate repeats the raced best design (iteration 7, 304.77), so
      racing it again would add no information. I asked for kd 0.8 to 1.0 with kp
      3.5 unchanged, the one lever that moved the score most (64 to 305), with a fallback
      to kd 0.8 if it does not improve.


      ### Feedback


      Decision: revise. The candidate is the iteration 7 design (kp 3.5, kd 0.8, base_speed
      1.6, sensors y = 0.07, x = -0.04 to +0.04, sensor_size 0.012, line_loss last_direction).
      Iteration 7 is already the best raced design at 304.77. Racing an identical
      build would reproduce that known result and add no telemetry, so the iteration
      would gain nothing. There is enough budget for one revise round (review, revision,
      review, race) before the race, so I use it to test one new lever. Evidence:
      kd 0.3 to 0.5 gave about +1.5 points, and kd 0.5 to 0.8 (with kp 3.5) lifted
      the score from 64.17 to 304.77, mostly through oval finishes (13 of 20). Steering_oscillation
      on the s-bend and slalom is still 0.23 to 0.25 at kd 0.8, and those tracks still
      fail. The kp 3.0 test (iteration 8) lowered the score to 296.66 without clearing
      the bends, so kp is not the lever to push. Keep kp 3.5 and geometry unchanged,
      and raise kd. If the revised candidate scores at or above 304.77 with more s-bend
      or slalom progress, approve it. If it scores below 304.77 or oval finishes fall
      below 13 of 20, the derivative is past its useful range, so approve the kd 0.8
      build (iteration 7) instead.


      ### Requested changes


      - Set controller.kd from 0.8 to 1.0 and keep controller.kp 3.5, sensor y 0.07,
      base_speed 1.6 and line_loss last_direction. Iteration 4 to 7 showed kd gains,
      and s-bend and slalom steering_oscillation (0.23 to 0.25 at kd 0.8) is the remaining
      failure signal, so this tests whether more damping reduces it without losing
      oval finishes.

      - If the kd 1.0 revision scores below 304.77 or the oval finishes fall below
      13 of 20, return to the iteration 7 build (kd 0.8, kp 3.5) and approve it, since
      kd 0.8 is the best measured point.

      - Hold base_speed and geometry fixed in this round. If the revised candidate
      stays on track on all three tracks but misses the 3.0 s limit, raise base_speed
      from 1.6 toward 1.8 in a later iteration, not in this one.


      - [Open this output](iteration-9/entityR1/versions/2437d676f8ef49bcb74d2ed56c141bfa/payload.json)

