map:
  id: race-126-opt-eval
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Revert kp to 3.5, kd 0.8
    notes: 'Returns kp from 3.0 to 3.5 with kd 0.8 kept, since iteration 8 scored
      296.66, below the 304.77 best. Lowering kp did not reduce bend oscillation or
      raise s-bend progress, so this restores the best raced controller.


      ### Rationale


      Evidence from iteration 8 (kp 3.0, kd 0.8, base_speed 1.6, sensors at y = 0.07,
      x = -0.04 to +0.04, sensor_size 0.012, line_loss last_direction) scored 296.66,
      below iteration 7''s 304.77. The oval finish count held at 13 of 20, but its
      mean score fell from 716 to 695. On the s-bend, progress fell from 0.299 to
      0.282 and steering_oscillation fell only from 0.230 to 0.207. On the slalom,
      progress rose slightly from 0.187 to 0.195, steering_oscillation was unchanged
      at 0.253, and line-loss events fell from 1.4 to 1.05. Lowering kp therefore
      did not clear the bends and cost score overall. Following the Evaluator''s rule
      (score below 304.77 means kp 3.0 is too low for the oval), I return kp to 3.5
      and keep kd 0.8. This restores the best raced design. Geometry, sensor_weights,
      base_speed 1.6 and line_loss last_direction are unchanged, so the race reproduces
      iteration 7''s controller and should give about 304.77. I am not adding a second
      change this round, because the Evaluator approved only the kp return. Hypotheses
      for the next iteration: (H1) the bend failures come from the derivative term
      and the sensor row, not kp, because kd 0.5 to 0.8 gave the only large gain (64
      to 305) while kp changes moved little; (H2) a further kd step to about 1.0 may
      cut s-bend and slalom oscillation, since oscillation at kd 0.8 is still 0.23
      to 0.25; (H3) if the bends still fail with kd 1.0, the next lever is sensor
      geometry or a moderate base_speed reduction for the tighter bends. Measurements
      wanted: completion, progress, completion_time, rms_error, max_error, line_loss_events,
      steering_oscillation and controller_errors on all three tracks.


      - [Open this output](iteration-9/entity0/versions/46d331d700e549ed8d7a563225cd0c8c/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-f2603f44e52dce85/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-e6e2b8d0773c0e7b/payload.json)'
  - id: entityR1
    label: Approve kp 3.0 test
    notes: 'Approved the single-variable step kp 3.5 to 3.0 on the best raced design
      (kd 0.8, score 304.77), aimed at the s-bend and slalom steering oscillation
      of 0.23 and 0.25. Feedback sets follow-ups for the next race: kp 2.5 if it helps,
      a return to 3.5 if oval finishes fall, and a base_speed rise only if the bends
      hold.


      ### Feedback


      Approving the kp 3.5 to 3.0 step on the iteration 7 design. The candidate changes
      only controller.kp. Geometry (sensors at y = 0.07, x = -0.04 to +0.04, sensor_size
      0.012), kd 0.8, base_speed 1.6, line_loss last_direction and sensor_weights
      are unchanged, so the race isolates the gain effect. Iteration 7 (kd 0.8, kp
      3.5) is the best raced design at 304.77, with 13 of 20 oval finishes. Its s-bend
      and slalom runs still ended off track, with steering_oscillation of 0.23 and
      0.25 and line_loss_events of 1.1 and 1.4. That is the over-steer signal the
      kp reduction targets. The candidate is inside the contract and is not obviously
      broken. I make no claim about how it will perform. Interpret the race as follows.
      If the score is at or above 304.77 and s-bend or slalom steering_oscillation
      falls toward 0.15 with progress above 0.30 and 0.19, keep kp 3.0. Next, try
      kp 2.5 with kd 0.8 kept. If oval finishes drop below iteration 7''s 13 of 20,
      or the score falls below 304.77, kp 3.0 is too low for the oval. Return to kp
      3.5 with kd 0.8. If the robot stays on track on all three tracks but misses
      the 3.0 s limit, then speed is the constraint, so raise base_speed toward 2.0.
      The oval mean finish of 1.90 s suggests speed is not the limit there, so do
      not raise it while the bends are still failing.


      ### Requested changes


      - If the score is at or above 304.77 and s-bend or slalom steering_oscillation
      falls toward 0.15 with progress rising above 0.30 and 0.19: keep kd 0.8 and
      try controller.kp 2.5 to test whether further over-steer reduction holds the
      bends.

      - If oval finishes fall below iteration 7''s 13 of 20, or the score drops below
      304.77: return controller.kp to 3.5 with kd 0.8 kept, since the oval needs the
      stronger front-weighted steering that iteration 7 showed.

      - If the robot stays on track on all three tracks but misses the 3.0 s limit,
      raise controller.base_speed from 1.6 toward 2.0 with the chosen kp and kd, since
      oval mean finish time is 1.90 s and only the bends are failing.


      - [Open this output](iteration-8/entityR1/versions/828f9f99046e4501a333834a6b1b10f4/payload.json)

