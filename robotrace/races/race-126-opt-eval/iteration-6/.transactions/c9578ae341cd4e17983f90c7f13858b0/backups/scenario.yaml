map:
  id: race-126-opt-eval
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Sensor row y=0.08
    notes: 'Single-variable change from iteration 5: the sensor row moves from y=0.07
      to y=0.08 to add lookahead, since moving it from 0.04 to 0.07 gave the largest
      gain so far. Line loss stayed at 1 per run under search_right, and max_error
      is still about 0.063 m, so sensing is the next lever.


      ### Rationale


      Evidence from iteration 5 (search_right, otherwise identical to iteration 4):
      score 64.01 against 64.17 for last_direction. The line-loss setting made no
      measurable difference. Every track still shows exactly 1 line-loss event per
      run, max_error is 0.063 (oval), 0.064 (s-bend) and 0.065 (slalom), all above
      the 0.06 m off-track floor, and steering_oscillation is about 0.11 to 0.15.
      The Evaluator''s rule for this state (line loss stays at 1 with no change) says
      sensing is the blind spot, so the next lever is sensor geometry or kd. Two findings
      support sensor geometry. Moving the sensor row from y = 0.04 to y = 0.07 gave
      the largest gain so far (about +10 points, with line-loss events falling). kd
      0.3 to 0.5 gave only about +1.5 points and did not bring max_error under 0.06
      m. Change: move the sensor row forward from y = 0.07 to y = 0.08, the top of
      the allowed range. Everything else is unchanged: x spacing -0.04 to +0.04, sensor_size
      0.012, weights, kp 3.5, kd 0.5, base_speed 1.6 and line_loss search_right. Keeping
      search_right holds the line-loss response fixed, so this is a single-variable
      test of lookahead. Expected result: the extra 0.01 m of lookahead starts the
      correction earlier, so max_error should fall toward or below 0.06 m and line_loss_events
      should fall toward 0. Risks: the front row sees curvature earlier, so steering_oscillation
      may rise above about 0.15. If it does, the next step is kp 3.5 to 2.5, not less
      lookahead. If max_error is still above 0.06 m with line loss at 1, the next
      test is kd 0.5 to 0.8. If the robot stays on track but does not finish within
      3.0 s, raise base_speed toward 2.0, since the 3 s limit needs about 1.5 m/s
      average.


      - [Open this output](iteration-6/entity0/versions/deb22dc468034be09ab57e452aec2710/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-4aa236f14e141c7f/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-711a5a71cefa5794/payload.json)'
  - id: entityR1
    label: 'Revise: sensor row to'
    notes: 'The candidate''s rationale calls for y = 0.08, but its geometry still
      reads y = 0.07, so it would repeat iteration 5 (64.01, max_error about 0.064
      m, one line-loss event per run). Revising to apply the forward sensor move,
      the one lever that has previously cut line loss, as a single-variable test.


      ### Feedback


      Revise before racing. The rationale describes one change, sensor row y from
      0.07 to 0.08, but the geometry still reads y = 0.07 for all five sensors. As
      written, this candidate is the iteration 5 design (line_loss search_right) with
      no change, so racing it would repeat a known result. The evidence on record:
      iteration 5 (search_right) scored 64.01 against 64.17 for last_direction at
      iteration 4, with exactly 1 line-loss event per run and max_error 0.063 (oval),
      0.064 (s-bend) and 0.065 (slalom). Line-loss direction has not changed that
      state. Forward sensor placement is the one lever that has helped: moving the
      row from y = 0.04 to 0.07 gave about +10 points and cut line-loss events. Keeping
      search_right and kd 0.5 holds the other variables fixed, so the y = 0.08 change
      should be the only difference from iteration 5. Do the following: set every
      sensor''s y to 0.08 (x values unchanged at -0.04 to +0.04), keep sensor_size
      0.012, weights, kp 3.5, kd 0.5, base_speed 1.6 and line_loss search_right, and
      update the rationale so it matches the geometry. Interpret the next race as
      follows. If max_error falls below 0.06 m, or line_loss_events drop to 0, keep
      y = 0.08. If steering_oscillation rises above about 0.15 at y = 0.08, the next
      step is kp 3.5 to 2.5 rather than less lookahead. If max_error is still above
      0.06 m with line loss at 1, the next test is kd 0.5 to 0.8. If the robot stays
      on track but does not finish within 3.0 s, raise base_speed toward 2.0, since
      the limit needs about 1.5 m/s average.


      ### Requested changes


      - Set geometry.sensor_positions y from 0.07 to 0.08 for all five sensors (x
      unchanged at -0.04, -0.02, 0.0, 0.02, 0.04), and update the rationale to match.
      Iteration 4 to 5 showed that y = 0.07 with search_right leaves max_error at
      0.063 to 0.065 m and one line-loss event per run, and forward placement was
      the one lever that moved line loss (iteration 3 vs 2).

      - Keep controller.line_loss at search_right, kp 3.5, kd 0.5, base_speed 1.6
      and sensor_size 0.012 unchanged, so the y = 0.08 move is the only variable against
      iteration 5. If steering_oscillation then rises above about 0.15 while on track,
      lower kp toward 2.5 in the next revision rather than moving lookahead back.

      - If max_error stays above 0.06 m with line_loss_events of 1 at y = 0.08, raise
      controller.kd from 0.5 toward 0.8 in the next revision; if the robot stays on
      track but misses the 3.0 s limit, raise base_speed toward 2.0.


      - [Open this output](iteration-6/entityR1/versions/4cea8f842ee14c6296309dcde4480492/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/deb22dc468034be09ab57e452aec2710/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-711a5a71cefa5794/payload.json)'
