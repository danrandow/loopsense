  entities:
  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'Initial baseline with no race data: five sensors at 0.02 m spacing, kp
      3, kd 0.3, base speed 1.2, and last-direction line recovery. Chosen from the
      contract''s physics to target about 1.5 m/s with moderate steering gain. Hypotheses
      and next measurements are in the rationale.


      ### Rationale


      Iteration 0 has no race telemetry, so this is a conservative baseline built
      from the contract''s physics and sensing rules. Geometry: five line sensors
      at 0.02 m spacing across the front of the axle (y = 0.04 m, x from -0.04 to
      +0.04 m) give a wide, symmetric view of the 25 mm tape and can still see the
      line through moderate bends. Sensor size 0.012 m is about half the tape width,
      so readings change smoothly as the line moves. Wheel track 0.12 m and wheel
      radius 0.03 m are mid-range. Mass 0.8 kg and body 0.12 x 0.18 m keep yaw inertia
      moderate for quick turn response. Controller: signal is a reading-weighted average
      with weights -2, -1, 0, 1, 2. Positive means left, so a line on the left gives
      a positive signal and steers left. kp = 3 gives a moderate steering response
      (turn of about 3 per unit signal). kd = 0.3 damps the oscillation expected from
      a proportional-only loop. ki = 0.05 is small, to avoid integral windup on long
      bends. base_speed = 1.2 (about 0.6 of full PWM) targets the roughly 1.5 m/s
      average needed to finish in 3 s, with headroom for slowing on curves. line_loss
      = last_direction, so the robot keeps turning the way it was heading when it
      leaves the tape. Expected result: completion on the oval and s-bend, with some
      oscillation on the slalom. Next, I want per-track completion and line-loss counts
      to see whether speed or steering gain is the limit, and steering_oscillation
      to judge whether kd should rise.


