  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence: iteration 2 (sensors at x = ±0.03 m, y = 0.06 m, body_length 0.14,
      kp 4.5, kd 0.8, base_speed 0.9) is still the best design at 759.6. Oval finishes
      19/20 and s-bend 19/20. Slalom is the weak track: 5/20 finish, 14 go off track,
      mean progress 0.75, and finished runs take 2.94 s, so there is almost no time
      margin. Slalom steering_oscillation (0.37) and control_effort (10.3) are the
      highest of any track, which points to over-correction on alternating bends.
      Iteration 3 widened the array to ±0.04 m and scored 681.8. Slalom fell from
      441 to 239 and s-bend dropped too, so the wider array is rejected and the ±0.03
      m layout is restored.


      Change: start from the iteration 2 geometry and change one controller variable,
      kd 0.8 to 1.0, to damp the slalom over-correction. The sensors, sensor_size,
      body, wheels, mass, base_speed, kp, ki and line_loss stay as in iteration 2,
      so the effect of kd is attributable.


      Hypotheses: (H1) Higher kd reduces slalom off-track endings and steering_oscillation
      without losing much oval or s-bend completion. (H2) If slalom is still off track
      with kd 1.0, the limit is the sensor footprint or speed, not damping. The next
      test would be sensor_size 0.016 or base_speed 0.8.


      Expected result: slalom finish rate rising above 25% and oscillation falling
      below 0.33. Oval and s-bend should hold near 0.95 completion. Risk: kd amplifies
      sensor noise, which could raise oscillation on the oval.


      Measurements wanted: completion, progress and completion_time per track; max_error
      and line_loss_events on slalom; steering_oscillation and control_effort to check
      whether kd damps the jitter; noise_robustness to see the noise margin.


