  entities:
  - id: entity0
    label: Tighter turns, less speed
    notes: 'Cuts base_speed to 0.9 and body_length to 0.14 (less yaw inertia), and
      raises kp to 4.5 and kd to 0.8. The s-bend and slalom went off-track at max_error
      0.06 in the last race, so this targets bend overshoot while keeping the sensor
      layout that improved finishes.


      ### Rationale


      Evidence from the last race (iteration 1, entityR2A): score 446, up from 88.
      Oval finishes 15/20 (mean progress 0.92, max_error 0.026, rms 0.008). S-bend
      finishes 3/20 (progress 0.79, max_error 0.061). Slalom finishes 0/20 (progress
      0.35). Every failure is off_track, and max_error reaches the 0.06 m limit (body_width/4
      term is only 0.036, so the limit is fixed at 0.06 m). Line-loss events average
      about 1 per run. Steering_oscillation is moderate (0.23 to 0.37), so the loop
      is not jittering. The robot tracks well near the line and then runs wide on
      bends it cannot turn back from. Moving the sensors forward to y=0.06 and narrowing
      the spread to +/-0.03 m clearly helped (iteration 0 to 1), so I keep that layout.


      Hypotheses: (1) On the s-bend and slalom, the robot still enters bends at too
      much speed, so it overshoots the line before steering responds. (2) Turning
      authority is limited by yaw inertia, which is set by mass*(body_length^2+body_width^2)/12.
      A shorter body lowers it and lets the robot turn back faster. (3) kp=4 with
      kd=0.6 leaves a little room: oscillation is low, so a stronger proportional
      response with more damping should cut max_error without causing jitter.


      Changes: base_speed 1.0 to 0.9 (less overshoot on bends; the oval still has
      time margin because it finished in about 2.0 s, and the 3 s limit allows some
      slack). kp 4.0 to 4.5 for a stronger corrective turn. kd 0.6 to 0.8 to damp
      the higher gain; the s-bend oscillation of 0.37 leaves room. body_length 0.18
      to 0.14 to cut yaw inertia about 20 percent (mass*(L^2+W^2)/12 falls from about
      0.0034 to 0.0029 with W=0.12). Sensor layout, sensor size, wheel geometry, mass,
      body_width, ki and line_loss are unchanged, so the effect of the change is attributable
      to speed, gains and inertia.


      Expected result: fewer off_track endings on the s-bend and slalom (max_error
      below 0.06), slalom progress rising above 0.5, and oval completion holding.
      Risk: lower base_speed may push completion time near 3 s on the longer tracks.


      Hypotheses to test next: if off-track is still on tight bends, the next step
      is a wider sensor spread (+/-0.04) or a larger sensor (0.016). If the robot
      now completes but is slow, raise base_speed back toward 1.0 with the higher
      kd.


      Measurements to check: completion and completion_time per track, max_error and
      line_loss_events (are they lower at the same bends?), and steering_oscillation
      (is the higher kp and kd causing jitter?).


