  - id: entity0
    label: Iter 6 + kp 5.0
    notes: 'Reverts to the best design so far (iteration 6, score 945.4), since iteration
      7''s mass and speed change scored lower. It changes only kp from 4.5 to 5.0
      to test whether more steering authority cuts line-loss events.


      ### Rationale


      Evidence: iteration 6 is the best design so far (945.4). Oval, s-bend and slalom
      each finish 20/20, with progress about 0.996 and rms_error about 0.006. Iteration
      7 (mass 0.5, base_speed 0.95) scored 941.6, lower. Its finish times rose (oval
      2.23 s vs 1.99 s, slalom 2.79 s vs 2.57 s) and control effort went up, so the
      extra speed and lighter mass did not pay off. I therefore revert to the iteration
      6 design. The remaining gaps are line-loss events (0.1 to 0.5 per run, about
      15 points each) and completion time (about 2 points per 0.1 s). Steering gain
      is the one lever I have not tested on this geometry. Plan: keep the iteration
      6 geometry and controller exactly, and change only kp from 4.5 to 5.0 (about
      11% more steering authority). Expected result: fewer line-loss events and lower
      rms_error on the s-bend and slalom, with completion holding at 100%. Risk: more
      steering_oscillation on the oval, which is currently 0.21, so there is room.
      Hypotheses: H1, line losses come from the robot turning back too slowly on the
      sharper bends, so a higher kp reduces them. H2, if steering_oscillation rises
      above about 0.35 with no line-loss gain, kp is past its useful range and I should
      return to 4.5. Measurements wanted: line_loss_events, completion_time and max_error
      per track, plus steering_oscillation and control_effort to check whether the
      stronger steering adds jitter.


