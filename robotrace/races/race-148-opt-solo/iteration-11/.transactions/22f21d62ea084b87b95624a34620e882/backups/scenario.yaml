  - id: entity0
    label: 'Final: iter 6 design kept'
    notes: 'Resubmits the iteration 6 design unchanged, the best raced result (945.4,
      20/20 finishes on all development tracks). Iterations 7 to 10 each changed one
      variable and none beat it, so the final candidate prioritises the most robust
      known design for the unseen track.


      ### Rationale


      This is the final iteration, so the priority is the design most likely to score
      well on an unseen track, not further exploration. Iteration 6 is the best result
      so far (945.42). Every development track finished 20/20, with progress about
      0.996 to 0.998 and rms_error about 0.006. Later tweaks did not beat it: kp 5.0
      (iteration 8) gave 945.14, kd 1.2 (iteration 9) gave 941.04, mass 0.5 with base_speed
      0.95 (iteration 7) gave 941.60, and ki 0.10 (iteration 10) gave 944.10. Those
      differences are within noise, and each departure from iteration 6 has been neutral
      or negative, so I resubmit iteration 6 unchanged. Geometry: five line sensors
      at x = -0.03, -0.015, 0, 0.015, 0.03 m and y = 0.06 m, sensor_size 0.016 m,
      wheel_track 0.12 m, wheel_radius 0.03 m, body 0.11 m long by 0.12 m wide, mass
      0.6 kg. Controller: base_speed 0.9, kp 4.5, ki 0.05, kd 1.0, sensor_weights
      [-2, -1, 0, 1, 2], line_loss last_direction. Expected result: the same as iteration
      6, about 945 on the development tracks, with 100 percent completion. The main
      residual losses are line_loss_events (0.1 to 0.5 per run) and completion time
      (2.0 to 2.6 s). Measurements wanted: completion, progress, completion_time,
      rms_error, max_error and line_loss_events on each track, plus steering_oscillation
      and control_effort, to confirm the robustness of this design before the unseen-track
      race.


