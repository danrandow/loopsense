map:
  id: race-225-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Sensor size 0.016 m
    notes: 'Keeps the widened 0.024 m sensor row, which raised progress on all three
      tracks versus iteration 0, and enlarges sensor footprints from 12 to 16 mm.
      This follows the Integrator''s condition for the slalom, where line_loss_events
      were 2.0 in every trial. Evidence: iteration 1 race data and Integration Feedback.


      ### Rationale


      Iteration 1 met the Integrator''s first condition. Progress rose on all three
      tracks versus iteration 0: oval 0.176 to 0.952, s-bend 0.135 to 0.380, slalom
      0.094 to 0.120. So the widened row (x = -0.024 to +0.024 m at y = 0.04 m) is
      kept. The Integrator''s second condition (max_error still at 0.06 m with low
      steering oscillation) is not met. Steering oscillation rose on the s-bend (0.134
      to 0.265) and sits at 0.20 on the slalom, so I am not reducing yaw inertia yet.
      The third condition does apply. Slalom line_loss_events is 2.0 in every slalom
      trial, and that track carries the most line-loss events. The Integrator''s suggested
      fix is sensor_size 0.016 with the same positions, so I am taking it. A 16 mm
      footprint covers more of the 25 mm tape at the same sensor positions, which
      should give more signal per sensor when the robot is off-centre or alternating
      across the line. I am changing only sensor_size, so the race isolates this effect.
      I expect fewer slalom line-loss events and some progress gain on the slalom,
      with the oval unchanged or slightly better. Completion on the s-bend and slalom
      is still unlikely, so yaw response (wheel_track 0.10 m) remains the next candidate
      if max_error stays at the limit.


      - [Open this output](iteration-2/entity0/versions/93ac0d2666444675a796668f2ae606ee/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-30c0ee0098611f29/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-4017cf031d14601d/payload.json)'
  - id: entity1
    label: Bigger sensors, damped
    notes: 'Keeps the widened row and raises sensor_size to 0.016 m to address the
      slalom''s 2.0 line losses per run. Drops base_speed to 1.1 and raises kd to
      0.8 to curb s-bend overshoot (oscillation 0.265, max_error 0.064 m), based on
      the iteration 1 race.


      ### Rationale


      Iteration 1 is the only race evidence. The widened row (x = -0.024 to +0.024
      m) roughly doubled oval progress (0.95 with 70% finishes) and lifted s-bend
      progress from 0.14 to 0.38. The s-bend and slalom still end off-track. Max_error
      sits at about 0.064 m, just past the 0.06 m limit, and steering_oscillation
      is 0.265 on the s-bend, so the controller is overshooting on alternating bends.
      The slalom loses the line exactly 2.0 times per run. The geometry now changes
      sensor_size from 0.012 to 0.016 m, which should give more tape signal per sensor
      and reduce those losses. Because the signal is a weighted average, that change
      should leave the signal scale roughly the same. I keep the iteration 1 weights
      and line-loss rule, and make two controller changes. First, base_speed drops
      from 1.2 to 1.1 to give the steering more time on tight bends. The oval''s completion
      time rises from about 1.9 s to about 2.1 s, which is still inside the 3 s limit.
      Second, kd rises from 0.6 to 0.8 to damp the overshoot that shows as oscillation.
      kp stays at 5.0 because iteration 1 showed that a stronger gain was needed to
      finish the oval. Expected result, unmeasured: fewer slalom line losses from
      the larger footprint, and less s-bend oscillation from the damping. If max_error
      still exceeds 0.06 with oscillation at or below 0.27, the limit is yaw response,
      which the Builder''s wheel_track test addresses.


      - [Open this output](iteration-2/entity1/versions/a4b34e09515447ebbd8ecd029990f7fc/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/93ac0d2666444675a796668f2ae606ee/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-4017cf031d14601d/payload.json)'
  - id: entityR1
    label: Keep row, test yaw next
    notes: 'Recommends keeping the widened row, which raised oval progress from 0.18
      to 0.95 in iteration 1. It sets out the next test (wheel_track 0.10 m) if slalom
      line losses and max_error persist, and notes that body_width cannot move the
      off-track limit.


      ### Feedback


      Written before this candidate races. The evidence is iteration 0 and iteration
      1. Iteration 1 showed that widening the row to x = -0.024 to +0.024 m raised
      oval progress from 0.18 to 0.95 and s-bend progress from 0.14 to 0.38, so keep
      that row. Its remaining limits are these. On the s-bend, max_error reached 0.064
      m, which is above the 0.06 m off-track limit, and steering_oscillation was 0.265.
      On the slalom, line_loss_events was exactly 2.0 in all 20 trials, and progress
      stayed at 0.12. This points to the 12 mm footprint seeing too little tape on
      sharp alternations. Note that the off-track limit is max(0.06, 0.0125 + body_width/4).
      For body_width up to 0.18 m, that gives at most 0.0575 m, so the limit stays
      at 0.06 m and body width is not a useful lever. The sensor size change to 0.016
      m is the one I am carrying into this candidate. Wheel_track matters because
      turn rate is the wheel speed difference divided by wheel_track, so a shorter
      track gives more yaw response per unit of wheel differential. Yaw inertia depends
      only on mass and body dimensions. Depending on the next race: if slalom line_loss_events
      fall below 2.0 with the larger footprint, keep sensor_size 0.016. If they stay
      at 2.0 and max_error still reaches 0.06 m, yaw response is the limit, so test
      wheel_track 0.10 m. If steering_oscillation rises above about 0.3 on the s-bend
      with no change in losses, try reducing mass to 0.6 kg rather than changing the
      sensors.


      ### Requested changes


      - Keep the widened row (x = -0.024 to +0.024 m at y = 0.04 m), which raised
      progress on all three tracks in iteration 1, and keep sensor_size 0.016 m.

      - If slalom line_loss_events stay at 2.0 and max_error stays at or above 0.06
      m after the sensor change, try wheel_track 0.10 m, because iteration 1 shows
      the s-bend and slalom are limited by yaw response.

      - If steering_oscillation on the s-bend rises above about 0.3 without fewer
      line losses, try mass 0.6 kg to lower yaw inertia. Do not change body_width,
      since it does not move the off-track limit within its allowed range.


      - [Open this output](iteration-2/entityR1/versions/a4b34e09515447ebbd8ecd029990f7fc/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/93ac0d2666444675a796668f2ae606ee/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-4017cf031d14601d/payload.json)'
