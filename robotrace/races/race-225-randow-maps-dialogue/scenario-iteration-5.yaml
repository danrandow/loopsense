  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Mass 0.7 kg midpoint
    notes: 'Moves mass from 0.6 back toward the 0.8 kg best, keeping the 12 mm widened
      row and 0.12 m track. Iteration 4 showed lighter mass cut oval finishes from
      0.70 to 0.30 while oscillation rose, so the Integrator''s mass-back rule applies.


      ### Rationale


      Iteration 4 tested mass 0.6 kg against the iteration 1 best (324.07) and scored
      247.82. Oval finish rate fell from 0.70 to 0.30 and oval steering_oscillation
      rose from 0.26 to 0.32, so the lighter robot is losing grip rather than gaining
      turn response. This matches the Integrator''s rule: when finishes fall while
      oscillation rises, move mass back toward 0.7 to 0.8 kg. Iteration 3 (wheel_track
      0.10) and iteration 2 (16 mm sensors) both hurt the oval, so I am keeping the
      widened 12 mm row and the 0.12 m track. I am taking the Integrator''s midpoint,
      mass 0.7 kg. That is a single-variable step back toward the best-known mass
      of 0.8 kg, so it tests whether the mass-finish relationship is monotonic and
      whether 0.7 recovers the oval without the yaw-inertia cost of 0.8. I expect
      oval finish rate near 0.5 to 0.7 and oscillation at or below about 0.3. If the
      oval does not recover, the next candidate is mass 0.8 kg, the known best.


      - [Open this output](iteration-5/entity0/versions/9abd875d6935413f81d01a7ea35c5f67/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-f12612c2bbd17d78/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-997f40c6bc95ccb3/payload.json)'
  - id: entity1
    label: Mass 0.7 kg, iter-1 gains
    notes: 'Builder''s 0.7 kg geometry with the iteration 1 controller held unchanged,
      so the race isolates mass. Evidence: 0.6 kg cut oval finishes from 0.70 to 0.30
      (iteration 4), and 0.8 kg is the best raced mass (iteration 1).


      ### Rationale


      Iteration 4 is the only race evidence for mass. At 0.6 kg the oval finish rate
      fell from 0.70 (iteration 1, 0.8 kg) to 0.30, and oval steering_oscillation
      rose from 0.26 to 0.32. Iteration 3 showed that a shorter wheel_track (higher
      yaw gain) also cut oval finishes to 0.10, so yaw gain is not the lever. The
      Builder''s candidate is mass 0.7 kg with the iteration 1 row, 12 mm sensors
      and wheel_track 0.12 m, which is a single-variable step back toward 0.8 kg.
      I keep the geometry exactly as proposed. For the controller I reuse the iteration
      1 settings (kp 5.0, ki 0.05, kd 0.6, base_speed 1.2, last_direction, weights
      [-1, -0.5, 0, 0.5, 1]). Changing the gains as well would confound the mass test,
      and iteration 4 already showed that the same gains at 0.6 kg lose finishes,
      so I expect the oval to recover partly and oscillation to sit between 0.26 and
      0.32. Because the controller is unchanged, any shift in outcome comes from the
      mass. The oval finish rate should land near 0.5 if the mass-grip relationship
      is monotonic. If it does not recover, the next step is mass 0.8 kg, the best
      known design.


      - [Open this output](iteration-5/entity1/versions/09bb18f6fa254123aed42e9ad5ac3fd5/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/9abd875d6935413f81d01a7ea35c5f67/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-997f40c6bc95ccb3/payload.json)'
  - id: entityR1
    label: Mass 0.7 then 0.8 kg
    notes: 'Pre-race feedback: hold 0.7 kg if oval finishes recover to about 0.5 with
      oscillation at or below 0.3, otherwise return to the 0.8 kg best. Shorter track
      (iteration 3) and 16 mm sensors (iteration 2) both hurt the oval, so both stay
      fixed.


      ### Feedback


      Written before this candidate has raced. The evidence is iterations 0 to 4.
      Iteration 1 (0.8 kg, widened 12 mm row, wheel_track 0.12 m, score 324.07) is
      the reference: oval finish rate 0.70, oval steering_oscillation 0.26. Iteration
      4 (0.6 kg, same geometry and controller, score 247.82) cut oval finishes to
      0.30 and raised oscillation to 0.32, so the lighter robot is losing grip rather
      than gaining turn response. Iteration 3 (wheel_track 0.10 m, kp 4.5) also cut
      oval finishes, to 0.10, so shorter track is not the fix. Iteration 2 (16 mm
      sensors) collapsed oval finishes to 0.00, so keep 12 mm. The mass 0.7 kg candidate
      is a sensible midpoint test. Depending on the next race: if oval finishes return
      to about 0.5 or more with oscillation at or below about 0.3, hold mass at 0.7
      kg. If finishes stay near 0.3 while mass 0.7 kg is no better than 0.6 kg, treat
      it as noise and return to 0.8 kg, the best known mass. Do not move the sensors
      or the track again, because the evidence for those is already used up.


      ### Requested changes


      - If oval finish rate at 0.7 kg is about 0.5 or more with steering_oscillation
      at or below about 0.3, hold mass at 0.7 kg and keep the rest of the geometry
      fixed (iteration 4 showed mass 0.6 kg loses grip).

      - If the oval finish rate at 0.7 kg stays near 0.3 or below, return to mass
      0.8 kg, the iteration 1 best (oval finish 0.70), and do not try a lower mass
      again.

      - Do not change sensor_size or reduce wheel_track below 0.12 m. Iteration 2
      (16 mm sensors) and iteration 3 (0.10 m track) both hurt the oval finish rate.


      - [Open this output](iteration-5/entityR1/versions/09bb18f6fa254123aed42e9ad5ac3fd5/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/9abd875d6935413f81d01a7ea35c5f67/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-997f40c6bc95ccb3/payload.json)'
