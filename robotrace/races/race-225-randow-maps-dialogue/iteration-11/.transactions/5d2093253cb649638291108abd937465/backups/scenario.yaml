overrides:
  entities:
  - id: entity0
    label: Revert to y=0.06 m row
    notes: 'Holds the iteration 9 geometry (y = 0.06 m, 12 mm sensors, x -0.024 to
      +0.024 m), the best raced design at 620.55. Iteration 10''s y = 0.07 m test
      dropped s-bend finishes from 17 to 9 and missed the slalom max_error threshold,
      so the Integrator''s keep rule returns to y = 0.06 m.


      ### Rationale


      Iteration 10 raced the forward row at y = 0.07 m and scored 546.57, below the
      iteration 9 design at y = 0.06 m (620.55). Oval held at 1.00 finish rate, but
      s-bend finishes fell from 17 of 20 to 9 of 20 and slalom max_error only moved
      from 0.066 m to 0.061 m, still above the 0.06 m off-track limit. The Integrator''s
      keep rule for y = 0.07 m requires oval finish at least 0.9 and slalom max_error
      below 0.06 m. The oval condition is met, but the slalom condition is not, and
      the s-bend cost is large. The rule therefore points back to y = 0.06 m. The
      simulator is deterministic (iterations 1 and 6 matched exactly), so reverting
      to the iteration 9 geometry should reproduce its measured score. I am holding
      the geometry unchanged, not testing further forward offsets, and not revisiting
      sensor size, track, mass or body width, since iterations 2 to 5 showed those
      cut the oval finish rate. Because this is the final iteration, the reliable
      choice is the best raced geometry, not an untested gamble on slalom.


      - [Open this output](iteration-11/entity0/versions/db609ab122894c158c1802bbfe8961f2/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-899674df01a5853a/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-63a8f479756b1bde/payload.json)'
  - id: entity1
    label: Reproduce iter 9 best
    notes: 'Returns the y = 0.06 m row with the iteration 9 controller (kd 0.8) unchanged.
      Iteration 9 scored 620.55 and the simulator is deterministic. Iteration 10''s
      y = 0.07 m row lowered s-bend finishes from 17 to 9 of 20, so it is not used.


      ### Rationale


      The Builder''s proposal returns to the y = 0.06 m forward row, which is the
      geometry the iteration 9 controller was measured on. Iteration 10 tested y =
      0.07 m and scored 546.57, below iteration 9''s 620.55. Its oval finish rate
      held at 1.00, but s-bend finishes fell from 17 of 20 to 9 of 20, and slalom
      max_error only fell to 0.061 m, still above the 0.06 m off-track limit. The
      keep rule I stated for y = 0.07 m therefore failed, so the forward offset is
      past its useful range. The simulator is deterministic (iteration 6 reproduced
      iteration 1 exactly), so the iteration 9 design should reproduce its 620.55
      score. I am keeping the iteration 9 controller exactly: kp 5.0, ki 0.05, kd
      0.8, base_speed 1.2, last_direction, and weights [-1, -0.5, 0, 0.5, 1]. Nothing
      has been tested beyond iteration 9 that beats it, and this is the final iteration,
      so a measured-best design is safer than an untested change. Slalom remains off-track
      with max_error about 0.066 m. That is a controller limit I cannot fix with a
      verified change in this iteration.


      - [Open this output](iteration-11/entity1/versions/128f541e144b494c8764135723746c57/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/db609ab122894c158c1802bbfe8961f2/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-63a8f479756b1bde/payload.json)'
  - id: entityR1
    label: Hold y=0.06, no further
    notes: 'Feedback endorses holding the y = 0.06 m row. It cites iteration 9 as
      the best raced design and iteration 10 as the reason not to move to y = 0.07
      m. It names no new geometry changes.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Iteration
      9 (y = 0.06 m, kd 0.8, 620.55) is the best raced design, and this candidate
      reproduces it. Iteration 10 (y = 0.07 m, same controller, 546.57) showed that
      the forward offset costs s-bend completions (17 to 9 of 20) while oval finishes
      held at 1.00 and slalom max_error only moved from 0.066 to 0.061 m. Iteration
      8 showed that moving the row from y = 0.04 to 0.06 m raised oval finishes from
      0.70 to 0.95 and slalom progress from 0.12 to 0.16, and iteration 9 showed kd
      0.8 cut s-bend max_error to 0.040 m. So y = 0.06 m with kd 0.8 is the measured
      optimum across the tested sensor rows. Iterations 2 to 5 showed that sensor_size
      0.016, wheel_track 0.10 and mass 0.6 or 0.7 each cut the oval finish rate, so
      those stay fixed. Slalom is the remaining limit, and it is a controller problem
      rather than a geometry problem.


      ### Requested changes


      - Hold the y = 0.06 m row with x = -0.024 to +0.024 m, 12 mm sensors, wheel_track
      0.12 m and mass 0.8 kg, since iteration 9 is the measured best (620.55).

      - Do not move the row to y = 0.07 m again; iteration 10 showed it cuts s-bend
      finishes from 17 to 9 of 20 for little slalom gain.

      - Do not change sensor_size, wheel_track or mass; iterations 2 to 5 each lowered
      the oval finish rate.


      - [Open this output](iteration-11/entityR1/versions/128f541e144b494c8764135723746c57/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/db609ab122894c158c1802bbfe8961f2/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-63a8f479756b1bde/payload.json)'
