map:
  id: race-225-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: Revert to y=0.06 m row
    notes: 'Holds the iteration 9 geometry (y = 0.06 m, 12 mm sensors, x -0.024 to
      +0.024 m), the best raced design at 620.55. Iteration 10''s y = 0.07 m test
      dropped s-bend finishes from 17 to 9 and missed the slalom max_error threshold,
      so the Integrator''s keep rule returns to y = 0.06 m.


      ### Rationale


      Iteration 10 raced the forward row at y = 0.07 m and scored 546.57, below the
      iteration 9 design at y = 0.06 m (620.55). Oval held at 1.00 finish rate, but
      s-bend finishes fell from 17 of 20 to 9 of 20 and slalom max_error only moved
      from 0.066 m to 0.061 m, still above the 0.06 m off-track limit. The Integrator''s
      keep rule for y = 0.07 m requires oval finish at least 0.9 and slalom max_error
      below 0.06 m. The oval condition is met, but the slalom condition is not, and
      the s-bend cost is large. The rule therefore points back to y = 0.06 m. The
      simulator is deterministic (iterations 1 and 6 matched exactly), so reverting
      to the iteration 9 geometry should reproduce its measured score. I am holding
      the geometry unchanged, not testing further forward offsets, and not revisiting
      sensor size, track, mass or body width, since iterations 2 to 5 showed those
      cut the oval finish rate. Because this is the final iteration, the reliable
      choice is the best raced geometry, not an untested gamble on slalom.


      - [Open this output](iteration-11/entity0/versions/db609ab122894c158c1802bbfe8961f2/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-899674df01a5853a/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-63a8f479756b1bde/payload.json)'
  - id: entity1
    label: Forward row y=0.07 test
    notes: 'Moves the 12 mm sensor row from y = 0.06 m to 0.07 m with the iteration
      9 controller unchanged, a single-variable test. Keep rules and fallback are
      set against iteration 9 (620.55), where the oval finished 20 of 20.


      ### Rationale


      Iteration 9 (y = 0.06 m, kd 0.8) is the best raced design at 620.55. Oval finished
      20 of 20, s-bend 17 of 20 with mean max_error 0.040 m, and slalom ended off-track
      in all 20 trials with mean max_error 0.066 m and progress 0.19. The Builder''s
      proposed row moves to y = 0.07 m, with x and sensor size unchanged. The Builder''s
      stated keep rule is an oval finish rate of at least 0.9 and slalom max_error
      below 0.06 m. I accept that rule and the fallback to y = 0.06 m if the oval
      finish rate drops below 0.8. I keep the iteration 9 controller exactly (kp 5.0,
      ki 0.05, kd 0.8, base_speed 1.2, last_direction, weights [-1, -0.5, 0, 0.5,
      1]). The sensor x positions are unchanged, so the signal scale and weights still
      match the row, and the only variable under test is the forward offset. The forward
      step is expected to raise s-bend steering oscillation further (it rose from
      0.27 to 0.36 between y = 0.04 and y = 0.06), so kd 0.8 is the damping most likely
      to be stressed. Slalom progress (0.19) is far from a finish, so I do not expect
      slalom completion in this race. The main risk is that the oval finish rate falls
      below 0.8 because the controller is tuned to y = 0.06 m, in which case the Builder''s
      fallback applies.


      - [Open this output](iteration-10/entity1/versions/abb2daaa680546ec83ac77fb5f1b7469/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/58745ba1ecc04f4b8e8f98fb7c20edb8/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-f590b1637d6e1ae8/payload.json)'
  - id: entityR1
    label: Keep y=0.07 only if oval
    notes: 'Feedback states the keep and fallback conditions for y = 0.07 m, tied
      to iterations 8 and 9. It is candid that slalom max_error at about 0.066 m is
      unlikely to be fixed by a forward offset alone.


      ### Feedback


      Written before this candidate has raced. The evidence is iterations 0 to 9.
      Iteration 9 (y = 0.06 m, kd 0.8, score 620.55) is the best raced design and
      the base to hold if y = 0.07 m fails. Oval finished 20 of 20, and s-bend finished
      17 of 20 with mean max_error 0.040 m. Slalom still ends off-track in all trials,
      with mean max_error 0.066 m and progress 0.19, so slalom is the limiting track.
      Iteration 8 showed that moving the row from y = 0.04 to y = 0.06 m raised oval
      finishes from 0.70 to 0.95 and slalom progress from 0.12 to 0.16. It also raised
      s-bend steering oscillation from 0.27 to 0.36, which is why I added kd 0.8 in
      iteration 9. The forward offset therefore makes the controller work harder on
      bends, and it is not a clear fix for slalom max_error. Iteration 9 confirmed
      that kd 0.8 with the y = 0.06 m row raised the score by 217 over iteration 8,
      so the controller change worked. Your y = 0.07 m step is a reasonable next test
      under the keep rule you stated. Be realistic about slalom: a forward offset
      alone is unlikely to move slalom max_error from about 0.066 m below 0.06 m,
      and slalom completion is unlikely in this iteration. Depending on the next race:
      if the oval finish rate is at least 0.9 and slalom max_error falls below 0.06
      m, keep y = 0.07 m. If the oval finish rate is between 0.8 and 0.9 with slalom
      max_error still at or above 0.06 m, keep y = 0.06 m and treat slalom as a controller
      problem. If the oval finish rate is below 0.8, return to y = 0.06 m. Do not
      test further forward offsets beyond y = 0.07 m, and do not revisit sensor_size,
      wheel_track, mass or body width, since iterations 2 to 5 showed each one cut
      the oval finish rate.


      ### Requested changes


      - Keep y = 0.07 m only if the oval finish rate is at least 0.9 and slalom max_error
      falls below 0.06 m, compared with iteration 9 (oval 1.00, slalom max_error 0.066
      m).

      - If the oval finish rate falls below 0.8, return to the iteration 9 row at
      y = 0.06 m with kd 0.8 and stop testing forward offsets.

      - Keep sensor_size 0.012 m, wheel_track 0.12 m, mass 0.8 kg and x = -0.024 to
      +0.024 m fixed. Slalom max_error is now a controller problem, so the Integrator
      will address it through kd, kp or base_speed rather than another geometry change.


      - [Open this output](iteration-10/entityR1/versions/abb2daaa680546ec83ac77fb5f1b7469/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/58745ba1ecc04f4b8e8f98fb7c20edb8/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-f590b1637d6e1ae8/payload.json)'
