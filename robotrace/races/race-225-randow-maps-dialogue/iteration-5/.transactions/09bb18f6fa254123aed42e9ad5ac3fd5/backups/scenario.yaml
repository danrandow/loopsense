  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Mass 0.7 kg midpoint
    notes: 'Moves mass from 0.6 back toward the 0.8 kg best, keeping the 12 mm widened
      row and 0.12 m track. Iteration 4 showed lighter mass cut oval finishes from
      0.70 to 0.30 while oscillation rose, so the Integrator''s mass-back rule applies.


      ### Rationale


      Iteration 4 tested mass 0.6 kg against the iteration 1 best (324.07) and scored
      247.82. Oval finish rate fell from 0.70 to 0.30 and oval steering_oscillation
      rose from 0.26 to 0.32, so the lighter robot is losing grip rather than gaining
      turn response. This matches the Integrator''s rule: when finishes fall while
      oscillation rises, move mass back toward 0.7 to 0.8 kg. Iteration 3 (wheel_track
      0.10) and iteration 2 (16 mm sensors) both hurt the oval, so I am keeping the
      widened 12 mm row and the 0.12 m track. I am taking the Integrator''s midpoint,
      mass 0.7 kg. That is a single-variable step back toward the best-known mass
      of 0.8 kg, so it tests whether the mass-finish relationship is monotonic and
      whether 0.7 recovers the oval without the yaw-inertia cost of 0.8. I expect
      oval finish rate near 0.5 to 0.7 and oscillation at or below about 0.3. If the
      oval does not recover, the next candidate is mass 0.8 kg, the known best.


      - [Open this output](iteration-5/entity0/versions/9abd875d6935413f81d01a7ea35c5f67/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-f12612c2bbd17d78/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-997f40c6bc95ccb3/payload.json)'
  - id: entity1
    label: Mass 0.6 kg, best
    notes: 'Builder''s mass-only change (0.8 to 0.6 kg) with the iteration 1 controller
      kept exactly, so the race isolates mass. Iteration 1 (324.07) is the baseline,
      and iteration 3 showed that the shorter track hurt the oval.


      ### Rationale


      The Builder''s candidate changes only mass (0.8 to 0.6 kg) from the iteration
      1 best (324.07). Its wheel_track is 0.12 m, the value that gave the best oval
      result (0.70 finish rate). Iteration 3 showed that a shorter track (0.10 m,
      with kp scaled to 4.5) raised yaw gain and cut the oval finish rate to 0.10,
      with oscillation at 0.33. So I keep wheel_track at 0.12 m and do not carry iteration
      3''s controller scaling forward. For the controller, I reuse the exact iteration
      1 settings (kp 5.0, ki 0.05, kd 0.6, base_speed 1.2, last_direction, weights
      [-1, -0.5, 0, 0.5, 1]). This makes the race a clean test of mass alone. The
      sensor row is the widened x = -0.024 to +0.024 m row at y = 0.04 m with 12 mm
      sensors, which lifted oval progress from 0.18 to 0.95 in iteration 1. Iteration
      2 showed that the 16 mm sensor cost the oval finishes, so I keep 12 mm. Lower
      mass lowers yaw inertia, so the same gain should produce a quicker turn response
      and less oscillation. The risk is that lower mass reduces traction and slip,
      which would show up as falling oval finishes. The controller is unchanged, so
      any change in outcome comes from the geometry.


      - [Open this output](iteration-4/entity1/versions/fb8acab292974058bf2ef4427cb5662a/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/b40778edf00c4cdcb2ee044715411431/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-3d6c73dfd9e78094/payload.json)'
  - id: entityR1
    label: Hold track, test mass
    notes: 'Feedback recommends keeping 12 mm sensors and the widened row, and keeping
      wheel_track at 0.12 m. Mass 0.7 kg or a longer track is the fallback if mass
      0.6 kg raises oscillation and costs oval finishes. Evidence is iterations 1
      to 3.


      ### Feedback


      Written before this candidate races. Iteration 1 (best, 324.07) is the reference:
      the widened row (x = -0.024 to +0.024 m at y = 0.04 m) with 12 mm sensors and
      wheel_track 0.12 m gave oval finish rate 0.70 and oval progress 0.95. Iteration
      2 showed that 16 mm sensors collapsed oval finishes to 0.00 (progress 0.59),
      so the footprint should stay at 12 mm. Iteration 3 showed that wheel_track 0.10
      m (with kp scaled to 4.5) cut oval finishes to 0.10 and raised oval oscillation
      to 0.33. So the shorter track adds yaw gain that the oval cannot take, and I
      have not built the Integrator''s controller around it. In the iteration 1 controller,
      steering_oscillation on the oval was 0.26 and on the s-bend 0.27, and max_error
      sat at about 0.064 m on the s-bend and slalom, close to the 0.06 m limit. Mass
      is the remaining lever for yaw inertia, which is mass times (body_length squared
      plus body_width squared) divided by 12. It acts on the same turn-response lag
      without changing the sensor geometry that iteration 2 showed is sensitive. Depending
      on the next race: if oval finishes stay near 0.7 and oscillation falls to about
      0.3 or below, keep mass 0.6 kg. If finishes fall while oscillation rises, the
      lighter robot is losing grip, so move mass back toward 0.7 to 0.8 kg rather
      than changing the sensors or track again. Body_width does not move the off-track
      limit within its allowed range, so I would not spend a run on it.


      ### Requested changes


      - Keep sensor_size 0.012 m and the widened row (x = -0.024 to +0.024 m at y
      = 0.04 m), since iteration 1 gave the best raced score and iteration 2 showed
      0.016 m cost the oval finishes.

      - If oval finishes fall and steering_oscillation rises above about 0.3 at mass
      0.6 kg, try mass 0.7 kg as the midpoint back toward the iteration 1 mass, rather
      than reducing wheel_track further (iteration 3 showed that hurts the oval).

      - Do not reduce wheel_track below 0.12 m again. If oscillation is still a limit
      after the mass result, test a longer wheel_track of about 0.13 m, which lowers
      yaw gain per unit of wheel differential, and read it against the oval finish
      rate.


      - [Open this output](iteration-4/entityR1/versions/fb8acab292974058bf2ef4427cb5662a/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/b40778edf00c4cdcb2ee044715411431/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-3d6c73dfd9e78094/payload.json)'
