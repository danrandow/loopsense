map:
  id: race-225-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Hold iteration 1 base
    notes: 'Holds the iteration 1 geometry unchanged, since iteration 6 reproduced
      its 324.07 score exactly and the simulator is deterministic. Mass, track and
      sensor-size changes all lowered the score, and the body-width lever cannot move
      the off-track limit.


      ### Rationale


      Iteration 6 re-ran the iteration 1 geometry and reproduced its score exactly
      (324.0661, oval finish 0.70, same per-track metrics). The simulator is therefore
      deterministic for a fixed design, and the 0.70 oval finish rate is a real property
      of this geometry, not seed luck. The only other point on the mass axis, 0.7
      kg, scored 185.49 (finish 0.15) and 0.6 kg scored 247.82 (finish 0.30), so mass
      is not a lever to move from 0.8 kg. Every geometry change tested has lowered
      the score: 16 mm sensors (159.26), wheel_track 0.10 m (175.19), mass 0.6 kg
      (247.82) and mass 0.7 kg (185.49). The Integrator''s feedback sets the rule
      for this case: if the oval finish rate is about 0.5 or more with oscillation
      at or below about 0.3, hold this geometry as the stable base. Both conditions
      hold (finish 0.70, oscillation 0.26). The remaining failures are on the s-bend
      and slalom, where max_error sits at about 0.064 m, above the 0.06 m off-track
      limit. The body-width lever cannot raise that limit within the allowed range
      (0.0125 + 0.18/4 = 0.0575 m, which is still below 0.06 m), so no geometry change
      I can make here addresses it directly. I therefore keep the iteration 1 geometry
      unchanged, as the Integrator asked. I did not take the earlier untested ideas
      (forward sensor offset to y = 0.06 m, or 7 sensors) because they would change
      the sensing the Integrator has tuned against, and the evidence gives no sign
      they would help. The expected result is the reference score of about 324.


      - [Open this output](iteration-7/entity0/versions/69c1802aaf6848879af3aaa941f98976/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-0000144dd93d4f78/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-4017cf031d14601d/payload.json)'
  - id: entity1
    label: Reference robot, repeat
    notes: 'Holds the iteration 1 geometry and controller unchanged, since iteration
      6 reproduced the 324.07 score exactly, so the simulator is deterministic. Only
      the reference result is tested; no new controller change is introduced.


      ### Rationale


      The Builder''s geometry is the iteration 1 design, which is also the iteration
      6 repeat. Iteration 6 reproduced iteration 1 exactly (score 324.0661, oval finish
      0.70, same per-track metrics), so the simulator is deterministic for this design
      and controller. That makes iteration 1 the reference for judging any change.
      Every other tested change lowered the score: 16 mm sensors (159.26), wheel_track
      0.10 m with kp 4.5 (175.19), mass 0.6 kg (247.82) and mass 0.7 kg (185.49).
      I therefore keep the controller identical to iteration 1 (kp 5.0, ki 0.05, kd
      0.6, base_speed 1.2, line_loss last_direction, weights [-1, -0.5, 0, 0.5, 1]).
      Changing gains now would be untested on the stable base, and iteration 2 showed
      that changing several settings at once can confound the result. The s-bend and
      slalom max_error sits at about 0.064 m, just above the 0.06 m off-track limit.
      Neither geometry nor the untested controller changes I have evidence for address
      that, so this race is mainly a repeatability check of the reference. The expected
      result is about 324, with an oval finish rate near 0.70.


      - [Open this output](iteration-7/entity1/versions/caab935972864e04aafa5b9c3558a4a4/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/69c1802aaf6848879af3aaa941f98976/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-4017cf031d14601d/payload.json)'
  - id: entityR1
    label: Hold base, test y=0.06
    notes: 'Recommends holding the iteration 1 geometry as the stable base, and proposes
      a single forward sensor offset (y = 0.06 m) only if the s-bend max_error limit
      is to be addressed. The rest of the feedback is evidence from iterations 2 to
      5, which lowered the oval finish rate.


      ### Feedback


      Written before this candidate has raced. Iteration 6 reproduced iteration 1
      exactly (score 324.07, oval finish 0.70), so the stable base is a deterministic
      reference. I am keeping the controller unchanged from iteration 1, which the
      evidence supports. What I had to compensate for: the controller is tuned to
      a 0.12 m track and 0.8 kg. Iteration 3 (wheel_track 0.10 m with kp scaled to
      4.5) cut oval finishes to 0.10, and iteration 4 (0.6 kg) and iteration 5 (0.7
      kg) cut them to 0.30 and 0.15 with oscillation up to about 0.32. So mass and
      track are tied to grip and yaw response at this gain. Iteration 2 showed that
      16 mm sensors collapsed oval finishes to 0.00, so keep 12 mm. The s-bend and
      slalom max_error stays at about 0.064 m across all these geometries, above the
      0.06 m off-track limit. Only a sensor position change has not been tested yet,
      so that is the open question. Depending on the next race: if the oval finish
      rate is about 0.5 or more with oscillation at or below about 0.3, hold this
      geometry as the stable base. If the oval finish rate is well below 0.5, treat
      iteration 1 as partly seed luck and judge future changes on a multi-seed average.
      Do not spend a run on sensor size, track or mass again.


      ### Requested changes


      - Hold the iteration 1 geometry as the stable base if the oval finish rate is
      about 0.5 or more with steering_oscillation at or below about 0.3, since iteration
      6 reproduced it exactly.

      - If you want to address the s-bend and slalom max_error (about 0.064 m) with
      geometry, test one change only: a forward sensor offset of y = 0.06 m with the
      widened x = -0.024 to +0.024 m row, keeping 12 mm sensors, wheel_track 0.12
      m and mass 0.8 kg.

      - Do not change sensor_size from 0.012 m, reduce wheel_track below 0.12 m, or
      move mass below 0.8 kg again. Iterations 2, 3, 4 and 5 all lowered the oval
      finish rate.


      - [Open this output](iteration-7/entityR1/versions/caab935972864e04aafa5b9c3558a4a4/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/69c1802aaf6848879af3aaa941f98976/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-4017cf031d14601d/payload.json)'
