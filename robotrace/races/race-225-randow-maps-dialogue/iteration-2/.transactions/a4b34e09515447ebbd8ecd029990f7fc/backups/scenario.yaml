map:
  id: race-225-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Sensor size 0.016 m
    notes: 'Keeps the widened 0.024 m sensor row, which raised progress on all three
      tracks versus iteration 0, and enlarges sensor footprints from 12 to 16 mm.
      This follows the Integrator''s condition for the slalom, where line_loss_events
      were 2.0 in every trial. Evidence: iteration 1 race data and Integration Feedback.


      ### Rationale


      Iteration 1 met the Integrator''s first condition. Progress rose on all three
      tracks versus iteration 0: oval 0.176 to 0.952, s-bend 0.135 to 0.380, slalom
      0.094 to 0.120. So the widened row (x = -0.024 to +0.024 m at y = 0.04 m) is
      kept. The Integrator''s second condition (max_error still at 0.06 m with low
      steering oscillation) is not met. Steering oscillation rose on the s-bend (0.134
      to 0.265) and sits at 0.20 on the slalom, so I am not reducing yaw inertia yet.
      The third condition does apply. Slalom line_loss_events is 2.0 in every slalom
      trial, and that track carries the most line-loss events. The Integrator''s suggested
      fix is sensor_size 0.016 with the same positions, so I am taking it. A 16 mm
      footprint covers more of the 25 mm tape at the same sensor positions, which
      should give more signal per sensor when the robot is off-centre or alternating
      across the line. I am changing only sensor_size, so the race isolates this effect.
      I expect fewer slalom line-loss events and some progress gain on the slalom,
      with the oval unchanged or slightly better. Completion on the s-bend and slalom
      is still unlikely, so yaw response (wheel_track 0.10 m) remains the next candidate
      if max_error stays at the limit.


      - [Open this output](iteration-2/entity0/versions/93ac0d2666444675a796668f2ae606ee/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-30c0ee0098611f29/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-4017cf031d14601d/payload.json)'
  - id: entity1
    label: Widened row, stronger
    notes: 'Keeps the widened 0.024 m sensor row and raises kp to 5.0, kd to 0.6 and
      lowers base_speed to 1.2 so the robot recovers before reaching the 0.06 m off-track
      limit. The change responds to iteration 0, where every run left the line with
      max_error at that limit. Outcome is unmeasured until this race runs.


      ### Rationale


      Iteration 0 left the line on every trial on all three tracks. Mean RMS error
      was low (0.02 to 0.027 m), but max_error reached the 0.06 m off-track limit
      in every run. That pattern points to occasional sharp excursions on bends, not
      a steady offset. Progress stalled at 0.09 to 0.18, so the robot departs before
      half the course is covered. The widened row (x = -0.024 to +0.024 m, 12 mm sensors,
      y = 0.04 m) should keep the tape in view further off-centre, and the Builder''s
      intent is to isolate that effect, so I keep the geometry unchanged. For the
      controller I keep the proportional weights [-1, -0.5, 0, 0.5, 1]. These match
      the row''s lateral positions, so the signal scale is unchanged and the comparison
      stays clean. I raise kp from 3.0 to 5.0 so the robot turns harder when it drifts
      toward the edge, since the earlier gain was too weak to recover before max_error
      was hit. I raise kd from 0.3 to 0.6 to damp the extra gain, and steering_oscillation
      was only about 0.10 to 0.14, so there is headroom. I lower base_speed from 1.5
      to 1.2 to give the turn more time to act on tight bends. The cost is slower
      progress, which may lower completion time, but a run that stays on the line
      scores more than one that leaves early. ki stays at 0.05 to avoid windup. line_loss
      stays ''last_direction'', which suited the bends in the baseline. Expected result,
      unmeasured: later first departure and higher progress than iteration 0 on all
      tracks. Completion is still unlikely on the slalom. If max_error stays at 0.06
      with steering_oscillation rising, kp was too high and should drop to about 4.


      - [Open this output](iteration-1/entity1/versions/681cab1bfed840aeb22c3ceafb5f0db8/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/8dfc47dffd494a729f1e4228cc75b1c9/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-3c4cc6bbcee5e3c4/payload.json)'
  - id: entityR1
    label: Row first, then yaw
    notes: 'Feedback asks the Builder to hold the widened row if progress rises, then
      reduce wheel_track to 0.10 m if max_error still reaches the limit. It cites
      iteration 0, where mean RMS error was low but every run hit 0.06 m, showing
      sharp excursions rather than steady drift. It states no result for the current
      candidate.


      ### Feedback


      Based only on iteration 0 evidence and design reasoning; this candidate has
      not raced and I state no outcome for it. In iteration 0 all 60 trials ended
      off-track with no completions. Mean RMS error was low (0.02 to 0.027 m), but
      max_error sat at the 0.06 m limit on every track. This means the robot is staying
      close to the line on average and makes sharp excursions on bends, which points
      to a response problem, not a steady offset. Progress of 0.09 to 0.18 means it
      leaves well before half the course. Widening the row to a 0.024 m half-span
      keeps the tape in view further off-centre, so it is the right test. Hold the
      widened row if progress rises on all three tracks compared with iteration 0.
      If max_error still reaches 0.06 on the oval with few line-loss events, the limit
      is yaw response rather than sensing, so move to lower yaw inertia (wheel_track
      0.10 m or mass 0.6 kg). If line_loss_events cluster on the slalom, the sensor
      row is still too narrow for its sharper alternations, so try sensor_size 0.016
      for more signal per sensor.


      ### Requested changes


      - Keep the widened row (x = -0.024 to +0.024 m at y = 0.04 m) if progress improves
      on all three tracks versus iteration 0; this is the first geometry change requested
      in iteration 0.

      - If max_error still hits 0.06 m with low steering_oscillation after the row
      change, reduce yaw inertia by trying wheel_track 0.10 m (the reduction is from
      0.12 m).

      - If line_loss_events concentrate on the slalom with the widened row, try sensor_size
      0.016 with the same positions to increase the tape signal per sensor.


      - [Open this output](iteration-1/entityR1/versions/681cab1bfed840aeb22c3ceafb5f0db8/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/8dfc47dffd494a729f1e4228cc75b1c9/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-3c4cc6bbcee5e3c4/payload.json)'
