  entities:
  - id: entity0
    label: Baseline 5-sensor
    notes: 'Symmetric five-sensor row (12 mm sensors, 8 mm pitch, 0.04 m ahead of
      the axle) on a mid-range body, chosen as a neutral baseline. No race or integration
      evidence exists yet, so this is design reasoning only.


      ### Rationale


      Iteration 0 has no Geometry Race Data and no Integration Feedback yet, so this
      proposal rests on design reasoning rather than evidence. Five sensors at 12
      mm spacing (x from -0.016 to +0.016 m) span about 48 mm, roughly twice the 25
      mm tape width. That gives a steering signal that stays informative when the
      robot is off-centre and keeps at least one sensor on the tape through moderate
      bends. Placing the row at y = +0.04 m, ahead of the axle, gives the controller
      look-ahead so it can react before the wheels reach a bend. Sensor size 0.012
      m is about half the tape width: small enough to resolve the edge, large enough
      that the readings change smoothly. Wheel track 0.12 m and wheel radius 0.03
      m are mid-range, giving stable yaw response without excessive turn inertia.
      Body width 0.12 m sets the off-track limit to max(0.06, 0.0125 + 0.03) = 0.06
      m, which is comfortably above the tape edge. Mass 0.8 kg and body length 0.16
      m keep yaw inertia moderate. I expect this baseline to complete the course with
      a few line-loss events on tight bends. This is a neutral starting point to measure
      against, not a tuned optimum.


      - [Open this output](iteration-0/entity0/versions/2679193ef91047c3a5cd610526d61bc7/payload.json)'
  actions:
  - id: action0
