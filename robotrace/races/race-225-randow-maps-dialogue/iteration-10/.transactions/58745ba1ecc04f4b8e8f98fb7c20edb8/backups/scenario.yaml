overrides:
  entities:
  - id: entity0
    label: Hold forward row y=0.06
    notes: 'Keeps the iteration 8 geometry, the best raced design at 403.72, with
      the sensor row moved forward to y = 0.06 m. Oval finish rate rose to 0.95 and
      s-bend and slalom progress rose, though s-bend and slalom max_error still sit
      just above the 0.06 m limit, so the Integrator''s threshold was only partly
      met.


      ### Rationale


      Iteration 8 (sensor row forward to y = 0.06 m, everything else as iteration
      1) is the best raced design so far at 403.72, up from 324.07. Oval finish rate
      rose from 0.70 to 0.95 and oval progress from 0.95 to 0.99. Forward-row progress
      also rose on the harder tracks: s-bend from 0.38 to 0.58 and slalom from 0.12
      to 0.16. The Integrator''s keep condition has two parts. The oval condition
      is clearly met, since the finish rate is far above 0.5. The max_error condition
      is only partly met. Slalom max_error fell from 0.068 to 0.065 m, which is below
      the reference but still above 0.06 m. S-bend max_error rose slightly from 0.064
      to 0.066 m. Neither track fell below 0.06 m, so the threshold was not met as
      written. I am keeping y = 0.06 m anyway, because the rule was a proxy for progress
      and completion, and both moved the right way on every track. Off-track endings
      on the s-bend and slalom are still the limit, so the open question is whether
      a further forward step helps. I am not making that step in this iteration, because
      the Integrator''s controller is being tuned to the current row. Holding the
      geometry lets the Integrator measure a stable base for one controller change.
      The only geometry idea I am considering, not committing to, is y = 0.07 m, to
      be tested in a later iteration if the s-bend max_error stays above 0.06 m.


      - [Open this output](iteration-9/entity0/versions/4e2d811542774222b28ecd59320ed48d/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-03e5f099cefc8b81/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-f97f4a7cd4284b77/payload.json)'
  - id: entity1
    label: kd 0.8 damping on y=0.06
    notes: 'Keeps the Builder''s iteration 8 forward row unchanged and raises kd from
      0.6 to 0.8 to damp s-bend oscillation, which rose from 0.27 to 0.36 with the
      forward row. Based on the 403.72 best race.


      ### Rationale


      Iteration 8 (y = 0.06 m forward row, score 403.72) is the best raced design.
      The oval finish rate is 0.95, and the s-bend and slalom progress rose to 0.58
      and 0.16. The remaining gap is steering oscillation on the s-bend, which rose
      from 0.27 to 0.36 with the forward row, and max_error on the s-bend (0.066 m)
      and slalom (0.065 m), which are both above the 0.06 m off-track limit. Keeping
      the Builder''s geometry unchanged, I change one controller variable: kd rises
      from 0.6 to 0.8. Derivative action on the signal damps the overshoot that shows
      up as s-bend oscillation. kp, ki, base_speed, the weights and the line-loss
      rule stay as in iteration 8, so any change is attributable to kd. Iteration
      2 used kd 0.8 with a different sensor size and base speed, so its oval collapse
      does not directly count against this change. Expected result: s-bend steering_oscillation
      at or below about 0.33 and s-bend max_error nearer 0.06 m, with the oval finish
      rate holding at 0.5 or more. Risk: higher kd amplifies sensor noise and could
      cost oval finishes.


      - [Open this output](iteration-9/entity1/versions/0a86273d8caf4ad79337923a90496a31/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/4e2d811542774222b28ecd59320ed48d/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-f97f4a7cd4284b77/payload.json)'
  - id: entityR1
    label: Hold y=0.06; test kd
    notes: 'Recommends holding the iteration 8 forward row as the base because it
      is the best raced design. It defers any y=0.07 test until the controller damping
      change shows whether s-bend max_error is still above 0.06 m.


      ### Feedback


      Written before this candidate has raced. The evidence is iterations 0 to 8.
      Iteration 8 (y = 0.06 m, score 403.72) is the best raced design: the oval finish
      rate rose to 0.95 and s-bend and slalom progress rose to 0.58 and 0.16. Hold
      y = 0.06 m as the base. The s-bend max_error (0.066 m) and slalom max_error
      (0.065 m) are still above the 0.06 m off-track limit, and the forward row raised
      s-bend steering_oscillation from 0.27 to 0.36 (iteration 1 to iteration 8).
      So the forward offset increases response on bends and the controller is now
      the limit, which is why this candidate adds kd 0.8. Iterations 2 to 5 show that
      sensor_size 0.016, wheel_track 0.10, and mass 0.6 or 0.7 each cut the oval finish
      rate, so those stay fixed. Depending on the next race: if s-bend max_error stays
      above 0.06 m with oscillation still around 0.36, the next geometry test is y
      = 0.07 m with the same 12 mm row and the same controller. Do not move y before
      the controller result is known.


      ### Requested changes


      - Hold the forward row at y = 0.06 m with x = -0.024 to +0.024 m and 12 mm sensors
      as the base (iteration 8, score 403.72). Do not change sensor_size, wheel_track
      or mass, since iterations 2 to 5 lowered the oval finish rate.

      - If s-bend max_error stays above 0.06 m and steering_oscillation stays near
      0.36 after the kd change, test y = 0.07 m with the same row and controller,
      as you proposed, and read it against iteration 8.

      - If the oval finish rate falls below about 0.5 with the forward row, return
      to y = 0.04 m or hold y = 0.06 m, and do not widen the row further until the
      controller result is known.


      - [Open this output](iteration-9/entityR1/versions/0a86273d8caf4ad79337923a90496a31/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/4e2d811542774222b28ecd59320ed48d/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-f97f4a7cd4284b77/payload.json)'
