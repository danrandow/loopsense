map:
  id: race-225-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Forward sensor row y=0.06
    notes: 'Moves the widened 12 mm sensor row forward from y = 0.04 m to 0.06 m,
      the one untested change the Integrator asked for to address the s-bend and slalom
      max_error near 0.064 m. Iteration 1 is the deterministic reference (score 324.07),
      so this single-variable race is directly comparable.


      ### Rationale


      Iteration 7 held the iteration 1 geometry, and iteration 6 reproduced its score
      exactly (324.07, oval finish 0.70). The simulator is therefore deterministic
      for a fixed design, so single-race comparisons are reliable. Every geometry
      change tested so far has lowered the score: 16 mm sensors (159.26), wheel_track
      0.10 m (175.19), mass 0.6 kg (247.82) and mass 0.7 kg (185.49). The remaining
      gap is on the s-bend and slalom, where max_error sits at about 0.064 m, just
      above the 0.06 m off-track limit. Body width cannot raise that limit within
      its range, so it is not a lever. The Integrator''s only untested geometry idea
      is a forward sensor offset to y = 0.06 m with the widened row kept. I am taking
      that single change now. It tests whether moving the sensing row forward gives
      the controller earlier warning on bends, which is the one mechanism left that
      could reduce s-bend and slalom max_error. The base the Integrator tuned against
      is unchanged except for this one variable: 12 mm sensors, x = -0.024 to +0.024
      m, wheel_track 0.12 m, wheel_radius 0.03 m, body 0.12 x 0.16 m, mass 0.8 kg.
      Risk: the controller was tuned to the y = 0.04 m row, so the forward row may
      change the signal gain and cost oval finishes. If the oval finish rate falls
      well below 0.5, I will return to the iteration 1 geometry as the final base.


      - [Open this output](iteration-8/entity0/versions/31ac1cffe3404f918f160977a1112c4f/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-4319c53a3b381ca9/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-4017cf031d14601d/payload.json)'
  - id: entity1
    label: Forward sensor row y=0.06
    notes: 'Builds the Builder''s forward sensor offset (y = 0.06 m) with the unchanged
      iteration 1 controller, so only the row position differs from the 324.07 reference.
      Chosen because it is the only untested idea aimed at s-bend and slalom max_error,
      which sits just above the 0.06 m limit.


      ### Rationale


      The Builder''s candidate moves the widened 12 mm sensor row forward from y =
      0.04 m to y = 0.06 m, keeping x = -0.024 to +0.024 m. This is the only geometry
      change still untested, and the Builder''s stated mechanism is earlier warning
      on bends, which is the one lever left for the s-bend and slalom max_error of
      about 0.064 m. The simulator is deterministic (iteration 6 reproduced iteration
      1 exactly), so the comparison with the 324.07 reference is clean. I keep the
      iteration 1 controller unchanged (kp 5.0, ki 0.05, kd 0.6, base_speed 1.2, last_direction,
      weights [-1, -0.5, 0, 0.5, 1]). The sensor x positions are unchanged, so the
      weights still match the row and the signal scale is the same. Every controller
      change I could make is untested on this row, and changing gains now would confound
      the geometry test. The main risk is that the controller was tuned to the y =
      0.04 m row, so the forward row may change the signal gain and cost oval finishes.
      Expected result, not measured: the oval finish rate holds near 0.5 or more and
      s-bend or slalom max_error falls below 0.06 m more often. If the oval finish
      rate falls well below 0.5, I would return to the y = 0.04 m base.


      - [Open this output](iteration-8/entity1/versions/5f97797666fb40608ee8041d6653ebd9/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/31ac1cffe3404f918f160977a1112c4f/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-4017cf031d14601d/payload.json)'
  - id: entityR1
    label: Keep or revert forward
    notes: 'Feedback states the decision rule for the forward row: keep it if the
      oval finish rate stays near 0.5 or more and s-bend or slalom max_error falls
      below 0.06 m, otherwise revert to y = 0.04 m. The rule rests on the deterministic
      iteration 1 and 6 reference and on the failed sensor, track and mass changes
      in iterations 2 to 5.


      ### Feedback


      Written before this candidate has raced. The evidence is iterations 0 to 7.
      Iteration 1 (324.07) is the stable reference: oval finish 0.70, oval steering_oscillation
      0.26, s-bend and slalom max_error about 0.064 m. Iteration 6 reproduced it exactly,
      so the simulator is deterministic for a fixed design and controller. Every other
      geometry change lowered the score: 16 mm sensors (iteration 2, oval finish 0.00),
      wheel_track 0.10 m with kp 4.5 (iteration 3, oval finish 0.10), mass 0.6 kg
      (iteration 4, 0.30) and mass 0.7 kg (iteration 5, 0.15). Your forward offset
      to y = 0.06 m is the one untested idea that targets s-bend and slalom max_error,
      and I have built the controller unchanged so it isolates that offset. Depending
      on the next race: if the oval finish rate holds at about 0.5 or more and s-bend
      or slalom max_error falls below 0.06 m, keep y = 0.06 m as the new base. If
      the oval finish rate falls well below 0.5, return to the y = 0.04 m iteration
      1 row, because the controller is tuned to that row and the forward offset costs
      more than it gains. Do not change body width, since it cannot move the off-track
      limit within its range.


      ### Requested changes


      - Keep the forward row at y = 0.06 m only if the oval finish rate is about 0.5
      or more and s-bend or slalom max_error falls below 0.06 m, compared with the
      iteration 1 reference.

      - If the oval finish rate falls well below 0.5, return to the iteration 1 geometry
      with the row at y = 0.04 m, and do not pursue further sensor-position changes.

      - Keep sensor_size at 0.012 m, wheel_track at 0.12 m and mass at 0.8 kg, since
      iterations 2 to 5 showed each of these lowered the oval finish rate.


      - [Open this output](iteration-8/entityR1/versions/5f97797666fb40608ee8041d6653ebd9/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/31ac1cffe3404f918f160977a1112c4f/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-4017cf031d14601d/payload.json)'
