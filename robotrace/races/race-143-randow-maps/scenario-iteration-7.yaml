  id: race-143-randow-maps
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: 'Lighter body: mass 0.5 kg'
    notes: 'Keeps the best-scoring iteration 6 geometry (372.2) and changes only mass
      from 0.7 to 0.5 kg to lower yaw inertia on sharp bends. Evidence: wheel_track
      narrowing has flattened with s-bend line-loss still at 1.3, and mass was never
      isolated from the earlier span and wheel_track changes.


      ### Rationale


      Iteration 6 (wheel_track 0.09 m, otherwise iteration 5) is the new best at 372.2.
      The oval held at 17/20 finishes with max_error 0.0435 m and steering_oscillation
      0.30, below the 0.35 threshold. The sharp tracks did not improve: s-bend line-loss
      stayed at 1.3 per run with max_error 0.064 m and 0/20 finishes, and slalom stayed
      at 1.9 with 0/20. The narrowing trend from 0.11 to 0.09 m gave small gains and
      then flattened. Both the Integrator''s rule (b) and their rule (c) apply. Narrowing
      is now at its floor (0.09 m, do not go narrower), and the remaining gap is more
      likely the controller''s response on sharp bends. Span, footprint, forward position
      and wheel_radius have each been tested or ruled out (iterations 2, 3, 4 and
      the 1.8 s oval finish). Mass is the one body-side lever not yet tested cleanly.
      Iteration 0 to 1 changed mass 0.8 to 0.7 together with wheel_track and sensors,
      so its effect was confounded. Yaw inertia is mass*(L^2+W^2)/12, so lowering
      mass lowers the inertia the robot must overcome to turn on sharp bends. I therefore
      keep the best-known geometry (wheel_track 0.09, y 0.07, span ±0.03 m at 0.015
      m spacing, footprint 0.012 m, wheel_radius 0.03 m, body unchanged) and change
      only mass from 0.7 to 0.5 kg. The Integrator''s controller stays unchanged,
      so the race isolates mass. Expected result: s-bend line-loss falls from 1.3
      toward 1.0 or below and slalom line-loss moves from 1.9 down. The oval should
      hold at 16/20 or better. If mass alone does not move line-loss on the sharp
      tracks, the next lever is the controller, not geometry.


      - [Open this output](iteration-7/entity0/versions/5119fa06a920455e955633447eced05d/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-d03d69f1ef66da29/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-39c80219f8d8f545/payload.json)'
  - id: entity1
    label: Mass 0.5 kg test
    notes: 'Iteration 6 geometry with mass cut from 0.7 to 0.5 kg and the controller
      held unchanged, so the race isolates yaw inertia. Based on the best-known score
      of 372.2 with a clean oval and flat sharp-track line-loss.


      ### Rationale


      Iteration 6 (wheel_track 0.09 m, controller unchanged) is the best-known design
      at 372.2. The oval holds at 17/20 with max_error 0.0435 m and steering_oscillation
      0.30, under the 0.35 limit. The sharp tracks have not moved: s-bend line-loss
      is 1.3 per run with 0/20 finishes, and slalom is 1.9 with 0/20. Span (iteration
      2), footprint (iteration 3), forward position (iteration 4) and narrowing (iterations
      5 and 6) have each been tested. Speed is not the limit, since the oval finishes
      in about 1.85 s. Mass is the one body lever not yet tested cleanly, because
      iteration 0 to 1 changed it together with wheel_track and sensors. Yaw inertia
      is mass*(L^2+W^2)/12, so lowering mass should ease turning on sharp bends. I
      accept the Builder''s proposal as written: geometry is unchanged except mass
      0.7 to 0.5 kg. The controller stays exactly as in iterations 4 to 6 (base_speed
      1.2, kp 2.5, ki 0, kd 0.3, weights [-2,-1,0,1,2], last_direction), so the race
      isolates mass. Expected result: s-bend line-loss falls toward 1.0 or below and
      the oval holds at 16/20 or better. Because the controller is unchanged, a flat
      line-loss result would point to the controller''s response on sharp bends, and
      I would then change kp, kd or the line-loss mode next. I do not expect a large
      score change.


      - [Open this output](iteration-7/entity1/versions/842e6131ea2140b392d6addf7082aae0/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/5119fa06a920455e955633447eced05d/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-39c80219f8d8f545/payload.json)'
  - id: entityR1
    label: Mass test feedback
    notes: 'Feedback on the mass test: keep 0.5 kg only if s-bend line-loss drops
      to 1.0 or below with the oval holding, otherwise return to 0.7 kg or move the
      next lever to the controller. Geometry is near its floor after iterations 2
      to 6.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Evidence:
      iteration 6 (wheel_track 0.09 m, controller unchanged) scored 372.2, the best
      so far. The oval held at 17/20 with max_error 0.044 m and oscillation 0.30.
      s-bend stayed at 0/20 with line-loss 1.3 and max_error 0.064 m, and slalom at
      0/20 with line-loss 1.9. Narrowing has reached its floor and gave only small
      gains (iterations 5 and 6). Span (iteration 2) and footprint (iteration 3) both
      hurt, and forward position (iteration 4) helped only the oval. The controller
      has not needed any change beyond the settings held since iteration 4, so I have
      no controller-side evidence to report for this body. Decision rules for the
      next race: (a) If s-bend line-loss falls to 1.0 or below with max_error under
      0.06 m and the oval holds at 16/20 or better, keep mass 0.5 kg. (b) If s-bend
      line-loss stays above 1.0 with the oval holding, mass is not the lever and the
      remaining gap is the controller''s response on sharp bends; do not go narrower
      or change span, footprint or y. (c) If the oval falls below about 14/20 or steering_oscillation
      exceeds about 0.35 with low max_error, return mass to 0.7 kg, since a lighter
      robot is then jittery.


      ### Requested changes


      - Keep mass 0.5 kg only if s-bend line-loss falls to 1.0 or below with max_error
      under 0.06 m and the oval holds at 16/20 or better. Evidence: iteration 6 is
      the best-known body (372.2), and mass is the one body lever not yet tested cleanly,
      since iteration 0 to 1 confounded it with wheel_track and sensors.

      - If the oval falls below about 14/20 or steering_oscillation rises above 0.35
      with low max_error at 0.5 kg, return mass to 0.7 kg. Evidence: the oval oscillation
      was 0.30 at 0.7 kg in iteration 6, so a rise would show the lighter robot is
      jittery.

      - If s-bend stays at about 1.3 line-loss with max_error near 0.06 m at 0.5 kg,
      stop geometry tests on the sharp tracks. Keep wheel_track 0.09 m (do not go
      narrower), span ±0.03 m, y 0.07 m, footprint 0.012 m and wheel_radius 0.03 m,
      and let the Integrator change the controller response instead. Evidence: span,
      footprint and forward-position tests (iterations 2 to 4) and narrowing to 0.09
      m (iteration 6) have not moved s-bend line-loss below 1.3.


      - [Open this output](iteration-7/entityR1/versions/842e6131ea2140b392d6addf7082aae0/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/5119fa06a920455e955633447eced05d/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-39c80219f8d8f545/payload.json)'
