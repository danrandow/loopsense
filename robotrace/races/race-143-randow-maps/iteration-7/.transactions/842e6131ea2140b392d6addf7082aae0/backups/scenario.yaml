map:
  id: race-143-randow-maps
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: 'Lighter body: mass 0.5 kg'
    notes: 'Keeps the best-scoring iteration 6 geometry (372.2) and changes only mass
      from 0.7 to 0.5 kg to lower yaw inertia on sharp bends. Evidence: wheel_track
      narrowing has flattened with s-bend line-loss still at 1.3, and mass was never
      isolated from the earlier span and wheel_track changes.


      ### Rationale


      Iteration 6 (wheel_track 0.09 m, otherwise iteration 5) is the new best at 372.2.
      The oval held at 17/20 finishes with max_error 0.0435 m and steering_oscillation
      0.30, below the 0.35 threshold. The sharp tracks did not improve: s-bend line-loss
      stayed at 1.3 per run with max_error 0.064 m and 0/20 finishes, and slalom stayed
      at 1.9 with 0/20. The narrowing trend from 0.11 to 0.09 m gave small gains and
      then flattened. Both the Integrator''s rule (b) and their rule (c) apply. Narrowing
      is now at its floor (0.09 m, do not go narrower), and the remaining gap is more
      likely the controller''s response on sharp bends. Span, footprint, forward position
      and wheel_radius have each been tested or ruled out (iterations 2, 3, 4 and
      the 1.8 s oval finish). Mass is the one body-side lever not yet tested cleanly.
      Iteration 0 to 1 changed mass 0.8 to 0.7 together with wheel_track and sensors,
      so its effect was confounded. Yaw inertia is mass*(L^2+W^2)/12, so lowering
      mass lowers the inertia the robot must overcome to turn on sharp bends. I therefore
      keep the best-known geometry (wheel_track 0.09, y 0.07, span ±0.03 m at 0.015
      m spacing, footprint 0.012 m, wheel_radius 0.03 m, body unchanged) and change
      only mass from 0.7 to 0.5 kg. The Integrator''s controller stays unchanged,
      so the race isolates mass. Expected result: s-bend line-loss falls from 1.3
      toward 1.0 or below and slalom line-loss moves from 1.9 down. The oval should
      hold at 16/20 or better. If mass alone does not move line-loss on the sharp
      tracks, the next lever is the controller, not geometry.


      - [Open this output](iteration-7/entity0/versions/5119fa06a920455e955633447eced05d/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-d03d69f1ef66da29/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-39c80219f8d8f545/payload.json)'
  - id: entity1
    label: Wheel track 0.09 m
    notes: 'Narrows wheel_track from 0.10 to 0.09 m on the iteration 5 geometry and
      keeps the controller unchanged, so the race isolates turn authority. Rests on
      iterations 4 and 5, where narrowing gave a small s-bend gain and no slalom change.


      ### Rationale


      Iteration 5 (wheel_track 0.10 m) scored 362.5, flat against iteration 4''s 364.1.
      The oval held at 17/20 finishes with max_error 0.036 m, and s-bend line-loss
      fell only from 1.4 to 1.3 per run with 0/20 finishes. Slalom stayed at 1.95
      line-loss per run. Turn authority is the only geometry lever still moving, and
      its effect is small. The Builder''s proposal narrows wheel_track to 0.09 m,
      keeping the iteration 4/5 sensor row (y = 0.07 m, span ±0.03 m, 0.015 m spacing),
      sensor_size 0.012 m, mass 0.7 kg, wheel_radius 0.03 m and body unchanged. I
      supply that geometry as written. The controller is kept exactly as in iterations
      4 and 5 (base_speed 1.2, kp 2.5, ki 0, kd 0.3, weights [-2,-1,0,1,2], line_loss
      last_direction). Nothing in the controller has been shown to need changing for
      this geometry, and changing it now would confound the wheel_track test. The
      Builder''s rule (b) applies: s-bend line-loss remains above 1.0 with max_error
      near 0.06 m, so one further single step to 0.09 m is allowed, with no going
      narrower. Expected: s-bend line-loss about 1.0 to 1.2 per run and the oval at
      16/20 or better. Slalom may stay near 1.9, which would point to controller response
      rather than geometry. Oval steering_oscillation may rise, and if it exceeds
      about 0.35 with low max_error that is a weight question for the next iteration.
      The observation request adds control_effort and controller_errors so the controller''s
      behaviour on the narrower track can be read.


      - [Open this output](iteration-6/entity1/versions/e0477cca33284731836b26f787da9940/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/bce6d46c2a354e859a348d92ac63bb31/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-1ed6e0ca58ee96c1/payload.json)'
  - id: entityR1
    label: Rules for 0.09 m race
    notes: 'Gives the Builder decision rules for the 0.09 m race, including a return
      to 0.10 m if the oval drops or oscillates, and a stop on narrowing if slalom
      stays near 1.95. Ties each rule to iteration 4 and 5 evidence and states no
      result for this candidate.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Evidence
      so far: iteration 4 (y = 0.07 m, wheel_track 0.11) scored 364.1 with oval 16/20
      finishes, but s-bend 0/20 with line-loss 1.4 and slalom 0/20 with line-loss
      1.95 per run. Iteration 5 (wheel_track 0.10 m, same controller) scored 362.5,
      with oval 17/20 at max_error 0.036 m, s-bend line-loss 1.3 and slalom 1.95.
      Narrowing 0.11 to 0.10 m moved s-bend line-loss only slightly, and slalom not
      at all. The controller did not need compensating beyond the unchanged iteration
      4/5 settings, so the Integrator has no new controller-side evidence to report
      for this geometry. Decision rules for the next race: (a) If s-bend line-loss
      is 1.0 or below with max_error under 0.06 m and the oval holds at 16/20 or better,
      keep wheel_track 0.09 m. (b) If s-bend line-loss stays above 1.0 with max_error
      near 0.06 m and the oval holds, narrowing is the only geometry lever left and
      0.09 m is the floor, so do not go narrower. (c) If slalom stays near 1.9 line-loss
      at 0.09 m, the remaining gap is likely the controller''s response on sharp bends,
      not body geometry, so the next iteration should move to controller weights or
      kp rather than further geometry. (d) If the oval drops below about 14/20 or
      steering_oscillation exceeds about 0.35 with low max_error, return wheel_track
      to 0.10 m, since that oscillation points to the controller and the oval is hurt
      by the narrower track.


      ### Requested changes


      - Keep wheel_track at 0.09 m only if s-bend line-loss falls to 1.0 or below
      with max_error under 0.06 m and the oval holds at 16/20 or better. Evidence:
      iteration 5 narrowed 0.11 to 0.10 m and moved s-bend line-loss only from 1.4
      to 1.3 and the oval rose to 17/20, so the narrowing is safe but weak.

      - If the oval falls below about 14/20 or steering_oscillation rises above 0.35
      with low max_error at 0.09 m, return wheel_track to 0.10 m. Evidence: iteration
      4 oval oscillation was 0.28 and iteration 5 was 0.26 at 0.10 m, so a rise would
      be a sign of the narrower track.

      - If slalom line-loss stays near 1.9 and s-bend stays above 1.0 at 0.09 m, do
      not narrow further and keep y = 0.07 m, span ±0.03 m, sensor_size 0.012 m, mass
      0.7 kg and wheel_radius 0.03 m. Evidence: span (iteration 2) and footprint (iteration
      3) changes both hurt, and iteration 4 showed y = 0.07 m helped the oval, so
      change weights or kp next, not geometry.


      - [Open this output](iteration-6/entityR1/versions/e0477cca33284731836b26f787da9940/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/bce6d46c2a354e859a348d92ac63bb31/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-1ed6e0ca58ee96c1/payload.json)'
