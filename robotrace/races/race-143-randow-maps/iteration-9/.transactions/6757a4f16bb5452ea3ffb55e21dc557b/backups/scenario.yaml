  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Hold best body, tune ctrl
    notes: 'Geometry held at the iteration 7 best (score 400.0: y 0.07, span ±0.03,
      wheel_track 0.09, mass 0.5 kg) so the Integrator can test controller changes
      on sharp bends in isolation. Evidence: oval held 17/20 with oscillation 0.30,
      and s-bend finishes rose to 2/20, but s-bend line-loss stayed above 1.0, so
      geometry has no further lever.


      ### Rationale


      Iteration 7 (mass 0.5 kg, otherwise the iteration 6 body) is the new best at
      400.0, up from 372.2. The oval held at 17/20 finishes with steering_oscillation
      0.30 and max_error 0.039 m, so the Integrator''s guard against jitter (oscillation
      above 0.35 or oval below 14/20) did not trigger. The gain came mainly from s-bend,
      where finishes rose from 0/20 to 2/20 and mean progress rose from 0.52 to 0.58,
      although s-bend line-loss rose slightly from 1.3 to 1.4 and max_error stayed
      near 0.062 m. Slalom is unchanged at 0/20 with line-loss 1.95. The Integrator''s
      decision rule (a) (keep 0.5 kg only if s-bend line-loss is at or below 1.0)
      is not met, so the Integrator''s rule (b) applies: mass is not the lever that
      clears the sharp tracks, and the remaining gap is the controller''s response
      on sharp bends. Span (iteration 2), footprint (iteration 3), forward position
      (iteration 4) and the narrowing to 0.09 m (iteration 6) have all been tested
      or ruled out, and narrowing is at its floor. Body width does not affect the
      off-track limit, which stays at the 0.06 m floor for the widths allowed. Speed
      is not limiting, since the oval finishes in about 1.8 s. I therefore hold the
      geometry at the iteration 7 best-known values and make no geometry change this
      iteration. This gives the Integrator a stable platform, so that any controller
      change is isolated from geometry. Expected result: the same geometry scores
      about 400 with the current controller, and any gain must come from the Integrator''s
      controller response on the sharp tracks. Mass 0.45 kg is a possible later step
      if the controller stays fixed, but it is not proposed now because it would confound
      the controller test.


      - [Open this output](iteration-8/entity0/versions/6576f2880ed84ed788aff61a6c48e662/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-aef2cf0c1788a3e3/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-03fba9d792b051ca/payload.json)'
  - id: entity1
    label: Hold geometry, raise
    notes: 'Geometry is held at the iteration 7 best (400.0), and only kp (2.5 to
      3.0) and kd (0.3 to 0.45) change, to test whether sharper bend response lowers
      s-bend line-loss. The guard reverts kp if oval oscillation exceeds 0.35.


      ### Rationale


      Iteration 7 (mass 0.5 kg, wheel_track 0.09 m, y 0.07 m, span ±0.03 m, footprint
      0.012 m) is the best-known design at 400.0. The oval finishes 17/20 with steering_oscillation
      0.30 and max_error 0.039 m, so the jitter guard is not triggered. The sharp
      tracks remain the gap: s-bend finishes 2/20 with line-loss 1.4 and max_error
      0.062 m, and slalom is 0/20 with line-loss 1.95. Geometry levers (span, footprint,
      y, wheel_track, mass) have been tested or are at their floor, so this iteration
      changes only the controller, as the Builder''s intent requests. Geometry is
      held exactly at the iteration 7 values. The controller change is a moderate
      increase in proportional and derivative gain to sharpen the response on bends:
      kp 2.5 to 3.0 and kd 0.3 to 0.45. Weights stay [-2,-1,0,1,2] and base_speed
      stays at 1.2, because the s-bend mean finish time of 2.45 s leaves little margin
      against the 3 s limit, so lowering speed is not an option. ki stays at 0 because
      there is no windup evidence. line_loss stays last_direction. Expected result,
      not yet measured: s-bend line-loss falls toward 1.0 to 1.2 per run with the
      oval holding at 16/20 or better. Guard: if oval steering_oscillation exceeds
      about 0.35 with low max_error, the higher kd or kp is causing jitter and kp
      should return to 2.5. Measurements add control_effort and controller_errors
      to read the controller response.


      - [Open this output](iteration-8/entity1/versions/16069109b7614285b6995c9b981d0e7c/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/6576f2880ed84ed788aff61a6c48e662/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-03fba9d792b051ca/payload.json)'
  - id: entityR1
    label: Hold geometry, controller
    notes: 'Feedback asks the Builder to hold the iteration 7 geometry and gives decision
      rules for the controller test. It also sets a mass fallback to 0.7 kg if the
      oval becomes jittery, and a stop on further narrowing.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Evidence:
      iteration 7 (mass 0.5 kg, wheel_track 0.09 m, y 0.07 m) scored 400.0, the best
      so far. The oval held at 17/20 with steering_oscillation 0.30 and max_error
      0.039 m. s-bend finished 2/20 with line-loss 1.4 and max_error 0.062 m. Slalom
      stayed at 0/20 with line-loss 1.95. Iterations 2 and 3 showed that span and
      footprint changes hurt, iteration 4 showed that forward position helped only
      the oval, and iterations 5 to 7 showed that narrowing and mass changes gave
      only small gains. Geometry on the sharp tracks is therefore near its limit,
      and the Integrator is testing controller response (kp and kd) with geometry
      held. Decision rules for the next race: (a) If s-bend line-loss falls to 1.0
      or below and the oval holds at 16/20 or better, keep geometry as it is and the
      controller response is the lever. (b) If s-bend line-loss stays at 1.3 or more
      and the oval holds, the remaining gap is controller response on the sharpest
      bend, so do not change geometry further. (c) If the oval falls below about 14/20
      or steering_oscillation rises above 0.35 with low max_error, the mass or narrowing
      is contributing to jitter, so return mass to 0.7 kg.


      ### Requested changes


      - Hold wheel_track 0.09 m, span ±0.03 m at 0.015 m spacing, sensor y 0.07 m,
      footprint 0.012 m, wheel_radius 0.03 m and mass 0.5 kg. Evidence: iteration
      7 scored 400.0 and every geometry change since iteration 4 has been flat or
      negative on the sharp tracks.

      - If the oval falls below about 14/20 or steering_oscillation exceeds about
      0.35 with low max_error at 0.5 kg, return mass to 0.7 kg. Evidence: iteration
      6 at 0.7 kg held oval oscillation at 0.30, so a rise would show the lighter
      body is jittery.

      - If s-bend stays at about 1.3 line-loss with max_error near 0.06 m after the
      controller change, stop geometry tests on the sharp tracks and do not narrow
      below 0.09 m. Evidence: span, footprint, forward position and wheel_track tests
      (iterations 2 to 6) have not moved s-bend line-loss below 1.3.


      - [Open this output](iteration-8/entityR1/versions/16069109b7614285b6995c9b981d0e7c/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/6576f2880ed84ed788aff61a6c48e662/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-03fba9d792b051ca/payload.json)'
