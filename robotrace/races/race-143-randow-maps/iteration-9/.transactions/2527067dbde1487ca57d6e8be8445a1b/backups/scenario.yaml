  id: race-143-randow-maps
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 8 scored 610.7, the best so far, up from 400.0 in iteration 7. The
      geometry was held at the iteration 7 values and only the controller changed,
      so the gain came from controller response, not body geometry. Oval finished
      20/20 (max_error 0.0195 m, oscillation 0.22). s-bend finished 15/20, up from
      2/20, with line-loss 1.05, max_error 0.037 m and mean progress 0.96. Slalom
      is still 0/20 with line-loss 1.9 and max_error 0.065 m, so it is the remaining
      gap. My decision rule (a) for holding geometry was that s-bend line-loss is
      at or below 1.0 and the oval holds at 16/20 or better. The oval condition is
      met by a wide margin, and s-bend line-loss at 1.05 is within 0.05 of the threshold,
      with finishes now at 75%. The geometry evidence points to the same conclusion:
      span (iteration 2), footprint (iteration 3), forward position (iteration 4),
      wheel_track (iterations 5 and 6, now at its 0.09 m floor) and mass (iteration
      7) have each been tested. The one geometry change that clearly helped was the
      mass drop to 0.5 kg, and that is now confirmed with a stronger controller. I
      therefore propose no geometry change. Changing geometry now would confound the
      controller result, and with only two iterations left the safest gain is a stable
      platform. I hold every value at the iteration 8 best. Slalom at 0/20 with line-loss
      1.9 and max_error near 0.065 m is probably a line-loss mode or sharp direction-change
      problem, not a sensing gap, since footprint and span changes did not reduce
      its line-loss. The next question for the Integrator is whether the slalom losses
      occur at direction changes. Because the final race uses an unseen track of a
      different shape, I keep the geometry robust rather than tuned to slalom.


      - [Open this output](iteration-9/entity0/versions/6757a4f16bb5452ea3ffb55e21dc557b/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-3e8a5e9582b0753a/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-b877d62ceafaf023/payload.json)'
  - id: entity1
    label: kd 0.6 controller step
    notes: 'Holds the iteration 8 geometry and raises kd from 0.45 to 0.6 with kp
      at 3.0, a single-variable test. Based on iteration 8 (610.7), where the kp and
      kd increase drove the s-bend gain while the oval oscillation stayed at 0.22.


      ### Rationale


      Iteration 8 (kp 3.0, kd 0.45, same geometry) is the best result at 610.7, with
      the oval at 20/20, s-bend at 15/20 and slalom at 0/20 with line-loss 1.9. Iteration
      7 (kp 2.5, kd 0.3) scored 400.0 on the same geometry, so the controller change
      produced the gain. Geometry has been tested on span, footprint, forward position,
      wheel_track and mass, and the sharp-track gap has not moved with geometry, so
      I keep the Builder''s geometry exactly. The next controller step is kd 0.45
      to 0.6 with kp held at 3.0, changing one variable so the result is attributable.
      Derivative action is the lever that most recently helped s-bend, and the oval
      oscillation (0.22) leaves room. Slalom line-loss at 1.9 is the open problem,
      and the line_loss mode is kept as last_direction because changing it would confound
      this test. Guard: if oval steering_oscillation exceeds about 0.35 or the oval
      falls below 16/20, kd returns to 0.45. Expected result: s-bend line-loss at
      or below 1.0 with finishes at 15/20 or better, and slalom line-loss beginning
      to fall. This is a prediction, not a measured result.


      - [Open this output](iteration-9/entity1/versions/b7ad94e95a2a4c5d8a098810831aa3ef/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/6757a4f16bb5452ea3ffb55e21dc557b/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-b877d62ceafaf023/payload.json)'
  - id: entityR1
    label: Hold geometry, test mass
    notes: 'Advises holding the iteration 8 geometry because the controller, not geometry,
      produced the gain. Offers mass 0.45 kg only if the oval holds and slalom stays
      at line-loss 1.9, based on the mass trend in iterations 6 and 7.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Evidence:
      iteration 7 (mass 0.5 kg, wheel_track 0.09 m, y 0.07 m, controller kp 2.5, kd
      0.3) scored 400.0. Iteration 8 kept the same geometry and raised kp to 3.0 and
      kd to 0.45, scoring 610.7, with s-bend finishes rising from 2/20 to 15/20 and
      the oval at 20/20. That shows controller response, not geometry, was the remaining
      lever. Span (iteration 2), footprint (iteration 3), forward position (iteration
      4), wheel_track (iterations 5 and 6) and mass (iteration 7) have all been tested,
      and none cleared the sharp tracks alone. Slalom has stayed at 0/20 with line-loss
      1.9 to 1.95 through every geometry test, so it is probably a controller or line-loss-mode
      problem. Decision rules for the next race: (a) If s-bend line-loss is 1.0 or
      below and the oval holds at 16/20 or better, geometry is stable and the controller
      is the lever; hold geometry. (b) If slalom line-loss falls but the oval drops
      below about 14/20, the controller change is too strong and geometry should not
      change. (c) If slalom line-loss stays near 1.9 while s-bend holds, do not change
      geometry; the gap is the controller''s response at direction changes, and the
      next iteration should test line_loss mode.


      ### Requested changes


      - Hold wheel_track 0.09 m, span at plus or minus 0.03 m with 0.015 m spacing,
      sensor y 0.07 m, sensor_size 0.012 m, wheel_radius 0.03 m and mass 0.5 kg. Evidence:
      iteration 8 scored 610.7 on this geometry, and every geometry change from iteration
      2 to 7 was flat or negative on the sharp tracks.

      - If the next race holds the oval at 16/20 or better but slalom stays at 1.9
      line-loss, try mass 0.45 kg with the controller fixed. Evidence: mass 0.7 to
      0.5 kg raised s-bend finishes from 0/20 to 2/20 (iteration 6 to 7), so a further
      small reduction is the only body lever with a trend, and it is not yet tested
      with the new gain.

      - If the oval falls below about 14/20 or steering_oscillation exceeds about
      0.35 with low max_error, return mass to 0.7 kg. Evidence: at 0.7 kg the oval
      held oscillation at 0.30 (iteration 6), so a rise would indicate the lighter
      body is jittery under the stronger controller.


      - [Open this output](iteration-9/entityR1/versions/b7ad94e95a2a4c5d8a098810831aa3ef/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/6757a4f16bb5452ea3ffb55e21dc557b/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-b877d62ceafaf023/payload.json)'
