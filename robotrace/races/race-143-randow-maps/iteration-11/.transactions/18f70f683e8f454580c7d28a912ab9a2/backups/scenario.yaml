overrides:
  entities:
  - id: entity0
    label: 'Final: hold best geometry'
    notes: 'Holds the iteration 10 geometry (score 700.7) unchanged for the final
      unseen-track race, since every geometry change from iteration 2 onward was flat
      or negative on the sharp tracks. Gains are left to the Integrator''s controller,
      which is where the remaining slalom and s-bend gap sits.


      ### Rationale


      This is the final iteration, and the race is scored on an unseen track of a
      different shape, so the design should be a robust platform rather than one tuned
      to the development tracks. Iteration 10 (score 700.7) is the best observed result
      on this geometry, with the oval at 20/20 and s-bend at 20/20 with line-loss
      0.55. Slalom is still 0/20 with line-loss 1.2, which points to the controller''s
      response at direction changes, not the body.


      Geometry evidence since iteration 2 is consistent. Span widening (iteration
      2) and footprint 0.016 m (iteration 3) both hurt. Forward position 0.07 m (iteration
      4) helped the oval. Narrowing wheel_track to 0.09 m (iterations 5 to 6) gave
      small gains and is at its floor. Mass 0.5 kg (iteration 7) raised s-bend finishes,
      and the body has since held oscillation at about 0.21 to 0.27 with the stronger
      controller. Body width does not change the off-track limit, which stays at the
      0.06 m floor. Speed is not limiting, since the oval finishes in about 1.96 s.


      Decision: hold every geometry value at the iteration 10 best. Changing geometry
      now would confound the Integrator''s last controller step, and the unseen track
      is best served by a body that is already known to finish the oval and s-bend
      reliably. Expected result: the same platform scores near 700 on the development
      tracks, with any further gain coming from the Integrator''s controller (kd,
      line_loss mode) on sharp bends.


      - [Open this output](iteration-11/entity0/versions/d92be16d88ac4c7c856b9ff2a097d43d/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-f645b68add618e5c/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-5fdf7e2e26111dbd/payload.json)'
  - id: entity1
    label: 'Final robot: iter-10'
    notes: 'Geometry held at the iteration 9 and 10 best values, with the controller
      set to the measured best kd 0.75 and kp 3.0 (score 700.7). Only the controller
      is taken from iteration 10, so the final unseen-track race is not exposed to
      untested gains.


      ### Rationale


      This is the final iteration, and the unseen track is scored once, so the package
      should be the best-measured platform rather than an untested variant. Geometry
      is held exactly at the Builder''s iteration 11 values, which match iteration
      9 and 10 (wheel_track 0.09 m, sensors at x = -0.03 to +0.03 m in 0.015 m steps,
      y = 0.07 m, sensor_size 0.012 m, wheel_radius 0.03 m, body 0.12 x 0.16 m, mass
      0.5 kg). Across iterations 7 to 10 the controller changes moved the sharp tracks,
      while geometry changes since iteration 4 were flat or negative. The controller
      is therefore set to the iteration 10 gains (kp 3.0, ki 0, kd 0.75, base_speed
      1.2, weights [-2,-1,0,1,2], last_direction), which is the best measured result
      (700.7). Its oval finish rate (20/20, oscillation 0.21) and s-bend finish rate
      (20/20, line-loss 0.55) were both confirmed. Slalom remains 0/20 with line-loss
      1.2, and iteration 9 (kd 0.6) had slalom line-loss 1.1, a difference that does
      not change the score much. I do not try an untested gain such as kd 0.9, because
      a stronger gain could push the jitter guard or the oval finish rate on the unseen
      shape without any race to check it. Expected result: about 700 on the development
      tracks, with the unseen track dependent on how well the controller generalises
      to a different curve shape.


      - [Open this output](iteration-11/entity1/versions/80177829f2cb48528a0d0e25079ec3a3/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/d92be16d88ac4c7c856b9ff2a097d43d/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-5fdf7e2e26111dbd/payload.json)'
  - id: entityR1
    label: Hold geometry; final
    notes: 'Feedback asks the Builder to hold the iteration 11 geometry and not to
      change span, footprint, y or wheel_track, citing iterations 2 to 7. It is written
      before the race and makes no outcome claim.


      ### Feedback


      Written before this candidate has raced, so no outcome is claimed for it. Evidence:
      iteration 10 (kd 0.75) scored 700.7, the best observed, with the oval at 20/20
      and s-bend at 20/20 (line-loss 0.55). Iteration 9 (kd 0.6) scored 669.8 and
      iteration 8 (kd 0.45, kp 3.0) scored 610.7, so the controller gain produced
      the sharp-track gains on your geometry. Your iteration 11 geometry matches the
      iteration 9 and 10 values, so I have held it unchanged and set only the controller
      to the iteration 10 gains. Your geometry choices from iterations 2 to 7 (span,
      footprint, forward position, wheel_track, mass) have each been tested, and none
      moved the sharp tracks beyond what the controller change did. Decision rules:
      since no further iteration follows, the only thing that can change is what the
      unseen track reveals in the final race. Keep the geometry as written. Do not
      attempt a wider span or narrower wheel_track now, since the evidence from iterations
      2, 3 and 5 to 6 says those changes hurt or were flat.


      ### Requested changes


      - Hold the iteration 11 geometry exactly: wheel_track 0.09 m, sensors at x =
      -0.03 to +0.03 m in 0.015 m steps with y = 0.07 m, sensor_size 0.012 m, wheel_radius
      0.03 m, mass 0.5 kg, body 0.12 x 0.16 m. Evidence: iteration 9 (669.8) and iteration
      10 (700.7) both used these values, and geometry tests since iteration 4 have
      been flat or negative on the sharp tracks.

      - Do not change sensor y, span, footprint or wheel_track for the final race.
      Evidence: y 0.06 to 0.07 m helped only the oval (iteration 4), span 0.04 m hurt
      every track (iteration 2), footprint 0.016 m hurt the oval (iteration 3), and
      wheel_track 0.09 m is the floor reached in iteration 6.

      - Keep mass at 0.5 kg unless the controller is changed. Evidence: mass 0.7 to
      0.5 kg lifted s-bend finishes from 0/20 to 2/20 under the old gains (iterations
      6 and 7), and the 0.5 kg body held oscillation at 0.21 to 0.22 under kd 0.6
      to 0.75 (iterations 9 and 10).


      - [Open this output](iteration-11/entityR1/versions/80177829f2cb48528a0d0e25079ec3a3/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/d92be16d88ac4c7c856b9ff2a097d43d/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-5fdf7e2e26111dbd/payload.json)'
