map:
  id: race-143-randow-maps
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Sensors forward to y=0.07
    notes: 'Returns to the iteration 1 best geometry (±0.03 m, 0.012 m footprint,
      0.015 m spacing) and moves the sensor row forward from y=0.06 to y=0.07 m, testing
      look-ahead alone. Rests on iteration 3 showing that the 0.016 m footprint hurt
      oval finishes (217 vs 337), so that change is dropped.


      ### Rationale


      Evidence so far. Iteration 1 (span ±0.03 m at 0.015 m spacing, 0.012 m footprint,
      y = 0.06 m) is still the best result at 337.5, with 13/20 oval finishes. Iteration
      2 (span ±0.04 m at 0.02 m spacing) fell to 150.8 with 0/20 oval finishes, so
      widening the span hurt. Iteration 3 (±0.03 m, 0.015 m spacing, footprint raised
      to 0.016 m) fell to 217.4. Oval finishes dropped from 13/20 to 2/20, and slalom
      line-loss rose to 1.85 per run. Footprint overlap therefore did not close the
      line-loss gap and cost oval performance, so I am not keeping 0.016 m. The Integrator''s
      feedback for this candidate recommends 0.016 m, but it was written before iteration
      3 raced and its own evidence contradicts that recommendation, so I am not following
      it. The remaining evidence is that the line is lost on bends (1.1 to 1.3 line-loss
      events per run on s-bend and slalom, max_error 0.062 to 0.063 m), not from speed
      (oval completes in 1.83 s), and neither span nor footprint fixes it. Iteration
      0 (y = 0.04) was the worst geometry and iteration 1 (y = 0.06) the best, so
      sensor forward position is the one geometry lever the evidence points to that
      has not been tested alone. Change this iteration: return to the iteration 1
      geometry (best 337.5, 0.012 m footprint, 0.015 m spacing, ±0.03 m span, wheel_track
      0.11, mass 0.7, wheel_radius 0.03, body unchanged) and move the sensor row forward
      from y = 0.06 to y = 0.07 m. This gives more look-ahead so the steering reacts
      before the robot reaches 0.06 m off the line. Expected result: line-loss events
      on s-bend and slalom fall toward 0.5 to 1.0 per run and max_error drops below
      about 0.055 m, with the oval finish rate held at about 13/20. If y = 0.07 does
      not change line-loss, the forward position is not the gap and the next test
      should be a narrower wheel_track for turn authority.


      - [Open this output](iteration-4/entity0/versions/f8c6bf354f7e4c65ab52d2fe890aa61d/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-f4141ad79e2ff063/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-497fceff1f15a572/payload.json)'
  - id: entity1
    label: Footprint overlap test
    notes: 'Reverts to the ±0.03 m span from iteration 1 (best, 337.5) and changes
      only sensor_size to 0.016 m, so footprints overlap and line-loss dead zones
      can close. Controller is unchanged to isolate the footprint effect.


      ### Rationale


      Iteration 1 (±0.03 m span, 0.015 m spacing, 12 mm footprint, controller kp 2.5,
      kd 0.3, base_speed 1.2) is the best result so far at 337.5. It finished 13/20
      oval runs, but s-bend (1/20) and slalom (0/20) still exited off-track with max_error
      about 0.062 to 0.063 m and 1.1 to 1.3 line-loss events per run. Iteration 2
      showed that widening the span to ±0.04 m at 0.02 m spacing made every track
      worse, so span alone is not the lever. The Builder''s geometry for this iteration
      reverts to the ±0.03 m span and changes only sensor_size from 0.012 to 0.016
      m, so each footprint overlaps its neighbours and closes the dead zones suggested
      by the line-loss counts. I keep the controller identical to iteration 1 so the
      race isolates the footprint change. Oval steering_oscillation (0.31) does not
      affect score and would confound this test if I changed weights now, so I leave
      weights alone and flag the oscillation for a later iteration. Speed is not limiting
      (oval finished in 1.83 s), so base_speed and wheel_radius stay as they are.
      Expected result, which is not yet measured: line-loss events fall toward 0 to
      0.5 per run and s-bend/slalom max_error drops toward 0.05 m, with oval finishes
      held at 13/20 or better.


      - [Open this output](iteration-3/entity1/versions/b136f72fcde94dc19922cce7a8b9be9b/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/a8be09aa053446d3ae9a119aa4d3ce3d/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-7a4d1ee0d6381523/payload.json)'
  - id: entityR1
    label: Footprint then spacing
    notes: 'Pre-race feedback: test sensor_size 0.016 at the iteration 1 span first,
      since iteration 2''s span widening hurt every track. Next steps depend on line-loss
      counts and max_error in the next race.


      ### Feedback


      Written before this candidate races. Iteration 1 (±0.03 m, 0.012 m footprint)
      is the best observed result at 337.5, with 13/20 oval finishes, 1/20 s-bend,
      0/20 slalom, and max_error 0.062 to 0.063 m with 1.1 to 1.3 line-loss events
      per run on the sharp tracks. Iteration 2 (±0.04 m at 0.02 m spacing, same controller)
      dropped to 150.8: oval finishes fell to 0/20, max_error rose to 0.064, so widening
      span without changing footprint hurt. The Integrator found no speed limit (oval
      finished in 1.83 s), so the failures are on-line losses on bends. I kept the
      controller unchanged from iteration 1 and changed nothing except the footprint,
      so the next race isolates footprint overlap. Decision rules: if line_loss_events
      on s-bend and slalom fall to about 0.5 or less and max_error drops below 0.05
      m, keep sensor_size 0.016 and try a modest weight-shape change only if oval
      steering_oscillation stays above 0.2. If line_loss_events stay at 1 or more
      with max_error near 0.06 m, the footprint is not the gap; keep the span at ±0.03
      m and reduce weights rather than widening. If the oval stops finishing, return
      to sensor_size 0.012.


      ### Requested changes


      - Keep the ±0.03 m span at 0.015 m spacing and set sensor_size to 0.016 m. Evidence:
      iteration 2 showed that span alone worsened every track, while iteration 1 line-loss
      events of 1.1 to 1.3 per run point to dead zones, so overlapping footprints
      are the direct test.

      - If s-bend or slalom still exit with max_error above 0.05 m and line-loss events
      of 1 or more after the footprint change, try sensor spacing 0.02 m with sensor_size
      0.016 m (±0.03 m span, five sensors, weights kept). Evidence: iteration 2 at
      0.02 m spacing gave no benefit with a 0.012 m footprint, so this only tests
      overlap at the wider spacing.

      - Do not raise wheel_radius yet: the oval completed in 1.83 s in iteration 1,
      so speed is not the limit. Raise to 0.035 m only if a future run completes with
      completion_time above about 3 s.


      - [Open this output](iteration-3/entityR1/versions/b136f72fcde94dc19922cce7a8b9be9b/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/a8be09aa053446d3ae9a119aa4d3ce3d/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-7a4d1ee0d6381523/payload.json)'
