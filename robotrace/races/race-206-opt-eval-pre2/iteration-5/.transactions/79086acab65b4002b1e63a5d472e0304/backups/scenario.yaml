map:
  id: race-206-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Draft Design
    notes: 'Draft Design. The model did not supply a valid label and summary, so the
      orchestrator wrote this one.


      ### Rationale


      Evidence: all five designs so far went off track in all 60 trials, with max_error
      stuck at 0.061 to 0.066 m against the 0.06 m limit (body_width cannot widen
      it). Line-loss events ran 1 to 2 per run, and progress stayed between 0.04 and
      0.18. Gain changes (kp 1.2 to 3) barely moved the failure point, so gain is
      not the main limit. Iteration 3 scored best (base 0.9, kp 1.2, ki 0.3, kd 0.8),
      and its progress was higher on s-bend and slalom than the others.


      Diagnosis: the sensor span is the likely cause. With sensors at x = ±0.032 and
      size 0.012 m, the outer sensor loses the tape once the robot''s centre is about
      0.032 + 0.0125 + 0.006 = 0.05 m off the line. The iteration-4 widening to ±0.04
      only moves that to about 0.058 m, which is still inside the 0.06 m limit. So
      every run hits line loss just before the off-track limit, and the throttle drop
      to 0.35 then pushes it over. Widening the span beyond the off-track limit should
      keep the tape in view through the whole allowed band, so the controller can
      correct instead of losing the line.


      Changes: (1) Seven sensors at x = -0.06 to +0.06 in 0.02 m steps, with size
      0.016 m. The 16 mm footprint sees the tape out to about 0.0205 m from each sensor,
      so line loss now starts only beyond about 0.08 m off-centre. (2) Weights proportional
      to x (x/0.04): -1.5, -1, -0.5, 0, 0.5, 1, 1.5. This keeps the signal scale near
      iteration 3 (about 25 per metre of offset). (3) kp 1.6 (about 40 turn per metre),
      slightly above iteration 3, to keep the correction strong at the wider span.
      ki 0.3 keeps the bias cancellation from iteration 2 and 3. kd 0.8 damps the
      response. (4) base_speed 1.0, a small step up from the best run. (5) Sensor
      y = 0.05, mass 0.6, wheel_track 0.14, wheel_radius 0.03 and body unchanged,
      so the sensor-span effect can be read directly. line_loss stays last_direction.


      Expected result: line-loss events near zero, max_error below about 0.05 m, and
      progress well above 0.2 on all three development tracks. Completion within 3
      s is still unlikely at 1.0 base speed. If max_error still reaches 0.06 with
      no line loss, the cause is steering lag, and the next step is to raise kd or
      lower base_speed.


      - [Open this output](iteration-5/entity0/versions/2f93ff8319f24e36919245d8847aba7c/payload.json)

      - Based on: [entityR2A](iteration-5/entityR2A/versions/carried-758a60651d42b26a/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critique finds the span-limit diagnosis untested, since iteration 4 showed
      the same max_error and line-loss pattern with a different span, and points to
      a possible start transient. It also flags the kd sensor-edge kick, the unquantified
      integral, the untested speed choice and the multi-variable change. Evidence:
      the 60-trial outcome table for iterations 0 to 4.


      - [Open this output](iteration-5/entityC1/versions/a2a5fb34a6a04f1e98cff78f98a85a25/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/2f93ff8319f24e36919245d8847aba7c/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-758a60651d42b26a/payload.json)'
  - id: entity1
    label: Iter 3 base, ki 1.5 test
    notes: 'Reverts to the best-scoring iteration-3 geometry and controller (score
      39.8) and changes only ki, from 0.8 to 1.5, to test whether uncorrected motor-mismatch
      bias causes the uniform 0.06 m departure. The widened-sensor draft is rejected
      because iteration 4 scored lower with the wider span.


      ### Rationale


      Evidence: the best score so far is iteration 3 (39.8). Widening the sensors
      in iteration 4 (x to ±0.04, size 0.016, y 0.06) scored lower (27.0). Its oval
      progress fell from 0.168 to 0.120, even though line-loss events dropped from
      2 to 1. So the span hypothesis in the draft is not supported. Every design still
      stops at max_error 0.060 to 0.066 with 1 to 2 line-loss events, and that uniform
      value across gains, speeds and spans points to a shared cause, most likely drift
      from the fixed left/right motor mismatch. The critique is right that the draft
      changed six variables at once, so its result could not be attributed.


      Decision: I reject the draft''s seven-sensor geometry and its kd 1.2 and kp
      1.6 changes. I revert geometry to the iteration-3 layout, which is the best-scoring
      tested set (5 sensors at x ±0.032, y 0.05, size 0.012, wheel_track 0.14, mass
      0.8). I keep the iteration-3 controller and change one variable: ki 0.8 to 1.5.
      The integral is capped at ±2, so its maximum contribution rises from 1.6 to
      3.0 turn units, about 560 to 1050 PWM counts, which is enough to test whether
      bias removal is the limit. I accept the critique''s point that kd at 0.8 to
      1.2 gives sensor-edge kicks, so kd stays at 0.1.


      Rejected: the draft''s wider span, higher base_speed (kept at 1.0), and kp increase.
      I did not change the start behaviour, since no tool here alters initial alignment.


      Expected result (hypothesis): if max_error falls below 0.06 or line-loss events
      drop, bias is the cause and ki should go higher next round. If max_error stays
      at 0.061 to 0.066 with unchanged timing, the cause is the start or initial alignment,
      and no gain or span change will fix it. If steering_oscillation rises above
      about 0.2, lower ki back to 0.8.


      - [Open this output](iteration-5/entity1/versions/85131a383e51488ca57536ae372343e2/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/2f93ff8319f24e36919245d8847aba7c/payload.json),
      [entityC1](iteration-5/entityC1/versions/a2a5fb34a6a04f1e98cff78f98a85a25/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-758a60651d42b26a/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Round-2 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-5/entityC2/versions/778c494f615044888393c29f400eb43c/payload.json)

