  - id: entity2
    label: Iter 3 base, ki 0.8
    notes: 'Reverts to the best-tested iteration-3 geometry and controller (score
      39.81) and changes only ki from 0.5 to 0.8, to test whether more integral action
      keeps reducing the uniform 0.061 m departure. The draft''s mixed controller
      and wheel-track changes were rejected because they cannot be attributed.


      ### Rationale


      Evidence: iteration 3 (score 39.81) is the best-tested design. It differs from
      iteration 1 (33.89) only in ki, 0.1 to 0.5, and that change raised the oval
      progress and score. Every design so far has left the line on every track, with
      max_error at 0.060 to 0.066 and 1 to 2 line-loss events. Iteration 4 (26.98)
      widened the sensors and scored lower, so sensor span is not the lever. Iteration
      2 (26.36) changed wheel_track to 0.14 along with kp, kd, ki and speed, so it
      cannot isolate the wheel track effect.


      What I kept from the critiques: the iteration-3 geometry (5 sensors at x ±0.032
      and ±0.016, y 0.05, size 0.012, wheel_track 0.12, mass 0.8) and the iteration-3
      controller (kp 3.0, kd 0.03, base_speed 1.5, last_direction). The critiques
      agree that the iteration-3 baseline is the right comparison point.


      What I changed: ki 0.5 to 0.8, a single variable. The earlier step from 0.1
      to 0.5 helped, so a further moderate step tests whether more integral action
      keeps reducing the departure. The integral cap of ±2 gives at most 1.6 turn
      units, which is bounded and avoids the 3-unit maximum of ki 1.5 that the critique
      called an untested overclaim.


      What I rejected: the draft''s ki 1.5 (too large a jump, and its rationale did
      not match its controller values); its kp 1.5, base_speed 1.0 and kd 0.1 (untested
      in combination, and kd 0.1 gives edge kicks larger than kp); its wheel_track
      0.14 (the iteration-2 result is confounded, and the 39.8 baseline uses 0.12);
      and its sensor changes. I did not change the start behaviour, since no tool
      here alters initial alignment.


      Expected result (hypothesis): a score at or above 39.8, with oval progress at
      or above 0.1675 and line-loss events at or below 2 per run. If max_error falls
      below 0.06 or line-loss events drop, bias removal is helping and ki can rise
      further next round. If max_error stays at 0.061 to 0.066 with the same early
      timing, the cause is the start or first bend, and the next change must target
      that. If steering_oscillation rises above about 0.2 or the score falls below
      39.8, revert to ki 0.5.


      - [Open this output](iteration-5/entity2/versions/075c05393ab448d9923615d4ea09fb32/payload.json)

      - Based on: [entity1](iteration-5/entity1/versions/85131a383e51488ca57536ae372343e2/payload.json),
      [entityC2](iteration-5/entityC2/versions/778c494f615044888393c29f400eb43c/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-758a60651d42b26a/payload.json)'
