map:
  id: race-206-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Slower, lower-gain draft
    notes: 'Keeps the narrow 7-sensor geometry from iteration 7, which had fewer line
      losses, and lowers base speed to 0.6, kp to 1.2 and kd to 0.6. Tests whether
      slower, gentler steering removes the consistent 0.06 m off-track excursion that
      gain and span changes have not moved.


      ### Rationale


      Evidence: all eight designs so far ended off-track in all 60 trials per design.
      The off-track limit is 0.06 m for every body width in range, and max_error sits
      at 0.061 to 0.066 m whatever the gain, speed or sensor span. Progress is nearly
      fixed by track (oval about 0.12 to 0.17, s-bend about 0.04 to 0.07), so the
      robot fails at roughly the same early point each time. Iteration 7 (sensors
      at +/-0.03 m, 12 mm footprints, base 0.9, kp 1.6, kd 1.0) is the only design
      with a clear signal: it had 1 line-loss event per run instead of 2, and slalom
      progress rose from 0.06 to 0.11. Narrowing the span appears to reduce line losses,
      so I keep that geometry. Gain sweeps have not moved the failure point, so the
      untested factor I will change is speed, which has only been reduced to 0.8 at
      most.


      Changes: (1) Geometry kept from iteration 7: seven sensors at x = -0.03 to +0.03
      in 0.01 m steps, y = 0.06, 12 mm footprints, wheel_track 0.14, wheel_radius
      0.03, mass 0.4, body unchanged. This isolates the controller change on the setup
      that showed fewer line losses. (2) base_speed reduced from 0.9 to 0.6, which
      gives the loop more time per bend and cuts lateral slip. The trade-off is that
      completion within 3 s is out of reach, so the aim is a stable run that covers
      more of the track. (3) kp reduced from 1.6 to 1.2, since a slower robot needs
      less steering gain to avoid overshoot. (4) ki kept at 0.3 to cancel the fixed
      motor-mismatch bias, with the integral bounded at +/-2. (5) kd reduced from
      1.0 to 0.6 so the derivative term does not amplify the faster sensor transitions
      at the narrower span. (6) line_loss stays last_direction, because line loss
      is now less frequent and changing it is not justified by the evidence.


      Expected result: fewer line-loss events (near 0 to 1 per run), max_error below
      about 0.05 m, and progress above 0.2 on the development tracks, with the slalom
      and s-bend improving most. Completion is unlikely. If max_error still reaches
      0.06 at 0.6 base speed, the cause is probably not speed or gain, and the next
      draft should change wheel_track or wheel_radius.


      - [Open this output](iteration-8/entity0/versions/51b7e4247d90410f987823f0dd63babc/payload.json)

      - Based on: [entityR2A](iteration-8/entityR2A/versions/carried-9bc1f3f6714d50e8/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critiques the speed-0.6 draft: speed was already swept from 0.8 to 1.6
      with no change in max_error, the three-gain change is confounded, and the progress
      expectation conflicts with the 3 s cap. Evidence is the iteration 0 to 7 outcome
      table.


      - [Open this output](iteration-8/entityC1/versions/1b0f6507e45d4dfebf9f6956dfa6b696/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/51b7e4247d90410f987823f0dd63babc/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-9bc1f3f6714d50e8/payload.json)'
  - id: entity1
    label: Larger wheel radius test
    notes: 'Keeps the best-tested layout and controller (score 39.81) and changes
      only wheel_radius from 0.03 to 0.04, to test whether ground speed per PWM raises
      progress within 3 s. Based on the critique''s point that gains and speed have
      already been swept without moving max_error.


      ### Rationale


      Evidence: seven of eight designs ended off-track in all 60 trials per design,
      with max_error at 0.060 to 0.066 m whatever the gain, ki, span, mass or speed.
      The best score is 39.81 (iterations 3, 5 and 6, which are the same design apart
      from ki). Iteration 7 (wheel_track 0.10) lowered oval progress from 0.1675 to
      0.115, so narrowing the track is not the answer.


      Critique: I accept most of it. (1) My draft claimed speed was untested. It has
      been swept from 0.8 to 1.6, with no effect on max_error, so I drop the speed-only
      test. (2) The draft changed kp, kd, base_speed and geometry together, so no
      outcome could be attributed. I drop that. (3) Base 0.6 would cut ground speed
      in a 3 s run, and progress is time-capped, so I reject it. (4) kd 1.0 gives
      a sensor-edge derivative kick of about 50 turn units per step, with no oscillation
      to damp, so I keep kd at 0.1. (5) The critique''s most likely cause, a fixed
      early departure, cannot be changed with the tools here. The untested drivetrain
      factor is wheel_radius (only 0.03 so far), which sets ground speed per PWM count.
      It is the lever most likely to move progress within the 3 s limit.


      Kept: the best-tested layout (five sensors at x -0.032 to +0.032, y 0.05, size
      0.012, weights -1, -0.5, 0, 0.5, 1), wheel_track 0.14, mass 0.8, body unchanged,
      last_direction, and the iteration-6 controller (kp 1.5, ki 1.0, kd 0.1, base
      1.0). Changed: wheel_radius 0.03 to 0.04, the only variable that differs from
      the best run.


      Expected result (hypothesis): higher ground speed per PWM, so oval progress
      should rise above 0.1675 at similar max_error. If max_error stays at 0.061 to
      0.066 with unchanged timing, the cause is the start transient, and I will accept
      the best-tested design rather than keep sweeping. Success threshold: a score
      above 39.81. If steering_oscillation exceeds 0.25, the larger wheel is too aggressive,
      and the next step is wheel_radius 0.035.


      - [Open this output](iteration-8/entity1/versions/26412ce84fb3486aa19b9d8de5607fe9/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/51b7e4247d90410f987823f0dd63babc/payload.json),
      [entityC1](iteration-8/entityC1/versions/1b0f6507e45d4dfebf9f6956dfa6b696/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-9bc1f3f6714d50e8/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Critiques the wheel_radius 0.04 revision. Main points: the radius change
      also raises steering gain by about 1.33x, so speed and gain cannot be separated;
      the rationale''s time-cap reason and speed-progress claim conflict with the
      data; line-loss events (2 per run) are left unaddressed. Evidence is the iteration
      0 to 7 outcome table and the score formula.


      - [Open this output](iteration-8/entityC2/versions/b22ae12362554e7687500c93d47a42d1/payload.json)

      - Based on: [entity1](iteration-8/entity1/versions/26412ce84fb3486aa19b9d8de5607fe9/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-9bc1f3f6714d50e8/payload.json)'
  - id: entity2
    label: Wheel radius 0.04 test
    notes: 'Best-tested design (iteration 5, score 39.81) with only wheel_radius raised
      from 0.03 to 0.04, a clean one-variable test. It corrects the revision, which
      had silently used the wrong baseline (wheel_track 0.14 and the iteration-7 controller).
      Evidence: all runs end off track at about 0.06 m; line loss and steering gain
      remain open.


      ### Rationale


      Evidence: the best raced score is 39.81 (iterations 3, 5 and 6). Iterations
      5 and 6 are the same design, and iteration 5 is the best-tested one: wheel_track
      0.12, wheel_radius 0.03, kp 3.0, ki 0.8, kd 0.03, base_speed 1.5, five sensors
      at x -0.032 to +0.032, y 0.05, size 0.012, weights -1, -0.5, 0, 0.5, 1, last_direction.
      Every run in the record ended off track at about 0.06 m, not at the 3 s limit,
      so the early departure is the binding failure. The Round-2 critique is right
      that the revision was not a clean test. The revision compared against the wrong
      baseline: it kept wheel_track 0.14 and the kp 1.5 / ki 1.0 / kd 0.1 / base 1.0
      controller from iteration 7, which scored 26 and 36.7, not 39.8. So it differed
      from the best run in several variables at once, and its claim to differ in only
      wheel_radius was false. I reject that design. I keep the iteration-5 design
      exactly and change only wheel_radius from 0.03 to 0.04. Accepted from the critique:
      the wheel_radius change also raises steering authority about 1.33x (speed and
      yaw rate per unit turn both scale with radius), so a result cannot be attributed
      to speed alone; line loss (2 events per run on oval, slalom and s-bend) is a
      real score cost, so I note it for the next iteration. Rejected: the base_speed
      0.6 suggestion, since runs end by departure rather than the time limit, and
      cutting ground speed would not help. Expected result: higher ground speed per
      PWM, so progress rises above the 0.1675 oval, 0.0725 s-bend and 0.0625 slalom
      baselines, with max_error near 0.061 to 0.066. Success means a score above 39.81.
      If steering_oscillation exceeds 0.25 or max_error grows, the larger effective
      gain is the cause, and the next step is wheel_radius 0.035 or a lower kp.


      - [Open this output](iteration-8/entity2/versions/868501496033420f81f8c38452ba167d/payload.json)

      - Based on: [entity1](iteration-8/entity1/versions/26412ce84fb3486aa19b9d8de5607fe9/payload.json),
