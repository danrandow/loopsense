map:
  id: race-206-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Slower, gentler control
    notes: 'Keeps iteration 2''s geometry and cuts base speed to 0.9 and kp to 1.2
      to test whether the robot can hold the line at all. Every run so far left the
      line at about 0.061 m, so the evidence points to speed and gain as the cause.


      ### Rationale


      Evidence: all three designs so far ended by off-track in all 60 trials. max_error
      sits at about 0.061 m every time, just past the 0.06 m limit (max(0.06, 0.0125
      + body_width/4) is 0.06 for every body width in range). rms_error is about 0.03
      m whatever the gain. Halving the weights and changing kp, ki and kd moved progress
      only between 0.04 and 0.18, and iteration 2 (kp 2, ki 0.3, kd 0.8, base 1.3)
      was no better overall. The robot leaves the line at roughly the same point regardless
      of gain, so the common factor is speed (base 1.3 to 1.6) and the mismatch bias.
      At these speeds, the time the controller has to correct a bend is too short.


      Changes (controller only, geometry held at iteration 2 so the result isolates
      the controller): (1) base_speed reduced from 1.3 to 0.9, to give the loop time
      to correct at each bend and cut lateral slip. (2) kp reduced from 2.0 to 1.2
      to avoid the overshoot that the 1.3 to 1.6 runs suggest. (3) ki kept at 0.3
      to cancel the constant left/right motor mismatch, with the integral bounded
      at +/-2. (4) kd kept at 0.8 to damp the response at the lower gain. (5) line_loss
      kept at last_direction. The earlier loss events were few, so changing this is
      not justified by the evidence.


      Trade-off: at 0.9 base speed the robot is unlikely to finish within 3 s, so
      the 500-point completion bonus is probably out of reach this iteration. Progress
      is worth up to 250 points plus a middle term, so a stable run that covers most
      of the course is the priority. Expected result: no early off-track exit, max_error
      below about 0.05 m, and progress well above 0.5 on the development tracks. If
      the run is still stable and slow, the next step is to raise base_speed toward
      1.2 while keeping kp near 1.2.


      - [Open this output](iteration-3/entity0/versions/5d7ba3108396481d8fe126df0b0486d5/payload.json)

      - Based on: [entityR2A](iteration-3/entityR2A/versions/carried-13034a42d5c5ec74/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Round-1 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-3/entityC1/versions/552a4190143441be87fc74109c55e112/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/5d7ba3108396481d8fe126df0b0486d5/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-13034a42d5c5ec74/payload.json)'
  - id: entity1
    label: Lower speed, gain, kd
    notes: 'Cuts base_speed to 1.0, kp to 1.5 and kd to 0.1 to avoid sensor-edge kicks,
      and sets ki to 0.8 to remove motor-mismatch bias. Based on the uniform max_error
      of about 0.061 across all 60 prior trials and the iteration 2 critique.


      ### Rationale


      Evidence: all three designs (iterations 0 to 2, 60 trials each) left the line
      in every trial. max_error sat at about 0.061 m on every track, and rms_error
      was about 0.03 m throughout. Progress was about 0.04 on the s-bend and slalom
      and 0.12 to 0.18 on the oval. The uniform early departure points to a start
      transient or initial alignment, not to a gain problem alone. The race data cannot
      yet separate these causes.


      Critique: I accept most of it. (a) kd 0.8 gives a derivative kick of about 40
      turn units on each 0.5-unit sensor edge, and steering_oscillation was only 0.06
      to 0.14, so there is little for kd to damp. I reduce kd to 0.1. (b) ki 0.3 is
      too weak to remove the motor mismatch within 3 s, but ki 1.0 (used in iteration
      2) gives a capped contribution of 2 turn units. I use ki 0.8 as a middle value.
      (c) base_speed 1.3 cannot reach the 1.5 m/s average needed to finish in 3 s.
      I reduce it to 1.0 so the loop has more time at each bend. I accept that completion
      is unlikely this round and that progress is the target. (d) I reject the claim
      that mass 0.6 kg helps. Iteration 2 used mass 0.8, and I keep 0.8 so the geometry
      matches the best-tested baseline.


      Kept: wheel_track 0.14 and sensor layout (y 0.05, x -0.032 to 0.032, size 0.012,
      weights -1, -0.5, 0, 0.5, 1). I keep wheel_track because the critique''s gain-reduction
      point is a confound I want to test in one step, not undo. line_loss stays last_direction.
      I reject the critique''s point that kp should stay at 2.0 unchanged, because
      the oval progress gain from halving the weights suggests a lower steering gain
      helps. kp moves from 2.0 to 1.5 for that reason.


      Changes from iteration 2: kp 2.0 to 1.5, ki 1.0 to 0.8, kd 0.2 to 0.1, base_speed
      1.2 to 1.0, mass 0.6 kept at 0.8 (no change from iteration 2).


      Expected result (hypothesis): max_error below 0.055 m, line_loss_events at most
      1, and progress above 0.2 on all development tracks. If max_error stays at about
      0.061 with the same early timing, the cause is the start, and the next revision
      should change the initial alignment or line_loss handling rather than the gains.
      If rms_error rises with low steering_oscillation, bias is the cause and ki should
      go up. If steering_oscillation rises, lower kp first.


      - [Open this output](iteration-3/entity1/versions/75f828b498f446fbb515f83e610b5a5b/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/5d7ba3108396481d8fe126df0b0486d5/payload.json),
      [entityC1](iteration-3/entityC1/versions/552a4190143441be87fc74109c55e112/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-13034a42d5c5ec74/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Round-2 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-3/entityC2/versions/d5de0606818944df96239512df32f145/payload.json)

      - Based on: [entity1](iteration-3/entity1/versions/75f828b498f446fbb515f83e610b5a5b/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-13034a42d5c5ec74/payload.json)'
  - id: entity2
    label: Iter 1 baseline, ki 0.5
    notes: 'Returns to the best-scoring iteration-1 design (kp 3.0, base 1.5, kd 0.03,
      wheel_track 0.12) and changes only ki from 0.1 to 0.5 to test whether a stronger
      integral removes motor-mismatch bias. The change is isolated so the race can
      attribute any gain to ki.


      ### Rationale


      Evidence: iteration 1 (score 33.89) is the best race so far. It used kp 3.0
      with weights [-1,-0.5,0,0.5,1], base_speed 1.5, kd 0.03, ki 0.1 and wheel_track
      0.12, and it gave the best oval progress (0.176). Iteration 2 (score 26.36)
      changed several values at once and lost progress, so it does not show that the
      revision helped. All designs left the line on every track, with max_error about
      0.061 and steering_oscillation of 0.06 to 0.14. This points to a start or initial-alignment
      problem and to too little correction at the first bend, not to jitter.


      What I kept from the critique: (a) kd 0.1 is too large. Its edge kick of about
      5 turn units exceeds the proportional term, so I return kd to 0.03, the value
      used in iteration 1. (b) The integral needs to be tested, so ki rises. I set
      ki 0.5, which gives a maximum contribution of 1.0 turn units under the plus
      or minus 2 cap, enough to test bias removal without the 0.8 to 1.0 values that
      the critique says could saturate early. (c) base_speed 1.5 is kept because the
      best oval progress came at that speed. Completion is not expected at this speed.


      What I rejected: I did not keep the revision''s kp 1.5 or base_speed 1.0. The
      proportional gain of 1.5 per unit signal (kp 1.5 with weights of plus or minus
      1) gave less progress than the kp 3.0 used in iteration 1, and the speed cut
      was not supported by data. I also reverted wheel_track from 0.14 to 0.12. The
      revision changed wheel_track without a test of its own, so 0.12 is the better-tested
      baseline.


      Changes from iteration 1: only ki changes, from 0.1 to 0.5. This isolates whether
      a stronger integral removes the motor-mismatch bias. Expected (hypothesis):
      progress at least 0.18 on the oval and max_error at or below 0.061 m. If max_error
      stays at about 0.061 with the same early line-loss timing, the cause is the
      start, and the next revision should change initial alignment or line_loss handling.
      If rms_error rises with low steering_oscillation, the bias is the cause and
      ki should rise further. If steering_oscillation rises, lower kp first.


      - [Open this output](iteration-3/entity2/versions/ca2a096110d1400889c3c0efc3900788/payload.json)

      - Based on: [entity1](iteration-3/entity1/versions/75f828b498f446fbb515f83e610b5a5b/payload.json),
      [entityC2](iteration-3/entityC2/versions/d5de0606818944df96239512df32f145/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-13034a42d5c5ec74/payload.json)'
