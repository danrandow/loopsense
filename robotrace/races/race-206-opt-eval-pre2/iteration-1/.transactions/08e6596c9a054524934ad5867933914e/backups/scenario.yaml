map:
  id: race-206-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 1
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 0.
dimensions:
  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Halved steering gain
    notes: 'Halved the steering gain (sensor weights ±1 instead of ±2), raised kd
      to 0.6 and lowered base speed to 1.4, after the baseline left the line in all
      60 trials at progress 0.04 to 0.115. The change targets the oscillation implied
      by the iteration-0 gain of about 131k PWM counts per metre of error.


      ### Rationale


      Evidence: the iteration-0 design went off track in all 60 trials across oval,
      s-bend and slalom. Progress was only 0.04 to 0.115, with one line-loss event
      each time. The off-track limit is max(0.06, 0.0125 + 0.12/4) = 0.06 m, and max_error
      was about 0.061 m, so the robot left the line within a few tenths of a metre
      of starting. The likely cause is over-aggressive steering. With sensor weights
      of ±2 spaced 0.016 m apart, the signal is about 125 per metre of lateral offset.
      With kp = 3, that is roughly 375 turn units per metre, or about 131,000 PWM
      counts per metre of error, which oscillates at 1.6 base speed. Body_width cannot
      widen the off-track limit beyond 0.06 m without exceeding the body range, so
      the fix has to come from control.


      Changes: (1) Sensor weights reduced to [-1, -0.5, 0, 0.5, 1], keeping the same
      16 mm spacing. This halves the steering gain per metre of offset while keeping
      the same sign convention. (2) kp kept at 3.0, so the effective proportional
      gain is about half of the failed design. (3) kd raised from 0.3 to 0.6 to damp
      the faster oscillation that the half-gain loop still allows. ki stays 0 to avoid
      windup. (4) base_speed lowered from 1.6 to 1.4 to give the controller more time
      to correct at each bend. The trade-off is that a full lap in under 3 s may not
      be reached, but completion is worth 500 points and the first priority is staying
      on the line. (5) Sensors moved to y = 0.05, slightly further ahead of the axle,
      so steering starts earlier. (6) wheel_track widened to 0.14, which reduces yaw
      rate for a given wheel-speed difference and so reduces overshoot. Mass, wheel
      radius and body are kept mid-range.


      Expected result: stable tracking with rms_error under about 0.03 m and max_error
      below the 0.06 m limit on the development tracks. Progress should rise well
      above 0.1, and completion becomes possible on the s-bend and oval if the controller
      holds the line through the tighter bends. If oscillation persists, the next
      revision should reduce kp further or drop base_speed.


      - [Open this output](iteration-1/entity0/versions/2f3eef131a3942fe8d07874a59631d4d/payload.json)

      - Based on: [entityR2A](iteration-1/entityR2A/versions/carried-99c4a7a3a3ee016d/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Round-1 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-1/entityC1/versions/6816de5d24ca4a23b712f492c5755612/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/2f3eef131a3942fe8d07874a59631d4d/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-99c4a7a3a3ee016d/payload.json)'
  - id: entity1
    label: Halved gain, slower base
    notes: 'Revised design keeps the critique''s halved steering gain (weights ±1
      to ±0.5, effective gain 1.5), lowers base_speed to 1.5, reduces kd to 0.1 and
      adds ki 0.1 for the motor bias. Iteration 0 went off track in all 60 trials
      with max_error about 0.061, so the aim is staying on the line first, not completion.


      ### Rationale


      Evidence: the iteration-0 design (weights ±2, kp 2.5, kd 0.03, base_speed 1.9,
      wheel_track 0.12) went off track in all 60 trials on oval, s-bend and slalom.
      Progress was only 0.035 to 0.115, with one line-loss event each time. max_error
      sat at about 0.061, just above the 0.06 m off-track limit, and rms_error was
      about 0.03 on every track. The failure is early and consistent, not a slow growing
      oscillation. The loss happens in the first part of each run at high speed with
      high steering gain.


      Critique: I accept the main points. (a) Halving the sensor weights halves the
      steering gain per metre of offset. (b) At this gain, a higher base_speed leaves
      less time to correct, so the speed should come down. (c) Derivative on sensor
      edges is a real kick, so kd must be small. (d) With ki = 0, the fixed motor
      mismatch leaves a steady bias, so a small ki is needed. I partly reject the
      critique''s speed concern: completion is not achievable with a robot that leaves
      the line within 0.5 s, so I am prioritising staying on the line over completion
      time. I also reject widening wheel_track in this revision. Keeping wheel_track
      at 0.12 removes a second, uncalibrated gain change and makes the effect of the
      weight change easier to read.


      Changes: (1) sensor_weights [-1,-0.5,0,0.5,1] with kp 3.0 gives effective gain
      1.5 per unit of signal, against 5.0 in iteration 0 (about 3.3 times lower).
      (2) base_speed 1.9 to 1.5 (base_pwm about 2867, 70 percent), to give the controller
      time to correct at each bend. (3) kd 0.03 to 0.1. At weights of 0.5 spacing,
      an edge kick is about 0.5 * 100 * 0.1 = 5 turn units, which is small but still
      gives some damping. (4) ki 0 to 0.1. Its contribution is capped at about 0.2
      turn units by the integral limit, so it removes bias without windup. (5) Sensors
      moved from y 0.06 to y 0.05, a small change in lead. Sensor x positions, size
      and line_loss last_direction are kept, since the tape is always on one side
      after a bend.


      Kept: body, mass, wheel radius and wheel track at mid-range values. body_width
      has no lever here (off-track limit stays 0.06 m).


      Expected result (hypothesis, not observed): max_error well below 0.06 m, rms_error
      about 0.02 to 0.03 m, line_loss_events of 0 to 1, and progress above 0.3. Completion
      is not expected in this revision. Decision rule for the next revision: if max_error
      is still near 0.06 with low steering_oscillation, the cause is bias or under-steer
      on tight bends, so raise ki or kp slightly. If steering_oscillation rises, lower
      kp first.


      - [Open this output](iteration-1/entity1/versions/058d843471b848e78aeb3d097fdb422e/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/2f3eef131a3942fe8d07874a59631d4d/payload.json),
      [entityC1](iteration-1/entityC1/versions/6816de5d24ca4a23b712f492c5755612/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-99c4a7a3a3ee016d/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Critiques the revised design and rationale. Main points: the kd edge kick
      is about three times the proportional term, the 3.3-fold gain cut may under-steer
      tight bends, and base_pwm is misstated (3071, not 2867). Evidence is the iteration-0
      race data and the contract equations.


      - [Open this output](iteration-1/entityC2/versions/ad29aa54ce574e8eb09fd756e091c5fb/payload.json)

      - Based on: [entity1](iteration-1/entity1/versions/058d843471b848e78aeb3d097fdb422e/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-99c4a7a3a3ee016d/payload.json)'
  - id: entity2
    label: 'Final: speed 1.6, kd 0'
    notes: 'Lowered base_speed to 1.6 so the outer wheel does not clip on bends (headroom
      about 819 counts versus 205 at 1.9), and set kd to 0 because kd 0.03 still gives
      a turn kick of about 3 units per edge. Sensor layout, weights and line-loss
      rule are unchanged; the speed trade-off against the 3.0 s finish is stated as
      the main risk.


      ### Rationale


      Final design. I accepted the round-2 critique''s main point and reduced base_speed
      from 1.9 to 1.6.


      What changed and why:

      1) Wheel-command clipping. At base_speed 1.9, base_pwm = 4095 x 0.95 = 3890,
      leaving only about 205 counts of headroom. A turn of about 0.59 already clips
      the outer wheel, so steering authority on the S-bend and slalom would be cut
      by about a third. At base_speed 1.6, base_pwm = 3276 and headroom is about 819
      counts, which allows a turn of about 2.3 (signal about 0.94 at kp 2.5) before
      clipping. That covers the expected correction for a 12 mm offset (turn about
      1.9, differential about 665 counts) without saturation. The speed cost is real:
      the 3.0 s finish needs an average near 1.5 m/s, so completion is the main risk.
      I judge that a completed run at 1.6 is worth more than a faster run that leaves
      the line, since completion is worth 500 points.

      2) Derivative. The critique showed that kd 0.03 still gives about 3 turn units
      per sensor edge, which is larger than the proportional term at a 12 mm offset
      and can saturate the wheels. I set kd to 0 for this test so the race isolates
      the proportional and integral terms. Derivative will be reintroduced only if
      steering_oscillation shows a need for damping.

      3) Integral. I kept ki at 0.1. The integral is limited to plus or minus 2, so
      its contribution is at most about 0.2 turn units, which is small relative to
      the clip headroom. It corrects the fixed motor mismatch. I accept the critique''s
      point that the integration basis is unclear; the cap bounds the effect either
      way.

      4) Sensor lead. Sensors stay at y 0.06 m. At 1.6 m/s this is about 37 ms of
      lead (0.06/1.6), not the 32 ms or 37 ms quoted earlier at other speeds; the
      figure is corrected here.


      Kept: five sensors at 16 mm spacing, x from -0.032 to +0.032, sensor size 0.012
      (always covers the 25 mm tape). Weights (-2, -1, 0, 1, 2) keep the sign convention
      (negative = right, so a left-side tape gives a positive signal and a left steer).
      line_loss last_direction suits a line that stays on one side after each bend.
      Body, mass, wheel track and wheel radius are unchanged because no evidence motivates
      changing them. Off-track limit is 0.06 m from the centre line (about 47 mm beyond
      the tape edge).


      Expected (hypothesis, untested): completion on the development tracks, average
      speed about 1.4 to 1.6 m/s, rms_error under about 0.03 m, few line-loss events.
      If completion fails on time, the next step is a moderate increase of base_speed
      (to about 1.7, headroom about 614 counts) rather than raising kp. If max_error
      or steering_oscillation is high, the next step is to lower kp slightly.


      - [Open this output](iteration-0/entity2/versions/20990ce165a74f5f9923af2c7c5adc41/payload.json)

      - Based on: [entity1](iteration-0/entity1/versions/e104307898fb4f8abfee2fad8999e294/payload.json),
      [entityC2](iteration-0/entityC2/versions/3b32aebf0713412c92e802ef49d034ad/payload.json)'
