map:
  id: race-206-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Narrow sensor span test
    notes: 'Diagnostic draft: sensors narrowed to +/-0.03 m with weights scaled to
      keep the same signal slope, and the mass reduced to 0.4 kg. Every prior run
      failed at max_error about 0.06 m regardless of gain, speed or span, so this
      tests a different factor.


      ### Rationale


      Evidence: all six designs ended off-track in all 60 trials. max_error sits at
      0.061 to 0.066 m against the 0.06 m limit, and rms_error is about 0.03 m whatever
      the gain. Gain changes (kp 1.2 to 3), speed changes (0.8 to 1.6) and span changes
      (+/-0.032 to +/-0.06 m) have all failed to move the failure point. Iterations
      3, 5 and 6 produced nearly identical oval metrics (progress 0.1675, max_error
      0.066) despite different kp, ki, kd, mass and sensor span. The failure therefore
      looks insensitive to the parameters I have tried, so the next draft should test
      a different factor, not another gain sweep.


      Changes: (1) Sensor span narrowed to x = -0.03 to +0.03 in 0.01 m steps (7 sensors,
      12 mm footprints), with y = 0.06. This tests whether the robot is reacting to
      readings from the outer sensors at the edge of the band. (2) Weights set to
      x/0.04 (-0.75, -0.5, -0.25, 0, 0.25, 0.5, 0.75), which keeps the signal slope
      near 25 per metre, the same as iteration 5, so the controller gain per metre
      of offset is unchanged. (3) kp 1.6, ki 0.3, kd 1.0 and base_speed 0.9, held
      close to the best-scoring run (iteration 5 and 3). (4) Mass 0.4 and wheel_track
      0.14, wheel_radius 0.03 and body unchanged. line_loss stays last_direction.


      Expected result: max_error still near 0.06, since this is a diagnostic. If the
      excursion shrinks, the outer-sensor edge is the driver. If nothing changes,
      the next step is to change the drivetrain geometry (wheel_track or wheel_radius)
      because the controller has not moved the outcome.


      - [Open this output](iteration-7/entity0/versions/5716fcf25a0546bc84b11ac3b59a7194/payload.json)

      - Based on: [entityR2A](iteration-7/entityR2A/versions/carried-81e004a29a0bf948/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'The critique argues the narrower-span diagnostic repeats the iteration
      3 and 5 span tests, so it cannot change the outcome, and that it shrinks line-loss
      reach before the 0.06 m limit. It asks for a direct test of the start transient
      and for explicit thresholds in the fallback.


      - [Open this output](iteration-7/entityC1/versions/df7c8f7fcec74ce9aeaecfa955d71a0a/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/5716fcf25a0546bc84b11ac3b59a7194/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-81e004a29a0bf948/payload.json)'
  - id: entity1
    label: Narrower wheel track 0.10
    notes: 'Single-variable test: wheel_track 0.14 to 0.10 on the best-scoring layout
      (iteration 3/5/6 controller and sensors), to test whether steering authority
      limits the consistent 0.06 m departure. Critique''s kd and mass changes were
      rejected because they risk derivative kicks with no oscillation evidence.


      ### Rationale


      Evidence: all seven designs so far went off track in all 60 trials, with max_error
      at 0.060 to 0.066 m whatever the gain, speed, sensor span, mass or ki. Iteration
      5 (ki 1.5) and iteration 6 (ki 1.0) reproduced iteration 3 almost exactly, so
      the integral term is not the binding limit. The 7-sensor, 0.06 m span in iteration
      5 also matched iteration 3, so line loss at the array edge is not what ends
      the runs. The Evaluator''s critique is right that the uniform 0.06 m departure
      may come from a fixed early departure, but I cannot change the start. Of the
      remaining levers, wheel_track has not been tested. It sets turn rate per unit
      wheel-command difference (turn rate = (wL - wR)/track), so it controls how much
      steering authority each unit of turn gives.


      Decision: I keep the best-scoring layout (5 sensors at x -0.032 to +0.032 in
      0.016 m steps, y 0.05, size 0.012, weights -1, -0.5, 0, 0.5, 1, mass 0.8, wheel_radius
      0.03, body unchanged). I keep the controller from iteration 6 (kp 1.5, ki 1.0,
      kd 0.1, base_speed 1.0, last_direction), so the only change from the baseline
      is wheel_track 0.14 to 0.10. I reject the critique''s kd 1.0 and mass 0.4 changes,
      because the sensor-edge derivative kick is large and no oscillation evidence
      supports them. I also reject the critique''s suggestion to lower base_speed,
      since progress has risen with speed.


      Expected result (hypothesis): if steering authority was the limit, max_error
      should fall below 0.061 and progress on the oval should rise above 0.17. If
      max_error stays at 0.061 to 0.066 with the same timing, the cause is not steering
      authority, and the next step is to test the start condition or accept the current
      best. A sharper turn response may raise steering_oscillation; if it exceeds
      about 0.25, the wheel_track change is too aggressive and the next step is 0.12.


      - [Open this output](iteration-7/entity1/versions/54f410a16be34d2daec103cc330f07ee/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/5716fcf25a0546bc84b11ac3b59a7194/payload.json),
      [entityC1](iteration-7/entityC1/versions/df7c8f7fcec74ce9aeaecfa955d71a0a/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-81e004a29a0bf948/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Critiques the wheel_track 0.10 revision as a near-repeat of tested gain
      changes, with an expected-result threshold inside the run-to-run noise. Flags
      a factual error in the rationale: the claim that progress rises with speed is
      not supported, since oval progress peaks at speeds 1.0 to 1.5. Notes the untested
      line-loss path as the more plausible binding cause, based on the 2.0 line-loss
      events and the sensor geometry.


      - [Open this output](iteration-7/entityC2/versions/7a19a402a05b4d48a1b811e385842da2/payload.json)

      - Based on: [entity1](iteration-7/entity1/versions/54f410a16be34d2daec103cc330f07ee/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-81e004a29a0bf948/payload.json)'
  - id: entity2
    label: Narrower wheel track 0.10
    notes: 'Final design keeps the best layout and controller and changes only wheel_track
      from 0.14 to 0.10 to test steering authority. I accepted the critique''s correction
      of my speed claim and its expected-result warning, and rejected its kd and mass
      changes for lack of evidence. The 0.10 track is roughly a 1.4x steering gain,
      so the result is tested against the noise band of 0.0604 to 0.0662 max_error.


      ### Rationale


      Evidence: all seven designs went off track in all 60 trials, with oval max_error
      between 0.060 and 0.066 m whatever the gain, ki, speed, sensor span or mass.
      Every run in the best geometry shows line_loss_events of 2.0. The round-2 critique
      is right on three points: the effective steering gain from wheel_track 0.14
      to 0.10 is roughly 1.4x, which is close to the kp range already tested, so this
      test may mostly repeat a gain change; the 0.061 success cut-off sits inside
      the noise band; and my earlier claim that progress rises with speed is not supported
      by the data (oval progress peaked at speed 1.5, not 1.9 or 1.0). I accept the
      critique''s correction of that rationale error and its warning about the expected
      result, but I keep the design unchanged. The critique''s line-loss point is
      plausible, but changing sensor reach or the line_loss setting would confound
      this single-variable test, so I defer it to a later iteration. I reject the
      critique''s kd and mass changes, since no oscillation evidence supports them,
      and I keep base_speed 1.0 because the speed evidence is mixed rather than showing
      a clear gain from either direction. Design: 5 sensors at x -0.032 to +0.032
      in 0.016 m steps, y 0.05, size 0.012, weights -1, -0.5, 0, 0.5, 1; mass 0.8;
      wheel_radius 0.03; wheel_track 0.10 (the only change from the baseline); controller
      kp 1.5, ki 1.0, kd 0.1, base_speed 1.0, last_direction. Expected result (hypothesis,
      in the noise units the critique asked for): if steering authority is the limit,
      oval max_error falls to about 0.058 or lower, well below the 0.0604 to 0.0662
      spread seen so far, and progress rises clearly above 0.1675. If max_error stays
      between 0.060 and 0.066, steering authority is not the limit and the next test
      should target line loss (sensor reach or line_loss setting). If steering_oscillation
      exceeds 0.25 (a judgement threshold, since best runs sit near 0.18), wheel_track
      is too aggressive and the next step is 0.12.


      - [Open this output](iteration-7/entity2/versions/8b692ce6f6704397b6b89e4e3ff90b8d/payload.json)

      - Based on: [entity1](iteration-7/entity1/versions/54f410a16be34d2daec103cc330f07ee/payload.json),
      [entityC2](iteration-7/entityC2/versions/7a19a402a05b4d48a1b811e385842da2/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-81e004a29a0bf948/payload.json)'
