map:
  id: race-206-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Drivetrain and sensor-lag
    notes: 'Tests the untested factors after gain and speed sweeps stopped moving
      the off-track point: wheel_track 0.18, wheel_radius 0.05, and sensors moved
      to y=0.02 to cut steering lag. Based on the all-off-track evidence from iterations
      0 to 8.


      ### Rationale


      Evidence: all eight designs went off track in all 60 trials. max_error sits
      at 0.061 to 0.066 m against the 0.06 m limit whatever the gain (kp 1.2 to 3),
      speed (0.6 to 1.6), sensor span (+/-0.03 to +/-0.06 m) or mass. Progress is
      nearly fixed by track (oval about 0.12 to 0.17, s-bend about 0.04 to 0.07),
      so the robot leaves the line at roughly the same early point each time. The
      parameter sweeps have stopped moving the outcome. The untested factors are drivetrain
      geometry (wheel_track has only been 0.12 to 0.14, wheel_radius only 0.03) and
      sensor y position (all sensors have been 0.04 m or further ahead of the axle,
      so steering lag is large).


      Changes: (1) Sensors moved to y = 0.02, close to the axle, to cut the steering
      lag that a sensor 6 cm ahead introduces. (2) Geometry otherwise kept from iteration
      8: seven sensors at x = -0.03 to +0.03, 12 mm footprints. (3) wheel_track widened
      to 0.18 (top of range), which lowers the yaw rate per unit wheel-speed difference
      and should reduce overshoot. (4) wheel_radius raised to 0.05 (top of range),
      which gives more ground speed per PWM count and so a faster run at the same
      base_speed. (5) base_speed raised from 0.6 to 0.8 to test whether the wider
      drivetrain can hold the line at more speed. (6) kp raised from 1.2 to 2.0, since
      the lower yaw rate from the wider track reduces the effective gain, and the
      weights are small. kd raised to 1.0 to damp the faster response. ki 0.3 kept
      for the motor-mismatch bias. line_loss stays last_direction.


      This is a diagnostic as much as an improvement attempt. Expected result: max_error
      below about 0.05 m and fewer line-loss events. Completion remains unlikely.
      If max_error still reaches 0.06, the controller structure (e.g. signal scaling
      or line-loss handling) is the next suspect, not the gains.


      - [Open this output](iteration-9/entity0/versions/e65f62cc41ec4c97a1b8e12999523e03/payload.json)

      - Based on: [entityR2A](iteration-9/entityR2A/versions/carried-6483ab55a4fe02d9/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critique of the draft: six-plus factors change at once so the race cannot
      test the hypothesis, and the kp/wheel_track arithmetic shows about 30 percent
      more effective gain, not compensation. The kd rise reintroduces the sensor-edge
      derivative kick, and the start-transient explanation for the uniform 0.06 m
      excursion is still untested. Evidence is the iteration 0 to 8 race metrics and
      the contract''s steering and drivetrain equations.


      - [Open this output](iteration-9/entityC1/versions/d7934809fedc414a80e8f29f5db8de76/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/e65f62cc41ec4c97a1b8e12999523e03/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-6483ab55a4fe02d9/payload.json)'
  - id: entity1
    label: Wider track, one change
    notes: 'Revised from the best run (iteration 8, score 40.40) by changing only
      wheel_track 0.14 to 0.18, after the critique showed that the multi-factor draft
      could not be attributed. The 0.10 track lowered progress, so a gentler steering
      response is the test. Success is a score above 40.40.


      ### Rationale


      Evidence: the best run so far is iteration 8 (score 40.40; wheel_radius 0.04,
      otherwise the iteration 3/5/6 layout and controller). Its oval progress is 0.169
      and max_error is 0.069. Every design has gone off track in all 60 trials, with
      max_error at 0.060 to 0.069 m whatever the gain, ki, speed, span, mass or sensor
      y. Two earlier levers are still untested: wheel_track above 0.14 (0.10 lowered
      oval progress from 0.168 to 0.115, which suggests that a gentler steering response
      may help, not hurt) and the controller-to-geometry coupling.


      Critique: I accept most of it. The draft changed six or more variables at once,
      so no result could be attributed, and I withdraw that draft. I accept that the
      kd 1.0 sensor-edge kick (about 50 turn units per step) has no oscillation to
      damp, so kd stays at 0.1. I accept that the sensor-y reversal and the 0.8 base
      speed were not justified, so sensor y stays at 0.05 and base speed at 1.0. I
      accept the gain arithmetic: kp/wheel_track is a reasonable effective-gain measure,
      so I do not raise kp while widening the track.


      Partly rejected: the critique''s suggestion of a start-only test is sound in
      principle, but I have no tool that changes the start, so it cannot be run here.
      I do not adopt the critique''s view that the uniform 0.06 m excursion is unbeatable.
      It is still an open question that a single clean geometry test can probe.


      Change (single factor from iteration 8): wheel_track 0.14 to 0.18, the top of
      the range. Yaw rate per unit wheel-speed difference falls by about 22 percent,
      so the steering response is gentler. All other values are as in iteration 8:
      five sensors at x -0.032 to +0.032 with y 0.05, 12 mm footprints, weights -1
      to 1, wheel_radius 0.04, mass 0.8, kp 1.5, ki 1.0, kd 0.1, base 1.0, last_direction.
      kp is not changed, so the effective gain falls with the track, as the test intends.


      Expected result (hypothesis): if steering responsiveness was limiting progress,
      oval and slalom progress should rise above 0.17 and max_error should fall below
      0.066. Success threshold: a score above 40.40 (the iteration 8 best). If max_error
      stays at 0.066 with unchanged timing, the wheel-track lever is exhausted, and
      the next step is to accept the best design or test one further geometry change.
      If steering_oscillation exceeds about 0.25, the gentler response is too sluggish,
      and the next step is wheel_track 0.16.


      - [Open this output](iteration-9/entity1/versions/7f1e920bfccd42248b2590ecc950eee0/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/e65f62cc41ec4c97a1b8e12999523e03/payload.json),
      [entityC1](iteration-9/entityC1/versions/d7934809fedc414a80e8f29f5db8de76/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-6483ab55a4fe02d9/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Critique of the wheel_track 0.18 revision. Its main point is that wheel_track
      0.18 with wheel_radius 0.04 gives a steering ratio close to iteration 3, so
      the test is confounded, and that the 0.6-point gap to the best score is within
      noise. Based on the iteration 3, 7 and 8 results and the contract drivetrain
      equations.


      - [Open this output](iteration-9/entityC2/versions/fa3284afd4614dfc996d2d7dcc952983/payload.json)

      - Based on: [entity1](iteration-9/entity1/versions/7f1e920bfccd42248b2590ecc950eee0/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-6483ab55a4fe02d9/payload.json)'
  - id: entity2
    label: Wheel radius 0.04 test
    notes: 'Best-tested design (iteration 5, score 39.81) with only wheel_radius raised
      from 0.03 to 0.04, a clean one-variable test. It corrects the revision, which
      had silently used the wrong baseline (wheel_track 0.14 and the iteration-7 controller).
      Evidence: all runs end off track at about 0.06 m; line loss and steering gain
      remain open.


      ### Rationale


      Evidence: the best raced score is 39.81 (iterations 3, 5 and 6). Iterations
      5 and 6 are the same design, and iteration 5 is the best-tested one: wheel_track
      0.12, wheel_radius 0.03, kp 3.0, ki 0.8, kd 0.03, base_speed 1.5, five sensors
      at x -0.032 to +0.032, y 0.05, size 0.012, weights -1, -0.5, 0, 0.5, 1, last_direction.
      Every run in the record ended off track at about 0.06 m, not at the 3 s limit,
      so the early departure is the binding failure. The Round-2 critique is right
      that the revision was not a clean test. The revision compared against the wrong
      baseline: it kept wheel_track 0.14 and the kp 1.5 / ki 1.0 / kd 0.1 / base 1.0
      controller from iteration 7, which scored 26 and 36.7, not 39.8. So it differed
      from the best run in several variables at once, and its claim to differ in only
      wheel_radius was false. I reject that design. I keep the iteration-5 design
      exactly and change only wheel_radius from 0.03 to 0.04. Accepted from the critique:
      the wheel_radius change also raises steering authority about 1.33x (speed and
      yaw rate per unit turn both scale with radius), so a result cannot be attributed
      to speed alone; line loss (2 events per run on oval, slalom and s-bend) is a
      real score cost, so I note it for the next iteration. Rejected: the base_speed
      0.6 suggestion, since runs end by departure rather than the time limit, and
      cutting ground speed would not help. Expected result: higher ground speed per
      PWM, so progress rises above the 0.1675 oval, 0.0725 s-bend and 0.0625 slalom
      baselines, with max_error near 0.061 to 0.066. Success means a score above 39.81.
      If steering_oscillation exceeds 0.25 or max_error grows, the larger effective
      gain is the cause, and the next step is wheel_radius 0.035 or a lower kp.


      - [Open this output](iteration-8/entity2/versions/868501496033420f81f8c38452ba167d/payload.json)

      - Based on: [entity1](iteration-8/entity1/versions/26412ce84fb3486aa19b9d8de5607fe9/payload.json),
