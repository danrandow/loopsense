map:
  id: race-208-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Add integral to cancel
    notes: 'Keeps the best iteration-5 geometry and adds ki=1.0 to cancel the steady
      left/right motor-mismatch offset, which is the likely cause of the constant
      0.03 m rms error and off-track ends. Evidence: identical scores under different
      kp/kd, and rms error unchanged across all runs.


      ### Rationale


      Evidence: every development trial ends off track at max_error about 0.06 m,
      the off-track limit, with rms_error about 0.03 m in all tracks and seeds. Line
      loss is now rare (0.0 to 0.8 events), so sensing coverage is adequate. The best
      design so far is iteration 5 (score 137.8), with a smaller body and mass and
      the sensor row at y=0.07. Iterations 2 and 4 scored identically (132.0028) although
      kd moved from 0.4 to 1.0 and kp from 3.0 to 2.8, so gain tuning alone is not
      the binding limit. The most likely cause is the fixed left/right motor mismatch
      that the contract describes. With ki=0, a constant mismatch produces a steady
      lateral offset of roughly bias/kp, which would show up as a consistent rms error
      of about 0.03 m and drift to the off-track limit on every track, matching the
      data. A non-zero integral term can cancel that constant turn bias, since the
      integral is clipped to +/-2 and so cannot wind up without bound. Changes: (1)
      keep the iteration-5 geometry exactly (body 0.14 x 0.10, mass 0.5, 5 sensors
      at x=-0.06..+0.06 and y=0.07, 16 mm footprint, wheel_track 0.12, wheel_radius
      0.03), so the controller change is isolated; (2) set ki from 0 to 1.0 to cancel
      the steady bias; (3) keep kp 3.0, kd 0.4, base_speed 1.3 and last_direction
      line loss. Expected result: rms_error and max_error should fall, with fewer
      off-track ends and progress above the 0.27 to 0.55 range seen so far. If the
      integral removes the offset but progress still stalls on speed, the next step
      is base_speed toward 1.6 for the finish-time term. The telemetry will show whether
      rms_error drops sharply, which would confirm the bias explanation.


      - [Open this output](iteration-6/entity0/versions/2e14b8efcfd046d6a38c89ba203b3cb3/payload.json)

      - Based on: [entityR2A](iteration-6/entityR2A/versions/carried-5ce958fa69469ec7/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critiques the ki=1.0 bias-cancellation draft: the integral may be too
      slow for a 3 s race, the bias size is unestimated, and iterations 2 and 4 showed
      identical scores despite different gains, which may mean gains are not applied.
      The rationale lacks a decision rule and magnitudes for its predictions.


      - [Open this output](iteration-6/entityC1/versions/27a2b147b76143c6b61a9dc59a077d7d/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/2e14b8efcfd046d6a38c89ba203b3cb3/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-5ce958fa69469ec7/payload.json)'
  - id: entity1
    label: Revert to best measured
    notes: 'Returns to the iteration-5 design (score 137.76): base_speed 1.8, measured
      geometry and ki 0.3. Rejects the untested geometry change and ki 1.0, because
      ki 0.6 already scored lower than 0.3 and the geometry change was confounded.


      ### Rationale


      Evidence: the best measured design is iteration 5 (score 137.76, base_speed
      1.8, body 0.18 x 0.12 m, 0.8 kg, sensors at y 0.06 with x from -0.06 to +0.06,
      16 mm footprints, kp 3.0, ki 0.3, kd 0.4, last_direction). Iterations 2 and
      4 (base 1.6) scored 132.0, so raising base_speed from 1.6 to 1.8 gained about
      5.8 points. Iteration 3 (ki 0.6) scored lower (122.2) than ki 0.3, so larger
      integral gain has already been tested and did not help. Iterations 1 and 3 (base
      1.2 to 1.3 and kd/kp changes) scored lower, and no tested design below base
      1.6 has been better.


      What I accepted from the round-1 critique: (1) The draft''s base_speed 1.3 is
      below the best measured speed, and the critique correctly says a 3 s completion
      needs about 1.5 m/s average. I raise base_speed to 1.8, which is the best-evidenced
      value. (2) The draft changed mass, body length, body width and sensor y at once,
      so its result could not be attributed to any one change, and the critique notes
      the body_width argument is wrong (the off-track limit is 0.06 m for any width
      below 0.19 m). I reject the draft geometry and return to the measured iteration-5
      geometry. (3) The draft''s ki 1.0 is outside the tested range and runs against
      the data: ki 0.6 already lowered the score relative to ki 0.3. I reject it and
      keep ki 0.3. (4) The steady max_error near 0.06 with flat rms may be a motor-mismatch
      bias, but the one-step test for that is a smaller ki, not a larger one; this
      is deferred to a later iteration.


      What I kept: kp 3.0, kd 0.4, last_direction, sensor span and footprint, and
      all geometry, so this candidate equals the best measured design. The reason
      is that a revision built on untested geometry and an untested ki has a worse
      expected score than the best-evidenced design, and the score (completion, progress,
      line loss, rms) rewards staying on the line.


      Expected result: about 138 points, consistent with iteration 5, with oval progress
      near 0.55 and completion on rare oval runs. Decision rule for the next round:
      if progress is again flat and max_error stays at 0.06, the next single-variable
      test is ki 0.1 (not 1.0). If the line is lost on the s-bend or slalom, test
      a sensor footprint or span change on those tracks. Base_speed 2.0 is the next
      speed step only if completion_time is the limit rather than off-track ends.


      - [Open this output](iteration-6/entity1/versions/9ce12549446d4e86a38d86dbf00e8086/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/2e14b8efcfd046d6a38c89ba203b3cb3/payload.json),
      [entityC1](iteration-6/entityC1/versions/27a2b147b76143c6b61a9dc59a077d7d/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-5ce958fa69469ec7/payload.json)'
  - id: entityC2
    label: Round-2 critique
    notes: 'Critiques the base_speed 1.6 to 1.8 single-variable test. The main concerns
      are that max_error is capped near 0.06 m by the off-track rule, so the rationale''s
      bias trigger will fire almost regardless, and that the time-term gain is small
      next to the completion term. Evidence is the iteration 0-4 race data and the
      contract''s scoring formula.


      - [Open this output](iteration-5/entityC2/versions/38b5cb3929d2463b89568b8de32b51b8/payload.json)

      - Based on: [entity1](iteration-5/entity1/versions/7e3ff982982344b983aa7505289c70d1/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-133b9005b338b299/payload.json)'
  - id: entity2
    label: Speed 1.8 single-variable
    notes: 'Final design is the raced iteration-2 baseline (score 132.0) with base_speed
      raised from 1.6 to 1.8 and nothing else changed. The test passes only if the
      score exceeds 132.0 and s-bend and slalom off-track ends do not rise, since
      the rationale notes the speed effect is unisolated.


      ### Rationale


      Evidence: the raced iteration 2 design (score 132.0028) is the best so far.
      Its outcome row is kp 2.8, ki 0.3, kd 0.4, base_speed 1.6, last_direction, with
      sensors at x -0.06 to +0.06, y 0.06, 16 mm footprints. It is the only design
      with a finish (oval, 1.88 s) and has the highest progress on every track (oval
      0.45, s-bend 0.27, slalom 0.16). Iteration 3 (ki 0.6) scored lower at 122.2,
      so ki stays at 0.3.


      Record discrepancy: the entity1 text and the round-2 critique cite kp 3.0 for
      iteration 2. The outcome table and the iteration 2 produced entity both show
      kp 2.8, and the score is tied to the raced design. I use kp 2.8 so that this
      race differs from the 132.0 baseline in base_speed alone.


      What I accepted from the round-2 critique: (1) The test is cleanly isolated.
      Relative to the raced baseline, only base_speed changes, from 1.6 to 1.8. (2)
      The max_error trigger cannot discriminate, because off-track runs end at the
      0.06 m limit. I therefore do not use max_error to decide the next step. I use
      progress, off-track ends, and line_loss_events on the s-bend and slalom. (3)
      The success criterion is stated explicitly below. (4) Speed matters for progress
      and completion more than for the time term, which is at most about 22 points
      on the oval.


      What I rejected: (a) Reverting to 1.6 now, which would not add information.
      (b) Changing kp to 3.0 in the same race, which would confound the speed test.
      (c) Changing sensor span or footprint this round. Iteration 1 showed a span
      change did not move max_error, so I keep geometry fixed until the speed effect
      is known. (d) Lowering speed for the time bonus, since completion is worth 500
      points.


      What I changed: base_speed 1.6 to 1.8. Everything else matches the raced iteration
      2 design.


      Success criterion: the test passes only if the score exceeds 132.0 and off-track
      ends on the s-bend and slalom do not rise. A gain on the oval alone does not
      count if progress falls on the s-bend or slalom.


      Expected result (a guess, not a measurement): progress equal to or above the
      baseline on the oval, with a faster oval finish possible. Lateral load rises
      with speed on the bends, so progress on the s-bend and slalom could fall. I
      give this roughly even odds.


      Decision rule for the next round: if the score exceeds 132.0 with s-bend and
      slalom progress and off-track ends no worse, keep 1.8 and test whether line_loss_events
      on the s-bend (0.65) and slalom (0.8) fall. If the score falls or off-track
      ends rise, return to 1.6 and test a sensor footprint change on the s-bend and
      slalom. If progress is flat at 1.8, the steady-bias explanation is next, tested
      as a smaller ki (about 0.1) on its own.


      - [Open this output](iteration-5/entity2/versions/43d9109efe7b45809306a01f2b0ed92a/payload.json)

      - Based on: [entity1](iteration-5/entity1/versions/7e3ff982982344b983aa7505289c70d1/payload.json),
      [entityC2](iteration-5/entityC2/versions/38b5cb3929d2463b89568b8de32b51b8/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-133b9005b338b299/payload.json)'
