map:
  id: race-208-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Test higher kp (5.0)
    notes: 'Keeps the iteration-5 geometry, the best so far at 137.76, and raises
      kp from 3.0 to 5.0 as the one untested control lever. Several other single-parameter
      changes gave identical metrics, so proportional authority is the remaining candidate.


      ### Rationale


      Evidence: all 60 trials of every design so far ended off track at max_error
      about 0.06 m, the off-track limit for any allowed body width (the floor of 0.06
      m applies, since 0.0125 + body_width/4 is at most 0.0575 m). RMS error sits
      near 0.03 m everywhere. The best design is iteration 5 (score 137.76), with
      body 0.14 x 0.10 m, 0.5 kg, 5 sensors at x = -0.06..+0.06 and y = 0.07, a 16
      mm footprint, wheel_track 0.12 and kp 3.0 / kd 0.4 / ki 0 at base_speed 1.3.


      Several single-parameter changes gave metrics identical to four decimals: kd
      0.4 vs 1.0 (iterations 2 and 4), ki 0 vs 1.0 (iterations 5 and 6), wheel_track
      0.12 vs 0.10 (iterations 5 and 7), base_speed 1.3 vs 1.1 (iterations 7 and 8),
      and the wider sensor span to +/-0.08 with y = 0.08 (iterations 5 and 9). Those
      levers therefore do not bind. Iteration 9 also matched iteration 5 exactly,
      so my previous sensing hypothesis was not supported. The one change that moved
      the score was the sensor span and footprint in iteration 2, which mainly cut
      line-loss events.


      What is left untested is the proportional authority. kp was only varied between
      2.0 and 3.0, and every result there sat in the same failure band. This iteration
      raises kp to 5.0 with kd 0.4, ki 0, base_speed 1.3 and iteration-5 geometry
      unchanged, so the controller is the only variable. The aim is a stiffer correction
      on the bends before the robot reaches the 0.06 m edge. The risk is more oscillation,
      which the telemetry will show. Expected result: if the failure is a lack of
      correction authority, max_error and progress should improve on the s-bend and
      slalom; if not, the score stays near 137.8 and the next step is a geometry change.
      Finishing within 3 s remains unlikely at this speed.


      - [Open this output](iteration-10/entity0/versions/d50fd489e0ab43d1a749f0a2f24a1b27/payload.json)

      - Based on: [entityR2A](iteration-10/entityR2A/versions/carried-5ce958fa69469ec7/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critiques the kp 5.0 draft: saturation at high kp, kd left low, and the
      same-metric responsiveness problem in iterations 2 to 9. Notes that the persistent
      max_error and flat rms pattern points to a constant offset, which the draft
      does not test.


      - [Open this output](iteration-10/entityC1/versions/3a600e6e949d499689bc6c3e3fe97441/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/d50fd489e0ab43d1a749f0a2f24a1b27/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-5ce958fa69469ec7/payload.json)'
  - id: entity1
    label: Iter-5 design, ki 0.1
    notes: 'Revision of the draft: kp 5.0 is rejected as a saturation risk, and the
      draft''s changed geometry is dropped. The design is the best measured iteration-5
      design (137.76) with only ki changed to 0.1, a small bias test. Evidence: flat
      rms and max_error at the 0.06 m limit on every track.


      ### Rationale


      Evidence: the best measured design is iteration 5 (score 137.76): body 0.18
      x 0.12 m, 0.8 kg, five 16 mm sensors at y 0.06 m with x = -0.06..+0.06 m, wheel_track
      0.12, kp 3.0, kd 0.4, ki 0.3, base_speed 1.8, last_direction. Every design so
      far ends off track at max_error about 0.061 to 0.063 m, with rms_error flat
      near 0.03 m across tracks. That pattern suggests a constant offset (the fixed
      left/right motor mismatch with a small integral term) more than a lack of correction
      authority.


      What I accepted from the round-1 critique: (1) kp 5.0 is rejected. At base 1.3
      the signal can push the wheel commands into saturation at the edges, and the
      draft''s own evidence does not support a stiffer loop. (2) The draft changed
      several fields at once, so I return to the measured geometry. (3) The critique
      is right that kd 1.0 and kd 0.7 showed no reduction in oscillation, so I do
      not raise kd. (4) The bias hypothesis is worth one clean test, which the critique
      also proposes: a small ki, not a large one. ki 1.0 and ki 0.6 were both worse
      or inert, so I test ki 0.1 rather than adding more integral action.


      What I changed: ki from 0.3 to 0.1, with everything else identical to iteration
      5 (geometry, kp 3.0, kd 0.4, base_speed 1.8, last_direction). This is a single-variable
      change from the best design. Since the score is driven by progress, line-loss
      and rms (not oscillation), I do not expect a large gain. Expected result: score
      within about 3 points of 137.8, with rms_error and max_error nearly unchanged
      if ki is inert or the bias is small. If the metrics come back identical to iteration
      5 at four decimals, the controller field is not reaching the simulator and the
      bias question stays open. If rms falls clearly and progress rises, the next
      step is ki near 0.2 with the same geometry. If the score falls, return to ki
      0.3.


      - [Open this output](iteration-10/entity1/versions/29b800a33fa646b384b16b7b18eb3094/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/d50fd489e0ab43d1a749f0a2f24a1b27/payload.json),
      [entityC1](iteration-10/entityC1/versions/3a600e6e949d499689bc6c3e3fe97441/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-5ce958fa69469ec7/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Critiques the ki 0.1 single-variable test: it is clean, but it targets
      a lever unlikely to move bend progress. Evidence is the iteration 3 ki 0.6 result
      (score 122 vs 132) and the flat 0.03 m rms, which does not separate bias from
      noise or outer-wheel clipping at base 1.8.


      - [Open this output](iteration-10/entityC2/versions/6972789be77b40a7af0391bb786dbed0/payload.json)

      - Based on: [entity1](iteration-10/entity1/versions/29b800a33fa646b384b16b7b18eb3094/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-5ce958fa69469ec7/payload.json)'
  - id: entity2
    label: Final Design
    notes: 'Final Design. The model did not supply a valid label and summary, so the
      orchestrator wrote this one.


      ### Rationale


      Evidence: iterations 5 to 9 all scored 137.7649 with identical outcomes, so
      the simulator is deterministic and the best measured design is iteration 5 (kp
      2.8, ki 0.3, kd 0.4, base_speed 1.8, last_direction, five 16 mm sensors at y
      0.06 m, x = -0.06 to +0.06 m, wheel_track 0.12). Every track ends off track
      at max_error about 0.061 to 0.063 m, and the bend tracks (s-bend 0 of 20, slalom
      0 of 20) fail laterally.


      I checked the revision that was passed to me. Its controller block lists kp
      3.0, but its rationale says it is identical to iteration 5 apart from ki, and
      iteration 5 used kp 2.8. The revision therefore changed two gains at once (kp
      2.8 to 3.0 and ki 0.3 to 0.1), and that is not a clean test. I reject the kp
      3.0 change and return kp to the measured 2.8, so this candidate changes only
      ki, as the critique asked.


      What I kept from the critique: ki is the only variable changed; kd is not raised
      (kd 0.7 and 1.0 were never raced at this geometry, so I do not cite them as
      evidence); the decision rule is now per track. What I did not take: I did not
      adopt the critique''s view that ki is inert. Its point that ki 0.6 changed the
      oval oscillation and score is correct, so ki 0.1 is a real test of the direction
      of that effect.


      Decision rule for the race: a pass needs oval progress at or above 0.549, s-bend
      progress at or above 0.18, slalom progress at or above 0.12, and score at or
      above 137.76. If the metrics match iteration 5 to four decimals, the ki field
      is not reaching the simulator. If any track falls below its target, return to
      ki 0.3. The saturation hypothesis (outer-wheel clipping at base 1.8 with kp
      2.8) is still untested, and this change does not address it.


      Expected result: a small change, probably within a few points of 137.8, with
      bend progress the most sensitive measure.


      - [Open this output](iteration-10/entity2/versions/ce43b4a84a314acb8114fc37b2fbc9b6/payload.json)

      - Based on: [entity1](iteration-10/entity1/versions/29b800a33fa646b384b16b7b18eb3094/payload.json),
      [entityC2](iteration-10/entityC2/versions/6972789be77b40a7af0391bb786dbed0/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-5ce958fa69469ec7/payload.json)'
