map:
  id: race-208-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Slower base speed 1.1
    notes: 'Keeps the iteration-7 design and cuts base_speed from 1.3 to 1.1 to reduce
      lateral load in bends. Gain, ki and wheel_track changes produced identical metrics
      in earlier races, so speed is the untested lever left.


      ### Rationale


      Evidence: every development trial so far ends off track, with max_error pinned
      at about 0.06 m (the off-track limit) and rms_error about 0.03 m. Progress ranges
      from 0.11 to 0.55, and the best design is iteration 5 (score 137.76). Several
      changes produced identical metrics to four decimals: kd 0.4 vs 1.0 (iterations
      2 and 4), ki 0 vs 1.0 (iterations 5 and 6), and wheel_track 0.12 vs 0.10 (iterations
      5 and 7). So gain and track-width tuning are not the binding limit at this geometry.
      The consistent 0.06 m excursion across all tracks and seeds points to a speed-limited
      failure: the robot cannot hold the tape through the bends at base_speed 1.3,
      and the lateral load pushes it past the limit. Change: lower base_speed from
      1.3 to 1.1 to reduce lateral load and give the steering loop room to correct.
      Everything else is held at the iteration-7 values (geometry as iteration 5,
      wheel_track 0.10, kp 3.0, kd 0.4, ki 0, last_direction line loss), so the speed
      change is isolated. Expected result: fewer off-track ends, max_error below 0.06
      for longer, and progress above the current 0.55 on the oval. Finishing within
      3 s may be lost at this speed, but the progress and error terms carry most of
      the score, and a robot that stays on the line scores far more than one that
      leaves it. If progress rises clearly, the next step is a small speed increase
      to recover the finish-time term.


      - [Open this output](iteration-8/entity0/versions/534d50e6d66440abae14e60223fc1bc4/payload.json)

      - Based on: [entityR2A](iteration-8/entityR2A/versions/carried-5ce958fa69469ec7/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critiques the base_speed 1.1 draft: the speed cut trades away completion
      bonus chances, rests on a lateral-load mechanism the data does not show, and
      gives untestable expected results. Evidence cited: flat max_error near 0.06
      with rms near 0.03, the 1.88 s oval finish at base 1.3, and identical metrics
      across changed controller fields in iterations 2, 4 and 6.


      - [Open this output](iteration-8/entityC1/versions/1f1bf4d20ff64d5182187f8417ee5c5c/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/534d50e6d66440abae14e60223fc1bc4/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-5ce958fa69469ec7/payload.json)'
  - id: entity1
    label: Resubmit best design
    notes: 'Reverts to the measured best design (iteration 5, score 137.76) at base_speed
      1.8 and drops the untested speed cut and four-field geometry change from the
      draft. The choice rests on the race data, which shows base 1.8 beat base 1.6
      and no tested sub-1.6 design beat it.


      ### Rationale


      Evidence: the best measured design is iteration 5 (score 137.76): body 0.18
      x 0.12 m, mass 0.8 kg, five 16 mm sensors at y 0.06 m with x from -0.06 to +0.06
      m, wheel_track 0.12 m, wheel_radius 0.03 m, base_speed 1.8, kp 3.0, ki 0.3,
      kd 0.4, last_direction line loss. Its oval finish (1.88 s at base 1.6) shows
      time margin, and iterations 2 and 4 at base 1.6 scored 132.0, so base 1.8 gained
      about 5.8 points. Every design so far ends off track with max_error at about
      0.06 m and rms_error about 0.03 m.


      What I accepted from the round-1 critique: (1) The draft lowered base_speed
      to 1.1 and changed mass, length, width, sensor y and wheel_track together. The
      critique is right that this is confounded and that a slower base makes the 500-point
      completion and 60-point time terms harder to reach. The iteration-7 and iteration-6
      data also show no tested design below base 1.6 beat 1.8. (2) The body_width
      argument is wrong: the off-track limit is 0.06 m for any width below 0.19 m,
      so width is not a lever. (3) Identical outputs at four decimals across distinct
      controller settings (iterations 2 and 4, and iteration 6 against 5) are suspicious,
      so I do not build on the small gain effects those comparisons suggested.


      What I rejected: the draft''s speed cut, its four-field geometry change, and
      its wheel_track 0.10 change. Each is untested in isolation, and the critique
      notes that narrowing the track is roughly a 20 percent gain increase, which
      is not a clean new lever. I also do not add ki 0.1 or ki 1.0 here, because ki
      0.6 scored lower than ki 0.3 and ki 1.0 gave output identical to ki 0 in the
      logged data.


      What I changed: nothing from the draft. This candidate resubmits the iteration-5
      design exactly, so the next critique and the final race rest on the best-evidenced
      configuration rather than on untested changes. Expected result: about 138 points,
      oval progress near 0.55, a small chance of completion on the oval, and off-track
      ends on the s-bend and slalom. Decision rule for the next round: if the critique
      identifies a specific single-variable test with a clear prediction, I will run
      it only if it does not replace the measured design. If progress stays flat at
      the 0.06 m limit, the next candidate test is a smaller ki (about 0.1), not a
      larger one.


      - [Open this output](iteration-8/entity1/versions/3bc0b5279e2345a4bd6d8d9a6a518fb8/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/534d50e6d66440abae14e60223fc1bc4/payload.json),
      [entityC1](iteration-8/entityC1/versions/1f1bf4d20ff64d5182187f8417ee5c5c/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-5ce958fa69469ec7/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Critique of the resubmitted iteration-5 design, which is identical to
      iterations 5 and 6 and so cannot add new evidence. It flags the stale line-loss
      evidence, the misstated history, the untested kp 2.8 and kd 1.0 claims, and
      the bend progress losses that the rationale omits. It rests on the iteration
      2, 3, 5 and 6 race tables.


      - [Open this output](iteration-8/entityC2/versions/95e3d11eab374b0c96c2bb2c307a0171/payload.json)

      - Based on: [entity1](iteration-8/entity1/versions/3bc0b5279e2345a4bd6d8d9a6a518fb8/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-5ce958fa69469ec7/payload.json)'
  - id: entity2
    label: Final Design
    notes: 'Final Design. The model did not supply a valid label and summary, so the
      orchestrator wrote this one.


      ### Rationale


      Final design: the iteration-5 configuration, resubmitted unchanged. This is
      a score-preserving confirmation, not a new test. The race is deterministic per
      seed and track, so the expected score is 137.76 with oval progress near 0.55
      and s-bend and slalom progress near 0.18 and 0.12.


      Evidence: iteration 5 scored 137.7649 with base_speed 1.8 and kp 2.8. Iteration
      6 and iteration 7 reproduced that score exactly. Iterations 2 and 4 (base 1.6,
      same otherwise) scored 132.0028, so the speed step gained about 5.8 points.
      That gain is net: the oval improved (progress 0.45 to 0.55, one extra finish
      at 1.925 s), while s-bend progress fell from 0.27 to 0.18 and slalom from 0.16
      to 0.12. Mean s-bend and slalom scores fell from about 111 to 78 and from 67
      to 52. Line loss on the bends fell to 0.0 at 1.8, so the bend failures are lateral
      off-track ends, not line losses.


      What I accepted from the round-2 critique: (1) This iteration is a resubmission
      and cannot add parameter evidence, so I say so here. (2) The stale line-loss
      figures of 0.65 to 0.8 are from base 1.6. The measured value at 1.8 is 0.0 on
      the bends. (3) kp 2.8 is the raced value; kp 3.0 in the authorized text is a
      documentation error, and I keep 2.8 so the race matches the measured 137.76.
      (4) max_error is capped near 0.06 by the off-track rule, so it is not a decision
      input. (5) The bend progress loss is the main cost of the speed step and must
      be judged alongside the oval gain.


      What I rejected: (a) base_speed 2.0. base_pwm reaches the 4095 ceiling there,
      so steering headroom on the outside wheel is lost exactly where the bends need
      it. (b) Any geometry, kp, ki or kd change in this race, since that would trade
      the best measured score for an untested design. (c) The claim that kp 2.8 and
      kd 1.0  ''add no gain'' is removed; those values were never raced. (d) A footprint
      or span change without a mechanism for the off-track end, since widening the
      span did not move max_error in iteration 1.


      Success criterion for this iteration: the score must stay at or above 137.76,
      with s-bend and slalom progress not falling below their iteration-5 values.


      Decision rule for the next round: if the score is confirmed at 137.76, the next
      single-variable test is ki 0.1, judged on total score and on s-bend and slalom
      progress, not on max_error. If bend progress remains the main loss, test a sensor
      footprint change only if it has a stated mechanism for lateral margin. Base_speed
      2.0 is not tested because of wheel-command saturation.


      - [Open this output](iteration-8/entity2/versions/bf93f4914c53459cba98229177818fab/payload.json)

      - Based on: [entity1](iteration-8/entity1/versions/3bc0b5279e2345a4bd6d8d9a6a518fb8/payload.json),
      [entityC2](iteration-8/entityC2/versions/95e3d11eab374b0c96c2bb2c307a0171/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-5ce958fa69469ec7/payload.json)'
