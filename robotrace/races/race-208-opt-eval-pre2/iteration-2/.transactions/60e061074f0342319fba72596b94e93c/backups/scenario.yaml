  id: race-208-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Draft Design
    notes: 'Draft Design. The model did not supply a valid label and summary, so the
      orchestrator wrote this one.


      ### Rationale


      Evidence: all 60 development trials ended off track, with progress 0.11 to 0.18
      (about 0.5 to 0.8 m of a 4 to 5 m course). Max error reached about 0.06 m in
      every trial, which is the off-track limit (max(0.06, 0.0125 + body_width/4)
      = 0.06 for any allowed body width). RMS error was about 0.02 to 0.03 m. Iteration
      1 (base 1.2, sensors at y=0.05, kp 2.0, kd 0.6) was not better than iteration
      0 (base 1.5, y=0.03, kp 2.5, kd 0.2): mean scores fell from 59.9 to 58.2, and
      progress on the s-bend and oval changed little. So the lower speed, the extra
      lead and the extra damping did not fix the problem. Line loss happened once
      per trial in iteration 0, which suggests the line leaves the sensor array at
      the edge of its span, not that the robot is too fast. The sensors span only
      x = -0.04 to +0.04. Once the tape centre is about 0.05 m off the centre line,
      the tape falls outside the array and the robot has to recover blind. Changes:
      (1) Widen the sensor span to x = -0.06 to +0.06 with 5 sensors, and enlarge
      the sensor footprint to 16 mm so the 25 mm tape is always covered by at least
      one sensor. (2) Keep the sensors at y=0.05, which the iteration-1 evidence did
      not show to hurt. (3) Raise kp from 2.0 to 3.0. The wider spacing lowers the
      signal gain per metre of offset (about 33 per m instead of 50 per m), so a higher
      kp keeps the steering authority similar. (4) Set kd to 0.4, between the two
      earlier values, to damp without over-filtering. (5) Set base_speed to 1.3, between
      the 1.2 and 1.5 that were tried, to keep average speed near the level needed
      to finish. Geometry is otherwise unchanged. Expected result: fewer or no line-loss
      events, max error held below 0.06 m, and progress rising above about 0.25 on
      the development tracks. Finishing within 3 s is still uncertain. The telemetry
      should show whether the wider span fixes the early drift.


      - [Open this output](iteration-2/entity0/versions/c64928a957334090b0b5c8e6e3321465/payload.json)

      - Based on: [entityR2A](iteration-2/entityR2A/versions/carried-4cc5a9276c1927cc/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Round-1 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-2/entityC1/versions/0845c6aa1c9c4bd58de38c61a3512810/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/c64928a957334090b0b5c8e6e3321465/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-4cc5a9276c1927cc/payload.json)'
  - id: entity1
    label: Wider sensor array v2
    notes: 'Widens the sensor row to ±0.06 m so the line stays in view past the 0.06
      m off-track limit, and keeps the previous lead, speed and ki. kd rises to 0.4
      as a moderate damping compromise. Based on the 60 development trials, where
      every run failed at the sensor-coverage edge with low rms error.


      ### Rationale


      Evidence: the previous race (iteration 0: base_speed 1.8, sensors at y 0.06
      with x spanning ±0.04, 16 mm footprints, kp 2.5, kd 0.2, ki 0.3) ended off track
      on all 60 trials, with progress 0.11 to 0.17 and one line-loss event each. Speed
      was not the limit, because a faster robot failed earlier than the 1.5 m/s design
      in the draft would be expected to. The max_error of about 0.06 m matches the
      sensor coverage edge: with x reaching only ±0.04 (plus 0.008 half-footprint,
      so about ±0.048), the tape at roughly 0.06 m offset is seen by no sensor. Once
      the tape leaves the array, the robot has no signal and drifts off. Low rms_error
      (0.02 to 0.03) shows the controller tracks well until that edge is reached.
      The discrete failure is therefore the narrow sensor array, not a lack of tracking
      gain.


      Accepted from the critique: (1) the draft''s base_speed 1.2 risks the 3 s completion,
      so I keep speed at 1.5 rather than 1.2. This is a compromise: it is above the
      minimum needed, and the critique''s warning about speed headroom is noted. (2)
      Keep the sensor lead at y 0.06, not 0.05, since more look-ahead helps bends.
      (3) Keep ki 0.3 for the constant motor-mismatch bias, within the +/-2 integral
      clamp. (4) Raise kd from 0.2 to 0.4, a moderate damping increase, not the draft''s
      0.6, to limit derivative noise amplification.


      Rejected from the draft: its sensor x span of ±0.04 with 12 mm footprints, which
      is the cause of the edge loss. Changes: x positions widened to -0.06, -0.03,
      0, 0.03, 0.06 so the array covers offsets to about ±0.07 m, beyond the 0.06
      m off-track limit. Footprint 16 mm, so the 20 mm to 30 mm gaps are still covered
      by the 25 mm tape: at a 15 mm offset the centre sensors read about 0.34 each,
      so the sum stays above the 0.05 line-loss threshold. Weights stay [-2,-1,0,1,2]
      for a monotonic, sign-correct signal. kp 2.5 is kept because the larger edge
      signal (±2) already gives strong correction, about 1750 PWM counts at full deflection.


      Expected result: the robot should no longer lose the line at the array edge,
      so progress rises to near 1, with line_loss_events near 0 to 1 and completion_time
      near 2.8 to 3.0 s. If the race still ends off track with a single line-loss
      event at the same point, the next change should be kp (higher) or base_speed
      (lower), not geometry. If completion_time exceeds 3 s with no line loss, raise
      base_speed. The race isolates the sensor-width change, because speed, kp and
      ki are unchanged from iteration 0 except kd.


      - [Open this output](iteration-1/entity1/versions/b9b7e2d6b3e1469a9cf9c7176ad5fe3f/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/e74cb8b399f6406aa2c9429ed3e72b4d/payload.json),
      [entityC1](iteration-1/entityC1/versions/133acd9cf77b49449e3cb581b6a58bb7/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-5d3c565a62081404/payload.json)'
