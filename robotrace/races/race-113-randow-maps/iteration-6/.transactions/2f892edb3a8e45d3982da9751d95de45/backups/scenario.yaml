overrides:
  entities:
  - id: entity0
    label: Lighter, shorter yaw test
    notes: 'Reverts the sensor footprint to 12 mm, which scored best (449 at iteration
      3), and cuts yaw inertia by about half (body_length 0.12 m, mass 0.6 kg) to
      test whether a faster heading response clears the s-bend floor. The 16 mm test
      (score 392) improved slalom line losses but dropped oval finishes to 16 of 20.


      ### Rationale


      Iteration 4 (score 392, down from 449) tested sensor_size 0.016 on the iteration
      3 design. It did not help overall. The slalom recovered from 1.85 to 1.2 line
      losses, which is close to the 1.0 target, but slalom progress fell to 0.12 and
      the oval dropped from 20 of 20 finishes to 16 of 20, with 4 off-track ends.
      The s-bend was unchanged at 1.05 line losses, with max_error at the 0.06 m floor
      and 2 of 20 finishes. Oscillation stayed under the 0.35 threshold on every track
      (oval 0.26, s-bend 0.29), so the blurred edge signal did not produce jitter.
      The larger footprint trades oval reliability for slalom line retention, and
      the net score fell. I therefore revert sensor_size to 0.012, which gives the
      best measured score (449 at iteration 3).


      The s-bend is still limited at the 0.06 m floor with 1.0 line losses under both
      footprints. Narrowing wheel_track from 0.10 to 0.09 raised s-bend progress (0.64
      to 0.68), so turn authority is still part of the limit. Narrowing further to
      0.085 would likely worsen the slalom, which already lost 1.85 times per run
      at 0.09. I want a different lever that makes the robot turn more readily without
      narrowing the track. Yaw inertia is mass*(body_length^2 + body_width^2)/12.
      The current value is about 0.0027 kg·m². Shortening body_length from 0.16 to
      0.12 m and reducing mass from 0.8 to 0.6 kg cuts it to about 0.0014 kg·m², roughly
      halved. A lower yaw inertia should let the wheel difference change heading faster,
      which helps the alternating bends of the s-bend and slalom. Body length has
      no effect on the off-track limit, which stays at 0.06 m. The lower mass also
      helps the 1.5 m/s pace needed to finish in 3 s.


      The change is: body_length 0.16 to 0.12, mass 0.8 to 0.6, sensor_size back to
      0.012, sensor y held at 0.07 and x unchanged, wheel_track 0.09, wheel_radius
      0.03. Expected result: s-bend line_loss_events below 1.0, s-bend progress above
      0.68, slalom line losses back toward 1.0, and the oval still finishing about
      20 of 20. Risk: a lighter, shorter robot may oscillate more on the oval and
      may slip more under acceleration, so I will watch steering_oscillation (threshold
      about 0.35) and oval finish rate.


      - [Open this output](iteration-5/entity0/versions/76ce67327da3408e9af5639c2a75691b/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-633baffe45bbd72c/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-ef2dfca4c6b6e9e3/payload.json)'
  - id: entity1
    label: Lighter, shorter body
    notes: 'Accepts the Builder''s inertia change (body_length 0.12, mass 0.6) on
      the iteration 3 layout, with the controller held fixed to isolate the effect.
      Iteration 3 (449) is the reference, and iteration 4 showed the 16 mm footprint
      lowers the score.


      ### Rationale


      The Builder''s proposal changes only inertia: body_length 0.16 to 0.12 and mass
      0.8 to 0.6, with sensor_size back at 0.012, sensors at y 0.07, wheel_track 0.09
      and wheel_radius 0.03. Iteration 3 is the best raced design (448.7) and has
      the same sensors, track and footprint, so it is the right reference. Its controller
      (kp 2.8, ki 0.05, kd 0.5, base_speed 1.5, last_direction) worked on the oval
      (20 of 20, max_error 0.025) and left the s-bend at 1.0 line losses with max_error
      at the 0.06 floor. Iteration 4 showed that the 16 mm footprint lowers the score,
      so it is not used. I accept the geometry as proposed. Yaw inertia falls from
      about 0.0027 to about 0.0014 kg m^2, so the same wheel difference should turn
      the robot faster. That could also raise oscillation, which was 0.32 on the s-bend
      in iteration 3. For that reason I keep the iteration 3 controller unchanged.
      Changing only the inertia means any change in the outcome can be attributed
      to it. The 0.6 kg mass also lowers the load, so base_speed 1.5 should still
      finish the oval in under 3 s. Expected, not measured: s-bend line losses below
      1.0 and progress above 0.68, with steering_oscillation under about 0.35. Risk:
      a lighter, shorter body may oscillate more on the oval and slip more under acceleration,
      so steering_oscillation and oval finish rate must be checked.


      - [Open this output](iteration-5/entity1/versions/fa47aa47b2ab46f6ac94fe183eeff42e/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/76ce67327da3408e9af5639c2a75691b/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-ef2dfca4c6b6e9e3/payload.json)'
  - id: entityR1
    label: Inertia next-step guide
    notes: 'Feedback on the inertia step, tied to iteration 3 (best, 449) and iteration
      4 (footprint, 392). It gives next-race branches for oscillation and s-bend limits,
      and states no outcome for this candidate.


      ### Feedback


      Written before this candidate has raced. Iteration 3 (score 449) is the best
      measured design: sensors at y 0.07, wheel_track 0.09, 12 mm footprint. It gave
      the oval 20 of 20 finishes with max_error 0.025 and oscillation 0.21. Its s-bend
      reached progress 0.68 with 1.0 line losses, max_error at the 0.06 floor and
      oscillation 0.32. Iteration 4 (score 392) showed that the 16 mm footprint restores
      slalom line retention (1.85 to 1.2 losses) but costs oval finishes (16 of 20)
      and lowers slalom progress, so the 12 mm footprint stays. Your yaw-inertia change
      is a sound way to add turn response without narrowing the track again. Iteration
      3 showed that narrowing to 0.09 raised s-bend progress, but the s-bend still
      hit the floor, so the rotational response is the next thing to test. Read the
      next race as follows. If s-bend line_loss_events fall below 1.0 and steering_oscillation
      stays under about 0.35 on the oval and s-bend, keep body_length 0.12 and mass
      0.6 and move on to a lower-inertia step. If oscillation rises above about 0.35
      on any track, the faster yaw response is causing jitter, so restore the body
      length first, since that keeps the mass benefit. If the s-bend stays at 1.0
      losses with max_error at the floor and oscillation is low, the limit is turn
      authority, not inertia, and the next change should come from the controller.


      ### Requested changes


      - If the s-bend improves (line_loss_events below 1.0, progress above 0.68) and
      steering_oscillation stays under about 0.35 on all tracks, try body_length 0.10
      with mass 0.6, since iteration 3 showed the s-bend at 0.68 progress and this
      step lowers yaw inertia further without changing the sensor layout.

      - If steering_oscillation rises above about 0.35 on the oval or s-bend, restore
      body_length to 0.16 and keep mass 0.6, since iteration 3 gave s-bend oscillation
      0.32 and oval 0.21 at the higher inertia, and the mass change alone should not
      add jitter.

      - If the s-bend stays at 1.0 line losses with max_error at the 0.06 floor despite
      the lower inertia, keep the geometry fixed at body_length 0.12, mass 0.6, sensor_size
      0.012, and test a controller change (raise kd from 0.5 to 0.6, or lower kp to
      2.5) rather than more geometry, since iteration 2 to 3 showed the s-bend is
      at its geometric limit.


      - [Open this output](iteration-5/entityR1/versions/fa47aa47b2ab46f6ac94fe183eeff42e/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/76ce67327da3408e9af5639c2a75691b/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-ef2dfca4c6b6e9e3/payload.json)'
