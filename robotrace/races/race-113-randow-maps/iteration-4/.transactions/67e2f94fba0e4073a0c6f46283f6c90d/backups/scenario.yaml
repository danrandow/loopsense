map:
  id: race-113-randow-maps
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: 16 mm sensors, 0.09 track
    notes: 'Keeps wheel_track 0.09 and y 0.07 from iteration 3 and changes only sensor_size
      to 0.016. This follows the Integrator''s triggers: slalom line losses rose to
      1.85, and the s-bend stayed at 1.0 losses with max_error at the 0.06 floor.
      Iteration 3 (score 448.7) showed the oval at 20 of 20 and oscillation 0.32,
      which leaves room for the change.


      ### Rationale


      Iteration 3 (score 448.7, up from 433) narrowed wheel_track from 0.10 to 0.09
      m with sensors at y 0.07. The oval still finished 20 of 20 with max_error 0.025
      and oscillation 0.21, so the narrower track did not add lag or jitter there.
      The s-bend improved slightly: 2 of 20 finishes, progress 0.68 (from 0.64), and
      line_loss_events 1.0 (from 1.05). Oscillation was 0.32, under the 0.35 threshold,
      so the track change is not too aggressive. However, max_error still sits at
      the 0.06 m off-track floor (0.0607) and the s-bend is still losing the line
      about once per run. The slalom got worse: line losses rose from 1.0 to 1.85
      per run and progress was 0.17, with no finishes. The Integrator''s rules give
      two triggers. The s-bend rule says that if line losses stay at 1.0 with max_error
      at the floor and low oscillation, test sensor_size 0.016 with the same x positions
      and y 0.07. The slalom rule says that if slalom losses rise again, the 12 mm
      footprint is too narrow and the 16 mm footprint should be tested. Both triggers
      apply. I therefore change only sensor_size, from 0.012 to 0.016 m. I keep wheel_track
      at 0.09 m, because the s-bend rule for changing track was not met and changing
      two things at once would hide the cause. The 16 mm footprints at 15 mm pitch
      still leave the outer sensors blank on a centred line, so the antisymmetric
      weights remain valid. Expected result: slalom line losses fall back toward 1.0
      or below, s-bend line losses fall below 1.0, and s-bend max_error drops below
      the 0.06 floor on some seeds. Risk: the larger footprint blurs the edge signal,
      so the s-bend may not improve and the oval may show more oscillation. The next
      race must report line losses, max_error and oscillation for each track to test
      this.


      - [Open this output](iteration-4/entity0/versions/6d77a93e651c4834b4647a11e33c4481/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-c69a88df883028df/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-9752fd0d4ad6bfd0/payload.json)'
  - id: entity1
    label: 16 mm sensor footprint
    notes: 'Changes only sensor_size from 0.012 to 0.016 on the iteration 3 geometry,
      with the controller held fixed to isolate the effect. Based on iteration 3''s
      slalom line losses rising to 1.85 and s-bend max_error at the 0.06 floor.


      ### Rationale


      Iteration 3 (score 448.7) is the best raced design. Its oval finishes 20 of
      20 with max_error 0.025, and the s-bend still goes off track in 18 of 20 trials
      at progress 0.68, with line_loss_events 1.0, max_error at the 0.06 m floor (0.0607)
      and steering_oscillation 0.32. Slalom line losses are 1.85 with progress 0.17,
      up from 1.0 at iteration 2, so the 12 mm footprint is too narrow for the alternating
      bends. The Builder''s proposal changes only sensor_size from 0.012 to 0.016,
      which is the lever the slalom and s-bend triggers pointed to. I accept that
      geometry unchanged. At 15 mm pitch on a 25 mm tape with a centred line, the
      readings should be about [0, 0.34, 1, 0.34, 0]. The weights stay antisymmetric
      and give a zero signal when centred, and the outer sensors still see nothing
      until the robot is well off centre. Because the Builder asked to isolate the
      footprint, I keep the iteration 3 controller exactly (kp 2.8, ki 0.05, kd 0.5,
      base_speed 1.5, last_direction). That keeps the cause of any change attributable
      to sensor_size alone. The main risk is that the blurrier edge signal lowers
      the signal slope and adds lag or jitter on the s-bend. The observation request
      covers per-track line losses, max_error and oscillation so that case can be
      seen. Expected, not measured: slalom line losses back near 1.0, s-bend line
      losses below 1.0 and s-bend max_error below 0.06 on some seeds, with the oval
      still at 20 of 20.


      - [Open this output](iteration-4/entity1/versions/5eef03044d35459b9f114602489a4b03/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/6d77a93e651c4834b4647a11e33c4481/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-9752fd0d4ad6bfd0/payload.json)'
  - id: entityR1
    label: Footprint test feedback
    notes: 'Pre-race feedback: if slalom losses recover with the 16 mm footprint,
      keep it and try a narrower track; if oscillation rises, return to 12 mm. Each
      trigger cites iteration 2 and iteration 3 evidence.


      ### Feedback


      Written before this candidate has raced. Iteration 2 (score 433) and iteration
      3 (score 449) show that the oval is now solved (20 of 20 finishes, max_error
      about 0.025) and that the s-bend is limited by line loss at the 0.06 m floor,
      not by jitter (oscillation 0.30 to 0.32). Iteration 3 narrowed wheel_track to
      0.09 and raised the s-bend progress to 0.68, but slalom line losses rose from
      1.0 (iteration 2) to 1.85, with progress 0.17. That pattern points to the 12
      mm footprint being too narrow to hold the line through alternating bends, so
      the 16 mm footprint is the right next test. Expected behaviour, not measured:
      the slalom should fall back toward 1.0 losses, and the s-bend may drop below
      1.0 losses. The footprint change also blurs the edge signal, so the s-bend may
      not improve and the oval may show more oscillation. Read the next race as follows.
      If slalom line_loss_events return to about 1.0 or below and s-bend max_error
      drops below 0.06 on some seeds, keep sensor_size 0.016. If the slalom recovers
      but the s-bend still sits at the floor with low oscillation, the geometry is
      near its limit and the next gain should come from the controller, not from more
      geometry. If steering_oscillation rises above about 0.35 on the s-bend or oval,
      the blurred edge signal is the likely cause, so return to 0.012 and try an intermediate
      track or pitch change instead.


      ### Requested changes


      - If the slalom line_loss_events return to about 1.0 or below and the s-bend
      stays at 1.0 losses with max_error at the 0.06 floor, keep sensor_size 0.016
      and try wheel_track 0.085 (within the 0.08 minimum) for more turn authority,
      since iteration 3 showed the s-bend at 0.68 progress on 0.09 m.

      - If steering_oscillation rises above about 0.35 on the s-bend or oval with
      sensor_size 0.016, return to sensor_size 0.012 and keep wheel_track 0.09, since
      iteration 3 gave oscillation 0.32 on the s-bend and 0.21 on the oval.

      - If slalom line losses stay near 1.85 with sensor_size 0.016, the footprint
      is not the cause, so test sensor y 0.075 with the same x positions, since iteration
      2 at y 0.07 gave slalom losses of 1.0 and oval finishes of 20 of 20.


      - [Open this output](iteration-4/entityR1/versions/5eef03044d35459b9f114602489a4b03/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/6d77a93e651c4834b4647a11e33c4481/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-9752fd0d4ad6bfd0/payload.json)'
