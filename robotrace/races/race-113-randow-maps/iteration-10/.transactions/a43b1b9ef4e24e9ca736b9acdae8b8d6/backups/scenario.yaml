map:
  id: race-113-randow-maps
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Hold best geometry (y
    notes: 'Keeps the iteration 8 best geometry unchanged (score 668, y 0.075, mass
      0.6, body 0.10, track 0.09) so the controller change is isolated. Based on the
      oval holding 20 of 20 with max_error 0.0165 and the s-bend holding 19 finishes,
      with the slalom still at 0 finishes and its max_error floor.


      ### Rationale


      Iteration 8 (score 667.95) is the best measured design: body_length 0.10, mass
      0.6, sensors at y 0.075, 12 mm footprint, 15 mm pitch, wheel_track 0.09. Against
      iteration 6 it kept the oval at 20 of 20 with max_error 0.0165 and lifted the
      slalom progress from 0.26 to 0.34, so the extra look-ahead is not adding lag
      on the oval. The s-bend held 19 of 20 finishes with progress 0.993, but line
      losses rose from 0.55 to 0.80 and oscillation was 0.32, which is under the 0.35
      limit. The slalom still has 0 finishes, max_error at the 0.065 floor and 1.1
      line losses per run. Iteration 7 showed mass 0.5 reverses the s-bend gain, so
      the inertia lever is at its useful limit. Wider track (0.095 or 0.10) would
      trade s-bend turn authority for slalom retention, but at this inertia the s-bend
      is already at 19 finishes and the slalom has not responded to track or look-ahead
      within a clear margin, so I do not gain evidence for that trade in this step.
      I therefore hold every geometric value at the iteration 8 best and change nothing.
      This lets the Integrator''s controller change be read on a fixed platform. Expected
      result: the oval and s-bend stay at or near iteration 8 levels, and any slalom
      gain comes from the controller. If the slalom remains at its max_error floor
      with 0 finishes after the controller change, the geometry has reached its limit
      for these tracks.


      - [Open this output](iteration-9/entity0/versions/198b55e9e0554bd28da25efe19d14ac6/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-d946e4dc6f11c8da/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-e0fb5689e841a412/payload.json)'
  - id: entity1
    label: Slower base speed 1.3
    notes: 'Holds the iteration 8 geometry fixed and lowers base_speed from 1.5 to
      1.3 to give the slalom more time to correct on alternating bends. Evidence:
      slalom at its max_error floor with 0 finishes and low oscillation (0.20) in
      iteration 8.


      ### Rationale


      Iteration 8 (score 667.95) is the best measured design: body_length 0.10, mass
      0.6, sensors at y 0.075, 12 mm footprint, wheel_track 0.09. The oval finished
      20 of 20 with max_error 0.0165 and oscillation 0.21. The s-bend finished 19
      of 20 with line losses 0.8 and oscillation 0.32, which is under the 0.35 limit.
      The slalom has 0 finishes, progress 0.34, 1.1 line losses per run and max_error
      at the 0.065 floor, while its oscillation is low at 0.20. Low oscillation with
      high line loss means the robot is late on alternating bends, not jittering.
      Iterations 5 to 7 showed the slalom ignores yaw inertia, and iteration 4 showed
      a larger footprint trades oval reliability for slalom retention. Geometry therefore
      stays at the iteration 8 values, so the only variable is the controller. I lower
      base_speed from 1.5 to 1.3. Less forward speed gives the steering loop more
      time to correct on the alternating slalom bends, and the signal is unchanged.
      Oval time was 1.72 s at 1.5, so at 1.3 it should be about 2.0 s, well inside
      the 3 s limit. Gains kp 2.8, ki 0.05, kd 0.5, weights and last_direction are
      unchanged. Expected, not measured: slalom progress above 0.34 and line losses
      at or below 1.1, with the s-bend still at 19 or more finishes and the oval still
      at 20 of 20. Risk: if the s-bend falls below 19 finishes, the speed cut is costing
      time on the bends, so the next step should return to 1.5 and test kd.


      - [Open this output](iteration-9/entity1/versions/14a1340de1ae450eb3ecc7492f11644b/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/198b55e9e0554bd28da25efe19d14ac6/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-e0fb5689e841a412/payload.json)'
  - id: entityR1
    label: Speed then track width
    notes: 'Feedback written before the race: read the slalom and s-bend at base_speed
      1.3 first, then try y 0.08 or wheel_track 0.095 depending on the outcome. Evidence:
      iteration 8 (score 668) and the track-width trade in iterations 2 and 3.


      ### Feedback


      Written before this candidate has raced. Iteration 8 (score 668) is the best
      measured design. The oval held 20 of 20 at max_error 0.0165, and the s-bend
      reached 19 of 20 with line losses 0.8 and oscillation 0.32, under the 0.35 limit.
      The slalom still has 0 finishes, progress 0.34 and 1.1 line losses at the max_error
      floor, with oscillation only 0.20, so it is late on alternating bends. Iterations
      5 to 7 showed the slalom ignores yaw inertia, and iteration 4 showed a larger
      footprint costs oval reliability, so geometry is near its limit for the slalom.
      I hold every geometric value at iteration 8 and lower base_speed to 1.3, so
      the result reads as a speed effect. Read the next race as follows. If the slalom
      progress rises above 0.34 and its line losses fall to about 1.0 while the s-bend
      holds 19 or more finishes, the slowdown is helping, so keep the geometry fixed.
      If the s-bend drops below 19 finishes, speed is costing bend time, so return
      to base_speed 1.5 and consider a kd change instead. If the slalom stays at its
      max_error floor with 0 finishes, geometry and speed have both reached their
      limit, and the next move should be a track width trial.


      ### Requested changes


      - If the slalom progress rises above 0.34 at base_speed 1.3 with the s-bend
      still at 19 or more finishes, keep the iteration 8 geometry and try y 0.08 (within
      the 0.08 limit), since iteration 8 showed y 0.07 to 0.075 lifted slalom progress
      from 0.26 to 0.34 with the oval unchanged.

      - If the slalom is still at its max_error floor with 0 finishes at base_speed
      1.3, try wheel_track 0.095, since iteration 2 (track 0.10, y 0.07) gave slalom
      losses 1.0 while iteration 3 (track 0.09) gave 1.85, so the track trades s-bend
      progress against slalom retention.

      - If the s-bend falls below 19 finishes or its line losses rise above 0.8, the
      speed cut is costing bend time, so keep the geometry at iteration 8 and restore
      the controller to base_speed 1.5 (the iteration 8 result), since iteration 7
      showed mass changes reverse the s-bend gain and should not be retried.


      - [Open this output](iteration-9/entityR1/versions/14a1340de1ae450eb3ecc7492f11644b/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/198b55e9e0554bd28da25efe19d14ac6/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-e0fb5689e841a412/payload.json)'
