  entities:
  - id: entity0
    label: Baseline 5-sensor array
    notes: 'Symmetric five-sensor baseline, 12 mm footprints at 15 mm pitch, 40 mm
      look-ahead, 0.12 m track, 0.8 kg. No race data exists yet, so this sets a neutral
      reference that the Integrator''s feedback and the first race will test.


      ### Rationale


      Iteration 0 has no race data or integration feedback yet, so this is a neutral
      baseline meant to give the Integrator a clean platform to tune. Five sensors
      spread across the 25 mm tape at 15 mm pitch (x = -0.030 to +0.030 m) with 12
      mm footprints. Adjacent footprints overlap the tape edge, so the reading stays
      informative for a line offset of up to about ±0.03 m, and the outer sensors
      can see a sharp bend early. The sensors sit 0.04 m ahead of the axle, which
      gives roughly 0.04 m of look-ahead on a 1.5 m/s run, enough to react before
      the robot is off-line. Track width 0.12 m and wheel radius 0.03 m give a moderate
      turn authority without excessive yaw inertia. Body 0.16 m x 0.12 m is well inside
      the off-track limit, and mass 0.8 kg keeps acceleration reasonable for a 3 s
      finish. Expected result: a completing run on the development tracks with few
      line losses. The main unknown is whether 12 mm sensors at 15 mm pitch give enough
      resolution, which the Integrator''s feedback should show.


      - [Open this output](iteration-0/entity0/versions/ab59ab650aa044e397a6825350fd0dac/payload.json)'
