overrides:
  entities:
  - id: entity0
    label: Longer look-ahead, track
    notes: 'Moves all sensors from 0.04 m to 0.06 m ahead of the axle and narrows
      wheel track from 0.12 m to 0.10 m, to test whether the baseline''s late reaction
      on the s-bend and slalom (progress 0.26 and 0.10, max error at the 0.06 m off-track
      floor) can be fixed by geometry. Based on the baseline race telemetry and the
      Integrator''s prior rules.


      ### Rationale


      The baseline (score 176) fails mainly by leaving the line. On the s-bend all
      20 trials went off track (progress 0.26) and on the slalom progress was 0.10.
      Max error sits at about 0.060 m, which is the off-track floor, so the robot
      reaches the edge of the allowed band rather than oscillating. Steering oscillation
      (0.21 to 0.32) and rms error (0.02 to 0.03 m) are low, so the controller is
      not jittering; it is reacting too late on bends. Line loss averages about 1
      event per run, which fits a loss on the sharpest bend. The 40 mm look-ahead
      is the most likely cause, as the Integrator predicted. Body width cannot help:
      the off-track limit is max(0.06, 0.0125 + body_width/4), which is 0.06 for every
      allowed body width, so I leave body width alone. Changes: (1) move all five
      sensors forward from y 0.04 to y 0.06 to lengthen look-ahead to about 0.06 m,
      keeping the x positions and the 12 mm footprint at 15 mm pitch, which the Integrator
      said must stay so the antisymmetric weights remain valid. (2) Narrow wheel_track
      from 0.12 to 0.10 m. For a given wheel PWM difference, turn rate is the wheel
      speed difference divided by track width, so this gives more turn authority for
      sharp bends. I keep wheel_radius, mass and body dimensions unchanged to limit
      the number of variables moved at once. Expected result: fewer line-loss events
      and lower max_error on the s-bend and slalom, with progress rising well above
      0.26 on the s-bend. Risk: the longer look-ahead may add lag on tight bends,
      and the narrower track may increase oscillation, so the next race must report
      both.


      - [Open this output](iteration-1/entity0/versions/7e4acbb417f0411c877c7ba418a219f8/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-faf5cc967e635e04/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-e002302bdaccf558/payload.json)'
  - id: entity1
    label: Complete Robot Package
    notes: 'Complete Robot Package. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      The Builder''s proposal moves all five sensors from y 0.04 to y 0.06 and narrows
      wheel_track from 0.12 to 0.10. The baseline (score 176) left the line on every
      s-bend and slalom trial with low oscillation (0.14 to 0.32) and low rms error,
      so the controller was reacting late rather than jittering. The longer look-ahead
      should help the sharp bends, but it adds sensing lag, so the controller needs
      slightly more damping. Narrowing the track multiplies turn rate per unit of
      wheel PWM difference by 0.12/0.10 = 1.2, which raises effective steering gain.
      To keep the effective gain near the baseline''s tuned value, I lower kp from
      3.0 to 2.5 (2.5 x 1.2 = 3.0 effective), then keep kp high enough to correct
      bends. The result is kp 2.5 with kd raised from 0.3 to 0.4 to damp the added
      lag. ki stays at 0.05 and base_speed at 1.5, which the oval finish times (mean
      1.87 s for the two finishers) support. Weights stay antisymmetric [-2, -1, 0,
      1, 2], which is valid for the unchanged 12 mm footprint at 15 mm pitch. Line
      loss stays last_direction, so the robot keeps turning the way it was going when
      the tape leaves the sensors on a bend. Expected result, not measured: fewer
      line-loss events and lower max_error on the s-bend and slalom, with steering_oscillation
      not rising sharply. The observation request covers the metrics needed to test
      that.


      - [Open this output](iteration-1/entity1/versions/c33b4f91ad224d5988a0f9c483a5f1cb/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/7e4acbb417f0411c877c7ba418a219f8/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-e002302bdaccf558/payload.json)'
  - id: entityR1
    label: Integration Feedback
    notes: 'Integration Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Written before this candidate has raced. Evidence from iteration 0 (score 176):
      on the s-bend all 20 trials went off track at progress 0.26, and on the slalom
      at progress 0.10, with about 1 line-loss event per run. Max error sat at the
      0.060 m off-track floor while rms error (0.02 to 0.03 m) and steering_oscillation
      (0.14 to 0.32) stayed low, so the robot was reacting late, not jittering. The
      40 mm look-ahead is the likely cause, so moving the sensors to y 0.06 is a sound
      first change. Narrowing wheel_track to 0.10 m raises turn rate per unit of wheel
      difference by 1.2x, which can add turn authority but also raises steering gain
      and oscillation risk. The Integrator therefore reduced kp to 2.5 and raised
      kd to 0.4 in the controller to compensate; this is a design choice, not a measured
      result. If the next race shows line_loss_events still near 1 on the s-bend with
      max_error at the floor, move the sensors further ahead to y 0.07 (within the
      0.08 limit) while keeping x positions and the 12 mm footprint. If steering_oscillation
      rises well above the baseline range (about 0.35 or more) with the narrower track,
      try an intermediate wheel_track of 0.11 before going back to 0.12. If the robot
      now finishes the oval with low error, change speed (wheel_radius or base_speed)
      rather than geometry.


      ### Requested changes


      - If the next race still shows about 1 line-loss event per run on the s-bend
      with max_error at the 0.06 m floor, move all five sensors to y 0.07 (keeping
      x positions and sensor_size 0.012), since iteration 0 showed the 0.04 m look-ahead
      lost the line on every s-bend trial.

      - If steering_oscillation rises well above the baseline range (about 0.35 or
      more) on the oval or s-bend, set wheel_track to 0.11 as a middle value, since
      the narrower 0.10 m track raises turn-rate gain by 1.2x and the baseline oscillation
      was low (0.14 to 0.32).

      - If the robot finishes the oval with low rms error but completion_time is still
      above 3 s (the baseline oval finishers averaged 1.87 s, so this is unlikely),
      change wheel_radius to 0.035 for more ground speed rather than changing the
      sensor layout.


      - [Open this output](iteration-1/entityR1/versions/c33b4f91ad224d5988a0f9c483a5f1cb/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/7e4acbb417f0411c877c7ba418a219f8/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-e002302bdaccf558/payload.json)'
