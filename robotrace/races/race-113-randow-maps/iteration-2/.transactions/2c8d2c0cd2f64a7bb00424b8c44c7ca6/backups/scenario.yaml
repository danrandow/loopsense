map:
  id: race-113-randow-maps
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Sensors to y 0.07 ahead
    notes: 'Moves all five sensors from y 0.06 to 0.07 (the Integrator''s stated next
      step) while keeping x positions, 12 mm footprint and wheel_track 0.10. Iteration
      1 showed the s-bend still losing the line on every trial at the 0.06 m off-track
      floor, and steering oscillation stayed low, so the change is look-ahead, not
      jitter.


      ### Rationale


      Iteration 1 (score 389.4) moved the sensors from y 0.04 to y 0.06 and narrowed
      wheel_track from 0.12 to 0.10. The oval improved to 19 of 20 finishes, with
      mean score 919 and mean rms error 0.015. The s-bend and slalom still fail. On
      the s-bend, all 20 trials went off track at progress 0.43, max_error sits at
      the 0.0624 m floor (the off-track limit is max(0.06, 0.0125 + body_width/4)
      = 0.06 m), and line_loss_events is still 1.0 per run. That matches the Integrator''s
      stated trigger for the next step: line loss still near 1 on the s-bend with
      max_error at the floor. The Integrator''s advice is to move the sensors to y
      0.07, the maximum inside the 0.08 limit. I follow that. Steering oscillation
      (0.23 on the s-bend, 0.23 on the slalom, 0.27 on the oval) is well inside the
      baseline range, so the narrow track is not causing jitter and I keep wheel_track
      at 0.10 rather than moving to 0.11. Sensor x positions, the 12 mm footprint
      and the 15 mm pitch stay the same, because the antisymmetric weights depend
      on that layout. Body, wheel radius and mass are unchanged, so the only geometric
      change is look-ahead. Expected result: s-bend line_loss_events falls below 1
      and progress rises above 0.43, with max_error below the 0.06 floor on some seeds.
      The slalom has 1.75 line losses, and a longer look-ahead should help its alternating
      bends. Risk: the extra look-ahead adds lag on tight bends, which would show
      as higher max_error with low oscillation. The next race must report line losses
      and max_error per track so that case can be identified.


      - [Open this output](iteration-2/entity0/versions/ae19f4e0fe10473684a5500c1007c707/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-c2cf69d143179543/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-e4344c8fe05b1ff3/payload.json)'
  - id: entity1
    label: Y0.07 look-ahead, kp 2.8
    notes: 'Accepts the Builder''s y 0.07 sensors with wheel_track 0.10, and raises
      kp to 2.8 and kd to 0.45 for s-bend turn authority. Based on iteration 1, where
      the s-bend lost the line on every trial at max_error 0.06 with oscillation 0.23.


      ### Rationale


      Iteration 1 (score 389.4) raised the oval to 19 of 20 finishes with mean rms
      0.015, so the 0.06 m look-ahead and 0.10 m track work for the oval. The s-bend
      still left the line on all 20 trials, with progress 0.43, max_error at the 0.0624
      m floor, and 1.0 line loss per run. Steering oscillation stayed low on every
      track (0.23, 0.23, 0.27), so the failure is late reaction, not jitter. The slalom
      still lost the line 1.75 times per run with progress 0.18. The Builder''s proposal
      moves the sensors to y 0.07, which is within the 0.08 limit, and keeps wheel_track
      at 0.10, so I accept the geometry as proposed. Because the longer look-ahead
      adds sensing lag, I raise kp from 2.5 to 2.8 to add turn authority on the s-bend.
      The narrow track already gives 1.2x turn rate per unit of wheel difference,
      and oscillation is low enough to absorb a modest gain increase. I raise kd from
      0.4 to 0.45 to damp the extra lag. ki stays at 0.05, base_speed stays at 1.5
      (the oval finished in 1.91 s, so there is time margin), and line_loss stays
      last_direction, since the robot should keep turning the way it was going when
      the tape leaves the sensors. Expected result, not measured: s-bend line_loss_events
      below 1.0 and progress above 0.43, with the slalom loss count falling from 1.75.
      The risk is that the higher kp or the longer look-ahead overshoots on the oval,
      which would show as a rise in oval max_error with the finish rate falling below
      0.9. The observation request asks for per-track max_error and line losses so
      both cases can be told apart.


      - [Open this output](iteration-2/entity1/versions/a63b4b1f1e094fdb8513523cc9e4a195/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/ae19f4e0fe10473684a5500c1007c707/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-e4344c8fe05b1ff3/payload.json)'
  - id: entityR1
    label: Track and footprint
    notes: 'Next-step options depend on the s-bend and oval results: narrow the track
      if turn authority is the limit, hold y if oval finishes fall, or enlarge the
      footprint if slalom losses persist. Evidence is iteration 0 and 1 race data.


      ### Feedback


      Written before this candidate has raced. Iteration 0 (score 176) left the line
      on every s-bend and slalom trial with max_error at the 0.06 m floor and low
      oscillation (0.14 to 0.32), so the robot was reacting late, not jittering. Iteration
      1 (score 389) moved the sensors to y 0.06 and narrowed the track to 0.10 m.
      That fixed the oval (19 of 20 finishes) but left the s-bend at 1.0 line loss
      per run with progress 0.43, and the slalom at 1.75 losses. Oscillation stayed
      low on every track (0.23 to 0.27), so there is no sign of jitter. For this candidate
      the Integrator raises kp to 2.8 to add turn authority, so please read any s-bend
      result as the joint effect of geometry and that gain. If the next race shows
      s-bend line_loss_events still at or near 1.0 with max_error at the 0.06 floor,
      the limit is turn authority rather than look-ahead. In that case try a narrower
      track, since oscillation has headroom. If the oval finish rate falls below about
      0.9 or oval max_error rises above 0.05, the look-ahead has gone far enough,
      so keep y at 0.07 or step back toward 0.06 rather than pushing further forward.
      If the slalom still loses the line about 1.75 times per run, the 12 mm footprint
      may be too narrow to hold the line on alternating bends, so test a larger footprint.


      ### Requested changes


      - If s-bend line_loss_events stay near 1.0 with max_error at the 0.06 m floor
      and steering_oscillation is below about 0.3, set wheel_track to 0.09 (min 0.08)
      for more turn authority, since iteration 1 gave oscillation 0.23 on the s-bend
      at 0.10 m.

      - If oval finish rate falls below about 0.9 or oval max_error rises above 0.05
      (iteration 1 gave 19 of 20 finishes and max_error 0.035), keep sensor y at 0.06
      or 0.065 rather than 0.07, because the extra look-ahead is adding lag.

      - If slalom line_loss_events remain near 1.75 (iteration 1), change sensor_size
      from 0.012 to 0.016 with the same x positions, so the footprint overlaps more
      and keeps the line in view through alternating bends.


      - [Open this output](iteration-2/entityR1/versions/a63b4b1f1e094fdb8513523cc9e4a195/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/ae19f4e0fe10473684a5500c1007c707/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-e4344c8fe05b1ff3/payload.json)'
