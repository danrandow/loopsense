overrides:
  entities:
  - id: entity0
    label: Mass 0.5 kg, body 0.10 m
    notes: 'Lowers mass from 0.6 to 0.5 kg with body length held at 0.10 m, cutting
      yaw inertia about 17 percent further. Iteration 6 (score 658) gave s-bend 19
      of 20 finishes and oval 20 of 20, with s-bend oscillation 0.33 under the 0.35
      limit, so the inertia step is still safe to test.


      ### Rationale


      Iteration 6 (score 657.9, the best so far) kept the 12 mm footprint, y 0.07
      layout and wheel_track 0.09, and shortened body_length to 0.10 m at mass 0.6
      kg. The s-bend now finishes 19 of 20 (progress 0.996, line losses 0.55, oscillation
      0.33), and the oval stays at 20 of 20 with max_error 0.017 and oscillation 0.22.
      The slalom is unchanged at 0 of 20 finishes, progress 0.26, max_error at the
      0.063 floor and oscillation 0.16. Both the s-bend and the oval are well inside
      the feedback''s stated thresholds: s-bend oscillation is 0.33 against a 0.35
      limit, so the lower-inertia step is still safe. Following the Integrator''s
      rule, I try mass 0.5 kg with body_length 0.10 m, the next step down in yaw inertia.
      Body length is already at its 0.10 m minimum, so mass is the only lever left
      on inertia. Yaw inertia falls from about 0.00122 to about 0.00102 kg·m², roughly
      17 percent. Sensor layout, 12 mm footprint, wheel_track 0.09, wheel_radius 0.03
      and body_width 0.12 stay fixed, so this race isolates mass. Expected result:
      s-bend finishes at 19 or 20 of 20 with line losses at or below 0.55, and oval
      finishes stay at 20 of 20. The slalom is probably still limited by turn authority
      on alternating bends, since it has not responded to inertia changes so far.
      Risk: oscillation on the s-bend is close to 0.35, so a rise above that is the
      cue to restore mass to 0.6 and move on to controller work.


      - [Open this output](iteration-7/entity0/versions/0b30ccacc9a040d7ade182c098ea3856/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-3365dabed10b3463/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-36ed35d75e0b1f4c/payload.json)'
  - id: entity1
    label: Mass 0.5 kg, body 0.10 m
    notes: 'Keeps the iteration 6 controller and changes only mass (0.6 to 0.5 kg)
      at the 0.10 m body minimum, which cuts yaw inertia about 17 percent. Iteration
      6 (score 657.9) showed the s-bend at 19 of 20 with oscillation 0.33, so the
      0.35 limit is the restore trigger.


      ### Rationale


      Iteration 6 (score 657.9, the best raced design) shows that body_length 0.10
      at mass 0.6 lifted the s-bend to 19 of 20 finishes, with line losses 0.55 and
      oscillation 0.33. The oval held 20 of 20 with max_error 0.017. The slalom is
      still at 0 of 20 finishes, with progress 0.26 and max_error at the 0.063 floor.
      It has not responded to any inertia change across iterations 5 and 6. The Builder''s
      proposal lowers mass from 0.6 to 0.5 kg with body_length held at 0.10 m, which
      cuts yaw inertia by about 17 percent (about 0.00122 to 0.00102 kg m^2). I accept
      the geometry as proposed, with every other value unchanged. For the controller
      I keep the iteration 6 gains exactly (kp 2.8, ki 0.05, kd 0.5, base_speed 1.5,
      antisymmetric weights, last_direction), so any change in the race can be attributed
      to mass. The main risk is that s-bend steering_oscillation (0.33 at iteration
      6, limit about 0.35) rises above the limit. If it does, the Builder''s rule
      is to restore mass to 0.6 kg. Expected, not measured: s-bend finishes at 19
      or 20 of 20 with line losses at or below 0.55, and the oval stays at 20 of 20.


      - [Open this output](iteration-7/entity1/versions/eb948c6da28f4b288837adcb7e5f9420/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/0b30ccacc9a040d7ade182c098ea3856/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-36ed35d75e0b1f4c/payload.json)'
  - id: entityR1
    label: Mass step and slalom
    notes: 'Feedback written before the race: restore mass to 0.6 if s-bend oscillation
      exceeds 0.35. If the s-bend holds, test sensor y 0.075 for the slalom, or wheel_track
      0.095 as a compromise. Evidence is iterations 2, 3, 5 and 6.


      ### Feedback


      Written before this candidate has raced. Iteration 6 (score 657.9) is the best
      measured result. Shortening body_length from 0.12 to 0.10 m at mass 0.6 kg moved
      the s-bend from 13 to 19 finishes, with line losses 0.55 and oscillation 0.33.
      The oval stayed at 20 of 20 with max_error 0.017 and oscillation 0.22. Iteration
      5 showed the same pattern for the step before it (s-bend 2 to 13 finishes).
      So far the s-bend has responded to yaw inertia, and the oval has not been hurt.
      The slalom has not responded to any inertia change (0 of 20 finishes in iterations
      5 and 6, progress about 0.23 to 0.26), which suggests its limit is separate
      from inertia. Read the next race as follows. If the s-bend reaches 19 or 20
      finishes with line losses at or below 0.55 and oscillation stays under about
      0.35 on the oval and s-bend, the mass step is working, and the next move is
      to test the controller or the slalom footprint. If s-bend steering_oscillation
      rises above about 0.35, restore mass to 0.6 kg, because body_length is already
      at its minimum and the inertia limit has been reached. If the slalom still shows
      0 finishes with max_error at the floor, geometry alone is unlikely to fix it
      on this controller.


      ### Requested changes


      - Keep body_length 0.10 and try mass 0.5 kg as proposed. If steering_oscillation
      on the s-bend or oval rises above about 0.35, restore mass to 0.6 kg, since
      iteration 6 gave s-bend oscillation 0.33 at mass 0.6 and the body length cannot
      go lower.

      - If the s-bend holds at 19 or more of 20 finishes and the slalom still has
      0 finishes, try sensor y 0.075 with the same x positions, sensor_size 0.012
      and wheel_track 0.09. Iteration 2 (y 0.07, wheel_track 0.10) gave slalom losses
      of 1.0, which is the best slalom result so far, and the oval has margin (max_error
      0.017 at iteration 6).

      - If the slalom line losses stay near 1.85 (as at iteration 3, wheel_track 0.09)
      while the s-bend is at its limit, try wheel_track 0.095 as a compromise. Iteration
      2 (0.10) gave s-bend progress 0.64 and slalom losses 1.0, while iteration 3
      (0.09) gave s-bend progress 0.68 and slalom losses 1.85, so track width trades
      s-bend progress against slalom retention.


      - [Open this output](iteration-7/entityR1/versions/eb948c6da28f4b288837adcb7e5f9420/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/0b30ccacc9a040d7ade182c098ea3856/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-36ed35d75e0b1f4c/payload.json)'
