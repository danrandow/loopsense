  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: 'Final: hold 215-scoring'
    notes: 'Holds the iteration 8 and 9 geometry (wheel_track 0.09 m, five 12 mm sensors
      at y = 0.04 m, 0.6 kg), which scored 215.38 twice. Iteration 10 showed that
      kp 3.2 cut the score to 174.96 without moving oval oscillation, so the geometry
      is kept and the controller is not changed here.


      ### Rationale


      This is the final iteration, so this design races the held-back final track
      and nothing after it can correct it. The best-supported platform is the wheel_track
      0.09 m, five-sensor, 12 mm, y = 0.04 m, 0.6 kg geometry from iterations 8 and
      9, which scored 215.38 both times. Iteration 10 kept that geometry and changed
      only the controller to kp 3.2 with kd 0.5. It scored 174.96, and oval steering_oscillation
      stayed at 0.294, so kp 3.2 is the wrong direction and the cost falls on the
      controller, not the geometry. Every sensing change (iterations 1 to 3) lowered
      the score, and narrowing the track to 0.08 m adds about 12 percent more yaw
      gain per command, which the oscillation already shows is at its limit. A geometry
      gamble on the last race has no later iteration to recover from, so I hold the
      proven values unchanged. Expected result: a score near 215 on the development
      tracks with the Integrator''s controller. The Integrator should return to kp
      3.5 with kd 0.5, which scored 215.38 on this geometry, rather than kp 3.2.


      - [Open this output](iteration-11/entity0/versions/c42677831a5446a48336929a134d7a24/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-eedf31e118a8e55e/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-c0df5f8993ac648b/payload.json)'
  - id: entity1
    label: 'Final robot: 215 baseline'
    notes: 'Final package uses the iteration 8 and 9 geometry (215.38, reproduced
      twice) with kp 3.2 and kd 0.5. Kd 0.4 (174.96) and kp 3.5 (213.28) were measured
      lower, so the package keeps the best-measured controller.


      ### Rationale


      This is the final iteration, so the package must be the most reliable design
      I can justify. The Builder''s geometry is the one that raced in iterations 8
      and 9 and scored 215.38 both times: wheel_track 0.09 m, five 12 mm sensors at
      x = -0.024 to +0.024 m and y = 0.04 m, wheel radius 0.03 m, body 0.12 x 0.18
      m, mass 0.6 kg. I adopt it unchanged. The controller choice needs care. The
      outcome table shows the kd values by iteration. Iteration 9 (kp 3.2, kd 0.5)
      scored 215.38, the same as iteration 8, so the result is reproducible. Iteration
      7 (kp 3.5, kd 0.5) scored 213.28. Iteration 10 (kp 3.2, kd 0.4) fell to 174.96,
      so kd 0.5 is needed for the score and kd 0.4 is the wrong direction. The Builder''s
      feedback request cites kp 3.5 as the 215 baseline, which the data does not support:
      kp 3.5 gave 213.28. The best measured controller is therefore kp 3.2, kd 0.5,
      ki 0.2, base_speed 1.8, with the iteration 8 and 9 sensor weights [-2, -1, 0,
      1, 2] and line_loss last_direction. Oval steering_oscillation stays near 0.29
      at this setting, above the 0.25 caution level, but every kd reduction tested
      so far lowered the score more than oscillation was worth, so I accept that cost.
      No further race exists to test an alternative, so the design that has measured
      best on the development tracks is the safest choice for the unseen track. Expected
      result: a score near 215 on the development tracks, with the unseen-track result
      depending on how the held-back track''s curvature compares with the oval, s-bend
      and slalom.


      - [Open this output](iteration-11/entity1/versions/0f964185c7844a6bb98520f31169d287/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/c42677831a5446a48336929a134d7a24/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-c0df5f8993ac648b/payload.json)'
  - id: entityR1
    label: 'Final feedback: keep'
    notes: 'Feedback confirms the geometry is held and corrects the Builder''s kp
      baseline: kp 3.2 with kd 0.5 gave 215.38, not kp 3.5 (213.28). It also corrects
      the kd 0.4 result, which scored 174.96 in iteration 10.


      ### Feedback


      Written as the final integration note. The geometry is unchanged from iterations
      8 and 9 (215.38, reproduced), and I have used it in the final package. Your
      feedback request cites kp 3.5 with kd 0.5 as the 215 baseline, but the outcome
      table shows kp 3.5 with kd 0.5 gave 213.28 (iteration 7), while kp 3.2 with
      kd 0.5 gave 215.38 (iterations 8 and 9). The learning field also says kp 3.2
      at kd 0.5 gave 175, but that score belongs to iteration 10, which used kd 0.4.
      So the kd 0.5 setting is what holds the score, and kd 0.4 is the setting that
      lost about 40 points. Oval steering_oscillation at kd 0.5 stayed near 0.29 across
      kp 3.2 and 3.5, so kp did not change oscillation at this width; kd did. Sensing
      changes in iterations 1 to 3 all lowered the score, and s-bend max_error has
      stayed near 0.061 to 0.064 m across track widths 0.10 to 0.09 m, so further
      geometry changes were not supported by the evidence. No further race remains
      to test any geometry change.


      ### Requested changes


      - Keep the geometry exactly as in iterations 8 and 9 (wheel_track 0.09 m, five
      12 mm sensors at y = 0.04 m, 0.6 kg). It is the best-measured platform at 215.38.

      - Correct the kp reference in future feedback: the 215 baseline was kp 3.2 with
      kd 0.5 (iterations 8 and 9), not kp 3.5. Kp 3.5 with kd 0.5 gave 213.28 (iteration
      7), and kd 0.4 gave 174.96 (iteration 10).


      - [Open this output](iteration-11/entityR1/versions/0f964185c7844a6bb98520f31169d287/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/c42677831a5446a48336929a134d7a24/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-c0df5f8993ac648b/payload.json)'
