overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 3 scored 48.12, the lowest so far, and every trial on every track
      still ended off track. Changing to 16 mm footprints and y = 0.03 m, together
      with wheel_track 0.14 m and mass 0.5 kg, made the robot worse: slalom line loss
      was 1.0, s-bend line loss rose to 1.25, and the scores fell on all three tracks.
      The 0.016 m footprint did not fix line loss, and the shorter look-ahead did
      not bring max_error under the 0.06 m floor. The best result remains iteration
      0 (96.84), which used five 12 mm sensors at x = -0.024 to +0.024 m and y = 0.04
      m, with wheel_track 0.12 m and mass 0.6 kg. Iteration 1 (seven sensors, same
      drivetrain) scored 91.28. Comparing iterations 0 and 1 per track, five sensors
      did better on s-bend (72.3 vs 63.2) and slalom (41.1 vs 31.5), and the oval
      was roughly equal. Iterations 2 and 3 show that the drivetrain change (0.14
      m track, 0.5 kg) and the sensing change did not help. Max_error stays at about
      0.063 m on every track, and the off-track floor is fixed at 0.06 m, so the next
      step is to return to the best-known geometry and isolate the remaining variable.
      I revert to iteration 0''s geometry exactly: five 12 mm sensors, y = 0.04 m,
      wheel_track 0.12 m, mass 0.6 kg, and wheel_radius and body unchanged. I expect
      a score near 96.8 and max_error near 0.063 m. This is a return to the best evidence,
      not a new gain. The Integrator will need to map sensor_weights to five sensors,
      and I flag that the controller must be rebuilt for this layout.


      - [Open this output](iteration-4/entity0/versions/aebb1fb01405439a97f99fa237330c6f/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-8dfc33eaa2dd3e73/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-4c9fe8514d0cc0e1/payload.json)'
  - id: entity1
    label: Sensing fix, drivetrain
    notes: 'Robot with 16 mm footprints and forward row moved to y = 0.03 m, keeping
      iteration 2 drivetrain and controller so only sensing changes. Based on iteration
      2''s line loss of 1.0 to 1.9 per run and max_error of 0.063 to 0.064 m.


      ### Rationale


      Iteration 2 (score 74.95) left max_error at 0.063 to 0.064 m on all three tracks,
      just above the 0.06 m floor, and line loss at 1.0 (oval, s-bend) and 1.9 (slalom).
      Widening the span to seven sensors (iteration 1) did not remove line loss, so
      the Builder''s sensing change is a valid next test. The Builder''s iteration
      3 geometry keeps the seven x positions, sets sensor_size to 0.016 m (so each
      footprint covers more of the 25 mm tape at the edges) and moves the forward
      row to y = 0.03 m (shorter look-ahead, with iteration 2 oscillation at 0.18
      to 0.20, well under the 0.25 limit). I keep the iteration 2 controller unchanged
      (kp 7.0, ki 0.2, kd 0.3, base_speed 1.8, last_direction, weights x/0.018), so
      the only changes in the race are the two sensing parameters. The weights remain
      valid for the seven x positions, and the sensor row position does not change
      the signal scale. I expect line_loss_events to fall toward zero and max_error
      to move toward 0.06 m. The controller does not need retuning for this step;
      I will adjust kp only if the next race shows oscillation or saturation.


      - [Open this output](iteration-3/entity1/versions/1055f4b87a6143eba2790e7e8f99901f/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/b079a34e2b4c4d2cb5613b37255e5317/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-40bc98e70b7395dd/payload.json)'
  - id: entityR1
    label: Sensing-first feedback
    notes: 'Feedback on 16 mm sensing and y = 0.03 m, with a fallback to wheel_track
      0.12 m if max_error stays above the 0.06 m floor with no line loss. Uses iteration
      0 to 2 evidence and the contract''s turn-rate relation.


      ### Feedback


      No race has been run for this candidate, so this states no outcome for it. Evidence
      so far: iteration 0 (five sensors, 12 mm footprints) gave max_error 0.063 to
      0.070 m and 1 to 2 line-loss events per run. Iteration 1 (seven sensors, x ±0.036
      m, kp 6.0) kept max_error at 0.062 to 0.068 m and line loss near 1 per run,
      so widening the span alone was not enough. Iteration 2 (wheel_track 0.14 m,
      mass 0.5 kg, kp 7.0) scored 74.95, below iteration 0''s 96.84, with max_error
      still 0.063 to 0.064 m and slalom line loss rising to 1.9. Turn rate is wheel
      speed difference divided by wheel_track, so a wider track gives less yaw per
      unit of turn command; I raised kp to offset this, and the wider track should
      not be read as added turn authority. Your sensing change (sensor_size 0.016
      m, y = 0.03 m) is the test for line loss and look-ahead lag. Next race: if line_loss_events
      stay at 1 or more on slalom or s-bend, keep sensor_size 0.016 m and try a more
      forward-biased array (more sensors at the edges) rather than wider spans. If
      line loss is zero but max_error is still above 0.06 m with steering_oscillation
      below about 0.25, the limit is turn authority: return wheel_track to 0.12 m,
      since a narrower track gives more yaw per command. If steering_oscillation rises
      above about 0.25, restore y to 0.04 m. If the score falls below 96.84, revert
      wheel_track to 0.12 m and mass to 0.6 kg as you planned.


      ### Requested changes


      - If line_loss_events remain at 1 or more on slalom or s-bend with sensor_size
      0.016 m: add edge sensors (for example x = ±0.042 m) or keep the seven-sensor
      array with 0.016 m footprints, citing iteration 2''s line loss of 1.0 to 1.9
      per run.

      - If line_loss_events are zero but max_error stays above 0.06 m and steering_oscillation
      is below about 0.25: return wheel_track to 0.12 m, keeping mass 0.5 kg, citing
      iteration 2''s max_error of 0.063 to 0.064 m and the contract''s yaw relation
      (narrower track gives more yaw per command).

      - If steering_oscillation rises above about 0.25 with y = 0.03 m: restore the
      forward row to y = 0.04 m, citing iteration 2''s oscillation of 0.18 to 0.20
      as the basis for trying a shorter look-ahead.


      - [Open this output](iteration-3/entityR1/versions/1055f4b87a6143eba2790e7e8f99901f/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/b079a34e2b4c4d2cb5613b37255e5317/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-40bc98e70b7395dd/payload.json)'
