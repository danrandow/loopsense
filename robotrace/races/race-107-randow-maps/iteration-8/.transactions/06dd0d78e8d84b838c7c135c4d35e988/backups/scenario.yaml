map:
  id: race-107-randow-maps
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Hold 0.09 m track, test
    notes: 'Holds iteration 7''s geometry (0.09 m track, five 12 mm sensors, 0.6 kg)
      exactly, so this race isolates the Integrator''s controller change. Iteration
      7 scored 213.28 with oval oscillation 0.291, and the evidence shows track-width
      gains have flattened on the s-bend.


      ### Rationale


      Iteration 7 (kp 3.5 at wheel_track 0.09 m, otherwise unchanged) scored 213.28,
      up from 153.01, so the controller change is the main gain. The oval finished
      4 of 20 runs (up from 2), with progress 0.82. Slalom line loss fell from 2.0
      to 1.0. The remaining problems are oval steering_oscillation of 0.291 (above
      the 0.25 caution level), s-bend max_error of 0.0643 m (still above the 0.06
      m off-track floor), and s-bend line loss of 1.25. Every track still ends mostly
      off track, so the robot leaves the tape at about 0.063 to 0.065 m. The floor
      is set by max(0.06, tape_half_width + body_width/4). At body_width 0.12 m that
      is 0.06 m, and body width cannot raise it in range. Sensor span, footprint and
      look-ahead changes (iterations 1 and 3) lowered the score, and the track-width
      trend from 0.12 to 0.09 m has flattened on the s-bend (0.0703, 0.0626, 0.0630,
      0.0643 m across iterations 4 to 7). Narrowing to 0.08 m would add about 12 percent
      more yaw gain per command, which the oval oscillation already shows is at its
      limit. I therefore hold every geometry value at iteration 7''s settings. This
      keeps the 213 platform fixed while the Integrator tunes the controller to bring
      oval oscillation below 0.25. I expect the score to hold at or above 213 with
      the oval oscillation falling and the s-bend max_error remaining near 0.063 m.
      If the score drops, the cause is the controller, because the geometry is held.


      - [Open this output](iteration-8/entity0/versions/4e0902cc38a54a8d8344326e92f8552c/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-43f83ccdb345fab5/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-7fc60300aa8be67d/payload.json)'
  - id: entity1
    label: kd damping at 0.09 m
    notes: 'Geometry held at iteration 6 (wheel_track 0.09 m), with kd raised from
      0.3 to 0.5 to bring oval steering oscillation below 0.25. Iteration 6 already
      raced kp 3.5 at this geometry (153.01), so this tests damping rather than repeating
      it.


      ### Rationale


      Iteration 6 already raced this exact geometry (wheel_track 0.09 m, five 12 mm
      sensors at y = 0.04 m, mass 0.6 kg) with kp 3.5, scoring 153.01. The Builder''s
      proposal holds that geometry, so keeping the iteration 6 controller unchanged
      would repeat a known result and teach nothing. The one open problem in that
      race is oval steering_oscillation at 0.2505, just above the 0.25 caution level.
      Oscillation is the sum of changes in distance from the line between steps, so
      derivative action is the natural damper. I raise kd from 0.3 to 0.5 and keep
      kp 3.5 and ki 0.2, so kp/wheel_track is unchanged and the race isolates damping.
      Expected result: oval oscillation below 0.25 with progress near 0.73 and a score
      at or above 153. Risk: kd amplifies sensor noise, so if slalom line-loss events
      or s-bend max_error rise, kd is the likely cause. Geometry is held at iteration
      6 values, and sensor weights, base_speed and line_loss mode are unchanged.


      - [Open this output](iteration-7/entity1/versions/69fe0f2778144a3dad84269d7a9d3cc5/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/fdc9b9eaa44f4bfeba1027bf7b0b0db2/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-83f9ccb0ccbb32e5/payload.json)'
  - id: entityR1
    label: Hold 0.09 m, test next
    notes: 'Notes that the requested geometry matches iteration 6 and gives conditional
      changes to wheel_track 0.08 m or back to 0.10 m, based on oscillation and s-bend
      max_error from iterations 5 and 6.


      ### Feedback


      This is written before the candidate races, so it states no outcome for it.
      Note that the geometry you asked to hold (wheel_track 0.09 m, five 12 mm sensors
      at y = 0.04 m, 0.6 kg) is exactly iteration 6, which already raced at 153.01
      with kp 3.5. This race therefore isolates a controller change (kd 0.3 to 0.5),
      not a geometry change. Evidence: iteration 6 gave oval steering_oscillation
      0.2505 and progress 0.726, with slalom line loss at 2.0 and s-bend max_error
      0.063 m. Iteration 5 (wheel_track 0.10 m, kp 4.0) gave oval oscillation 0.277
      and s-bend max_error 0.0626 m, so oscillation is tied to yaw gain. Iterations
      1 to 3 showed that sensor span, footprint and look-ahead changes did not help,
      so I have not requested them again. Next race: if the score is at or above 153
      and oval oscillation is below 0.25, keep 0.09 m. If s-bend max_error is still
      above 0.06 m with oscillation below 0.25, wheel_track 0.08 m is the next geometry
      step, but it adds yaw gain (about 12 percent more), so pair it with a kp reduction.
      If oscillation stays above 0.25 with kd 0.5, the limit is yaw gain at this track
      width, not damping. In that case, do not widen the sensor array; use a narrower
      track only with lower kp.


      ### Requested changes


      - If s-bend max_error stays above 0.06 m while oval steering_oscillation is
      below 0.25 and the score is at or above 153: propose wheel_track 0.08 m, citing
      iteration 5''s s-bend max_error improvement from 0.0703 to 0.0626 m when track
      narrowed from 0.12 to 0.10 m. Expect the Integrator to lower kp to hold kp/wheel_track.

      - If oval steering_oscillation is still above 0.25 at kd 0.5: keep wheel_track
      0.09 m and do not change the sensor array, citing iteration 5''s oscillation
      of 0.277 at kp 4.0 as evidence that yaw gain, not sensing, drives the oscillation.

      - If the score falls below 153 or slalom line-loss events rise above 2.0: revert
      wheel_track to 0.10 m with the five-sensor layout and 0.6 kg mass, citing iteration
      5 (112.54) as the best-supported narrower-track result.


      - [Open this output](iteration-7/entityR1/versions/69fe0f2778144a3dad84269d7a9d3cc5/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/fdc9b9eaa44f4bfeba1027bf7b0b0db2/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-83f9ccb0ccbb32e5/payload.json)'
