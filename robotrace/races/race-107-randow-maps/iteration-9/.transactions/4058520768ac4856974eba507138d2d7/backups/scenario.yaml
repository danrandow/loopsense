map:
  id: race-107-randow-maps
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Hold 0.09 m track, kp 3.2
    notes: 'Geometry held exactly at iteration 8''s best (215.38) with five 12 mm
      sensors and wheel_track 0.09 m, so the race isolates the Integrator''s kp 3.2
      controller change. Narrowing to 0.08 m was not proposed because the s-bend max_error
      has been flat across track widths and the controller is tuned to 0.09 m.


      ### Rationale


      Iteration 8 (wheel_track 0.09 m, five 12 mm sensors at x = -0.024 to +0.024
      m and y = 0.04 m, 0.6 kg, kp 3.5) scored 215.38, the best result so far. Its
      oval finish rate rose to 0.30 and its s-bend max_error fell to 0.0612 m. Five-sensor
      geometry with wheel_track 0.09 m is the best-supported platform, and every sensing
      change tested in iterations 1 to 3 lowered the score.


      The remaining problems are oval steering_oscillation of 0.292, above the 0.25
      caution level, and s-bend max_error still above the 0.06 m off-track floor.
      The s-bend max_error has been flat at 0.063 to 0.064 m across track widths 0.10
      to 0.09 m, so further narrowing alone is unlikely to fix it. Narrowing to 0.08
      m would add about 12 percent more yaw gain per command, which the oscillation
      already shows is at its limit. I considered proposing 0.08 m now, but the Integrator''s
      controller (kp 3.2 with kd 0.5) is tuned to the 0.09 m geometry. Changing the
      track now would confound that controller test and could cost the 215 baseline.
      I therefore hold every geometry value at iteration 8''s settings. The only change
      this iteration is the Integrator''s kp 3.5 to 3.2, which lowers yaw gain to
      bring oscillation under 0.25. Expected result: a score at or above 215, oval
      steering_oscillation below about 0.25, and s-bend and slalom line loss at or
      below 1.25 per run. If oscillation stays above 0.25 at kp 3.2, the limit is
      yaw gain at this track width, and I will not widen the sensor array.


      - [Open this output](iteration-9/entity0/versions/519c6f2617d942b7a202efa1cd0570c3/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-7b5653dbcd3a68d0/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-04f7f6a2f6184cc8/payload.json)'
  - id: entity1
    label: 'Iter 8: kp 3.2 at 0.09 m'
    notes: 'Holds the iteration 7 geometry and kd 0.5, lowering kp from 3.5 to 3.2
      to reduce yaw gain. This targets oval steering_oscillation (0.291 at iteration
      7) while keeping the 213 baseline.


      ### Rationale


      The Builder holds iteration 7''s geometry exactly (wheel_track 0.09 m, five
      12 mm sensors at x = -0.024 to +0.024 m and y = 0.04 m, wheel radius 0.03 m,
      body 0.12 x 0.18 m, mass 0.6 kg). I keep that geometry and its sensor weights
      [-2, -1, 0, 1, 2]. The iteration 7 result of 213.28 is the baseline. Its oval
      steering_oscillation rose to 0.291, up from 0.2505 at kd 0.3 in iteration 6.
      The kd increase from 0.3 to 0.5 therefore raised oscillation, even though it
      lifted the score from 153 to 213 and cut slalom line loss from 2 to 1. Repeating
      iteration 7 would teach nothing new, so I make one controller change: kp 3.5
      to 3.2. Iteration 5 showed that oval oscillation (0.277 at kp 4.0, wheel_track
      0.10) tracks effective yaw gain, which is kp / wheel_track. Holding kd at 0.5
      keeps the damping that produced the score gain. kp / wheel_track falls from
      38.9 to 35.6. The expected result is oval steering_oscillation below about 0.25
      with the score at or above 213. The risk is that less yaw gain slows the s-bend
      correction and raises line loss. If the score falls below 213, the controller
      is the cause, because the geometry is held. ki, base_speed and line_loss are
      unchanged.


      - [Open this output](iteration-8/entity1/versions/06dd0d78e8d84b838c7c135c4d35e988/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/4e0902cc38a54a8d8344326e92f8552c/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-7fc60300aa8be67d/payload.json)'
  - id: entityR1
    label: 'Feedback: narrow track'
    notes: 'Ties the held geometry to iteration 7''s 213.28 and notes that kd raised
      the score but also oscillation. Flags that s-bend max_error has flattened with
      track width, so any 0.08 m step must come with lower kp.


      ### Feedback


      This is written before the candidate races, so it states no outcome for it.
      The Builder''s held geometry is iteration 7 (213.28). The only controller change
      in this package is kp 3.5 to 3.2. Evidence: iteration 6 (kd 0.3) gave oval oscillation
      0.2505 and score 153; iteration 7 (kd 0.5) raised the score to 213 but pushed
      oval oscillation to 0.291. So derivative gain helped the score while raising
      oscillation, and yaw gain (kp / wheel_track) drove the oscillation in iteration
      5 (0.277 at 0.10 m, kp 4.0). The s-bend max_error has barely moved with track
      width: 0.0703 m at 0.12 m (iteration 4), 0.0626 m at 0.10 m (iteration 5), and
      0.063 m at 0.09 m (iteration 6). Further narrowing therefore looks unlikely
      to lift s-bend tracking alone. Sensing changes in iterations 1 to 3 all lowered
      the score. Next race: if the score is at or above 213 and oval oscillation falls
      below 0.25, keep the geometry and the controller direction. If oscillation stays
      above 0.25 with the score at or above 213, the limit is yaw gain at this track
      width, so lower kp further rather than widening the track. If the score falls
      below 213, the controller is the likely cause, and the geometry should be reverted
      only if that is confirmed.


      ### Requested changes


      - If the score stays at or above 213 and s-bend max_error is still above 0.06
      m with oval steering_oscillation below 0.25: propose wheel_track 0.08 m with
      kp lowered to about 3.0 to hold kp / wheel_track near 37.5. Cite iteration 5''s
      s-bend max_error gain (0.0703 to 0.0626 m) and iteration 6''s flat s-bend result
      (0.063 m) as the reason to test one more narrowing with lower kp.

      - If the score falls below 213 with the geometry held: keep wheel_track 0.09
      m, report the controller settings used, and treat kp 3.2 as the suspect. Cite
      iteration 7''s 213.28 as the baseline and iteration 6''s 153 as the result with
      kd 0.3.

      - If oval steering_oscillation is still above 0.25 at kp 3.2 and kd 0.5: do
      not change the sensor array. Cite iterations 1 to 3, where sensor span, footprint
      and look-ahead changes all lowered the score, as evidence against sensing changes.


      - [Open this output](iteration-8/entityR1/versions/06dd0d78e8d84b838c7c135c4d35e988/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/4e0902cc38a54a8d8344326e92f8552c/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-7fc60300aa8be67d/payload.json)'
