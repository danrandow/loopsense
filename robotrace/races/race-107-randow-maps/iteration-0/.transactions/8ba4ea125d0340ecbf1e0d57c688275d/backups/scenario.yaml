    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 0 has no race telemetry or Integrator feedback, so this is a baseline
      built from the contract rather than from evidence. Five sensors at 12 mm spacing
      across x = -0.024 to +0.024 m keep the tape (25 mm wide) under at least one
      sensor footprint at any lateral offset within about the off-track limit, and
      the 12 mm footprint gives contiguous coverage with no blind gap. Placing them
      0.04 m ahead of the axle gives the controller a look-ahead, so steering responds
      before the wheels reach the bend. A 0.12 m wheel track and 0.03 m wheel radius
      are mid-range, giving a moderate turn authority without excessive slip. Body
      width 0.12 m keeps the off-track limit at its 0.06 m floor, since tape half-width
      plus a quarter body width (0.0425 m) is below it. Mass 0.6 kg is at the lower
      end to favour acceleration toward the roughly 1.5 m/s average needed to finish
      in 3 s. I expect a completed run on the oval, with line-loss events low because
      the sensor span covers the tape across small offsets; the main risk is sensor
      saturation on tight slalom bends.


      - [Open this output](iteration-0/entity0/versions/f9836b2fcc874aa38741e46b393c0978/payload.json)'
