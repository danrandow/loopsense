  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Narrow track to 0.10 m
    notes: 'Keeps the confirmed five-sensor baseline (iteration 4 score 96.843) and
      narrows wheel_track from 0.12 to 0.10 m, following the Integrator''s contingency
      for s-bend max_error above 0.06 m. The contract''s yaw relation (turn rate =
      speed difference / track) and the iteration 2 drop at 0.14 m support this.


      ### Rationale


      Iteration 4 restored the iteration 0 geometry and reproduced its score exactly
      (96.843), so the five-sensor, 12 mm, y = 0.04 m, 0.12 m track, 0.6 kg baseline
      is confirmed as the best-supported platform. Its max_error is still above the
      0.06 m off-track floor on the s-bend (0.0703 m, with 2 line-loss events per
      run), and the oval and slalom sit near 0.063 m. Iterations 2 and 3 show that
      widening the track to 0.14 m lowered the score, and the contract relation (turn
      rate = wheel speed difference / wheel_track) means a narrower track gives more
      yaw per unit of turn command. The Integrator''s contingency for exactly this
      case (score near 96.8 with s-bend max_error above 0.06 m) therefore applies:
      narrow wheel_track from 0.12 m to 0.10 m and keep mass at 0.6 kg and the five-sensor
      layout unchanged. I expect the s-bend max_error to fall toward the floor, with
      line-loss events on the s-bend reduced from 2 toward 1. Risk: a 20 percent increase
      in yaw gain at the same controller could cause more oscillation, so the Integrator
      should check steering_oscillation against its iteration 0 range of about 0.13
      to 0.25.


      - [Open this output](iteration-5/entity0/versions/50d3b95563704d9c959a90922f9c6176/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-c3c68d29263edf3d/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-8b1aa49440c3f167/payload.json)'
  - id: entity1
    label: Track 0.10 m, kp
    notes: 'Complete robot for the Builder''s wheel_track 0.10 m geometry, with the
      iteration 0 controller held fixed so the race isolates track width. Oscillation
      risk is flagged because iteration 0 s-bend oscillation was already 0.253.


      ### Rationale


      The Builder''s proposal changes only wheel_track, from 0.12 m to 0.10 m, against
      the iteration 0 and 4 baseline (96.843). The contract gives turn rate = wheel
      speed difference / wheel_track, so the same turn command produces about 1.2
      times the yaw at 0.10 m. The Builder''s intent is to test that higher effective
      yaw gain on the s-bend, where iteration 0 gave max_error 0.0703 m and 2 line-loss
      events. I keep the controller identical to iteration 0 (kp 4.0, ki 0.2, kd 0.3,
      base_speed 1.8, weights [-2,-1,0,1,2], last_direction). Scaling kp down to hold
      yaw response (about 3.33) would cancel the geometry change and make the race
      uninformative, so I leave kp unchanged and let the race measure the geometry
      effect. Risk: iteration 0 already had s-bend steering_oscillation at 0.2533,
      above the Builder''s 0.25 threshold, so the 20 percent higher effective gain
      may push oscillation further up. I have no race data for this exact design.
      If oscillation rises above about 0.25, the next iteration should lower kp, not
      change the geometry again. Expected result: s-bend max_error near or below 0.06
      m, with oscillation the main cost.


      - [Open this output](iteration-5/entity1/versions/0e861fa7bf244fd8a5f4af08830c486f/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/50d3b95563704d9c959a90922f9c6176/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-8b1aa49440c3f167/payload.json)'
  - id: entityR1
    label: 'Feedback: narrow track'
    notes: 'Feedback before racing: narrowing to 0.10 m raises yaw per command by
      about 1.2 times, so oscillation is the main risk. It gives if-then rules for
      oscillation, s-bend max_error and score, citing iterations 0, 2 and 4.


      ### Feedback


      Written before this candidate has raced, so it states no outcome for it. Evidence:
      iteration 0 and 4 (wheel_track 0.12 m, five sensors, kp 4.0, mass 0.6 kg) scored
      96.84, with s-bend max_error 0.0703 m, line loss 2 per run, and steering_oscillation
      0.2533. Oval and slalom max_error were about 0.062 m. Iteration 2 (wheel_track
      0.14 m, mass 0.5 kg, kp 7.0) fell to 74.95, but it changed kp and mass as well
      as track width, so that drop cannot be attributed to track width alone. Iteration
      3 changed footprint, row and drivetrain together and scored 48.12. Turn rate
      is wheel speed difference divided by wheel_track, so narrowing the track raises
      yaw per unit of command by about 1.2 times. Your 0.10 m candidate therefore
      tests more turn authority, and it also raises the oscillation risk. Next race:
      if s-bend steering_oscillation exceeds about 0.25, the cause is probably the
      higher effective gain, so I will lower kp in the controller rather than change
      the geometry again. If steering_oscillation stays below about 0.25 and s-bend
      max_error is still above 0.06 m with line loss at 2, propose wheel_track 0.08
      m as the next step. If the score falls below 96.84, revert wheel_track to 0.12
      m.


      ### Requested changes


      - If s-bend steering_oscillation rises above about 0.25 at wheel_track 0.10
      m: keep the geometry and tell me, so I can lower kp from 4.0 toward 3.5 to restore
      the iteration 0 yaw response per command (iteration 0 oscillation 0.2533 at
      kp 4.0 is already at the limit).

      - If s-bend max_error stays above 0.06 m with line loss at 2 and steering_oscillation
      below about 0.25: propose wheel_track 0.08 m, citing iteration 0''s max_error
      of 0.0703 m and the contract yaw relation.

      - If the score falls below 96.84 at wheel_track 0.10 m: revert wheel_track to
      0.12 m, citing iteration 2''s drop to 74.95 as a warning that turn-authority
      changes can cost score when oscillation rises.


      - [Open this output](iteration-5/entityR1/versions/0e861fa7bf244fd8a5f4af08830c486f/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/50d3b95563704d9c959a90922f9c6176/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-8b1aa49440c3f167/payload.json)'
