  - id: entity0
    label: Baseline 5-sensor
    notes: 'A symmetric five-sensor baseline (0.02 m spacing, 0.03 m forward offset,
      0.012 m footprint) with mid-range body and drivetrain values. No race data exists
      yet, so this is a neutral starting point to test sensor span and lookahead.


      ### Rationale


      Iteration 0 has no race telemetry and no Integration Feedback yet, so this proposal
      is a balanced baseline rather than a tuned design. Five sensors at 0.02 m spacing
      span ±0.04 m, which covers the 25 mm tape with margin while keeping at least
      one sensor on the line through moderate bends. The sensors sit 0.03 m ahead
      of the axle so the reading leads the wheels and gives the controller time to
      react. Sensor size 0.012 m is about half the tape width, so a centred tape gives
      a clear, graded response. Weights are proportional to sensor x (left positive,
      right negative), so the signal is a direct lateral-offset estimate. Wheel track
      0.12 m, wheel radius 0.03 m, mass 0.8 kg and body width 0.12 m are mid-range
      values that keep the yaw inertia moderate and the off-track limit (max(0.06,
      0.0125 + 0.03) ≈ 0.0425 m) comfortable. Body length 0.18 m is a neutral choice.
      I expect a run to complete the oval at a moderate speed. The main risks are
      sensor saturation on tight slalom bends and speed being too low to finish in
      3 s. Both should show up in the next race telemetry.


