map:
  id: race-112-opt-eval
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: kp 2.6, kd 0.45, span
    notes: 'Lowers kp from 3.0 to 2.6 to bring steering_oscillation under 0.2 on the
      oval and s-bend, keeping the ±0.07 m span that removed line loss in iteration
      3. Based on the Evaluator''s kp rule and the iteration 3 race telemetry (score
      287).


      ### Rationale


      Evidence from iteration 3 (score 287.1, the best so far): widening the sensor
      span to ±0.07 m cut line_loss_events from 1.0 to 0.0 on the s-bend and slalom
      (0.05 on the oval), which supports the geometry hypothesis. Oscillation is still
      above the 0.2 threshold on the oval (0.287) and s-bend (0.276) at kp 3.0, kd
      0.45, while the slalom is well under (0.10). Off-track endings remain the main
      problem: 0 finishes on the s-bend and slalom, and max_error is 0.0625 on the
      s-bend, just past the 0.06 m limit. Changes: (1) kp 3.0 to 2.6, following the
      Evaluator''s rule for oscillation above 0.2 with kd at 0.45. A softer proportional
      gain should reduce the jitter that is driving the path error. (2) Everything
      else is held fixed: kd 0.45, ki 0.1, base_speed 1.2, the ±0.07 m five-sensor
      span, sensor_size 0.016 and the weights, so the result isolates the kp change.
      Expected: steering_oscillation below 0.2 on the oval and s-bend, line_loss_events
      staying near 0, and max_error below 0.06 on the s-bend, which should raise finishes
      and progress. Risk: a lower kp may weaken correction on the tightest bends and
      let max_error grow. Completion within 3 s is still unlikely at base_speed 1.2.
      Hypotheses to check next: (a) steering_oscillation falls below 0.2 at kp 2.6;
      (b) max_error stays below 0.06 on the s-bend; (c) if the run is clean, base_speed
      1.3 then 1.4 is the next lever for completion_time under 3 s. If oscillation
      stays high with kp 2.6, the next step is kd toward 0.6 or a sensor y-position
      test.


      - [Open this output](iteration-4/entity0/versions/05870d60d5c44986a0104628d4183bbd/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-0a06f40931853f28/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-600239de11b72f17/payload.json)'
  - id: entityR1
    label: 'Approve: softer kp 2.6'
    notes: 'Approved the single change kp 3.0 to 2.6 on top of the best raced design
      (iteration 3, score 287.1), aimed at oscillation above 0.2 on the oval and s-bend.
      The critique sets the next steps by how the race reads: kd, speed or sensor
      y position.


      ### Feedback


      Approve for this race. The candidate changes one controller value from the best
      raced design (iteration 3, score 287.1): kp goes from 3.0 to 2.6, with kd 0.45,
      ki 0.1, base_speed 1.2, the ±0.07 m five-sensor span, sensor_size 0.016 and
      the weights all held fixed. The single-variable change is the right test. In
      iteration 3, steering_oscillation was 0.287 on the oval and 0.276 on the s-bend,
      both above the 0.2 level, while the slalom was 0.10. Line_loss_events fell to
      0.05 on the oval and 0.0 on the s-bend and slalom, so the widened span addressed
      the line loss. The main open problem is off-track endings: 0 finishes on the
      s-bend and slalom, and max_error of 0.0625 on the s-bend, just past the 0.06
      m limit. The candidate is valid: all sensor positions are inside ±0.08 m and
      y is in range, sensor_size 0.016 is allowed, and the weights and line_loss are
      allowed. Nothing in it is obviously broken. Its risk is that a lower kp weakens
      correction on the tightest bends, so max_error may rise. I cannot say how it
      will perform. Early exploration with 7 iterations left favours racing a clean
      one-variable test over another reading-only round. Next race, read the results
      as follows. If steering_oscillation is below 0.2 on the oval and s-bend and
      max_error is below 0.06, keep kp near 2.6 and raise base_speed in 0.1 steps
      (1.3, then 1.4) to test completion_time under 3 s. If oscillation is still above
      0.2 at kp 2.6, raise kd toward 0.6 before changing kp again. If max_error grows
      above 0.065 on the s-bend while oscillation falls, kp has become too soft, so
      move back toward 2.8 and test sensor y position or sensor_size 0.012 for the
      off-track endings.


      ### Requested changes


      - If steering_oscillation stays above 0.2 on the oval or s-bend at kp 2.6 with
      kd 0.45, raise kd from 0.45 toward 0.6 and keep kp at 2.6 (iteration 3 at kp
      3.0 gave oscillation of 0.287 on the oval and 0.276 on the s-bend).

      - If the run is clean (steering_oscillation under 0.2, line_loss_events near
      0, max_error under 0.06 on all tracks), raise base_speed in 0.1 steps to 1.3,
      then 1.4, with kp 2.6 and kd 0.45 held fixed, to test completion_time under
      3 s (iteration 1 reached progress 0.37 on the oval at base_speed 1.4).

      - If max_error on the s-bend rises above 0.065 at kp 2.6 while oscillation falls,
      return kp to about 2.8 and test sensor y position (for example y at 0.03 m)
      or sensor_size 0.012 to address the off-track endings (iteration 3 max_error
      was 0.0625 on the s-bend, and 0 s-bend finishes).


      - [Open this output](iteration-4/entityR1/versions/1973300a3a624aa2820f304cce56952f/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/05870d60d5c44986a0104628d4183bbd/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-600239de11b72f17/payload.json)'
