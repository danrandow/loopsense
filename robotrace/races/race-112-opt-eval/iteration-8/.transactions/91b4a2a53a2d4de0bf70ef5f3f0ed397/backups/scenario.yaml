map:
  id: race-112-opt-eval
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Sensor row y 0.03 (rev 5)
    notes: 'Reverts to the iteration 5 best design (score 403.4) and moves the sensor
      row from y 0.05 to 0.03 m, reducing sensing lag. The Evaluator''s sensor_size
      0.012 change was already tested in iteration 6 and scored lower (302.6), so
      it is not repeated.


      ### Rationale


      Evidence. Iteration 5 (score 403.4, best so far) is the reference: kp 2.6, kd
      0.6, ki 0.1, base_speed 1.2, five sensors at x = -0.07 to 0.07, y = 0.05, sensor_size
      0.016. Iteration 6 tested the sensor_size 0.012 change that the Evaluator''s
      R1 feedback proposes, and it scored lower (302.6). Oval finishes fell from 17/20
      to 15/20. S-bend progress fell from 0.61 to 0.20 with 20/20 off-track endings.
      Slalom oscillation fell from 0.19 to 0.11, but slalom progress was still 0.10.
      So the R1 premise (keep 0.012 and raise speed) is already contradicted by the
      race. I am not repeating it. I am reverting to the iteration 5 design and changing
      one variable.


      Change. Sensor row y moves from 0.05 m to 0.03 m ahead of the axle (x unchanged,
      sensor_size back to 0.016). Reason: the remaining failures are s-bend off-track
      endings (max_error about 0.062, just past the 0.06 m limit) and oscillation
      above 0.2 on the oval and s-bend at kd 0.6. Both are consistent with a sensing-to-steering
      lag. Pulling the sensor row closer to the axle reduces the lag between what
      the sensors see and when the wheels respond, which should reduce the overshoot-and-correct
      cycle. It also tests the sensor y-position lever the Evaluator asked for, without
      the sensor_size confound.


      What I expect. Oval and s-bend steering_oscillation below about 0.22 (from 0.22
      and 0.26), line_loss_events still near 0 to 0.15, and fewer s-bend off-track
      endings. Slalom should stay near 0.19 or lower.


      Risks. Less look-ahead may raise max_error on the tighter bends, and the 0.03
      m row may see less of the line on the outer sensors. If s-bend max_error rises
      above 0.065 or line_loss_events rises above about 0.3, return y to 0.05 and
      test base_speed 1.1 instead.


      Hypotheses to check next. (a) s-bend steering_oscillation falls below 0.2 at
      y 0.03. (b) Oval finishes stay at 17/20 or better. (c) If the run is clean on
      all tracks, raise base_speed in 0.1 steps (1.3, then 1.4) to test completion_time
      under 3 s.


      - [Open this output](iteration-7/entity0/versions/788a4b93f412481e920388a956b0eae0/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-a194aaf06755ee6d/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-7904fb0c38f0dfac/payload.json)'
  - id: entityR1
    label: Approve y=0.03 sensor
    notes: 'Approved the iteration 5 best design with only the sensor row moved to
      y 0.03 m, since iteration 6 ruled out sensor_size 0.012 (score 302.6). The race
      tests whether a closer sensor row reduces the oscillation that kd alone did
      not fix, and the feedback sets the next base_speed and fallback steps.


      ### Feedback


      Approve this single-variable test. The candidate is the iteration 5 design (score
      403.4, best raced so far) with sensor row y moved from 0.05 m to 0.03 m. Sensor
      x, sensor_size 0.016, kp 2.6, kd 0.6, ki 0.1 and base_speed 1.2 are unchanged.
      The change follows from iteration 6, which showed that sensor_size 0.012 lowered
      the score to 302.6 and raised s-bend off-track endings, so the 0.012 direction
      is closed. Iteration 5 still had oval oscillation at 0.219, s-bend at 0.260
      and slalom at 0.192, all of which point to a sensing-to-steering lag rather
      than more damping. Iteration 4 showed that kd 0.45 to 0.6 helped the oval but
      raised s-bend and slalom oscillation, so further kd is not the lever. The ±0.07
      m span stays, because iteration 4 showed it removes most line loss (0.15 on
      the oval, 0.0 on the s-bend and slalom). The candidate is valid: all y values
      are within -0.06 to 0.08, the x values are within range, sensor_size 0.016 is
      allowed, and the controller values are inside their limits. Nothing is obviously
      broken. The main risk is that less look-ahead raises max_error on the tighter
      bends, and the outer sensors may see less tape. I cannot say how it will perform.
      With four iterations left after this one, racing a clean one-variable step gives
      more useful telemetry than another reading-only round. Next race, read the results
      as follows. If steering_oscillation falls below 0.2 on the oval and s-bend,
      and line_loss_events stays near 0 with s-bend max_error under 0.06, keep y at
      0.03 and raise base_speed to 1.3 (then 1.4), with kp and kd fixed, to test completion_time
      under 3 s. If line_loss_events rises above about 0.3 on any track, or s-bend
      max_error rises above 0.065, return y to 0.05 (iteration 5 geometry) before
      testing anything else. If slalom steering_oscillation rises well above its iteration
      5 level of 0.192, return kd to about 0.5.


      ### Requested changes


      - If steering_oscillation falls below 0.2 on the oval and s-bend with line_loss_events
      near 0 and s-bend max_error under 0.06, keep sensor y at 0.03 and raise base_speed
      in 0.1 steps (1.3, then 1.4) with kp 2.6 and kd 0.6 fixed, to test completion_time
      under 3 s. Iteration 1 reached progress 0.37 on the oval at base_speed 1.4.

      - If line_loss_events rises above about 0.3 on any track, or s-bend max_error
      rises above 0.065, return sensor y to 0.05 (the iteration 5 geometry). Iteration
      5 gave 0.15 line-loss events on the oval and 0.0 on the s-bend and slalom at
      y 0.05, and s-bend max_error was 0.062.

      - If slalom steering_oscillation rises well above its iteration 5 level of 0.192
      at y 0.03, return kd to about 0.5 with kp 2.6. Iteration 4 at kd 0.45 gave slalom
      oscillation of 0.102.


      - [Open this output](iteration-7/entityR1/versions/ede6cd96f85d4264a6947ec1537939c7/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/788a4b93f412481e920388a956b0eae0/payload.json),
