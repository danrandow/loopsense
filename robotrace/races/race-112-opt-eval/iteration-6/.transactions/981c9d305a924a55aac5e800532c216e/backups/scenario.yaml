map:
  id: race-112-opt-eval
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Narrower sensors, kd 0.6
    notes: 'Keeps the best design''s kd 0.6, kp 2.6 and +/-0.07 m span, and changes
      sensor_size 0.016 to 0.012 to cut oscillation without more damping. Based on
      iteration 5 (score 403.4), where oval oscillation was still 0.219 and slalom
      oscillation had risen to 0.19.


      ### Rationale


      Evidence from iteration 5 (score 403.4, best so far; kp 2.6, kd 0.6, ki 0.1,
      base_speed 1.2, sensors at x = -0.07 to 0.07 with y 0.05, sensor_size 0.016).
      Oval finishes rose to 17/20 and oval oscillation fell from 0.286 to 0.219. Line
      loss stays low (0.15 on the oval, 0.0 on the s-bend). Three problems remain.
      Oval oscillation is still just above 0.2. S-bend oscillation rose to 0.26 (from
      0.213 at kd 0.45) and s-bend ended off track 19/20 with max_error 0.062. Slalom
      oscillation rose to 0.19 (from 0.10), which is the noise-amplification warning.
      The Evaluator''s rule is that when oscillation stays above 0.2 at kd 0.6, change
      sensor geometry before adding more damping, and do not raise kd further. So
      I keep kd at 0.6 and make one geometry change: sensor_size 0.016 to 0.012. A
      smaller footprint averages less sensor noise and reads a sharper edge, which
      may cut the jitter the damping cannot. The span stays at +/-0.07 m, so the outer-sensor
      line-loss fix from iteration 4 is kept. Expected: oval and s-bend oscillation
      below 0.2, slalom oscillation down from 0.19, and s-bend max_error under 0.06.
      Risk: a narrower footprint may bring back line loss, as in iteration 0 (which
      used a narrower span). Hypotheses to check next: (a) steering_oscillation falls
      below 0.2 on the oval and s-bend; (b) line_loss_events stays near 0; (c) if
      the run is clean, base_speed 1.3 is the next lever for completion_time under
      3 s. If the s-bend still goes off track with max_error near 0.06, test sensor
      y position (for example y 0.03 m). If slalom oscillation stays high, return
      kd to about 0.5.


      - [Open this output](iteration-6/entity0/versions/632fc2c623104521bf25afb06face260/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-dcd8fded9b7fb322/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-7a66365a8384ff6d/payload.json)'
  - id: entityR1
    label: Approve kd 0.6 test
    notes: 'Approved the single-variable step kd 0.45 to 0.60 at kp 2.6, based on
      iteration 4 oscillation of 0.286 on the oval and 0.213 on the s-bend, which
      were above the 0.2 level. Feedback sets the next steps depending on whether
      oscillation and s-bend max_error fall in the next race.


      ### Feedback


      Approve for this race. The candidate changes one controller value from the best
      raced design (iteration 4, score 313.7): kd goes from 0.45 to 0.60, with kp
      2.6, ki 0.1, base_speed 1.2, the ±0.07 m five-sensor span, sensor_size 0.016
      and the weights held fixed. This is the rule I set after iteration 4. Its evidence:
      steering_oscillation was 0.286 on the oval and 0.213 on the s-bend, both above
      the 0.2 level, and iteration 4 gave 13 of 20 oval finishes but 0 on the s-bend
      and slalom. Line_loss_events fell to 0.15 on the oval and 0.0 on the s-bend
      and slalom, so the widened span is working and the remaining problem is steering
      behaviour and off-track endings. The candidate is valid: all sensor positions
      are inside the allowed ranges, sensor_size 0.016 is an allowed option, and the
      weights, line_loss and observation list are allowed. Nothing in it is obviously
      broken. The main risk is that more kd amplifies sensor noise and raises oscillation
      on the slalom, and that the s-bend max_error stays near 0.06. I cannot say how
      it will perform. With six iterations left, racing this single-variable step
      gives clearer telemetry than another reading-only round. Next race, read the
      results as follows. If steering_oscillation falls below 0.2 on the oval and
      s-bend and max_error on the s-bend is under 0.06, keep kd near 0.6 and raise
      base_speed in 0.1 steps (1.3, then 1.4) to test completion_time under 3 s. If
      oscillation is still above 0.2 at kd 0.6, change the sensor geometry (y position
      or sensor_size 0.012) before adding more damping. If slalom oscillation rises
      sharply, the extra kd is amplifying noise, so return kd to about 0.5.


      ### Requested changes


      - If steering_oscillation is still above 0.2 on the oval or s-bend at kd 0.6
      with kp 2.6, do not raise kd further. Test sensor y position (for example y
      at 0.03 m) or sensor_size 0.012 for the off-track endings (iteration 4 gave
      oscillation of 0.286 on the oval and 0.213 on the s-bend at kd 0.45).

      - If the run is clean (steering_oscillation under 0.2, line_loss_events near
      0, max_error under 0.06 on the s-bend), raise base_speed in 0.1 steps to 1.3,
      then 1.4, keeping kp 2.6 and kd 0.6 fixed, to test completion_time under 3 s
      (iteration 1 reached progress 0.37 on the oval at base_speed 1.4).

      - If slalom steering_oscillation rises well above its iteration 4 level of 0.102
      at kd 0.6, the extra damping is amplifying sensor noise. Return kd to about
      0.5 and keep kp at 2.6.


      - [Open this output](iteration-5/entityR1/versions/80f00757d3df44ceb83d67efd40cf39b/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/342cc795936d49d9bc018bbb3abf1385/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-6828d07dfd2fa760/payload.json)'
