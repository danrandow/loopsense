map:
  id: race-112-opt-eval
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: kd 0.5 at speed 1.2
    notes: 'Restores base_speed 1.2 from the iteration 9 test, since the s-bend stayed
      off track at 1.1 with max_error 0.0626, so speed is not the limit. Tests kd
      0.5 at y 0.065 with everything else from the iteration 8 best (score 431.1)
      held fixed.


      ### Rationale


      Evidence from iteration 9 (base_speed 1.1, y 0.065, kd 0.6, kp 2.6, score 425.1
      against 431.1 at 1.2). Oval finished 20/20 again, with mean score 951 (up from
      944) and line_loss_events down to 0.15 (from 0.65). The s-bend still ended 20/20
      off track, with max_error 0.0626 (at or above the 0.06 limit) and progress 0.57
      (down from 0.63). Slalom still ended 20/20 off track with max_error 0.0655 and
      1.0 line-loss events. Lowering speed therefore did not clear the s-bend, so
      speed is not the limiting factor. The approved feedback''s rule applies: return
      base_speed to 1.2 and test kd 0.5 at y 0.065. Changes: (1) base_speed 1.1 to
      1.2, which restores the iteration 8 speed. (2) kd 0.6 to 0.5. Less derivative
      damping may reduce the lag-driven overshoot on the s-bend, and slalom oscillation
      was 0.22 at kd 0.6, so a slightly softer derivative term may also help there.
      Everything else is held at iteration 8: x -0.07 to 0.07, y 0.065, sensor_size
      0.016, kp 2.6, ki 0.1, line_loss last_direction, sensor_weights -2,-1,0,1,2,
      and the body, wheel and mass values. I am keeping y 0.065 despite the line-loss
      rise, since the approved feedback accepts that cost while the oval is at 20/20.
      Expected result: the oval stays at 20/20 with mean near 944, and s-bend max_error
      falls toward or below 0.06, with some s-bend finishes possible. Risk: kd 0.5
      may raise oscillation on the oval and slalom, since iteration 4 at kd 0.45 showed
      weaker damping than iteration 5 at kd 0.6. Hypotheses to check: (a) s-bend max_error
      below 0.06 and s-bend finishes appear; (b) oval finishes stay at 17/20 or better;
      (c) slalom steering_oscillation stays near 0.22 or lower. If kd 0.5 worsens
      the oval or slalom without an s-bend gain, return kd to 0.6 and test base_speed
      1.15 at y 0.065, or return y to 0.05 if line-loss events on the oval stay above
      about 0.3.


      - [Open this output](iteration-10/entity0/versions/7d258a28427c4a6d9cae24370d1594f8/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-85adeb6883ec6d80/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-52fc3409ad5ff728/payload.json)'
  - id: entityR1
    label: Approve kd 0.5 test
    notes: 'Approves a single-variable change from the best raced design (iteration
      8, 431.1): kd 0.6 to 0.5 at y 0.065 and base_speed 1.2. Iteration 9 showed speed
      is not the s-bend limit (max_error 0.0626 at 1.1), so the damping lever is the
      next test.


      ### Feedback


      Approve this single-variable test. The candidate is the iteration 8 design (score
      431.1, best raced so far: y 0.065 m, base_speed 1.2, kp 2.6, kd 0.6, ki 0.1,
      span x -0.07 to 0.07, sensor_size 0.016) with kd changed from 0.6 to 0.5. Everything
      else is unchanged, and the geometry and controller values are all in range.


      The evidence supports this step. Iteration 9 (base_speed 1.1, score 425.1) left
      the oval at 20/20 with mean 951. Its s-bend and slalom still ended 20/20 off
      track, with s-bend max_error 0.0626 and slalom max_error 0.0655 (iteration 8
      gave 0.0622 and 0.0654 at base_speed 1.2). Speed is therefore not the limiting
      factor, and lowering it cost about 6 points. My iteration 9 rule now points
      to kd 0.5 at y 0.065 with base_speed 1.2. Iteration 4 (kd 0.45) and iteration
      5 (kd 0.6) showed that kd moves oscillation in opposite directions on the oval
      and s-bend, so this is a fair test of whether the s-bend overshoot is damping-limited.
      Iteration 5 to 8 also showed that the geometry levers (y 0.03 and sensor_size
      0.012) lowered the score, so y 0.065 and sensor_size 0.016 are held.


      Risks: the kd drop may raise oval and slalom oscillation, which was 0.178 and
      0.222 at kd 0.6 and y 0.065. Line-loss events at y 0.065 are already high (0.65
      on the oval, 1.0 on the slalom), so I do not expect the s-bend to gain finishes
      from this change alone. Two iterations remain after this one, so the race is
      worth more than another reading-only round.


      Next race, read the results as follows. If the oval stays at 20/20 and s-bend
      max_error falls below 0.06 or finishes appear, keep kd 0.5 and treat it as the
      new reference. If the score falls below 431 with oval oscillation above 0.2,
      return kd to 0.6 at base_speed 1.2 and y 0.065, which is the iteration 8 design.
      If the s-bend is still off track with max_error at or above 0.06 at kd 0.5,
      the next lever is kp, not speed.


      ### Requested changes


      - Keep base_speed 1.2, y 0.065, kp 2.6 and sensor_size 0.016, and set kd to
      0.5. Iteration 9 (base_speed 1.1) showed speed is not the limit on the s-bend
      (max_error 0.0626), and iteration 4 at kd 0.45 versus iteration 5 at kd 0.6
      showed kd shifts oscillation on the oval and s-bend.

      - If the score falls below 431 at kd 0.5 with oval steering_oscillation above
      0.2, return kd to 0.6 at base_speed 1.2 and y 0.065, which is the iteration
      8 design (score 431.1, the best raced).

      - If the s-bend is still off track with max_error at or above 0.06 at kd 0.5,
      test kp 2.8 at kd 0.6. Iteration 3 to 4 (kp 3.0 to 2.6) changed s-bend max_error
      only from 0.0625 to 0.0617, so kp is a weak lever and this should be the last
      test before the final iteration.


      - [Open this output](iteration-10/entityR1/versions/d6527f2117ca4d57bf03e8696b3d0427/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/7d258a28427c4a6d9cae24370d1594f8/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-52fc3409ad5ff728/payload.json)'
