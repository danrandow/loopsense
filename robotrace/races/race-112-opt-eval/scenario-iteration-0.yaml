  entities:
  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'Iteration 0 baseline built from the contract, with no race data yet. Five
      12 mm sensors and linear weights, kp 2.5, kd 0.15, base_speed 1.6, sized to
      finish in under 3 s while staying stable.


      ### Rationale


      Iteration 0 has no race data or Evaluator feedback yet, so this is a conservative
      baseline built from the contract. Geometry: five sensors spaced 20 mm apart
      across the centre (x = -0.04 to +0.04) and 50 mm ahead of the axle, so they
      see the line before the wheels reach it. A 12 mm sensor footprint covers most
      of the 25 mm tape at any lateral offset. Wheel track 0.12 m and radius 0.03
      m give a moderate turn rate and a reasonable top speed. Mass 0.8 kg with a 0.12
      m body width keeps the off-track limit at 0.06 m. Controller: sensor weights
      run -2, -1, 0, 1, 2 so the signal is a linear lateral error (positive = left,
      which steers left). kp = 2.5 gives a turn of up to about 5 at full signal, which
      is a firm correction. kd = 0.15 damps the response to changes in signal. ki
      = 0 avoids integral windup on curves. base_speed = 1.6 (about 80 percent of
      full PWM) is a compromise: it should reach the roughly 1.5 m/s average needed
      to finish within 3 s, while leaving margin to correct on the tighter bends.
      line_loss = last_direction lets the robot turn back toward the side it last
      saw the line. Expected result: completion on the oval and s-bend, with rms error
      of a few mm. The slalom is the likely failure point, due to fast direction changes.
      Hypotheses to test: (1) kp is high enough to track the tighter bends without
      oscillation; (2) base_speed 1.6 finishes in under 3 s; (3) kd prevents oscillation
      at this speed. Next race should show whether steering_oscillation is high (kd
      or kp too large) or max_error grows on the slalom (kp too low, or base_speed
      too high for the turns).


      - [Open this output](iteration-0/entity0/versions/30418386b12848e4932067fe82ea8642/payload.json)'
  - id: entityR1
    label: 'Baseline review: approve'
    notes: 'The baseline candidate is valid against the contract and has no earlier
      race data to fault it, so it is approved for the first race. The feedback gives
      conditional tuning steps (kp/kd for oscillation, base_speed for the slalom and
      completion time) to apply once telemetry is available.


      ### Feedback


      Iteration 0 has no race data, so this review rests only on the public contract
      and the candidate''s own contents. The candidate is valid: all five sensor positions
      sit inside the allowed ranges, sensor_size 0.012 is an allowed option, the five
      sensor_weights are within [-2, 2] with a non-zero entry, and line_loss ''last_direction''
      and all observation measurements are allowed. Nothing in the geometry or controller
      is obviously broken. The weakest point is the untested speed target: base_speed
      1.6 is only an estimate of the roughly 1.5 m/s average needed to finish in 3
      s, and the tighter bends may not allow it. The sensors are 50 mm ahead of the
      axle, so the controller sees the line early, which should help. This is the
      first race, so approving it gives the telemetry the next critique needs. Next
      race, read the results as follows. If steering_oscillation is high, or rms_error
      is large on the oval and s-bend, reduce kp or raise kd. If completion fails
      or max_error grows on the slalom, lower base_speed or raise kp. If the run completes
      with low oscillation but completion_time is near 3 s, keep the controller and
      increase base_speed in small steps. If line_loss_events is above zero, check
      line_loss and the sensor spacing.


      ### Requested changes


      - If steering_oscillation is high (jitter) on the race, lower kp from 2.5 toward
      1.8 or raise kd from 0.15 toward 0.3, and keep base_speed at 1.6.

      - If the slalom fails or max_error grows on the fast direction changes, lower
      base_speed from 1.6 to 1.3 and keep kp at 2.5 or raise it to 3.0 with kd at
      0.3.

      - If the run completes cleanly with low oscillation but completion_time is above
      about 2.6 s, raise base_speed in steps of 0.1 (for example 1.8) while keeping
      kd at 0.15 or higher.


      - [Open this output](iteration-0/entityR1/versions/befa80363f8f4635a011abeb05a7bbeb/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/30418386b12848e4932067fe82ea8642/payload.json)'
