  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: 'Final: iter 8 design'
    notes: 'Reverts to the best raced design (iteration 8, score 431.1, kd 0.6, base_speed
      1.2, y 0.065) because the kd 0.5 test already raced lower (427.6). Chosen for
      the final unseen-track race, where the oval is 20/20 and no untested change
      is added.


      ### Rationale


      This is the final iteration, so the design should be the most reliable one the
      evidence supports. Iteration 8 (y 0.065, sensor_size 0.016, span x -0.07 to
      0.07, base_speed 1.2, kp 2.6, ki 0.1, kd 0.6) is the best raced design at 431.06.
      Its oval was 20/20 finishes at mean 944 with max_error 0.033. Iteration 10 changed
      kd to 0.5 at the same geometry and scored 427.56. Its oval stayed 20/20 with
      a similar mean, but its s-bend and slalom were no better. The Evaluator''s approved
      candidate is that kd 0.5 test, but it has already been raced and it lost 3.5
      points, so re-racing it would add no information. Iteration 9 showed that lowering
      base_speed to 1.1 also does not clear the s-bend. Neither the s-bend nor the
      slalom has ever finished in any iteration, so the remaining gains sit on unseen-track
      robustness rather than dev-track tuning. I therefore return to the iteration
      8 design unchanged: the oval is at its ceiling, its line-loss and oscillation
      are the lowest among the designs that held 20/20 on the oval, and it carries
      no unraced change into the final scored run. Expected result: about 431 on the
      development tracks, with the oval finishing 20/20. Measurements to read: completion,
      progress and max_error on each track, to see whether the s-bend and slalom still
      go off track at about 0.062 max_error, and line_loss_events, to check that y
      0.065 does not lose the line on an unseen shape.


      - [Open this output](iteration-11/entity0/versions/8647566059694e51a7c70d60d97a3412/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-388768a4c7144f36/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-9e44994f70bd6f47/payload.json)'
  - id: entityR1
    label: Approve best design
    notes: 'Approves the iteration 8 design unchanged, since it is the best raced
      design (431.06, oval 20/20) and no iterations remain to test changes. Iterations
      9 and 10 (base_speed 1.1 and kd 0.5) and the y 0.03 and sensor_size 0.012 variants
      all scored lower, so the feedback advises against revising.


      ### Feedback


      Approved for the final race, unchanged. The candidate is the iteration 8 design
      (y 0.065 m, x -0.07 to 0.07, sensor_size 0.016, kp 2.6, kd 0.6, ki 0.1, base_speed
      1.2, last_direction). It is the best raced design so far (431.06 in iteration
      8), and its oval was 20/20 finishes at mean 944 with max_error 0.0334. Iteration
      9 (base_speed 1.1) scored 425.05 and iteration 10 (kd 0.5) scored 427.56. Both
      left the s-bend and slalom off track, so neither beat iteration 8. Iterations
      5 to 7 showed that moving the sensor row to y 0.03 or shrinking sensor_size
      to 0.012 lowers the score, so those directions are closed. No iterations remain
      after this one, and the unseen-track race is scored only on this build. Nothing
      further can be tested, so the remaining question is whether this design generalises.
      The unseen track may be a different shape, so the main risk is off-track endings
      on tight bends, as seen on the s-bend and slalom. This is not a prediction of
      the result. Do not revise the controller or geometry: the untested changes available
      (base_speed 1.1 or 1.3, kd 0.5 at y 0.065) were already raced and did not beat
      iteration 8.


      ### Requested changes


      - Keep geometry and controller exactly as submitted: sensor y 0.065 m, x -0.07
      to 0.07, sensor_size 0.016, kp 2.6, ki 0.1, kd 0.6, base_speed 1.2, line_loss
      last_direction. Iteration 8 is the best raced score (431.06).

      - Do not switch to kd 0.5 or base_speed 1.1 for the final race. Iteration 10
      (kd 0.5) scored 427.56 and iteration 9 (base_speed 1.1) scored 425.05, both
      below iteration 8.

      - Do not move sensor y back to 0.05 or to 0.03, and do not use sensor_size 0.012.
      Iterations 5 (403.4), 7 (199.7) and 6 (302.6) all scored lower than iteration
      8.


      - [Open this output](iteration-11/entityR1/versions/01e8a929ac8745aba4e2c52c9dc4b686/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/8647566059694e51a7c70d60d97a3412/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-9e44994f70bd6f47/payload.json)'
