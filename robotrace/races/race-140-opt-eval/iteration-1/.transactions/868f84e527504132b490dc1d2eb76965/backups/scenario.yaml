overrides:
  entities:
  - id: entity0
    label: Wider sensors, more kd
    notes: 'Widened the sensor spread to ±0.024 m with 0.016 m footprints, raised
      kd to 0.3 and lowered base_speed to 1.5. The baseline (entityR2A) went off track
      on all 60 trials with max_error about 0.063 and 1 to 2 line-loss events per
      run, which points to weak line coverage and under-damped drift.


      ### Rationale


      Evidence from the baseline (entityR2A): all 60 trials went off track on all
      three tracks, with no finishes. Progress was only 0.12 to 0.16, max_error was
      about 0.063 (just past the 0.06 m off-track limit), and steering_oscillation
      was low (0.11 to 0.16). The failure is therefore a steady drift away from the
      line, not jitter. Line-loss events of 1 to 2 per run show the robot loses all
      sensors once its error passes roughly 0.035 m. The narrow sensor spread (±0.016
      m, 0.012 m footprints) gives little warning and little steering authority before
      the line is lost. Changes: (1) Widen the sensor spread to x = -0.024, -0.012,
      0, 0.012, 0.024 m and enlarge the footprint to 0.016 m, so the line stays visible
      at larger offsets and the signal responds earlier. (2) Raise kd from 0.15 to
      0.3 to damp the drift-and-correct overshoot on the bends, since oscillation
      is low but the error is growing. (3) Lower base_speed from 1.6 to 1.5 to give
      the wider sensors and the damping time to act. This is the minimum speed that
      could plausibly still finish in 3 s. Keep kp 3.0, ki 0.05, weights antisymmetric,
      and line_loss last_direction. Expected result: fewer or no line-loss events,
      max_error below 0.06, and at least some completions on the oval and s-bend.
      The slalom may still be marginal. Hypotheses: H1, the drift is caused by weak
      sensor coverage at large offsets, so widening it cuts line-loss events. H2,
      the drift is partly due to too little damping, so kd 0.3 reduces max_error.
      H3, the speed is near the limit, so 1.5 keeps the robot on track. Next measurements
      wanted: completion and progress per track, max_error and where it peaks (bend
      type), line_loss_events and their timing, and completion_time to judge whether
      speed can be raised again.


      - [Open this output](iteration-1/entity0/versions/2db669cc4f9a4b4aac3d7960757a3e56/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-5ff30181119e3f9b/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-13cf5bf3a72f3041/payload.json)'
  - id: entityR1
    label: Evaluator Feedback
    notes: 'Evaluator Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      No earlier race exists yet, so this review rests only on the contract and the
      candidate''s contents. Every field is inside its allowed range: sensor positions,
      sensor_size 0.012, wheel_track 0.12, wheel_radius 0.03, mass 0.8, base_speed
      1.6, kp 3.0, ki 0.05, kd 0.15, sensor weights within ±2, and line_loss ''last_direction''.
      The measurement names are all valid. Nothing looks obviously broken: the weights
      are antisymmetric, so the sign convention (a line on the left gives a positive
      signal and steers left) is correct, and the centre sensor has weight 0 so a
      centred line produces zero steering. The main unknowns are whether base_speed
      1.6 can reach the roughly 1.5 m/s average needed to finish in 3 s, and whether
      kp 3.0 tracks the tighter bends. Those can only be settled by racing. Once the
      baseline race reports back, read the results as follows. If completion is 0
      with progress well short of 1 and the run ends by going off track, lower kp
      or raise kd before anything else. If the robot completes but completion_time
      is close to 3.0 s, raise base_speed in steps of about 0.2, keeping the speed
      well below saturation. If steering_oscillation is high on the slalom, raise
      kd (for example to 0.3) rather than cutting kp. If line_loss_events is above
      zero, check whether the loss happens on a bend, and then widen the sensor spread
      (for example x = ±0.024) or use a larger sensor_size of 0.016. Use the baseline
      telemetry, not the numbers here, to choose the next change.


      ### Requested changes


      - If the baseline completes but completion_time is near 3.0 s, raise base_speed
      in steps of about 0.2 (e.g. 1.6 to 1.8), since the 2 m/s cap leaves headroom;
      this is untested so far.

      - If the baseline goes off track or shows high max_error on the bends, try kp
      3.0 to 4.0 with kd 0.15 to 0.3; this is untested, and the change should come
      from the measured error on the oval and s-bend.

      - If line_loss_events is above zero, widen the sensor spread (x = ±0.024 m)
      or set sensor_size to 0.016, keeping line_loss ''last_direction''; this is untested
      and depends on where the losses occur.


      - [Open this output](iteration-0/entityR1/versions/27811e68a63041a49d0184cb6f9b5de7/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/5a13665c179f4799be0bb85724e8a745/payload.json)'
