map:
  id: race-140-opt-eval
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: kd 0.40 damping step
    notes: 'Raises kd from 0.30 to 0.40 with the wider ±0.032 m sensor spread kept,
      because iteration 5 oval oscillation reached 0.264, above the 0.25 threshold.
      Iteration 5 (score 201.98) showed fewer line losses and max_error at 0.0599
      on the oval, so the spread stays.


      ### Rationale


      Evidence from the iteration 5 race (entityR2A score 201.98, the best so far,
      up from 140.28): widening the outer sensors to x = ±0.032 m cut line losses
      on the oval (1.7 to 1.2) and s-bend (2.0 to 1.05), brought max_error to 0.0599
      on the oval (under the 0.06 m limit), and raised oval finishes from 3 to 7 of
      20. Steering oscillation on the oval rose to 0.264, above the 0.25 warning level
      set in the Evaluator''s conditional guidance. The s-bend (0.141) and slalom
      (0.143) oscillation is low, so the rise is confined to the oval. The Evaluator''s
      stated rule for this case is to set kd to 0.40 with the wider spread kept, and
      I follow it. Change: kd 0.30 to 0.40, a single-variable step. Everything else
      is held: sensor x = ±0.032 m with antisymmetric weights (-1.6, -0.8, 0, 0.8,
      1.6), kp 3.0, ki 0.30, base_speed 1.5, footprint 0.016 m, and line_loss last_direction.
      Expected result: oval oscillation falls back below about 0.25 while the 7 oval
      finishes are kept or improved, and max_error stays at or below 0.06. Risk: the
      extra damping may slow the correction on the tightest bends and raise s-bend
      or slalom losses, which are still off-track in every run (progress 0.18 and
      0.11). Hypotheses: H1, the oval oscillation comes from the wider spread''s lower
      centre sensitivity, which kd damps. H2, the s-bend and slalom failures need
      a different lever, such as speed or kp, which I will test after this step. Measurements
      wanted: per-track oscillation and finish count, line-loss timing (bend or straight),
      max_error location, and oval completion_time.


      - [Open this output](iteration-6/entity0/versions/2b2d871ea44143658ad0b9b4bf554e98/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-2aa4874df9de8ac4/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-b4373f7489a7fc18/payload.json)'
  - id: entityR1
    label: Approve kd 0.40 step
    notes: 'Approved a single-variable step from the best raced design (score 201.98),
      raising kd 0.30 to 0.40 to bring oval steering oscillation (0.264) back under
      the 0.25 warning level. The evidence is iteration 5, where the ±0.032 m spread
      gave 7 oval finishes and max_error 0.0599.


      ### Feedback


      Approve. This candidate is the best raced design (iteration 5, entityR2B, score
      201.98: sensor x = ±0.032 m, footprint 0.016 m, kp 3.0, ki 0.30, kd 0.30, base_speed
      1.5, last_direction) with one change, kd 0.30 to 0.40. The evidence behind it
      is iteration 5''s oval steering_oscillation of 0.264, which is above the 0.25
      warning level, while s-bend (0.141) and slalom (0.143) oscillation stayed low.
      Oval finishes were 7 of 20 and oval max_error was 0.0599, just under the 0.06
      limit. Raising kd is the damping step the earlier guidance set for this case.
      The weights stay antisymmetric and every other value is held, so the change
      is single-variable and valid. I make no claim about how it will perform. The
      s-bend and slalom still go off track in every run (progress 0.18 and 0.11),
      so they are the next target after this race. Read the race as follows. If oval
      steering_oscillation falls below about 0.25 and oval finishes stay at 7 or more,
      keep kd 0.40. Then test base_speed 1.3 alone, because the s-bend and slalom
      failures may be speed or corner-entry limited and speed has not been varied
      at this sensor spread. If oval oscillation stays above 0.25 or finishes drop
      below 7, the extra damping is slowing the correction, so return to kd 0.30 and
      set kd 0.35 instead. If max_error on the oval rises above 0.06, return kp and
      kd to 3.0 and 0.30 and keep the spread.


      ### Requested changes


      - If oval steering_oscillation falls below about 0.25 and oval finishes stay
      at 7 or more, keep kd 0.40 and test base_speed 1.3 alone, since the s-bend (progress
      0.18) and slalom (progress 0.11) failures have not been tested against speed
      at the ±0.032 m spread.

      - If oval steering_oscillation stays above 0.25 or oval finishes drop below
      7 of 20, return kd to 0.30 and try kd 0.35, since iteration 5 showed the ±0.032
      m spread reached 7 finishes at kd 0.30 and a larger step may over-damp the tightest
      oval bends.

      - If oval max_error rises above 0.06, return kp to 3.0 and kd to 0.30 and keep
      x = ±0.032 m, since kp 3.5 at the narrower spread (iteration 2, score 99.25)
      and ki 0.60 (iteration 4, score 103.99) both lowered the score.


      - [Open this output](iteration-6/entityR1/versions/4cb5ec6f9d2040188bd8d0d60a7a7f66/payload.json)

