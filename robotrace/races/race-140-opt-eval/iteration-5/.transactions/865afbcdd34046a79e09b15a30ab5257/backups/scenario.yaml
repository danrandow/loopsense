map:
  id: race-140-opt-eval
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Wider sensor spread
    notes: 'Keeps the best raced controller (kp 3.0, kd 0.30, ki 0.30) and widens
      the sensor spread from ±0.024 to ±0.032 m to cut line losses of 1.7 to 2.0 per
      run. Ki 0.60 scored lower (103.99 vs 140.28), so the integral is not raised
      again.


      ### Rationale


      Evidence from the last race (iteration 4, ki 0.60) scored 103.99, below the
      ki 0.30 design at 140.28. Oval finishes fell from 3 to 1 of 20, and oval line-loss
      events rose from 1.7 to 1.85. The s-bend was unchanged at 2.0 line losses and
      max_error 0.061. The integral increase did not help the drift and cost finishes,
      so the Evaluator''s suggestion to try ki 1.0 is rejected. I keep ki 0.30, which
      is the best raced integral setting. Line losses (1.7 on the oval, 2.0 on the
      s-bend) are the main remaining failure, and max_error (0.061 to 0.063 m) just
      exceeds the 0.06 m floor. The earlier spread change (x = ±0.012 to ±0.024 m)
      cut line losses and raised the score, so I widen the spread once more to x =
      ±0.032 m. The outer sensors then see the tape at larger offsets and give earlier
      warning before all sensors lose it. The weights stay antisymmetric at (-1.6,
      -0.8, 0, 0.8, 1.6), so the signal scale is unchanged. kp 3.0, kd 0.30, ki 0.30,
      base_speed 1.5, footprint 0.016 m and last_direction are all kept, so this is
      a single-variable change from the best design. Expected result: line_loss_events
      fall on the s-bend and oval, max_error drops toward or below 0.06, and the oval
      finish count stays at 3 or rises. Risk: a wider spread may lower the sensitivity
      near centre and add oscillation. If steering_oscillation rises above about 0.25,
      the next step is kd 0.40. Hypotheses: H1, line losses come from sensors losing
      the tape at offsets around 0.04 m, which wider spread covers. H2, the steady
      drift is not an integral bias, since ki 0.60 did not reduce it. Measurements
      wanted: line-loss timing (bend or straight), max_error location on each track,
      steering_oscillation, and oval completion_time.


      - [Open this output](iteration-5/entity0/versions/ff09709fab16463ab7678eeba594f76a/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-accaa665e52d6041/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-c0619f1f61a80d72/payload.json)'
  - id: entityR1
    label: Approve wider spread
    notes: 'Approves the single-variable step from the best raced design (score 140.28):
      outer sensors widened from ±0.024 m to ±0.032 m, with kp, kd, ki and speed unchanged.
      Evidence: the earlier spread widening from ±0.012 m to ±0.024 m lowered line
      losses, while ki 0.60 and kp 3.5 both lowered the score.


      ### Feedback


      Decision: approve. The candidate is the best raced design (entityR2B, iteration
      3, score 140.28: kp 3.0, kd 0.30, ki 0.30, base_speed 1.5, sensor spread x =
      ±0.024 m, footprint 0.016 m) with one change, the outer sensor spread widened
      to x = ±0.032 m. The weights stay antisymmetric at (-1.6, -0.8, 0, 0.8, 1.6),
      and kp, kd, ki, base_speed, footprint and line_loss (last_direction) are unchanged,
      so the step is single-variable. The evidence supports it: iteration 0 to 1 showed
      that widening the spread from ±0.016 m to ±0.024 m, together with the footprint
      change, reduced line losses and raised the score from 57.10 to 124.80, and iteration
      4 showed that ki 0.60 lowered the score to 103.99, so the ki 0.30 setting is
      kept. Line losses remain at 1.7 on the oval and 2.0 on the s-bend in iteration
      3, and max_error is still 0.061 to 0.063 m, so the spread is the main unexplored
      lever for them. The candidate is valid: all positions are inside the ±0.08 m
      limit and the footprint is in the allowed set. I make no claim about how it
      will perform. This is early-to-mid exploration with six iterations remaining,
      and the change is a clean step from the best raced design, so it should race
      now.


      Read the next race as follows. If line_loss_events fall on the s-bend and oval
      and max_error drops toward or below 0.06, keep ±0.032 m and check whether the
      oval finish count stays at 3 or rises. If steering_oscillation rises above about
      0.25 on the oval or s-bend, which would indicate reduced centre sensitivity,
      set kd to 0.40 and keep the wider spread, since iteration 3 oscillation was
      0.228 (oval) and 0.231 (s-bend) at ±0.024 m. If line losses are unchanged or
      worse, return to ±0.024 m and move to a different lever, rather than widening
      further.


      ### Requested changes


      - If steering_oscillation rises above about 0.25 on the oval or s-bend after
      the wider spread, set kd to 0.40 with x = ±0.032 m, since iteration 3 oscillation
      was 0.228 (oval) and 0.231 (s-bend) at ±0.024 m and kd 0.30 to 0.40 is the stated
      damping step.

      - If line_loss_events are unchanged or higher than the iteration 3 values (1.7
      on the oval, 2.0 on the s-bend), revert the outer sensors to x = ±0.024 m, because
      the spread change is the only variable here and the ±0.012 to ±0.024 m widening
      in iterations 0 to 1 is the best-supported evidence for spread.

      - If line_loss_events fall and max_error drops below 0.06 on some tracks, keep
      x = ±0.032 m and keep ki 0.30, because ki 0.60 was worse (iteration 4, score
      103.99) and kp 3.5 was worse (iteration 2, score 99.25).


      - [Open this output](iteration-5/entityR1/versions/703f861b3e964e9985e22f79a0547aa7/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/ff09709fab16463ab7678eeba594f76a/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-c0619f1f61a80d72/payload.json)'
