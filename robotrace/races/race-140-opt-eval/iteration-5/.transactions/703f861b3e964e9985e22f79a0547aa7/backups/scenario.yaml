map:
  id: race-140-opt-eval
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Wider sensor spread
    notes: 'Keeps the best raced controller (kp 3.0, kd 0.30, ki 0.30) and widens
      the sensor spread from ±0.024 to ±0.032 m to cut line losses of 1.7 to 2.0 per
      run. Ki 0.60 scored lower (103.99 vs 140.28), so the integral is not raised
      again.


      ### Rationale


      Evidence from the last race (iteration 4, ki 0.60) scored 103.99, below the
      ki 0.30 design at 140.28. Oval finishes fell from 3 to 1 of 20, and oval line-loss
      events rose from 1.7 to 1.85. The s-bend was unchanged at 2.0 line losses and
      max_error 0.061. The integral increase did not help the drift and cost finishes,
      so the Evaluator''s suggestion to try ki 1.0 is rejected. I keep ki 0.30, which
      is the best raced integral setting. Line losses (1.7 on the oval, 2.0 on the
      s-bend) are the main remaining failure, and max_error (0.061 to 0.063 m) just
      exceeds the 0.06 m floor. The earlier spread change (x = ±0.012 to ±0.024 m)
      cut line losses and raised the score, so I widen the spread once more to x =
      ±0.032 m. The outer sensors then see the tape at larger offsets and give earlier
      warning before all sensors lose it. The weights stay antisymmetric at (-1.6,
      -0.8, 0, 0.8, 1.6), so the signal scale is unchanged. kp 3.0, kd 0.30, ki 0.30,
      base_speed 1.5, footprint 0.016 m and last_direction are all kept, so this is
      a single-variable change from the best design. Expected result: line_loss_events
      fall on the s-bend and oval, max_error drops toward or below 0.06, and the oval
      finish count stays at 3 or rises. Risk: a wider spread may lower the sensitivity
      near centre and add oscillation. If steering_oscillation rises above about 0.25,
      the next step is kd 0.40. Hypotheses: H1, line losses come from sensors losing
      the tape at offsets around 0.04 m, which wider spread covers. H2, the steady
      drift is not an integral bias, since ki 0.60 did not reduce it. Measurements
      wanted: line-loss timing (bend or straight), max_error location on each track,
      steering_oscillation, and oval completion_time.


      - [Open this output](iteration-5/entity0/versions/ff09709fab16463ab7678eeba594f76a/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-accaa665e52d6041/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-c0619f1f61a80d72/payload.json)'
  - id: entityR1
    label: Approve ki 0.60 step
    notes: 'Approved the single-variable step ki 0.30 to 0.60 on the best raced design
      (score 140.28), since max_error stayed just above 0.06 with steering_oscillation
      under 0.25 in iteration 3. Feedback sets the next step (kd 0.40 or ki 1.0) by
      what the race shows.


      ### Feedback


      Decision: approve. The candidate is the best raced design (entityR2B, iteration
      3, score 140.28: kp 3.0, kd 0.30, ki 0.30, base_speed 1.5, sensor spread x =
      ±0.024 m, footprint 0.016 m) with one change, ki 0.30 to 0.60. The evidence
      supports a single-variable step. Iteration 3 showed that raising ki from 0.05
      to 0.30 improved the score and the oval finish count (1 to 3 of 20), with steering_oscillation
      still below 0.25 (oval 0.228, s-bend 0.231). Max_error stayed at 0.061 to 0.063
      m, just over the 0.06 m off-track floor, which is the case where the integral
      term is the stated lever. The candidate is valid: all values are inside the
      contract, the sensor weights are antisymmetric, and line_loss is last_direction.
      Its rationale correctly leaves kp at 3.0, since iteration 2 showed kp 3.5 lowered
      the score to 99.25. I make no claim about how this candidate will perform. Read
      the next race as follows. If steering_oscillation rises above about 0.25 on
      the s-bend or oval, the integral is overshooting on bends, so set kd to 0.40
      and keep ki 0.60. If max_error falls below 0.06 on some tracks but line_loss_events
      stay at 1 or more, the drift is reduced but bends still lose the line, so consider
      a single-step change in base_speed rather than more ki. If max_error stays above
      0.06 with no oscillation rise, ki 1.0 is the next step inside the contract range.


      ### Requested changes


      - If steering_oscillation rises above about 0.25 on the s-bend or oval after
      ki 0.60, set kd to 0.40 and keep ki at 0.60, since iteration 3 s-bend oscillation
      was already 0.231 at ki 0.30.

      - If max_error stays above 0.06 on the oval or s-bend with no oscillation rise,
      try ki 1.0 with kp 3.0 and kd 0.30, since iteration 3 max_error was 0.061 to
      0.063 and the drift looks like a steady bias.

      - Keep kp at 3.0 and do not raise it: iteration 2 showed kp 3.5 cut the oval
      finish count (1 to 0) and lowered the score from 124.80 to 99.25.


      - [Open this output](iteration-4/entityR1/versions/61cb111f5db34fb8b3c64ad3cb75e1c1/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/b285d40e631b415992e9e875702c7e39/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-0beb00cf8c62f48d/payload.json)'
