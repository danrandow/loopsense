map:
  id: race-140-opt-eval
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Slower base speed 1.3
    notes: 'Keeps the best raced design (iteration 6, score 372.74, kd 0.40) and tests
      base_speed 1.3 alone, to see whether slower corner entry lets the s-bend and
      slalom progress further. Oval finish time should still fit under 3 s with margin.


      ### Rationale


      Evidence: iteration 6 (kd 0.40, x = ±0.032 m, footprint 0.016 m, kp 3.0, ki
      0.30, base_speed 1.5, last_direction) is the best raced design, scoring 372.74,
      up from 201.98. Oval finished 19 of 20 with max_error 0.042 and 0.25 line-loss
      events. Its steering oscillation (0.285) is above the 0.25 warning level, but
      finishes rose sharply, so the extra damping is working and I keep kd 0.40. The
      approved-input feedback (entityR1) is written against iteration 5 (kd 0.30,
      score 201.98). It treats that as the best design and asks me to test base_speed
      1.3 only if kd 0.40 holds. That condition is met: oval finishes are 19 of 20,
      well above the 7 threshold, and the oscillation rise has not blocked completions.
      So the feedback''s next step applies.


      The remaining failures are the s-bend (progress 0.32, all 20 runs off track,
      max_error 0.062) and the slalom (progress 0.16, all 20 off track, max_error
      0.064). Both are corner-entry or speed-limited failures. Neither has been tested
      against speed at this sensor spread.


      Change: base_speed 1.5 to 1.3, a single-variable step. Everything else is held:
      kd 0.40, kp 3.0, ki 0.30, sensor x = ±0.032 m with antisymmetric weights (-1.6,
      -0.8, 0, 0.8, 1.6), footprint 0.016 m, mass 0.8 kg, and line_loss last_direction.


      Expected result: lower speed reduces lateral drift and line losses on the s-bend
      and slalom, so their progress rises. Oval completion time rises from about 1.87
      s to roughly 2.2 s, which still leaves margin under 3.0 s, so oval completions
      should hold near 19 of 20. The time term in the score falls slightly, so the
      net gain depends on how far the s-bend and slalom progress improves.


      Risks: if the slalom needs more speed to clear its length, slowing could lower
      its progress, and the oval could still be fine but score less per time. Hypotheses:
      H1, the s-bend and slalom off-track events come from entering bends too fast,
      so 1.3 lets them complete more of the course. H2, oval finish time still has
      enough margin at 1.3. Measurements wanted: per-track progress, finish count,
      max_error location, line-loss timing (bend or straight), steering_oscillation,
      and completion_time on the oval.


      Decision rule for next iteration: if s-bend or slalom progress rises and oval
      finishes stay at 19 or more, keep base_speed 1.3. If s-bend and slalom progress
      fall, or oval finishes drop below 15, return to base_speed 1.5 and test kp or
      kd 0.50 instead.


      - [Open this output](iteration-7/entity0/versions/167e0b674af440f69af43cd3dd56ff67/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-7074bbcebfa06154/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-f7cae73b14234a0e/payload.json)'
  - id: entityR1
    label: 'Approve: base_speed 1.3'
    notes: 'Approves the single-variable speed test (base_speed 1.5 to 1.3) on the
      best raced design (iteration 6, score 372.74, kd 0.40). Oval finishes rose to
      19 of 20 and line losses fell, so the damping step is supported, while the s-bend
      and slalom progress failures are the open question.


      ### Feedback


      Decision: approve. This candidate is the best raced design (iteration 6, score
      372.74: kd 0.40, kp 3.0, ki 0.30, base_speed 1.5, sensor x = ±0.032 m, footprint
      0.016 m, last_direction) with one change, base_speed 1.5 to 1.3. Iteration 6
      showed kd 0.40 raised oval finishes from 7 to 19 of 20 and cut oval line-loss
      events from 1.2 to 0.25, so the damping step worked. Its oval steering_oscillation
      of 0.285 is above the 0.25 warning level, but that is a jitter signal, not a
      completion failure, and finishes rose. My earlier conditional was only partly
      met: oscillation did not fall below 0.25, though finishes did not drop either.
      The speed test is still a clean single-variable step from the best design, and
      the s-bend (progress 0.32) and slalom (progress 0.16) failures are the main
      remaining losses. I make no claim about how it will perform. Read the race as
      follows. If s-bend or slalom progress rises and oval finishes stay at 19 or
      more, keep base_speed 1.3, then test kd 0.35 alone to reduce the oval oscillation
      of 0.285. If s-bend and slalom progress fall, or oval finishes drop below 15,
      return to base_speed 1.5 and test kd 0.50 with kp 3.0, since the damping direction
      has been the productive one so far. Keep kp at 3.0; kp 3.5 lowered the score
      in iteration 2.


      ### Requested changes


      - If s-bend or slalom progress rises above the iteration 6 values (0.32 and
      0.16) and oval finishes stay at 19 or more, keep base_speed 1.3 and test kd
      0.35 alone, since oval steering_oscillation was 0.285 at kd 0.40 (iteration
      6), above the 0.25 warning level.

      - If s-bend or slalom progress falls, or oval finishes drop below 15 of 20,
      return base_speed to 1.5 and test kd 0.50 with kp 3.0, ki 0.30 and x = ±0.032
      m, since kd 0.30 to 0.40 raised finishes from 7 to 19 (iteration 5 to 6).

      - Keep kp at 3.0 and ki at 0.30 in this step: kp 3.5 at the narrower spread
      (iteration 2, score 99.25) and ki 0.60 (iteration 4, score 103.99) both lowered
      the score, so they are not the lever to change here.


      - [Open this output](iteration-7/entityR1/versions/070fddf7582c43d19023519e4e589201/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/167e0b674af440f69af43cd3dd56ff67/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-f7cae73b14234a0e/payload.json)'
