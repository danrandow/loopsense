map:
  id: race-140-opt-eval
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Stiffer steering kp 3.5
    notes: 'Keeps the widened sensors and kd 0.30 from the 124.8 race and raises kp
      from 3.0 to 3.5. The evidence is 1 to 2 line-loss events per run and max_error
      still just above 0.06, as the Evaluator asked. Oscillation rose modestly, so
      kd is held until the result is seen.


      ### Rationale


      Evidence from the last race (entityR2A score 124.80, up from 57.10): the widened
      sensor spread (x = ±0.024 m), the 0.016 m footprint, kd 0.30 and base_speed
      1.5 helped. One of 60 runs finished, on the oval. Off-track is still the failure
      mode on all three tracks, and line losses persist: 1.1 per run on the oval,
      2.0 on the s-bend and 1.0 on the slalom. Max error is still about 0.061 to 0.063,
      just above the 0.06 m limit. Steering oscillation rose to 0.17 on the oval and
      0.23 on the s-bend, from 0.11 to 0.16 at baseline. That is a moderate rise,
      not a jump, so I am not reducing kd yet. The Evaluator''s stated next step applies:
      line losses are still present and max_error is still above 0.06, so raise kp
      from 3.0 to 3.5 with kd held at 0.30 and the widened spread kept. Stronger proportional
      steering should pull the robot back before the error reaches the line-loss threshold
      on bends. Speed stays at 1.5, because the oval finishes in about 1.87 s, so
      speed is not the binding constraint yet. Expected result: line_loss_events fall,
      max_error drops below 0.06 on at least some tracks, and completions rise on
      the oval and possibly the s-bend. Risk: oscillation may rise further. If it
      does, the next step is kd 0.2 before any change to kp. Hypotheses: H1, the drift
      on bends is proportional to the error and is cut by higher kp. H2, the remaining
      line losses happen on the tightest bends, where the signal is weakest. Measurements
      wanted next: per-track completion and progress, max_error and where it peaks,
      line-loss timing, and steering oscillation to judge the kp/kd balance.


      - [Open this output](iteration-2/entity0/versions/9f3509727e7849d79c857a3c5c78c934/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-cce8d72911fc510a/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-2d2c03ed8af7fa92/payload.json)'
  - id: entityR1
    label: Approve wider sensors
    notes: 'Approved the iteration 1 candidate: wider sensor spread (±0.024 m), 0.016
      m footprint, kd 0.3 and base_speed 1.5. It addresses the baseline''s line-loss
      drift (all 60 baseline runs went off track with 1 to 2 line-loss events). The
      race is needed to judge it; no outcome is claimed for it here.


      ### Feedback


      The baseline (entityR2B, iteration 0, score 57.10) finished 0 of 60 trials on
      all three tracks. Every run ended off track after 1 to 2 line-loss events, with
      max_error of about 0.063 to 0.065 m against the 0.06 m limit, and progress of
      only 0.12 to 0.16. Steering oscillation was low (0.11 to 0.16), so the failure
      is a steady drift away from the line rather than jitter. The candidate responds
      to this with three changes: wider sensor spread (x = ±0.024 m), a larger footprint
      (0.016 m), and kd raised from 0.15 to 0.30. Its base_speed falls from 1.6 to
      1.5. Those changes fit the evidence and the candidate is valid: the weights
      are antisymmetric, the sensor positions are inside the allowed range, and line_loss
      is last_direction. I have no measured result for it yet. The main risk is that
      1.5 is the minimum speed that can still finish in 3 s, so a completion may depend
      on the speed/time trade-off. This is early exploration with ten iterations left,
      and the candidate is a clear improvement in the direction the data points, so
      it should race now. After the race, check first whether line_loss_events fell
      from 1 to 2 per run. If max_error is still above 0.06 but line losses are down,
      raise kp in small steps (3.0 to 3.5) before touching speed. If the run finishes
      but completion_time is close to 3.0 s, raise base_speed in steps of 0.1 to 0.2.
      If oscillation rises after kd 0.3, go back toward kd 0.2.


      ### Requested changes


      - If line_loss_events are still 1 or more and max_error stays above 0.06, try
      kp 3.5 with kd 0.3, keeping the widened sensor spread, to cut the drift on bends.

      - If the run completes but completion_time is near 3.0 s, raise base_speed in
      steps of 0.1 to 0.2 (1.5 to 1.7), keeping kd 0.3 so the faster robot stays damped.

      - If steering_oscillation rises well above the baseline 0.11 to 0.16 after kd
      0.3, reduce kd to 0.2 before changing kp.


      - [Open this output](iteration-1/entityR1/versions/868f84e527504132b490dc1d2eb76965/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/2db669cc4f9a4b4aac3d7960757a3e56/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-13cf5bf3a72f3041/payload.json)'
