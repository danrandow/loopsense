map:
  id: race-140-opt-eval
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Iteration 1 + integral
    notes: 'Keeps the best raced design (iteration 1, score 124.80) and raises ki
      0.05 to 0.30 to cancel the steady motor-mismatch drift that keeps max_error
      at about 0.062. kp 3.5 is dropped because it scored 99.25 and raised oscillation
      and line losses.


      ### Rationale


      Evidence: the best raced design is iteration 1 (score 124.80): kp 3.0, kd 0.30,
      ki 0.05, base_speed 1.5, sensor spread x = ±0.024 m, footprint 0.016 m. Iteration
      2 raised kp to 3.5 and scored 99.25. That is a clear regression: oval finishes
      fell from 1 to 0, oval line-loss events rose from 1.1 to 1.7, and oval steering
      oscillation rose from 0.17 to 0.25. So kp 3.5 is rejected, and the Evaluator''s
      entityR1 feedback, which treats kp 3.5 as the 124.80 baseline, appears to have
      mixed up the two designs. Max_error is still about 0.061 to 0.064, just over
      the 0.06 m off-track limit. Body width cannot help: the limit is max(0.06, 0.0125
      + body_width/4), which stays at 0.06 for all allowed widths. Speed is not the
      binding constraint (the oval finish took 1.87 s). The failure is a steady drift
      off the line, not jitter. A plausible cause is the fixed left/right motor mismatch
      in the disturbance, which produces a steady bias that proportional action alone
      does not remove. Change: keep the iteration 1 design and raise ki from 0.05
      to 0.30, so the integral term can cancel the steady bias. The integral stays
      within its ±2 limit, and its contribution is small on bends. Expected result:
      max_error falls below 0.06 on some tracks and line_loss_events drop. Risk: the
      integral may overshoot on bends, which would show up as higher steering_oscillation.
      If oscillation rises above about 0.25, the next step is kd 0.40 with ki 0.30.
      If max_error is still above 0.06 with no oscillation rise, the next step is
      ki 0.6. Hypotheses: H1, the drift is a steady mismatch bias that integral action
      cancels. H2, kp 3.0 is near the best proportional gain, since 3.5 was worse.
      Measurements wanted next: per-track max_error and where it peaks, line-loss
      timing, steering_oscillation, and completion_time on the oval.


      - [Open this output](iteration-3/entity0/versions/1def60ca14ec467292a3aaa07021f408/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-9dd8b428258709c2/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-bf94a3138df302c9/payload.json)'
  - id: entityR1
    label: Approve kp 3.5 candidate
    notes: 'Approved the kp 3.0 to 3.5 step on the best raced design (score 124.80),
      keeping the widened spread, 0.016 m sensors, kd 0.30 and speed 1.5. Earlier
      telemetry showed persistent line losses (1.0 to 2.0 per run) and max_error of
      0.061 to 0.063 m, just above the 0.06 m limit.


      ### Feedback


      Decision: approve. This candidate is the baseline from entityR2A (score 124.80)
      with one targeted change: kp 3.0 to 3.5, with kd 0.30, the widened spread (x
      = ±0.024 m), the 0.016 m footprint and base_speed 1.5 all kept. The evidence
      is the earlier race: line_loss_events were 1.1 on the oval, 2.0 on the s-bend
      and 1.0 on the slalom, and max_error stayed at about 0.061 to 0.063 m, just
      over the 0.06 m limit. The change is valid (sensor positions, footprint and
      weights are inside the contract, and line_loss is last_direction) and is a small,
      reasoned step from the best raced design. I have no measured result for it,
      so I make no claim about how it will perform. Once it races, read the results
      as follows. If line losses fall and max_error drops below 0.06 on some tracks,
      keep kp 3.5 and look at the remaining off-track cases on the s-bend. If steering_oscillation
      rises well above the 0.17 (oval) and 0.23 (s-bend) seen in entityR2A, lower
      kd to 0.20 before changing kp. If max_error is still above 0.06 with no oscillation
      rise, try kp 4.0 next. If the oval completes with time well under 3.0 s, raise
      base_speed in steps of 0.1 to 0.2, since speed is not yet the binding limit.


      ### Requested changes


      - If steering_oscillation rises above about 0.25 on the s-bend or the oval after
      kp 3.5, set kd to 0.20 and keep kp at 3.5, because entityR2A oscillation was
      0.17 to 0.23 at kd 0.30.

      - If line_loss_events stay at 1 or more per run and max_error stays above 0.06,
      try kp 4.0 with kd 0.30, since kp 3.0 to 3.5 is the only change in this step.

      - If the oval completes with completion_time well under 3.0 s and progress reaches
      1, raise base_speed to 1.7 in one step, with kp and kd unchanged, because the
      one finish in entityR2A took 1.87 s.


      - [Open this output](iteration-2/entityR1/versions/3d8135e8fbac4f6f9af0c5de1525e6f9/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/9f3509727e7849d79c857a3c5c78c934/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-2d2c03ed8af7fa92/payload.json)'
