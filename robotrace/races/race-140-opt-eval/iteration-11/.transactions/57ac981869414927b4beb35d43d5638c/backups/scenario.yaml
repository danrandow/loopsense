  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: Revert to best (iter 6)
    notes: 'Reverts the outer sensors to ±0.032 m after the ±0.040 m test scored 267.93
      with oval finishes 10 of 20, so the candidate is the iteration 6 design (score
      372.74, 19 of 20 oval finishes). It is the best-evidenced design for the final
      unseen-track race.


      ### Rationale


      This is the final iteration, so the design I submit is the one scored on the
      unseen track. The evidence favours the iteration 6 design, which is the best
      raced candidate (score 372.74, 19 of 20 oval finishes, oval max_error 0.042,
      line losses 0.25). Iteration 10 raced the approved proposal: outer sensors at
      x = ±0.040 m. It scored 267.93, with oval finishes down from 19 to 10 and s-bend
      and slalom still off track in every run. The Evaluator''s rule was to keep ±0.040
      m only if oval finishes stayed at 17 or more and the score held at or above
      372.74. Neither condition holds, so I revert the outer sensors to x = ±0.032
      m. Every other value is also restored to iteration 6: kp 3.0, kd 0.40, ki 0.30,
      base_speed 1.5, footprint 0.016 m, antisymmetric weights (-1.6, -0.8, 0, 0.8,
      1.6), and line_loss last_direction. The earlier tests of kp 3.25, kd 0.50 and
      base_speed 1.3 all lowered the score, so I do not change them. This design has
      the most race evidence (60 trials). The expected result is about 19 of 20 oval
      finishes with a score near 370, although s-bend and slalom will probably still
      fail. The main uncertainty is generalisation to the unseen track, which I cannot
      measure from here. Measurements requested: per-track finish count, progress,
      max_error location, line-loss timing, steering_oscillation and oval completion_time.


      - [Open this output](iteration-11/entity0/versions/fb22d281262d42da964ef2aca955a237/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-9fc8f88b330a75ca/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-f777a349157ffff2/payload.json)'
  - id: entityR1
    label: Outer sensors to ±0.040 m
    notes: 'Single-variable step from the best raced design (iteration 6, score 372.74):
      outer sensors moved from ±0.032 m to ±0.040 m, with kp 3.0, kd 0.40 and ki 0.30
      restored after the kp 3.25 and kd 0.50 regressions. Approved because the spread
      has given the largest consistent gains so far, and the candidate is valid.


      ### Feedback


      Decision: approve. The candidate is the best raced design (iteration 6, score
      372.74: x = ±0.032 m, kp 3.0, kd 0.40, ki 0.30, base_speed 1.5, footprint 0.016
      m, last_direction) with one change, the two outer sensors moved from x = ±0.032
      m to ±0.040 m. The inner sensors stay at 0 and ±0.016 m, the weights stay antisymmetric
      at (-1.6, -0.8, 0, 0.8, 1.6), and every other field is held, so the step is
      single-variable. The evidence is the spread trend in earlier races: widening
      from ±0.016 to ±0.024 m raised the score from 103.99 region to 124.80 (iteration
      1 to 3 for the spread alone, with oval finishes rising), and widening from ±0.024
      to ±0.032 m raised oval finishes from 3 to 7 and cut s-bend line losses from
      2.0 to 1.05 (iteration 3 to 5). Iteration 9 showed kp 3.25 lowered the score
      to 306.17, so kp returns to 3.0. Iteration 8 showed kd 0.50 lowered the score
      to 352.73, so kd stays at 0.40. Iteration 7 showed base_speed 1.3 cut oval finishes
      to 7, so speed stays at 1.5. The candidate is valid: all positions are inside
      the ±0.08 m limit, the footprint is in the allowed set, and line_loss is last_direction.
      The main risk is that the outermost sensor sits 0.040 m from centre, close to
      the 0.06 m off-track limit, and that the weights give a weaker centre response,
      which could raise oscillation on the oval (already 0.285 at iteration 6). I
      make no claim about how it will perform. With one iteration after this one,
      racing now gives the telemetry needed for the final choice. Read the race as
      follows. If oval finishes stay at 17 or more and the score holds at or above
      372.74, keep ±0.040 m as the new best. If oval finishes fall below 17 or the
      score falls below 372.74, revert to ±0.032 m with kp 3.0 and kd 0.40, which
      is the safe fallback for the final evaluation. In either case, check whether
      s-bend and slalom line losses fell (the s-bend had 1.05 at ±0.032 m) and where
      max_error peaks.


      ### Requested changes


      - If the score holds at or above 372.74 with oval finishes of 17 or more, keep
      x = ±0.040 m for the outer sensors and test nothing else in that step, since
      widening has produced the largest consistent gains (iterations 0 to 5).

      - If oval finishes fall below 17 or the score falls below 372.74, revert the
      outer sensors to x = ±0.032 m with kp 3.0, kd 0.40, ki 0.30 and base_speed 1.5
      (iteration 6, score 372.74), since kp 3.25 (iteration 9) and kd 0.50 (iteration
      8) both lowered the score.

      - If steering_oscillation on the oval rises well above 0.29 (iteration 6 value)
      at ±0.040 m, try kd 0.45 with the same spread, because the extra damping at
      kd 0.30 to 0.40 is what raised oval finishes from 7 to 19 (iterations 5 to 6).


      - [Open this output](iteration-10/entityR1/versions/f53194cca8214d4e9b9c4fc25533c796/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/09742c7e040a4a0b9ce52cf6b29df555/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-54e89ce0654ada03/payload.json)'
