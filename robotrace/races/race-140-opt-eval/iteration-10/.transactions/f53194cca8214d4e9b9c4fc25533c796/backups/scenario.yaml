  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Outer sensors to ±0.040m
    notes: 'Reverts kp to 3.0 (kp 3.25 scored 306 with 13 oval finishes) and keeps
      kd 0.40, the best raced design (372.74). Only the outer sensors move from ±0.032
      to ±0.040 m, following the largest past gain from spread widening, and the fallback
      is the ±0.032 m design.


      ### Rationale


      Evidence. Iteration 9 (kp 3.25) scored 306.17, below the best raced design,
      iteration 6 (kp 3.0, kd 0.40, score 372.74). Oval finishes fell from 19 to 13
      of 20, and oval line-loss events and oscillation both rose. The s-bend and slalom
      still go off track in every run. The Evaluator''s rule applies: oval finishes
      below 17 or a score below 372.74 means reverting kp to 3.0 with kd 0.40. kp
      3.25 is rejected, so kp returns to 3.0.


      Change. Starting from the best raced design (kp 3.0, kd 0.40, ki 0.30, base_speed
      1.5, sensors at x = ±0.032 m), I move only the two outer sensors outward to
      x = ±0.040 m. The inner sensors stay at x = 0, ±0.016 m, and the weights stay
      antisymmetric at (-1.6, -0.8, 0, 0.8, 1.6). The widening from ±0.024 to ±0.032
      m was the largest single gain in this run (oval finishes 3 to 7, then 7 to 19
      with kd). The outer sensors give earlier warning before the line is lost on
      bends, which is where the s-bend and slalom fail.


      Expected result. Line-loss events fall on the s-bend and slalom, their progress
      rises above 0.32 and 0.16, and oval finishes hold at 17 or more of 20 with a
      score at or above 372.74.


      Risks. The outermost sensor sits 0.040 m from centre, which is close to the
      0.06 m off-track limit, and the weights may give a weaker centre response, so
      oscillation may rise. Oval finishes could drop.


      Decision rule for the next iteration. If the score is at or above 372.74 with
      oval finishes of 17 or more, keep ±0.040 m. If not, revert to the iteration
      6 design (x = ±0.032 m, kp 3.0, kd 0.40), which is the best raced design and
      the safe fallback for the final evaluation.


      Hypotheses. H1: the s-bend and slalom losses come from the line leaving the
      outer sensors'' reach on bends, and ±0.040 m extends that reach. H2: the oval
      keeps its finish rate at kd 0.40 because the inner geometry is unchanged.


      Measurements wanted: per-track finish count and progress, line-loss timing (bend
      or straight), max_error location, steering_oscillation on the oval, and oval
      completion_time.


      - [Open this output](iteration-10/entity0/versions/09742c7e040a4a0b9ce52cf6b29df555/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-cca53c6472b7690e/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-54e89ce0654ada03/payload.json)'
  - id: entityR1
    label: Evaluator Feedback
    notes: 'Evaluator Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Decision: approve. The candidate is the best raced design (iteration 6, score
      372.74: kd 0.40, kp 3.0, ki 0.30, base_speed 1.5, sensor x = ±0.032 m, footprint
      0.016 m) with one change, kp 3.0 to 3.25. That is a single-variable step, and
      the candidate correctly rejects the kd 0.50 result (iteration 8, score 352.73,
      oval finishes 18 of 20, s-bend progress down from 0.319 to 0.226). It also correctly
      keeps base_speed 1.5, since speed 1.3 cut oval finishes from 19 to 7 (iteration
      7). The evidence against kp is iteration 2 (kp 3.5, score 99.25), but that run
      used the narrower ±0.024 m spread, where line losses were already high. At ±0.032
      m the sensors give earlier warning, so a modest kp increase is a reasonable
      test. The candidate is valid: all values are inside the contract, the weights
      are antisymmetric, and line_loss is last_direction. I make no claim about how
      it will perform. Two iterations remain, so racing now gives the telemetry that
      matters most. Read the race as follows. If oval finishes stay at 17 or more
      and the score holds at or above 372.74, keep kp 3.25 as the new best. If oval
      finishes fall below 17, or the score falls below 372.74, revert to kp 3.0 with
      kd 0.40, which is the best raced design. In either case, the next lever is the
      outer sensor spread, since widening from ±0.024 to ±0.032 m was the largest
      single gain (oval finishes 3 to 7, s-bend line losses 2.0 to 1.05, iterations
      3 to 5). Keep kd 0.40 and ki 0.30 unless the race shows a clear reason to change
      them.


      ### Requested changes


      - Keep kp 3.25 only if oval finishes stay at 17 or more of 20 and the score
      holds at or above 372.74 (iteration 6). Otherwise revert kp to 3.0, since kp
      3.5 at the narrower spread (iteration 2, score 99.25) showed higher oval line-loss
      events.

      - Keep kd 0.40, ki 0.30 and base_speed 1.5 in this step. kd 0.50 lowered the
      score (iteration 8, 352.73, oval finishes 19 to 18), and base_speed 1.3 cut
      oval finishes from 19 to 7 (iteration 7).

      - If the score holds, the next single-variable test is the outer sensors at
      x = ±0.040 m with the best kp and kd, since widening from ±0.024 to ±0.032 m
      cut oval line losses from 1.7 to 1.2 and raised finishes from 3 to 7 (iterations
      3 to 5). Only test this if the race leaves at least two runs.


      - [Open this output](iteration-9/entityR1/versions/5c3faad72b1043c5b338d5bf14bb41fa/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/1cbfc6b779734513a2ae9c9fcbe0bcee/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-850dc006c2b8971b/payload.json)'
