  - id: entity0
    label: Balanced 4-sensor robot
    notes: 'Produced a robot with four evenly spaced sensors and moderate size for
      balanced line detection. Tuned PID gains for stable control and set line loss
      recovery to search left. This aims to improve generalization and reduce oscillations,
      supported by the chosen sensor layout and controller parameters.


      ### Rationale


      I designed a balanced robot with four sensors spread evenly across the front
      to improve line detection and reduce noise sensitivity. The sensor size is medium
      (0.012) to balance resolution and noise robustness. The wheel radius and track
      are moderate to provide stable turning and speed. Controller gains are tuned
      to moderate values (kp=0.9, ki=0.15, kd=0.05) to ensure responsive but stable
      control, avoiding oscillations. Sensor weights are set to negative on the left
      sensors and positive on the right sensors to steer correctly based on line position.
      The line loss strategy is set to ''search_left'' to recover effectively when
      the line is lost. This design aims to generalize well across different track
      shapes by balancing sensor coverage, control responsiveness, and recovery behavior.
      The requested measurements will confirm if the robot completes the track efficiently
      with low error and stable steering.


