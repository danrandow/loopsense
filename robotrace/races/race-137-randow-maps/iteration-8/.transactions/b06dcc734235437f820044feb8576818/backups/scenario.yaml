  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: 8 mm sensor footprint
    notes: 'Keeps the iteration 7 baseline (confirmed at 52.28 with s-bend progress
      0.148) and changes only sensor_size from 12 mm to 8 mm on the same five positions.
      Follows the Integrator''s decision rule (1) for testing footprint after the
      baseline is confirmed.


      ### Rationale


      The iteration 7 race confirmed the baseline. With wheel_radius 0.03 m and wheel_track
      0.12 m, s-bend progress recovered to 0.1476 and the score returned to 52.2757,
      matching iteration 0. The wheel change in iteration 6 therefore cost s-bend
      progress, and the Integrator''s decision rule (1) applies: keep the baseline
      dynamics. Line loss stayed at 1.0 per run on the s-bend and oval (1.1) and rose
      to 2.0 on the slalom, which is the same fixed-point pattern seen in every iteration
      since 0. Steering oscillation stayed low (0.085 to 0.137), so the robot is not
      jittering and the loss is not overshoot. Sensing span, forward offset, size
      at 16 mm, mass, wheel radius and track have all been varied without removing
      the loss. The one untested sensing lever on the same layout is sensor_size 0.008.
      Its footprint is sharper, so the reading changes from fully-covered to partly-covered
      sooner as the line moves, which may give an earlier warning before the tape
      leaves the sensors. Keeping five sensors at x -0.02 to +0.02 m and y 0.05 m,
      with mass 0.8 kg, isolates this one change. Expected result: line_loss_events
      at or below 1.0 per run, and progress at or above the baseline (oval about 0.138,
      s-bend about 0.148). This is a hypothesis, not a measured result. The main risk
      is that 8 mm sensors at 10 mm spacing leave 2 mm gaps, so a line that sits between
      two sensors may read low and cause extra loss on the slalom.


      - [Open this output](iteration-8/entity0/versions/1f6ea756c88d4f82834c4936a34b559e/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-afb8347570ee67ec/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-2906daecab67ff72/payload.json)'
  - id: entity1
    label: 8 mm sensor footprint
    notes: 'Tests sensor_size 0.008 m on the iteration 7 baseline, changing only the
      footprint and holding the controller fixed. Iterations 0 to 7 kept line loss
      at about 1.0 per run whatever else changed, so sensing resolution is the one
      untested lever on this layout.


      ### Rationale


      The Builder''s intent isolates one change against the iteration 7 baseline:
      sensor_size 0.012 to 0.008 m on the same five sensor positions (x -0.02 to +0.02
      m, y 0.05 m). Iterations 0 to 7 have shown that span, forward offset, mass,
      wheel radius and wheel track each leave line loss at about 1.0 per run, and
      steering oscillation has stayed at 0.07 to 0.14, so the robot is not jittering.
      Sensing has not yet been tested with a footprint smaller than 12 mm on this
      layout. A smaller footprint gives a sharper per-sensor reading, so the signal
      changes from covered to partly covered sooner as the line moves. The controller
      is kept identical to iteration 7 (kp 3.0, ki 0, kd 0.2, base_speed 1.6, weights
      [-1, -0.5, 0, 0.5, 1], line_loss last_direction) so any change is attributable
      to the footprint. Sensor weights are unchanged because the positions are unchanged.
      Risk: with 2 mm gaps between 8 mm footprints at 10 mm spacing, a line centred
      between two sensors may read low and raise line loss. The signal is normalised
      by the sum of readings, so a low sum is the main concern; the line-loss threshold
      is 0.05 on that sum. Expected, not measured: line_loss_events at or below 1.0
      per run on the s-bend and oval, slalom below 2.0, and progress at or above the
      iteration 7 baseline (oval about 0.138, s-bend about 0.148).


      - [Open this output](iteration-8/entity1/versions/9999461af9c940ca84812530cb0959d3/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/1f6ea756c88d4f82834c4936a34b559e/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-2906daecab67ff72/payload.json)'
  - id: entityR1
    label: 'Next: footprint, then'
    notes: 'Feedback gives two decision rules: keep 8 mm if line loss holds and progress
      does not fall, or return to 12 mm and test y 0.06 m if dropouts appear. It also
      requests a radius-only test if the loss persists. Evidence comes from iterations
      0 to 7.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Evidence:
      iteration 0 (five 12 mm sensors at x -0.02 to +0.02 m, y 0.05 m, mass 0.8, wheel_radius
      0.03, wheel_track 0.12) is still the best result at 52.28, with progress 0.138
      (oval) and 0.148 (s-bend) and 1.0 to 2.0 line-loss events per run. Iterations
      1 to 3 showed that widening to 16 mm sensors and moving them forward to y 0.03
      m lowered progress without removing the single loss. Iteration 7 confirmed the
      baseline at 52.28. Iteration 6 raised oval progress (0.1446) but lowered s-bend
      progress (0.135) with wheel_radius 0.035 and wheel_track 0.16. Steering oscillation
      has stayed between 0.07 and 0.14, so the loss is a line dropout at a fixed point,
      not jitter. Decision rules for the next race: (1) If line_loss_events stays
      at 1.0 per run and progress holds at or above the iteration 7 values, the 8
      mm footprint is safe. Keep it, and ask for per-track telemetry on where the
      loss occurs before making another geometry change. (2) If line loss rises above
      1.0, or the slalom loss rises above 2.0, the 2 mm gaps between footprints are
      causing dropouts. Return to sensor_size 0.012 and test the forward offset y
      0.06 m, which has not been tried and sits inside the contract range. (3) If
      progress falls below the baseline with no change in line loss, the footprint
      is not the problem, and the controller is the next suspect; return to sensor_size
      0.012.


      ### Requested changes


      - Set sensor_size to 0.008 m on the same five positions (x -0.02 to +0.02 m,
      y 0.05 m) with mass 0.8 kg, wheel_radius 0.03 m and wheel_track 0.12 m. Basis:
      iteration 7 baseline gave 1.0 line loss per run on oval and s-bend, and no earlier
      iteration has tested a footprint below 12 mm.

      - If line loss rises or dropouts appear, return sensor_size to 0.012 m and move
      sensor y from 0.05 to 0.06 m with the same x spacing. Basis: iteration 0 at
      y 0.05 m gave better progress than iteration 2 at y 0.03 m, so the forward offset
      is not yet tested beyond 0.05 m.

      - If line loss stays at 1.0 with the baseline sensing, test wheel_radius 0.035
      m with wheel_track 0.12 m, changing only the radius. Basis: iteration 6 changed
      radius and track together, raised oval progress to 0.1446, and lowered s-bend
      progress to 0.135, so it is unclear which change caused each effect.


      - [Open this output](iteration-8/entityR1/versions/9999461af9c940ca84812530cb0959d3/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/1f6ea756c88d4f82834c4936a34b559e/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-2906daecab67ff72/payload.json)'
