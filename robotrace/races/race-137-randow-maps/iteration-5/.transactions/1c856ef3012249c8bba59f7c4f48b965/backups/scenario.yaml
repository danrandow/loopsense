map:
  id: race-137-randow-maps
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Wider track 0.16 m test
    notes: 'Keeps the iteration 4 design (radius 0.035 m, 0.6 kg, 7 sensors at y 0.03
      m) and widens wheel_track from 0.14 to 0.16 m, the untested turn-authority lever.
      Radius 0.035 m left line loss at 1.0 per run, so this is the next step in the
      Integrator''s decision rules.


      ### Rationale


      Iterations 0 to 4 have now varied sensor span (4 cm and 6 cm), forward offset
      (y 0.05, 0.04, 0.03), mass (0.8, 0.7, 0.6 kg) and wheel radius (0.03, 0.035
      m). Line_loss_events stayed at about 1.0 per run in every case, and steering
      oscillation stayed between 0.07 and 0.14, so the robot is not jittering. Iteration
      4 is the decisive result. The integration rule for the case where line loss
      persists after the radius change says that wheel radius is not the limit and
      that turn authority is the next lever. Iteration 4 scored 46.77, above iteration
      3 (46.16) but below the best iteration 0 (52.28). The score is driven mainly
      by progress, which the sensing changes in iterations 1 to 3 reduced. I therefore
      keep the iteration 4 base (y 0.03, ±3 cm span, 16 mm sensors, mass 0.6 kg, radius
      0.035 m) and change one thing: wheel_track from 0.14 to 0.16 m. Track width
      sets the yaw rate per unit wheel-speed difference, so this is the untested turn-authority
      step that the Integrator''s rules name. Expected result: line_loss_events at
      or below 0.5 per run on the s-bend and slalom, max_error under 0.06 m, and progress
      above the iteration 4 values (oval 0.11, s-bend 0.1325, slalom 0.0971). If line
      loss still stays at 1.0, the cause is probably a fixed point on the course,
      such as the start or one bend, rather than geometry. The next step would then
      be to return toward the iteration 0 sensing (5 sensors, 12 mm, y 0.05), which
      gave the highest progress so far, and to request telemetry on where the loss
      occurs.


      - [Open this output](iteration-5/entity0/versions/0a578b15f86647d391926991a7265aad/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-fc6ce5a042b7397c/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-7351a78eccd243ce/payload.json)'
  - id: entity1
    label: Wheel radius 0.035 test
    notes: 'Single change from iteration 3: wheel_radius 0.03 to 0.035 m, with controller
      and sensing unchanged. This tests whether turn authority is the remaining line-loss
      cause, since sensing and mass changes left line loss at 1.0 per run.


      ### Rationale


      Iteration 3 (mass 0.6 kg, sensors at y 0.03 m, +/-3 cm span, 16 mm sensors)
      scored 46.16 and still lost the line once per run on all three tracks (oval
      1.0, s-bend 1.0, slalom 1.0). Max_error reached 0.061 to 0.064 m, which is the
      0.06 m off-track limit. Steering oscillation stayed low at 0.07 to 0.13, so
      the failure is line loss on bends, not jitter. Sensor span (iteration 1), sensor
      offset (iteration 2) and mass (iteration 3) have each left line loss at about
      1.0 per run, so the geometry''s sensing and inertia are not the limit. The Builder''s
      test is wheel_radius 0.03 to 0.035 m, with everything else held at iteration
      3. A larger radius gives more yaw rate per unit wheel-speed difference and more
      ground speed, which tests turn authority directly. I keep the controller identical
      to iteration 3 (kp 2.5, ki 0, kd 0.2, base_speed 1.5, last_direction recovery,
      weights scaled to x) so any change in line loss can be attributed to the wheel
      radius alone. base_speed 1.5 still gives a PWM base well within limits at the
      higher ground speed. Expected, not measured: fewer line-loss events on the s-bend
      and slalom, and completion_time falling toward 3 s.


      - [Open this output](iteration-4/entity1/versions/f65ae329efc84cde914e22b0d0fb56f8/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/4f401ed936554fddbaee6da84f0a8592/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-ec844bff45c028cb/payload.json)'
  - id: entityR1
    label: Turn authority next steps
    notes: 'Feedback written before the race: sensing and mass changes (iterations
      1 to 3) each left line loss at about 1.0 per run, so it recommends testing wheel
      radius, then wheel track, with decision rules for oscillation and persistent
      loss.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Evidence:
      iteration 0 (4 cm span, 12 mm sensors, y 0.05, mass 0.8) lost the line 1.0 to
      2.0 times per run. Iteration 1 (plus or minus 3 cm span, 16 mm, y 0.04, mass
      0.7) lost it 1.0 per run on every track. Iteration 2 (y 0.03) also stayed at
      1.0. Iteration 3 (mass 0.6) also stayed at 1.0, and its score fell from 47.85
      to 46.16, so lighter mass alone did not help. Steering oscillation stayed between
      0.07 and 0.14 throughout, so the robot is not jittering. Sensing and mass have
      now each been varied without removing the single bend loss, which points to
      turn authority or a fixed start-point failure. Decision rules for the next race:
      (1) If line_loss_events fall to 0.5 or less on the s-bend and slalom with max_error
      under 0.06 m, keep wheel_radius 0.035 and test wheel_track next (0.16 m) to
      see if more turn authority helps further. (2) If steering_oscillation rises
      above about 0.2 with the larger radius, the response is overshooting: return
      wheel_radius to 0.03 and keep mass at 0.6 kg. (3) If line_loss_events stay at
      1.0 per run with the larger radius, the wheel is not the limit; the next step
      is to look at where in the course the line is lost (start or a fixed bend) rather
      than at geometry.


      ### Requested changes


      - Set wheel_radius to 0.035 m with mass 0.6 kg, wheel_track 0.14 m and sensors
      at y 0.03 m with the plus or minus 3 cm span. Basis: iterations 0 to 3 showed
      that sensor span, forward offset and mass each leave line loss at about 1.0
      per run, so turn authority is the untested lever.

      - If line loss falls but still exceeds 0.5 per run, try wheel_track 0.16 m with
      wheel_radius 0.035 m. Basis: iteration 3 showed that mass reduction alone did
      not reduce line loss, and wheel_track sets the yaw rate per unit wheel-speed
      difference, so a wider track is the next turn-authority step.

      - If steering_oscillation exceeds about 0.2 at radius 0.035 m, return wheel_radius
      to 0.03 m and keep mass at 0.6 kg. Basis: oscillation was 0.07 to 0.14 across
      iterations 0 to 3, so there is room before jitter becomes a problem, but a larger
      radius raises ground speed and could cause overshoot.


      - [Open this output](iteration-4/entityR1/versions/f65ae329efc84cde914e22b0d0fb56f8/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/4f401ed936554fddbaee6da84f0a8592/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-ec844bff45c028cb/payload.json)'
