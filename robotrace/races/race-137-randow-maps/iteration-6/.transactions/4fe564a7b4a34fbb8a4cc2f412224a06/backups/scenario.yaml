overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iterations 0 to 5 varied one lever at a time: sensor span (4 cm and 6 cm), sensor
      size (12 mm and 16 mm), forward offset (y 0.05, 0.04, 0.03 m), mass (0.8, 0.7,
      0.6 kg), wheel radius (0.03 and 0.035 m) and wheel track (0.12, 0.14, 0.16 m).
      line_loss_events stayed at about 1.0 per run in every case after iteration 0,
      and steering_oscillation stayed between 0.07 and 0.14, so the robot is not jittering.
      The last two changes were close to neutral: radius 0.035 m (iteration 4) and
      track 0.16 m (iteration 5) gave near-identical per-track numbers (oval 45.2843
      to 45.2837, s-bend progress 0.1325 to 0.1321). Turn authority is therefore not
      the limit for the line loss. The score is driven mainly by progress (250 per
      unit progress). Progress was highest in iteration 0 (oval 0.138, s-bend 0.148)
      and fell once the sensors were widened to 16 mm and moved forward to 0.03 m
      (oval about 0.11, s-bend about 0.13). The line-loss term is worth only about
      15 points per event scaled by progress, so the progress loss is the bigger cost.
      The consistent single loss per run across every geometry suggests a fixed point
      on the course, not a geometry that can be tuned away. I therefore revert the
      sensing to the iteration 0 layout (five 12 mm sensors at x -0.02 to +0.02 m,
      y 0.05 m) and restore mass 0.8 kg, the best-scoring sensing and mass pairing.
      I keep wheel radius 0.035 m and wheel track 0.16 m, since they were neutral
      and keep the speed and yaw authority the Integrator has already tuned against.
      Expected result: progress recovers toward the iteration 0 values (about 0.14
      on the oval and 0.15 on the s-bend) and the score returns near 52, with line
      loss still about 1.0 per run. This is a hypothesis, not a measured result.


      - [Open this output](iteration-6/entity0/versions/a47a88d97ae1482d8a433a846eef84e6/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-82aedf7d54a88f40/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-2132aa6796631fa5/payload.json)'
  - id: entity1
    label: Wider track 0.16 m
    notes: 'Builder''s wheel_track 0.16 m on the iteration 4 base, with the controller
      held fixed to isolate turn authority. Built because line loss stayed at 1.0
      per run through all sensing, mass and radius changes.


      ### Rationale


      Iteration 4 (wheel_radius 0.035, all else as iteration 3) left line_loss_events
      at 1.0 per run on oval, s-bend and slalom, and scored 46.77. Sensor span, forward
      offset, mass and wheel radius have each left the single bend loss unchanged,
      so the remaining untested turn-authority lever is wheel_track. This package
      follows the Builder''s proposal exactly: wheel_track 0.16 m, with the iteration
      4 base (seven 16 mm sensors at y 0.03 m across ±3 cm, mass 0.6 kg, wheel_radius
      0.035 m). The controller is held identical to iterations 1 to 4 (kp 2.5, ki
      0, kd 0.2, base_speed 1.5, last_direction, weights scaled to x) so any change
      in line loss can be attributed to the track width alone. The wider track gives
      more yaw rate per unit wheel-speed difference, so the same controller should
      correct the bends with less saturation. Expected, not measured: line-loss events
      at or below 0.5 per run on s-bend and slalom, max_error under 0.06 m, progress
      above the iteration 4 values.


      - [Open this output](iteration-5/entity1/versions/1c856ef3012249c8bba59f7c4f48b965/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/0a578b15f86647d391926991a7265aad/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-7351a78eccd243ce/payload.json)'
  - id: entityR1
    label: Track test and fallback
    notes: 'Feedback written before the race: keep wheel_track 0.16 m if line loss
      drops, otherwise revert to the iteration 0 sensing that scored best (52.28).
      Evidence is the 1.0-per-run line loss across iterations 1 to 4.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Evidence:
      iteration 0 (4 cm span, 12 mm sensors, y 0.05, mass 0.8) lost the line 1.0 to
      2.0 times per run and scored 52.28, the best so far. Iterations 1 to 4 each
      changed one lever (span, forward offset y 0.04 to 0.03, mass 0.7 to 0.6 kg,
      wheel_radius 0.03 to 0.035 m), and line_loss_events stayed at 1.0 per run on
      all three tracks in every case. Steering oscillation stayed between 0.07 and
      0.14, so the robot is not jittering. Progress has been the main driver of score,
      and the iteration 1 to 4 sensing and dynamics changes lowered it on the oval
      and s-bend. Because wheel_track 0.16 m is the last untested turn-authority lever,
      the Integrator built it with the controller held fixed. Decision rules for the
      next race: (1) If line_loss_events fall to 0.5 or below on s-bend and slalom
      and max_error stays under 0.06 m, keep wheel_track 0.16 m and check whether
      progress rises above the iteration 4 values. (2) If steering_oscillation rises
      above about 0.2, the wider track is overshooting; return wheel_track to 0.14
      m. (3) If line_loss_events stay at 1.0 per run, geometry is not the limit for
      this loss. Return to the iteration 0 sensing (5 sensors, 12 mm, y 0.05 m, span
      ±2 cm), which gave the best score, and look for a fixed point on the course.


      ### Requested changes


      - Keep wheel_track at 0.16 m with wheel_radius 0.035 m, mass 0.6 kg and the
      seven-sensor ±3 cm, y 0.03 m, 16 mm layout. Basis: iterations 1 to 4 left line
      loss at 1.0 per run under every sensing, mass and radius change, so track width
      is the remaining turn-authority test.

      - If line loss persists at 1.0 with wheel_track 0.16 m, revert the sensing to
      the iteration 0 layout (five 12 mm sensors at x -0.02 to +0.02, y 0.05 m) with
      mass 0.8 kg. Basis: iteration 0 scored 52.28, the best result, with the same
      1.0 to 2.0 line-loss pattern, and the progress gap in later iterations has come
      from the sensing changes.

      - If steering_oscillation rises above about 0.2 at wheel_track 0.16 m, try wheel_track
      0.14 m again with mass 0.6 kg. Basis: oscillation was 0.07 to 0.14 across iterations
      0 to 4, so there is room, but a wider track increases yaw rate and could overshoot.


      - [Open this output](iteration-5/entityR1/versions/1c856ef3012249c8bba59f7c4f48b965/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/0a578b15f86647d391926991a7265aad/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-7351a78eccd243ce/payload.json)'
