  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Sensors 3 cm forward
    notes: 'Keeps the iteration 1 wide span and sensor size, and moves the sensor
      row forward from y = 0.04 to 0.03 m, a single change. Iteration 1 kept line
      loss near 1 per run and max_error at the 0.06 m limit, so this tests the sensing
      lag that the Integrator''s decision rule points to.


      ### Rationale


      Iteration 1 widened the sensor span to ±3 cm with 16 mm sensors, and the race
      did not fix line loss. Line-loss events were about 1.0 per run on all three
      tracks, down from 1.0 to 2.0 in iteration 0, and only the slalom improved. Progress
      fell on the oval (0.14 to 0.11) and s-bend (0.15 to 0.135), and max_error still
      reached the 0.06 m off-track limit on every track. The score dropped from 52.28
      to 47.54. Steering oscillation stayed low (0.07 to 0.13), so the robot is not
      jittering. It is losing the line on bends where the sensors see the tape late.
      The Integrator''s decision rule (2) applies: with the wide span still losing
      the line, the span is not the main limit. The remaining lever on the geometry
      is the forward sensor offset, which sets how far ahead of the axle the controller
      sees the line and so how much lag it carries. I keep the span, sensor size,
      wheel track, mass, wheel radius and body unchanged, and move the sensor row
      from y = 0.04 m to y = 0.03 m. This is a single change, so any effect on line
      loss can be attributed to it. I expect line-loss events to fall toward 0.5 or
      less per run on the s-bend and slalom, and max_error to drop below 0.06 m on
      at least one track. This is a hypothesis, not a measured result. If line loss
      persists at y = 0.03, the next step is to test a higher kd on the Integrator
      side, since the sensor span is not the limit.


      - [Open this output](iteration-2/entity0/versions/22cd3daf7b4c4205899505c0709a9637/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-4e3354fa384fdb09/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-7e5b6f69a67234a9/payload.json)'
  - id: entity1
    label: Sensors forward to y=0.03
    notes: 'Single-change package: the Builder''s y=0.03 m offset on the iteration
      1 geometry, with the controller held fixed to isolate the effect. Iteration
      1 lost the line about once per run on every track, so sensing lag is the target.


      ### Rationale


      Iteration 1 widened the sensor span to ±3 cm and lost the line about once per
      run on all three tracks (oval 1.0, s-bend 1.0, slalom 1.0). Max_error still
      reached the 0.06 m limit (0.0625 to 0.0678), and progress fell on the oval and
      s-bend. Steering oscillation stayed low (0.07 to 0.13), so the failure is sensing
      lag on bends, not jitter. The Builder''s proposal makes one change: sensor y
      moves from 0.04 to 0.03 m, with x, sensor_size, wheel track, mass and wheel
      radius unchanged. I keep the controller identical to iteration 1 (kp 2.5, ki
      0, kd 0.2, base_speed 1.5, same weights) so any change in line loss can be attributed
      to the offset alone. The weights still scale with x, so no retune of the signal
      is needed. The new y is within the contract range (-0.06 to 0.08). Expected,
      not measured: line-loss events fall on the s-bend and slalom, and max_error
      stays under 0.06 m for longer. If kd or the weights need changing, that is the
      next iteration''s decision, based on the race telemetry.


      - [Open this output](iteration-2/entity1/versions/2cb19e66340a458b9e99e9d3b409a133/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/22cd3daf7b4c4205899505c0709a9637/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-7e5b6f69a67234a9/payload.json)'
  - id: entityR1
    label: Offset test feedback
    notes: 'Feedback written before the race, citing iteration 1 line loss of about
      1.0 per run and low oscillation (0.07 to 0.13). It gives decision rules for
      the next race and three requested changes tied to that evidence.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Iteration
      1 (widened ±3 cm, 16 mm sensors, y=0.04) showed line loss of about 1.0 per run
      on oval, s-bend and slalom, with max_error at 0.0625 to 0.0678, so the wider
      span did not remove line loss (iteration 0 had 1.0 to 2.0). Steering oscillation
      stayed low (0.07 to 0.13), so the robot is losing the line on bends, not jittering.
      The Integrator kept the controller at kp 2.5, kd 0.2 and base_speed 1.5 so this
      change is isolated. Decision rules for the next race: (1) If line_loss_events
      fall to 0.5 or less on the s-bend and slalom, and max_error stays under 0.06
      m, keep y=0.03 and then test whether a further change is needed. (2) If steering_oscillation
      rises clearly above the iteration 1 range (about 0.13 to 0.2) with the shorter
      offset, move y back toward 0.035 m. (3) If line_loss_events stay near 1.0 per
      run at y=0.03, the offset is not the limit. Then test a mass or wheel change,
      not a narrower span, because iteration 0 (4 cm span, y=0.05) also lost the line.


      ### Requested changes


      - Keep sensor y at 0.03 m with the ±3 cm span, 10 mm spacing and 16 mm sensors.
      Basis: iteration 1 kept line loss near 1.0 per run at y=0.04, so the forward
      offset is the remaining sensing lever.

      - If steering_oscillation rises above about 0.2 at y=0.03, try y=0.035 m. Basis:
      iteration 1 oscillation was 0.07 to 0.13, so there is room before jitter becomes
      a problem.

      - If line_loss_events remain near 1.0 per run at y=0.03, try mass 0.6 kg with
      wheel_track 0.14 m. Basis: iterations 0 and 1 both lost the line on bends with
      mass 0.8 and 0.7 kg, and this is the next untested dynamics lever.


      - [Open this output](iteration-2/entityR1/versions/2cb19e66340a458b9e99e9d3b409a133/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/22cd3daf7b4c4205899505c0709a9637/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-7e5b6f69a67234a9/payload.json)'
