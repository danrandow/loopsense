map:
  id: race-137-randow-maps
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Revert to iter-0 dynamics
    notes: 'Keeps the iteration 0 sensing and mass but reverts wheel radius to 0.03
      m and track to 0.12 m, because iteration 6 recovered oval progress but lost
      s-bend progress (0.135 vs 0.148). Evidence: iteration 6 scored 51.63 with line
      loss still at about 1.0 per run, which points to a fixed point on the course
      rather than a geometry limit.


      ### Rationale


      Iteration 6 restored the iteration 0 sensing (five 12 mm sensors, x -0.02 to
      +0.02 m, y 0.05 m, mass 0.8 kg) and kept wheel_radius 0.035 m and wheel_track
      0.16 m. It scored 51.63, close to the best of 52.28. Oval progress recovered
      to 0.1446 from 0.138, which supports the sensing as the driver of the earlier
      progress loss. S-bend progress stayed lower at 0.135 against 0.1476 in iteration
      0, and it is the only track where the dynamics changed without a gain. Line_loss_events
      stayed at 1.0 on s-bend and slalom and 1.2 on oval, so the loss is still a fixed
      point and no geometry change has removed it. Steering oscillation stayed low
      at 0.09 to 0.13, so the robot is not jittering. Following the Integrator''s
      decision rule (2), I revert wheel_radius to 0.03 m and wheel_track to 0.12 m,
      the iteration 0 values that gave the best s-bend progress, and keep the iteration
      0 sensing and mass. I expect a score near 52.3 with line loss still at about
      1.0 per run. This run is a confirmation of the iteration 0 baseline, and the
      telemetry requested will show where on the course the single loss occurs, which
      is the next thing to learn.


      - [Open this output](iteration-7/entity0/versions/fcfcaa16f012434698333c6cadd80ad3/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-b944ede6ba7824f8/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-dff42ffb353c6b3b/payload.json)'
  - id: entity1
    label: Baseline restore, iter 0
    notes: 'Restores the iteration 0 geometry (five 12 mm sensors, mass 0.8, wheel
      0.03/0.12) and pairs it with the iteration 0 controller. This is a clean confirmation
      of the best-scoring baseline (52.28), since iteration 6 changed the wheel values
      and lost s-bend progress.


      ### Rationale


      The Builder''s intent restores the iteration 0 baseline geometry: five 12 mm
      sensors at x -0.02 to +0.02 m, y 0.05 m, mass 0.8 kg, wheel_radius 0.03 m and
      wheel_track 0.12 m. Iteration 0 is the best score so far (52.28), with the highest
      s-bend progress (0.1476) of any run. Iteration 6 used the same sensing and mass
      with wheel_radius 0.035 and wheel_track 0.16, and scored 51.63. Its oval progress
      rose to 0.1446 but its s-bend progress fell to 0.135, so the wheel change looks
      like a trade-off rather than a clear gain. Line_loss_events have been about
      1.0 per run in every iteration since iteration 0, and steering oscillation stayed
      low (0.07 to 0.14), so the robot is losing the line once per run, not jittering.
      The controller is therefore kept exactly as iteration 0 (kp 3.0, ki 0, kd 0.2,
      base_speed 1.6, weights -1, -0.5, 0, 0.5, 1, last_direction). That pairing fits
      the 5-sensor layout, and it was the one that produced the best progress. Changing
      the controller in the same run would add a second untested change, so this run
      is a clean confirmation of the baseline. Expected, not measured: score near
      52, oval progress about 0.14, s-bend progress about 0.15, and line_loss_events
      still about 1.0 per run.


      - [Open this output](iteration-7/entity1/versions/b3645f746f644567b7ce142a83cbd6b7/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/fcfcaa16f012434698333c6cadd80ad3/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-dff42ffb353c6b3b/payload.json)'
  - id: entityR1
    label: Wheel-change trade-off
    notes: 'Reads iteration 0 against iteration 6 as a trade-off: the larger wheel
      radius and track raised oval progress but lowered s-bend progress. Gives decision
      rules and three changes to test, all tied to those earlier results.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Evidence:
      iteration 0 (five 12 mm sensors at x ±0.02 m, y 0.05 m, mass 0.8, wheel_radius
      0.03, wheel_track 0.12) scored 52.28, the best so far, with progress 0.138 (oval)
      and 0.148 (s-bend) and 1.0 to 2.0 line-loss events per run. Iteration 6 kept
      the same sensing and mass but set wheel_radius 0.035 and wheel_track 0.16. It
      scored 51.63, with oval progress 0.145 and s-bend progress 0.135. So the wheel
      change raised oval progress and lowered s-bend progress. Iterations 1 to 3 widened
      the sensing and lowered mass, and every one of them left line loss at 1.0 per
      run with lower progress. Steering oscillation has stayed between 0.07 and 0.14,
      so the robot is not jittering. Decision rules for the next race: (1) If s-bend
      progress returns to about 0.148 and line_loss_events stays at 1.0, the wheel
      change caused the s-bend loss, so keep wheel_radius 0.03 and wheel_track 0.12.
      Then test the sensor footprint on the same five positions. (2) If s-bend progress
      stays near 0.135 with wheel_radius 0.03 and wheel_track 0.12, the sensing is
      the cause, and the next test should be per-track telemetry on where the single
      loss occurs. (3) If steering_oscillation rises above about 0.2, the baseline
      is overshooting, so reduce kp before changing geometry.


      ### Requested changes


      - Keep wheel_radius 0.03 m and wheel_track 0.12 m with the iteration 0 sensing
      (five 12 mm sensors at x -0.02 to +0.02 m, y 0.05 m) and mass 0.8 kg, if the
      s-bend progress recovers to about 0.148. Basis: iteration 0 gave the best s-bend
      progress, and iteration 6 lost about 0.013 of it with the larger radius and
      track.

      - If line_loss_events stays at 1.0 per run with the baseline sensing, test sensor_size
      0.008 on the same five positions. Basis: no iteration has tested an 8 mm footprint,
      and a smaller footprint gives a sharper line-position signal. Test this only
      after the baseline result is confirmed.

      - If the oval progress gain from iteration 6 is needed, test wheel_radius 0.035
      m with wheel_track 0.12 m, leaving the track at baseline. Basis: iteration 6
      raised oval progress to 0.1446 with both wheel values changed, and it is unclear
      which one caused the gain or the s-bend loss.


      - [Open this output](iteration-7/entityR1/versions/b3645f746f644567b7ce142a83cbd6b7/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/fcfcaa16f012434698333c6cadd80ad3/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-dff42ffb353c6b3b/payload.json)'
