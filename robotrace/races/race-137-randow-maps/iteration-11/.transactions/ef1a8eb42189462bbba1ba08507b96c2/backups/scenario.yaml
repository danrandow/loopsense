  entities:
  - id: entity0
    label: 'Final: best-measured y'
    notes: 'Commits the iteration 9/10 geometry (five 12 mm sensors at y 0.06 m, baseline
      dynamics), which scored 52.985 and reproduced exactly in iteration 10. Untested
      offsets such as y 0.055 m were not adopted, because no race evidence remains
      for the unseen final track.


      ### Rationale


      The race evidence points to the forward sensor offset as the one geometry lever
      that moved the score. Iteration 9 (five 12 mm sensors at x -0.02 to +0.02 m,
      y 0.06 m) scored 52.985, the best measured result. Oval progress rose from 0.138
      (y 0.05 m) to 0.151 and oval score from 56.25 to 62.77. S-bend progress fell
      from 0.148 to 0.140, and s-bend score fell from 61.01 to 57.74. Slalom was unchanged
      at progress 0.097 with 2.0 line-loss events. Iteration 10 reproduced 52.985
      exactly, which confirms the result is stable across the reruns. Line loss stayed
      at about 1.0 per run on oval and s-bend, and steering oscillation stayed at
      0.10 to 0.14, so the robot is not jittering. The loss is a single dropout at
      a fixed point, and no sensing, mass, wheel radius or wheel track change in iterations
      1 to 8 removed it. Those levers all lowered progress or left it unchanged. The
      8 mm footprint (iteration 8) and 16 mm footprints with wider spans (iterations
      1 to 3) are rejected, so 12 mm is the footprint to keep. Wheel radius 0.035
      and track 0.16 (iteration 6) raised oval progress but cost s-bend progress,
      so the baseline dynamics stay. The unseen final track is of a different shape
      and I have no race evidence for it, so I do not interpolate to an untested offset
      such as y 0.055 m, which might lose the measured oval gain. I keep the measured
      best design (y 0.06 m) for this iteration and the final race. Expected result:
      about 52.99, with oval progress near 0.151, s-bend near 0.140 and line loss
      at 1.0 per run on oval and s-bend.


      - [Open this output](iteration-11/entity0/versions/a02ef94ed2c54c15928aed268e6f8399/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-d8fbad47f53a30d9/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-4aaa78c19c23ba42/payload.json)'
  - id: entity1
    label: 'Final: best measured'
    notes: 'Commits the iteration 9 geometry (12 mm sensors at y 0.06 m) with its
      paired controller, unchanged. This is the best measured result, 52.985, reproduced
      in iteration 10; no untested change is made for the unseen track.


      ### Rationale


      Iteration 9 is the best measured design (52.985), reproduced exactly in iteration
      10. Moving the five 12 mm sensors from y 0.05 to 0.06 m raised oval progress
      from 0.138 to 0.151 and oval score from 56.25 to 62.77. S-bend progress fell
      from 0.148 to 0.140, and slalom was unchanged at 0.097. Line loss stayed at
      one event per run on oval and s-bend and at two on slalom. Steering oscillation
      stayed between 0.10 and 0.14, so the robot is not jittering. Because this is
      the final iteration and the unseen track has no race evidence, I commit the
      measured best design and keep its paired controller unchanged. I do not interpolate
      to y 0.055 m, since an untested offset could lose the measured oval gain. Geometry
      and controller are therefore identical to iteration 9, and the expected result
      is about 52.99.


      - [Open this output](iteration-11/entity1/versions/2e72ad67f9004748a6364b37295db1da/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/a02ef94ed2c54c15928aed268e6f8399/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-4aaa78c19c23ba42/payload.json)'
  - id: entityR1
    label: Feedback on final design
    notes: 'Feedback written before the final race, stating no outcome for the candidate.
      It cites iterations 0, 8, 9 and 10 for the offset trade-off and the footprint
      result, with decision rules for the Builder''s record.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. The candidate
      is the measured best design, iteration 9 geometry at y 0.06 m, with the controller
      unchanged. Evidence: iteration 9 and its repeat in iteration 10 both scored
      52.985. Moving sensors from y 0.05 to 0.06 m raised oval progress (0.138 to
      0.151) and lowered s-bend progress (0.148 to 0.140). Line loss stayed at one
      per run on oval and s-bend, and steering oscillation stayed between 0.10 and
      0.14. Iteration 8 showed that an 8 mm footprint lowers progress, so 12 mm stays.
      Decision rules: (1) If the s-bend loss stays at its current point and oscillation
      stays below about 0.2, the offset gain holds and any intermediate offset is
      a trade-off to weigh, not a clear gain. (2) If oscillation rises above about
      0.2, the forward lead is causing lag-driven overshoot, and the offset is at
      its limit. (3) Because this is the final iteration, no further geometry change
      can be raced, so these rules are for the Builder''s record only.


      ### Requested changes


      - Keep five 12 mm sensors at x -0.02 to +0.02 m with y 0.06 m, wheel_radius
      0.03 m, wheel_track 0.12 m and mass 0.8 kg. Basis: iteration 9 gave the best
      score (52.985) with oval progress 0.151 against 0.138 at y 0.05 m, and loss
      stayed at one event per run.

      - If a future race is run on this geometry, test sensor y 0.055 m with everything
      else unchanged. Basis: y 0.05 m gave s-bend progress 0.148 (iteration 0) and
      y 0.06 m gave 0.140 (iteration 9), so an intermediate offset may recover some
      s-bend progress while keeping part of the oval gain.

      - If steering_oscillation exceeds about 0.2 at y 0.06 m, return sensor y to
      0.05 m. Basis: oscillation was 0.07 to 0.14 across iterations 0 to 10, so a
      jump above 0.2 would show lag-driven overshoot.


      - [Open this output](iteration-11/entityR1/versions/2e72ad67f9004748a6364b37295db1da/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/a02ef94ed2c54c15928aed268e6f8399/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-4aaa78c19c23ba42/payload.json)'
