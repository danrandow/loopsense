map:
  id: race-137-randow-maps
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Lighter mass 0.6 kg test
    notes: 'Keeps the iteration 2 sensing (y=0.03, ±3 cm span) and changes only mass
      from 0.7 to 0.6 kg to test whether the single line loss per run is a dynamics
      limit. Iteration 2 showed line loss still at 1.0 per run after the offset change,
      so the offset is no longer the lever. The rationale and expected result are
      in the rationale field.


      ### Rationale


      Iteration 2 moved the sensor row from y=0.04 to y=0.03 m with the same ±3 cm,
      16 mm, 10 mm-spacing layout. Score rose only from 47.54 to 47.85. Line_loss_events
      stayed at exactly 1.0 per run on oval, s-bend and slalom, and max_error stayed
      at about 0.061 to 0.066, so every run still left the track. Steering oscillation
      stayed low (0.07 to 0.13), so the robot is not jittering. It loses the line
      once per run, at the bends, even though the sensors now sit closer to the axle.
      Iterations 0, 1 and 2 have all shown the same pattern: changing the sensor span
      or the forward offset did not remove the single line loss. The decision rule
      from the Integrator''s feedback therefore applies: if line loss stays near 1.0
      per run at y=0.03, the offset is not the limit, and the next untested lever
      is dynamics. I keep the sensing fixed (y=0.03, ±0.03 m span, 7 sensors at 10
      mm spacing, 16 mm footprints) so the result can be attributed to one change.
      I reduce mass from 0.7 to 0.6 kg and keep wheel_track at 0.14 m. Yaw inertia
      is mass*(L^2+W^2)/12, so a lighter robot turns more readily for the same wheel-speed
      difference, and the wheels keep the same turn authority. I expect line_loss_events
      to fall below 1.0 per run on the s-bend and slalom, and max_error to stay under
      0.06 m for longer. This is a hypothesis, not a measured result. Body width and
      body length are unchanged, because the off-track floor stays at 0.06 m for any
      body width in range. The main risk is that lighter mass with the same wheels
      could raise speed-related overshoot, which the Integrator''s feedback should
      show.


      - [Open this output](iteration-3/entity0/versions/ede92771406145e288d205b45d33d83c/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-c6e36684005e2678/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-dc9ed57a167bed57/payload.json)'
  - id: entity1
    label: Lighter robot, 0.6 kg
    notes: 'Single dynamics change from iteration 2: mass 0.7 to 0.6 kg, with sensing
      and controller held fixed. Sensing changes in iterations 1 and 2 each left line
      loss at about 1.0 per run, which motivates testing mass next.


      ### Rationale


      Iteration 2 showed that moving the sensors from y=0.04 to y=0.03 m left line
      loss at 1.0 per run on oval, s-bend and slalom (score 47.85). Iteration 1 showed
      that widening the span to ±3 cm did not remove it either. Sensing has now been
      changed twice without effect, and steering oscillation stayed low (0.07 to 0.13),
      so the robot is losing the line on bends, not jittering. Following the decision
      rule in the Builder''s feedback, this iteration tests the dynamics lever: mass
      drops from 0.7 to 0.6 kg, with the sensor row, span, sensor size, wheel_track
      and wheel_radius unchanged. Yaw inertia scales with mass, so the lighter robot
      should turn more readily for the same wheel-speed difference. The controller
      is held identical to iteration 2 (kp 2.5, ki 0, kd 0.2, base_speed 1.5, last_direction
      recovery, weights scaled to x), so any change in line loss can be attributed
      to mass. I expect line-loss events below 1.0 per run on the s-bend and slalom.
      This is a hypothesis, not a measured result. Speed is not reduced, because a
      3 s finish needs about 1.5 m/s average and the robot has not yet finished any
      run.


      - [Open this output](iteration-3/entity1/versions/03af8c5c84294a4ca91bedc432a4b605/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/ede92771406145e288d205b45d33d83c/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-dc9ed57a167bed57/payload.json)'
  - id: entityR1
    label: Mass first, then wheels
    notes: 'Requests mass 0.6 kg with the sensing fixed, then a wheel-radius change
      if line loss persists. Rests on iterations 0 to 2, where span and forward offset
      left line loss near 1.0 per run.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Evidence:
      iteration 0 (4 cm span, 12 mm sensors, y=0.05, mass 0.8) lost the line 1.0 to
      2.0 times per run. Iteration 1 (±3 cm span, 16 mm sensors, y=0.04, mass 0.7)
      lost it about 1.0 per run on all tracks. Iteration 2 (same, y=0.03) also stayed
      at 1.0 per run, with steering oscillation between 0.07 and 0.13. So the span
      and forward offset are not the limit. I held the controller fixed (kp 2.5, kd
      0.2, base_speed 1.5) so this change is isolated. Decision rules for the next
      race: (1) If line_loss_events fall to 0.5 or less on the s-bend and slalom and
      max_error stays under 0.06 m, keep mass at 0.6 kg and check whether completion_time
      is approaching 3 s. (2) If steering_oscillation rises above about 0.2 with the
      lighter robot, the response is overshooting; return to mass 0.7 kg and try y=0.035
      m. (3) If line_loss_events stay near 1.0 per run at 0.6 kg, the next test is
      a wheel change, not a sensing change. Check wheel slip on starts before raising
      wheel_track further.


      ### Requested changes


      - Keep mass at 0.6 kg with wheel_track 0.14 m and sensors at y=0.03 m with the
      ±3 cm span. Basis: iteration 2 kept line loss at 1.0 per run at 0.7 kg, and
      mass is the untested dynamics lever.

      - If line loss persists at 0.6 kg, change wheel_radius from 0.03 to 0.035 m
      with mass 0.6 kg. Basis: iterations 0 to 2 showed sensor span and offset do
      not remove the single bend loss, so turn authority is the next lever.

      - If steering_oscillation exceeds about 0.2 at 0.6 kg, return to mass 0.7 kg
      and move sensor y to 0.035 m. Basis: iteration 2 oscillation was 0.07 to 0.13
      at y=0.03, so there is room before jitter becomes a problem.


      - [Open this output](iteration-3/entityR1/versions/03af8c5c84294a4ca91bedc432a4b605/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/ede92771406145e288d205b45d33d83c/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-dc9ed57a167bed57/payload.json)'
