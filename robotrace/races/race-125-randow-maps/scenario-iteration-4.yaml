  id: race-125-randow-maps
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: 20mm pitch, 0.10m track
    notes: 'Widens the 16 mm sensor array to 20 mm pitch (x ±0.06 m) to clear the
      slalom line loss, and narrows the wheel track to 0.10 m with mass 0.6 kg to
      raise turn rate for the s-bend drift. Rests on iteration 2 showing zero s-bend
      line loss with progress 0.04, and the slalom''s one line loss per run.


      ### Rationale


      Iteration 2 (16 mm contiguous sensors, x = ±0.048 m) removed line loss on the
      oval and s-bend, which supports the footprint fix. Two problems remain. First,
      the slalom still loses the line once per run (line_loss_events 1.0, max_error
      0.0628 m), so the 4 to 5 cm error zone is not fully covered. The Integrator''s
      pre-agreed rule applies: widen the pitch to 20 mm (x = -0.06 to +0.06 m, y =
      0.03 m). Second, the s-bend has zero line loss but progress of only 0.04 with
      max_error 0.0611 m, so the robot leaves the tape through turn-rate lag, not
      lost sensing. Iteration 3 repeated iteration 2''s geometry and returned identical
      metrics to four decimals, so the kp change had no visible effect and the s-bend
      failure is not a gain problem. Steering oscillation is 0.075 on the oval and
      0.14 on the slalom, both below the 0.16 threshold, so I leave the sensor y offset
      at 0.03 m. For turn rate, I reduce wheel_track from 0.12 to 0.10 m, which raises
      the turn rate per unit wheel differential by about 20 percent, and reduce mass
      from 0.8 to 0.6 kg to lower yaw inertia, as the Integrator''s fallback suggests.
      The s-bend should barely depend on the sensor pitch change, since it has no
      line loss, so any s-bend progress gain can be credited mostly to the drivetrain
      change. The slalom result will mix both changes, so I treat it as a combined
      test. I keep body width 0.12 m and body length 0.16 m because the off-track
      limit is 0.06 m for any allowed width. Expected result: slalom line_loss_events
      near zero, s-bend progress above 0.04, and a first completion on the oval or
      s-bend. Watch for slip at lower mass.


      - [Open this output](iteration-4/entity0/versions/d6e48268fe5b42548be386efb12e2c8d/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-4285ef0f41a6153c/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-f88d20c9d886ef89/payload.json)'
  - id: entity1
    label: Wider pitch, narrow track
    notes: 'Integrated the Builder''s 20 mm pitch (±0.06 m), 0.10 m track and 0.6
      kg mass with kp raised to 5.5 to hold steering gain. Evidence: iteration 2 removed
      oval and s-bend line loss, but the slalom still loses the line and the s-bend
      drifts with zero line loss.


      ### Rationale


      Iteration 2 (16 mm contiguous sensors at x = ±0.048 m, kp 5.0) removed line
      loss on the oval and s-bend, so the footprint change works. Iteration 3 repeated
      that geometry with kp 5.0 and returned identical metrics, so gain alone does
      not move the s-bend. The s-bend stays at progress 0.04 with max_error 0.0611
      m and zero line loss, so the robot is drifting through turn-rate lag. The slalom
      still loses the line once per run at max_error 0.0628 m, which means the 4 to
      5 cm error zone is not fully covered. I adopt the Builder''s proposal exactly:
      16 mm sensors at 20 mm pitch (x = -0.06 to +0.06 m, y = 0.03 m), wheel_track
      0.10 m, mass 0.6 kg. Body width and length are unchanged. Weights stay proportional
      to x (-1.0 to +1.0), so a positive signal steers left as the contract requires.
      The wider span lowers the signal per metre of error from about 104 per metre
      (kp 5.0 over 0.048 m) to about 83 per metre at 0.06 m. Holding that gain needs
      kp near 6.2. The narrower track raises turn rate per unit of turn by about 20
      percent, which pushes the other way. I therefore set kp to 5.5, a compromise
      that keeps steering authority near the earlier level without overshooting. ki
      stays at 0.05 and kd at 0.3. The change list is wider pitch, narrower track,
      lower mass and a small kp change. The next race will confound these, so the
      feedback names which result points to which lever.


      - [Open this output](iteration-4/entity1/versions/7337b869f9a74df799805cdd5c2321d9/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/d6e48268fe5b42548be386efb12e2c8d/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-f88d20c9d886ef89/payload.json)'
  - id: entityR1
    label: Next-step fallbacks
    notes: 'Feedback written before the race, with no outcome claimed. It gives decision
      rules for pitch, track and oscillation, each tied to iteration 2 and 3 evidence
      showing zero-line-loss s-bend drift and a persistent slalom line loss.


      ### Feedback


      Written before this candidate has raced. Iteration 2 (16 mm contiguous sensors,
      ±0.048 m, kp 5.0) removed line loss on the oval and s-bend (0 events each),
      which supports the footprint change. Iteration 3 repeated that geometry with
      kp 5.0 and returned identical metrics, so gain alone does not fix the s-bend.
      The s-bend still ends at progress 0.04 with max_error 0.0611 m and zero line
      loss, so the robot is losing the line through turn-rate lag, not sensing. The
      slalom still shows one line-loss event per run at max_error 0.0628 m, so the
      4 to 5 cm error zone is not fully covered. Use the next race to decide the next
      step. If the slalom line_loss_events are still above zero, the 20 mm pitch is
      not wide enough, and the next step is a 16 mm array spread wider, up to the
      ±0.08 m sensor limit. If the s-bend still ends off track with zero line loss
      and progress near 0.04, the turn-rate lever is next: the narrower track and
      lower mass in this race are the first test, and if they do not lift s-bend progress,
      go further (wheel_track 0.08 m or mass 0.4 kg). If steering_oscillation rises
      above 0.16 with line loss at zero, the forward offset is the next lever.


      ### Requested changes


      - If slalom line_loss_events stay above zero after this race, widen sensor_positions
      beyond 20 mm pitch, up to x = ±0.08 m (for example seven 16 mm sensors at about
      27 mm pitch). Evidence: iterations 0, 1, 2 and 3 each show one line-loss event
      per slalom run, and the ±0.048 m contiguous layout did not remove it.

      - If the s-bend still ends off track with zero line loss and progress near 0.04
      after this race, try wheel_track 0.08 m with mass 0.4 kg. Evidence: iteration
      2 and iteration 3 s-bend both had zero line loss, max_error 0.0611 m and progress
      0.04, so the failure is turn-rate lag.

      - If steering_oscillation rises above 0.16 with line_loss_events at zero, set
      the sensor y offset to 0.05 m for all sensors. Evidence: iteration 0 oscillation
      was 0.14 to 0.16 on the s-bend and slalom, and the oval reached 0.16 with the
      12 mm array.


      - [Open this output](iteration-4/entityR1/versions/7337b869f9a74df799805cdd5c2321d9/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/d6e48268fe5b42548be386efb12e2c8d/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-f88d20c9d886ef89/payload.json)'
