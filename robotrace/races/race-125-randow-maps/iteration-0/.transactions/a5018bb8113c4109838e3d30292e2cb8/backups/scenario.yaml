  - id: entity0
    label: Baseline 5-sensor
    notes: 'Baseline geometry: five 12 mm sensors spaced 12 mm apart, 30 mm ahead
      of the axle, with mid-range drivetrain and mass. No race evidence exists yet,
      so the choice is a conservative, symmetric starting point for the Integrator
      to tune.


      ### Rationale


      This is iteration 0, so there is no race telemetry or integration feedback yet.
      I am choosing a conservative baseline that a controller can work with. Five
      sensors at 12 mm spacing (x = -0.024 to +0.024 m) span about twice the 25 mm
      tape width, so the line stays visible across small lateral errors and the sum
      of readings rarely drops below the 0.05 line-loss threshold. The sensors sit
      0.03 m ahead of the axle so the controller sees the line before the wheels reach
      it, which gives phase lead. Weights are antisymmetric and scaled to the sensor
      spacing (-1.0 to +1.0), so the signal is roughly proportional to lateral offset.
      The wheel track of 0.12 m and radius of 0.03 m are mid-range, a compromise between
      turn agility and straight-line stability. Mass 0.8 kg is light enough to accelerate,
      and the body width of 0.12 m gives an off-track limit of 0.06 m. Expected result:
      completion on the oval and s-bend, with the slalom likely the hardest because
      of quick direction changes. I expect line-loss events to be low and rms error
      to be set mainly by the controller''s gains, which the Integrator will tune.


      - [Open this output](iteration-0/entity0/versions/045e30be2cda4518971e4d37fbb0b37d/payload.json)'
