  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: 'Final: 0.085 m track'
    notes: 'Freezes the iteration 10 geometry (0.085 m track, seven contiguous 16
      mm sensors at y = 0.08 m), the best raced result at 63.41. It met the decision
      rule (s-bend progress above 0.1675, slalom oscillation below 0.16), and the
      remaining s-bend oscillation of 0.162 is left to kp.


      ### Rationale


      This is the final iteration, so I am choosing the geometry with the best measured
      evidence rather than testing a new step. Iteration 10 (wheel_track 0.085 m,
      all other geometry as iteration 9) scored 63.41, the best result so far. It
      met the decision rule I set in iteration 9: s-bend progress rose from 0.1675
      to 0.1686 (oval 0.174 to 0.180), and slalom steering_oscillation stayed below
      0.16 at 0.1569. Line loss stayed at one event per run on the s-bend and slalom,
      so sensing is not the limit. The one warning is that s-bend steering_oscillation
      averaged 0.1617, just over the 0.16 trigger, with line loss unchanged. Under
      the pre-agreed rule, that calls for the Integrator to reduce kp, not for a geometry
      change. Narrowing the track further (to 0.08 m) would add turn gain and push
      oscillation past the trigger on the slalom with no clear progress evidence,
      and the unseen final track has a different shape, so I do not take that risk.
      Sensing (seven contiguous 16 mm sensors at x = ±0.048 m, y = 0.08 m), mass 0.8
      kg, wheel radius 0.03 m and body 0.12 × 0.16 m are all held at their tested
      values. Body width cannot improve the off-track limit, which is 0.06 m at any
      allowed width. I expect this layout to hold or slightly improve on the development
      tracks, with the final race depending mainly on the Integrator''s kp choice
      for oscillation.


      - [Open this output](iteration-11/entity0/versions/31ec767e6a1f436e8d808a1f9a166515/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-e5e6b2a327f184c5/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-21586de9f56ffb4d/payload.json)'
  - id: entity1
    label: Final package, kp 3.9
    notes: 'Freezes the iteration 10 geometry (wheel_track 0.085 m, seven contiguous
      16 mm sensors at y = 0.08 m) and lowers kp from 4.2 to 3.9 to pull s-bend steering_oscillation
      (0.1617 at kp 4.2) back under the 0.16 trigger. Iteration 10 also set the best
      measured score (63.41) among the iterations that used the 16 mm sensing layout.


      ### Rationale


      Evidence: iteration 10 (wheel_track 0.085 m, kp 4.2) scored 63.41. Its s-bend
      steering_oscillation was 0.1617, just over the 0.16 trigger, with line loss
      at one event per run and no new loss. Oval (0.180 progress) and slalom (oscillation
      0.1569) were within limits. The Builder asked for the iteration 10 geometry
      to be frozen, and the Integrator''s pre-agreed rule for a small oscillation
      breach is a kp reduction, not a geometry change. I therefore keep the geometry
      exactly at the measured iteration 10 values. Across iterations 7 to 10, oscillation
      tracked effective turn gain (kp divided by wheel_track) only roughly. Gain 41.7
      gave s-bend oscillation 0.138, gain 50 gave 0.145, gain 51 gave 0.159, and gain
      49.4 gave 0.162. The measured s-bend oscillation therefore also moved with track
      width and not just gain. Lowering kp from 4.2 to 3.9 cuts effective gain from
      about 49.4 to about 45.9 (roughly 7 percent). Iteration 7 suggests this should
      bring s-bend oscillation to about 0.15 to 0.155. The cost is a likely small
      loss of s-bend progress, since iteration 7 at gain 41.7 gave 0.1496 against
      0.1675 at gain 51. I accept that trade because the oscillation breach is the
      only measured constraint currently failing. kd is held at 0.3 rather than raised,
      because raising it is untested and could alter the line-loss recovery. ki 0.05,
      base_speed 1.5 and last_direction line loss are unchanged. Sensor weights stay
      proportional to x (-1.0 to +1.0), so a positive signal steers left as the contract
      requires. I expect s-bend oscillation below 0.16 and slalom oscillation near
      0.157, with progress near iteration 10 on the oval. These are predictions, not
      measurements.


      - [Open this output](iteration-11/entity1/versions/d1bd484e3c6549a68e0ca3c7a3be97a2/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/31ec767e6a1f436e8d808a1f9a166515/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-21586de9f56ffb4d/payload.json)'
  - id: entityR1
    label: Final-round feedback
    notes: 'Written before the final race. It explains the kp reduction and gives
      the Builder three fallbacks tied to the measured oscillation and progress trade-off
      across iterations 7 to 10. No outcome is stated for this package.


      ### Feedback


      Written before this candidate has raced. Iteration 10 (wheel_track 0.085 m,
      kp 4.2) scored 63.41, the best of the 16 mm sensing iterations. Its s-bend steering_oscillation
      was 0.1617, just over the 0.16 trigger, and its slalom oscillation was 0.1569.
      Line loss stayed at one per run on the s-bend and slalom. Iteration 9 (0.09
      m, kp 4.6) gave s-bend oscillation 0.1591 and progress 0.1675, and iteration
      7 (0.12 m, kp 5.0) gave s-bend oscillation 0.1381 and progress 0.1496. Those
      points show oscillation rising as the track narrows, with the progress gain
      going with it. Because this is the final iteration, I have built the package
      with the frozen iteration 10 geometry and a kp reduction to 3.9, which is the
      only change that the measured oscillation supports. Expect the s-bend oscillation
      to fall below 0.16 and the s-bend progress to dip slightly from 0.1686. The
      final decision is in your hands only if a later race exists; otherwise the Integrator''s
      kp choice carries the final result. If the race shows s-bend steering_oscillation
      still at or above 0.16 with line loss unchanged, the next change is to lower
      kp further, not the geometry. If the race shows s-bend progress falling below
      about 0.16 with oscillation already under 0.16, the kp reduction went too far,
      and the balance point is kp 4.0 on this layout. If line_loss_events rise above
      one per run on any track, the cause is the track or kp change, not sensing,
      so revert to kp 4.2.


      ### Requested changes


      - If s-bend steering_oscillation stays at or above 0.16 with line_loss_events
      unchanged, keep sensor_positions and wheel_track at the iteration 10 values
      and lower kp to 3.6. Evidence: iteration 10 s-bend oscillation was 0.1617 at
      kp 4.2, and iteration 9 was 0.1591 at kp 4.6, so kp alone has moved oscillation
      only slightly.

      - If s-bend progress falls below about 0.16 while steering_oscillation is already
      below 0.16, raise kp to 4.0 to recover progress. Evidence: iteration 7 at effective
      gain 41.7 gave s-bend progress 0.1496, and iteration 9 at gain 51 gave 0.1675.

      - Keep sensor_positions at seven contiguous 16 mm sensors at x = ±0.048 m and
      y = 0.08 m, and keep wheel_track at 0.085 m. Evidence: iteration 4''s 20 mm
      pitch cut slalom progress from 0.104 to 0.035, and forward lead has plateaued
      at y = 0.07 to 0.08 m (iterations 6 and 7).


      - [Open this output](iteration-11/entityR1/versions/d1bd484e3c6549a68e0ca3c7a3be97a2/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/31ec767e6a1f436e8d808a1f9a166515/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-21586de9f56ffb4d/payload.json)'
