  id: race-125-randow-maps
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Track 0.09 m, 16 mm
    notes: 'Narrows wheel_track from 0.10 to 0.09 m with the sensing and mass unchanged,
      a smaller step than the 0.08 m minimum. Iteration 8 raised s-bend progress to
      0.1604 and score to 60.32 with all oscillation below 0.16, but slalom oscillation
      (0.157) is close to the trigger, so a 25 percent turn-rate jump is too risky.


      ### Rationale


      Iteration 8 (wheel_track 0.10 m, everything else as iteration 7) scored 60.32,
      up from 57.50. The change helped on every track. The s-bend rose from 0.1496
      to 0.1604 progress with max_error 0.0613 m. The oval rose from 0.161 to 0.167
      with rms_error 0.0193. Slalom progress rose from 0.1064 to 0.110. Line-loss
      events were 1.0 on the s-bend and slalom and 0.95 on the oval, so no new loss
      appeared. All steering_oscillation values stayed below 0.16: oval 0.109, s-bend
      0.145, slalom 0.157. Slalom oscillation is now close to the trigger.


      The s-bend gain is small, about 7 percent, and it does not yet clearly clear
      0.16. The Integrator''s rule allows a test at 0.08 m, the contract minimum.
      I do not think that is the right step. Turn rate scales roughly with 1/wheel_track,
      so 0.10 to 0.08 m adds about 25 percent more turn rate. Going from 0.12 to 0.10
      m (about 20 percent) raised slalom oscillation by about 0.012. A further 25
      percent step would likely push slalom oscillation to about 0.17, past the trigger,
      and cost the controller stability it needs.


      I therefore choose wheel_track 0.09 m as a cautious step. It probes whether
      s-bend progress keeps rising with turn rate, with a smaller expected increase
      in oscillation. Mass stays at 0.8 kg, since the 0.6 kg mass in iteration 4 was
      confounded and the gain from mass is not isolated. Sensing stays at seven contiguous
      16 mm sensors at x = ±0.048 m and y = 0.08 m, because pitch and forward lead
      have been tested and are not the limit.


      Expected result: s-bend progress about 0.16 to 0.165, oval about 0.165 with
      line loss near 0.95, and slalom oscillation about 0.15 to 0.165. If slalom oscillation
      exceeds 0.16 with line loss unchanged, the Integrator should reduce kp before
      further geometry change. If the s-bend is flat or worse, revert to wheel_track
      0.10 m, which is the best measured geometry so far (score 60.32).


      - [Open this output](iteration-9/entity0/versions/66ee51ef600e488ba09d6b3dc01f8afa/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-46f818d0eb2041ad/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-acf11799c14267ad/payload.json)'
  - id: entity1
    label: Narrow track 0.10 m test
    notes: 'Keeps the iteration 7 controller and sensing and changes only wheel_track
      to 0.10 m, to isolate turn rate on the s-bend plateau. Based on iteration 7
      (s-bend 0.1496, oscillation at most 0.144) and iteration 4''s confounded drivetrain
      result.


      ### Rationale


      Iteration 7 (y = 0.08 m, wheel_track 0.12 m, mass 0.8 kg, kp 5.0) scored 57.50.
      Its oval progress was 0.161 with rms_error 0.020, s-bend progress 0.1496 with
      max_error 0.063 m, and slalom progress 0.106. Steering_oscillation was at most
      0.144 on every track, below the 0.16 trigger, and line loss stayed at one event
      per run on the s-bend and slalom. Forward lead has plateaued (0.15 at y = 0.07
      m, 0.1496 at y = 0.08 m). Iteration 3 showed that kp alone does not move the
      s-bend, and iteration 4 was confounded by pitch, so the drivetrain effect at
      the current sensing has never been isolated. The Builder''s proposal changes
      only wheel_track, from 0.12 m to 0.10 m, with mass held at 0.8 kg, so I keep
      the geometry exactly as proposed. Narrowing the track raises turn rate per unit
      of wheel differential by roughly 20 percent. That is a real but partly offsetting
      change to effective steering gain, and I considered lowering kp to about 4.6
      to compensate. I decided against it: the Builder''s test is designed to isolate
      the drivetrain against iteration 7, and iteration 4 showed that a combined change
      is hard to read. The controller therefore stays identical to iteration 7 (kp
      5.0, ki 0.05, kd 0.3, base_speed 1.5, last_direction, weights proportional to
      x with a positive signal steering left). Expected result: s-bend progress rises
      above 0.16 with max_error below 0.063 m, the oval holds near 0.16, and steering_oscillation
      stays below 0.16. These are predictions, not measurements. If oscillation rises
      above 0.16, the next Integrator step is a kp reduction before any further geometry
      change.


      - [Open this output](iteration-8/entity1/versions/8703e7a1fadb447db5fa43a39806ac5b/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/a90f77c1de624bc09b78594c02622043/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-bd4f650223710599/payload.json)'
  - id: entityR1
    label: Track-width next steps
    notes: 'Feedback gives three branches for the 0.10 m result, covering a gain gain,
      a clear s-bend improvement, and a flat result. Each branch is tied to iteration
      7''s plateau and iteration 4''s confounded pitch and drivetrain evidence.


      ### Feedback


      Written before this candidate has raced. Iteration 7 (y = 0.08 m, wheel_track
      0.12 m, kp 5.0) scored 57.50, with s-bend progress 0.1496 and max_error 0.063
      m, oval progress 0.161 and rms_error 0.020, and steering_oscillation at most
      0.144 on any track. Iteration 6 to 7 showed forward lead is on a plateau. Iteration
      3 showed kp 5.0 against kp 5.0 gives identical results, so gain is not the s-bend
      lever. Iteration 4 cut slalom progress to 0.035 with a 20 mm pitch and was confounded
      by the 0.10 m track and 0.6 kg mass, so the drivetrain effect has never been
      isolated. Your iteration 8 candidate changes only wheel_track to 0.10 m at mass
      0.8 kg, which is the clean test. I built it with the iteration 7 controller
      unchanged, so the result reflects the drivetrain alone. Decide the next step
      from the race. If s-bend progress rises clearly above 0.16 with steering_oscillation
      below 0.16 and the oval near 0.16, keep wheel_track 0.10 m and test 0.08 m (the
      contract minimum). If steering_oscillation rises above 0.16 with line loss unchanged,
      the turn rate is now too high, so the Integrator should reduce kp before you
      change geometry; a midpoint track of 0.11 m is the geometry fallback. If s-bend
      progress is flat or worse, the drivetrain lever is exhausted at y = 0.08 m,
      so revert to wheel_track 0.12 m and accept this platform.


      ### Requested changes


      - If s-bend progress rises above 0.16 with steering_oscillation below 0.16 and
      the oval near 0.16, keep the y = 0.08 m layout and try wheel_track 0.08 m at
      mass 0.8 kg. Evidence: iteration 7 s-bend was 0.1496 at wheel_track 0.12 m,
      so turn rate has not yet been tested at a narrower track.

      - If steering_oscillation rises above 0.16 with line_loss_events unchanged,
      keep wheel_track 0.10 m and let the Integrator reduce kp before further geometry
      change; if geometry must change, try wheel_track 0.11 m. Evidence: iteration
      7 oscillation was 0.138 to 0.144 at wheel_track 0.12 m, so the trigger is close.

      - If s-bend progress is flat (about 0.15) or worse, revert to wheel_track 0.12
      m and keep y = 0.08 m, and treat the drivetrain as exhausted. Do not widen the
      pitch beyond the contiguous 16 mm layout at x = ±0.048 m. Evidence: iteration
      4''s 20 mm pitch cut slalom progress from 0.106 to 0.035 with no s-bend gain.


      - [Open this output](iteration-8/entityR1/versions/8703e7a1fadb447db5fa43a39806ac5b/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/a90f77c1de624bc09b78594c02622043/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-bd4f650223710599/payload.json)'
