  - id: entity0
    label: Draft Design
    notes: 'Draft Design. The model did not supply a valid label and summary, so the
      orchestrator wrote this one.


      ### Rationale


      No prior race telemetry is supplied (iteration 0), so this is a conservative
      first draft built from the contract. Pace: the course is about 4.5 m and must
      be covered in under 3 s, so I need an average of roughly 1.5 m/s or more. I
      set base_speed to 1.8 (about 90% of full PWM) to leave some margin for the controller
      to slow in bends without losing completion. Sensing: five line sensors at y
      = 0.04 m (ahead of the axle, so steering reacts before the wheels reach a bend)
      spaced 0.012 m apart across x = -0.024 to +0.024. With 12 mm footprints this
      covers the 25 mm tape at any small offset. Weights are antisymmetric [-1.5,
      -0.75, 0, 0.75, 1.5] so the signal is zero on-centre and grows with offset.
      Control: kp = 6 gives roughly 1.5 x 350 = 525 PWM of steering per 0.25 of signal,
      which is firm but not saturating at normal offsets. ki = 0.1 is small to avoid
      windup on curves. kd = 0.05 damps the jitter without amplifying sensor noise,
      since derivative of signal can be large. Line loss uses last_direction so the
      robot turns back toward the tape it just left rather than searching blindly.
      Body and mass: wheel_track 0.12 m and wheel_radius 0.03 m give a moderate turn
      rate, mass 0.8 kg keeps inertia low for quick corrections, and body_width 0.12
      m leaves the off-track limit at 0.06 m. Expected result: completion on the oval
      and s-bend, with some risk on the slalom where kd and kp may need tuning once
      telemetry exists. I expect progress near 1.0, a few line-loss events at worst,
      and an RMS error around 0.02 to 0.03 m. The measurement request covers all metrics
      so the next revision can see where the controller oscillates or loses the line.


      - [Open this output](iteration-0/entity0/versions/865dac4d9d44473398c965dfce9868a0/payload.json)'
