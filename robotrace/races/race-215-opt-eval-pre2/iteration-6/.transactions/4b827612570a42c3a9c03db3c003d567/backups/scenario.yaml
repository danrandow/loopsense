map:
  id: race-215-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Wider sensor array, more
    notes: 'Widens the sensor array to +/-0.06 m and raises kp and kd, with lower
      speed and mass, to keep the tape in view through larger swings. The evidence
      is that every prior design lost the line early at about 0.061 m error, and only
      sensor geometry changed progress.


      ### Rationale


      Evidence: all 60 trials of iterations 0-4 ended off track with exactly one line-loss
      event each. max_error sits at about 0.061 m, just over the fixed 0.06 m limit,
      in every design. Oval progress stayed near 0.11 across all five designs, so
      the failure is a shared early event, not a gain problem. Gains (kp 1.6 to 6,
      kd 0.05 to 0.3, ki 0 to 0.3) and speed (1.2 to 1.8) changed little. Sensor moves
      changed s-bend and slalom progress (0.04 to 0.15), so sensing geometry is the
      main lever. Most likely mechanism: the robot swings about 0.035 m off centre,
      the tape leaves the sensor array, the line is lost, and the 0.35 throttle recovery
      drifts it past 0.06 m. The array spans only +/-0.03 m, so it loses the tape
      too early.


      Changes: (1) Widen the array to x = -0.06 to +0.06 m at 0.02 m spacing, 7 sensors,
      y = 0.08 m. The tape should stay visible through a larger swing, so the line-loss
      event should move later or disappear. (2) Keep the weights linear and antisymmetric,
      [-1.5, -1.0, -0.5, 0, 0.5, 1.0, 1.5]. The wider spacing halves the signal change
      per metre of offset, so kp rises from 1.6 to 2.5 to restore the same correction
      strength. (3) kd raised from 0.3 to 0.5 to damp the swing that drives the robot
      toward the loss threshold. (4) base_speed lowered from 1.2 to 1.1 to give the
      loop more time to correct on bends. The pace cost is small, since the average
      speed needed for finishing is about 1.5 m/s and the bends are the limit. (5)
      Mass lowered from 0.8 to 0.6 kg to reduce yaw inertia, so turns respond faster.
      wheel_track 0.14, wheel_radius 0.03, body unchanged, line_loss last_direction
      kept so this change isolates sensing and damping.


      Expected result: fewer or later line-loss events, max_error below 0.06 m on
      at least the s-bend and slalom, and progress rising toward 0.3 or more on the
      oval. If line loss still happens at the same point, the next revision should
      test line_loss or the start handling rather than gains.


      - [Open this output](iteration-5/entity0/versions/789a9e999982463b81e027e542085293/payload.json)

      - Based on: [entityR2A](iteration-5/entityR2A/versions/carried-f6680c468d3b018e/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Round-1 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-5/entityC1/versions/7f082101d7de4d8f9cc007bfb3dae4a7/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/789a9e999982463b81e027e542085293/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-f6680c468d3b018e/payload.json)'
  - id: entity1
    label: Isolate line-loss rule
    notes: 'Returns to the raced iteration 4 design and changes only line_loss to
      search_left, after the critique showed the draft changed too many variables
      and that kd = 0.5 would saturate the wheels. The test separates a recovery-rule
      effect from a start or first-contact fault, using the consistent single line-loss
      event in all 60 trials.


      ### Rationale


      Evidence: across iterations 0 to 4, all 60-trial designs ended off track with
      one line-loss event each and a censored max_error of about 0.061 m. Iterations
      0 and 2 gave identical per-track metrics despite large gain changes, so gains
      do not reach the outcome before the first loss. Iteration 3 (score 49.94) is
      the best raced design. Iteration 4 (score 49.73) moved the sensors to y = 0.08
      and was the only change in its step, with a small effect.


      Critique accepted: the draft changed about six variables at once, so no result
      could be attributed. kd = 0.5 is likely to saturate the wheels, since a 0.5
      signal step in 10 ms is 50 per second times 0.5, about 25 turn units, well beyond
      the 4095 PWM limit. Rejected in the draft: wider 7-sensor array and kp 2.5,
      which were untested and would have confounded the test. The draft''s mass and
      wheel changes are also dropped, because the critique found no test that supports
      them.


      This revision returns to the raced iteration 4 design (5 sensors, x = -0.03
      to +0.03 m, y = 0.08 m, 0.016 m footprint, weights [-1.5, -0.75, 0, 0.75, 1.5],
      kp 2.0, ki 0.1, kd 0.1, base_speed 1.4, wheel_track 0.12, mass 0.8). The one
      change is line_loss from last_direction to search_left. The test asks whether
      the first loss is a start or first-contact event that depends on the recovery
      rule. search_left fixes the signal at -1, which steers the robot right. The
      direction is a guess, since the sign of the first error is not in the data.
      A change in first-loss timing or max_error would show the recovery rule matters.
      No change would point to a start-alignment or motor-mismatch bias.


      Decision rule for the next round: if the first loss still occurs at the same
      step with the same error, stop changing the recovery rule and check start alignment
      or a bias term. If the first loss moves, keep the better of search_left or last_direction.
      Speed stays at 1.4 for now. Completion needs about 1.5 m/s, which base_speed
      does not show, so I will raise it only after the line-loss timing is understood.
      Expected result, a guess: an earlier or later first loss, with progress near
      the iteration 4 level of about 0.11 to 0.15.


      - [Open this output](iteration-5/entity1/versions/5f2835f1751a4ba0b86493f79eac02f4/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/789a9e999982463b81e027e542085293/payload.json),
      [entityC1](iteration-5/entityC1/versions/7f082101d7de4d8f9cc007bfb3dae4a7/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-f6680c468d3b018e/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Flags a likely derivative kick when search_left switches the signal to
      -1 (kd 0.1 gives about 25 turn units), which could confound the recovery test.
      Also notes that the first-loss timing the decision rule needs is not in the
      requested measurements, and that the line-loss margin before off-track is only
      about 1 cm.


      - [Open this output](iteration-5/entityC2/versions/9f3d4ece54414d70bd29f323ebc78b80/payload.json)

      - Based on: [entity1](iteration-5/entity1/versions/5f2835f1751a4ba0b86493f79eac02f4/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-f6680c468d3b018e/payload.json)'
  - id: entity2
    label: Search-left recovery test
    notes: 'Iteration 4 geometry and gains, with line_loss changed from last_direction
      to search_left as the single variable. Kept despite the critique''s derivative-kick
      risk, which the steering_oscillation and control_effort measures will show;
      kd was not changed to avoid a second variable.


      ### Rationale


      Evidence: iteration 3 (score 49.94) and iteration 4 (score 49.73) both end every
      trial off track with exactly one line-loss event and max_error about 0.061 m,
      just past the fixed 0.06 m limit. Iterations 0 and 2 gave identical results
      across different gains and sensor layouts, so the failure looks early and track-independent.
      Iteration 4 moved the sensors to y = 0.08 with a small effect, and this design
      keeps that geometry.


      Critique handling. I accept point 1: switching to search_left replaces the signal
      with -1, so if the last valid signal was near +1.5, the signal steps by about
      -2.5 in one 10 ms step. With kd = 0.1 that is about -25 turn units, which may
      saturate the wheels at the first loss. I cannot tell from the contract whether
      the handler routes the replaced value through the derivative term. I do not
      change kd to remove the kick, because that would be a second variable and would
      confound the recovery-rule test the critique asked for. Instead, steering_oscillation
      and control_effort are requested, so a saturation transient will show in the
      data and can be discounted when reading the result. I accept points 2 and 4:
      the first-loss step is not returned, so the decision rule uses line_loss_events,
      max_error, progress and steering_oscillation, and the search direction is a
      guess. I reject the request to combine this round with start-alignment or gain
      changes, since that would reintroduce the confound. I keep base_speed at 1.4
      until line-loss timing is understood, and I accept point 5 that the rationale
      must state a falsifiable result.


      Design. This is the raced iteration 4 design with one change: line_loss from
      last_direction to search_left. Geometry: five sensors at x = -0.03 to +0.03
      m (0.015 m spacing), y = 0.08 m, 0.016 m footprint, body 0.16 x 0.12 m, mass
      0.8 kg, wheel radius 0.03 m, wheel track 0.12 m. Controller: weights [-1.5,
      -0.75, 0, 0.75, 1.5], kp 2.0, ki 0.1, kd 0.1, base_speed 1.4.


      Falsifiable expectation. If the recovery rule matters, line_loss_events, max_error
      or progress should move by more than the seed spread (progress about 0.01 on
      the oval) on at least one track. If all three are unchanged to four decimals,
      the recovery rule does not matter here, and the next step is to test start alignment
      or a motor-mismatch bias. If progress falls and max_error rises together with
      a large steering_oscillation, the saturation transient is the likely cause,
      and the next step is to reduce kd or test last_direction again.


      Decision rule for the next round. Keep search_left only if it beats the iteration
      4 baseline (49.73) on score without a larger steering_oscillation. Otherwise
      return to last_direction. Raise base_speed only after line-loss timing is understood,
      since no run has yet reached a progress level where speed is the limit.


      - [Open this output](iteration-5/entity2/versions/b5b7adad37a745ae893ba836fb25b413/payload.json)

      - Based on: [entity1](iteration-5/entity1/versions/5f2835f1751a4ba0b86493f79eac02f4/payload.json),
      [entityC2](iteration-5/entityC2/versions/9f3d4ece54414d70bd29f323ebc78b80/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-f6680c468d3b018e/payload.json)'
