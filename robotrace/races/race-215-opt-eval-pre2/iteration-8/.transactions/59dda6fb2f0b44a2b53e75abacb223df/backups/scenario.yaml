map:
  id: race-215-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Test integral (ki 1.0)
    notes: 'Raises ki from 0.05 to 1.0 on the iteration 7 geometry to test whether
      a steady left/right motor mismatch causes the shared early off-track failure.
      Every prior trial ended off track at about 0.061 m error, and gain changes alone
      moved nothing.


      ### Rationale


      Evidence: all 420 trials across iterations 0-7 ended off track, with exactly
      one line-loss event per trial and max_error of about 0.061 m. That is just above
      the 0.06 m off-track limit, which is the floor for any body_width up to 0.18
      m. Progress stayed between 0.04 and 0.15. Gain, speed and mass changes moved
      the score very little (kp 1.5 to 6, kd 0.05 to 0.6, ki 0 to 0.3). Moving the
      sensors forward (iteration 3) and widening the array to 7 sensors (iteration
      4) raised s-bend and slalom progress, so sensing matters. Switching line_loss
      to search_right (iteration 7) gave a small score gain, but the oval metrics
      did not move. The near-identical max_error across every design, with a single
      early line loss, suggests a steady bias rather than oscillation. The fixed left/right
      motor mismatch is the likely source. Integral action is clamped at +/-2, so
      ki = 0.3 can only supply about 0.6 of turn, roughly 210 PWM, which may be too
      small to cancel the mismatch. I have not yet tested a large ki.


      Changes: (1) ki raised from 0.05 to 1.0. The integral clamp at 2 gives up to
      2 units of turn (about 700 PWM), which tests the mismatch hypothesis directly.
      (2) Geometry kept from iteration 7 (7 sensors at y = 0.06 m, x = -0.03 to +0.03
      m, footprint 0.016 m, mass 0.6 kg, wheel_track 0.14 m) so the only change is
      the integral term. (3) kp 2.0, kd 0.6, base_speed 1.0 and line_loss search_right
      unchanged, so the comparison with iteration 7 isolates ki.


      Expected result: if a steady mismatch bias is the cause, max_error should fall
      below 0.06 m and the first line loss should move later or disappear, which would
      raise progress on the oval and s-bend. If the integral causes overshoot, max_error
      will rise, which would rule out the bias hypothesis and point to a different
      cause, such as the start condition or the sensor layout. Finishing within 3
      s is still unlikely at this speed.


      - [Open this output](iteration-8/entity0/versions/f14595552af245ba880f3152fc6af033/payload.json)

      - Based on: [entityR2A](iteration-8/entityR2A/versions/carried-a34cba9273e5e30a/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critique focuses on the ki = 1.0 test: prior ki 0.1 to 0.3 gave identical
      results, the 2 percent mismatch is only about 0.12 turn, the integral is slow
      relative to the early first loss, and max_error is censored at 0.06 m. Also
      re-flags the unaddressed kd saturation risk.


      - [Open this output](iteration-8/entityC1/versions/75f5e1a41bb44183adfd7f0e3f3c0f25/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/f14595552af245ba880f3152fc6af033/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-a34cba9273e5e30a/payload.json)'
  - id: entity1
    label: Iter 7 base, ki 0.1 to
    notes: 'Returns to the best raced design (iteration 7, score 49.95) and changes
      only ki, from 0.1 to 1.0, to test whether the integral can cancel the fixed
      motor-mismatch bias. kd is kept at 0.1 because the critique''s saturation point
      is valid for kd 0.6, and iteration 6 showed kd 0.05 is worse. Evidence is the
      identical iteration 0 and 2 results and the one-line-loss pattern in every trial.


      ### Rationale


      Evidence: the best raced design is iteration 7 (score 49.95): 5 sensors at y
      = 0.06 m, x = -0.03 to +0.03 m, 0.016 m footprint, mass 0.8 kg, wheel_track
      0.12 m, kp 2.0, ki 0.1, kd 0.1, base_speed 1.4, search_right. Every trial in
      every iteration ended off track with exactly one line-loss event, and max_error
      is censored near 0.061 m by the 0.06 m limit. Iterations 0 and 2 gave identical
      per-track metrics across large kp, kd and ki changes, so gains did not reach
      the first loss. Iteration 6 (kd 0.05 instead of 0.1) fell from 49.94 to 35.65,
      so kd matters somewhat even though it does not set the first loss.


      Critique assessment. Accepted: the round-1 draft changed too many things at
      once. Its geometry (7 sensors, mass 0.6, wheel_track 0.14) and its kp, kd and
      base_speed were not isolated, so no result could be attributed. Accepted: kd
      0.6 is about 6 times the raced value and, at a 0.5 signal step per 10 ms, risks
      saturating the wheels, so kd returns to the raced 0.1. Accepted: the critique
      is right that a 2% motor mismatch is only about 0.12 turn units, and that the
      integral''s timing before the first loss is unchecked. Partly accepted: the
      ki test is still worth running, because it is the only untested term that could
      counter the fixed left/right bias, and the integral clamp of +/-2 bounds its
      effect. I do not accept the claim that ki 0.1 to 0.3 was a null test over the
      whole run, since it was confounded with other changes. Rejected: I keep base_speed
      at 1.4, since changing speed now would confound the ki test, and I do not claim
      completion.


      Change (one variable from iteration 7): ki 0.1 to 1.0. The integral clamp gives
      up to 2 turn units (about 700 PWM), which is enough to cancel a steady bias
      if the bias is the cause. Everything else matches iteration 7.


      Expected result (a guess, labelled as such): if a steady bias drives the first
      loss, the first-loss step should move later or disappear, and progress should
      rise on the oval and s-bend. If the first loss is unchanged, the integral is
      not reaching a useful size before the loss, and the cause is the start condition
      or the recovery rule.


      Decision rule for the next round: if the first-loss step and progress at first
      loss are unchanged, set ki back to 0.1 and test start handling with geometry
      and gains fixed. If the loss moves later and progress rises, keep ki 1.0 and
      check whether the integral windup shows up as steering_oscillation. If max_error
      and oscillation rise together, drop ki to about 0.3. Read first-loss timing
      and progress at first loss, not max_error, because failed runs are censored
      at 0.061 m.


      - [Open this output](iteration-8/entity1/versions/bba8f6c260da40f58a58bac582cf96bb/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/f14595552af245ba880f3152fc6af033/payload.json),
      [entityC1](iteration-8/entityC1/versions/75f5e1a41bb44183adfd7f0e3f3c0f25/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-a34cba9273e5e30a/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Critiques the ki 1.0 revision: the integral clamp (up to 2 units) is about
      five times the earlier ''modest'' bound and well above the roughly 0.12-unit
      motor bias. It also notes that the first-loss step and progress at first loss
      are not returned by the requested measurements, so the decision rule cannot
      be read. Evidence is the iteration 0 to 7 outcome table and the prior critiques.


      - [Open this output](iteration-8/entityC2/versions/7a1eb78edb3145bea51842b65794f5f4/payload.json)

      - Based on: [entity1](iteration-8/entity1/versions/bba8f6c260da40f58a58bac582cf96bb/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-a34cba9273e5e30a/payload.json)'
  - id: entity2
    label: Search-right recovery
    notes: 'Iteration 3 design with line_loss changed from last_direction to search_right,
      a single-variable test. Iteration 5 showed the recovery rule leaves s-bend and
      slalom unchanged, so the rationale predicts a null there and flags the derivative-kick
      confound the critique raised.


      ### Rationale


      Evidence: iteration 3 (y = 0.06 m, last_direction, score 49.94) is the best
      raced design. Every trial in every iteration ends off track with one line-loss
      event and max_error censored near 0.061 m. Iterations 0 and 2 gave identical
      results across large kp, ki and kd changes, so gains do not reach the first
      loss. Iteration 5 (search_left at the iteration 4 geometry) left the s-bend
      (0.1451) and slalom (0.1041) unchanged to four decimals and moved only the oval
      (46.33 to 43.25). The recovery direction therefore has no measured effect on
      two of three tracks.


      Critique handling. Accepted: the forced signal change under search_right can
      cause a derivative kick at the first loss, so the result may partly reflect
      the kick and not the direction. The contract does not show whether line-loss
      signals pass through the derivative term, and I cannot remove that confound
      without a second variable. I keep the single-variable test and will read steering_oscillation
      and control_effort alongside the score to see whether a kick is present. Accepted:
      the first-loss step is not returned by the requested measurements, so I remove
      that decision rule. Accepted: the expected result must be falsifiable. Rejected:
      a move to start-alignment or speed tests in this round, since that would add
      variables and make the result unattributable.


      Change: line_loss from last_direction to search_right. Everything else matches
      iteration 3: five sensors at x = -0.03 to +0.03 m, y = 0.06 m, 0.016 m footprint,
      weights [-1.5, -0.75, 0, 0.75, 1.5], kp 2.0, ki 0.1, kd 0.1, base_speed 1.4,
      wheel_track 0.12 m, mass 0.8 kg.


      Falsifiable expectation: s-bend and slalom progress will be within 0.0005 of
      iteration 3 (0.1475 and 0.1041), consistent with iteration 5, so the recovery
      rule does not matter on those tracks. If the oval score moves by more than the
      seed spread (about 45.3 to 47.3), the direction matters there. Any progress
      rise above 0.02 on any track would contradict iteration 5 and would be a real
      finding. Decision: keep search_right only if the score beats 49.94 with no larger
      steering_oscillation; otherwise return to last_direction. Speed stays at 1.4
      this round. If this result is null, base_speed becomes the next single-variable
      test, since completion is still unmeasured and there are few iterations left.


      - [Open this output](iteration-7/entity2/versions/6f16f61fe4e84144a9cb07cc102f092c/payload.json)

      - Based on: [entity1](iteration-7/entity1/versions/3634af817898444c8e3b20d7d5106c90/payload.json),
