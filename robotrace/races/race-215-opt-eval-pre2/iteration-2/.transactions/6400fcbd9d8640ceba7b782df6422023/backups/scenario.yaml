map:
  id: race-215-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Lower gain, more damping
    notes: 'Cut kp from 6 to 2.5 and raised kd to 0.35 with ki at 0, and slowed base_speed
      to 1.6 with a larger sensor footprint. Iteration 0 went off track on every trial
      with max_error just above the 0.06 m limit, which points to steering overshoot.


      ### Rationale


      Evidence from the single race (iteration 0, 60 trials across oval, s-bend and
      slalom): every trial went off track, with progress only 0.04 to 0.12 and no
      completions. The max_error of about 0.061 m sits just above the 0.06 m off-track
      limit (body_width 0.12 gives max(0.06, 0.0125 + 0.03) = 0.06). RMS error was
      about 0.03 m, and steering_oscillation and control_effort were non-trivial.
      The robot is therefore oscillating across the line and exceeding the lateral
      limit within the first fraction of a metre, not drifting slowly. The likely
      cause is over-aggressive steering: kp = 6 with sensor weights up to 1.5 gives
      turn values near 9, which saturates the wheel commands (350 PWM per unit of
      turn), and kd = 0.05 is too weak to damp the swing. Combined with base_speed
      1.8, the loop overshoots each correction.


      Changes: (1) kp 6.0 to 2.5, so a full-scale signal produces a moderate correction
      and the robot does not swing past the 0.06 m limit. (2) kd 0.05 to 0.35 to add
      damping to the swing, since the signal changes quickly when the robot crosses
      the tape. (3) ki kept at 0.0 so the integral does not wind up on bends or add
      overshoot. (4) base_speed 1.8 to 1.6: slightly slower so the lower-gain loop
      has time to correct, while still close to the roughly 1.5 m/s needed to finish
      in 3 s. (5) Sensor footprint 0.012 to 0.016 m, with 5 sensors at 0.01 m spacing
      (x from -0.02 to +0.02) and y = 0.04. The larger footprint gives smoother, less
      noisy readings and keeps the tape visible across a wider range of offsets, and
      the narrower spacing keeps the signal responsive near the centre. Weights are
      kept antisymmetric [-1.5, -0.75, 0, 0.75, 1.5] so the signal stays zero on-centre.


      Body geometry is unchanged (wheel_track 0.12, wheel_radius 0.03, mass 0.8, body_width
      0.12). Widening the body does not help: at body_width 0.18 the limit is still
      0.0575 m, below the 0.06 floor, so the limit barely moves.


      Expected result: much smaller lateral oscillation (max_error well below 0.06
      m, RMS near 0.015 to 0.025 m), so runs should reach the off-track limit less
      often and progress should rise substantially on the oval and s-bend. Completion
      on the slalom remains uncertain and may need a further kd or base_speed adjustment
      once telemetry exists.


      - [Open this output](iteration-1/entity0/versions/6ea6541766b8482a9b78e9b8e6c8663c/payload.json)

      - Based on: [entityR2A](iteration-1/entityR2A/versions/carried-6260ca30c06dbb24/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Round-1 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-0/entityC1/versions/aac4793eb1ac42598e34791ed12502eb/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/865dac4d9d44473398c965dfce9868a0/payload.json)'
  - id: entity1
    label: 'Revised: softer, less kd'
    notes: 'Cut kd to 0.01 and kp to 3.5 to reduce noise kicks and weaving, raised
      ki to 0.2 for the motor bias, and base_speed to 1.9 for time margin. Changes
      follow the round-1 critique; speed and the slalom remain unverified until telemetry
      exists.


      ### Rationale


      Accepted: kd should be near zero, since the critique''s arithmetic is right
      that a 1.5 signal step with kd=0.05 gives a turn kick of about 2600 PWM and
      sensor noise would trigger it repeatedly. I set kd to 0.01, a small damper,
      rather than zero, so a little derivative action remains. Partly accepted: kp=6
      is large and unverified, and at 350 PWM per turn unit it gives up to about 3150
      PWM of steering at full signal, so I reduced kp to 3.5. That still gives about
      1.75 turn units (about 610 PWM) at a half-tape offset, which is firm enough
      to recover from bends. Accepted in part on the motor mismatch: the fixed left/right
      bias is a steady offset the integrator must absorb, so I raised ki from 0.1
      to 0.2. With the integral clamp at +/-2, that is at most 0.4 turn units (about
      140 PWM), which is a modest correction, not a windup risk. Partly rejected on
      speed: I kept the speed plan but raised base_speed from 1.8 to 1.9 for a little
      more margin against the 3 s limit, since a failed finish loses the 500-point
      completion term. Speed is still unverified against real ground speed because
      the inputs do not map PWM to m/s, so this is a judgement, not a measured result.
      Sensors, geometry, sensor weights and last_direction line-loss handling are
      unchanged: the critique confirmed the layout covers the 25 mm tape and the antisymmetric
      weights are sound. I kept the full measurement list so the next round can tell
      whether the slalom oscillates (steering_oscillation, max_error) or the robot
      runs short of time (completion_time, progress). Expected result: completion
      on oval and s-bend with lower jitter than the draft; the slalom is still the
      main risk, and these numbers are guesses until telemetry exists.


      - [Open this output](iteration-0/entity1/versions/26636ea9d3b549aba4a5413363263787/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/865dac4d9d44473398c965dfce9868a0/payload.json),
      [entityC1](iteration-0/entityC1/versions/aac4793eb1ac42598e34791ed12502eb/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Critiques the revised kp 3.5, ki 0.2, kd 0.01, base_speed 1.9 design.
      Main points: integral windup on sustained bends, unweighed speed-versus-correction
      trade-off on the slalom, and unverified speed and signal-level assumptions in
      the rationale.


      - [Open this output](iteration-0/entityC2/versions/beea549199b54295b8d6d558c15d01bd/payload.json)

      - Based on: [entity1](iteration-0/entity1/versions/26636ea9d3b549aba4a5413363263787/payload.json)'
  - id: entity2
    label: 'Final design: ki lowered'
    notes: 'Keeps the revised geometry, weights, kp 3.5, kd 0.01 and base_speed 1.9,
      but lowers ki from 0.2 to 0.1 to limit integral windup on sustained bends. The
      rationale also sets the decision rule for each telemetry measure so the next
      round can act on the results.


      ### Rationale


      Kept from the revision: the sensor layout (five sensors at x = -0.024 to +0.024
      m, 12 mm footprints) covers the 25 mm tape, and the antisymmetric weights (-1.5,
      -0.75, 0, 0.75, 1.5) give the correct steering sign. Geometry, weights and last_direction
      line-loss handling are unchanged. kp stays at 3.5 and kd at 0.01 (small damper,
      no large derivative kick on edge transitions), as in the revision. base_speed
      stays at 1.9 for margin against the 3 s limit; the speed is still unverified
      against real ground speed. Changed: ki reduced from 0.2 to 0.1. The critique''s
      windup point is valid: on sustained bends the integral sits near its +/-2 clamp
      and holds a drift of up to 0.2 turn units (about 70 PWM) after the bend, and
      the fixed motor mismatch is small (about 2 percent), so a lower ki is enough.
      Partly rejected: I did not lower base_speed or raise kp to resolve the speed-versus-control
      trade-off, because there is no telemetry yet to show which one wins; the next
      round should decide it from data. Decision rules for the next round: if steering_oscillation
      or max_error is high on the slalom, reduce kp first, then kd; if completion
      is 0 with progress well below 1 and completion_time near 3 s, raise base_speed;
      if line_loss_events is above zero on the slalom, reduce base_speed before changing
      the gains. Expected result: completion on oval and s-bend with lower jitter
      than the draft; the slalom remains the main risk, and these values are estimates
      until telemetry exists.


      - [Open this output](iteration-0/entity2/versions/e221850266184e92a93dcb140c294740/payload.json)

      - Based on: [entity1](iteration-0/entity1/versions/26636ea9d3b549aba4a5413363263787/payload.json),
      [entityC2](iteration-0/entityC2/versions/beea549199b54295b8d6d558c15d01bd/payload.json)'
