  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Sensors forward to y=0.08
    notes: 'Iteration 3''s best controller and geometry, with the sensor bar moved
      forward from y=0.06 to 0.08 m to detect bends earlier. Bend max_error and progress
      are the metrics to check, because every bend failure in the evidence is near
      0.062 m against the 0.06 m limit.


      ### Rationale


      Evidence: iteration 3 (score 361.4, best so far) finished all 20 oval trials
      at 1.86 s, but every s-bend and slalom trial still went off track with max_error
      about 0.062 to 0.063 m. The off-track limit at body_width 0.18 is max(0.06,
      0.0125 + 0.045) = 0.06 m, and body_width is already at its maximum, so geometry
      cannot widen the margin. Iteration 4 showed that raising kd to 1.0 cost oval
      finishes (0.9 to 0.5) and did not fix the bends, so kd 0.8 stays. Iteration
      2 showed that a larger sensor footprint and higher kp did not help. The span
      widening alone has not been tested cleanly. Iteration 1 (sensors at y = 0.06)
      and iteration 3 (base 1.1) both show the bends failing near 0.062 m, so the
      robot leaves the line before it can react to the bend.


      Change: from the iteration 3 baseline, I move all five sensors forward from
      y = 0.06 to y = 0.08 (the maximum allowed). This is the only change to geometry
      or controller. The line is then seen about 2 cm earlier, so the steering can
      start before the wheels reach a sharp bend. Controller values (base_speed 1.1,
      kp 2.5, ki 0.02, kd 0.8, weights [-1,-0.5,0,0.5,1], last_direction) stay the
      same as iteration 3, so any change in the bend results can be attributed to
      sensor lead.


      Expected result: s-bend and slalom max_error should fall, and progress should
      rise above the 0.22 and 0.10 seen in iteration 3. Oval should still finish near
      1.9 s. Hypotheses: (a) the bend failures are caused by late detection, so max_error
      on the s-bend drops below 0.055 m; (b) steering_oscillation may rise slightly
      because the signal leads more, so if it exceeds about 0.25 on the oval, the
      next step is a modest kd change; (c) if the bends still fail at about 0.062
      m with line_loss_events near 1, the limit is the controller''s turn authority
      and the next lever is kp (about 3.0) with the same sensor position.


      - [Open this output](iteration-5/entity0/versions/9a97afe65333435d8d8c6d18992bde7d/payload.json)

      - Based on: [entityR2A](iteration-5/entityR2A/versions/carried-b96fbe401adf2486/payload.json)'
  - id: entityR1
    label: 'Approve: sensors forward'
    notes: 'Approves the single-variable test of moving all sensors from y 0.06 to
      0.08 on the best raced baseline (iteration 3, score 361.4). Bend failures near
      max_error 0.062 persisted across iterations 1 and 3, and this change targets
      late detection, with kp and kd fallbacks if it does not help.


      ### Feedback


      Approved to race. The candidate is the iteration 3 baseline (score 361.4, the
      best raced so far) with one change: all five sensors move from y = 0.06 to y
      = 0.08 m, the allowed maximum. Controller, sensor x positions, sensor_size 0.012,
      weights and last_direction are unchanged, so any change in bend results can
      be attributed to sensor lead. Iteration 3 finished all 20 oval trials at 1.86
      s, but every s-bend and slalom trial still went off track near max_error 0.062
      to 0.063 m. Iteration 1 showed the same bend failure near 0.062 m with the same
      sensor geometry at y = 0.06, so the forward move is the untested lever that
      targets the late-detection hypothesis. The off-track limit is max(0.06, 0.0125
      + 0.18/4) = 0.06 m, so body_width gives no further margin. Iteration 4 showed
      that kd 1.0 cost oval finishes (0.9 to 0.5) without fixing the bends, so kd
      stays at 0.8. Iteration 2 showed that a larger footprint and higher kp did not
      help. Next race: if the s-bend and slalom max_error falls below about 0.055
      m and progress rises above the 0.22 and 0.10 seen in iteration 3, keep y = 0.08
      and tune for completion. If the bends still fail at about 0.062 m with line_loss_events
      near 1, the limit is turn authority rather than detection, so the next step
      is kp near 3.0 at the same y. If oval steering_oscillation rises above about
      0.25 while the oval still finishes, the lead is adding jitter, and the next
      step is a modest kd change.


      ### Requested changes


      - If the s-bend and slalom still leave the line at max_error about 0.062 m with
      line_loss_events near 1: keep sensor y at 0.08 and raise kp from 2.5 to about
      3.0, since iteration 2 showed kp 3.0 alone did not hurt the oval when the footprint
      was 0.012.

      - If the bends improve but oval steering_oscillation exceeds about 0.25 (iteration
      3 baseline 0.18): keep y 0.08 and lower base_speed to about 1.2 or adjust kd
      slightly, rather than adding kp, to reduce jitter without losing oval finishes.


      - [Open this output](iteration-5/entityR1/versions/f7571ca021014c6f8e3e8bbf40fd38a5/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/9a97afe65333435d8d8c6d18992bde7d/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-b96fbe401adf2486/payload.json)'
