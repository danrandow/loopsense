map:
  id: race-183-opt-eval-muted
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: 7-sensor wider array
    notes: 'Extends the iteration 3 baseline to seven sensors spanning +/-0.075 m,
      with outer weights of +/-1.5, to stop line loss at large lateral error on the
      s-bend and slalom. The oval still finished in every iteration 3 trial, and the
      change rests on the line-loss and max_error evidence from iterations 1 to 5.


      ### Rationale


      Evidence: iteration 3 (score 361.4) is the best raced design. Its oval finishes
      reliably at about 1.86 s, but every s-bend and slalom trial goes off track at
      max_error about 0.062 to 0.063 m, just above the 0.06 m off-track limit (body_width
      is already at its maximum). Slalom shows about 1 line-loss event per run with
      progress stuck near 0.10, which points to the tape leaving the five-sensor span
      (x = -0.06 to +0.06) at large lateral error. Iteration 5 (sensors at y = 0.08)
      did not fix the bends, so sensor lead is not the main limit. Iteration 4 (kd
      1.0) cost oval finishes and did not fix the bends, so kd stays at 0.8. Iteration
      2 changed several things at once and hurt the oval, so its wider span was never
      tested cleanly. Iteration 1 at base_speed 1.3 and iteration 3 at 1.1 both fail
      the bends, so speed is not the lever. The untested hypothesis is that the outer
      sensors lose the tape at large error. This is the one change I make from iteration
      3: seven sensors at x = -0.075 to +0.075 in 0.025 m steps (y = 0.06, size 0.012).
      The 0.025 m spacing keeps at least one 12 mm footprint on a 25 mm tape everywhere
      in the span. The outer weights rise to +/-1.5, so the steering signal is stronger
      at large error. Controller gains otherwise match iteration 3 (base 1.1, kp 2.5,
      ki 0.02, kd 0.8, last_direction). Expected result: line_loss_events on slalom
      and s-bend fall toward 0, s-bend max_error drops below 0.055 m, and s-bend progress
      rises above 0.3, with the oval still finishing near 1.9 s. Risks: the larger
      weights raise the effective gain by about 1.5x, so steering_oscillation may
      rise above 0.3 on the oval. If that happens, reduce kp to about 2.0 or the outer
      weights to about 1.2. If line loss disappears but the robot still exits, the
      limit is turn authority, and the next lever is kp near 3.0 with this wider array.
      Hypotheses: (a) line loss at large error causes the bend failures; (b) signal
      scale change needs kp retuning. Measurements wanted: per-track completion, progress,
      max_error, line_loss_events, steering_oscillation and completion_time.


      - [Open this output](iteration-7/entity0/versions/954111bfcbf544c4b94174d58ba04574/payload.json)

      - Based on: [entityR2A](iteration-7/entityR2A/versions/carried-ab66bbdfabc5d07d/payload.json)'
  - id: entityR1
    label: 'Hold: match weight scale'
    notes: 'Sends the 7-sensor span candidate back because its ±1.5 outer weights
      raise effective gain about 1.5x, which iteration 2 showed can hurt the oval.
      Asks for weights spread over ±1.0 so the span is the only change versus iteration
      3 (best raced, 361.4).


      ### Feedback


      Revise before racing. The sensor span change is a sound single-variable test,
      but the weights are not. The candidate sets the outer sensors to ±1.5, so the
      steering signal can reach ±1.5 where iteration 3 (best raced, 361.4) reached
      ±1.0. That raises the effective proportional gain by about 1.5x (kp 2.5 behaves
      like about 3.75 at the edge). Iteration 2 showed that a higher effective gain
      with a larger footprint cut oval finishes (0.55) and raised steering_oscillation
      (0.27), so this change could cause the same oval damage. It would also confound
      the span test, which the team has already had trouble reading. Keep the signal
      scale equal to iteration 3 by spreading the seven weights across the same ±1.0
      range, for example [-1.0, -0.67, -0.33, 0.0, 0.33, 0.67, 1.0]. The rest of the
      candidate (7 sensors at x = ±0.075, 0.025 m spacing, y 0.06, sensor_size 0.012,
      kp 2.5, kd 0.8, ki 0.02, base_speed 1.1, last_direction) can stay as it is.
      The 0.025 m spacing with 12 mm footprints still covers the 25 mm tape, so there
      is no gap for the line to hide in. Once the revision is in, race it with the
      scale matched; the race will show whether the outer coverage fixes line loss
      on the s-bend and slalom. Do not infer its performance from the rationale, which
      is a hypothesis.


      ### Requested changes


      - Set sensor_weights to a scale-matched spread across the same ±1.0 range, for
      example [-1.0, -0.67, -0.33, 0.0, 0.33, 0.67, 1.0], so the signal peak matches
      iteration 3 (kp 2.5 unchanged). This keeps the span as the only effective change,
      since iteration 2 showed that a higher effective gain hurts the oval.

      - Keep the 7 sensors at x = -0.075, -0.05, -0.025, 0, 0.025, 0.05, 0.075 m,
      y 0.06, sensor_size 0.012, kp 2.5, kd 0.8, ki 0.02, base_speed 1.1, last_direction.
      Iteration 3 (same gains, 5 sensors at ±0.06) finished the oval 20 of 20, so
      this isolates the span effect.

      - If the scale-matched race still ends slalom and s-bend off track with line_loss_events
      near 1 and max_error at or above 0.06 m, the limit is turn authority rather
      than coverage. Then raise kp from 2.5 to about 3.0 on the same scale-matched
      weights, not on the 1.5-scaled weights.


      - [Open this output](iteration-6/entityR1/versions/73589cab6b4f4807a1da597f1757f97c/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/bf9aff927a5a4a6798a6f9d84b2a2617/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-ab66bbdfabc5d07d/payload.json)'
