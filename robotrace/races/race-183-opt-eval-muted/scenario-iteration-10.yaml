map:
  id: race-183-opt-eval-muted
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Wider 7-sensor span
    notes: 'Iteration 8''s controller with the seven sensors widened to the +/-0.08
      m limit, a single-variable test of span. Based on slalom line loss (about 1
      per run) and the s-bend gain from the seven-sensor array in iteration 8.


      ### Rationale


      Evidence: iteration 8 (score 430.6, best) and iteration 9 (412.4) both finish
      the oval 20 of 20 at about 1.87 s. Slalom is stuck at progress 0.18 with about
      one line-loss event per run and max_error about 0.063 m, just over the 0.06
      m off-track limit. Body width is already at its maximum, so the margin has to
      come from the sensors or the controller. Iteration 9 tested kp 3.0 on its own
      and lowered the s-bend score (progress 0.59 to 0.53, no finishes), so higher
      kp is not the lever. The seven-sensor span (x = -0.075 to +0.075) helped the
      s-bend a lot, which points to sensor coverage at large lateral error as the
      main limit. Slalom still loses the tape at about 0.06 m, which suggests the
      outer edge of the array is still too close to the line for those excursions.


      Change: keep the iteration 8 controller (base_speed 1.1, kp 2.5, ki 0.02, kd
      0.8, weights [-1.5,-1,-0.5,0,0.5,1,1.5], last_direction) and widen the array
      to the sensor limit of +/-0.08 m. The seven sensors move to x = -0.08, -0.054,
      -0.027, 0, 0.027, 0.054, 0.08 at y = 0.06 with size 0.012. The spacing of about
      0.027 m is still under the 25 mm tape plus footprint, so the tape cannot slip
      between sensors. This is the only change from iteration 8, and it tests span
      alone.


      Expected result: slalom line_loss_events fall toward 0.5 or below, slalom max_error
      falls under 0.058 m, and slalom progress rises above 0.25. S-bend progress should
      hold near 0.6 or better. Oval should still finish near 1.9 s.


      Risks: the outer sensors may read the tape less often at small error, which
      could add jitter on the oval (steering_oscillation above 0.25). If the oval
      degrades, the next step is outer weights of about 1.2.


      Hypotheses: (a) slalom exits come from the tape leaving the array at large error,
      so widening the span should cut line loss and raise slalom progress. (b) If
      slalom still stalls near 0.18 with line loss at 1, the limit is entry into the
      slalom, and the next lever is sensor y position or the line_loss mode.


      Measurements wanted: per-track completion, progress, max_error, line_loss_events,
      steering_oscillation and completion_time.


      - [Open this output](iteration-10/entity0/versions/e1be9d60ee884b0da86d233ee87daf35/payload.json)

      - Based on: [entityR2A](iteration-10/entityR2A/versions/carried-4be00acd9160f681/payload.json)'
  - id: entityR1
    label: 'Approve: wider 0.08 m'
    notes: 'Approved the iteration 8 controller with seven sensors at x = +/-0.08
      m, a single-variable test of span. It rests on iteration 8 (s-bend progress
      0.22 to 0.59 from widening) and iteration 9 (kp 3.0 hurt s-bend), with the oval
      as the main risk.


      ### Feedback


      Written before this candidate races, so it states no outcome. The candidate
      is the iteration 8 controller (base_speed 1.1, kp 2.5, ki 0.02, kd 0.8, weights
      [-1.5 to 1.5], last_direction) with the seven sensors moved from x = +/-0.075
      to +/-0.08 m, the allowed limit. It is a single-variable change from the best
      raced design (iteration 8, score 430.6), so any shift in the per-track numbers
      can be attributed to span. Iteration 8 showed that widening the array from five
      to seven sensors lifted s-bend progress from 0.22 to 0.59 and gave one s-bend
      finish, which supports coverage at large lateral error as a real lever. Iteration
      9 showed that raising kp to 3.0 on the same array cut s-bend progress to 0.53
      with no finishes, so gain is not the lever and kp stays at 2.5. Slalom is unchanged
      at progress 0.18, about 1 line-loss event per run, and max_error about 0.063
      m, so the outer edge is the thing to test. The 0.027 m spacing leaves a 0.015
      m gap between 12 mm footprints, which is smaller than the 25 mm tape, so the
      tape should always be seen by at least one sensor. The main risk is oval jitter:
      the outer sensors may read the tape less often at small error. Oval was 20 of
      20 at 1.87 s with steering_oscillation 0.17 in iteration 8, so the oval is the
      main thing to check. Next race, read per track: if the oval stays at 20 of 20
      with steering_oscillation at or below about 0.25 and slalom line_loss_events
      fall toward 0.5 or below, keep this span and then consider a single controller
      change. If the oval finish rate drops or steering_oscillation rises above about
      0.3, reduce the outer weights to about 1.2 before changing the array. If slalom
      still shows line_loss_events near 1 with max_error at or above 0.06 m, the limit
      is likely turn authority or line loss mode, not coverage. Because this is the
      last exploration step before the final iteration, keep the best design per track
      in mind when choosing what to carry forward. Decision: approve, because the
      candidate is valid, is a clean test of the one hypothesis with the most evidence
      behind it, and an unscored iteration earns nothing.


      ### Requested changes


      - If the oval stays at 20 of 20 with steering_oscillation at or below about
      0.25 and slalom line_loss_events fall toward 0.5 or below: keep the 0.08 m span
      and test one controller change next, such as base_speed 1.2 to recover s-bend
      progress, since iteration 3 showed speed loss hurts bend progress.

      - If the oval finish rate drops below 1.0 or steering_oscillation exceeds about
      0.3: keep the 0.08 m span but reduce the outer sensor_weights to about 1.2 (for
      example [-1.2, -0.8, -0.4, 0, 0.4, 0.8, 1.2]) so the effective gain stays near
      iteration 8.

      - If slalom still shows line_loss_events near 1 with max_error at or above 0.06
      m after the span change: change line_loss from last_direction to search_right,
      which iteration 9 did not test, before changing kp again, because iteration
      9 showed kp 3.0 did not help the bends.


      - [Open this output](iteration-10/entityR1/versions/e29cd11816ec468888ba837f19809bb5/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/e1be9d60ee884b0da86d233ee87daf35/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-4be00acd9160f681/payload.json)'
