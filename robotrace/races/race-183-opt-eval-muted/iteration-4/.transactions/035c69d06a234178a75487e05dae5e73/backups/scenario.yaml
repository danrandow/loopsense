map:
  id: race-183-opt-eval-muted
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: kd 1.0, speed 1.3 retest
    notes: 'Restores base_speed 1.3, which beat 1.1 on the s-bend and slalom, and
      raises kd to 1.0 to damp the bend overshoot that caps max_error near 0.062 m.
      Geometry is the iteration 3 wide-span layout, so the only changes are controller
      values. Evidence: iteration 3 (score 361) finished all oval trials but left
      the line on every bend.


      ### Rationale


      Evidence. Iteration 3 (score 361.4, best so far) finished all 20 oval trials,
      but every s-bend and slalom trial still ended off track with max_error about
      0.062 to 0.063 m. Checking the contract, the off-track limit is max(0.06, 0.0125
      + body_width/4). For body_width 0.18 that is 0.06 m, not the 0.0575 m I assumed
      in iteration 2. So the robot exceeds the limit by only 2 to 3 mm on the bends,
      and body_width cannot help because it is already at its useful ceiling.


      What the iterations show: (a) Iteration 1 to 3 comparison: lowering base_speed
      from 1.3 to 1.1 with the wider sensor span made s-bend progress fall (0.27 to
      0.22) and slalom progress fall (0.18 to 0.10). Speed overshoot is therefore
      not the main cause of bend failure. The robot is too slow to correct, not too
      fast. (b) Iteration 2 widened the sensor span, raised sensor_size to 0.016,
      raised kp to 3.0 and kd to 1.0 together. The oval finish rate fell to 0.55 and
      control_effort rose, so the larger footprint and higher kp are the likely cause.
      The wider span alone was never tested cleanly. (c) Iteration 3 has the widest
      span with sensor_size 0.012 and a clean kp 2.5 / kd 0.8 / ki 0.02 controller,
      which is the cleanest current baseline.


      Changes from iteration 3: (1) base_speed 1.1 to 1.3. Iteration 3 showed that
      the slower speed hurt bend progress, and iteration 1 at 1.3 finished the oval
      in 1.89 s, which leaves margin for the 3 s limit. (2) kd 0.8 to 1.0. Higher
      damping should reduce the swing that carries the robot across the 0.06 m limit
      on the bends. kp stays at 2.5 and sensor_size stays at 0.012, so this is a single-variable
      change on the controller relative to the sensor and speed setup. Geometry, span
      and weights are otherwise unchanged from iteration 3.


      Expected result: s-bend and slalom progress above 0.3, with max_error falling
      toward 0.05 m. Oval should still finish in about 1.9 s. Hypotheses: (a) the
      bend overshoot is damping-limited, so kd 1.0 should cut max_error on the s-bend;
      (b) if steering_oscillation rises above about 0.3 on the oval, kd is too high;
      (c) if slalom progress stays near 0.1 with line_loss_events near 1, the limit
      is line loss at the bend entry, and the next lever is sensor y position or line_loss
      mode. Measurements wanted: per-track completion, progress, max_error, line_loss_events,
      steering_oscillation and completion_time.


      - [Open this output](iteration-4/entity0/versions/952bc0ec894a44d0a8d9cbb10eb481cd/payload.json)

      - Based on: [entityR2A](iteration-4/entityR2A/versions/carried-e8463de867359b86/payload.json)'
  - id: entityR1
    label: 'Approve: speed up, kd 1.0'
    notes: 'Approved the candidate as a controlled step from the best raced design
      (iteration 3, score 361.4): base_speed 1.1 to 1.3 and kd 0.8 to 1.0, with the
      sensor span and kp unchanged. The bend overshoot in iterations 1 and 3 and the
      oval finish time at speed 1.3 in iteration 1 support it, and it is worth racing
      to get telemetry on the bends.


      ### Feedback


      Approved for the race. The candidate sits on the iteration 3 base (score 361.4,
      the best raced so far): same sensors (x = -0.06 to 0.06 m, y 0.06, sensor_size
      0.012), kp 2.5, ki 0.02, and last_direction line loss. It changes two controller
      levers at once: base_speed 1.1 to 1.3, and kd 0.8 to 1.0. The rationale calls
      the kd change single-variable, but the speed change is also a change from iteration
      3, so any shift in results cannot be attributed to one lever. Iteration 2 showed
      that confounded changes are hard to read, so the next critique should rely on
      per-track numbers rather than the aggregate score. The evidence supports the
      speed change. Iteration 1 at base_speed 1.3 finished the oval in 1.89 s, and
      iteration 3 at 1.1 showed that lower speed reduced bend progress (s-bend 0.27
      to 0.22, slalom 0.18 to 0.10). The kd change is supported by the bend overshoot
      in iterations 1 and 3 (max_error about 0.062 to 0.063 m, just above the 0.06
      m off-track limit). The oval is the main risk: iteration 1 at speed 1.3 with
      the narrower span finished 18 of 20, so a higher speed on the wider span could
      cost oval finishes. Review the race as follows. If oval completion holds at
      1.0 and the bends still end off track with max_error at or above 0.06 m, the
      damping is not the limit. Next, lower kp only if steering_oscillation rises,
      or change line_loss or sensor y position to address the slalom line loss. If
      the bends improve (max_error below 0.05 m, progress above 0.3) while oval completion
      stays at 1.0, keep this controller and tune for completion. If the oval drops
      below 0.9 completion, return base_speed to about 1.2.


      ### Requested changes


      - If the oval completion falls below 0.9 at base_speed 1.3: set base_speed to
      about 1.2 and keep kd 1.0, since iteration 3 (speed 1.1) finished the oval 20
      of 20 and iteration 1 (speed 1.3) finished 18 of 20.

      - If the s-bend and slalom still go off track with max_error at or above 0.06
      m and line_loss_events near 1: change the sensor y position (for example from
      0.06 to 0.08 m, the allowed maximum) to give the controller earlier warning
      at the bend entry, rather than adjusting kp alone.

      - If steering_oscillation on the oval rises above about 0.3 (iteration 2 at
      kp 3.0 with kd 1.0 reached 0.27): lower kp from 2.5 to about 2.0 while keeping
      kd 1.0, to test whether the damping is now too strong relative to the proportional
      term.


      - [Open this output](iteration-4/entityR1/versions/b7e0bbd32a3f4829abee7ada35f1f847/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/952bc0ec894a44d0a8d9cbb10eb481cd/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-e8463de867359b86/payload.json)'
