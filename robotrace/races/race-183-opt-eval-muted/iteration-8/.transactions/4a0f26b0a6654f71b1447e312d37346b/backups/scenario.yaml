map:
  id: race-183-opt-eval-muted
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: 7-sensor wide array
    notes: 'Widens the sensor array to +/-0.075 m with 0.025 m spacing and outer weights
      of +/-1.5, keeping iteration 3''s controller. Targets the slalom line loss (about
      1 event per run, progress stuck near 0.10) and the s-bend off-track exits at
      max_error about 0.062 m. Rests on the untested wide-array hypothesis, since
      iterations 6 and 7 never raced.


      ### Rationale


      Evidence: iteration 3 (score 361.4) and iteration 5 (349.6) both finish every
      oval trial at about 1.86 to 1.89 s, but every s-bend and slalom trial goes off
      track at max_error about 0.062 to 0.063 m. The off-track limit is max(0.06,
      0.0125 + 0.18/4) = 0.06 m, and body_width is already at its maximum, so geometry
      cannot widen the margin. Iteration 5 (sensors at y = 0.08) did not change the
      bend failures, so sensor lead is not the main limit. Iteration 4 (kd 1.0) cost
      oval finishes and did not fix the bends, so kd stays at 0.8. Iteration 2 changed
      four things at once and hurt the oval, so its wider span was never tested cleanly.
      Slalom shows about 1 line-loss event per run with progress stuck near 0.10,
      which points to the tape leaving the five-sensor span (x = -0.06 to +0.06) at
      large lateral error.


      Change (the only change from iteration 3): seven sensors at x = -0.075, -0.05,
      -0.025, 0, 0.025, 0.05, 0.075 m, y = 0.06, size 0.012 m. The 0.025 m spacing
      keeps at least one 12 mm footprint on the 25 mm tape across the whole span,
      so the tape cannot hide between sensors. Outer weights rise to +/-1.5, so the
      steering signal is stronger at large error. Controller gains stay as in iteration
      3 (base_speed 1.1, kp 2.5, ki 0.02, kd 0.8, last_direction). This is the same
      design proposed in iterations 6 and 7, which never raced. I am carrying it forward
      because it is the one untested hypothesis that targets the measured line-loss
      failure. The earlier iterations are not repeated.


      Expected result: slalom and s-bend line_loss_events fall toward 0, s-bend max_error
      drops below 0.055 m, and s-bend progress rises above 0.3. Oval should still
      finish near 1.9 s.


      Risks: the outer weights raise the effective gain by about 1.5x (signal can
      reach 1.5, so turn can reach about 3.75). Oval steering_oscillation may rise
      above 0.3. If so, reduce kp to about 2.0 or the outer weights to about 1.2 in
      the next iteration. If line loss disappears but the robot still exits, the limit
      is turn authority, and the next lever is kp near 3.0 with this wider array.


      Hypotheses: (a) line loss at large error causes the bend failures; (b) the signal-scale
      change needs kp retuning. Measurements wanted: per-track completion, progress,
      max_error, line_loss_events, steering_oscillation and completion_time.


      - [Open this output](iteration-8/entity0/versions/1dd016df712c48169bacbaef5c6ae084/payload.json)

      - Based on: [entityR2A](iteration-8/entityR2A/versions/carried-ab66bbdfabc5d07d/payload.json)'
  - id: entityR1
    label: 'Revise: scale-match'
    notes: 'The candidate still uses ±1.5 outer weights, which raise the effective
      gain about 1.5x, despite my earlier request to scale-match them. I ask for a
      ±1.0 spread so the wider 7-sensor span is tested alone, as iteration 3 showed
      the oval fails when gain rises (iteration 2). This is the first revision on
      this candidate, so I have budget for one more review and the race.


      ### Feedback


      Revise before racing. The candidate still uses outer weights of ±1.5, even though
      my last review (iteration 6) asked for a scale-matched spread. The rationale
      still cites the ±1.5 weights as the design, so the requested change was not
      applied. The geometry is a sound single-variable test: seven sensors at x =
      ±0.075 m in 0.025 m steps (y 0.06, sensor_size 0.012) keep at least one 12 mm
      footprint on the 25 mm tape across the span, and the wider span is the untested
      hypothesis for the slalom line loss (about 1 event per run with progress stuck
      near 0.10 in iterations 3 and 5). The weights are the problem. With ±1.5 at
      the edges, the signal can reach 1.5 where iteration 3 (best raced, 361.4) reached
      1.0, which raises the effective proportional gain by about 1.5x. Iteration 2
      showed that a higher effective gain, together with a larger footprint, cut oval
      finishes from 0.9 to 0.55 and raised steering_oscillation to 0.27. This candidate
      could repeat that damage and would confound the span test. Keep the signal scale
      equal to iteration 3 by spreading the seven weights across ±1.0. Keep the controller
      at iteration 3 values (base_speed 1.1, kp 2.5, ki 0.02, kd 0.8, last_direction),
      since iteration 3 finished the oval 20 of 20 at about 1.86 s. Next race, judge
      it per track. If the slalom and s-bend still leave the line with line_loss_events
      near 1 and max_error at or above 0.06 m, coverage is not the limit and the next
      step is turn authority: raise kp to about 3.0 on the same scale-matched weights.
      If the oval steering_oscillation rises above 0.3 with scale-matched weights,
      lower kp to about 2.0 before changing the array.


      ### Requested changes


      - Set controller.sensor_weights to a scale-matched spread across ±1.0, for example
      [-1.0, -0.67, -0.33, 0.0, 0.33, 0.67, 1.0]. Iteration 2 showed that a higher
      effective gain cut oval finishes (0.9 to 0.55), so the signal peak must match
      iteration 3.

      - Keep the seven sensors at x = -0.075, -0.05, -0.025, 0, 0.025, 0.05, 0.075
      m, y 0.06, sensor_size 0.012, and keep kp 2.5, kd 0.8, ki 0.02, base_speed 1.1,
      line_loss last_direction. Iteration 3 (same gains, five sensors at ±0.06) finished
      the oval 20 of 20, so this isolates the span effect.

      - If the scale-matched race still ends the slalom and s-bend off track with
      line_loss_events near 1 and max_error at or above 0.06 m, raise kp from 2.5
      to about 3.0 on the same scale-matched weights, not on the ±1.5 weights.


      - [Open this output](iteration-7/entityR1/versions/d5b1d4c78cc448689d9143c19480d1a5/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/954111bfcbf544c4b94174d58ba04574/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-ab66bbdfabc5d07d/payload.json)'
