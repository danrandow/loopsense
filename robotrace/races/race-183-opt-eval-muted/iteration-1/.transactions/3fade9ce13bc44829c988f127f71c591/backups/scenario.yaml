overrides:
  entities:
  - id: entity0
    label: Softer steer, more
    notes: 'Reduced base_speed to 1.3 and kp to 2.5, raised kd to 0.8, and widened
      the body to 0.18 m, because all development runs went off track with max_error
      about 0.06 m. Sensors moved forward to y = 0.06 to react earlier.


      ### Rationale


      Evidence: every development trial on every track ended off_track (0 finishes).
      Progress was only 0.04 to 0.11, and max_error was about 0.06 m, just above the
      off-track limit of about 0.0525 m (tape half-width 0.0125 plus body_width/4
      = 0.04). The robot leaves the line within the first fraction of each course,
      and the cause is the aggressive control, not sensing: rms_error stayed near
      0.03 m, and steering_oscillation and control_effort were moderate. With kp 4
      and base_speed 1.8, a full-scale signal gives a turn of about 4 and a wheel
      PWM difference of about 2800. That is likely overshooting the bends, and the
      damping (kd 0.3) is too weak to stop the swing.


      Changes: (1) base_speed 1.8 to 1.3, so the robot can corner before it overshoots.
      This trades some speed, but the finish needs about 1.5 m/s average, so I will
      check the time once it completes. (2) kp 4.0 to 2.5, to soften the steering
      response. (3) kd 0.3 to 0.8, to add damping against the overshoot swing. (4)
      ki 0.05 to 0.02, to limit integral windup on the bends. (5) body_width 0.16
      to 0.18, the maximum, which raises the off-track limit to about 0.0575 m and
      gives a larger margin without changing the dynamics. (6) Sensors moved forward
      to y = 0.06, so the line is seen earlier and the steering reacts before the
      wheels reach the bend. Sensor x positions and weights are unchanged, so the
      signal scale still sits in [-1, 1].


      Expected result: the robot should stay on the line for longer on oval and s-bend,
      with progress well above 0.5 and possibly completion on the oval. Slalom may
      still wobble. Hypotheses to check: (a) the off-track exits are caused by overshoot,
      so max_error should fall below 0.04 m; (b) with base_speed 1.3, the finish time
      may be above 3 s, so if the robot completes slowly, base_speed is the next lever;
      (c) steering_oscillation should drop with the higher kd.


      - [Open this output](iteration-1/entity0/versions/c6cfa61373f9401ebc83e7b85bc24c34/payload.json)

      - Based on: [entityR2A](iteration-1/entityR2A/versions/carried-09a3b7a70abb42c4/payload.json)'
  - id: entityR1
    label: Approve soft-steer build
    notes: 'Approved the candidate for racing because it is valid and directly targets
      the iteration 0 failure, where all 60 trials went off_track with max_error about
      0.06 m. Feedback corrects the off-track margin (the 0.06 m floor still applies)
      and flags that base_speed 1.3 may be too slow to finish in 3 s.


      ### Feedback


      Approving this candidate for the race. Iteration 0 was 0 finishes in 60 trials,
      with every run ending off_track and max_error of about 0.06 m on all three tracks
      (iteration 0 outcome table). That makes overshoot on bends the failure to test,
      so this candidate changes the control aggressiveness rather than the sensing.
      Two corrections to the rationale. First, the off-track limit is max(0.06, tape_half_width
      + body_width/4). With body_width 0.18 the second term is 0.0575 m, so the 0.06
      m floor still applies and the wider body adds no margin. Second, base_speed
      1.3 gives base PWM of about 2660, which is below the roughly 1.5 m/s needed
      to finish in 3 s. Finishing will likely need base_speed back toward 1.5 to 1.6
      once the robot stays on the line. The other changes (kp 2.5, kd 0.8, ki 0.02,
      sensors at y 0.06) are sensible and in range. Next race: if the robot stays
      on track and progress rises well above 0.04, use the telemetry to set speed.
      If it still goes off_track with max_error above 0.06 m, lower kp further. If
      it completes but takes over 3 s, raise base_speed.


      ### Requested changes


      - If the race completes but completion_time is above 3 s: raise base_speed from
      1.3 to about 1.5 to 1.6, keeping kp 2.5 and kd 0.8, since iteration 0 showed
      the off-track failure is caused by aggressive steering rather than sensing.

      - If the race still ends off_track with max_error above 0.06 m (iteration 0
      baseline 0.0608 on oval): lower kp from 2.5 to about 1.8 and keep base_speed
      1.3, because steering overshoot is the suspected cause.

      - If steering_oscillation stays high (iteration 0 baseline 0.07 to 0.16) after
      the robot stays on track: raise kd from 0.8 to about 1.2 before changing kp.


      - [Open this output](iteration-1/entityR1/versions/cfd1fec3bd0a4fc3b4650e7e1a092434/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/c6cfa61373f9401ebc83e7b85bc24c34/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-09a3b7a70abb42c4/payload.json)'
