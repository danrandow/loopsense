map:
  id: race-108-opt-eval
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: 'Final: best-measured kp'
    notes: 'Delivers the iteration 10 design unchanged (kp 3.4, kd 0.30, sensors x
      -0.03..0.03 at y 0.06), the best measured score at 148.11. Kp 3.1 was not chosen
      because it is untested and oscillation is already rising to 0.307 on the oval.


      ### Rationale


      This is the final iteration, so the design written here is the one carried forward
      to the unseen-track race. The best measured design is iteration 10 (kp 3.4,
      kd 0.30, ki 0.3, base_speed 1.3, sensors at y 0.06 with x -0.03..0.03, sensor_size
      0.012, last_direction), which scored 148.11, up from 132.80 at kp 3.7. Progress
      rose on every track as kp fell (oval 0.53 to 0.64, s-bend 0.32 to 0.33). The
      trend in score across the last three steps (116.27, 132.80, 148.11) is consistent.
      The main concerns are that oval steering_oscillation rose to 0.307 and that
      max_error is still 0.064 m on every track, so every run still leaves the line.
      I considered a further kp step to about 3.1, since the score has risen with
      each kp reduction. I did not choose it. It is untested, the oscillation trend
      is worsening, and a regression on the unseen track cannot be checked by a later
      race. I therefore deliver the measured best design unchanged. The Evaluator
      approved this exact build, so the race is a repeat check of the 148.11 result.
      Expected result: a score near 148, with progress and oscillation matching iteration
      10. Hypotheses for the record: (1) the off-track floor near 0.064 m is set by
      the track and disturbance, not by gains, since it has not moved across iterations
      0 to 10; (2) lower kp improves progress until oscillation becomes the limit.
      Measurements wanted: steering_oscillation on every track, progress, line_loss_events,
      max_error, rms_error and completion_time. These will show whether oscillation
      is the next constraint.


      - [Open this output](iteration-11/entity0/versions/fc92b11d598244678c05b9f55709292e/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-7088a64685c9b36f/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-28aa407fbf131880/payload.json)'
  - id: entityR1
    label: Approve best build (kp
    notes: 'Approved the iteration 10 design unchanged, the best raced build at 148.11,
      because this is the final iteration and an untested revision could not be checked.
      The feedback cites the score trend from iterations 8 to 10 and flags oval oscillation
      (0.307) and the max_error floor (0.063 to 0.065 m) as open risks.


      ### Feedback


      Judged before racing; nothing here states how this candidate will perform. The
      candidate matches the iteration 10 design, which is the best raced design so
      far (score 148.11, up from 132.80 at kp 3.7 and 116.27 at kp 4.0). Its controller
      is kp 3.4, kd 0.30, ki 0.3, base_speed 1.3, last_direction, with sensors at
      y 0.06, x -0.03..0.03, sensor_size 0.012 and weights [-2,-1,0,1,2]. All values
      are inside their contract limits. Across iterations 8 to 10 the score rose each
      time kp fell, and progress rose on every track (oval 0.46 to 0.64, s-bend 0.26
      to 0.33). The known weaknesses are the oval steering_oscillation of 0.307 (iteration
      10), which is above the 0.25 concern level, and max_error of 0.063 to 0.065
      m, which has not moved with any gain, sensor y, footprint or x-spread change
      in iterations 0 to 10. A further kp step (for example to 3.1) or a kd step (for
      example to 0.35) would be untested, and no iteration remains after this one
      to check a regression. This is the final iteration, so a revision would not
      be raced in time to be measured. Approve the measured best build so that the
      unseen-track race runs on a known design.


      ### Requested changes


      - For the record only, if a later iteration were available: test controller.kd
      0.35 with kp 3.4 unchanged, because iteration 7 (kd 0.25 to 0.30) raised score
      from 84.33 to 93.70 while holding oval oscillation near 0.246, and oscillation
      is now the constraint at 0.307.

      - For the record only: if oval steering_oscillation stays above 0.3 after a
      further kp step, restore kp 3.4, since the iteration 8 to 10 trend shows lower
      kp raising progress.


      - [Open this output](iteration-11/entityR1/versions/bafd3f823d5c42419e56b72664fa572c/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/fc92b11d598244678c05b9f55709292e/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-28aa407fbf131880/payload.json)'
