map:
  id: race-108-opt-eval
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: kd 0.25 damps kp 4.0
    notes: 'Keeps kp 4.0 and raises kd from 0.2 to 0.25, following the Evaluator''s
      rule for oscillation near 0.21 after the kp rise. Iteration 3 (kp 4.0, kd 0.2)
      scored 62.5, below the best of 71.2, so this tests whether extra damping restores
      progress.


      ### Rationale


      Evidence: iteration 3 (kp 4.0, kd 0.2) scored 62.5, below the best raced design
      (iteration 1, kp 3.0, kd 0.15, score 71.2). Progress fell on every track, and
      steering_oscillation rose to 0.21 on the oval. max_error stayed at 0.062 to
      0.065 m on every track, and each run still had one line-loss event. Raising
      ki (iteration 2) and raising kp (iteration 3) both failed to move max_error,
      so the bias is not a simple gain problem. The feedback rule applies directly:
      oscillation above about 0.2 after a kp rise calls for more kd before any further
      kp change. Change: controller.kd goes from 0.2 to 0.25 and kp stays at 4.0,
      which tests whether extra damping makes the stiffer kp usable. ki stays at 0.3
      (the best ki tested) and base_speed stays at 1.3. Geometry is unchanged, so
      the race isolates the steering damping. Expected result: steering_oscillation
      falls below about 0.2, and progress holds or rises relative to iteration 3.
      max_error may not fall below 0.06 m, since the bias is not yet explained. Hypotheses:
      (1) kd 0.25 damps the kp 4.0 overshoot and restores progress; (2) the max_error
      floor near 0.063 m comes from sensor look-ahead, not gain. Measurements wanted:
      steering_oscillation, max_error, progress, line_loss_events, and control_effort
      on every track. If oscillation is now under 0.2 and max_error is still near
      0.06 m, the next step is to move the sensors forward to y about 0.06 for earlier
      look-ahead, or kp about 5. If progress reaches about 0.995 with no line loss,
      raise base_speed toward 1.8.


      - [Open this output](iteration-4/entity0/versions/1b2cb9f8b9a54b5aa4ac6226813fb9b8/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-ed2b5f711c927d5a/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-c5e8e61ad42d6ef5/payload.json)'
  - id: entityR1
    label: Approve kd 0.25 at kp 4.0
    notes: 'Approves the kd 0.25 damping test on the kp 4.0 design, since iteration
      3 showed oscillation near 0.21 and the feedback rule calls for more kd before
      further kp. The race is worth running because max_error was flat at about 0.063
      m across all iterations, and the next-step changes depend on the telemetry.


      ### Feedback


      Judged before racing. The candidate is valid and changes only controller.kd
      (0.2 to 0.25) relative to iteration 3, which kept kp at 4.0. Iteration 3 scored
      62.5, below the best raced design (iteration 1, kp 3.0, kd 0.15, score 71.2).
      Its oscillation rose to 0.21 on the oval, which is the case the earlier feedback
      rule covers: raise kd before changing kp. The candidate tests that. Iteration
      2 showed that raising ki to 0.9 lowered progress on every track, so ki stays
      at 0.3, and geometry and base_speed 1.3 are unchanged, so the race isolates
      the damping. The main weakness is that max_error has sat at 0.062 to 0.065 m
      in every iteration (0 to 3) whatever the gains, so a kd change alone is unlikely
      to remove the off-track exit. Do not treat the expected outcome in the rationale
      as established. After the race, decide from the measurements. If steering_oscillation
      stays under about 0.2 and max_error is still near 0.06 m, the next step is to
      move the sensors forward to y about 0.06 for earlier look-ahead (a geometry
      change), or try kp about 5 with the same kd. If progress reaches about 0.995
      with no line loss, raise base_speed toward 1.8, since speed is then the binding
      limit. If the score falls below the iteration 1 best (71.2), return to kp 3.0
      and kd 0.15 and make the sensor look-ahead change on that base instead.


      ### Requested changes


      - If steering_oscillation stays under about 0.2 and max_error is still near
      0.06 m with line_loss_events of 1 or more, move geometry.sensor_positions forward
      to y about 0.06 (from 0.04) to test earlier look-ahead, keeping kp and kd as
      they are. Iteration 3 showed max_error stuck at 0.062 to 0.065 m whatever kp
      did, so gain changes alone have not moved that floor.

      - If the race shows progress at or near 0.995 with no line loss, raise controller.base_speed
      from 1.3 toward 1.8. Iterations 0 to 3 all went off track, so speed matters
      only once the robot stays on the line.

      - If the race scores below 71.2 (the iteration 1 best) or oscillation exceeds
      about 0.2, revert to kp 3.0 and kd 0.15 (iteration 1) and change only the sensor
      look-ahead, so the test stays isolated against the best raced design.


