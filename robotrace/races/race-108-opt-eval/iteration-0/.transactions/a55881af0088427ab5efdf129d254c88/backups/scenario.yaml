  entities:
  - id: entity0
    label: Baseline 5-sensor racer
    notes: 'First candidate: five 12 mm sensors spaced 2 cm across the tape, with
      linear weights, kp 2.5, kd 0.05 and base speed 1.6. No race data yet, so values
      follow the contract and a conservative speed-versus-stability trade-off.


      ### Rationale


      Iteration 0 has no race data, so this is a conservative first candidate built
      from the contract. Geometry: five sensors spread across the 25 mm tape at x
      = -0.04, -0.02, 0, 0.02, 0.04 m, all at y = 0.04 m (ahead of the axle, so the
      controller sees the line before the wheels reach it). Five sensors cover the
      tape with overlap, and 12 mm footprints keep each sensor sensitive to the line
      edge. Wheel track 0.12 m and radius 0.03 m give a reasonable turn-rate-to-PWM
      ratio. Body width 0.12 m widens the off-track limit to max(0.06, 0.0125 + 0.03)
      = 0.06 m, which is the binding limit, so this leaves some margin. Mass 0.8 kg
      with a 0.18 m body length keeps yaw inertia moderate. Controller: sensor weights
      [-2, -1, 0, 1, 2] make the signal approximately the lateral offset in units
      of 0.02 m, so kp = 2.5 gives about 0.05 of wheel-speed difference per cm of
      error. Ki is 0 to avoid integral windup on curves. Kd = 0.05 damps oscillation
      without amplifying sensor noise much. Base speed 1.6 is the fastest value I
      judge safe on the first run; it should give roughly 1.5 m/s average. That is
      needed to finish within 3 s, but it may cause overshoot on tight bends. line_loss
      is last_direction, so the robot continues in the direction it was turning when
      it lost the line. Expected result: completion on the oval, with rms_error around
      0.02 to 0.03 m. The slalom and s-bend may show more error at the bends. Hypotheses
      to test: (1) base_speed 1.6 is fast enough to finish in under 3 s without line
      loss; (2) kp 2.5 is stiff enough to track bends without oscillating; (3) the
      0.04 m look-ahead is enough for the controller to act before the sensors leave
      the tape. Measurements requested: completion, progress, completion_time, rms_error,
      max_error, line_loss_events, steering_oscillation. These show whether speed
      or steering is limiting the score.


      - [Open this output](iteration-0/entity0/versions/141f6afcad7e4d5aabae92623277d815/payload.json)'
  actions:
