  entities:
  - id: entity0
    label: Slower, more damped bends
    notes: 'Cuts base speed from 0.85 to 0.75 to reduce wheel slip and outward drift
      on bends, raises kd to 0.8 for damping, and sets mass to 0.40 kg. Based on iteration
      5, where the oval completed 20/20 but the s-bend and slalom both left the track
      at max_error 0.06 with rms about 0.028.


      ### Rationale


      Evidence from iteration 5 (score 371.0): the oval completes in 20/20 trials
      (progress 0.998, mean 2.01 s, rms 0.017), so the baseline tracking is sound.
      The s-bend (progress 0.26) and slalom (progress 0.16) still leave the course
      in every trial. max_error sits at the 0.06 m off-track floor while rms_error
      is only about 0.028, so the robot is drifting steadily outward on bends rather
      than oscillating. Line loss is essentially absent on the s-bend. Body width
      cannot widen the limit (0.0125 + 0.18/4 = 0.0575 is still below the 0.06 floor),
      so the fix must come from the controller and dynamics. Iteration 5''s wider
      7-sensor span with matched kp (5.3) helped slalom progress (0.10 to 0.16) and
      s-bend progress slightly (0.23 to 0.26), which suggests sensing is no longer
      the main limit. My working hypothesis is that at base_speed 0.85 (about 1.7
      m/s) the drive wheels slip on the tighter bends, so the robot understeers outward
      even though the steering command is correct. Changes: (1) base_speed 0.85 to
      0.75 to reduce lateral slip demand on bends. The oval has about 1 s of margin,
      and at 2.0 s it should still finish near 2.4 s. (2) kd 0.7 to 0.8 to add damping,
      since the higher effective gain and lower speed may leave the response a little
      underdamped. (3) mass 0.42 to 0.40, the minimum, to reduce yaw inertia slightly.
      Geometry sensors, kp 5.3, ki 1.0, wheel_track 0.08 and line_loss last_direction
      are unchanged, so the speed and damping effect is isolated. Hypotheses: (a)
      s-bend progress rises above 0.4 with the slip reduction; (b) the oval still
      completes in at least 80% of trials; (c) steering_oscillation stays below about
      0.3 with the higher kd. If the s-bend still drifts out at lower speed, the next
      lever is ki or kp, not speed. If the oval fails to finish, speed must come back
      up to about 0.8. Expected result: fewer off-track exits on the s-bend and slalom,
      with the oval completing.


