  entities:
  - id: entity0
    label: Iter 6 + search_right
    notes: 'Reverts to the best design so far (iteration 6, score 619) and changes
      only the line-loss recovery to search_right. This targets the slalom failure,
      which has stayed flat at progress 0.16 across every gain, speed and sensor change.


      ### Rationale


      Iteration 6 is still the best design (619.4). Its oval finishes 20/20 and its
      s-bend finishes 18/20. Iteration 9 (ki 0.6) lowered the s-bend finish rate to
      15/20 (score 587), so ki 1.0 stays. Slalom has been stuck at progress 0.16-0.17
      with 0/20 finishes across iterations 5-9, whatever was changed: speed, kp, kd,
      ki, and sensor size. That rules out steering gain, speed and sensor size as
      the main limit on slalom. Each slalom run ends with about one line-loss event,
      and the robot then leaves the track. The main untested lever is the line-loss
      recovery behaviour, which decides which way the robot turns when it loses the
      tape on a weave. I therefore revert to the iteration 6 design exactly and change
      only line_loss from last_direction to search_right. Expected result: oval and
      s-bend stay near iteration 6 levels, and slalom progress rises above 0.25 if
      recovery direction is the limit. Hypotheses: (a) slalom line_loss_events stay
      near 1 but progress rises; (b) if slalom stays flat, the failure is geometric,
      a sharp weave the 7-sensor span cannot track, and the next step is a wider span
      or a lower base_speed on slalom only. Measurements needed: per-track completion,
      progress, completion_time, rms_error, max_error, line_loss_events and steering_oscillation,
      with slalom progress as the key signal.


      - [Open this output](iteration-10/entity0/versions/c95013affd684173b1d1a4397076bb6e/payload.json)

      - Based on: [entityR2A](iteration-10/entityR2A/versions/carried-ec4f703f38411b4c/payload.json)'
