  - id: entity0
    label: Best design resubmitted
    notes: 'Resubmits the iteration 6 design unchanged (score 619.4, oval 20/20, s-bend
      18/20). Iterations 7-10 showed that every change tried to fix slalom or the
      s-bend lowered the score, so the verified design is kept for the unseen-track
      race.


      ### Rationale


      This is the final iteration, so the design I submit is the one scored on the
      unseen track. I am resubmitting the iteration 6 design, the best verified candidate
      (score 619.39). Evidence: the oval finished 20/20 (2.07 s, rms 0.014). The s-bend
      finished 18/20 (progress 0.96). Slalom finished 0/20 in every iteration, with
      progress stuck at 0.16-0.17 whatever was changed. Changes that moved the s-bend
      or oval all made the score worse: kp 6.5 (iteration 7, s-bend 7/20), sensor_size
      0.016 (iteration 8, s-bend 1/20), and ki 0.6 (iteration 9, s-bend 15/20). Iteration
      10 showed that line_loss ''search_right'' gives results identical to ''last_direction'',
      so recovery direction is not the slalom limit either. Any further change is
      unverified and risks the two tracks that already work, and an unseen track is
      judged on this exact design. I therefore keep iteration 6 unchanged. Hypotheses
      to check: slalom remains the failure mode because the weave geometry exceeds
      the 7-sensor span at this speed. Measurements wanted next: per-track completion,
      progress, completion_time, rms_error, max_error, line_loss_events and steering_oscillation,
      especially on slalom and on any unseen track.


