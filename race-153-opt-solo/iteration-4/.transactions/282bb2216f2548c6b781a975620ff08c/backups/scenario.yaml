  entities:
  - id: entity0
    label: Narrow track, lighter
    notes: 'Raises turning authority (wheel_track 0.10 to 0.08, mass 0.5 to 0.42 kg)
      and damping (kd 0.6), with base_speed trimmed to 0.85. Iteration 3 finished
      the oval but went off track on the s-bend at progress 0.25, so the aim is to
      improve bend tracking without losing oval completion.


      ### Rationale


      Evidence from iteration 3 (score 341.4): the oval now completes in 17 of 20
      trials (progress 0.97, mean finish 1.99 s), so the kp/ki/kd increase and the
      forward sensor row fixed the basic tracking. The s-bend (progress 0.25) and
      slalom (progress 0.17) still end off track in every trial, with max_error at
      the 0.06 m limit and rms_error about 0.027. Line loss is essentially absent
      on the s-bend, so the robot is drifting outward through bends rather than losing
      the tape. Steering oscillation is moderate (0.21 on the s-bend). Body width
      cannot widen the limit (0.06 m floor still applies), so the fix has to come
      from turning authority and response. Changes: (1) wheel_track 0.10 to 0.08,
      the minimum allowed, which raises yaw rate per unit of turn by about 25 percent
      and sharpens bend tracking; (2) mass 0.5 to 0.42 kg to reduce yaw inertia so
      the robot changes heading faster; (3) kd 0.5 to 0.6 to damp the higher effective
      turn gain and keep oscillation controlled; (4) base_speed 0.9 to 0.85 so the
      robot has more time to correct on tight bends. The oval has about 1 s of margin
      on the 3 s limit, so a small speed cut should still finish. Geometry sensor
      layout (y = 0.08, x = +/-0.06 with 0.03 spacing), kp 4.0, ki 1.0, and line_loss
      last_direction are kept to isolate the effect of the turning-authority change.
      Hypotheses: (a) s-bend progress rises above 0.5 because yaw response is faster;
      (b) steering_oscillation stays below about 0.3, so the extra kd is enough; (c)
      oval completion stays at or above 80 percent. If the s-bend still goes off track
      with progress above 0.5, the next lever is a wider sensor span (x = +/-0.08)
      or kp. If oscillation rises above 0.4, reduce kp to 3.5 before reducing kd.


