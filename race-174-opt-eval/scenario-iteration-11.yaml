overrides:
  entities:
  - id: entity0
    label: 'Final: best raced design'
    notes: 'Keeps the iteration 10 design unchanged (outer sensors at y = 0.06, base_speed
      1.6, kp 3.0, ki 0.05, kd 0.5), the best raced score at 234.2. Later changes
      to speed 1.8 and ki 0.15 both lowered the score, and there is no race left to
      verify a new change.


      ### Rationale


      Evidence: iteration 10 (outer sensors at x = -0.04 and +0.04, y = 0.06; inner
      three at y = 0.03; kp 3.0, ki 0.05, kd 0.5, base_speed 1.6, line_loss last_direction,
      sensor_size 0.012) is the best raced design at 234.2, with 9 of 20 oval completions
      and oval progress of 0.84. Every step from it since then has lowered the score:
      base_speed 1.8 gave 136.1 with every run off track, and ki 0.15 gave 171.9 with
      oval progress 0.66, below the 0.70 threshold. Line loss stayed near 1.0 per
      run on the s-bend and slalom in every raced iteration, and no kp, kd, footprint,
      spread or speed change moved it.


      Change: none. This is the final iteration and there is no later race to verify
      a new single-variable change, so the design that has raced best is the safest
      candidate for the unseen-track evaluation. The geometry and controller below
      are identical to iteration 10. The entityR1 approval describes the same build,
      so it is consistent with this candidate.


      Expected result: a score near 234, with oval completions and progress similar
      to iteration 10. The unseen track is different, so the s-bend and slalom behaviour
      (progress about 0.17 and 0.11 in iteration 10, with line loss near 1.0) remains
      the main risk.


      Hypotheses: (a) the forward outer sensors (y = 0.06) carry the oval gain to
      unseen tracks with bend entry similar to the oval. (b) Line loss stays near
      1.0 because the failure is turn-in geometry, not controller gain.


      Measurements wanted: completion, progress, completion_time, rms_error, max_error,
      line_loss_events, steering_oscillation and noise_robustness on each track, to
      confirm that the result matches iteration 10.


      - [Open this output](iteration-11/entity0/versions/782256dae1fc4590a4dfd15b7be1ed11/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-cc619988950403a0/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-6b384952d6d28e31/payload.json)'
  - id: entityR1
    label: Approve best raced design
    notes: 'Approved the unchanged iteration 10 build (score 234.2, the best raced
      result) because this is the final iteration and no later race can verify a new
      change. Every step away from it since then lowered the score, as shown in the
      outcome table.


      ### Feedback


      This is the final iteration, so there is no later race to verify a new single-variable
      change. The candidate matches iteration 10, the best raced design at 234.2 (9
      of 20 oval completions, oval progress 0.84). It is identical to that design
      in geometry and controller, and it is valid against the contract. Iteration
      10 is the only design raced with a score above 220, and every later step lowered
      the score: base_speed 1.8 (iteration 8, 136.1, all runs off track), ki 0.15
      (iteration 9, 171.9, oval progress 0.66), and the kd 0.35 change (iteration
      5, 89.2). Line loss has stayed near 1.0 per run on the s-bend and slalom in
      every raced iteration, so the main risk on the unseen track is turn-in geometry
      on bends, not controller gain. The approved build should be raced unchanged.


      ### Requested changes


      - No change to the approved build: keep geometry and controller identical to
      iteration 10 (outer sensors at x = -0.04 and +0.04, y = 0.06; inner sensors
      at y = 0.03; sensor_size 0.012; kp 3.0, ki 0.05, kd 0.5, base_speed 1.6, line_loss
      last_direction).

      - Use the race telemetry (completion, progress, line_loss_events, max_error)
      to check that the unseen track matches iteration 10''s oval behaviour, since
      the s-bend and slalom were the weak tracks (progress about 0.17 and 0.11).


      - [Open this output](iteration-11/entityR1/versions/880f4196af284e76a275a4863c244964/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/782256dae1fc4590a4dfd15b7be1ed11/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-6b384952d6d28e31/payload.json)'
