map:
  id: race-174-opt-eval
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Iter 1 spread, kd 0.35
    notes: 'Restores the best raced sensor spread (±0.04, size 0.012) and changes
      only kd from 0.5 to 0.35, following the Evaluator''s rule after the narrow ±0.03
      spread scored 133.9 with line loss still near 1.0. The rationale covers the
      turn-in lag hypothesis and the expected result.


      ### Rationale


      Evidence. The iteration 4 candidate (sensor spread x = -0.03..+0.03, size 0.012)
      scored 133.9, below the iteration 1 design at 154.1. Line loss did not fall:
      1.25 per run on the oval, 1.15 on the s-bend and 1.05 on the slalom. So the
      narrower spread hurt tracking and did not address line loss. Across iterations
      1 to 4 line loss has stayed at about 1.0 per run whatever the spread, footprint
      or kp, and every run except two ended off_track. Steering oscillation of 0.11
      to 0.30 shows the controller is under-correcting, not unstable. Iteration 2
      showed that raising kp to 3.5 alone lowered the score, so kp is not the lever.
      Iteration 1 (spread ±0.04) remains the best raced geometry.


      Change. I return geometry.sensor_positions to x = -0.04, -0.02, 0.0, 0.02, 0.04
      at y = 0.03, with sensor_size 0.012, as the Evaluator''s first requested change
      asks. I also lower controller.kd from 0.5 to 0.35, the middle of the 0.3 to
      0.4 range the Evaluator suggested. kp 3.0, ki 0.05, base_speed 1.4, weights
      [-2,-1,0,1,2] and line_loss last_direction are unchanged from iteration 1. This
      makes kd the only variable changed from the best raced design, so its effect
      can be read cleanly.


      Hypotheses. (a) Line loss is driven by turn-in lag: with kd 0.5 the controller
      over-damps the signal change at the bend entry, so the tape slips out of the
      sensors. Lower kd should reduce line-loss events toward 0.9 or below on the
      s-bend and slalom. (b) If kd has little effect on line loss, the cause is in
      the control response itself, not in the geometry or damping, and the next test
      should be a forward sensor offset (y greater than 0.03) to give earlier sight
      of the tape.


      Expected result. A score at or above about 154, with s-bend and slalom progress
      at least as high as iteration 1. Risk: lower kd may raise steering oscillation
      on the oval above 0.3. If so, the next step is to restore kd to 0.5 and test
      base_speed or a forward sensor offset, rather than raising kp again.


      Measurements wanted: completion, progress, completion_time, rms_error, max_error,
      line_loss_events, steering_oscillation and noise_robustness on each track, so
      that the kd effect can be separated from speed and geometry.


      - [Open this output](iteration-5/entity0/versions/f52b3a7355234a6db81e23c40ecb79bb/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-8c34af8e698852d0/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-9b13483a0cbd9659/payload.json)'
  - id: entityR1
    label: Evaluator Feedback
    notes: 'Evaluator Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Judged from iterations 0 to 4 and the candidate''s own contents. The candidate
      has not raced, so this states no result for it. It is valid against the contract:
      sensor x = -0.04 to +0.04 at y = 0.03, sensor_size 0.012, kp 3.0, ki 0.05, kd
      0.35, base_speed 1.4, weights [-2,-1,0,1,2] and line_loss last_direction are
      all inside their ranges. Compared with the best raced design (iteration 1, score
      154.1), it changes only kd, from 0.5 to 0.35. That is a clean single-variable
      test. Line loss has stayed at about 1.0 per run in every iteration (iteration
      1: 0.95, 1.00, 1.00; iteration 4: 1.25, 1.15, 1.05). Iterations 2 and 3 showed
      that raising kp to 3.5 lowers the score, and a 16 mm footprint does not fix
      line loss, so this kd test is the right next lever. Oscillation of 0.11 to 0.30
      means the controller is under-correcting rather than unstable, so lowering kd
      is unlikely to cause runaway, but it could push oscillation on the oval above
      the 0.30 seen in iteration 1. Approve now: the design is the best-supported
      single change available, and the race telemetry will show whether kd affects
      line loss.


      What to change after the race, depending on what it shows:

      - If the score is at or above about 150 and line_loss_events falls below about
      0.9 on the s-bend or slalom, keep kd 0.35 and test base_speed 1.6 next, since
      speed is not the limit (oval mean finish 1.93 s at 1.4).

      - If line loss stays near 1.0 and the score is at or below 154, return kd to
      0.5 (the iteration 1 value) and test a forward sensor offset (y = 0.05 for the
      outer sensors, or all sensors at y 0.04) to give earlier sight of the tape,
      rather than raising kp again.

      - If steering_oscillation rises above about 0.35 on the oval, restore kd to
      0.5 before changing anything else.


      ### Requested changes


      - Keep the iteration 1 sensor layout (x = -0.04, -0.02, 0.0, 0.02, 0.04 at y
      = 0.03, sensor_size 0.012) and kp 3.0. Race kd at 0.35 as the only change from
      the best raced design (154.1), to isolate its effect on line_loss_events.

      - If line loss stays near 1.0 per run after the kd change, test a forward sensor
      offset (outer sensors at y = 0.05) with kd at 0.5, since iterations 1 to 4 show
      that kp, footprint and spread alone do not reduce line loss.

      - If steering_oscillation rises above about 0.35 on the oval, restore controller.kd
      to 0.5, because iteration 2 showed that raising kp to 3.5 worsened the score.


      - [Open this output](iteration-5/entityR1/versions/4d5ca86b9628454ab4598cf6396e9e1e/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/f52b3a7355234a6db81e23c40ecb79bb/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-9b13483a0cbd9659/payload.json)'
