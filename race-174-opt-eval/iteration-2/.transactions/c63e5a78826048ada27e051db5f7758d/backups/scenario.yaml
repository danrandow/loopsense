map:
  id: race-174-opt-eval
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Wider sensors, slower, kd
    notes: 'Widened the sensor array to ±0.04 m so the 25 mm tape stays under sensors
      through bends, cut base_speed to 1.4 and raised kd to 0.5 to damp overshoot.
      Baseline runs all went off track with 1-2 line losses and max_error at the 0.06
      m limit, which is the evidence for these changes.


      ### Rationale


      Evidence: the baseline (iteration 0) never finished on any development track.
      Every trial ended off_track, with max_error about 0.063 m, which is the 0.06
      m off-track limit. Progress was 0.60 on the oval, 0.15 on the s-bend and 0.10
      on the slalom. Line-loss events were 1.0 to 2.0 per run, so the tape was often
      lost on bends. Steering oscillation was low (0.14 to 0.26), so the robot is
      not jittering. It is drifting out of the line when it meets bends and loses
      sight of the tape.


      What I changed and why:

      1. Sensor spread widened from x = -0.02..+0.02 to x = -0.04..+0.04 (0.02 m spacing).
      The tape is 25 mm wide, so the old 10 mm spread often left the tape under only
      one or two sensors, and it was lost on sharp bends. A wider array sees the line
      earlier and keeps a non-zero reading through bends. The weights stay [-2,-1,0,1,2],
      so the steering signal now covers a wider lateral range and is less saturated
      at small errors.

      2. base_speed reduced from 1.6 to 1.4. The robot left the line at the first
      bends, so I trade some lap time for tracking. Completion is worth 500 points
      and the time term only 60, so finishing matters more. The race will show whether
      1.4 is still fast enough to finish within 3.0 s.

      3. kd raised from 0.3 to 0.5 to damp the faster turn-in on the wider sensor
      array. kp stays at 3.0 because steering oscillation was low and there is no
      sign of an unstable response yet.

      4. Body, mass, wheels and line_loss are unchanged. body_width gives no extra
      off-track margin above 0.12 (the limit is max(0.06, 0.0125 + width/4), which
      is 0.06 for any width up to 0.18), so it is not worth changing.


      Expected result: fewer line-loss events (target 0 to 0.5 per run), larger progress
      on the s-bend and slalom, and at least one track completed. If the robot still
      goes off track with low line loss, the next step is to raise kp slightly (about
      3.5) for faster correction. If it completes with time above about 2.8 s, raise
      base_speed by 0.2 in steps. Hypotheses to check: (a) the line-loss count falls
      when the sensor spread is widened; (b) the off-track events come from bend overshoot,
      so kd matters more than kp at this speed.


      Measurements wanted: completion, progress, completion_time, max_error, rms_error,
      line_loss_events and steering_oscillation on each track, so I can separate tracking
      failures from speed limits.


      - [Open this output](iteration-1/entity0/versions/e297d5e931c14fe4be1e7009fc030d46/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-80d1318378bf146f/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-9ff4317e94b758ba/payload.json)'
  - id: entityR1
    label: Approve wider-sensor
    notes: 'Approved the iteration 1 candidate: sensors widened to ±0.04 m, base_speed
      1.4, kd 0.5. It is valid and targets the line-loss failure seen in iteration
      0 (1.0 to 2.0 losses per run, all off_track endings). Racing it is needed to
      get telemetry, with conditional steps for kp, base_speed and kd after the result.


      ### Feedback


      Judged from iteration 0 and the candidate''s own contents, not from any race
      of this candidate. Iteration 0 never finished on any track. Every run ended
      off_track, with max_error near the 0.06 m limit, 1.0 to 2.0 line-loss events
      per run, and progress of 0.60 (oval), 0.15 (s-bend) and 0.10 (slalom). Steering
      oscillation was low (0.14 to 0.26), so the failure is tracking loss on bends,
      not jitter. The changes you made target that directly: the sensor spread is
      widened to ±0.04 m, which keeps the 25 mm tape under sensors on sharp bends;
      kd rises to 0.5 to damp the faster turn-in; and kp stays at 3.0. The candidate
      is valid against the contract (all sensor positions, sensor_size, kp, kd, base_speed,
      weights and line_loss are inside their ranges), and nothing in it looks obviously
      broken. The main risk is that base_speed 1.4 may be too slow to finish within
      3.0 s, since the course needs about 1.5 m/s average. Race it to find out.


      What to change after the race, depending on what it shows:

      - If line_loss_events is still above about 0.5 per run with off_track endings,
      raise kp to about 3.5 (step by 0.5) before touching speed.

      - If completion is 1 and completion_time is above about 2.8 s with low steering_oscillation,
      raise base_speed in steps of 0.2.

      - If steering_oscillation is high after the wider spread, lower kd or kp slightly
      rather than widening the array further. Keep the sensor geometry fixed until
      the controller is stable.


      ### Requested changes


      - If line_loss_events stays above about 0.5 per run and runs still end off_track,
      raise controller.kp from 3.0 to about 3.5 (step 0.5), keeping the wider sensor
      spread (x = -0.04..+0.04), since iteration 0 showed line loss on bends was the
      main failure.

      - If the candidate completes with completion_time above about 2.8 s and low
      steering_oscillation, raise controller.base_speed from 1.4 in steps of 0.2 (for
      example 1.4 to 1.6), since the 1.6 baseline never finished but its failure was
      off-track, not speed.

      - If steering_oscillation rises well above the iteration 0 range (0.14 to 0.26)
      with the new kd of 0.5, lower controller.kd by about 0.2 (to 0.3) before changing
      kp or base_speed.


      - [Open this output](iteration-1/entityR1/versions/a79ffa6728fb4328870de80fdfe072bb/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/e297d5e931c14fe4be1e7009fc030d46/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-9ff4317e94b758ba/payload.json)'
