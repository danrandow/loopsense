  entities:
  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'Conservative first candidate: five sensors at 10 mm spacing, kp 3, kd
      0.3, base speed 1.6, last_direction line loss. No prior telemetry exists, so
      values come from the contract''s mid-range rather than race data.


      ### Rationale


      Iteration 0 has no race telemetry or Evaluator feedback, so this is a conservative
      baseline built from the contract rather than tuned from data. Geometry: five
      line sensors spread across the axle at x = -0.02 to +0.02 m (10 mm spacing,
      which is narrower than the 25 mm tape so the tape always covers at least two
      sensors), mounted 0.03 m ahead of the axle, with 12 mm footprints. Track 0.12
      m, wheel radius 0.03 m, body 0.12 x 0.18 m, mass 0.8 kg, all mid-range for stable
      yaw response. Controller: sensor weights -2, -1, 0, 1, 2 give a signal that
      is roughly proportional to lateral error with sign set so a positive signal
      steers left. kp = 3 gives about 2100 PWM of wheel differential per unit of signal,
      which is firm but not saturating for small offsets. kd = 0.3 damps the response
      and ki = 0.05 is kept small to avoid integral windup on bends. base_speed =
      1.6 (about 80% of full PWM) is aimed at the roughly 1.5 m/s average needed to
      finish under 3 s while leaving margin for the bends. line_loss = last_direction
      so the robot turns back toward the side it last saw the tape. Expected result:
      completion on the oval and s-bend, with some oscillation on the slalom. The
      main uncertainties are whether 1.6 base speed is fast enough to finish in time
      and whether kp is too high or low. The next race should show completion_time
      and steering_oscillation, which will decide whether to raise base_speed or adjust
      kp and kd.


