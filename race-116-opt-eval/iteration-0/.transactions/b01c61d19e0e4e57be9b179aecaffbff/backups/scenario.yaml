  entities:
  - id: entity0
    label: Baseline 5-sensor racer
    notes: 'Baseline candidate from the contract alone, since no race data exists
      yet: five 12 mm sensors ahead of the axle, weights proportional to x, kp 3,
      kd 0.15, base_speed 1.6. It is designed to finish in under 3 s while keeping
      jitter and line loss low.


      ### Rationale


      Iteration 0 has no race data or Evaluator feedback yet, so this is a conservative
      baseline built from the contract. Geometry: five sensors spaced 2 cm apart across
      the line (x = -0.04 to +0.04) and 4 cm ahead of the axle, so the steering reacts
      before the wheels reach a bend. The 12 mm footprint is smaller than the 25 mm
      tape, which keeps readings sharp. Controller: sensor_weights are proportional
      to x (-2, -1, 0, 1, 2), so a positive signal (line to the left) steers left
      as the contract requires. kp=3 gives a moderate correction; ki=0.05 is small
      to avoid windup on curves; kd=0.15 damps oscillation from the sensors'' 2 percent
      noise. base_speed=1.6 (about 80 percent of full PWM) is chosen to cover roughly
      4.5 m in under 3 s, which needs an average of about 1.5 m/s, while leaving margin
      for curves. line_loss=''last_direction'' keeps the robot turning toward the
      side where the line was last seen. Expected result: completion on the oval and
      s-bend, with rms_error well under 0.05 m. The main risk is oscillation or overshoot
      on the slalom at this speed. Hypotheses to test: (1) kp around 3 is adequate
      without kd spikes; (2) base_speed 1.6 is fast enough to finish in under 3 s
      without leaving the track. Measurements requested: completion, time, rms and
      max error, line-loss events and jitter, so the next iteration can tune kp/kd
      for speed versus oscillation.


      - [Open this output](iteration-0/entity0/versions/2ed47f028b404eaca2a6de31e775be50/payload.json)'
