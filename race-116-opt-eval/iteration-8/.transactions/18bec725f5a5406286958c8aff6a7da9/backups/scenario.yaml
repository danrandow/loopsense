map:
  id: race-116-opt-eval
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Forward sensors y=0.06
    notes: 'Iteration 6''s best controller with the five sensors moved 2 cm forward,
      to test whether earlier steering fixes slalom line loss. Iteration 7 showed
      the search direction changes nothing (identical scores), so sensing geometry
      is the remaining lever, with the risk that s-bend oscillation (0.397) rises.


      ### Rationale


      Evidence. Iteration 6 (kp 1.5, kd 0.6, base_speed 1.2, last_direction, y=0.04
      sensors) is the best raced design at 604.0. Oval is 18/20 finishes with progress
      0.97, and s-bend is 15/20 with steering_oscillation 0.397, right at the 0.4
      guard. Slalom ends off track in 20/20 runs with progress 0.33 and exactly 1.0
      line-loss event per run. Across iterations 4 to 6, slalom line loss did not
      respond to kp (1.7 and 1.5) or kd (0.5 and 0.6). Iteration 7 then changed only
      line_loss to search_right, and every metric and the score matched iteration
      6 exactly on all three tracks. The lost-line recovery direction therefore has
      no effect on the outcome. The likely reason is that the robot leaves the track
      within the first few steps of each line loss, so the 0.35 throttle and fixed
      signal never act. The lever for slalom must be sensing or geometry, not the
      recovery rule or gains.


      Change. Revert controller.line_loss to last_direction, the iteration 6 value,
      so the candidate matches the best raced controller exactly. Then make one geometry
      change: move all five sensors forward from y=0.04 to y=0.06 (within the allowed
      -0.06 to 0.08). Lateral x positions, sensor_size 0.016, sensor_weights, kp 1.5,
      ki 0.02, kd 0.6 and base_speed 1.2 are unchanged. The forward shift gives the
      steering loop about 2 cm more lead before the wheels reach each bend. That is
      the earlier warning the slalom needs if its line loss comes from reacting too
      late to direction changes, which kp and kd could not fix.


      Expected result. Slalom line_loss_events should fall below 1.0 and slalom progress
      should rise above 0.33. Oval finishes should hold near 18/20. Risk: the longer
      lead can increase steering oscillation on the s-bend and oval, which were already
      at 0.397 and 0.356. If s-bend or oval steering_oscillation exceeds 0.4 with
      no fall in slalom line_loss_events, revert sensor y to 0.04 and keep the controller
      as in iteration 6. If slalom line_loss_events stay at 1.0 under the forward
      shift, the next step is a separate test of base_speed 1.0 on the slalom-limited
      design, since the robot may be leaving the track at speed on the tight bends.


      Hypotheses. H1: slalom line loss comes from late steering at the direction changes,
      and a forward sensor shift fixes it. H2: kd 0.6 with the forward shift keeps
      s-bend oscillation at or below 0.4. Measurements requested: per-track completion,
      progress, completion_time, rms_error, max_error, line_loss_events, steering_oscillation,
      control_effort and noise_robustness, so the slalom change can be separated from
      the oval and s-bend effects.


      - [Open this output](iteration-8/entity0/versions/cacafa6be0b54dabbb74f997cefed31b/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-9cbf06c7917c8ae8/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-7bb474bcdd4a323d/payload.json)'
  - id: entityR1
    label: 'Approve: forward sensor'
    notes: 'Approved the iteration 6 controller with sensors moved forward to y 0.06,
      the only untested lever left for slalom after kp, kd and line_loss all failed
      to change slalom line loss at 1.0 per run. Evidence: iterations 4 to 7 (slalom
      loss 1.0 throughout; search_right identical to last_direction). Oscillation
      guard at 0.4 is flagged for revert.


      ### Feedback


      Reviewed before racing, so no outcome is stated for this candidate. It is the
      iteration 6 controller (kp 1.5, ki 0.02, kd 0.6, base_speed 1.2, line_loss last_direction,
      sensor_weights -2 to 2) with one geometry change: all five sensors moved forward
      from y 0.04 to y 0.06. Every field is within the contract ranges, and the candidate
      is identical to the best raced design (iteration 6, score 604.0) apart from
      sensor y, so any result is attributable to that change. Iteration 7 showed that
      changing line_loss to search_right left every metric and the score unchanged,
      so the lost-line rule is not the lever for slalom. Across iterations 4 to 6,
      slalom line_loss_events stayed at 1.0 and progress at about 0.24 to 0.33 under
      kp 1.7 and 1.5 and kd 0.5 and 0.6, so gain changes have not fixed it either.
      Moving the sensors forward is a reasonable test of whether the robot reacts
      too late to slalom direction changes. The main risk is that the longer lead
      adds steering oscillation: s-bend was 0.397 and oval 0.356 in iteration 6, both
      close to the 0.4 guard. The candidate is a valid, single-variable test of the
      best design, and it is worth racing because the downside is limited and the
      telemetry will show whether geometry is the slalom lever.


      Read the next race as follows. If slalom line_loss_events fall below 1.0 or
      slalom progress rises above 0.33, and oval finishes stay near 18 of 20, keep
      sensor y 0.06 and test controller.base_speed 1.4 as the next single change.
      If s-bend or oval steering_oscillation exceeds 0.4 without a fall in slalom
      line_loss_events, revert sensor y to 0.04 and keep the iteration 6 controller.
      If slalom line_loss_events stay at 1.0 under the forward shift, geometry is
      not the slalom fix either, so test base_speed 1.0 on the iteration 6 design,
      since the robot may be leaving the track at speed on the tight bends.


      ### Requested changes


      - If slalom line_loss_events fall below 1.0 or slalom progress rises above 0.33
      with oval finishes near 18 of 20, keep all five sensors at y 0.06 and test controller.base_speed
      1.4 as the next single change, because iteration 6 shows speed is the next limit
      once line loss is controlled.

      - If s-bend or oval steering_oscillation exceeds 0.4 (iteration 6 s-bend was
      0.397) without a fall in slalom line_loss_events, revert geometry.sensor_positions
      y to 0.04 and keep the iteration 6 controller with line_loss last_direction.

      - If slalom line_loss_events stay at 1.0 with sensors at y 0.06, do not change
      kp, kd or line_loss again (iterations 4 to 7 show no response); test controller.base_speed
      1.0 on the iteration 6 design to check whether speed causes the off-track exits
      on the tight bends.


      - [Open this output](iteration-8/entityR1/versions/dd3ad7e0f9f54bd0b64e2002d74c4369/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/cacafa6be0b54dabbb74f997cefed31b/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-7bb474bcdd4a323d/payload.json)'
