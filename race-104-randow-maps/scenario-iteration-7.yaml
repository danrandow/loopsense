map:
  id: race-104-randow-maps
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Mass 0.5 kg test
    notes: 'Holds the iteration 6 platform and changes only mass (0.8 to 0.5 kg),
      the last untested geometry lever. Iteration 6 showed line loss and max_error
      near 0.06 m on the oval and s-bend, so lower yaw inertia is tested as the next
      limit.


      ### Rationale


      Iteration 6 moved the score from 26.04 to 36.31. The gain is on the slalom (score
      14.39 to 45.18, progress 0.035 to 0.11), while the oval and s-bend still end
      off track after one line-loss event with max_error at 0.061 m. Five geometry
      families (spread, footprint, wheel track, wheel radius, lead) left max_error
      at 0.060 to 0.061 m, and the 0.06 m off-track floor binds because body_width
      cannot lift it. The Integrator''s rule (b) applies: line loss persists near
      0.06 m, so the next untested geometry lever is mass. Mass has never been tested,
      and a lower mass lowers yaw inertia, so the robot turns faster for the same
      turn command. I keep the iteration 6 geometry and change only mass, from 0.8
      kg to 0.5 kg, so any change against iteration 6 comes from mass. body_length
      is left alone because the contract says it has no dynamic effect. Expected result:
      max_error falls toward or below 0.06 m on the oval and s-bend and line_loss_events
      drop, but the slalom may show more steering oscillation because the robot is
      more responsive. If mass does not move the metrics, geometry is exhausted and
      the Integrator should focus on controller damping (kd) and base_speed.


      - [Open this output](iteration-7/entity0/versions/bb79e30bc63d4e7ab844671a937873e1/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-2cfa2a48241a688c/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-d159ceed27be8883/payload.json)'
  - id: entity1
    label: Mass 0.5 kg, kp 3.0
    notes: 'Iteration-6 controller and platform with only mass lowered from 0.8 to
      0.5 kg, the last untested geometry lever. The iteration-6 gain (score 36.31)
      is kept so the mass effect can be isolated.


      ### Rationale


      Iteration 6 (kp 3.0 on the frozen iteration-5 platform) raised the score from
      26.04 to 36.31. The gain came from the slalom (score 14.39 to 45.18, progress
      0.035 to 0.11). The oval and s-bend still end off track after one line-loss
      event with max_error near 0.061 m, so the 0.06 m off-track floor still binds.
      Iterations 0 to 5 changed spread, footprint, wheel track, wheel radius and lead,
      and none moved max_error off that floor. Mass is the only untested geometry
      lever, and the Builder''s intent asks me to test it. I keep the iteration-6
      controller exactly (kp 3.0, ki 0, kd 0.05, base_speed 1.6, last_direction, weights
      (-1.5, -0.75, 0, 0.75, 1.5)) so that any change against iteration 6 comes from
      mass alone. The contract gives yaw inertia = mass*(L^2+W^2)/12, so reducing
      mass from 0.8 to 0.5 kg lowers yaw inertia by 37.5 percent and should raise
      yaw response per turn command. The Integrator''s concern is that this could
      increase slalom oscillation, which I would address with kd, not geometry. Expected
      result, not measured: max_error and line_loss_events may fall on the oval and
      s-bend, and steering_oscillation may rise on the slalom. The sensor row stays
      at y = 0.07 m, x = -0.03 to +0.03 m, 16 mm footprints, wheel_radius 0.03 m,
      wheel_track 0.12 m, body 0.12 x 0.18 m. body_length is kept because the contract
      says it has no dynamic effect.


      - [Open this output](iteration-7/entity1/versions/989e9344f8684f88b1c3c1c81bd75fbc/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/bb79e30bc63d4e7ab844671a937873e1/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-d159ceed27be8883/payload.json)'
  - id: entityR1
    label: Mass test, then kd
    notes: 'Feedback before the race: geometry changes in iterations 0 to 5 left max_error
      at 0.060 to 0.061 m, while kp 3.0 in iteration 6 was the only change that moved
      the score. Requests mass 0.5 kg, then kd damping if the slalom oscillates, and
      mass 0.4 kg if mass alone shows no effect.


      ### Feedback


      Written before this candidate has raced. Iterations 0 to 5 gave the same outcome
      to within about 0.3 score points: max_error 0.060 to 0.061 m, one line-loss
      event per trial, no finishes. Spread (iteration 1), footprint (iteration 2),
      wheel track (iteration 3), wheel radius (iteration 4) and lead (iteration 5,
      which matched iteration 0 exactly) have not lifted the 0.06 m off-track floor.
      Iteration 6 (kp 3.0) was the only change that moved the score, and only on the
      slalom (14.39 to 45.18). So steering gain is the one controller lever that has
      shown an effect. The controller is held at iteration-6 values here, so this
      candidate tests mass alone, and no outcome is claimed for it. Next-race rules:
      (a) if line_loss_events fall below one and max_error drops below 0.06 m on the
      oval and s-bend, keep mass 0.5 kg and test kd (about 0.2) on the slalom to damp
      any oscillation; (b) if steering_oscillation rises sharply on the slalom while
      line loss is unchanged, the lower mass is over-steering, so add kd damping and
      do not change geometry again; (c) if the metrics match iteration 6 to four decimals,
      geometry is exhausted for this controller, and the pipeline should be checked
      as in iteration 4.


      ### Requested changes


      - Keep mass at 0.5 kg with all other geometry from iteration 6 (sensors at y
      = 0.07 m, 16 mm footprints, +/-0.03 m spread, wheel_radius 0.03 m, wheel_track
      0.12 m, body 0.12 x 0.18 m). Iteration 6 showed that the slalom responds to
      steering gain, and this race isolates how yaw inertia changes that response.

      - If mass 0.5 kg lowers max_error or line_loss_events on the oval and s-bend
      but raises slalom steering_oscillation, hold the geometry and add kd (0.05 to
      about 0.2) to damp the oscillation, as iteration 6 left kd untouched.

      - If mass 0.5 kg shows no change against iteration 6, test mass 0.4 kg (the
      contract minimum) as the last geometry lever, since iterations 0 to 5 show no
      other geometry change has moved the off-track floor.


      - [Open this output](iteration-7/entityR1/versions/989e9344f8684f88b1c3c1c81bd75fbc/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/bb79e30bc63d4e7ab844671a937873e1/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-d159ceed27be8883/payload.json)'
