overrides:
  entities:
  - id: entity0
    label: Wheel radius pipeline
    notes: 'Changes only wheel_radius from 0.03 to 0.04 m. Iterations 0 to 3 gave
      identical metrics across five geometry changes, so this tests whether the race
      pipeline reacts to geometry at all. Evidence: entityR2A shows the same 26.0449
      score for every iteration.


      ### Rationale


      Iteration 3 (wheel_track 0.10 m, 16 mm footprints, ±0.03 m spread, 0.05 m lead)
      reproduced iterations 0 to 2 exactly on every track: score 26.0449, max_error
      0.0609 to 0.0614 m, one line-loss event per trial, and progress 0.035 to 0.115.
      Five geometry changes across sensor spread, footprint and yaw response have
      now produced identical outcomes to four decimals. Either the race results are
      not responding to geometry, or the pipeline is repeating one run. The Integrator''s
      rule says to stop geometry changes and check the pipeline. Body width cannot
      lift the 0.06 m off-track floor, so no body change is worth testing. I therefore
      make one diagnostic change rather than another tuning step: wheel_radius from
      0.03 m to 0.04 m. This is a large change to the drivetrain, and it alters the
      ground speed and the wheel-to-command ratio, so the simulator should produce
      different metrics if it is live. Sensors, footprint, lead, track, body and mass
      stay at iteration 3 values. If the metrics change, the pipeline is live and
      the earlier geometry tests were simply ineffective; the next step is to resume
      tuning from there. If they match again exactly, the race data is repeating and
      no further geometry test should be run until the pipeline is fixed. Expected
      result: a metric change, probably in progress and completion_time, since a larger
      wheel radius raises speed per PWM.


      - [Open this output](iteration-4/entity0/versions/7a618e13d75046f2a6473400a0a842a6/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-a6b69ad629ec9e69/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-2d50b4b4c8f7846e/payload.json)'
  - id: entity1
    label: Wheel track 0.10 package
    notes: 'Complete robot with the Builder''s 0.10 m wheel track and the iteration-2
      controller held fixed, so the track is the only change. Iterations 0 to 2 gave
      identical metrics, so gains are not retuned until the pipeline is checked.


      ### Rationale


      The Builder''s iteration-3 geometry changes only wheel_track, from 0.12 m to
      0.10 m, and keeps the 16 mm footprint and the 0.03 m spread from iteration 2.
      Iterations 0, 1 and 2 gave identical race metrics to four decimals on all three
      tracks (score 26.0449, max_error about 0.061 m, one line-loss event per trial,
      0% finish). Three different geometry changes (spread 0.02 to 0.03 m, footprint
      12 to 16 mm, and sensor weights rescaled) produced no change, so the race pipeline
      may be repeating data. Until a new result differs from those rows, I cannot
      attribute any effect to geometry or controller. The controller therefore stays
      identical to iteration 2 (kp 2.0, ki 0, kd 0.05, base_speed 1.6, weights x/0.02,
      last_direction), so that any change in the next race comes from the wheel_track
      alone. Narrowing the track from 0.12 m to 0.10 m raises yaw per unit of PWM
      difference by about 20 percent (turn rate = wheel speed difference / wheel_track),
      so the robot should turn harder at the same turn command. The risk is more steering_oscillation,
      which the observation request will show. Sensor geometry, body, wheel radius
      and mass are unchanged from the Builder''s proposal. The observation request
      keeps the full measurement set, which lets the Builder see line losses, max_error
      and oscillation together.


      - [Open this output](iteration-3/entity1/versions/e750e98f2f63457dbf7e291367f6beff/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/ac33650232124d1e8ff3fffc60b95229/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-77108f02b6f8363b/payload.json)'
  - id: entityR1
    label: Pipeline check, then
    notes: 'Iterations 0 to 2 gave identical metrics across three geometry changes,
      so the feedback asks for a pipeline check before further geometry changes. It
      then sets conditional wheel_track rules (0.08 m or 0.11 m) depending on how
      the 0.10 m race differs.


      ### Feedback


      Written before this candidate has raced. Iterations 0, 1 and 2 gave identical
      race metrics to four decimals on all three tracks (score 26.0449, max_error
      0.0609 to 0.0614 m, one line-loss event per trial, progress 0.035 to 0.115,
      no finishes). That holds across three different geometry changes: spread 0.02
      to 0.03 m (iteration 1), footprint 12 to 16 mm (iteration 2), and the rescaled
      weights. The 0.06 m off-track floor is the binding limit, not the body term
      (0.0425 m at body_width 0.12). Because geometry changes have not moved the outcome,
      the first check is whether the race data is repeating. If the iteration-3 race
      matches iterations 0 to 2 again, stop geometry changes and check the pipeline.
      If the metrics differ, the wheel_track change is the cause, and the next step
      depends on what it shows. Rule (a): if max_error falls below 0.06 m and line_loss_events
      reach zero, keep wheel_track 0.10 m and change nothing else for one race. Rule
      (b): if line_loss_events stay at one or more with max_error near 0.06 m, go
      to wheel_track 0.08 m (the minimum), since yaw response is still the limit.
      Rule (c): if steering_oscillation rises sharply on the slalom while line loss
      is zero, the narrower track is over-steering, so try wheel_track 0.11 m as the
      midpoint with the same sensors.


      ### Requested changes


      - Keep wheel_track at 0.10 m with the 16 mm footprint and the 0.03 m spread
      for one race. If the metrics match iterations 0 to 2 exactly, stop geometry
      changes and check the race data pipeline before any further test.

      - If line_loss_events stay at one or more and max_error stays near 0.06 m with
      different metrics, test wheel_track 0.08 m (the minimum), keeping all other
      geometry fixed, to test whether more yaw response closes the gap.

      - If steering_oscillation rises sharply on the slalom with zero line loss, test
      wheel_track 0.11 m to back off the yaw response, keeping the sensor geometry
      fixed.


      - [Open this output](iteration-3/entityR1/versions/e750e98f2f63457dbf7e291367f6beff/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/ac33650232124d1e8ff3fffc60b95229/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-77108f02b6f8363b/payload.json)'
