map:
  id: race-104-randow-maps
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: Final platform held fixed
    notes: 'Geometry is held at the iteration 10 platform (±0.04 m 16 mm row, wheel_track
      0.10 m, mass 0.8 kg), which scored 67.13 with the Integrator''s controller.
      The geometry tests from iterations 0 to 10 show that the controller, not geometry,
      is now the lever that moves the oval and s-bend.


      ### Rationale


      Iteration 10 kept the iteration 9 geometry (±0.04 m row of 16 mm sensors at
      y = 0.07 m, wheel_track 0.10 m, mass 0.8 kg, wheel_radius 0.03 m, body 0.12
      × 0.18 m) and changed only the controller. Its score rose from 36.6227 to 67.1299.
      The oval progress rose from 0.115 to 0.197 and the s-bend progress from 0.040
      to 0.177, though every trial still ended off track after one line-loss event.
      Slalom steering_oscillation was 0.1626, still just above the 0.16 threshold,
      and its progress was 0.114. Across spread, footprint, wheel track, wheel radius,
      lead and mass, the geometry tests left max_error at 0.060 to 0.069 m and line
      loss at one per trial. The controller change is the first lever to move the
      oval and s-bend, so geometry is no longer the binding limit on those tracks.


      I considered the iteration 10 rule (b), which points to a mass midpoint of 0.65
      kg if slalom oscillation stays above 0.16. I am not adopting it. Score does
      not reward low oscillation directly. Mass 0.5 kg in iteration 7 cut slalom progress
      and lowered the score by 0.67, and 0.65 kg is untested with the new gains. This
      is the final iteration, and the unseen track is scored once, so I am keeping
      the verified platform. Any change would carry risk for no measured score gain.
      The geometry is therefore unchanged from iteration 10, so the Integrator''s
      controller work on this platform is the only variable under test.


      - [Open this output](iteration-11/entity0/versions/b215c2df55c545adb15853c570487acd/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-c087f11264115947/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-d225fa4540aa68a6/payload.json)'
  - id: entity1
    label: 'Iter 10: kd 0.2 damping'
    notes: 'Frozen iteration-9 geometry with kd raised from 0.05 to 0.2 as the only
      controller change. Iteration 9 (36.62) showed slalom steering_oscillation at
      0.161, just above the 0.16 threshold, and the oval and s-bend unchanged across
      all geometry tests.


      ### Rationale


      Iteration 9 is the best-scoring platform (36.6227). It keeps the Builder''s
      ±0.04 m, 16 mm row at y = 0.07 m, mass 0.8 kg, wheel_radius 0.03 m, body 0.12
      × 0.18 m, and narrows wheel_track to 0.10 m. Its gain over iteration 8 came
      only from the slalom: max_error 0.0681 m, steering_oscillation 0.1611 and slalom
      score 46.12. The oval and s-bend are unchanged across every geometry family
      tested (max_error about 0.061 m, one line-loss event per trial, no finishes).
      The 0.06 m off-track floor binds, and body_width cannot lift it. Mass 0.5 kg
      (iteration 7) lowered slalom oscillation but also lowered slalom progress and
      the score, so mass stays at 0.8 kg. The only lever that has moved the score
      is controller gain: kp 3.0 raised the slalom from 14.39 to 45.18. The Builder''s
      feedback asks for a damping test (kd near 0.2) to address the slalom oscillation
      of 0.161, which is just above the 0.16 threshold. I therefore keep kp 3.0, ki
      0, and the iteration-9 weights (-2, -1, 0, 1, 2), which match x/0.02 steering
      gain. I set kd to 0.2 as the only controller change, so any change against iteration
      9 comes from damping. last_direction line-loss handling is kept, since no evidence
      yet shows where line loss starts. Expected, not measured: slalom steering_oscillation
      should fall below 0.16 with little progress loss, and the oval and s-bend are
      not expected to change much, because the line-loss mechanism has not responded
      to any controller change except kp.


      - [Open this output](iteration-10/entity1/versions/186c41a1436b4af7b33f75a90b5c3bc3/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/330f3854c8ee4c209dfaf861a94dc15a/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-9445826949b244a0/payload.json)'
  - id: entityR1
    label: Mass midpoint if needed
    notes: 'Feedback asks the Builder to hold the iteration-9 geometry and only test
      mass 0.65 kg if slalom oscillation stays high, since mass 0.5 kg (iteration
      7) cut oscillation but also cut progress and score. Geometry is flagged as exhausted
      for the line-loss problem.


      ### Feedback


      Written before this candidate has raced. Iteration 9 (wheel_track 0.10 m, ±0.04
      m row, kp 3.0) scored 36.6227. Iteration 8 (same row at 0.12 m) scored 36.3097,
      and iteration 6 scored the same, so the wider row removed no line loss. Iteration
      7 showed that mass 0.5 kg cut slalom oscillation (0.1435 against 0.1625) but
      also cut slalom progress (0.105 against 0.110) and the score (35.64 against
      36.31), so mass 0.8 kg stays. Mass is the only lever that trades oscillation
      for progress. Iteration 3 showed a null effect for wheel_track 0.10 m at kp
      2.0. The oval and s-bend have lost the line once with max_error near 0.061 m
      across every geometry family tested (iterations 1 to 9), and the 0.06 m off-track
      floor binds because body_width cannot lift it. Body_length has no dynamic effect
      in the contract, so it should not be tested. Next-race rules: (a) if the oval
      and s-bend still match iteration 9 to four decimals and slalom steering_oscillation
      falls below 0.16, keep this geometry and treat geometry as exhausted for line
      loss. (b) If slalom steering_oscillation stays above 0.16 with kd 0.2, the remaining
      oscillation lever is a mass midpoint, not a track change. (c) If the oval or
      s-bend line loss moves below one, record that as the first geometry-independent
      change and keep the platform.


      ### Requested changes


      - If slalom steering_oscillation stays above 0.16 at kd 0.2 with the progress
      unchanged, test mass 0.65 kg with the ±0.04 m row and wheel_track 0.10 m. Iteration
      7 showed that mass 0.5 kg lowers slalom oscillation but cuts progress, so the
      midpoint may keep most of the oscillation gain without the progress loss.

      - Do not spend another iteration on sensor spread, footprint, lead, or body_width.
      Iterations 1, 2, 5, and 8 each left the oval and s-bend metrics at the baseline,
      and the body term cannot lift the 0.06 m floor.

      - If the oval and s-bend metrics match iteration 9 to four decimals after kd
      0.2, record geometry as exhausted for line loss, and keep wheel_track 0.10 m
      and mass 0.8 kg as the final platform.


      - [Open this output](iteration-10/entityR1/versions/186c41a1436b4af7b33f75a90b5c3bc3/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/330f3854c8ee4c209dfaf861a94dc15a/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-9445826949b244a0/payload.json)'
