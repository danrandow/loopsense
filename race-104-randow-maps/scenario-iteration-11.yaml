overrides:
  entities:
  - id: entity0
    label: Final platform held fixed
    notes: 'Geometry is held at the iteration 10 platform (±0.04 m 16 mm row, wheel_track
      0.10 m, mass 0.8 kg), which scored 67.13 with the Integrator''s controller.
      The geometry tests from iterations 0 to 10 show that the controller, not geometry,
      is now the lever that moves the oval and s-bend.


      ### Rationale


      Iteration 10 kept the iteration 9 geometry (±0.04 m row of 16 mm sensors at
      y = 0.07 m, wheel_track 0.10 m, mass 0.8 kg, wheel_radius 0.03 m, body 0.12
      × 0.18 m) and changed only the controller. Its score rose from 36.6227 to 67.1299.
      The oval progress rose from 0.115 to 0.197 and the s-bend progress from 0.040
      to 0.177, though every trial still ended off track after one line-loss event.
      Slalom steering_oscillation was 0.1626, still just above the 0.16 threshold,
      and its progress was 0.114. Across spread, footprint, wheel track, wheel radius,
      lead and mass, the geometry tests left max_error at 0.060 to 0.069 m and line
      loss at one per trial. The controller change is the first lever to move the
      oval and s-bend, so geometry is no longer the binding limit on those tracks.


      I considered the iteration 10 rule (b), which points to a mass midpoint of 0.65
      kg if slalom oscillation stays above 0.16. I am not adopting it. Score does
      not reward low oscillation directly. Mass 0.5 kg in iteration 7 cut slalom progress
      and lowered the score by 0.67, and 0.65 kg is untested with the new gains. This
      is the final iteration, and the unseen track is scored once, so I am keeping
      the verified platform. Any change would carry risk for no measured score gain.
      The geometry is therefore unchanged from iteration 10, so the Integrator''s
      controller work on this platform is the only variable under test.


      - [Open this output](iteration-11/entity0/versions/b215c2df55c545adb15853c570487acd/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-c087f11264115947/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-d225fa4540aa68a6/payload.json)'
  - id: entity1
    label: Final verified robot (kd
    notes: 'Complete robot with the iteration 10 controller (kp 3.0, kd 0.2) on the
      frozen iteration 9 and 10 geometry. It keeps the verified 67.1299 design, because
      the untested kd or mass changes carry risk on the unseen track.


      ### Rationale


      The evidence is in the outcome table. Iteration 10 (kd 0.05 to 0.2 at kp 3.0,
      geometry at the iteration 9 values) is the only verified best, scoring 67.1299.
      Its gain came from the oval and s-bend, where progress rose to 0.197 and 0.177,
      and slalom steering_oscillation fell to 0.1626. Every geometry family tested
      since iteration 1 left max_error at about 0.061 m and one line-loss event per
      trial, so the controller is the only lever that has moved those tracks. Iterations
      9 and 10 used the same geometry, so the Builder''s verified platform is the
      right frame. I considered raising kd further (for example to 0.3) to damp the
      slalom oscillation. I rejected it because the effect of kd above 0.2 is untested,
      the unseen track is scored once, and a regression would not be visible before
      the final race. I therefore keep the iteration 10 controller exactly. The geometry
      matches the Builder''s frozen proposal: sensors at x = -0.04, -0.02, 0, 0.02,
      0.04 m with y = 0.07 m, 16 mm footprints, wheel_track 0.10 m, wheel_radius 0.03
      m, mass 0.8 kg, body 0.12 x 0.18 m. The sensor weights are (-2, -1, 0, 1, 2),
      matching the iteration 8 to 10 scaling. The full measurement set is requested
      so the final race can be checked against iteration 10 to four decimals.


      - [Open this output](iteration-11/entity1/versions/1df2bd9c27a24d3fa4ec49254bdcd541/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/b215c2df55c545adb15853c570487acd/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-d225fa4540aa68a6/payload.json)'
  - id: entityR1
    label: Freeze geometry; mass
    notes: 'Feedback to the Builder asks to keep the verified geometry for the final
      race. It names mass 0.65 kg as the only untested fallback, and rests on iterations
      1 to 10 showing that geometry is exhausted for line loss.


      ### Feedback


      Written before this candidate has raced, and no outcome is claimed for it. The
      Integrator kept the verified iteration 10 controller (kp 3.0, kd 0.2, last_direction)
      on the frozen iteration 9 and 10 geometry. Evidence: sensor spread (iterations
      1, 8), footprint (iteration 2), wheel track (iterations 3, 9), wheel radius
      (iteration 4), lead (iteration 5, which matched iteration 0 exactly) and mass
      (iteration 7) all left max_error at 0.060 to 0.062 m and one line-loss event
      per trial on the oval and s-bend. The only changes that moved those tracks were
      controller changes: kp 3.0 (iteration 6) and kd 0.2 (iteration 10, progress
      0.197 and 0.177). Mass 0.5 kg (iteration 7) lowered slalom oscillation to 0.1435
      but also cut progress, so the score fell. If the next race matches iteration
      10 to four decimals, geometry and controller are both at their verified values.
      If the oval or s-bend progress falls, the cause is in the controller, not the
      geometry. If slalom steering_oscillation stays above 0.16 with progress unchanged,
      mass 0.65 kg is the untested midpoint; it is a candidate only if a further race
      is ever run.


      ### Requested changes


      - Keep the iteration 10 geometry (sensors at x = -0.04 to 0.04 m in 0.02 m steps,
      y = 0.07 m, 16 mm, wheel_track 0.10 m, mass 0.8 kg, wheel_radius 0.03 m, body
      0.12 x 0.18 m) unchanged for the final race, because it is the verified best
      platform.

      - If slalom steering_oscillation stays above 0.16 at kd 0.2 with progress unchanged,
      test mass 0.65 kg on the same geometry, as the midpoint between the verified
      0.8 kg and the 0.5 kg result that lost progress.

      - Do not spend a change on sensor spread, footprint, lead or body_width. Iterations
      1, 2, 5 and 8 showed these leave the oval and s-bend at the baseline.


      - [Open this output](iteration-11/entityR1/versions/1df2bd9c27a24d3fa4ec49254bdcd541/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/b215c2df55c545adb15853c570487acd/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-d225fa4540aa68a6/payload.json)'
