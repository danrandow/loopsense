  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Wider sensor spread ±0.03
    notes: 'Widens the sensor spread from ±0.02 m to ±0.03 m to stop line loss, which
      occurred on every track in iteration 0 (all runs off track, max_error about
      0.061 m against a 0.06 m limit). Other geometry is held fixed to isolate the
      spread effect.


      ### Rationale


      Iteration 0 raced the baseline with 5 sensors at x = ±0.02 m, 12 mm footprints,
      and y = 0.05 m. All 60 trials failed: every run ended off track, with 1 line-loss
      event each, max_error about 0.061 m, and progress only 0.04 to 0.115. No run
      finished. Two points matter. First, the off-track limit is max(0.06, 0.0125
      + 0.12/4) = max(0.06, 0.0425) = 0.06 m, so the 0.06 m floor binds, not the body
      term I cited in iteration 0. Max_error of about 0.061 m sits just past that
      limit, which confirms the robot drifts out of the tape band and the run ends.
      Second, line loss happens only when all sensors read below 0.05. With a 12 mm
      footprint and sensors at ±0.02 m, the outer sensors reach tape only up to roughly
      0.0385 m of lateral offset. Beyond that the robot loses the line before it reaches
      the 0.06 m off-track limit, and the line-loss handling does not recover it.
      The Integrator''s rule applies: line loss is above zero on every track, so the
      spread is too narrow to give recovery margin. I will widen the spread to ±0.03
      m, keeping 5 sensors and the 12 mm footprint. That extends visibility to about
      0.0485 m, so the sensors keep the tape in view further out and the robot has
      room to correct before losing it. I keep the forward lead at 0.05 m, because
      the lead should change only after the spread is addressed. I also keep wheel
      track, radius, mass and body fixed, so the race isolates the spread effect.
      Body width stays at 0.12 m: widening it to 0.18 m only moves the off-track term
      to about 0.0575 m, still below 0.06 m, so it gains nothing. Expected result:
      line_loss_events fall toward zero on the s-bend and slalom, max_error stays
      under 0.06 m, and progress rises well above 0.115.


      - [Open this output](iteration-1/entity0/versions/dc9f21ff03504b4cb259e9d85a5daaf1/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-339ba660a84f2a26/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-c53199b9c4dcffa0/payload.json)'
  - id: entity1
    label: Baseline robot package v0
    notes: 'Builder''s baseline geometry kept unchanged, paired with a proportional
      line-follower (kp 2.0, light kd) that weights sensors by lateral position and
      uses last-direction line recovery. Iteration 0 has no race telemetry, so the
      gains come from the contract''s control equations, not measured tuning.


      ### Rationale


      Iteration 0 has no race data and no earlier outcomes, so the controller is built
      from the contract''s control equations for this exact geometry. The five sensors
      sit at x = -0.02 to +0.02 m (step 0.01 m) at y = 0.05 m, with 12 mm footprints.
      Their lateral spread is wider than the 25 mm tape, so at least one or two sensors
      should always see tape within roughly ±0.03 m of centre. Sensor weights are
      proportional to lateral position (-1.0, -0.5, 0, 0.5, 1.0), so the signal is
      positive when the tape is on the left, which steers left as the contract requires.
      kp = 2.0 gives a moderate turn for a 0.01 signal change; the signal is roughly
      0.5 at the edge of a 0.02 m offset, which yields a turn of about 1 and about
      350 PWM of differential. ki = 0 avoids integral windup on the curves. kd = 0.05
      damps the fast signal changes on the slalom without adding much noise sensitivity.
      base_speed = 1.6 gives PWM 3276 (about 80 percent), which targets roughly 1.5
      m/s average speed while leaving headroom for the turns. line_loss = last_direction
      so the robot continues in the direction it was turning when the tape is lost.
      The observation request asks for completion, time, progress, RMS and max error,
      line-loss events, oscillation and controller errors, which are the measures
      the Builder''s hypotheses need.


      - [Open this output](iteration-0/entity1/versions/d23591e69c1e4f5294fc3efb391c42ed/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/cf0685d504cb4e9db405f9ed7d39900a/payload.json)'
  - id: entityR1
    label: Baseline sensing feedback
    notes: 'No earlier race exists, so the feedback sets out conditional tests for
      the first race rather than reporting results. It asks the Builder to test sensor
      spread and lead against the line-loss and oscillation measurements.


      ### Feedback


      This is iteration 0, so no earlier race or outcome exists yet. The Integrator
      had to make three decisions for your geometry. First, the five sensors at ±0.02
      m with 12 mm footprints overlap well, so a proportional controller can use a
      linear lateral-position weighting without dead zones. Second, the 0.03 m forward
      lead at y = 0.05 m is still a hypothesis, and the controller uses only a light
      derivative term to damp it. Third, the 0.12 m wheel track gives enough turn
      authority at kp 2.0 by the contract''s 350 PWM per unit turn, but whether this
      is enough at 1.5 m/s is unknown. Interpret the next race as follows: if line_loss_events
      are above zero on the s-bend or slalom, the sensor spread is probably too narrow
      for the bend curvature, so widen the spread (for example ±0.03 m with the same
      count) before changing the lead. If steering_oscillation is high while line
      loss is zero, the forward lead is causing overshoot, so reduce the lead to y
      = 0.03 m before changing the spread. If max_error is low and completion holds
      but the completion time exceeds 3 s, the wheel track or body is limiting speed,
      so try a smaller wheel_radius or lower mass.


      ### Requested changes


      - Test sensor spread at x = ±0.03 m (keep 5 sensors, 0.012 m footprint) if the
      next race shows any line_loss_events on the s-bend or slalom, because the baseline
      ±0.02 m spread may not cover sharp bends.

      - Test forward sensor lead y = 0.03 m (instead of 0.05 m) if steering_oscillation
      is high on the slalom while line_loss_events remain zero, to reduce overshoot
      from lead distance.

      - Test wheel_track 0.10 m (instead of 0.12 m) only if the robot completes but
      max_error is high on the slalom, to increase yaw response, and keep the other
      geometry fixed to isolate the effect.


      - [Open this output](iteration-0/entityR1/versions/d23591e69c1e4f5294fc3efb391c42ed/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/cf0685d504cb4e9db405f9ed7d39900a/payload.json)'
