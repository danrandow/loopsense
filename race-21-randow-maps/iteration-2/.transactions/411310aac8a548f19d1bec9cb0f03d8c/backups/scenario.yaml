  - id: entityR1
    label: Integration Feedback
    notes: 'Feedback on geometry performance, highlighting the need for adjustments
      to body width and wheel track to reduce line loss events.


      ### Feedback


      The current geometry has led to a high number of line loss events (3 in the
      first trial and 2 in the second). The body width and wheel track adjustments
      are expected to improve stability. The robot''s control effort is also high,
      indicating that the geometry may be causing difficulties in maintaining the
      desired path.


      ### Requested changes


      - body_width: 0.16

      - wheel_track: 0.16

      - base_speed: 0.55


