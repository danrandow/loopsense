overrides:
  entities:
  - id: entity0
    label: Wider array, slower, kp
    notes: 'Widened the sensor array to plus or minus 0.036 m with 16 mm footprints
      to cut line-loss events, lowered base_speed to 1.1 and raised kp to 3.5. Based
      on iteration 1, where every failure was an off-track exit with 1.2 to 1.5 line-loss
      events per run.


      ### Rationale


      Evidence: iteration 1 scored 134.06, up from 49.8. On the oval one trial in
      twenty finished, and the others left the track with progress around 0.5. On
      the s-bend and slalom every run ended off track (progress 0.28 and 0.14). Line-loss
      events averaged 1.15 to 1.45 per run and steering_oscillation rose to 0.29 on
      the oval, so the robot is still losing the tape at bends rather than drifting
      slowly. The 5-sensor array spans only plus or minus 0.03 m with 12 mm footprints,
      so when the tape moves toward the edge of the array the summed reading drops
      below 0.05 and line loss begins. Changes: (1) widen the array to plus or minus
      0.036 m and use 16 mm footprints, so the tape stays under at least one sensor
      further from centre and line loss becomes rarer. (2) Reduce base_speed from
      1.4 to 1.1 to give the correction time to act at bends, since every failure
      so far is an off-track exit rather than a timing miss. (3) Raise kp from 3.0
      to 3.5 so the robot turns harder when the signal is large at the wider sensor
      span. (4) Keep kd at 0.4, since the oscillation level is not clearly too high,
      and keep ki at 0.02 to avoid windup. Keep sensor y at 0.03, mass 0.6 and last_direction
      line loss unchanged so that only the array width, speed and gain move. Expected
      result: fewer line-loss events (target 0.5 or below per run), progress above
      0.6 on the oval and s-bend, and fewer off-track exits. Hypotheses to check:
      if line-loss events stay high after the wider array, the cause is turn-in lag
      and kp or kd must rise further; if progress stalls with no off-track exit, base_speed
      is too low. Measurements wanted next: progress, completion_time, rms_error,
      max_error, line_loss_events, steering_oscillation and control_effort, to see
      whether the wider array cut line loss and whether the reduced speed kept the
      robot on the line.


      - [Open this output](iteration-2/entity0/versions/10d044a5294048b3a12bab654e00c858/payload.json)

      - Based on: [entityR2A](iteration-2/entityR2A/versions/carried-f6d91f0fce75cec5/payload.json)'
  - id: entityR1
    label: Evaluator Feedback
    notes: 'Evaluator Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Written before this candidate races, so no outcome is claimed for it. The evidence
      is iteration 1 (score 134.06, the best so far). The oval finished in 1 of 20
      trials at a mean finish time of 1.65 s, so base_speed 1.4 is already fast enough
      to finish with time to spare. The s-bend and slalom ended 100% off track, with
      1.15 to 1.25 line-loss events per run and steering_oscillation of 0.18 to 0.29.
      The candidate''s own rationale says the array and sensor footprint move, which
      is the right direction for line loss. The problem is that it also cuts base_speed
      from 1.4 to 1.1. Iteration 1 shows that 1.4 was not too fast, and 1.1 gives
      the 3 s limit little margin: a 300-step run needs roughly 1.5 m/s on average
      to finish. A reduction to 1.1 would likely cost the 500-point completion bonus
      even if line loss improves. The change to kp (3.0 to 3.5) combined with a wider
      array is also a simultaneous change to two terms, so the next race cannot tell
      which one helped. Keep base_speed at 1.4 so the speed effect is held constant.
      Keep the sensor widening to x = ±0.036 and sensor_size 0.016, and keep kd at
      0.4 and ki at 0.02. Make the kp change in one step. After the race, judge the
      array change by line_loss_events and max_error on the s-bend and slalom, and
      by whether any off-track exit still happens at a bend. If line_loss_events are
      still above 0.5 per run, raise kp further (toward 4.0) or kd (toward 0.6) to
      address turn-in lag. If the robot stays on the line but progress stalls below
      0.6 with no off-track exit, then base_speed is the limit and the next step is
      to raise it in 0.1 steps from 1.4 rather than to lower it.


      ### Requested changes


      - Keep base_speed at 1.4, the value that gave the one oval finish in iteration
      1 at 1.65 s. Lowering it to 1.1 risks failing the 3 s limit and losing the 500-point
      completion bonus.

      - Keep the wider array (sensor x at ±0.036 m with sensor_size 0.016) and kp
      3.5, but hold kd at 0.4 and ki at 0.02 so the race separates the array and gain
      effects from speed. Iteration 1 line-loss events of 1.15 to 1.45 per run were
      the main failure.

      - If line_loss_events are still above 0.5 per run after this change, raise kd
      from 0.4 toward 0.6 before raising kp further, since iteration 1 steering_oscillation
      was already 0.29 on the oval.


      - [Open this output](iteration-2/entityR1/versions/f55b9b630e9046e88a2aa34d6b936d47/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/10d044a5294048b3a12bab654e00c858/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-f6d91f0fce75cec5/payload.json)'
