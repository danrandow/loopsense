map:
  id: race-187-opt-eval-muted
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: kp 3.2 on iter-10 base
    notes: 'Iteration 10 geometry and speed (base 1.1, y=0.08) with kp raised from
      3.0 to 3.2 to test steering authority on slalom, the only track still failing.
      Expected to keep oval and s-bend at 20/20 while lifting slalom completions.


      ### Rationale


      Evidence: iteration 10 (score 724.1) is the best raced design. Oval (20/20)
      and s-bend (20/20) complete reliably, with oval finish near 2.0 s and s-bend
      near 2.2 s. Slalom is still almost always lost (1/20 finishes, progress 0.64,
      max_error about 0.061 against the 0.06 m limit). Mean rms_error on slalom is
      about 0.018, so the robot tracks on average and leaves the line at sudden alternating
      bends. Lowering base_speed from 1.3 to 1.1 at fixed sensor y=0.08 improved slalom
      progress (0.56 to 0.64) and slalom completion (0 to 1 of 20), so speed was a
      real lever. Sensor look-ahead has reached its limit at y=0.08, so the remaining
      lever is steering authority. Earlier, kp 3.7 hurt slalom and s-bend, but that
      test also changed the sensor layout and kd, so it did not isolate kp. Change
      (one variable): kp 3.0 to 3.2, a modest step. Geometry, base_speed 1.1, kd 0.8,
      ki 0.02 and last_direction line loss are unchanged, so this iteration measures
      the effect of steering gain against the iteration 10 baseline. Expected result:
      slalom max_error falls to about 0.058 to 0.060 on some seeds, slalom completions
      rise above 1/20, and oval and s-bend stay at 20/20. Hypotheses: (a) if slalom
      max_error stays at about 0.061 with no progress change, the limit is not steering
      gain and the next step is sensor layout or kd. (b) If steering_oscillation rises
      above 0.35 on any track, kp is too high for the damping and kd should rise to
      about 0.9. (c) If oval or s-bend completion drops below 20/20, revert to kp
      3.0. Because this is the final iteration and the unseen track differs in shape,
      a small gain step is preferred over a large one to avoid losing the reliable
      oval and s-bend finishes. Measurements wanted: per-track completion, progress,
      completion_time, rms_error, max_error, line_loss_events, steering_oscillation,
      control_effort and noise_robustness, to separate the kp effect on each track.


      - [Open this output](iteration-11/entity0/versions/d50d199fe9d24f56bbb9f9014fd18105/payload.json)

      - Based on: [entityR2A](iteration-11/entityR2A/versions/carried-f719e4fadf0e3f34/payload.json)'
  - id: entityR1
    label: Approve kp 3.2 step
    notes: 'Approved the kp 3.0 to 3.2 single-variable step on top of the iteration
      10 best design (724.1), since it is valid, low-risk and the final iteration
      leaves no budget for another review round. The notes rest on iteration 10''s
      per-track results and the iteration 4 kp evidence, which was confounded.


      ### Feedback


      Written before this candidate races, so no outcome is claimed for it. The evidence
      is iteration 10 (score 724.1, the best raced design): oval 20/20 at about 2.0
      s, s-bend 20/20 at about 2.2 s, and slalom 1/20 with progress 0.64, max_error
      about 0.061 and rms_error about 0.018. Dropping base_speed from 1.3 to 1.1 at
      fixed y=0.08 raised slalom progress from 0.56 to 0.64 and gave the first slalom
      finish, so speed was a real lever. The candidate changes one variable against
      that baseline: kp 3.0 to 3.2, with geometry, base_speed 1.1, kd 0.8, ki 0.02
      and last_direction line loss unchanged. It is inside the contract limits and
      is a small step. Iteration 4 (kp 3.7) hurt slalom and s-bend, but it also changed
      the array and kd, so it does not rule out a small kp rise. This is the final
      iteration, and there is no budget for a second review round that would still
      leave a race, so the candidate should be approved now. After the race, read
      the results in this order. (a) If oval or s-bend completion falls below 20/20,
      that is the main risk of kp rising, and the 500-point bonus outweighs the rest.
      (b) If steering_oscillation rises above about 0.35 on any track, kd is too low
      for the new gain, so kd should go toward 0.9. (c) If slalom max_error stays
      near 0.061 with no progress change, steering gain is not the limit, and the
      difference is within noise.


      ### Requested changes


      - If the next race shows oval or s-bend completion below 20/20, revert kp from
      3.2 to 3.0, since iteration 10 finished both at 20/20 and the completion bonus
      outweighs any slalom gain.

      - If steering_oscillation rises above about 0.35 on any track, raise kd from
      0.8 toward 0.9 with kp held, because iteration 10 oscillation was 0.29 to 0.31
      and higher kp with the same damping adds jitter.

      - Keep base_speed 1.1 and sensor y 0.08 unchanged, because iteration 10 showed
      slalom progress rising from 0.56 to 0.64 at the lower speed.


      - [Open this output](iteration-11/entityR1/versions/9bbce20c669047a5825b52cf94f72767/payload.json)

