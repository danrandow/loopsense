overrides:
  entities:
  - id: entity0
    label: Sensors forward to y=0.05
    notes: 'Moves the sensor array 2 cm forward from iteration 5''s best design (306.5)
      to test whether turn-in lag causes the s-bend and slalom off-track exits. All
      other values are unchanged so the effect is isolated against the best baseline.


      ### Rationale


      Evidence: iteration 5 is the best raced design (score 306.5). It finished 10
      of 20 oval trials, but every s-bend and slalom trial ended off track (progress
      0.39 and 0.28). Mean rms_error is only about 0.02, while max_error reaches the
      0.06 m off-track limit. The robot tracks well on average and then fails in sudden
      bends. Iteration 4 showed that higher kp hurts the harder tracks, so kp stays
      at 3.0. Line_loss_events near 1 per run mostly reflects the terminal off-track
      event.


      Change: move all five sensors forward from y = 0.03 to y = 0.05 m, keeping the
      x spacing (-0.04 to 0.04, 16 mm footprints). The hypothesis is turn-in lag:
      the sensors currently see the tape only after the axle has already reached the
      bend, so correction arrives late. Reading the line 2 cm earlier should reduce
      max_error at the sharp alternating bends. Speed (1.3), kp (3.0), kd (0.8), ki
      (0.02), mass (0.6 kg) and line-loss mode are unchanged, so this iteration tests
      one variable against the best baseline.


      Expected result: max_error on the s-bend and slalom falls below 0.06 more often,
      and progress on those tracks rises above 0.4 and 0.3 respectively. Oval completion
      should hold at about 1 in 2.


      Hypotheses and next checks: (a) if the s-bend and slalom still exit off track
      with max_error at 0.06 and sensor y has no effect, the limit is steering authority,
      so kp should rise slightly to about 3.3 with kd held. (b) If steering_oscillation
      rises above 0.35 after the move, the forward sensors are amplifying jitter,
      so kd should drop to about 0.6. (c) If progress stalls below 0.3 with no off-track
      exit, base_speed is too low for the 3 s limit and should rise toward 1.5.


      Measurements wanted: completion, progress, completion_time, rms_error, max_error,
      line_loss_events, steering_oscillation, control_effort and noise_robustness,
      so that the sensor-position effect can be separated from the damping and speed
      effects.


      - [Open this output](iteration-6/entity0/versions/23549bffb1704d3dbf14f0af713f6b81/payload.json)

      - Based on: [entityR2A](iteration-6/entityR2A/versions/carried-82cbc3822ac61e0e/payload.json)'
  - id: entityR1
    label: 'Approve: sensors y 0.05'
    notes: 'Approves the single-variable change of sensor y from 0.03 to 0.05 m on
      the best raced baseline (iteration 5, score 306.5), testing turn-in lag at the
      s-bend and slalom where max_error hits the 0.06 m limit. Three follow-up changes
      are set out for kd, kp and base_speed depending on what the race shows.


      ### Feedback


      Written before this candidate races, so no outcome is claimed for it. The evidence
      is iteration 5, the best raced design (score 306.5). It finished 10 of 20 oval
      trials at a mean time of 1.83 s, and mean rms_error was about 0.02. Every s-bend
      and slalom trial ended off track, with max_error at 0.062 to 0.064 m against
      the 0.06 m limit, and progress of 0.39 and 0.28. Iteration 4 showed that kp
      3.7 hurt the harder tracks, so keeping kp at 3.0 is supported. The candidate
      changes only sensor y (0.03 to 0.05 m) against the iteration 5 baseline. Its
      geometry is inside the contract limits (y allowed up to 0.08), and the sensor
      spacing and footprints are unchanged, so the race can isolate the turn-in lag
      hypothesis. The change is valid and single-variable, and it is a sensible test
      of the remaining failure at the sharp bends. Approve so the race gives per-step
      evidence on the sensor-position effect. After the race, read the results in
      this order. (a) If max_error on the s-bend and slalom still reaches 0.06 while
      steering_oscillation rises above about 0.35, the forward sensors are amplifying
      jitter: lower kd from 0.8 toward 0.6. (b) If max_error on those tracks is still
      at the limit with steering_oscillation unchanged, steering authority is the
      limit: raise kp from 3.0 toward 3.3 with kd held. (c) If progress stalls below
      0.3 with no off-track exit, base_speed is too low for the 3 s limit: raise it
      from 1.3 toward 1.4 or 1.5 in 0.1 steps. Ignore line_loss_events as an array
      signal if they stay near 1 per run and the terminal event is the off-track exit.


      ### Requested changes


      - If max_error on the s-bend and slalom still reaches 0.06 m with steering_oscillation
      above 0.35 after the sensor move, lower kd from 0.8 toward 0.6, because the
      forward sensors may be amplifying jitter (iteration 5 oscillation was 0.26 to
      0.32 on the harder tracks).

      - If max_error on the s-bend and slalom still reaches 0.06 m with steering_oscillation
      unchanged, raise kp from 3.0 toward 3.3 with kd held at 0.8, because iteration
      5 shows the bends fail at max_error 0.062 to 0.064 and iteration 4 showed higher
      kp only helped with the wider array and not in isolation.

      - If progress stays below 0.3 on the s-bend or slalom with no off-track exit,
      raise base_speed from 1.3 toward 1.4 or 1.5 in 0.1 steps with the same gains,
      because iteration 1 finished the oval at 1.65 s at base_speed 1.4.


      - [Open this output](iteration-6/entityR1/versions/972ae6172e3e4a46879bbe03a54e81bf/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/23549bffb1704d3dbf14f0af713f6b81/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-82cbc3822ac61e0e/payload.json)'
