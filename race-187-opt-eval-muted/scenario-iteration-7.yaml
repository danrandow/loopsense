overrides:
  entities:
  - id: entity0
    label: Sensors forward to y=0.07
    notes: 'Moves the line sensors 2 cm further ahead of the axle (y 0.05 to 0.07)
      and keeps all other values from the best raced design (iteration 6, score 570).
      Iteration 6 showed forward sensors helped the s-bend and slalom, and slalom
      still exits off track, so this tests more look-ahead alone.


      ### Rationale


      Evidence: iteration 6 is the best raced design (score 570.4). Moving the sensors
      forward from y=0.03 to y=0.05 m raised the oval finish rate to 20/20 and the
      s-bend finish rate to 9/20, and lifted slalom progress from 0.28 to 0.41. The
      lead distance is clearly the lever that works. Slalom is still 0/20, ending
      off track with max_error near the 0.06 m limit, and steering_oscillation there
      is about 0.30. Change (one variable): sensor y moves from 0.05 to 0.07 m, the
      upper end of the allowed range. This extends the look-ahead further so the correction
      starts earlier at the alternating slalom bends. Everything else stays fixed
      (x spacing -0.04 to 0.04 with 16 mm footprints, kp 3.0, kd 0.8, ki 0.02, base_speed
      1.3, mass 0.6 kg, last_direction line loss), so the effect of look-ahead can
      be isolated. Expected result: slalom and s-bend max_error falls, and slalom
      progress rises above 0.5. Oval should stay near 100 percent completion. Hypotheses:
      (a) if the slalom still exits at max_error about 0.06 with no gain from y, steering
      authority is the limit, so kp should move to about 3.3 with kd held. (b) If
      steering_oscillation rises above 0.35, the far-forward sensors are amplifying
      jitter, so kd should drop toward 0.6. (c) If the oval stops completing, the
      forward lead is overshooting on straights, so y should return to about 0.06.
      Measurements wanted: completion, progress, completion_time, rms_error, max_error,
      line_loss_events, steering_oscillation, control_effort and noise_robustness,
      per track.


      - [Open this output](iteration-7/entity0/versions/a975e37ee20e4dcc8c80aaf5a8a1c3f8/payload.json)

      - Based on: [entityR2A](iteration-7/entityR2A/versions/carried-b496443e117191d6/payload.json)'
  - id: entityR1
    label: 'Revise: y 0.07 not'
    notes: 'The candidate''s rationale asks for sensor y 0.07 m, but its geometry
      still sits at y 0.05 m, which is identical to iteration 6 (score 570.4). Revision
      is requested so the race tests the single look-ahead change backed by iteration
      6''s oval and s-bend gains.


      ### Feedback


      The candidate''s rationale says to move the sensors from y = 0.05 to y = 0.07
      m, but the geometry still has every sensor at y = 0.05 m. As written, it is
      identical to iteration 6, the best raced design (score 570.4). Racing it would
      retest iteration 6 and not test the look-ahead hypothesis. Revise the geometry
      so all five sensors sit at y = 0.07 m, keeping x at -0.04 to 0.04 m in 0.02
      m steps, sensor_size 0.016, kp 3.0, kd 0.8, ki 0.02, base_speed 1.3, mass 0.6
      kg and last_direction line loss unchanged, so the single change is isolated.


      The evidence behind the change is iteration 6. Moving the sensors from y 0.03
      to 0.05 raised oval completion to 20 of 20 and s-bend completion to 9 of 20,
      and it lifted slalom progress from 0.28 to 0.41, though slalom still finished
      0 of 20 at max_error near the 0.06 m limit. Expected from the forward look-ahead:
      slalom and s-bend max_error should fall and slalom progress should rise. The
      oval should stay near full completion. Nothing here predicts the outcome of
      the revised build, which has not raced.


      After the next race, read the results in this order. (a) If oval completion
      falls below 20 of 20 or steering_oscillation rises above about 0.35, the forward
      lead is overshooting on straights or amplifying jitter, so return y to 0.06
      and, if needed, lower kd toward 0.6. (b) If the slalom still exits at max_error
      near 0.06 with no gain from y, steering authority is the limit, so raise kp
      to about 3.3 with kd held. (c) If progress stalls below 0.3 on the s-bend with
      no off-track exit, base_speed is too low for the 3 s limit, so raise it toward
      1.4 in 0.1 steps.


      ### Requested changes


      - Set every sensor''s y to 0.07 m (sensor_positions y = 0.07 for all five entries),
      keeping x at -0.04, -0.02, 0, 0.02, 0.04 m and sensor_size 0.016. The current
      build still has y = 0.05 m, so it matches iteration 6 and does not test the
      change; iteration 6 showed y 0.03 to 0.05 raised oval completion to 20 of 20
      and slalom progress to 0.41.

      - If, after the race, oval completion drops below 20 of 20 or steering_oscillation
      rises above about 0.35, return sensor y to 0.06 m, since iteration 6 showed
      the forward lead is the lever that works and the oval was at full completion
      there.

      - If the slalom still exits off track at max_error near 0.06 m with no gain
      in progress from y 0.07, raise kp from 3.0 toward 3.3 with kd held at 0.8, since
      iteration 4 showed kp 3.7 hurt the harder tracks at y 0.03 and steering authority
      is the remaining limit.


      - [Open this output](iteration-7/entityR1/versions/0fd3cec48e544920a7fa9f5a2c579842/payload.json)

