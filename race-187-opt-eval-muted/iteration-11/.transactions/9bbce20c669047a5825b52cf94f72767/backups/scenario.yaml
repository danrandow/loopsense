map:
  id: race-187-opt-eval-muted
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: kp 3.2 on iter-10 base
    notes: 'Iteration 10 geometry and speed (base 1.1, y=0.08) with kp raised from
      3.0 to 3.2 to test steering authority on slalom, the only track still failing.
      Expected to keep oval and s-bend at 20/20 while lifting slalom completions.


      ### Rationale


      Evidence: iteration 10 (score 724.1) is the best raced design. Oval (20/20)
      and s-bend (20/20) complete reliably, with oval finish near 2.0 s and s-bend
      near 2.2 s. Slalom is still almost always lost (1/20 finishes, progress 0.64,
      max_error about 0.061 against the 0.06 m limit). Mean rms_error on slalom is
      about 0.018, so the robot tracks on average and leaves the line at sudden alternating
      bends. Lowering base_speed from 1.3 to 1.1 at fixed sensor y=0.08 improved slalom
      progress (0.56 to 0.64) and slalom completion (0 to 1 of 20), so speed was a
      real lever. Sensor look-ahead has reached its limit at y=0.08, so the remaining
      lever is steering authority. Earlier, kp 3.7 hurt slalom and s-bend, but that
      test also changed the sensor layout and kd, so it did not isolate kp. Change
      (one variable): kp 3.0 to 3.2, a modest step. Geometry, base_speed 1.1, kd 0.8,
      ki 0.02 and last_direction line loss are unchanged, so this iteration measures
      the effect of steering gain against the iteration 10 baseline. Expected result:
      slalom max_error falls to about 0.058 to 0.060 on some seeds, slalom completions
      rise above 1/20, and oval and s-bend stay at 20/20. Hypotheses: (a) if slalom
      max_error stays at about 0.061 with no progress change, the limit is not steering
      gain and the next step is sensor layout or kd. (b) If steering_oscillation rises
      above 0.35 on any track, kp is too high for the damping and kd should rise to
      about 0.9. (c) If oval or s-bend completion drops below 20/20, revert to kp
      3.0. Because this is the final iteration and the unseen track differs in shape,
      a small gain step is preferred over a large one to avoid losing the reliable
      oval and s-bend finishes. Measurements wanted: per-track completion, progress,
      completion_time, rms_error, max_error, line_loss_events, steering_oscillation,
      control_effort and noise_robustness, to separate the kp effect on each track.


      - [Open this output](iteration-11/entity0/versions/d50d199fe9d24f56bbb9f9014fd18105/payload.json)

      - Based on: [entityR2A](iteration-11/entityR2A/versions/carried-f719e4fadf0e3f34/payload.json)'
  - id: entityR1
    label: 'Approve: slower base 1.1'
    notes: 'Approved the candidate unchanged: base_speed 1.3 to 1.1 at sensor y 0.08
      (iteration 9 geometry), a single-variable test aimed at slalom max_error sitting
      just above the 0.06 m limit. The slower speed is expected to give more correction
      time, and the timing estimate stays under the 3.0 s cap, though completion is
      not yet measured.


      ### Feedback


      Written before this candidate races, so no outcome is claimed for it. The evidence
      is iteration 8 (score 708.5, the best raced design), iteration 9 (score 703.4,
      sensor y 0.08 m), and the earlier tuning history. Oval (20/20) and s-bend (20/20)
      complete reliably at base_speed 1.3. Slalom is still 0/20, ending off track
      at max_error about 0.063 m, just over the 0.06 m limit, with progress 0.56 and
      mean rms_error about 0.02. The robot tracks on average and loses the line at
      sudden alternating bends. Raising kp was already ruled out: iteration 4 at kp
      3.7 hurt slalom and s-bend. The candidate changes one variable against iteration
      9: base_speed 1.3 to 1.1, with the sensor geometry, kp 3.0, kd 0.8 and ki 0.02
      unchanged. That is a clean test of whether more correction time per bend reduces
      lateral overshoot on slalom. The rationale''s timing estimate (oval about 2.2
      s, s-bend about 2.4 s) is inside the 3.0 s cap, but it is an estimate and not
      evidence. Iteration 2 at base 1.1 was never raced, so there is no measured speed-only
      result. The main risk is completion: if oval or s-bend drops below 20/20, or
      completion time approaches 2.8 s, the 500-point bonus is lost. The score cost
      of slower finishes is small, since the time term moves by only about 5 to 8
      points. Approve so the race gives per-track telemetry for the speed effect.
      There is one iteration left after this one, so a second review round would cost
      more than it can recover. After the race, read the results in this order. (a)
      If the slalom still exits at max_error near 0.06 with progress no better than
      about 0.56, speed is not the limit, so the next step is kp about 3.3 with kd
      held. (b) If oval or s-bend completion falls below 20/20, or completion_time
      exceeds about 2.8 s, base_speed is too low, so return it to about 1.2. (c) If
      steering_oscillation rises above about 0.35 on any track, kd should drop toward
      0.6.


      ### Requested changes


      - If slalom still exits off track at max_error near 0.06 m with no progress
      gain over iteration 9''s 0.56, leave base_speed and sensor y as they are and
      raise kp from 3.0 toward 3.3 with kd held at 0.8, since iteration 4 showed kp
      3.7 hurt the harder tracks and a small step is safer.

      - If oval or s-bend completions fall below 20/20, or completion_time rises above
      about 2.8 s, return base_speed from 1.1 to about 1.2 with the same gains, because
      the 500-point completion bonus is worth far more than the small time term lost
      at slower speed.

      - If steering_oscillation rises above about 0.35 on any track at the lower speed,
      lower kd from 0.8 toward 0.6 with the same gains, since iteration 8 and 9 oscillation
      was 0.23 to 0.29 on the finishing tracks and a large rise would indicate damping,
      not speed, is the limit.


      - [Open this output](iteration-10/entityR1/versions/ccd0444e13ac423bb2abde6a36296639/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/8f325a50a0664f298967fa123b37e418/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-7d1944418b3a474e/payload.json)'
