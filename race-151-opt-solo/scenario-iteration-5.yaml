  entities:
  - id: entity0
    label: Restore wheel_track 0.12
    notes: 'Returns geometry to iteration 2''s wheel_track 0.12 and mass 0.8, which
      gave the clean 20/20 oval, with kp 5.0 and kd 1.2 to add bend gain without the
      overshoot seen at kp 5 and 6 on track 0.10. Based on iterations 2 to 4 telemetry;
      the slalom is still expected to fail.


      ### Rationale


      Evidence. Iteration 2 (score 398.1) is the best so far: the oval finished 20/20
      with rms_error 0.015 and max_error 0.027. Its geometry was wheel_track 0.12,
      mass 0.8, body_length 0.14, with sensors at y 0.08, x ±0.07, size 0.016, and
      kp 4.5, kd 1.0, base 1.2. Iterations 3 and 4 cut wheel_track to 0.10 and mass
      to 0.7 and raised kp to 6 then 5. The s-bend improved (progress 0.42 to 0.74
      in iteration 3) but the oval fell to 9/20 and then 16/20, with steering_oscillation
      rising to 0.23. The off-track limit is fixed at 0.06 m for every allowed body
      width, so the bends must be tracked more tightly rather than given more room.
      Line loss is rare, so the failure is steering lag and overshoot on bends, not
      lost tape.


      Interpretation. Turn rate per unit of turn scales roughly as 1/wheel_track,
      so wheel_track 0.10 raises the effective steering gain by about 20 percent.
      Iteration 4 at track 0.10 with kp 5 therefore behaves like kp 6 at track 0.12,
      and its kd of 1.8 is high for that. The oval degradation is consistent with
      overshoot from too much effective gain plus derivative action, not with the
      bends being too tight.


      Changes. (1) wheel_track back to 0.12, restoring the iteration 2 yaw response
      that gave a clean oval. (2) mass back to 0.8, matching iteration 2. (3) kp 5.0,
      which gives the bend correction of iteration 3 while sitting below the overshoot
      point seen at kp 6. (4) kd 1.2, a kd/kp ratio of 0.24, between iterations 2
      and 3, to damp oscillation without over-damping the bends. (5) base_speed 1.1,
      kept because the oval still finishes near 2 s at this speed. Sensors, sensor
      size, sensor weights, body and ki = 0 are unchanged from iteration 2, so the
      change in response can be read from the gain and wheel_track.


      Expected result. Oval completion at or near 100 percent, with steering_oscillation
      at or below 0.2. S-bend progress of 0.6 or more, since the effective bend gain
      is close to iteration 3. Slalom is still the weakest track (progress about 0.2
      to 0.3); I expect it to stay off track, because alternating curves may need
      faster steering response than this design gives.


      Hypotheses to test next. (H1) Overshoot at high effective gain is what limits
      the oval, so kp near 5 at track 0.12 should keep oval completion high. (H2)
      Slalom failure is a response-speed or sensor-coverage limit, not a gain limit;
      if progress stays below 0.3 at this gain, the next step is 7 sensors spanning
      ±0.08 m or a lower base_speed with higher kp. (H3) Mass 0.8 versus 0.7 changes
      the bend yaw response; a clear s-bend gain at equal kp would confirm it.


      Measurements requested: completion, progress, completion_time, rms_error, max_error,
      line_loss_events, steering_oscillation, control_effort, controller_errors and
      noise_robustness, per track, to separate overshoot from lag.


