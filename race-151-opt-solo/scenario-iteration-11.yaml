  - id: entity0
    label: Iter 10 design, held
    notes: 'Resubmits the iteration 10 design unchanged (score 933.9, 60/60 development
      finishes, rms error at most 0.009 m). No change is justified: the remaining
      gains are about 10 to 15 points and risk the all-finish record on unseen tracks.


      ### Rationale


      Evidence: Iteration 10 is the best design so far (933.9). It finished 60 of
      60 development trials. Oval rms_error was 0.0038, s-bend 0.0059 and slalom 0.0089,
      with progress of 0.996 or higher on every track. The 7-sensor array with evenly
      spaced weights fixed the slalom failure that held iterations 8 and 9 at 0 of
      20 finishes. Scores are now near the ceiling set by completion time and line-loss
      terms. The remaining gains are small: about 10 points at most from faster completion,
      and about 15 points if the one line-loss event per run went away. Those gains
      come with a real risk of breaking the all-finish record. The final race uses
      unseen tracks of a different shape, where robustness matters more than a few
      points of time. Changing base_speed, kp or kd could reintroduce off-track ends
      on tight bends, and I have no per-step telemetry to diagnose the line-loss event.
      I therefore resubmit the iteration 10 design unchanged. It has the widest observed
      margin: its per-track minimum scores (929.6 to 934.8) sit well above the level
      of any off-track failure. Hypotheses I cannot test before the final race: (H1)
      the single line-loss event per run happens at start-up or at the finish, since
      it occurs on every track with a consistent count, and is therefore not a steering
      failure; (H2) a base_speed of about 1.15 would cut completion time by roughly
      0.1 s, worth about 2 points, but would raise steering oscillation on the s-bend,
      where it is already highest at 0.34. Measurements requested: completion_time
      and line_loss_events to confirm where the loss happens, and max_error per track
      to check margin on unseen geometry.


