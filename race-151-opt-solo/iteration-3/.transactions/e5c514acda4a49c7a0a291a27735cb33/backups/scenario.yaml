  entities:
  - id: entity0
    label: Higher gain, tighter
    notes: 'Raises kp to 6.0 and kd to 1.5 and narrows wheel track to 0.10 m, with
      base speed 1.1 and mass 0.7 kg, to cut steering lag on the s-bend and slalom.
      Iteration 2 showed the oval finishing 20/20 but bends pushing max_error to the
      0.06 m off-track limit.


      ### Rationale


      Evidence from iteration 2 (score 398.1): the oval now finishes 20 of 20 runs
      with rms_error 0.015 and max_error 0.027, so steering works on gentle curves.
      The s-bend (progress 0.42) and slalom (progress 0.19) still end off track with
      max_error at about 0.063, which is the off-track limit (max(0.06, 0.0125 + body_width/4)
      = 0.06 m for any allowed body width). Line loss is rare (0.2 and 1.0 events),
      so the failure is steering lag on tight bends, not lost tape. Body width cannot
      widen the limit, because 0.0125 + 0.18/4 is still below 0.06.


      Changes: (1) kp 4.5 to 6.0, for stronger correction on bends; (2) kd 1.0 to
      1.5, to damp the larger gain, since oval oscillation is only 0.14 and there
      is margin; (3) base_speed 1.2 to 1.1, to give the loop more time per metre on
      bends. The oval still needs under 3 s, and the oval took 2.0 s at 1.2, so 1.1
      should still finish; (4) wheel_track 0.12 to 0.10, so the same PWM difference
      gives a faster yaw rate; (5) mass 0.8 to 0.7, to lower yaw inertia. Sensors,
      sensor size, sensor weights, ki = 0 and line_loss = last_direction are unchanged,
      so the effect of the steering change can be read directly.


      Expected result: max_error on the s-bend and slalom falls below 0.06, with progress
      above 0.6 on the s-bend and above 0.4 on the slalom. Oval completion stays at
      or near 100 percent, with steering_oscillation at or below about 0.25.


      Hypotheses: (H1) max_error on bends is set by steering gain, so higher kp lowers
      it; (H2) if steering_oscillation rises above 0.3, kd 1.5 is too high for kp
      6 and should be cut toward 1.0; (H3) a smaller wheel_track and lower mass help
      the robot turn into curves, which should show as lower max_error at equal kp.
      Measurements requested: per-track completion, progress, max_error, rms_error,
      line_loss_events and steering_oscillation, to separate lag from line loss.


