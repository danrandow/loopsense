  entities:
  - id: entity0
    label: 7-sensor array, kp 5 kd
    notes: 'Reverts the controller to the iteration 8 gains, since kp 5.4 lost s-bend
      finishes without helping the slalom. Widens the sensor count from 5 to 7 on
      the same span to improve tape resolution on alternating curves. Based on iterations
      8 and 9: the slalom is stuck at about 0.47 progress and is the score bottleneck.


      ### Rationale


      Evidence. Iteration 8 (score 654.0, best so far) had kp 5.0, kd 1.2, body 0.10
      x 0.08, base 1.1, and 5 sensors at x = -0.07 to 0.07. It finished 18/20 on the
      oval, 19/20 on the s-bend, and 0/20 on the slalom, where progress was 0.47 and
      every run went off track at the 0.06 m limit. Iteration 9 raised kp to 5.4 and
      kd to 1.4. The slalom barely moved (progress 0.476), while s-bend finishes fell
      from 19 to 15 and the score dropped to 638. So extra steering gain is not the
      slalom limit, and it costs s-bend performance. Line loss is rare (0.65 events
      per slalom run), so the robot is drifting off the tape on alternating curves
      rather than losing it. The slalom is the bottleneck for the score.


      Changes. (1) Revert the controller to the iteration 8 gains (kp 5.0, kd 1.2),
      which gave the best s-bend result. (2) Move from 5 to 7 sensors on the same
      span (x = -0.07 to 0.07, y = 0.08). Spacing drops from 0.035 m to about 0.023
      m, so the tape is seen with finer lateral resolution near the centre line and
      the signal changes more smoothly as the line moves across the array. Sensor
      weights are spaced evenly from -2 to 2, so the signal scale and effective kp
      match iterations 8 and 9. (3) Geometry otherwise matches iteration 8: body 0.10
      x 0.08, mass 0.8, wheel_track 0.12, wheel_radius 0.03, sensor_size 0.016, base_speed
      1.1, ki 0, last_direction. The off-track limit stays at 0.06 m.


      Expected result. The slalom should show progress above 0.5 and possibly a few
      finishes. The s-bend should stay at or near 19/20 and the oval at 18 to 20/20,
      with steering_oscillation at or below about 0.18. Score should be at or above
      iteration 8.


      Hypotheses. (H1) Slalom failure comes from coverage and signal resolution on
      alternating curves, so a denser array will lower its max_error and line_loss_events.
      (H2) Iteration 9''s loss on the s-bend came from the higher kp, so reverting
      kp restores s-bend finishes. (H3) If the slalom stays at about 0.47 progress,
      the limit is response speed rather than sensing. The next step would then be
      a lower base_speed with the same gains, or a shorter body to cut yaw inertia
      further.


      Measurements requested: per-track completion, progress, max_error, rms_error,
      line_loss_events, steering_oscillation and control_effort, to separate coverage
      loss from lag.


