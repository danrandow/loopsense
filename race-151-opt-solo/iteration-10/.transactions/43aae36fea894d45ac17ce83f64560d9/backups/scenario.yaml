  entities:
  - id: entity0
    label: Stiffer steer, more
    notes: 'Keeps the iteration 8 geometry (narrow body, best so far at 654) and raises
      kp to 5.4 and kd to 1.4 to address slalom lag, while damping the oval oscillation
      that rose to 0.17. Based on the slalom progress gain (0.23 to 0.47) and the
      oval jitter trend in the race data.


      ### Rationale


      Evidence from iteration 8 (score 654.0, best so far, up from 531.0): narrowing
      body_width from 0.12 to 0.08 m lowered yaw inertia, and the s-bend improved
      sharply (progress 0.91 to 0.995, 19/20 finishes). The oval fell slightly to
      18/20 finishes with steering_oscillation rising from 0.14 to 0.17, and two off-track
      ends. The slalom is still 0/20 finishes, with progress up from 0.23 to 0.47
      and max_error at the 0.06 m limit. Line loss is rare (0.6 events on the slalom),
      so the failure is steering lag and overshoot on alternating curves, not lost
      tape.


      Changes: (1) kp 5.0 to 5.4 to add steering correction for the slalom''s alternating
      bends. Earlier runs showed overshoot above kp about 5 at wheel_track 0.10, but
      wheel_track is now 0.12 and the body is narrower, so 5.4 is a small step. (2)
      kd 1.2 to 1.4 to damp the extra gain and bring the oval oscillation back toward
      0.14-0.15. The kd/kp ratio is about 0.26, close to the best-oval setting. Geometry
      (body 0.10 x 0.08, sensors at y 0.08, x -0.07 to 0.07, size 0.016, wheel_track
      0.12, mass 0.8), base_speed 1.1, ki 0 and last_direction are unchanged, so the
      controller effect can be read directly.


      Expected result: slalom progress above 0.55 with some finishes, s-bend finishes
      at or above 19/20, oval at or above 18/20 with steering_oscillation at or below
      0.18.


      Hypotheses: (H1) slalom failure is a gain-lag limit, so a small kp increase
      should lift its progress. (H2) the extra kd keeps the oval oscillation at or
      below 0.18. (H3) if the slalom does not move, the limit is sensor coverage on
      alternating curves, which points to a 7-sensor array inside x = ±0.07 m. Measurements
      requested: per-track completion, progress, max_error, rms_error, line_loss_events,
      steering_oscillation and control_effort, to separate lag from overshoot.


