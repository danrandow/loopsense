  entities:
  - id: entity0
    label: Narrower body, less yaw
    notes: 'Keeps the iteration 7 controller and cuts body_width from 0.12 to 0.08
      m, a 33 percent reduction in yaw inertia, to reduce bend lag. The off-track
      limit stays at 0.06 m, and iteration 7 showed the s-bend improving when inertia
      fell.


      ### Rationale


      Evidence from iteration 7 (score 531.0, best so far, up from 417.0): body_length
      0.14 to 0.10 cut the s-bend off-track rate. The oval still finishes 20/20 (steering_oscillation
      0.14), s-bend progress rose from 0.57 to 0.91 with 7/20 finishes, and the slalom
      is still 0/20 (progress 0.23, one line-loss event per run). The off-track limit
      is max(0.06, 0.0125 + body_width/4), which is 0.06 m for every allowed body
      width. Lag on bends is the failure mode, not lost tape. Yaw inertia is mass*(L^2+W^2)/12,
      and body_length is now at its 0.10 minimum, so body_width is the remaining lever.
      Changing body_width from 0.12 to 0.08 cuts L^2+W^2 from 0.0244 to 0.0164, a
      33 percent reduction in yaw inertia. Its only other effect is the off-track
      limit, which stays at 0.06 m because 0.0125 + 0.08/4 = 0.0325 is below it. So
      this change should make the robot turn faster on bends at no cost in the limit.
      I am changing only body_width, keeping kp 5.0, kd 1.2, base_speed 1.1, sensors
      and mass fixed, so the effect can be read directly. Expected result: s-bend
      progress above 0.95 with more finishes, slalom progress rising toward 0.3 or
      more, and the oval staying at 100 percent with steering_oscillation at or below
      about 0.2. Hypotheses: (H1) yaw inertia is the main bend-lag term, so the bend
      tracks improve further. (H2) if oval oscillation rises above 0.2, the faster
      yaw response is overshooting and kd should go to about 1.5. (H3) if the slalom
      does not move, its limit is sensor coverage or response speed on alternating
      curves, which points to a 7-sensor array inside x = ±0.07 m or a lower base_speed
      with a higher kp.


