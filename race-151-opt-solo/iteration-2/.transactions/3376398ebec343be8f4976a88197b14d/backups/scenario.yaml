  entities:
  - id: entity0
    label: Forward sensors, higher
    notes: 'Moves sensors to y=0.08 with a 0.016 m footprint, shortens the body to
      0.14 m, raises kp to 4.5 and kd to 1.0, and lowers base speed to 1.2. Based
      on iteration 1, where s-bend and slalom runs ended off track by steering lag
      (max_error at the 0.06 m limit) rather than line loss.


      ### Rationale


      Evidence from iteration 1 (score 212.5, up from 162.1): on the s-bend and slalom
      every run ended off track with max_error at 0.06 m, the off-track limit for
      this body (max(0.06, 0.0125 + 0.12/4) = 0.06 m). Line-loss events were near
      zero on the s-bend (0.0) and only about 1 on the slalom, and rms_error stayed
      around 0.023 to 0.031 m. So the robot is not losing the line outright. It drifts
      to the edge of the tape on bends and is then pushed past the limit. Progress
      was 0.32 on the s-bend and 0.12 on the slalom, so the main problem is steering
      lag and under-correction on bends. The oval finished only 6 of 20 runs, with
      steering_oscillation of 0.22, so there is also some jitter. Widening the array
      and moving it forward helped, which supports the view that sensor lead and coverage
      matter.


      Changes and reasons:

      (1) Sensors moved to y = 0.08 (the maximum), the most lead ahead of the axle,
      so corrections start before the wheels reach the tape.

      (2) Sensor size raised from 0.012 to 0.016 m. A larger footprint means the tape
      is seen by more than one sensor at a time, so the signal changes more smoothly
      and the sensors are less likely to drop out on tight bends.

      (3) body_length reduced from 0.18 to 0.14 m. Yaw inertia is mass*(L^2+W^2)/12,
      so this makes the robot turn more readily and respond faster to the steering
      command.

      (4) kp raised from 3.5 to 4.5 for stronger correction, and kd raised from 0.6
      to 1.0 to damp the added gain and reduce the oscillation seen on the oval.

      (5) base_speed lowered from 1.3 to 1.2 so the controller has more time to respond
      on bends. This gives up some completion time, but the completion bonus (500)
      is worth far more than the time term (at most 60).

      (6) Sensor weights kept at [-2,-1,0,1,2], and ki kept at 0 to avoid integral
      windup on bends. line_loss kept as last_direction, since line loss is rare.


      Expected result: fewer off-track ends on the s-bend and slalom (progress above
      0.5 on both), some oval completions rising above 50 percent, and steering_oscillation
      at or below about 0.25.


      Hypotheses to test next: (H1) the s-bend and slalom failures are steering lag,
      so a higher kp with a sensor lead of 0.08 m should lower max_error; (H2) a larger
      sensor footprint lowers line_loss_events toward 0; (H3) if oscillation rises
      above 0.3 with kd 1.0, the derivative gain is too high relative to kp and kd
      should be reduced. Measurements requested: per-track completion, progress, max_error,
      rms_error, line_loss_events and steering_oscillation, to separate lag from line
      loss.


      - [Open this output](iteration-2/entity0/versions/7a2b8c07e00c4a458b4d769ef3cbac93/payload.json)

      - Based on: [entityR2A](iteration-2/entityR2A/versions/carried-b900a942726366ab/payload.json)'
