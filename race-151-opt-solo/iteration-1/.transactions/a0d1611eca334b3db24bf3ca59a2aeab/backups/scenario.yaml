  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'First candidate, built from the contract without race data: five 12 mm
      sensors spanning ±0.04 m, kp 2.5, kd 0.3, base speed 1.5, last-direction line
      recovery. Its purpose is to get baseline telemetry on oscillation, speed and
      line loss.


      ### Rationale


      Iteration 0 has no race telemetry, so this is a conservative first candidate
      built from the contract rather than from evidence. Geometry: five line sensors
      spread across the body at x = -0.04, -0.02, 0, 0.02, 0.04 m (positive x is left),
      placed 0.05 m ahead of the axle so they read the line before the wheels reach
      it. Sensor size 0.012 m is smaller than the 25 mm tape, so the readings stay
      sensitive across the tape width. Wheel track 0.12 m and wheel radius 0.03 m
      are mid-range. Body 0.12 m wide keeps the off-track limit at about 0.06 m (tape
      half-width 0.0125 + 0.03), a reasonable margin. Mass 0.8 kg with a 0.18 m body
      length gives moderate yaw inertia. Controller: sensor_weights [-2, -1, 0, 1,
      2] match the sensor order from right to left, so a line to the left gives a
      positive signal (steer left). kp = 2.5 gives strong correction without saturating
      the wheel commands at normal offsets. kd = 0.3 damps oscillation, and ki = 0
      avoids integral windup on curves. base_speed = 1.5 gives about 75 percent PWM,
      enough to finish near 3 s if the robot tracks well. line_loss = last_direction
      so the robot searches toward the side it last saw the line. Expected result:
      completion on the oval and s-bend, with rms_error well under 0.05 m. The main
      risk is oscillation at the higher base speed, or sharp bends on the slalom pushing
      the line off the sensor array. Hypotheses to test: (1) kp is the main driver
      of oscillation, so steering_oscillation will rise with kp; (2) completion time
      is limited by base_speed, not by steering, on the gentle tracks; (3) line_loss_events
      stays at 0 if the sensor span covers the tape on sharp bends.


      - [Open this output](iteration-0/entity0/versions/acf6ef13f0f647f8bc94a1c13e31a0dc/payload.json)'
