map:
  id: race-183-opt-eval-muted
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: kp 3.0 on 7-sensor array
    notes: 'Keeps the 7-sensor array that lifted s-bend progress from 0.22 to 0.59
      and raises kp from 2.5 to 3.0 to add turn authority for slalom, which still
      leaves the tape at max_error about 0.063 m. Evidence is the iteration 8 race
      and the earlier kd and speed tests, which ruled out kd and base_speed as levers.


      ### Rationale


      Evidence: the best raced design is iteration 8 (score 430.6). The seven-sensor
      array with +/-1.5 outer weights lifted s-bend progress from 0.22 (five sensors)
      to 0.59 and s-bend finishes from 0 to 1 of 20. The oval still finishes 20 of
      20 at about 1.87 s with steering_oscillation 0.17. Slalom is unchanged: progress
      0.18, about 1 line-loss event per run, and every run goes off track at max_error
      about 0.063 m, just above the 0.06 m limit. Body width is already at its maximum,
      so the margin must come from the controller.


      What I considered: (a) kd 1.0 was tested in iteration 4 and cost oval finishes
      (0.90 to 0.50), so I leave kd at 0.8. (b) Lowering base_speed hurt bend progress
      in iteration 3, so I keep 1.1. (c) Sensor y and sensor_size were not the limit
      in earlier tests. (d) The seven-sensor signal can reach +/-1.5, so the effective
      steering gain is already about 1.5 times that of iteration 3. Even so, the slalom
      still leaves the tape, which suggests the turn authority at large error is still
      too low.


      Change (one variable): kp 2.5 to 3.0. This gives a turn of up to about 4.5 at
      full-scale signal, against 3.75 now, so the robot can correct harder when it
      reaches the 0.06 m limit on slalom and the sharper s-bend arcs. Geometry and
      the other controller values stay as in iteration 8.


      Expected result: slalom max_error falls below about 0.055 m, and its progress
      rises above 0.3 with line_loss_events trending toward 0.5 or less. S-bend completion
      should hold or improve. Oval should still finish near 1.9 s. Risk: steering_oscillation
      rises on the oval. If it goes above about 0.3, or the oval finish rate falls,
      the next step is kp about 2.7 or outer weights about 1.2.


      Hypotheses: (a) slalom exits are caused by turn authority at large error, not
      line loss alone, so progress should rise with kp; (b) if slalom still ends at
      progress about 0.18 with max_error about 0.063, the limit is in the entry phase,
      and the next lever is y position or line_loss mode.


      Measurements wanted: per-track completion, progress, max_error, line_loss_events,
      steering_oscillation, completion_time.


      - [Open this output](iteration-9/entity0/versions/383451e3528e48158caf6c24448b737b/payload.json)

      - Based on: [entityR2A](iteration-9/entityR2A/versions/carried-6c194b454d7fec07/payload.json)'
  - id: entityR1
    label: 'Approve: kp 2.5 to 3.0'
    notes: 'Approved the iteration 8 best design with kp raised to 3.0 as the only
      change, to test whether more turn authority fixes slalom and s-bend exits. Oval
      steering oscillation and finishes are the main risk, based on iterations 2 and
      4.


      ### Feedback


      Approved for the race. The candidate is the iteration 8 design (score 430.6,
      best raced so far) with one controller change: kp 2.5 to 3.0. Geometry, kd 0.8,
      ki 0.02, base_speed 1.1, weights [-1.5 to 1.5] and last_direction are unchanged
      from iteration 8, so any shift in the per-track results can be attributed to
      kp.


      The evidence supports testing kp. Iteration 8 finished all 20 oval trials at
      1.87 s with steering_oscillation 0.17. Its s-bend and slalom trials still ended
      off track at max_error about 0.062 to 0.063 m, just over the 0.06 m limit, with
      slalom progress stuck at 0.18 and about 1 line-loss event per run. Iteration
      6 and 7 designs were not raced, so the 1.5 outer weights have only been tested
      once, in iteration 8.


      The risk is that the effective gain at the edges rises by about 20 percent over
      iteration 8 (turn up to about 4.5 at full signal). Iteration 2 showed that higher
      kp with a larger footprint and kd 1.0 cut oval finishes from 0.9 to 0.55, and
      iteration 4 showed kd 1.0 cost oval finishes. The oval is therefore the main
      thing to read in this race.


      What to do with the race result, judged per track: if the oval still finishes
      20 of 20 with steering_oscillation at or below about 0.3 and slalom max_error
      falls below about 0.055 m, keep kp 3.0 and look for further gain. If the oval
      drops below about 0.9 completion or steering_oscillation rises above 0.3, return
      kp to 2.5 (iteration 8) and try kp 2.7 or outer weights of about 1.2 instead.
      If slalom and s-bend still show line_loss_events near 1 with max_error at or
      above 0.06 m, the limit is not turn authority alone, and the next lever is sensor
      y or line_loss mode.


      ### Requested changes


      - If the oval completion stays at 20 of 20 and steering_oscillation is at or
      below about 0.3, while slalom max_error falls below about 0.055 m: keep kp 3.0
      and try kp 3.3 to test further turn authority, since iteration 8 showed oval
      steering_oscillation of 0.17 with kp 2.5.

      - If the oval completion drops below about 0.9 or steering_oscillation exceeds
      0.3 (iteration 2 and 4 showed higher effective gain or kd cut oval finishes):
      return kp to 2.5 and try kp 2.7, or reduce outer sensor_weights to about 1.2
      with kp 3.0 to keep the effective gain near iteration 8.

      - If slalom and s-bend still show line_loss_events near 1 with max_error at
      or above 0.06 m at kp 3.0: keep kp 3.0 and change line_loss from last_direction
      to search_right, or move sensor y, since iteration 5 (y 0.08) did not fix the
      bends and gain alone did not change line loss.


      - [Open this output](iteration-9/entityR1/versions/1490546c298c419093b7312cd6177c34/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/383451e3528e48158caf6c24448b737b/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-6c194b454d7fec07/payload.json)'
