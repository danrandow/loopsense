map:
  id: race-183-opt-eval-muted
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: kd 1.0, speed 1.3 retest
    notes: 'Restores base_speed 1.3, which beat 1.1 on the s-bend and slalom, and
      raises kd to 1.0 to damp the bend overshoot that caps max_error near 0.062 m.
      Geometry is the iteration 3 wide-span layout, so the only changes are controller
      values. Evidence: iteration 3 (score 361) finished all oval trials but left
      the line on every bend.


      ### Rationale


      Evidence. Iteration 3 (score 361.4, best so far) finished all 20 oval trials,
      but every s-bend and slalom trial still ended off track with max_error about
      0.062 to 0.063 m. Checking the contract, the off-track limit is max(0.06, 0.0125
      + body_width/4). For body_width 0.18 that is 0.06 m, not the 0.0575 m I assumed
      in iteration 2. So the robot exceeds the limit by only 2 to 3 mm on the bends,
      and body_width cannot help because it is already at its useful ceiling.


      What the iterations show: (a) Iteration 1 to 3 comparison: lowering base_speed
      from 1.3 to 1.1 with the wider sensor span made s-bend progress fall (0.27 to
      0.22) and slalom progress fall (0.18 to 0.10). Speed overshoot is therefore
      not the main cause of bend failure. The robot is too slow to correct, not too
      fast. (b) Iteration 2 widened the sensor span, raised sensor_size to 0.016,
      raised kp to 3.0 and kd to 1.0 together. The oval finish rate fell to 0.55 and
      control_effort rose, so the larger footprint and higher kp are the likely cause.
      The wider span alone was never tested cleanly. (c) Iteration 3 has the widest
      span with sensor_size 0.012 and a clean kp 2.5 / kd 0.8 / ki 0.02 controller,
      which is the cleanest current baseline.


      Changes from iteration 3: (1) base_speed 1.1 to 1.3. Iteration 3 showed that
      the slower speed hurt bend progress, and iteration 1 at 1.3 finished the oval
      in 1.89 s, which leaves margin for the 3 s limit. (2) kd 0.8 to 1.0. Higher
      damping should reduce the swing that carries the robot across the 0.06 m limit
      on the bends. kp stays at 2.5 and sensor_size stays at 0.012, so this is a single-variable
      change on the controller relative to the sensor and speed setup. Geometry, span
      and weights are otherwise unchanged from iteration 3.


      Expected result: s-bend and slalom progress above 0.3, with max_error falling
      toward 0.05 m. Oval should still finish in about 1.9 s. Hypotheses: (a) the
      bend overshoot is damping-limited, so kd 1.0 should cut max_error on the s-bend;
      (b) if steering_oscillation rises above about 0.3 on the oval, kd is too high;
      (c) if slalom progress stays near 0.1 with line_loss_events near 1, the limit
      is line loss at the bend entry, and the next lever is sensor y position or line_loss
      mode. Measurements wanted: per-track completion, progress, max_error, line_loss_events,
      steering_oscillation and completion_time.


      - [Open this output](iteration-4/entity0/versions/952bc0ec894a44d0a8d9cbb10eb481cd/payload.json)

      - Based on: [entityR2A](iteration-4/entityR2A/versions/carried-e8463de867359b86/payload.json)'
  - id: entityR1
    label: 'Isolate span: wider'
    notes: 'Reverts to the iteration 1 gains and 0.012 m sensors (the best raced design,
      356.6), widens the sensor span to ±0.06 m, and cuts base_speed to 1.1. Iteration
      2 confounded span with sensor size and gain, so this tests the span alone. Approved
      as a low-risk, interpretable test that should still finish the oval under 3
      s.


      ### Feedback


      Written before this candidate races, so it states no outcome. The candidate
      is a controlled test against iteration 1 (score 356.6, the best raced so far).
      It keeps the iteration 1 controller (kp 2.5, kd 0.8, ki 0.02) and sensor_size
      0.012, widens the sensor span from ±0.04 to ±0.06 m, and lowers base_speed from
      1.3 to 1.1. Iteration 2 (score 270.4) changed four things at once, so its failure
      could not be attributed. This design isolates the span effect. Two points in
      the rationale need correction. The off-track limit is max(0.06, 0.0125 + 0.18/4)
      = 0.06 m, not 0.0575 m, so the body width gives no extra margin. Also, a 0.03
      m sensor spacing with 0.012 m footprints still leaves a gap of 0.018 m, which
      is smaller than the 0.025 m tape, so a sensor always sees tape. The speed cut
      is the larger risk. Iteration 1 oval finished in 1.89 s at 1.3, so scaling by
      1.3/1.1 predicts about 2.2 s, which is inside the 3 s limit. If the oval mean
      time comes back above 2.5 s, the speed cut has gone too far. Next race: if s-bend
      and slalom still go off track with line_loss_events near 1 and max_error at
      or above 0.06 m, the span is not the limiting factor, so raise kd from 0.8 to
      about 1.0 to damp the swing before changing kp. If the oval finish time is above
      2.5 s, raise base_speed to about 1.2. If the span widening alone brings max_error
      on the bends below 0.05 m, keep the span and tune speed upward toward 1.3 to
      recover oval time.


      ### Requested changes


      - If s-bend or slalom still leave the line with line_loss_events near 1 and
      max_error at or above 0.06 m: raise kd from 0.8 to about 1.0 (keeping kp 2.5,
      ki 0.02) to damp the swing. Iteration 2 showed kd 1.0 kept steering_oscillation
      near 0.27, so the damping is not harmful.

      - If oval completion is above 0.9 but mean completion_time is above 2.5 s: raise
      base_speed from 1.1 to about 1.2 to recover time while keeping the wider span.
      Iteration 1 finished the oval in 1.89 s at 1.3.

      - If bend max_error falls below 0.05 m with progress above 0.5: keep the ±0.06
      m span and return base_speed toward 1.3, since the span rather than the speed
      was limiting the bends.


      - [Open this output](iteration-3/entityR1/versions/a85091fe18d142b5abae3bad15010a80/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/dcc3d4ba9cf84c9bb58b036cb568f330/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-95ea224568b25f90/payload.json)'
