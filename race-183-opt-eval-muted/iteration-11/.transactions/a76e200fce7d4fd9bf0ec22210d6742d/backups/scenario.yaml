overrides:
  entities:
  - id: entity0
    label: Iter 8 design, held
    notes: 'Resubmits the iteration 8 robot unchanged (score 430.6, best raced). Iterations
      9 (kp 3.0) and 10 (span +/-0.08) both scored lower, so no untested change is
      made on the final race.


      ### Rationale


      Evidence: iteration 8 (seven sensors at x = -0.075 to +0.075 m, y = 0.06, size
      0.012, outer weights +/-1.5, kp 2.5, kd 0.8, ki 0.02, base_speed 1.1) is the
      best raced design at 430.6. It finished 20 of 20 oval trials at 1.87 s and got
      the first s-bend finish (progress 0.59, up from 0.22 with five sensors). The
      two follow-up variants both scored lower. Iteration 9 raised kp to 3.0 and cut
      s-bend progress to 0.53 with no finishes. Iteration 10 widened the span to +/-0.08
      m and cut s-bend progress to 0.30, with oval finishes falling to 18 of 20. Both
      changes were measured against the same baseline, so the evidence points to iteration
      8 as the local optimum on the variables tested. Slalom still fails at about
      0.063 m max_error, just above the 0.06 m off-track limit, and body_width is
      already at its maximum.


      Change: none. This is the final iteration, and the only untested options (kd,
      base_speed, sensor y, line_loss mode) either cost oval finishes or were not
      clearly better, so I resubmit the iteration 8 design unchanged. This keeps the
      design with the strongest measured result and avoids an untested change on the
      final race.


      Expected result: about the same as iteration 8 (score near 430), with oval finishing
      reliably at about 1.87 s and the s-bend finishing occasionally. Slalom is expected
      to stay near progress 0.18.


      Hypotheses and measurements wanted: (a) slalom exits come from line loss at
      large error, so line_loss_events should stay near 1 with max_error near 0.063;
      (b) s-bend steering_oscillation is high (0.33), so the next lever is outer weights
      of about 1.2 to reduce jitter; (c) report per-track completion, progress, max_error,
      line_loss_events, steering_oscillation and completion_time.


      - [Open this output](iteration-11/entity0/versions/4db63dee4bbb41bd8b4acd1db264bd30/payload.json)

      - Based on: [entityR2A](iteration-11/entityR2A/versions/carried-bf2d786d4112baee/payload.json)'
  - id: entityR1
    label: Approve iter 8 design
    notes: 'Approved the unchanged iteration 8 design, the best raced design at 430.6,
      because this is the final iteration and an unapproved build is not scored. The
      decision rests on iteration 8''s 20-of-20 oval finishes and its s-bend gain
      over the five-sensor design, with iterations 9 and 10 both lower.


      ### Feedback


      Approved. The candidate is the iteration 8 design, unchanged, which is the best
      raced design (430.6 in iteration 8). Its controller (base_speed 1.1, kp 2.5,
      kd 0.8, ki 0.02, weights [-1.5 to 1.5], last_direction) and seven-sensor geometry
      (x = -0.075 to 0.075 m, y 0.06, size 0.012) match the iteration 8 record. Iteration
      8 gave 20 of 20 oval finishes at 1.87 s and one s-bend finish, with s-bend progress
      up from 0.22 to 0.59 versus the five-sensor design. Iterations 9 and 10 both
      scored lower, so there is no measured reason to change it. Its slalom still
      ends off track at about 0.063 m max_error, so the candidate does not solve slalom,
      but no tested variant has done better. There is no further iteration to use
      a revision, so a re-review would cost action runs with no return. Approve so
      the design races. The off-track limit is 0.06 m, as the rationale states. Any
      result from this race should be read per track against the iteration 8 numbers.


      ### Requested changes


      - No change for this final race: keep kp 2.5, kd 0.8, base_speed 1.1 and the
      seven-sensor span, since iteration 8 is the best measured design.

      - Record per-track completion, progress, max_error, line_loss_events and steering_oscillation
      for the oval, s-bend and slalom, so the next team can see which lever was limiting.

      - Untested levers for any future work: outer sensor_weights about 1.2 to cut
      s-bend steering_oscillation (0.34 in iteration 8), and line_loss set to search_right
      to test slalom line loss.


      - [Open this output](iteration-11/entityR1/versions/7fd8908c65034ffe83da9b83b31da1ee/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/4db63dee4bbb41bd8b4acd1db264bd30/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-bf2d786d4112baee/payload.json)'
