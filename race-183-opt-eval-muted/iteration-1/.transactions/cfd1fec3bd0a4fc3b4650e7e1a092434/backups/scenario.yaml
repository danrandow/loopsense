overrides:
  entities:
  - id: entity0
    label: Softer steer, more
    notes: 'Reduced base_speed to 1.3 and kp to 2.5, raised kd to 0.8, and widened
      the body to 0.18 m, because all development runs went off track with max_error
      about 0.06 m. Sensors moved forward to y = 0.06 to react earlier.


      ### Rationale


      Evidence: every development trial on every track ended off_track (0 finishes).
      Progress was only 0.04 to 0.11, and max_error was about 0.06 m, just above the
      off-track limit of about 0.0525 m (tape half-width 0.0125 plus body_width/4
      = 0.04). The robot leaves the line within the first fraction of each course,
      and the cause is the aggressive control, not sensing: rms_error stayed near
      0.03 m, and steering_oscillation and control_effort were moderate. With kp 4
      and base_speed 1.8, a full-scale signal gives a turn of about 4 and a wheel
      PWM difference of about 2800. That is likely overshooting the bends, and the
      damping (kd 0.3) is too weak to stop the swing.


      Changes: (1) base_speed 1.8 to 1.3, so the robot can corner before it overshoots.
      This trades some speed, but the finish needs about 1.5 m/s average, so I will
      check the time once it completes. (2) kp 4.0 to 2.5, to soften the steering
      response. (3) kd 0.3 to 0.8, to add damping against the overshoot swing. (4)
      ki 0.05 to 0.02, to limit integral windup on the bends. (5) body_width 0.16
      to 0.18, the maximum, which raises the off-track limit to about 0.0575 m and
      gives a larger margin without changing the dynamics. (6) Sensors moved forward
      to y = 0.06, so the line is seen earlier and the steering reacts before the
      wheels reach the bend. Sensor x positions and weights are unchanged, so the
      signal scale still sits in [-1, 1].


      Expected result: the robot should stay on the line for longer on oval and s-bend,
      with progress well above 0.5 and possibly completion on the oval. Slalom may
      still wobble. Hypotheses to check: (a) the off-track exits are caused by overshoot,
      so max_error should fall below 0.04 m; (b) with base_speed 1.3, the finish time
      may be above 3 s, so if the robot completes slowly, base_speed is the next lever;
      (c) steering_oscillation should drop with the higher kd.


      - [Open this output](iteration-1/entity0/versions/c6cfa61373f9401ebc83e7b85bc24c34/payload.json)

      - Based on: [entityR2A](iteration-1/entityR2A/versions/carried-09a3b7a70abb42c4/payload.json)'
  - id: entityR1
    label: 'Baseline review: approve'
    notes: 'The candidate is in range, consistent and not obviously broken, and there
      is no race evidence yet, so I approved it to race for telemetry. The feedback
      corrects the off-track limit to 0.06 m and gives next-step changes keyed to
      the race results.


      ### Feedback


      Iteration 0 has no race telemetry yet, so this critique relies on the contract
      and the candidate''s own contents. I checked the candidate against the limits:
      all values are in range, five sensors and five weights match, and the controller
      is not saturating at kp 4 (a full-scale signal gives a turn of 1400 PWM, leaving
      wheel commands of about 2285 and 5085 before clamping at 4095). base_speed 1.8
      gives base PWM of about 3685, which is close to the 1.5 m/s needed to finish
      in 3 s. Nothing looks obviously broken, so this is a valid baseline to race
      for telemetry. One correction to the rationale: the off-track limit is max(0.06,
      tape_half_width + body_width/4), which is 0.06 m here, not 0.0525 m, so the
      0.16 m body width adds no margin beyond the floor. Next step depends on the
      race. If completion is 0 with the robot leaving the track on the s-bend or slalom,
      reduce base_speed (for example to 1.4) before changing gains. If it completes
      with high steering_oscillation or rms_error, raise kd (to about 0.6) and lower
      kp (to about 3) to damp wobble. If line_loss_events are high, widen sensor coverage
      or try search_right instead of last_direction. If progress stalls well short
      of 1.0 with low speed, raise base_speed toward 2.0 and check whether control_effort
      is excessive.


      ### Requested changes


      - If the race shows off-track exits or high steering_oscillation: lower base_speed
      to about 1.4 and raise kd from 0.3 to about 0.6, keeping kp at 4.0.

      - If the race completes with high rms_error but low oscillation: keep base_speed
      1.8 and raise kp from 4.0 to about 5.0, checking that the turn stays within
      the 4095 PWM limit.

      - If line_loss_events are more than about 2 per run: try line_loss ''search_right''
      or widen the sensor footprint to sensor_size 0.016 before changing the gains.


      - [Open this output](iteration-0/entityR1/versions/8f5ace29cf2b4fa78f282301bc56034e/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/2e611184aca14d4799597668d6632509/payload.json)'
