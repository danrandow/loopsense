overrides:
  entities:
  - id: entity0
    label: Wider sensor span, kp 3
    notes: 'Widens the sensor span to plus or minus 0.06 m, enlarges sensors to 16
      mm, and raises kp to 3.0 and kd to 1.0. Iteration 1 failed off-track on the
      s-bend and slalom with max_error about 0.06 m, which suggests the line slides
      out of sensor coverage on sharp bends.


      ### Rationale


      Evidence: iteration 1 (score 356.6) finished 18 of 20 oval trials at mean time
      1.89 s, so base_speed 1.3 is fast enough. Both failures are off-track exits
      on the s-bend (progress 0.27) and slalom (progress 0.18), with max_error about
      0.062 to 0.063 m against an off-track limit of about 0.0575 m. Iteration 0 showed
      the same near-0.06 m max_error at higher gain, so the limit is probably the
      sensor coverage on sharp bends rather than gain alone. The five sensors span
      only plus or minus 0.04 m. On a sharp bend the tape can slide outside that span,
      and the controller then has little signal before the line is lost.


      Changes: (1) Widen the sensor span to plus or minus 0.06 m (x = -0.06, -0.03,
      0, 0.03, 0.06), keeping the same weights, so the robot sees the line further
      out and keeps a signal through sharper bends. (2) Increase sensor_size from
      0.012 to 0.016 m, the maximum, so each sensor keeps a nonzero reading at larger
      lateral error and line loss is less likely. (3) Raise kp from 2.5 to 3.0 for
      a firmer correction on the bends. (4) Raise kd from 0.8 to 1.0 to damp the larger
      correction. base_speed stays at 1.3, since the oval margin is comfortable. ki
      stays at 0.02 and the line_loss mode stays at last_direction.


      Expected result: s-bend and slalom should stop ending off-track early, with
      progress well above 0.5 on the s-bend. Oval completion should hold, with a finish
      time under 2.5 s. Hypotheses: (a) the wider span is the main fix, so max_error
      on the s-bend and slalom should drop below 0.05 m; (b) line_loss_events should
      fall toward 0 on the s-bend; (c) if steering_oscillation rises above about 0.3,
      kd is too low for the higher kp. Measurements to see next: per-track completion,
      progress, max_error, line_loss_events and steering_oscillation.


      - [Open this output](iteration-2/entity0/versions/c48d85604bba45eb889229bc0cf7bf10/payload.json)

      - Based on: [entityR2A](iteration-2/entityR2A/versions/carried-7653983c2fc17872/payload.json)'
  - id: entityR1
    label: Approve soft-steer build
    notes: 'Approved the candidate for racing because it is valid and directly targets
      the iteration 0 failure, where all 60 trials went off_track with max_error about
      0.06 m. Feedback corrects the off-track margin (the 0.06 m floor still applies)
      and flags that base_speed 1.3 may be too slow to finish in 3 s.


      ### Feedback


      Approving this candidate for the race. Iteration 0 was 0 finishes in 60 trials,
      with every run ending off_track and max_error of about 0.06 m on all three tracks
      (iteration 0 outcome table). That makes overshoot on bends the failure to test,
      so this candidate changes the control aggressiveness rather than the sensing.
      Two corrections to the rationale. First, the off-track limit is max(0.06, tape_half_width
      + body_width/4). With body_width 0.18 the second term is 0.0575 m, so the 0.06
      m floor still applies and the wider body adds no margin. Second, base_speed
      1.3 gives base PWM of about 2660, which is below the roughly 1.5 m/s needed
      to finish in 3 s. Finishing will likely need base_speed back toward 1.5 to 1.6
      once the robot stays on the line. The other changes (kp 2.5, kd 0.8, ki 0.02,
      sensors at y 0.06) are sensible and in range. Next race: if the robot stays
      on track and progress rises well above 0.04, use the telemetry to set speed.
      If it still goes off_track with max_error above 0.06 m, lower kp further. If
      it completes but takes over 3 s, raise base_speed.


      ### Requested changes


      - If the race completes but completion_time is above 3 s: raise base_speed from
      1.3 to about 1.5 to 1.6, keeping kp 2.5 and kd 0.8, since iteration 0 showed
      the off-track failure is caused by aggressive steering rather than sensing.

      - If the race still ends off_track with max_error above 0.06 m (iteration 0
      baseline 0.0608 on oval): lower kp from 2.5 to about 1.8 and keep base_speed
      1.3, because steering overshoot is the suspected cause.

      - If steering_oscillation stays high (iteration 0 baseline 0.07 to 0.16) after
      the robot stays on track: raise kd from 0.8 to about 1.2 before changing kp.


      - [Open this output](iteration-1/entityR1/versions/cfd1fec3bd0a4fc3b4650e7e1a092434/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/c6cfa61373f9401ebc83e7b85bc24c34/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-09a3b7a70abb42c4/payload.json)'
