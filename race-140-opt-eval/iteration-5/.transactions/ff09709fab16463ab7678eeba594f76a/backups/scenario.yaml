overrides:
  entities:
  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence from the last race (iteration 3, ki 0.30, score 140.28, the best so
      far): oval finished 3 of 20 runs (up from 1 of 20), and oscillation stayed below
      the 0.25 warning level (oval 0.228, s-bend 0.231, slalom 0.137). Max error is
      still 0.061 to 0.063 m, just over the 0.06 m off-track floor. Line losses are
      still present (oval 1.7, s-bend 2.0), so the robot still loses the line on bends.
      Body width cannot help, since the off-track limit stays at 0.06 m for every
      allowed width. Speed is not binding, because the oval finish took about 1.85
      s. The Evaluator''s rule for this case applies: oscillation did not rise and
      max_error is still above 0.06, so the integral term is the right lever and should
      be raised again. Change: ki 0.30 to 0.60, with every other value kept (kp 3.0,
      kd 0.30, base_speed 1.5, sensor spread x = ±0.024 m, footprint 0.016 m, antisymmetric
      weights, last_direction). Expected result: max_error falls toward or below 0.06
      on the oval and s-bend, and the oval finish count rises. Risk: the integral
      may overshoot on bends, which would show as oscillation above about 0.25 on
      the s-bend. In that case the next step is kd 0.40 with ki 0.60. Hypotheses:
      H1, the remaining drift is a steady motor-mismatch bias that a larger integral
      term removes. H2, line losses on bends are driven by the error peak, so a lower
      peak should reduce them. Measurements wanted: per-track max_error and where
      it peaks, line-loss timing (bend or straight), steering_oscillation, and completion_time
      on the oval.


      - [Open this output](iteration-4/entity0/versions/b285d40e631b415992e9e875702c7e39/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-0ca5e2a65d3eb8f1/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-0beb00cf8c62f48d/payload.json)'
  - id: entityR1
    label: Approve ki 0.60 step
    notes: 'Approved the single-variable step ki 0.30 to 0.60 on the best raced design
      (score 140.28), since max_error stayed just above 0.06 with steering_oscillation
      under 0.25 in iteration 3. Feedback sets the next step (kd 0.40 or ki 1.0) by
      what the race shows.


      ### Feedback


      Decision: approve. The candidate is the best raced design (entityR2B, iteration
      3, score 140.28: kp 3.0, kd 0.30, ki 0.30, base_speed 1.5, sensor spread x =
      ±0.024 m, footprint 0.016 m) with one change, ki 0.30 to 0.60. The evidence
      supports a single-variable step. Iteration 3 showed that raising ki from 0.05
      to 0.30 improved the score and the oval finish count (1 to 3 of 20), with steering_oscillation
      still below 0.25 (oval 0.228, s-bend 0.231). Max_error stayed at 0.061 to 0.063
      m, just over the 0.06 m off-track floor, which is the case where the integral
      term is the stated lever. The candidate is valid: all values are inside the
      contract, the sensor weights are antisymmetric, and line_loss is last_direction.
      Its rationale correctly leaves kp at 3.0, since iteration 2 showed kp 3.5 lowered
      the score to 99.25. I make no claim about how this candidate will perform. Read
      the next race as follows. If steering_oscillation rises above about 0.25 on
      the s-bend or oval, the integral is overshooting on bends, so set kd to 0.40
      and keep ki 0.60. If max_error falls below 0.06 on some tracks but line_loss_events
      stay at 1 or more, the drift is reduced but bends still lose the line, so consider
      a single-step change in base_speed rather than more ki. If max_error stays above
      0.06 with no oscillation rise, ki 1.0 is the next step inside the contract range.


      ### Requested changes


      - If steering_oscillation rises above about 0.25 on the s-bend or oval after
      ki 0.60, set kd to 0.40 and keep ki at 0.60, since iteration 3 s-bend oscillation
      was already 0.231 at ki 0.30.

      - If max_error stays above 0.06 on the oval or s-bend with no oscillation rise,
      try ki 1.0 with kp 3.0 and kd 0.30, since iteration 3 max_error was 0.061 to
      0.063 and the drift looks like a steady bias.

      - Keep kp at 3.0 and do not raise it: iteration 2 showed kp 3.5 cut the oval
      finish count (1 to 0) and lowered the score from 124.80 to 99.25.


      - [Open this output](iteration-4/entityR1/versions/61cb111f5db34fb8b3c64ad3cb75e1c1/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/b285d40e631b415992e9e875702c7e39/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-0beb00cf8c62f48d/payload.json)'
