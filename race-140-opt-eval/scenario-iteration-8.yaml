map:
  id: race-140-opt-eval
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: kd 0.50, speed back to
    notes: 'Reverts the iteration 7 speed drop (oval finishes fell 19 to 7) to base_speed
      1.5 and tests kd 0.50 alone, following the approved feedback''s rule for finishes
      below 15. Based on the iteration 6 best (372.74) with the wider ±0.032 m spread
      kept.


      ### Rationale


      Iteration 7 tested base_speed 1.3 with kd 0.40, x = ±0.032 m, kp 3.0 and ki
      0.30. Score fell from 372.74 to 269.51. Oval finishes dropped from 19 to 7 of
      20, and oval progress fell from 0.997 to 0.920. Progress did rise on the s-bend
      (0.32 to 0.42) and slalom (0.16 to 0.17), but both still went off track in every
      run. Steering oscillation on the oval rose to 0.352. The approved feedback set
      an explicit rule: if oval finishes drop below 15 of 20, or s-bend and slalom
      progress fall, return base_speed to 1.5 and test kd 0.50 with kp 3.0, ki 0.30
      and x = ±0.032 m. Oval finishes fell to 7, which triggers that rule. Slower
      speed is therefore not the lever to keep. I am reverting base_speed to 1.5 and
      making one change from the best raced design (iteration 6): kd 0.40 to 0.50.
      Expected result: oval finishes hold at or above 19 of 20, and oval oscillation
      may fall because the extra damping works in the direction that raised finishes
      from 7 to 19 (kd 0.30 to 0.40). The s-bend and slalom remain the main losses.
      Risk: kd 0.50 may over-damp the tightest bends and lower s-bend and slalom progress.
      Hypotheses: H1, damping is the productive lever at this spread, so kd 0.50 lifts
      oval finishes further or holds them. H2, the s-bend and slalom failures come
      from corner-entry drift, which a further damping step may partly address. Measurements
      wanted: per-track finish count, progress, oscillation, line-loss timing (bend
      or straight), max_error location, and oval completion_time.


      - [Open this output](iteration-8/entity0/versions/423fffd315944407b00a5581f3be75fd/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-99f91ff829384e26/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-cb354439d0193a2c/payload.json)'
  - id: entityR1
    label: Approve kd 0.50 test
    notes: 'Approves kd 0.40 to 0.50 on the best raced design (iteration 6, score
      372.74), with base_speed restored to 1.5 after iteration 7 showed 1.3 cut oval
      finishes from 19 to 7. The step is single-variable and the next race decides
      whether to keep kd 0.50 or revert to 0.40.


      ### Feedback


      Decision: approve. The candidate is the best raced design (iteration 6, score
      372.74: kd 0.40, kp 3.0, ki 0.30, base_speed 1.5, sensor x = ±0.032 m, footprint
      0.016 m) with one change, kd 0.40 to 0.50. The evidence is iteration 5 to 6,
      where kd 0.30 to 0.40 raised oval finishes from 7 to 19 of 20 and cut oval line-loss
      events from 1.2 to 0.25. Iteration 7 showed that base_speed 1.3 cut oval finishes
      from 19 to 7 of 20 and scored 269.51, while raising s-bend progress only from
      0.32 to 0.42 with no s-bend finishes. So speed reduction is rejected, and the
      candidate restores base_speed 1.5. The candidate is valid: all values are inside
      the contract, the weights are antisymmetric, and line_loss is last_direction.
      I make no claim about how it will perform. Kd 0.50 is untested and may over-damp
      the tightest bends. Read the race as follows. If oval finishes stay at 19 or
      more and s-bend or slalom progress holds or rises above 0.32 and 0.16, keep
      kd 0.50 as the new best. If oval finishes fall below 15 or s-bend and slalom
      progress fall, revert to kd 0.40, which is the best raced design, and do not
      spend further iterations on kd. In that case the next lever is kp 3.25 at x
      = ±0.032 m, because kp 3.5 was only tested at the narrower ±0.024 m spread (iteration
      2, score 99.25). Keep ki 0.30 and base_speed 1.5 in either case.


      ### Requested changes


      - Keep base_speed at 1.5 and ki at 0.30. Iteration 7 showed base_speed 1.3 cut
      oval finishes from 19 to 7 of 20 (score 269.51), so speed reduction is not the
      lever.

      - If oval finishes stay at 19 or more and s-bend or slalom progress holds or
      rises above 0.32 and 0.16 at kd 0.50, keep kd 0.50 as the new best. If oval
      finishes fall below 15 or s-bend and slalom progress fall, return kd to 0.40
      (iteration 6 best).

      - If kd 0.40 is restored, test kp 3.25 at x = ±0.032 m with kd 0.40, since the
      earlier kp 3.5 result (iteration 2, score 99.25) came from the narrower ±0.024
      m spread and the s-bend and slalom still go off track in every run.


      - [Open this output](iteration-8/entityR1/versions/324ef89aa31e41539c2dc28c712740b2/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/423fffd315944407b00a5581f3be75fd/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-cb354439d0193a2c/payload.json)'
