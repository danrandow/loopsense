map:
  id: race-140-opt-eval
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: kp 3.25 at kd 0.40
    notes: 'Reverts kd to the best raced value (0.40, score 372.74) after kd 0.50
      scored 352.73 with oval finishes down to 18 and s-bend progress down. Tests
      kp 3.25 alone at x = ±0.032 m to target s-bend and slalom progress, with kp
      3.0 kd 0.40 as the fallback.


      ### Rationale


      Evidence from iteration 8 (kd 0.50, score 352.73, below the best raced design
      at 372.74 with kd 0.40): oval finishes fell from 19 to 18 of 20, oval line-loss
      events rose from 0.25 to 0.25 (unchanged), and s-bend progress fell from 0.319
      to 0.226. Slalom progress rose slightly from 0.158 to 0.169, and oval steering
      oscillation was 0.279. The Evaluator''s conditions for keeping kd 0.50 were
      oval finishes of 19 or more with s-bend and slalom progress holding or rising
      above 0.32 and 0.16. Oval finishes are 18 and s-bend progress fell, so the condition
      is not met. The fall-back rule for kd 0.40 is only partly triggered: oval finishes
      did not drop below 15, and slalom rose while s-bend fell. I therefore revert
      to kd 0.40, the best raced design, which gives 19 of 20 oval finishes and the
      highest score. Speed reduction (base_speed 1.3) is already rejected and stays
      at 1.5. Change: kp 3.0 to 3.25, a single variable from the best design, at the
      wider spread x = ±0.032 m, as the Evaluator''s stated next lever. Expected result:
      s-bend and slalom progress rise from proportional steering that pulls the robot
      back before it reaches the line-loss threshold on the bends, while oval finishes
      hold near 19. Risk: kp 3.5 lowered the score at the narrower spread (iteration
      2), so kp 3.25 could cost oval finishes. If oval finishes fall below 17 or the
      score falls below 372.74, the fallback is the already-raced kd 0.40 with kp
      3.0, which I would then resubmit. Hypotheses: H1, the s-bend and slalom failures
      are proportional-lag failures on bends, which a modest kp increase reduces.
      H2, oval steering oscillation stays near 0.28 with kd 0.40. Measurements wanted:
      per-track finish count and progress, s-bend and slalom max_error location (bend
      entry or exit), line-loss timing, steering_oscillation, and oval completion_time.


      - [Open this output](iteration-9/entity0/versions/1cbfc6b779734513a2ae9c9fcbe0bcee/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-ea2df066062048d5/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-850dc006c2b8971b/payload.json)'
  - id: entityR1
    label: Evaluator Feedback
    notes: 'Evaluator Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Decision: approve. The candidate is the best raced design (iteration 6, score
      372.74: kd 0.40, kp 3.0, ki 0.30, base_speed 1.5, sensor x = ±0.032 m, footprint
      0.016 m) with one change, kp 3.0 to 3.25. That is a single-variable step, and
      the candidate correctly rejects the kd 0.50 result (iteration 8, score 352.73,
      oval finishes 18 of 20, s-bend progress down from 0.319 to 0.226). It also correctly
      keeps base_speed 1.5, since speed 1.3 cut oval finishes from 19 to 7 (iteration
      7). The evidence against kp is iteration 2 (kp 3.5, score 99.25), but that run
      used the narrower ±0.024 m spread, where line losses were already high. At ±0.032
      m the sensors give earlier warning, so a modest kp increase is a reasonable
      test. The candidate is valid: all values are inside the contract, the weights
      are antisymmetric, and line_loss is last_direction. I make no claim about how
      it will perform. Two iterations remain, so racing now gives the telemetry that
      matters most. Read the race as follows. If oval finishes stay at 17 or more
      and the score holds at or above 372.74, keep kp 3.25 as the new best. If oval
      finishes fall below 17, or the score falls below 372.74, revert to kp 3.0 with
      kd 0.40, which is the best raced design. In either case, the next lever is the
      outer sensor spread, since widening from ±0.024 to ±0.032 m was the largest
      single gain (oval finishes 3 to 7, s-bend line losses 2.0 to 1.05, iterations
      3 to 5). Keep kd 0.40 and ki 0.30 unless the race shows a clear reason to change
      them.


      ### Requested changes


      - Keep kp 3.25 only if oval finishes stay at 17 or more of 20 and the score
      holds at or above 372.74 (iteration 6). Otherwise revert kp to 3.0, since kp
      3.5 at the narrower spread (iteration 2, score 99.25) showed higher oval line-loss
      events.

      - Keep kd 0.40, ki 0.30 and base_speed 1.5 in this step. kd 0.50 lowered the
      score (iteration 8, 352.73, oval finishes 19 to 18), and base_speed 1.3 cut
      oval finishes from 19 to 7 (iteration 7).

      - If the score holds, the next single-variable test is the outer sensors at
      x = ±0.040 m with the best kp and kd, since widening from ±0.024 to ±0.032 m
      cut oval line losses from 1.7 to 1.2 and raised finishes from 3 to 7 (iterations
      3 to 5). Only test this if the race leaves at least two runs.


      - [Open this output](iteration-9/entityR1/versions/5c3faad72b1043c5b338d5bf14bb41fa/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/1cbfc6b779734513a2ae9c9fcbe0bcee/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-850dc006c2b8971b/payload.json)'
