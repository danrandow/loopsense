  id: race-140-opt-eval
  schema: v0.2
  scenario: Iteration 1
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 0.
dimensions:
  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Wider sensors, more kd
    notes: 'Widened the sensor spread to ±0.024 m with 0.016 m footprints, raised
      kd to 0.3 and lowered base_speed to 1.5. The baseline (entityR2A) went off track
      on all 60 trials with max_error about 0.063 and 1 to 2 line-loss events per
      run, which points to weak line coverage and under-damped drift.


      ### Rationale


      Evidence from the baseline (entityR2A): all 60 trials went off track on all
      three tracks, with no finishes. Progress was only 0.12 to 0.16, max_error was
      about 0.063 (just past the 0.06 m off-track limit), and steering_oscillation
      was low (0.11 to 0.16). The failure is therefore a steady drift away from the
      line, not jitter. Line-loss events of 1 to 2 per run show the robot loses all
      sensors once its error passes roughly 0.035 m. The narrow sensor spread (±0.016
      m, 0.012 m footprints) gives little warning and little steering authority before
      the line is lost. Changes: (1) Widen the sensor spread to x = -0.024, -0.012,
      0, 0.012, 0.024 m and enlarge the footprint to 0.016 m, so the line stays visible
      at larger offsets and the signal responds earlier. (2) Raise kd from 0.15 to
      0.3 to damp the drift-and-correct overshoot on the bends, since oscillation
      is low but the error is growing. (3) Lower base_speed from 1.6 to 1.5 to give
      the wider sensors and the damping time to act. This is the minimum speed that
      could plausibly still finish in 3 s. Keep kp 3.0, ki 0.05, weights antisymmetric,
      and line_loss last_direction. Expected result: fewer or no line-loss events,
      max_error below 0.06, and at least some completions on the oval and s-bend.
      The slalom may still be marginal. Hypotheses: H1, the drift is caused by weak
      sensor coverage at large offsets, so widening it cuts line-loss events. H2,
      the drift is partly due to too little damping, so kd 0.3 reduces max_error.
      H3, the speed is near the limit, so 1.5 keeps the robot on track. Next measurements
      wanted: completion and progress per track, max_error and where it peaks (bend
      type), line_loss_events and their timing, and completion_time to judge whether
      speed can be raised again.


      - [Open this output](iteration-1/entity0/versions/2db669cc4f9a4b4aac3d7960757a3e56/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-5ff30181119e3f9b/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-13cf5bf3a72f3041/payload.json)'
  - id: entityR1
    label: Approve wider sensors
    notes: 'Approved the iteration 1 candidate: wider sensor spread (±0.024 m), 0.016
      m footprint, kd 0.3 and base_speed 1.5. It addresses the baseline''s line-loss
      drift (all 60 baseline runs went off track with 1 to 2 line-loss events). The
      race is needed to judge it; no outcome is claimed for it here.


      ### Feedback


      The baseline (entityR2B, iteration 0, score 57.10) finished 0 of 60 trials on
      all three tracks. Every run ended off track after 1 to 2 line-loss events, with
      max_error of about 0.063 to 0.065 m against the 0.06 m limit, and progress of
      only 0.12 to 0.16. Steering oscillation was low (0.11 to 0.16), so the failure
      is a steady drift away from the line rather than jitter. The candidate responds
      to this with three changes: wider sensor spread (x = ±0.024 m), a larger footprint
      (0.016 m), and kd raised from 0.15 to 0.30. Its base_speed falls from 1.6 to
      1.5. Those changes fit the evidence and the candidate is valid: the weights
      are antisymmetric, the sensor positions are inside the allowed range, and line_loss
      is last_direction. I have no measured result for it yet. The main risk is that
      1.5 is the minimum speed that can still finish in 3 s, so a completion may depend
      on the speed/time trade-off. This is early exploration with ten iterations left,
      and the candidate is a clear improvement in the direction the data points, so
      it should race now. After the race, check first whether line_loss_events fell
      from 1 to 2 per run. If max_error is still above 0.06 but line losses are down,
      raise kp in small steps (3.0 to 3.5) before touching speed. If the run finishes
      but completion_time is close to 3.0 s, raise base_speed in steps of 0.1 to 0.2.
      If oscillation rises after kd 0.3, go back toward kd 0.2.


      ### Requested changes


      - If line_loss_events are still 1 or more and max_error stays above 0.06, try
      kp 3.5 with kd 0.3, keeping the widened sensor spread, to cut the drift on bends.

      - If the run completes but completion_time is near 3.0 s, raise base_speed in
      steps of 0.1 to 0.2 (1.5 to 1.7), keeping kd 0.3 so the faster robot stays damped.

      - If steering_oscillation rises well above the baseline 0.11 to 0.16 after kd
      0.3, reduce kd to 0.2 before changing kp.


      - [Open this output](iteration-1/entityR1/versions/868f84e527504132b490dc1d2eb76965/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/2db669cc4f9a4b4aac3d7960757a3e56/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-13cf5bf3a72f3041/payload.json)'
