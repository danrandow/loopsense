map:
  id: race-112-opt-eval
  schema: v0.2
  scenario: Iteration 1
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 0.
dimensions:
  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Stiffer, slower, damped
    notes: 'Iteration 0 went off track on every trial (progress about 0.1 to 0.14,
      max_error at the 0.06 m limit), so this lowers base_speed to 1.4, raises kp
      to 3.5 and kd to 0.3, adds a small ki of 0.1 for motor bias, and widens the
      sensors to 16 mm. The aim is to stay on the line; the evidence is the 60-trial
      aggregate from the development simulator.


      ### Rationale


      Evidence: every iteration-0 trial went off track on all three development tracks
      (60/60, 0 finishes). Progress stalled at 0.10 to 0.14, and max_error reached
      0.062 to 0.064, just past the 0.06 m off-track limit. Line-loss events were
      1.0 in every trial, so the robot lost the tape early and never recovered. RMS
      error was only 0.026 to 0.030, and steering oscillation was low (0.08 to 0.14).
      That pattern points to a stiffness and speed problem rather than jitter. The
      robot drifts out to the limit under the 1.6 base speed and the kp of 2.5. The
      motor mismatch (about 2 percent) also adds a steady bias that kp alone does
      not remove. Changes: (1) base_speed 1.6 to 1.4, so the robot can hold the line
      through bends and the sensors can keep up. (2) kp 2.5 to 3.5, for a firmer correction
      at the edge of the tape. (3) kd 0.15 to 0.3, to damp the larger kp and avoid
      oscillation. (4) ki 0.0 to 0.1, a small integral term to cancel the steady motor-mismatch
      bias, kept small so it does not wind up. (5) sensor_size 0.012 to 0.016, so
      the sensors see a smoother, wider signal near the line edge, and line loss is
      less likely. The sensor geometry and sensor_weights are otherwise unchanged.
      Expected: fewer off-track ends, max_error below 0.05, and at least some finishes
      on the oval and s-bend. Completion time may be near 3 s, so base_speed is the
      next lever if the run is clean. Hypotheses to check next race: (a) line_loss_events
      drops to 0 or near 0; (b) steering_oscillation stays under about 0.15 with kd
      0.3; (c) completion_time falls under 3 s at base_speed 1.4. If the robot still
      leaves the line, the next step is to move the sensors closer to the axle or
      reduce base_speed to 1.2.


      - [Open this output](iteration-1/entity0/versions/e482541df524409bb7d483a126c9b7bc/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-c65b0caf7ddb9b78/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-66b755c71d52ccbc/payload.json)'
  - id: entityR1
    label: Approve gain-and-speed
    notes: 'Approved the candidate because the iteration-0 baseline had zero finishes,
      with line loss in every trial and max_error just past 0.06 m, so it needs race
      telemetry now. The candidate lowers base_speed, raises kp and kd, adds a small
      ki, and widens sensor_size to address that drift; next-race steps are set out
      for the case where it still leaves the line.


      ### Feedback


      Iteration 0 is the only raced evidence. All 60 trials went off track on oval,
      s-bend and slalom (0 finishes). Progress stalled at 0.10 to 0.14, max_error
      reached 0.062 to 0.064 (just past the 0.06 m limit), and line_loss_events was
      1.0 in every trial. RMS error was low (0.026 to 0.030) and steering_oscillation
      was low (0.08 to 0.14). That pattern points to the robot being too loose and
      too fast to hold the tape through bends, not to jitter. The candidate responds
      to that: base_speed 1.6 to 1.4, kp 2.5 to 3.5, kd 0.15 to 0.3, a small ki of
      0.1 to remove the roughly 2 percent motor-mismatch bias, and sensor_size 0.012
      to 0.016. The candidate is valid: all sensor positions are in range, sensor_size
      0.016 is an allowed option, and the weights and line_loss are allowed. Nothing
      is obviously broken. Its weak points are that it changes five things at once,
      so the next race will not show which change mattered, and that the sensor footprints
      at 0.016 m with 0.02 m spacing now overlap. I cannot say how it will perform,
      only that it addresses the observed failure. Approve it now: this is early exploration,
      the baseline has zero finishes, and the race telemetry is needed more than another
      round of reading numbers. Next race, read the results as follows. If line_loss_events
      is still 1.0 or max_error is still above 0.06, the robot is still leaving the
      line. Then cut base_speed to 1.2 and keep kp at 3.5, since the speed is the
      likeliest cause. If line_loss_events is 0 or near 0 and steering_oscillation
      stays under about 0.15, but completion_time is above 3 s, raise base_speed in
      steps of 0.1 (for example 1.5) and keep kd at 0.3. If the robot oscillates (steering_oscillation
      above 0.2), lower kp to about 3.0 before changing anything else.


      ### Requested changes


      - If the next race still shows line_loss_events of 1.0 or more and max_error
      above 0.06 on the oval or slalom, lower base_speed from 1.4 to 1.2 and keep
      kp at 3.5, kd at 0.3 and ki at 0.1 (iteration 0 lost the line at base_speed
      1.6 with kp 2.5).

      - If the run is clean (line_loss_events near 0, steering_oscillation under 0.15)
      but completion_time is above 3 s, raise base_speed in steps of 0.1 toward 1.5
      and keep kd at 0.3 (completion_time was not reached in iteration 0, so this
      is a hypothesis to test).

      - If steering_oscillation rises above 0.2 with kp 3.5, lower kp to 3.0 and keep
      kd at 0.3, since kd 0.15 at iteration 0 left oscillation at 0.08 to 0.14 and
      kd has not yet been tested at 0.3.


      - [Open this output](iteration-1/entityR1/versions/cb93d4055fcb446e9ace494601ab0037/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/e482541df524409bb7d483a126c9b7bc/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-66b755c71d52ccbc/payload.json)'
