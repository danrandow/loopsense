map:
  id: race-112-opt-eval
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Wider sensor span, kd
    notes: 'Widened the sensor span to ±0.07 m so the outer sensors keep the tape
      in view past the 0.06 m off-track limit, where iteration 2 lost the line every
      trial. Raised kd to 0.45 to damp steering oscillation, which was 0.30 on the
      oval; base speed and kp are held at 1.2 and 3.0.


      ### Rationale


      Evidence from iteration 2 (base_speed 1.2, kp 3.0, kd 0.3, ki 0.1, sensor_size
      0.016): still 0 finishes in 60 trials. line_loss_events stayed at 1.0 (1.05
      on the oval) and max_error stayed at 0.062 to 0.064, just past the 0.06 m off-track
      limit. Lowering base_speed did not remove line loss, so speed is not the main
      cause. Geometry is the likely cause. With sensors at x = -0.04 to +0.04 and
      a 0.016 m footprint, the outermost sensor stops seeing the 25 mm tape once the
      robot''s centre is about 0.04 + 0.0125 + 0.008 = 0.0605 m off the line. That
      is the same as the off-track limit, so the robot reads zero signal at the moment
      it fails. Widening the span to ±0.07 m should keep some sensor on the tape out
      to roughly 0.08 m, so line loss should only occur after the robot has already
      left, or not at all. Oscillation also rose to 0.30 on the oval (from 0.24 at
      kp 3.5) and 0.28 on the s-bend, above the 0.2 level. The Evaluator''s listed
      next step is to raise kd toward 0.45 when oscillation stays above 0.2 at kp
      3.0. Changes: (1) sensor x positions widened to -0.07, -0.035, 0, 0.035, 0.07
      (spacing 0.035 m, footprint 0.016 m, so adjacent footprints still overlap the
      tape); (2) kd 0.3 to 0.45 to damp the jitter. base_speed 1.2, kp 3.0, ki 0.1,
      sensor_weights, sensor_size, body, wheel and mass are unchanged. I accept that
      two changes in one race confound the result. I chose this because the iteration
      budget is limited, and the two symptoms are separate: line loss relates to span
      and oscillation relates to damping. Expected result: line_loss_events falls
      well below 1.0, max_error falls below 0.06 on the oval and s-bend, steering_oscillation
      falls below 0.2, and progress rises above 0.6 on the oval. Completion within
      3 s is still unlikely at 1.2. Hypotheses to test: (a) line_loss_events drops
      toward 0 with the wider span; (b) kd 0.45 brings steering_oscillation under
      0.2; (c) with the robot kept on the line, the next lever is base_speed 1.3 then
      1.4 to reach completion_time under 3 s. If line_loss_events is still 1.0 with
      the wider span, the cause is probably not sensor span, and the next test should
      be sensor y position or sensor_size 0.012.


      - [Open this output](iteration-3/entity0/versions/9f8b92eb7f4248428e770b0a346bbaba/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-3a3cb9c069456d29/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-97bb8a018aed4a20/payload.json)'
  - id: entityR1
    label: 'Approve: wider sensor'
    notes: 'Approves the candidate that widens the sensor span to ±0.07 m and raises
      kd to 0.45, aimed at the persistent line loss and max_error near 0.06 m seen
      in iterations 0 to 2. The candidate is valid and this is early exploration,
      so racing it gives the telemetry needed for the next critique.


      ### Feedback


      Approve for this race. The candidate tests one hypothesis from iteration 2 (the
      0.08 m sensor span is the cause of line loss) and one damping change (kd 0.3
      to 0.45). The evidence supports the geometry hypothesis. In iteration 2 line_loss_events
      stayed at 1.0 to 1.05 in all 60 trials, and max_error sat at 0.062 to 0.064
      across iterations 0 to 2. That is just past the 0.06 m off-track limit, and
      it matches the point where the outermost sensor reads no tape. Iteration 2 also
      showed steering_oscillation of 0.30 on the oval and 0.28 on the s-bend at kp
      3.0, kd 0.3, so raising kd is a reasonable response. The candidate is valid:
      all sensor x values sit within ±0.08 m, sensor_size 0.016 is allowed, and the
      weights, line_loss and observation list are all allowed. Nothing is obviously
      broken. The weak point is that two changes race together, so the result will
      not isolate which one helped. That is a cost I accept, because the iteration
      budget is limited and the two symptoms are separate. Completion within 3 s is
      unlikely at base_speed 1.2, so progress and line-loss telemetry are the useful
      outputs. This is early exploration with 8 iterations left, so racing now is
      worth more than another reading-only round. I cannot say how it will perform.
      Next race, read the results as follows. If line_loss_events is still about 1.0
      with the wider span, sensor span is probably not the cause. Test sensor y position
      (move the row closer to or further from the axle) or sensor_size 0.012 next.
      If line_loss_events falls well below 1.0 but steering_oscillation is still above
      0.2 at kd 0.45, lower kp toward 2.6 before changing speed. If the run is clean
      (line_loss_events near 0, steering_oscillation under 0.2, max_error under 0.06),
      raise base_speed in 0.1 steps to 1.3, then 1.4, to test completion_time under
      3 s.


      ### Requested changes


      - If line_loss_events stays near 1.0 with the ±0.07 m span, keep base_speed
      1.2 and test sensor y position or sensor_size 0.012 (iteration 2 showed line
      loss at 1.0 across all tracks at span ±0.04, so span alone may not be the cause).

      - If line_loss_events drops but steering_oscillation stays above 0.2 with kd
      0.45, lower kp from 3.0 toward 2.6 and keep kd at 0.45 (iteration 2 at kp 3.0,
      kd 0.3 gave oscillation of 0.30 on the oval and 0.28 on the s-bend).

      - If the run is clean (line_loss_events near 0, steering_oscillation under 0.2,
      max_error under 0.06), raise base_speed in 0.1 steps to 1.3, then 1.4, keeping
      kp and kd fixed, to test completion_time under 3 s (iteration 1 reached progress
      0.37 on the oval at base_speed 1.4, so the speed limit is not yet known).


      - [Open this output](iteration-3/entityR1/versions/fcf9625643994f9abb64d25a837f05ff/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/9f8b92eb7f4248428e770b0a346bbaba/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-97bb8a018aed4a20/payload.json)'
