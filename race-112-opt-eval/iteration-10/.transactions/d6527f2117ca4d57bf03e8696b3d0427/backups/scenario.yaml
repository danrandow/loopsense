map:
  id: race-112-opt-eval
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: kd 0.5 at speed 1.2
    notes: 'Restores base_speed 1.2 from the iteration 9 test, since the s-bend stayed
      off track at 1.1 with max_error 0.0626, so speed is not the limit. Tests kd
      0.5 at y 0.065 with everything else from the iteration 8 best (score 431.1)
      held fixed.


      ### Rationale


      Evidence from iteration 9 (base_speed 1.1, y 0.065, kd 0.6, kp 2.6, score 425.1
      against 431.1 at 1.2). Oval finished 20/20 again, with mean score 951 (up from
      944) and line_loss_events down to 0.15 (from 0.65). The s-bend still ended 20/20
      off track, with max_error 0.0626 (at or above the 0.06 limit) and progress 0.57
      (down from 0.63). Slalom still ended 20/20 off track with max_error 0.0655 and
      1.0 line-loss events. Lowering speed therefore did not clear the s-bend, so
      speed is not the limiting factor. The approved feedback''s rule applies: return
      base_speed to 1.2 and test kd 0.5 at y 0.065. Changes: (1) base_speed 1.1 to
      1.2, which restores the iteration 8 speed. (2) kd 0.6 to 0.5. Less derivative
      damping may reduce the lag-driven overshoot on the s-bend, and slalom oscillation
      was 0.22 at kd 0.6, so a slightly softer derivative term may also help there.
      Everything else is held at iteration 8: x -0.07 to 0.07, y 0.065, sensor_size
      0.016, kp 2.6, ki 0.1, line_loss last_direction, sensor_weights -2,-1,0,1,2,
      and the body, wheel and mass values. I am keeping y 0.065 despite the line-loss
      rise, since the approved feedback accepts that cost while the oval is at 20/20.
      Expected result: the oval stays at 20/20 with mean near 944, and s-bend max_error
      falls toward or below 0.06, with some s-bend finishes possible. Risk: kd 0.5
      may raise oscillation on the oval and slalom, since iteration 4 at kd 0.45 showed
      weaker damping than iteration 5 at kd 0.6. Hypotheses to check: (a) s-bend max_error
      below 0.06 and s-bend finishes appear; (b) oval finishes stay at 17/20 or better;
      (c) slalom steering_oscillation stays near 0.22 or lower. If kd 0.5 worsens
      the oval or slalom without an s-bend gain, return kd to 0.6 and test base_speed
      1.15 at y 0.065, or return y to 0.05 if line-loss events on the oval stay above
      about 0.3.


      - [Open this output](iteration-10/entity0/versions/7d258a28427c4a6d9cae24370d1594f8/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-85adeb6883ec6d80/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-52fc3409ad5ff728/payload.json)'
  - id: entityR1
    label: 'Approve: speed 1.1 test'
    notes: 'Approves the iteration 8 best design with base_speed lowered from 1.2
      to 1.1, a single-variable test. It rests on iteration 8, where the oval was
      20/20 finishes and s-bend max_error was 0.0622, just past the 0.06 limit. Next-race
      rules cover the s-bend, oval finishes and the line-loss rule I set earlier.


      ### Feedback


      Approve. The candidate is the iteration 8 design (score 431.1, best raced so
      far) with base_speed changed from 1.2 to 1.1. Everything else is held fixed:
      y 0.065 m, x -0.07 to 0.07, sensor_size 0.016, kp 2.6, kd 0.6, ki 0.1, line_loss
      last_direction, and the body, wheel and mass values. The change is valid, since
      base_speed is inside 0.05 to 2, and it is a single-variable step from the best
      design.


      The evidence supports testing speed. In iteration 8 the oval was 20/20 finishes
      at mean 944, so the oval is near its ceiling. The remaining points are the s-bend
      and slalom, which both ended 20/20 off track. S-bend max_error was 0.0622 against
      the 0.06 limit, with progress 0.63. Slalom max_error was 0.0654. Lowering base_speed
      reduces lag on bends, which is the most direct lever for those overshoots. Iteration
      5 to 8 also showed that the geometry and damping levers have been mostly explored,
      so speed is the next untested variable.


      One caveat to note. My own iteration 8 feedback said to return y to 0.05 if
      line_loss_events rose above about 0.3. At y 0.065 the oval rose to 0.65 and
      slalom sits at 1.0. I approved that design anyway because its score was the
      best raced, and the line-loss term is worth only about 10 points on the oval
      at this level. This candidate keeps y 0.065 so that the speed effect is isolated.
      The next race decides whether that stance holds.


      Read the next race as follows. If the s-bend stays off track with max_error
      at or above 0.06 at 1.1, speed is not the limiting factor. Then return base_speed
      to 1.2 and test kd 0.5 at y 0.065. If the s-bend gets clean or gains finishes
      and oval finishes stay at 17/20 or better, keep 1.1 and consider a further small
      step only if there are iterations left to use it. If line_loss_events on the
      oval or slalom stays above about 0.3 with no s-bend gain, return y to 0.05 before
      any other change. This is a mid-run decision and not a claim about how the candidate
      will perform.


      ### Requested changes


      - If the s-bend is still off track at base_speed 1.1 with max_error at or above
      0.06 (iteration 8 was 0.0622 at 1.2), return base_speed to 1.2 and test kd 0.5
      at y 0.065, since speed is then not the limiting factor.

      - If s-bend finishes appear and oval finishes hold at 17/20 or better at 1.1,
      keep base_speed 1.1 with kp 2.6 and kd 0.6 fixed. Oval completion time will
      rise a little, so judge the net change against the iteration 8 score of 431.1.

      - If line_loss_events stays above about 0.3 on the oval or slalom at y 0.065
      with no s-bend gain (iteration 8 gave 0.65 on the oval and 1.0 on the slalom),
      return sensor y to 0.05 (the iteration 5 geometry, score 403.4) with base_speed
      1.1, as the iteration 8 feedback set.


      - [Open this output](iteration-9/entityR1/versions/dbdedb5bedde45779e503c6c82b08760/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/fda87f1804a44b2db8442a24946b21a0/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-28433c8d239d6f59/payload.json)'
