map:
  id: race-112-opt-eval
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Slower, softer kp 3.0
    notes: 'Cuts base_speed to 1.2 and kp to 3.0 to address the persistent line loss
      (1.0 per trial, max_error about 0.062) and the oscillation above 0.2 seen in
      iteration 1. The rationale gives falsifiable predictions for line-loss, oscillation,
      and max_error next race.


      ### Rationale


      Evidence from iteration 1: still 0 finishes in 60 trials. Progress rose on the
      oval (0.37 mean, up from 0.12) and s-bend (0.25, up from 0.14), but line_loss_events
      remained 1.0 in every trial and max_error stayed at 0.062 to 0.064, just past
      the 0.06 m limit. Steering oscillation rose to 0.24 on the oval and 0.21 on
      the s-bend, above the 0.2 level the Evaluator flagged. The Evaluator''s rule
      for oscillation is to lower kp to about 3.0 first. Its rule for persistent line
      loss with max_error above 0.06 is to lower base_speed to 1.2 and keep kp at
      3.5. I applied both in one step, because the two symptoms appeared together
      and the team needs a clean-to-off-track answer within the remaining iterations.
      Changes: (1) base_speed 1.4 to 1.2, to give the robot more time to correct on
      the bends and reduce the line loss. (2) kp 3.5 to 3.0, to cut the oscillation
      seen on the oval and s-bend. kd stays at 0.3 and ki at 0.1, both as in iteration
      1. Geometry and sensor_weights are unchanged. I kept sensor_size at 0.016 so
      that the only changes are the controller''s speed and gain. Expected result:
      fewer line-loss events and lower steering_oscillation (below 0.2 on all tracks).
      Completion within 3 s is unlikely at 1.2, so progress is the main score lever
      for now. Hypotheses to test: (a) line_loss_events falls toward 0 at base_speed
      1.2; (b) steering_oscillation drops below 0.2 at kp 3.0; (c) max_error falls
      below 0.06 on the oval. Falsification: if line loss stays at 1.0 at base_speed
      1.2, the cause is probably geometry (the 5-sensor span is 0.08 m, so the robot
      leaves the sensed area at about 0.06 m offset, the same as the off-track limit)
      and sensor placement or spacing should change next. If the robot is clean but
      completion_time is above 3 s, raise base_speed in steps of 0.1 while keeping
      kp near 3.0.


      - [Open this output](iteration-2/entity0/versions/06ad36b458d14a59a0ea82d6c9d02171/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-4ed6d9ffed1a52c0/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-36b2a4697024ece1/payload.json)'
  - id: entityR1
    label: 'Approve: slower, softer'
    notes: 'Approved the iteration 2 candidate, which lowers base_speed to 1.2 and
      kp to 3.0 to address the line loss at 1.0 and max_error above 0.06 in iteration
      1 (score 97.73). Its outcome is unknown until it races. The feedback sets out
      what to change if line loss persists or completion time is too slow.


      ### Feedback


      The candidate is a single, bounded step from the iteration 1 design (score 97.7331,
      the best raced so far). It lowers base_speed from 1.4 to 1.2, lowers kp from
      3.5 to 3.0, and keeps kd 0.3, ki 0.1, sensor_size 0.016 and the geometry unchanged.
      The change follows the rules in the iteration 1 feedback. Iteration 1 showed
      line_loss_events of 1.0 in all 60 trials and max_error of 0.062 to 0.064, just
      past the 0.06 m limit, so the base_speed cut is the right first lever. It also
      showed steering_oscillation of 0.24 on the oval and 0.21 on the s-bend, above
      the 0.2 level, so the kp reduction is also justified. The candidate is valid:
      all sensor positions are in range, sensor_size 0.016 is allowed, and the controller
      values are inside their limits. Nothing is obviously broken. Its main risk is
      that base_speed 1.2 may be too slow to finish within 3 s, which needs roughly
      1.5 m/s, so completion is unlikely at this setting. Progress is the score lever
      for now. I cannot say how it will perform. This is early exploration with 9
      iterations left, so racing it gives the telemetry the next critique needs. Next
      race, read the results as follows. If line_loss_events is still 1.0 with max_error
      above 0.06, the cause is probably geometry. The 5-sensor span of 0.08 m means
      the robot leaves the sensed area at about 0.06 m offset, so widen the sensor
      span or change sensor spacing next. If the run is clean (line_loss_events near
      0, steering_oscillation under 0.2) but completion_time is above 3 s, raise base_speed
      in steps of 0.1 while keeping kp near 3.0. If steering_oscillation is still
      above 0.2 at kp 3.0, raise kd or lower kp further before changing speed.


      ### Requested changes


      - If line_loss_events is still 1.0 and max_error is above 0.06 on the oval or
      s-bend, keep base_speed at 1.2 and widen the sensor span (for example x at ±0.06
      m, or sensor_positions spaced 0.03 m). Iteration 1 showed line loss at 1.0 in
      every trial at base_speed 1.4 with kp 3.5, so speed alone may not fix it.

      - If the run is clean (line_loss_events near 0, steering_oscillation under 0.2)
      but completion_time is above 3 s, raise base_speed in 0.1 steps (for example
      1.3, then 1.4) and keep kp at 3.0 and kd at 0.3. Iteration 1 at base_speed 1.4
      gave progress of 0.37 on the oval, so the limit is not yet known.

      - If steering_oscillation is still above 0.2 with kp 3.0, raise kd from 0.3
      toward 0.45 or lower kp toward 2.6, leaving base_speed unchanged. Iteration
      1 had oscillation of 0.24 on the oval at kp 3.5 and kd 0.3.


      - [Open this output](iteration-2/entityR1/versions/0bdb1094abf645778888126786de4db0/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/06ad36b458d14a59a0ea82d6c9d02171/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-36b2a4697024ece1/payload.json)'
