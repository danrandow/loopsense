  entities:
  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'Iteration 0 baseline built from the contract, with no race data yet. Five
      12 mm sensors and linear weights, kp 2.5, kd 0.15, base_speed 1.6, sized to
      finish in under 3 s while staying stable.


      ### Rationale


      Iteration 0 has no race data or Evaluator feedback yet, so this is a conservative
      baseline built from the contract. Geometry: five sensors spaced 20 mm apart
      across the centre (x = -0.04 to +0.04) and 50 mm ahead of the axle, so they
      see the line before the wheels reach it. A 12 mm sensor footprint covers most
      of the 25 mm tape at any lateral offset. Wheel track 0.12 m and radius 0.03
      m give a moderate turn rate and a reasonable top speed. Mass 0.8 kg with a 0.12
      m body width keeps the off-track limit at 0.06 m. Controller: sensor weights
      run -2, -1, 0, 1, 2 so the signal is a linear lateral error (positive = left,
      which steers left). kp = 2.5 gives a turn of up to about 5 at full signal, which
      is a firm correction. kd = 0.15 damps the response to changes in signal. ki
      = 0 avoids integral windup on curves. base_speed = 1.6 (about 80 percent of
      full PWM) is a compromise: it should reach the roughly 1.5 m/s average needed
      to finish within 3 s, while leaving margin to correct on the tighter bends.
      line_loss = last_direction lets the robot turn back toward the side it last
      saw the line. Expected result: completion on the oval and s-bend, with rms error
      of a few mm. The slalom is the likely failure point, due to fast direction changes.
      Hypotheses to test: (1) kp is high enough to track the tighter bends without
      oscillation; (2) base_speed 1.6 finishes in under 3 s; (3) kd prevents oscillation
      at this speed. Next race should show whether steering_oscillation is high (kd
      or kp too large) or max_error grows on the slalom (kp too low, or base_speed
      too high for the turns).


      - [Open this output](iteration-0/entity0/versions/30418386b12848e4932067fe82ea8642/payload.json)'
  actions:
  - id: action0
