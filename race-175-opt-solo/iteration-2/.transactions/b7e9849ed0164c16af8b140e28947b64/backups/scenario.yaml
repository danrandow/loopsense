  - id: entity0
    label: Wider 7-sensor, kp 3.0
    notes: 'Widened the sensor array to +/-0.075 m with 7 sensors, raised kp from
      2.5 to 3.0 for more steering on bends, and lowered base speed to 1.5. Evidence:
      iteration 1 drifted off on the s-bend and slalom (progress 0.07 to 0.10), with
      max_error at the 0.06 m limit and steering oscillation still low.


      ### Rationale


      Evidence from iteration 1 (the best so far, score 122.0): every trial on all
      three tracks ended off_track, and max_error sat at about 0.0625 m, just above
      the 0.06 m off-track limit. Oval progress rose to 0.63 with one finish in 20
      trials, but s-bend progress was 0.095 and slalom progress 0.07. The s-bend had
      no line loss, so the robot drifted off the outside of bends while still seeing
      the tape. The slalom had one line loss, which means the tape left the outermost
      sensors (x = +/-0.06 m, footprint about 0.012 m). Steering oscillation is low
      (0.11 to 0.33), so the controller is not jittering. It is under-steering on
      curves, and the sensor span is too narrow for the larger lateral excursions.
      Changes: (1) widen the array to 7 sensors spanning x = +0.075 to -0.075 m at
      0.025 m spacing, so the tape stays visible at larger offsets and the centroid
      signal has finer resolution; (2) weights become [2, 1.33, 0.67, 0, -0.67, -1.33,
      -2], which keeps the signal range at +/-2 and the same overall gain per metre
      of offset; (3) kp rises from 2.5 to 3.0 for more steering authority on bends;
      (4) kd stays at 0.6 to damp the extra gain; (5) base_speed drops from 1.6 to
      1.5, which gives more time to correct on tight bends and still meets the roughly
      1.5 m/s needed to finish in 3 s. Expected result: fewer off-track exits on the
      s-bend and slalom, a line loss count of 0 or near 0, and progress above 0.5
      on all tracks. Hypotheses: (a) if s-bend progress stays under 0.3 with max_error
      near 0.06, the bends need more kp or less speed; (b) if steering_oscillation
      rises above 0.4, kd should go up or kp back down; (c) if the robot completes
      with completion_time above 3 s, base_speed should rise toward 1.7. Body width
      is kept at 0.12 m, because widening it to 0.18 m only lifts the off-track limit
      to about 0.0575 m, which is not worth the change.


