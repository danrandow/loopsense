  entities:
  - id: entity0
    label: Lighter, shorter robot
    notes: 'Mass cut from 0.6 to 0.5 kg and body length from 0.14 to 0.12 m to reduce
      yaw inertia further, since iteration 7 raised slalom progress from 0.19 to 0.48.
      Controller and sensors are unchanged so the inertia effect is isolated.


      ### Rationale


      Evidence from iteration 7 (score 695.8, best so far): the oval finished 20/20
      at 1.72 s with rms 0.0085 m. The s-bend finished 20/20 at 2.08 s, a clear gain
      on iteration 4''s 12/20. The slalom still fails in all 20 trials (off_track),
      but progress rose from 0.19 to 0.48 and line-loss events fell from 0.5 to 0.1.
      Lowering mass and body length (which cut yaw inertia) and widening the sensors
      to x = +/-0.08 m are therefore the first changes that helped the slalom, and
      the trend says the robot is still carrying too much rotational inertia into
      reversals. Steering oscillation stayed moderate (0.32 on the slalom, 0.35 on
      the s-bend), so the controller is not jittering and kd 1.0 is not the limit.
      Iteration 6 showed that raising kp alone does not help, so I am not changing
      gain. Change: reduce mass from 0.6 to 0.5 kg and body_length from 0.14 to 0.12
      m. Yaw inertia scales with mass*(L^2+W^2)/12, so this cuts it by about 15 to
      20 percent more, and I expect the slalom to get closer to completion. Everything
      else stays fixed (sensors, weights, kp 3.0, ki 0.05, kd 1.0, base_speed 1.5,
      last_direction) so the effect of inertia is isolated. Expected result: slalom
      progress 0.55 or more with line-loss events at or below 0.1, s-bend and oval
      completing 20/20, and oval time near 1.7 s. Hypotheses: (a) if the oval or s-bend
      start to lose finishes or steering_oscillation rises above 0.45, the lighter
      robot is over-responding and kd should rise to about 1.1; (b) if slalom progress
      stays under 0.55, inertia is no longer the main limit and the next lever is
      the wheel_track (narrower track gives more turn rate per PWM difference) or
      a small ki increase for the fixed motor mismatch; (c) if the slalom finishes,
      base_speed can be tested near 1.6 for the time term. Measurements wanted: completion,
      progress, completion_time, rms_error, max_error, line_loss_events, steering_oscillation,
      control_effort.


