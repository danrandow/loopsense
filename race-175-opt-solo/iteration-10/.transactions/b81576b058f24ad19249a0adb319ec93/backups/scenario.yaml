  - id: entity0
    label: Lighter, shorter, kd 1.2
    notes: 'Mass cut to 0.40 kg and body length to 0.10 m to lower yaw inertia further,
      with kd raised to 1.2 for damping. Iteration 9 showed that lower inertia is
      the lever that moved slalom finishes from 0 to 14 of 20.


      ### Rationale


      Evidence from iteration 9 (score 870.0, best so far): oval 20/20 at 1.97 s with
      rms 0.007 m; s-bend 20/20 at 2.33 s with 1.0 line-loss per trial; slalom 14/20
      finished (progress 0.91) with 6 off-track exits and 0.7 line-loss events per
      trial. Cutting yaw inertia by lowering mass and body length has been the only
      lever that has consistently helped the slalom: 0 finishes at 0.8 kg / 0.18 m,
      0 at 0.6 kg / 0.14 m, 7 at 0.5 kg / 0.12 m, 14 at 0.45 kg with kd 1.1. Steering
      oscillation stayed moderate (0.17 oval, 0.27 s-bend, 0.46 slalom), so there
      is no sign of jitter, and kd 1.1 was enough to keep the gentle tracks stable.
      Changes: (1) mass 0.45 to 0.40 kg, the contract minimum, which lowers the mass
      term by about 11 percent; (2) body_length 0.12 to 0.10 m, which lowers the (L^2+W^2)/12
      yaw-inertia term by about 15 percent, so total yaw inertia falls by roughly
      25 percent over iteration 9; (3) kd 1.1 to 1.2, to add damping for the faster
      yaw response, following hypothesis (a) from iteration 9 as a precaution against
      overshoot on reversals. Kept unchanged: sensors (7 at y 0.08 m, x +/-0.08 m,
      footprint 0.016 m), weights, kp 3.0, ki 0.05, base_speed 1.5, wheel_track 0.12,
      wheel_radius 0.03, body_width 0.12, last_direction. Expected result: slalom
      finishes rise from 14/20 to 16 or more, with progress above 0.95 and fewer off-track
      exits; oval and s-bend stay at 20/20, with oscillation at or below about 0.25
      on the s-bend. Hypotheses: (a) if the oval or s-bend start losing finishes or
      steering_oscillation exceeds 0.4, the robot is over-responding and kd should
      rise to about 1.3, or the body_length cut should be reverted; (b) if slalom
      finishes stay at 14 or fewer with off-track exits, the yaw-inertia lever is
      saturating and the next step is narrowing wheel_track to 0.10 m with kp at 2.8
      to add yaw authority; (c) if the slalom reaches 18 or more, base_speed can be
      tested at 1.6 for the time term. Measurements wanted: completion, progress,
      completion_time, rms_error, max_error, line_loss_events, steering_oscillation,
      control_effort.


