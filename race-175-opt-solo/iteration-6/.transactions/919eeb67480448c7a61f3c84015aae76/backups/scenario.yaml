  entities:
  - id: entity0
    label: Higher kp, speed back 1.5
    notes: 'Reverts base_speed to 1.5 because 1.3 cut s-bend finishes from 12 to 7,
      and raises kp from 3.0 to 3.5 for more steering authority on slalom reversals
      (0/20 finishes, progress about 0.2). Geometry and weights are unchanged from
      the best design (iteration 4, score 573).


      ### Rationale


      Iteration 4 (base_speed 1.5, kp 3.0, kd 1.0, y 0.08 m, 0.016 m footprint) is
      the best design so far at 573.5. Iteration 5 lowered base_speed to 1.3 and scored
      522.7. The oval was unchanged, the s-bend fell from 12/20 to 7/20 finishes,
      and the slalom progress rose only from 0.19 to 0.27. So lower speed is not the
      fix, and I am returning base_speed to 1.5. Slalom remains the weak point: 0/20
      finishes with progress 0.19-0.27 and line-loss events of 0.15 to 0.5 per trial.
      Steering oscillation is moderate (0.18-0.39), so the controller is not jittering
      and has room for more authority. Iteration 5''s hypothesis (a) fits: the robot
      cannot turn hard enough on reversals. The change is kp 3.0 to 3.5 (about 17%
      more steering authority per unit of signal), with base_speed back at 1.5 and
      kd at 1.0 to damp the extra gain. Geometry is unchanged, including the 7 sensors
      at y 0.08 m, x spanning +/-0.075 m, and the 0.016 m footprint. Expected result:
      slalom progress above 0.35 and fewer line-loss events, with the s-bend holding
      near 12/20 and the oval still finishing in about 1.9 s. Hypotheses: (a) if steering_oscillation
      rises above 0.4 or the oval finish rate drops, kp 3.5 is too aggressive and
      should return to about 3.2 with kd 1.1; (b) if slalom still goes off track with
      progress under 0.3, the limit is sensor reach, so the next lever is the sensor
      x span (up to +/-0.08 m) or a higher kd for quicker recovery; (c) if the s-bend
      improves but the oval finish time is above 2.0 s, base_speed should stay at
      1.5 and not drop further. Measurements wanted: completion, progress, completion_time,
      rms_error, max_error, line_loss_events, steering_oscillation, control_effort.


