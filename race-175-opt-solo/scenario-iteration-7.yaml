  entities:
  - id: entity0
    label: Lighter, shorter, wider
    notes: 'Cuts mass to 0.6 kg and body length to 0.14 m to reduce yaw inertia, and
      widens the sensor span to plus or minus 0.08 m, to address slalom failures at
      0/20 finishes in iteration 4. Rests on iteration 4 (573.5) and iteration 6,
      where raising kp to 3.5 did not help the slalom.


      ### Rationale


      Evidence from iteration 4, the best design so far (score 573.5): the oval finishes
      20/20, the s-bend finishes 12/20, and the slalom fails in all 20 trials at progress
      0.19. Iteration 6 raised kp to 3.5 and scored 561.8, which is slightly worse,
      so extra steering gain alone does not fix the slalom. Iteration 5 showed that
      lowering base_speed does not help either. Steering oscillation (0.18 to 0.39)
      is moderate, so the controller is not jittering. The slalom failures look like
      the robot carrying too much lateral momentum into fast reversals, with the tape
      leaving the sensor array at about 0.075 m offset. Changes: (1) reduce mass from
      0.8 to 0.6 kg and body_length from 0.18 to 0.14 m. Yaw inertia scales with mass*(L^2+W^2)/12,
      so both changes cut the turning inertia by roughly 35 percent, letting the robot
      change heading faster on reversals. (2) Widen the sensor span to x = +/-0.08
      m, the contract maximum, with the same seven weights, so the tape stays under
      a sensor at larger excursions. (3) Keep kp 3.0, kd 1.0, ki 0.05, base_speed
      1.5, sensor size 0.016 m, y 0.08 m and last_direction, so the change in geometry
      is isolated against iteration 4. Body width stays at 0.12 m because the off-track
      limit does not rise above 0.06 m with a wider body. Expected result: slalom
      progress above 0.35 with fewer line-loss events, s-bend finishes at 13 or more
      of 20, and the oval still completes in about 1.9 s. Hypotheses: (a) if the oval
      starts failing or oscillation rises above 0.4, the lighter robot is over-responding
      and kd should rise to about 1.1; (b) if the slalom still goes off track with
      progress under 0.3, the limit is not inertia and the next lever is the sensor
      footprint or ki; (c) if the oval finish time falls below 1.8 s with no loss
      of finishes, mass can drop further. Measurements wanted: completion, progress,
      completion_time, rms_error, max_error, line_loss_events, steering_oscillation,
      control_effort.


