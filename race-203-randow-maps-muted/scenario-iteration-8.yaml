map:
  id: race-203-randow-maps-muted
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Evidence across iterations 0 to 7: every run ends off_track on all three development
      tracks, and max_error sits on the 0.06 m off-track floor. The floor is max(0.06,
      tape_half_width + body_width/4), which stays at 0.06 m for every allowed body
      width, so body width cannot help. Line loss is now rare (oval 0, s-bend about
      0.95, slalom about 0.85 at iteration 4), so sensor span is no longer the limit.
      Iteration 4 (wheel_track 0.08, wheel_radius 0.03, mass 0.8, 7 sensors at y=0.05,
      16 mm footprints, body 0.18 x 0.12) remains the best at 58.54. Iteration 7 (wheel_radius
      0.025) scored 57.92, slightly lower, so radius 0.03 is near the optimum. Radius
      0.04 (iteration 5) and mass 1.0 (iteration 6) both cut s-bend progress sharply.
      Iteration 2 moved the sensors forward to y=0.07 together with a shorter, lighter
      body, and that hurt. The sensor-lead direction was therefore confounded and
      never tested alone in the shorter direction. I now revert to iteration 4 and
      change only the forward sensor position, from y=0.05 to y=0.03 m. The hypothesis
      is that a shorter lead reduces the overshoot that builds when the controller
      responds to line position well ahead of the wheels on bends. I expect s-bend
      and slalom progress to hold near 0.18 or rise, with max_error still at or near
      the floor. Risk: a shorter lead may increase lag and push line loss up on the
      sharpest bends.


      - [Open this output](iteration-8/entity0/versions/792dbce1a9c84ad5a762d526179b166c/payload.json)

      - Based on: [entityR2A](iteration-8/entityR2A/versions/carried-d21b378e434fdb43/payload.json)'
  - id: entity1
    label: Forward sensors at y=0.03
    notes: 'Iteration 4 geometry and controller, with only the sensor row moved from
      y=0.05 to y=0.03 m as the Builder requested. Iteration 4 is the best design
      so far (58.54), so the controller is held to isolate the lead change.


      ### Rationale


      Evidence: iteration 4 (wheel_track 0.08 m, wheel_radius 0.03 m, mass 0.8 kg,
      seven 16 mm sensors at y=0.05 m, kp 1.35, kd 0.25, ki 0.02) is the best design
      at 58.54. Every run ends off_track with max_error on the 0.06 m floor, and line
      loss is now rare (oval 0, s-bend about 0.95, slalom about 0.85). Iterations
      5 and 6 showed that a larger wheel_radius (41.4) and a heavier mass (42.7) both
      cut s-bend progress, and iteration 7 (wheel_radius 0.025 m) scored 57.92, so
      the speed and inertia optimum sits near the iteration 4 values. The only change
      in this geometry is the forward sensor position, moved from y=0.05 to y=0.03
      m, as the Builder requested. The sensor lead does not enter the controller equations,
      so the controller stays identical to iteration 4. That keeps the race isolating
      the geometry change. The signal weights are still proportional to sensor x,
      and last_direction line-loss recovery is unchanged. I expect progress near or
      above 0.185 on the s-bend, with max_error and steering_oscillation at or below
      iteration 4. The risk is a shorter lead that adds lag and more line loss on
      the sharpest bends. I make no outcome claim for this candidate.


      - [Open this output](iteration-8/entity1/versions/b59c76df06c1464f9e3d3d175a85cd0e/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/792dbce1a9c84ad5a762d526179b166c/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-d21b378e434fdb43/payload.json)'
  - id: entityR1
    label: 'Shorter lead: next steps'
    notes: 'Feedback written before the race: it names the y=0.02 step if progress
      and max_error improve, and a return to y=0.05 with sensor_size 0.012 if line
      loss rises. The evidence comes from iterations 2, 4, 5, 6 and 7.


      ### Feedback


      Written before this candidate has raced, so it makes no claim about its result.
      Iteration 2 (y=0.07 with a shorter, lighter body) fell to 47.8 and lost s-bend
      progress (0.163 to 0.119). That run changed two things at once, so it does not
      show the lead effect alone, but it is the only evidence on the forward direction.
      Iterations 5 and 6 showed that larger wheel_radius (41.4) and higher mass (42.7)
      both cut s-bend progress, and iteration 7 (wheel_radius 0.025 m) scored 57.9,
      so the controller and geometry are close to a local optimum at radius 0.03 m,
      mass 0.8 kg and wheel_track 0.08 m. I kept the iteration 4 controller so that
      the y change is the only variable. When the next race reports: if s-bend and
      slalom progress hold at or above 0.185 and max_error or steering_oscillation
      falls, the shorter lead is helping, so try a further step. If line_loss_events
      rise on the s-bend or slalom, or progress falls, the lead is too short for the
      sharpest bends, so return to y=0.05 m.


      ### Requested changes


      - If progress holds at or above 0.185 and max_error falls on the s-bend and
      slalom with line loss at or below iteration 4: try y=0.02 m with the same span
      and 16 mm footprints. Evidence: iteration 4 (y=0.05) gave max_error 0.0656 on
      the s-bend, pinned at the floor, and iteration 2 (y=0.07) hurt, so the shorter
      direction is the one still open.

      - If line_loss_events rise above about 1.0 on the slalom or s-bend, return y
      to 0.05 m and try sensor_size 0.012 at that height instead. Evidence: iteration
      1 to 4 showed line loss falls as the sensor span widens, and iteration 4 already
      has 0.95 line loss on the s-bend, so a shorter lead may need more coverage per
      sensor.

      - Keep wheel_track 0.08 m, wheel_radius 0.03 m and mass 0.8 kg unchanged. Evidence:
      iterations 5, 6 and 7 each moved one of these and scored 41.4, 42.7 and 57.9
      against 58.5 for iteration 4.


      - [Open this output](iteration-8/entityR1/versions/b59c76df06c1464f9e3d3d175a85cd0e/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/792dbce1a9c84ad5a762d526179b166c/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-d21b378e434fdb43/payload.json)'
