map:
  id: race-203-randow-maps-muted
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Lead sensors, lighter
    notes: 'Moves the 7-sensor array forward to y=0.07 and shortens and lightens the
      body (length 0.12 m, mass 0.6 kg) to cut yaw inertia. Iteration 1 showed that
      sensor span removed line loss but every run still went off track at the 0.06
      m floor, so this targets lag and turn response. Evidence is the 60-trial summary
      for iteration 1.


      ### Rationale


      Evidence: across 60 trials of the iteration 0 design, every run went off track
      on all three tracks, with one line-loss event each time. Iteration 1 widened
      the sensor span to +/-0.06 m with 16 mm footprints, and line loss fell to 0
      on the oval, 0.6 on the s-bend and 1.0 on the slalom. Every run still ended
      off track. Progress stayed at 0.11 to 0.16, and max_error sat at 0.060 to 0.068
      m, the off-track floor. Coverage is therefore no longer the main cause. The
      robot now drifts off the line on the bends, and rms_error near 0.03 m shows
      a steady lag rather than random noise.


      Body width cannot help. The off-track limit is max(0.06, 0.0125 + body_width/4).
      Even at the 0.18 m maximum this is 0.0575, so the limit stays at 0.06 m. Yaw
      inertia is mass*(L^2+W^2)/12, so body length and mass are the geometry levers
      that change how quickly the robot can turn into a bend. Sensor forward reach
      (y) sets how far ahead the controller sees the line, so a longer lead should
      reduce the lag that lets error build up.


      Change: move the 7-sensor array forward to y = 0.07 to give more lead before
      the wheels reach the bend. Shorten body_length from 0.18 to 0.12 m and reduce
      mass from 0.8 to 0.6 kg. Together these cut yaw inertia from about 0.0031 to
      about 0.0014 kg m^2, so the robot can follow a sharp bend without overshooting.
      Keep the 16 mm footprint, the 0.02 m spacing, wheel_track 0.12 and wheel_radius
      0.03 fixed, so that the sensor-lead and inertia change can be read from the
      telemetry.


      Expected result: max_error should fall below 0.06 m, progress should rise above
      0.3, and the first off-track event should move later in the course. If progress
      still stalls near 0.15 with no line loss, the limit is probably base speed or
      turn authority, and the next iteration should change wheel_track or wheel_radius.


      - [Open this output](iteration-2/entity0/versions/d8cb0f134cf24c58ac1e92d2d68a7ba0/payload.json)

      - Based on: [entityR2A](iteration-2/entityR2A/versions/carried-745ee191a5e77876/payload.json)'
  - id: entity1
    label: Wider 7-sensor package
    notes: 'Widened the array to ±0.06 m with 16 mm footprints, scaled controller
      weights to sensor x, lowered base speed to 1.5, and raised kd to 0.25. Iteration
      0 had 100% off-track ends with one line loss per run and max_error at the 0.06
      m floor, so coverage at the edges is the first thing to test.


      ### Rationale


      Iteration 0 (60 trials, three development tracks) ended every run off_track
      with one line-loss event per run. Progress was only 0.105 to 0.158, and max_error
      sat at 0.060 to 0.068, at or just past the 0.06 m off-track floor. The line
      was lost once, and the robot never recovered. The Builder''s geometry is a five-sensor
      array at x = ±0.03 m with 12 mm footprints, so the line leaves the sensors''
      view at about ±0.0485 m of lateral offset. Iteration 1 widens coverage to x
      = -0.06 to 0.06 m in 0.02 m steps, with 16 mm footprints, which keeps the tape
      visible further out. Controller: weights are proportional to sensor x (x/0.03,
      clipped to ±2), so the signal stays close to the lateral offset in sensor units.
      Positive x is left, so a line under the left sensors gives a positive signal
      and steers left, as the contract requires. Base speed drops from 1.8 to 1.5.
      The contract''s pace target of about 1.5 m/s is only a rough guide, and the
      1.8 run drifted off early. Lower speed gives the controller more time to correct
      after a line loss, which helps separate control limits from geometry limits.
      Gains are kp 1.5 (up from 1.2) so the robot corrects harder at the wider sensor
      range, ki 0.02 (small, to avoid windup on long bends), and kd 0.25 (up from
      0.1) to damp the s-bend and slalom oscillation seen in iteration 0 (steering_oscillation
      0.147 and 0.160). line_loss stays at last_direction, which turns toward the
      side the line was last seen. Expected result: fewer or no line-loss events,
      max_error below 0.06, and progress well above 0.2. This is a prediction, not
      a measured result.


      - [Open this output](iteration-1/entity1/versions/0c25a5e69dfc460ba8cfefd6f9547570/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/267d2cb720204898a28b43a39350d24c/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-20f6a6c749cb2902/payload.json)'
  - id: entityR1
    label: Span, lag and speed
    notes: 'Feedback cites only iteration 0 evidence and makes no claim about this
      candidate''s result. It gives three conditional changes: widen to ±0.08 m if
      line loss persists, move the forward offset to 0.04 m if oscillation stays high
      on s-bend and slalom, and change wheel geometry if progress stays low.


      ### Feedback


      Written before this candidate has raced, so it states no outcome for it. Iteration
      0''s five-sensor baseline (x ±0.03 m, 12 mm footprints, y 0.06 m) gave 100%
      off_track ends on all three development tracks, with one line-loss event per
      run and max_error of 0.060 to 0.068 m. Progress was only 0.105 to 0.158. Together
      these point to the line leaving the sensors'' view at lateral offsets beyond
      about 0.05 m, not to the body or wheels. Body width cannot help, because the
      off-track limit stays at 0.06 m for body_width up to 0.18 m. In my controller
      I had to scale weights to the wider span (weights proportional to x, clipped
      to ±2) and lower base speed to 1.5, because the 1.8 run drifted off early. I
      also raised kd to damp oscillation, which was highest on s-bend and slalom in
      iteration 0 (steering_oscillation 0.147 and 0.160). When the next race reports:
      if line_loss_events is still about 1 per run and max_error is near 0.06, the
      span is still too narrow, so push the outer sensors to x ±0.08 m (the contract
      limit). If the line is held but progress stays under 0.3 with high steering_oscillation
      on s-bend or slalom, move the forward offset closer to the axle (y 0.04 m) to
      cut lag. If progress rises but the robot still runs off track on tight bends,
      the wheel geometry may limit turning rate, so test wheel_track 0.10 m.


      ### Requested changes


      - If line_loss_events stays at about 1 per run with max_error near 0.06 m: widen
      the outer sensors to x = ±0.08 m (the contract limit), keeping sensor_size 0.016
      and the seven-sensor array. Evidence: iteration 0 (all 60 trials ended off_track,
      max_error 0.060 to 0.068 m, one line loss per run) shows the line leaves the
      12 mm, ±0.03 m array before the robot can recover.

      - If the line is held but steering_oscillation stays high (above about 0.15)
      on s-bend or slalom: move the forward offset from y = 0.05 m to y = 0.04 m to
      cut sensor-to-wheel lag. Evidence: iteration 0 had its highest steering_oscillation
      on slalom (0.160) and s-bend (0.147), and those tracks had the highest max_error.

      - If progress stays below 0.3 with no line loss on any track: change wheel_track
      from 0.12 m to 0.10 m to raise turning rate, or wheel_radius from 0.03 m to
      0.035 m for more ground speed. Evidence: iteration 0 progress was 0.105 to 0.158
      on every track, with no line loss in the non-off-track sections, so this would
      indicate a speed or turning-rate limit rather than a sensing one.


      - [Open this output](iteration-1/entityR1/versions/0c25a5e69dfc460ba8cfefd6f9547570/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/267d2cb720204898a28b43a39350d24c/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-20f6a6c749cb2902/payload.json)'
