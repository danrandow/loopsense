overrides:
  entities:
  - id: entity0
    label: Shorter body, final push
    notes: 'Iteration 4 layout with body_length cut from 0.18 to 0.15 m. The 0.24
      m body fell to 30.8, which suggests more yaw inertia hurts, so this tests a
      small step in the other direction. Rests on the plateau near 58 and the body-length
      sweep in iterations 4 to 10.


      ### Rationale


      Final iteration, so this design is scored on the unseen track. Iteration 4 (58.54)
      is the best measured design. Across the sweep, raising yaw inertia hurt sharply:
      body_length 0.24 m dropped the score to 30.8 (s-bend progress 0.185 to 0.053),
      and mass 1.0 kg dropped it to 42.7. Iteration 2, which lowered inertia, also
      scored lower, but it changed sensor lead at the same time. Inertia therefore
      looks like the controlling geometry term, and the evidence leans toward less
      inertia being better rather than worse. Every run still ends off_track with
      max_error on the 0.06 m floor. The off-track floor cannot move, since max(0.06,
      0.0125 + body_width/4) stays at 0.06 m for all allowed body widths. Line loss
      is rare, so sensor span is not the limit. Radius 0.03 m, wheel_track 0.08 m
      (the minimum), mass 0.8 kg and sensor lead y=0.05 m are at or near their measured
      optima. Change: body_length from 0.18 m to 0.15 m, a modest step that lowers
      yaw inertia by about 0.0031 to about 0.0024 kg m^2, with everything else held
      at iteration 4 values. Expected result: progress and max_error on the s-bend
      hold or improve, with a score at or slightly above 58.5. The step is small enough
      to limit the downside: if the score falls, the remaining gain is controller-side
      and the geometry should revert to 0.18 m.


      - [Open this output](iteration-11/entity0/versions/6c4a56f16e394182b4f0ddda449b4dee/payload.json)

      - Based on: [entityR2A](iteration-11/entityR2A/versions/carried-8baaa3c0f4e95ab2/payload.json)'
  - id: entity1
    label: 'Final robot: shorter body'
    notes: 'Iteration 4 controller and sensor layout with body_length cut from 0.18
      to 0.15 m, the Builder''s final step to reduce yaw inertia. Controller held
      unchanged because the best measured design (58.54) is the reference and extra
      inertia hurt sharply earlier.


      ### Rationale


      The iteration 4 layout (58.54, the best measured design) is the reference. Every
      run in every iteration ended off_track with max_error on the 0.06 m floor, and
      line loss is now rare (oval 0, s-bend about 0.95, slalom about 0.85). Gains
      and base speed have been stable since iteration 4. Iterations 5 to 9 each moved
      one variable away from it (wheel_radius 0.04 gave 41.4, mass 1.0 gave 42.7,
      wheel_radius 0.025 gave 57.9, y=0.03 gave 41.1, 12 mm footprint gave 58.27),
      so I keep those values. The Builder''s final geometry changes only body_length,
      from 0.18 to 0.15 m, which lowers yaw inertia by about 0.0007 kg m^2. The evidence
      for the direction is mixed. Adding inertia hurt sharply (body_length 0.24 gave
      30.8, mass 1.0 gave 42.7), which argues that less inertia is at least not harmful.
      Iteration 2 lowered inertia but also moved the sensors, so it does not isolate
      the effect. Since this is the final, unseen-track race, I keep the change small
      and do not alter the controller, because gains untested on this geometry add
      risk. Expected result: close to 58.5, with no outcome claimed for this candidate.


      - [Open this output](iteration-11/entity1/versions/fe14ae6f005544c2ba0e018f014c65b0/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/6c4a56f16e394182b4f0ddda449b4dee/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-8baaa3c0f4e95ab2/payload.json)'
  - id: entityR1
    label: 'Final feedback: body'
    notes: 'Conditional feedback on the 0.15 m body length, based on the inertia results
      from iterations 6 and 10 and the confounded iteration 2. Gives three changes
      tied to earlier scores, with no outcome claimed for this candidate.


      ### Feedback


      Written before this candidate has raced, so it claims no outcome for it. The
      evidence is iteration 4 (58.54, best, body 0.18 m, mass 0.8 kg, wheel_radius
      0.03 m, wheel_track 0.08 m, y=0.05 m, 16 mm, kp 1.35). Raising inertia hurt:
      body_length 0.24 gave 30.8 (iteration 10) and mass 1.0 gave 42.7 (iteration
      6). Lowering inertia is the direction you are testing, but the only lower-inertia
      evidence (iteration 2, 47.8) also moved the sensors to y=0.07, so it does not
      isolate the effect. Your 0.15 m step is small, and I have kept the iteration
      4 controller so the change is isolated. This is the final race on an unseen
      track, so the score will not feed another iteration. The changes below are conditional
      on the next race result, which you will not see for this design, so they are
      best read as the rule you would apply if another iteration were run.


      ### Requested changes


      - If a later race shows body_length 0.15 m scoring at or above 58.5 with max_error
      or steering_oscillation falling: keep 0.15 m and test body_length 0.12 m next.
      Evidence: inertia rising hurt sharply (iteration 10, body 0.24 m, 30.8), so
      the direction of lower inertia is the one still open.

      - If the score falls below about 56, or steering_oscillation rises above about
      0.2: return body_length to 0.18 m, the iteration 4 value. Evidence: iteration
      4 at 0.18 m is the best measured design, and both inertia directions have been
      tested only with other variables changed.

      - Keep wheel_track 0.08 m, wheel_radius 0.03 m, mass 0.8 kg and y=0.05 m unchanged.
      Evidence: iterations 5, 6, 7 and 8 each moved one of these and scored 41.4,
      42.7, 57.9 and 41.1, all below iteration 4 (58.54).


      - [Open this output](iteration-11/entityR1/versions/fe14ae6f005544c2ba0e018f014c65b0/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/6c4a56f16e394182b4f0ddda449b4dee/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-8baaa3c0f4e95ab2/payload.json)'
