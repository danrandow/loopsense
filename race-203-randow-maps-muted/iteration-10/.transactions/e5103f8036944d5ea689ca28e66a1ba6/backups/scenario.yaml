map:
  id: race-203-randow-maps-muted
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Longer body, inertia test
    notes: 'Reverts to the best measured layout (iteration 4, 58.5) and changes only
      body_length to 0.24 m, to test yaw inertia in isolation. Every geometry lever
      tried so far has plateaued near 58, with every run still ending off track at
      the 0.06 m floor.


      ### Rationale


      Evidence across iterations 0 to 9: every run in every iteration ends off_track
      on all three development tracks. max_error sits on the 0.06 m off-track floor,
      and progress is stuck between 0.06 and 0.19. Line loss is now rare (oval 0,
      s-bend about 0.95, slalom about 0.85 at iteration 4), so sensor span is no longer
      the main limit. The off-track floor is max(0.06, 0.0125 + body_width/4), which
      is 0.06 m for every allowed body width, so body width cannot help. Scores have
      plateaued near 58: iteration 4 (16 mm, 58.54) and iteration 9 (12 mm, 58.27)
      are effectively tied, so the footprint lever is neutral. Wheel_track is at its
      0.08 m minimum, and wheel_radius 0.03 m and mass 0.8 kg are near their measured
      optima. Sensor lead y=0.05 m beat both y=0.03 m (41.1) and y=0.07 m (confounded,
      47.8). The one geometry lever not yet tested in isolation is body_length, which
      sets yaw inertia (mass*(L^2+W^2)/12) without changing the off-track floor or
      the sensor layout. Iteration 2 lowered inertia and hurt, and iteration 6 raised
      mass and hurt, so inertia''s direction is unclear. I therefore revert to the
      iteration 4 design (16 mm footprints, which is the marginally better footprint)
      and change only body_length, from 0.18 m to 0.24 m. That raises yaw inertia
      by about 1.5x (from about 0.0031 to about 0.0047 kg m^2). Expected result: if
      inertia damps the drift, max_error and steering_oscillation fall and progress
      rises above 0.19 on the s-bend. If the score falls or holds, the body is confirmed
      to be inert, and the plateau is set by controller gain or base speed, which
      is outside geometry.


      - [Open this output](iteration-10/entity0/versions/9c050fc8ac644146ac021f761c117152/payload.json)

      - Based on: [entityR2A](iteration-10/entityR2A/versions/carried-45efd482e1074289/payload.json)'
  - id: entity1
    label: 12mm footprint, iter 4
    notes: 'Iteration 4 layout with sensor_size cut from 16 mm to 12 mm and the iteration
      4 gains held, so the race isolates the footprint change. Based on iteration
      4 (58.54), the best so far, and iteration 8, which showed that the y=0.05 m
      lead must stay.


      ### Rationale


      Iteration 4 is the best design (58.54). Iterations 5 to 8 each moved one geometry
      or controller variable away from it and scored lower (41.4, 42.7, 57.9, 41.1),
      so the iteration 4 layout and gains are close to a local optimum. The Builder''s
      single change is sensor_size 0.016 to 0.012 m. Each sensor now sees a smaller
      patch of tape, so the readings are sharper but the outer sensors cover less
      of the tape. The signal weights are unchanged, so the controller does not need
      retuning for the footprint change. I keep the iteration 4 gains (kp 1.35, ki
      0.02, kd 0.25, base_speed 1.5, last_direction) so the race isolates the footprint.
      Expected: score near 58, progress at or above 0.185 on the s-bend, and line
      loss at or below iteration 4. Risk: the outer sensors at +/-0.06 m reach only
      about +/-0.066 m with 12 mm footprints, so edge line loss could rise. I make
      no outcome claim.


      - [Open this output](iteration-9/entity1/versions/7f41e46b3dc94bd6bc2d6bad20bd5221/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/9e9319db022a4cca844a0fa8b1947d5c/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-818f4864d64842bf/payload.json)'
  - id: entityR1
    label: Span or revert next
    notes: 'Pre-race feedback: test 12 mm first, then widen the span to 0.07 m if
      edge line loss rises, or revert to 16 mm if the sharper footprint does not help.
      Each rule is tied to iteration 4 and 8 telemetry, and no outcome is claimed.


      ### Feedback


      Written before this candidate has raced, so it states no outcome for it. Iteration
      4 (16 mm footprints, y=0.05 m, wheel_track 0.08 m, wheel_radius 0.03 m, mass
      0.8 kg, score 58.54) is still the best. Iteration 8 showed that moving the sensors
      to y=0.03 m cost about 17 points (41.1), so the lead should stay at y=0.05 m.
      Iterations 5, 6 and 7 showed that wheel_radius 0.04 m (41.4), mass 1.0 kg (42.7)
      and wheel_radius 0.025 m (57.9) all score below the 0.03 m, 0.8 kg layout, so
      those values stay. Iteration 1 to 4 showed that line loss falls as the sensor
      span widens, and the span at +/-0.06 m with 12 mm footprints is now the open
      question. I kept the iteration 4 controller so the footprint change is isolated.
      When the next race reports: if the s-bend and slalom max_error or steering_oscillation
      falls, the sharper readings are helping, so keep 12 mm and test the span next.
      If line_loss_events rise above iteration 4 levels (about 0.95 on the s-bend
      and 0.85 on the slalom) at the outer sensors, return to 16 mm before changing
      anything else.


      ### Requested changes


      - If line_loss_events rise above iteration 4 levels on the s-bend or slalom
      while max_error and steering_oscillation hold: keep sensor_size 0.012 m, widen
      the outer sensors from x=+/-0.06 m to x=+/-0.07 m (seven sensors, spacing about
      0.0233 m). Evidence: iterations 1 to 4 showed that widening the span cut line
      loss from about 1.0 to about 0.85 per run, so a wider span is the way to recover
      edge coverage.

      - If line loss rises and the 12 mm footprint is not clearly lowering max_error:
      return sensor_size to 0.016 m and keep the iteration 4 layout (y=0.05 m, +/-0.06
      m span). Evidence: iteration 4 is the best design at 58.54, and iteration 8
      showed that moving the sensors away from it cost about 17 points.

      - Keep wheel_track 0.08 m, wheel_radius 0.03 m, mass 0.8 kg, body 0.18 x 0.12
      m and y=0.05 m unchanged. Evidence: iterations 5 to 8 each moved one of these
      and scored 41.4, 42.7, 57.9 and 41.1, all below iteration 4 (58.54).


      - [Open this output](iteration-9/entityR1/versions/7f41e46b3dc94bd6bc2d6bad20bd5221/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/9e9319db022a4cca844a0fa8b1947d5c/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-818f4864d64842bf/payload.json)'
