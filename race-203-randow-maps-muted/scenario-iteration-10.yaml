map:
  id: race-203-randow-maps-muted
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Longer body, inertia test
    notes: 'Reverts to the best measured layout (iteration 4, 58.5) and changes only
      body_length to 0.24 m, to test yaw inertia in isolation. Every geometry lever
      tried so far has plateaued near 58, with every run still ending off track at
      the 0.06 m floor.


      ### Rationale


      Evidence across iterations 0 to 9: every run in every iteration ends off_track
      on all three development tracks. max_error sits on the 0.06 m off-track floor,
      and progress is stuck between 0.06 and 0.19. Line loss is now rare (oval 0,
      s-bend about 0.95, slalom about 0.85 at iteration 4), so sensor span is no longer
      the main limit. The off-track floor is max(0.06, 0.0125 + body_width/4), which
      is 0.06 m for every allowed body width, so body width cannot help. Scores have
      plateaued near 58: iteration 4 (16 mm, 58.54) and iteration 9 (12 mm, 58.27)
      are effectively tied, so the footprint lever is neutral. Wheel_track is at its
      0.08 m minimum, and wheel_radius 0.03 m and mass 0.8 kg are near their measured
      optima. Sensor lead y=0.05 m beat both y=0.03 m (41.1) and y=0.07 m (confounded,
      47.8). The one geometry lever not yet tested in isolation is body_length, which
      sets yaw inertia (mass*(L^2+W^2)/12) without changing the off-track floor or
      the sensor layout. Iteration 2 lowered inertia and hurt, and iteration 6 raised
      mass and hurt, so inertia''s direction is unclear. I therefore revert to the
      iteration 4 design (16 mm footprints, which is the marginally better footprint)
      and change only body_length, from 0.18 m to 0.24 m. That raises yaw inertia
      by about 1.5x (from about 0.0031 to about 0.0047 kg m^2). Expected result: if
      inertia damps the drift, max_error and steering_oscillation fall and progress
      rises above 0.19 on the s-bend. If the score falls or holds, the body is confirmed
      to be inert, and the plateau is set by controller gain or base speed, which
      is outside geometry.


      - [Open this output](iteration-10/entity0/versions/9c050fc8ac644146ac021f761c117152/payload.json)

      - Based on: [entityR2A](iteration-10/entityR2A/versions/carried-45efd482e1074289/payload.json)'
  - id: entity1
    label: Longer body, 0.24 m
    notes: 'Iteration 4 layout and controller with body_length raised from 0.18 to
      0.24 m, isolating yaw inertia. The best measured design (58.54) is the baseline,
      and the Builder''s proposal is kept unchanged.


      ### Rationale


      Iteration 4 (58.54) is still the best measured design. Iteration 8 showed that
      moving the sensors to y=0.03 m cost about 17 points, and iteration 9 showed
      that a 12 mm footprint is neutral (58.27). Iterations 5, 6 and 7 bracketed wheel_radius
      and mass, and all were worse or only marginally lower. The Builder''s geometry
      changes only body_length from 0.18 to 0.24 m, which raises yaw inertia from
      about 0.0031 to about 0.0047 kg m^2 and leaves the sensor layout, wheel_track,
      wheel_radius, mass and body_width unchanged. The controller therefore stays
      at the iteration 4 values (kp 1.35, ki 0.02, kd 0.25, base_speed 1.5, weights
      proportional to sensor x, last_direction), so the race isolates the inertia
      change. The off-track floor is fixed at 0.06 m, so only control behaviour can
      move it. Expected: if extra inertia damps the drift, max_error and steering_oscillation
      fall on the s-bend and slalom with progress holding near 0.185. I make no outcome
      claim for this candidate.


      - [Open this output](iteration-10/entity1/versions/e5103f8036944d5ea689ca28e66a1ba6/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/9c050fc8ac644146ac021f761c117152/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-45efd482e1074289/payload.json)'
  - id: entityR1
    label: Inertia test feedback
    notes: 'Feedback cites iterations 2, 5, 6, 8 and 9 for the expected behaviour
      of body_length, with explicit rules for keeping, reverting or moving to span
      widening. It states no outcome for this candidate.


      ### Feedback


      Written before this candidate has raced, so it makes no claim about its result.
      Evidence: iteration 4 (16 mm, y=0.05, wheel_track 0.08, mass 0.8, body 0.18,
      score 58.54) is the best measured design. Iteration 8 (y=0.03) fell to 41.1,
      so the sensor lead should stay at y=0.05. Iteration 9 (12 mm footprint, 58.27)
      was neutral, so footprint is not a strong lever. Iterations 5 and 6 (wheel_radius
      0.04 at 41.4, and mass 1.0 at 42.7) cut s-bend progress sharply, which suggests
      added speed or inertia can overshoot. Iteration 2 (lighter, shorter body with
      y=0.07) also scored lower. I kept the iteration 4 controller so that body_length
      is the only variable. When the next race reports: if s-bend or slalom max_error
      and steering_oscillation fall while progress holds at or above 0.185, keep body_length
      0.24 m and do not add more inertia. If progress falls below about 0.18 or steering_oscillation
      rises above about 0.2, return body_length to 0.18 m, since inertia is overshooting.
      If the score is flat, body_length is inert and the next geometry test is a wider
      sensor span.


      ### Requested changes


      - If the score holds or rises with max_error and steering_oscillation falling
      on the s-bend and slalom: keep body_length at 0.24 m and do not raise mass further.
      Evidence: iteration 6 (mass 1.0, about 25 percent more inertia) cut s-bend progress
      from 0.185 to 0.065, so more inertia is not automatically better.

      - If progress falls below about 0.18 or steering_oscillation rises above about
      0.2: return body_length to 0.18 m and keep sensor_size 0.016 m. Evidence: iteration
      2 (lighter body plus y=0.07) lost s-bend progress, and iteration 6 showed extra
      inertia also cuts progress, so the best measured inertia sits near the iteration
      4 value.

      - If body_length is inert (score within about 1 point of 58.5): test the sensor
      span at x = -0.07 to 0.07 m with 16 mm footprints and body_length 0.18 m. Evidence:
      iterations 1 to 4 showed that widening the span cut line loss, and line loss
      is still about 0.85 to 0.95 per run on the slalom and s-bend.


      - [Open this output](iteration-10/entityR1/versions/e5103f8036944d5ea689ca28e66a1ba6/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/9c050fc8ac644146ac021f761c117152/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-45efd482e1074289/payload.json)'
