overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor array
    notes: 'Symmetric five-sensor baseline with 12 mm footprints spaced 15 mm across
      the tape, placed 0.06 m ahead of the axle, on a compact 0.8 kg body. No race
      data exists yet, so this is an untuned starting point chosen from the contract
      ranges.


      ### Rationale


      Iteration 0 has no race telemetry or integration feedback, so this is a baseline
      built from the contract alone. Five sensors spread across +/-0.03 m cover the
      25 mm tape with overlap at the 12 mm footprint, so the line stays visible through
      small lateral offsets and the signal changes smoothly. Placing them 0.06 m ahead
      of the axle gives the controller some lead time before the wheels reach the
      tape. A 0.12 m wheel track and 0.03 m radius are mid-range values that should
      give a stable turn rate without very high yaw inertia. A 0.8 kg mass sits mid-range
      for a light, quick robot. Body width 0.12 m keeps the off-track limit at its
      0.06 m floor, and the outer sensors sit within it. I expect a completing run,
      though the baseline is untuned and the speed and line-loss numbers are unknown.


      - [Open this output](iteration-0/entity0/versions/b46a8bde40814727a307e24ad64da772/payload.json)'
  - id: entity1
    label: Baseline robot package
    notes: 'Builder''s baseline geometry with a moderate P-D controller, sensor weights
      matched to lateral position, and last-direction line recovery. Gains and speed
      are untuned starting values with no race evidence yet.


      ### Rationale


      Iteration 0 has no race telemetry, so the controller is built from the contract
      and the Builder''s baseline geometry (five sensors at x = -0.03 to 0.03 m, y
      = 0.06 m; 12 mm footprint; wheel_track 0.12 m; wheel_radius 0.03 m). The steering
      signal is a reading-weighted average of the sensor weights, so weights proportional
      to sensor x give a signal that is roughly the line''s lateral offset in sensor
      units. Weights [-2,-1,0,1,2] keep the sign convention right: a line under the
      left sensors (positive x) gives a positive signal, which steers left. Base speed
      is set to 1.8 (PWM about 3685) because the course must be covered in under 3
      s, roughly 1.5 m/s average, and 2 is the saturation point. Gains are moderate:
      kp 1.2 gives turn of about 1.2 at full signal, which is a 420 PWM-count wheel
      difference, enough to correct without saturating. kd 0.1 damps oscillation on
      the signal and ki 0.02 is small so the integral does not wind up on long bends.
      line_loss uses last_direction so the robot searches toward the side it last
      saw the line. Expected result: a completing run is plausible, but speed, line-loss
      count and oscillation are unknown until the race reports them.


      - [Open this output](iteration-0/entity1/versions/be23634a883743db81a9cc6992bf834f/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/b46a8bde40814727a307e24ad64da772/payload.json)'
  - id: entityR1
    label: Baseline integration
    notes: 'No earlier race exists, so the feedback is conditional on the next race:
      widen the sensor spread if line loss occurs, and shorten the forward offset
      and wheel track if steering oscillates.


      ### Feedback


      No race has run yet, so there is no earlier outcome to cite for this candidate,
      and this feedback makes no claim about its performance. Your geometry is a symmetric,
      five-sensor baseline, and I built the controller around it with weights [-2,-1,0,1,2]
      matched to sensor x, which is what the signal uses to steer. What I had to decide
      without evidence: base speed (1.8) and gain levels, because I have no speed
      or steering data from this robot yet. Plan for the next race: if line_loss_events
      is high or max_error grows on sharp bends, the sensor reach may be too narrow.
      Try a wider lateral spread (for example x up to plus or minus 0.04 m, within
      the body limit) before changing the body. If steering_oscillation is high while
      the robot stays on the line, the wheel_track or forward offset is probably the
      cause: try a shorter forward offset (y around 0.04 m) to reduce lag, or a wheel_track
      of 0.10 m to lower turn inertia. If the robot completes with low error, keep
      the geometry and move to a higher base speed to meet the time limit.


      ### Requested changes


      - If line_loss_events > 0 on sharp bends: widen the sensor spread to x = -0.04
      and 0.04 m (still 5 sensors), keeping sensor_size 0.012, since the baseline
      outer sensors may be reading flat on the 25 mm tape at high lateral offsets.
      No earlier race yet supports this; it is a planned response to the next race
      result.

      - If steering_oscillation is high with low max_error: shorten the forward offset
      to y = 0.04 m and reduce wheel_track to 0.10 m, to cut lag and yaw inertia.
      This is also untested and depends on the next race telemetry.


      - [Open this output](iteration-0/entityR1/versions/be23634a883743db81a9cc6992bf834f/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/b46a8bde40814727a307e24ad64da772/payload.json)'
