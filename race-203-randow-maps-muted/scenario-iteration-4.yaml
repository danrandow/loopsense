map:
  id: race-203-randow-maps-muted
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: 'Narrower track: 0.08 m'
    notes: 'Continues the wheel_track trend that lifted the score from 55.1 to 57.9
      in iteration 3, narrowing the track from 0.09 m to 0.08 m with all other geometry
      unchanged. Evidence: max_error still pins at the 0.06 m off-track floor on every
      track, and the s-bend gained progress when the track narrowed.


      ### Rationale


      Iteration 3 (wheel_track 0.09 m) is the best design so far at 57.9, up from
      55.1 for the iteration 1 baseline. The gain came from the s-bend (progress 0.163
      to 0.178, control effort up, max_error still at the 0.063 m floor), while the
      oval slipped slightly and slalom was flat. Every run still ends off_track, and
      max_error sits at the 0.06 m floor on all tracks, so the limit is still turn
      authority and tracking lag, not sensor coverage. Line loss is now rare (oval
      0, s-bend 0.1, slalom 1.0). Sensor lead at y=0.07 and the lighter short body
      both hurt in iteration 2, so I keep y=0.05, the 7-sensor, 16 mm, +/-0.06 m array,
      and the 0.18 m body at 0.8 kg. The off-track floor is fixed at 0.06 m for any
      allowed body width, so body width stays at 0.12 m. The one geometry lever that
      moved the result was wheel_track, since turn rate is (vR - vL)/wheel_track.
      I therefore continue that trend by one step, from 0.09 m to 0.08 m (the allowed
      minimum), and change nothing else, so the race isolates the turn-rate effect.
      Expected result: the s-bend and slalom progress rise further and max_error falls
      slightly, with a modest risk of more steering_oscillation. If oscillation climbs
      and progress does not improve, I will return to 0.09 m and test wheel_radius
      for ground speed instead.


      - [Open this output](iteration-4/entity0/versions/4880394057cc44929c354c939eececc6/payload.json)

      - Based on: [entityR2A](iteration-4/entityR2A/versions/carried-3745949444dd475a/payload.json)'
  - id: entity1
    label: Track 0.08m, kp scaled
    notes: 'Narrows wheel_track to the 0.08 m minimum as the Builder requested, with
      kp cut to 1.35 so yaw gain stays near iteration 3''s level. Based on iteration
      3 (57.9), where s-bend oscillation was already 0.169.


      ### Rationale


      Evidence: iteration 3 (wheel_track 0.09 m, kp 1.5, kd 0.25) is the best design
      at 57.9. Its s-bend progress rose to 0.178 and max_error sits at the 0.063 m
      floor, but steering_oscillation on the s-bend is already 0.169, above the 0.15
      caution level set in earlier feedback. Slalom still loses the line once per
      run. Every run ends off_track. The Builder''s requested wheel_track of 0.08
      m (contract minimum) raises yaw gain per unit of PWM differential by about 0.09/0.08
      = 1.125x, since turn rate is (vR - vL)/wheel_track. Left unchanged, kp would
      push the controller into more overshoot on the s-bend. I therefore scale kp
      by 1/1.125: 1.5 / 1.125 = 1.33, rounded to 1.35, so the effective yaw gain stays
      near the iteration 3 level. kd stays at 0.25 and ki at 0.02. Signal weights,
      base_speed 1.5 and last_direction line-loss handling are unchanged because iteration
      1 and 3 showed no gain from altering them. Sensors (7 at y=0.05, x ±0.06, 16
      mm), body (0.18 m x 0.12 m, 0.8 kg) and wheel_radius 0.03 m match iteration
      3, so the Builder''s single change is isolated. Expected: s-bend progress holds
      or rises, oscillation stays near 0.17 or below, and max_error falls slightly.
      Because kp is compensated, this race tests the track change at matched controller
      gain, not a raw turn-rate increase.


      - [Open this output](iteration-4/entity1/versions/271f5a5675e84cef98d323d34fac028c/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/4880394057cc44929c354c939eececc6/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-3745949444dd475a/payload.json)'
  - id: entityR1
    label: Keep 0.08m only if calm
    notes: 'Pre-race feedback: keep wheel_track 0.08 m only if s-bend progress rises
      and oscillation stays near 0.17; otherwise revert to 0.09 m with more mass,
      or test wheel_radius. Evidence from iterations 1 to 3.


      ### Feedback


      Written before this candidate has raced, so it states no outcome for it. Iteration
      3 (wheel_track 0.09 m, kp 1.5, kd 0.25) is the best so far at 57.9: s-bend progress
      rose from 0.163 to 0.178 and slalom stayed flat, while max_error stayed at the
      0.063 m floor on the s-bend and every run ended off_track. The s-bend already
      shows steering_oscillation 0.169, above the 0.15 caution level. Iteration 2
      showed that lighter, shorter bodies and a forward sensor lead (y=0.07) both
      cost points, so keep y=0.05 and mass 0.8 kg. Iteration 1 showed slalom line
      loss of 1.0 per run, which is still present. For the wheel_track 0.08 m step,
      I have scaled kp down to 1.35 so that the yaw gain per unit of differential
      matches iteration 3. That means the next race reads the track change at roughly
      matched controller gain. When the race reports: if s-bend progress rises above
      0.18 and steering_oscillation stays at or below about 0.17, the narrower track
      is helping and you can keep 0.08 m. If oscillation rises above about 0.2 or
      the first off-track event comes earlier on the s-bend, the turn is overshooting,
      so return to 0.09 m. If progress stays near 0.18 with max_error still at the
      0.06 m floor, the limit is ground speed, not turn rate.


      ### Requested changes


      - Keep wheel_track at 0.08 m only if the next race shows s-bend progress above
      0.18 and steering_oscillation at or below about 0.17. Evidence: iteration 3
      (0.09 m) gave s-bend progress 0.178 and oscillation 0.169; iteration 1 to 3
      showed that narrowing the track was the only geometry change that raised the
      score.

      - If steering_oscillation rises above about 0.2 or the s-bend off-track event
      comes earlier, return wheel_track to 0.09 m and raise mass from 0.8 kg to 0.9
      kg before changing sensors. Evidence: iteration 2''s lighter body (0.6 kg) cut
      s-bend progress from 0.163 to 0.119, so extra inertia is the safer damping lever.

      - If progress stays near 0.18 with max_error still at 0.06 m on the s-bend and
      slalom, change wheel_radius from 0.03 m to 0.035 m for more ground speed, keeping
      the track width of whichever value survives. Evidence: iterations 1 and 3 kept
      progress between 0.11 and 0.18 with no sign that turn rate alone is the limit.


      - [Open this output](iteration-4/entityR1/versions/271f5a5675e84cef98d323d34fac028c/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/4880394057cc44929c354c939eececc6/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-3745949444dd475a/payload.json)'
