map:
  id: loopsense-iteration-1
  schema: v0.2
  title: Loopsense Agent Team
  scenario: 'Iteration 1: run the @loopsense content loop end to end — does a structured
    return flow (ledger-driven engagement signal) produce a traceable change in the
    drafter''s next draft, and is that signal even readable at our audience size?'
  inherits: base.yaml
  notes: 'Skeleton created 2026-09-22 to let Dan start iteration 1 while the iteration-0

    retro runs in parallel. Carries forward iteration-0''s open items as the

    starting state; PM to set iteration 1''s actual question and update this

    scenario line once the retro has been read.


    **Open items carried from iteration-0 close:**

    - entity3 (Market Offer) not yet made — GTM gates unmet (PM confidence Low-Medium, gate requires Medium)

    - entityR4 / entityR4A (Practitioner usage & revenue) not yet reached — zero ICP contact across six research cycles

    - entityPrv3 (Community Map): X only, other channels not yet listened to

    - Retro (iteration-0 close): lightweight per-agent retros in progress, see agents/loopy/returns/retro-prompt-lightweight-v1.md;

      Loopy to synthesise once all four are filed, PM to decide what changes for iteration 1.

    '
dimensions:
  time_horizon: 2026-09
  iteration: '1'
overrides:
  actors: []
  entities:
    - id: entity0
      label: Loops fill the knowledge work verification gap (continue, mechanism untested)
      notes: 'PM decision: continue. Problem independently confirmed in the wild this
        iteration; mechanism has zero direct signal, positive or negative, because
        Delivery''s D1-D3 loop has never been run. Iteration 1''s job is to run it.
        Full entity: agents/pm/generates/entity0-v1.md'
    - id: entity1
      label: 'Bet certified: run the ten-post loop'
      notes: 'Exec certified PM''s continue decision; scoped to running Delivery''s
        existing spec, not the business model. Customer/ICP still unconfirmed.
        Full entity: agents/exec/generates/entity1-v1.md'
    - id: entityR1
      label: Certified; ICP gap flagged to PM
      notes: 'Low-medium on problem, low on mechanism. Missing entityR2A; entityR3B
        stale. Full entity: agents/exec/generates/entityR1-v1.md'
    - id: entity2
      label: 'Cleared to run; account handle unconfirmed'
      notes: 'Delivery confirms D1-D3 (entity2-v0) unchanged for iteration 1 - no GTM
        field requests or practitioner defects arrived. Cleared for GTM to run the
        ten-post loop. Flags one open blocker: no account handle confirmed in
        market-offer-strategy-v0.md. Full entity: agents/delivery/generates/entity2-v1.md'
    - id: entityR2
      label: Readiness check only; account-handle flag
      notes: 'No new build this iteration - GTM and Practitioners folders had no
        entityR3A/entityR4C. Feasibility: documents ready (high), loop execution
        gated on unconfirmed account handle. Full entity: agents/delivery/generates/entityR2-v1.md'
    - id: entityR3
      label: ICP search empty; ledger blocked on two Dan decisions
      notes: 'Seventh cycle, ICP-focused, still no supply-side signal. Ten-post
        ledger not run: posting gate needs Medium confidence (PM holds Low-Medium),
        and no account handle is confirmed. Both flagged to Dan.
        Full entity: agents/gtm/generates/entityR3-v1.md'
    - id: entity3
      label: 'Pre-release drafts only: replies + one thread, gate not cleared'
      notes: 'Dan asked GTM to draft candidate posts; written up for review, not
        posted. Blocked on PM Medium confidence per SKILL.md. Also flags that the
        account-handle blocker on entity2/entityR2 looks stale (@loopsense is live).
        Full entity: agents/gtm/generates/entity3-v1.md'
