map:
  id: race-193-randow-maps-muted
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Narrower track 0.09 m
    notes: 'Narrows wheel_track from 0.10 to 0.09 m on the iteration 5 layout (mass
      0.5 kg, 5 sensors at y=0.07 m, 16 mm, radius 0.04 m) to add turn authority on
      the s-bend. Iteration 6 showed mass 0.4 kg hurt s-bend progress (0.72 to 0.59)
      and scored no better, so mass returns to 0.5 kg.


      ### Rationale


      Evidence from the development results. Iteration 5 (mass 0.5 kg, 5 sensors at
      y=0.07 m, 16 mm footprint, track 0.10 m, radius 0.040 m) scored 422.9. Iteration
      6 cut mass to 0.4 kg and scored 422.1. The oval finish rate held at 95%, but
      s-bend progress fell from 0.72 to 0.59 and s-bend finishes dropped to 2 of 20
      (on 0.4 kg the s-bend got worse, not better). Mass is therefore no longer the
      lever, and 0.5 kg is the better operating point. Two bottlenecks remain. (1)
      On the s-bend, max_error sits at the 0.06 m off-track limit with about 1.1 line-loss
      events, which points to turn authority rather than sensing. (2) On the slalom,
      progress is about 0.14 and line losses are 1.85, which points to sensor coverage
      on alternating bends. The sensor layout has been tested in several forms, and
      the 5-sensor, y=0.07 m, 16 mm layout remains the best-supported. I therefore
      keep the sensors fixed and test one change against iteration 5: the wheel track,
      narrowed from 0.10 m to 0.09 m. Physically, yaw rate equals the wheel-speed
      difference divided by the track, so a narrower track gives about 11% more yaw
      rate for the same wheel-speed difference. The controller''s turn command is
      unchanged, so this only adds turn authority on tight bends. Mass returns to
      0.5 kg, the iteration 5 value, which had the better s-bend mean progress. Expected
      result: s-bend progress rises above 0.72 with fewer line-loss events and max_error
      below 0.06 m, and the oval finish rate stays at or above 90%. The risk is more
      steering oscillation on the oval, since higher turn rate can overshoot.


      - [Open this output](iteration-7/entity0/versions/fe9179f953034365bcd2e273568a687e/payload.json)

      - Based on: [entityR2A](iteration-7/entityR2A/versions/carried-e03b5b9538cb2fec/payload.json)'
  - id: entity1
    label: Narrow track to 0.09 m
    notes: 'Integrated the Builder''s single-variable test: wheel_track 0.10 to 0.09
      m on the iteration 5 layout, with the iteration 5 controller kept unchanged
      so the track is the only variable. Based on iteration 5 (422.9) being the best
      race and iteration 6 showing mass 0.4 kg hurts s-bend progress.


      ### Rationale


      The race evidence favours iteration 5 (mass 0.5 kg, score 422.9). Iteration
      6 cut mass to 0.4 kg and scored 422.1: oval finish held at 95%, but s-bend progress
      fell from 0.72 to 0.59 and s-bend finishes dropped to 2 of 20. So 0.5 kg stays.
      The remaining s-bend limit is turn authority, not sensing: max_error sits at
      the 0.06 m off-track limit with about 1.1 line-loss events. The slalom limit
      is sensor coverage on alternating bends (1.85 line-loss events, progress about
      0.14). The Builder''s single-variable test narrows wheel_track from 0.10 m to
      0.09 m, which raises yaw rate per wheel-speed difference by about 11%. I keep
      the geometry as the Builder specified: five sensors at y=0.07 m, x = -0.036
      to 0.036 in 0.018 m steps, 16 mm footprints, radius 0.040 m, mass 0.5 kg. For
      the controller, I keep every iteration 5 setting unchanged (kp 3.5, ki 0.05,
      kd 0.5, base_speed 1.6, weights [-2,-1,0,1,2], last_direction). Scaling kp down
      by 0.09/0.10 would cancel the extra turn authority the test is meant to measure,
      so I leave it. The track change is then the only variable against iteration
      5. Expected, not measured: s-bend progress above 0.72, s-bend max_error below
      0.06 m, and oval finish at or above 90%. The main risk is more steering oscillation,
      because the effective steering gain rises about 11%.


      - [Open this output](iteration-7/entity1/versions/8243c6931596436d86df24998b246076/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/fe9179f953034365bcd2e273568a687e/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-e03b5b9538cb2fec/payload.json)'
  - id: entityR1
    label: Track and sensor next
    notes: 'Feedback written before the race: it keeps mass at 0.5 kg, gives a conditional
      wheel_track 0.08 m step if s-bend max_error falls, and an outer-sensor step
      at ±0.045 m if slalom line losses stay near 1.85. The spread step is flagged
      as untested because iteration 1 showed spread alone did not help at y=0.04 m.


      ### Feedback


      Written before this robot has raced, so no outcome is claimed. Evidence: iteration
      5 (mass 0.5 kg, track 0.10 m) scored 422.9 with oval finish 95%, s-bend progress
      0.72, and s-bend max_error at the 0.06 m limit (0.063). Iteration 6 (mass 0.4
      kg) lowered s-bend progress to 0.59 and s-bend finishes to 2 of 20, so 0.5 kg
      is the right mass and should not go lower. The Builder''s wheel_track 0.09 m
      raises effective steering gain by about 11%, and I have kept the iteration 5
      controller unchanged, so the track change is the only variable. Depending on
      the next race: if s-bend max_error falls below 0.06 m and steering_oscillation
      stays at or under 0.3, turn authority was the limit, so try wheel_track 0.08
      m next. If s-bend max_error stays at about 0.06 m with steering_oscillation
      above 0.32, the controller gain is now the limit, and I will retune kp/kd on
      my side rather than change the geometry again. If slalom line_loss_events stay
      near 1.85 whatever the track does, sensor coverage is the limit, and the next
      geometry step is outer sensors at x = ±0.045 m. Iteration 1 showed that spread
      alone at y=0.04 m did not cut line losses, so that step is an untested hypothesis
      at y=0.07 m with 16 mm footprints.


      ### Requested changes


      - Keep the iteration 5 mass of 0.5 kg and the 0.040 m wheel radius. Iteration
      6 showed 0.4 kg lowers s-bend progress (0.72 to 0.59), and iteration 4 to 5
      showed the radius gain lifts the oval finish rate.

      - If s-bend max_error falls below 0.06 m with steering_oscillation at or under
      0.3, try wheel_track 0.08 m (the allowed minimum) for more turn authority. Iteration
      5 showed inertia reduction helped the bends, and this continues that trend.

      - If slalom line_loss_events stay at 1.85 or higher, widen the outer sensors
      to x = ±0.045 m (x = -0.045, -0.0225, 0, 0.0225, 0.045) at y=0.07 m with the
      16 mm footprint. This is an untested hypothesis: iteration 1 showed spread alone
      did not reduce line losses at y=0.04 m.


      - [Open this output](iteration-7/entityR1/versions/8243c6931596436d86df24998b246076/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/fe9179f953034365bcd2e273568a687e/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-e03b5b9538cb2fec/payload.json)'
