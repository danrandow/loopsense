  entities:
  - id: entity0
    label: Baseline 5-sensor
    notes: 'Symmetric five-sensor baseline with 12 mm sensors spread across 48 mm,
      placed 40 mm ahead of the axle, on a 0.12 m track with 0.8 kg mass. No race
      data yet, so this is a neutral starting point to test the stated hypotheses.


      ### Rationale


      Iteration 0 has no race telemetry and no integration feedback yet, so this is
      a neutral baseline rather than a tuned design. Five sensors are spread across
      0.048 m, which covers the 25 mm tape with margin at any lateral offset up to
      about 24 mm, so the line stays visible on bends. The sensors sit 0.04 m ahead
      of the axle so the controller sees the line before the wheels reach it. The
      12 mm footprint is small enough to resolve edges and large enough to avoid dropouts.
      The track width of 0.12 m and the 0.03 m wheel radius give a moderate turn authority
      with stable yaw. The body width of 0.12 m gives an off-track limit of max(0.06,
      0.0125+0.03)=0.06 m, which is a little generous. Mass 0.8 kg keeps inertia low
      for quick response. Expected result: completion on the development tracks with
      modest line error. This is a hypothesis to test, not a proven optimum.


      - [Open this output](iteration-0/entity0/versions/427b2b39c417455ab19def4acbe891af/payload.json)'
  actions:
  - id: action0
