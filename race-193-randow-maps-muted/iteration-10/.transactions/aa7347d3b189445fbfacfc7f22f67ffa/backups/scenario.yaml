  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Scores so far: iteration 5 (422.9) and iteration 6 (422.1) are the best designs.
      Both use 5 sensors at y=0.07 m, 16 mm footprint, track 0.10 m, radius 0.040
      m. Iteration 6 cut mass to 0.4 kg and gave the same score, with worse s-bend
      progress (0.59 vs 0.72), so 0.5 kg stays. Iteration 7 (track 0.09 m) cut the
      oval finish rate to 60% and is ruled out. Iteration 8 (outer sensors at ±0.045
      m) fell to 309: oval finish dropped to 65%, and slalom line losses (1.0) and
      progress did not improve on iteration 5. So I revert the spread to ±0.036 m.
      Wheel radius is the one drivetrain lever that has paid off consistently: 0.035
      to 0.040 m raised oval finish from 65% to 80%, and mean oval time fell to about
      1.7 s. Radius is also untested beyond 0.040 m. This iteration keeps the iteration
      5 layout and sets radius to 0.045 m, the only change. Expected result: oval
      finish holds at or above 95%, completion time falls further, and the s-bend
      and slalom stay limited by off-track exits. The risk is that higher ground speed
      outruns the steering on tight bends, which would show as more s-bend off-track
      exits and a higher max_error.


      - [Open this output](iteration-9/entity0/versions/012117dbbd704957adaaf4d1bcfb56b6/payload.json)

      - Based on: [entityR2A](iteration-9/entityR2A/versions/carried-09a0fcbac44b2596/payload.json)'
  - id: entity1
    label: Complete Robot Package
    notes: 'Complete Robot Package. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      The best-supported design is iteration 5 (score 422.9): five sensors at y=0.07
      m, x = ±0.036 m, 16 mm footprint, track 0.10 m, mass 0.5 kg, radius 0.040 m.
      Iteration 4 showed radius 0.035 to 0.040 m lifted oval finish from 65% to 80%.
      Iteration 5 showed mass 0.6 to 0.5 kg lifted it to 95%. Iteration 6 (0.4 kg)
      cut s-bend progress from 0.72 to 0.59, and iteration 7 (track 0.09 m) cut oval
      finish to 60%, so both stay ruled out. Iteration 8 (spread ±0.045 m) cut slalom
      line losses from 1.85 to 1.0 but dropped oval finish to 65%, so spread was not
      free. This iteration makes one change against iteration 5: wheel_radius 0.040
      to 0.045 m, as the Builder specified. The controller is kept at the iteration
      5 values (kp 3.5, ki 0.05, kd 0.5, base_speed 1.6, weights [-2,-1,0,1,2], last_direction).
      The larger radius raises ground speed per wheel rotation by about 12%. The steering
      gains are not rescaled, since the wheel radius does not change the turn equation.
      Expected, not measured: oval finish holds at or above 95% and completion time
      drops. The risk is more off-track exits on the s-bend and slalom if speed outruns
      steering. I have not measured this design.


      - [Open this output](iteration-9/entity1/versions/facac6e0de2a4dcb88b3adc47a7669bd/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/012117dbbd704957adaaf4d1bcfb56b6/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-09a0fcbac44b2596/payload.json)'
  - id: entityR1
    label: Integration Feedback
    notes: 'Integration Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Written before this candidate has raced, so no outcome is claimed. I kept the
      iteration 5 controller unchanged (kp 3.5, kd 0.5, ki 0.05, weights [-2,-1,0,1,2]),
      because the wheel radius does not change the steering equation, and the radius
      change is then the only variable. Evidence: iteration 4 (radius 0.035 to 0.040
      m) lifted oval finish from 65% to 80%, and iteration 5 (mass 0.5 kg) lifted
      it to 95% with oval mean time 1.71 s, so there is margin to spend on speed.
      Iteration 6 (0.4 kg) and iteration 7 (track 0.09 m) both lowered performance,
      so do not move mass or track further down. Depending on the next race: if oval
      finish holds at 95% or more and s-bend off-track exits do not rise, keep radius
      0.045 m and move to 0.050 m, the contract limit. If oval finish falls or s-bend
      and slalom off-track exits rise while max_error stays near 0.06 m, speed is
      outrunning steering, so return to radius 0.040 m and widen wheel_track to 0.11
      m for yaw stability. This widening is an untested hypothesis, reasoned from
      iteration 7, where narrowing the track to 0.09 m raised oscillation and cut
      oval finish to 60%. If slalom line losses stay near 1.85 with the radius change
      alone, the slalom limit is sensor coverage, not speed.


      ### Requested changes


      - If oval finish rate holds at 95% or more with no rise in s-bend off-track
      exits, raise wheel_radius from 0.045 to 0.050 m (the contract maximum). Iteration
      4 showed radius 0.035 to 0.040 m lifted oval finish from 65% to 80%, and iteration
      5 kept it at 95%, so speed is still paying off.

      - If oval finish or s-bend progress falls while max_error stays near 0.06 m,
      return wheel_radius to 0.040 m and try wheel_track 0.11 m for more yaw stability.
      This is untested: iteration 7 showed that narrowing the track to 0.09 m hurt
      oval finish (95% to 60%), so widening it is the reverse, reasoned step.

      - If the radius change holds oval finish, retest the outer spread at radius
      0.045 m: x = ±0.045 m at y=0.07 m with 16 mm footprints. Iteration 8 showed
      this spread cut slalom line losses from 1.85 to 1.0, but the oval fell to 65%
      at radius 0.040 m, so the extra speed may now absorb the cost.


      - [Open this output](iteration-9/entityR1/versions/facac6e0de2a4dcb88b3adc47a7669bd/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/012117dbbd704957adaaf4d1bcfb56b6/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-09a0fcbac44b2596/payload.json)'
