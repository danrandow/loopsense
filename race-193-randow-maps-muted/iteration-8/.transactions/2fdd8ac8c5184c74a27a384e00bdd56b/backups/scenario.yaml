overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Evidence from the development race history:

      - Iteration 5 (5 sensors at y=0.07 m, 16 mm footprint, track 0.10 m, radius
      0.040 m, mass 0.5 kg) is the best design at 422.9. Its oval finish rate is 95%,
      and its s-bend progress is 0.72.

      - Iteration 6 (mass 0.4 kg) scored about the same (422.1). Oval held, but s-bend
      progress fell to 0.59. Mass 0.5 kg is the better operating point.

      - Iteration 7 (track 0.09 m) scored 347. The oval finish rate fell from 95%
      to 60% and s-bend progress fell to 0.57. Narrowing the track adds turn authority
      but also oscillation and overshoot, so I revert it to 0.10 m.


      The remaining gap is slalom. It has about 0.14 progress and about 1.85 line-loss
      events per run. Its failures look like sensor coverage on alternating bends:
      the outer sensors lose the tape at about 0.0565 m offset, which is close to
      the 0.06 m off-track limit. Iteration 3 showed that adding sensor spread alongside
      forward look-ahead at y=0.08 m overshoots and hurts the oval. Iteration 1 widened
      the spread at y=0.04 m with a 12 mm footprint, and that did not help. This iteration
      therefore changes only the outer spread, from ±0.036 m to ±0.045 m, with 5 sensors
      at 0.0225 m pitch and the same 16 mm footprint and y=0.07 m. Outer coverage
      rises to about 0.0655 m offset. All other values stay at the iteration 5 settings,
      so this is a one-variable test against iteration 5.


      - [Open this output](iteration-8/entity0/versions/4376a792e38547779d8d343758f00037/payload.json)

      - Based on: [entityR2A](iteration-8/entityR2A/versions/carried-162afab160142b9f/payload.json)'
  - id: entity1
    label: Wider outer sensors
    notes: 'Iteration 5 controller and drivetrain, with outer sensors moved to ±0.045
      m at 0.0225 m pitch to test whether the slalom line losses (1.85) come from
      blind outer sensors. Controller is unchanged so the spread is the single variable,
      as the Builder''s test requires.


      ### Rationale


      The evidence in the outcome table points to iteration 5 (score 422.9) as the
      best design. Its oval finish rate is 95%, and the remaining gap is slalom: 1.85
      line-loss events and progress of about 0.14. Iteration 2 showed that 16 mm sensors
      at y=0.07 m helped, and iteration 1 showed that spread alone at y=0.04 m did
      not. The Builder''s test widens the outer sensors from ±0.036 m to ±0.045 m
      at the same y=0.07 m and 16 mm footprint, which should keep tape visible to
      about 0.0655 m offset. Iteration 3 showed that extra look-ahead with a wide
      array raised oscillation and cut the oval finish rate, so this test keeps the
      iteration 5 forward offset and drivetrain (track 0.10 m, radius 0.040 m, mass
      0.5 kg). I kept the controller identical to iteration 5 (kp 3.5, ki 0.05, kd
      0.5, base_speed 1.6, last_direction, weights [-2,-1,0,1,2]) so the spread is
      the only variable. The weights are unchanged because they are index-based and
      the 0.0225 m pitch keeps the same gradient. Expected, not measured: slalom line-loss
      events below 1.85 and oval finish at or above 90%. If the oval falls, the spread
      is adding steering lag. The feedback to the Builder covers the revert path.


      - [Open this output](iteration-8/entity1/versions/c134f4f294434c46a020d3c1ef41e318/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/4376a792e38547779d8d343758f00037/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-162afab160142b9f/payload.json)'
  - id: entityR1
    label: 'Spread test: keep or'
    notes: 'Feedback gives branches for the next race: keep the wider spread if slalom
      line losses fall and the oval holds, revert to ±0.036 with a 0.045 m radius
      if the oval drops. Evidence is from iterations 1, 2, 3, 4, 6 and 7.


      ### Feedback


      Written before this candidate has raced, so no outcome is claimed. Integration
      compensation: I kept the iteration 5 controller exactly (kp 3.5, kd 0.5, ki
      0.05, weights [-2,-1,0,1,2]), so the spread change is isolated. The weights
      are index-based, so the 0.0225 m pitch keeps the same gradient and no rescaling
      is needed. Evidence: iteration 5 (score 422.9) has the best oval finish (95%)
      and slalom line losses of 1.85. Iteration 2 showed that 16 mm sensors at y=0.07
      m helped, iteration 1 showed that spread alone at y=0.04 m did not, and iteration
      3 showed that y=0.08 m with seven sensors raised oscillation and cut the oval
      finish rate to 35%. Depending on the next race: if slalom line_loss_events drop
      below 1.85 and the oval finish stays at or above 90%, keep ±0.045 m, since the
      outer coverage was the slalom limit. If the oval finish falls below 90% and
      slalom does not improve, the spread is adding steering lag, so revert to ±0.036
      m and stop widening. If steering_oscillation rises above 0.32 while max_error
      does not move, the gain is the limit, and I will retune kd on my side rather
      than change geometry.


      ### Requested changes


      - If slalom line_loss_events fall below 1.85 and the oval finish rate stays
      at or above 90%, keep ±0.045 m at y=0.07 m with 16 mm footprints and try x =
      ±0.050 m (0.025 m pitch). Iteration 2 showed that look-ahead with 16 mm sensors
      gave the first real gain, and this extends the same coverage logic outward.

      - If the oval finish rate falls below 90% while slalom line losses do not improve,
      revert the outer sensors to ±0.036 m (iteration 5 layout) and raise wheel_radius
      from 0.040 to 0.045 m. Iteration 4 showed that radius lifted the oval finish
      rate from 65% to 80%, so speed is the cheaper fix than more spread.

      - Keep wheel_track at 0.10 m and mass at 0.5 kg for this step. Iteration 6 showed
      0.4 kg lowered s-bend progress (0.72 to 0.59), and iteration 7 showed 0.09 m
      track hurt the oval finish rate (95% to 60%).


      - [Open this output](iteration-8/entityR1/versions/c134f4f294434c46a020d3c1ef41e318/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/4376a792e38547779d8d343758f00037/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-162afab160142b9f/payload.json)'
