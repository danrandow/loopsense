  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: 'Final: restore iter 5'
    notes: 'Resubmits the best-scoring geometry (iteration 5, score 422.9: 5 sensors
      at y=0.07, ±0.036 m, 16 mm footprint, track 0.10 m, radius 0.040 m, mass 0.5
      kg) with no changes. Every later single-variable test scored lower, so the safest
      choice for the final unseen-track race is to hold this layout.


      ### Rationale


      The best-supported design is still iteration 5 (score 422.9). Its layout is
      5 sensors at y=0.07 m spanning x=±0.036 m with a 16 mm footprint, track 0.10
      m, wheel radius 0.040 m, mass 0.5 kg, and body 0.16 x 0.12 m. Every later single-variable
      test has scored lower or only matched it: mass 0.4 kg gave 422.1 with worse
      s-bend progress, track 0.09 m gave 347 with the oval finish falling to 60%,
      outer spread ±0.045 m gave 309, radius 0.045 m gave 390, and seven sensors at
      12 mm pitch gave 331. Iteration 5 therefore remains the safest geometry to carry
      into the final unseen-track race. I keep it unchanged rather than add an untested
      variation, since the final race is scored once and cannot be repeated. The known
      weak points (s-bend off-track at max_error near 0.06 m, and slalom progress
      near 0.14 with about 1.85 line losses) are the controller''s to address through
      gains and line-loss handling, and the Integrator can work on them without any
      geometry change. Expected result: about 420 to 425 on the development tracks,
      with oval finish near 95%.


      - [Open this output](iteration-11/entity0/versions/eb8dc10984594372b0ec53a58539dd4b/payload.json)

      - Based on: [entityR2A](iteration-11/entityR2A/versions/carried-bdeb42d61c919159/payload.json)'
  - id: entity1
    label: 'Final: reference robot'
    notes: 'Holds the iteration 5 geometry and its controller unchanged, because it
      is the best-evidenced design (score 422.9) and every tested variant scored lower.
      No controller gain change is made without measured evidence on this body.


      ### Rationale


      This is the final iteration, so the Builder''s fixed reference geometry (iteration
      5) is kept exactly: five sensors at y=0.07 m, x = -0.036 to 0.036 m in 0.018
      m steps, 16 mm footprints, track 0.10 m, wheel radius 0.040 m, mass 0.5 kg,
      body 0.16 x 0.12 m. The controller is the iteration 5 controller unchanged (kp
      3.5, ki 0.05, kd 0.5, base_speed 1.6, weights [-2,-1,0,1,2], last_direction).
      Across the design history this combination is the only one that delivered a
      high oval finish (95%), a strong s-bend progress (0.72) and the best score (422.9).
      Each controller or geometry variant tested since then lowered the score: mass
      0.4 kg (422.1, s-bend progress 0.59), track 0.09 m (347), radius 0.045 m (390),
      outer spread 0.045 m (309), and seven sensors at 12 mm pitch (331, the most
      recent race). Iteration 10''s seven-sensor telemetry does not transfer to the
      five-sensor reference, and no controller gain change has been measured on this
      body. Because the final unseen-track race is scored once and cannot be repeated,
      I make no untested gain change. Any change to kp, kd or line_loss would be a
      guess, and a higher kp risks the s-bend overshoot the evidence already shows
      (max_error pinned near 0.06 m with oscillation near 0.29). Expected result on
      the development tracks is close to the iteration 5 outcome (about 420 to 425),
      with oval finish near 95%. This is a prediction only, not a measured result.


      - [Open this output](iteration-11/entity1/versions/27da9361a36b44e085b2534b550c553c/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/eb8dc10984594372b0ec53a58539dd4b/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-bdeb42d61c919159/payload.json)'
  - id: entityR1
    label: 'Final: hold geometry'
    notes: 'Advises holding the iteration 5 geometry because iterations 6 to 10 each
      lowered the score from that reference. No further iterations follow, so the
      feedback is advisory.


      ### Feedback


      Written before this robot has raced, and there are no further iterations after
      this one, so this feedback is advisory only. The geometry is held at the iteration
      5 reference, which is the best-evidenced layout (score 422.9, oval finish 95%).
      Iteration 10 (seven sensors at 12 mm pitch) scored 331.2 and did not reduce
      slalom line losses, so denser sensing is not supported. Iteration 9 (radius
      0.045 m) fell to 389.9, and iteration 8 (outer spread 0.045 m) fell to 309.4.
      Iteration 6 (mass 0.4 kg) and iteration 7 (track 0.09 m) also lowered the score,
      so no single-variable geometry change has beaten iteration 5. I made no controller
      change, since none has been measured on this body. The known weak points, s-bend
      off-track at max_error near 0.06 m and slalom line losses near 1.85, are for
      the controller side to address, and a geometry change would be an untested gamble
      on the final race. If the Integrator reports that s-bend or slalom off-track
      exits dominate, that points to line-loss handling and gain choice, not sensing,
      so the geometry should stay as it is.


      ### Requested changes


      - Hold the iteration 5 geometry exactly (five sensors at y=0.07 m, x = -0.036
      to 0.036 m, 16 mm footprints, track 0.10 m, radius 0.040 m, mass 0.5 kg). Iterations
      6 to 10 each lowered the score from this reference, and the final race is scored
      once.

      - If any future development result were available, test only one variable at
      a time against iteration 5, for example sensor y at 0.06 m with the same spread,
      since iteration 3 showed that y=0.08 m raised oscillation and cut the oval finish
      rate.

      - Do not widen the outer spread beyond 0.036 m or change the track or radius
      without evidence, since iterations 7, 8 and 9 each cost oval finish rate.


      - [Open this output](iteration-11/entityR1/versions/27da9361a36b44e085b2534b550c553c/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/eb8dc10984594372b0ec53a58539dd4b/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-bdeb42d61c919159/payload.json)'
