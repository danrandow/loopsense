    label: Initial balanced geometry
    notes: 'Proposed a moderate-sized robot with 5 evenly spaced medium sensors to
      provide good line detection and stable handling. Requested key performance measurements
      to evaluate line following and completion.


      ### Rationale


      Since this is the first iteration, we have no integration feedback or race telemetry
      yet. To start, I propose a balanced geometry with moderate body size and mass,
      a mid-sized sensor array with 5 sensors evenly spaced across the front, and
      medium sensor size. This configuration aims to provide good line detection coverage
      and stable handling without excessive mass or size that could hinder maneuverability.
      The wheel radius and track are set to mid-range values to balance speed and
      stability. The intent is to establish a baseline geometry that is neither extreme
      nor minimal, allowing the integrator to build a controller and gather initial
      race data. The hypotheses are that this geometry will enable the robot to follow
      the line reliably and complete a significant portion of the track. I request
      measurements of completion, progress, completion_time, rms_error, and line_loss_events
      to evaluate line following performance and identify any issues with sensor coverage
      or robot stability.


