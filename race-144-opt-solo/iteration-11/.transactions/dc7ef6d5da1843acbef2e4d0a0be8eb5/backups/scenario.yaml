  - id: entity0
    label: kd 0.9 on best design
    notes: 'Iteration 10 best design (score 678.6) with kd raised from 0.8 to 0.9
      to add damping on slalom bends, where progress rose with each kd step. Oval
      completion held at 20/20 in the earlier race, and oscillation is the main risk.


      ### Rationale


      Evidence: iteration 10 (score 678.6, best so far) is the iteration 9 design
      with kd raised from 0.6 to 0.8. Its s-bend progress rose from 0.82 to 0.99 with
      19/20 finishes, its slalom progress rose from 0.38 to 0.48, and the oval stayed
      at 20/20 with 2.13 s finishes. Slalom is still 0/20 (off_track), so the remaining
      gap is on the tightest bends. Every earlier attempt to raise kp or ki (iterations
      3 and 4) hurt the oval, and changes to sensor span (iteration 6) and base_speed
      away from 1.1 (iterations 7 and 8) also hurt. The only change that has consistently
      helped in the last steps is damping, with kd moving from 0.6 to 0.8 improving
      both bend tracks.


      Change (one variable, controller only): kd 0.8 -> 0.9. Extra derivative action
      should keep reducing the lag-driven overshoot that pushes the robot past the
      0.06 m limit on slalom. Geometry, kp, ki, base_speed, sensor weights and line_loss
      match iteration 10, so any change in slalom and s-bend progress can be read
      as a derivative effect. This is a modest step, since steering_oscillation on
      the s-bend already rose to about 0.51 at kd 0.8.


      Expected result: slalom progress rises toward 0.55 with some finishes, s-bend
      holds at 18 to 19 of 20 finishes, and oval holds at 20/20. Steering oscillation
      may rise to about 0.6, which is acceptable if completion improves.


      Hypotheses: H1, kd 0.9 raises slalom progress and lowers max_error on the tightest
      bends. H2, the oval finish rate holds because straight-line behaviour is dominated
      by kp. H3, if steering_oscillation exceeds about 0.7 without a progress gain,
      kd has passed its optimum and 0.8 is the best setting.


      Next measurements: completion and progress per track (especially slalom finishes),
      max_error and rms_error (is the lag reduced), steering_oscillation (is derivative
      action amplifying jitter), line_loss_events, and completion_time.


