  entities:
  - id: entity0
    label: Iter 5 geometry, speed
    notes: 'Reverts to the best-scoring geometry (7 sensors at 0.025 m spacing, score
      521.7) and changes only base_speed from 1.1 to 1.0. This tests whether slower
      bends let s-bend and slalom progress rise. The wider, forward array from iteration
      6 scored lower (424).


      ### Rationale


      Evidence. Iteration 5 (score 521.7) is the best design so far: seven sensors
      at x = -0.075 to +0.075 m (0.025 m spacing), y = 0.07 m, sensor size 0.016 m,
      kp 5.0, kd 0.6, ki 0, base_speed 1.1. It finishes the oval 20/20 at 1.99 s,
      reaches s-bend progress 0.78 (5/20 finishes) and slalom progress 0.40. Denser
      sensing was the one change that clearly helped. Iteration 6 widened the array
      to x = +/-0.08 m and moved it forward to y = 0.08 m. That dropped s-bend progress
      to 0.47 and slalom to 0.32, and the score fell to 424. So the wider, more forward
      array is worse, and I am reverting to the iteration 5 geometry. All remaining
      failures are off_track with max_error 0.059 to 0.064 m, just past the fixed
      0.06 m limit, with low steering oscillation (0.25 to 0.43). The robot lags on
      bends rather than jittering. Iterations 3 and 4 showed that raising kp or kd,
      or adding ki, hurt the oval, so I keep the gains.


      Change (one variable, controller only): base_speed 1.1 -> 1.0. On the tightest
      bends the robot is still too fast for its correction. Iteration 4 lowered speed
      together with a gain change, so its effect was never isolated. Here the geometry
      and gains match iteration 5, so any change in s-bend and slalom progress can
      be read as a speed effect. Oval time should rise from about 1.99 s to about
      2.2 s, which still leaves room under the 3 s limit.


      Expected result: s-bend progress and finishes rise (target 0.85 or more, and
      at least 5 finishes out of 20). Slalom progress rises a little. Oval stays at
      20/20. Score should rise modestly, or hold if the time cost dominates.


      Hypotheses: H1, a slightly lower speed lets the existing proportional and derivative
      action keep the robot on the line through tight bends. H2, the oval finish rate
      holds, since the loop is unchanged apart from speed. H3, the time cost stays
      small, so the completion gain outweighs it.


      Next measurements: completion and progress per track (do s-bend and slalom finish
      more often), completion_time (the cost of the slower speed), max_error and line_loss_events
      (where the line is still lost), and steering_oscillation (whether the loop is
      stable at this speed).


