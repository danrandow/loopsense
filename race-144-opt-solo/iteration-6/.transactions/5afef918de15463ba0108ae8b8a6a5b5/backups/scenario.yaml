  entities:
  - id: entity0
    label: Wider 7-sensor array
    notes: 'Keeps iteration 5''s controller and widens the 7-sensor array to x = ±0.08
      m and y = 0.08 m, to see the line earlier on bends. Iteration 5 raised s-bend
      progress from 0.37 to 0.78, so denser sensing is the lever that worked.


      ### Rationale


      Evidence: iteration 5 is the best design so far (521.7). Seven sensors at 0.025
      m spacing lifted s-bend progress from 0.37 to 0.78 (5/20 finishes) and slalom
      progress from 0.19 to 0.40, with the oval still 20/20. The denser array with
      the same controller is the one change that clearly helped, so sensing is the
      main lever. All remaining failures are off_track with max_error about 0.059
      to 0.064 m, which is just past the fixed 0.06 m limit, and steering oscillation
      is low (0.25 to 0.43). The robot is lagging behind bends, not jittering. Iterations
      3 and 4 showed that raising kp or kd, or adding ki, hurt the oval, so I keep
      the controller gains unchanged. Geometry change: widen the array to x = +/-0.08
      m (spacing about 0.027 m, the 7 sensors at x = -0.08, -0.053, -0.027, 0, 0.027,
      0.053, 0.08) and move it forward to y = 0.08 m. The wider span lets the array
      see the line further out during bends, and the forward position gives more lead
      before the wheels reach the curve. Weights stay at -2 to +2 in steps of 0.667
      (the same as iteration 5). Because the span grows about 7 percent, the effective
      steering gain rises slightly, which is an accepted side effect. The sensor size
      stays at 0.016 m so the line-loss threshold is still met. Expected result: s-bend
      progress above 0.9 with more finishes, slalom progress above 0.5, and max_error
      below 0.055 m. The oval should stay at 20/20 with completion_time about 2.0
      s. Hypotheses: H1, a wider and more forward array reduces the lag-driven drift
      on bends. H2, the 7 percent extra gain does not destabilise the oval, since
      steering oscillation is still low. H3, the remaining slalom failures come from
      sensing range, not from gain. Next measurements: completion and progress per
      track, max_error and rms_error (is the lag reduced), line_loss_events (are dropouts
      fewer), steering_oscillation (is the stiffer effective gain causing jitter),
      and completion_time.


