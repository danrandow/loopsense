  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence: the best design so far (iteration 2, score 391.8) finishes the oval
      reliably (20/20, mean 939 points, 1.98 s) but leaves the line on the s-bend
      (progress 0.37) and slalom (progress 0.19). Every failing run ends off_track
      with max_error about 0.063 m, just past the 0.06 m limit. The off-track limit
      is max(0.06, 0.0125 + body_width/4), which is 0.06 m for any body width up to
      about 0.19 m, so it cannot be widened. Steering oscillation is low (0.19 to
      0.22 on the failing tracks), so the robot is not jittering. It is lagging behind
      the bends and drifting out. Line loss is 0.25 to 1.0 events, which means the
      sensor array only loses the line after the robot is already far off. Sensing
      range is not the main limit. Iteration 2 also lowered base_speed (1.3 to 1.1)
      and s-bend progress fell from 0.58 to 0.37, so slowing down alone does not fix
      the bends.


      Changes: (1) kp 5.0 to 6.0 for stronger correction on tight bends, where the
      robot currently lags. (2) kd 0.6 to 0.8 to damp the larger correction, since
      oscillation is low and there is room to add damping. (3) ki 0.0 to 0.3. The
      contract describes a fixed left/right motor mismatch, which produces a steady
      drift to one side that proportional control alone must hold against. A small
      integral term can cancel it. The integral is limited to +/-2, so windup is bounded.
      (4) base_speed, geometry, sensor weights and line_loss are unchanged, so the
      effect of the gain changes can be read directly.


      Expected result: max_error below 0.055 on s-bend and slalom, slalom progress
      above 0.5, s-bend completion possible. Oval completion should hold, with completion_time
      staying near 2.0 s. Hypotheses: H1, higher kp reduces the lag-driven drift on
      tight bends. H2, ki removes the steady bias from the motor mismatch, lowering
      rms_error on straights. H3, kd 0.8 keeps the stiffer loop from oscillating.
      Next measurements: completion and progress per track (did the s-bend and slalom
      finish), max_error and rms_error (is the bias removed), steering_oscillation
      (is kp 6 with kd 0.8 too stiff), and completion_time (cost of the stiffer loop).


      - [Open this output](iteration-3/entity0/versions/70d78ceab4eb45e1b230f4e63e18e73a/payload.json)

      - Based on: [entityR2A](iteration-3/entityR2A/versions/carried-7c42ff68c00e171f/payload.json)'
