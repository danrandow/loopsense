  entities:
  - id: entity0
    label: Speed 1.2 on best array
    notes: 'Keeps the iteration 5 geometry and gains, which scored best (521.7), and
      raises base_speed from 1.1 to 1.2. Iteration 7 showed that lowering speed to
      1.0 reduced s-bend progress (0.78 to 0.59), so this tests the opposite direction.


      ### Rationale


      Evidence. Iteration 5 (score 521.7) is still the best design: seven sensors
      at x = -0.075 to +0.075 m (0.025 m spacing), y = 0.07 m, sensor size 0.016 m,
      kp 5.0, kd 0.6, ki 0, base_speed 1.1. It finishes the oval 20/20 in about 1.99
      s and reaches s-bend progress 0.78 and slalom progress 0.40. Every failure is
      off_track with max_error 0.059 to 0.064 m, just past the fixed 0.06 m limit.
      Steering oscillation is low to moderate (0.24 to 0.43), so the robot lags on
      bends rather than jittering.


      What the later iterations told me. Iteration 6 widened the array to +/-0.08
      m and moved it forward to y = 0.08 m; s-bend fell to 0.47 and slalom to 0.32.
      Iteration 7 cut base_speed from 1.1 to 1.0 with everything else identical to
      iteration 5; s-bend fell from 0.78 to 0.59 and slalom from 0.40 to 0.37, and
      the score dropped to 438.7. Lowering speed therefore hurt, which means the earlier
      assumption that slower is safer on bends was wrong. Iterations 3 and 4 showed
      that raising kp, kd or ki hurt the oval.


      Change (one variable, controller only): base_speed 1.1 -> 1.2, reverting the
      geometry to iteration 5 and keeping kp, kd and ki unchanged. The oval should
      finish in about 1.85 s, leaving clear margin under 3 s. The s-bend should reach
      2.2 s or less if the finish rate holds. The 1.0 to 1.1 result suggests that
      more speed may help the robot hold the line through bends, but this is untested
      above 1.1.


      Expected result: s-bend progress at or above 0.8 with more finishes than 5/20,
      slalom progress at or above 0.4, and an oval completion_time of about 1.85 s
      with 20/20 finishes. The score should rise modestly if the oscillation stays
      under about 0.45.


      Hypotheses: H1, speed helps bends because the robot''s yaw and momentum carry
      it through the curve before drift builds up, so the 1.0 to 1.1 gain should continue
      at 1.2. H2, the oval finish rate holds since the loop is unchanged. H3, higher
      speed raises max_error at the tightest bends; if it does, the optimum speed
      lies between 1.1 and 1.2.


      Next measurements: completion and progress per track, completion_time (time
      saved on the oval and s-bend), max_error and line_loss_events (where the line
      is still lost at speed), and steering_oscillation (whether the loop stays stable).


