  entities:
  - id: entity0
    label: 7-sensor array, iter-2
    notes: 'Reverts the controller to the best iteration (kp 5, kd 0.6, base 1.1,
      ki 0) and changes only the sensing: 7 sensors at 25 mm spacing, to reduce bend
      lag. Based on iteration 2''s 391.8 score, where the oval finished 20/20 but
      s-bend and slalom progress were low.


      ### Rationale


      Evidence: iteration 2 (score 391.8) is the best design. It finishes the oval
      20/20 at 1.98 s, but leaves the line on the s-bend (progress 0.37, max_error
      0.063) and slalom (progress 0.19). Every failure is off_track with max_error
      just past the 0.06 m limit, and steering oscillation is low (0.19 to 0.22),
      so the robot lags behind bends rather than jittering. Iterations 3 and 4 both
      regressed on the oval (9/20 and 0/20). Iteration 3 raised kp, kd and ki together.
      Iteration 4 raised kp and kd and lowered base_speed. The common factor is a
      stiffer loop (kp above 5 or kd above 0.6), so I am not pushing gains further.
      I am reverting the controller to iteration 2 (kp 5.0, kd 0.6, ki 0.0, base_speed
      1.1).


      Change (one variable, geometry only): I increase the sensor array from 5 to
      7 sensors at 0.025 m spacing, spanning x = -0.075 to +0.075 m, all at y = 0.07
      m. Weights scale to x/0.0375 (from -2 to +2), so the signal gain is close to
      iteration 2 (about 7 percent lower). Finer spacing should give a better estimate
      of the line''s lateral position during bends and reduce the lag that causes
      the s-bend and slalom drift. Wheel track, radius, mass and body dimensions are
      unchanged from iteration 2, so any change in s-bend and slalom progress can
      be attributed to the denser sensing.


      Expected result: oval completion stays near 20/20 with completion_time about
      2.0 s. s-bend and slalom progress rise from 0.37 and 0.19 toward 0.5 or more,
      with max_error reduced if the line estimate is smoother.


      Hypotheses: H1, a 7-sensor array reduces lag-driven drift on the s-bend. H2,
      the oval finish rate holds because the controller is unchanged. H3, the gain
      increases in iterations 3 and 4 caused the oval regressions, not sensing.


      Next measurements: completion and progress per track (did s-bend or slalom finish),
      max_error and rms_error (is the lag reduced), line_loss_events (are dropouts
      fewer with the denser array), steering_oscillation (is the signal noisier with
      more sensors), and completion_time.


