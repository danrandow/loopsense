  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'Conservative first candidate: five sensors at 20 mm spacing, kp 2.5, kd
      0.05, base_speed 1.4, built from the contract without race data. Next revision
      should tune speed and gain from the first race''s completion_time, max_error
      and oscillation.


      ### Rationale


      Iteration 0 has no race telemetry, so this is a conservative baseline built
      from the contract rather than from measured behaviour. Geometry: five line sensors
      spread across the body at x = -0.04 to +0.04 m (5 mm steps excluded, 20 mm spacing),
      placed 0.05 m ahead of the axle so they read the line before the wheels reach
      it. Sensor size 0.012 m is smaller than the 25 mm tape, so readings stay sensitive
      across the tape edge. Wheel track 0.12 m and radius 0.03 m give a moderate turn
      authority. Body 0.12 m wide keeps the off-track limit at max(0.06, 0.0125 +
      0.03) = 0.06 m, a reasonable margin. Mass 0.8 kg is mid-range. Controller: sensor_weights
      -2, -1, 0, 1, 2 so the signal is positive when tape is on the left (steer left),
      matching the sign convention. kp = 2.5 gives a proportional response without
      saturating the wheels at typical offsets. ki = 0 avoids integral windup on curves.
      kd = 0.05 adds mild damping against oscillation. base_speed = 1.4 (about 70%
      of full PWM) is chosen to aim for roughly 1.5 m/s average over 4-5 m, while
      leaving room to slow for tight bends. line_loss = last_direction so the robot
      searches toward the side it last saw the line. Expected result: completion on
      the oval and s-bend with modest oscillation; slalom may be the hardest. The
      main uncertainties are whether base_speed 1.4 is fast enough to finish within
      3 s and whether kp is too low for the tightest bends. Next measurements needed:
      completion_time and progress (speed adequacy), max_error and steering_oscillation
      (gain tuning), and line_loss_events (whether the line is lost on sharp bends).


