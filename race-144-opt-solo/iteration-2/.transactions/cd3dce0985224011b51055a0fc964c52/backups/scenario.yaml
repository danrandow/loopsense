  entities:
  - id: entity0
    label: Stiffer steer, lighter
    notes: 'Raised kp to 4.0 and kd to 0.3, widened sensors to +/-0.06 m, and cut
      track width and mass to add turn authority and reduce inertia. Based on iteration
      0 where all trials went off track at max_error about 0.061 m with low jitter,
      so the robot drifted rather than oscillated.


      ### Rationale


      Evidence: all 60 development trials ended off_track, with line_loss_events =
      1 and max_error about 0.061 m, just past the 0.06 m limit. Progress was only
      0.04 to 0.12, so the robot left the line early on the first hard section. Steering
      oscillation is low (0.06 to 0.08), so the problem is not jitter. The robot is
      losing the line and drifting out rather than wobbling. Likely causes: (1) kp
      = 2.5 gives too little correction at 1.4 base speed, so the robot drifts past
      the edge before the turn command builds up; (2) kd = 0.05 gives almost no damping,
      so overshoot is not controlled; (3) the wheel_track of 0.12 m gives less turn
      authority than a narrower track; (4) mass 0.8 kg and body_length 0.18 m add
      yaw inertia and slow the response.


      Changes: kp 2.5 -> 4.0 for stronger correction. kd 0.05 -> 0.3 for damping of
      the overshoot. base_speed 1.4 -> 1.3 to give the steering more time to act;
      the 3 s limit still needs about 1.5 m/s, so this is a deliberate trade and I
      will watch completion_time. wheel_track 0.12 -> 0.10 m for more turn authority
      per PWM count. mass 0.8 -> 0.6 kg and body_length 0.18 -> 0.14 m to reduce inertia.
      Sensors widened to x = +/-0.06 (spacing 0.03 m) with y = 0.06 so they see the
      line earlier and the outer sensors catch a drift sooner. Weights kept at [-2,-1,0,1,2]
      for a consistent sign convention. ki stays 0 to avoid windup.


      Expected result: fewer off_track endings, progress above 0.5 on oval and s-bend,
      and max_error below 0.05. Hypotheses to test: H1, lack of gain causes the drift
      (improved if max_error falls with kp up). H2, kd damps the overshoot at the
      bends. H3, a narrower track and lighter body let the robot finish near 3 s.
      Next measurements needed: progress and completion_time (speed vs stability trade),
      max_error and line_loss_events (where the line is lost), and steering_oscillation
      (whether kd 0.3 is too much).


