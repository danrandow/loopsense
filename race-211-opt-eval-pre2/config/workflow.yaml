version: 1
entry_actions: [action0]
required_inputs:
  action0: []
  action1: [entity0]
  action2: [entityC1]
  action3: [entity1]
  action4: [entityC2]
  action5: [entity2]
initial_entities: []
carry_forward: [entityR2A]
reentry:
  action0: once_per_iteration
  action1: once_per_iteration
  action2: once_per_iteration
  action3: once_per_iteration
  action4: once_per_iteration
  action5: once_per_iteration
# Strictly linear per iteration: draft -> critique round 1 -> revise -> critique round 2 -> final -> race.
# Every action runs exactly once; required_inputs gates readiness, not reentry -- there is no revise-loop or
# approval gate to break (the Gate 11 defect class needs a reentry trigger keyed on a removed edge; this
# topology has none).
iteration_complete_when:
  entities_present: [entityOut, entityR2A]
