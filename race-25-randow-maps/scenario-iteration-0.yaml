      ### Rationale


      Since this is the first iteration, we have no integration feedback or race telemetry
      yet. To start, I propose a balanced geometry with moderate body size and mass,
      a mid-sized sensor size, and a reasonable number of sensors arranged symmetrically
      near the front centerline to maximize line detection. This setup aims to provide
      good stability and sensor coverage for line following, which should help the
      controller build a reliable model. We request measurements on completion, progress,
      rms_error, line_loss_events, and steering_oscillation to diagnose performance
      and sensor effectiveness in the next iteration. Based on the next telemetry,
      we will adjust sensor count, placement, or body dimensions to improve line detection
      and stability.


