map:
  id: race-190-randow-maps-muted
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: 'Agility step: mass 0.40'
    notes: 'Keeps the iteration 6 sensor array and wheel radius, and takes mass to
      the 0.40 kg minimum and wheel_track to 0.11 m. Iteration 6 raised slalom finishes
      to 14 of 20 and each earlier agility step lifted slalom progress without costing
      oval or s-bend completions.


      ### Rationale


      Iteration 6 is the best design so far (score 883.9). Oval and s-bend both finish
      20/20, and slalom now finishes 14/20 (mean progress 0.94, up from 0.53). Every
      agility change since iteration 3 (lower mass, shorter body, narrower track,
      narrower body) has raised slalom progress without hurting the oval or s-bend.
      The remaining slalom failures are off_track endings (6/20), which points to
      turn response on alternating bends, not sensing or speed: line_loss_events are
      about 1 per run, and the slalom finish time of about 2.0 s leaves speed margin.


      The off-track limit is max(0.06, 0.0125 + body_width/4), which stays at the
      0.06 m floor at body_width 0.08 m, so there is no further body-width lever.
      Body_length is already at its 0.10 m minimum. The remaining yaw-inertia levers
      are mass (0.42 kg, minimum 0.40) and wheel_track (0.115 m).


      Changes in this proposal, applied to the iteration 6 design: (1) mass 0.42 to
      0.40 kg, the allowed minimum, which lowers yaw inertia by about 5 percent; (2)
      wheel_track 0.115 to 0.11 m, which adds turn authority per unit of wheel differential,
      as narrowing the track did in iterations 4 and 5. Sensor positions, sensor_size,
      wheel_radius, and body dimensions are unchanged, so the Integrator''s controller
      carries over. I am keeping the step small because the iteration 4 to 5 and 5
      to 6 steps showed that oscillation stays near 0.30 on the slalom, and a large
      track cut risks more jitter.


      Expected result: slalom finishes rise from 14/20 toward 16 or more, slalom max_error
      stays below 0.06 on most seeds, and oval and s-bend completions hold at 20/20
      and 18/20 or better. Risk: steering_oscillation rises above 0.32 with more turn
      authority, which would need more kd from the Integrator.


      - [Open this output](iteration-7/entity0/versions/180061d621c04432a18a2751e4d983e4/payload.json)

      - Based on: [entityR2A](iteration-7/entityR2A/versions/carried-c4704e119e83bcdc/payload.json)'
  - id: entity1
    label: Agile robot, kd 0.60
    notes: 'Integrates the Builder''s mass 0.40 kg and wheel_track 0.11 m geometry.
      kd rises from 0.55 to 0.60 to damp the faster turn response, following the iteration
      4 to 6 pattern where oscillation stayed at or below about 0.31 as agility rose.


      ### Rationale


      Iteration 6 (score 883.9) is the best design. Oval and s-bend both finish 20/20,
      and slalom finishes 14/20 with progress 0.94. Every agility step since iteration
      3 has raised slalom progress without losing oval or s-bend completions. The
      remaining slalom failures are off_track endings with max_error at 0.04 on finishers,
      so the limit is turn response on alternating bends, not sensing or speed.


      The Builder''s iteration 7 geometry changes two things: mass 0.42 to 0.40 kg
      (about 5% lower yaw inertia) and wheel_track 0.115 to 0.11 m (about 4% more
      turn per unit of wheel differential). Both make the robot turn faster. Iteration
      2 showed that kp 4.0 with kd 0.3 and a narrow track overshoots (steering_oscillation
      0.27 to 0.28), and iteration 6 already sits at 0.30 on the slalom. So the extra
      agility needs more damping, not more gain.


      Controller decisions: kp stays at 3.8, because the lower inertia and narrower
      track already add effective turn gain and raising kp would push oscillation
      further. kd rises from 0.55 to 0.60 to damp the faster heading response, a small
      step that follows the iteration 4 to 6 pattern where kd rose with each agility
      step and oscillation stayed at or below about 0.31. ki stays at 0.15 to cancel
      the fixed motor mismatch. base_speed stays at 1.4: the oval finishes in about
      1.65 s and the slalom in about 2.0 s, so there is time margin, and changing
      speed would confound the geometry test. Sensor weights remain x/0.015, which
      keeps the signal sign-correct (positive = left). line_loss stays last_direction,
      which has produced about one event per run.


      Expected result, not yet measured: slalom completions rise toward 16 of 20 or
      more, slalom steering_oscillation stays at or below about 0.32, and oval and
      s-bend completions hold at 20/20 and 18/20 or better.


      - [Open this output](iteration-7/entity1/versions/160ca4bce5b54034bce1fbdafbad0b9e/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/180061d621c04432a18a2751e4d983e4/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-c4704e119e83bcdc/payload.json)'
  - id: entityR1
    label: Track and damping steps
    notes: 'Feedback for the Builder states no outcome for the candidate. It ties
      each next step to iteration 2 overshoot and the iteration 4 to 6 slalom progress
      trend, with wheel_track as the lever to revisit depending on oscillation and
      completions.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Evidence
      from earlier iterations: iteration 2 (kp 4.0, kd 0.3, wheel_track 0.11, wheel_radius
      0.035) overshot, with steering_oscillation 0.27 to 0.28 and control_effort about
      8 to 8.5, and it finished only 2 of 20 oval runs. Iteration 4 (mass 0.5, body_length
      0.12, wheel_track 0.12, kp 3.8, kd 0.45) gave 20/20 oval, 17/20 s-bend, and
      slalom oscillation 0.24. Iteration 5 (mass 0.45, body_length 0.10, wheel_track
      0.115, kd 0.5) raised slalom progress to 0.53, with oscillation 0.25. Iteration
      6 (body_width 0.08, mass 0.42, kd 0.55) reached slalom 14/20 finishes and oscillation
      0.30, so each agility step has helped the slalom while damping has held. Integration
      work for this geometry: kp is held at 3.8 because the lighter, narrower track
      already adds turn gain, and kd rises to 0.60 to damp the faster heading response.
      Next race, the change depends on the result. If steering_oscillation rises above
      0.32 on the slalom or s-bend, the agility gain has outrun the damping, so return
      wheel_track toward 0.115 m. If slalom max_error stays at or above 0.06 while
      oscillation stays at or below 0.32, turn authority is the limit and mass cannot
      drop further (0.40 kg is the minimum), so the next lever is wheel_track. If
      oval or s-bend completions fall below iteration 6 levels, the agility step has
      cost stability, so restore wheel_track to 0.115 m.


      ### Requested changes


      - If steering_oscillation rises above 0.32 on the slalom or s-bend in the next
      race: set wheel_track back to 0.115 m, since iteration 6 at 0.115 m held slalom
      oscillation at 0.30, while iteration 2 at 0.11 m with kp 4.0 and kd 0.3 overshot
      to 0.27 to 0.28.

      - If slalom max_error stays at or above 0.06 while steering_oscillation stays
      at or below 0.32: try wheel_track 0.105 m, since mass is already at its 0.40
      kg minimum and iteration 6 to 7 showed slalom progress rising with each track
      narrowing (0.94 to the next step).

      - If oval or s-bend completions drop below iteration 6''s 20/20 and 18/20 with
      the lighter body: restore wheel_track to 0.115 m, since the 0.115 m track in
      iteration 6 completed every oval run and 20 of 20 s-bend runs.


      - [Open this output](iteration-7/entityR1/versions/160ca4bce5b54034bce1fbdafbad0b9e/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/180061d621c04432a18a2751e4d983e4/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-c4704e119e83bcdc/payload.json)'
