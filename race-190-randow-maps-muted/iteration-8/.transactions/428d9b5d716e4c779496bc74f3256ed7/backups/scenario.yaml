map:
  id: race-190-randow-maps-muted
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Narrower track 0.105 m
    notes: 'Single-variable step: wheel_track 0.11 to 0.105 m to add turn authority
      on the slalom, where 5/20 runs still leave the line. Sensors, wheel radius,
      body and mass are held fixed, and the iteration 7 evidence (slalom 15/20, oval
      20/20, s-bend 20/20) supports the change.


      ### Rationale


      Iteration 7 is the best design so far (score 889.3). Oval and s-bend both finish
      20/20, and slalom finishes 15/20 with mean progress 0.95. The gain over iteration
      6 was small (+5 points), so the agility lever is flattening. The remaining slalom
      failures are off_track endings (5/20), with max_error near 0.034 and line_loss_events
      about 1.25. That points to turn response on alternating bends rather than sensing
      or speed, since the slalom finish time of about 2.24 s leaves speed margin.
      The off-track floor is 0.06 m at body_width 0.08 m, and body_length (0.10 m)
      and mass (0.40 m minimum) are already at their limits, so wheel_track is the
      only remaining yaw-authority lever. The step from 0.115 to 0.11 m (iteration
      6 to 7) raised slalom finishes by one, so I will take one more small step: wheel_track
      0.11 to 0.105 m. Everything else is held fixed so the effect is attributable:
      sensors (7 at x = ±0.03 m, y = 0.08 m, 12 mm footprint), wheel_radius 0.04 m,
      body 0.10 x 0.08 m, mass 0.40 kg. Expected result: slalom finishes rise from
      15/20 toward 17/20, and oval and s-bend completions hold at 20/20 and 18/20
      or better. Risk: steering_oscillation (0.30 on the slalom now) rises past about
      0.32 with less damping, which would call for more kd from the Integrator. If
      that happens, I will hold the track at 0.11 m and look at sensing instead.


      - [Open this output](iteration-8/entity0/versions/1f18c31339114964b980d9c3efc8125a/payload.json)

      - Based on: [entityR2A](iteration-8/entityR2A/versions/carried-c9a28d317e9339e4/payload.json)'
  - id: entity1
    label: Track 0.105, kd 0.65
    notes: 'Applies the Builder''s wheel_track step from 0.11 to 0.105 m and raises
      kd from 0.60 to 0.65 to offset the faster turn response. The evidence is iteration
      7''s slalom finishes of 15/20 and s-bend oscillation of 0.347.


      ### Rationale


      Iteration 7 (score 889.3) is the best design. Oval and s-bend both finish 20/20,
      and slalom finishes 15/20 with off_track endings at max_error near 0.034. The
      Builder''s iteration 8 changes wheel_track from 0.11 to 0.105 m and keeps every
      other geometry field fixed. Narrowing the track raises turn rate per unit of
      wheel differential by about 5%, so the controller needs slightly more damping
      to avoid overshoot. Iteration 7 already shows the damping margin shrinking:
      s-bend steering_oscillation rose to 0.347 (from 0.304 at iteration 6), and iteration
      2 overshot at 0.11 m with kp 4.0 and kd 0.3. I therefore keep kp at 3.8 and
      ki at 0.15 unchanged, and raise kd from 0.60 to 0.65 to damp the faster heading
      response. Sensor weights stay at x/0.015 (-2 to +2), so the signal remains sign-correct
      with positive meaning left. base_speed stays at 1.4, since oval and slalom finish
      times leave time margin, and line_loss stays last_direction, which has given
      about one event per run. Expected result, not yet measured: slalom finishes
      rise toward 16 or 17 of 20, slalom steering_oscillation stays at or below about
      0.32, and oval and s-bend completions hold at 20/20 and 18/20 or better.


      - [Open this output](iteration-8/entity1/versions/d2d54e714706449582d9165f20b09932/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/1f18c31339114964b980d9c3efc8125a/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-c9a28d317e9339e4/payload.json)'
  - id: entityR1
    label: Track next steps
    notes: 'Pre-race feedback that names what the next race needs to show: wheel_track
      0.10 if slalom finishes rise, back to 0.11 if oscillation exceeds about 0.36,
      or sensor_size 0.016 if off_track persists at max_error of 0.06 or more. Evidence
      is iterations 2 to 7.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Evidence
      from earlier iterations: iteration 2 (kp 4.0, kd 0.3, wheel_track 0.11, wheel_radius
      0.035) overshot, with steering_oscillation 0.27 to 0.28 and control_effort about
      8 to 8.5, and finished only 2 of 20 oval runs. Iterations 3 to 7 raised slalom
      progress each agility step (0.34, 0.43, 0.53, 0.94, then 15/20 finishes at iteration
      7), with oval and s-bend completions held. Iteration 7 s-bend steering_oscillation
      reached 0.347, so the damping margin is now the constraint on further narrowing.
      Integration work: I hold kp at 3.8 because a narrower track already adds turn
      gain, and I raise kd to 0.65 to damp it. Next race, the change depends on the
      result. If slalom steering_oscillation or s-bend oscillation rises above about
      0.36, the track narrowing has outrun the damping, so return wheel_track to 0.11
      m. If slalom finishes stay at or below 15/20 while oscillation stays at or below
      0.32 and max_error stays near 0.034, turn authority is still the limit and the
      next step is a further narrow track. If oval or s-bend completions fall below
      20/20 and 18/20, the step has cost stability.


      ### Requested changes


      - If slalom steering_oscillation stays at or below 0.32 and slalom finishes
      rise to 16/20 or more: try wheel_track 0.10 m, since iteration 6 to 7 showed
      slalom progress rising with each track narrowing while oscillation stayed near
      0.30.

      - If s-bend steering_oscillation rises above about 0.36 (iteration 7 was 0.347)
      or slalom oscillation rises above 0.32: hold wheel_track at 0.11 m or return
      to 0.105 m with the Integrator''s kd raised, since iteration 2 at 0.11 m with
      kp 4.0 overshot at 0.27 to 0.28 and iteration 7 showed s-bend oscillation rising.

      - If slalom off_track endings persist with max_error at or above 0.06 while
      oscillation is stable: set sensor_size to 0.016 so the outer sensors cover more
      of the 25 mm tape at the sharpest bends, since slalom line_loss_events are about
      1.25 per run and sensing has not been tested at this footprint.


      - [Open this output](iteration-8/entityR1/versions/d2d54e714706449582d9165f20b09932/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/1f18c31339114964b980d9c3efc8125a/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-c9a28d317e9339e4/payload.json)'
