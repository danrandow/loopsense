map:
  id: race-137-randow-maps
  schema: v0.2
  scenario: Iteration 1
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 0.
dimensions:
  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Wider 6cm sensor span
    notes: 'Widened the sensor array from 4 cm to 6 cm (seven 16 mm sensors) and moved
      them to y = 0.04 m, with wheel track 0.14 m and mass 0.7 kg. Iteration 0 went
      off track on every trial (progress 0.10 to 0.15, 1 to 2 line-loss events per
      run), which points at the narrow sensor span losing the line.


      ### Rationale


      Iteration 0 raced 60 trials across oval, s-bend and slalom, and none finished.
      Every run ended off track, with progress only 0.10 to 0.15 and max_error about
      0.06, which is exactly the off-track limit (max(0.06, 0.0125 + 0.12/4) = 0.06
      m). The robot is losing the line on its first bends, not running out of time.
      The likely cause is the baseline sensor span: five 12 mm sensors across only
      4 cm see the 25 mm tape only while the line stays within about ±2 cm, so once
      error grows the signal drops out and line_loss_events reach 1 to 2 per run.
      Widening the body does not help, because body_width/4 cannot exceed the 0.06
      m floor within the allowed range (0.18 m gives 0.0575 m). So the lever is sensing,
      not body size. This iteration changes the sensor geometry: a span of ±0.03 m
      (7 sensors at 10 mm spacing) with 16 mm footprints, so the outer sensors keep
      a reading when the line moves toward them and the tape stays covered across
      larger errors. I also move the sensors back to y = 0.04 m to trim lag somewhat,
      and widen wheel_track to 0.14 m for more turn authority on the tightest bends.
      Mass drops to 0.7 kg to help acceleration toward the 1.5 m/s average needed
      to finish in 3 s. Wheel radius and body stay at baseline so the number of changes
      is limited. Expected result: fewer line-loss events, lower max_error, and the
      first completions on the oval and s-bend tracks. This is a hypothesis to test
      in the next race, not a measured result.


      - [Open this output](iteration-1/entity0/versions/190989ccfb6249658857ab6b96bb09f2/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-da88e0166bb8c47f/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-2906daecab67ff72/payload.json)'
  - id: entity1
    label: Wide 7-sensor package
    notes: 'Adopts the Builder''s 6 cm, 16 mm-sensor geometry with weights scaled
      to x, kp reduced to 2.5, and base_speed 1.5. Iteration 0 lost the line 1 to
      2 times per run, and this tests whether the wider span removes that.


      ### Rationale


      Iteration 0 raced 60 trials with no finishes. Every run ended off track at progress
      0.10 to 0.15, with max_error at the 0.06 m limit and 1 to 2 line-loss events
      per run. The line is lost on the early bends, so sensing is the bottleneck,
      not steering oscillation (0.085 to 0.142, low). This package adopts the Builder''s
      proposed geometry as-is: seven 16 mm sensors at 10 mm spacing across x = -0.03
      to +0.03 m, at y = 0.04 m, wheel_track 0.14 m, mass 0.7 kg. The wider span and
      larger footprint should keep a reading when error grows. The controller is retuned
      for this geometry. Sensor weights scale with x (x/0.02, so -1.5 to +1.5) so
      the signal keeps the same units as before. Because the outer weights are larger,
      kp is reduced from 3.0 to 2.5 to avoid over-correction at the wider span. base_speed
      is reduced slightly from 1.6 to 1.5 because the robot leaves the line on bends,
      and speed should not be the cause of that. ki stays at 0 to avoid windup. kd
      stays at 0.2 for damping. line_loss stays at last_direction, which kept recovery
      consistent on the baseline. Expected result, not measured: fewer line-loss events
      and max_error below 0.06 m on the oval and s-bend. The race will test this.


      - [Open this output](iteration-1/entity1/versions/c9d21348e14f45e3a4809415cdac203d/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/190989ccfb6249658857ab6b96bb09f2/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-2906daecab67ff72/payload.json)'
  - id: entityR1
    label: Span first, then offset
    notes: 'Feedback tells the Builder to keep the wider span if line loss drops,
      and to test the forward offset or mass next. Based on iteration 0''s 60 off-track
      runs with low steering oscillation.


      ### Feedback


      Written before this candidate races. Evidence: in iteration 0 all 60 trials
      went off track at progress 0.10 to 0.15, with max_error at the 0.06 m limit
      and 1 to 2 line-loss events per run (slalom worst at 2.0). Steering oscillation
      was low (0.085 to 0.142), so the failure is line loss, not jitter. For this
      geometry the Integrator had to scale sensor weights with x (-1.5 to +1.5) and
      drop kp to 2.5 so the wider span does not over-correct, and trim base_speed
      to 1.5. Decision rules for the next race: (1) If line_loss_events fall to 0
      and max_error stays under 0.06 m, keep the span and try the forward offset change
      next, moving y from 0.04 toward 0.03 only if steering_oscillation rises. (2)
      If line loss persists on the tightest bend (slalom or s-bend) with the wide
      span, the sensing span is not the limit. Then test a shorter forward offset
      or a higher kd, not a wider span. (3) If the robot completes but completion_time
      is near 3 s, reduce mass further (to 0.6 kg) or raise wheel_radius to 0.035.
      If wheels slip on starts, keep wheel_track at 0.14 and reduce mass instead.


      ### Requested changes


      - Keep sensor_size 0.016 and x span -0.03 to +0.03 at 10 mm spacing. Basis:
      iteration 0 lost the line 1 to 2 times per run with a 4 cm span of 12 mm sensors;
      if line_loss_events drop, keep this span.

      - If line loss persists on the tightest bend, move sensor y from 0.04 to 0.03
      to reduce lag. Basis: iteration 0 steering_oscillation was low (0.085 to 0.142),
      so the lag fix is safe to test one change at a time.

      - If completion_time is near 3 s with no line loss, reduce mass from 0.7 to
      0.6 kg or raise wheel_radius from 0.03 to 0.035. Basis: iteration 0 never finished,
      so speed is not yet the constraint; test this only after line loss is fixed.


      - [Open this output](iteration-1/entityR1/versions/c9d21348e14f45e3a4809415cdac203d/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/190989ccfb6249658857ab6b96bb09f2/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-2906daecab67ff72/payload.json)'
