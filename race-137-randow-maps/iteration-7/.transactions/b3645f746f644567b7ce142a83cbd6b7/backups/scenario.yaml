map:
  id: race-137-randow-maps
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Revert to iter-0 dynamics
    notes: 'Keeps the iteration 0 sensing and mass but reverts wheel radius to 0.03
      m and track to 0.12 m, because iteration 6 recovered oval progress but lost
      s-bend progress (0.135 vs 0.148). Evidence: iteration 6 scored 51.63 with line
      loss still at about 1.0 per run, which points to a fixed point on the course
      rather than a geometry limit.


      ### Rationale


      Iteration 6 restored the iteration 0 sensing (five 12 mm sensors, x -0.02 to
      +0.02 m, y 0.05 m, mass 0.8 kg) and kept wheel_radius 0.035 m and wheel_track
      0.16 m. It scored 51.63, close to the best of 52.28. Oval progress recovered
      to 0.1446 from 0.138, which supports the sensing as the driver of the earlier
      progress loss. S-bend progress stayed lower at 0.135 against 0.1476 in iteration
      0, and it is the only track where the dynamics changed without a gain. Line_loss_events
      stayed at 1.0 on s-bend and slalom and 1.2 on oval, so the loss is still a fixed
      point and no geometry change has removed it. Steering oscillation stayed low
      at 0.09 to 0.13, so the robot is not jittering. Following the Integrator''s
      decision rule (2), I revert wheel_radius to 0.03 m and wheel_track to 0.12 m,
      the iteration 0 values that gave the best s-bend progress, and keep the iteration
      0 sensing and mass. I expect a score near 52.3 with line loss still at about
      1.0 per run. This run is a confirmation of the iteration 0 baseline, and the
      telemetry requested will show where on the course the single loss occurs, which
      is the next thing to learn.


      - [Open this output](iteration-7/entity0/versions/fcfcaa16f012434698333c6cadd80ad3/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-b944ede6ba7824f8/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-dff42ffb353c6b3b/payload.json)'
  - id: entity1
    label: Iter-0 sensing restored
    notes: 'Restores the iteration 0 sensing and mass (five 12 mm sensors at y 0.05
      m) with the iteration 0 controller, keeping radius 0.035 m and track 0.16 m
      from iterations 4 and 5. Expected to recover progress toward the best score
      (52.28), not yet measured.


      ### Rationale


      The Builder''s proposal restores the iteration 0 sensing (five 12 mm sensors
      at x -0.02 to +0.02 m, y 0.05 m) with mass 0.8 kg. Iteration 0 is still the
      best score (52.28), and every later change to sensing or mass left line_loss_events
      at about 1.0 per run while progress fell. Iterations 4 and 5 showed wheel radius
      0.035 m and wheel track 0.16 m are close to neutral, so I keep both. Because
      the Builder isolates sensing and mass, I restore the controller that was paired
      with the iteration 0 sensing: base_speed 1.6, kp 3.0, ki 0, kd 0.2, sensor weights
      [-1, -0.5, 0, 0.5, 1], last_direction. The later controller (kp 2.5, base_speed
      1.5, weights scaled to x = ±0.03) was tuned for the 7-sensor layout, so using
      it with the 5-sensor layout would add a second untested change. The expected
      result is progress near 0.14 on the oval and 0.15 on the s-bend, a score near
      52, and line_loss_events still about 1.0. This is a hypothesis, not a measured
      result.


      - [Open this output](iteration-6/entity1/versions/4fe564a7b4a34fbb8a4cc2f412224a06/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/a47a88d97ae1482d8a433a846eef84e6/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-2132aa6796631fa5/payload.json)'
  - id: entityR1
    label: Revert sensing, fixed
    notes: 'Advises restoring the iteration 0 sensing and checking whether line loss
      is a fixed point on the course, with revert rules if progress does not recover.
      Based on iterations 0 to 5, where line loss stayed at 1.0 per run under every
      sensing and dynamics change.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Evidence:
      iteration 0 (five 12 mm sensors at x ±0.02 m, y 0.05 m, mass 0.8, controller
      kp 3.0, base_speed 1.6) scored 52.28, the best so far, with progress 0.138 (oval)
      and 0.148 (s-bend) and line loss 1.0 to 2.0 per run. Iterations 1 to 5 each
      changed one lever (widening to ±0.03 m with 16 mm sensors, forward offset y
      0.04 and 0.03, mass 0.7 and 0.6 kg, wheel radius 0.035 m, track 0.16 m). Line
      loss stayed at 1.0 per run in every case, and progress fell from iteration 1
      onward. Steering oscillation stayed between 0.07 and 0.14, so the robot is not
      jittering. Decision rules for the next race: (1) If progress returns to about
      0.14 on the oval and 0.15 on the s-bend with line_loss_events still at 1.0,
      the progress loss came from the sensing, and the line loss is a fixed point
      on the course. Stop changing sensing and ask for per-track telemetry on where
      the loss occurs. (2) If progress does not recover, the wheel radius and track
      changes are costing progress, so revert to wheel_radius 0.03 and wheel_track
      0.12 (the iteration 0 values) with the same sensing. (3) If steering_oscillation
      rises above about 0.2, the wider track is overshooting, so return wheel_track
      to 0.14 m.


      ### Requested changes


      - Keep the iteration 0 sensing (five 12 mm sensors at x -0.02 to +0.02 m, y
      0.05 m) with mass 0.8 kg. Basis: iteration 0 scored 52.28 with the best progress,
      and iterations 1 to 3 showed that widening to 16 mm sensors and moving them
      forward lowered progress without removing line loss.

      - If progress recovers but line_loss_events stays at 1.0, try sensor_size 0.008
      with the same five positions at y 0.05 m. Basis: no iteration has tested a 8
      mm footprint, and a smaller footprint gives a sharper line-position signal on
      the same layout. Test this only after the progress recovery is confirmed.

      - If progress does not recover with wheel_track 0.16 m and wheel_radius 0.035
      m, revert both to the iteration 0 values (wheel_track 0.12 m, wheel_radius 0.03
      m). Basis: iteration 0 used these values for its best progress, and iterations
      4 and 5 were the only runs with the larger radius and track.


      - [Open this output](iteration-6/entityR1/versions/4fe564a7b4a34fbb8a4cc2f412224a06/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/a47a88d97ae1482d8a433a846eef84e6/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-2132aa6796631fa5/payload.json)'
