overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor
    notes: 'First Geometry Proposal with no prior race data: five 12 mm sensors spaced
      10 mm across the line, 5 cm ahead of the axle, with mid-range wheel track, radius,
      body and mass. It is a prior-based baseline that the Integrator''s feedback
      and the first race telemetry will test.


      ### Rationale


      Iteration 0 has no race telemetry or integration feedback yet, so this proposal
      rests on design priors from the contract rather than evidence. The main constraints
      are: the course must be covered in under 3 s (about 1.5 m/s average), the run
      ends if the robot leaves the line by more than max(0.06 m, tape_half_width +
      body_width/4), and line loss is costly in the score. Five sensors at 12 mm footprint
      and 10 mm spacing (x = -0.02 to +0.02) cover about 4 cm across the line, so
      the line stays visible through moderate lateral error and the signal stays smooth.
      Sensors sit 5 cm ahead of the axle so the controller sees the line before the
      wheels reach it, which reduces lag at bends. Wheel track 0.12 m and radius 0.03
      m give a moderate turn authority (turn rate is set by the wheel speed difference
      over the track) without making the yaw inertia too large. Body width 0.12 m
      keeps the off-track limit at 0.06 m, since the body term (0.0125 + 0.03 m) is
      below that floor. Mass 0.8 kg is mid-range, which should give reasonable acceleration
      from the 7.4 V battery without much wheel slip. I expect this to complete the
      oval and s-bend tracks; slalom is the most uncertain because of the sharper
      alternating bends.


      - [Open this output](iteration-0/entity0/versions/319b8f965481423ea05b5091ff3587a8/payload.json)'
  - id: entity1
    label: Baseline robot package
    notes: 'Unchanged baseline geometry with a conservative P+D controller (kp 3,
      kd 0.2, no integral), signal weights scaled to sensor spread, last_direction
      line-loss recovery. No race evidence yet, so the controller is derived from
      the contract.


      ### Rationale


      Iteration 0 has no race telemetry or integration feedback, so the controller
      is built from the contract rather than measured results. The geometry is the
      Builder''s baseline, kept unchanged so the first race tests it as proposed.
      Sensor weights are scaled to the sensor x-positions (-0.02 to +0.02 m) as -1,
      -0.5, 0, 0.5, 1, so the steering signal is a normalised lateral line position
      in [-1, 1]. Positive weights on left sensors steer left, which matches the contract.
      Because the signal is a reading-weighted average, it stays near the centre when
      the tape is under the middle sensors, and it is only a small value in the 12
      mm, 10 mm-spacing layout. kp = 3 gives a turn of about 1.5 at a half-sensor
      offset, or about 525 PWM of wheel differential, which is a moderate correction
      without saturating. ki = 0 avoids integral windup on the bends, and kd = 0.2
      adds mild damping against the sensor-to-axle lag. base_speed = 1.6 gives PWM
      base of about 0.8 of full, aiming for about 1.5 m/s average so the 3 s limit
      is reachable with a margin. line_loss = last_direction is the safest recovery
      on a curved track, because the robot keeps turning the way it was going when
      the line was lost. The observation request covers completion, speed, error,
      line loss, oscillation and controller health, so the Builder gets the evidence
      it asked for.


      - [Open this output](iteration-0/entity1/versions/a6b72c47f3a54ea09a41b4476b79e9ac/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/319b8f965481423ea05b5091ff3587a8/payload.json)'
  - id: entityR1
    label: Baseline integration
    notes: 'Iteration 0 feedback with no prior race evidence. Gives conditional rules
      for sensor span, forward offset and mass/track changes, each tied to what the
      next race measures.


      ### Feedback


      Iteration 0: no earlier race exists, so this feedback rests on the contract
      and on what I had to set in the controller, not on measured performance; no
      result is claimed for the current candidate. What I had to compensate for: with
      a 25 mm tape and 12 mm sensors at 10 mm spacing across 4 cm, only two or three
      sensors see the tape at once, so the signal is coarse near the centre and I
      scaled the weights to -1 to +1 with kp = 3 to keep the correction moderate.
      The 5 cm forward offset means the controller sees the line about 0.05 m before
      the axle, which should help on bends but may add lag, so I kept kd small at
      0.2 to limit overshoot. Next race decision rules: (1) If steering_oscillation
      is high or max_error grows on the S-bend, move the sensors back toward y = 0.03
      (reduce lag) or narrow the sensor span to x = -0.015 to +0.015 to reduce over-steering.
      (2) If line_loss_events occur on the tightest bend, widen the sensor span to
      x = -0.03 to +0.03 (the sensor spacing would need to be 15 mm to keep five sensors)
      or raise sensor_size to 0.016 so the outer sensors keep a reading. (3) If the
      robot completes but progress is slow (completion_time close to 3 s) or wheels
      slip on starts, reduce mass to 0.7 or increase wheel_track to 0.14 for more
      turn authority without slip. Requested changes are listed below and should be
      tested one at a time where possible.


      ### Requested changes


      - Test sensor span: if line_loss_events > 0 on the tightest bend, widen sensor
      x positions to -0.03 .. +0.03 (15 mm spacing) with sensor_size 0.016; this gives
      outer sensors a reading when the line moves toward them. Basis: no race yet;
      this is a hypothesis from the 4 cm span limiting the tape visibility.

      - Test forward offset: if steering_oscillation or max_error is high on the s-bend,
      move all sensor y from 0.05 to 0.03 to cut the sensor-to-axle lag. Keep x spacing
      unchanged so only one change is tested.

      - Test turn authority and mass: if completion_time is near 3 s without line
      loss, reduce mass from 0.8 to 0.7 kg; if wheel slip or overshoot appears at
      start, increase wheel_track from 0.12 to 0.14 m. Basis: no race yet; this is
      a design prior from the contract''s speed and turn-rate limits.


      - [Open this output](iteration-0/entityR1/versions/a6b72c47f3a54ea09a41b4476b79e9ac/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/319b8f965481423ea05b5091ff3587a8/payload.json)'
