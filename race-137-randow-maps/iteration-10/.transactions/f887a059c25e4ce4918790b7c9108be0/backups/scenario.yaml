map:
  id: race-137-randow-maps
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Hold y 0.06 m sensors
    notes: 'Holds the best-scoring design so far (iteration 9, 52.985), with five
      12 mm sensors at y 0.06 m and all dynamics at baseline. Oval progress rose to
      0.151, but s-bend fell to 0.140, so the rule to return to 0.05 m was not applied
      because the net score improved. Per-track telemetry is requested to locate the
      s-bend loss.


      ### Rationale


      Iteration 9 is the best result so far at 52.985, against 52.28 for the baseline.
      Moving the five 12 mm sensors forward from y 0.05 to y 0.06 m raised oval progress
      from 0.138 to 0.151, and oval score rose from 56.25 to 62.77. S-bend progress
      fell from 0.148 to 0.140, and s-bend score fell from 61.01 to 57.74. Slalom
      was unchanged in progress (0.097) and its loss stayed at 2.0. Line loss stayed
      at 1.0 per run on oval and s-bend, and steering oscillation stayed low (0.10
      and 0.14), so the robot is not jittering and the loss is still a single dropout
      at a fixed point.


      The Integrator''s rule (2) says to return to y 0.05 m if s-bend progress falls
      below baseline with line loss at 1.0. The rule was written to protect the baseline,
      but the objective is the race score, and the net result improved. The oval gain
      (about +6.5 points) outweighs the s-bend loss (about -3.3). The change is therefore
      a trade-off, not a clear regression. I keep y 0.06 m for this race because it
      is the best measured design. I do not interpolate to y 0.055 m in this iteration,
      because an untested offset could lose the gain. The s-bend shortfall suggests
      the forward lead helps the open oval but gives late sensing on tight bends.
      Wheel radius, track, mass, footprint and span stay at baseline, so the result
      can be attributed to the offset alone.


      Expected result: about 52.9 to 53.0, with oval progress near 0.15, s-bend near
      0.14, and line loss still 1.0 per run on oval and s-bend and 2.0 on slalom.


      - [Open this output](iteration-10/entity0/versions/baf969a90f434075a36426c4b977c13f/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-f024b6b8313f2a6f/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-4aaa78c19c23ba42/payload.json)'
  - id: entity1
    label: Sensor y 0.06 test
    notes: 'Complete package: the iteration 7 baseline with 12 mm sensors moved forward
      from y 0.05 to 0.06 m, controller unchanged. Iteration 7 (52.28) and iteration
      8 (8 mm footprint lower) are the evidence, and the single change isolates the
      forward offset.


      ### Rationale


      The Builder''s proposal changes one geometry lever against the iteration 7 baseline:
      sensor y moves from 0.05 m to 0.06 m, with 12 mm sensors and the same x spacing
      (-0.02 to +0.02 m). Iteration 7 confirmed the baseline at 52.28 (oval progress
      0.138, s-bend 0.148, line loss 1.0 to 1.1 per run on oval and s-bend, 2.0 on
      slalom). Iteration 8 showed that an 8 mm footprint lowers progress on all tracks
      (oval 0.133, s-bend 0.143, slalom 0.097) and raises slalom loss to 2.0, so 12
      mm stays. Iteration 0 (y 0.05) beat iteration 2 (y 0.03), but y 0.06 has not
      been tested. The controller is held identical to the iteration 0 and 7 pairing
      (kp 3.0, ki 0, kd 0.2, base_speed 1.6, weights [-1, -0.5, 0, 0.5, 1], last_direction).
      That pairing matches the 5-sensor layout, and keeping it fixed means any change
      in progress or line loss comes from the sensor row alone. Wheel radius 0.03
      m, wheel track 0.12 m, mass 0.8 kg and body are unchanged, since iteration 6
      showed the wheel change cost s-bend progress. Expected, not measured: line loss
      about 1.0 per run on oval and s-bend, at or below 2.0 on slalom, and progress
      near the baseline. Any gain or loss in progress from the forward offset will
      show in the race.


      - [Open this output](iteration-9/entity1/versions/a0f31480902a481587fdc58191ae7f99/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/2b9c672f3ead414f9b17a68ced81bb86/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-a9e4107413a19e1a/payload.json)'
  - id: entityR1
    label: Offset decision rules
    notes: 'Written before the race: keeps the 12 mm baseline and gives decision rules
      on y 0.06 m, falling back to y 0.05 m if progress drops, plus a radius-only
      test if line loss persists. The evidence is iterations 0 to 8, with the baseline
      at 52.28.


      ### Feedback


      Written before this candidate has raced; no outcome is claimed for it. Evidence:
      iteration 0 and the iteration 7 confirmation both gave 52.28 with five 12 mm
      sensors at y 0.05 m, mass 0.8, wheel_radius 0.03 and wheel_track 0.12, with
      progress 0.138 (oval) and 0.148 (s-bend) and about 1.0 line loss per run. Iterations
      1 to 2 showed that 16 mm sensors at y 0.04 and 0.03 m lowered progress (oval
      about 0.11, s-bend about 0.13) without removing the single loss. Iteration 8
      showed that 8 mm footprints lowered progress on every track and raised slalom
      loss to 2.0, so 12 mm is the footprint to keep. Iteration 6 raised oval progress
      to 0.1446 but lowered s-bend progress to 0.135 with the larger radius and track,
      so those dynamics stay at baseline. Steering oscillation has stayed between
      0.07 and 0.14 throughout, so the loss is a dropout at a fixed point, not jitter.
      Decision rules for the next race: (1) If progress holds at or above 0.138 (oval)
      and 0.148 (s-bend) with line loss at or below 1.0 per run and slalom at or below
      2.0, keep y 0.06 m and ask for per-track telemetry on where the single loss
      occurs before any further geometry change. (2) If progress falls below baseline
      on either track while line loss stays at 1.0, return to y 0.05 m, which is the
      best-measured offset, and treat the forward offset as tuned. (3) If line loss
      rises above 1.0 on oval or s-bend, or steering_oscillation exceeds about 0.2,
      return to y 0.05 m and test controller changes on the Integrator side rather
      than further sensing changes.


      ### Requested changes


      - Keep sensor_size 0.012 m on the five-sensor layout (x -0.02 to +0.02 m at
      10 mm spacing), with wheel_radius 0.03 m, wheel_track 0.12 m and mass 0.8 kg,
      and move sensor y from 0.05 to 0.06 m. Basis: iterations 0 and 7 at y 0.05 m
      gave the best progress (0.138 and 0.148), iterations 1 to 2 at 16 mm and y 0.04
      to 0.03 m lowered progress, and y 0.06 m has not been tested.

      - If progress drops below baseline on the oval or s-bend, return sensor y to
      0.05 m and do not move the offset further. Basis: iteration 0 (y 0.05) beat
      iteration 2 (y 0.03), and iteration 8 showed that changes to the 12 mm baseline
      have so far lowered progress.

      - If line loss stays at 1.0 per run with baseline progress, test wheel_radius
      0.035 m with wheel_track 0.12 m, changing only the radius. Basis: iteration
      6 changed radius and track together, raised oval progress to 0.1446, and lowered
      s-bend progress to 0.135, so the two effects have not been separated.


      - [Open this output](iteration-9/entityR1/versions/a0f31480902a481587fdc58191ae7f99/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/2b9c672f3ead414f9b17a68ced81bb86/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-a9e4107413a19e1a/payload.json)'
