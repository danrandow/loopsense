  entities:
  - id: entity0
    label: Fine-tune sensor y
    notes: 'Shifted sensor y-positions forward by +0.005 from last iteration to improve
      early line detection and control anticipation, retaining sensor size 0.016 and
      wheel track 0.16 for robustness and stability. This fine adjustment aims to
      reduce line loss events and steering oscillations, improving progress and completion
      on development tracks.


      ### Rationale


      Telemetry and integrator feedback show persistent line loss events and steering
      oscillations despite previous geometry changes. Increasing sensor size and wheel
      track improved noise robustness and turning stability, but line loss still occurs
      once per run. A smaller forward shift of +0.005 in sensor y-positions is a reasonable
      fine-tuning step to detect the line earlier and enhance control anticipation
      without destabilizing sensor weighting. This should reduce line loss events
      and improve control smoothness, as supported by telemetry evidence.


      - [Open this output](iteration-3/entity0/versions/e78cef26ee5044c9af4c772b81d8c026/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-1b96c8f9c958f030/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-8a5eb7bc2900bd19/payload.json)'
  - id: entity1
    label: Forward-shifted sensors
    notes: 'Shifted sensor y-positions forward by +0.005 to improve early line detection
      and control anticipation, aiming to reduce line loss events and steering oscillations.
      Controller parameters retained as geometry changes are minor and previous values
      were effective.


      ### Rationale


      Telemetry shows persistent line loss events and steering oscillations despite
      previous geometry changes. Sensor size and wheel track are optimal for noise
      robustness and turning stability. A small forward shift (+0.005) in sensor y-positions
      is a fine-tuning step to detect the line earlier and improve control anticipation
      without destabilizing sensor weighting. This should reduce line loss events
      and improve control smoothness, supported by telemetry evidence.


      - [Open this output](iteration-3/entity1/versions/b8d2d21023f04239a22e1ac164c81b6e/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/e78cef26ee5044c9af4c772b81d8c026/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-8a5eb7bc2900bd19/payload.json)'
  - id: entityR1
    label: Feedback on sensor
    notes: 'Feedback explains that sensor size and wheel track are optimal, but line
      loss persists due to slightly late line detection. Recommends forward-shifting
      sensor y-positions by +0.005 to improve detection and control anticipation,
      expecting reduced line loss and smoother steering.


      ### Feedback


      The current geometry with sensor size 0.016 and wheel track 0.16 provides good
      noise robustness and turning stability, which the controller leverages well.
      However, line loss events still occur once per run, indicating the sensors detect
      the line slightly late, causing steering oscillations and off-track terminations.
      The controller compensates by maintaining moderate base speed and gains, but
      cannot fully prevent line loss. The forward shift of sensor y-positions by +0.005
      in this iteration aims to detect the line earlier and improve control anticipation,
      which should reduce line loss and oscillations. This is a fine adjustment rather
      than a major redesign, preserving the stable aspects of the geometry.


      ### Requested changes


      - sensor_positions[*].y increased by +0.005 (e.g., from 0.055 to 0.06 for front
      sensors) to improve early line detection and control anticipation

      - retain sensor_size at 0.016 to maintain noise robustness

      - retain wheel_track at 0.16 to preserve turning stability


      - [Open this output](iteration-3/entityR1/versions/b8d2d21023f04239a22e1ac164c81b6e/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/e78cef26ee5044c9af4c772b81d8c026/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-8a5eb7bc2900bd19/payload.json)'
