map:
  id: race-180-opt-eval
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: kp 6.0, kd 0.2 (reduce
    notes: 'Lowers kp from 8.0 to 6.0 and keeps kd 0.2, because iteration 2 raised
      steering_oscillation to about 0.15 on the oval without lowering max_error. Geometry
      and base_speed are unchanged to isolate the gain change.


      ### Rationale


      Evidence from iteration 2 (kp 8.0, kd 0.2, ki 0.0), 60 trials with zero finishes.
      Progress rose from 0.04-0.125 to 0.18 on the oval, 0.10 on the s-bend and 0.085
      on the slalom, and score rose from 27.4 to 49.8, so the proportional gain is
      the right lever. Two signs point to overshoot rather than a stable fix. steering_oscillation
      rose from about 0.07 to 0.13-0.15 on all tracks, and the oval reached 0.1517,
      just above the 0.15 threshold in the Evaluator''s plan. max_error did not fall;
      it went from 0.060 to 0.066 on the oval, so the robot still leaves the 0.06
      m band. The s-bend score spread (19.5 to 57.2) shows the run is sensitive to
      seed. Action: reduce kp from 8.0 to 6.0, the step the Evaluator named, and keep
      kd at 0.2 to damp the response. Geometry, base_speed, ki and line_loss are unchanged,
      so this race isolates the gain change. Expected result: steering_oscillation
      falls back to about 0.10, max_error stays near 0.06 or below, and progress holds
      at or above the kp 8 level (about 0.15 to 0.2 on the oval). Hypotheses: (1)
      if oscillation drops and progress keeps rising, the gain is near the stable
      range and sensor geometry is next. (2) if progress still stalls at one point
      with low oscillation, the 25 mm tape and 12 mm sensors leave a dead band near
      centre, so the next revision should set sensor_size 0.016 and keep kp 6.0. (3)
      if the robot tracks the line but completion_time exceeds 3 s, raise base_speed
      to 1.6. Measurements to see next: progress and max_error per track, steering_oscillation,
      and line_loss_events, to show whether the offset is gone or the robot is still
      leaving the line.


      - [Open this output](iteration-3/entity0/versions/874bac2b25504ab3aadee73ea49cace0/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-13d2267579039a12/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-c30025df39ebca02/payload.json)'
  - id: entityR1
    label: Approve kp 6 gain test
    notes: 'Approved the single-group change kp 8.0 to 6.0 (kd 0.2 kept), which tests
      whether iteration 2''s steering oscillation of 0.13 to 0.15 can be reduced without
      losing progress. The score of 49.78 from iteration 2 is the baseline, and the
      feedback sets out next steps for sensor size and base speed depending on what
      this race shows.


      ### Feedback


      Judged from earlier races only. Iteration 2 (kp 8.0, kd 0.2, ki 0.0) is the
      best raced design at score 49.78, with progress 0.18 on the oval, 0.10 on the
      s-bend and 0.085 on the slalom. Iterations 0 and 1 (kp 5.0) stalled at progress
      0.04 to 0.125. Iteration 2 also raised steering_oscillation to 0.13 to 0.15
      on every track (0.15 on the oval), and max_error stayed at about 0.066 on the
      oval, so the robot still leaves the 0.06 m band. This candidate changes one
      group only, kp from 8.0 to 6.0. Geometry, base_speed, ki, kd and line_loss are
      unchanged, so the race isolates the gain step. Every field is inside its contract
      range. I state no outcome for this candidate. Approve because it is a clean,
      single-group test of the overshoot diagnosis, and a race is needed to learn
      whether the 0.15 oscillation or the progress gain matters more. Next race: (a)
      if steering_oscillation falls near 0.10 and progress holds at or above the kp
      8 level, keep kp near 6 and move to sensor geometry. (b) If progress drops clearly
      below the kp 8 level (oval below about 0.15), return to kp 7.0 and keep kd 0.2,
      since the gain is the main source of progress. (c) If progress stalls at a fixed
      point with low oscillation, the sensor dead band around the centre sensor (0.012
      m sensors, 0.02 m spacing, 0.025 m tape) is the likely cause, so change sensor_size
      to 0.016 next. (d) If the robot tracks the line but completion_time exceeds
      3 s, raise base_speed to 1.6. Change one group per revision.


      ### Requested changes


      - If steering_oscillation falls near 0.10 and progress holds at or above the
      kp 8 level (oval about 0.15 to 0.18), keep kp 6.0 and set sensor_size = 0.016
      next, because the dead band around the centre sensor is the likely remaining
      cause of the standing offset (iteration 2 max_error 0.066 on the oval).

      - If progress drops clearly below the kp 8 level, set kp = 7.0 with kd = 0.2,
      because iteration 2 (kp 8.0) gave progress 0.18 on the oval versus 0.125 at
      kp 5.0.

      - If the robot tracks the line but completion_time exceeds 3 s with no off-track
      event, set base_speed = 1.6, since the 3.0 s limit needs an average speed of
      about 1.5 m/s.


      - [Open this output](iteration-3/entityR1/versions/e26110dd27784a848ab5236d0be516fe/payload.json)

