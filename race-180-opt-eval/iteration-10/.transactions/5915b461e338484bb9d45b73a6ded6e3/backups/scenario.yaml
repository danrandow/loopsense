map:
  id: race-180-opt-eval
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: kd 0.2 + search_right
    notes: 'Reverts kd to the iteration 6 value (0.3 cost progress in iteration 8)
      and tests line_loss = search_right alone against iteration 6 (64.74). The aim
      is to cut the slalom line loss, which has occurred once per run in every race
      with progress stuck near 0.10.


      ### Rationale


      Evidence: iteration 6 (outer sensors at x = ±0.06, sensor_size 0.016, kp 7.0,
      kd 0.2, ki 0.0, last_direction) is the best raced design at 64.74. Iteration
      8 changed kd to 0.3 and scored 62.23. Oval progress fell from 0.218 to 0.202
      and slalom from 0.103 to 0.096, while oscillation fell only modestly (oval 0.159
      to 0.156, s-bend 0.173 to 0.130). Derivative gain 0.3 therefore trades progress
      for smoothness, and progress drives the score, so kd returns to 0.2. Iteration
      7 (kp 6.5) also showed that lowering kp cuts s-bend progress from 0.140 to 0.059,
      so kp stays at 7.0. Slalom has lost the line once per run in every race (iterations
      0 to 8) with progress stuck near 0.10. The one change from iteration 6 is line_loss
      = search_right, which steers toward the left when the line is lost. It is tested
      alone against iteration 6 so that the result is not confounded by kd. Change:
      controller.line_loss set to search_right; kd set to 0.2. Everything else (kp
      7.0, ki 0.0, base_speed 1.4, the weights, and all geometry) is unchanged from
      iteration 6. Expected result: slalom line_loss_events fall toward 0 and slalom
      progress rises above 0.10, with oval and s-bend progress near iteration 6 (oval
      about 0.22, s-bend about 0.14). Interpretation: if slalom improves and the oval
      and s-bend hold, keep search_right. If slalom progress falls or the oval or
      s-bend worsen, revert to last_direction and address slalom through geometry,
      such as outer sensors at x = ±0.08. If the robot tracks without off_track but
      completion_time exceeds 3 s, raise base_speed to 1.6 in a later single-group
      revision. Measurements wanted: progress, max_error, line_loss_events and steering_oscillation
      per track, plus completion_time and rms_error.


      - [Open this output](iteration-9/entity0/versions/a7d7f5c1707e4c6e955a066d92b05d41/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/830eae848ad84e5ab170c8e68aa2bb39/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-d956ab58febb65b5/payload.json)'
  - id: entityR1
    label: 'Approve: search_right'
    notes: 'Approved the single-field change line_loss last_direction to search_right
      on the iteration 6 best design, to test the slalom line loss that has occurred
      once per run in every race. Rests on iteration 0 to 7 telemetry showing slalom
      progress stuck near 0.10 and oval and s-bend unaffected by line loss.


      ### Feedback


      Written before this candidate races, so no outcome is stated for it. The candidate
      is a single-field change from iteration 6, the best raced design (score 64.74):
      controller.line_loss goes from last_direction to search_right. Every other field
      (kp 7.0, kd 0.2, ki 0.0, base_speed 1.4, the weights, and all geometry, including
      the outer sensors at x = ±0.06 and sensor_size 0.016) is unchanged. All values
      are inside the contract ranges. The evidence supports the test. Slalom has lost
      the line exactly once per run in every race (iterations 0 to 7), with progress
      stuck near 0.10 (iteration 6: 0.1025). Oval and s-bend showed 0 line-loss events
      in iteration 6, so this field is only expected to act on slalom. Interpret the
      next race as follows. (a) If slalom line_loss_events fall toward 0 and slalom
      progress rises above about 0.10, while oval and s-bend hold near iteration 6
      (oval about 0.22, s-bend about 0.14), keep search_right. (b) If slalom progress
      falls or any other track worsens, revert to last_direction; the search direction
      is then the wrong sign for this course, and slalom should be addressed through
      geometry (outer sensors at x = ±0.08) instead. (c) If the robot tracks without
      off_track but completion_time exceeds 3 s, raise base_speed to 1.6 in a later
      single-group revision. Approve: the change is low risk and isolates one field,
      and two more iterations remain, so race telemetry is worth more than another
      paper revision.


      ### Requested changes


      - If slalom line_loss_events fall and slalom progress rises above about 0.10
      with oval and s-bend held near iteration 6 (oval about 0.22, s-bend about 0.14),
      keep line_loss = search_right and test outer sensors at x = ±0.08 as the next
      single-group change for slalom.

      - If slalom progress falls or oval or s-bend worsen, set line_loss = last_direction
      again (iteration 6 value), since the search direction would then be the wrong
      way for the course.

      - If the robot tracks without off_track but completion_time exceeds 3 s, set
      base_speed = 1.6 in a single-group revision, because the 3.0 s limit needs an
      average speed of about 1.5 m/s.


      - [Open this output](iteration-9/entityR1/versions/b899b642f6324ffbad70bbcfccc4bb2f/payload.json)

