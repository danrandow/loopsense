map:
  id: race-180-opt-eval
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Outer sensors at x=±0.08
    notes: 'Widens the outer sensors from ±0.06 to the ±0.08 contract maximum, the
      single geometry change for the slalom stall. Iteration 9 showed search_right
      had no measurable effect, and slalom progress has stayed at 0.1025 across gain
      and sensor changes, which points to a reach limit.


      ### Rationale


      Evidence. Iteration 9 (search_right, otherwise identical to iteration 6) scored
      64.7408 against 64.7409 for iteration 6. Every per-track metric is unchanged
      to four decimals: slalom progress 0.1025 with one line-loss event per run, oval
      progress 0.2175, s-bend progress 0.14. The line-loss direction therefore has
      no measurable effect, so the slalom stall is not a search-direction problem.
      Slalom progress has sat at 0.1025 across iterations 3, 4, 5, 6 and 9, whatever
      the gain (kp 6 to 7), sensor size or line-loss setting. That points to a fixed
      geometric limit: the outer sensors are not reaching the tape early enough on
      the slalom''s sharp bends. Iteration 6 showed that moving the outer sensors
      from x = +/-0.04 to +/-0.06 lifted s-bend progress from 0.04 to 0.14, which
      is the same kind of reach limit.


      Change. Outer sensors move from x = +/-0.06 to x = +/-0.08, the contract maximum,
      at y = 0.04. This is the single-group geometry change the Evaluator''s plan
      names for slalom. I keep line_loss = search_right, since it did no harm and
      it matches the race-tested design, and I keep kp 7.0, kd 0.2, ki 0.0, base_speed
      1.4, sensor_size 0.016 and the weights unchanged.


      Expected result. Slalom line_loss_events fall toward 0 and slalom progress rises
      above 0.10. Oval and s-bend hold near iteration 6 (oval about 0.22, s-bend about
      0.14). Hypotheses: (1) If slalom improves with the others held, keep the +/-0.08
      sensors. (2) If the s-bend or oval worsens, the wider spread costs more than
      it gains, so return to +/-0.06 and address slalom through base_speed or sensor
      forward position (y). (3) If the robot tracks without off_track but completion_time
      exceeds 3 s, raise base_speed to 1.6 in a later single-group revision. Measurements
      wanted: progress, max_error, line_loss_events and steering_oscillation per track,
      plus completion_time and rms_error.


      - [Open this output](iteration-10/entity0/versions/5915b461e338484bb9d45b73a6ded6e3/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-55b1dfa9f82e8e50/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-625c0671cc22630e/payload.json)'
  - id: entityR1
    label: 'Approve: outer sensors'
    notes: 'Approved the single-group test of outer sensors at x = ±0.08 (the contract
      maximum), kept line_loss search_right and kp 7.0. Evidence: slalom progress
      is stuck at 0.1025 across iterations 3 to 9, and moving the outer sensors ±0.04
      to ±0.06 lifted s-bend progress from 0.04 to 0.14 in iteration 6. Iteration
      9 showed the line-loss direction has no effect.


      ### Feedback


      Approved for the race. Judged from earlier races and the candidate''s own contents
      only. This candidate has not raced, so it states no outcome. It is valid: sensors
      at x = ±0.08 are on the contract maximum, which is allowed, and every other
      field is inside range. It changes one group, the outer sensor geometry, from
      the best raced design (iteration 6, 64.7409). Iteration 9 showed that line_loss
      search_right changes nothing (64.7408 against 64.7409, identical per-track metrics),
      so the line-loss direction is not a lever and should stay as it is. Slalom progress
      has sat at 0.1025 across iterations 3 to 6 and 9 whatever the gain or sensor
      size, which points to reach. Iteration 6 showed that moving the outer sensors
      from ±0.04 to ±0.06 lifted s-bend progress from 0.04 to 0.14. Two cautions:
      at the edge of the allowed range, the outer weights act on the tape earlier
      and may raise steering_oscillation further (it was 0.159 on the oval and 0.173
      on the s-bend at iteration 6), and the oval may lose some progress, as it did
      at ±0.06 with sensor_size 0.016. With two iterations left, racing this change
      is worth more than another paper revision. Reading the race: (a) If slalom progress
      rises above about 0.10 and line_loss_events fall toward 0 while the s-bend holds
      near 0.14, keep ±0.08 for the final design. (b) If the s-bend or oval falls
      below iteration 6 levels, the spread has passed its useful range, so return
      to ±0.06 and take slalom reach through base_speed or sensor forward position
      (y). (c) If the robot tracks without off_track but completion_time exceeds 3
      s, raise base_speed to 1.6 in a single-group revision. Report progress, max_error,
      line_loss_events and steering_oscillation per track, plus completion_time and
      rms_error.


      ### Requested changes


      - If slalom progress rises above 0.10 with line_loss_events near 0 and s-bend
      near 0.14 (iteration 6 baseline), keep sensor x = ±0.08 and carry it into the
      final design; iteration 6 showed the ±0.04 to ±0.06 step lifted s-bend progress
      from 0.04 to 0.14.

      - If the s-bend or oval falls below the iteration 6 levels (s-bend 0.14, oval
      0.22), return the outer sensors to x = ±0.06, since the wider spread costs more
      than it gains, and address slalom through base_speed or sensor y position.

      - If the robot tracks without off_track but completion_time exceeds 3 s, set
      base_speed = 1.6 in a single-group revision, because the 3.0 s limit needs an
      average speed of about 1.5 m/s.


      - [Open this output](iteration-10/entityR1/versions/9c8f73518fd64c0da89a45ca64ab51b4/payload.json)

