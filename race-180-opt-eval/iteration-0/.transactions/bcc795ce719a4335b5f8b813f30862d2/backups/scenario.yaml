overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'A conservative first candidate: five sensors at 2 cm spacing, kp 5, kd
      0.1, base speed 1.4, and last-direction line recovery. It is built from the
      contract alone, since no race data exists yet.


      ### Rationale


      Iteration 0 has no race data, so this is a conservative baseline built from
      the contract. Geometry: five line sensors spread across the 80 mm width (x =
      -0.04 to +0.04 m, step 0.02 m) at y = 0.04 m, ahead of the axle, so the controller
      sees the line before the wheels reach it. Sensor size 0.012 m is smaller than
      the 25 mm tape, so each sensor reads cleanly. Wheel track 0.12 m and radius
      0.03 m give moderate turn authority. Mass 0.7 kg and a 0.12 m body width keep
      yaw inertia low and the off-track limit at max(0.06, 0.0125 + 0.03) = 0.06 m.
      Controller: sensor weights [-1, -0.5, 0, 0.5, 1] match the signs of x, so a
      line to the left gives a positive signal and steers left. kp = 5 gives about
      350 PWM of differential per 0.2 signal, which should correct a 1 cm offset without
      saturating. ki = 0 avoids integral windup on curves. kd = 0.1 damps the response
      a little without amplifying sensor noise. base_speed = 1.4 (about 70 percent
      PWM) aims for the roughly 1.5 m/s average needed to finish in 3 s while leaving
      margin for the bends. line_loss = last_direction, so the robot turns back toward
      the side it last saw the line. Expected result: completion on the oval and s-bend,
      with rms_error around 0.02 m. The slalom and sharp bends are the main risk:
      speed may need to drop there, or kp may need to rise if the robot oscillates.


      - [Open this output](iteration-0/entity0/versions/0e72b2a25f4845e9b5fc40ee4ea20d64/payload.json)'
  - id: entityR1
    label: 'Baseline review: approve'
    notes: 'The candidate is a valid, unmodified contract baseline, with all fields
      within their ranges and consistent steering signs. No race data exists yet,
      so approval gives the first telemetry, and the feedback sets conditional changes
      to kp, base_speed and sensor geometry for the next race.


      ### Feedback


      No earlier race exists yet (iteration 0), so the only evidence is the contract
      and this candidate''s own contents. Every field is inside its allowed range:
      sensor y = 0.04 is within [-0.06, 0.08], x spans -0.04 to +0.04 within ±0.08,
      sensor_size 0.012 is an allowed option, and the weights [-1, -0.5, 0, 0.5, 1]
      are within ±2. Signs are consistent: a line on the left gives a positive signal,
      which steers left, as the contract requires. The design is valid and not obviously
      broken, so it is approved as the baseline. Racing it gives the first telemetry.
      Interpret the next race as follows. If steering_oscillation is high or max_error
      approaches 0.06 m on the slalom or sharp bends, the controller is over-steering:
      lower kp (for example 4) and keep kd near 0.1. If the robot is stable but completion_time
      is above about 3 s or progress stalls short of 1.0 on the slalom, raise base_speed
      in small steps, or lower it if off-track occurs on bends. If line_loss_events
      is above zero, the sensors are losing the line on sharp bends: move the outer
      sensors further out (x = ±0.06) or widen the sensor_size to 0.016 before changing
      gains. Change one group of fields per revision so each race stays readable.


      ### Requested changes


      - No revision requested yet. If the next race shows high steering_oscillation
      or max_error near 0.06 m on the slalom, try kp = 4.0 with kd = 0.1, which reduces
      over-steering.

      - If completion_time is above about 3 s with progress below 1.0 and no off-track
      event, try base_speed = 1.6 to 1.8.

      - If line_loss_events is above zero, try wider outer sensors (x = ±0.06) or
      sensor_size = 0.016 before changing the gains.


      - [Open this output](iteration-0/entityR1/versions/c1cae5f9960c44d6865100fb749fd3ab/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/0e72b2a25f4845e9b5fc40ee4ea20d64/payload.json)'
  - id: entity1
    label: Approved Robot Build
    notes: 'Approved Robot Build. The model did not supply a valid label and summary,
