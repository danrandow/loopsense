  entities:
  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'A conservative first candidate: five sensors at 2 cm spacing, kp 5, kd
      0.1, base speed 1.4, and last-direction line recovery. It is built from the
      contract alone, since no race data exists yet.


      ### Rationale


      Iteration 0 has no race data, so this is a conservative baseline built from
      the contract. Geometry: five line sensors spread across the 80 mm width (x =
      -0.04 to +0.04 m, step 0.02 m) at y = 0.04 m, ahead of the axle, so the controller
      sees the line before the wheels reach it. Sensor size 0.012 m is smaller than
      the 25 mm tape, so each sensor reads cleanly. Wheel track 0.12 m and radius
      0.03 m give moderate turn authority. Mass 0.7 kg and a 0.12 m body width keep
      yaw inertia low and the off-track limit at max(0.06, 0.0125 + 0.03) = 0.06 m.
      Controller: sensor weights [-1, -0.5, 0, 0.5, 1] match the signs of x, so a
      line to the left gives a positive signal and steers left. kp = 5 gives about
      350 PWM of differential per 0.2 signal, which should correct a 1 cm offset without
      saturating. ki = 0 avoids integral windup on curves. kd = 0.1 damps the response
      a little without amplifying sensor noise. base_speed = 1.4 (about 70 percent
      PWM) aims for the roughly 1.5 m/s average needed to finish in 3 s while leaving
      margin for the bends. line_loss = last_direction, so the robot turns back toward
      the side it last saw the line. Expected result: completion on the oval and s-bend,
      with rms_error around 0.02 m. The slalom and sharp bends are the main risk:
      speed may need to drop there, or kp may need to rise if the robot oscillates.


      - [Open this output](iteration-0/entity0/versions/0e72b2a25f4845e9b5fc40ee4ea20d64/payload.json)'
  actions:
  - id: action0
