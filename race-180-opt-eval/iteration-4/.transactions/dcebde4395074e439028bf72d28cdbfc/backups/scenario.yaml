map:
  id: race-180-opt-eval
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: kp 7.0, kd 0.2 retest
    notes: 'Moves kp from 6.0 back toward 7.0 (between the raced 6.0 and 8.0 points)
      with kd 0.2, a single-group change. Iteration 3 (kp 6) dropped progress and
      score (36.1 vs 49.8 at kp 8), so the gain needs to stay near 7 to 8.


      ### Rationale


      Evidence. Iteration 2 (kp 8.0, kd 0.2) raised progress to 0.18 on the oval,
      0.10 on the s-bend and 0.085 on the slalom, and scored 49.78. Iteration 3 (kp
      6.0, kd 0.2) fell back to progress 0.12 / 0.04 / 0.10 and scored 36.05. Progress
      therefore tracks proportional gain, and kp 6 is clearly too weak. Steering oscillation
      at kp 8 was 0.13 to 0.15, above the 0.10 I had hoped for at kp 6, but the kp
      6 run did not reduce it enough to justify keeping that lower gain. The oval
      max_error stayed near 0.06 to 0.066 at both gains, so the standing offset is
      not yet resolved. All runs still end off_track with one line-loss event.


      Change. kp goes from 6.0 back to 7.0, midway between the two raced points, with
      kd kept at 0.2. This follows the Evaluator''s branch (b): progress has dropped
      below the kp 8 level, so return toward kp 7 and keep kd at 0.2. Geometry, base_speed,
      ki and line_loss are unchanged, so the race isolates the gain step.


      Expected result. Progress near 0.15 to 0.18 on the oval, steering_oscillation
      between about 0.10 and 0.14, and max_error near 0.06.


      Hypotheses and next steps. (a) If progress holds near the kp 8 level and oscillation
      stays at or below about 0.13, keep kp near 7 and move to sensor geometry: set
      sensor_size to 0.016 to reduce the centre-sensor dead band against the 25 mm
      tape. (b) If progress is still below about 0.15 on the oval, the gain is not
      the main limit, so test sensor geometry (sensor_size 0.016) at kp 8. (c) If
      the robot tracks the line with no off-track event but completion_time exceeds
      3 s, raise base_speed to 1.6 in a later single-group revision.


      Measurements wanted: progress and max_error per track, steering_oscillation,
      line_loss_events, completion_time, and rms_error, so I can separate offset from
      oscillation.


      - [Open this output](iteration-4/entity0/versions/70c454a149344368a0685e4385ff788a/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-4baacbfd395c4f88/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-ad6d2b1d340927ca/payload.json)'
  - id: entityR1
    label: Approve kp 6 gain test
    notes: 'Approved the single-group change kp 8.0 to 6.0 (kd 0.2 kept), which tests
      whether iteration 2''s steering oscillation of 0.13 to 0.15 can be reduced without
      losing progress. The score of 49.78 from iteration 2 is the baseline, and the
      feedback sets out next steps for sensor size and base speed depending on what
      this race shows.


      ### Feedback


      Judged from earlier races only. Iteration 2 (kp 8.0, kd 0.2, ki 0.0) is the
      best raced design at score 49.78, with progress 0.18 on the oval, 0.10 on the
      s-bend and 0.085 on the slalom. Iterations 0 and 1 (kp 5.0) stalled at progress
      0.04 to 0.125. Iteration 2 also raised steering_oscillation to 0.13 to 0.15
      on every track (0.15 on the oval), and max_error stayed at about 0.066 on the
      oval, so the robot still leaves the 0.06 m band. This candidate changes one
      group only, kp from 8.0 to 6.0. Geometry, base_speed, ki, kd and line_loss are
      unchanged, so the race isolates the gain step. Every field is inside its contract
      range. I state no outcome for this candidate. Approve because it is a clean,
      single-group test of the overshoot diagnosis, and a race is needed to learn
      whether the 0.15 oscillation or the progress gain matters more. Next race: (a)
      if steering_oscillation falls near 0.10 and progress holds at or above the kp
      8 level, keep kp near 6 and move to sensor geometry. (b) If progress drops clearly
      below the kp 8 level (oval below about 0.15), return to kp 7.0 and keep kd 0.2,
      since the gain is the main source of progress. (c) If progress stalls at a fixed
      point with low oscillation, the sensor dead band around the centre sensor (0.012
      m sensors, 0.02 m spacing, 0.025 m tape) is the likely cause, so change sensor_size
      to 0.016 next. (d) If the robot tracks the line but completion_time exceeds
      3 s, raise base_speed to 1.6. Change one group per revision.


      ### Requested changes


      - If steering_oscillation falls near 0.10 and progress holds at or above the
      kp 8 level (oval about 0.15 to 0.18), keep kp 6.0 and set sensor_size = 0.016
      next, because the dead band around the centre sensor is the likely remaining
      cause of the standing offset (iteration 2 max_error 0.066 on the oval).

      - If progress drops clearly below the kp 8 level, set kp = 7.0 with kd = 0.2,
      because iteration 2 (kp 8.0) gave progress 0.18 on the oval versus 0.125 at
      kp 5.0.

      - If the robot tracks the line but completion_time exceeds 3 s with no off-track
      event, set base_speed = 1.6, since the 3.0 s limit needs an average speed of
      about 1.5 m/s.


