  id: race-180-opt-eval
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Outer sensors at x=±0.06
    notes: 'Single-group change from iteration 5: outer sensors moved from x=±0.04
      to ±0.06, with sensor_size 0.016 and kp 7.0 kept. Iteration 5 left s-bend progress
      flat at 0.040 and max_error near 0.062, which points to a bend the sensors cannot
      reach, so this tests whether wider outer sensors see the line earlier.


      ### Rationale


      Evidence from iteration 5 (sensor_size 0.016, kp 7.0, kd 0.2, ki 0.0): the best
      raced score so far at 60.49. Oval progress rose to 0.30 (from 0.19 at sensor_size
      0.012), and oval max_error held at 0.061. The s-bend, however, is unchanged:
      progress is still 0.040, and max_error is 0.0616 with one line-loss event per
      run. Every track still ends off_track, and steering_oscillation is 0.07 to 0.17.
      Because the s-bend stall did not move after the sensor-size change, the dead-band
      explanation no longer accounts for it. The likely cause is a bend that the sensors
      cannot follow: the outer sensors at x = ±0.04 see the tape too late when the
      line curves sharply, so the robot leaves it. This is branch (b) of the Evaluator''s
      plan. Change: move the two outer sensors from x = ±0.04 to x = ±0.06 (y stays
      0.04), keeping sensor_size 0.016, kp 7.0, kd 0.2, ki 0.0, base_speed 1.4, the
      weights [-1, -0.5, 0, 0.5, 1] and line_loss last_direction. This is a single-group
      geometry change. Expected result: s-bend progress rises clearly above 0.04 and
      max_error falls below about 0.06 m on the s-bend, because the outer sensors
      see the line earlier on the bend. Oval progress should hold near 0.30. Hypotheses:
      (1) if s-bend progress rises, the sensor reach was the limit, and the next step
      is to lower kp to about 6.5 to reduce steering_oscillation. (2) If s-bend progress
      is still flat at 0.04, the limit is elsewhere (base_speed or the line-loss behaviour
      at the bend), and the next revision should test line_loss search_right or a
      lower base_speed. (3) If the robot tracks without off_track but completion_time
      exceeds 3 s, raise base_speed to 1.6 in a later single-group revision. Measurements
      wanted: progress, max_error and line_loss_events per track (especially s-bend),
      steering_oscillation, completion_time and rms_error.


      - [Open this output](iteration-6/entity0/versions/bda24f2deb874edd9a9e8c59fd2bd6fe/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-3581074ed80ea499/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-caae00a11b62129d/payload.json)'
  - id: entityR1
    label: 'Approve: outer sensors'
    notes: 'Approved the single-group test of moving the outer sensors from x = ±0.04
      to ±0.06 at the best raced gains (iteration 5, 60.49). The flat s-bend progress
      of 0.040 across kp 5 to 7 and unchanged by sensor_size 0.016 points to sensor
      reach at the bend, and approval keeps an early iteration moving with runs to
      spare.


      ### Feedback


      Written before this candidate races, so no outcome is stated for it. The candidate
      is a single-group geometry change from the best raced design (iteration 5, score
      60.49): the outer sensors move from x = ±0.04 to x = ±0.06 at y = 0.04. sensor_size
      0.016, kp 7.0, kd 0.2, ki 0.0, base_speed 1.4, the weights [-1, -0.5, 0, 0.5,
      1] and line_loss last_direction are unchanged. All values are inside the contract
      ranges, and x = ±0.06 is within ±0.08.


      The evidence supports this test. The s-bend progress has been flat at 0.040
      across kp 5, 6 and 7 (iterations 0, 3, 4) and did not move when sensor_size
      went from 0.012 to 0.016 (iteration 5). The gain and dead-band explanations
      therefore no longer account for the s-bend stall. Oval progress rose with kp
      (0.12 at kp 6, 0.19 at kp 7, 0.18 at kp 8), and oval max_error has stayed at
      0.060 to 0.066 m with one line-loss event per run, so the outer-sensor reach
      is a reasonable next suspect.


      A caution: moving the outer weights outward makes the signal more sensitive
      at the edges, so steering_oscillation may rise. Iteration 2 (kp 8) reached 0.13
      to 0.15 on this, so watch oscillation along with progress.


      Read the next race as follows. (a) If s-bend progress rises clearly above 0.04
      and max_error falls below about 0.06 m, keep the outer sensors at ±0.06 and
      lower kp to 6.5 (kd 0.2) to bring steering_oscillation down from the 0.17 seen
      on the oval at iteration 5. (b) If s-bend progress is still 0.04 with the same
      max_error, the limit is elsewhere (base_speed or line-loss behaviour at the
      bend), so the next single-group revision should test line_loss search_right
      or a lower base_speed (about 1.2). (c) If the robot tracks without off_track
      but completion_time exceeds 3 s, raise base_speed to 1.6 in a later single-group
      revision. Report progress, max_error and line_loss_events per track, steering_oscillation,
      completion_time and rms_error.


      ### Requested changes


      - If s-bend progress rises above 0.04 and max_error falls below about 0.06 m
      with the ±0.06 outer sensors, keep the geometry and set kp = 6.5 with kd = 0.2,
      since kp 8 raised steering_oscillation to 0.13 to 0.15 (iteration 2) and oval
      oscillation reached 0.174 at kp 7 (iteration 5).

      - If s-bend progress stays at 0.04 with the same max_error, keep the ±0.06 sensors
      and set line_loss = search_right, because every run loses the line once (line_loss_events
      1.0 in iterations 0 to 5) and the robot leaves the tape at the bend.

      - If the robot tracks without off_track but completion_time exceeds 3 s, set
      base_speed = 1.6 in a single-group revision, since the 3.0 s limit needs an
      average speed of about 1.5 m/s.


