objective:
  statement: Your team builds a line-following robot, and the race simulator scores
    it. Your goal is to maximise that score. The score that counts is measured once,
    after the last iteration, on an unseen track of a different shape from the development
    track, so favour designs that generalise over designs tuned to the development
    track. After each iteration you receive the full telemetry of the development
    races of the design built in the previous iteration. Use it to diagnose what went
    wrong and improve the design.
