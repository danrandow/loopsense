overrides:
  entities:
  - id: entity0
    label: Robot Candidate
    notes: 'Updated geometry and controller settings to improve stability and reduce
      line loss based on telemetry feedback.


      ### Rationale


      The telemetry indicates significant issues with line loss and control effort,
      with a maximum error of 0.064961 and control effort of 0.850416. To improve
      stability and reduce line loss, I increased the wheel track to 0.18, adjusted
      the sensor positions for better distribution, and lowered the kp value to 0.8
      to reduce overshooting. These changes should enhance the robot''s ability to
      follow the line more effectively and reduce stalling, leading to improved performance
      in future trials.


      - [Open this output](iteration-4/entity0/versions/1a72b46d03f24d2ab8a79d4c91249084/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-8f68f3d4902f1130/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-e5e043c0ce716d7e/payload.json)'
  - id: entity1
    label: Approved Robot Build
    notes: 'The candidate has been approved for racing, pending further adjustments
      based on feedback.


      - [Open this output](iteration-3/entity1/versions/8d62f375fa7c46fab5bf040df474bac5/payload.json)

