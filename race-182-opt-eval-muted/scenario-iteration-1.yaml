map:
  id: race-182-opt-eval-muted
  schema: v0.2
  scenario: Iteration 1
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 0.
dimensions:
  time_horizon: prepared
  iteration: '1'
overrides:
  entities:
  - id: entity0
    label: Slower, stronger steering
    notes: 'Base speed cut to 1.2 and kp, ki and kd raised, with sensors moved forward
      and spread wider, to stop the robot leaving the tape. All development trials
      ended off track at progress 0.11 to 0.17, with max error just above the 0.0575
      m limit and small oscillation, so the fix targets drift and lag.


      ### Rationale


      Evidence: all 60 development trials ended off track on every track (oval, s-bend,
      slalom). Progress was only 0.11 to 0.17, so the robot leaves the tape within
      the first half metre. Max error (0.061 to 0.066) exceeds the off-track limit
      of about 0.0575 m, while RMS error (0.03 to 0.034) and steering oscillation
      (0.07 to 0.17) are small. The robot is therefore drifting outward at a steady
      rate rather than oscillating. Line-loss events (1 to 2) show the line leaves
      the sensor array during these excursions. Likely causes: (a) base_speed 1.6
      is too fast for the bends and the steering response lags; (b) ki = 0 leaves
      the constant left/right motor mismatch uncorrected, so the robot carries a steady
      offset that accumulates on curves; (c) the sensors at y = 0.03 see the line
      late, so the controller reacts after the wheels are already off line.


      Changes: (1) base_speed 1.6 -> 1.2 to give the controller time to correct on
      bends, which is the main fix for surviving the track; the finish-time term is
      secondary to not leaving the line. (2) kp 3.0 -> 4.0 for a stronger correction
      of offset. (3) ki 0 -> 0.2 to cancel the fixed motor mismatch. The integral
      is capped at ±2, so the turn contribution stays bounded at 0.4. (4) kd 0.2 ->
      0.6 to damp the faster kp response. (5) Sensors moved forward to y = 0.05 for
      look-ahead, and spread to x = ±0.03 (spacing 1.5 cm, 12 mm footprint) so the
      array keeps seeing tape through wider bends. (6) Mass 0.8 -> 0.6 kg to reduce
      yaw inertia so the robot turns more quickly. Body and wheel geometry are otherwise
      unchanged. Body width stays at 0.18 m, the maximum, which gives the widest off-track
      allowance (0.0575 m).


      Expected result: nonzero completion on the oval and s-bend, with progress well
      above 0.2 and line-loss events near zero. Completion within 3 s may not occur
      at 1.2 speed, so completion time is the trade-off to watch. Hypotheses to check
      next: (H1) the off-track failures come mainly from speed, so progress should
      rise sharply when base_speed drops. (H2) ki removes the steady drift, so rms_error
      should fall. (H3) the forward sensors reduce line-loss events. If the robot
      now oscillates (steering_oscillation rising sharply), reduce kp to about 3 and
      keep kd. If it survives but is too slow, raise base_speed in steps of 0.1 while
      watching max_error.


      - [Open this output](iteration-1/entity0/versions/8179d49df86945ea8ba6d684efbd8fac/payload.json)

      - Based on: [entityR2A](iteration-1/entityR2A/versions/carried-4352acafde8ccb7c/payload.json)'
  - id: entityR1
    label: Approve survival-focused
    notes: 'Approved the candidate that cuts base_speed to 1.2 and adds integral,
      stronger kp/kd and forward, wider sensors, because iteration 0 showed every
      run leaving the line at max_error about 0.061 to 0.066 with low rms_error. Feedback
      gives conditional speed and gain steps to take after the race.


      ### Feedback


      Earlier evidence (iteration 0, 60 trials, 0 finishes on any track): every run
      ended off track. Progress was 0.11 to 0.17, max_error was 0.061 to 0.066 against
      an off-track limit of about 0.0575 m for this body width, and rms_error stayed
      low at 0.03 to 0.034. The robot drifts outward steadily rather than oscillating,
      so speed and steady offset are the main suspects, not jitter. This candidate
      addresses that directly: base_speed 1.6 to 1.2, ki 0 to 0.2 to cancel the constant
      motor mismatch, kp 3 to 4 and kd 0.2 to 0.6 for a stronger, damped correction,
      and sensors moved to y = 0.05 with x spread to ±0.03 so they see the line earlier
      and across wider bends. Body width stays at the maximum (0.18 m) for the widest
      off-track allowance. All values are inside the contract ranges and the wheel
      command stays within limits. Nothing here is obviously broken. Because the baseline
      never survived a run, surviving the full course is worth far more than finish
      time (surviving at progress 1 scores roughly 390 even without completion, against
      about 50 for the baseline). The change is the right direction on the evidence,
      so approve it and race it now. It also changes several fields at once, so the
      next race should be read carefully to tell which change did what. Conditional
      follow-ups for after the race: (a) if it survives but completion_time is above
      3 s, raise base_speed in steps of 0.1 (1.3, then 1.4) while watching max_error,
      since completion needs roughly 1.5 m/s average; (b) if steering_oscillation
      rises sharply or max_error grows on the s-bend and slalom, reduce kp to about
      3 and keep kd at 0.6; (c) if line_loss_events stays above 0, widen sensor x
      spread (for example ±0.04 at sensor_size 0.012) before changing gains.


      ### Requested changes


      - If the candidate survives but completion_time exceeds 3 s with low max_error:
      raise base_speed in 0.1 steps (1.3, then 1.4), keeping the other fields fixed,
      because iteration 0 showed off-track failures at speed 1.6 and the 1.2 setting
      is the first survival attempt.

      - If steering_oscillation rises sharply or max_error grows on the s-bend and
      slalom: reduce kp from 4.0 to about 3.0 and keep kd at 0.6, since the baseline''s
      kp 3 with kd 0.2 showed no oscillation problem but the stronger gain is untested.

      - If line_loss_events stays above 0 with the new forward sensors: widen the
      sensor x spread from ±0.03 to about ±0.04 at sensor_size 0.012, because the
      baseline showed 1 to 2 line-loss events per run on sharp bends.


      - [Open this output](iteration-1/entityR1/versions/347079b6f1b94195a7adaf7313fee773/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/8179d49df86945ea8ba6d684efbd8fac/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-4352acafde8ccb7c/payload.json)'
