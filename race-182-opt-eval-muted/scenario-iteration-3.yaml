  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence: Iteration 1 (score 289) is the best so far. Its oval finish rate was
      0.65 with mean time 1.73 s, so speed is not the bottleneck on gentle curves.
      Every s-bend and slalom trial still left the track at progress 0.11 to 0.22,
      with max_error about 0.062 to 0.064, just above the 0.06 m off-track limit.
      Body width is already at its maximum, so that limit cannot be widened. Steering
      oscillation and RMS error are small, so the robot is not oscillating. It is
      being pushed outward on bends, which means it lacks steering authority or responsiveness.
      Iteration 2 changed sensor width, wheel_track, base_speed, and kp together.
      Its oval finish rate dropped to 0.45, while s-bend progress rose slightly (0.22
      to 0.31). That suggests kp and turn-rate changes help sharp bends but that the
      sensor and speed changes did not. I therefore keep the iteration 1 sensor layout
      (12 mm footprints, x = -0.03 to +0.03, y = 0.05), which had the best oval result,
      and make a narrower change: wheel_track 0.12 to 0.10 for a faster turn per unit
      of turn command, kp 4 to 5 for more correction, kd 0.6 to 0.8 to damp it, and
      base_speed kept at 1.2 for oval finish time. ki stays at 0.2 for the motor mismatch
      and mass stays at 0.6 kg. Expected result: progress on s-bend and slalom rises
      above 0.3, with line_loss_events falling below 1. Oval completion should hold
      at or above 0.6. Hypotheses: (H1) the faster turn rate from the narrower wheel
      track is the main driver of better bend tracking; (H2) if steering_oscillation
      rises above about 0.5, kp is too high and should drop to 4.5. Measurements next:
      per-track completion, progress, max_error against the 0.06 limit, line_loss_events,
      and completion_time on the oval.


      - [Open this output](iteration-3/entity0/versions/7abbb83c3d214a41bd13c0a55d90b69f/payload.json)

      - Based on: [entityR2A](iteration-3/entityR2A/versions/carried-4d811322c2451453/payload.json)'
  - id: entityR1
    label: Evaluator Feedback
    notes: 'Evaluator Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Written before this candidate races, so it states no outcome for it. The evidence
      is iteration 1 (score 289, the best so far: oval finish 0.65 at base_speed 1.2,
      kp 4, kd 0.6, 12 mm sensors at x ±0.03, y 0.05, wheel_track 0.12) and iteration
      2 (score 263: oval finish fell to 0.45 after sensors, speed and gains changed
      together; s-bend progress rose from 0.22 to 0.31). Every s-bend and slalom trial
      in both iterations still left the track with max_error about 0.062 to 0.064,
      just above the 0.06 m limit, and steering_oscillation stayed at 0.15 to 0.30,
      so the robot is being pushed outward on bends rather than oscillating. This
      candidate returns to the iteration 1 sensor layout and base_speed 1.2, which
      kept the oval result, and changes only the turn-rate and correction group: wheel_track
      0.12 to 0.10, kp 4 to 5, kd 0.6 to 0.8. That isolates the turn-rate and gain
      effect from the sensor and speed changes that confused iteration 2. Approving
      it is the right use of the remaining budget, because the race will show whether
      the turn-rate change helps bends without losing the oval.


      After the race, read the results in this order. If s-bend or slalom progress
      rises above 0.3 and line_loss_events drop below 1 while oval completion holds
      at 0.6 or better, keep wheel_track 0.10 and try kp 5.5 or kd 1.0 for further
      bend gain. If oval completion falls below 0.5 with steering_oscillation above
      0.5, the kp increase is too strong, so return kp to 4.5 and keep track at 0.10.
      If oval completion holds but bends still hit max_error near 0.06 with few line-loss
      events, the limit is steering authority, so try a narrower wheel_track of 0.09
      or 0.08 before touching sensors again.


      ### Requested changes


      - If s-bend and slalom progress rise above 0.3 with line_loss_events below 1
      and oval completion at 0.6 or better: keep wheel_track 0.10 and try kp 5.5 with
      kd 1.0, since the turn-rate change is the likely driver.

      - If oval completion falls below 0.5 or steering_oscillation exceeds 0.5: reduce
      kp to 4.5 and keep kd 0.8 and wheel_track 0.10, because iteration 2 showed the
      extra gain was costly on the oval.

      - If bends still reach max_error near 0.06 with line_loss_events of 1 or more:
      try wheel_track 0.09 or 0.08 with kp 5 and kd 0.8 held, to test whether steering
      authority is the limit before changing the sensor layout again.


      - [Open this output](iteration-3/entityR1/versions/2390e4838838429c90824b0aab2c69f2/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/7abbb83c3d214a41bd13c0a55d90b69f/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-4d811322c2451453/payload.json)'
