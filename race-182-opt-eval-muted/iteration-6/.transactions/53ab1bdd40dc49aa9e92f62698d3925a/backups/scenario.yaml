map:
  id: race-182-opt-eval-muted
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Wider sensor span ±0.04
    notes: 'Iteration 3 best design with only the outer sensors moved from ±0.03 to
      ±0.04 m, to keep tape in view near the off-track limit. Evidence: s-bend and
      slalom lose the line (1.25 events) at max_error about 0.064, while oval is 20/20
      at 1.70 s.


      ### Rationale


      Evidence: iteration 3 (score 396.3) is still the best design. Its oval finish
      rate is 20/20 at 1.70 s, with max_error 0.016 and zero line-loss events, so
      the gentle-curve controller has margin. Its failures are on s-bend (progress
      0.46, max_error 0.064, 1.25 line-loss events) and slalom (progress 0.09, max_error
      0.062). Those max_error values sit just above the 0.06 m off-track limit, and
      body width is already at its maximum. Line-loss events show the tape leaves
      the 5-sensor array during excursions. With 12 mm footprints at x = ±0.03, a
      sensor only sees tape up to about 0.03 + 0.0125 + 0.006 = 0.048 m off centre,
      so the robot loses the line before it reaches the 0.06 m limit. Iteration 5
      (wheel_track 0.09, mass 0.5) cut oval completion to 25%, and iteration 4 (kp
      5.5, kd 1.0, speed 1.05) cut it to 65%. So the gain and turn-rate changes already
      tried have hurt the oval, and I will not repeat them. Iteration 2 widened the
      array but also changed speed, footprint and wheel track together, so its s-bend
      result cannot be attributed to the span alone. Change: widen the outer sensors
      from x = ±0.03 to x = ±0.04 (spacing 2 cm), keeping the 12 mm footprint, and
      change nothing else from iteration 3. This extends the detectable offset to
      about 0.058 m, which keeps the signal alive near the off-track limit. Expected
      result: line_loss_events on s-bend and slalom fall below 1, s-bend progress
      rises above 0.5, and oval completion holds at 1.0. Hypotheses: (H1) the wider
      span is the main limit on bend survival; (H2) if oval steering_oscillation rises
      above about 0.3, the larger signal swing is adding gain and kp should drop to
      4.5. Measurements next: per-track completion, progress, max_error against 0.06,
      line_loss_events, and oval completion_time.


      - [Open this output](iteration-6/entity0/versions/a945ee0f62b944ba9f33a25055df07e3/payload.json)

      - Based on: [entityR2A](iteration-6/entityR2A/versions/carried-2735b11b431600b2/payload.json)'
  - id: entityR1
    label: 'Approve: narrower track'
    notes: 'Approved the iteration 5 candidate, which is the iteration 3 best design
      with wheel_track 0.10 to 0.09 and mass 0.6 to 0.5 kg, a single turn-response
      change. The evidence is iteration 1 to 3 (narrower track lifted oval completion
      and bend progress) and iteration 4 (speed and gain changes cut oval finish to
      0.65), so the race should show whether extra turning authority helps bends without
      losing the oval.


      ### Feedback


      Written before this candidate has raced, so it states no outcome for it. The
      evidence is iteration 3 (score 396.3, the best so far): oval finish rate 1.0
      at 1.7 s mean with max_error 0.016, but s-bend progress 0.46 and slalom progress
      0.09, both ending off track with max_error about 0.062 to 0.064 against the
      0.06 m limit. Iteration 1 to 3 (wheel_track 0.12 to 0.10, with kp 5 and kd 0.8
      by iteration 3) raised oval completion from 0.65 to 1.0 and lifted s-bend progress
      from 0.22 to 0.46. Iteration 4 (base_speed 1.05, kp 5.5, kd 1.0) cut oval finish
      to 0.65 and lowered score to 356, so speed and gain changes are the costly direction.
      This candidate keeps the iteration 3 control and sensor layout and changes only
      the turn-response geometry: wheel_track 0.10 to 0.09 (about 11% more yaw per
      unit of turn command, continuing the trend that helped) and mass 0.6 to 0.5
      kg (lower yaw inertia). All values are inside the contract ranges, and the sensor
      layout, gains and base_speed match iteration 3. It is a valid, single-direction
      step from the best design, so approve it and race it to learn whether extra
      turning authority helps the bends without losing the oval.


      After the race, read the results in this order. If oval completion holds at
      1.0 and s-bend progress rises above 0.6 or slalom above 0.25 with line_loss_events
      below 1, keep wheel_track 0.09 and mass 0.5. Then try wheel_track 0.08 next,
      since authority is still the limit. If oval completion falls below 1.0 while
      steering_oscillation rises above about 0.4, the extra yaw is overshooting: keep
      wheel_track 0.09 and raise kd from 0.8 to 0.9, as the rationale proposes, rather
      than cutting kp. If bends still reach max_error near 0.06 with line_loss_events
      of 1 or more and the oval holds, the limit is not turning authority alone: test
      mass 0.4 with wheel_track 0.09 before touching the sensors.


      ### Requested changes


      - If oval completion holds at 1.0 and s-bend progress exceeds 0.6 or slalom
      exceeds 0.25 with line_loss_events below 1: keep mass 0.5 and wheel_track 0.09,
      and try wheel_track 0.08, because iteration 1 to 3 showed narrowing the track
      raised bend progress without losing the oval.

      - If oval completion falls below 1.0 with steering_oscillation above about 0.4:
      keep wheel_track 0.09 and raise kd from 0.8 to 0.9 with kp 5.0 held, because
      iteration 4 showed that raising kp to 5.5 cost oval finish (0.65), so gain is
      the risky lever and kd is the safer damper.

      - If bends still hit max_error near 0.06 with line_loss_events of 1 or more
      while the oval holds: try mass 0.4 with wheel_track 0.09, to test whether yaw
      inertia is the limit before changing the sensor layout (iteration 2 showed sensor
      width changes alone cut oval finish to 0.45).


      - [Open this output](iteration-5/entityR1/versions/8ad2a798de68427f874550497847cbb1/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/04b65ba1bd3641a8890c8f746e6d0b4e/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-de5ab5763d7e886c/payload.json)'
