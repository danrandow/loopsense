  entities:
  - id: entity0
    label: Higher kp, lower speed
    notes: 'Raises kp from 3.0 to 5.0 and kd from 0.2 to 0.5 for stronger, damped
      bend correction, and drops base_speed from 1.3 to 1.0 to reduce off-track exits.
      Based on the last race, where kp 1.5 to 3.0 raised progress on all tracks but
      every run still left the tape at about 0.06 m.


      ### Rationale


      Evidence from the development race (60 trials, 0 finishes): every run ended
      off track. max_error sat at about 0.061 to 0.062 m, the 0.06 m off-track limit,
      with one line-loss event per run. Progress was 0.47 on the oval, 0.16 on the
      s-bend and 0.10 on the slalom. The failure is leaving the tape, not jitter.


      What changed between iterations: kp 1.5 to 3.0 raised progress on every track
      (s-bend 0.04 to 0.16, slalom 0.03 to 0.10, oval 0.12 to 0.47). Steering oscillation
      rose from about 0.07 to 0.25 on the oval, so the extra authority is starting
      to overshoot. The off-track exits still happen at the bends, so the remaining
      problems are that the correction is still too slow at the bends and the robot
      carries too much speed into them.


      Changes in this candidate:

      (1) kp 3.0 to 5.0, for more steering authority on the bends.

      (2) kd 0.2 to 0.5, to damp the larger proportional term and limit overshoot
      across the line.

      (3) base_speed 1.3 to 1.0, so the robot has more time to turn at each bend.
      Score rewards progress before any off-track exit, so staying on the line matters
      more than raw speed. Completion within 3 s is unlikely at this speed and is
      a later goal.

      (4) Geometry unchanged, so the controller effect is isolated. ki stays 0 to
      avoid windup on curves. line_loss stays last_direction.


      Expected result: progress above 0.5 on all three tracks, fewer off-track exits,
      and max_error below 0.06 on more seeds. Steering oscillation may rise above
      0.25, which would tell us kd is not yet damping enough.


      Hypotheses: H1, insufficient steering at bends is the main cause, shown by progress
      rising with kp. H2, speed is too high for the bend radius, shown by progress
      rising when base_speed drops. H3, kd is too low to damp kp=5, shown by steering_oscillation
      above 0.3 or max_error rising on the slalom.


      Next measurements: progress and completion_time for speed versus stability,
      max_error and line_loss_events for stability, steering_oscillation for damping,
      and control_effort for gain cost.


