overrides:
  entities:
  - id: entity0
    label: Forward sensors, kd 1.0
    notes: 'Moved sensors to 0.08 m ahead and widened them to ±0.06 m, narrowed the
      track to 0.10 m, cut mass to 0.6 kg, and raised kp to 5.5 and kd to 1.0. Iteration
      2 showed bend line-loss at kp 5 with oscillation of 0.25 to 0.29, so this aims
      to add look-ahead and turn authority while damping the oscillation.


      ### Rationale


      Evidence from iteration 2 (60 trials): kp 1.5 to 3.0 to 5.0 raised progress
      on every track (oval 0.12 to 0.47 to 0.71, s-bend 0.04 to 0.16 to 0.37, slalom
      0.03 to 0.10 to 0.21). Two of 60 runs finished, both on the oval. Every other
      run left the tape at max_error of about 0.061 to 0.062 m, the 0.06 m limit,
      with about one line-loss event per run. Steering oscillation is 0.23 to 0.29
      on the bends, up from about 0.07 at kp 1.5, so the loop is now oscillating as
      well as lagging. The failure is still a loss of the line at bends, and it has
      not been a jitter problem.


      Diagnosis: the sensors sit only 0.04 m from the centre and 0.05 m ahead of the
      axle. That gives the controller little look-ahead and little lateral reach,
      so by the time the signal reacts the robot is already near the edge. The 0.12
      m track and 0.8 kg mass also make the robot slow to turn for a given PWM difference.


      Changes in this candidate:

      (1) Sensors moved further forward to y = 0.08 m (the allowed maximum) for more
      look-ahead, so steering starts earlier and the lag that causes overshoot shrinks.

      (2) Lateral spread widened to x = -0.06, -0.03, 0, 0.03, 0.06 m, so a sensor
      still sees tape at larger offsets. Weights stay -2, -1, 0, 1, 2 so that the
      signal scale stays proportional to offset.

      (3) wheel_track 0.12 to 0.10 m, so the same PWM difference produces a larger
      turn rate.

      (4) mass 0.8 to 0.6 kg, lowering yaw inertia so the robot turns faster and can
      correct in time.

      (5) kd 0.5 to 1.0, to damp the oscillation that appeared at kp 5 now that the
      look-ahead is longer.

      (6) kp 5.0 to 5.5, a small increase, since the wider sensor spread already raises
      the signal per unit offset.

      (7) base_speed held at 1.0 so that the change in response can be read without
      a speed change. body_width is unchanged, because the off-track limit stays at
      0.06 m for any allowed body width.


      Expected result: fewer off-track exits at bends, progress above 0.6 on all three
      tracks, and steering_oscillation at or below about 0.25 despite the higher kd.
      Hypotheses: H1, the forward sensors and wider spread reduce line loss at bends,
      shown by line_loss_events falling below 0.9. H2, the lighter, narrower robot
      turns faster, shown by higher progress on the s-bend and slalom at the same
      speed. H3, kd 1.0 damps the oscillation, shown by steering_oscillation falling
      from the iteration-2 level. Next measurements: progress and completion_time
      to see whether speed or stability limits the score, max_error and line_loss_events
      for stability, steering_oscillation for damping, and control_effort for gain
      cost.


