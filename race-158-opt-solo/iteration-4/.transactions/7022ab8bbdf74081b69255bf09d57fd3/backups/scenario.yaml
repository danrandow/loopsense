  entities:
  - id: entity0
    label: Lighter bot, kd 1.5
    notes: 'Builds on the iteration 3 design (score 405) and changes two things: kd
      rises from 1.0 to 1.5 to damp the remaining oscillation, and mass drops from
      0.6 to 0.5 kg to speed up turning. Evidence: off-track exits at max_error of
      about 0.06 m and steering oscillation of 0.18 to 0.28, with slalom at 0 finishes.


      ### Rationale


      Evidence from iteration 3 (score 405, up from 198): the change to forward sensors
      at y=0.08, a wider spread, wheel_track 0.10, mass 0.6 and kd 1.0 roughly doubled
      the score. Oval finish rate is 55% and s-bend is 25%. Slalom still fails on
      every trial (0 finishes, progress 0.20). Every failure is off_track at max_error
      about 0.06 m, the binding limit, since max(0.06, 0.0125 + body_width/4) stays
      at 0.06 for any allowed body width. Steering oscillation is 0.18 to 0.28, which
      means the loop still overshoots at bends. Mean oval finish time is 1.93 s, so
      the robot has speed margin under the 3 s limit.


      Changes in this candidate, kept to two levers so the effect can be read: (1)
      kd 1.0 to 1.5, to damp the oscillation that is still present on the bends and
      the tight slalom. (2) mass 0.6 to 0.5 kg, lowering yaw inertia so the robot
      changes heading faster when the line curves sharply. Geometry is otherwise unchanged:
      sensors stay at y=0.08 with the same spread, wheel_track 0.10, base_speed 1.0,
      kp 5.5, ki 0 and line_loss last_direction. Speed is not raised, because off-track
      exits are the failure mode and a faster robot would reach the bends with less
      correction time.


      Expected result: steering_oscillation falls below about 0.22, slalom progress
      rises above 0.25, and s-bend finishes increase. Oval completion should hold.
      Hypotheses: H1, kd is the limit on the bends, shown by steering_oscillation
      dropping and max_error staying below 0.06 on more seeds. H2, lower mass speeds
      up turning, shown by slalom progress rising at the same base_speed. H3, if slalom
      still leaves the line at its first sharp direction change, the next lever is
      wider sensor coverage or a larger sensor_size, not more gain. Next measurements:
      progress and completion_time for speed versus stability, max_error and line_loss_events
      for stability, steering_oscillation for damping, control_effort for gain cost,
      and noise_robustness to check margin against the held-back tracks.


