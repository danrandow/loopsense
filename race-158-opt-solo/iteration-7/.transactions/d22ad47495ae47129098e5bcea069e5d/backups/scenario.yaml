  entities:
  - id: entity0
    label: Wider sensors, kp 6.0
    notes: 'Widens the sensor spread to ±0.08 m and raises kp from 5.5 to 6.0 to target
      slalom off-track exits, which hold progress at 0.42 with 0 finishes. Oval and
      s-bend finishes (20/20 each in iteration 6) are the risk to watch.


      ### Rationale


      Evidence from iteration 6 (score 680.0; iteration 5 scored 680.3). The oval
      finishes 20/20 at 2.08 s and the s-bend finishes 20/20 at 2.61 s, so both have
      time margin. The slalom is the failure: 0/20 finishes, progress 0.42, every
      failure off_track at about 0.06 m. Slalom progress rose from 0.27 to 0.50 when
      sensor_size went from 0.012 to 0.016 m, and kd 2.0 to 2.5 gave a smaller gain
      (0.50 to 0.42 on the slalom, though s-bend finishes rose from 19/20 to 20/20).
      So damping is near its useful limit, and the remaining slalom problem is the
      lack of steering authority at sharp direction changes. Changes, kept to two
      levers: (1) kp 5.5 to 6.0, a modest increase in steering authority to correct
      earlier at sharp bends. The prior kp rise (1.5 to 3 to 5) raised progress on
      every track, and kd 2.5 should hold oscillation in check. (2) Sensor spread
      widened from x = ±0.06 m to ±0.08 m (positions -0.08, -0.04, 0, 0.04, 0.08).
      The outer sensors then keep seeing tape at larger lateral offsets before the
      line is lost, which targets the off-track exits at the first sharp turn. Weights
      stay -2..2, and geometry is otherwise unchanged (mass 0.5, wheel_track 0.10,
      sensor_size 0.016, y 0.08, base_speed 1.0, ki 0, line_loss last_direction).
      Expected result: slalom progress above 0.55 with a few completions, oval and
      s-bend completion held, and steering_oscillation at or below about 0.3. Hypotheses:
      H1, outer-sensor reach limits the slalom, shown by fewer line_loss_events and
      higher slalom progress. H2, the higher kp raises oscillation on the slalom,
      shown by steering_oscillation above 0.3 with control_effort climbing; if so,
      the next lever is kd or a lower base_speed on the slalom only. H3, the wider
      spread coarsens the centre resolution, shown by a higher rms_error on the oval
      (above 0.012). Next measurements: progress and completion_time for speed versus
      stability, max_error and line_loss_events for stability, steering_oscillation
      for damping, control_effort for gain cost, and noise_robustness for margin on
      held-back tracks.


