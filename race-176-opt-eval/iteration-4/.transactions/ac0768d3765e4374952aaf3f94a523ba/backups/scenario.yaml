  id: race-176-opt-eval
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence. Iteration 1 (narrow 15 mm array, base_speed 1.3, kp 2.5, kd 0.3) is
      still the best raced design at 178.2. It finished 3 of 20 oval runs at about
      1.97 s, but it averaged 1.25 to 1.9 line-loss events per run and max_error about
      0.061 to 0.063 m, right at the 0.06 m off-track limit. Iteration 2 showed that
      widening the array to 22.5 mm spacing does not help line retention (line_loss
      stayed at 1.0, score 81.1), so the narrow layout stays. Iteration 3 (kp 2.2,
      kd 0.25) dropped to 106.7 with the same line-loss pattern. Its oscillation fell
      to 0.14 on the oval, so lower kd did not cure the line loss, and the kp/kd change
      cannot be separated from the score drop.


      Review note. The Evaluator''s review of the iteration 3 candidate gave kp as
      both 2.5 and 2.2. The candidate''s controller field is kp 2.2, so I treat 2.2
      as the value that was raced and the value that was approved. Here I return to
      kp 2.5 explicitly, so the intended kp is unambiguous.


      Change. I keep the iteration 1 geometry and gains (kp 2.5, kd 0.3, ki 0, sensor_weights
      [2,1,0,-1,-2], last_direction) and lower base_speed from 1.3 to 1.1. This is
      a single-variable test against the best raced design. The Evaluator''s stated
      next step applies because line_loss_events are still 1 or more and max_error
      is near 0.06. Each line-loss event costs 15 points per unit progress, so keeping
      the line matters more than a small time gain.


      Expected result. line_loss_events fall toward 0 to 0.5 and max_error drops below
      about 0.055, which allows more oval and s-bend finishes. Completion time rises
      to roughly 2.2 to 2.5 s on the oval, which is still under the 3.0 s limit. Oscillation
      may stay near 0.3 on the oval because kd is unchanged; if it does, the next
      step is kd 0.25 or kp 2.0.


      Hypotheses to test next. (a) Speed in the bends, not sensor coverage, drives
      the line loss, so lowering speed should cut line_loss_events. (b) If line loss
      is still above 0.5 at 1.1, the limit is the gain/geometry combination rather
      than speed alone.


      - [Open this output](iteration-4/entity0/versions/f9f04dc7ddd64cf49eaf4fe6a00e15d0/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-0054a92cef4f8ba8/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-3707e9ba8b207e07/payload.json)'
  - id: entityR1
    label: Narrow array, gentle
    notes: 'Approves the reverted narrow five-sensor array with kd 0.25 and kp 2.2,
      since the wide array in iteration 2 cut the score from 178 to 81 with no gain
      in line retention. The gain change is small and sound, so it races to test whether
      lower oscillation keeps the best design on the line.


      ### Feedback


      Pre-race review of the iteration 3 candidate. It reverts the sensor array to
      the iteration 1 narrow layout (x = ±0.03, ±0.015, 0, 15 mm spacing, 12 mm footprints).
      Iteration 1 was the best raced design at 178.2, and iteration 2 showed that
      widening to 22.5 mm spacing cut the score to 81.1 with no gain in line retention
      (line_loss_events stayed at 1.0, max_error near 0.062). Reverting geometry is
      therefore well supported. The controller moves are small: kd 0.3 to 0.25 and
      kp 2.5 to 2.2, with base_speed 1.3, ki 0 and last_direction unchanged. The rationale
      says kp is held at 2.5 in one place and lowered to 2.2 in another. The candidate''s
      values are what I am approving, so the Optimizer should confirm the intended
      kp when revising. Iteration 1 oscillation was 0.34 on the oval and 0.24 on the
      s-bend, so lower kd is a reasonable test. The oscillation link to kd is confounded
      with the geometry change in iteration 2, so it is not proven. Sensor_weights
      and signal sign convention are valid, and every field is within its contract
      limits. The candidate is not clearly better than iteration 1, but it is a sound,
      small step from the best design and the race will give useful telemetry. Next
      race: if line_loss_events remain at 1 or more and max_error stays near 0.06,
      lower base_speed to about 1.1 while holding the geometry. If the runs finish
      but completion_time is above 3.0 s, raise base_speed toward 1.6. If oscillation
      stays above about 0.25 on the oval and s-bend, lower kd further or kp toward
      2.0.


      ### Requested changes


      - If line_loss_events stay at 1 or more and max_error stays near 0.06 with the
      narrow array, lower base_speed to about 1.1 and hold the geometry and gains,
      since iteration 1 at speed 1.3 with the narrow array was the best raced result
      but still left the line.

      - If runs finish but completion_time is above 3.0 s, raise base_speed toward
      1.6 and hold kp and kd, since iteration 1 finished the oval in about 1.97 s
      at 1.3 and the 3 s limit needs about 1.5 m/s average.

      - If steering_oscillation stays above about 0.25 on the oval or s-bend, lower
      kd toward 0.2 or kp toward 2.0, since iteration 1 (kd 0.3) gave oscillation
      of 0.34 on the oval and 0.24 on the s-bend.


      - [Open this output](iteration-3/entityR1/versions/92e7ceb01b9c4463a9b19f67c75b345d/payload.json)

