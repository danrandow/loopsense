map:
  id: race-176-opt-eval
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Speed down to 0.9 m/s-ish
    notes: 'Keeps the best raced geometry and gains (iteration 4, score 302.3) and
      lowers base_speed from 1.1 to 0.9 to reduce line-loss events, which still average
      0.95 to 1.25 per run. Evidence: line loss persists on every track and oval completion
      time stayed near 1.97 s, so there is time margin under 3.0 s.


      ### Rationale


      Evidence: iteration 4 (base_speed 1.1, kp 2.5, kd 0.3, narrow five-sensor array)
      is the best raced design at 302.3, up from 178.2 at base_speed 1.3. Oval finish
      rate rose to 55% (11 of 20), oval max_error fell to 0.054 (from 0.061), and
      oval line-loss events fell to 0.95 (from 1.25). Line loss is still present on
      every track (s-bend 1.25, slalom 1.15), and s-bend and slalom still end off
      track in all 40 trials. Iteration 2 showed that the 22.5 mm wide array does
      not fix line retention, so the narrow geometry stays. Iteration 3 showed that
      kp 2.2 with kd 0.25 scored lower, so the gains stay at kp 2.5, kd 0.3, ki 0.
      Oval mean finish time at 1.1 was 1.97 s, so there is time margin under 3.0 s
      for a further speed reduction. Change: lower base_speed from 1.1 to 0.9, a single-variable
      step that the Evaluator''s stated rule supports (line_loss_events at or above
      1 with max_error near 0.06). Each line-loss event costs about 15 points per
      unit of progress, so keeping the line is worth more than speed here. Expected
      result: line_loss_events fall toward 0.5 or less on the oval and s-bend, the
      s-bend and slalom gain progress, and oval completion stays near 50% or higher
      with completion_time still under 3.0 s. Hypotheses to test: (a) speed in bends,
      not sensor coverage, drives the remaining line loss, so lower speed should cut
      line_loss_events on the s-bend and slalom; (b) steering_oscillation on the oval
      (0.33 at kd 0.3) stays high, so if line loss is already low after this step,
      kd 0.25 is the next separate test. Measurements requested: per-track completion,
      progress, completion_time, line_loss_events, max_error and steering_oscillation,
      which show whether the speed drop helps line retention and whether time stays
      under 3 s.


      - [Open this output](iteration-5/entity0/versions/e82e0c2512c843829d9a389dc05ec5a7/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-6802c2bbfeb7cc60/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-574fe1027bfc2e99/payload.json)'
  - id: entityR1
    label: 'Approve: speed 1.1 to 0.9'
    notes: 'Approved the single-variable step from the best raced design (iteration
      4, score 302.3) by lowering base_speed to 0.9 with geometry and gains held.
      The lower-speed trend in iterations 1 and 4 (oval line loss and max_error both
      fell) supports testing this step, and the next-race conditions cover both outcomes.


      ### Feedback


      Pre-race review of the iteration 5 candidate. It keeps the iteration 4 design
      (narrow five-sensor array at x = 0.03, 0.015, 0, -0.015, -0.03; sensor_weights
      [2,1,0,-1,-2]; kp 2.5; kd 0.3; ki 0; last_direction) and changes one variable,
      base_speed from 1.1 to 0.9. Iteration 4 is the best raced design at 302.3. Against
      iteration 1 at base_speed 1.3, the drop to 1.1 raised oval completion from 3/20
      to 11/20, cut oval line_loss_events from 1.25 to 0.95, and lowered oval max_error
      from 0.061 to 0.054. Line loss remains on every track (s-bend 1.25, slalom 1.15),
      so the same direction is the next logical test. Iteration 2 showed that widening
      the array to 22.5 mm spacing lowered the score (81.1), so the narrow geometry
      stays. Iteration 3 showed that kp 2.2 with kd 0.25 scored lower (106.7), so
      kp 2.5 and kd 0.3 are held. The candidate is valid and within contract limits.
      Expected direction: oval mean finish time was 1.97 s at 1.1, so there is margin
      under 3.0 s, but a further speed drop will lengthen the run, so completion_time
      must be checked. Decision: approve. This is a clean single-variable step from
      the best design, and it gives the telemetry needed to separate speed effects
      from gain effects. Next race: if line_loss_events on the oval and s-bend fall
      below about 0.5 and completions hold near 50% or higher, keep base_speed near
      0.9 and test kd 0.25 alone. If line loss stays at 1 or more with max_error near
      0.054 to 0.06, speed is not the main limit, so return to base_speed 1.1 and
      test kp 2.0 with kd 0.3 as a separate change. If the runs finish with completion_time
      above 2.8 s, raise base_speed to about 1.0 rather than going back to 1.1.


      ### Requested changes


      - If line_loss_events on the oval and s-bend fall to 0.5 or less and completions
      stay near 50% or higher, keep the narrow geometry, kp 2.5, ki 0, and base_speed
      0.9, and test kd 0.25 by itself, since oval steering_oscillation was 0.33 at
      kd 0.3 in iteration 4.

      - If line_loss_events stay at 1 or more with max_error near 0.054 to 0.06 at
      base_speed 0.9, speed is not the main limit: return to base_speed 1.1 and try
      kp 2.0 with kd 0.3 as a separate single-variable change, since iteration 4 is
      the only controlled speed comparison.

      - If runs complete with completion_time above 2.8 s, raise base_speed to about
      1.0 rather than 1.1, since the iteration 4 oval mean finish time was 1.97 s
      at base_speed 1.1 and the 3.0 s limit needs roughly 1.5 m/s average.


      - [Open this output](iteration-5/entityR1/versions/fd23c15d48b34e3e8d7bf52c697019bf/payload.json)

