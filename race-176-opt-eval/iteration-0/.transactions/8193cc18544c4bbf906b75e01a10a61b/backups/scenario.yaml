  entities:
  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Iteration 0 has no race data or Evaluator feedback yet, so this is a conservative
      baseline built from the contract. Goal: finish the ~4-5 m course in under 3
      s (about 1.5 m/s or more) while staying on the 25 mm tape. Geometry: five sensors
      spaced 15 mm apart across x = -0.03 to +0.03 m, 0.05 m ahead of the axle, using
      the 12 mm footprint. That spacing covers the 25 mm tape with overlap, so at
      least one sensor usually reads the line even on tight bends. The track is 120
      mm wide, a moderate wheelbase for stability, with a 30 mm wheel radius and 0.8
      kg mass. Controller: sensor weights are proportional to sensor x ([2, 1, 0,
      -1, -2]), so the signal is positive (steer left) when the line is left of centre,
      and the signal scale is set by the weights. base_speed 1.6 (about 80% of full
      PWM) aims for speed without saturating the wheels in the bends. kp 3.0 gives
      roughly 1050 PWM counts per unit signal, a moderate correction. ki 0 avoids
      integral windup on the curves. kd 0.15 damps overshoot without amplifying sensor
      noise much. line_loss last_direction keeps the robot turning the way it was
      going when the line is lost at a sharp bend. Expected result: completion on
      the oval and s-bend, with rms_error well under 0.02 m. The main risks are overshoot
      on the slalom (raise kd or lower kp) and running too slowly to finish under
      3 s (raise base_speed). Measurements requested below will show which of these
      occurs.


      - [Open this output](iteration-0/entity0/versions/3c542762b64f45a3b2a8c01977b9d54e/payload.json)'
  - id: entityR1
    label: Baseline approved to race
    notes: 'Iteration 0 candidate is valid against every public_contracts limit and
      the sign conventions are consistent, so it is approved as the first telemetry
      race. No earlier race evidence exists, so the requested changes are conditional
      on what this race measures.


      ### Feedback


      Iteration 0 has no earlier race data, so this review rests on the contract and
      the candidate''s own contents. Every field is within its public_contracts limit:
      five sensors at y=0.05 with x from -0.03 to +0.03, sensor_size 0.012, and sensor_weights
      [2,1,0,-1,-2] matching the five sensors in order. The sign convention is consistent:
      positive x is left, a positive signal produces a positive turn, and that turn
      drives the left wheel down and the right wheel up, which steers left. kp 3.0
      gives at most about 2100 PWM counts of differential at the largest signal, which
      stays within the wheel limits at base_pwm of about 3276. The candidate is valid
      and not obviously broken, and it is the first race, so the telemetry is the
      most useful thing it can provide. Next race, if it completes but rms_error or
      steering_oscillation is high, reduce kp (about 2.0) or raise kd (about 0.3).
      If it leaves the line on tight bends, raise the stability margin by lowering
      base_speed (about 1.3) before changing the gains. If it completes with rms_error
      small but completion_time above 3 s, raise base_speed (about 1.9) and keep the
      gains. Do not change the sensor geometry until the controller telemetry is understood.


      ### Requested changes


      - If the next race shows steering_oscillation or max_error high with completion,
      lower kp to about 2.0 and raise kd to about 0.3, since the baseline kp of 3.0
      is untested.

      - If the next race shows line_loss_events above 0 or the robot leaves the track
      on tight bends, lower base_speed to about 1.3 before adjusting gains.

      - If the next race completes with small rms_error but completion_time above
      3.0 s, raise base_speed to about 1.9 and keep kp and kd unchanged.


      - [Open this output](iteration-0/entityR1/versions/2b09a9ff04b7448b84d59dfc75af7578/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/3c542762b64f45a3b2a8c01977b9d54e/payload.json)'
