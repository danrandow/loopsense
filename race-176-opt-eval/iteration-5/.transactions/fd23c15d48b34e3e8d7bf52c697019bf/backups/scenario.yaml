map:
  id: race-176-opt-eval
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Speed down to 0.9 m/s-ish
    notes: 'Keeps the best raced geometry and gains (iteration 4, score 302.3) and
      lowers base_speed from 1.1 to 0.9 to reduce line-loss events, which still average
      0.95 to 1.25 per run. Evidence: line loss persists on every track and oval completion
      time stayed near 1.97 s, so there is time margin under 3.0 s.


      ### Rationale


      Evidence: iteration 4 (base_speed 1.1, kp 2.5, kd 0.3, narrow five-sensor array)
      is the best raced design at 302.3, up from 178.2 at base_speed 1.3. Oval finish
      rate rose to 55% (11 of 20), oval max_error fell to 0.054 (from 0.061), and
      oval line-loss events fell to 0.95 (from 1.25). Line loss is still present on
      every track (s-bend 1.25, slalom 1.15), and s-bend and slalom still end off
      track in all 40 trials. Iteration 2 showed that the 22.5 mm wide array does
      not fix line retention, so the narrow geometry stays. Iteration 3 showed that
      kp 2.2 with kd 0.25 scored lower, so the gains stay at kp 2.5, kd 0.3, ki 0.
      Oval mean finish time at 1.1 was 1.97 s, so there is time margin under 3.0 s
      for a further speed reduction. Change: lower base_speed from 1.1 to 0.9, a single-variable
      step that the Evaluator''s stated rule supports (line_loss_events at or above
      1 with max_error near 0.06). Each line-loss event costs about 15 points per
      unit of progress, so keeping the line is worth more than speed here. Expected
      result: line_loss_events fall toward 0.5 or less on the oval and s-bend, the
      s-bend and slalom gain progress, and oval completion stays near 50% or higher
      with completion_time still under 3.0 s. Hypotheses to test: (a) speed in bends,
      not sensor coverage, drives the remaining line loss, so lower speed should cut
      line_loss_events on the s-bend and slalom; (b) steering_oscillation on the oval
      (0.33 at kd 0.3) stays high, so if line loss is already low after this step,
      kd 0.25 is the next separate test. Measurements requested: per-track completion,
      progress, completion_time, line_loss_events, max_error and steering_oscillation,
      which show whether the speed drop helps line retention and whether time stays
      under 3 s.


      - [Open this output](iteration-5/entity0/versions/e82e0c2512c843829d9a389dc05ec5a7/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-6802c2bbfeb7cc60/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-574fe1027bfc2e99/payload.json)'
  - id: entityR1
    label: Approve speed-only test
    notes: 'Approved the iteration 1 design with base_speed lowered from 1.3 to 1.1,
      a single-variable test of the best raced design (178.2). Earlier evidence shows
      line loss and max_error near the 0.06 m limit, and the wide-array and kp/kd
      variants both scored lower.


      ### Feedback


      Pre-race review of the iteration 4 candidate. It keeps the iteration 1 design,
      the best raced result at 178.2, and changes one variable: base_speed 1.3 to
      1.1. Geometry (five sensors at x = ±0.03, ±0.015, 0; 12 mm footprints), sensor_weights
      [2,1,0,-1,-2], kp 2.5, kd 0.3, ki 0 and last_direction are unchanged. Iteration
      2 showed that widening the array to 22.5 mm spacing did not improve line retention
      (line_loss_events stayed at 1.0, score 81.1), so the narrow layout is correct.
      Iteration 1 averaged 1.25 line-loss events on the oval and 1.9 on the s-bend,
      with max_error about 0.061 to 0.063 m against the 0.06 m off-track limit. Since
      each line-loss event removes about 15 points per unit of progress, a speed change
      that keeps the line is worth testing. Iteration 3 showed that kp 2.2 with kd
      0.25 scored lower (106.7), so the kp/kd change of that iteration should not
      be reintroduced without a separate test. The candidate is valid and not obviously
      broken. It is also a clean single-variable test of the best raced design, and
      the iteration count leaves room to learn from it, so it is approved for the
      race. Interpreting the next race: if line_loss_events remain at 1 or more and
      max_error stays near 0.06, the next revision should try base_speed about 0.9
      with gains held. If runs finish with line loss near zero but completion_time
      is above 3.0 s, base_speed should go back up toward 1.2 to 1.3, since iteration
      1 finished the oval in about 1.97 s at 1.3. If oscillation stays above about
      0.3 on the oval with line loss already low, lower kd to about 0.25 as a separate
      step.


      ### Requested changes


      - If line_loss_events stay at 1 or more and max_error stays near 0.06, lower
      base_speed to about 0.9 and hold the narrow geometry, kp 2.5, kd 0.3, since
      iteration 1 at 1.3 and iteration 4 at 1.1 are the only controlled comparisons
      of speed.

      - If runs finish with line_loss_events near 0 but completion_time is above 3.0
      s, raise base_speed to about 1.2 to 1.3 and hold kp and kd, since iteration
      1 finished the oval at about 1.97 s.

      - If steering_oscillation stays above about 0.3 on the oval once line loss is
      low, lower kd to about 0.25 by itself, since iteration 1 (kd 0.3) gave 0.34
      on the oval and iteration 3 (kd 0.25 with kp 2.2) gave 0.14 but also lost the
      line.


      - [Open this output](iteration-4/entityR1/versions/ac0768d3765e4374952aaf3f94a523ba/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/f9f04dc7ddd64cf49eaf4fe6a00e15d0/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-3707e9ba8b207e07/payload.json)'
