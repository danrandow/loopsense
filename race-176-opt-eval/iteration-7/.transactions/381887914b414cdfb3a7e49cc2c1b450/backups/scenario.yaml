map:
  id: race-176-opt-eval
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: 'Iter 6: kp 2.0 at speed'
    notes: 'Returns base_speed to 1.1, the best raced speed (iteration 4, score 302.3),
      after speed 0.9 scored 136.2 with oval completion at 0%. Tests kp 2.0 alone,
      with kd 0.3 and the narrow geometry held, to target oval oscillation of 0.33.


      ### Rationale


      Evidence. Iteration 4 (base_speed 1.1, kp 2.5, kd 0.3, narrow five-sensor array
      at x = 0.03, 0.015, 0, -0.015, -0.03) is the best raced design at 302.3, with
      11 of 20 oval finishes. Iteration 5 lowered base_speed to 0.9 and scored 136.2.
      Oval completion fell to 0 of 20, oval progress fell from 0.96 to 0.58, and oval
      line_loss_events rose from 0.95 to 1.85. So the speed drop hurt, and the Evaluator''s
      pre-race reasoning that lower speed would cut line loss did not hold. The Evaluator''s
      stated fallback for this case is to return to base_speed 1.1 and test kp 2.0
      with kd 0.3 as a separate single-variable change. Iteration 2 (wide array) and
      iteration 3 (kp 2.2 with kd 0.25 at base_speed 1.3) both scored lower, so the
      geometry is kept and the kp/kd change is isolated here.


      Change. Return base_speed to 1.1 and lower kp from 2.5 to 2.0. Everything else
      stays at the iteration 4 design: narrow geometry, sensor_weights [2,1,0,-1,-2],
      kd 0.3, ki 0, last_direction.


      Expected result. Oval steering_oscillation (0.33 at kp 2.5) should fall because
      the proportional correction is smaller. Control_effort should fall too. Oval
      completion should hold near or above 50%, since the speed that worked is unchanged.
      The risk is the opposite: a weaker kp may leave the robot slower to correct
      on the tightest bends, which would show as higher max_error and line loss.


      Hypotheses to test. (a) Part of the line loss comes from over-correction at
      kp 2.5, so kp 2.0 cuts line_loss_events and max_error on the s-bend and slalom.
      (b) Oval completion holds at or above the iteration 4 rate of 55%. Next step:
      if line loss falls and completion holds, test kd 0.25 alone. If line loss rises,
      return to kp 2.5 and test base_speed 1.2 alone, since 1.1 is the only tested
      speed between 0.9 (worse) and 1.3 (worse).


      - [Open this output](iteration-6/entity0/versions/08c7c3da077c4fe68583e4c86c94f256/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-f78a60e5ccd42032/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-9dfda73de89afd6c/payload.json)'
  - id: entityR1
    label: Approve kp 2.0 single
    notes: 'Approved a single-variable change from the best raced design (iteration
      4, 302.3): kp 2.5 to 2.0 at base_speed 1.1 with the narrow array and kd 0.3.
      Iteration 5 showed speed 0.9 was worse, and iteration 2 showed the wide array
      does not help, so the race is the clean next test.


      ### Feedback


      Pre-race review of the iteration 6 candidate. It returns base_speed to 1.1 and
      lowers kp from 2.5 to 2.0, with the narrow five-sensor array (x = 0.03, 0.015,
      0, -0.015, -0.03), sensor_weights [2,1,0,-1,-2], kd 0.3, ki 0 and last_direction
      unchanged. Iteration 4 (base_speed 1.1, kp 2.5, kd 0.3) is the best raced design
      at 302.3, so this candidate is a clean single-variable change from it. Iteration
      5 showed that lowering speed to 0.9 cut oval completion, so the speed is held
      at 1.1. Iteration 3 (kp 2.2 with kd 0.25 at base_speed 1.3) scored 106.7, but
      it changed kd as well and ran at a different speed, so it does not isolate the
      effect of kp. Iteration 2 showed that the wide array does not help line retention,
      so the geometry is kept. The candidate is valid: all values are within the contract
      limits and the sign convention is unchanged. Nothing about its performance can
      be read from the earlier races, so the race is the only real test. Next race,
      interpreted as follows. If line_loss_events on the oval and s-bend fall and
      oval completion holds at or above about 50%, keep kp 2.0 and test kd 0.25 alone.
      If line loss rises or max_error rises above about 0.06, the weaker kp is too
      slow to correct, so return to kp 2.5 and test base_speed 1.2 alone, since iteration
      1 at 1.3 and iteration 4 at 1.1 are the only tested speeds near that range.
      If runs finish but completion_time exceeds 2.8 s, the speed cut is the problem,
      so hold base_speed at 1.1 and do not drop it further.


      ### Requested changes


      - Keep the narrow geometry, base_speed 1.1, kd 0.3, ki 0 and last_direction
      from iteration 4, and change only kp to 2.0. Use the race to check whether line_loss_events
      and max_error fall on the oval and s-bend, and whether oval completion holds
      near or above 55%.

      - If line_loss_events rise or max_error exceeds about 0.06 with kp 2.0, return
      to kp 2.5 and test base_speed 1.2 alone, since iteration 4 at 1.1 and iteration
      1 at 1.3 are the only controlled speed comparisons.

      - If line loss falls and completion holds with kp 2.0, test kd 0.25 alone in
      the next revision, since iteration 4 showed oval steering_oscillation of 0.33
      at kd 0.3.


      - [Open this output](iteration-6/entityR1/versions/6971c341ec044da5b3cb4af4335569a7/payload.json)

