map:
  id: race-176-opt-eval
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: kp 1.6 on 16mm sensors
    notes: 'Iteration 9''s best design with one change: kp 1.8 to 1.6, following the
      Evaluator''s rule (oval held at 20/20 while s-bend line loss stayed at 2.0).
      The kp trend has cut line loss on every track, and the 16 mm footprint is kept.
      Fallback is kp 1.8 if oval completion drops below 18/20.


      ### Rationale


      Evidence: iteration 9 (sensor_size 0.016, kp 1.8, kd 0.3, base_speed 1.1, narrow
      five-sensor array) is the best raced design at 403.3. The oval finished 20 of
      20 with line_loss_events 0.15 and max_error 0.038. The s-bend still ends off
      track in all 20 runs, with line_loss_events at 2.0 and progress 0.55. The slalom
      is stuck at about 0.10 progress with line loss at 1.0.


      The Evaluator''s condition for the next step is met: the oval held at 20 of
      20 while s-bend line loss stayed at 2.0. The requested single change is kp 1.8
      to 1.6, with sensor_size 0.016 held. The kp trend (2.5 to 2.0 to 1.8) has cut
      line loss and raised completion on every track so far. The footprint change
      is kept, since it is what lifted the oval from 18 to 20 finishes.


      Change: kp 1.8 to 1.6 only. Geometry (narrow five-sensor array at x = 0.03,
      0.015, 0, -0.015, -0.03, y = 0.05, sensor_size 0.016), sensor_weights [2,1,0,-1,-2],
      base_speed 1.1, kd 0.3, ki 0 and last_direction are unchanged.


      Expected result: oval stays at or near 20 of 20 with line loss about 0.15 to
      0.3, and s-bend line loss falls below 2.0 with more progress. Risk: kp 1.6 may
      be too weak on the tightest bends, which would show as higher max_error and
      line loss on the oval.


      Fallback: if oval completion drops below 18 of 20 or oval max_error rises above
      0.044, revert to kp 1.8 (the iteration 9 design). Because this is the final
      iteration, the design should be robust on unseen tracks, so I have kept the
      change to one variable.


      Hypotheses: (a) kp reduction continues to cut over-correction-driven line loss
      on the s-bend and slalom; (b) the 16 mm footprint keeps the oval stable at lower
      kp. Measurements requested: completion, progress, completion_time, line_loss_events,
      max_error and steering_oscillation on each track, plus noise_robustness, compared
      against the iteration 9 baseline.


      - [Open this output](iteration-11/entity0/versions/08a642ea7f59428e824d73c935892a75/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-52581084ed1b8b8b/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-99e6655603ab3ef1/payload.json)'
  - id: entityR1
    label: Approve iter 9 design
    notes: 'Approves the unchanged iteration 9 design (best raced at 403.3, oval 20
      of 20 with line loss 0.15). Requested changes set the next step: kp 1.6 if s-bend
      line loss stays at 2.0, or a revert to sensor_size 0.012 if the oval regresses.


      ### Feedback


      Pre-race review of the iteration 10 candidate. It resubmits the iteration 9
      design unchanged: narrow five-sensor array at x = 0.03, 0.015, 0, -0.015, -0.03
      with y = 0.05, sensor_size 0.016, base_speed 1.1, kp 1.8, kd 0.3, ki 0, last_direction,
      and sensor_weights [2,1,0,-1,-2]. It is the best raced design at 403.3, up from
      366.7 in iteration 8. The oval finished 20 of 20 with line_loss_events 0.15
      and max_error 0.038, both better than iteration 8. The s-bend improved in progress
      (0.55 vs 0.34) but its line loss rose from 1.0 to 2.0, and it still finished
      0 of 20. Slalom progress fell from 0.17 to 0.10 with line loss at 1.0. The candidate
      is valid, within contract limits, and not a stacked change, so it is the right
      baseline to race. A further revision would cost two action runs, and the one-variable
      alternatives (kp 1.6, or reverting the footprint) are already covered by the
      requested changes below, so approving now gives the clearest telemetry. Next
      race, interpreted as follows. If the oval holds at 20 of 20 with line loss near
      0.15 to 0.3 and the s-bend line loss stays at 2.0, the footprint may be blending
      readings on tight bends, so the next revision should test kp 1.6 alone with
      sensor_size 0.016 held. If the s-bend or slalom line loss falls below 1.0 while
      the oval holds, keep the design and test a single further change. If the oval
      completion drops below 18 of 20 or the oval max_error rises above 0.044, revert
      sensor_size to 0.012 with kp 1.8, since that is the iteration 8 baseline.


      ### Requested changes


      - If the s-bend line_loss_events stay at 2.0 while the oval holds at 20 of 20,
      make a single change to kp 1.6 with sensor_size 0.016 held, since the kp trend
      (2.5 to 2.0 to 1.8) cut line loss on every track and iteration 9''s s-bend progress
      rose to 0.55.

      - If the oval completion falls below 18 of 20 or oval max_error rises above
      0.044, revert sensor_size to 0.012 and keep kp 1.8, base_speed 1.1 and kd 0.3,
      since iteration 8 (sensor_size 0.012) is the fallback baseline at 366.7.

      - Keep the five-sensor spacing (x = 0.03, 0.015, 0, -0.015, -0.03), sensor_weights
      [2,1,0,-1,-2], kd 0.3, ki 0 and last_direction unchanged, since iteration 2
      (22.5 mm spacing) dropped the score to 81.1 and iteration 7 (kd 0.25) dropped
      it to 163.3.


      - [Open this output](iteration-10/entityR1/versions/e6ec39a5d6964bfaad43ec9551969727/payload.json)

