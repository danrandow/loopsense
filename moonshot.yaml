map:
  id: loopsense-moonshot
  schema: "v0.2"
  title: "Loopsense Agent Team"
  scenario: "Moonshot — Topology as Standard"
  inherits: base.yaml
  notes: |
    The big hairy audacious north star. Not a plan — a test of whether this
    is worth building.

    **Core question:** If the insight is real — topologically-constrained,
    consideration-equipped multi-agent systems outperform unstructured graphs
    for knowledge work — what does the world look like in 18–36 months?

    The map schema becomes a coordination standard the way Markdown became a
    writing standard: opinionated, portable, readable by humans and machines.
    PM-bet is the first instantiation, not the only one. Any system with an
    integrator role, downstream actors applying distinct lenses, return flows,
    bypass loops, and a consideration mechanism can be expressed as a Randow
    Map and run as an agent system.

dimensions:
  time_horizon: "2028+"
  iteration: "moonshot"

overrides:
  actors:
    - id: actor4
      label: Practitioners & Communities
      notes: |
        No longer just knowledge work orchestration engineers. The topology has
        generalised:

        - Research teams: hypothesis → experiment → peer review loops
        - Policy analysts: problem → options → stakeholder feedback loops
        - Clinical trial coordinators: protocol → execution → adverse event loops
        - Any system with a feedback-providing structure and an integrator role

  entities:
    - id: entity0
      label: Topology Bet
      notes: |
        **The bet the PM holds at the moonshot horizon:**

        Topologically-constrained multi-agent systems are the missing layer
        between single-agent loops (no structure) and free-mesh swarms (no
        constraints). The PM-bet topology — one integrator, downstream lenses,
        explicit return flows, bypass loops held as live tensions — is the first
        instantiation of a general pattern.

        *"What's your topology?"* is now a standard question when evaluating a
        knowledge work agent system — the way *"what's your test coverage?"*
        became standard for code.

        Practitioners share maps the way they share prompts today. The schema
        is the comparison mechanism across teams and organisations.

    - id: entityPrv0
      label: PM Judgment (moonshot)
      notes: |
        **The reasoning behind the moonshot bet:**

        Most multi-agent failures at 18–36 months out are topology failures,
        not model failures. Teams that succeeded did not have better models —
        they had cleaner constraints. The PM-bet topology is one encoding of
        those constraints. Others will follow.

        The insight that made it work: knowledge work has no automatic
        pass/fail, so the referee must be manufactured from the topology itself.
        The consideration mechanism — PM synthesising return flows — is that
        referee. This is not a prompt trick. It is an organisational pattern
        expressed as a schema.

        At the moonshot horizon, practitioners who understood this are the
        ones whose agent systems still work.

    - id: entityPub0
      label: Agent Frameworks Research (moonshot)
      notes: |
        **The competitive pressure the bet must survive at 18–36 months:**

        The competitive alternatives have either:
        - Added an integrator-role pattern (LangGraph, CrewAI) — validation
          that the pattern matters, not that our schema is redundant
        - Been superseded by the topology standard — the schema won
        - Fragmented into use-case-specific tools that lack the generality

        The research literature now includes papers citing Randow Maps schema
        as the reference implementation for inspectable multi-agent coordination.

        What did NOT happen: a well-resourced framework team shipped exactly
        this schema before we established the standard. That was the kill
        condition. It did not fire.

    - id: entity2
      label: Open Schema + Hosted Runner
      notes: |
        - YAML schema published under permissive license.
        - Hosted runner makes running a map as easy as running a notebook.
        - At least one major AI framework has added native support or forked it.
        - GitHub stars > 1000 within 6 months of publish.
        - Open spec + hosted infrastructure confirmed viable — LangSmith
          precedent holds.

    - id: entity3
      label: Market Offer (moonshot)
      notes: |
        **What GTM puts in front of practitioners at the moonshot horizon:**

        An open YAML spec and a viewer. The map of your team's work. Bring
        your own agents and runtime — we don't own the execution. The value
        is the schema, the topology defaults, and the ability to compare maps
        across teams and iterations.

        The first offer that broke through was not a product announcement.
        It was a post about a specific failure mode — the verification gap
        problem — that practitioners recognised from their own experience.
        The reply thread became evidence for the problem before any product
        existed to solve it. The map predicted that interaction. That is what
        makes it a map and not just a post.

    - id: entity4
      label: Practitioner Adoption
      notes: |
        **What would have to be true:**

        - At least 3 independent teams report topology-constrained coordination
          outperformed their previous approach on a knowledge work task they
          couldn't automate before.
        - At least 2 non-PM-bet instantiations of the schema exist in the wild,
          built by people who did not talk to Dan first.
        - At least one organisation pays for a hosted run of their own map.

    - id: entityR4
      label: Usage & Feedback (moonshot signal)
      notes: |
        **What we were looking for — the signal that told us we had it:**

        "This is the topology I've been running by feel. Now I can see it."

        That sentence — or its functional equivalent — from someone who runs
        complex knowledge loops without a named method. Not adoption metrics.
        Not NPS. That sentence, from three different practitioners who did not
        coordinate with each other.

        Customer benefit lives here — in what practitioners tell us, not in
        what we tell them. The claim that this is useful is validated by entityR4,
        not asserted in entity3.

    - id: entityPub0
      notes: |
        The competitive alternatives have either added an integrator-role
        pattern (LangGraph, CrewAI) or been superseded by the topology standard.

        The research literature now includes papers citing Randow Maps schema
        as the reference implementation for inspectable multi-agent coordination.
