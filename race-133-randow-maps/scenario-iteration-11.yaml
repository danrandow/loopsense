overrides:
  entities:
  - id: entity0
    label: 'Final: proven 50mm base'
    notes: 'Holds the iteration 7 and 9 geometry (50 mm span, 12 mm footprints, y
      0.05, wheel_track 0.10), the best raced design at 399.7 with oval progress 0.995.
      Iteration 10 showed the same geometry drops to 239.3 when the controller changes,
      so the geometry is kept fixed and the untested lead test is not run on the last
      race.


      ### Rationale


      This is the final iteration, so the design I deliver is the one the unseen-track
      race will score. The best evidence is iteration 7 and iteration 9, which are
      the same geometry (50 mm span, 12 mm footprints, y 0.05, wheel_track 0.10).
      They scored 399.7 with oval progress 0.995 and 20 of 20 oval finishes. Iteration
      10 reproduced this geometry with a retuned controller and fell to 239.3, with
      oval progress 0.727 and 6 of 20 finishes. That drop comes from the controller,
      not the geometry, because the geometry is identical. The Integrator is restoring
      kd to 0.375, so the geometry should stay as it is. The 60 mm span was rejected
      twice (iterations 3 and 8, oval progress 0.275 and 0.301). Bend max_error has
      stayed on its 0.059 to 0.068 m plateau across every span, footprint, lead, wheel_track
      and controller change, so no geometry lever has moved it below the off-track
      limit. The y 0.04 lead test is the next candidate lever, but it has not been
      verified and this is the last race. Testing it now risks a collapse like the
      y 0.03 result in iteration 1 and would give no later iteration to recover. I
      therefore hold the proven geometry and make no change. The expected result is
      the iteration 7 and 9 outcome, a score near 400 on the oval, with the bend tracks
      still off-track. Only the controller can change that outcome.


      - [Open this output](iteration-11/entity0/versions/12c5b121210f4aacbfdbfb55c788a3e1/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-3b9d5ef33760c606/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-ada38e596361d075/payload.json)'
  - id: entity1
    label: Final proven robot
    notes: 'Iteration 7 and 9 geometry with the iteration 9 controller (kd 0.375),
      restored after iteration 10 showed kd 0.33 drops oval progress to 0.727. Both
      prior races of this design scored 399.7, so this is the reproducible best package
      for the final race.


      ### Rationale


      This is the final iteration, so the package I deliver is the one the unseen-track
      race will score. The best evidence is iteration 7 and iteration 9, which raced
      the identical geometry and controller and both scored 399.7, with oval progress
      0.995 and 20 of 20 oval finishes. Iteration 10 changed only kd (0.375 to 0.33)
      and fell to 239.3, with oval progress 0.727 and 6 of 20 finishes. So kd 0.33
      is the wrong direction, and the 0.375 damping is the stable point on this geometry.
      I therefore restore the iteration 9 controller exactly: base_speed 1.15, kp
      3.75, ki 0.21, kd 0.375, weights -2, -1, 0, 1, 2, last_direction. The geometry
      matches the Builder''s proposal and the proven iteration 7 and 9 design: 50
      mm span at 12.5 mm pitch, 12 mm footprints, y 0.05, wheel_track 0.10, body 0.14
      by 0.12 m, mass 0.7 kg, wheel radius 0.03 m. Bend max_error stays on its 0.059
      to 0.068 m plateau under every geometry and controller change tested, so no
      untested lever is worth risking on the final race. The 60 mm span (iterations
      3 and 8) and the y 0.03 lead (iteration 1) both collapsed progress and are rejected.
      Expected result is the iteration 9 outcome: a score near 400, oval progress
      about 0.995, and the bend tracks still off-track. This is a deliberate reproduction
      of the best known package, not an exploratory change.


      - [Open this output](iteration-11/entity1/versions/e54b85a5e54344f6af3d239150e1c687/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/12c5b121210f4aacbfdbfb55c788a3e1/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-ada38e596361d075/payload.json)'
  - id: entityR1
    label: Final geometry feedback
    notes: 'Confirms the Builder''s proven 50 mm, 12 mm, y 0.05, wheel_track 0.10
      geometry and rejects the 60 mm span and y 0.03 lead on iterations 1, 3 and 8.
      Offers y 0.04 and a 16 mm footprint as the only untested levers for bend max_error,
      each conditional on the outcome of the earlier test.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. This
      is the final iteration, so this feedback is for the record and for the team''s
      understanding of the design. The Builder''s geometry is the iteration 7 and
      9 design, and I have adopted it unchanged. The controller I used is the iteration
      9 controller (kd 0.375, kp 3.75, ki 0.21, base 1.15), because iteration 10 showed
      that lowering kd to 0.33 drops oval progress from 0.995 to 0.727 on the same
      geometry. Evidence: 60 mm span collapsed oval progress in iterations 3 (0.275)
      and 8 (0.301). The y 0.03 lead collapsed it in iteration 1 (0.273). The 16 mm
      footprint at 60 mm reached only 0.405 in iteration 2. Bend max_error has stayed
      on a 0.059 to 0.068 m plateau under every span, footprint, lead, wheel_track
      and controller change across iterations 0 to 10. Decide the next design as follows,
      if any further iteration occurs. If the oval holds at 0.95 or more and bend
      max_error stays on its plateau, test sensor y 0.04 with no other change, as
      the lead is the only untested sensing lever. If the oval falls below about 0.9,
      restore kd 0.375 before any geometry change. If the y 0.04 lead test fails,
      test a 16 mm footprint at the 50 mm span alone.


      ### Requested changes


      - If the next race keeps oval progress at or above 0.95 and bend max_error on
      its plateau, test sensor y 0.04 on all five sensors with x at -0.025, -0.0125,
      0, 0.0125, 0.025 and 12 mm footprints. Do not go below y 0.04, because iteration
      1 showed that y 0.03 collapses progress.

      - If the y 0.04 lead test does not bring bend max_error below 0.06 m, test sensor_size
      0.016 at the 50 mm span with y 0.05 and wheel_track 0.10, run alone. Iteration
      2 gave oval progress 0.405 with 16 mm footprints at 60 mm, so this is a lower-priority
      test.

      - Keep the 50 mm span (x = -0.025 to 0.025) and wheel_track 0.10. Iterations
      4, 7 and 9 held oval progress at 0.71 or above at 50 mm, and iterations 3 and
      8 show that 60 mm collapses it.


      - [Open this output](iteration-11/entityR1/versions/e54b85a5e54344f6af3d239150e1c687/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/12c5b121210f4aacbfdbfb55c788a3e1/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-ada38e596361d075/payload.json)'
