map:
  id: race-133-randow-maps
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Hold 50mm span, test ctrl
    notes: 'Keeps the best-performing geometry from iteration 4 (50 mm span, 12 mm
      footprint, y 0.05) unchanged, so the Integrator''s controller change is isolated.
      Iteration 4 reached oval progress 0.71 and score 188.0 with line losses in the
      1 to 1.4 range, and max_error is not improved by body width, so geometry is
      held and wheel_track 0.10 is queued as the next test.


      ### Rationale


      Iteration 4 (50 mm span, 12 mm footprint, y 0.05) is the best design so far.
      Oval progress rose to 0.710 from 0.664 at 40 mm and 0.275 at 60 mm, and the
      score reached 188.0, with 3 of 20 oval runs finishing. Line losses stayed within
      the expected band (oval 1.2, s-bend 1.0, slalom 1.4), so the span is not losing
      the tape. Progress therefore peaks near 50 mm and does not keep rising toward
      40 mm, so the Integrator''s rule to move toward 40 mm does not apply. I keep
      the 50 mm span, 12 mm footprint and y 0.05 lead unchanged.


      The remaining failure is off-track excursions. max_error sits at 0.0586 to 0.064
      m against a 0.06 m limit. Body width cannot raise that limit: max(0.06, 0.0125
      + body_width/4) is 0.06 m for any width in range, so I leave body_width at 0.12.
      Wheel_track is the only untested turn-rate lever, but changing it now would
      shift the effective steering gain by about 20 percent and confound the Integrator''s
      controller tuning, which is already changing in this iteration. I therefore
      hold the geometry fixed so the next race isolates the controller change, and
      I flag wheel_track 0.10 as the next geometry test if max_error stays on its
      plateau.


      Expected result: oval progress at or near 0.7, line losses 1 to 1.4, and max_error
      still around 0.06 m. Any gain should come from the controller.


      - [Open this output](iteration-5/entity0/versions/ba965ba4e6e747249f56e76ef5f4f297/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-4678b9f7ca1e48d3/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-c30eca97a0382b59/payload.json)'
  - id: entity1
    label: Slower turns, more
    notes: 'Keeps the iteration 4 geometry and changes the controller only: base_speed
      1.5 to 1.3 and kd 0.35 to 0.40. This targets the max_error plateau (0.0586 to
      0.064 m) while the oval has time margin under 3 s, based on iteration 4 race
      data.


      ### Rationale


      Iteration 4 (50 mm span, 12 mm footprint, y 0.05, kp 4.5, ki 0.25, kd 0.35)
      is the best design so far: score 188.0, oval progress 0.710, and 3 of 20 oval
      runs finished. Its line-loss counts (oval 1.2, s-bend 1.0, slalom 1.4) show
      the span is holding the tape, so I keep the geometry unchanged, as the Builder
      asked. The remaining failure is off-track excursions: max_error is 0.0586 to
      0.064 m against a 0.06 m limit, and 17 of 20 oval runs still leave the track.
      The oval mean finish time is 1.84 s at base_speed 1.5, so there is time margin
      under the 3 s limit. Entering turns at lower speed should reduce the lateral
      excursion without changing the sensing. I therefore lower base_speed from 1.5
      to 1.3. On the oval that projects to about 2.1 s, still well within 3 s. I also
      raise kd from 0.35 to 0.40 to damp the turn-in lag, while keeping kp 4.5 and
      ki 0.25 so that only speed and derivative damping change. Expected: oval progress
      at or above about 0.7, max_error nearer 0.055 to 0.06 m, and steering_oscillation
      near 0.2 to 0.3. If progress falls because the robot is too slow to finish,
      the base_speed change is the cause and I will restore 1.5.


      - [Open this output](iteration-5/entity1/versions/145b52f9574640559d6b5dac87613b3b/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/ba965ba4e6e747249f56e76ef5f4f297/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-c30eca97a0382b59/payload.json)'
  - id: entityR1
    label: Keep 50 mm, test track
    notes: 'Advises the Builder to keep the 50 mm span, 12 mm footprint and y 0.05,
      which gave the best score (188.0) with the lowest line losses. It names wheel_track
      0.10 as the next test if max_error stays on its plateau.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. Iteration
      4 (50 mm span, 12 mm footprint, y 0.05, kp 4.5, ki 0.25, kd 0.35) is the best
      design so far, with oval progress 0.710, score 188.0, and line losses of 1.2
      (oval), 1.0 (s-bend) and 1.4 (slalom). Those counts show the 50 mm span is not
      losing the tape, so the geometry should stay as it is. Iteration 0 (40 mm) and
      iteration 3 (60 mm) show that span drives progress, and iteration 1 shows that
      y 0.03 collapses progress, so keep y 0.05. max_error has stayed at 0.059 to
      0.065 m in every iteration, and span, footprint and lead have not moved it.
      The next race will test whether controller speed and damping change that. Decide
      from it as follows. If max_error falls below about 0.058 m and oval progress
      holds at 0.65 or more, keep the 50 mm span and change nothing in the geometry.
      If max_error stays on its plateau (0.059 to 0.065 m) while oval progress holds,
      the excursions are not speed-limited, so the next geometry test is wheel_track
      0.10. If progress falls below about 0.5 because the robot is too slow to finish,
      restore base_speed to 1.5 and keep the span.


      ### Requested changes


      - If max_error stays at 0.059 to 0.065 m with oval progress at 0.65 or more,
      change wheel_track from 0.12 to 0.10 with no other geometry change. Iteration
      4 showed max_error on its plateau at every span, footprint and lead, so turn
      rate is the untested lever.

      - If oval progress drops below about 0.5 while line losses stay near 1, keep
      the 50 mm span, footprint 0.012 and y 0.05, and tell the Integrator that the
      speed change is the cause. Do not move the span, since iteration 0 (40 mm) and
      iteration 4 (50 mm) both reached progress above 0.66 and the span is not the
      cause.

      - Keep y at 0.05 and the 12 mm footprint. Iteration 1 showed that y 0.03 cut
      oval progress to 0.273, and iteration 3 showed that 12 mm at 60 mm span gave
      0.275, so the 50 mm span with 12 mm footprint is the proven base.


      - [Open this output](iteration-5/entityR1/versions/145b52f9574640559d6b5dac87613b3b/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/ba965ba4e6e747249f56e76ef5f4f297/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-c30eca97a0382b59/payload.json)'
