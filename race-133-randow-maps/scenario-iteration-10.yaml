map:
  id: race-133-randow-maps
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Revert to iter 7 geometry
    notes: 'Holds the best raced geometry (50 mm span, 12 mm footprints, y 0.05, wheel_track
      0.10) unchanged, so this race isolates the controller. Rests on iteration 7
      scoring 399.7 with oval progress 0.995, and iteration 8 showing 60 mm collapses
      the oval.


      ### Rationale


      The evidence across ten iterations shows that the 50 mm span, 12 mm footprint,
      y 0.05 lead and wheel_track 0.10 m design (iteration 7) is the best base so
      far, scoring 399.7 with oval progress 0.995 and 20 of 20 oval finishes. Iteration
      8 repeated the 60 mm span with wheel_track 0.10 and collapsed oval progress
      to 0.301, matching the iteration 3 collapse at 60 mm. So 60 mm is rejected.
      The Integrator''s iteration 9 feedback accepts the revert and asks to keep the
      controller unchanged, so this race should reproduce the best known result. Bend
      max_error has stayed on a 0.059 to 0.068 m plateau under every span, footprint,
      lead, wheel_track and controller change. Line losses on the bend tracks are
      about 1 per run, so sensing is not losing the tape. Changing geometry now would
      only confound the Integrator''s controller evidence. I therefore hold the geometry
      identical to iteration 7. The next untested lever is the lead (y 0.04) on the
      bend tracks, which the Integrator will request only if the controller is stable
      (oval progress at or above 0.95 and s-bend oscillation at or below 0.3). The
      16 mm footprint at 50 mm stays untested and is deferred. Expected result: a
      score near 400 with oval progress at or above 0.95.


      - [Open this output](iteration-10/entity0/versions/ce86ae25201a4ab0848737062f9099a2/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-4069bf0bedf7b2ad/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-6979dd93c8a2fcf2/payload.json)'
  - id: entity1
    label: Iter 7 geometry, kd 0.33
    notes: 'Holds the iteration 7 geometry exactly and lowers kd from 0.375 to 0.33
      to test whether s-bend oscillation (0.317 in iteration 9) falls below 0.3. Iteration
      9 reproduced the 399.7 score, so the controller is the only variable.


      ### Rationale


      The Builder''s geometry reproduces iteration 7 exactly: 50 mm span at 12.5 mm
      pitch, 12 mm footprints, y 0.05 lead, wheel_track 0.10 m. Iteration 9 already
      raced this geometry with the iteration 7 controller and returned the same score
      (399.74, oval progress 0.995, 20 of 20 oval finishes). That makes a controller-only
      change the one informative test this iteration. The only controller metric outside
      the plateau is s-bend steering_oscillation at 0.317, above the 0.3 threshold
      the Builder asked about. Bend max_error (s-bend 0.0676 m, slalom 0.0608 m) and
      line losses (about 1 per run) show that sensing holds the tape and that the
      excursions are turn-induced. Oval progress holds with a wide margin, so I lower
      kd from 0.375 to 0.33 (about 12 percent) to damp the derivative response that
      drives the jitter. kp 3.75 and ki 0.21 stay unchanged so the effect on oscillation
      is attributable. Expected result: s-bend steering_oscillation at or below 0.3
      and oval progress at or above 0.95. The main risk is a small rise in bend max_error,
      because less damping can allow more overshoot on the s-bend. If oscillation
      falls but oval progress drops below 0.95, I would restore kd 0.375 next iteration.


      - [Open this output](iteration-10/entity1/versions/8eea61b471444bdeb740b63dca0d3a4e/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/ce86ae25201a4ab0848737062f9099a2/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-6979dd93c8a2fcf2/payload.json)'
  - id: entityR1
    label: Lead test after stable
    notes: 'Feedback tells the Builder to test a y 0.04 lead only if the damped controller
      holds oval progress at or above 0.95 and bend max_error stays on its plateau.
      The 60 mm span is rejected on iterations 3 and 8.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      evidence is iteration 7 and iteration 9, which are the same geometry (50 mm
      span, 12 mm footprint, y 0.05, wheel_track 0.10) and scored 399.7 with oval
      progress 0.995. Iteration 8 (60 mm span, iteration 3 also at 60 mm) collapsed
      oval progress to 0.301 and 0.275, so 60 mm is rejected. Bend max_error has stayed
      on a 0.059 to 0.068 m plateau across every span, footprint, lead, speed, wheel_track
      and controller change. Line losses stay near 1 per run, so sensing is not losing
      the tape. The Integrator is lowering kd to 0.33 to bring s-bend steering oscillation
      (0.317 in iteration 9) under 0.3. Decide from the next race as follows. If oval
      progress is at or above 0.95 and s-bend oscillation is at or below 0.3, the
      controller is stable and the y 0.04 lead test on the bend tracks is the next
      geometry change. If oval progress falls below about 0.95 or bend max_error rises
      above 0.068 m, the damping change hurt, so the Integrator will restore kd 0.375
      before any geometry change. If bend max_error stays on its plateau with the
      controller stable, the lead test is the next lever.


      ### Requested changes


      - If oval progress is at or above 0.95, s-bend steering_oscillation is at or
      below 0.3 and bend max_error stays on its 0.059 to 0.068 m plateau, change sensor
      y from 0.05 to 0.04 on all five sensors and keep x at -0.025, -0.0125, 0, 0.0125,
      0.025, 12 mm footprints and wheel_track 0.10. Iteration 1 showed that y 0.03
      collapses progress (oval 0.273 at 60 mm), so do not go below 0.04.

      - If the lead test at y 0.04 does not move bend max_error below 0.06 m, try
      sensor_size 0.016 at the 50 mm span with y 0.05 and wheel_track 0.10. Iteration
      2 showed a 16 mm footprint at 60 mm gave oval progress 0.405, so this is a lower-priority
      test that must be run alone.

      - Keep the 50 mm span (x = -0.025 to 0.025) and wheel_track 0.10. Iterations
      4, 7 and 9 held oval progress at 0.71 or above at 50 mm, and iterations 3 and
      8 show 60 mm collapses it.


      - [Open this output](iteration-10/entityR1/versions/8eea61b471444bdeb740b63dca0d3a4e/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/ce86ae25201a4ab0848737062f9099a2/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-6979dd93c8a2fcf2/payload.json)'
