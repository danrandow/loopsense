map:
  id: race-133-randow-maps
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Evidence across four iterations. Iteration 0 (40 mm span, 12 mm footprint, y
      0.05) is the only design that finished a run and has the best oval progress
      (0.664) and best score (159.7). Iteration 2 (60 mm span, 16 mm, y 0.05) reached
      oval progress 0.405 and score 133.7. Iteration 3 changed only the footprint,
      from 16 mm to 12 mm, at the 60 mm span. Oval progress fell to 0.275 and the
      score fell to 112.9. So the footprint is not the limit: the 12 mm footprint
      is worse at 60 mm, and the 16 mm footprint was better. Iteration 1 showed that
      the shorter lead (y 0.03) collapses progress, so the lead stays at 0.05. max_error
      sits at 0.062 to 0.065 m in every iteration, which is just over the 0.06 m off-track
      limit, and it does not respond to span, footprint or lead. Taken together, progress
      tracks the span: 40 mm gives 0.664 with 12 mm footprints, while 60 mm gives
      0.275 with 12 mm and 0.405 with 16 mm. The Integrator''s rule (oval progress
      at or below 0.4 with the footprint already at 12 mm means narrow the span) applies.
      I narrow the span from 60 mm to 50 mm, keep the 12 mm footprint and y 0.05,
      and change nothing else. This sits between the 40 mm point that gave the best
      progress and the 60 mm point that gave the worst, so it tests whether progress
      recovers as the span narrows. I expect oval progress between 0.4 and 0.6 and
      line-loss events near 1 to 1.4. If progress reaches about 0.66 again, the span
      is the controlling variable and 40 mm should be the base for the next iteration.
      If progress stays below about 0.4, the span is not the whole story and the next
      lever is wheel_track 0.10 for max_error. Body, wheel and mass stay unchanged
      so the sensing span is the only geometry variable.


      - [Open this output](iteration-4/entity0/versions/39171edc5c344d038d602c4588477961/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-38a9ccc054dce0d1/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-644b242206fc2af9/payload.json)'
  - id: entity1
    label: 50 mm span robot package
    notes: 'Uses the Builder''s 50 mm span with a 12 mm footprint and y 0.05, with
      kp 4.5, ki 0.25 and kd 0.35 interpolated between the 40 mm and 60 mm gain sets.
      Iteration 0 (40 mm) and iteration 3 (60 mm) show progress 0.664 vs 0.275, which
      is why span is the variable under test.


      ### Rationale


      Iteration 0 (40 mm span, 12 mm footprint, y 0.05, kp 4, ki 0.2, kd 0.3) remains
      the best design so far, with oval progress 0.664 and score 159.7. Iteration
      3 (60 mm span, 12 mm footprint, kp 6, ki 0.3, kd 0.45) fell to oval progress
      0.275, and iteration 2 (60 mm, 16 mm, same gains) reached 0.405. The 60 mm span
      is therefore the likely cause of the drop, and footprint is secondary. The Builder''s
      proposal narrows the span to 50 mm at 12 mm footprint and y 0.05, with body,
      wheel and mass unchanged, so that span is the only geometry variable. The controller
      must be matched to this geometry. Sensor weights are unchanged at (-2, -1, 0,
      1, 2), since the signal is a reading-weighted average and these weights already
      fix its scale. With a narrower span the outer sensors reach the tape edge at
      smaller offsets, so the signal per metre of offset is steeper than at 60 mm.
      Iteration 3 showed that kp 6 at 60 mm did not help progress, so I do not scale
      kp up. I interpolate between the best-performing gains at 40 mm (kp 4, ki 0.2,
      kd 0.3) and the 60 mm gains (kp 6, ki 0.3, kd 0.45), taking kp 4.5, ki 0.25,
      kd 0.35. This is a moderate step that stays close to the gains that gave the
      best progress. The lead stays at y 0.05, because iteration 1 showed that y 0.03
      collapses progress. line_loss stays last_direction, since iteration 0 and 3
      line-loss counts (1.25 to 1.9) were handled by that rule. base_speed 1.5 is
      kept, since the oval finished in 1.73 s in iteration 0, so speed is not the
      limit. The measurement request keeps the full set, including noise_robustness,
      so the result can be compared against iterations 0 to 3 on the same metrics.


      - [Open this output](iteration-4/entity1/versions/ae2af0a9cf374f019e4b8b029a9600a9/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/39171edc5c344d038d602c4588477961/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-644b242206fc2af9/payload.json)'
  - id: entityR1
    label: Span-test feedback
    notes: 'Gives the Builder decision rules for the 50 mm result, with 40 mm as the
      fallback and wheel_track 0.10 for max_error. It cites the iteration 0 and 3
      contrast and the iteration 1 lead collapse, and states no outcome for this candidate.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. Iteration
      0 (40 mm span, 12 mm footprint, y 0.05, kp 4) gave oval progress 0.664 and score
      159.7, the best so far. Iteration 3 (60 mm span, 12 mm footprint, kp 6) gave
      oval progress 0.275 and score 112.9, using the same footprint and lead. That
      contrast is the strongest evidence that span drives progress. Iteration 2 (60
      mm, 16 mm) gave 0.405, so footprint matters less than span. Iteration 1 showed
      that y 0.03 collapses progress, so keep y 0.05. Your question about kp: I did
      not scale kp up to 6 at 50 mm. I used kp 4.5 because the 60 mm kp 6 setting
      in iteration 3 did not help progress. max_error has stayed at 0.062 to 0.065
      m in every iteration, so span, footprint and lead do not fix it. Decide from
      the next race as follows. If oval progress rises to about 0.55 or higher with
      line losses near 1 to 1.4, span is controlling: keep 50 mm, or move toward 40
      mm if progress is still rising. If progress is between about 0.4 and 0.55, the
      span effect is partial: keep 50 mm and change the controller before the geometry.
      If progress stays at or below about 0.4, span is not monotonic, so return to
      40 mm and address max_error with wheel_track.


      ### Requested changes


      - If oval progress is 0.55 or higher with line losses near 1 to 1.4, move the
      span to 40 mm (x = -0.02, -0.01, 0, 0.01, 0.02) at 12 mm footprint and y 0.05,
      since iteration 0 gave the best progress at 40 mm.

      - If oval progress is at or below about 0.4 while line losses stay near 1, keep
      the 40 mm span from iteration 0 and set wheel_track to 0.10 with no other geometry
      change. max_error has stayed at 0.062 to 0.065 m across iterations 0 to 3, so
      turn rate is the untested lever.

      - Do not change the lead from y 0.05. Iteration 1 showed that y 0.03 cut oval
      progress to 0.273, and iteration 2 showed that restoring y 0.05 brought it back
      to 0.405.


      - [Open this output](iteration-4/entityR1/versions/ae2af0a9cf374f019e4b8b029a9600a9/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/39171edc5c344d038d602c4588477961/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-644b242206fc2af9/payload.json)'
