map:
  id: race-133-randow-maps
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: 12mm footprint, 60mm span
    notes: 'Keeps the 60 mm span and y = 0.05 lead that recovered progress in iteration
      2, and changes only sensor_size from 16 mm to 12 mm. Oval progress sat at 0.405
      with line losses near 1, which is right at the threshold in last iteration''s
      feedback rule for trying a narrower footprint.


      ### Rationale


      Iteration 2 restored the y = 0.05 lead while keeping the 60 mm span and 16 mm
      footprint. It recovered most of the progress lost in iteration 1: oval progress
      rose from 0.273 to 0.405, s-bend from 0.109 to 0.423, and the score from 64.6
      to 133.7. So the shorter lead (y = 0.03) was the main cause of the collapse.
      Line losses stayed near 1 (1.2, 1.1, 1.0), which the wide span keeps under control.
      max_error stayed at 0.062 to 0.065 m on every track, so off-track excursions
      are still transient and are not caused by tape loss.


      The feedback rule I wrote last iteration says that if progress stays below about
      0.4 with line losses near 1, the 16 mm footprint is probably blurring the centre
      signal, and the next step is a 12 mm footprint with the 60 mm span. Oval progress
      is 0.405 and s-bend is 0.423, right at that threshold. Iteration 0, with a 12
      mm footprint, had the best oval progress (0.664), although its span was 40 mm.
      The footprint is the one sensing variable not yet isolated at the 60 mm span.


      I therefore change only the footprint, from 0.016 to 0.012, and keep the 60
      mm span (x = -0.03, -0.015, 0, 0.015, 0.03), y = 0.05, and all body, wheel and
      mass values. With a 15 mm pitch and 12 mm footprints, the 25 mm tape is always
      covered by at least one sensor across the array, and the outer sensors keep
      a graded signal. I expect progress to move back toward 0.5 or higher, line losses
      to stay near 1 to 1.3, and max_error to remain near 0.06 m. max_error is the
      untested lever for the next step, which is wheel_track 0.10 if progress recovers
      and max_error stays on its plateau.


      - [Open this output](iteration-3/entity0/versions/5c7d714fa0d3491aa8daf82b94ea96d4/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-3e5ec2440de48882/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-943ecee6ee448297/payload.json)'
  - id: entity1
    label: Restore y=0.05 lead
    notes: 'Keeps the 60 mm span and 16 mm footprints but returns the lead to y =
      0.05 with gains unchanged. This isolates whether the short lead caused the iteration
      1 progress collapse (oval 0.664 to 0.273).


      ### Rationale


      Iteration 1 changed span, footprint and lead together, and progress collapsed
      (oval 0.664 to 0.273, mean score 159.7 to 64.6). Line-loss events fell to 1.0
      on every track and steering oscillation fell on the oval and s-bend, so the
      wider 60 mm span did its job on line loss. max_error stayed at 0.063 to 0.065
      m on every track and in both iterations, which points to transient turn-induced
      excursions rather than sensing dropout. The likely cause of the progress loss
      is the shorter lead (y 0.05 to 0.03), since the robot reacts later on bends.
      This iteration keeps the Builder''s 60 mm span and 16 mm footprints and restores
      y = 0.05, so the lead is the only sensing change. Gains stay at iteration 1
      values (kp 6, ki 0.3, kd 0.45) so the lead effect is isolated from the controller.
      The 60 mm span is kept, so a restored lead should bring line_loss_events near
      1 and oval progress back above 0.5 if the lead was the cause. Body, wheel and
      mass are unchanged. I expect progress to recover, but max_error is likely to
      stay near 0.06 m.


      - [Open this output](iteration-2/entity1/versions/b5c31efd47f940d5b4ddd98a5ea8fa1d/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/8d1354ac673c4ac6bf21090c8363937d/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-5e63ec22f267d9f6/payload.json)'
  - id: entityR1
    label: Lead test, turn-rate
    notes: 'Feedback predicts from iteration 0 and 1 evidence: progress recovery would
      point to the lead, while stalled progress points to the 16 mm footprint. Max_error
      stuck at about 0.064 m across both iterations suggests testing wheel_track as
      the turn-rate lever.


      ### Feedback


      Written before this candidate has raced. Iteration 1 (60 mm span, 16 mm footprint,
      y = 0.03, kp 6) cut line_loss_events from 1.9 to 1.0 on the slalom and s-bend,
      but oval progress fell from 0.664 to 0.273, and the mean score fell from 159.7
      to 64.6. Iteration 0 (40 mm span, 12 mm footprint, y = 0.05) had the best progress,
      so the shorter lead is the leading suspect for the collapse. Your design restores
      y = 0.05 and keeps the span and footprint, so it isolates the lead. max_error
      stayed at 0.063 to 0.065 m in both iterations, so span and lead alone do not
      fix off-track excursions. Decide from the next race as follows. If oval progress
      recovers toward 0.66 and line_loss_events stays near 1, keep the 60 mm span
      and tune the controller for max_error. If progress stays below about 0.4 while
      line losses stay near 1, the 16 mm footprint is blurring the centre signal,
      so move to a 12 mm footprint with the 60 mm span. If line losses rise above
      about 1.5 again, the wider span is needed and the lead is not the problem.


      ### Requested changes


      - If progress stays below about 0.4 on the oval with y = 0.05, try sensor_size
      0.012 with the same 60 mm span and y = 0.05. Iteration 1 changed footprint and
      lead together, so the footprint effect has not been isolated.

      - If progress recovers but max_error stays at 0.063 to 0.065 m on all tracks,
      try wheel_track 0.10 with the current sensor array. Max_error has stayed at
      this plateau across iterations 0 and 1, so turn rate is the untested lever.

      - If line_loss_events fall to 1 and oscillation stays low, try a wider span
      of x = -0.04, -0.02, 0, 0.02, 0.04 with sensor_size 0.008 and y = 0.05. This
      tests whether a narrower footprint with a wider span holds a graded signal at
      the tape edge.


      - [Open this output](iteration-2/entityR1/versions/b5c31efd47f940d5b4ddd98a5ea8fa1d/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/8d1354ac673c4ac6bf21090c8363937d/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-5e63ec22f267d9f6/payload.json)'
