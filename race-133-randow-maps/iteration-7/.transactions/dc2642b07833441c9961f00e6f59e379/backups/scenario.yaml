  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Narrower wheel track 0.10
    notes: 'Changes only wheel_track from 0.12 to 0.10 m, as the agreed rule requires.
      Iteration 6 kept s-bend max_error at 0.068 m and slalom at 0.065 m while oval
      progress was 0.956, so turn rate is the untested lever.


      ### Rationale


      Iteration 6 raced with the 50 mm span, 12 mm footprint and y 0.05 lead, and
      its controller (set by the Integrator) gave oval progress 0.956, finishing 17
      of 20 oval runs, with oval max_error 0.023 m. That is well above the 0.65 floor.
      Its s-bend and slalom max_error stayed at 0.0682 and 0.0645 m, both at or above
      the 0.06 m line, and neither track finished. The Integrator''s stated decision
      rule applies: when s-bend or slalom max_error stays at or above 0.06 m while
      oval progress holds, the excursions are not speed-limited, so the untested turn-rate
      lever is wheel_track. Iterations 0 to 6 show max_error on a plateau of 0.059
      to 0.068 m across every span, footprint, lead and controller change, and sensing
      is not losing the tape (line losses about 1 per run on the development tracks).
      I therefore change only wheel_track, from 0.12 to 0.10 m. A narrower track raises
      the turn rate for a given wheel difference, so the robot should turn harder
      on tight bends and reduce the s-bend and slalom excursions. The risk is that
      the steering gain rises by roughly 20 percent, so the controller may oscillate
      or lose oval progress. Sensor positions, footprint, body, wheel radius and mass
      stay fixed so the result isolates wheel_track.


      - [Open this output](iteration-7/entity0/versions/7f301db64441444e856ad1d3a7f597e6/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-de53967d5e772b3c/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-95e2c802800a616d/payload.json)'
  - id: entity1
    label: Narrow track test, kp
    notes: 'Iteration 6 geometry with wheel_track cut from 0.12 to 0.10 m, the agreed
      test after s-bend and slalom max_error stayed at 0.068 and 0.065 m. Gains scaled
      by 0.833 (kp 3.75, ki 0.21, kd 0.375) to offset the steering gain rise, as the
      evidence in iteration 6 shows oval progress at 0.956.


      ### Rationale


      Iteration 6 (50 mm span, 12 mm footprint, y 0.05, base 1.15, kp 4.5, ki 0.25,
      kd 0.45) is the best run so far at 355.3. Oval progress is 0.956 with 17 of
      20 finishes, well above the 0.65 floor. The s-bend and slalom still end off-track
      with max_error 0.0682 and 0.0645 m, both above the 0.06 m line, and neither
      finishes. Line losses are about 1 per run and steering oscillation is about
      0.2 to 0.25, so sensing is holding the tape and the excursions are turn-induced.
      The Builder''s decision rule therefore applies: change wheel_track from 0.12
      to 0.10 with no other geometry change. A narrower track raises the turn rate
      per wheel difference by about 1.2 times, so the effective steering gain rises
      by the same factor. To keep that gain near the proven level, I scale the controller
      gains by 0.10/0.12 = 0.833: kp 4.5 to 3.75, ki 0.25 to 0.21, kd 0.45 to 0.375.
      base_speed stays at 1.15, since the oval finishes with margin. The sensor array,
      footprint, body, wheel radius and mass are unchanged so the wheel_track effect
      is isolated. Expected result: s-bend and slalom max_error below 0.06 m, oval
      progress at or above 0.85, and steering oscillation not rising above about 0.3.


      - [Open this output](iteration-7/entity1/versions/e8cbd16451034c9a8938c5ac5130aaad/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/7f301db64441444e856ad1d3a7f597e6/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-95e2c802800a616d/payload.json)'
  - id: entityR1
    label: Next steps after track
    notes: 'Feedback gives the Builder two branches for the next race: a 60 mm span
      if the s-bend and slalom excursions persist, or a 0.04 m lead if the steering
      gain is too high. Both rest on iteration 0 to 6 evidence showing max_error plateaued
      while line losses stayed near 1.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. The
      Integrator''s evidence is iteration 6 (50 mm span, 12 mm footprint, y 0.05,
      base 1.15, kp 4.5, kd 0.45), which scored 355.3 with oval progress 0.956 and
      17 of 20 oval finishes. Its s-bend and slalom max_error were 0.0682 and 0.0645
      m, and neither track finished. Line losses stayed near 1 per run and steering
      oscillation stayed about 0.2 to 0.25, so the excursions are turn-induced rather
      than sensing dropouts. Iterations 0 to 6 show max_error on a 0.059 to 0.068
      m plateau across every span, footprint, lead and controller change. This candidate
      therefore changes only wheel_track, from 0.12 to 0.10 m, and the Integrator
      scales kp to 3.75 to keep the steering gain near its proven level. Decide from
      the next race as follows. If s-bend and slalom max_error both fall below 0.06
      m with oval progress at 0.65 or more, keep wheel_track 0.10 and tune the controller
      only. If oval progress falls below about 0.65 while steering oscillation rises
      above about 0.3, the steering gain is still too high, so keep wheel_track 0.10
      and ask the Integrator to lower kp further. If max_error stays at or above 0.06
      m on the s-bend and slalom while oval progress holds, the turn-rate change did
      not help, so the next geometry test is a sensor span change on the s-bend and
      slalom tracks.


      ### Requested changes


      - If s-bend and slalom max_error are still at or above 0.06 m while oval progress
      holds at 0.65 or more, change the sensor span from 50 mm to 60 mm (x = -0.03,
      -0.015, 0, 0.015, 0.03) with 12 mm footprints at y 0.05, keeping wheel_track
      0.10. Iterations 2 and 3 showed 60 mm lowered line losses, so this tests whether
      a wider array reduces the bend excursions at the narrower track.

      - If oval progress falls below about 0.65 at wheel_track 0.10 with steering
      oscillation above about 0.3, keep wheel_track 0.10 and reduce the sensor lead
      from y 0.05 to y 0.04, which keeps the span. Iteration 1 showed that y 0.03
      collapses progress, so do not go below 0.04.

      - Keep the 50 mm span, 12 mm footprint and y 0.05 unless one of the rules above
      applies. Iteration 4 (50 mm) and iteration 0 (40 mm) both reached oval progress
      above 0.66, and iteration 3 (60 mm, 12 mm) fell to 0.275, so do not move the
      span toward 60 mm without the evidence above.


      - [Open this output](iteration-7/entityR1/versions/e8cbd16451034c9a8938c5ac5130aaad/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/7f301db64441444e856ad1d3a7f597e6/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-95e2c802800a616d/payload.json)'
