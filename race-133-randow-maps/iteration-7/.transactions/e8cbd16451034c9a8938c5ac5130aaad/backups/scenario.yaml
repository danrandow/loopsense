map:
  id: race-133-randow-maps
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Narrower wheel track 0.10
    notes: 'Changes only wheel_track from 0.12 to 0.10 m, as the agreed rule requires.
      Iteration 6 kept s-bend max_error at 0.068 m and slalom at 0.065 m while oval
      progress was 0.956, so turn rate is the untested lever.


      ### Rationale


      Iteration 6 raced with the 50 mm span, 12 mm footprint and y 0.05 lead, and
      its controller (set by the Integrator) gave oval progress 0.956, finishing 17
      of 20 oval runs, with oval max_error 0.023 m. That is well above the 0.65 floor.
      Its s-bend and slalom max_error stayed at 0.0682 and 0.0645 m, both at or above
      the 0.06 m line, and neither track finished. The Integrator''s stated decision
      rule applies: when s-bend or slalom max_error stays at or above 0.06 m while
      oval progress holds, the excursions are not speed-limited, so the untested turn-rate
      lever is wheel_track. Iterations 0 to 6 show max_error on a plateau of 0.059
      to 0.068 m across every span, footprint, lead and controller change, and sensing
      is not losing the tape (line losses about 1 per run on the development tracks).
      I therefore change only wheel_track, from 0.12 to 0.10 m. A narrower track raises
      the turn rate for a given wheel difference, so the robot should turn harder
      on tight bends and reduce the s-bend and slalom excursions. The risk is that
      the steering gain rises by roughly 20 percent, so the controller may oscillate
      or lose oval progress. Sensor positions, footprint, body, wheel radius and mass
      stay fixed so the result isolates wheel_track.


      - [Open this output](iteration-7/entity0/versions/7f301db64441444e856ad1d3a7f597e6/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-de53967d5e772b3c/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-95e2c802800a616d/payload.json)'
  - id: entity1
    label: 'Iter 6: slower, damped'
    notes: 'Holds the iteration 5 geometry exactly and changes only the controller:
      base_speed 1.3 to 1.15 and kd 0.40 to 0.45. Iteration 5 showed that the speed
      change lifted oval progress to 0.884, and s-bend and slalom max_error still
      sit at 0.062 to 0.065 m.


      ### Rationale


      Iteration 5 (50 mm span, 12 mm footprint, y 0.05, base 1.3, kp 4.5, ki 0.25,
      kd 0.40) is the best run so far at 295.09. Oval progress rose to 0.884 with
      9 of 20 finishes, and oval max_error fell to 0.046 m. The s-bend and slalom
      still end off-track with max_error of 0.0625 and 0.0647 m. Their line-loss counts
      (1.1) and steering oscillation (0.20 to 0.24) show the tape is held and the
      controller is not jittering, so the excursions are turn-induced transients.
      Speed reduction from 1.5 to 1.3 helped the oval without costing finish time
      (mean 1.84 s, well inside 3 s). I therefore apply one further, modest step in
      the same direction: base_speed 1.3 to 1.15 to lower turn-entry speed on the
      tight s-bend and slalom, and kd 0.40 to 0.45 to damp the turn-in lag that drives
      the excursions. kp 4.5 and ki 0.25 stay unchanged so the effect is attributable.
      The geometry is held exactly as supplied by the Builder, so the controller is
      the only variable. Expected: oval progress at or above about 0.8, and s-bend
      and slalom max_error below 0.062 m. If oval progress falls below about 0.65
      because the robot is too slow, restore base_speed to 1.3.


      - [Open this output](iteration-6/entity1/versions/36937627fffa4843836b4ba02c80ee39/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/99b16cc3371c4d538f56e4b448e79caf/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-78b643c9c3dbbd64/payload.json)'
  - id: entityR1
    label: Hold span; test
    notes: 'Keeps the 50 mm, 12 mm, y 0.05 array fixed and makes wheel_track 0.10
      conditional on s-bend and slalom max_error staying at or above 0.06 m. Iterations
      0 to 5 show span, footprint and lead do not move that plateau.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. Iteration
      4 (50 mm span, 12 mm footprint, y 0.05) gave oval progress 0.710. Iteration
      0 (40 mm) gave 0.664 and iteration 3 (60 mm, 12 mm) gave 0.275, so the 50 mm
      span is near the best and should stay. Iteration 1 (y 0.03) collapsed oval progress
      to 0.273, so keep y 0.05. Iteration 5 (base 1.3, kd 0.40) lifted oval progress
      to 0.884 and cut oval max_error to 0.046 m, but s-bend and slalom max_error
      stayed at 0.0625 and 0.0647 m. Decide from the next race as follows. If s-bend
      and slalom max_error falls below about 0.06 m with oval progress at 0.65 or
      more, keep the geometry and tune the controller further. If s-bend or slalom
      max_error is still at or above 0.06 m while oval progress holds, the excursions
      are not speed-limited, so test wheel_track 0.10 in the following iteration with
      no other geometry change, as requested below. If oval progress drops below about
      0.65 because the robot is too slow, the controller speed change is the cause,
      not the geometry, so keep the span and restore base_speed.


      ### Requested changes


      - If s-bend and slalom max_error is still at or above 0.06 m while oval progress
      is at or above 0.65, change wheel_track from 0.12 to 0.10 with no other geometry
      change. Iterations 0 to 5 show max_error on its plateau (0.059 to 0.065 m) across
      every span, footprint and lead, so turn rate is the untested lever.

      - Keep sensor_positions at x = -0.025, -0.0125, 0, 0.0125, 0.025 with y 0.05
      and sensor_size 0.012. Iteration 4 (50 mm, 12 mm, y 0.05) reached oval progress
      0.710 with line losses of 1.0 to 1.4, and iteration 1 showed that y 0.03 cuts
      oval progress to 0.273.

      - Do not change the span to 40 mm in the next iteration. Iteration 0 (40 mm)
      gave oval progress 0.664, below the 0.710 at 50 mm, so narrowing the span is
      not supported by the evidence.


      - [Open this output](iteration-6/entityR1/versions/36937627fffa4843836b4ba02c80ee39/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/99b16cc3371c4d538f56e4b448e79caf/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-78b643c9c3dbbd64/payload.json)'
