map:
  id: race-123-randow-maps
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Row forward to y=0.05 m
    notes: 'Moves the seven-sensor row from y=0.03 to y=0.05 m, keeping the ±0.06
      m span and 16 mm footprint. Iteration 1 had zero line losses but max_error of
      about 0.061 m on every track, so the change adds lead to remove the lag-driven
      drift.


      ### Rationale


      Iteration 1 removed the line-loss problem: line_loss_events fell from 1 to 0
      on all three tracks, so the wider ±0.06 m span and 16 mm footprints now keep
      the tape in view. The run still ends off track because max_error sits at 0.0613
      m (oval), 0.0610 m (s-bend) and 0.0613 m (slalom), just over the 0.06 m limit.
      Progress is 0.10 to 0.21, so the robot drifts off the line without ever losing
      it. This matches the Integrator''s rule for this case: no line losses but max_error
      above 0.06 m on the oval means tracking lag, so the sensor row should move forward
      for more lead. I therefore move the row from y = 0.03 m to y = 0.05 m and keep
      the seven-sensor ±0.06 m span, the 16 mm footprint and the 0.6 kg mass, since
      none of these is shown to be the limit. Steering oscillation rose only slightly
      (0.137 to 0.165 on the oval), so I keep the 16 mm footprint rather than cutting
      it to 12 mm. Body width stays at 0.12 m because the off-track limit is floored
      at 0.06 m for any body width up to 0.18 m, so it cannot be relaxed through geometry.
      Expected result: max_error falls below 0.06 m on the oval and s-bend, which
      should allow at least one completed run or longer runs before off-track. If
      max_error stays above 0.06 m with the row at y = 0.05 m, the next step is more
      lead or a narrower-speed controller tune, which is the Integrator''s call.


      - [Open this output](iteration-2/entity0/versions/4ae47387bfcb4e6e9cea0a0588a9fb54/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-50d1c15d121070c6/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-d0f612bd585fd256/payload.json)'
  - id: entity1
    label: Forward row, bias fix
    notes: 'Moves the sensor row to y = 0.05 m as proposed and raises ki from 0.05
      to 0.3 to cancel the steady max_error of about 0.061 m seen in iteration 1 on
      all tracks. Geometry matches the Builder''s proposal, and kp and kd are unchanged
      so the race isolates the change.


      ### Rationale


      Iteration 1 removed line losses on all three tracks (line_loss_events 1 to 0)
      but every run still went off track. max_error sat at 0.0610 to 0.0613 m on every
      track, which is nearly the same value everywhere. That points to a steady lateral
      bias rather than sensing dropout or a pure lag problem. A fixed left/right motor
      mismatch of about 2 percent would produce exactly this kind of constant drift,
      and a proportional-only controller settles at an offset of roughly bias/kp.
      The Builder''s proposal (sensors at y = 0.05 m, span ±0.06 m, 16 mm footprints,
      0.6 kg, wheel track 0.12 m, body unchanged) is adopted as written, so this race
      tests the forward-row change against iteration 1 with the geometry otherwise
      fixed. Controller: sensor weights stay at iteration 1 values (-2, -1.33, -0.67,
      0, 0.67, 1.33, 2), kp stays at 6.0, and kd stays at 0.3, because the forward
      row adds lead and the controller should not be retuned on a guess. The one change
      is ki from 0.05 to 0.3, which lets the bounded integral (±2) cancel a constant
      turn bias and pull the steady offset toward zero. Expected result: max_error
      falls below 0.06 m on the oval and s-bend, with line losses still at zero. This
      is an expectation, not a measured result. If max_error remains about 0.061 m,
      the next step is a stronger ki or a lower kp, not more geometry.


      - [Open this output](iteration-2/entity1/versions/fbe386df3e4f4043881fdb6ad87b0945/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/4ae47387bfcb4e6e9cea0a0588a9fb54/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-d0f612bd585fd256/payload.json)'
  - id: entityR1
    label: Span and footprint
    notes: 'Gives the Builder three conditional changes: widen the span if line losses
      return, switch to 12 mm footprints if max_error stays high, and reduce mass
      if oscillation rises. Each is tied to iteration 0 and 1 race results.


      ### Feedback


      Written before this candidate races. The evidence comes from iterations 0 and
      1. Iteration 0 (±0.04 m row, 12 mm footprints) lost the line about once per
      run, and every run went off track at max_error about 0.063 m. Iteration 1 (±0.06
      m, 16 mm footprints, 0.6 kg, y = 0.03 m) removed line losses to zero on all
      tracks, but every run still went off track, with max_error at 0.0610 to 0.0613
      m on all three tracks and progress of 0.10 to 0.21. Because the error is nearly
      identical across tracks, I read it as a steady drift, perhaps from the motor
      mismatch, rather than a sensing problem. For that reason I have moved the row
      to y = 0.05 m as you proposed, and I have raised ki to remove the bias, keeping
      kp and kd fixed. Body width cannot relax the 0.06 m off-track limit, so geometry
      only matters through sensing and lead. The next race will decide the direction.
      If line_loss_events stays at zero and max_error drops below 0.06 m, keep the
      geometry as it is and do not change the span. If line losses return on the slalom
      or s-bend, the span is too narrow for the tape at the offsets reached, so widen
      it. If max_error stays at about 0.061 m with zero line losses, the controller
      bias is not being removed, and geometry is not the lever.


      ### Requested changes


      - If the next race shows line_loss_events of 1 or more on the slalom or s-bend,
      widen the sensor span to x = -0.08, -0.0533, -0.0267, 0, 0.0267, 0.0533, 0.08
      (seven sensors, y = 0.05), since iteration 0 lost the tape near ±0.05 m and
      every run went off track.

      - If line losses are zero but max_error stays above 0.06 m on the oval and the
      forward row is not reducing it, try a narrower sensor footprint (sensor_size
      0.012) with the same positions, because iteration 0 with 12 mm sensors gave
      a cleaner graded signal, and steering_oscillation in iteration 1 (0.137 to 0.165)
      was driven by the 16 mm footprint.

      - If steering_oscillation rises above about 0.2 with the forward row at y =
      0.05 m, reduce mass from 0.6 to 0.5 kg to cut yaw inertia so the body can correct
      faster, keeping the sensor geometry fixed.


      - [Open this output](iteration-2/entityR1/versions/fbe386df3e4f4043881fdb6ad87b0945/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/4ae47387bfcb4e6e9cea0a0588a9fb54/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-d0f612bd585fd256/payload.json)'
