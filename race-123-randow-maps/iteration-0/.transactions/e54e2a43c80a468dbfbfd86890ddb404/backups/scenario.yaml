  inherits: base.yaml
  notes: Initial prepared state before either AI role or the simulator has acted.
dimensions:
  time_horizon: prepared
  iteration: '0'
overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor
    notes: 'A symmetric five-sensor baseline (0.02 m spacing, 0.03 m forward offset,
      0.012 m footprint) with mid-range body and drivetrain values. No race data exists
      yet, so this is a neutral starting point to test sensor span and lookahead.


      ### Rationale


      Iteration 0 has no race telemetry and no Integration Feedback yet, so this proposal
      is a balanced baseline rather than a tuned design. Five sensors at 0.02 m spacing
      span ±0.04 m, which covers the 25 mm tape with margin while keeping at least
      one sensor on the line through moderate bends. The sensors sit 0.03 m ahead
      of the axle so the reading leads the wheels and gives the controller time to
      react. Sensor size 0.012 m is about half the tape width, so a centred tape gives
      a clear, graded response. Weights are proportional to sensor x (left positive,
      right negative), so the signal is a direct lateral-offset estimate. Wheel track
      0.12 m, wheel radius 0.03 m, mass 0.8 kg and body width 0.12 m are mid-range
      values that keep the yaw inertia moderate and the off-track limit (max(0.06,
      0.0125 + 0.03) ≈ 0.0425 m) comfortable. Body length 0.18 m is a neutral choice.
      I expect a run to complete the oval at a moderate speed. The main risks are
      sensor saturation on tight slalom bends and speed being too low to finish in
      3 s. Both should show up in the next race telemetry.


      - [Open this output](iteration-0/entity0/versions/187bf79ba56f4404b45310e5112d320b/payload.json)'
  - id: entity1
    label: Baseline robot package
    notes: 'Copies the Builder''s baseline geometry and adds a conservative controller
      (weights x*50, kp 4.5, kd 0.25, base_speed 1.8, last_direction recovery). No
      prior race data, so the gains are starting values.


      ### Rationale


      Iteration 0 has no race telemetry, so the controller is a conservative, physics-based
      design for the supplied baseline geometry rather than a tuned one. Sensor weights
      are set proportional to sensor x (-2, -1, 0, 1, 2), so the reading-weighted
      signal is about 50 times the lateral centroid of the tape in metres; a 1 cm
      offset gives a signal near 0.5, which keeps kp in a useful range. kp=4.5 gives
      a moderate steering response (about 1.6 PWM-turn units per 0.1 signal, scaled
      by 350), kd=0.25 damps the 0.03 m forward lead without adding much jitter, and
      ki=0.05 is small so the integral does not wind up on the long oval. base_speed=1.8
      is just under the cap of 2 (above 2 gives no extra speed) to leave headroom
      for the 1.5 m/s average needed to finish in 3 s while limiting slip on the tighter
      slalom bends. line_loss=''last_direction'' is chosen because the tape is 25
      mm and the sensor span is 80 mm, so a loss usually happens at the edge of a
      bend, where continuing in the last turn direction is the best recovery. Geometry
      is copied unchanged from the Builder''s baseline so the race tests the proposal
      itself. Expected behaviour: completion on the oval, with line-loss risk on the
      slalom; this is not a measured result.


      - [Open this output](iteration-0/entity1/versions/80b9f848ed9d4a38b5882c6216ca7250/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/187bf79ba56f4404b45310e5112d320b/payload.json)'
  - id: entityR1
    label: Baseline integration
    notes: 'Iteration 0 has no race evidence, so the feedback gives conditional changes
      tied to what the next race shows: widen the sensor span if the slalom loses
      line, lower mass if the oval is too slow, and move the sensors forward if oscillation
      is high.


      ### Feedback


      This is the first iteration, so there is no earlier race outcome or telemetry
      to cite. What I had to set in the controller: the sensor row spans only 0.08
      m against a 25 mm tape, so I scaled the weights to x*50 (range -2 to 2) so the
      signal is about 50 times the lateral offset, and I kept kp moderate (4.5) to
      avoid overshoot from a signal that can jump quickly when an outer sensor reads
      the tape. I used last_direction line-loss recovery because a loss most likely
      happens at the edge of a bend. The forward offset of 0.03 m gives the controller
      lead, and kd=0.25 was needed to damp that lead. If the next race shows completion
      on the oval with line_loss_events of 0 or 1 and low rms_error, keep the sensor
      span and forward offset and only tune the drivetrain. If the race shows line
      losses on the slalom or the s-bend, with readings dropping to near zero at the
      outer sensors, widen the sensor span (for example x = ±0.05 or ±0.06) before
      changing the controller. If the race shows the robot finishes on the oval but
      finishes slowly or hits the time limit, raise the wheel_radius or lower mass
      to get more speed for the same base_speed.


      ### Requested changes


      - Widen the sensor span to x = -0.05, -0.025, 0, 0.025, 0.05 (keep y = 0.03)
      only if the next race shows line_loss_events above 1 on the slalom or s-bend,
      since iteration 0 has no evidence on saturation yet.

      - Reduce mass from 0.8 to 0.6 kg and keep wheel_track at 0.12 m, only if the
      next race shows completion_time above 2.5 s on the oval, since faster acceleration
      would be needed to finish within 3 s.

      - Move the sensor row forward to y = 0.05 m only if steering_oscillation is
      high on the oval, which would indicate the robot is reacting too late; keep
      y = 0.03 otherwise.


      - [Open this output](iteration-0/entityR1/versions/80b9f848ed9d4a38b5882c6216ca7250/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/187bf79ba56f4404b45310e5112d320b/payload.json)'
  actions:
  - id: action0
  - id: action1
measurements: {}
