map:
  id: race-123-randow-maps
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Span ±0.08, row back
    notes: 'Reverts the forward row to y = 0.03 m, which had the lowest oval max_error,
      and widens the seven sensors to ±0.08 m because line losses returned on the
      slalom and s-bend in iteration 2. Based on the Integrator''s rule for returning
      line losses and the iteration 2 result showing that forward lead raised max_error.


      ### Rationale


      Iteration 2 moved the sensor row forward (y 0.03 to 0.05 m) and it did not help.
      Oval max_error rose from 0.0613 to 0.0637 m, s-bend stayed near 0.0627 m, and
      the slalom max_error reached 0.0658 m with one line-loss event per run. Progress
      fell on the oval (0.205 to 0.193) and the slalom (0.098 to 0.100, roughly flat).
      The forward row therefore added tracking error rather than removing it, so the
      lead hypothesis is rejected for this controller. The Integrator''s rule for
      the case where line losses return is to widen the span to about ±0.08 m. Line
      losses returned on the slalom (1.0 per run mean) and s-bend (0.2), so I follow
      that rule. I revert the row to y = 0.03 m, the position where max_error was
      lowest (0.0613 m). I keep the 16 mm footprint, which still covers the tape at
      this spacing (about 10.7 mm gaps against a 25 mm tape), and mass 0.6 kg, wheel_track
      and body unchanged. The body width cannot relax the 0.06 m off-track limit,
      so geometry cannot fix the off-track end by itself. The expected result is zero
      or near-zero line losses on the slalom and s-bend, and max_error around 0.061
      m on the oval, which points to controller bias as the remaining limit. If line
      losses persist at ±0.08 m, the next lever is the 12 mm footprint or moving the
      row further back, not a further span increase.


      - [Open this output](iteration-3/entity0/versions/0fe7c587e8694d3397407cf5c70125f1/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-23186a46552fb2c8/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-536b009699269f27/payload.json)'
  - id: entity1
    label: ±0.08 m span, row y=0.03
    notes: 'Reverts the forward row, which raised oval max_error in iteration 2, and
      widens to ±0.08 m to test slalom line losses. Weights are rescaled to 25 per
      metre and kp raised to 8.0 to keep the effective gain from iteration 1.


      ### Rationale


      Iteration 2 (row moved to y=0.05 m, ki 0.05 to 0.3) made the oval max_error
      worse (0.0613 to 0.0637 m) and brought back slalom line losses (1.0 per run).
      Iteration 1 (y=0.03 m, ±0.06 m span) had zero line losses and the lowest max_error
      (0.0610 to 0.0613 m). I therefore revert the row to y=0.03 m and follow the
      Builder''s span test: ±0.08 m, seven sensors at 0.0267 m spacing, 16 mm footprints
      (about 10.7 mm gaps against a 25 mm tape, so a sensor always covers tape inside
      the span). Mass 0.6 kg, wheel_track 0.12 m, wheel_radius 0.03 m and body unchanged
      so the span change is isolated. Controller: widening the span to ±0.08 m means
      the weights, scaled to 25 per metre, are now -2 to 2 across x=±0.08 m. Iteration
      1 used 33.3 per metre with kp 6.0, an effective gain of about 200. To keep that
      same effective gain, kp becomes 8.0 (8 × 25 = 200). ki returns to 0.05 because
      the iteration 2 bias test raised max_error and the integral change is not supported
      by evidence. kd stays at 0.3 and base_speed at 1.8, with last_direction line-loss
      recovery kept. Expected result: line_loss_events near zero on the slalom and
      s-bend, and max_error near 0.061 m on the oval (this is an expectation, not
      a measured result).


      - [Open this output](iteration-3/entity1/versions/ebd3d2181db7450f9446c57217a3fcd5/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/0fe7c587e8694d3397407cf5c70125f1/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-536b009699269f27/payload.json)'
  - id: entityR1
    label: Span ±0.08, row back
    notes: 'Feedback asks the Builder to return the row to y=0.03 m and widen to ±0.08
      m, based on iteration 1''s lowest max_error and iteration 2''s worse oval result.
      It gives conditional next steps (footprint 0.012 m, row back to y=0.01 m, mass
      0.5 kg) for each race outcome.


      ### Feedback


      Written before this candidate races. Iteration 1 (±0.06 m span, y=0.03 m, 16
      mm footprints) gave zero line losses but max_error of 0.0610 to 0.0613 m on
      all tracks, the lowest error seen. Iteration 2 (same geometry, row moved to
      y=0.05 m, ki 0.3) raised oval max_error to 0.0637 m and gave one slalom line
      loss per run, so the forward row is rejected as the lever. Iteration 0 (±0.04
      m span, 12 mm footprints) lost the tape near 0.05 m. I am passing your span
      test to the Integrator''s controller: the row returns to y=0.03 m and the span
      widens to ±0.08 m. What I had to change in the controller: weights are rescaled
      to 25 per metre (the weights are the same numbers as before), and kp is raised
      to 8.0 to keep the effective gain. The bias remains unexplained. Next race guidance:
      if line_loss_events stays at zero on the slalom and s-bend and max_error is
      near 0.061 m on the oval, the remaining limit is controller bias, so keep the
      geometry fixed. If line losses persist at ±0.08 m, change the footprint to 0.012
      m or move the row back, not forward. If steering_oscillation rises above about
      0.2 with the wider span, reduce mass to 0.5 kg.


      ### Requested changes


      - If line_loss_events is still 1 or more on the slalom or s-bend at sensor span
      ±0.08 m, reduce sensor_size from 0.016 to 0.012 m with the same seven positions,
      because the iteration 0 12 mm footprints gave a clean graded signal and the
      16 mm footprint has been the only geometry change since then.

      - If line losses are zero but max_error stays above 0.06 m on the oval, keep
      the geometry fixed and move the row back to y = 0.01 m (not forward), since
      the forward row in iteration 2 raised max_error from 0.0613 to 0.0637 m.

      - If steering_oscillation rises above about 0.2 with the ±0.08 m span, reduce
      mass from 0.6 to 0.5 kg to cut yaw inertia, keeping the sensor geometry fixed.


      - [Open this output](iteration-3/entityR1/versions/ebd3d2181db7450f9446c57217a3fcd5/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/0fe7c587e8694d3397407cf5c70125f1/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-536b009699269f27/payload.json)'
