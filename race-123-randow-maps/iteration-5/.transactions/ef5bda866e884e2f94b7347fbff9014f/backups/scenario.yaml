  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Row back to y=0.01 m
    notes: 'Keeps the ±0.08 m, 12 mm seven-sensor layout and moves the row back from
      y=0.03 to y=0.01 m, as the Integrator''s rule requires after the s-bend still
      lost the line at 12 mm (iteration 4, score 53.5). The evidence is that forward
      moves raised max_error in iteration 2 and footprint changes alone did not clear
      the s-bend loss.


      ### Rationale


      Iteration 4 (12 mm footprints, seven sensors at ±0.08 m, y=0.03 m, 0.6 kg) scored
      53.54, up from 50.65 at 16 mm, but the s-bend still lost the line once per run
      (line_loss_events 1.0, max_error 0.0645 m). Two other facts matter. The oval
      max_error rose to 0.0629 m from 0.0608 m at 16 mm, though oval progress improved
      to 0.2125. Steering_oscillation stayed at 0.168 on the oval, well under the
      0.2 threshold, so mass does not need to change. Iteration 2 showed that moving
      the row forward raised max_error, so forward is ruled out. Iteration 0 lost
      the line at a narrower span, and iteration 3 cleared the oval and slalom at
      ±0.08 m. The footprint change alone did not remove the s-bend loss, so the next
      lever is row position. The Integrator''s feedback sets the rule for this case:
      if the s-bend still loses the line at 12 mm, move the row back to y=0.01 m with
      the same seven x positions, not forward and not wider. I follow that rule. I
      keep the span at ±0.08 m (seven sensors, spacing 0.0267 m, which leaves about
      14.7 mm gaps, still smaller than the 25 mm tape), keep 12 mm footprints because
      they gave the higher total score, and keep mass 0.6 kg, wheel geometry and body
      unchanged. This isolates one change: row position. I expect the s-bend line
      loss to fall to zero, because the sensors then sit closer to the axle and react
      more directly to lateral offset at the bend. I also expect oval max_error to
      stay near 0.061 m. If line losses persist at y=0.01 m, the remaining limit is
      probably controller bias rather than geometry.


      - [Open this output](iteration-5/entity0/versions/ac24b66b6c204db79cfe83afda1bff52/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-a0630e091802fc92/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-84d4a1f9bd4cbd06/payload.json)'
  - id: entity1
    label: Row back to y=0.01 m
    notes: 'Keeps the 12 mm, ±0.08 m geometry and moves the sensor row from y=0.03
      to y=0.01 m to target the s-bend line loss left in iteration 4 (1.0 per run).
      Controller held unchanged to isolate position.


      ### Rationale


      Iteration 4 (12 mm footprints, seven sensors at ±0.08 m, y=0.03 m, 0.6 kg, kp
      8.0) scored 53.53. The oval max_error was 0.0629 m with zero line losses, but
      the s-bend still lost the line once per run (line_loss_events 1.0, max_error
      0.0645 m). Footprint size alone did not clear the s-bend loss. Iteration 2 showed
      that moving the row forward raised max_error (oval 0.0613 to 0.0637 m) and brought
      back slalom line losses, so forward is ruled out. The Builder''s feedback rule
      for this case is to move the row back to y=0.01 m with the same seven x positions.
      I follow that rule. The geometry changes only in row y, from 0.03 to 0.01 m.
      Span stays at ±0.08 m, footprint stays at 12 mm (the higher-scoring footprint),
      and mass, wheel and body values are unchanged. The controller is held at iteration
      4 values (kp 8.0, ki 0.05, kd 0.3, base_speed 1.8, last_direction, weights scaled
      to ±2), so the race isolates row position. Expected result: line_loss_events
      falls to zero on the s-bend, with oval max_error near 0.061 m. This is an expectation,
      not a measured result. If the s-bend still loses the line at y=0.01 m, the remaining
      limit is probably controller bias, and geometry should be held.


      - [Open this output](iteration-5/entity1/versions/e9ae2cfb49b743c48aed85d035a78ffe/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/ac24b66b6c204db79cfe83afda1bff52/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-84d4a1f9bd4cbd06/payload.json)'
  - id: entityR1
    label: Row-back feedback
    notes: 'Feedback written before the race: the forward row was rejected by iteration
      2, and the s-bend loss persists at 12 mm. Gives next-race branches for holding
      geometry, midpoint row, or reduced mass.


      ### Feedback


      Written before this candidate has raced. Iteration 4 (12 mm footprints, ±0.08
      m span, y=0.03 m) gave zero oval and slalom line losses, but the s-bend still
      lost the line once per run (max_error 0.0645 m), and the score was 53.53. Iteration
      2 showed that moving the row forward to y=0.05 m raised oval max_error from
      0.0613 to 0.0637 m and brought back slalom line losses, so forward is rejected.
      Iteration 3 (16 mm, same span and row) also lost the s-bend line once, so the
      footprint is not the s-bend lever on its own. In the controller I hold kp 8.0,
      ki 0.05, kd 0.3 and the weights fixed, because nothing in the evidence yet isolates
      a controller change. Decide the next step from the race: if line_loss_events
      falls to zero on the s-bend and oval max_error stays near 0.061 m, hold the
      geometry and the controller. If the s-bend still loses the line at y=0.01 m,
      the row position is not the limit, so hold the geometry and treat controller
      bias as the remaining cause. If steering_oscillation rises above about 0.2,
      reduce mass to 0.5 kg.


      ### Requested changes


      - If the s-bend still shows line_loss_events of 1 or more at y=0.01 m, hold
      sensor positions, sensor_size 0.012 and mass 0.6 kg, because the row has then
      been tested at both 0.03 and 0.01 m with the loss still present; the limit is
      controller bias, not geometry.

      - If line losses are zero but oval max_error rises above 0.0629 m at y=0.01
      m, return the row to y=0.02 m as a midpoint, since y=0.03 m gave 0.0629 m and
      y=0.05 m gave 0.0637 m.

      - If steering_oscillation rises above about 0.2 with the rearward row, reduce
      mass from 0.6 to 0.5 kg with sensor positions unchanged, since iteration 4 showed
      0.168 on the oval and 0.158 on the s-bend.


      - [Open this output](iteration-5/entityR1/versions/e9ae2cfb49b743c48aed85d035a78ffe/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/ac24b66b6c204db79cfe83afda1bff52/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-84d4a1f9bd4cbd06/payload.json)'
