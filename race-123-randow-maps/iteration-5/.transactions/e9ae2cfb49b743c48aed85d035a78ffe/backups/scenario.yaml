map:
  id: race-123-randow-maps
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Row back to y=0.01 m
    notes: 'Keeps the ±0.08 m, 12 mm seven-sensor layout and moves the row back from
      y=0.03 to y=0.01 m, as the Integrator''s rule requires after the s-bend still
      lost the line at 12 mm (iteration 4, score 53.5). The evidence is that forward
      moves raised max_error in iteration 2 and footprint changes alone did not clear
      the s-bend loss.


      ### Rationale


      Iteration 4 (12 mm footprints, seven sensors at ±0.08 m, y=0.03 m, 0.6 kg) scored
      53.54, up from 50.65 at 16 mm, but the s-bend still lost the line once per run
      (line_loss_events 1.0, max_error 0.0645 m). Two other facts matter. The oval
      max_error rose to 0.0629 m from 0.0608 m at 16 mm, though oval progress improved
      to 0.2125. Steering_oscillation stayed at 0.168 on the oval, well under the
      0.2 threshold, so mass does not need to change. Iteration 2 showed that moving
      the row forward raised max_error, so forward is ruled out. Iteration 0 lost
      the line at a narrower span, and iteration 3 cleared the oval and slalom at
      ±0.08 m. The footprint change alone did not remove the s-bend loss, so the next
      lever is row position. The Integrator''s feedback sets the rule for this case:
      if the s-bend still loses the line at 12 mm, move the row back to y=0.01 m with
      the same seven x positions, not forward and not wider. I follow that rule. I
      keep the span at ±0.08 m (seven sensors, spacing 0.0267 m, which leaves about
      14.7 mm gaps, still smaller than the 25 mm tape), keep 12 mm footprints because
      they gave the higher total score, and keep mass 0.6 kg, wheel geometry and body
      unchanged. This isolates one change: row position. I expect the s-bend line
      loss to fall to zero, because the sensors then sit closer to the axle and react
      more directly to lateral offset at the bend. I also expect oval max_error to
      stay near 0.061 m. If line losses persist at y=0.01 m, the remaining limit is
      probably controller bias rather than geometry.


      - [Open this output](iteration-5/entity0/versions/ac24b66b6c204db79cfe83afda1bff52/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-a0630e091802fc92/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-84d4a1f9bd4cbd06/payload.json)'
  - id: entity1
    label: 12 mm footprint, ±0.08 m
    notes: 'Switches the ±0.08 m seven-sensor row at y=0.03 m from 16 mm to 12 mm
      footprints, with the controller held at iteration 3 values to isolate the footprint
      change. Iteration 3 showed the s-bend still lost the line once per run at 16
      mm.


      ### Rationale


      Iteration 3 (±0.08 m span, 16 mm footprints, y=0.03 m, 0.6 kg, kp 8.0) kept
      oval max_error at 0.0608 m with zero line losses, and the slalom had zero line
      losses. The s-bend still lost the line once per run (max_error 0.0656 m), and
      the score fell from 65.32 to 50.65. Iteration 2 showed that moving the row forward
      (y=0.05 m) raised oval max_error to 0.0637 m and brought back slalom line losses,
      so the row stays at y=0.03 m. The Builder''s proposal changes only sensor_size
      from 0.016 to 0.012 m, keeping the ±0.08 m span and the mass at 0.6 kg. I keep
      the controller identical to iteration 3 (kp 8.0, ki 0.05, kd 0.3, base_speed
      1.8, weights ±2 at 25 per metre, last_direction) so that the footprint is the
      only change the race can attribute. The Builder''s requested sum-of-readings
      and loss-step measurements are not in the allowed observation set, so I request
      the closest allowed measurements (line_loss_events, max_error, steering_oscillation).
      Expected result: line_loss_events falls to zero on the s-bend and slalom, and
      max_error returns near 0.061 m on the oval. This is an expectation, not a measured
      result. Iteration 0 used 12 mm footprints with a narrower span, so the footprint''s
      effect at ±0.08 m is not yet tested.


      - [Open this output](iteration-4/entity1/versions/25085f02ad7d473692bd9b6c16a0b491/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/64148c034faa4c3dbe4b5b8ce5e0ac78/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-a933aacd5010b07a/payload.json)'
  - id: entityR1
    label: Footprint then row back
    notes: 'Feedback tells the Builder to keep the 12 mm footprint and, if the s-bend
      still loses the line, move the row back to y=0.01 m rather than forward, citing
      iterations 2 and 3. Next steps depend on the next race''s line-loss and oscillation
      results.


      ### Feedback


      Written before this candidate races. Iteration 3 (±0.08 m span, 16 mm, y=0.03
      m) cleared the oval and slalom line losses (zero on both) with oval max_error
      at 0.0608 m, but the s-bend still lost the line once per run (max_error 0.0656
      m) and the score fell to 50.65. Iteration 2 showed that moving the row forward
      to y=0.05 m raised oval max_error to 0.0637 m and gave slalom line losses, so
      forward is rejected. Iteration 0 used 12 mm footprints and gave a graded signal
      with a narrower span, but it also lost the line once per run, so the footprint
      alone is not proven. In the controller I kept kp 8.0 and ki 0.05, so the footprint
      is the only change this race tests. The next race decides the next step: if
      the s-bend line loss goes to zero with 12 mm and max_error is near 0.061 m on
      the oval, keep the geometry fixed and treat controller bias as the remaining
      limit. If the s-bend still loses the line at 12 mm, move the row back to y=0.01
      m rather than forward or wider. If steering_oscillation rises above about 0.2,
      reduce mass.


      ### Requested changes


      - Keep sensor_size at 0.012 m with the ±0.08 m span and y=0.03 m, because the
      s-bend line loss in iteration 3 is the only failure left and the footprint is
      the lever. If line_loss_events is still 1 or more on the s-bend, move the row
      to y=0.01 m with the same seven x positions, not forward, since iteration 2
      showed forward raised max_error from 0.0613 to 0.0637 m.

      - If line losses are zero but max_error stays above 0.06 m on the oval, keep
      the geometry fixed, because iteration 1 and 3 both sat at about 0.061 m regardless
      of span. The remaining limit is then controller bias, which the Integrator will
      address in the controller.

      - If steering_oscillation rises above about 0.2 with the ±0.08 m span (iteration
      3 showed 0.158 on the oval), reduce mass from 0.6 to 0.5 kg to cut yaw inertia,
      keeping sensor positions fixed.


      - [Open this output](iteration-4/entityR1/versions/25085f02ad7d473692bd9b6c16a0b491/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/64148c034faa4c3dbe4b5b8ce5e0ac78/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-a933aacd5010b07a/payload.json)'
