map:
  id: race-207-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: Best-tested design, kept
    notes: 'Keeps iteration 8''s geometry and controller (kd 2.5, base 1.2), the best
      raced design at 395.3. Later kd 3.2 and base 1.4 tests gave identical metrics,
      so no change is supported by the evidence, and the final unseen-track race argues
      against untested changes.


      ### Rationale


      Evidence: iteration 8 (kd 2.5, base_speed 1.2, kp 3.5, ki 0, 12 mm sensors at
      y=0.04 with x in ±0.04) is the best design tested, at 395.3. Its oval finishes
      20 of 20 trials at mean time 1.87 s. Its s-bend (progress 0.395) and slalom
      (progress 0.178) still end off track with about one line-loss event per run.
      Iteration 9 (kd 3.2) and iteration 10 (kd 3.2, base_speed 1.4) returned metrics
      identical to iteration 8 on every track, so kd beyond 2.5 and the base_speed
      change show no measurable effect at this operating point. The kd trend (0.8
      to 1.2 gives 57, 1.8 gives 340, 2.5 gives 395) has saturated. Earlier geometry
      changes (sensor span, sensor size, forward position, track and mass) all failed
      to move the s-bend beyond about 0.15 progress when damping was low, and they
      have not been tested with high damping. This is the final iteration and the
      final race runs on unseen tracks. The evidence does not support an untested
      change, and a change that breaks the oval finish would cost more than a speculative
      gain on the s-bend or slalom would add. I therefore deliver the best-tested
      design, iteration 8''s geometry and controller, unchanged. Expected result:
      oval completion around 1.87 s, with the s-bend and slalom ending off track as
      before. Expected score is about 395 on the development tracks. Unseen-track
      performance is uncertain.


      - [Open this output](iteration-11/entity0/versions/c6115e19f04d4ffb9a3d4547eb96c2a1/payload.json)

      - Based on: [entityR2A](iteration-11/entityR2A/versions/carried-3c221873a6bc0493/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Flags that the ''kd saturated'' conclusion may rest on identical results
      from iterations 9 and 10, where base_speed should have changed the output, so
      it may reflect unapplied parameters. Also notes that the unchanged design completes
      only the oval and that its expected-value case is unquantified. Based on the
      iteration 8 to 10 race data.


      - [Open this output](iteration-11/entityC1/versions/1071dbb516d448c097a17175bb1779c4/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/c6115e19f04d4ffb9a3d4547eb96c2a1/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-3c221873a6bc0493/payload.json)'
  - id: entity1
    label: Raced design restored
    notes: 'Reverts the draft to the design actually raced for the 395.3 score: sensors
      at y=0.06 and kd 1.1, not the untested kd 2.5 and y=0.04 in the draft. The kd
      3.2 and base_speed 1.4 tests were never applied in iterations 9 and 10, so they
      are not evidence of saturation.


      ### Rationale


      Round-1 critique checked against the outcome table, which lists the design actually
      raced in each iteration. Three points change my draft.


      1. The draft''s geometry is not the raced geometry. Every raced iteration (0
      to 10) has sensors at y = 0.06, and iteration 8, the 395.3 result, is recorded
      at y = 0.06. My draft said y = 0.04. Iteration 8''s controller is also recorded
      as kd 1.1, not kd 2.5. The ''kd 2.5'' value in the draft and its rationale does
      not match any raced result.


      2. Iterations 9 and 10 did not test kd 3.2 or base_speed 1.4. Their outcome-table
      entries show kd 1.1 and base_speed 1.5, the same as iteration 8. So the ''saturation''
      argument rests on parameters that were never applied. It is not evidence that
      kd or base_speed are exhausted. The critique''s point 2 is correct.


      3. The kd trend in the raced data is 0.4 gives 57, 0.8 gives 340, 1.1 gives
      395. kd 1.1 is the best value that has actually been raced.


      Decision: I accept the critique''s core finding and revise the draft to the
      raced design. I return the geometry (sensors at y = 0.06) and controller (kd
      1.1, base_speed 1.5, kp 3.5, ki 0.05, last_direction line loss) that produced
      the 395.3 score. I considered testing kd between 1.8 and 2.5, as the critique
      suggests, but this is the final iteration, the race is on unseen tracks, and
      no run is left to check a new value before it races. Changing an untested value
      risks the oval finish, which is the only track that scores the 500-point completion
      term. I keep the observation request unchanged.


      Expected result: oval completion at about 1.87 s (about 950 per run), with s-bend
      (progress about 0.40) and slalom (progress about 0.18) ending off track. Expected
      score about 395 on the development tracks. Unseen-track performance is uncertain,
      and the design is not expected to complete tracks sharper than the oval.


      - [Open this output](iteration-11/entity1/versions/5de84a1fd3fb4de3b591750968025935/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/c6115e19f04d4ffb9a3d4547eb96c2a1/payload.json),
      [entityC1](iteration-11/entityC1/versions/1071dbb516d448c097a17175bb1779c4/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-3c221873a6bc0493/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Critiques the reverted kd 1.1 design and its rationale against the raced
      table. Main points: the design wins only on the oval (20/20 finishes), two of
      three dev tracks end off track, the kd sweep has only two informative points
      above 0.4, and the rationale does not weigh unseen-track risk or line-loss events.


      - [Open this output](iteration-11/entityC2/versions/a8dc35d33f5d4b9b857bab54c5aa7546/payload.json)

      - Based on: [entity1](iteration-11/entity1/versions/5de84a1fd3fb4de3b591750968025935/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-3c221873a6bc0493/payload.json)'
  - id: entity2
    label: 'Final: raced 395 design'
    notes: 'Returns the exact geometry and controller (sensors at y = 0.06, kd 1.1,
      base_speed 1.5) that scored 395.35 in raced iterations 8 to 10. The critique''s
      untested kd 1.8 to 2.5 suggestion was rejected because no run remains to verify
      it before the unseen-track race.


      ### Rationale


      Evidence: the raced design with sensors at y = 0.06, kd 1.1, kp 3.5, ki 0.05,
      base_speed 1.5 and last_direction line loss scored 395.35 (iterations 8, 9 and
      10 are the same design). On the oval it finished 20 of 20 runs, mean 949.7 and
      mean time 1.869 s. On s-bend and slalom it left the track in every run, at progress
      0.395 and 0.178. The kd sweep at fixed kp and base_speed rose from 0.4 (no finishes,
      about 57) to 0.8 (14 of 20 oval finishes, 340) to 1.1 (20 of 20, 395), so 1.1
      is the best value actually raced.


      Decision: I accept the critique''s central point that the draft was not the
      raced design, and I return the exact raced geometry and controller. I reject
      the critique''s suggestion to test kd between 1.8 and 2.5. That value has never
      been run, and this is the last iteration, so no run remains to check it before
      the unseen-track race. An untested kd could lose the oval finish, which is the
      only source of the 500-point completion term. The trade-off is that a sharper
      unseen track may fail as s-bend and slalom did, but the raced evidence is the
      only basis I can defend.


      I keep the observation request unchanged so the final race is measured on the
      same metrics as the development runs.


      Expected result: about 950 per run on an oval-like track, and about 395 averaged
      over the three development tracks. Unseen-track performance is uncertain and
      is not expected to exceed the oval''s curvature tolerance.


      - [Open this output](iteration-11/entity2/versions/996ee5855d6e4c1883575bc89f3d03d1/payload.json)

      - Based on: [entity1](iteration-11/entity1/versions/5de84a1fd3fb4de3b591750968025935/payload.json),
