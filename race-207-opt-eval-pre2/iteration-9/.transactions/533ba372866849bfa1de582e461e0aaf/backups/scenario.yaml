map:
  id: race-207-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: 'Draft: kd 3.2 damping'
    notes: 'Raises kd from 2.5 to 3.2 on the iteration 8 design, the best so far at
      395 with the oval finishing 20 of 20. The damping trend from kd 1.2 to 2.5 is
      positive, and oval oscillation fell at kd 2.5, so the next step tests whether
      more damping lifts s-bend and slalom progress.


      ### Rationale


      Evidence: iteration 8 (kd 2.5) is the best design so far at 395.3. The oval
      now finishes 20 of 20 trials (mean score 950, progress 0.998), and oval steering
      oscillation fell from 0.33 (kd 1.8) to 0.22. The kd trend is 0.8 to 1.2 gives
      57, 1.8 gives 340, and 2.5 gives 395. Gains are shrinking, but damping is still
      the lever that matters. Two problems remain. The s-bend reaches only 0.395 progress
      and the slalom only 0.178, and both end off track with about one line-loss event
      per run. The s-bend rose from 0.15 to 0.42 and then 0.395 across the kd changes,
      so it is near a plateau for this damping level. Geometry and kp/base_speed were
      not varied in the last three iterations, so the damping effect is cleanly isolated.
      Change for this draft: kd 2.5 to 3.2, one controller step only, keeping kp 3.5,
      ki 0, base_speed 1.2, line_loss ''last_direction'' and the iteration 8 geometry.
      Expected result: the oval stays at or near completion with lower oscillation,
      and s-bend and slalom progress rise modestly, giving a score of roughly 400
      to 450. The main risk is over-damping on the slalom, where the robot may react
      too slowly to direction changes. Completion on the s-bend or slalom is still
      unlikely at base_speed 1.2. If kd 3.2 helps, the next step is to raise base_speed
      toward 1.4 with the damping kept.


      - [Open this output](iteration-9/entity0/versions/ca8586f1c0af4b70a62d55407dc3a4c6/payload.json)

      - Based on: [entityR2A](iteration-9/entityR2A/versions/carried-3c221873a6bc0493/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Round-1 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-9/entityC1/versions/7d1a325d7180403da39aa58cf1e17a0f/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/ca8586f1c0af4b70a62d55407dc3a4c6/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-3c221873a6bc0493/payload.json)'
  - id: entity1
    label: Resubmit kd 1.1 baseline
    notes: 'Resubmits the best raced design (kd 1.1, score 395.3, oval 20/20) unchanged,
      rejecting the kd 2.5 draft whose baseline did not match the race record. Evidence:
      s-bend progress fell from 0.424 to 0.395 across kd 0.8 to 1.1, so further damping
      is not supported.


      ### Rationale


      Evidence. The raced design with the best score is kd 1.1 (base 1.5, kp 3.5,
      ki 0.05, sensors at y=0.06, 12 mm, last_direction). It scored 395.3, and oval
      finished 20 of 20 at steering_oscillation 0.217, down from 0.328 at kd 0.8.
      The authorized entity0 record (kd 2.5, base 1.2, y=0.04) does not match the
      race that scored 395.3, and the outcome table and iteration-8 scoreboard both
      place that score on the kd 1.1 design. I therefore build from the outcome-table
      design, not the draft.


      What I kept, changed and rejected, following the round-1 critique:

      (1) Accepted: the kd 2.5 draft is rejected. Its stated baseline did not match
      the raced design, and the critique''s points on noise cost and the shrinking
      gains are valid. The s-bend fell from 0.424 (kd 0.8) to 0.395 (kd 1.1), so the
      damping peak for s-bend may lie near 0.8 to 1.1, and a larger kd is not supported.

      (2) Accepted: base_speed 1.2 is rejected. At 1.5 the oval finishes 70 to 100
      percent of trials, and the 500-point completion term is within reach. Lowering
      speed would give up that term.

      (3) Accepted: I make no change in this revision. The critique found no measured
      fault in the kd 1.1 design that a single step would fix, and each change now
      risks the oval finish that drives the score.

      (4) Partly accepted: slalom is flat near 0.18 across kd 0.8 to 1.8, so no damping
      step is expected to move it. I state this openly rather than predicting a slalom
      gain.


      Expected result: the same score as the raced kd 1.1 design (about 395), with
      oval finish rate at or above 0.7. If the next race is run as a paired comparison
      with the same seeds, any gain can be read per seed.


      Decision rule for the next revision: if the oval finish rate falls below 0.6
      or steering_oscillation exceeds 0.40, revert to kd 0.8. Otherwise, test kd 1.4
      alone only if oscillation stays flat and progress rises on at least two tracks.


      - [Open this output](iteration-9/entity1/versions/891b94d57c114ae1ace75bd91aea4101/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/ca8586f1c0af4b70a62d55407dc3a4c6/payload.json),
      [entityC1](iteration-9/entityC1/versions/7d1a325d7180403da39aa58cf1e17a0f/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-3c221873a6bc0493/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'The revised design is the raced kd 1.1 design unchanged, so re-racing
      it gives little new information. The score is dominated by the oval, and the
      critique notes the s-bend progress fell at kd 1.1, with slalom flat. Evidence:
      outcome table and per-track means from iterations 7 and 8.


      - [Open this output](iteration-9/entityC2/versions/b78d768ffdbb4d66ab3c1a15c915bee3/payload.json)

      - Based on: [entity1](iteration-9/entity1/versions/891b94d57c114ae1ace75bd91aea4101/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-3c221873a6bc0493/payload.json)'
  - id: entity2
    label: kd 1.1 single-factor step
    notes: 'Keeps the raced iteration 7 design and changes only kd, from 0.8 to 1.1,
      a 37 percent step. Revert rules are now per track against the iteration 7 oscillation
      values (oval 0.328, s-bend 0.231, slalom 0.207) because the critique showed
      the old absolute thresholds conflicted with those baselines.


      ### Rationale


      Evidence. The raced baseline is iteration 7 (score 340.50): base_speed 1.5,
      kp 3.5, ki 0.05, kd 0.8, 12 mm sensors at y=0.06 (x = +/-0.04, +/-0.02, 0),
      last_direction. Oval finished 14 of 20 (finish rate 0.70, progress 0.973). S-bend
      progress was 0.424 and slalom progress 0.181, both ending off track. Iteration
      6 to 7 was a clean single-factor step in kd (0.4 to 0.8), and it produced the
      largest gain in the record.


      What I kept, changed and rejected after the round-2 critique:

      (1) Kept kd 1.1, the 37 percent step from the raced kd 0.8, with every other
      value equal to iteration 7. The critique is right that kd response is nonlinear
      and that 1.1 is an extrapolation. I keep the step because it is the smallest
      change that can show whether the damping peak lies above 0.8. A larger step
      (1.4 or more) would confound the result if the peak is near 0.8.

      (2) Accepted that the oscillation expectation was too vague. The per-track baselines
      at kd 0.8 are oval 0.328, s-bend 0.231 and slalom 0.207. The revert rule is
      now relative to each track''s own value, not to the absolute 0.40 figure. Revert
      kd to 0.8 if steering_oscillation rises more than 25 percent on any track (oval
      above about 0.41, s-bend above about 0.29, slalom above about 0.26), or if oval
      finish falls below 0.6.

      (3) Accepted that the slalom claim was inaccurate. Slalom was flat at 0.105
      from iterations 0 to 6 and moved only at kd 0.8 (to 0.181). kd is therefore
      the first lever to move slalom, and I now expect kd 1.1 to matter on slalom
      as well as the s-bend. I do not predict a specific slalom value.

      (4) Accepted that the decision rules were not complete. The keep rule now requires
      both conditions: oval finish at least 0.6 and at least one of s-bend or slalom
      progress rising above its iteration 7 value (0.424 or 0.181). If oval finish
      is between 0.6 and 0.7, the result is judged on the combined per-track evidence,
      since 20 trials give a standard error of about 0.10 on the finish rate.

      (5) Partly accepted the seed-noise point. Oval finish is decided on 20 trials,
      so changes under about 0.1 in finish rate are not separable from noise. Progress
      on the s-bend and slalom is judged in pairs of seeds, because the disturbance
      is fixed per seed and track.

      (6) Rejected base_speed 1.2. Completion (500 points) is within reach at 1.5
      because oval finishes 70 percent of trials, so lowering speed would give up
      the largest term for an unsupported speed effect.

      (7) Stated openly: this change does not address the start or first bend, which
      the earlier data point to as the early-failure location. A kd gain would not
      show that the robot can finish every track.


      Expected result: oval finish rate holds at or above 0.7, s-bend progress rises
      above 0.424, slalom progress rises above 0.181, and steering_oscillation stays
      within the relative limits above. A three-track mean change under about 5 points
      should be treated as noise.


      Decision rules for the next revision: (a) keep kd 1.1 if oval finish is at least
      0.6 and at least one of s-bend or slalom progress rises, with oscillation within
      limits. (b) Revert to kd 0.8 if oval finish falls below 0.6 or oscillation exceeds
      its per-track limit. (c) If progress rises on all three tracks with oscillation
      flat, test kd 1.4 alone. (d) If progress is unchanged on all tracks, the next
      single test is base_speed alone (1.5 to 1.7).


      - [Open this output](iteration-8/entity2/versions/851cd4d521d641a7bfa4c17ec9c85d6a/payload.json)

      - Based on: [entity1](iteration-8/entity1/versions/1f6b83a5bf0e4d3d9bfdb6bd8f28ef78/payload.json),
