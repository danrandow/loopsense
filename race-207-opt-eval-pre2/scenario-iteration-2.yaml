map:
  id: race-207-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Larger sensors, kp 4.5
    notes: 'Draft keeps the best-scoring iteration 0 geometry, enlarges sensor footprints
      to 16 mm to reduce line loss, and raises kp to 4.5 with kd 1.0 and base_speed
      1.5. Based on 120 development trials, all off-track with progress 0.10 to 0.15
      and about one line loss per run.


      ### Rationale


      Evidence: 0 of 120 development trials finished across iterations 0 and 1. Every
      run went off track at progress 0.10 to 0.15, and max_error reached about 0.06
      m, which is the off-track limit (max(0.06, 0.0125 + body_width/4) is 0.06 m
      for any allowed body width). Score is therefore driven almost entirely by how
      far the robot gets before it leaves the tape. Iteration 0 (score 53.0) beat
      iteration 1 (score 50.6). Iteration 1 changed several things at once (wider
      and forward sensors, kp 4.5, kd 1.0, base_speed 1.3, narrower track and lower
      mass), so I cannot attribute its loss to any one change. The s-bend progress
      was identical (0.1475) in both iterations, which suggests a fixed failure point,
      probably an early sharp bend or the start. Line loss happened about once per
      run, so the robot loses the tape at that point and does not recover. Changes
      from iteration 0: (1) sensor_size raised from 0.012 to 0.016 m, so each sensor
      covers more of the 25 mm tape and keeps a reading through the bend, which should
      reduce line-loss events. (2) Sensors kept at the iteration 0 geometry (x = +/-0.04,
      +/-0.02, 0; y = 0.04), so the comparison with iteration 0 stays clean. (3) kp
      raised from 3.0 to 4.5 for a stronger correction on drift, with kd raised from
      0.5 to 1.0 to damp it. (4) ki lowered to 0.02 to avoid windup on bends. (5)
      base_speed lowered from 1.6 to 1.5, a small cut to give the controller more
      time at bends while staying near the speed needed for a 3 s finish. Geometry
      and drivetrain otherwise match iteration 0. Expected result: progress somewhat
      above 0.15 and fewer line-loss events, so a score modestly above 53. Completion
      is still unlikely, because the robot is not yet tracking well enough to cover
      the full course.


      - [Open this output](iteration-2/entity0/versions/70dc69ab4de54dc9ba78a342ba082aa8/payload.json)

      - Based on: [entityR2A](iteration-2/entityR2A/versions/carried-63917e07de5d6273/payload.json)'
