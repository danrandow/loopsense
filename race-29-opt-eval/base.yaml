map:
  id: race-29-opt-eval
  schema: v0.2
  title: Robot Race 29 — Optimizer Evaluator
  scenario: Moving Parts
  is_moo: true
  notes: 'The optimizer–evaluator entrant: complete candidates cycle through critique
    and approval before one unchanged build races and produces addressed evidence.'
  dimension_axes:
  - time_horizon
  - iteration
actors:
- id: actor0
  label: Robot Optimizer
  notes: Produces complete candidates and revises them from evaluation and race evidence.
- id: actor1
  label: Evaluator
  notes: Critiques the current candidate every time it runs and decides when a candidate
    is good enough to race.
- id: actor2
  label: Race Simulator
  notes: Deterministic software actor that races and records evidence.
actions:
- id: action0
  label: Optimize Robot
  actor: actor0
  notes: 'Produces or revises a complete geometry-controller candidate.


    ## Common to every agent

    Your team builds a line-following robot, and the race simulator scores it. Your
    goal is to maximise the team''s score. The score is shared: the team only does
    well if every member does their own job fully and well. The score that counts
    is measured once, after the last iteration, on an unseen track of a different
    shape from the development track, so favour designs that generalise over designs
    tuned to the development track. After each iteration you receive the full telemetry
    of the development races of the design built in the previous iteration. Use it
    to diagnose what went wrong and improve the design.


    Winning the race is your job. Everything you can do is a lever toward it: what
    you design, critique, request or approve. Choose between your levers by what each
    is likely to do to the team''s score, not by what looks most thorough. Decide
    from the evidence you have (telemetry, if any, and your teammate''s work), your
    remaining budget (runs, tokens and iterations; see remaining_budget and iteration_plan)
    and how far through the race you are. Having no evidence yet is not a reason to
    wait: a race result is the main way the team learns, and an iteration that produces
    no scored race teaches nothing. A measurement beats an opinion, including your
    own predictions.


    Work from the evidence. Diagnose from what you are given, change something that
    addresses what you found, and say why, what result you expect, and which measurements
    would confirm or refute it. Do not resubmit unchanged work unless the evidence
    shows it is working, and say so. Feedback outputs exist so your teammate can do
    better next time: make them specific and evidence-based, cite numbers from the
    telemetry or from your teammate''s work, and name the exact fields and values
    you want tried; never generic advice. Where an output has a rationale field, write
    it first and think it through there.


    ## This team: Robot Optimizer and Evaluator

    Candidates are complete robots (geometry and controller). The Optimizer proposes
    and the Evaluator reviews. A candidate races only when the Evaluator approves
    it, and the approved build races unchanged. An iteration that ends with no approved
    build is not scored. Each review and each revision uses one of the iteration''s
    limited action runs, and the race itself needs one.


    ## Your role: Robot Optimizer

    Deliver one complete, improved line-following robot candidate (geometry and controller)
    every iteration. Read the Evaluator Feedback (the Evaluator inspects your candidate
    and knows its weaknesses) and the Optimizer Race Data (telemetry from the last
    race). Work out what is going wrong and change the values that address it. In
    your rationale say what you changed, why, and what result you expect. Include
    your hypotheses and the measurements you want to see next.'
  measures:
  - id: input_tokens
    name: Model input tokens
    unit: tokens
  - id: output_tokens
    name: Model output tokens
    unit: tokens
  - id: repair_calls
    name: Format repair calls
    unit: calls
    better: lower
  - id: invalid_artifacts
    name: Invalid model artifacts
    unit: artifacts
    better: lower
- id: action1
  label: Evaluate and Gate
  actor: actor1
  notes: 'Returns specific critique every time it runs and decides when to pass the
    recorded candidate, unchanged, to the race.


    ## Common to every agent

    Your team builds a line-following robot, and the race simulator scores it. Your
    goal is to maximise the team''s score. The score is shared: the team only does
    well if every member does their own job fully and well. The score that counts
    is measured once, after the last iteration, on an unseen track of a different
    shape from the development track, so favour designs that generalise over designs
    tuned to the development track. After each iteration you receive the full telemetry
    of the development races of the design built in the previous iteration. Use it
    to diagnose what went wrong and improve the design.


    Winning the race is your job. Everything you can do is a lever toward it: what
    you design, critique, request or approve. Choose between your levers by what each
    is likely to do to the team''s score, not by what looks most thorough. Decide
    from the evidence you have (telemetry, if any, and your teammate''s work), your
    remaining budget (runs, tokens and iterations; see remaining_budget and iteration_plan)
    and how far through the race you are. Having no evidence yet is not a reason to
    wait: a race result is the main way the team learns, and an iteration that produces
    no scored race teaches nothing. A measurement beats an opinion, including your
    own predictions.


    Work from the evidence. Diagnose from what you are given, change something that
    addresses what you found, and say why, what result you expect, and which measurements
    would confirm or refute it. Do not resubmit unchanged work unless the evidence
    shows it is working, and say so. Feedback outputs exist so your teammate can do
    better next time: make them specific and evidence-based, cite numbers from the
    telemetry or from your teammate''s work, and name the exact fields and values
    you want tried; never generic advice. Where an output has a rationale field, write
    it first and think it through there.


    ## This team: Robot Optimizer and Evaluator

    Candidates are complete robots (geometry and controller). The Optimizer proposes
    and the Evaluator reviews. A candidate races only when the Evaluator approves
    it, and the approved build races unchanged. An iteration that ends with no approved
    build is not scored. Each review and each revision uses one of the iteration''s
    limited action runs, and the race itself needs one.


    ## Your role: Evaluator

    You have two levers, both in service of the team''s score.


    Evaluator Feedback, every time you run: inspect the actual Robot Candidate and
    rationale, say concretely what is weak or wrong and what evidence shows it (use
    the Evaluator Race Data, telemetry from the last race, when you have it), and
    give one to three specific requested_changes naming the fields and values you
    want tried next and why.


    Approved Robot Build, your decision: pass the identified candidate on unchanged
    and it races. Do not alter an approved candidate. If you do not approve, the Optimizer
    revises it using your feedback and you review it again. If you approve, your feedback
    is still delivered and the Optimizer reads it at the start of the next iteration.


    Choosing between them is the job. Scepticism is valuable, but critique that never
    becomes a decision costs the team the race. Weigh: what the evidence you actually
    have says; how many runs remain in this iteration (another review-and-revision
    round costs two, the race one); how many iterations remain, and whether this one
    is early exploration or late; whether this candidate is at least as good as the
    best one already raced (if none has raced, the bar is that it is valid and not
    obviously broken); how much another revision would plausibly improve it; and how
    little reading numbers can tell you compared with racing. A decent candidate that
    races gives telemetry that makes your next critique sharper. Approve the best
    candidate you have in time.'
  measures:
  - id: input_tokens
    name: Model input tokens
    unit: tokens
  - id: output_tokens
    name: Model output tokens
    unit: tokens
  - id: repair_calls
    name: Format repair calls
    unit: calls
    better: lower
  - id: invalid_artifacts
    name: Invalid model artifacts
    unit: artifacts
    better: lower
- id: action2
  label: Race and Measure
  actor: actor2
  notes: Runs development trials and produces an outcome and addressed evidence.
entities:
- id: entity0
