  entities:
  - id: entity0
    label: Wider sensors, kp 4, kd
    notes: 'Widens the sensor spread to +/-0.035 m to cut slalom line losses, raises
      kp to 4.0 for firmer bend correction, and raises kd to 0.9 to damp the overshoot.
      The evidence is iteration 1, where every run went off track at max_error about
      0.06 m and slalom averaged 2 line-loss events.


      ### Rationale


      Evidence from iteration 1 (score 206.6, up from 51.7): the robot is still leaving
      the line, not oscillating. Every run ended off_track except 2 oval finishes.
      max_error sits at about 0.059 to 0.064 m, at the 0.06 m off-track limit, while
      steering_oscillation is moderate (0.20 to 0.33) and rms_error is small (0.017
      to 0.027). Slalom averages 2.0 line-loss events, which fits the outer sensors
      at x = +/-0.03 m losing the 25 mm tape once the robot is offset by about 0.0175
      m. Body width cannot widen the off-track limit here: max(0.06, 0.0125 + 0.18/4
      = 0.0575) is still 0.06. So the fix has to come from steering authority, damping
      and sensor coverage. Changes: (1) kp 3.5 to 4.0, a firmer correction so the
      robot pulls back toward the line sooner on bends (the error reaches the limit
      before it is corrected). (2) kd 0.6 to 0.9, more damping against the overshoot
      that the higher kp adds. (3) Sensor spread widened from +/-0.03 to +/-0.035
      m, so the edge sensors keep seeing tape at larger offsets and line-loss events
      fall. Spacing is 0.0175 m, still under the 0.025 m tape width, so the centre
      sensors keep overlapping coverage. (4) base_speed kept at 1.3, since the oval
      finish time of 1.79 s leaves headroom but the s-bend failures show speed is
      not the first thing to cut. Mass, wheel geometry, ki and line_loss are unchanged
      to keep the comparison clean. Expected result: fewer off-track ends, line_loss_events
      under 1 on slalom, and s-bend progress above 0.5. Hypotheses: (a) if max_error
      still hits 0.06 on the s-bend, the robot needs more authority (kp near 5) or
      lower speed on the tight bends; (b) if steering_oscillation rises above about
      0.5, kd or kp is too high and kd should go back toward 0.6; (c) if the oval
      still finishes only in a few seeds, the speed or kp mix is the limit and base_speed
      should be tested at 1.5 with the same gains. Next measurements: progress, completion,
      completion_time, max_error, rms_error, line_loss_events, steering_oscillation
      and control_effort per track, so I can see whether the widened spread and higher
      kp are reducing edge losses and drift.


