  entities:
  - id: entity0
    label: Sensors moved forward
    notes: 'Moves all five sensors from y=0.04 to y=0.06 m to give the controller
      a longer tape preview, with all other values held at iteration 5. Targets the
      slalom, which lost the line about once per run and stalled at 0.53 progress,
      with the cause assumed to be steering lag.


      ### Rationale


      Evidence from iteration 5 (score 602.1, best so far): oval finishes 19 of 20
      (progress 0.99), s-bend finishes 9 of 20 (progress 0.95), and slalom finishes
      1 of 20 (progress 0.53, 0.95 line-loss events per run, max_error 0.0615). steering_oscillation
      is 0.27 to 0.40, well below the 0.5 warning level, so damping is not the limit.
      The failures are off-track drift on bends. The off-track limit is max(0.06,
      0.0125 + body_width/4). Even at body_width 0.18 that is 0.0575, so the limit
      stays at 0.06 and body width cannot help. Changing the spread from +/-0.035
      to +/-0.04 m moved slalom progress from 0.42 to 0.53 and line losses from 1.05
      to 0.95, a small gain, so edge coverage is not the main limit. The more likely
      cause is lag: the sensors sit only 0.04 m ahead of the axle, so the robot only
      sees a bend after its wheels are already on it. Changes: (1) Move all five sensors
      forward from y = 0.04 m to y = 0.06 m, keeping the same x spread (-0.04 to +0.04
      m) and spacing. This gives a longer preview of the tape, adding phase lead so
      the correction starts earlier on alternating bends. (2) All other values are
      kept at iteration 5 (kp 5.0, kd 1.4, ki 0.01, base_speed 1.2, sensor_size 0.016,
      mass 0.6, wheel_track 0.12, wheel_radius 0.03, sensor weights, line_loss last_direction)
      so the effect of the sensor position can be read cleanly. Expected result: slalom
      max_error and line-loss events fall, slalom progress rises above 0.7, and s-bend
      completion improves. Oval should hold near 0.95 completion. Hypotheses: (a)
      if the sensor move makes steering_oscillation rise above about 0.5, the extra
      lead is overcorrecting and kd should be kept or kp reduced to about 4.6. (b)
      If slalom progress is unchanged, lag is not the limit and the next step is more
      steering authority (kp about 5.5 with kd 1.5) or a narrower wheel_track of about
      0.10 m to raise turn rate per unit turn. (c) If s-bend finishes stay under 10
      of 20 while oval holds, base_speed should drop to about 1.15 again. Next measurements:
      completion, progress, completion_time, max_error, rms_error, line_loss_events,
      steering_oscillation and control_effort per track, so the sensor-lead effect
      can be separated from gain effects.


