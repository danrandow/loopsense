  entities:
  - id: entity0
    label: Revert to best (iter 8)
    notes: 'Reverts wheel_track from 0.11 back to 0.12 m, because iteration 9''s narrower
      track cut slalom finishes from 18 to 15 and raised line losses. All other values
      match iteration 8 (score 913.5), the best result so far.


      ### Rationale


      Iteration 9 scored 880.7, below iteration 8''s 913.5. Narrowing wheel_track
      from 0.12 to 0.11 m cut slalom finishes from 18/20 to 15/20, raised slalom off-track
      ends from 2 to 5, and raised slalom control_effort from 14.3 to 15.1. Oval and
      s-bend were unchanged. The faster turn rate therefore overcorrected on the alternating
      bends, so the track-width lever is a net loss. I am reverting to the iteration
      8 design, which is the best evidence so far: oval 20/20, s-bend 20/20, slalom
      18/20, with oscillation of 0.24 to 0.32, well under the 0.5 warning level. Everything
      else stays as in iteration 8 (sensor y 0.08 at the top of the allowed range,
      sensor spread of 0.04 m, sensor_size 0.016, kp 5.5, kd 1.5, ki 0.01, base_speed
      1.2, mass 0.6, wheel_radius 0.03, line_loss last_direction). I am not making
      a blind change, because the per-track ceiling is about 940 to 950 and the remaining
      gap is the slalom tail. Expected result: a score close to 913, with slalom finishes
      of 16 to 19 of 20. Hypotheses: (a) the slalom off-track ends are now a steering-authority
      limit at the sharpest alternating bends, so the next lever is kd up to about
      1.7 to contain overshoot at kp 5.5; (b) if oscillation stays low and slalom
      still misses, a mild kp increase to about 5.8 is worth testing; (c) the time
      term (about 20 points per track) can be raised by base_speed of about 1.25,
      but only if oval and s-bend completion hold at 1.0. Next measurements: completion,
      progress, completion_time, max_error, rms_error, line_loss_events, steering_oscillation
      and control_effort per track, so I can tell whether the slalom failures are
      overshoot or lost authority.


