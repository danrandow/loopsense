  entities:
  - id: entity0
    label: Narrower track 0.11 m
    notes: 'Keeps iteration 8''s controller and sensor layout and narrows wheel_track
      from 0.12 to 0.11 m, raising turn rate per unit steering command for more authority
      on slalom bends. Rests on iteration 8 slalom finishing 18/20 with oscillation
      well below 0.5, and on the hypothesis that turn rate is the next limit.


      ### Rationale


      Evidence from iteration 8 (score 913.5, best so far): oval finishes 20/20 (progress
      0.998, time 1.93 s, 1.0 line-loss events), s-bend finishes 20/20 (progress 0.996,
      time 2.29 s, 0.8 line-loss events), and slalom finishes 18/20 (progress 0.955,
      2 off-track, control_effort 14.3). Moving the sensors to y=0.08 with kp 5.5
      and kd 1.5 lifted slalom finishes from 9 to 18. Steering oscillation stayed
      at 0.24 to 0.32, well below the 0.5 warning level, so damping is not the limit.
      The remaining gap is slalom off-track ends, and the per-track score ceiling
      is roughly 940 to 950 at these times. Sensor y is now at the top of its allowed
      range, so the phase-lead lever is used up.


      Change: narrow wheel_track from 0.12 m to 0.11 m. Turn rate is (right wheel
      speed minus left wheel speed) divided by wheel_track, so for the same PWM differential
      the robot turns about 9 percent faster. This is an effective increase in steering
      authority without touching the gain values that are working. It is hypothesis
      (b)/(c) from iteration 7 and iteration 8, which both pointed at turn rate as
      the next limit once lag was reduced. Mass, sensor layout, controller gains,
      base_speed and line_loss are unchanged so the effect can be read against iteration
      8. I considered lowering mass to 0.55 kg as well, but I held it back to keep
      the attribution clean.


      Expected result: slalom progress rising to about 0.97 or more with off-track
      ends falling to 0 to 1 of 20, and oval and s-bend completion holding at 1.0.
      Because the robot turns harder, the wider-track baseline may show a small rise
      in line-loss events on the oval. Hypotheses: (a) if steering_oscillation rises
      above about 0.5, the extra turn rate is overcorrecting and kd should rise to
      about 1.7 or wheel_track should return to 0.12. (b) If slalom progress is flat
      versus iteration 8, turn rate is not the limit and the next lever is base_speed
      or line_loss handling. (c) If oval line_loss_events rise above 1.2, the robot
      is losing the tape at the edges and the sensor spread should widen slightly.
      Next measurements: completion, progress, completion_time, max_error, rms_error,
      line_loss_events, steering_oscillation and control_effort per track, so I can
      see whether the faster turn rate reduces slalom drift and whether oval and s-bend
      time improves.


