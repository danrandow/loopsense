  - id: entity0
    label: 'Final: iteration 8 design'
    notes: 'Resubmits the best measured design (iteration 8, score 913.5, reproduced
      in iteration 10) unchanged, because untested kd or speed changes risk the oval
      and s-bend completions on the unseen final track. The slalom tail (2 of 20 off-track)
      is the only remaining loss, and the measurements requested will show whether
      it is overshoot or lost authority.


      ### Rationale


      This is the final iteration, so the design should be the most robust one the
      evidence supports, not an untested step. Iteration 8 is the best measured design
      (913.46): oval 20/20, s-bend 20/20, slalom 18/20, with steering oscillation
      0.24 to 0.32, well under the 0.5 warning level. Iteration 9 narrowed wheel_track
      to 0.11 m and lost 3 slalom finishes (15/20, control effort 15.1), and iteration
      10 reverted to the iteration 8 design and reproduced its score exactly, so the
      result is repeatable. Sensor y = 0.08 m is the top of the allowed range, so
      the phase-lead lever is used up. The remaining loss is the slalom tail (2 off-track
      ends), and the per-track ceiling is about 940 to 950 on the time and progress
      terms. I considered kd 1.7 (hypothesis a from iteration 10) or base_speed 1.25,
      but both are untested, and the expected gain is about 1 to 2 points against
      a risk of losing oval or s-bend completion on the unseen track. So I submit
      the iteration 8 geometry and controller unchanged. Expected result: a score
      near 913 on the development tracks, with slalom finishes of 16 to 19 of 20.
      The measurements requested below will show whether slalom failures are overshoot
      or lost authority, which would guide any later revision.


