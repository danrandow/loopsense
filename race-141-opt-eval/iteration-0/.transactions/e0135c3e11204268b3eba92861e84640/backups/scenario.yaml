map:
  id: race-141-opt-eval
  schema: v0.2
  scenario: Iteration 0
  inherits: base.yaml
  notes: Initial prepared state before either AI role or the simulator has acted.
dimensions:
  time_horizon: prepared
  iteration: '0'
overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'Conservative first candidate: five 12 mm sensors at 0.04 m ahead of the
      axle, proportional sensor weights, kp 2.5, kd 0.3, base speed 1.5. No race data
      exists yet, so values are chosen from the contract ranges and the 1.5 m/s average-speed
      requirement.


      ### Rationale


      Iteration 0 has no race data or Evaluator feedback yet, so this is a conservative
      baseline built from the contract. Geometry: five sensors spaced 12 mm apart
      across x = -0.024 to +0.024 m, placed 0.04 m ahead of the axle so steering reacts
      before the wheels reach the line. The 12 mm sensor footprint is about half the
      tape width, which gives a usable gradient across the tape. Wheel track 0.12
      m and radius 0.03 m give a moderate turn authority. Mass 0.8 kg and body 0.16
      x 0.12 m are mid-range. The off-track limit is max(0.06, 0.0125 + body_width/4),
      which is 0.06 m for this body, so the body width does not change the limit here.
      Controller: sensor_weights are proportional to sensor x (left positive, so a
      left-side sensor reading tape steers the robot left). kp = 2.5 gives a moderate
      proportional response, kd = 0.3 damps oscillation, and ki = 0.05 is small to
      avoid integral windup. base_speed = 1.5 is chosen to reach the roughly 1.5 m/s
      average needed to finish in 3 s without a large speed margin that would risk
      leaving the track on the tightest bends. line_loss = last_direction so the robot
      searches toward the side it last saw the line. Expected result: completion on
      the oval and s-bend, with some oscillation on the slalom. Hypotheses to test:
      (1) kp is high enough to track bends but kd suppresses jitter; (2) 1.5 m/s is
      achievable without line loss. Measurements requested: completion, progress,
      completion time, RMS and max error, line-loss events and steering oscillation,
      which together show whether speed or gain is the limiting factor.


      - [Open this output](iteration-0/entity0/versions/a3df23ab8af64a0dad5dfe70175491f2/payload.json)'
  - id: entityR1
    label: 'Baseline review: approve'
    notes: 'Iteration 0 has no race data, so the candidate was checked only against
      the contract. It is valid and not obviously broken, so it is approved to race
      and produce telemetry. Next-race changes are tied to the speed and oscillation
      measurements requested.


      ### Feedback


      Iteration 0 has no race data yet, so this review rests only on the public contract
      and the candidate''s own contents. The candidate is valid: five sensors and
      five weights match, all values sit inside their limits, and line_loss is a permitted
      option. Sensor x-positions run from -0.024 to +0.024 m, and the weights (-2
      to +2) have the correct sign convention, with left-side sensors positive. The
      12 mm footprint is close to half the 25 mm tape width, which gives a usable
      gradient. Nothing here looks obviously broken, so it should race now to produce
      telemetry. Its weakest assumption is base_speed 1.5. The contract requires an
      average of about 1.5 m/s to finish inside 3 s, and the candidate has no margin
      for line losses or slowdowns in bends. Its gains (kp 2.5, kd 0.3) are untested,
      so the next race should decide which one to change. If the run does not complete,
      first check progress and completion_time to see whether speed is the limit.
      If it completes with high steering_oscillation, raise kd. If it completes with
      high rms_error but few line-loss events, raise kp. If line_loss_events is high,
      reconsider line_loss or lower base_speed. Keep the geometry unchanged until
      the controller has been tuned.


      ### Requested changes


      - If the race shows completion 0 with progress short of 0.995 and a low completion_time,
      raise base_speed in small steps (for example 1.5 to 1.7) before changing gains.
      The 3 s limit needs about 1.5 m/s average, and the baseline is not yet shown
      to reach it.

      - If the race shows high steering_oscillation or max_error near the 0.06 m off-track
      limit, raise kd from 0.3 to about 0.5 and keep kp at 2.5. Derivative action
      is the first lever for oscillation.

      - If the race shows high rms_error with few line_loss_events and no oscillation,
      raise kp from 2.5 to about 3.5 to tighten tracking on bends, keeping kd at or
      above 0.3 to avoid new oscillation.


      - [Open this output](iteration-0/entityR1/versions/d3ffad21290040ee88cd001f976e398a/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/a3df23ab8af64a0dad5dfe70175491f2/payload.json)'
  - id: entity1
    label: Approved Robot Build
    notes: 'Approved Robot Build. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-0/entity1/versions/d3ffad21290040ee88cd001f976e398a/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/a3df23ab8af64a0dad5dfe70175491f2/payload.json)'
  actions:
  - id: action0
  - id: action1
measurements: {}
