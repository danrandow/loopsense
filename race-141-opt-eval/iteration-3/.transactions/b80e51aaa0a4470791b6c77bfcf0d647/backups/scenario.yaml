  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence. Iteration 2 (score 600.6, best so far) finishes the oval 20/20 (mean
      finish 1.94 s), finishes the s-bend 13/20, and never finishes the slalom (0/20).
      Slalom runs end off track at progress 0.28 with max_error 0.0638, just above
      the fixed 0.06 m limit, and about 1 line-loss event per run. Iteration 2 added
      the forward sensor shift (y 0.06), mass 0.6 kg, kp 3.0, kd 0.7 and base_speed
      1.4. The Evaluator''s note on the 1.4 speed is stale: the oval finished at 1.94
      s, so the speed margin is large. The off-track limit is max(0.06, 0.0125 + body_width/4),
      which stays at 0.06 for any allowed body width, so the robot must keep max_error
      under 0.06 by control alone.


      Changes. (1) base_speed 1.4 to 1.3. Slalom and s-bend losses look like speed-dependent
      drift through sharp direction changes, and the oval has time margin to absorb
      a lower speed (the 3 s limit is about 1.94 s at 1.4). (2) kd 0.7 to 0.8. Slalom
      alternates left and right, so extra derivative damping should cut overshoot
      between bends; oval oscillation (0.25) is well below the 0.3 concern. Geometry,
      kp 3.0, ki 0.05, sensor_weights and line_loss (''last_direction'') are unchanged,
      so the race isolates speed plus damping against iteration 2.


      Expected result. Slalom progress rises and some slalom runs finish; s-bend finish
      rate stays at or above 0.65; slalom line_loss_events fall toward 0.7 or below;
      oval still finishes in under 3 s (about 2.1 to 2.3 s expected). Hypotheses:
      (a) lower speed reduces bend drift enough to keep max_error below 0.06 on the
      slalom; (b) kd 0.8 reduces overshoot without raising oval oscillation above
      about 0.3. If the oval finish fails, return base_speed to 1.4. If the slalom
      still ends off track with max_error above 0.06, next try kp 2.6 at base_speed
      1.2, or kd 0.9.


      - [Open this output](iteration-3/entity0/versions/d77d5bf0ef464fcb87ce7496f662c9b8/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-12356c8ae918e401/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-24c1b0557409cf66/payload.json)'
  - id: entityR1
    label: 'Approve: fwd sensors, kd'
    notes: 'Approved the candidate unchanged to race. It moves sensors forward, lowers
      mass and base_speed, and raises kd, which responds to iteration 1''s s-bend
      line losses and max_error above 0.06 and oval oscillation of 0.29. The feedback
      sets out how to read the race and what to change if the oval finish rate drops
      or bend losses persist.


      ### Feedback


      Approved to race. This candidate is valid and is a reasonable step from iteration
      1 (232.93) and iteration 0 (238.27, the best raced so far). It changes four
      things at once: sensor y 0.04 to 0.06 m, mass 0.8 to 0.6 kg, kp 3.5 to 3.0 with
      kd 0.6 to 0.7, and base_speed 1.5 to 1.4. Each change responds to earlier evidence.
      Iteration 1 showed that wider coverage cut s-bend and slalom line losses (2.05
      to 1.15 and 1.75 to 1.05), but s-bend max_error stayed near 0.063 and oval steering_oscillation
      rose to 0.29. Because four variables change together, the race will not isolate
      which one helped. Read the result by metric. If s-bend and slalom line_loss_events
      fall below about 0.8 and s-bend max_error drops under 0.06, keep the forward
      sensor shift and the lower mass. If the oval finish rate falls below the 0.40
      baseline, the most likely cause is base_speed 1.4, so return it to 1.5 and keep
      the other changes. If the s-bend still goes off track with max_error above 0.06
      and line losses remain high, the next step is a larger kd (about 0.9) or base_speed
      about 1.3. Do not spend more runs on kp until the speed and damping question
      is answered.


      ### Requested changes


      - If the oval finish rate drops below 0.40, set base_speed back to 1.5 and keep
      sensor y 0.06, mass 0.6, kp 3.0 and kd 0.7. Iteration 0 needed about 1.5 m/s
      for oval finishes inside 3 s (mean finish 1.87 s at 1.5).

      - If s-bend max_error stays above 0.06 and line_loss_events stay above 1 per
      run, raise kd from 0.7 to about 0.9 with kp held at 3.0. Iteration 1 s-bend
      max_error was 0.0634 and line losses were 1.15 per run.

      - If line losses on the s-bend and slalom drop but the robot still ends off
      track on bends, test base_speed 1.3 with the same gains. Iteration 1 showed
      that line losses were still about 1 per run at base_speed 1.5, so speed is a
      plausible limiter on bends.


      - [Open this output](iteration-2/entityR1/versions/3eedeadd47f946ebb0233a51d1319c36/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/c9846708d9f44840bc83d08588a6151c/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-909406ba601ef50e/payload.json)'
