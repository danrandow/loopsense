map:
  id: race-141-opt-eval
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Speed 1.1, x ±0.03 test
    notes: 'Returns geometry to the best-scoring x ±0.03 m layout and lowers base_speed
      from 1.2 to 1.1 against iteration 5 (699.16). Wider x (iteration 8) did not
      change slalom max_error and cost s-bend score, so speed is the untested lever
      on the slalom.


      ### Rationale


      Evidence. Iteration 5 (x ±0.03 m, kp 2.6, kd 0.9, ki 0.05, base_speed 1.2) is
      the best raced design at 699.16. Oval and s-bend finished 20/20 on both tracks,
      and the slalom finished 0/20 with max_error 0.0634 and about 1.05 line-loss
      events. Iteration 8 widened x to ±0.04 m with the same controller. Oval and
      s-bend stayed at 20/20, but s-bend mean score dropped from 950 to 943 and the
      total fell to 684.65. The slalom did not change: max_error 0.0635 and 1.0 line-loss
      events. So wider x coverage has not cleared the slalom limit, and it cost s-bend
      score. Across iterations 3 to 8, slalom max_error has stayed between 0.0618
      and 0.0646 under every kp, kd, ki, x and speed setting tried. The lowest value
      came from the lowest speed tried so far (1.2 with kp 2.6, kd 0.8: 0.0618). The
      score is roughly the mean of the three tracks. The slalom contributes about
      190 while off track, so a slalom finish is the largest remaining lever.


      Change. I return the geometry to the best-scoring layout, x ±0.03 m (-0.03,
      -0.015, 0, 0.015, 0.03) at y 0.06, and keep the 16 mm footprint, mass 0.6, and
      wheels unchanged. I also lower base_speed from 1.2 to 1.1, with kp 2.6, kd 0.9,
      ki 0.05 and sensor_weights [-2,-1,0,1,2] unchanged. This is a single-variable
      test against iteration 5. Speed is the one lever that has not been isolated:
      iteration 3 to 4 cut speed and kp together and reduced slalom max_error from
      0.0646 to 0.0618, while kd and ki alone did not move it.


      Timing check. Oval mean time is 1.83 s at 1.2. Scaling by 1.2/1.1 gives about
      2.0 s, and the s-bend gives about 2.43 s from 2.23 s. Both are under the 3.0
      s limit with margin, so completion should hold.


      Expected result. Oval and s-bend stay at 20/20. Slalom max_error falls to about
      0.060 or below, with line-loss events at or below 1.0. A slalom finish is possible
      but not expected.


      Decision rules for the next iteration. If oval or s-bend finish rate falls below
      0.95 or completion_time exceeds about 2.8 s, return base_speed to 1.2. If the
      slalom still ends off track with max_error at or above 0.06 at 1.1 m/s, the
      controller levers are exhausted, so the next step is to test a different structural
      change (for example line_loss search_right, or 3 sensors). If any slalom run
      finishes, hold all values and confirm the score.


      Hypotheses. (a) Lower speed reduces slalom overshoot through the sharp alternations.
      (b) The x ±0.03 layout keeps the s-bend score at about 950, which the wider
      layout did not. Measurements requested: full set, read per track, with emphasis
      on slalom max_error, line_loss_events, progress and completion_time, and on
      oval and s-bend completion_time to confirm the speed margin.


      - [Open this output](iteration-9/entity0/versions/e27bfe519d1743b89d207456139c7d29/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-23d0ae903888be6b/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-1e2b242a6f8da9b4/payload.json)'
  - id: entityR1
    label: 'Approve: speed 1.1 test'
    notes: 'Approved the iteration 5 layout with base_speed lowered from 1.2 to 1.1,
      the only lever not yet isolated against the best raced design (699.16). Slalom
      max_error has stayed 0.0618 to 0.0646 across iterations 3 to 8, and speed was
      the untested variable, so this is a clean low-risk read with timing margin under
      3 s.


      ### Feedback


      Approved to race. The candidate is valid and is a single-variable test against
      iteration 5, the best raced design (699.16). Geometry is the iteration 5 layout
      (x ±0.03 m at y 0.06, 16 mm footprint, mass 0.6, wheels unchanged). Only base_speed
      moves, from 1.2 to 1.1, with kp 2.6, kd 0.9, ki 0.05 and sensor_weights [-2,-1,0,1,2]
      held. Speed is the one lever not yet isolated. Iteration 3 to 4 cut speed and
      kp together and moved slalom max_error from 0.0646 to 0.0618, while kd and ki
      alone moved it little (iterations 5 to 7). Iteration 5 finished oval and s-bend
      20/20 at 1.2, and the timing margin to the 3 s limit is still comfortable at
      1.1. The main risk is a small score loss from longer completion times, not a
      finish failure. Approving now gives a clean read on speed and is the most useful
      use of the remaining runs. Read the next race by track. If oval or s-bend finish
      rate falls below 0.95, or completion_time exceeds about 2.8 s, return base_speed
      to 1.2. If the slalom still goes off track with max_error at or above 0.06 at
      1.1, the controller levers are largely exhausted, so the next structural test
      is line_loss ''search_right'' (or a 3-sensor layout). If any slalom run finishes,
      hold all values and confirm the score.


      ### Requested changes


      - If oval or s-bend finish rate drops below 0.95, or s-bend completion_time
      exceeds about 2.8 s, set base_speed back to 1.2 with kp 2.6, kd 0.9, ki 0.05
      (iteration 5: both tracks 20/20, s-bend mean 2.23 s).

      - If the slalom still ends off track with max_error at or above 0.06 at base_speed
      1.1, test line_loss ''search_right'' with everything else unchanged. Slalom
      line-loss events have stayed near 1.0 across iterations 3 to 8, and a different
      loss response is the untested structural lever.

      - If any slalom run finishes, hold geometry and controller fixed and use the
      next race to confirm the score rather than change gains (iteration 5 is the
      reference at 699.16).


      - [Open this output](iteration-9/entityR1/versions/81d0e3bdc881419393d8b25df7f8a29a/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/e27bfe519d1743b89d207456139c7d29/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-1e2b242a6f8da9b4/payload.json)'
