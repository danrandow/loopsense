map:
  id: race-141-opt-eval
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: kp 2.4, kd 0.8 test
    notes: 'Returns kd to 0.8 and lowers kp from 2.6 to 2.4 at base_speed 1.2, with
      geometry fixed. Iteration 5 kd 0.9 raised slalom mean max_error from 0.0618
      to 0.0634 and the slalom still finished 0/20, so the Evaluator''s rule points
      to a corner-gain test.


      ### Rationale


      Evidence: iteration 5 (kd 0.9, kp 2.6, base_speed 1.2) scored 699.16, the best
      so far. The oval finished 20/20 (mean 1.83 s) and the s-bend 20/20 (mean 2.23
      s), so kd 0.9 kept both finish rates at the 0.95 threshold. The slalom is still
      0/20 off-track, and its mean max_error rose from 0.0618 (iteration 4, kd 0.8)
      to 0.0634 at kd 0.9, while line_loss_events fell from 1.0 to 1.05 (about unchanged).
      The slalom failure is therefore not reduced by more derivative damping. The
      Evaluator''s decision rule for this case is to return kd to 0.8 and test kp
      2.4 at base_speed 1.2. Change: kd 0.9 to 0.8, and kp 2.6 to 2.4. base_speed
      1.2, ki 0.05, sensor_weights, line_loss and all geometry stay as in iteration
      5, so the race isolates the corner-gain reduction. Expected result: slalom max_error
      below 0.06 with some slalom finishes, because lower proportional gain should
      cut overshoot on alternating bends. Oval should remain 20/20 and s-bend should
      stay at or above 0.95, though a lower kp could slow bend recovery. Risks: a
      lower kp could increase slalom progress time, and the 3 s limit on the s-bend
      could tighten. Decision rules for the next iteration: if the slalom still ends
      off track with max_error at or above 0.06 and line_loss_events stay at or above
      1.0, the next lever is ki 0.05 to 0.1 (only if line losses persist). If the
      oval or s-bend finish rate drops below 0.95, return kp to 2.6 and keep kd 0.8.
      If the slalom max_error falls below 0.06 with any slalom finishes, hold these
      values and keep geometry fixed. Hypotheses: (a) the slalom limit is driven by
      proportional overshoot, not damping; (b) kp 2.4 at base_speed 1.2 reduces max_error
      by roughly 0.001 to 0.002 m without breaking the other tracks. Measurements
      requested: full set, read per track, with emphasis on slalom max_error, line_loss_events
      and steering_oscillation.


      - [Open this output](iteration-6/entity0/versions/81a027839f2e4ffba94d970c7913f9d9/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-f24f96079eba1593/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-5b9b7257c05f2ce6/payload.json)'
  - id: entityR1
    label: Approve kd 0.9 test
    notes: 'Approved the single-variable kd 0.8 to 0.9 step on the iteration 4 controller,
      which had slalom max_error 0.0618 and 0/20 slalom finishes. The step is low-risk
      on the oval and s-bend, and the feedback gives decision rules for the next race
      based on per-track results.


      ### Feedback


      Approved to race. The candidate is valid and changes only kd, from 0.8 to 0.9,
      relative to iteration 4 (kp 2.6, base_speed 1.2, score 679.86). Geometry, ki
      0.05, kp, base_speed, sensor_weights and line_loss are unchanged, so the race
      isolates derivative damping. Iteration 4 cut the slalom max_error from 0.0646
      (iteration 3) to 0.0618, with line_loss_events down from 1.45 to 1.0, but it
      still ended 0/20 off track. The oval (20/20, mean 1.83 s) and s-bend (19/20,
      mean 2.13 s) show that speed is not the limit on those tracks. Because the slalom
      is 0.0018 m above the limit and it is the only track with no finishes, a small
      kd step is a low-risk test. Two cautions from history: kd 0.8 coincided with
      higher slalom line losses in iteration 3 (1.45 at kp 3.0, base_speed 1.3), and
      oval steering_oscillation was 0.14 at kd 0.8, so the jitter cost of kd 0.9 should
      be small. After the race, read the result by track. If the slalom max_error
      falls below 0.06 with any slalom finishes, hold kp 2.6, base_speed 1.2 and kd
      0.9, and test ki 0.1 only if slalom line_loss_events stay at or above 1.0. If
      the slalom still ends off track with max_error at or above 0.06 and kd 0.9 does
      not reduce it, return kd to 0.8 and test kp 2.4 at base_speed 1.2. If the s-bend
      or oval finish rate drops below 0.95, return kd to 0.8. Keep geometry fixed
      until the slalom finishes at least once.


      ### Requested changes


      - If the slalom max_error falls below 0.06 with any slalom finishes, hold kp
      2.6, base_speed 1.2 and kd 0.9, and test ki 0.05 to 0.1 only if slalom line_loss_events
      stay at or above 1.0 (iteration 4: 1.0 at kd 0.8).

      - If the slalom still ends off track with max_error at or above 0.06 and kd
      0.9 does not reduce it, return kd to 0.8 and test kp 2.4 at base_speed 1.2,
      since iteration 4 moved max_error from 0.0646 to 0.0618 when kp and speed fell
      together.

      - If the s-bend or oval finish rate drops below 0.95 (iteration 4: s-bend 19/20,
      oval 20/20), return kd to 0.8. Keep geometry fixed until the slalom finishes
      at least once.


      - [Open this output](iteration-5/entityR1/versions/2b18595bb298425dbe2edcc591789112/payload.json)

