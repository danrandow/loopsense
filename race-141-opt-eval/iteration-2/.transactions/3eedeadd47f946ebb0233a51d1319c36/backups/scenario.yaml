overrides:
  entities:
  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence: iteration 1 (16 mm sensors at x ±0.03, kp 3.5, kd 0.6) scored 232.9,
      slightly below the baseline''s 238.3. Line-loss events on the s-bend fell from
      2.05 to 1.15 and on the slalom from 1.75 to 1.05, so wider coverage helped.
      The oval finish rate dropped from 0.40 to 0.35 and oval steering_oscillation
      rose from 0.24 to 0.29. The s-bend max_error stayed at about 0.063, above the
      0.06 m limit, so the robot still drifts out on bends. Completion has only come
      from the oval, and the 500-point completion bonus dominates the score.


      Changes: (1) Sensor y moves from 0.04 to 0.06 m ahead of the axle. Readings
      then lead the wheels by more, which reduces the phase lag that lets bend error
      build up. (2) Mass drops from 0.8 to 0.6 kg. Yaw inertia scales with mass, so
      the robot turns more readily and drifts less on bends. (3) kp drops from 3.5
      to 3.0 and kd rises from 0.6 to 0.7, to cut the oval oscillation seen in iteration
      1 while keeping bend tracking. (4) base_speed drops from 1.5 to 1.4. Line losses
      are still about 1 per run on bends, and the reviewer''s rule says to reduce
      speed when losses stay high. The oval mean finish of 1.93 s at 1.5 leaves some
      margin for 1.4. Sensor x-spacing, sensor size, wheel geometry, ki, sensor_weights
      and line_loss are unchanged.


      Expected result: fewer line losses on the s-bend and slalom (target below 0.8
      per run), s-bend max_error below 0.06, oval steering_oscillation near 0.25,
      and the oval finish rate at or above the baseline''s 0.40. Hypotheses to test:
      (a) the forward sensor shift and lower mass reduce bend drift; (b) the 1.4 base_speed
      keeps the oval finish within 3 s. If the s-bend still ends off track with max_error
      above 0.06, the next step is a larger kd or a lower base_speed of about 1.3.
      If the oval finish drops, return base_speed to 1.5 with these gains.


      - [Open this output](iteration-2/entity0/versions/c9846708d9f44840bc83d08588a6151c/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/carried-f73a635f0f15b007/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-909406ba601ef50e/payload.json)'
  - id: entityR1
    label: Approve wider sensors
    notes: 'Approved the candidate to race unchanged: wider sensor coverage (±0.03
      m, 16 mm footprint), kp 3.5 and kd 0.6, aimed at the line-loss and max_error
      failures on the s-bend and slalom in iteration 0 (score 238.27). Nothing has
      raced for it yet, so the feedback sets follow-up changes conditional on the
      race telemetry.


      ### Feedback


      This candidate is valid and follows the evidence from iteration 0 (score 238.27).
      That baseline finished the oval 40% of the time with 0.75 line-loss events per
      run. The s-bend and slalom never finished: both ended off-track with about 2
      line-loss events per run, and s-bend max_error reached 0.0635, above the 0.06
      m limit. Losing the line on bends is the main failure, not running out of time.
      The changes target that failure directly: sensor x-coverage widened to ±0.03
      m, the footprint enlarged to 16 mm, kp raised from 2.5 to 3.5 and kd from 0.3
      to 0.6. The rationale keeps base_speed at 1.5, which iteration 0 shows is needed
      for the 3 s limit, and leaves ki, sensor_weights, line_loss and the wheel and
      mass geometry unchanged, so the race can attribute effects to coverage and gains.
      Nothing here is obviously broken, and no race of this candidate exists yet,
      so no outcome is claimed for it. Approve it to race now, since five action runs
      remain and it gives telemetry that the next critique needs. After the race,
      read the results as follows. If line_loss_events on the s-bend and slalom stay
      near 2, coverage alone did not fix the loss: reduce base_speed to about 1.3
      and accept a slower finish. If steering_oscillation rises above about 0.3, raise
      kd toward 0.8 before touching kp. If max_error stays under 0.06 but completion
      is still low, the limit is speed, so test base_speed 1.6 with the same gains.


      ### Requested changes


      - If line_loss_events on the s-bend and slalom remain near 2 per run (iteration
      0: 2.05 and 1.75), reduce base_speed from 1.5 to about 1.3 and keep the wider
      sensor array, because at 1.5 the robot loses the line before the coverage change
      can help.

      - If steering_oscillation rises above about 0.3 (iteration 0 oval: 0.2445 at
      kp 2.5, kd 0.3), raise kd from 0.6 to about 0.8 while keeping kp at 3.5.

      - If max_error stays below 0.06 and line losses drop but completion is still
      low with a long completion_time, test base_speed 1.6 with the same gains, because
      iteration 0 needed about 1.5 m/s to finish inside 3 s.


      - [Open this output](iteration-1/entityR1/versions/9c7ad571e5d847b680b73ea531084bac/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/8f6df28c25694e5d9c82ccc869ce1295/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-850c0edce754d632/payload.json)'
