overrides:
  entities:
  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Evidence: iteration 3 (683.18, best so far) finished the oval 20/20 (mean 1.79
      s) and the s-bend 20/20 (mean 2.21 s), but the slalom still failed 0/20. Its
      progress rose from 0.28 to 0.36, yet max_error was 0.0646 (above the 0.06 m
      limit) and line_loss_events rose from 1.0 to 1.45, so the robot still leaves
      the line on the sharp slalom alternations. Lowering speed and raising kd did
      not clear the slalom limit on their own. The Evaluator''s rule for this case
      (slalom progress rising, still off track with max_error above 0.06) is to lower
      kp and speed together: kp 3.0 to 2.6 reduces corner gain and overshoot, and
      base_speed 1.3 to 1.2 reduces the drift through sharp direction changes. Changes:
      kp 3.0 to 2.6 and base_speed 1.3 to 1.2. Geometry, ki 0.05, kd 0.8, sensor_weights
      and line_loss are unchanged from iteration 3, so the race isolates the corner-gain
      and speed change. Expected result: slalom max_error below 0.06 with some slalom
      finishes, slalom line_loss_events at or below about 1.0, oval still finishing
      (about 1.9 to 2.0 s, well under 3 s), and s-bend finishing at or above 0.9.
      Risks: the lower kp may slow the oval and s-bend response, and the 1.2 speed
      lengthens the finish time. If the oval finish rate falls below 1.0, return base_speed
      to 1.3 and keep kp 2.6. If the slalom still ends off track with max_error above
      0.06 while line losses stay high, the next test is kd 0.9 at base_speed 1.2.
      Measurements requested: full set, so the per-track max_error, line_loss_events
      and completion_time can show whether the slalom limit is being met.


      - [Open this output](iteration-4/entity0/versions/03d133e46aa24f20b191952b31242d57/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-89534d21302d61f4/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-191c2ca57b634814/payload.json)'
  - id: entityR1
    label: 'Approve: slower, more'
    notes: 'Approved the candidate that lowers base_speed 1.4 to 1.3 and raises kd
      0.7 to 0.8 on the iteration 2 design, since the best raced design (600.6) fails
      only on the slalom and s-bend through off-track drift. The oval''s 1.94 s finish
      leaves room for the lower speed, and the feedback sets the next move by track
      result.


      ### Feedback


      Approved to race. The candidate is valid and changes only two controller values
      from iteration 2, the best raced design (600.62): base_speed 1.4 to 1.3 and
      kd 0.7 to 0.8. Geometry, kp 3.0, ki 0.05, sensor_weights and line_loss are unchanged.
      Iteration 2 showed that the oval finishes 20/20 at a mean of 1.94 s, so a drop
      to 1.3 should still finish inside 3 s, though the margin is smaller than before.
      The s-bend finished 13/20, and every failure came from going off track. The
      slalom finished 0/20 with max_error 0.0638 against the 0.06 m limit and about
      1 line-loss event per run. Those are the failures this change targets. Because
      two variables change together, the race will not show which one helped. Read
      the result by track. If the oval finish rate falls below 1.0, or its completion_time
      rises above about 2.7 s, return base_speed to 1.4 and keep kd 0.8. If the slalom
      progress rises but it still goes off track with max_error above 0.06, try kp
      2.6 at base_speed 1.2 next, which lowers the corner gain and the speed together.
      If the slalom line_loss_events fall but max_error stays above 0.06, raise kd
      to 0.9 with base_speed 1.3. Do not change geometry until the controller question
      is settled, since the forward sensor shift and mass 0.6 kg helped in iteration
      2.


      ### Requested changes


      - If the oval finish rate drops below 1.0 or its completion_time rises above
      about 2.7 s, set base_speed back to 1.4 and keep kd 0.8. Iteration 2 oval finished
      20/20 at a mean of 1.94 s at base_speed 1.4.

      - If the slalom still ends off track with max_error above 0.06 (iteration 2:
      0.0638, 0/20 finishes), try kp 2.6 with base_speed 1.2, which lowers both corner
      gain and speed. Speed is the main suspected driver of bend drift.

      - If the slalom line_loss_events fall but max_error stays above 0.06, raise
      kd from 0.8 to 0.9 with base_speed 1.3. Iteration 2 showed about 1 line-loss
      event per slalom run, and oval steering_oscillation was 0.25, well under the
      0.3 concern.


      - [Open this output](iteration-3/entityR1/versions/b80e51aaa0a4470791b6c77bfcf0d647/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/d77d5bf0ef464fcb87ce7496f662c9b8/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-24c1b0557409cf66/payload.json)'
