map:
  id: race-223-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Midpoint inertia test
    notes: 'Holds the reproduced 111.8 platform (wheel_track 0.12, sensors unchanged)
      and moves mass to 0.75 and body_length to 0.16, the midpoint inertia the Integrator
      proposed. Iteration 9 reproduced 111.80 with slalom line loss 0.10, which meets
      the Integrator''s condition for this step.


      ### Rationale


      Iteration 9 reproduced the iteration-5 platform (wheel_track 0.12, mass 0.8,
      body_length 0.18, sensors at y 0.03, 16 mm footprints, span ±0.06 m) and scored
      111.80, identical to iterations 1 and 5. Slalom line loss was 0.10, so the baseline
      is confirmed. The narrow-track tests (iterations 6 to 8, scores 72.9 to 79.6)
      were all worse, with slalom line loss up to 0.35 and oval progress halved, and
      they did not reduce max_error. I am keeping wheel_track 0.12. The Integrator''s
      feedback (entityR1) asks, on a reproduced 111.8 with slalom line loss at or
      below 0.1, for the midpoint inertia test with the controller unchanged. I am
      taking that advice. Iteration 4 (mass 0.7, body_length 0.14) gave the best progress
      (oval 0.53, s-bend 0.20) but slalom line loss of 0.85. Iteration 5 (mass 0.8,
      body_length 0.18) gave slalom line loss 0.10. Yaw inertia m(L²+W²)/12 is about
      0.00312 at the baseline, 0.00250 at the midpoint and 0.00198 at iteration 4.
      So the midpoint sits roughly halfway, and I expect it to recover some progress
      while keeping slalom line loss below the 0.2 stop rule. The risk is that slalom
      line loss rises well above 0.1, and the Integrator has said not to go below
      this midpoint. Sensors, span, footprint, wheel radius and body width are unchanged,
      so the race isolates inertia.


      - [Open this output](iteration-10/entity0/versions/851ff90a42b340d4acae89a48ce883c5/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-6203e5ce664e5867/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-866677a8630c28cf/payload.json)'
  - id: entity1
    label: Revert to 0.12 track
    notes: 'Iteration-5 platform (wheel_track 0.12, mass 0.8, body_length 0.18) paired
      with the proven kp 3.0 controller that scored 111.80. Narrow-track runs (iterations
      6 to 8) scored 73 to 80, so the revert is supported by race data.


      ### Rationale


      The Builder''s geometry for this iteration is the iteration-5 platform: wheel_track
      0.12, mass 0.8, body_length 0.18, five sensors at x -0.06 to +0.06 in 0.03 m
      steps, y 0.03, 16 mm footprints. Iteration 5 raced this platform with the controller
      below and scored 111.80. Slalom line loss was 0.10, oval progress 0.55, and
      s-bend progress 0.14. The only platform change that clearly raised score, lower
      inertia (iteration 4, 124.20), pushed slalom line loss to 0.85, so inertia stays
      here. Narrowing the track to 0.10 (iterations 6 to 8) cut oval progress to about
      0.28 to 0.30 and scored 72.9 to 79.6 across kp 2.5 to 3.0, so the 0.10 track
      is rejected. Every controller change tried on this platform was confounded with
      a geometry change except kp 4 and kd 0.6 (iteration 2) and the kp and base_speed
      softening (iteration 3). Both made line loss worse. I therefore keep the one
      controller that has raced on this exact geometry with the best result (kp 3.0,
      kd 0.3, ki 0.05, base_speed 1.2, last_direction). Changing gains now would add
      risk without evidence. max_error sits at 0.061 to 0.066 m on every geometry,
      so it is most likely the run-ending threshold, not a tuning target. Expected
      result: a score near 111.8 (range about 110 to 120), with slalom line loss near
      0.1.


      - [Open this output](iteration-9/entity1/versions/2ec2c896c14d4d53a1e31d8207181a68/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/86f47594084f41f89edc460fc31ff7c2/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-d580f9748f9cebf7/payload.json)'
  - id: entityR1
    label: Hold 0.12, test midpoint
    notes: 'Agrees with the wheel_track 0.12 revert, since 0.10 cut oval progress
      to about 0.3 at every kp tried. Recommends a single midpoint inertia step (mass
      0.75, body_length 0.16) only if slalom line loss stays at or below 0.1.


      ### Feedback


      Iterations 6 to 8 (entityR2B, 72.91, 79.60 and 77.55) show that wheel_track
      0.10 is worse than 0.12 at every kp tested (2.5, 2.75, 3.0). Oval progress fell
      from 0.55 (iteration 5) to 0.28 to 0.30, and slalom line loss was 0.35 at kp
      3.0. Lowering kp to 2.5 removed slalom line loss but did not restore progress.
      So the narrow track is the problem, and I agree with your revert to 0.12. Iteration
      5 (entityR2B, 111.80, same platform as your proposal) is the reference. Its
      slalom line loss was 0.10, and its oval progress was 0.55. Iteration 4 (entityR2B,
      124.20) showed that lower inertia (mass 0.7, body_length 0.14) gave the best
      progress, but slalom line loss rose to 0.85. That makes inertia the key trade-off.
      max_error stayed at 0.061 to 0.066 m in all eight races, whatever the geometry
      or gain, so it looks like the off-track threshold and not a tuning target. I
      do not expect this geometry to reduce it. The current candidate has not raced,
      so I state no outcome for it. Next steps depend on the race. If the platform
      reproduces about 111.8, hold it and test the midpoint inertia. If slalom line
      loss is at or below 0.1, try mass 0.75 with body_length 0.16 with the controller
      unchanged. If slalom line loss is 0.2 or higher, do not reduce inertia further.


      ### Requested changes


      - Hold wheel_track 0.12, mass 0.8, body_length 0.18 and the 0.06 m sensor span
      with 16 mm footprints (the iteration-5 platform). Do not return to wheel_track
      0.10.

      - If slalom line loss is at or below 0.1 in this race, try the midpoint inertia
      you proposed (mass 0.75, body_length 0.16) as one step, with the controller
      unchanged.

      - Do not go below mass 0.75 or body_length 0.16. Iteration 4 at mass 0.7 and
      body_length 0.14 gave slalom line loss of 0.85.


      - [Open this output](iteration-9/entityR1/versions/2ec2c896c14d4d53a1e31d8207181a68/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/86f47594084f41f89edc460fc31ff7c2/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-d580f9748f9cebf7/payload.json)'
