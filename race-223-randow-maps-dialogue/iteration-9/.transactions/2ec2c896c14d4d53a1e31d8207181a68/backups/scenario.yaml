map:
  id: race-223-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Revert to 0.12 track
    notes: 'Restores the iteration-5 platform with wheel_track 0.12, since the 0.10
      track cut slalom progress and raised line loss in iterations 6 to 8. Evidence:
      iteration 5 scored 111.80 with slalom line loss 0.10, and the Integrator''s
      entityR1 feedback asks for this revert.


      ### Rationale


      Iterations 6, 7 and 8 all used wheel_track 0.10 and all scored worse than the
      iteration-5 platform (111.80). Narrowing the track raised slalom line loss from
      0.10 to 0.35 and halved oval progress from 0.55 to 0.28. The kp change to 2.5
      (iteration 7 at 79.60, and iteration 8 at 77.55 with the same geometry) did
      not recover it, so the narrow track is the problem, not the gain. The Integrator''s
      entityR1 feedback asks for wheel_track 0.12 to be restored if slalom line loss
      stays at 0.2 or higher, and it does (0.35 at kp 3.0, 0.00 to 0.1 across the
      kp 2.5 runs, but oval progress stayed at 0.30). I am taking that advice. I am
      reverting wheel_track to 0.12 and restoring the iteration-5 platform exactly:
      mass 0.8, body_length 0.18, sensors at y 0.03 with x from -0.06 to +0.06 in
      0.03 m steps, 16 mm footprints, wheel_radius 0.03.


      The max_error values sit at 0.061 to 0.066 m on every geometry tried. That is
      consistent with the run-ending threshold (off-track limit 0.06 m), not with
      a tracking limit. Runs end once the error crosses the limit, so max_error mostly
      records where each run stopped. The more useful measures are progress before
      exit and line loss. Lower inertia (iteration 4) gave the best progress (124.20)
      but slalom line loss of 0.85. Restoring mass 0.8 and body_length 0.18 keeps
      slalom line loss at 0.10 but gives up that progress gain. I expect a score near
      111.8 (range 110 to 120), with slalom line loss near 0.1. I am not changing
      the sensor span, forward offset or footprint, because line loss is controllable
      at this span and those are settled.


      - [Open this output](iteration-9/entity0/versions/86f47594084f41f89edc460fc31ff7c2/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-4ba6e54790950290/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-d580f9748f9cebf7/payload.json)'
  - id: entity1
    label: kp 2.75 on 0.10 track
    notes: 'Keeps the Builder''s wheel_track 0.10 geometry and sets kp to 2.75, between
      the measured kp 2.5 (line loss 0.0, oval progress 0.30) and kp 3.0 (line loss
      0.35) results. No outcome is claimed; the candidate has not raced.


      ### Rationale


      Iteration 7 already raced the kp 2.5 test on this same wheel_track 0.10 platform
      (entityR2B, 79.60). It removed slalom line loss (0.0 per run) but left oval
      progress at 0.30, below the 0.35 threshold in the Builder''s revert rule, and
      max_error stayed at 0.062 to 0.063 m. Iteration 6 (kp 3.0) gave slalom line
      loss 0.35 and oval progress 0.28. Progress is therefore not recovered by kp
      2.5, and line loss is set by kp on this track. I keep the supplied geometry
      (wheel_track 0.10, mass 0.8, body_length 0.18, sensors at y 0.03, 16 mm footprints)
      because the Builder''s proposal is the input I must build. I interpolate to
      kp 2.75, which sits between the two measured points, to see whether line loss
      stays near 0.1 while oval progress rises above 0.35. kd 0.3, ki 0.05, base_speed
      1.2 and last_direction are unchanged, so kp is the only controller variable.
      No outcome is claimed for this candidate, which has not raced. Expected result:
      slalom line loss between 0.0 and 0.35, oval progress between 0.30 and 0.55,
      and max_error still near 0.063 m, which would confirm that gain balance is the
      limit.


      - [Open this output](iteration-8/entity1/versions/171f81dacc124a0cbadc6c06422ed6fb/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/19768c6838f94da6ae6d83197bd91998/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-0160d168c10a59f0/payload.json)'
  - id: entityR1
    label: Revert to wheel_track
    notes: 'Iteration 7 already tested the kp 2.5 change on the 0.10 track and scored
      79.60, with oval progress 0.30, which meets the revert rule. The feedback recommends
      returning to wheel_track 0.12, the best measured platform for this inertia (111.80).


      ### Feedback


      The kp 2.5 test you proposed has already raced as iteration 7 (entityR2B, 79.60),
      so this iteration''s rationale is out of date. On wheel_track 0.10 with kp 2.5,
      slalom line loss was 0.0, which meets your target, but oval progress was 0.30
      and max_error stayed at 0.062 to 0.063 m. That meets your own revert condition
      (oval progress below 0.35). Iteration 6 (kp 3.0, wheel_track 0.10) gave slalom
      line loss 0.35 and oval progress 0.28, so the narrow track has not produced
      better tracking at any gain tried. The best measured score on the 0.12 track
      with mass 0.8 and body_length 0.18 is iteration 5 (111.80, oval progress 0.55,
      slalom line loss 0.10). For the next geometry, I recommend returning wheel_track
      to 0.12 with the rest of the iteration-5 platform unchanged, since max_error
      has stayed at 0.061 to 0.066 m across every geometry tried. The current candidate
      has not raced, so I state no outcome for it.


      ### Requested changes


      - Revert wheel_track to 0.12, keeping mass 0.8, body_length 0.18, sensors at
      y 0.03 with 16 mm footprints. Iteration 5 on this platform scored 111.80 with
      slalom line loss 0.10.

      - If you keep wheel_track 0.10, do not repeat the kp 2.5 test. Use kp 2.75 (the
      current controller) and treat the kp 2.5 result (iteration 7) as the baseline
      for it.

      - Do not reduce inertia further (mass or body_length) on the slalom track. Iteration
      4 showed slalom line loss of 0.85 at mass 0.7 and body_length 0.14.


      - [Open this output](iteration-8/entityR1/versions/171f81dacc124a0cbadc6c06422ed6fb/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/19768c6838f94da6ae6d83197bd91998/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-0160d168c10a59f0/payload.json)'
