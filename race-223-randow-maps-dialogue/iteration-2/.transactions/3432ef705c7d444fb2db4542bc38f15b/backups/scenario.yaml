map:
  id: race-223-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Wider array, larger
    notes: 'Widens the sensor array from ±0.04 m to ±0.06 m and raises sensor_size
      to 0.016 m, so the line stays in view past the 0.06 m off-track limit. The baseline
      race (60 trials, all off-track with one line-loss each and max_error about 0.063
      m) shows the line dropping out just before the limit, which is why the array
      span is the change.


      ### Rationale


      Race evidence for the baseline (entityR2A, 60 trials): every run ended off_track,
      none finished, and each run had exactly one line-loss event. Max error sat at
      about 0.062 to 0.063 m on all three tracks, just above the off-track limit.
      The off-track limit is max(0.06, 0.0125 + body_width/4). With body_width at
      most 0.18 that limit is always 0.06 m, so body width cannot buy margin. The
      baseline sensors sit at x = ±0.04 with a 0.012 m footprint, so a sensor sees
      the tape only while the line centre is within about 0.0185 m of it. The line
      therefore drops out of view at roughly 0.0585 m of offset, just before the 0.06
      m off-track limit. The sequence fits the data: the robot tracks well (rms_error
      about 0.023 to 0.026 m), then one bend pushes it past the edge of the array.
      Once the line is lost the robot cannot recover, so it leaves the track. The
      limiting factor is the array''s lateral span, not the body or the forward offset.
      I am taking the Integrator''s advice from iteration 0 only in spirit: there
      is no Integrator feedback yet, so the change comes from race data alone. I am
      widening the array to x = ±0.06 with 0.016 m footprints. A sensor at x = 0.06
      then sees the tape for offsets up to about 0.0805 m, well past the 0.06 m limit,
      so the controller keeps a signal during the excursions that currently end runs.
      I keep the 0.03 m forward offset, wheel geometry, body and mass unchanged, so
      the race isolates the sensor-span change. Expected result: line_loss_events
      falls to 0 or near 0 on the development tracks, max_error stays under 0.06 more
      often, and progress rises on the oval and s-bend. The main risk is that wider
      spacing (0.03 m, larger than the 0.025 m tape) gives a flatter signal near centre,
      which may need a smaller kp from the Integrator.


      - [Open this output](iteration-1/entity0/versions/0c8a3ea0f35141c89ae65036dc9204d7/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-5a3ccd8fb67bb043/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-4d3a709a014e268b/payload.json)'
  - id: entity1
    label: Wider 5-sensor array
    notes: 'Adopts the Builder''s ±0.06 m array with 16 mm footprints and keeps the
      baseline controller, so the race isolates the sensing change. Iteration 0 showed
      one line loss per run with max_error just above the 0.06 m limit.


      ### Rationale


      The baseline (entityR2A, 60 trials) ended every run off_track with exactly one
      line-loss event, and max_error sat at 0.061 to 0.063 m against the 0.06 m limit.
      rms_error was 0.023 to 0.026 m, so the robot tracked well until one bend pushed
      the line out of the array''s reach. I accept the Builder''s geometry unchanged:
      sensors at x = ±0.06 and ±0.03 with y = 0.03, 16 mm footprints, and the same
      wheels, body and mass. The controller is kept identical to the baseline (kp
      3.0, ki 0.05, kd 0.3, base_speed 1.2, weights -2 to +2, last_direction) so the
      race isolates the sensing change. The Builder''s own note warns that wider spacing
      flattens the signal near centre. I am not changing kp yet because the baseline
      gave no evidence of oscillation (steering_oscillation 0.13 to 0.24), so there
      is no basis to retune. Expected result, which this race will test: line_loss_events
      falls toward 0 and more trials stay under the 0.06 m limit. If line_loss stays
      at 1 with the wider array, the limit is controller recovery, not span, and I
      will address it next iteration.


      - [Open this output](iteration-1/entity1/versions/10e98cedb3d245418e502bc156cdf7fe/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/0c8a3ea0f35141c89ae65036dc9204d7/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-4d3a709a014e268b/payload.json)'
  - id: entityR1
    label: Span test feedback
    notes: 'Ties the wider-span proposal to iteration 0''s one-line-loss pattern and
      max_error of 0.061 to 0.063 m. Names a 7-sensor fallback and a y = 0.02 offset
      if the next race shows the problem persists.


      ### Feedback


      The Integrator had to make no controller changes for this geometry beyond keeping
      the baseline gains, because the evidence does not show oscillation. Iteration
      0 (entityR2A) gives the key evidence: all 60 trials ended off_track, each with
      exactly one line-loss event, and max_error sat at 0.061 to 0.063 m against the
      0.06 m limit while rms_error stayed near 0.025 m. This means the robot tracked
      well and lost the line at the array''s outer reach. With body_width 0.12 the
      off-track limit is 0.06 m, so the sensor span, not body width, is the binding
      constraint, as your learning notes say. The proposed ±0.06 m span with 16 mm
      footprints is the right direction to test. The main risk is a flatter signal
      near centre, which I have not tuned away because there is no oscillation data
      to justify it. Next steps depend on the next race. If line_loss_events falls
      to 0 and max_error stays under 0.06 m on most trials, keep this span. If line_loss_events
      stays at 1, the span is not the only cause. Then the controller''s recovery
      is the issue, and the 7-sensor 0.02 m array you are considering is the next
      geometry to try. If progress is still low on the slalom, the forward offset
      is the next lever, because iteration 0 shows slalom progress of only 0.09.


      ### Requested changes


      - Keep the ±0.06 m span and 16 mm footprint for this race, since iteration 0
      shows line loss at the array edge with max_error just above 0.06 m.

      - If line_loss_events is still 1 after this race, try a 7-sensor array at x
      = -0.06 to +0.06 in 0.02 m steps with sensor_size 0.012, so the signal stays
      continuous across the wider span.

      - If the robot still reacts late on the slalom (iteration 0 slalom progress
      0.09), try forward offset y = 0.02 with the current span.


      - [Open this output](iteration-1/entityR1/versions/10e98cedb3d245418e502bc156cdf7fe/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/0c8a3ea0f35141c89ae65036dc9204d7/payload.json),
      [entityR2B](iteration-1/entityR2B/versions/carried-4d3a709a014e268b/payload.json)'
