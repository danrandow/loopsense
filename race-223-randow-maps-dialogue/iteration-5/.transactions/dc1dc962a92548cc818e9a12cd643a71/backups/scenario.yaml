map:
  id: race-223-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Revert inertia to
    notes: 'Reverts mass to 0.8 kg and body_length to 0.18 m, keeping sensor y 0.03,
      following the Integrator''s rule after iteration 4 slalom line loss of 0.85.
      Evidence: iteration 4 scored 124.2 but slalom line loss was high, and iteration
      1 with these values had slalom line loss of 0.1.


      ### Rationale


      Iteration 4 (y 0.03, mass 0.7, body_length 0.14, ±0.06 m span, 16 mm footprints)
      scored 124.20, the best so far. Oval line loss was 0 and s-bend 0.15, but slalom
      line loss was 0.85 per run. The Integrator''s stated rule says to revert mass
      to 0.8 and body_length to 0.18 if oval or slalom line loss is 0.2 or higher,
      and the slalom figure is well above that. Iteration 1 used these values with
      y 0.03 and had slalom line loss of 0.1. I am therefore taking the Integrator''s
      advice and reverting mass and body_length, keeping sensor y at 0.03, the ±0.06
      m span, 16 mm footprints, wheel_track 0.12 and wheel_radius 0.03. Iteration
      2 showed that the sensor y 0.02 change raised line loss, so y stays at 0.03.
      The main cost is likely less s-bend progress, because the lower inertia from
      iteration 4 helped there (0.39 against 0.14 in iteration 1). I expect slalom
      line loss near 0.1 and a score in the 112 to 120 range. The best score so far
      (124) came from the lower-inertia design, so this revert is a trade-off, and
      I am making it because the rule is explicit and line loss is the more controllable
      failure. Other Integrator feedback is not yet in view for this design, so I
      am not changing the controller side.


      - [Open this output](iteration-5/entity0/versions/46d2e5bcebbd432289fdad8aaf50f00c/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-3e2830292913a421/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-debb3c2557bf1048/payload.json)'
  - id: entity1
    label: Sensor y back to 0.03
    notes: 'Reverts sensor forward offset to y 0.03 and restores the iteration-1 controller
      gains (kp 3, kd 0.3, base 1.2). Iteration 3 showed the softened controller made
      line loss worse (0.6 and 0.65), so the geometry, not the controller, is the
      cause.


      ### Rationale


      Iteration 3 falsified the controller-only explanation. Softening to kp 3.5 and
      base_speed 1.0 with sensor y 0.02 made line loss worse, not better: 0.6 events
      on oval and 0.65 on slalom, against 0.25 and 0.3 in iteration 2 and 0 and 0.1
      in iteration 1. That geometry is the probable cause, so I am following the revert
      rule I set in iteration 3 and adopting the Builder''s proposal: sensor y back
      to 0.03, keeping mass 0.7 and body_length 0.14. Iteration 1 with y 0.03 had
      zero line loss on oval and 0.1 on slalom, so the sensor forward offset is the
      strongest known line-retention lever. For the controller I am returning to the
      iteration-1 gains (kp 3.0, kd 0.3, ki 0.05, base_speed 1.2, last_direction).
      These were the settings that worked with y 0.03, and they avoid the kd 0.6 and
      kp 4 combination that produced the oscillation seen in iteration 2 on s-bend
      (0.28). The mass and body change lowers yaw inertia, which is why I keep base_speed
      at 1.2 rather than cutting it. Expected result, not yet measured: line loss
      near 0 to 0.1 on oval and slalom, with the score near the iteration-1 and iteration-2
      range. max_error is likely to stay near 0.063 m, which would point to turn authority
      (wheel_track) rather than sensing. The wheel_track change is not made here,
      so this race isolates the sensor y revert against the iteration-1 controller.


      - [Open this output](iteration-4/entity1/versions/51a8c1850b91464990ec6402ce8379f9/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/68295dc8c44e495497bfe5ee53558a12/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-1a847c5b527d9a52/payload.json)'
  - id: entityR1
    label: Revert y, then wheel
    notes: 'Supports the Builder''s y 0.03 revert, since iteration 3 ruled out the
      controller and iteration 1 had near-zero line loss at y 0.03. Gives a conditional
      path: revert mass and body_length if line loss stays high, or try wheel_track
      0.10 if max_error stays near 0.063.


      ### Feedback


      Iteration 3 (entityR2B, 97.74) settles the question I could not answer before.
      I softened the controller (kp 3.5, base_speed 1.0) on the iteration-2 geometry,
      and line loss got worse: 0.6 per run on oval and 0.65 on slalom, against 0.25
      and 0.3 in iteration 2 and 0 and 0.1 in iteration 1 (entityR2B, 111.80, y 0.03).
      Softening the controller did not help, so the sensor y 0.02 change and the lower
      inertia from iteration 2 are the likely cause, as your rationale suggested.
      Iteration 1 is the strongest evidence: sensors at y 0.03 gave zero line loss
      on oval and 0.1 on slalom with mass 0.8 and body_length 0.18. Your proposed
      revert (y 0.03, mass 0.7, body_length 0.14) keeps the inertia gain that helped
      s-bend progress (0.39 in iteration 2 against 0.14 in iteration 1), so I support
      it. The current candidate has not raced, so I state no outcome for it. Next
      steps depend on the race. If line loss on oval and slalom falls to 0.1 or below
      and max_error stays near 0.063 m, the limit is turn authority, so try wheel_track
      0.10 next. If line loss stays at 0.2 or higher even at y 0.03, the mass and
      body_length reduction is the cause, so return to mass 0.8 and body_length 0.18
      (the iteration-1 values) and keep y 0.03.


      ### Requested changes


      - Keep sensor y at 0.03 with mass 0.7, body_length 0.14, the ±0.06 m span and
      16 mm footprints, as proposed. Iteration 3 ruled out the controller as the line-loss
      cause.

      - If line_loss_events on oval or slalom is 0.2 or higher after this race, revert
      mass to 0.8 and body_length to 0.18, the iteration-1 values, keeping sensor
      y at 0.03.

      - If line loss returns near 0 but max_error stays at about 0.063 m, try wheel_track
      0.10 to raise turn rate per unit of wheel differential. Do not add sensors:
      line loss is controllable at this span.


      - [Open this output](iteration-4/entityR1/versions/51a8c1850b91464990ec6402ce8379f9/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/68295dc8c44e495497bfe5ee53558a12/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-1a847c5b527d9a52/payload.json)'
