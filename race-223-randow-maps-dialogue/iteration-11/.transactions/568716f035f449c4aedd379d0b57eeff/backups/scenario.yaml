overrides:
  entities:
  - id: entity0
    label: 'Final: midpoint inertia'
    notes: 'Keeps the iteration 10 geometry unchanged (mass 0.75, body_length 0.16,
      wheel_track 0.12), the best raced design at 146.27. Slalom line loss was 0.0,
      which meets the Integrator''s rule not to reduce inertia further, and wheel_track
      0.10 and mass 0.7 stay excluded by the iteration 4 and 6-8 results.


      ### Rationale


      Iteration 10 raced the midpoint inertia (mass 0.75, body_length 0.16) on the
      wheel_track 0.12 platform and scored 146.27, the best of the run and 34.5 above
      iteration 9''s reproduced baseline of 111.80. Oval progress rose to 0.597 with
      3 of 20 runs finishing. Slalom line loss was 0.0, and s-bend progress was 0.146
      with no line loss. The Integrator''s stated rule was: if slalom line loss is
      0.1 or below, do not go lower on inertia. That condition holds at 0.0, so I
      am not reducing inertia further. The Integrator''s other suggestion, a controller-only
      change, is theirs to make, and I am not changing the platform again. Iterations
      6 to 8 showed that wheel_track 0.10 was worse at every gain, and iteration 4
      showed that mass 0.7 with body_length 0.14 drove slalom line loss to 0.85, so
      both stay excluded. Max_error stayed at 0.061 to 0.066 m across every geometry,
      which points to the run-ending threshold rather than a geometry lever. This
      is the final iteration, and the unseen-track race is scored on whatever I deliver.
      The best-measured geometry is the safest choice, so I am keeping iteration 10
      unchanged. I did not take a new geometry risk, since no evidence supports one.


      - [Open this output](iteration-11/entity0/versions/adc0bd5a75f14be3a6e189d3e305e51a/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-3c79c5cfee76eac3/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-31e90c86e5bfa039/payload.json)'
  - id: entity1
    label: Midpoint inertia test
    notes: 'Mass 0.75 and body_length 0.16 on the 111.80 platform (wheel_track 0.12)
      with the controller unchanged. Iteration 9 reproduced the baseline, and iteration
      4 showed that lower inertia raised progress but also slalom line loss to 0.85,
      so this tests the middle ground.


      ### Rationale


      Iteration 9 reproduced the iteration-5 platform (wheel_track 0.12, mass 0.8,
      body_length 0.18, sensors at y 0.03 with a 0.06 m span, 16 mm footprints) and
      scored 111.80, with slalom line loss 0.10. That confirms the platform and the
      controller (kp 3.0, kd 0.3, ki 0.05, base_speed 1.2, last_direction) as the
      reference. Iteration 4 showed that lower inertia (mass 0.7, body_length 0.14)
      gave the best progress (oval 0.53, s-bend 0.20, score 124.20) but slalom line
      loss of 0.85. Iterations 6 to 8 showed that wheel_track 0.10 cost progress and
      line retention at every kp tried. The Builder''s iteration-10 geometry is the
      midpoint inertia test I recommended: mass 0.75 and body_length 0.16, with everything
      else unchanged. Yaw inertia m(L²+W²)/12 is about 0.00250 at the midpoint, between
      0.00312 at the baseline and 0.00198 at iteration 4. I expect some of the progress
      gain to return while slalom line loss stays under the 0.2 stop rule. The controller
      stays exactly as the iteration-9 reference, so this race isolates inertia. I
      am not retuning gains, because every gain change so far was confounded with
      a geometry change or raised line loss. Expected result, not measured: slalom
      line loss between 0.1 and 0.2, oval progress above 0.55, and a score near 112
      to 125.


      - [Open this output](iteration-10/entity1/versions/9e8587be5a694c5e98257b9dd58377c9/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/851ff90a42b340d4acae89a48ce883c5/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-866677a8630c28cf/payload.json)'
  - id: entityR1
    label: Stop rule and next lever
    notes: 'Feedback keeps the 0.12 track, sets a slalom line-loss stop at 0.2 for
      inertia, and hands off to a controller-only test if line loss stays at 0.1 or
      below. It rests on iterations 4, 6 to 8 and 9.


      ### Feedback


      Written before this candidate has raced, so no outcome is claimed for it. Iteration
      9 (entityR2B, 111.80) confirms the wheel_track 0.12 platform with slalom line
      loss 0.10, so the baseline is reliable. Iterations 6 to 8 (entityR2B, 72.91,
      79.60, 77.55) show that wheel_track 0.10 is worse at every kp tried (2.5, 2.75,
      3.0): oval progress fell from 0.55 to 0.28 to 0.30, and slalom line loss was
      0.35 at kp 3.0. So keep 0.12. Iteration 4 (entityR2B, 124.20) shows that lower
      inertia gave the best progress, oval 0.53 and s-bend 0.20, but slalom line loss
      of 0.85. The midpoint you proposed (mass 0.75, body_length 0.16) is the next
      inertia step, and the race decides the next move. max_error has stayed at 0.061
      to 0.066 m across all nine races, so do not treat it as a tuning target. The
      run-ending threshold is the more likely cause.


      ### Requested changes


      - Keep wheel_track 0.12 and the 0.06 m sensor span with 16 mm footprints. Do
      not return to wheel_track 0.10 (iterations 6 to 8).

      - If slalom line_loss_events is 0.2 or higher after this race, revert to mass
      0.8 and body_length 0.18 and stop reducing inertia, since iteration 4 showed
      0.85 at lower inertia.

      - If slalom line loss is 0.1 or below, do not go lower on inertia. Next test
      a controller-only change, such as a small base_speed increase, so that progress
      rises without changing the platform again.


      - [Open this output](iteration-10/entityR1/versions/9e8587be5a694c5e98257b9dd58377c9/payload.json)

