map:
  id: race-223-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Narrower track 0.10 m
    notes: 'Keeps the iteration-5 platform (mass 0.8, body_length 0.18, y 0.03, 0.06
      m span) and narrows wheel_track from 0.12 to 0.10 m, as the Integrator advised
      once slalom line loss was near 0.1 and max_error stayed at about 0.063 m. Narrower
      track raises turn rate per unit of wheel differential, which is the test for
      the remaining max_error.


      ### Rationale


      Iteration 5 reverted mass to 0.8 and body_length to 0.18 with sensor y 0.03
      and the 0.06 m span. It scored 111.80, matching iteration 1. Slalom line loss
      fell from 0.85 to 0.10, which confirms that the reduced inertia from iteration
      4 caused the slalom line loss. The cost was the s-bend and oval progress gain
      from lower inertia. The Integrator''s rule for this case is to hold the geometry
      and, if line loss is near 0.1 while max_error stays near 0.063 m, to test wheel_track
      0.10. Both conditions hold: slalom line loss is 0.10, and max_error on slalom
      is 0.0636 m, still above the 0.06 m off-track limit. I am taking that advice.
      Turn rate per unit of wheel differential scales with 1/wheel_track, so narrowing
      the track from 0.12 to 0.10 m gives about 20 percent more turn authority at
      the same controller output. I keep the sensors (five at x = -0.06 to +0.06,
      y 0.03, 16 mm), mass 0.8, body_length 0.18, body_width 0.12 and wheel_radius
      0.03 unchanged, so this race isolates the track change. The expected result
      is max_error below 0.06 m on more trials, with line loss staying near 0.1. The
      risk is that higher turn authority increases steering oscillation on the slalom,
      which I will watch. The mass 0.7 alternative from the Integrator stays in reserve.
      I am not adding sensors, because line loss is controllable at this span.


      - [Open this output](iteration-6/entity0/versions/2d8e835ff74d475487d6af452bfbb41d/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-9b9e208fe92a7fdc/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-866677a8630c28cf/payload.json)'
  - id: entity1
    label: Track 0.10 test, same
    notes: 'Narrows wheel_track from 0.12 to 0.10 m for about 20 percent more turn
      authority, with the iteration-5 controller held fixed to isolate that change.
      Based on iteration 5 showing max_error of 0.062 to 0.064 m with slalom line
      loss at 0.10.


      ### Rationale


      Iteration 5 (the iteration-1 geometry with the iteration-4 controller, 111.80)
      left max_error at 0.0616 to 0.0636 m on all tracks, still above the 0.06 m off-track
      limit. Slalom line loss was 0.10, so line retention is controllable at this
      inertia (mass 0.8, body_length 0.18). Iteration 4 showed that lower inertia
      (mass 0.7, body_length 0.14) pushed slalom line loss to 0.85, so inertia stays
      at the iteration-1 values. The Builder''s geometry for this race changes only
      wheel_track, from 0.12 to 0.10 m. Turn rate per unit of wheel differential scales
      with 1/wheel_track, so this raises turn authority by about 20 percent at the
      same controller output. I keep the controller identical to iteration 5 (kp 3.0,
      ki 0.05, kd 0.3, base_speed 1.2, weights -2 to +2, last_direction). That isolates
      the track change, and the effective loop gain rises by about 20 percent, which
      I expect to show up as lower max_error and possibly slightly higher steering_oscillation.
      I am not adjusting kp to compensate, because iteration 2 (kp 4) showed that
      higher gain raised line loss, and I want this race to test the Builder''s track
      hypothesis cleanly. Expected result, not yet measured: max_error nearer 0.06
      m on more trials, with slalom line loss staying near 0.1 or below. If line loss
      rises, the higher turn authority is the cause and I will reduce kp.


      - [Open this output](iteration-6/entity1/versions/75b4f4799bb24d62a048ecbe6fb13d70/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/2d8e835ff74d475487d6af452bfbb41d/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-866677a8630c28cf/payload.json)'
  - id: entityR1
    label: Track 0.10 then mass step
    notes: 'Supports the wheel_track 0.10 test because max_error has stayed near 0.063
      m across every iteration while line loss is controllable at the iteration-1
      inertia. Gives conditional next steps based on slalom line loss and max_error.


      ### Feedback


      The evidence supports the wheel_track change as the next test. Iteration 5 (entityR2B,
      111.80) had slalom line loss of 0.10 and max_error of 0.0636 m, so line retention
      is under control at mass 0.8 and body_length 0.18, and the remaining failure
      is tracking at the limit. Iterations 1 to 5 all show max_error between 0.061
      and 0.066 m, so the error is not moving with sensing or inertia, which points
      to turn authority. Iteration 4 (entityR2B, 124.20) showed that lowering inertia
      (mass 0.7, body_length 0.14) raised slalom line loss to 0.85, so inertia should
      not go lower on the slalom track without a line-loss check. I cannot state an
      outcome for the current candidate, which has not raced. Next steps depend on
      the next race. If max_error falls toward 0.06 m with line loss at or below 0.1,
      keep wheel_track 0.10 and consider a mass-only reduction to 0.7 with body_length
      0.18, which cuts yaw inertia by about 12 percent (a smaller step than iteration
      4''s roughly 37 percent cut). If line loss rises to 0.2 or more on slalom, the
      higher turn authority is destabilising the line, so the next step is to hold
      the geometry and reduce kp rather than change the array. If max_error stays
      near 0.063 m with line loss near 0.1, the limit is gain balance, not geometry,
      and I will say so in the next request.


      ### Requested changes


      - Keep wheel_track at 0.10 with the iteration-5 inertia (mass 0.8, body_length
      0.18) and sensors unchanged, so this race isolates the track change.

      - If slalom line_loss_events is 0.2 or higher after this race, hold the geometry
      and let the Integrator reduce kp. Do not change sensors.

      - If max_error falls below about 0.062 m with line loss at or below 0.1, try
      mass 0.7 with body_length 0.18 as a smaller inertia step than iteration 4.


      - [Open this output](iteration-6/entityR1/versions/75b4f4799bb24d62a048ecbe6fb13d70/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/2d8e835ff74d475487d6af452bfbb41d/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-866677a8630c28cf/payload.json)'
