  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: kd damping 0.05 to 0.30
    notes: 'Baseline never finished and left the track on all 60 trials (max_error
      about 0.06 m, one line loss each), with low oscillation, so the controller is
      under-damped. This candidate changes only kd, raising it from 0.05 to 0.30 to
      test whether derivative damping keeps the robot on the line.


      ### Rationale


      Evidence: the baseline ran 60 trials across three tracks and never finished.
      Every run ended off track, with max_error about 0.060 m (the off-track limit
      here is max(0.06, 0.0125 + 0.12/4) = 0.06 m). Each run also had one line-loss
      event, and progress was only 0.04 to 0.12. The robot is therefore losing the
      line on the first hard bend and then drifting out. Steering oscillation is low
      (0.06 to 0.07), so the robot is not jittering. The problem is an under-damped,
      slow correction on bends, not chatter. The reviewer''s first-race checks point
      the same way: kd = 0.05 contributes almost nothing, so the controller has no
      derivative damping.


      Change: kd from 0.05 to 0.30, as the reviewer requested for damping. kp (4.0),
      ki (0.05), base_speed (1.6), sensor layout, weights and line_loss (last_direction)
      are all unchanged, so this race isolates the effect of derivative damping. I
      am deliberately not lowering kp yet. The oscillation metric is low, so there
      is no sign of over-steering.


      Expected result: the robot should hold the line through the bends and the line-loss
      count should drop to 0 or near it on at least one track. Overshoot should fall,
      and max_error should drop below 0.06 on some tracks. If the robot still leaves
      the track, the next step is to test base_speed 1.3 to 1.5, and then increase
      kp only if the error grows on sharp bends. If line-loss events remain, test
      line_loss = search_right or search_left.


      Hypotheses to check in the race telemetry: (1) kd = 0.3 cuts max_error and line-loss
      events. (2) Completion time is still around 2.5 s or better once the robot finishes.
      (3) steering_oscillation stays below about 0.15, showing that the extra damping
      does not introduce new jitter. Measurements requested: completion, progress,
      completion_time, max_error, rms_error and line_loss_events, which are the signals
      needed to choose the next change.


      - [Open this output](iteration-1/entity0/versions/273d343481244cdc9a51123d2384e4ef/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-8e0dac71274b1cad/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-da854680ae4303d4/payload.json)'
  - id: entityR1
    label: Approve kd 0.30 test
    notes: 'Approved the single-variable change kd 0.05 to 0.30 to test derivative
      damping. Baseline runs (60 trials) all went off track at max_error about 0.060
      m with one line-loss event each, so damping is the first lever to test. Feedback
      lists next steps depending on the race telemetry.


      ### Feedback


      This candidate changes one thing from the baseline: kd goes from 0.05 to 0.30.
      The baseline evidence (iteration 0, 60 trials across oval, s-bend and slalom)
      supports the change. Every run went off track, with max_error about 0.060 to
      0.061 m, against an off-track limit of 0.06 m. Each run also had exactly one
      line-loss event, and progress was only 0.035 to 0.115. Steering oscillation
      was low (0.064 to 0.074), so the baseline was not jittering. It was slow to
      correct on bends, which points to missing derivative damping. kd = 0.05 times
      the rate of change of the signal is close to nothing, so this is a sound test.
      kp, ki, base_speed, sensor layout, weights and line_loss are all unchanged,
      so the race isolates the effect of kd. I checked the geometry and sign conventions:
      sensor weights run -1 to +1 from right to left, and the signal and wheel equations
      are consistent. The candidate is valid and is a clear improvement in exploration
      value over the baseline, so I approve it to race. Read the telemetry for the
      next step. (a) If max_error falls below 0.06 and line_loss_events drops, keep
      kd and test base_speed 1.8 to see whether speed can rise while the robot stays
      on the line. (b) If the robot still leaves the track with line_loss_events still
      at 1, test line_loss = search_right or search_left, since last_direction did
      not recover the line on any baseline track. (c) If steering_oscillation rises
      well above 0.15, kd is too aggressive for the 10 ms loop. Then try kd about
      0.15 before lowering kp. If the robot completes but completion_time is above
      2.5 s, raise base_speed in steps of about 0.2. Change one field group at a time
      so each effect stays attributable.


      ### Requested changes


      - If the robot still goes off track with line_loss_events at 1, change line_loss
      from last_direction to search_right or search_left. Baseline: last_direction
      gave exactly one line-loss event per run on all three tracks.

      - If max_error falls below 0.06 but progress or completion stays low, raise
      base_speed from 1.6 to about 1.8 with kd at 0.30. Baseline: progress was only
      0.04 to 0.12, so pace is a possible limit once the line is held.

      - If steering_oscillation rises well above the baseline 0.06 to 0.07 (for example
      above 0.15), reduce kd to about 0.15 and keep kp at 4.0. Baseline: kd was 0.05,
      so 0.30 is a six-fold change and could over-damp or add jitter.


      - [Open this output](iteration-1/entityR1/versions/4a233f2024dc438995dc7cef6b2ab677/payload.json)

