map:
  id: race-172-opt-eval
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Speed 0.9 test on iter 6
    notes: 'Iteration 6 design with base_speed lowered from 1.0 to 0.9, the only untested
      lever with a consistent oval trend (progress rose as speed fell from 1.4 to
      1.0). Iteration 9 reproduced the 85.60 baseline, so iteration 6 remains the
      fallback if this race is worse.


      ### Rationale


      Evidence: iteration 6 (base_speed 1.0, kd 0.30, kp 4.0, ki 0.05, sensors at
      ±0.05 m with 16 mm footprints, search_left) is the best raced design at 85.60.
      Iteration 9 reproduced it exactly, so the result is stable. Oval progress is
      0.3425 with 0 line losses. Oval max_error is about 0.062, just over the 0.06
      m limit. Each of s-bend and slalom still loses the line once per run. Across
      iterations 5 to 6, cutting speed from 1.4 to 1.2 to 1.0 raised oval progress
      (0.137, 0.318, 0.3425), and the gain is flattening. Iteration 7 (kd 0.20) and
      iteration 8 (±0.08 m spread) both hurt, so damping and sensing span should stay
      fixed.


      Change: base_speed from 1.0 to 0.9, with every other field at its iteration
      6 value. This is the one lever with a consistent trend that has not yet been
      tested. Lower entry speed should reduce oval peak error, so the expected result
      is oval progress near or above 0.34 and oval max_error below 0.06. The risk
      is that progress falls if 0.9 is too slow. Iteration 6 stays as the fallback,
      and it can be re-approved if this race is worse.


      Hypotheses: (a) base_speed 0.9 keeps oval progress at or above about 0.33 with
      0 oval line losses; (b) oval max_error falls below 0.06 on more seeds; (c) s-bend
      and slalom remain at about 0.16 and 0.11 progress with 1 line loss each, since
      speed is not their limit. Measurements requested: all, with focus on oval progress
      and max_error, and on s-bend and slalom line-loss events.


      - [Open this output](iteration-10/entity0/versions/94ce5f5646414f18a2e7e66a6b8aa64f/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-83384807bc71cd15/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-9d0c0724b36b7402/payload.json)'
  - id: entityR1
    label: Approve speed 0.9 test
    notes: 'Approved one change from the best raced design (iteration 6, 85.60, reproduced
      in iteration 9): base_speed 1.0 to 0.9, all else unchanged. Oval progress gains
      have flattened as speed fell (0.137, 0.318, 0.3425) and oval max_error stays
      just over the 0.06 limit, so this is the untested lever for it; iteration 6
      remains the fallback.


      ### Feedback


      Decision: approve. This candidate changes one field from the best raced design
      (iteration 6, score 85.60, reproduced exactly in iteration 9): base_speed 1.0
      to 0.9. Geometry, kp 4.0, ki 0.05, kd 0.30, sensor weights (±0.05 m, 16 mm)
      and line_loss search_left are unchanged.


      Why the test is sound: oval progress rose 0.137 (speed 1.4, iteration 4), 0.318
      (speed 1.2, iteration 5), then 0.3425 (speed 1.0, iteration 6). The gain is
      flattening, so the next step down is the untested lever for oval max_error,
      which has stayed at 0.0605 to 0.0626 across iterations 3 to 6, just over the
      0.06 m limit. Iteration 8 showed that changing sensing span can hurt sharply,
      and iteration 7 showed that lowering kd cut oval progress, so neither is the
      next change. s-bend and slalom have shown one line-loss event per run under
      every recovery direction and speed tried (iterations 0 to 6), so speed is not
      their limit and I do not expect this race to change them.


      What I do not know: whether 0.9 is too slow to hold oval progress. Do not treat
      this candidate as better than iteration 6 until the race shows it. Iteration
      6 stays the fallback, and it can be re-approved in the next iteration.


      How to read the race: (a) If oval progress stays at or above about 0.33 and
      oval max_error falls below 0.06 with 0 oval line losses, keep base_speed 0.9
      as the new best. (b) If oval progress falls well below 0.3425 while max_error
      stays near 0.06, speed 0.9 is too slow; re-approve iteration 6 (base_speed 1.0)
      and stop lowering speed. (c) If the oval holds but max_error is still at or
      above 0.06 with steering_oscillation above 0.15, the next lever is kd 0.25,
      changed alone. Because this is iteration 10 of 12, with one iteration left after
      it, use the next review to decide between the best of 0.9 and 1.0 and approve
      that one.


      ### Requested changes


      - If oval progress holds at or above about 0.33 at base_speed 0.9 with oval
      max_error below 0.06, keep 0.9 as the best design and approve it again next
      iteration. Evidence: speed 1.0 gave progress 0.3425 and speed 1.2 gave 0.318,
      so the trend is flattening, not reversing.

      - If oval progress falls well below 0.3425 at base_speed 0.9, return base_speed
      to 1.0 with every other field unchanged and re-approve iteration 6 (score 85.60,
      reproduced in iteration 9). Evidence: iteration 6 is the best raced result and
      its repeat was identical.

      - Do not change the sensor layout again. Iteration 8 (spread ±0.08 m) cut oval
      progress to 0.2039 and collapsed s-bend and slalom, while s-bend and slalom
      have shown one line loss per run under every recovery direction and speed tried.


