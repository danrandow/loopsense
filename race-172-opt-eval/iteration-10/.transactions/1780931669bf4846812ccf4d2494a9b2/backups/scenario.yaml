map:
  id: race-172-opt-eval
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Speed 0.9 test on iter 6
    notes: 'Iteration 6 design with base_speed lowered from 1.0 to 0.9, the only untested
      lever with a consistent oval trend (progress rose as speed fell from 1.4 to
      1.0). Iteration 9 reproduced the 85.60 baseline, so iteration 6 remains the
      fallback if this race is worse.


      ### Rationale


      Evidence: iteration 6 (base_speed 1.0, kd 0.30, kp 4.0, ki 0.05, sensors at
      ±0.05 m with 16 mm footprints, search_left) is the best raced design at 85.60.
      Iteration 9 reproduced it exactly, so the result is stable. Oval progress is
      0.3425 with 0 line losses. Oval max_error is about 0.062, just over the 0.06
      m limit. Each of s-bend and slalom still loses the line once per run. Across
      iterations 5 to 6, cutting speed from 1.4 to 1.2 to 1.0 raised oval progress
      (0.137, 0.318, 0.3425), and the gain is flattening. Iteration 7 (kd 0.20) and
      iteration 8 (±0.08 m spread) both hurt, so damping and sensing span should stay
      fixed.


      Change: base_speed from 1.0 to 0.9, with every other field at its iteration
      6 value. This is the one lever with a consistent trend that has not yet been
      tested. Lower entry speed should reduce oval peak error, so the expected result
      is oval progress near or above 0.34 and oval max_error below 0.06. The risk
      is that progress falls if 0.9 is too slow. Iteration 6 stays as the fallback,
      and it can be re-approved if this race is worse.


      Hypotheses: (a) base_speed 0.9 keeps oval progress at or above about 0.33 with
      0 oval line losses; (b) oval max_error falls below 0.06 on more seeds; (c) s-bend
      and slalom remain at about 0.16 and 0.11 progress with 1 line loss each, since
      speed is not their limit. Measurements requested: all, with focus on oval progress
      and max_error, and on s-bend and slalom line-loss events.


      - [Open this output](iteration-10/entity0/versions/94ce5f5646414f18a2e7e66a6b8aa64f/payload.json)

      - Based on: [entityR1](iteration-10/entityR1/versions/carried-83384807bc71cd15/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-9d0c0724b36b7402/payload.json)'
  - id: entityR1
    label: Approve best-known design
    notes: 'Approves the iteration 6 design (85.60, best raced), reverting the failed
      ±0.08 m sensor spread from iteration 8 (which cut oval progress to 0.2039).
      Feedback is written without any outcome claim, and it sets speed 0.9 as the
      next single-lever test, based on oval progress rising from 0.137 to 0.3425 as
      speed fell from 1.4 to 1.0.


      ### Feedback


      Decision: approve. The candidate is identical to iteration 6, the best raced
      design (85.60). Its sensor spread is reverted from the iteration 8 test (±0.08
      m, rejected because it cut the oval to 0.2039 progress and collapsed s-bend
      and slalom). The only other evidence needed is that iteration 6 is the best
      design raced so far, so this is a reproduction and not a new gamble. Approving
      it banks a known score this iteration, and the iteration 8 result shows that
      widening the span can hurt sharply.


      No outcome is claimed for this race. The expectation is near 85.6, with oval
      line losses at 0 and oval progress near 0.34, as in iteration 6. Oval max_error
      (about 0.062, from iteration 6) and the single line loss each on s-bend and
      slalom (every recovery direction and speed tried so far, iterations 0 to 6)
      are still open problems.


      What to do with the next iteration, depending on what this race shows:

      (a) If the race reproduces about 85.6, the controller and sensing are stable.
      The next test should move one lever at a time. The best-supported untested lever
      is base_speed. Speed 1.4 gave oval progress 0.137, 1.2 gave 0.318 and 1.0 gave
      0.3425, so the gain is flattening but not finished. Try base_speed 0.9 with
      all else at iteration 6 values, and keep it only if oval progress holds and
      oval max_error drops below 0.06.

      (b) If the race falls well below 85.6, the cause is probably run-to-run variance
      on the oval. Do not change the sensors again. Revisit kd only with a small step
      (0.25) and check that progress stays near 0.34.

      (c) Leave the fifth forward sensor idea for later. Weight-0 sensors dilute the
      reading sum, and iteration 8 shows sensing changes can hurt sharply, so that
      test should only run if the speed test has stalled.


      ### Requested changes


      - If this race reproduces about 85.6 (oval progress near 0.34, 0 oval line losses),
      next test controller.base_speed at 0.9 with all other fields at iteration 6
      values. Evidence: oval progress went 0.137 (speed 1.4), 0.318 (speed 1.2), 0.3425
      (speed 1.0), so speed is still the lever with the largest effect on the oval,
      and oval max_error stayed at 0.0605 to 0.0626 across these runs.

      - If the race falls well below 85.6, do not change the sensors or the controller.
      Re-approve the iteration 6 design and test kd 0.25 alone, since kd 0.20 cut
      oval progress to 0.115 (iteration 7) and kd 0.30 gave the best oval progress
      so far (0.3425).


      - [Open this output](iteration-9/entityR1/versions/f8bd56d6c91f47689ba5ddaaa6104866/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/001089bd76774c2bb36693b4134df61e/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-8107e2536cddc077/payload.json)'
