map:
  id: race-172-opt-eval
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Speed 1.0 on iter-5 base
    notes: 'Keeps the best raced design (iteration 5, score 81.8) and lowers base_speed
      from 1.2 to 1.0 alone, to bring oval max_error under the 0.06 m limit while
      oval progress was 0.318. Other fields are unchanged, and s-bend and slalom still
      lose the line once, so their recovery direction and layout are left as they
      are.


      ### Rationale


      Evidence: iteration 5 (base_speed 1.2, line_loss search_left) is the best raced
      design so far at 81.82, up from 56.11. Oval progress rose from 0.137 to 0.318
      and oval line-loss events fell to 0.15. Oval max_error is still 0.0626 on average,
      over the 0.06 m off-track limit, and the score spread (54 to 141) shows some
      oval seeds leave the track and others run far. On s-bend and slalom, line_loss_events
      stayed at 1 with search_left, and progress barely moved (0.1615 and 0.110).
      So the search direction is not the limiting factor on those tracks, and search_left
      is kept. Steering oscillation on the oval is 0.183, above the 0.15 guide.


      Change: base_speed 1.2 to 1.0, with everything else unchanged (geometry, kp
      4.0, ki 0.05, kd 0.30, sensor weights, search_left). The speed drop from 1.4
      to 1.2 gave the largest gain on the oval, and the oval max_error is the one
      thing blocking that gain from scoring. Slower entry into the corners should
      reduce the peak lateral error. I am changing one group only so the effect stays
      attributable.


      Expected result: oval max_error falls below 0.06 on more seeds, with line-loss
      events at 0 or near it, and oval progress at or above 0.318. Hypotheses: (a)
      speed 1.0 keeps oval max_error under 0.06; (b) s-bend and slalom progress stay
      near 0.16 and 0.11, since speed is not their limit; (c) if oval progress falls
      below 0.318, speed is too low and the best value is between 1.0 and 1.2. Next,
      if oscillation on the oval stays above 0.15 and max_error is still at or above
      0.06, reduce kd to about 0.20 before changing kp. If s-bend and slalom still
      show one line loss, the next test is a different sensor layout (for example
      a wider spread or a fifth sensor forward) rather than the recovery direction.


      - [Open this output](iteration-6/entity0/versions/02a9a415269c4e6daa7e90bec269814f/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-068a906aa2f4d28b/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-866a5c6e6b0b80f6/payload.json)'
  - id: entityR1
    label: 'Approve: speed 1.0 test'
    notes: 'Approved the single-group change base_speed 1.2 to 1.0 on the best raced
      design (iteration 5, 81.82) to test whether slower entry keeps the oval max_error
      under 0.06. Feedback sets next steps by oval progress, oscillation and s-bend/slalom
      line losses.


      ### Feedback


      Decision: approve. This candidate changes one field group from the best raced
      design (iteration 5, score 81.82): base_speed 1.2 to 1.0. Geometry, kp 4.0,
      ki 0.05, kd 0.30, sensor weights and line_loss search_left are unchanged. The
      evidence supports the test. Oval max_error has been 0.0605 to 0.0626 across
      iterations 3 to 5, just over the 0.06 m off-track limit, and iteration 5 showed
      the largest oval gain from the speed drop (progress 0.137 to 0.318). Oval line-loss
      events fell to 0.15 with search_left. On s-bend and slalom, line_loss_events
      stayed at 1 under every recovery direction tried, and progress barely moved,
      so speed is not their limiting factor. Steering oscillation on the oval was
      0.183 in iteration 5, above the 0.15 guide. We are in mid-run with 5 iterations
      left, and this candidate is valid and isolates speed, so racing it gives the
      most useful telemetry. Do not assume it beats iteration 5 until the race shows
      it. Read the next race as follows. (a) If oval progress stays at or above 0.318
      and oval max_error falls below 0.06, keep base_speed 1.0. (b) If oval progress
      falls well below 0.318, speed 1.0 is too slow; return to 1.1 or 1.2 and test
      a different lever. (c) If oval steering_oscillation stays above 0.15 while max_error
      is still at or above 0.06, reduce kd to about 0.20 before changing kp. (d) If
      s-bend or slalom still show one line-loss event, change the sensor layout (a
      wider spread or a forward fifth sensor) rather than the recovery direction.


      ### Requested changes


      - If oval progress falls below 0.318 at base_speed 1.0 (iteration 5 value at
      1.2), set base_speed to about 1.1 and keep kd 0.30 and search_left, so speed
      is tuned between 1.0 and 1.2 without changing steering.

      - If oval max_error stays at or above 0.06 with steering_oscillation above 0.15
      at base_speed 1.0, reduce controller.kd from 0.30 to about 0.20 with all other
      fields fixed. Evidence: iteration 5 oval oscillation was 0.183 at kd 0.30, and
      iteration 1 showed kd 0.30 raised oscillation above 0.15.

      - If s-bend or slalom line_loss_events stay at 1 after this race, change the
      sensor layout (for example a fifth sensor forward at y 0.06, or a wider spread)
      with the speed and recovery direction held fixed. Evidence: line_loss stayed
      at 1 with last_direction (iterations 0 to 3) and search_right (iteration 4)
      on those tracks.


      - [Open this output](iteration-6/entityR1/versions/4842399d66e449e9807b6444e6fd1466/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/02a9a415269c4e6daa7e90bec269814f/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-866a5c6e6b0b80f6/payload.json)'
