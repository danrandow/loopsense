map:
  id: race-172-opt-eval
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Speed 1.0 on iter-5 base
    notes: 'Keeps the best raced design (iteration 5, score 81.8) and lowers base_speed
      from 1.2 to 1.0 alone, to bring oval max_error under the 0.06 m limit while
      oval progress was 0.318. Other fields are unchanged, and s-bend and slalom still
      lose the line once, so their recovery direction and layout are left as they
      are.


      ### Rationale


      Evidence: iteration 5 (base_speed 1.2, line_loss search_left) is the best raced
      design so far at 81.82, up from 56.11. Oval progress rose from 0.137 to 0.318
      and oval line-loss events fell to 0.15. Oval max_error is still 0.0626 on average,
      over the 0.06 m off-track limit, and the score spread (54 to 141) shows some
      oval seeds leave the track and others run far. On s-bend and slalom, line_loss_events
      stayed at 1 with search_left, and progress barely moved (0.1615 and 0.110).
      So the search direction is not the limiting factor on those tracks, and search_left
      is kept. Steering oscillation on the oval is 0.183, above the 0.15 guide.


      Change: base_speed 1.2 to 1.0, with everything else unchanged (geometry, kp
      4.0, ki 0.05, kd 0.30, sensor weights, search_left). The speed drop from 1.4
      to 1.2 gave the largest gain on the oval, and the oval max_error is the one
      thing blocking that gain from scoring. Slower entry into the corners should
      reduce the peak lateral error. I am changing one group only so the effect stays
      attributable.


      Expected result: oval max_error falls below 0.06 on more seeds, with line-loss
      events at 0 or near it, and oval progress at or above 0.318. Hypotheses: (a)
      speed 1.0 keeps oval max_error under 0.06; (b) s-bend and slalom progress stay
      near 0.16 and 0.11, since speed is not their limit; (c) if oval progress falls
      below 0.318, speed is too low and the best value is between 1.0 and 1.2. Next,
      if oscillation on the oval stays above 0.15 and max_error is still at or above
      0.06, reduce kd to about 0.20 before changing kp. If s-bend and slalom still
      show one line loss, the next test is a different sensor layout (for example
      a wider spread or a fifth sensor forward) rather than the recovery direction.


      - [Open this output](iteration-6/entity0/versions/02a9a415269c4e6daa7e90bec269814f/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-068a906aa2f4d28b/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-866a5c6e6b0b80f6/payload.json)'
  - id: entityR1
    label: 'Approve: speed 1.2'
    notes: 'Approved a two-field test on the iteration 4 best design (56.11): base_speed
      1.4 to 1.2 for the oval max_error of 0.0605, and line_loss search_right to search_left
      for the persistent single line loss on s-bend and slalom. Feedback sets read-out
      rules for each track so the race separates the two effects.


      ### Feedback


      Decision: approve. This candidate is valid and changes only two fields from
      the best raced design (iteration 4, score 56.11): base_speed 1.4 to 1.2 and
      line_loss search_right to search_left. Geometry, kp, ki, kd and sensor weights
      are unchanged. The evidence supports both changes as tests. (1) Oval max_error
      was 0.0605 in iteration 4, just over the 0.06 m off-track limit, with 0 line-loss
      events and progress 0.137. Speed was 1.4 in iterations 3 and 4, and oval max_error
      has stayed at 0.0605 to 0.0614 across iterations 0 to 4, so slower entry into
      the first corner is the untested lever. (2) On s-bend and slalom, line_loss_events
      stayed at 1 with search_right (iteration 4) and with last_direction (iterations
      0 to 3), and progress barely moved (s-bend 0.1576, slalom 0.1099). The recovery
      direction is therefore the untested variable for those tracks. The risk is that
      two fields change at once. Speed mainly affects the oval and recovery direction
      mainly affects s-bend and slalom, so the per-track telemetry should separate
      them. Read the race as follows. (a) If oval progress falls below 0.137 at speed
      1.2, the speed is too low; return base_speed to 1.4 and keep search_left. (b)
      If s-bend or slalom line_loss_events drops to 0, or their progress rises above
      0.1576 and 0.1099, keep search_left. (c) If s-bend or slalom line_loss_events
      rise above 1, the search direction is wrong; revise to search_right with the
      same geometry. (d) If steering_oscillation rises well above 0.15, reduce kd
      toward 0.20 before changing kp. Do not treat this candidate as better than iteration
      4 until the race shows it.


      ### Requested changes


      - If oval progress falls below 0.137 at base_speed 1.2 (iteration 4 value at
      1.4), set base_speed back to 1.4 and keep line_loss search_left, so the search-direction
      result is still tested.

      - If s-bend or slalom line_loss_events stays at 1 with search_left, set line_loss
      back to search_right and test base_speed 1.2 alone, since search_right gave
      one loss per run on those tracks in iteration 4 and no change in progress.

      - If oval max_error stays at or above 0.06 at base_speed 1.2 with 0 line losses,
      try sensor_size 0.016 with the same speed and keep the change to one group at
      a time before changing kp.


      - [Open this output](iteration-5/entityR1/versions/7fa88aefceb44f39b21371308b56e09f/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/5004fb9f36e04cd5b96d798d5954692b/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-6bb6f18462b6d896/payload.json)'
