map:
  id: race-172-opt-eval
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Slower oval test (1.4)
    notes: 'Keeps the widened sensors and kd 0.15 from iteration 2, and lowers base_speed
      from 1.6 to 1.4. The oval stayed at progress 0.115 with max_error just over
      0.06 m despite the wider array, which points to corner speed rather than sensing.


      ### Rationale


      Evidence from iteration 2 (kd 0.15, sensor spread widened to +/-0.05 m): the
      oval now shows 0 line-loss events, down from 1, but progress stays at 0.115
      and max_error is 0.0614, so the oval still leaves the track at the same point
      as the baseline. The s-bend and slalom still show one line-loss event each,
      and progress on those tracks fell back to the baseline (0.040 and 0.035) once
      kd dropped from 0.30. Steering oscillation is now well below the 0.15 threshold
      on all tracks (0.067 and 0.064 on s-bend and slalom, 0.075 on the oval). That
      confirms kd 0.15 is acceptable damping.


      The wider array did not move oval progress, which is the Evaluator''s contingency
      case: the oval failure is not fixed by sensing layout. The oval''s max_error
      sits just over the 0.06 m off-track limit at a fixed progress point, which looks
      like a corner taken too fast for the available steering. I therefore make one
      change: base_speed from 1.6 to 1.4 (Evaluator''s suggested test before raising
      kp). Geometry stays as in iteration 2 (widened sensors kept, since the oval
      line-loss count improved and it does no harm). kp 4.0, ki 0.05, kd 0.15, sensor_weights
      and line_loss last_direction are unchanged, so the race attributes any change
      to speed.


      Expected result: the robot should slow into the oval corner and stay within
      0.06 m, so oval progress should rise above 0.115 and max_error should fall.
      Completion time will be longer, so completion is unlikely at this speed; the
      goal of this step is to extend progress. Hypotheses: (1) speed, not sensing,
      limits the oval; (2) at base_speed 1.4 the s-bend and slalom line-loss events
      persist, which would make line_loss search direction the next lever. Measurements
      requested: progress, max_error and line_loss_events per track, plus completion_time
      and steering_oscillation to check the speed trade-off. If the oval still stalls
      at 0.115 at 1.4, the next step is a larger sensor_size (0.016) or a line_loss
      search direction change.


      - [Open this output](iteration-3/entity0/versions/fcd66a9d1dae4c15957e717822fc70db/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-1fc847695bb3b1b6/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-2e8e772ad8b4b2ab/payload.json)'
  - id: entityR1
    label: 'Revise: restore kd, speed'
    notes: 'Revise because kd 0.15 erased the s-bend and slalom progress gains seen
      at kd 0.30 (iteration 1, best score 52.35), while the speed-only test is worth
      keeping. Requests kd 0.30 with base_speed 1.4 and a line-loss direction change
      if line loss persists.


      ### Feedback


      Decision: revise. This candidate is valid, but it drops the kd gain that produced
      the only progress gains so far. Iteration 1 (kd 0.30, sensors +/-0.04 m) raised
      s-bend progress from 0.040 to 0.157 and slalom from 0.035 to 0.110, which is
      the best raced score (52.35). Iteration 2 (kd 0.15, sensors +/-0.05 m) returned
      both tracks to baseline progress (0.040 and 0.035), so the candidate''s kd of
      0.15 is the likely reason those tracks are slow. Widening the sensors to +/-0.05
      m reduced oval line-loss events from 1 to 0 but left oval progress at 0.115
      and max_error at 0.0614, so it has not solved the oval. The base_speed change
      to 1.4 is a fair single test of the oval corner: the oval fails at a fixed progress
      point, and max_error sits just over the 0.06 m limit, which points to speed
      into the corner. Oscillation in iteration 1 (0.154 and 0.158) was only just
      above the 0.15 threshold, and that threshold is a guide, not a score term. Revise
      so the next race tests the speed change while restoring the kd that gave the
      best progress. Next steps depend on the race: if oval progress still stalls
      at 0.115 at base_speed 1.4, test a larger sensor_size (0.016) or a different
      line_loss search direction. If s-bend and slalom still show one line-loss event
      each, test line_loss = search_right or search_left, keeping the other fields
      fixed. Change one field group at a time so the cause of each effect stays clear.


      ### Requested changes


      - Restore controller.kd to 0.30, keeping kp 4.0 and ki 0.05. Iteration 1 showed
      kd 0.30 gave the only s-bend and slalom progress gains (0.157 and 0.110 against
      baseline 0.040 and 0.035), and iteration 2 showed kd 0.15 lost them.

      - Keep controller.base_speed at 1.4, as tested in this candidate, to check whether
      slower entry lets the oval hold the line (oval max_error was 0.0614 at base_speed
      1.6 with progress 0.115 unchanged).

      - If line_loss_events stays at 1 on s-bend or slalom after this change, set
      controller.line_loss to search_right or search_left. Iterations 0 to 2 show
      last_direction gave one line-loss event per run on those tracks.


      - [Open this output](iteration-3/entityR1/versions/31f48fc3d7b2477c8b1ef21672b6b9db/payload.json)

