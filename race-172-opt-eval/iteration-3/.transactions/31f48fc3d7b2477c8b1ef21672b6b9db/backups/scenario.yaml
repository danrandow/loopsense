map:
  id: race-172-opt-eval
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Slower oval test (1.4)
    notes: 'Keeps the widened sensors and kd 0.15 from iteration 2, and lowers base_speed
      from 1.6 to 1.4. The oval stayed at progress 0.115 with max_error just over
      0.06 m despite the wider array, which points to corner speed rather than sensing.


      ### Rationale


      Evidence from iteration 2 (kd 0.15, sensor spread widened to +/-0.05 m): the
      oval now shows 0 line-loss events, down from 1, but progress stays at 0.115
      and max_error is 0.0614, so the oval still leaves the track at the same point
      as the baseline. The s-bend and slalom still show one line-loss event each,
      and progress on those tracks fell back to the baseline (0.040 and 0.035) once
      kd dropped from 0.30. Steering oscillation is now well below the 0.15 threshold
      on all tracks (0.067 and 0.064 on s-bend and slalom, 0.075 on the oval). That
      confirms kd 0.15 is acceptable damping.


      The wider array did not move oval progress, which is the Evaluator''s contingency
      case: the oval failure is not fixed by sensing layout. The oval''s max_error
      sits just over the 0.06 m off-track limit at a fixed progress point, which looks
      like a corner taken too fast for the available steering. I therefore make one
      change: base_speed from 1.6 to 1.4 (Evaluator''s suggested test before raising
      kp). Geometry stays as in iteration 2 (widened sensors kept, since the oval
      line-loss count improved and it does no harm). kp 4.0, ki 0.05, kd 0.15, sensor_weights
      and line_loss last_direction are unchanged, so the race attributes any change
      to speed.


      Expected result: the robot should slow into the oval corner and stay within
      0.06 m, so oval progress should rise above 0.115 and max_error should fall.
      Completion time will be longer, so completion is unlikely at this speed; the
      goal of this step is to extend progress. Hypotheses: (1) speed, not sensing,
      limits the oval; (2) at base_speed 1.4 the s-bend and slalom line-loss events
      persist, which would make line_loss search direction the next lever. Measurements
      requested: progress, max_error and line_loss_events per track, plus completion_time
      and steering_oscillation to check the speed trade-off. If the oval still stalls
      at 0.115 at 1.4, the next step is a larger sensor_size (0.016) or a line_loss
      search direction change.


      - [Open this output](iteration-3/entity0/versions/fcd66a9d1dae4c15957e717822fc70db/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-1fc847695bb3b1b6/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-2e8e772ad8b4b2ab/payload.json)'
  - id: entityR1
    label: 'Approve: wider array, kd'
    notes: 'Approved the candidate with sensors widened to +/-0.05 m and kd lowered
      to 0.15, which targets the oval failure and the oscillation above 0.15 seen
      in iteration 1. Feedback names the next change to make for each race outcome,
      and notes that changing two field groups at once weakens attribution.


      ### Feedback


      Decision: approve. This candidate is valid and not obviously broken, it is the
      first test that changes the sensor layout, and we are in early exploration with
      9 iterations left. Every race so far has ended off track with one line-loss
      event. Iteration 1 (kd 0.05 to 0.30) raised progress on s-bend (0.04 to 0.157)
      and slalom (0.035 to 0.110) and left the oval unchanged (progress 0.115, max_error
      0.0607). That result shows kd does not fix the oval, so the oval failure is
      probably a sensing or recovery problem. Iteration 1 also pushed steering_oscillation
      to 0.154 on s-bend and 0.158 on slalom, both above the 0.15 threshold. This
      candidate follows the requested kd reduction to 0.15 and widens the sensor spread
      from +/-0.04 m to +/-0.05 m with weights unchanged. The wider array is the right
      lever for the oval, since it is the only track where kd had no effect. The main
      weakness is attribution: I asked for one field group at a time, and this changes
      kd and sensor layout together. Read the race as follows. (a) If the oval shows
      fewer line-loss events or a higher progress than 0.115, the wider array is helping;
      keep it. (b) If steering_oscillation falls below 0.15 on s-bend and slalom while
      progress stays near the iteration 1 values, kd 0.15 is the right damping. (c)
      If the robot still leaves the track with line_loss_events at 1 on every track,
      the layout change alone is not enough. Revise by changing line_loss to search_left
      or search_right, keeping this geometry. (d) If steering_oscillation is still
      above 0.15 with kd 0.15, lower kd to about 0.10 before changing kp. (e) If the
      robot completes but completion_time is above 2.5 s, raise base_speed in steps
      of about 0.2.


      ### Requested changes


      - If line_loss_events stays at 1 on every track, set controller.line_loss to
      search_right or search_left, keeping the widened sensors. Iteration 0 and 1
      show last_direction gave one line-loss event per run on all tracks.

      - If steering_oscillation stays above 0.15 with kd 0.15 (iteration 1 gave 0.154
      and 0.158 at kd 0.30), reduce controller.kd to about 0.10 and keep kp at 4.0.

      - If the oval shows no change from the iteration 1 baseline (progress 0.115,
      max_error 0.0607), the wider array is not the fix. Then revert the sensor spread
      to +/-0.04 m and test a larger sensor_size (0.016) or base_speed 1.4 before
      changing kp.


      - [Open this output](iteration-2/entityR1/versions/bac023e804df40ca97edff6fcb345c71/payload.json)

