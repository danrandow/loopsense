overrides:
  entities:
  - id: entity0
    label: kd damping 0.05 to 0.30
    notes: 'Baseline never finished and left the track on all 60 trials (max_error
      about 0.06 m, one line loss each), with low oscillation, so the controller is
      under-damped. This candidate changes only kd, raising it from 0.05 to 0.30 to
      test whether derivative damping keeps the robot on the line.


      ### Rationale


      Evidence: the baseline ran 60 trials across three tracks and never finished.
      Every run ended off track, with max_error about 0.060 m (the off-track limit
      here is max(0.06, 0.0125 + 0.12/4) = 0.06 m). Each run also had one line-loss
      event, and progress was only 0.04 to 0.12. The robot is therefore losing the
      line on the first hard bend and then drifting out. Steering oscillation is low
      (0.06 to 0.07), so the robot is not jittering. The problem is an under-damped,
      slow correction on bends, not chatter. The reviewer''s first-race checks point
      the same way: kd = 0.05 contributes almost nothing, so the controller has no
      derivative damping.


      Change: kd from 0.05 to 0.30, as the reviewer requested for damping. kp (4.0),
      ki (0.05), base_speed (1.6), sensor layout, weights and line_loss (last_direction)
      are all unchanged, so this race isolates the effect of derivative damping. I
      am deliberately not lowering kp yet. The oscillation metric is low, so there
      is no sign of over-steering.


      Expected result: the robot should hold the line through the bends and the line-loss
      count should drop to 0 or near it on at least one track. Overshoot should fall,
      and max_error should drop below 0.06 on some tracks. If the robot still leaves
      the track, the next step is to test base_speed 1.3 to 1.5, and then increase
      kp only if the error grows on sharp bends. If line-loss events remain, test
      line_loss = search_right or search_left.


      Hypotheses to check in the race telemetry: (1) kd = 0.3 cuts max_error and line-loss
      events. (2) Completion time is still around 2.5 s or better once the robot finishes.
      (3) steering_oscillation stays below about 0.15, showing that the extra damping
      does not introduce new jitter. Measurements requested: completion, progress,
      completion_time, max_error, rms_error and line_loss_events, which are the signals
      needed to choose the next change.


      - [Open this output](iteration-1/entity0/versions/273d343481244cdc9a51123d2384e4ef/payload.json)

      - Based on: [entityR1](iteration-1/entityR1/versions/carried-8e0dac71274b1cad/payload.json),
      [entityR2A](iteration-1/entityR2A/versions/carried-da854680ae4303d4/payload.json)'
  - id: entityR1
    label: Baseline approved to race
    notes: 'Approved the iteration 0 baseline because it is valid, with sensor and
      steering signs checked against the contract, and no race data exists yet. Feedback
      names three next-step changes (base_speed, kd/kp, line_loss) that depend on
      what the first race measures.


      ### Feedback


      Iteration 0 has no earlier race data, so this review rests on the public contract
      and the candidate''s own contents. I checked the sign conventions. Sensor x=-0.04
      (right side) carries weight -1, so a line under the right sensors gives a negative
      signal and steers right. Turn is positive for left, and the wheel equations
      (right = base + 350*turn, left = base - 350*turn) match that. The candidate
      is valid and not obviously broken, so it should race as the baseline. Three
      weak points to check against the first race: (a) kd = 0.05 is very small. Its
      contribution, kd times the change in signal per second, is likely negligible,
      so it is unlikely to damp oscillation. (b) base_speed = 1.6 may not reach the
      roughly 1.5 m/s average that finishing in 3.0 s needs once turning and friction
      are counted. Completion is worth 500 points, so a missed finish costs far more
      than a slightly slower run. (c) line_loss = last_direction is a sensible default,
      but the track is unknown until the race. If the first race shows line-loss events,
      change this field before changing gains. Next steps depend on the race telemetry.
      If the robot does not complete and progress stalls on sharp bends, raise base_speed
      slightly or increase kp. If it completes but completion_time is well above 2.5
      s, raise base_speed. If steering_oscillation is high, raise kd and lower kp.
      Change one group of fields at a time so the cause of each effect stays clear.


      ### Requested changes


      - If the baseline does not complete or finishes late (completion_time near or
      above 3.0 s), raise base_speed from 1.6 to about 1.8 and keep kp at 4.0, so
      speed is tested without changing steering.

      - If steering_oscillation or max_error is high on the bends, raise kd from 0.05
      to about 0.3 and lower kp from 4.0 to about 3.0. This tests damping, since kd
      at 0.05 is probably too small to act.

      - If line_loss_events is above zero on the slalom or s-bend, keep the same gains
      and test line_loss = search_right or search_left, to see which recovery direction
      recovers the line on these tracks.


      - [Open this output](iteration-0/entityR1/versions/1d1ca58ec28846c2ab0a78236832a223/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/d39e37b7eb144a488a0f4233d127ccde/payload.json)'
