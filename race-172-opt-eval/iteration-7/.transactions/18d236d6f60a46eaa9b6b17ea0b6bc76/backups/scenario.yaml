  id: race-172-opt-eval
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: kd 0.30 to 0.20 test
    notes: 'Keeps base_speed 1.0 and search_left from the best raced design (iteration
      6, score 85.60) and lowers kd from 0.30 to 0.20 only. Oval steering oscillation
      was 0.19 with max_error 0.0623, so the Evaluator''s damping rule (c) applies.


      ### Rationale


      Evidence: iteration 6 (base_speed 1.0, kd 0.30, search_left, sensors at ±0.05
      m, sensor_size 0.016) scored 85.60, the best so far. Oval progress rose to 0.3425
      (from 0.318 at speed 1.2), so the Evaluator''s condition (a) for keeping speed
      1.0 is met on progress. Oval line-loss events are 0.0 and oval max_error is
      0.0623, still just above the 0.06 m off-track limit. Oval steering_oscillation
      is 0.1917, well above the 0.15 guide. s-bend and slalom still show one line-loss
      event each (progress 0.1625 and 0.110), so the recovery direction and speed
      are not limiting them.


      The Evaluator''s condition (c) applies: oscillation is above 0.15 while oval
      max_error is still at or above 0.06. The requested fix is to reduce controller.kd
      from 0.30 to about 0.20, with every other field fixed. Iteration 1 showed kd
      0.30 pushed oscillation above 0.15, and this iteration confirms it. I am changing
      only kd, so the race isolates the damping effect. I am not changing the sensor
      layout yet. The Evaluator''s condition (d) (a fifth forward sensor or a wider
      spread for s-bend/slalom) depends on the result of this race, and s-bend/slalom
      progress is small, so it is a lower-priority lever.


      Expected result: oval steering_oscillation falls from 0.19 toward 0.15 or below,
      and oval max_error drops toward or below 0.06 because the steering is less jittery
      at the corner entries. Oval progress may fall slightly (lower damping), so the
      watch value is 0.3425. Hypotheses: (a) kd 0.20 brings oval oscillation below
      0.15 while progress stays at or above about 0.32; (b) oval max_error falls below
      0.06 on more seeds; (c) s-bend and slalom progress stay near 0.16 and 0.11.
      Measurements next: oval progress, max_error, steering_oscillation and line_loss_events;
      s-bend and slalom line_loss_events and progress.


      - [Open this output](iteration-7/entity0/versions/86759eb4349b464da19bd23e44057447/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-b40d41c700bc6dc4/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-9d0c0724b36b7402/payload.json)'
  - id: entityR1
    label: Approve kd 0.20 test
    notes: 'Approves a single-field change from the best raced design (iteration 6,
      85.60): kd 0.30 to 0.20, to test whether lower damping brings oval oscillation
      (0.19) under the 0.15 guide. Feedback gives next steps for oval progress and
      for the s-bend/slalom line-loss problem, which persisted under every recovery
      direction tried.


      ### Feedback


      Decision: approve. The candidate changes one field from the best raced design
      (iteration 6, score 85.60): controller.kd from 0.30 to 0.20. Geometry, kp 4.0,
      ki 0.05, base_speed 1.0, sensor weights and line_loss search_left are unchanged,
      so the race isolates derivative damping. The evidence supports the test. Iteration
      1 showed kd 0.30 raised steering_oscillation above the 0.15 guide (0.154 on
      s-bend, 0.158 on slalom), and iteration 6 shows oval oscillation at 0.1917,
      still above it. Oval max_error (0.0623 in iteration 6) is still just over the
      0.06 m limit, and iteration 2 showed kd 0.15 cut progress on s-bend and slalom,
      so the expected cost of lowering kd is a small progress drop. That is why the
      watch value is the iteration 6 oval progress of 0.3425. Approval is a bet on
      a one-field test with spare runs, not a claim that this candidate beats iteration
      6. Read the race as follows. (a) If oval steering_oscillation falls below 0.15
      and oval max_error falls below 0.06 with progress at or above about 0.32, keep
      kd 0.20. (b) If oval progress falls well below 0.3425 while oscillation stays
      high, return kd to 0.30, since damping is not the oval''s limit. (c) If s-bend
      and slalom still show one line-loss event each, which every recovery direction
      and speed have left unchanged (iterations 0 to 6), stop tuning the controller
      on those tracks and change the sensor layout: a fifth forward sensor at y 0.06
      or a wider spread at fixed weights.


      ### Requested changes


      - Keep kd at 0.20 if the race shows oval steering_oscillation below 0.15 and
      oval progress at or above about 0.32. Evidence: oval oscillation was 0.1917
      at kd 0.30 (iteration 6), and iteration 1 showed kd 0.30 pushed oscillation
      above 0.15.

      - If oval progress falls well below 0.3425 at kd 0.20, return kd to 0.30 and
      leave the controller alone. Evidence: iteration 6 oval progress was 0.3425 at
      kd 0.30, and iteration 2 showed lower kd (0.15) cut s-bend and slalom progress.

      - If s-bend or slalom still show line_loss_events of 1 after this race, test
      a sensor layout change with speed, kp, kd and line_loss held fixed: add a fifth
      forward sensor at y 0.06, or widen the spread to ±0.08 m. Evidence: line_loss
      stayed at 1 on those tracks under last_direction (iterations 0 to 3), search_right
      (iteration 4), and search_left (iterations 5 and 6).


      - [Open this output](iteration-7/entityR1/versions/67e92baa737e4ee5ab7f141e5a993d04/payload.json)

