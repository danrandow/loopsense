  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Wider track 0.14 m test
    notes: 'Restores the best-measured iteration 1 geometry and changes only wheel_track
      to 0.14 m. This tests the opposite direction of iteration 4, where narrowing
      to 0.10 m cut the score from 525 to 419 and raised oscillation.


      ### Rationale


      The race evidence ranks the designs clearly. Iteration 1 (12 mm spacing, 16
      mm sensors at y=0.05, wheel_track 0.12, mass 0.5, wheel radius 0.03) scored
      525.5 and finished the oval in 20 of 20 trials. Iteration 3 widened the array
      to 20 mm spacing and fell to 127.5. Iteration 4 kept the iteration 1 array and
      narrowed the wheel track to 0.10 m, which scored 419.1. The oval finish rate
      dropped to 0.95 and the s-bend finish rate fell from 0.40 to 0.15, with line_loss_events
      rising to 0.95 on s-bend. Narrowing the track therefore reduced stability instead
      of adding useful turn authority. The steering_oscillation rise is consistent
      with over-responsive steering. The opposite direction is untested. A wider track
      (0.14 m) should lower yaw rate per unit wheel differential, which may damp the
      oscillation that the narrow track introduced. I keep the iteration 1 sensor
      array, mass, wheel radius and body, so the result isolates wheel track and can
      be compared directly with iteration 1. Body width stays at 0.12 m because the
      off-track limit is governed by the 0.06 m floor across the allowed range. Expected
      result: oval finish rate holds near 1.0, and s-bend finish rate and max_error
      improve relative to iteration 1 if the damping hypothesis holds. The risk is
      that a wider track slows turn response on the tightest bends, so s-bend may
      not improve.


      - [Open this output](iteration-5/entity0/versions/bad3f3c8173a4620a0ff438ed4748b30/payload.json)

      - Based on: [entityR2A](iteration-5/entityR2A/versions/carried-801a5cc18fe50a92/payload.json)'
  - id: entity1
    label: Complete Robot Package
    notes: 'Complete Robot Package. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 1 is the best measured design (score 525.5): the oval finished 20
      of 20 and the s-bend 8 of 20. Iteration 3 widened the sensor array and raised
      kp, and every track degraded. Iteration 4 narrowed wheel_track to 0.10 m, and
      the oval fell to 0.95, the s-bend to 0.15 with line_loss_events 0.95, and the
      score to 419.1. So narrowing the track hurt, and the Builder''s proposal tests
      the opposite direction. The Builder''s intent is to isolate wheel_track: restore
      the iteration 1 geometry and change only wheel_track to 0.14 m. Sensor x and
      y, mass, wheel radius and body are unchanged. Sensor signal scale depends only
      on sensor x, not on wheel_track, so the iteration 1 weights and kp stay valid.
      Wheel_track only changes the turn rate per unit of wheel differential (turn
      rate = wheel speed difference / wheel_track), so the authority drops by about
      14 percent. I considered raising kp by 0.14/0.12 to hold authority constant,
      but that would confound the test, and iteration 4 showed that extra turn gain
      adds oscillation. So the controller is held identical to iteration 1 (base_speed
      1.2, kp 2.0, ki 0.05, kd 0.4, weights [2,1,0,-1,-2], last_direction) to isolate
      the track effect. Expected result: oval finish rate near 1.0 with steering_oscillation
      at or below iteration 1, and s-bend finish rate and line_loss_events improving
      if the damping hypothesis holds. Risk: slower turn response may leave the tape
      on the tightest s-bend and slalom bends.


      - [Open this output](iteration-5/entity1/versions/c17962dffb4a40c990fcda220b082134/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/bad3f3c8173a4620a0ff438ed4748b30/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-801a5cc18fe50a92/payload.json)'
  - id: entityR1
    label: Integration Feedback
    notes: 'Integration Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Written before this robot has raced, so no outcome is stated for it. (1) Evidence
      from iteration 4 (entityR2B): narrowing wheel_track to 0.10 m, with the iteration
      1 array and controller, reduced the oval finish rate from 1.0 to 0.95, the s-bend
      finish rate from 0.40 to 0.15, and raised s-bend line_loss_events to 0.95. Iteration
      1 (entityR2B) is the best measured layout: oval 20/20, s-bend 8/20, slalom 0/20
      at progress 0.18. So the narrow track reduced stability, and the wider direction
      is the untested one. (2) I kept the iteration 1 controller unchanged, with no
      kp rescale for the wider track. Turn authority per unit of controller output
      scales with 1/wheel_track, so the 0.14 m track gives about 14 percent less turn
      rate per unit. Iteration 3 (entityR2B) shows that raising kp alongside a geometry
      change confounded the result and hurt every track, so I did not rescale. (3)
      Body_width has no effect on the off-track limit at 0.12 m (the 0.06 m floor
      governs), so it is not a lever. (4) Sensor x and y were not changed; iteration
      3 showed the wider 20 mm array was harmful. Change rules for the next race:
      if the oval still finishes 20/20 and s-bend finish rate rises above 0.40 or
      line_loss_events falls below 0.8, try wheel_track 0.16 m next. If the s-bend
      finish rate falls below 0.40 or slalom progress drops below 0.18, turn authority
      is limiting, so return to wheel_track 0.12 to 0.13 m and then try kp scaled
      by 0.14/wheel_track only as a separate test. If the oval steering_oscillation
      stays near 0.25 and the oval finishes 20/20 but s-bend is unchanged, the track
      is not the lever, and the next geometry test should be sensor y at 0.065 m with
      the iteration 1 array.


      ### Requested changes


      - Try wheel_track 0.16 m next if the 0.14 m race shows the s-bend finish rate
      above 0.40 with oval finish holding at 1.0, because iteration 4 showed narrowing
      the track hurt (s-bend 0.15, iteration 1 0.40), so the wider direction is the
      test of H1.

      - If the 0.14 m race shows the s-bend finish rate below 0.40 or slalom progress
      below 0.18, return to wheel_track 0.12 to 0.13 m, since the iteration 1 layout
      is the best measured and the loss of turn authority would be the limit.

      - If track width alone does not move s-bend or slalom, try sensor y = 0.065
      m with the iteration 1 array and x = +/-0.024 m, since iteration 3 showed widening
      x is harmful but forward offset has not been tested.


      - [Open this output](iteration-5/entityR1/versions/c17962dffb4a40c990fcda220b082134/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/bad3f3c8173a4620a0ff438ed4748b30/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-801a5cc18fe50a92/payload.json)'
