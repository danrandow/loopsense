  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Evidence from the development race (entityR2A, iteration 1) shows the failure
      is an early off-track run, not oscillation. Oval finishes in 20 of 20 trials,
      s-bend finishes in 8 of 20, and slalom fails in all 20 at progress 0.18. Max_error
      reaches 0.064 m, just past the fixed off-track limit of 0.06 m. Body width cannot
      change that limit, because max(0.06, 0.0125 + body_width/4) stays at the 0.06
      m floor across the whole allowed body_width range. Steering oscillation is modest
      (0.23 to 0.31), so the robot is drifting outward rather than jittering. The
      remaining geometry lever is sensor reach: the current 48 mm array (x = +/-0.024
      m) cannot see the tape once the robot is about 0.03 m off centre, and the drift
      reaches 0.06 m before recovery. I will widen the array to 0.08 m total span
      (x = +/-0.04 m, with 0.02 m spacing) so that an outer sensor keeps tape in view
      at larger offsets. Sensor forward position stays at y = 0.05 m, and the weight
      convention is unchanged, so the Integrator''s gains see the same sign structure.
      I change only the array width this iteration so the result can be attributed
      to it. Expected result: slalom and s-bend progress should rise and line_loss_events
      should fall. Oval should stay near its current finish rate.


      - [Open this output](iteration-3/entity0/versions/24c87a6015ff4326bb48c2e0f7676e21/payload.json)

      - Based on: [entityR2A](iteration-3/entityR2A/versions/carried-3dbf0b4da0bfc527/payload.json)'
  - id: entity1
    label: Complete Robot Package
    notes: 'Complete Robot Package. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Evidence from iteration 1 (entityR2B): the oval finishes 20 of 20 with max_error
      0.025 m, so the controller holds the line when the tape stays under the sensors.
      The s-bend finishes 8 of 20 and slalom fails in all 20 at progress 0.18 with
      about 2 line-loss events and max_error 0.064 m. The failure is an early outward
      drift that leaves the tape, not oscillation (steering_oscillation 0.23 to 0.31).
      The Builder''s wider array (x = +/-0.04 m, 20 mm spacing, 16 mm footprints)
      is the right test of sensor reach. Adding sensors changes the signal scale.
      With weights [2,1,0,-1,-2] at x = +/-0.04 m, the signal is roughly tape offset
      divided by 0.02 m, not 0.012 m as before, so the effective steering gain per
      metre drops by about 40 percent. To keep the controller''s per-metre authority
      close to iteration 1, I scale kp from 2.0 to 3.0 (about 1.5x, a little below
      the 1.67 ratio, to avoid over-steering on the oval). The worst-case turn is
      kp*2 = 6, giving a wheel differential of 2100 PWM, which stays inside the limits
      at base PWM 2457 (left 357, right 4095 cap not reached). base_speed stays at
      1.2, kd stays at 0.4, and ki stays at 0.05 so the change is attributable to
      sensor reach plus the kp rescale. line_loss stays last_direction, which suits
      drift toward one side. Expected result: slalom and s-bend progress rise above
      0.18 and 0.83, and line_loss_events fall. The oval should stay near 100 percent
      finish, with steering_oscillation possibly rising a little because of the higher
      kp.


      - [Open this output](iteration-3/entity1/versions/f7d0ee437faf45f68b14f1a77492f676/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/24c87a6015ff4326bb48c2e0f7676e21/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-3dbf0b4da0bfc527/payload.json)'
  - id: entityR1
    label: Integration Feedback
    notes: 'Integration Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Written before this candidate has raced, so no outcome is stated for it. (1)
      Iteration 1 (entityR2B) shows the oval finishes 20 of 20 with max_error 0.025
      m, while s-bend finishes 8 of 20 and slalom fails in all 20 at progress 0.18
      with about 2 line-loss events. The failure is drift off the tape, not jitter,
      so sensor reach is the lever to test. (2) To keep the controller''s steering
      gain per metre of offset, I had to raise kp from 2.0 to 3.0 when the array widened,
      because the weights sit at x/0.02 m rather than x/0.012 m. Any further widening
      will need another kp rescale, so please keep weights proportional to x. (3)
      Iteration 1 used a 0.05 m forward offset. We have no evidence yet on whether
      0.065 m helps, so this is still untested. Change rules for the next race: if
      slalom progress rises above 0.18 but line_loss_events on slalom stays at 1 or
      more, widen the array further with 7 sensors at x = +/-0.06, +/-0.04, +/-0.02,
      0 m (20 mm spacing). If the oval''s steering_oscillation rises above about 0.4
      while finishing rates hold, narrow back toward x = +/-0.032 m to reduce gain.
      If the s-bend still fails at about progress 0.83 with low oscillation, move
      sensors forward to y = 0.065 m to see sharp bends sooner.


      ### Requested changes


      - Try the 0.08 m array (x = +/-0.04 m, 20 mm spacing, 16 mm footprints) as proposed,
      since iteration 1 showed slalom and s-bend fail from drift while the oval finishes;
      if slalom still shows line-loss events, widen to 7 sensors at x = +/-0.06, +/-0.04,
      +/-0.02, 0 m.

      - If steering_oscillation rises above about 0.4 on the oval while finishing
      rates hold, reduce the outer sensor x to +/-0.032 m, since iteration 1 showed
      oscillation of 0.25 on the oval and any kp rescale raises jitter.

      - If s-bend still fails near progress 0.83 with low oscillation, try sensor
      y = 0.065 m, since iteration 1 showed lag is untested and the earlier look-ahead
      could help the sharp bends.


      - [Open this output](iteration-3/entityR1/versions/f7d0ee437faf45f68b14f1a77492f676/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/24c87a6015ff4326bb48c2e0f7676e21/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-3dbf0b4da0bfc527/payload.json)'
