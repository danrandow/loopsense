  entities:
  - id: entity0
    label: Mid-authority array v4
    notes: 'Sits between iteration 1 (oscillating, progress 0.5 on oval) and iteration
      2 (sluggish, progress about 0.12) on steering authority: kp 3.5, kd 0.4, track
      0.12 m, 7 sensors at 12 mm spacing with 12 mm footprints. Based on race scores
      89, 124 and 49 and their per-track metrics.


      ### Rationale


      Evidence: iteration 0 scored 89 and iteration 1 scored 124.4 (best so far),
      but all runs leave the track. Iteration 1 (kp 3.0, kd 0.5, track 0.10 m, 7 sensors
      at 10 mm spacing) reached progress 0.50 on the oval, with steering_oscillation
      of 0.28 and max_error at the 0.06 m limit. Iteration 2 (kp 2.0, kd 0.2, track
      0.14 m, 16 mm sensors at 15 mm spacing) fell to 48.9, with progress about 0.12
      on every track. So iteration 2 was too sluggish, not too oscillatory, and iteration
      1 was too aggressive. My estimate of effective steering authority per metre
      of line offset is kp x (outer weight / outer x) / (wheel_track / 350), which
      gives about 150/m for iteration 0 (turn rate about 1250), 200/m for iteration
      1 (about 2000) and 89/m for iteration 2 (about 640). The good operating point
      lies between iterations 1 and 2, and iteration 0 was closest to it on turn authority
      but had too few sensors.


      Changes: (1) Keep the 7-sensor, 12 mm footprint array, which gives smoother
      readings than 10 mm, but tighten spacing to 12 mm (x = -0.036 to +0.036) so
      the array still covers offsets of about 4 cm. Weights stay linear, -2 to +2,
      so the signal is about 56 per metre of offset. (2) kp raised from 2.0 to 3.5,
      giving about 195 per metre of offset and turn authority of about 1600 per metre
      on a 0.12 m track. This sits between iterations 1 and 2 on the authority scale.
      (3) kd set to 0.4, between the 0.2 and 0.5 values that were tried, to damp the
      oscillation seen at kd 0.5 without leaving the signal undamped. (4) wheel_track
      set to 0.12 m, between 0.10 and 0.14. (5) base_speed set to 1.3, between 1.2
      and 1.4, which gives progress without much line-loss risk on the bends. (6)
      ki stays at 0 to avoid windup on the curves. Mass 0.6 kg, body 0.15 x 0.12 m
      and wheel radius 0.03 m are unchanged. Sensor y stays at 0.03 m.


      Expected result: progress above 0.5 on the s-bend and slalom, line_loss_events
      at 1 or fewer, steering_oscillation near 0.2, and at least some oval completions.
      Hypotheses: (a) the 12 mm footprint array keeps the line in view through bends;
      (b) the turn authority in the middle of the range avoids both the oscillation
      of iteration 1 and the sluggishness of iteration 2. Failure signs: oscillation
      above 0.25 means kp or kd is still too high; progress stuck near 0.3 with few
      line losses means kp is too low or speed too high. Next measurements: progress
      and line_loss_events show whether the array holds the line; max_error and steering_oscillation
      show whether the gains are balanced; completion_time shows the speed margin.


      - [Open this output](iteration-3/entity0/versions/a6feaefa24ff4c01a8e7d357767ad495/payload.json)

      - Based on: [entityR2A](iteration-3/entityR2A/versions/carried-2f6066a460de301a/payload.json)'
