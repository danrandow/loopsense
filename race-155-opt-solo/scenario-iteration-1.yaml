  entities:
  - id: entity0
    label: 7-sensor, higher-kp
    notes: 'Widens the sensor array to 7 sensors (+/-3 cm), raises kp to 3.0 and kd
      to 0.5, lowers base speed to 1.4, and narrows and lightens the chassis. This
      addresses the baseline''s off-track exits, with max error at the 0.06 m limit
      and about 2 line losses per run.


      ### Rationale


      Evidence from the baseline (entityR2A, 60 trials): the robot leaves the track
      on 39 of 40 development runs. Mean max_error is about 0.060 to 0.063 m, which
      equals the off-track limit of 0.06 m for this body (tape half-width plus body_width/4
      is below 0.06 for any allowed body width, so the limit is effectively fixed
      at 0.06 m). Progress stalls at 0.13 to 0.28, so the robot runs off the line
      early in every track. Line-loss events average 2 per run on s-bend and slalom,
      so the line is lost after the error has already grown past about 4 cm. The 5
      sensors cover only +/-2 cm, so the error grows unseen to the edge of the array
      before any correction. Also, base_speed 1.6 is likely too fast for the bend
      radius, and kp 1.5 with kd 0.3 is too weak to pull the robot back in time.


      Changes: (1) Seven sensors at 10 mm spacing (x = -0.03 to +0.03), so the array
      sees offsets up to about 4 cm before line loss. Sensor weights are -2 to +2,
      linear in x, so a unit of offset gives a predictable signal. (2) kp raised from
      1.5 to 3.0 for stronger correction. (3) kd raised from 0.3 to 0.5 to damp the
      faster response. (4) ki stays at 0 because the integral would wind up on the
      long curves. (5) base_speed lowered from 1.6 to 1.4 so the robot can hold the
      line through the sharper bends. The finish-time requirement (about 1.5 m/s)
      is traded for fewer off-track exits, since a completed run is worth far more.
      (6) Wheel track narrowed from 0.12 to 0.10 m, so each PWM difference gives a
      higher turn rate. Mass reduced to 0.6 kg and body_length to 0.15 m, which lowers
      yaw inertia and speeds up the response. body_width stays at 0.12 m, since widening
      it does not change the off-track limit.


      Expected result: fewer line-loss events (target 0 to 1 per run), progress well
      above 0.5 on s-bend and slalom, and at least some completions on the oval. Hypotheses
      to test: (a) the wider sensor array removes most line-loss events; (b) the higher
      kp with lower speed controls the bends without oscillation. Signs of failure:
      steering_oscillation above about 0.2 means kd or kp is too high; progress stuck
      near 0.3 with few line losses means the speed is too low for the bends. Next
      measurements: progress and line_loss_events show whether the array fixes the
      loss; max_error and steering_oscillation show whether the gains are balanced;
      completion_time shows the speed margin.


