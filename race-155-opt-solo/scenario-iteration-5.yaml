  entities:
  - id: entity0
    label: Forward wide sensor array
    notes: 'Moves the sensor row to y=0.065 and widens it to ±0.042 m, with kd raised
      to 0.5 and kp held at 3.0. Iteration 4 showed that forward sensors cut bend
      line loss (score 463), and the remaining s-bend and slalom failures come from
      line loss and oscillation.


      ### Rationale


      Evidence: iteration 4 scored 462.9, the best so far. It finished all 20 oval
      runs (progress 0.998) but left the track on 18 of 20 s-bend runs and all 20
      slalom runs. Each run averaged about 1.05 to 1.1 line-loss events, and steering_oscillation
      was high on the bends (0.23 slalom, 0.39 s-bend). Moving the sensor row forward
      from y=0.03 to y=0.05 was the largest gain, so the controller benefits from
      seeing the line earlier. The outer sensors at x=±0.036 with 12 mm footprints
      lose the tape once its edge passes about 0.055 m off-centre, which is close
      to the 0.06 m off-track limit. That leaves little margin for the error to recover
      after a line loss.


      Changes: (1) Move the sensor row further forward to y=0.065 for more lead time
      on bends. (2) Widen the array to x=±0.042 with 14 mm spacing, so the line stays
      visible up to about 6 cm of offset. Weights stay linear at -2 to +2, so the
      outer weight-to-position ratio drops about 14 percent, which also reduces the
      gain that caused the high oscillation on the s-bend. (3) Raise kd from 0.4 to
      0.5 to damp the jitter, since sensing now starts earlier and the loop is more
      lag-prone. (4) Keep kp 3.0, base_speed 1.1, ki 0, mass 0.5, wheel_track 0.12
      and body 0.15 x 0.12 m, so the oval result is preserved.


      Expected result: line_loss_events at or below 0.5 per run on the s-bend and
      slalom, steering_oscillation below 0.25, and s-bend and slalom progress above
      0.6. The oval should still finish. Hypotheses: (a) the wider array and forward
      sensors cut line loss on bends; (b) the modest gain reduction plus kd 0.5 lowers
      the oscillation seen on the s-bend. Failure signs: progress stuck near 0.3 on
      the slalom with few line losses means kp is too low or speed too high; oscillation
      above 0.3 means kd or kp is still too high. Next measurements: line_loss_events
      and progress on s-bend and slalom show whether the forward, wider array holds
      the tape; steering_oscillation and max_error show whether the gains are balanced;
      completion_time shows the speed margin.


