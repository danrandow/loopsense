  entities:
  - id: entity0
    label: Baseline 5-sensor robot
    notes: 'First candidate: five 12 mm sensors spaced 10 mm, linear weights, kp 1.5,
      kd 0.3, base speed 1.6, last-direction line loss. No race data yet; chosen from
      the contract to balance speed against stability.


      ### Rationale


      Iteration 0 has no race telemetry, so this is a conservative baseline built
      from the contract. Evidence: none yet. Design choices: (1) Five sensors spaced
      10 mm apart across the 25 mm tape, at x = -0.02 to +0.02, all at y = 0.03 ahead
      of the axle. Five sensors keep the line covered through moderate offsets, and
      12 mm footprints give overlap with the 25 mm tape. (2) Sensor weights are proportional
      to sensor x (-2, -1, 0, 1, 2), so the signal is a centred, sign-consistent estimate
      of line offset with a positive value meaning the line is to the left. (3) kp
      = 1.5 gives a moderate steering response, kd = 0.3 adds damping against oscillation,
      and ki = 0 avoids integral windup on curves. (4) base_speed = 1.6 (about 80
      percent of full PWM) targets the roughly 1.5 m/s average needed to finish in
      3 s while leaving room to correct. (5) line_loss = last_direction, so the robot
      keeps turning toward the side it last saw the line. Geometry: 0.12 m wheel track
      and 0.03 m wheel radius for a stable, moderate-turn platform; 0.12 m body width
      keeps the off-track limit at max(0.06, 0.0125 + 0.03) = 0.06 m; mass 0.8 kg.
      Expected result: the robot completes most of the course with moderate rms error.
      Possible failures: oscillation if kp is too high for the speed, or line loss
      on sharp bends if speed is too high. Next measurements: steering_oscillation
      and max_error will show whether kp/kd are balanced, and line_loss_events will
      show whether speed is too high for the bends.


      - [Open this output](iteration-0/entity0/versions/963f5d2b88464c63b5f816acd7538aca/payload.json)'
  actions:
