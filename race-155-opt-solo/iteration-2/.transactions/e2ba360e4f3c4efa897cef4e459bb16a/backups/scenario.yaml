  entities:
  - id: entity0
    label: Lower gain, wider array
    notes: 'Cut kp from 3.0 to 2.0 and kd from 0.5 to 0.2 to stop the overshoot that
      raised steering oscillation to 0.28 in iteration 1. Widened the array to ±4.5
      cm with 16 mm sensors and the wheel track to 0.14 m to cut line losses. Based
      on iteration 1 race data (0 finishes, all runs off-track).


      ### Rationale


      Evidence from iteration 1 (60 trials, 0 finishes). Steering oscillation rose
      from 0.13 to 0.28 on the oval and from 0.16 to 0.26 on the s-bend, so the iteration
      1 gains were too aggressive, not too weak. The effective steering gain per metre
      of line offset is kp times the outer sensor weight divided by the outer sensor
      position: 3.0 x 2.0 / 0.03 is about 200 per m, versus about 100 per m in iteration
      0. Iteration 1 also narrowed wheel_track to 0.10 m, which raises turn rate per
      PWM difference by about 40 percent. Together these overshoot, and max_error
      reaches the 0.06 m off-track limit on every run. Line-loss events of 1 to 2
      per run on the bends show the robot also leaves the tape on sharp curves.


      Changes: (1) kp reduced from 3.0 to 2.0, and the outer sensor weights kept at
      +/-2 at x = +/-0.045 m, so the effective gain is about 90 per m, in the range
      of the iteration 0 baseline. (2) kd reduced from 0.5 to 0.2. Derivative on a
      signal that swings across the full scale in a sharp bend amplifies jitter, and
      the oscillation metric points that way. (3) Sensor array widened to 7 sensors
      at 15 mm spacing (x = -0.045 to +0.045) with 16 mm footprints. This covers offsets
      to about 5 cm before the line is lost, and the larger footprint gives smoother
      readings across the 25 mm tape. (4) wheel_track widened from 0.10 to 0.14 m
      to lower the turn-rate sensitivity. (5) base_speed reduced from 1.4 to 1.2 so
      the robot can follow the tighter bends. Finish time is sacrificed for staying
      on the line, since a completed run is worth far more. (6) ki stays at 0. body_width
      stays at 0.12 m.


      Expected result: steering_oscillation below 0.15, line_loss_events at 0 to 1
      per run, max_error below 0.05 m, and progress above 0.5 on the s-bend and slalom.
      Hypotheses: (a) the wider 16 mm footprint array removes most line-loss events;
      (b) the lower effective gain stops the overshoot that drives the robot off-track.
      Failure signs: progress stuck near 0.3 with low oscillation means speed is still
      too high or kp too low; oscillation above 0.2 means kd or kp is still too high.


