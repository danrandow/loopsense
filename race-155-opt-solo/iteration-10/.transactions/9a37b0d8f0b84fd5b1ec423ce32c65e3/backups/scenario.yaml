  entities:
  - id: entity0
    label: Sensors forward to y=0.08
    notes: 'Moves the sensor row from y=0.075 to the 0.08 limit, the only change from
      the best raced design (930.9). Iteration 8 to 9 showed forward sensing cut oscillation
      on all tracks, so this tests whether that trend continues without new off-track
      exits.


      ### Rationale


      Evidence: iteration 9 (sensors moved forward to y=0.075) is the best design
      so far at 930.9. The oval (20/20) and s-bend (20/20) finish, and the slalom
      finishes 20/20 with progress 0.997. Iteration 8 to 9 changed only the sensor
      row, from y=0.065 to y=0.075. Steering oscillation fell on all three tracks
      (oval 0.268 to 0.259, s-bend 0.293 to 0.270, slalom 0.357 to 0.332), and slalom
      line-loss events fell from 0.85 to 1.0 in the sample but the slalom now finishes
      every run. Forward sensing is the lever that has consistently helped (y 0.03
      to 0.05 to 0.065 to 0.075). Score sensitivity is dominated by completion and
      progress, so the remaining gains are small: line-loss events (up to about 15
      points if they go from 1 to 0), oscillation, and completion time (about 60 points
      at most). The main risk is going off-track, which costs 500 points per run.


      Change: (1) Move the sensor row to y=0.08, the upper limit of the allowed range,
      continuing the trend that lowered oscillation. x positions, 12 mm footprints,
      linear weights, kp 3.2, kd 0.5, base_speed 1.1, ki 0, last_direction line loss,
      and the geometry (mass 0.4, body 0.10 x 0.12 m, wheel track 0.12 m, wheel radius
      0.03 m) are unchanged, so this isolates one variable. I did not change speed:
      iteration 6 showed that cutting speed slows the robot without fixing off-track
      exits.


      Expected result: oscillation about 0.24 to 0.31 across tracks, slalom and s-bend
      completion at 20/20, line-loss events at or below 0.9 per run, and a score near
      or slightly above 931. Hypotheses: (a) more sensor lead reduces the overshoot
      that drives line loss on the slalom; (b) the lead may add high-frequency gain,
      so oscillation is the first sign if the trend reverses. Failure signs: oscillation
      above 0.35 on any track means kd should drop to about 0.45 next; any new off-track
      exit means the lead has reached its useful limit and I should revert to y=0.075.
      Next measurements: completion, progress and line_loss_events on all three tracks;
      steering_oscillation and max_error to check gain balance; completion_time on
      the oval for the speed margin.


