  entities:
  - id: entity0
    label: Forward sensors, gentler
    notes: 'Moves the sensor row ahead to y=0.05 for more lead time, keeps kp 3.0,
      lowers kd to 0.4 and speed to 1.1, and cuts mass to 0.5 kg. Based on iteration
      1 (best, 124) and iteration 3 (96), which both left the line on bends with 1
      to 1.5 line-loss events per run.


      ### Rationale


      Evidence: iteration 1 (kp 3.0, kd 0.5, speed 1.4, 10 mm sensor spacing at y=0.03)
      scored best at 124.4 and reached progress 0.50 on the oval. Its steering_oscillation
      was 0.28 and max_error sat at the 0.06 m off-track limit. Iteration 2 (kp 2.0,
      kd 0.2) was too sluggish, with progress about 0.12 everywhere. Iteration 3 (kp
      3.5, kd 0.4, speed 1.3) scored 96, with 1.15 to 1.45 line-loss events on the
      bends. Across runs, the robot leaves the line after the error grows past about
      4 cm, and the sensors sit only 3 cm ahead of the axle, so they react late. Changes:
      (1) Move the sensor row forward to y=0.05 so the controller sees the line about
      2 cm earlier, which gives more lead time on bends. Keep 7 sensors at 12 mm spacing
      (x = -0.036 to +0.036), 12 mm footprints and linear weights -2 to +2. (2) Keep
      kp at 3.0, the level that gave the best oval progress. (3) Lower kd to 0.4 to
      cut the jitter seen at kd 0.5 (oscillation 0.28). (4) Lower base_speed to 1.1
      so the robot takes the tight bends with less lateral overshoot. Finish time
      is sacrificed for staying on the line. (5) Reduce mass to 0.5 kg to lower yaw
      inertia and speed up the response. Geometry is otherwise unchanged: wheel_track
      0.12, wheel_radius 0.03, body 0.15 x 0.12 m. Expected result: line_loss_events
      at 1 or fewer, max_error below 0.05 m, steering_oscillation near 0.2, and progress
      above 0.5 on s-bend and slalom. Hypotheses: (a) forward sensors reduce line
      loss on bends; (b) a lower speed with kd 0.4 cuts overshoot. Failure signs:
      progress under 0.3 with few losses means speed or kp is too low; oscillation
      above 0.25 means kp or kd is too high. Next measurements: progress and line_loss_events
      show whether the forward array holds the line; max_error and steering_oscillation
      show whether the gains are balanced; completion_time shows the speed margin.


