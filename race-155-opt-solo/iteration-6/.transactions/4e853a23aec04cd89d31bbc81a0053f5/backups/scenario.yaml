  entities:
  - id: entity0
    label: Slower, damped slalom fix
    notes: 'Keeps the iteration 5 geometry and kp 3.0, lowers base_speed to 0.95 and
      kd to 0.45 to cut slalom line loss and jitter. Rests on iteration 5 slalom results
      (0/20 finished, 1.05 line losses, oscillation 0.45) and the oval success.


      ### Rationale


      Evidence: iteration 5 is the best design so far (score 711.2). The oval finished
      20/20 (progress 0.997). The s-bend finished 18/20 (progress 0.977, 2 off-track
      exits). The slalom never finished: 0/20 runs, progress 0.77, 1.05 line-loss
      events per run, steering_oscillation 0.45 and control_effort 14.3, the highest
      of any track. Slalom is therefore the bottleneck, and the failures are overshoot
      and line loss rather than a lack of sensing. Compared with iteration 4 (same
      gains, sensors at y=0.05), moving the array to y=0.065 and widening it to ±0.042
      raised slalom progress from 0.31 to 0.77, so the sensing change helped. The
      jitter also rose with the change (oval oscillation 0.18 to 0.30, slalom 0.23
      to 0.45), which points to the loop being too aggressive for the bends now that
      it sees the line earlier.


      Changes: (1) base_speed lowered from 1.1 to 0.95, so the robot has more time
      to correct on the slalom''s quick direction changes and each line loss has less
      overshoot. The finish-time term is worth at most 60 points and changes by only
      a few points for this speed change, while a completed run is worth 500. (2)
      kd lowered from 0.5 to 0.45. The oscillation grew after kd moved from 0.4 to
      0.5, so this trims derivative amplification of the signal jitter. kp stays at
      3.0, since that gain is what gave the progress and the oval result. (3) Geometry
      is kept identical to iteration 5, so this race isolates the speed and damping
      effect.


      Expected result: slalom line_loss_events near 0.5 or below, steering_oscillation
      near 0.3 or lower, and slalom progress above 0.9. A first slalom finish is plausible.
      The oval should still finish, with a completion time of about 2.2 s. Hypotheses:
      (a) lower speed reduces the overshoot that drives slalom line loss; (b) a small
      kd reduction cuts jitter without removing the damping needed for the bends.
      Failure signs: if slalom progress stays near 0.77 with the same line losses,
      the limit is the steering authority, so the next step should be a modest kp
      increase or a wider array. If oscillation rises above 0.4, kd is still too high
      relative to the sensor lead. Next measurements: progress and line_loss_events
      on slalom and s-bend, steering_oscillation and max_error on all tracks, and
      completion_time on the oval to check the speed margin.


