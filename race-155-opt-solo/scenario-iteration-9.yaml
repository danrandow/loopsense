  - id: entity0
    label: Sensors forward to
    notes: 'Moves the sensor row 1 cm further ahead of the axle (y 0.065 to 0.075),
      the lever that gave the largest earlier gains, with all other values held from
      iteration 8. Based on slalom line losses of 0.85 and one off-track exit in the
      best design so far (925).


      ### Rationale


      Evidence: iteration 8 (score 925.3, best so far) finished 20/20 on the oval
      and s-bend and 19/20 on the slalom. Its remaining losses are line-loss events
      (0.90 oval, 0.35 s-bend, 0.85 slalom), steering oscillation (0.27 to 0.36) and
      the one slalom off-track exit. Score is dominated by completion (500) and progress
      (250), so each lost run costs far more than the time or tracking terms can recover.
      Across the history, moving the sensor row forward gave the largest gains: y
      0.03 to 0.05 gave a large jump in s-bend and slalom progress, and y 0.05 to
      0.065 with a wider array raised slalom progress from 0.31 to 0.77. Speed reduction
      (iteration 6) and gain increases beyond kp 3.2 did not clearly help. Change:
      sensor row moved forward from y=0.065 to y=0.075, the upper part of the allowed
      range, with x positions, footprint, weights and all controller values unchanged.
      This gives roughly 1 cm more lead before the line is lost, the same lever that
      helped most before, and it isolates one variable. Expected result: slalom line_loss_events
      of 0.6 or below, slalom finishes of 19 or 20, and oscillation near the current
      level or slightly lower. Oval and s-bend should still finish. Hypotheses: (a)
      more sensor lead cuts line loss on the quick slalom direction changes; (b) the
      larger lead may raise effective high-frequency gain. Failure signs: if oscillation
      rises above 0.4 on the oval or s-bend, the lead is adding gain and kd should
      drop toward 0.45 next. If slalom line losses do not fall, the limit is steering
      authority rather than sensing. Next measurements: completion, progress and line_loss_events
      on all three tracks, steering_oscillation and max_error to check gain balance,
      and completion_time on the oval for the speed margin.


