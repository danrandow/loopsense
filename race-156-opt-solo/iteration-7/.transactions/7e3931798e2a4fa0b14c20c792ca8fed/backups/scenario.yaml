  entities:
  - id: entity0
    label: More damping, lighter
    notes: 'Raises kd from 1.0 to 1.2 and cuts mass from 0.6 to 0.5 kg, keeping the
      sensors at y=0.08 that took slalom finishes from 16 to 19 of 20. The aim is
      to cut the slalom''s remaining off-track exit and line-loss events, based on
      the iteration 6 race data.


      ### Rationale


      Evidence from iteration 6 (score 927.4, best so far). Oval (20/20 finishes,
      1.86 s, rms 0.004) and s-bend (20/20, 2.10 s) are near their ceiling. The slalom
      is the remaining gap: 19/20 finishes, one off-track exit, 0.98 progress, 1.0
      line-loss events per run, and finishing runs take 2.48 s. Moving the sensors
      forward from y=0.07 to y=0.08 lifted slalom finishes from 16/20 to 19/20, which
      supports the late-reaction hypothesis (H6). Each line-loss event costs 15 points
      on every track, and each off-track exit costs about 500 points, so the priority
      is fewer line losses on the slalom. This iteration makes two changes. (1) kd
      1.0 to 1.2 for more damping of the faster corrections. Oval steering_oscillation
      is 0.21, so there is room for more damping without much jitter. (2) Mass 0.6
      to 0.5 kg to reduce yaw inertia and speed up correction. The mass is at the
      low end of its range and the drive is not expected to be grip-limited at these
      speeds. Sensors (y=0.08, span +/-0.045 m), weights, kp 2.0, ki 0.05, base_speed
      1.0, line_loss and the other geometry are unchanged, so the effect can be attributed.
      Expected result: slalom finishes 19/20 or 20/20, line_loss_events falling from
      about 1.0 toward 0.5 or less on the slalom, oval and s-bend unchanged near 945
      and 940, and slalom time near 2.4 s. Risks: kd 1.2 could add jitter on the oval,
      and lower mass could make the robot more sensitive to the motor mismatch. Hypotheses:
      H8, more damping reduces the line-loss events from overshoot on alternating
      bends; H9, lower mass shortens the correction time enough to cut slalom off-track
      exits. Measurements wanted next: slalom completion and line_loss_events to test
      H8 and H9; steering_oscillation on all tracks to check kd jitter; completion_time
      on the oval and s-bend to confirm the time budget at base_speed 1.0.


