  entities:
  - id: entity0
    label: Forward sensors, kd 0.8
    notes: 'Reverts to the iteration 2 sensor spread, which had the best score, and
      moves sensors 2 cm forward with kd raised to 0.8 to reduce late correction on
      slalom bends. Based on iteration 3, where slalom progress fell from 0.33 to
      0.16 when spacing widened and kp rose to 2.6.


      ### Rationale


      Evidence from iteration 3 (score 418, down from 443). The oval still finishes
      16/20 at 1.89 s with max_error 0.045 m, so the baseline steering works on gentle
      curves. The s-bend fell to 2/20 finishes, and the slalom got worse: progress
      0.16 (from 0.33), 0/20 finishes, and max_error about 0.063 m, which is just
      above the fixed 0.06 m off-track limit. The body width cannot raise that limit
      (0.0125 + body_width/4 stays under 0.06 for every allowed body), so tracking
      error on sharp alternating bends must fall. Iteration 3 changed three things
      at once (slower speed, wider 0.02 m sensor spacing over +/-0.06 m, kp 2.6).
      Slalom progress fell, so the wider spacing and higher kp are the likely causes,
      not speed. Hypothesis H5: the robot reacts too late to alternating bends. Sensors
      at y = 0.04 m see the line only after the wheels have already moved onto it,
      so the correction arrives late and overshoots. Changes: (1) revert to the iteration
      2 sensor layout (seven sensors, 15 mm spacing, x = -0.045 to +0.045, weights
      [-2,-1.33,-0.67,0,0.67,1.33,2]), which had the best score and the most slalom
      progress; (2) move the sensors forward to y = 0.06 m to give about 2 cm more
      lead; (3) base_speed 1.2 to 1.1, a small cut for more correction time, with
      the oval still well within 3 s; (4) kp 2.0 unchanged, to avoid the jitter seen
      at kp 2.6; (5) kd 0.6 to 0.8, to damp the faster corrections that the lead creates.
      Expected result: slalom progress above 0.33 and some slalom completions, s-bend
      finishes at or above iteration 2 levels, and oval unchanged at about 15-16 finishes.
      Risks: kd 0.8 could add jitter (oval steering_oscillation was 0.38), and the
      forward sensors may lose the line on tight bends. Measurements wanted next:
      slalom progress and max_error to test H5; steering_oscillation to check kd jitter;
      completion_time on the oval to confirm the time budget; and line_loss_events
      on the s-bend to see whether the forward sensors lose the line.


