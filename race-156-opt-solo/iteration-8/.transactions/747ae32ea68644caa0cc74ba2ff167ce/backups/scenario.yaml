  entities:
  - id: entity0
    label: Faster base speed 1.1
    notes: 'Raises base_speed from 1.0 to 1.1 and leaves geometry and steering unchanged,
      since iteration 7 finished every development run with low oscillation. The aim
      is to recover completion-time points, with the risk that the line is lost more
      often on the slalom.


      ### Rationale


      Evidence from iteration 7 (score 931.4, best so far): all 60 development trials
      finished (oval 20/20, s-bend 20/20, slalom 20/20). Mean times are 2.16 s (oval),
      2.37 s (s-bend) and 2.75 s (slalom), and rms_error is 0.006 to 0.014 m. The
      score is now limited by three small terms: line_loss_events of 1.0 on every
      track (about 15 points each), completion time (about 17 points lost on the oval
      and about 5 on the slalom), and a small rms term. Off-track exits, which cost
      about 500 points each, have been eliminated on the development tracks, so there
      is some margin to trade for speed. Iteration 7''s kd 1.2 and mass 0.5 kg kept
      oscillation low (oval 0.21), so the steering is not jittering. Changes: (1)
      base_speed 1.0 to 1.1. Time is worth up to 60 points, and a 10 percent speed
      increase should cut the oval time by about 0.15 s and the slalom time by about
      0.2 s, gaining roughly 3 to 4 points per track. The slalom would still finish
      comfortably within 3 s. (2) All other values are unchanged (sensors at y=0.08
      across +/-0.045 m, weights, kp 2.0, ki 0.05, kd 1.2, mass 0.5, line_loss last_direction),
      so the effect of speed alone can be read. Expected result: score about 935 to
      940, with completion times falling and line_loss_events and off-track exits
      staying at zero to one per run. Risk: a faster run may lose the line more often
      on the tightest slalom bends, which would cost about 15 points per event and
      could cause an off-track exit (about 500 points). Hypotheses: H10, the single
      line-loss event per run happens at a fixed point (likely the start or the finish,
      since it appears on every track at a similar rate), not on the tightest bends,
      so it is not affected by speed. H11, the time saving from base_speed is larger
      than the extra loss risk on the development tracks. Measurements wanted next:
      completion_time on all tracks to confirm the time saving; line_loss_events and
      max_error on the slalom to test H10 and check for loss from speed; completion
      and progress on the slalom to rule out off-track exits; and steering_oscillation
      to confirm kd 1.2 is still not causing jitter at the higher speed.


