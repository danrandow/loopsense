  entities:
  - id: entity0
    label: Larger sensors, faster
    notes: 'Keeps iteration 8''s best layout and gains but enlarges sensor footprint
      to 16 mm and raises base_speed to 1.2. This targets the persistent one line-loss
      event per run and oval completion time. Iteration 9 showed that widening the
      sensor span did not reduce line losses, so that change is reverted.


      ### Rationale


      Evidence: iteration 8 (score 932.0, best) finished all 60 development trials.
      Per track: oval 940 (2.12 s, rms 0.004, 1.0 line-loss event), s-bend 934 (2.34
      s, 0.95 events), slalom 922 (2.78 s, 1.0 event). Off-track exits are gone on
      the development tracks, so the remaining score losses are about 15 points per
      line-loss event, about 18 points of oval completion time, and a few points of
      rms error.


      Iteration 9 tested H7 (line loss from the line leaving the +/-0.045 m span)
      by widening the span to +/-0.06 m and raising kp to 2.6. Line-loss events did
      not fall (still about 1.0 per run) and the score dropped to 921. H7 is therefore
      rejected, and the wider span with kp 2.6 is not the fix. I am reverting to iteration
      8''s span, kp 2.0 and weights.


      Changes: (1) sensor_size 0.012 to 0.016 m. A larger footprint covers more of
      the 25 mm tape at the sensor edges, so the summed reading should stay above
      the 0.05 line-loss threshold for longer, which may remove the single consistent
      loss event per run (H13). (2) base_speed 1.1 to 1.2, to recover some completion
      time, since time is worth up to 60 points and iteration 7 to 8 showed a speed
      gain with no added losses. Everything else matches iteration 8: sensors at y
      = 0.08 m across +/-0.045 m, weights [-2,-1.33,-0.67,0,0.67,1.33,2], kp 2.0,
      ki 0.05, kd 1.2, mass 0.5 kg, track 0.12 m, radius 0.03 m, body 0.12 x 0.16
      m, line_loss last_direction.


      Expected result: score about 935 to 942, with line_loss_events falling toward
      0.5 or less and oval completion time near 2.0 s. Risks: the larger footprint
      blurs the edge of the line and could slightly reduce steering precision on the
      tightest slalom bends. The faster base speed could also raise line loss. If
      line losses stay at 1.0, H13 is rejected and the cause is probably a fixed point
      in the course (H10).


      Measurements wanted next: line_loss_events per track (test H13), completion_time
      on oval and slalom (confirm the speed gain), max_error and off-track counts
      on the slalom (check the tighter-bend risk), and steering_oscillation (confirm
      no jitter).


