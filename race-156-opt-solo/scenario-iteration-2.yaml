  entities:
  - id: entity0
    label: 7-sensor, slower, kp 2
    notes: 'Seven sensors over +/-0.045 m with finer spacing, base speed cut to 1.2,
      kp raised to 2.0 and kd to 0.6. Based on iteration 1: the oval finishes 75%
      but the s-bend and slalom still leave the track at max_error about 0.06 m, so
      the design targets tighter bend tracking.


      ### Rationale


      Evidence from iteration 1 (score 347): the oval now finishes 15 of 20 trials
      (progress 0.94, mean time 1.69 s), so the change to a wider sensor spread, lower
      kp and higher kd worked on smooth bends. The s-bend (progress 0.42) and slalom
      (progress 0.17) still leave the track every time, with max_error about 0.062-0.066
      m against the 0.06 m off-track limit. The body-width term cannot raise that
      limit (it is max(0.06, 0.0125 + body_width/4), which stays at 0.06 for any allowed
      body), so tracking error on sharp alternating bends has to fall. Oval steering_oscillation
      of 0.33 is moderate, so the robot is not badly jittering there. Hypothesis H3:
      on tight, alternating bends the robot is too fast and too slow to respond, so
      it cuts past the line. Changes: (1) base_speed 1.4 to 1.2, giving more time
      to correct on bends. The oval has time headroom (1.69 s, limit 3 s), so this
      should still finish. (2) kp 1.6 to 2.0, for a stronger correction on sharp bends.
      (3) kd 0.4 to 0.6, to damp the faster corrections. (4) Seven sensors at x =
      -0.045, -0.03, -0.015, 0, 0.015, 0.03, 0.045 (spacing 15 mm, same +/-0.045 m
      span) with weights [-2, -1.33, -0.67, 0, 0.67, 1.33, 2]. This keeps the signal
      gain per metre of lateral error about the same as iteration 1 (about 44 per
      m) but gives finer position resolution, so the line is less likely to fall between
      sensors on the slalom. Geometry otherwise unchanged (mass 0.6, track 0.12, radius
      0.03, body 0.12 x 0.16). Expected result: slalom and s-bend progress rising
      well above 0.17 and 0.42, with some completions on the s-bend, and max_error
      nearer 0.05 m. Risk: kd 0.6 might add jitter, and the slower speed could push
      the oval close to the 3 s limit. Next measurements wanted: completion_time and
      progress per track, max_error and line_loss_events on the s-bend and slalom,
      and steering_oscillation to check whether the extra kd causes jitter.


