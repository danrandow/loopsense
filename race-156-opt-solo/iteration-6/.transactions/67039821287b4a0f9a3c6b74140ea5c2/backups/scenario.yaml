  - id: entity0
    label: Sensor lead to y=0.08
    notes: 'Moves the sensor array to the maximum allowed forward position (y=0.08
      m), changing nothing else from the best design so far (score 901). Slalom off-track
      exits (4 of 20) are the main gap, and the lead trend from iterations 3 to 5
      supports this change.


      ### Rationale


      Evidence from iteration 5 (score 901, best so far). The oval (20/20 finishes,
      1.82 s, rms 0.005) and s-bend (20/20, 2.08 s) are solved. The slalom is the
      remaining gap: 16/20 finishes, 4 off-track, mean 809 against about 950 on the
      other tracks, with 0.9 line-loss events per run and max_error 0.035 m. Its failures
      are off-track exits, not timeouts, and finishing trials take 2.5 s, so the time
      budget is tight but not the main limit. The trend from iterations 3 to 5 (sensor
      lead 0.04 to 0.06 to 0.07 m, with kd raised to 0.8 and then 1.0) supports H6:
      the robot reacts late to sharp alternations, and more lead plus damping reduces
      this. The sensor y-range allows up to 0.08 m, so this iteration moves the sensors
      to y = 0.08 and changes nothing else, to isolate the lead effect. Geometry other
      than y, the sensor span (+/-0.045 m), weights, kp 2.0, ki 0.05, kd 1.0, base_speed
      1.0 and line_loss are unchanged. I did not raise base_speed, because slalom
      finishes already take about 2.5 s and a faster run risks more line loss. Expected
      result: slalom off-track count falls from 4 to 0-2 and slalom progress rises
      toward 0.98, with the oval and s-bend staying near their current scores. Risks:
      the forward sensors may lose the line on the tightest bend (H7, line loss when
      the line leaves the span), and the extra lead could add overshoot on the oval.
      Hypotheses: H6, more lead cuts slalom off-track exits; H7, line-loss events
      come from the line leaving the sensor span. Measurements wanted next: slalom
      completion, progress and max_error to test H6; line_loss_events on the slalom
      and s-bend to test H7; steering_oscillation to check whether the extra lead
      adds jitter; and completion_time on the slalom to confirm it stays under 3 s.


