    label: Refined controller gains
    notes: 'Reduced base_speed to 1.35 and increased kd to 4.0 for better damping
      and stability, kept kp and ki steady, and maintained sensor weights to balance
      steering. Geometry unchanged. This aims to reduce oscillations and line loss
      events while preserving progress.


      ### Rationale


      The Evaluator feedback confirms that the last candidate has not yet been raced,
      so no telemetry data is available to verify the effects of the current parameters.
      The current controller settings reduce base_speed slightly to 1.35 to lower
      aggressive driving, increase kd to 4.0 for stronger damping, and keep kp at
      7 and ki at 0.35 to maintain responsiveness and integral correction. Sensor
      weights are set to [-1.0, -0.8, 0, 0.8, 1.0], preserving steering balance and
      increasing inner sensor influence for better precision. The geometry remains
      unchanged as no issues were reported. These changes aim to reduce oscillations
      and line loss events while maintaining good progress. I expect improved stability
      and smoother line following. I request telemetry on completion, progress, line_loss_events,
      rms_error, and steering_oscillation to confirm these improvements.


