    label: Final candidate for race
    notes: 'Kept controller and geometry unchanged from last candidate as recommended
      by Evaluator due to lack of telemetry. This candidate balances stability and
      steering precision with a slightly reduced base speed and increased damping.
      Requesting telemetry to inform final tuning and maximize score on held-back
      track.


      ### Rationale


      The Evaluator feedback confirms no telemetry data is yet available for the current
      candidate, which has a base_speed of 1.35, kd of 4.0, ki of 0.35, kp of 7, and
      sensor_weights of [-1.0, -0.8, 0, 0.8, 1.0]. These parameters aim to improve
      stability by reducing aggressive driving and increasing damping, while enhancing
      steering precision through sensor weight adjustments. The geometry remains unchanged
      as it was previously balanced and no issues were reported. Given the limited
      remaining runs and the lack of telemetry, I will keep this candidate unchanged
      and recommend approving it to race. This will provide essential telemetry data
      on completion, progress, line_loss_events, rms_error, and steering_oscillation,
      which are critical to inform any final tuning decisions and maximize performance
      on the held-back track.


