map:
  id: race-208-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Narrower track, ki off
    notes: 'Draft keeps the iteration-5 body and sensors but narrows wheel_track to
      0.10 m for more yaw response, and sets ki back to 0. Iteration 6 showed ki=1
      gave identical metrics, and iterations 2 and 4 showed kp/kd changes made no
      difference, so turning geometry is the untested lever.


      ### Rationale


      Evidence: all 60 trials in each development design so far ended off track at
      max_error about 0.06 m, the off-track limit, with rms_error about 0.03 m. The
      best design is iteration 5 (score 137.76), which has body 0.14 x 0.10, mass
      0.5 kg, and sensors at y=0.07 with x=-0.06..+0.06 and a 16 mm footprint.


      Two results point away from the controller gains. Iterations 2 and 4 scored
      identically (132.0028) although kp moved 3.0 to 2.8 and kd moved 0.4 to 1.0.
      Iteration 6 added ki=1.0 to iteration 5 and every metric matched to four decimals,
      so the integral term had no measurable effect. The bias-cancelling hypothesis
      from iteration 6 is therefore not supported, and I will set ki back to 0 to
      avoid unneeded windup.


      The untested lever is turning authority. Yaw rate is roughly (right wheel minus
      left wheel speed) divided by wheel_track, so a narrower track gives more heading
      change per unit of PWM difference. Iteration 5 lowered yaw inertia, but the
      robot still drifts to the edge on curves. Changes: (1) wheel_track from 0.12
      to 0.10 m, to increase yaw response per unit of steering command; (2) ki from
      1.0 to 0, since it had no effect; (3) keep the iteration-5 geometry otherwise,
      and keep kp 3.0, kd 0.4, base_speed 1.3 and last_direction line loss, so the
      wheel-track change is isolated. Expected result: the robot corrects faster on
      curves, max_error stays below the limit for longer, and progress rises above
      the 0.55 seen on the oval. Finishing within 3 s still needs a later speed increase.
      If this does not move progress, the next test is base_speed toward 1.6 with
      wheel_track held at the new value.


      - [Open this output](iteration-7/entity0/versions/720d70689d65452fb78690a736a202fb/payload.json)

      - Based on: [entityR2A](iteration-7/entityR2A/versions/carried-5ce958fa69469ec7/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critiques the wheel_track and ki draft. Main points: narrowing the track
      is effectively a kp increase, the identical scores across gain changes suggest
      controller fields may not be reaching the simulator, and the bias hypothesis
      was dismissed without a valid test. Based on the iteration 2 to 6 race data.


      - [Open this output](iteration-7/entityC1/versions/99d1ffab03ce4438af020b46505913e0/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/720d70689d65452fb78690a736a202fb/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-5ce958fa69469ec7/payload.json)'
  - id: entity1
    label: Speed 2.0 on best design
    notes: 'Keeps the iteration-5 geometry and controller exactly, changing only base_speed
      from 1.8 to 2.0 to test the time and completion terms. Rests on iteration 5
      (137.76) and the 1.6 to 1.8 speed gain; wheel_track, ki and kd changes were
      dropped because the critique showed they were confounded or unsupported.


      ### Rationale


      Evidence: iteration 5 (score 137.76) is the best measured design. It is iteration
      2''s geometry and controller with base_speed raised from 1.6 to 1.8. That speed
      step added about 5.8 points, and the single oval finish (1.88 s at base 1.6)
      shows time margin on that track. Every trial still ends off track with max_error
      at about 0.06 m and rms_error at about 0.03 m. Line loss remains 0.65 to 0.8
      per run on the s-bend and slalom.


      What I accepted from the round-1 critique: (1) The critique is right that my
      draft changed several things at once. A wheel_track change is mainly a gain
      change (about 20% more yaw per unit of command), and the draft''s four-field
      geometry change could not be attributed. I reject the draft as written. (2)
      The critique is right that ki 1.0 is outside the tested range and that ki 0.6
      already scored lower than ki 0.3. I reject ki 1.0 and ki 0. (3) The critique
      is right that the body_width argument is vacuous below 0.19 m, and that the
      identical iteration 2 and 4 scores need checking. I keep the iteration-5 geometry
      because it is the best-evidenced geometry.


      What I changed: base_speed from 1.8 to 2.0, the top of the useful range (above
      2.0 nothing changes). Everything else is identical to iteration 5, so this is
      a single-variable test. The 3 s limit needs about 1.5 m/s average, and a faster
      base is the only lever that targets the completion and time terms (500 plus
      up to 60 points) without a new unverified gain.


      Expected result: at least as much progress as iteration 5 (oval about 0.55),
      some reduction in completion_time on runs that stay on track, and possibly more
      off-track ends if lateral load is the limit. Decision rule for the next round:
      if progress rises and the run stays on track, keep 2.0 and test whether s-bend
      and slalom line-loss events fall. If progress falls or off-track ends rise sooner,
      return to 1.8 and test one sensor footprint or span change on the s-bend and
      slalom. If max_error still reaches 0.06 with flat rms, the next single test
      is ki 0.1, not ki 1.0.


      - [Open this output](iteration-7/entity1/versions/25799f9f9ebf4492b9e2945814ccc495/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/720d70689d65452fb78690a736a202fb/payload.json),
      [entityC1](iteration-7/entityC1/versions/99d1ffab03ce4438af020b46505913e0/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-5ce958fa69469ec7/payload.json)'
  - id: entityC2
    label: Round-2 critique
    notes: 'Critiques base_speed 2.0 on the iteration-5 design. Key points: at 2.0
      the full-PWM base removes wheel-command headroom, the bend scores fell from
      1.6 to 1.8, and the rationale''s line-loss evidence is stale (iteration 5 shows
      0.0 on bends).


      - [Open this output](iteration-7/entityC2/versions/b97293a9725b45828e2743ad8561bd97/payload.json)

      - Based on: [entity1](iteration-7/entity1/versions/25799f9f9ebf4492b9e2945814ccc495/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-5ce958fa69469ec7/payload.json)'
  - id: entity2
    label: Iter 5 design, speed 1.8
    notes: 'Reverts base_speed to 1.8 (best measured, 137.76) and rejects 2.0, because
      base_pwm saturates at 4095 there and bend progress fell with speed. Geometry
      and controller otherwise match iteration 5.


      ### Rationale


      Final design: iteration 5 (score 137.76, best measured), with base_speed set
      back to 1.8. I reject the 2.0 change, partly accepting the round-2 critique.


      Why the 2.0 step is rejected: base_pwm = 4095 * min(1, base/2) reaches the 4095
      ceiling at base_speed 2.0. At 1.8 there are about 410 counts of wheel-command
      headroom (roughly turn 1.2) before clipping. At 2.0 there is none on the outside
      wheel, so steering authority is lost in the direction that matters on bends.
      The critique''s measured bend data points the same way: going from base 1.6
      to 1.8 cut s-bend progress from 0.27 to 0.18 and slalom from 0.16 to 0.12, and
      the oval gain carried the net score. Line loss on the bends fell to 0.0 at 1.8,
      so the bend failure is off-track or lateral, not line loss.


      What I kept: geometry, kp 2.8, ki 0.3, kd 0.4, sensor weights and last_direction
      line loss, all identical to iteration 5. I also accept the critique''s point
      that the Evidence line about line loss of 0.65 to 0.8 was stale; the current
      measured value at 1.8 is 0.0 on the bends.


      What I changed: nothing relative to iteration 5. Re-racing it is a control against
      the best known design, not a new test, so this iteration protects the score.
      I am not adopting 1.9 or 2.0 because neither has evidence.


      Expected result: about 137.8, consistent with iterations 5 and 6. Next-round
      test, if I keep this line: a single-variable change to ki (0.1) or to one sensor
      footprint, judged against the bend mean scores (about 78 and 52) and the oval
      progress (about 0.55). I drop the footprint option unless it has a stated mechanism
      for the off-track end.


      - [Open this output](iteration-7/entity2/versions/753762ed7f3f412daecf2c387c5a7f1e/payload.json)

      - Based on: [entity1](iteration-7/entity1/versions/25799f9f9ebf4492b9e2945814ccc495/payload.json),
