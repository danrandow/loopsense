map:
  id: race-208-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 2
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 1.
dimensions:
  time_horizon: prepared
  iteration: '2'
overrides:
  entities:
  - id: entity0
    label: Draft Design
    notes: 'Draft Design. The model did not supply a valid label and summary, so the
      orchestrator wrote this one.


      ### Rationale


      Evidence: all 60 development trials ended off track, with progress 0.11 to 0.18
      (about 0.5 to 0.8 m of a 4 to 5 m course). Max error reached about 0.06 m in
      every trial, which is the off-track limit (max(0.06, 0.0125 + body_width/4)
      = 0.06 for any allowed body width). RMS error was about 0.02 to 0.03 m. Iteration
      1 (base 1.2, sensors at y=0.05, kp 2.0, kd 0.6) was not better than iteration
      0 (base 1.5, y=0.03, kp 2.5, kd 0.2): mean scores fell from 59.9 to 58.2, and
      progress on the s-bend and oval changed little. So the lower speed, the extra
      lead and the extra damping did not fix the problem. Line loss happened once
      per trial in iteration 0, which suggests the line leaves the sensor array at
      the edge of its span, not that the robot is too fast. The sensors span only
      x = -0.04 to +0.04. Once the tape centre is about 0.05 m off the centre line,
      the tape falls outside the array and the robot has to recover blind. Changes:
      (1) Widen the sensor span to x = -0.06 to +0.06 with 5 sensors, and enlarge
      the sensor footprint to 16 mm so the 25 mm tape is always covered by at least
      one sensor. (2) Keep the sensors at y=0.05, which the iteration-1 evidence did
      not show to hurt. (3) Raise kp from 2.0 to 3.0. The wider spacing lowers the
      signal gain per metre of offset (about 33 per m instead of 50 per m), so a higher
      kp keeps the steering authority similar. (4) Set kd to 0.4, between the two
      earlier values, to damp without over-filtering. (5) Set base_speed to 1.3, between
      the 1.2 and 1.5 that were tried, to keep average speed near the level needed
      to finish. Geometry is otherwise unchanged. Expected result: fewer or no line-loss
      events, max error held below 0.06 m, and progress rising above about 0.25 on
      the development tracks. Finishing within 3 s is still uncertain. The telemetry
      should show whether the wider span fixes the early drift.


      - [Open this output](iteration-2/entity0/versions/c64928a957334090b0b5c8e6e3321465/payload.json)

      - Based on: [entityR2A](iteration-2/entityR2A/versions/carried-4cc5a9276c1927cc/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Round-1 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-2/entityC1/versions/0845c6aa1c9c4bd58de38c61a3512810/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/c64928a957334090b0b5c8e6e3321465/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-4cc5a9276c1927cc/payload.json)'
  - id: entity1
    label: Wide span, ki restored
    notes: 'Keeps the ±0.06 m, 16 mm sensor array that removed line loss on two tracks,
      restores ki 0.3 to counter the motor-mismatch bias, and sets base_speed 1.6
      between the tried 1.5 and 1.8. Rejects the draft''s lower speed and ki 0, since
      the earlier data showed slower runs made less progress.


      ### Rationale


      Evidence: across iterations 0 and 1, all 120 development trials ended off track,
      with progress 0.11 to 0.18 and max_error at the 0.06 m limit in every trial.
      rms_error stayed at 0.02 to 0.03 m. Widening the sensor span to x = ±0.06 (iteration
      1) removed line-loss events on the oval and s-bend, but progress did not improve,
      so the array edge was not the main limit. Iteration 0 at base 1.8 reached more
      progress on the oval (0.17) than iteration 1 at base 1.5 (0.125), which suggests
      speed is not the cause of early failure and that too little speed may slow progress.
      The off-track limit is 0.06 m at body_width 0.12, so I keep that width.


      What I accepted from the round-1 critique: (1) I reject the draft''s base_speed
      1.3 and 1.2 options. The 3 s limit needs about 1.5 m/s average, and the earlier
      data show lower speed gave less progress. I set base_speed 1.6 (PWM 80%), between
      the 1.5 and 1.8 already tried. (2) I restore ki to 0.3. The critique is right
      that a fixed left/right motor mismatch causes a steady bias that P+D control
      cannot remove. ki 0.3 was present in both earlier runs, so this is not a new
      untested change, and the integral is clamped at ±2. (3) I keep the sensors at
      y = 0.06 because they gave the higher progress in iteration 0 and the critique''s
      look-ahead argument favours forward placement.


      What I kept from the draft: the wide span x = -0.06 to +0.06 with 16 mm footprints
      (line-loss removal was seen on two tracks), kp 3.0 to hold steering authority
      with the wider spacing, and kd 0.4 as the middle damping value.


      What I rejected: I did not follow the draft''s ki 0.0 and base 1.3. I did not
      move to a 12 mm footprint or change geometry, because nothing in the data points
      to the body or wheels.


      Expected result: completion_time about 2.8 to 3.0 s if the robot stays on track,
      progress above 0.3, and max_error below the 0.06 limit with fewer off-track
      ends. Decision rule for the next telemetry: if max_error still reaches 0.06
      with no line-loss events, the cause is steering lag or bias, so raise kp or
      ki next. If line loss returns at the edge, the span is still too narrow. If
      the run is on track with completion_time above 3 s, raise base_speed to about
      1.8. If steering_oscillation rises above about 0.2, lower kp before changing
      speed.


      - [Open this output](iteration-2/entity1/versions/60e061074f0342319fba72596b94e93c/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/c64928a957334090b0b5c8e6e3321465/payload.json),
      [entityC1](iteration-2/entityC1/versions/0845c6aa1c9c4bd58de38c61a3512810/payload.json),
      [entityR2A](iteration-2/entityR2A/versions/carried-4cc5a9276c1927cc/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Round-2 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-1/entityC2/versions/adbb80257c8f46eb90ad296747a6d527/payload.json)

