map:
  id: race-208-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Lighter, forward sensors
    notes: 'Cuts mass to 0.5 kg and body length to 0.14 m to lower yaw inertia, and
      moves the sensor row to y = 0.07 for more lead, keeping the iteration-2 controller.
      Iterations 2 and 4 scored identically despite gain changes, so body inertia
      and sensor lead are the untested levers.


      ### Rationale


      Evidence: every development trial ends off track. Max error sits at about 0.06
      m, the off-track limit, in all tracks and seeds, and RMS error is about 0.03
      m. Iterations 2 and 4 scored identically (132.0028) even though kd went from
      0.4 to 1.0 and kp from 3.0 to 2.8, so the controller gains are not the binding
      limit at this geometry. The widened 5-sensor span (x = -0.06 to +0.06, 16 mm
      footprint) cut line-loss events sharply, so sensing coverage is now adequate.
      The remaining failure is the robot drifting to 0.06 m too early, and the body
      is the only other lever I haven''t tested. Changes: (1) Lower mass from 0.8
      to 0.5 kg and shorten the body from 0.18 to 0.14 m (width 0.12 to 0.10 m). Yaw
      inertia scales with mass*(L^2+W^2)/12, so this cuts it by roughly 60 percent,
      letting the wheels correct the heading faster. body_width stays above the point
      where it matters for the off-track limit. (2) Move the sensor row forward from
      y = 0.05 to y = 0.07 to give more phase lead before the robot reaches the edge.
      (3) Keep the sensor span, footprint, kp 3.0, kd 0.4, ki 0 and base_speed 1.3
      as in iteration 2, so this race isolates the inertia and lead change. Expected
      result: lower max error and fewer off-track ends, with progress above the 0.27
      to 0.45 range seen so far. Finishing within 3 s still needs a later speed increase.
      If progress rises but stays short of the finish, the next step is base_speed
      toward 1.6.


      - [Open this output](iteration-5/entity0/versions/38eadc1d9de34465be98ee6bd0192a1c/payload.json)

      - Based on: [entityR2A](iteration-5/entityR2A/versions/carried-133b9005b338b299/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critique of the kp 2.8 / kd 1.0 draft. Iteration 3 vs 2 (same geometry)
      shows raising kd did not reduce oscillation, so the kd rationale is contradicted;
      the max_error pattern suggests a motor-mismatch bias that ki=0 cannot remove.


      - [Open this output](iteration-4/entityC1/versions/720c0d6753bb4a3ebe6e55cd9cf72d86/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/f68a8c6292b44491925f66a9d05dd40a/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-d34574b0d9d665bb/payload.json)'
  - id: entity1
    label: Iter-2 design resubmitted
    notes: 'Resubmits the iteration-2 design unchanged (kp 3.0, ki 0.3, kd 0.4, base
      1.6), the best-scoring candidate at 132.0. The critique''s kd and speed changes
      are rejected because iteration 3''s ki test and the kd evidence did not support
      them.


      ### Rationale


      Evidence: iteration 2 (kp 3.0, ki 0.3, kd 0.4, base_speed 1.6, widened 5-sensor
      span at y 0.06, 16 mm footprints) scored 132.0, the best so far. It is the only
      design with a finish (oval, 1.88 s) and the highest progress on all three tracks
      (oval 0.45, s-bend 0.27, slalom 0.16). Both later single-field changes from
      it scored lower. Iteration 3 (ki 0.3 to 0.6) fell to 122.2, with the oval dropping
      from 218 to 192 and oscillation rising from 0.267 to 0.285. The round-1 critique
      also shows that the iteration-4 draft changes kp, kd and base_speed together,
      so its result could not be attributed to any one change.


      What I accepted from the critique: (1) The kd increase to 1.0 has no support.
      Iteration 1 (kd 0.6) had lower oscillation than iteration 2 (kd 0.4), and iteration
      3 showed that changing gains did not reduce oscillation, so I do not raise kd.
      (2) The score uses progress, line loss and rms, not oscillation, so oscillation
      targets are not my goal. (3) Oval finish time is 1.88 s, so speed is not the
      binding constraint on the oval. (4) The draft''s changes are confounded, so
      I do not make any changes this round.


      What I rejected: (a) Dropping base_speed to 1.3. Lower speed gives a time-limit
      risk for completion (500 points plus 60 time points), and iteration 0 at 1.8
      gave more oval progress than iteration 1 at 1.5. (b) Dropping ki to 0. Removing
      the integral action that was present in the best run is not supported by any
      test. (c) Lowering kp to 2.8. Kp 3.0 produced the only finish and the highest
      progress, so I keep it.


      What I kept: the iteration-2 geometry exactly, and the iteration-2 controller
      exactly (kp 3.0, ki 0.3, kd 0.4, base_speed 1.6, last_direction). This resubmission
      is the best-evidenced candidate. Expected result: the same distribution as iteration
      2, with oval progress about 0.45 and the one-in-twenty finish chance. Decision
      rule for the next round: if max_error still sits at 0.06 with flat rms, and
      the s-bend and slalom still show line loss (0.65 and 0.8), the next single-variable
      test is a sensor-footprint or span change on those tracks, not a gain change.
      If progress stays flat, test base_speed 1.8 on its own, since the oval finish
      suggests time margin exists.


      - [Open this output](iteration-4/entity1/versions/11dcd5c68c6c4405aad149ed4bd1396a/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/f68a8c6292b44491925f66a9d05dd40a/payload.json),
      [entityC1](iteration-4/entityC1/versions/720c0d6753bb4a3ebe6e55cd9cf72d86/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-d34574b0d9d665bb/payload.json)'
  - id: entityC2
    label: 'Round-2 critique:'
    notes: 'Critiques the iteration-2 resubmission. It points out that the race is
      deterministic, so the rationale''s chance-of-finish claim is wrong, and that
      the kd evidence is misattributed to a kd 0.6 run that never raced. Evidence
      is the iteration 0-3 outcome table and the contract''s seed rule.


      - [Open this output](iteration-4/entityC2/versions/b63c781fc9ef42ada236843536d9ff88/payload.json)

      - Based on: [entity1](iteration-4/entity1/versions/11dcd5c68c6c4405aad149ed4bd1396a/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-d34574b0d9d665bb/payload.json)'
  - id: entity2
    label: Resubmit iter-2 best (kp
    notes: 'Resubmits the raced iteration 2 design (score 132.0) unchanged, using
      kp 2.8 as actually raced, not the kp 3.0 quoted in the authorized input. Chosen
      because the race is deterministic per seed and track, and no tested single change
      has beaten 132.0.


      ### Rationale


      Evidence: the raced iteration 2 design scored 132.0028, the best so far. Its
      outcome row (kp 2.8, ki 0.3, kd 0.4, base_speed 1.6, last_direction, sensors
      at x -0.06 to 0.06 with y 0.06 and 16 mm footprints) is the only design with
      a finish (oval, 1.88 s) and the highest progress on every track (oval 0.45,
      s-bend 0.27, slalom 0.16). The authorized entity1 rationale and the round-2
      critique both say kp 3.0, but the raced outcome table and iteration 2 produced
      entity show kp 2.8. I follow the raced record and use kp 2.8, since that is
      the design that was actually scored. The kp 3.0 figure in entity1 is a documentation
      error, and I am not resubmitting it.


      What I accepted from the round-2 critique: (1) The kd 0.6 comparison was misquoted,
      so I do not use it to argue for raising kd. (2) The 1-in-20 framing was wrong.
      Seed and track fix the disturbance, so this resubmission should reproduce 132.0
      exactly. (3) This iteration is a score-preserving choice, not a learning test.
      I make that explicit.


      What I rejected: the entity1 kp 3.0 value, which was not the raced design. I
      also reject changing ki, base_speed, kd or geometry this round. The ki 0.6 test
      (iteration 3) scored lower at 122.2, and the speed and kd comparisons are confounded,
      so none of them is a safe improvement to race now.


      Decision: resubmit the raced iteration 2 design unchanged, with kp 2.8. Expected
      result: score about 132.0 with oval progress 0.45, s-bend 0.27 and slalom 0.16.
      Next-iteration test, if this reproduces: a single-variable change, most likely
      base_speed 1.8 if progress is flat, or a sensor span or footprint change if
      line loss on the s-bend (0.65) and slalom (0.8) is still the limit.


      - [Open this output](iteration-4/entity2/versions/1b4b984027b142c0b965485d2e904f6a/payload.json)

      - Based on: [entity1](iteration-4/entity1/versions/11dcd5c68c6c4405aad149ed4bd1396a/payload.json),
