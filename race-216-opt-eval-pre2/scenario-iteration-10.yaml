  id: race-216-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 10
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 9.
dimensions:
  time_horizon: prepared
  iteration: '10'
overrides:
  entities:
  - id: entity0
    label: Stronger steer, lighter
    notes: 'Narrows wheel track to 0.09 m and mass to 0.55 kg to raise yaw authority
      and responsiveness, with kp raised to 5.0. Sensing and gains that plateaued
      at score 138.6 are kept, since max error sits just above the fixed 0.06 m limit
      on every run.


      ### Rationale


      Evidence: the best raced design (iterations 6, 8 and 9, score 138.64) has five
      sensors at y=0.08 spanning x=-0.05 to +0.05 m, weights [-2,-1,0,1,2], base_speed
      1.0, ki 0.5 and kd 0.6 to 0.8. Across 60 trials it finished 1 of 20 oval runs.
      Every run still leaves the line at max error about 0.062 m, just past the fixed
      0.06 m off-track limit. The body-width term cannot raise that limit, since 0.0125
      + body_width/4 stays below 0.06 for any allowed width. Changes that did not
      move the result: kp 4.0 to 4.5, kd 0.6 to 0.8 (identical metrics), footprint
      16 mm to 12 mm (identical score), and speed 0.9 to 1.6 (small effect). Widening
      the span to +/-0.07 m made things worse. The gains and sensing have plateaued,
      so the remaining untested lever is steering authority and yaw response.


      Changes: (1) wheel_track reduced from 0.12 to 0.09 m. Turn rate is the wheel
      speed difference divided by wheel_track, so for the same PWM differential the
      robot yaws about 33 percent faster. This gives more correction authority at
      the bends where the line is lost. (2) mass reduced from 0.8 to 0.55 kg. Yaw
      inertia scales with mass, so the robot responds faster to the same turn command
      and should overshoot less. (3) Controller kept at the best-known settings (base_speed
      1.0, ki 0.5, kd 0.8) with kp raised to 5.0 to match the stronger effective steering
      per PWM count. Sensors and weights are unchanged so only the physical response
      changes.


      Expected result: fewer line-loss events on the s-bend and max error below 0.06
      m on at least some oval and s-bend runs, which would raise the finish rate above
      the current 5 percent. Completion on the slalom remains unlikely. If progress
      does not move, the next race should test a lower base_speed or search_right
      line-loss handling.


      - [Open this output](iteration-10/entity0/versions/2ff46e8689784120b416114a2afd538c/payload.json)

      - Based on: [entityR2A](iteration-10/entityR2A/versions/carried-dbad8061c79eaad7/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Round-1 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-10/entityC1/versions/12833808c2a94deeace8a7cf499419be/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/2ff46e8689784120b416114a2afd538c/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-dbad8061c79eaad7/payload.json)'
  - id: entity1
    label: Narrow track, raced gains
    notes: 'Revised to change only wheel_track (0.12 to 0.09 m) on the best raced
      design (iteration 6, score 138.6), keeping kp 4.0, ki 0.2, kd 0.3 and base 1.5.
      Rejects the draft''s untested kp 5.0, kd 0.8, ki 0.5, base 1.0 and mass change,
      because the kp arithmetic and overshoot claim were unsupported and bundled changes
      could not be attributed.


      ### Rationale


      Evidence. The outcome table is the reliable record, and it differs from the
      best-design summary in the authorized input. The best raced designs (iterations
      6 and 8, score 138.64) used base_speed 1.5, ki 0.2, kd 0.3, kp 4.0 (or 4.5 in
      iteration 8), sensors at y=0.08 spanning x=-0.04 to +0.04 m at 0.02 m pitch,
      16 mm footprints, weights [-2,-1,0,1,2], and last_direction. The draft''s controller
      (base 1.0, ki 0.5, kd 0.8) and its +/-0.05 m span have not been raced on this
      geometry, so the draft built on untested settings. Across 60 trials of the proven
      base, max_error sat at 0.061 to 0.062 m, line_loss_events were 1.0 per run (1.25
      on the s-bend), and the s-bend reached progress 0.295. Gains (kp 2 to 5, kd
      0.3 to 0.8) and speed (0.9 to 1.6) did not move the failure point. Iteration
      7 showed speed 1.6 cut oval progress from 0.55 to 0.39.


      Critique, point by point:

      1. kp arithmetic: accepted. Narrowing wheel_track to 0.09 m raises yaw per PWM
      count by about 1.33x, so kp 5.0 would stack a further 1.25x on the loop gain.
      The draft''s kp 5.0 is therefore not a matching change. I keep kp at the raced
      4.0, so the controller is unchanged and the loop gain rises only by the geometry
      factor.

      2. Mass and overshoot claim: accepted. No overshoot is measured, and I drop
      the ''overshoot less'' rationale. Mass is returned to the raced 0.8 kg, since
      the draft''s mass claim is unsupported and changing it would confound the test.

      3. Bundled changes: accepted. Only wheel_track changes against the best raced
      design (iteration 6). This makes any result attributable to steering authority.

      4. Constant one line loss per run: accepted as a open issue. Gains and authority
      do not address a fixed event, so I do not claim this change fixes it. The measurements
      requested will show whether line_loss_events move.

      5. kd: kd returns to the raced 0.3. Kd 0.8 was never shown to help.

      6. Speed: rejected as a change for this race. Speed 1.0 cannot finish in 3 s,
      and 1.5 is the raced value that produced the finishes. Speed is not the test
      here.


      Change from iteration 6: wheel_track 0.12 to 0.09 m, and nothing else. Expected
      result: a yaw response about 33 percent faster, so max_error should move down
      toward 0.060 and oval finish rate should rise above 0.05. Decision rule: if
      max_error exceeds 0.065 or s-bend progress falls below 0.295, the extra authority
      is harmful and the next test should go back to wheel_track 0.12. If max_error
      is unchanged, the failure is not steering-authority-limited, and the next test
      should locate the single line-loss event in time, not change gains. Completion
      on the s-bend or slalom is still unlikely at this speed.


      - [Open this output](iteration-10/entity1/versions/99affee7e3fb498e88e9de6a5c6ea345/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/2ff46e8689784120b416114a2afd538c/payload.json),
      [entityC1](iteration-10/entityC1/versions/12833808c2a94deeace8a7cf499419be/payload.json),
      [entityR2A](iteration-10/entityR2A/versions/carried-dbad8061c79eaad7/payload.json)'
