map:
  id: race-216-opt-eval-pre2
  schema: v0.2
  title: Robot Race 216 — Optimizer Evaluator (critique before commit)
  scenario: Moving Parts
  is_moo: true
  notes: 'The critique-before-commit entrant: the Optimizer drafts, the Evaluator
    critiques twice with no approval power, and the Optimizer delivers the final candidate,
    which races unchanged.'
  dimension_axes:
  - time_horizon
  - iteration
actors:
- id: actor0
  label: Robot Optimizer (draft)
  notes: Drafts a complete candidate and rationale from the last race's telemetry.
- id: actor1
  label: Evaluator (round 1)
  notes: Critiques the draft candidate and its rationale. No approval power.
- id: actor2
  label: Robot Optimizer (revision)
  notes: Reads the round-1 critique and its own draft, and delivers a revised candidate
    and rationale.
- id: actor3
  label: Evaluator (round 2)
  notes: Critiques the revised candidate and its rationale, the same way as round
    1. No approval power.
- id: actor4
  label: Robot Optimizer (final)
  notes: Reads the round-2 critique and its own revision, and delivers the final candidate
    and rationale that races.
- id: actor5
  label: Race Simulator
  notes: Deterministic software actor that races and records evidence.
actions:
- id: action0
  label: Draft Design
  actor: actor0
  notes: 'Produces a complete geometry-controller candidate and a rationale.


    ## Common to every agent

    You are competing with other teams to race a line-following robot on a held-back
    track. Do everything you can to maximise your team''s score on that track. Learn
    and improve as much as you can, working with the other agent in your team, with
    each iteration, within your budget.


    ## This team: Robot Optimizer and Evaluator

    Each iteration, the Optimizer drafts a complete candidate and a rationale; the
    Evaluator critiques both, twice, once after the draft and once after the revision;
    the Optimizer reads each critique and decides what to do with it, including rejecting
    it outright, and delivers the final candidate, which races unchanged. The Evaluator
    has no approval power at any point: every version that exists is the Optimizer''s
    own decision. No critique is carried into a later iteration.


    ## Your role: Robot Optimizer, drafting

    Deliver one complete line-following robot candidate (geometry and controller)
    and a rationale, using the Optimizer Race Data (telemetry from the last race).
    This is your first draft for this iteration; the Evaluator will critique it next,
    and you will have two more chances to act on that critique before your final delivery
    races. In your rationale say what you changed, why, and what result you expect.'
  measures:
  - id: input_tokens
    name: Model input tokens
    unit: tokens
  - id: output_tokens
    name: Model output tokens
    unit: tokens
  - id: repair_calls
    name: Format repair calls
    unit: calls
    better: lower
  - id: invalid_artifacts
    name: Invalid model artifacts
    unit: artifacts
    better: lower
- id: action1
  label: Critique Draft
  actor: actor1
  notes: 'Critiques the draft candidate and its rationale. No approval power.


    ## Common to every agent

    You are competing with other teams to race a line-following robot on a held-back
    track. Do everything you can to maximise your team''s score on that track. Learn
    and improve as much as you can, working with the other agent in your team, with
    each iteration, within your budget.


    ## This team: Robot Optimizer and Evaluator

    Each iteration, the Optimizer drafts a complete candidate and a rationale; the
    Evaluator critiques both, twice, once after the draft and once after the revision;
    the Optimizer reads each critique and decides what to do with it, including rejecting
    it outright, and delivers the final candidate, which races unchanged. The Evaluator
    has no approval power at any point: every version that exists is the Optimizer''s
    own decision. No critique is carried into a later iteration.


    ## Your role: Evaluator, round 1

    You read the same Design Constraints and Optimizer Race Data the Optimizer has,
    plus the Optimizer''s Draft Design and its rationale. Write a critique of both
    the design and the rationale: say what is weak, wrong, or unsupported, and why,
    citing the evidence you have. You decide nothing about whether the design races;
    the Optimizer reads your critique next and decides what to do with it.'
  measures:
  - id: input_tokens
    name: Model input tokens
    unit: tokens
  - id: output_tokens
    name: Model output tokens
    unit: tokens
  - id: repair_calls
    name: Format repair calls
    unit: calls
    better: lower
  - id: invalid_artifacts
    name: Invalid model artifacts
    unit: artifacts
    better: lower
- id: action2
  label: Revise Design
  actor: actor2
  notes: 'Reads the round-1 critique and its own draft, and delivers a revised candidate
    and rationale.


    ## Common to every agent

    You are competing with other teams to race a line-following robot on a held-back
    track. Do everything you can to maximise your team''s score on that track. Learn
    and improve as much as you can, working with the other agent in your team, with
    each iteration, within your budget.


    ## This team: Robot Optimizer and Evaluator

    Each iteration, the Optimizer drafts a complete candidate and a rationale; the
    Evaluator critiques both, twice, once after the draft and once after the revision;
    the Optimizer reads each critique and decides what to do with it, including rejecting
    it outright, and delivers the final candidate, which races unchanged. The Evaluator
    has no approval power at any point: every version that exists is the Optimizer''s
    own decision. No critique is carried into a later iteration.


    ## Your role: Robot Optimizer, revising

    Read the Round-1 Critique, your own Draft Design, and the same Optimizer Race
    Data and Design Constraints as before. Deliver a revised complete candidate and
    rationale. You may accept, partly accept, or reject the critique, including by
    resubmitting your draft unchanged; say in your rationale what you kept, what you
    changed, and why.'
  measures:
  - id: input_tokens
    name: Model input tokens
    unit: tokens
  - id: output_tokens
    name: Model output tokens
    unit: tokens
  - id: repair_calls
    name: Format repair calls
    unit: calls
    better: lower
  - id: invalid_artifacts
    name: Invalid model artifacts
    unit: artifacts
    better: lower
- id: action3
  label: Critique Revision
  actor: actor3
  notes: 'Critiques the revised candidate and its rationale, the same way as round
    1. No approval power.


    ## Common to every agent

    You are competing with other teams to race a line-following robot on a held-back
    track. Do everything you can to maximise your team''s score on that track. Learn
    and improve as much as you can, working with the other agent in your team, with
