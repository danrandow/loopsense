    own decision. No critique is carried into a later iteration.


    ## Your role: Robot Optimizer, finalizing

    Read the Round-2 Critique, your own Revised Design, and the same Optimizer Race
    Data and Design Constraints as before. Deliver your final complete candidate and
    rationale for this iteration; it races unchanged. You may accept, partly accept,
    or reject the critique, including by resubmitting your revision unchanged; say
    in your rationale what you kept, what you changed, and why.'
  measures:
  - id: input_tokens
    name: Model input tokens
    unit: tokens
  - id: output_tokens
    name: Model output tokens
    unit: tokens
  - id: repair_calls
    name: Format repair calls
    unit: calls
    better: lower
  - id: invalid_artifacts
