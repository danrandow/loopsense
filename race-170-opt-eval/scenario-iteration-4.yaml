map:
  id: race-170-opt-eval
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: kd 0.8 damping test
    notes: 'Raises kd from 0.6 to 0.8 with all other values unchanged, because iteration
      3''s kd 0.4 to 0.6 step raised s-bend progress from 0.28 to 0.72 and slalom
      from 0.13 to 0.23. Max_error still sits at the 0.06 m off-track limit on the
      s-bend and slalom, so further damping is the next single-variable test.


      ### Rationale


      Evidence from iteration 3 (kp 3.0, kd 0.6, base_speed 1.0, iteration 0 sensor
      layout) is the best raced design so far at 458.0, up from 169.5. Oval now finishes
      20 of 20 runs with progress 0.997, a mean score of 956, and line-loss events
      of 0.1. The gain from kd 0.4 to 0.6 was large and monotonic on the failing tracks:
      s-bend progress rose from 0.28 to 0.72 and slalom from 0.13 to 0.23. Line-loss
      events on the s-bend also fell from 1.05 to 1.0. The remaining failures are
      off-track ends with max_error still at the 0.06 m limit (s-bend 0.0612, slalom
      0.0632). Slalom is the weakest track (0 of 20 finishes, progress 0.23). Changing
      kd from 0.4 to 0.6 did not bring max_error below 0.06, so the feedback rule
      ''keep kd 0.6 and raise base_speed'' does not apply, because the s-bend has
      not yet reached a stable margin. The feedback''s alternative of adding ki is
      a different hypothesis. I choose a single-variable step that follows the observed
      trend: kd 0.6 to 0.8, with kp 3.0, ki 0, base_speed 1.0 and the sensor layout
      held fixed. kd is the lever that has improved progress on every failing track
      so far, and the bend overshoot it damps is the likely source of the off-track
      exits. Speed is kept at 1.0 because the s-bend finish time (2.97 s) is already
      near the 3.0 s limit, so raising speed now risks the completions that are the
      main score. Expected result: s-bend and slalom progress rise further, with max_error
      below about 0.06 on at least the s-bend, and oval finishes held. Main risk:
      steering_oscillation has grown with kd (oval 0.24 at kd 0.6, s-bend 0.45), so
      kd 0.8 could add jitter and reduce progress on the oval. Hypotheses to check
      next: (a) if s-bend and slalom progress rise and oval still finishes, kd is
      still improving and the next step is base_speed 1.2 to recover time; (b) if
      progress falls or oscillation rises sharply, kd 0.6 is the peak and I should
      return to it and test ki 0.05 to 0.1 for the residual bend error; (c) if max_error
      on the slalom stays at about 0.063 with line losses near 1.5, the slalom''s
      tight alternating bends need a different lever (kp or sensor spacing) rather
      than more kd. Measurements requested: completion, progress, completion_time,
      rms_error, max_error, line_loss_events, steering_oscillation and control_effort
      on all three tracks.


      - [Open this output](iteration-4/entity0/versions/b08b105e99d84493805487ac21447566/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-bfb9e1c619c0574c/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-d3fc4f8f0a739b2f/payload.json)'
  - id: entityR1
    label: Approve kd 0.8 step
    notes: 'Approved the single-variable kd 0.6 to 0.8 step from the best raced design
      (458.0), since it is valid, isolates kd, and racing is more informative than
      another revision. Feedback gives next-step branches for oscillation, speed and
      slalom, based on iteration 3''s per-track telemetry.


      ### Feedback


      Pre-race review of the kd 0.6 to 0.8 step, with kp 3.0, ki 0, base_speed 1.0
      and the iteration 0 sensor layout unchanged. Iteration 3 (kd 0.6) is the best
      raced design at 458.0. Its s-bend progress was 0.72 and slalom 0.23, both up
      from iteration 2 (kd 0.4). The oval finished 20 of 20 runs. The candidate changes
      one variable, kd, from that best design, so the next race isolates the effect
      of kd. The candidate is valid: all sensor positions are inside the allowed ranges,
      the weights are unchanged at (-2, -1, 0, 1, 2), and kd 0.8 is within [0, 10].
      Holding base_speed at 1.0 is reasonable, because iteration 3''s s-bend finish
      time of 2.97 s is already near the 3.0 s limit. Speed should be raised only
      after completions are secure. Iteration 1 showed that widening the sensor array
      did not reduce max_error, so the candidate correctly keeps the layout. The main
      risk is that steering_oscillation has grown with kd (oval 0.24, s-bend 0.45
      at kd 0.6), so more kd may add jitter. Racing is more informative than another
      revision at this point, since the bar is already set by a raced design. Do not
      treat the rationale''s expected result as a measured outcome. Once the race
      reports, use the results as follows. If s-bend and slalom progress rise and
      the oval still finishes, kd is still improving, so the next step is base_speed
      1.2 to recover completion time. If oval finishes fall or steering_oscillation
      rises sharply with progress flat or falling, kd 0.6 was the peak, so return
      to it and test ki. If slalom max_error stays near 0.063 with line_loss_events
      near 1.5, the slalom needs a different lever than more kd.


      ### Requested changes


      - If s-bend and slalom progress rise above iteration 3 (0.72 and 0.23) and the
      oval still finishes 20 of 20, keep controller.kd at 0.8 and try controller.base_speed
      1.2 to recover completion time, since the iteration 3 s-bend finish took 2.97
      s, close to the 3.0 s limit.

      - If oval finishes fall or steering_oscillation rises sharply (iteration 3 oval
      0.24, s-bend 0.45) with progress flat or falling, return to controller.kd 0.6,
      the best raced value, and test controller.ki at 0.05 to 0.1 for the residual
      s-bend max_error of 0.061.

      - If slalom max_error stays near 0.063 with line_loss_events near 1.5 (iteration
      3: 1.6), do not add more kd. Try controller.kp in a small step, from 3.0 to
      about 3.5, keeping kd at the better of 0.6 or 0.8, because slalom progress is
      the weakest track and iteration 1 showed that a large kp increase alone (5.0
      with widened sensors) reduced oval progress.


      - [Open this output](iteration-4/entityR1/versions/fbfc0fb4eefe4457bd3fdec0dd6cb940/payload.json)

