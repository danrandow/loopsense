overrides:
  entities:
  - id: entity0
    label: 'Final: iter 10 design'
    notes: 'Resubmits the best raced design (iteration 10, score 688.67) unchanged,
      since every remaining lever has been tested and slalom stayed flat near 0.56.
      Keeping it avoids risking the oval and s-bend completions that carry the score
      on the unseen final track.


      ### Rationale


      Evidence: iteration 10 (sensors at x = -0.025, -0.0125, 0, 0.0125, 0.025; sensor_size
      0.016; kp 3.0; kd 0.8; ki 0; base_speed 0.9; line_loss last_direction) is the
      best raced design at 688.67, up from 686.99 at iteration 9. The oval finished
      20 of 20 with progress 0.997 and steering_oscillation 0.17. S-bend finished
      18 of 20 with mean time 2.56 s, inside the 3.0 s limit. Slalom progress was
      0.562, flat against iteration 8 (0.563) and iteration 9 (0.532). Slalom still
      has 0 of 20 completions.


      Decision: resubmit the iteration 10 design unchanged. This is the final iteration,
      so the design races on unseen tracks, not on another development track. Every
      tested lever has now been tried: gain (kp 3.5, ki 0.05, kd 0.6 to 0.8), sensing
      footprint (16 mm), spacing (narrowing from 0.04 steps to 0.025 steps), and speed
      (0.9). Slalom has stayed flat near 0.56 across the last three spacing and speed
      variants, so further single-variable steps are unlikely to convert slalom to
      completions. Each change also risks the s-bend and oval completions that carry
      most of the score. The approved, raced design is the safest choice for an unseen
      track of different shape.


      Expected result: score close to the raced 688.7 on the development tracks. On
      the unseen track, the main risk is off-track ends on sharp bends, since the
      narrower array raises effective steering gain by about 1.33 times relative to
      the original 0.04 spacing. Hypotheses to check if the result is later visible:
      (a) the 18 of 20 s-bend completions hold on a different shape; (b) oscillation
      stays near 0.17 on the oval; (c) the unseen track''s bends, if tighter than
      the s-bend, will show the off-track limit as the failure mode, not a stall.


      - [Open this output](iteration-11/entity0/versions/4e00bc55b6b943c9b95ab68418d8346d/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-fef8c956de0381af/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-40e2c685b40f1543/payload.json)'
  - id: entityR1
    label: Approve best design
    notes: 'Approved the iteration 10 design unchanged because it is the best raced
      design (688.67), it is valid, and this is the final iteration with no later
      race to test alternatives. The approval rests on its oval 20/20 finishes and
      s-bend 18/20 completions, and it notes a correction to the rationale''s steering-gain
      factor.


      ### Feedback


      Pre-race review of the final-iteration candidate, which resubmits the iteration
      10 design unchanged: sensors at x = -0.025, -0.0125, 0, 0.0125, 0.025 with sensor_size
      0.016, weights (-2, -1, 0, 1, 2), kp 3.0, kd 0.8, ki 0, base_speed 0.9 and line_loss
      last_direction. The candidate is valid: all positions are within the allowed
      ranges, the weights are unchanged, and the gains are inside their limits. It
      is the best raced design so far, at 688.67, ahead of iteration 9 (686.99) and
      iteration 8 (683.09). Its oval finished 20 of 20 with steering_oscillation 0.17,
      and its s-bend finished 18 of 20 with mean time 2.56 s, inside the 3.0 s limit.
      Slalom has 0 of 20 completions, with progress 0.56 that has been flat across
      iterations 8, 9 and 10.


      The rationale''s point about effective steering gain needs one correction. The
      tighter array raises gain by about 1.2 times relative to iteration 9''s 0.03
      spacing and about 1.6 times relative to the original 0.04 spacing. The 1.33
      figure it quotes does not match either comparison. This does not change the
      decision, since this is the final iteration and the risk is already visible
      in the raced evidence. Iteration 10 showed no oscillation penalty on the oval,
      so the higher gain did not cost the completions that carry most of the score.


      No further revision or race is possible after this, so there is nothing to test
      beyond this design. The candidate should race unchanged. Any alternative such
      as kp 2.7 or a different spacing has no race evidence and risks the s-bend and
      oval completions that carry most of the score. Approving the best raced design
      is the safest choice for the unseen track.


      ### Requested changes


      - Race the iteration 10 design unchanged: geometry.sensor_positions at x = -0.025,
      -0.0125, 0, 0.0125, 0.025, sensor_size 0.016, controller kp 3.0, kd 0.8, ki
      0.0, base_speed 0.9, line_loss last_direction. Iteration 10 is the best raced
      design at 688.67.

      - Do not change kp or base_speed for the final track. Iteration 5 showed kp
      3.5 cut s-bend completions from 14 to 10, and iteration 9 showed base_speed
      0.9 gave the best s-bend completion time without slalom gain.


      - [Open this output](iteration-11/entityR1/versions/693891a611cc4c3085b009112bae282e/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/4e00bc55b6b943c9b95ab68418d8346d/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-40e2c685b40f1543/payload.json)'
