map:
  id: race-170-opt-eval
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Slower base speed 0.9
    notes: 'Keeps the iteration 8 narrow sensor array (best raced design at 683.09)
      and changes only base_speed from 1.0 to 0.9, as the Evaluator advised. Slalom
      progress rose to 0.56 with the oval still at 20 of 20, so the test targets slalom
      bend exits.


      ### Rationale


      Evidence from iteration 8, the best raced design at 683.09 (up from 633.93).
      Narrowing the sensor array to x = -0.03, -0.015, 0, 0.015, 0.03 (sensor_size
      0.016, kp 3.0, kd 0.8, ki 0, base_speed 1.0) gave these results. Oval held 20
      of 20 finishes, with progress 0.997 and steering_oscillation falling from 0.30
      to 0.13. S-bend finishes rose from 15 to 17 of 20. Slalom progress rose from
      0.371 to 0.563, the largest slalom gain so far, though slalom still has 0 of
      20 completions and 1.0 line-loss events per run. The Evaluator''s keep-spacing
      rule applies: slalom progress is above 0.37, the oval is at 20 of 20, and s-bend
      finishes are at 14 or more. So I keep the narrower spacing and sensor_size 0.016.
      Spacing is therefore the slalom lever, and the Evaluator''s next test is base_speed.
      Change (one variable from the best design, iteration 8): controller.base_speed
      1.0 to 0.9. The slalom''s alternating bends are the likely limit on its off-track
      exits, so a slower entry should give the sensors more time to track the line.
      Geometry, kp 3.0, kd 0.8, ki 0 and line_loss last_direction stay unchanged.
      Speed cost: the s-bend mean finish was 2.43 s at speed 1.0, so at 0.9 it should
      be about 2.7 s, which still clears the 3.0 s limit. The completion-time term
      loses only a little score, and that is far less than the value of converting
      slalom off-track ends into completions. Expected result, which is a hypothesis
      and not a measurement: slalom progress rises above 0.56 and slalom max_error
      falls below 0.06, while the oval stays at 20 of 20 and s-bend finishes stay
      at 14 or more. Risks: slower speed may raise the s-bend finish time close to
      the limit and cut its completions; a lower speed may also let the robot stall
      on the slalom if progress stops rising (the stall rule needs 0.002 progress
      per 50 steps). Reading the race: (a) if slalom progress or completions rise
      and the oval and s-bend hold, base_speed 0.9 is the better slalom setting, and
      the next step is a small sweep around 0.8 to 0.9 or a sensor spacing refinement
      to 0.025 steps; (b) if s-bend finishes fall below 14 or completion times approach
      3.0 s, return base_speed to 1.0 and keep the iteration 8 design as the base;
      (c) if slalom stays flat near 0.56, bend geometry is the limit, and the next
      test should be kd or sensor spacing rather than speed. Measurements wanted:
      completion, progress, completion_time, rms_error, max_error, line_loss_events,
      steering_oscillation and control_effort on all three tracks, so that speed effects
      on slalom can be separated from s-bend completion times.


      - [Open this output](iteration-9/entity0/versions/271d9d260cb94f52bfbaf87c99158f7f/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-7c17c87bd5e8ddcd/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-3f1e0aa40a0ba504/payload.json)'
  - id: entityR1
    label: 'Approve: narrower sensor'
    notes: 'Approved the sensor spacing refinement (x = ±0.03/±0.015 in place of ±0.04/±0.02),
      a single-variable test from the best raced design (iteration 7, 633.93), where
      slalom progress rose from 0.215 to 0.371 with sensor_size 0.016. The feedback
      gives reading rules and warns that narrowing raises the effective steering gain
      by about 1.33 times with fixed weights.


      ### Feedback


      Pre-race review of the sensor spacing refinement: sensor x positions from -0.04,
      -0.02, 0, 0.02, 0.04 to -0.03, -0.015, 0, 0.015, 0.03. Everything else stays
      at the iteration 7 values (sensor_size 0.016, kp 3.0, kd 0.8, ki 0, base_speed
      1.0, line_loss last_direction, weights -2, -1, 0, 1, 2). Iteration 7 (sensor_size
      0.016) is the best raced design at 633.93. Its slalom progress rose from 0.215
      to 0.371 with the oval still at 20 of 20, which is the evidence that sensing
      is the slalom lever. Iteration 5 and iteration 6 showed that kp and ki changes
      did not move slalom, so spacing is the lever to test next.


      The candidate is valid. All positions are inside the x and y limits, the weights
      are unchanged, and sensor_size 0.016 is an allowed option. It changes one variable
      from the best design, so the race isolates spacing.


      One point for the Optimizer to note: the weights stay fixed while the sensors
      move closer together. The steering signal per metre of tape offset therefore
      rises by roughly 0.04/0.03, about 1.33 times, so the effective steering gain
      goes up even though kp is unchanged. This matches the s-bend and oval risk.
      Iteration 5 showed that more effective steering gain cost s-bend finishes, so
      a narrower array could do the same.


      Do not treat the expected slalom gain as measured. Once the race reports, read
      it as follows. If slalom progress rises above 0.37 with the oval at 20 of 20
      and s-bend finishes at 14 or more, keep the narrower spacing. If s-bend finishes
      fall below 14 or the oval drops, return to the iteration 7 spacing (0.02 steps)
      with sensor_size 0.016. If slalom stays flat near 0.37, bend geometry or base_speed
      is the limit, so test base_speed 0.8 to 0.9.


      ### Requested changes


      - If slalom progress rises above 0.37 and the oval holds 20 of 20 with s-bend
      finishes at 14 or more, keep geometry.sensor_positions at x = -0.03, -0.015,
      0, 0.015, 0.03 with sensor_size 0.016, kp 3.0, kd 0.8, ki 0, and test controller.base_speed
      0.9 on slalom, since iteration 7 showed sensing is the slalom lever.

      - If s-bend finishes drop below 14 of 20 or the oval drops below 20 of 20, return
      geometry.sensor_positions to x = -0.04, -0.02, 0, 0.02, 0.04 and keep sensor_size
      0.016, because iteration 7 (the best raced design at 633.93) is the base to
      beat.

      - If steering_oscillation rises above about 0.3 on the oval with the narrower
      array, reduce controller.kp from 3.0 to about 2.7 instead of changing spacing
      again, because the narrower array raises the effective steering gain by about
      1.33 times with fixed weights.


      - [Open this output](iteration-8/entityR1/versions/6ec60634d027442c952e816d5324bd4c/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/43de35d380dd4906a69ec09b22faa5ad/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-631446f45102d13a/payload.json)'
