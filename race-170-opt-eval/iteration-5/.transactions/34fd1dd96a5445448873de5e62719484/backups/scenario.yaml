map:
  id: race-170-opt-eval
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: kp 3.5 on kd 0.8 best
    notes: 'Keeps the best raced design (iteration 4, score 600.47, kd 0.8) and steps
      kp from 3.0 to 3.5 to target the slalom, which has 0 of 20 completions and max_error
      near the 0.06 m limit. Expected results are hypotheses only; the oval and s-bend
      finishes are the main risk.


      ### Rationale


      Evidence from iteration 4 (kp 3.0, kd 0.8, ki 0, base_speed 1.0, iteration 0
      sensor layout), which is the best raced design at 600.47. Oval finished 20 of
      20 (progress 0.999, line losses 0.8). s-bend improved to 14 of 20 finishes and
      progress 0.96, up from 0.72 at kd 0.6, with 6 off-track ends and a mean finish
      time of 2.57 s. Slalom is still 0 of 20 (progress 0.215, max_error 0.0615, line
      losses 1.15). Slalom progress fell slightly from 0.234 at kd 0.6, so the feedback
      rule ''raise base_speed when slalom and s-bend progress both rise'' does not
      cleanly apply. The s-bend gain is real, but slalom is the weakest track and
      has no completions. Completing it would add about 500 points per run, so it
      is the main lever. The feedback notes that if slalom max_error stays near 0.063
      with line losses near 1.5, more kd is the wrong lever and kp should be stepped
      up. Slalom max_error is 0.0615 and line losses are 1.15, so that condition is
      only partly met. Change (one variable from the best design): controller.kp 3.0
      to 3.5, keeping kd 0.8 (which improved s-bend and cut slalom line losses), ki
      0, base_speed 1.0 and the iteration 0 sensor layout. Speed stays at 1.0 because
      the s-bend already finishes in about 2.6 s on average, and the priority is converting
      off-track ends into completions. Expected result, which is a hypothesis and
      not a measured outcome: slalom progress rises above 0.22 and max_error on the
      slalom drops below 0.06, while the oval keeps finishing. Risks: the iteration
      1 failure at kp 5.0 with wider sensors suggests kp can over-steer, and steering_oscillation
      has risen with kd (oval 0.26, s-bend 0.40). Hypotheses for the next race: (a)
      if slalom progress rises and oval still finishes 20 of 20, kp is the slalom
      lever and the next step is kp about 3.8 or base_speed 1.2; (b) if oval finishes
      drop or oscillation rises sharply with progress flat, return to kp 3.0 and test
      ki 0.05 to 0.1 for the residual bend error; (c) if s-bend finishes hold at 14
      or more and slalom is still flat, the slalom is limited by sensor geometry,
      and a 16 mm sensor size or a different sensor spacing should be tested. Measurements
      requested: all eight, on all three tracks, to separate the effects of kp on
      slalom from kd on the s-bend.


      - [Open this output](iteration-5/entity0/versions/c099e56293bc4541a503fa4647cf2ed3/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-6019a4c4dae98587/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-9d26ad2a8fca61f5/payload.json)'
  - id: entityR1
    label: Approve kd 0.8 step
    notes: 'Approved the single-variable kd 0.6 to 0.8 step from the best raced design
      (458.0), since it is valid, isolates kd, and racing is more informative than
      another revision. Feedback gives next-step branches for oscillation, speed and
      slalom, based on iteration 3''s per-track telemetry.


      ### Feedback


      Pre-race review of the kd 0.6 to 0.8 step, with kp 3.0, ki 0, base_speed 1.0
      and the iteration 0 sensor layout unchanged. Iteration 3 (kd 0.6) is the best
      raced design at 458.0. Its s-bend progress was 0.72 and slalom 0.23, both up
      from iteration 2 (kd 0.4). The oval finished 20 of 20 runs. The candidate changes
      one variable, kd, from that best design, so the next race isolates the effect
      of kd. The candidate is valid: all sensor positions are inside the allowed ranges,
      the weights are unchanged at (-2, -1, 0, 1, 2), and kd 0.8 is within [0, 10].
      Holding base_speed at 1.0 is reasonable, because iteration 3''s s-bend finish
      time of 2.97 s is already near the 3.0 s limit. Speed should be raised only
      after completions are secure. Iteration 1 showed that widening the sensor array
      did not reduce max_error, so the candidate correctly keeps the layout. The main
      risk is that steering_oscillation has grown with kd (oval 0.24, s-bend 0.45
      at kd 0.6), so more kd may add jitter. Racing is more informative than another
      revision at this point, since the bar is already set by a raced design. Do not
      treat the rationale''s expected result as a measured outcome. Once the race
      reports, use the results as follows. If s-bend and slalom progress rise and
      the oval still finishes, kd is still improving, so the next step is base_speed
      1.2 to recover completion time. If oval finishes fall or steering_oscillation
      rises sharply with progress flat or falling, kd 0.6 was the peak, so return
      to it and test ki. If slalom max_error stays near 0.063 with line_loss_events
      near 1.5, the slalom needs a different lever than more kd.


      ### Requested changes


      - If s-bend and slalom progress rise above iteration 3 (0.72 and 0.23) and the
      oval still finishes 20 of 20, keep controller.kd at 0.8 and try controller.base_speed
      1.2 to recover completion time, since the iteration 3 s-bend finish took 2.97
      s, close to the 3.0 s limit.

      - If oval finishes fall or steering_oscillation rises sharply (iteration 3 oval
      0.24, s-bend 0.45) with progress flat or falling, return to controller.kd 0.6,
      the best raced value, and test controller.ki at 0.05 to 0.1 for the residual
      s-bend max_error of 0.061.

      - If slalom max_error stays near 0.063 with line_loss_events near 1.5 (iteration
      3: 1.6), do not add more kd. Try controller.kp in a small step, from 3.0 to
      about 3.5, keeping kd at the better of 0.6 or 0.8, because slalom progress is
      the weakest track and iteration 1 showed that a large kp increase alone (5.0
      with widened sensors) reduced oval progress.


      - [Open this output](iteration-4/entityR1/versions/fbfc0fb4eefe4457bd3fdec0dd6cb940/payload.json)

