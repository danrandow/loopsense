map:
  id: race-170-opt-eval
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Sensor 16mm, ki 0 base
    notes: 'Reverts ki to 0 because the ki 0.05 race fell to 579 (s-bend finishes
      12 vs 14) and tests sensor_size 0.016 on the best iteration 4 design (600.47).
      This follows the Evaluator''s rule for a flat slalom with max_error near 0.06
      and gain changes not moving it.


      ### Rationale


      Evidence. The ki 0.05 candidate (iteration 6) raced at 579.17, below the best
      raced design, iteration 4 (kp 3.0, kd 0.8, ki 0) at 600.47. Oval held at 20
      of 20 with steering_oscillation unchanged at 0.26. S-bend finishes fell from
      14 to 12 of 20 (mean finish 2.55 s), and s-bend off-track ends rose from 6 to
      8. Slalom stayed at 0 of 20 with progress 0.232 and max_error 0.062. The Evaluator''s
      keep-ki rule needs s-bend finishes of 14 or more, and that is not met, so ki
      goes back to 0. The Evaluator''s third rule then applies: slalom is flat near
      progress 0.22 to 0.23 and max_error near 0.06 across kd 0.6 to 0.8 and kp 3.0
      to 3.5, so gain is not moving it.


      Change (one variable from the best design, iteration 4): geometry.sensor_size
      0.012 to 0.016. Everything else is held at iteration 4 values: kp 3.0, kd 0.8,
      ki 0, base_speed 1.0, line_loss last_direction, sensor positions and weights
      unchanged. A wider footprint averages more tape under each sensor, so the signal
      should be smoother at the 0.06 m edge and slalom line loss may drop. The footprint
      is still well under the 25 mm tape width.


      Expected result (a hypothesis, not a measurement): slalom line_loss_events fall
      below about 1.0 and slalom progress rises above 0.25, with oval still at 20
      of 20. Risk: the larger footprint blurs the s-bend response and could cut s-bend
      finishes below 14.


      Hypotheses and reading the race: (a) if slalom progress or max_error improves
      with s-bend finishes at 14 or more, sensing was the slalom limit and the next
      step is a sensor_size or spacing refinement; (b) if s-bend finishes drop with
      the oval unchanged, return sensor_size to 0.012 and keep the iteration 4 design
      as the base; (c) if slalom stays flat, slalom is limited by bend geometry, so
      the next lever is base_speed or sensor spacing rather than gain.


      Measurements wanted: completion, progress, completion_time, rms_error, max_error,
      line_loss_events, steering_oscillation and control_effort on all three tracks,
      to separate the sensor-size effect on slalom from the s-bend effect.


      - [Open this output](iteration-7/entity0/versions/ce2411e9e5524cc9a5182a7dbe00d81b/payload.json)

      - Based on: [entityR1](iteration-7/entityR1/versions/carried-5a3dd4228ce3ea61/payload.json),
      [entityR2A](iteration-7/entityR2A/versions/carried-7fee118f39a766dc/payload.json)'
  - id: entityR1
    label: 'Approve: sensor_size'
    notes: 'Approved the single-variable test of sensor_size 0.012 to 0.016 on the
      iteration 4 base, since slalom progress has stayed flat across kp and kd changes,
      so sensing is the untested lever. The candidate is valid and the race is more
      informative than another revision, with the risk that s-bend finishes drop from
      14 of 20 being noted for the next step.


      ### Feedback


      Pre-race review of the sensor_size step from 0.012 to 0.016, with kp 3.0, kd
      0.8, ki 0, base_speed 1.0, line_loss last_direction and the iteration 0 spacing
      unchanged. The best raced design is iteration 4 (kp 3.0, kd 0.8, ki 0) at 600.47,
      so this candidate is judged against that bar. The candidate is valid: all sensor
      positions are inside range, the weights are unchanged, and sensor_size 0.016
      is one of the allowed options. It changes one variable from the best design,
      so the next race isolates sensing footprint. The evidence for trying it is that
      slalom progress has stayed flat near 0.22 to 0.28 across kp 3.0 to 3.5 (iterations
      4 and 5) and kd 0.4 to 0.8, with max_error near 0.06, so gain has not been the
      slalom lever. The earlier widened-spacing test (iteration 1) changed spacing
      and kp together, so it does not rule out a footprint change. The main risk is
      that a larger footprint blurs the s-bend response, since s-bend finishes are
      14 of 20 at iteration 4. Racing is more informative than another revision here,
      and the candidate is a reasonable test. Do not treat the expected slalom gain
      as measured. Once the race reports: if slalom progress rises above about 0.25
      with the oval still at 20 of 20, keep sensor_size 0.016 and test a sensor spacing
      refinement. If s-bend finishes fall below 14 with the oval unchanged, return
      sensor_size to 0.012 and keep the iteration 4 design as the base. If slalom
      stays flat, bend geometry is the limit, so the next lever is base_speed or sensor
      spacing rather than gain.


      ### Requested changes


      - If slalom progress rises above about 0.25 and the oval holds 20 of 20 with
      sensor_size 0.016, keep geometry.sensor_size at 0.016 and test a small sensor
      spacing change (for example x = -0.03 to +0.03 in place of the 0.02 steps) with
      kp 3.0 and kd 0.8.

      - If s-bend finishes drop below 14 of 20 while the oval stays at 20 of 20, return
      geometry.sensor_size to 0.012 and keep the iteration 4 design (kp 3.0, kd 0.8,
      ki 0, base_speed 1.0) as the base, because iteration 4 is the best raced design.

      - If slalom progress stays near 0.22 to 0.25 with max_error near 0.06 under
      sensor_size 0.016, the slalom is limited by bend geometry rather than sensing
      or gain, so test controller.base_speed at 0.8 to 0.9 (slower entry to bends)
      with the better sensor_size, since raising speed has not been tried on slalom.


      - [Open this output](iteration-7/entityR1/versions/99421c1bfb444698bd0ea6188bea2eb2/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/ce2411e9e5524cc9a5182a7dbe00d81b/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-7fee118f39a766dc/payload.json)'
