map:
  id: race-170-opt-eval
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: kd 0.6 on best design
    notes: 'Keeps the best raced geometry and gains (iteration 2, score 169.5) and
      raises kd from 0.4 to 0.6 to damp bend overshoot. The s-bend max_error stayed
      at the 0.063 off-track limit, which points to controller lag.


      ### Rationale


      Evidence: iteration 2 (kp 3.0, kd 0.4, base_speed 1.0, iteration 0 geometry)
      is the best raced design at 169.5. Oval progress rose to 0.69 with 2 of 20 finishes,
      and line-loss events fell to about 1.1 on the oval and 1.05 on the s-bend, close
      to the evaluator''s target of about 1.0. The s-bend still ends at max_error
      about 0.063, which is the off-track limit. Per the evaluator''s hypothesis (a),
      this points to controller lag on bends rather than a sensing problem. Widening
      the array (iteration 1) did not help, so I do not repeat it. Change: raise kd
      from 0.4 to 0.6 and keep everything else at the iteration 2 values. kd damps
      the signal''s rate of change, which should cut the overshoot that drives the
      bend excursions. Trade-off: oval steering_oscillation rose to 0.34 in iteration
      2, so more kd may increase jitter; I accept that as a test. I am not adding
      ki yet, because integral action on a signal that is near zero on average risks
      windup on the bends. Expected result: s-bend max_error below 0.06 and fewer
      off-track ends, with oval progress holding at or above 0.6. Hypotheses to check:
      (a) if max_error on the s-bend drops below 0.06 and progress rises, lag was
      the cause; (b) if oscillation grows and progress falls, kd 0.6 is too high and
      0.5 is the next trial; (c) if max_error still reaches 0.06 with no gain, try
      ki 0.05 to 0.1. Measurements requested: completion, progress, completion_time,
      rms_error, max_error, line_loss_events, steering_oscillation, control_effort.


      - [Open this output](iteration-3/entity0/versions/43c4c76939584cde8d2978c133cd5919/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-05046cec79350cef/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-6439703d54cc7e5c/payload.json)'
  - id: entityR1
    label: 'Approve: revert geometry'
    notes: 'Approved the candidate that reverts to the iteration 0 sensor layout,
      which scored best (84.6), with kp 3.0, kd 0.4 and base_speed 1.0. The widened-sensor
      change in iteration 1 cut progress and raised line losses, so this revert is
      the evidence-backed move. The feedback gives next-race rules for keeping, restoring
      kp, or adding ki/kd.


      ### Feedback


      Pre-race review of the candidate that reverts geometry to the iteration 0 layout
      and changes three controller values (kp 2.5 to 3.0, kd 0.2 to 0.4, base_speed
      1.2 to 1.0). Iteration 0 is still the best raced design (score 84.6). Iteration
      1 showed that widening the sensors to x = -0.08 to +0.08 with kp 5.0 cut oval
      progress from 0.35 to 0.19 and raised oval line-loss events from 1.15 to 2.4.
      That is evidence against the widened array and against kp 5.0. This candidate
      returns to the 0.02-spacing array, so it is valid and does not repeat that change.
      The candidate is valid: all sensor positions are within limits, the weights
      are unchanged at (-2, -1, 0, 1, 2), and kp, kd, base_speed and line_loss are
      in range. The rationale''s claim that max_error sits at the 0.06 m off-track
      limit on every track in iteration 1 and iteration 0 is consistent with the outcome
      table, so the fix has to reduce bend error rather than widen sensing. The changes
      are small and separable, so the next race can be read clearly. Do not state
      how this candidate will perform. Once the race reports, use the results as follows.
      If line_loss_events fall to about 1.0 or below and progress on the oval is at
      least 0.35, keep kp near 3.0 and kd at 0.4. If progress falls while line losses
      do not improve, base_speed was not the cause, so restore kp to 2.5 and keep
      the other values. If max_error still reaches 0.06 on the s-bend at base_speed
      1.0, the error is controller lag: try ki of about 0.05 to 0.1 or a higher kd
      of about 0.6, not a wider array. If the run is stable with spare time, raise
      base_speed in steps of 0.2 to recover progress.


      ### Requested changes


      - After the race, if line_loss_events fall to about 1.0 or below and oval progress
      holds at 0.35 or more, keep geometry at the iteration 0 layout with kp 3.0,
      kd 0.4 and base_speed 1.0. This is the best trade so far, since iteration 0
      (kp 2.5, kd 0.2, base_speed 1.2) scored 84.6.

      - If progress falls with no drop in line_loss_events, speed was not the cause.
      Restore controller.kp to 2.5 and keep kd at 0.4 and base_speed at 1.0, since
      iteration 0 showed kp 2.5 as the best gain so far.

      - If max_error stays at about 0.06 on the s-bend (as in iteration 0 and iteration
      1, both near the off-track limit), try controller.ki of 0.05 to 0.1 or raise
      controller.kd to about 0.6. Do not widen the sensor array again, because iteration
      1 showed that widening did not reduce max_error.


      - [Open this output](iteration-2/entityR1/versions/3b50b53e2f9e4853a3736b6c7a92a024/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/977b0ad54e78428fbdd3f9e1d75d59c9/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-197cb8a8fc0005b3/payload.json)'
