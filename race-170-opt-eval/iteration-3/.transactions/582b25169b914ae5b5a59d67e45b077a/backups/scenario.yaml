  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: kd 0.6 on best design
    notes: 'Keeps the best raced geometry and gains (iteration 2, score 169.5) and
      raises kd from 0.4 to 0.6 to damp bend overshoot. The s-bend max_error stayed
      at the 0.063 off-track limit, which points to controller lag.


      ### Rationale


      Evidence: iteration 2 (kp 3.0, kd 0.4, base_speed 1.0, iteration 0 geometry)
      is the best raced design at 169.5. Oval progress rose to 0.69 with 2 of 20 finishes,
      and line-loss events fell to about 1.1 on the oval and 1.05 on the s-bend, close
      to the evaluator''s target of about 1.0. The s-bend still ends at max_error
      about 0.063, which is the off-track limit. Per the evaluator''s hypothesis (a),
      this points to controller lag on bends rather than a sensing problem. Widening
      the array (iteration 1) did not help, so I do not repeat it. Change: raise kd
      from 0.4 to 0.6 and keep everything else at the iteration 2 values. kd damps
      the signal''s rate of change, which should cut the overshoot that drives the
      bend excursions. Trade-off: oval steering_oscillation rose to 0.34 in iteration
      2, so more kd may increase jitter; I accept that as a test. I am not adding
      ki yet, because integral action on a signal that is near zero on average risks
      windup on the bends. Expected result: s-bend max_error below 0.06 and fewer
      off-track ends, with oval progress holding at or above 0.6. Hypotheses to check:
      (a) if max_error on the s-bend drops below 0.06 and progress rises, lag was
      the cause; (b) if oscillation grows and progress falls, kd 0.6 is too high and
      0.5 is the next trial; (c) if max_error still reaches 0.06 with no gain, try
      ki 0.05 to 0.1. Measurements requested: completion, progress, completion_time,
      rms_error, max_error, line_loss_events, steering_oscillation, control_effort.


      - [Open this output](iteration-3/entity0/versions/43c4c76939584cde8d2978c133cd5919/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-05046cec79350cef/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-6439703d54cc7e5c/payload.json)'
  - id: entityR1
    label: Approve kd 0.6 test
    notes: 'Approved the iteration 2 best design with kd raised from 0.4 to 0.6, a
      single-variable test of bend overshoot. Based on iteration 2''s s-bend max_error
      of 0.063 and its oval steering_oscillation of 0.34, which motivate the kd trade-off.


      ### Feedback


      Pre-race review of the kd-only change: kd 0.4 to 0.6, with kp 3.0, base_speed
      1.0, ki 0 and the iteration 0 sensor layout unchanged. Iteration 2 (kp 3.0,
      kd 0.4, base_speed 1.0) is still the best raced design at 169.5, so this candidate
      is judged against that bar. The candidate is valid: all sensor positions are
      inside the allowed ranges, the weights are unchanged at (-2, -1, 0, 1, 2), and
      kd 0.6 is within [0, 10]. It changes one variable from the best design, so the
      next race isolates the effect of kd. The evidence that motivates it is iteration
      2''s s-bend max_error of about 0.063, which sits at the off-track limit, while
      rms_error stayed near 0.021, which points to bend overshoot rather than sensing.
      Iteration 1 showed that widening the array did not reduce max_error, so the
      candidate correctly does not repeat that change. The main risk is that iteration
      2''s oval steering_oscillation already rose to 0.34, so more kd may add jitter
      without reducing bend excursions. Racing is more informative than another revision
      here, and the candidate is a reasonable test. Do not state how it will perform.
      Once the race reports, use the results as follows. If s-bend max_error drops
      below 0.06 and oval progress holds at 0.6 or more, keep kd at 0.6 and then test
      base_speed in steps of 0.2 to recover progress. If steering_oscillation grows
      and progress falls, kd 0.6 is too high, so try kd 0.5. If max_error still reaches
      0.06 on the s-bend with no gain, controller lag is not the whole story, so try
      ki of 0.05 to 0.1 with kd 0.6.


      ### Requested changes


      - If s-bend max_error drops below 0.06 and oval progress holds at 0.6 or more,
      keep controller.kd at 0.6 and try controller.base_speed 1.2 to recover progress,
      since iteration 2 showed base_speed 1.0 with kp 3.0 kept line losses near 1.0.

      - If steering_oscillation rises (iteration 2 oval was already 0.34) and progress
      falls, reduce controller.kd to 0.5, because kd 0.6 is then too high.

      - If max_error still reaches about 0.06 on the s-bend with no gain from kd,
      set controller.ki to 0.05 to 0.1 with kd 0.6, since the iteration 2 bend error
      is not clearly explained by kd alone.


      - [Open this output](iteration-3/entityR1/versions/303088dcdd4b47dab48a966f096dc010/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/43c4c76939584cde8d2978c133cd5919/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-6439703d54cc7e5c/payload.json)'
