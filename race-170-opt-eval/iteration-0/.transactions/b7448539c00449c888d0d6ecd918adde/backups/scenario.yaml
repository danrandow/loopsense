overrides:
  entities:
  - id: entity0
    label: Baseline 5-sensor
    notes: 'A conservative first candidate: five 12 mm sensors spread across the line
      with proportional weights, base_speed 1.2, kp 2.5, kd 0.2, and last-direction
      line recovery. No race data exists yet, so the values are reasoned from the
      contract, not tuned.


      ### Rationale


      Iteration 0 has no race data, so this is a conservative baseline meant to finish
      the course and produce measurements. Geometry: five line sensors spread across
      the 0.08 m width (x = -0.04, -0.02, 0, 0.02, 0.04) and placed 0.05 m ahead of
      the axle, so the controller sees the line before the wheels reach it. The 12
      mm footprint is well under the 25 mm tape width, giving clean readings. Sensor
      weights are proportional to x (-2, -1, 0, 1, 2), so the signal is the sensor-weighted
      lateral position of the tape and has the right sign: a line to the left gives
      a positive signal, which steers left. Controller: base_speed 1.2 targets roughly
      the 1.5 m/s average needed to finish in 3 s, without going to full throttle
      before the controller has been characterised. kp 2.5 gives a moderate steering
      response (about 875 PWM per unit of signal, with a 350 PWM scale per turn unit).
      ki 0 avoids integral windup on bends. kd 0.2 damps the response without amplifying
      sensor noise much. line_loss last_direction makes the robot keep turning toward
      where it last saw the line, which suits a single-sided loss at a sharp bend.
      Expected result: the robot completes the oval and s-bend, with some oscillation
      on the slalom. The measurements tell us whether the speed is too low to finish
      in time (completion_time, progress), whether kp is too high or too low (steering_oscillation,
      rms_error, max_error), and how often the line is lost (line_loss_events). Next
      step: if it oscillates, lower kp or raise kd. If it runs wide on bends, raise
      kp. If it fails to finish in time, raise base_speed.


      - [Open this output](iteration-0/entity0/versions/3c09966bb8e1426db6ed0142a41d744d/payload.json)'
  actions:
  - id: action0
measurements: {}
