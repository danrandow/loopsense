map:
  id: race-170-opt-eval
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: kp 3.0, kd 0.8, ki 0.05
    notes: 'Revision of the best raced design (iteration 4, 600.5): kp held at 3.0,
      kd 0.8, geometry and base_speed unchanged, and a small integral term ki 0.05
      added to test whether it reduces the residual s-bend bend error. Evidence is
      iteration 5''s loss of s-bend finishes when kp rose to 3.5, and the Evaluator''s
      request to test ki instead.


      ### Rationale


      Evidence: iteration 4 (kp 3.0, kd 0.8, ki 0, base_speed 1.0) is the best raced
      design at 600.47. Its oval finishes 20 of 20, and its s-bend finishes 14 of
      20 with max_error 0.042 near the off-track limit. Iteration 5 (kp 3.5) raised
      slalom progress from 0.215 to 0.276 but still gave 0 of 20 slalom finishes,
      cut s-bend finishes from 14 to 10, and lowered the score to 561.9. The Evaluator''s
      review asks me to revise rather than race kp 3.8, to hold kp at 3.0 and kd at
      0.8, and to test whether a small integral term reduces the residual s-bend bend
      error. Change (one variable from the best raced design): controller.ki 0 to
      0.05. Geometry, base_speed 1.0, line_loss last_direction and the sensor weights
      are unchanged. Expected result, which is a hypothesis: s-bend max_error falls
      and s-bend finishes hold at 14 or more, with the oval still 20 of 20. Risks:
      integral windup on bends, and steering_oscillation rising. Reading the race:
      if s-bend finishes reach 14 or more and the oval holds 20 of 20, ki is helping
      and the next step is a small base_speed rise. If the oval or s-bend loses completions
      with steering_oscillation rising, drop ki to 0 and keep the iteration 4 design.
      Next measurements wanted: s-bend and oval max_error and completions, steering_oscillation,
      and slalom progress, to see whether ki changes the slalom bend error.


      - [Open this output](iteration-6/entity0/versions/112c7ea44df2437b9e54db3ebb8401bd/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/e20b6848a0db4c4ba606db382deffec6/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-3a112501f284d829/payload.json)'
  - id: entityR1
    label: Hold kp 3.0, test ki 0.05
    notes: 'Revise: kp 3.8 continues the step (3.5) that cut s-bend completions from
      14 to 10 and lowered the score to 561.9, below the 600.5 best. Asks the Optimizer
      to return to kp 3.0 with kd 0.8 and test a small ki of 0.05 as the single change.


      ### Feedback


      Pre-race review of the kp step from 3.0 to 3.8, with kd 0.8, ki 0, base_speed
      1.0 and the iteration 0 sensor layout unchanged. Iteration 4 (kp 3.0, kd 0.8,
      600.5) is the best raced design. Iteration 5 showed the kp 3.5 step moved slalom
      progress from 0.215 to 0.276, but it still produced 0 of 20 slalom completions,
      and it cost s-bend completions (14 of 20 down to 10 of 20, progress 0.958 to
      0.875). Its score fell to 561.9. Iteration 5 therefore does not support a further
      kp increase: it shows a trade-off, with slalom progress gained and s-bend completions
      lost, and the candidate pushes further along the same path. Nothing so far shows
      that kp 3.8 would beat 600.5, and the s-bend losses are the bigger risk to the
      score. The candidate is valid: sensor positions, weights and gains are within
      the contract limits. The rationale''s expected slalom result is a hypothesis,
      not a measured outcome. Revise rather than race this step. Hold kp at the best
      raced value of 3.0 and test whether the residual s-bend bend error (max_error
      about 0.042 to 0.06 near the off-track limit) can be reduced with a small integral
      term instead. Keep kd at 0.8, which improved s-bend across iterations 3 and
      4, and keep base_speed at 1.0 and the sensor layout fixed. Once the revision
      is raced, read the result this way. If s-bend completions reach 14 or more and
      the oval still finishes 20 of 20, ki is helping and the next step is a small
      base_speed rise. If the oval or s-bend loses completions with steering_oscillation
      rising, drop ki to 0 and keep the iteration 4 design.


      ### Requested changes


      - Set controller.kp back to 3.0 (the best raced value, iteration 4 at 600.5)
      and keep kd at 0.8, because iteration 5 showed kp 3.5 cut s-bend completions
      from 14 to 10 and lowered the score to 561.9.

      - Set controller.ki to 0.05 with kp 3.0 and kd 0.8, to test whether a small
      integral term reduces the residual s-bend bend error (iteration 4 s-bend max_error
      0.0419 with 6 off-track ends). Keep the integral small, since the contract caps
      ki at 5 and the integral at +/-2.

      - Keep geometry, base_speed 1.0 and line_loss last_direction unchanged from
      iteration 4, so that the only change from the best raced design is ki. Do not
      widen sensors or raise kp again until this is measured.


      - [Open this output](iteration-6/entityR1/versions/e20b6848a0db4c4ba606db382deffec6/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/169fd3efee8747beab743eb3e08b2c68/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-3a112501f284d829/payload.json)'
