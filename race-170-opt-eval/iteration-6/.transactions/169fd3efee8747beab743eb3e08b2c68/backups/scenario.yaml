map:
  id: race-170-opt-eval
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: kp 3.5 on kd 0.8 best
    notes: 'Keeps the best raced design (iteration 4, score 600.47, kd 0.8) and steps
      kp from 3.0 to 3.5 to target the slalom, which has 0 of 20 completions and max_error
      near the 0.06 m limit. Expected results are hypotheses only; the oval and s-bend
      finishes are the main risk.


      ### Rationale


      Evidence from iteration 4 (kp 3.0, kd 0.8, ki 0, base_speed 1.0, iteration 0
      sensor layout), which is the best raced design at 600.47. Oval finished 20 of
      20 (progress 0.999, line losses 0.8). s-bend improved to 14 of 20 finishes and
      progress 0.96, up from 0.72 at kd 0.6, with 6 off-track ends and a mean finish
      time of 2.57 s. Slalom is still 0 of 20 (progress 0.215, max_error 0.0615, line
      losses 1.15). Slalom progress fell slightly from 0.234 at kd 0.6, so the feedback
      rule ''raise base_speed when slalom and s-bend progress both rise'' does not
      cleanly apply. The s-bend gain is real, but slalom is the weakest track and
      has no completions. Completing it would add about 500 points per run, so it
      is the main lever. The feedback notes that if slalom max_error stays near 0.063
      with line losses near 1.5, more kd is the wrong lever and kp should be stepped
      up. Slalom max_error is 0.0615 and line losses are 1.15, so that condition is
      only partly met. Change (one variable from the best design): controller.kp 3.0
      to 3.5, keeping kd 0.8 (which improved s-bend and cut slalom line losses), ki
      0, base_speed 1.0 and the iteration 0 sensor layout. Speed stays at 1.0 because
      the s-bend already finishes in about 2.6 s on average, and the priority is converting
      off-track ends into completions. Expected result, which is a hypothesis and
      not a measured outcome: slalom progress rises above 0.22 and max_error on the
      slalom drops below 0.06, while the oval keeps finishing. Risks: the iteration
      1 failure at kp 5.0 with wider sensors suggests kp can over-steer, and steering_oscillation
      has risen with kd (oval 0.26, s-bend 0.40). Hypotheses for the next race: (a)
      if slalom progress rises and oval still finishes 20 of 20, kp is the slalom
      lever and the next step is kp about 3.8 or base_speed 1.2; (b) if oval finishes
      drop or oscillation rises sharply with progress flat, return to kp 3.0 and test
      ki 0.05 to 0.1 for the residual bend error; (c) if s-bend finishes hold at 14
      or more and slalom is still flat, the slalom is limited by sensor geometry,
      and a 16 mm sensor size or a different sensor spacing should be tested. Measurements
      requested: all eight, on all three tracks, to separate the effects of kp on
      slalom from kd on the s-bend.


      - [Open this output](iteration-5/entity0/versions/c099e56293bc4541a503fa4647cf2ed3/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-6019a4c4dae98587/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-9d26ad2a8fca61f5/payload.json)'
  - id: entityR1
    label: Approve kp 3.5 test
    notes: 'Approved the kp 3.0 to 3.5 step (one variable from the best raced design,
      kd 0.8 at 600.47) because it is valid and targets slalom, the only track with
      no completions. Feedback sets next steps by slalom progress, oval finishes and
      oscillation, and the iteration 1 kp evidence is discounted because it was confounded
      by the sensor change.


      ### Feedback


      Pre-race review of the kp step from 3.0 to 3.5, with kd 0.8, ki 0, base_speed
      1.0 and the iteration 0 sensor layout unchanged. The best raced design is iteration
      4 (kd 0.8, kp 3.0) at 600.47. Its oval finished 20 of 20, but slalom still has
      0 of 20 completions (progress 0.215, max_error 0.0615, line_loss_events 1.15).
      The candidate is valid: all sensor positions are inside the allowed ranges,
      the weights are unchanged at (-2, -1, 0, 1, 2), and kp 3.5 and kd 0.8 are within
      their limits. It changes one variable from the best design, so the next race
      isolates kp''s effect on slalom. The iteration 1 failure at kp 5.0 is confounded
      by the widened sensor array, so it is weak evidence against a modest kp step.
      The main risk is that steering_oscillation has risen with kd (oval 0.26, s-bend
      0.40), and a higher kp may add to it. Racing is more informative than another
      revision at this stage, and a revision would cost two action runs. Do not treat
      the rationale''s expected slalom result as measured. Once the race reports,
      use these results. If slalom progress rises above 0.22 and the oval still finishes
      20 of 20, kp is the slalom lever, so test kp about 3.8 or base_speed 1.2 once
      completions are secure. If oval finishes drop or oscillation rises sharply with
      progress flat, return to kp 3.0 and test ki of 0.05 to 0.1 for the residual
      bend error. If s-bend finishes hold near 14 of 20 and slalom is still flat,
      the limit is sensing geometry, so test sensor_size 0.016 or a different sensor
      spacing.


      ### Requested changes


      - If slalom progress rises above 0.22 with the oval still at 20 of 20, try controller.kp
      about 3.8 (or controller.base_speed 1.2 once completions are secure), because
      kp 3.0 to 3.5 is the slalom lever if it moves progress.

      - If oval finishes fall or steering_oscillation rises sharply (iteration 4 oval
      0.26, s-bend 0.40) with progress flat, return controller.kp to 3.0 and test
      controller.ki at 0.05 to 0.1 for the residual bend error.

      - If s-bend finishes hold at about 14 of 20 and slalom progress stays flat near
      0.22, change one geometry field: geometry.sensor_size from 0.012 to 0.016, keeping
      kp 3.5 and kd 0.8, because the slalom may be limited by sensing rather than
      gain.


      - [Open this output](iteration-5/entityR1/versions/34fd1dd96a5445448873de5e62719484/payload.json)

