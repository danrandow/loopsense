map:
  id: race-213-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Wider array, kp 2.6
    notes: 'Widens the sensor row from ±0.024 m to ±0.032 m to cut slalom line losses,
      and rescales kp to 2.6 for the new spacing; base speed drops to 1.2. Based on
      iteration 2 (score 420), where the oval finished 20/20 but the slalom failed
      20/20 with 1.3 line losses per run.


      ### Rationale


      Evidence. The only race data is from iteration 2 (score 419.7): kp 2.0, ki 0,
      kd 1.2, base_speed 1.3, five 12 mm sensors at x = -0.024 to +0.024, y = 0.05,
      weights -2..2, last_direction line loss. It finished 20/20 on the oval (mean
      955, 1.91 s), finished 1/20 on the s-bend (progress 0.52) and 0/20 on the slalom
      (progress 0.15, 1.3 line-loss events per run). Off-track was the only end condition
      on the hard tracks. The iteration-3 draft (wider 0.04 m array, 16 mm sensors,
      kp 3.0) was never raced, so its claimed slalom fix is untested. I am not adopting
      its full change.


      Diagnosis. The oval gain setting is stable, so the gain level is not the main
      problem. The slalom fails early, with 1.3 line-loss events per run, which points
      to the tape leaving the sensor row during quick direction changes. The sensors
      currently see the tape only out to about ±0.042 m of lateral offset. Line loss
      then hands control to the last direction, which overshoots. I will widen the
      array moderately, to ±0.032 m, and keep the 12 mm footprint so the change is
      isolated.


      Changes. (1) Sensor x positions move to -0.032, -0.016, 0, 0.016, 0.032 at y
      0.05. Tape stays visible to about ±0.05 m of offset. (2) Wider spacing lowers
      the signal per metre of offset from about 83 to about 62, so kp rises from 2.0
      to 2.6 to keep steering authority roughly constant. (3) kd stays high at 1.2
      for damping, since kd/kp is about 0.46, close to the stable oval setting. (4)
      base_speed drops from 1.3 to 1.2 to give more time to correct on slalom bends.
      The oval margin is about 1 s, so it should still finish. (5) ki stays 0, weights
      and last_direction stay the same.


      Expected result. Oval should still finish, with time around 2.0 to 2.2 s. Slalom
      line-loss events should fall below 1 per run and progress should rise above
      0.3. The s-bend completion rate should improve. Main risk: the wider array could
      make the oval oscillate more. I will check steering_oscillation and line_loss_events
      on the oval and slalom first.


      - [Open this output](iteration-4/entity0/versions/2241e7e877844634934a99c3ac034124/payload.json)

      - Based on: [entityR2A](iteration-4/entityR2A/versions/carried-5951d3a57993cd0a/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Round-1 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-4/entityC1/versions/56b4cf1f683340c0b068c5a12417ad68/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/2241e7e877844634934a99c3ac034124/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-5951d3a57993cd0a/payload.json)'
  - id: entity1
    label: Wider array, kp 2.6, kd
    notes: 'Widens the sensor array to +/-0.032 m to keep the tape in view at larger
      offsets, which is the diagnosed slalom line-loss cause. Gains rise (kp 2.6,
      kd 1.5 to keep kd/kp near 0.6) and base_speed stays at 1.3 to protect oval completion,
      rejecting the critique''s speed cut. Rests on iteration-2 race data (oval 20/20,
      slalom progress 0.15).


      ### Rationale


      Evidence. The only race data is the iteration-2 design (kp 2.0, ki 0, kd 1.2,
      base_speed 1.3, five 12 mm sensors at x = -0.024 to +0.024, y 0.05, weights
      -2..2, last_direction). It finished 20/20 on the oval (mean 955, 1.91 s), finished
      1/20 on the s-bend (progress 0.52), and 0/20 on the slalom (progress 0.15, 1.3
      line-loss events per run). Off-track was the only end condition on the hard
      tracks. Gain level does not explain the slalom failure: progress was about 0.15
      at kp 2.0 and about 0.13 at kp 4.0.


      Diagnosis. The sensors see the 25 mm tape only out to about +/-0.0425 m of lateral
      offset (outer sensor at 0.024, footprint half-width 0.006, tape half-width 0.0125).
      The tape can leave the array before the robot reaches the off-track limit, and
      line loss then hands control to last_direction, which overshoots on quick reversals.
      Wider spacing addresses this directly.


      Accepted from the round-1 critique. (1) The kd/kp ratio was misstated. The stable
      oval run had 1.2/2.0 = 0.6, and the draft''s 0.46 is weaker damping, so kd rises
      to 1.5 (ratio 0.58). (2) The speed cut is rejected. Completion is worth 500
      points, the oval finished 20/20 at base_speed 1.3, and speed was not the diagnosed
      cause, so base_speed stays at 1.3. (3) The 12 mm footprint stays, so the footprint
      is not a second variable.


      Kept. Sensor x positions move to -0.032, -0.016, 0, 0.016, 0.032 at y 0.05.
      Each outer sensor now covers tape to about +/-0.0505 m. Weights, ki 0 and last_direction
      are unchanged. kp rises from 2.0 to 2.6 to keep steering authority roughly constant,
      since the signal per metre falls with wider spacing. This scaling is approximate.


      Not fully isolated. Geometry, kp and kd change together. The geometry hypothesis
      is tested in the slalom line_loss_events and progress, which the gain change
      alone would not be expected to move much given the iteration-2 evidence.


      Expected result (guesses, not measured). Oval still finishes at about 1.9 to
      2.1 s. Slalom line_loss_events fall below 1 per run and slalom progress rises
      above 0.3. Decision rules: if slalom progress stays below 0.3 with line_loss_events
      above 1, the coverage hypothesis is wrong and the next round should examine
      sensor y (lead) or line_loss. If oval steering_oscillation exceeds 0.3 (iteration
      2 was 0.22), reduce kd toward 1.2. If the oval fails to finish, return kp to
      2.0.


      - [Open this output](iteration-4/entity1/versions/1f48c76b758f4b4bbf5c14470532f006/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/2241e7e877844634934a99c3ac034124/payload.json),
      [entityC1](iteration-4/entityC1/versions/56b4cf1f683340c0b068c5a12417ad68/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-5951d3a57993cd0a/payload.json)'
  - id: entityC2
    label: Round-2 critique
    notes: 'Critiques the revised design (kp 2.6, kd 1.5, wider sensors) and its rationale.
      The main finding is that the rationale misreads the stable run''s kd/kp ratio
      (0.4, not 0.6) and that the wider array adds only about 8.5 mm of coverage margin,
      so the test is weak. Based on the iteration 2 race data and the design contract.


      - [Open this output](iteration-4/entityC2/versions/3cd0836e06464571a4eba62940870864/payload.json)

      - Based on: [entity1](iteration-4/entity1/versions/1f48c76b758f4b4bbf5c14470532f006/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-5951d3a57993cd0a/payload.json)'
  - id: entity2
    label: Tested geometry, kp 2.0
    notes: 'Returns sensor pitch to the tested 10 mm and lowers kp to 2.0, base to
      1.5, ki to 0.05 and raises kd to 0.5 to cut the oscillation (0.11 to 0.16) that
      caused every off-track end. The critique''s claim that the geometry was unchanged
      was correct, and the rationale rejects the 12 mm change. Four controller changes
      are made together, so attribution is limited.


      ### Rationale


      Evidence: iteration 0 (kp 2.5, kd 0.3, ki 0.1, base 1.8, 10 mm sensor pitch)
      went off track in all 60 trials. Progress was 0.13 to 0.20, rms_error 0.02 to
      0.03, max_error 0.06 at the off-track limit, and steering_oscillation 0.11 to
      0.16. Oscillation is the clearest symptom, and the robot leaves the line before
      it reaches the finish. No run has completed, so completion (500 points) is still
      unproven.


      The round-2 critique is right on the main point. My previous revision claimed
      the geometry was unchanged, but it moved sensor pitch from the tested 10 mm
      to 12 mm. I reject that change and return to the tested 10 mm layout. That way
      this race is a clean test of the controller changes, and any gain in progress
      can be attributed to them.


      Changed: (1) kp 2.5 to 2.0. Oscillation is the dominant failure, and at signal
      2 the turn term is 5 x 350 = 1750 PWM at kp 2.5, which overshoots the line.
      A 20% cut is a modest step that keeps some correction on bends. (2) kd 0.3 to
      0.5. This adds damping against the overshoot that produced the oscillation.
      The derivative noise gain rises, but 0.5 was the original value and is within
      the range I can justify without a noise test. (3) base_speed 1.8 to 1.5. Lower
      speed gives the controller more time per bend and reduces the chance of leaving
      the line on the sharpest slalom bends. Completion inside 3 s is less likely,
      so this is a trade-off. I accept it because a finish requires staying on the
      line first, and the time term is worth at most 60 points. (4) ki 0.1 to 0.05,
      to reduce integral windup on bends, which the critique flagged as a risk. The
      integral is clamped at +/-2 and the motor mismatch is about 2%, so ki 0.05 still
      gives a small correction.


      Kept: five 12 mm sensors, weights [-2,-1,0,1,2], last_direction line loss, wheel_track
      0.12, body_width 0.12, body_length 0.18, mass 0.8, wheel_radius 0.03. These
      are neutral choices or were not varied.


      Rejected: raising kp above 2.0 without evidence. The critique''s stability estimate
      is unverified, and oscillation is already too high.


      I am changing four controller values at once, so the next telemetry cannot isolate
      each effect. I accept that and prioritise a first finish over clean attribution.
      Expected result (unverified): fewer line_loss_events, lower steering_oscillation
      (below 0.1), progress above 0.3, and possibly an oval finish. Next-step rule:
      if oscillation is still above 0.1 with max_error at 0.06, lower kp by 0.5. If
      the oval finishes slowly (completion_time above 2.5 s), raise base_speed by
      0.2. If progress stalls below 0.5 with low oscillation, raise kp by 0.5.


      - [Open this output](iteration-2/entity2/versions/9670648c272847faa2ddf5d219030ed5/payload.json)

      - Based on: [entity1](iteration-2/entity1/versions/e689dc4a0cd54d70ad8e9685a803ab24/payload.json),
