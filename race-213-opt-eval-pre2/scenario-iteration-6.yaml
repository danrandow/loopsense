map:
  id: race-213-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Wider array, kp 3.5
    notes: 'Widens the sensor row to ±0.044 m and rescales kp and kd in proportion
      to the spacing, with base speed trimmed to 1.1. Slalom progress rose with each
      widening step (0.15, 0.37, 0.43), so this extends that trend.


      ### Rationale


      Evidence: iteration 5 is the best race so far (score 682.8). The oval finished
      20/20 (mean 2.13 s). The s-bend finished 19/20. The slalom failed in all 20
      runs, with progress 0.43, 1.1 line-loss events per run, and off-track as the
      only end condition. Across iterations, widening the sensor row has consistently
      raised slalom progress: 0.15 at ±0.024 m, 0.37 at ±0.032 m, and 0.43 at ±0.036
      m. The gain of the trend is slowing, and the slalom still loses the tape, so
      the array is probably still too narrow for its sharpest reversals.


      Change 1 (geometry): widen the sensor row to x = -0.044, -0.022, 0, 0.022, 0.044
      at y = 0.05. Footprint stays at 12 mm to isolate the effect of spacing. Tape
      stays visible to about ±0.054 m of lateral offset, beyond the current ±0.048
      m.


      Change 2 (gains): steering signal per metre of offset falls roughly in proportion
      to spacing. Spacing goes from 18 mm to 22 mm (ratio 1.22), so kp rises from
      2.9 to 3.5 to keep steering authority about constant. This follows the same
      rule that matched the 2.6 to 2.9 step. kd scales with kp to stay near the stable
      kd/kp ratio of about 0.37 to 0.45, so kd goes from 1.3 to 1.5. ki stays 0, weights
      stay -2..2, and line_loss stays last_direction.


      Change 3 (speed): base_speed drops from 1.15 to 1.1 to give more time to correct
      on the slalom''s sharp bends. The oval has about 0.9 s of margin, so it should
      still finish, at roughly 2.2 s.


      Expected result: slalom progress rises above 0.6, with line-loss events below
      1 per run and a chance of finishing. The s-bend completion rate holds at 0.9
      or better. Main risk: the wider array may increase steering oscillation on the
      oval. I will check steering_oscillation and line_loss_events on the oval and
      slalom first.


      - [Open this output](iteration-6/entity0/versions/4b4150f7a8d646c88dd1869163069227/payload.json)

      - Based on: [entityR2A](iteration-6/entityR2A/versions/carried-3cc6d4196d7dd936/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Round-1 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-5/entityC1/versions/a2807d8111be4e09a65e0f545567c43f/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/9a8e59bfa0614686a4ff5baad315c0d1/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-fb118f779427682c/payload.json)'
  - id: entity1
    label: Wider array, kd restored
    notes: 'Widens sensors to ±0.036 m, sets kp 2.9 and kd 1.7 (kd/kp ≈ 0.59, the
      stable oval ratio), and restores base_speed to 1.3 to protect completions. Builds
      on iteration 4 (645 score), which showed slalom progress rising with array width;
      the change is not fully isolated.


      ### Rationale


      Evidence. The best race so far is iteration 4 (score 645.2): sensors at x =
      ±0.032, kp 2.6, kd 1.5, base_speed 1.3, 12 mm footprints, last_direction. It
      finished 20/20 on the oval (mean 954, 1.99 s), 16/20 on the s-bend (mean 827),
      and 0/20 on the slalom (progress 0.37, 1.0 line-loss event per run, off-track
      in all runs). Widening the array from 0.024 to 0.032 m raised slalom progress
      from 0.15 to 0.37, so the trend supports further widening. Off-track is still
      the only end condition on the slalom.


      Accepted from the round-1 critique:

      (1) The damping ratio was wrong. The draft''s kd/kp of 1.3/2.9 (about 0.45)
      is below the 0.6 of the stable oval run and below the 0.58 of iteration 4. I
      raise kd to 1.7, giving kd/kp = 0.59, which matches the stable setting.

      (2) The speed cut was not justified. The critique is right that completion (500
      points) dominates the score, and the draft''s 1.15 has no evidence behind it.
      I restore base_speed to 1.3, the value under which the oval finished 20/20 and
      the s-bend finished 16/20. Speed is therefore not a variable in this change.

      (3) The coverage figure was understated. A sensor at x sees tape while |offset
      - x| < 0.0185 m, so the outer sensors at ±0.036 cover offsets to about ±0.054
      m. The draft''s ±0.048 m was too low. The true limit is where the summed reading
      falls below 0.05, which I have not calculated, so the coverage claim is a geometric
      upper bound only.


      Rejected or kept:

      - Sensor spacing ±0.036, kp 2.9 and the 12 mm footprint are kept. The kp scaling
      matches the spacing ratio (2.6 × 0.036/0.032 ≈ 2.9), so this is a rough but
      defensible step.

      - ki stays 0, weights stay -2..2, line_loss stays last_direction. The critique
      did not attack these, and changing them would add more uncontrolled variables.


      Not fully isolated. Relative to iteration 4, this round changes spacing (0.032
      to 0.036), kp (2.6 to 2.9) and kd (1.5 to 1.7). Base speed is unchanged. The
      critique''s point that the cause cannot be attributed is correct. I accept the
      confound because the slalom failure is one of line loss, and the widening is
      the variable most directly tied to it.


      Expected results (guesses, not measured). The oval finishes at about 2.0 to
      2.1 s. Slalom progress rises above 0.4 and line-loss events fall below 1 per
      run. The s-bend completion holds at or above 16/20.


      Decision rules for the next round:

      - If slalom progress is below 0.4 with line_loss_events of 1 or more, the coverage
      hypothesis is weak. The next step is to examine the sensor y lead or the line-loss
      handling.

      - If oval steering_oscillation exceeds 0.3 (iteration 4 was 0.21), reduce kd
      toward 1.5 before changing spacing.

      - If the oval fails to finish, return kp to 2.6.

      - If s-bend completion falls below 14/20, revert kd to 1.5 and keep the wider
      array.


      - [Open this output](iteration-5/entity1/versions/53adfdf4733642998702a3aed4d291ef/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/9a8e59bfa0614686a4ff5baad315c0d1/payload.json),
      [entityC1](iteration-5/entityC1/versions/a2807d8111be4e09a65e0f545567c43f/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-fb118f779427682c/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Critiques the revised kp 2.9, kd 1.7 design and its rationale. Main points:
      the kd/kp ''0.6 stable'' claim misreads iteration 2 (ratio 0.4), the coverage
      gain is about 4 mm before the 0.06 m off-track limit, and the s-bend oscillation
      is unaddressed. Evidence is the iteration 4 and iteration 2 race data.


      - [Open this output](iteration-5/entityC2/versions/519431855d8647969a7d3845b6d8d6a6/payload.json)

      - Based on: [entity1](iteration-5/entity1/versions/53adfdf4733642998702a3aed4d291ef/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-fb118f779427682c/payload.json)'
  - id: entity2
    label: Wider array, softer kd/kp
    notes: 'Keeps the ±0.036 m sensor spacing to test the slalom line-loss hypothesis,
      but trims kp to 2.7 and kd to 1.2 (ratio 0.44, near the stable 0.4 tested at
      iteration 2) after the critique showed kd 1.7 was misread and untested. Rests
      on iteration 4 (score 645.2) and its slalom progress trend.


      ### Rationale


      Evidence. The best race so far is iteration 4 (score 645.2): sensors at x =
      ±0.032, kp 2.6, kd 1.0, base_speed 1.3. It finished 20/20 on the oval (mean
      1.99 s, steering_oscillation 0.21), 16/20 on the s-bend (mean 827, steering_oscillation
      0.37, control_effort 6.8), and 0/20 on the slalom (progress 0.37, 1.0 line-loss
      event per run, off-track in all runs). Iteration 2 (kp 2.0, kd 0.8, sensors
      ±0.024) was stable on the oval at kd/kp = 0.4. Iteration 0 showed kp 4 diverges.


      Round-2 critique, accepted and rejected:

      (1) Accepted: my revision misread the damping evidence. The stable oval run
      at kp 2.0 had kd/kp = 0.4, not 0.6, and kd 1.7 is an untested 1.9x rise in derivative
      gain on a noisy signal. I cut kd to 1.2, giving kd/kp = 0.44 at kp 2.7. That
      stays close to the tested 0.38 to 0.40 range.

      (2) Accepted: kp 2.9 gives a large steering kick at the outer sensors, and the
      kp scaling was a heuristic. I reduce kp to 2.7, a smaller step than 2.9 that
      still scales roughly with the wider spacing (2.6 x 0.036/0.032 is about 2.9,
      so 2.7 is a deliberate under-scale).

      (3) Accepted: the coverage gain is small. The geometric upper bound on tape-visible
      lateral offset is 0.036 + 0.0185 = 0.0545 m, versus about 0.0505 m at iteration
      4. This is an upper bound, not a calculated limit, and I now state it as such.

      (4) Rejected: the critique''s argument that the wider array should be dropped.
      The spacing change is the only variable tied directly to the diagnosed slalom
      line-loss failure, so I keep it and test it with a falsification rule.

      (5) Rejected: a base_speed cut. Oval completion (500 points) held at 20/20 at
      1.3, and speed is not a variable in this round.

      (6) Partly accepted: this round still changes spacing, kp and kd together relative
      to iteration 4, so attribution stays imperfect. I reduced the change from three
      values to a smaller kp and kd step to limit confounding. Stability is not computed
      and is still asserted.


      Kept: five 12 mm sensors at y 0.05, weights -2..2, ki 0, last_direction line
      loss, base_speed 1.3, and chassis geometry.


      Expected results (guesses, not measured). Oval finishes at about 1.9 to 2.1
      s with steering_oscillation at or below 0.25. Slalom progress rises above 0.4
      with line_loss_events below 1. S-bend completion holds at or above 16/20.


      Decision rules for the next round:

      - If slalom progress is below 0.4 with line_loss_events of 1 or more, the coverage
      hypothesis is weak. Next, examine sensor y lead or line-loss handling.

      - If oval steering_oscillation exceeds 0.3, reduce kd toward 1.0 before changing
      spacing.

      - If the oval fails to finish, return kp to 2.6.

      - If s-bend completion falls below 14/20, return kd to 1.0 and keep the wider
      array.


      - [Open this output](iteration-5/entity2/versions/4f43ee51f50445d6b8727492f4ed914f/payload.json)

      - Based on: [entity1](iteration-5/entity1/versions/53adfdf4733642998702a3aed4d291ef/payload.json),
