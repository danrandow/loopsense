map:
  id: race-213-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Wider array, kp 2.9
    notes: 'Widens the sensor row to ±0.036 m and raises kp and kd slightly, with
      base speed trimmed, to push slalom progress past the 0.37 of iteration 4. Evidence:
      slalom progress rose from 0.15 to 0.37 when the array widened from ±0.024 to
      ±0.032 m. The oval finish margin is about 1 s.


      ### Rationale


      Evidence: iteration 4 is the best race so far (score 645.2). It finished 20/20
      on the oval (mean 954, 1.99 s), 16/20 on the s-bend (mean 827), and 0/20 on
      the slalom (progress 0.37, off-track in all 20 runs, 1.0 line-loss event per
      run). Off-track is still the only end condition on the slalom.


      What changed across iterations: going from the 0.024 m array (iteration 2, slalom
      progress 0.15) to the 0.032 m array (iteration 4, slalom progress 0.37) raised
      slalom progress with kp still in the stable range. Widening the array is working,
      and the sensors need to see the tape at larger lateral offsets before line loss
      is triggered. The slalom is still failing, so the trend should continue.


      Changes: (1) Sensor x positions widen to -0.036, -0.018, 0, 0.018, 0.036 at
      y 0.05, keeping the 12 mm footprint. Tape stays visible to about ±0.048 m of
      offset, which is beyond the ±0.042 m where the slalom currently leaves. (2)
      Because the signal per metre of offset falls as the array widens, kp rises slightly
      from 2.6 to 2.9 to keep steering authority about constant. (3) kd rises from
      1.2 to 1.3 to add damping against the faster signal changes at the slalom''s
      reversals, keeping kd/kp near 0.45. (4) base_speed drops from 1.2 to 1.15 to
      give more time to correct on the sharp bends. The oval has about 1 s of margin,
      so it should still finish. (5) ki stays 0, weights stay (-2..2), and line_loss
      stays last_direction.


      Expected result: slalom progress should rise above 0.5, and line-loss events
      should fall below 1 per run. The oval should still finish at about 2.0 to 2.2
      s. The s-bend completion rate should hold or improve. Main risk: a wider array
      may increase oscillation on the oval, so steering_oscillation and line_loss_events
      on the oval and slalom are the first things to check.


      - [Open this output](iteration-5/entity0/versions/9a8e59bfa0614686a4ff5baad315c0d1/payload.json)

      - Based on: [entityR2A](iteration-5/entityR2A/versions/carried-fb118f779427682c/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Round-1 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-5/entityC1/versions/a2807d8111be4e09a65e0f545567c43f/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/9a8e59bfa0614686a4ff5baad315c0d1/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-fb118f779427682c/payload.json)'
  - id: entity1
    label: Wider array, kp 2.6, kd
    notes: 'Widens the sensor array to +/-0.032 m to keep the tape in view at larger
      offsets, which is the diagnosed slalom line-loss cause. Gains rise (kp 2.6,
      kd 1.5 to keep kd/kp near 0.6) and base_speed stays at 1.3 to protect oval completion,
      rejecting the critique''s speed cut. Rests on iteration-2 race data (oval 20/20,
      slalom progress 0.15).


      ### Rationale


      Evidence. The only race data is the iteration-2 design (kp 2.0, ki 0, kd 1.2,
      base_speed 1.3, five 12 mm sensors at x = -0.024 to +0.024, y 0.05, weights
      -2..2, last_direction). It finished 20/20 on the oval (mean 955, 1.91 s), finished
      1/20 on the s-bend (progress 0.52), and 0/20 on the slalom (progress 0.15, 1.3
      line-loss events per run). Off-track was the only end condition on the hard
      tracks. Gain level does not explain the slalom failure: progress was about 0.15
      at kp 2.0 and about 0.13 at kp 4.0.


      Diagnosis. The sensors see the 25 mm tape only out to about +/-0.0425 m of lateral
      offset (outer sensor at 0.024, footprint half-width 0.006, tape half-width 0.0125).
      The tape can leave the array before the robot reaches the off-track limit, and
      line loss then hands control to last_direction, which overshoots on quick reversals.
      Wider spacing addresses this directly.


      Accepted from the round-1 critique. (1) The kd/kp ratio was misstated. The stable
      oval run had 1.2/2.0 = 0.6, and the draft''s 0.46 is weaker damping, so kd rises
      to 1.5 (ratio 0.58). (2) The speed cut is rejected. Completion is worth 500
      points, the oval finished 20/20 at base_speed 1.3, and speed was not the diagnosed
      cause, so base_speed stays at 1.3. (3) The 12 mm footprint stays, so the footprint
      is not a second variable.


      Kept. Sensor x positions move to -0.032, -0.016, 0, 0.016, 0.032 at y 0.05.
      Each outer sensor now covers tape to about +/-0.0505 m. Weights, ki 0 and last_direction
      are unchanged. kp rises from 2.0 to 2.6 to keep steering authority roughly constant,
      since the signal per metre falls with wider spacing. This scaling is approximate.


      Not fully isolated. Geometry, kp and kd change together. The geometry hypothesis
      is tested in the slalom line_loss_events and progress, which the gain change
      alone would not be expected to move much given the iteration-2 evidence.


      Expected result (guesses, not measured). Oval still finishes at about 1.9 to
      2.1 s. Slalom line_loss_events fall below 1 per run and slalom progress rises
      above 0.3. Decision rules: if slalom progress stays below 0.3 with line_loss_events
      above 1, the coverage hypothesis is wrong and the next round should examine
      sensor y (lead) or line_loss. If oval steering_oscillation exceeds 0.3 (iteration
      2 was 0.22), reduce kd toward 1.2. If the oval fails to finish, return kp to
      2.0.


      - [Open this output](iteration-4/entity1/versions/1f48c76b758f4b4bbf5c14470532f006/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/2241e7e877844634934a99c3ac034124/payload.json),
      [entityC1](iteration-4/entityC1/versions/56b4cf1f683340c0b068c5a12417ad68/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-5951d3a57993cd0a/payload.json)'
  - id: entityC2
    label: Round-2 critique
    notes: 'Critiques the revised design (kp 2.6, kd 1.5, wider sensors) and its rationale.
      The main finding is that the rationale misreads the stable run''s kd/kp ratio
      (0.4, not 0.6) and that the wider array adds only about 8.5 mm of coverage margin,
      so the test is weak. Based on the iteration 2 race data and the design contract.


      - [Open this output](iteration-4/entityC2/versions/3cd0836e06464571a4eba62940870864/payload.json)

      - Based on: [entity1](iteration-4/entity1/versions/1f48c76b758f4b4bbf5c14470532f006/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-5951d3a57993cd0a/payload.json)'
  - id: entity2
    label: Wider array, kd 1.0
    notes: 'Sensors widened to ±0.032 m to cover the tape past the off-track limit,
      with kp 2.6 to hold steering authority and kd cut from the draft''s 1.5 to 1.0
      (kd/kp 0.38, near the raced stable 0.4). Based on iteration 2''s slalom failure
      (progress 0.15, 1.3 line-loss events) and the critique''s point that kd 1.5
      was never tested.


      ### Rationale


      Evidence: the only raced geometry is iteration 2 (kp 2.0, kd 0.8, base 1.3,
      five 12 mm sensors at x = -0.024 to +0.024, y 0.05). It finished 20/20 on the
      oval (mean 1.91 s), finished 1/20 on the s-bend, and 0/20 on the slalom (progress
      0.15, 1.3 line-loss events per run). Off-track ended every hard-track run. Iteration
      0 showed that kp 4 diverges, and slalom progress was about 0.13 to 0.15 at both
      kp 2 and kp 4, so gain level does not explain the slalom failure. The working
      hypothesis is that the 25 mm tape leaves the outer sensors'' reach before the
      off-track limit, so line loss hands control to last_direction.


      Accepted from the round-2 critique: (1) The kd/kp ratio was misstated. The stable
      oval run had kd/kp = 0.8/2.0 = 0.4, not 0.6, and kd 1.5 was never raced. Raising
      kd to 1.5 would be a 1.9x untested increase in noise gain, so I reject it. (2)
      The coverage margin from the draft is small (about 8.5 mm). I keep the wider
      array anyway, since it is the only change that directly addresses the diagnosed
      cause, and I test it with a clear falsification rule. (3) The kp scaling was
      not derived. I keep kp near the draft''s 2.6, since the signal slope per metre
      falls roughly with spacing (about 0.75 at 16 mm vs 12 mm spacing gives about
      2.7), but I state it as approximate.


      Changed from the draft: kd goes from 1.5 to 1.0. This is a compromise between
      the critique''s noise concern and the draft''s damping goal. kd/kp = 1.0/2.6
      = 0.38, close to the stable raced ratio of 0.4.


      Kept: base_speed 1.3 (oval completion is worth 500 points and was 20/20 at 1.3),
      sensor_size 0.012, weights -2..2, ki 0, last_direction line loss, and the chassis
      geometry. Rejected: a speed cut, since it would be a second variable and risks
      completions.


      Changes are still bundled (geometry, kp, kd), so attribution is imperfect. The
      next round uses the slalom line_loss_events and progress as the geometry test.


      Expected result (guesses, not measured): the oval still finishes at about 1.9
      to 2.1 s. Slalom line_loss_events fall below 1 per run and slalom progress rises
      above 0.3. Decision rules: if slalom progress stays below 0.3 with line_loss_events
      above 1, the coverage hypothesis is wrong, so the next round should examine
      sensor y (lead) or line_loss. If oval steering_oscillation exceeds 0.3 (iteration
      2 was 0.22), reduce kd toward 0.8. If the oval fails to finish, return kp to
      2.0.


      - [Open this output](iteration-4/entity2/versions/bf3e00b343f741b8afe081f95532638a/payload.json)

      - Based on: [entity1](iteration-4/entity1/versions/1f48c76b758f4b4bbf5c14470532f006/payload.json),
