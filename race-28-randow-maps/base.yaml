map:
  id: race-28-randow-maps
  schema: v0.2
  title: Robot Race 28 — Randow Maps
  scenario: Moving Parts
  is_moo: true
  notes: 'The producer–integrator entrant: geometry and controller work pass through
    explicit handoffs, with integration feedback and separately addressed race evidence.'
  dimension_axes:
  - time_horizon
  - iteration
actors:
- id: actor0
  label: Geometry Builder
  notes: Designs geometry using integration feedback and addressed race evidence.
- id: actor1
  label: Robot Integrator
  notes: Integrates geometry with a controller and gives the Geometry Builder specific
    feedback on what the geometry needs to change.
- id: actor2
  label: Race Simulator
  notes: Deterministic software actor that races and records evidence.
actions:
- id: action0
  label: Design Geometry
  actor: actor0
  notes: Produces bounded geometry, intent, hypotheses, and measurement requests.
  measures:
  - id: input_tokens
    name: Model input tokens
    unit: tokens
  - id: output_tokens
    name: Model output tokens
    unit: tokens
  - id: repair_calls
    name: Format repair calls
    unit: calls
    better: lower
  - id: invalid_artifacts
    name: Invalid model artifacts
    unit: artifacts
    better: lower
- id: action1
  label: Integrate Robot
  actor: actor1
  notes: Produces a runnable package and returns integration feedback to the Geometry
    Builder every iteration, before and after races.
  measures:
  - id: input_tokens
    name: Model input tokens
    unit: tokens
  - id: output_tokens
    name: Model output tokens
    unit: tokens
  - id: repair_calls
    name: Format repair calls
    unit: calls
    better: lower
  - id: invalid_artifacts
    name: Invalid model artifacts
    unit: artifacts
    better: lower
- id: action2
  label: Race and Measure
  actor: actor2
  notes: Runs development trials and produces an outcome and addressed evidence.
entities:
- id: entity0
  label: Geometry Proposal
  system_boundary: internal
  notes: Geometry, intent, hypotheses, and measurement requests; not a runnable robot.
  measures:
  - id: requested_measurements
    name: Requested measurements
    unit: measurements
- id: entity1
  label: Complete Robot Package
  system_boundary: internal
  notes: Supplied geometry, controller, integration notes, and observation request.
  measures:
  - id: requested_measurements
    name: Requested measurements
    unit: measurements
- id: entity2
  label: Race Outcome
  system_boundary: internal
  notes: Human-facing result; upstream learning uses addressed returns.
  measures:
  - id: score
    name: Composite race score
    unit: points
    better: higher
  - id: completion
    name: Completed trial proportion
    unit: proportion
    better: higher
  - id: progress
    name: Normalized track progress
    unit: proportion
    better: higher
  - id: completion_time
    name: Completion time
    unit: seconds
    better: lower
  - id: rms_error
    name: RMS centre-line error
    unit: metres
    better: lower
  - id: max_error
    name: Maximum centre-line error
    unit: metres
    better: lower
  - id: line_loss_events
    name: Line-loss events
    unit: events
    better: lower
  - id: steering_oscillation
    name: Steering oscillation
    unit: index
    better: lower
  - id: control_effort
    name: Controller effort
    unit: index
    better: lower
  - id: controller_errors
    name: Controller errors
    unit: errors
    better: lower
  - id: noise_robustness
    name: Noise robustness
    unit: proportion
    better: higher
  - id: held_out_gap
    name: Development held-out gap
    unit: points
    better: lower
- id: entityR1
  label: Integration Feedback
  notes: 'Direct feedback from the Robot Integrator to the Geometry Builder: how the
    geometry helped or hindered the controller, what the Integrator had to compensate
    for, and the specific geometry changes to try next. The Geometry Builder cannot
    see the controller, so this is their main way to learn what the Integrator needs.'
- id: entityR2A
  label: Geometry Race Data
  notes: Measurement-only evidence addressed to the Geometry Builder.
  measures:
  - id: supplied_requests
    name: Supplied requested measures
    unit: measurements
    better: higher
- id: entityR2B
  label: Integration Race Data
  notes: Measurement-only evidence addressed to the Robot Integrator.
  measures:
  - id: supplied_requests
    name: Supplied requested measures
    unit: measurements
    better: higher
- id: entityPub0
  label: Design Constraints
  system_boundary: public
  notes: Permitted robot bounds, scoring criteria, and measurement vocabulary. Its
    contract is the exact shape of a design (geometry and controller).
- id: entityPub2
  label: Track Conditions
  system_boundary: public
  notes: Tracks, seeds, noise, trial order, and held-out configuration.
edges:
- id: edge0G
  type: generates
  from: action0
  to: entity0
- id: edge0U
  type: used by
  from: entity0
  to: action1
- id: edge1G
  type: generates
  from: action1
  to: entity1
- id: edge1U
  type: used by
  from: entity1
  to: action2
- id: edge2G
  type: generates
  from: action2
  to: entity2
- id: edge1R1G
  type: generates
  from: action1
  to: entityR1
  direction: return
- id: edge1R1U
  type: used by
  from: entityR1
  to: action0
  direction: return
- id: edge2R2AG
  type: generates
  from: action2
  to: entityR2A
  direction: return
- id: edge2R2AU
  type: used by
  from: entityR2A
  to: action0
  direction: return
- id: edge2R1BG
  type: generates
  from: action2
  to: entityR2B
  direction: return
- id: edge2R1BU
  type: used by
  from: entityR2B
  to: action1
  direction: return
- id: edgePub0U0
  type: used by
  from: entityPub0
  to: action0
- id: edgePub0U1
  type: used by
  from: entityPub0
  to: action1
- id: edgePub2U
  type: used by
  from: entityPub2
  to: action2
