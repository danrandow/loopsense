overrides:
  entities:
  - id: entity0
    label: Softer control, lighter
    notes: 'Reduced kp to 0.5 and sensor_weights magnitude to [-0.35,0.45,-0.35] to
      further reduce oscillations and overcorrection, keeping base_speed at 0.8 and
      line_loss ''search_left'' to improve stability and recovery. Requested telemetry
      to confirm effects.


      ### Rationale


      The previous candidate softened sensor_weights to [-0.5,0.6,-0.5] and reduced
      kp to 0.6, aiming to reduce oscillations and overcorrection, with base_speed
      at 0.8 and line_loss set to ''search_left''. However, without telemetry, we
      cannot confirm if oscillations or line loss events have improved. To further
      reduce potential oscillations, I lowered kp to 0.5 to soften proportional response,
      and reduced sensor_weights magnitude to [-0.35,0.45,-0.35] to decrease steering
      sensitivity and overcorrection risk. Base_speed remains at 0.8 for stability,
      and line_loss remains ''search_left'' to continue testing this recovery strategy.
      I expect these changes to reduce steering oscillations and line loss events,
      improving stability and line tracking. I request telemetry on steering_oscillation
      and line_loss_events to verify these hypotheses and guide further tuning.


      - [Open this output](iteration-2/entity0/versions/57603c975acb4c80aafb1c96aefea607/payload.json)

      - Based on: [entityR1](iteration-2/entityR1/versions/01439d04d1d84fc8ad0533ced3e00080/payload.json)'
  - id: entityR1
    label: 'Feedback: Ready for test'
    notes: 'Lowered kp to 0.5 and softened sensor weights to reduce oscillations and
      overcorrection, but no telemetry yet to confirm improvements. Recommend running
      a development race to gather data before approval.


      ### Feedback


      The candidate has been tuned with a reduced proportional gain kp of 0.5 and
      softened sensor weights to [-0.35,0.45,-0.35], aiming to reduce steering oscillations
      and overcorrection. This is a logical next step based on the previous rationale
      and feedback, which suggested these changes if oscillations persisted. However,
      no telemetry data from a development race is available yet to confirm if these
      adjustments have effectively improved stability or reduced line loss events.
      Without this evidence, it is premature to approve this candidate for final racing.
      I recommend running a development race with this candidate to collect telemetry
      on steering_oscillation and line_loss_events. If oscillations or overcorrection
      remain, consider further fine-tuning kp and sensor_weights magnitudes or asymmetry.
      For now, this candidate is ready for testing but not yet approved for final
      race.


      ### Requested changes


      - Run development race to collect telemetry on steering_oscillation and line_loss_events

      - If oscillations persist, consider further reducing controller.kp to 0.4

      - If overcorrection remains, try sensor_weights with smaller magnitudes, e.g.
      [-0.3,0.4,-0.3]


      - [Open this output](iteration-2/entityR1/versions/732889fc3d5c48409b209a8e286e3cc8/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/57603c975acb4c80aafb1c96aefea607/payload.json)'
