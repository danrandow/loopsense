  - id: entity0
    label: Improved 5-sensor PID
    notes: 'Added more sensors symmetrically and tuned PID gains for better line tracking
      and stability, expecting fewer line loss events and improved progress.


      ### Rationale


      The initial design is improved by increasing the number of sensors to five,
      arranged symmetrically across the front to better detect line position and curvature,
      which should improve line tracking and reduce line loss events. Sensor size
      is set to medium (0.012) to balance sensitivity and noise. The wheel track and
      wheel radius are set to moderate values (0.14 and 0.035) to provide stable turning
      without excessive wheel slip. The controller gains are adjusted to kp=0.9, ki=0.05,
      kd=0.15 to provide a responsive but stable PID control, reducing oscillations
      and improving error correction. Sensor weights are set to emphasize outer sensors
      negatively and center sensors less so, to better detect line deviation. The
      line loss behavior is set to ''search_left'' to have a consistent recovery strategy.
      The observation request includes all key telemetry metrics to diagnose performance
      in the next iteration. This design aims to improve line following accuracy,
      reduce line loss events, and maintain stable control, expecting better progress
      and completion rates on the development tracks.


