  entities:
  - id: entity0
    label: Lower kp, more kd, slower
    notes: 'Cuts kp 1.5 to 1.2, raises kd 0.4 to 0.6 and lowers base_speed 1.3 to
      1.1 to reduce overshoot and line loss on the s-bend and slalom. Based on iteration
      1, where lowering kp raised s-bend progress from 0.20 to 0.47 while the oval
      still finished in all 20 trials.


      ### Rationale


      Evidence from iteration 1 (kp 1.5, kd 0.4, ki 0.02, base_speed 1.3, sensors
      at y=0.06, x spread ±0.03): the oval now finishes 20/20 in 1.91 s, a clear gain.
      The s-bend (progress 0.47) and slalom (progress 0.18) still leave the tape with
      max_error about 0.062 m, just past the 0.06 m off-track limit. The slalom shows
      about one line-loss event per run, so the robot loses the line on the sharp
      bends and cannot recover. Moving from kp 3.0 to 1.5 raised s-bend progress from
      0.20 to 0.47, so the trend says the loop still overreacts. The off-track limit
      is fixed at 0.06 m for this body width (the 0.19 m body width needed to widen
      it is out of range), so the robot must track tighter, not be allowed further
      out. Changes: (1) kp 1.5 -> 1.2, a further small cut in steering overshoot.
      (2) kd 0.4 -> 0.6, more damping of the faster swings on sharp bends. (3) base_speed
      1.3 -> 1.1, so the robot has more time to correct on the tight slalom and s-bend
      corners. The oval has time margin (1.91 s at 1.3, so about 2.2 s at 1.1, under
      3 s). Geometry and ki are held fixed so the controller effect can be read cleanly.
      Expected result: s-bend and slalom progress rise, with a chance of the s-bend
      completing. Line_loss_events should fall toward 0 on the slalom. Risk: the slower
      speed may push the oval finish time up, and kp too low could leave the robot
      slow to correct at tight bends. Hypotheses to check: (a) max_error on the slalom
      is set by the sharpest bend, not by a steady drift; (b) kd is the main lever
      for the oscillation seen at this kp. Measurements wanted next: per-track progress,
      max_error, line_loss_events and completion_time to see whether speed or steering
      limits the s-bend and slalom, and steering_oscillation to confirm kd damping.


