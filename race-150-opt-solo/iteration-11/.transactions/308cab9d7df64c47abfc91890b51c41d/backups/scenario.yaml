  - id: entity0
    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      This is the final iteration, so this candidate is the design that races on the
      unseen track and no further development race follows. The best evidence is iteration
      3 (score 680.6, the best of all 11 iterations). It finishes the oval (20/20,
      1.998 s) and the s-bend (20/20, 2.387 s) in every trial. The slalom leaves the
      track in every trial (progress 0.35, max_error 0.063 m against the fixed 0.06
      m off-track limit).


      Every change since iteration 3 has either regressed or been neutral: wider spread
      (iter 4, 670), 7 sensors at 16 mm (iter 5, 673), speed 0.9 with kd 1.0 (iter
      6, 610), mass 0.7 (iter 7, 650), sensor lead y=0.08 (iter 8, 667), ki 0.08 (iter
      9, 675), and search_left (iter 10, identical to iter 3). The off-track limit
      cannot be widened within the body-width range, so the unseen track is also judged
      on tight tracking.


      I therefore keep the iteration 3 geometry and controller unchanged. Changing
      an untested variable now would risk the two tracks that finish reliably, and
      the final race cannot be followed by another test. Expected result: near the
      iteration 3 score, with oval and s-bend completion. Hypotheses to check on the
      final race: whether the unseen track''s bends resemble the s-bend (completes)
      or the slalom (fails). The measurements requested are the same as before so
      the outcome can be compared directly.


