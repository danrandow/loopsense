  entities:
  - id: entity0
    label: Softer steer, earlier
    notes: 'Cut kp from 3.0 to 1.5, raised kd to 0.4 and reduced ki, with sensors
      moved forward to y=0.06 and base speed lowered to 1.3. Iteration 0 went off-track
      on every trial with max error near the 0.06 m limit and high steering oscillation,
      which points to over-aggressive steering.


      ### Rationale


      Evidence: iteration 0 ended off-track on all 60 development trials (0 finishes).
      Max error was about 0.062 m, just past the 0.06 m off-track limit, which is
      the limit for this body width. Progress was 0.47 on the oval, 0.20 on the s-bend
      and 0.10 on the slalom, so the robot loses the line in the first bends. Steering
      oscillation (0.14 to 0.26) and control effort are high, which suggests the loop
      overreacts. With kp=3 and weights of ±2, a 3 cm offset gives turn about 4.5,
      a wheel differential of roughly 1500 PWM. That is likely too aggressive, so
      the robot overshoots and then leaves the tape. Changes: (1) kp 3.0 -> 1.5 to
      cut overshoot. (2) kd 0.3 -> 0.4 to damp the faster swings. (3) ki 0.05 -> 0.02
      to limit windup on the bends. (4) base_speed 1.4 -> 1.3 so the robot can hold
      the line through the tighter slalom and s-bend corners, at a small cost in lap
      time. (5) Sensors moved forward to y=0.06 so the line is seen earlier, which
      reduces the lag that drives oscillation, and the lateral spread tightened to
      ±0.03 m for a finer and more linear signal near the centre. Geometry is otherwise
      unchanged: body width 0.12 already gives the 0.06 m limit, and a wider body
      would not raise it below 0.19 m. Expected result: fewer off-track exits, with
      progress rising on all three tracks and some completions on the oval. Next measurements:
      rms_error and max_error per track to check whether the tighter tracking holds,
      steering_oscillation to confirm the damping, and line_loss_events on the slalom
      to see whether the sharper corners still cause line loss. If the robot now stays
      on the line but is too slow to finish in 3 s, raise base_speed; if it still
      oscillates, lower kp further or raise kd.


