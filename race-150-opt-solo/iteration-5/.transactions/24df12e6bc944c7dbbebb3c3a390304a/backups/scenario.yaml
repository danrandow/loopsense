  entities:
  - id: entity0
    label: 7-sensor wide, 16mm eyes
    notes: 'Seven sensors spanning ±0.06 m with 16 mm footprints and linear weights,
      aimed at cutting slalom line losses that cap progress. Based on iteration 4
      (669.9), where the oval and s-bend completed but the slalom went off track at
      0.42 progress with about one line loss per run.


      ### Rationale


      Evidence: iteration 3 (score 680.6) and iteration 4 (669.9) both finish the
      oval and s-bend, but the slalom fails in all 20 trials per iteration. Progress
      rose from 0.35 to 0.42 when the sensor spread went from ±0.04 to ±0.05 m and
      kp dropped to 1.0. Max error is still about 0.063 m, just past the fixed 0.06
      m off-track limit, and the slalom loses the line about once per run. Body width
      cannot widen that limit (it would need body_width above 0.19 m, out of range),
      so the robot has to keep the tape under its sensors. Line loss happens when
      the summed reading falls below 0.05, which means no sensor covers any tape.
      Two changes address this. (1) Use 7 sensors at x = -0.06, -0.04, -0.02, 0, 0.02,
      0.04, 0.06 m, spanning the full body width, so one sensor is always near the
      tape at the sharpest bends. (2) Enlarge the sensor footprint from 12 mm to 16
      mm, so a sensor still sees tape at about 2 cm off-centre (the tape is 25 mm
      wide and half-width is 12.5 mm plus half the sensor). Weights are set to about
      40 per metre of offset, clipped to ±2: [-2, -1.6, -0.8, 0, 0.8, 1.6, 2]. This
      keeps the steering gain per metre close to the iteration-4 value, so kp 1.0
      and kd 0.8 are kept. Speed (1.0), ki (0.02), line_loss (last_direction) and
      the drivetrain are held fixed so the sensing change can be read. Expected result:
      fewer slalom line-loss events, slalom progress above 0.5, and the oval and s-bend
      still completing at about 2.0 to 2.4 s. Risks: the larger footprint may raise
      steering jitter on straights, and 7 sensors add a little more noise averaging.
      Hypotheses: (a) slalom failures come from losing the line at the sharpest bends
      because outer sensors do not reach far enough, so wider and larger-footprint
      sensing fixes most of it; (b) the remaining slalom error is set by lag at this
      speed. Measurements wanted: per-track progress, max_error and line_loss_events
      to see whether the first failing slalom bend is passed, and steering_oscillation
      to check the jitter cost of the larger footprint. If the slalom still loses
      the line, the next step is to test line_loss ''search_left'' or ''search_right'',
      or to lower base_speed to about 0.9.


