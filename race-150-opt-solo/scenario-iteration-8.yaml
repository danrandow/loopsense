  entities:
  - id: entity0
    label: Sensors forward to y=0.08
    notes: 'Moves the five sensors 2 cm further ahead of the axle to cut sensing lag,
      the suspected cause of slalom off-track exits. Mass is reverted to 0.8 kg because
      the 0.7 kg change in iteration 7 cut s-bend completion. Expected: higher slalom
      progress with the oval and s-bend still completing.


      ### Rationale


      Evidence: Iteration 3 (score 680.6) is still the best. Oval and s-bend finish
      20/20, but the slalom leaves the track in every trial (progress 0.35, about
      one line loss per run, max_error about 0.063 m, just past the fixed 0.06 m limit).
      Iteration 4 showed that widening the sensor spread to +/-0.05 m raises slalom
      progress (0.42), at some cost to s-bend completion. Iteration 5 (7 sensors,
      16 mm) and iteration 6 (speed 0.9, kd 1.0) both regressed. Iteration 7 combined
      the spread with mass 0.7 and scored 650. Its s-bend completion fell to 17/20,
      so the mass change did not help and is not separable from the spread change.
      I am reverting mass to 0.8 because it is the known-good value.


      Change: the main untested lever is sensor lead. Moving the sensors from y=0.06
      to y=0.08 (the contract maximum) lets the robot see the tape about 2 cm earlier.
      That should cut the loop lag that appears to set the slalom failure at the sharpest
      bend. Spread stays at +/-0.05 m, 12 mm footprint, 5 sensors, weights [-2,-1,0,1,2].
      Controller stays at kp 1.0, ki 0.02, kd 0.8, base_speed 1.1 and last_direction,
      so the sensor-lead effect can be read.


      Expected result: slalom progress above 0.42 and fewer slalom line losses, with
      oval and s-bend still completing near 2.0 to 2.4 s. Risks: the sensors may see
      the tape earlier than the steering can respond on tight bends, and the signal
      may be noisier at longer range. Hypotheses: (a) slalom failure is lag-driven,
      so earlier sensing helps; (b) mass 0.8 is better than 0.7 for s-bend stability.
      Next measurements wanted: per-track progress, max_error and line_loss_events
      on the slalom, steering_oscillation to check for jitter from the longer lead,
      and completion_time to confirm the 3 s budget. If the slalom still fails at
      the same bend, the next test is line_loss ''search_left'' or ''search_right''.


