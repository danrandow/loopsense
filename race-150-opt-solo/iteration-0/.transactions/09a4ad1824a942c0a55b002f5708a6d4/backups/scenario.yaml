    label: Robot Candidate
    notes: 'Robot Candidate. The model did not supply a valid label and summary, so
      the orchestrator wrote this one.


      ### Rationale


      Iteration 0 has no race telemetry, so this is a conservative baseline built
      from the contract. Five sensors span x = -0.04 to +0.04 m, ahead of the axle
      at y = 0.05 m, so the line is seen before the wheels reach it. Weights run -2
      to +2 from right to left, so a left-side reading steers left, matching the sign
      convention. A 12 mm footprint covers the 25 mm tape at the outer sensors without
      saturating. The drivetrain is sized for stability: 0.12 m track, 0.03 m wheels,
      0.8 kg, body 0.12 x 0.18 m. Base speed 1.4 is high enough to reach about 1.5
      m/s average. kp 3.0 gives moderate steering, kd 0.3 damps oscillation, and ki
      0.05 is small to avoid windup. line_loss ''last_direction'' recovers from the
      line edge in the direction it was last lost. Expected result: completion on
      the oval and s-bend, with the slalom likely showing the most oscillation and
      line-loss events. The next iteration should be tuned from rms_error, steering_oscillation
      and line_loss_events.


      - [Open this output](iteration-0/entity0/versions/dd42830055fe41e9a277748f6deae66e/payload.json)'
  actions:
  - id: action0
