  entities:
  - id: entity0
    label: Wider sensors, more
    notes: 'Lowers kp to 1.1, raises kd to 0.8, and widens the sensor spread to +/-0.04
      m to hold the tape on sharp slalom and s-bend corners. Based on iteration 2,
      where the oval finished 20/20 but the slalom and s-bend still went off track
      with line loss.


      ### Rationale


      Evidence from iteration 2 (score 514.6, best so far): the oval finishes 20/20
      at 1.88 s, so speed and steering are adequate on gentle bends. The s-bend finishes
      8/20 and the slalom finishes 0/20. Both fail by going off track with max_error
      near the 0.06 m limit, and the slalom loses the line about once per run (progress
      0.21). The off-track limit is fixed at 0.06 m for body width 0.12, and widening
      the body to reach a larger limit is out of range, so the robot must track tighter.
      Each step from iteration 0 to 2 (lower kp, higher kd, lower speed) improved
      the s-bend, so the loop still overreacts to the sharp bends. Changes: (1) kp
      1.2 -> 1.1, a small further cut in steering gain. (2) kd 0.6 -> 0.8, more damping
      of the swings that cause the oscillation (0.18 to 0.24). (3) Sensor lateral
      spread widened from +/-0.03 to +/-0.04 m, so the tape stays under a sensor on
      sharper bends and fewer line-loss events occur. Base speed 1.1, ki 0.02, sensor
      size, wheel geometry and mass are held fixed so the effect of the steering change
      can be read. Expected result: fewer slalom line losses and higher slalom and
      s-bend progress, with the oval still finishing. Hypotheses: (a) slalom failures
      come from the lateral sensor reach on sharp bends, not from steady drift; (b)
      kd is the main lever for oscillation at this kp. Next measurements wanted: per-track
      progress, max_error and line_loss_events to see whether the wider sensor reach
      helps the slalom, and steering_oscillation to confirm the kd effect. If the
      slalom still loses the line, the next step is to test line_loss ''search_left''
      or ''search_right'' and a faster kd.


