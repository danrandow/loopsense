  entities:
  - id: entity0
    label: Iter 3 + ki 0.08 test
    notes: 'Returns to the best-scoring iteration 3 design (680.6) and raises the
      integral gain from 0.02 to 0.08 to test whether the fixed motor-mismatch bias
      causes the slalom off-track exits. Evidence: every other lever tried since iteration
      3 regressed or was confounded.


      ### Rationale


      Evidence. Iteration 3 (score 680.6) is still the best design. Oval and s-bend
      finish 20/20, but the slalom goes off track in every trial (progress 0.35, about
      one line loss per run, max_error about 0.063 m, just past the fixed 0.06 m limit).
      Every later change has been a regression or confounded: the wider spread (iter
      4, 669.9), 7 sensors with 16 mm (iter 5, 673), speed 0.9 with kd 1.0 (iter 6,
      610), mass 0.7 (iter 7, 650) and sensor lead y=0.08 (iter 8, 667). The off-track
      limit is fixed at 0.06 m, because body width 0.12 to 0.18 cannot widen it enough,
      so the robot has to track tighter.


      Change: I am returning to the iteration 3 geometry and controller and changing
      one variable, ki 0.02 to 0.08. The fixed left/right motor mismatch in the disturbance
      produces a steady bias toward one side, and the integral term is the only part
      of the loop that cancels it. The bias may be the slow part of the slalom max_error,
      and the iteration 3 ki of 0.02 may be too small to remove it. The integral is
      capped at +/-2, so windup is bounded.


      Expected result: lower rms_error and max_error on the oval and s-bend, and slalom
      progress above 0.40 with fewer off-track exits. Risk: a larger ki could add
      overshoot on the sharp slalom bends, which would show as higher steering_oscillation
      and a worse slalom. Hypotheses: (a) part of the slalom drift is a steady bias
      from the motor mismatch; (b) ki is a cheap lever that has not yet been tested.
      Measurements wanted: per-track max_error, rms_error and line_loss_events on
      the slalom, steering_oscillation to see if ki adds jitter, and completion_time
      to confirm the 3 s budget. If the slalom still leaves at the same bend, the
      next test is line_loss ''search_left'' or ''search_right''.


