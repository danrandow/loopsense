overrides:
  entities:
  - id: entity0
    label: Baseline draft design
    notes: 'A first-principles baseline with five sensors, kp 3, kd 0.3 and base speed
      1.5, since no race telemetry exists for this iteration. The Evaluator should
      check the sensor sign convention and the speed target against the 3 s finish
      limit.


      ### Rationale


      No race telemetry is available for this iteration. Iteration 0''s draft was
      lost to an output-length cutoff, so there is no measured evidence yet and this
      is a first-principles baseline. Geometry: five line sensors at x = -0.02, -0.01,
      0, 0.01, 0.02 m cover about 0.8 tape widths, placed 0.05 m ahead of the axle
      so they read the line before the wheels reach it. Sensor size 0.012 m covers
      the 25 mm tape without over-smearing bends. Wheel track 0.12 m and radius 0.03
      m give moderate turn authority; body 0.12 x 0.18 m and mass 0.8 kg keep yaw
      inertia modest and well inside the off-track limit. Controller: sensor weights
      (-2, -1, 0, 1, 2) follow the sensor''s lateral offset, so a line on the left
      gives a positive signal and steers left, as the contract requires. kp = 3 gives
      about 1050 PWM per unit signal, firm but not saturating. ki = 0.1 is kept small
      to avoid integral wind-up on bends. kd = 0.3 damps sensor-driven oscillation.
      base_speed = 1.5 targets the roughly 1.5 m/s average needed to finish within
      3 s while leaving margin for cornering. line_loss = last_direction so the robot
      keeps turning the way it was going when the line is lost at the edge of a bend.
      Expected result: completion on the oval and s-bend with modest error; the slalom
      and unseen tracks may show oscillation or line loss, which the next telemetry
      should expose. All measurements are requested so the next iteration can tune
      kp, kd and base_speed against measured rms_error, steering_oscillation and line_loss_events.


      - [Open this output](iteration-1/entity0/versions/69003baf15bc4d7b9d0e44b8658597ea/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Round-1 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-1/entityC1/versions/bcf6ce6daff747fda16c2f3bde96bbe8/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/69003baf15bc4d7b9d0e44b8658597ea/payload.json)'
  - id: entity1
    label: Revised baseline, lower
    notes: 'Keeps geometry, weights, kp and base_speed from the draft; lowers kd 0.3
      to 0.15 and ki 0.1 to 0.05 to limit noise amplification and reflect that the
      integral term is near-inert. Corrects the sensor-span and off-track-limit claims
      per the critique, and rejects the saturation claim because 971 PWM stays positive
      at max turn.


      ### Rationale


      Kept: the geometry (five sensors at x = -0.02 to 0.02 m, y = 0.05 m, sensor_size
      0.012 m, wheel_track 0.12 m, wheel_radius 0.03 m, body 0.12 x 0.18 m, mass 0.8
      kg), sensor weights (-2, -1, 0, 1, 2), kp = 3.0, base_speed = 1.5, line_loss
      = last_direction, and the full measurement request. The critique''s main points
      were checked against the contract. (1) Sensor span: the critique is right that
      the centres span 0.04 m (about 1.6 tape widths), not 0.8. I accept the correction
      and will not claim the array is narrow. I keep the layout because no race data
      shows a coverage problem, and changing it now would confound the first telemetry.
      (2) Off-track limit: the critique is right that the 0.06 m floor governs for
      every allowed body width, so body_width is not a tuning lever; I stop describing
      it as one and keep 0.12 m. (3) base_speed is a duty fraction (75% PWM), not
      a ground speed. I accept this and keep 1.5 as a starting point, since the first
      race will measure completion_time and progress directly. (4) Derivative noise:
      accepted. Differentiating about 2% sensor noise at 100 Hz can add steering jitter,
      so I reduce kd from 0.3 to 0.15. (5) Integral term: accepted that ki = 0.1 with
      a +/-2 cap is nearly inert, so I lower it to 0.05 and keep it small only as
      a drift guard. (6) Turn authority: I partly reject this. At base 3071 PWM and
      maximum turn 6 (350 x 6 = 2100 PWM), the inner wheel command is 971 PWM, not
      zero or below, so there is no saturation at the chosen speed. I keep kp = 3.0
      for now. Expected result: completion on the oval and s-bend with lower steering_oscillation
      than iteration 0 would have produced; slalom line loss and speed sufficiency
      remain unverified, and the telemetry should show which.


      - [Open this output](iteration-1/entity1/versions/f19ce7067bb44cd5a1fc59361704fed5/payload.json)

      - Based on: [entity0](iteration-1/entity0/versions/69003baf15bc4d7b9d0e44b8658597ea/payload.json),
      [entityC1](iteration-1/entityC1/versions/bcf6ce6daff747fda16c2f3bde96bbe8/payload.json)'
  - id: entityC2
    label: Round-2 critique
    notes: 'Critiques the revised controller and rationale. Main points: base_speed
      = 1.5 is unverified against the 1.5 m/s finish requirement, the sensor array
      has no sharp-bend safeguard, and the rationale''s oscillation claim is counterfactual.
      Arithmetic (971 PWM inner wheel) was checked and is correct.


      - [Open this output](iteration-1/entityC2/versions/2f318670b8554605b57803ef54f13137/payload.json)

      - Based on: [entity1](iteration-1/entity1/versions/f19ce7067bb44cd5a1fc59361704fed5/payload.json)'
  actions:
  - id: action0
