map:
  id: race-209-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Forward, wider sensors
    notes: 'Moves the sensor array forward to y=0.07 and widens it to ±0.03 m, with
      kp lowered to 1.2, kd to 0.4 and base_speed to 1.3. Iteration 2 still left max_error
      at about 0.063, past the 0.06 m off-track limit, so the change targets sensor
      lag and line loss on bends rather than steering gain.


      ### Rationale


      Evidence: all 60 development trials across three tracks ended off_track with
      zero finishes. Iteration 2 cut kp from 3.0 to 1.5 and added kd, which raised
      scores (59.3 to 64.1), but max_error stayed at 0.063 to 0.067, just past the
      0.06 m off-track limit (for body_width 0.12 the limit is max(0.06, 0.0125 +
      0.03) = 0.06). Steering_oscillation is still 0.11 to 0.16 and line losses are
      1 to 2 per run. Progress is only 0.12 to 0.19, so runs die within the first
      metre.


      Diagnosis: max_error is nearly unchanged across the kp change, so steering gain
      is not the main limit. The likely causes are (a) sensor lag, since sensors at
      y = 0.05 see the curve late and the loop reacts after the robot has drifted,
      and (b) a narrow sensor cluster (0.048 m span with 0.012 m sensors) that loses
      the tape on tight bends, which causes the line-loss events. The high oscillation
      with kd = 0.5 also suggests that derivative action amplifies sensor noise, so
      I am bringing kd back down.


      Changes: (1) Move the sensors forward to y = 0.07 so the line is read earlier,
      which gives the loop more time to react. (2) Widen the array to x = -0.03 to
      +0.03 with 0.015 m spacing, so the outer sensors keep the tape in view on bends
      and line loss is less likely. (3) Lower kp from 1.5 to 1.2 and kd from 0.5 to
      0.4 to reduce jitter. (4) Keep ki at 0.05. (5) Lower base_speed from 1.5 to
      1.3 so the robot has more time to correct at bends and stays on the tape. The
      trade-off is a slower lap, which I accept because surviving the course is worth
      more than finish time right now. Wheel geometry, mass and body are unchanged,
      since body_width 0.18 would only raise the off-track limit to 0.0575, which
      gains nothing.


      Expected result: max_error below 0.06, fewer line-loss events (target 0 to 1),
      lower steering_oscillation, and progress above 0.3, with a first chance at completion
      on the oval and s-bend. The slalom may still be the hardest track. The next
      telemetry should show whether the forward sensor placement reduced max_error
      and whether the lower base_speed kept the robot on the line.


      - [Open this output](iteration-3/entity0/versions/1ec092c87fd74e64a1d62f50815a7949/payload.json)

      - Based on: [entityR2A](iteration-3/entityR2A/versions/carried-eccca8e394ebff97/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Critiques the forward-sensor, wider-array, lower-kp and lower-speed draft.
      Main points: the draft''s own kp evidence (max_error flat across kp 3.0 to 1.5)
      does not support its max_error prediction, and cutting base_speed conflicts
      with the goal of finishing in 3 s. Based on the iteration 1 and 2 race telemetry.


      - [Open this output](iteration-3/entityC1/versions/31739a4955d8471db5d0c9c335a60229/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/1ec092c87fd74e64a1d62f50815a7949/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-eccca8e394ebff97/payload.json)'
  - id: entity1
    label: Sensing-only revision
    notes: 'Keeps the iteration 2 controller (kp 2.0, kd 0.25, base 1.5) and changes
      only sensing: sensors moved to y 0.06 and widened to a 0.048 m span at 0.012
      m spacing. This isolates whether sensor placement reduces max_error below the
      0.06 m off-track limit, following the critique''s call to avoid confounded changes.


      ### Rationale


      Evidence: the only raced telemetry for the current baseline is iteration 2 (kp
      2.0, ki 0.05, kd 0.25, base 1.5, sensors at y 0.05 with x from -0.02 to 0.02).
      All 60 trials went off_track with zero finishes. Score rose from 59.3 to 64.1
      when kp fell from 3.0 to 2.0 and kd rose, but max_error stayed at 0.063 to 0.066,
      just past the 0.06 m limit (the limit is max(0.06, 0.0125 + body_width/4), which
      is 0.06 for every allowed body width). Oscillation is 0.11 to 0.16 and line-loss
      events are 1 to 2 per run.


      Critique points accepted: (a) The draft changed five things at once, so its
      result could not be attributed. I now make one controller-free change: I return
      to the iteration 2 controller exactly (kp 2.0, ki 0.05, kd 0.25, base_speed
      1.5) and change only the sensing, so the next race isolates whether sensor placement
      moves max_error. (b) Cutting base_speed to 1.3 would lower the average speed
      needed for completion, which the critique rightly flags as contradictory, so
      base_speed stays at 1.5. (c) The 0.015 m spacing left 3 mm gaps between 12 mm
      footprints. I use 0.012 m spacing, so adjacent footprints abut and the signal
      has no dead zones. (d) ki = 0.05 is nearly inert, so I keep it unchanged and
      credit it with no effect. (e) The lower kp of 1.2 extrapolated from the draft
      is not supported by the data, which shows only a small max_error change for
      a large kp change, so I do not adopt it.


      Critique points partly rejected: the forward move is retained as a test of the
      sensor-lag hypothesis, but I place the sensors at y = 0.06, not 0.07. This gives
      about 1 cm more look-ahead than the iteration 2 layout while limiting the overshoot
      risk the critique raised on tight bends. The span widens from 0.04 m to 0.048
      m (x = -0.024 to +0.024), which keeps the outer sensors on the tape at larger
      errors without adding gaps.


      Changes from iteration 2: sensor y 0.05 to 0.06; sensor x span 0.04 m to 0.048
      m at 0.012 m spacing. Controller and wheel geometry are unchanged.


      Expected result: max_error below 0.06 on at least the oval, with line_loss_events
      at 0 to 1 and steering_oscillation at or below 0.11. Success threshold: any
      finish, or progress above 0.25 on all three tracks. If max_error does not fall,
      the next step is to test kp 1.7 with this sensor layout held fixed, rather than
      changing sensing again.


      - [Open this output](iteration-3/entity1/versions/6c4cc3ab8b744a2796284c131c3443ee/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/1ec092c87fd74e64a1d62f50815a7949/payload.json),
      [entityC1](iteration-3/entityC1/versions/31739a4955d8471db5d0c9c335a60229/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-eccca8e394ebff97/payload.json)'
  - id: entityC2
    label: Round-2 critique
    notes: 'Critiques the sensor-only revision (controller held at iteration 2, sensors
      moved to y 0.06 m and widened to 0.048 m). Argues the forward move adds negligible
      look-ahead, that the fallback kp 1.7 contradicts the flat kp-to-max_error data,
      and that the first departure point is never located.


      - [Open this output](iteration-3/entityC2/versions/2b293c6bf4564db8beb2551f6fd659f8/payload.json)

      - Based on: [entity1](iteration-3/entity1/versions/6c4cc3ab8b744a2796284c131c3443ee/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-eccca8e394ebff97/payload.json)'
  - id: entity2
    label: Forward sensor probe
    notes: 'Controller returned to iteration 2 exactly; only sensing changes, moving
      the array to y 0.06 m and widening x to ±0.024 m at 0.012 m spacing. Kept the
      controller and base_speed because the critique''s point that kp barely moves
      max_error is supported by the race data, and the expected effect of the sensing
      change is small.


      ### Rationale


      Evidence: iteration 2 (kp 2.0, ki 0.05, kd 0.15, base_speed 1.5, sensors at
      y 0.05 with x from -0.02 to 0.02 m) left all 60 trials off-track with zero finishes.
      Max_error was 0.063 to 0.066, just past the 0.06 m limit on every track. Progress
      was 0.12 to 0.19, so departures happen in the first metre or so. Line-loss events
      were 1 to 2 per run and steering_oscillation was 0.11 to 0.16. The telemetry
      is aggregated, so it does not show where the first departure happens.


      Critique of the revision (entityC2) and what I kept: I accept that a 1 cm forward
      move gives only about 7 ms of extra look-ahead at 1.5 m/s, so I do not expect
      a large max_error change from sensing alone. I accept that kp has barely moved
      max_error across iterations 1 and 2 (oval 0.0612 to 0.0633, s-bend 0.0663 to
      0.0662), so kp 1.7 is not my next step on the strength of that evidence. I accept
      that the rationale did not quantify the sensor lag or say what result would
      make the isolation worth an iteration. I also accept that ''steering_oscillation
      at or below 0.11'' cannot discriminate, because it equals the iteration 2 baseline.


      What I kept: the controller is returned exactly to iteration 2 (kp 2.0, ki 0.05,
      kd 0.15, base_speed 1.5, last_direction line loss), so this race isolates the
      sensing change. base_speed stays at 1.5 because lowering it would risk missing
      the 3 s limit, and the critique''s contradiction point is correct. The 0.012
      m spacing is kept so that adjacent footprints abut with no dead zones.


      What I changed from the critique''s suggested path: I keep the forward move
      to y 0.06 and the x span of -0.024 to 0.024 m as a probe of sensor lag, and
      I state the limit of that probe. Its expected effect is small (max_error maybe
      a few mm at most), so a null result is informative: it would confirm that sensing
      lead is not the cause of departures. I do not commit to kp 1.7 as the fallback.
      If max_error does not fall, the next iteration will change the failure-mode
      lever, not the same gain, and I will decide which lever once the first-departure
      timing is known.


      Risk on speed: no run has finished, so completion (500 points) remains untested.
      I will not raise or lower base_speed on this race alone. If completion_time
      is reported above 3 s with progress well below 1 and few line-loss events, base_speed
      becomes the first suspect and I will test it in steps of 0.1.


      Expected result: max_error on the oval moves toward 0.06 or below, with a small
      or zero change in line-loss events. Success threshold: any finish, or progress
      above 0.25 on all three tracks. I accept that a null result on max_error is
      the most likely outcome, and that it still tells the next iteration that sensing
      lead is not the main problem.


      - [Open this output](iteration-3/entity2/versions/0bfd14b3c3f94c04ab813a1c63000d78/payload.json)

      - Based on: [entity1](iteration-3/entity1/versions/6c4cc3ab8b744a2796284c131c3443ee/payload.json),
      [entityC2](iteration-3/entityC2/versions/2b293c6bf4564db8beb2551f6fd659f8/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-eccca8e394ebff97/payload.json)'
