map:
  id: race-209-opt-eval-pre2
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Iter 7 geometry, kd 0.8
    notes: 'Keeps the verified best geometry from iteration 7 (score 344.5) and changes
      only kd from 0.6 to 0.8 to damp s-bend and slalom oscillation. Iteration 8''s
      identical scores suggest its changes may not have raced, so they are not used
      as evidence.


      ### Rationale


      Evidence: Iteration 7 (344.5) is the best design so far, with 17 of 20 oval
      finishes and mean progress 0.95. Its s-bend and slalom runs still end off-track
      (progress 0.34 and 0.11), with 1.15 and 1.25 line-loss events and steering oscillation
      of 0.22 and 0.14. Iteration 8 scored exactly the same as iteration 7 to four
      decimals on every track, although its geometry (mass 0.5, wheel_track 0.09)
      and kd (0.8) differed. Iteration 6 showed the same pattern against iteration
      5. I therefore cannot tell whether iteration 8''s changes reached the simulator,
      so I am not treating them as evidence. The only verified gain is the iteration-7
      plant change (lower body_length and mass, narrower wheel_track, sensors at y=0.06).


      Decision: Keep the verified iteration-7 geometry exactly (sensors 8 mm at x=-0.016
      to +0.016, y=0.06; wheel_track 0.10; wheel_radius 0.03; body 0.12 x 0.12; mass
      0.6). Keep kp 2.0, ki 0.1 and base_speed 1.3, which are unchanged from the best
      run. The one controller change is kd from 0.6 to 0.8, a small damping increase
      aimed at the s-bend and slalom oscillation (0.22 and 0.14). It is a low-risk
      step, because the oval finish is driven by the speed and geometry that are kept
      fixed. Expected result: oval completion rate at or near 0.85, s-bend and slalom
      oscillation slightly lower, and a score close to or above 344. If the result
      matches iteration 8 exactly again, that will confirm the simulator is not responding
      to some of my changes, and the next iteration should check that.


      - [Open this output](iteration-9/entity0/versions/9a4c1a48f4f0426fa699a1b49c5b6275/payload.json)

      - Based on: [entityR2A](iteration-9/entityR2A/versions/carried-deb90022f1143262/payload.json)'
  - id: entityC1
    label: Round-1 Critique
    notes: 'Round-1 Critique. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      - [Open this output](iteration-9/entityC1/versions/c82b7e06627d47e4bfd0bb0e20222685/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/9a4c1a48f4f0426fa699a1b49c5b6275/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-deb90022f1143262/payload.json)'
  - id: entity1
    label: Verified best, reverted
    notes: 'Reverts to the raced iteration-7 design (score 344.5, 17/20 oval finishes)
      and rejects the draft''s unverified plant change and dropped ki 0.5 and search_left.
      kd is set to the raced 0.25, since kd 0.25 and 0.4 gave identical results.


      ### Rationale


      Evidence: Iteration 7 raced the only design that reached 344.5. Its geometry
      was body_length 0.18, body_width 0.12, mass 0.8, wheel_track 0.12, wheel_radius
      0.03, and five 12 mm sensors at x = -0.02 to +0.02 m, y = 0.05 m. Its controller
      was kp 2.0, ki 0.5, kd 0.25, base_speed 1.5, line_loss ''search_left''. It finished
      17 of 20 oval runs (mean progress 0.95, mean finish time 1.86 s). Iteration
      8 changed only kd (0.25 to 0.4) and returned identical metrics to four decimals
      on all 60 trials, so kd in this range shows no measurable effect.


      Correction to the draft: the draft''s rationale treats the iteration-7 plant
      change (body_length 0.12, mass 0.6, wheel_track 0.10, 8 mm sensors at y = 0.06)
      as verified. It was not. That geometry appeared only in a candidate that was
      never raced. The draft also dropped the two controller settings that produced
      the gain (ki 0.5 and line_loss ''search_left'') and reverted to ki 0.1 and ''last_direction''.
      Its expected result therefore rests on an unverified plant and a controller
      that has not raced in the best configuration. I reject the draft.


      What I kept: the verified iteration-7 design exactly, including its geometry,
      ki 0.5, line_loss ''search_left'', base_speed 1.5 and kp 2.0. I set kd to 0.25,
      the raced value, since 0.25 and 0.4 gave identical results.


      What I did not change: no new single-variable test. Iteration 8''s kd test was
      neutral, and the line_loss test that could address the s-bend and slalom would
      risk the oval gain that is the only proven result. With two iterations left
      after this one, the safer use of this race is to confirm that the verified best
      reproduces its score, which also checks whether the simulator is reproducible
      for this design.


      Expected result: score about 344.5, with oval completion near 0.85. The s-bend
      and slalom will still fail, with progress about 0.34 and 0.11. Success threshold:
      a score within about 1 point of 344.5. A deviation larger than that would indicate
      the race is not reproducible and would shift the next step toward robustness
      testing rather than new gains.


      - [Open this output](iteration-9/entity1/versions/9eeefaf27f6d462f8ebefd6fd5fa667f/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/9a4c1a48f4f0426fa699a1b49c5b6275/payload.json),
      [entityC1](iteration-9/entityC1/versions/c82b7e06627d47e4bfd0bb0e20222685/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-deb90022f1143262/payload.json)'
  - id: entityC2
    label: Round-2 Critique
    notes: 'Critiques the reverted iteration-7 design and its reproduction-check rationale.
      Evidence is the 60-trial race data for iterations 7 and 8, where kd 0.25 and
      0.4 gave identical metrics and the s-bend and slalom never finished.


      - [Open this output](iteration-9/entityC2/versions/0089386a6d5348afbe8197ad7eacb3d1/payload.json)

      - Based on: [entity1](iteration-9/entity1/versions/9eeefaf27f6d462f8ebefd6fd5fa667f/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-deb90022f1143262/payload.json)'
  - id: entity2
    label: Verified best
    notes: 'Resubmits the raced 344.4979 design exactly (kd 0.35, ki 0.5, line_loss
      last_direction), rejecting the unraced kd 0.25 / search_left variant. Iteration
      8 reproduced the score to four decimals, so the outcome table is the basis for
      this choice.


      ### Rationale


      Decision: resubmit the verified best design exactly as it raced in iteration
      7 and iteration 8 (score 344.4979). The round-2 critique and the authorized
      entity1 text describe a different configuration (kd 0.25, line_loss ''search_left'').
      I reject that configuration as the submission because the outcome record does
      not support it. Iteration 7''s design, as recorded in the outcome table and
      produced in my own history, was kd 0.35, ki 0.5, kp 2.0, base_speed 1.5, line_loss
      ''last_direction''. That is the only configuration with a measured score of
      344.4979, and iteration 8 reproduced it to four decimals on all 60 trials. The
      search_left and kd 0.25 variant has never raced, so it has no evidence behind
      it.


      What I kept: every value of the raced 344.5 design, including geometry (five
      12 mm sensors at x = -0.02 to +0.02 m, y = 0.05 m; body 0.18 x 0.12 m; mass
      0.8 kg; wheel_track 0.12 m; wheel_radius 0.03 m) and the controller (kp 2.0,
      ki 0.5, kd 0.35, base_speed 1.5, line_loss ''last_direction'', weights -2 to
      2).


      What I did not change: no new single-variable test. Critique points against
      kd 0.4 and against search_left are accepted as reasons not to advance them now.
      Points that the final track may differ from the oval are noted, but the s-bend
      and slalom failures have no tested fix that would not risk the only proven gain.


      Expected result: about 344.5 on the development set, with oval completion near
      0.85 (17 of 20), and s-bend and slalom still failing (progress about 0.34 and
      0.11). Reproducibility is already shown by iteration 8, so this race is a repeat
      check and adds little new information. The next iteration, if any single-variable
      test is run, should state its baseline as kd 0.35 / last_direction.


      - [Open this output](iteration-9/entity2/versions/a80339ff5ce24cb3af73937a904f09f0/payload.json)

      - Based on: [entity1](iteration-9/entity1/versions/9eeefaf27f6d462f8ebefd6fd5fa667f/payload.json),
