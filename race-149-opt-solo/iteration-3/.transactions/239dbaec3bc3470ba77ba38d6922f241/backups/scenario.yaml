  entities:
  - id: entity0
    label: Revert sensors, mass 0.5
    notes: 'Reverts the iteration 2 sensor and gain changes, which lowered the score
      from 294 to 214, and keeps the iteration 1 controller. The single new change
      is mass 0.6 to 0.5 kg to cut yaw inertia and reduce bend excursions. Evidence:
      max_error sits at the 0.06 m off-track limit on every track, and the 16 mm sensors
      doubled slalom line losses.


      ### Rationale


      Evidence from iteration 2 (score 214, down from 294 in iteration 1). Every failure
      is still off_track, with max_error near the 0.06 m limit, so the robot makes
      brief excursions at bends. Iteration 2 changed five things at once (kd 0.8 to
      0.5, kp 6.0 to 5.5, sensor_size 0.012 to 0.016, span +/-0.02 to +/-0.025, y
      0.05 to 0.06), and nearly every metric got worse or stayed flat. Oval finish
      rate fell from 0.30 to 0.15. S-bend progress fell from 0.71 to 0.50. Slalom
      line_loss_events rose from 1.0 to 2.0. Steering_oscillation did not fall (oval
      0.34 to 0.35, s-bend 0.37 to 0.32), so hypothesis (a), that kd drives jitter,
      is not supported. The lower kd and kp mainly reduced steering authority. The
      16 mm footprint and wider span look harmful: the larger footprints average more
      background and blur the signal at bends, and the slalom line losses doubled.
      Decision: revert to the iteration 1 sensor and controller set, which had the
      best score, and make one controlled change. Sensors return to 12 mm, span +/-0.02
      m, y 0.05, with kp 6.0, kd 0.8, ki 0.02 and base_speed 1.25. The one change
      is mass 0.6 to 0.5 kg. Lower mass reduces yaw inertia (mass * (L^2+W^2)/12),
      so the robot should correct lateral error faster at bends, which targets the
      max_error excursions. I am keeping the mass drop moderate because the outcome
      table shows that mass-related changes are hard to separate from controller effects.
      Expected result: max_error reduced toward 0.05 and oval finish rate back to
      0.3 or better, with s-bend progress above 0.7. Hypotheses: (1) lower yaw inertia
      cuts max_error at bends without raising steering_oscillation; (2) if slalom
      line_loss_events stay at 1 or more, the sharp direction changes need lower speed
      on entry, so base_speed should be tested near 1.0 next; (3) if steering_oscillation
      stays above 0.3, kd 0.8 is adding noise and should be stepped to about 0.65
      in a later iteration. Measurements wanted: completion, progress, completion_time,
      max_error, rms_error, line_loss_events and steering_oscillation on each track,
      plus control_effort and noise_robustness to see whether the response is limited
      by noise.


