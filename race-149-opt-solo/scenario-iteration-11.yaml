  - id: entity0
    label: kd 1.4 on iter-10 base
    notes: 'Single change from iteration 10: kd raised from 1.2 to 1.4, because slalom
      progress rose at each kd step (0.36, 0.49, 0.62) while oval and s-bend stayed
      at full completion. Geometry, speed, kp, ki and line-loss handling are unchanged,
      so the effect is attributable to kd.


      ### Rationale


      Evidence from iteration 10 (score 711.0, best so far). The oval (20/20 finishes,
      max_error 0.009) and s-bend (20/20, max_error 0.018) are reliable. The slalom
      still finishes 0/20, but progress has risen in each kd step: 0.36 at kd 0.8,
      0.49 at kd 1.0, and 0.62 at kd 1.2. Slalom line losses are 1.75 at kd 1.2, down
      from 2.25 at kd 1.0. Oval steering_oscillation fell from 0.234 to 0.269 over
      the same step, and the s-bend value dropped slightly, so derivative noise is
      not yet the limit. Control effort on the oval and s-bend also fell with kd.
      The slalom is the only failing track, and it is limited by damping at sharp
      bend entry. This is the last iteration, so the goal is the most robust design
      for an unseen track, not a further test. Decision: keep the iteration 10 geometry
      and all other controller values, and make one step, kd 1.2 to 1.4, to continue
      the trend that has moved the slalom forward without hurting the tracks that
      finish. Expected result: slalom progress about 0.7 to 0.8 with line losses near
      1.5, and oval and s-bend completion held at or near 1.0. The risk is that derivative
      noise starts to hurt the oval (oscillation above about 0.3). If that happens,
      kd 1.2 would be the safer choice, but this design cannot be revised after the
      race. Hypotheses: (a) more kd continues to cut slalom line losses; (b) oval
      completion stays at 1.0 because the oscillation rise is small; (c) if oval completion
      falls below 0.9, the derivative gain has passed its useful range on this geometry.
      Measurements wanted: completion, progress, completion_time, max_error, rms_error,
      line_loss_events, steering_oscillation and control_effort on each track, plus
      noise_robustness to check whether the higher kd is amplifying sensor noise.


