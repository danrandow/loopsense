  entities:
  - id: entity0
    label: Slower entry for slalom
    notes: 'Keeps iteration 5 geometry and gains, and cuts base_speed from 1.10 to
      0.95 to reduce bend-entry speed on the slalom, which has 0 of 20 finishes and
      1.8 line losses per run. Speed cuts previously raised slalom progress and s-bend
      finishes, and the oval has time margin.


      ### Rationale


      Evidence from iteration 5 (score 657.5, best so far). Mass at 0.4 kg and base_speed
      1.1 lifted the oval finish rate to 0.90 and the s-bend to 1.00 (20 of 20). The
      slalom still finished 0 of 20, with progress 0.35, 1.8 line-loss events per
      run and max_error at the 0.06 m off-track limit. The slalom is the only track
      that fails, so the remaining work is sharp direction changes. Mass is already
      at its 0.4 kg minimum, so yaw inertia cannot be cut further. Off-track limit
      is max(0.06, 0.0125 + body_width/4), which stays at 0.06 for any body width
      in range, so body width does not help. Iteration 2 showed that a larger sensor
      footprint or wider span hurt, so sensor geometry stays unchanged. Changes: (1)
      base_speed 1.10 to 0.95. Each base_speed cut from 1.25 to 1.15 to 1.10 raised
      slalom progress (0.17 to 0.30 to 0.35), and the slalom is limited by bend-entry
      speed. Oval finish time should rise from about 2.2 s to about 2.6 s, still under
      the 3 s limit. The s-bend should also gain margin. Everything else (mass, sensors,
      kp 6.0, kd 0.8, ki 0.02, last_direction line loss) is held fixed, so the speed
      effect can be attributed. Expected result: slalom progress above 0.45 with fewer
      line losses (below 1.5 per run), and oval and s-bend completion kept at or above
      0.85. Hypotheses: (a) slalom excursions are entry-speed driven, so a further
      speed cut helps; (b) if oval completion falls below 0.8 or completion time exceeds
      2.8 s, speed is the binding constraint and the speed cut has gone too far; (c)
      if slalom line_loss_events stay at 1.5 or more with the speed cut, the 12 mm
      sensors are missing the tape on tight bends and a sensor-span test (about +/-0.025
      with 12 mm sensors, alone) is needed next. Measurements wanted: completion,
      progress, completion_time, max_error, rms_error, line_loss_events and steering_oscillation
      on each track, plus control_effort for steering load.


