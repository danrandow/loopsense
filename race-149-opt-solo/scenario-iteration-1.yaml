  entities:
  - id: entity0
    label: Slower, damped controller
    notes: 'Cut base_speed to 1.25 and raised kd to 0.8 and kp to 6.0, with lighter
      mass (0.6 kg) and sensors moved forward to y=0.05. Iteration 0 left the line
      in all 60 trials with max_error at the 0.06 m off-track limit, so the change
      targets bend excursions and jitter.


      ### Rationale


      Evidence from the development race (entityR2A, 60 trials, 0 finishes): every
      trial ended off_track on all three tracks. Progress was only 0.075 to 0.16,
      so the robot left the line early in each course. rms_error was small (about
      0.026 m), but max_error reached about 0.06 m, which is the off-track limit (max(0.06,
      0.0125 + 0.12/4) = 0.06 m). The failures are therefore brief excursions at the
      bends, not drift. Line_loss_events of 1 to 2 per run and steering_oscillation
      of about 0.14 both point to an aggressive loop: base_speed 1.6 is too fast for
      the bends, and kd 0.3 is too weak to damp the overshoot. Changes: (1) base_speed
      1.6 to 1.25 so the robot can corner inside the off-track limit. Speed is the
      main risk, and a finish needs only about 1.5 m/s average, so I accept a slower
      run for now. (2) kd 0.3 to 0.8 to damp the oscillation seen in steering_oscillation.
      (3) kp 5.0 to 6.0 to keep the robot tight on the line through the bends. The
      extra kp is partly offset by the lower speed, which reduces the lateral reaction
      needed. (4) ki 0.05 to 0.02 to reduce integral windup on the long bends. (5)
      Mass 0.8 to 0.6 kg to reduce yaw inertia, so the robot turns more quickly to
      correct errors. (6) Sensors moved from y=0.04 to y=0.05 to give slightly more
      lead before each bend. Expected result: no off-track events on the oval or s-bend,
      possibly completion on the oval; progress should rise well above 0.16. Hypotheses:
      (a) the off-track events are caused by speed at bends, so lower speed plus higher
      kd should cut max_error below 0.06; (b) if line_loss_events stay at 1 or more,
      the sensors are losing the tape at sharp bends and a wider sensor footprint
      or more forward sensors would help; (c) if steering_oscillation is still high,
      kd is still too low or kp too high. Measurements wanted next: completion, progress,
      completion_time, max_error and line_loss_events on each track, plus steering_oscillation
      to test whether the kd change damps the jitter.


