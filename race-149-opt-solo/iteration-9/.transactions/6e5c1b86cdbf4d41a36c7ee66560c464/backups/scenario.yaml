  entities:
  - id: entity0
    label: kd 1.0 single change
    notes: 'Keeps the iteration 8 geometry (12 mm sensors, span ±0.025 m, y 0.06,
      mass 0.4) and changes only kd from 0.8 to 1.0 to test whether more derivative
      damping cuts slalom line losses. Based on iteration 8''s 675 score, where oval
      and s-bend finished 20/20 and the slalom still failed with 1.8 line losses per
      run.


      ### Rationale


      Evidence from iteration 8 (score 675.4, best so far). The oval finished 20/20
      (max_error 0.014) and the s-bend 20/20 (max_error 0.022). The slalom still finished
      0/20: progress 0.36, 1.8 line-loss events per run, and max_error at the 0.064
      m off-track limit. So the remaining failure is excursion at the slalom''s sharp
      direction changes. Iteration 8 also made the s-bend finish rate recover to 1.00
      from 0.75 in iteration 7, which shows that y = 0.06 helps. The slalom is the
      only track that fails, and every earlier test that changed one geometry parameter
      (span, footprint, forward position) had side effects on the other tracks. Lowering
      base_speed (iteration 6) did not help the slalom. This iteration therefore changes
      one controller variable: kd from 0.8 to 1.0. The slalom''s line losses and off-track
      events come from the loop reacting too slowly at sharp turns, and extra derivative
      action should damp the swing as the robot enters a bend. Geometry, base_speed,
      kp, ki and line-loss handling are held at the iteration 8 values, so any change
      in slalom progress and line losses can be attributed to kd. Expected result:
      slalom line_loss_events below 1.5 and progress above 0.4, with oval and s-bend
      completion held at or near 1.0. Hypotheses: (a) the slalom limit is loop damping
      at bend entry, so kd 1.0 cuts its line losses; (b) if steering_oscillation on
      the oval rises above 0.3 and the oval finish rate falls, derivative noise is
      now the limit and kd should return to 0.8 or be tried at 0.9; (c) if slalom
      line losses stay near 1.8, the limit is kp or sensor span, and the next test
      should widen the span to about 0.03 m alone. Measurements wanted next: completion,
      progress, completion_time, max_error, rms_error, line_loss_events and steering_oscillation
      on each track, plus control_effort to check steering load.


