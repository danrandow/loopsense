  entities:
  - id: entity0
    label: Lighter, slower corners
    notes: 'Mass cut from 0.5 to 0.45 kg to keep reducing yaw inertia, which lifted
      oval finishes from 0.30 to 0.75 in iteration 3. base_speed lowered from 1.25
      to 1.15 to cut bend-entry speed, since the slalom leaves the track early with
      2 line losses per run. Sensors and gains are unchanged.


      ### Rationale


      Evidence from iteration 3 (score 395.7, the best so far). Reducing mass from
      0.6 to 0.5 kg raised the oval finish rate from 0.30 to 0.75 and cut oval max_error
      from about 0.055 to 0.035 m. That supports the hypothesis that lower yaw inertia
      helps the robot correct errors at bends. Failures are still off_track. The s-bend
      finishes 1 of 20 and the slalom 0 of 20, with progress only 0.20 and 2 line-loss
      events per run. Max_error still reaches the 0.06 m limit on the slalom, so the
      failures are excursions at sharp direction changes, not drift. Oval finish time
      is about 2.1 s, so there is speed margin for the oval but little for the slalom.
      Changes: (1) mass 0.5 to 0.45 kg, continuing the direction that clearly helped
      (yaw inertia falls by about 10 percent). (2) base_speed 1.25 to 1.15, to reduce
      lateral demand and bend-entry speed on tight sections, mainly the slalom. The
      oval will slow by roughly 8 percent (about 2.3 s, still under 3 s). Sensors,
      kp, kd, ki and line_loss are kept, because iteration 2 showed that changing
      sensor footprint or span made things worse. Expected result: oval finish rate
      of 0.75 or better, slalom progress above 0.3, and s-bend finishes rising. Hypotheses:
      (a) the slalom failure comes from entry speed, so a lower base_speed should
      cut its off_track events; (b) mass keeps helping, so yaw inertia is still a
      limit; (c) if slalom line_loss_events stay at 2, the 12 mm sensors are missing
      the tape at sharp bends, and a sensor-geometry test is needed next. Measurements
      wanted next: completion, progress, completion_time, max_error, line_loss_events
      and steering_oscillation on each track, plus control_effort to check steering
      load.


