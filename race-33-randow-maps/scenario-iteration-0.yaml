  - id: entity0
    label: Baseline geometry
    notes: 'Proposed a balanced, moderate-size 5-sensor layout and body dimensions
      to provide a solid baseline for line following and stable control, requesting
      key performance metrics to evaluate line detection and stability.


      ### Rationale


      Starting from scratch with no prior geometry or integration feedback, I propose
      a balanced, conservative sensor and body layout to maximize line detection and
      stable control. I choose 5 sensors spaced evenly across the front, covering
      left to right, to detect the tape line effectively, with a moderate sensor size
      of 0.012 m to balance resolution and coverage. The wheel track is set to 0.12
      m, a middle value for stability and maneuverability, with a wheel radius of
      0.03 m for moderate speed and torque. The body width is 0.12 m, matching the
      wheel track for compactness and off-track tolerance, and the body length is
      0.18 m to provide enough space for components without excessive size. Mass is
      set to 0.8 kg, a moderate value to balance inertia and agility. The intent is
      to provide a solid baseline geometry that the integrator can build a controller
      on, expecting reasonable line detection and stable driving. Hypotheses include
      that 5 sensors with moderate size will detect the line well without excessive
      noise, and that the chosen dimensions will allow stable, responsive driving.
      I request measurements of completion, progress, line_loss_events, rms_error,
      and max_error to evaluate line following success, stability, and off-track events.


      - [Open this output](iteration-0/entity0/versions/e21a469c1ee84878bd2afd05130dabbc/payload.json)'
  - id: entity1
    label: Baseline geometry with
    notes: 'Created a PID controller tuned for the baseline geometry with moderate
      speed and balanced sensor weights. Observation request matches builder''s to
      measure key performance metrics.


      ### Rationale


      Starting from the baseline geometry with 5 evenly spaced sensors of moderate
      size and balanced body and wheel dimensions, I designed a PID controller to
      provide stable line following. The sensor weights are set to create a gradient
      from left to right sensors, steering the robot left or right based on line position.
      Gains (kp, ki, kd) are tuned conservatively to avoid oscillations while maintaining
      responsiveness. The base speed is moderate to balance speed and control. The
      line loss behavior is set to ''search_left'' to steer right when the line is
      lost, a common recovery strategy. The observation request matches the builder''s
      request to measure completion, progress, line loss events, rms error, and max
      error, enabling detailed performance analysis. This controller should provide
      a stable baseline for the given geometry, allowing the integrator to observe
      how well the geometry supports line detection and control.


      - [Open this output](iteration-0/entity1/versions/4580351636fe4cd1afad2a9827d8c273/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/e21a469c1ee84878bd2afd05130dabbc/payload.json)'
  - id: entityR1
    label: Initial integration
    notes: 'Provided feedback based on typical control challenges for this geometry.
      Suggested sensor size increase, adding a forward sensor, and wider wheel track
      depending on race outcomes.


      ### Feedback


      With no prior race data for this geometry, the feedback is based on typical
      control challenges and compensations needed for this sensor layout and robot
      size. If the next race shows frequent line loss events, consider increasing
      sensor size or adding sensors to improve line detection. If the robot oscillates
      or has high rms error, reduce kp or adjust sensor weights for smoother steering.
      If progress is low or the robot stalls, consider increasing base speed or adjusting
      wheel track for better maneuverability. These changes are based on common issues
      observed in earlier races with similar sensor counts and robot dimensions.


      ### Requested changes


      - sensor_size: 0.016 (larger sensors improve line detection, reducing line loss
      events)

      - sensor_positions: add one sensor near center front (y=0.06) to improve forward
      line sensing

      - wheel_track: 0.14 (wider track may improve stability and reduce oscillations)


      - [Open this output](iteration-0/entityR1/versions/4580351636fe4cd1afad2a9827d8c273/payload.json)

      - Based on: [entity0](iteration-0/entity0/versions/e21a469c1ee84878bd2afd05130dabbc/payload.json)'
