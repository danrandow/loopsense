map:
  id: race-202-randow-maps-muted
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: 'Final: best geometry kept'
    notes: 'Delivers the iteration 7 geometry unchanged (score 73.33, best measured):
      80 mm lookahead, 12 mm sensors, 0.12 m track, 0.03 m wheels, 1.0 kg. Held because
      it is the final iteration and every single-variable tweak tested so far has
      been neutral or worse.


      ### Rationale


      Scores by iteration: the 80 mm sensor row at 0.12 m track, 0.8 kg, 0.03 m wheels
      and 12 mm sensors gave 69.18. Raising mass to 1.0 kg gave 73.33 (iteration 7),
      the best score so far. Mass 1.2 kg fell to 60.14 (iteration 8), so mass has
      turned over near 1.0 kg. Wheel radius 0.035 m fell to 64.78 (iteration 9), and
      0.025 m gave 72.71 (iteration 10). That puts the radius optimum at or near 0.03
      m, with 0.025 m only slightly worse. Lookahead (40, 60, 80 mm), track (0.10,
      0.12, 0.14 m) and mass have each been tested one at a time, and the best value
      of each sits at or near the current design. Every run ends off track with max_error
      of 0.060 to 0.066 m, just above the 0.06 m limit, while rms_error stays at 0.02
      to 0.03 m. The failure is a transient peak on bends. Body width cannot move
      the limit, so it stays at 0.12 m. The sensor size and pitch effects are still
      unisolated (iteration 1 confounded them with mass and track). This is the final
      iteration, and the unseen-track race is scored, so I am not spending the race
      on an untested change. I am delivering the best measured geometry (iteration
      7) unchanged. Any further change would be a gamble with no evidence and no iteration
      left to recover from it.


      - [Open this output](iteration-11/entity0/versions/4c99c6c5e25e4012a4ade1914e87a225/payload.json)

      - Based on: [entityR2A](iteration-11/entityR2A/versions/carried-2f11195ca4f3dbd3/payload.json)'
  - id: entity1
    label: 'Final: best measured'
    notes: 'The iteration 7 geometry and controller, unchanged, so the unseen-track
      race reproduces the best measured design (73.33). Gain changes were left untested
      because they would be unmeasured guesses in a single scored race.


      ### Rationale


      This is the final iteration, so there is no later race to learn from. The Builder''s
      geometry is the best measured design (iteration 7, score 73.33): 80 mm sensor
      row, 12 mm sensors on a 12 mm pitch, 0.12 m track, 0.03 m wheels, 1.0 kg, 0.12
      m body width and 0.18 m body length. The controller that raced with it in iteration
      7 was kp 0.8, kd 0.15, ki 0, base_speed 1.5, last_direction line loss and weights
      [-2,-1,0,1,2]. I keep that controller unchanged. The gain changes I could make
      (kp, kd) were never tested on this geometry. Iteration 4 showed that changing
      effective turn gain without a matching kp cut s-bend progress from 0.156 to
      0.081, and iteration 9 showed the same sensitivity for wheel radius. Every change
      I could make is therefore a guess on an unseen-track race that is scored once.
      The measured design is the lowest-risk option. Every run on this geometry ends
      off track with max_error of 0.060 to 0.066 m, so the limit is still breached
      on bends. I do not claim this will fix that. The sensor row is already at the
      0.08 m contract maximum, which the Builder''s own tests show is the best lookahead.
      The geometry is deliberately unchanged from the Builder''s proposal, with the
      same controller as iteration 7, so the result is directly comparable with 73.33.


      - [Open this output](iteration-11/entity1/versions/b4b036f7229f44aea7e227e1c7c8cbcd/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/4c99c6c5e25e4012a4ade1914e87a225/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-2f11195ca4f3dbd3/payload.json)'
  - id: entityR1
    label: Final feedback, no
    notes: 'Feedback for the record, written before the race, listing three single-variable
      tests (16 mm sensors, 0.025 m wheels with kp 0.96, 1.1 kg mass) tied to the
      iteration 7 to 10 evidence. No outcome is claimed for this candidate.


      ### Feedback


      Written before this candidate has raced, so no result is stated for it. What
      I had to do in the controller: nothing beyond the iteration 7 gains (kp 0.8,
      kd 0.15, ki 0, base_speed 1.5, last_direction). I kept them because iteration
      7 is the only measured controller for this geometry, and every gain change I
      could make on this geometry is untested. Evidence: iteration 7 (80 mm row, 0.12
      m track, 0.03 m wheels, 1.0 kg) scored 73.33, the best so far. Mass 1.2 kg (iteration
      8) fell to 60.14, and wheel radius 0.035 m (iteration 9, with kp 0.7) fell to
      64.78, so those levers have turned over near the current values. Iteration 10
      (0.025 m wheels, kp 0.96) scored 72.71, close to iteration 7, which suggests
      the radius-to-gain match is roughly neutral in that direction. Max error sat
      at 0.060 to 0.067 m on every track while RMS stayed at 0.019 to 0.036 m, so
      the peak is a bend transient. Decision rules for the next race (no further iteration
      will follow, so these are for the record): if the race reports line_loss_events
      of 2 on the slalom, the 12 mm footprint is losing the line and a 16 mm sensor
      would be the next test. If max_error on the unseen track stays above 0.06 m
      with steering_oscillation near 0.17, the peak is bend overshoot, and a kd change
      (about 0.18) would be the next test. If the race finishes with progress well
      below 0.5, the speed limit is the issue, and wheel_radius 0.025 m with kp 0.96
      is the next test.


      ### Requested changes


      - Test sensor_size 0.016 m on the 80 mm row with everything else unchanged.
      The slalom shows 2.0 line-loss events in iterations 0, 3 to 7 and 9 to 10, and
      a larger footprint keeps readings above the 0.05 line-loss threshold for longer.
      Iteration 1 changed sensor size with other variables, so this is not yet proven.

      - Test wheel_radius 0.025 m with kp 0.96 and everything else unchanged. Iteration
      10 scored 72.71 against 73.33, and the bend-versus-straight trade-off is still
      open. Iteration 9 (0.035 m) raised oval progress from 0.227 to 0.273 but cut
      s-bend progress from 0.194 to 0.078.

      - Test mass 1.1 kg with everything else unchanged. Mass peaked near 1.0 kg (0.6
      kg gave 55.4, 1.0 kg gave 73.3, 1.2 kg gave 60.1), so 1.1 kg is a narrow test
      of whether the optimum sits slightly above 1.0 kg.


      - [Open this output](iteration-11/entityR1/versions/b4b036f7229f44aea7e227e1c7c8cbcd/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/4c99c6c5e25e4012a4ade1914e87a225/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-2f11195ca4f3dbd3/payload.json)'
