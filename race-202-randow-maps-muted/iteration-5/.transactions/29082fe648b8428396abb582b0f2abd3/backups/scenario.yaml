map:
  id: race-202-randow-maps-muted
  schema: v0.2
  scenario: Iteration 5
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 4.
dimensions:
  time_horizon: prepared
  iteration: '5'
overrides:
  entities:
  - id: entity0
    label: Wider track 0.14 m test
    notes: 'Changes only wheel_track from 0.12 m to 0.14 m on the best design so far
      (iteration 3, score 69.18), since the 0.10 m track cost about 16 points in iteration
      4. Rests on the track trend across iterations 1, 3 and 4 and the s-bend progress
      drop (0.156 to 0.081) at the narrow track.


      ### Rationale


      Scores by iteration: 0 (60 mm row, 0.12 m track) 65.96; 2 (40 mm row) 52.25;
      3 (80 mm row) 69.18, the best so far; 4 (80 mm row, 0.10 m track) 53.14. Iteration
      1 changed four variables at once and also used a 0.10 m track, and it scored
      53.33. Two separate runs with the 0.10 m track both fell by about 16 points
      relative to the 0.12 m baseline, so narrowing the track is the strongest evidence
      so far. The authorized iteration 4 result shows the damage was concentrated
      on the s-bend (progress 0.156 to 0.081) and the slalom, with the oval less affected
      (progress 0.229 to 0.183). Steering oscillation on the s-bend also fell (0.148
      to 0.067), so the narrow track looks sluggish or under-damped on the bends rather
      than oscillatory. Max error stays at 0.060 to 0.065 m on every track in every
      run, so the off-track limit is still the binding constraint. Lookahead is at
      its contract maximum (80 mm), so it cannot be pushed further. The next single-variable
      step is the other side of the track trend: widen wheel_track from 0.12 m to
      0.14 m (within the 0.18 m limit) and hold everything else at the iteration 3
      values. A wider track lowers turn rate per unit wheel difference, which should
      damp the bend response, reduce the sluggish-to-overshoot swing, and keep the
      robot straighter at speed. I expect progress to rise on the s-bend and slalom
      relative to 0.12 m, with max error approaching or dropping below 0.060 m, and
      a score above 69.18. The risk is that a wider track lowers turn authority on
      the tightest bend, so max error could rise instead, which would show as a drop
      in oval progress.


      - [Open this output](iteration-5/entity0/versions/04b1b14c9c8548c1b5fc5dedfee01396/payload.json)

      - Based on: [entityR2A](iteration-5/entityR2A/versions/carried-ca6a653f18b61f29/payload.json)'
  - id: entity1
    label: Narrow track, kp 0.7
    notes: 'Builds the Builder''s 0.10 m track at the 80 mm row with kp lowered from
      0.8 to 0.7 to offset the roughly 20 percent higher turn gain. Iteration 3 (69.18,
      best) gave max_error near 0.062 m, which this run aims to bring under 0.06 m.


      ### Rationale


      Iteration 3 (80 mm row, 0.12 m track, kp 0.8, kd 0.15) scored 69.18, the best
      so far. Max error sat at 0.062 to 0.067 m on all tracks while RMS stayed at
      0.019 to 0.033 m, so the failure is a transient peak at bends. The Builder''s
      proposal narrows wheel_track from 0.12 to 0.10 m, which by the contract''s turn-rate
      formula (vR - vL)/track raises the turn rate per unit PWM difference by about
      20 percent. The effective steering gain therefore rises by about the same amount.
      Iteration 1 showed that a narrower track with a lighter robot did not improve
      the score, but it changed mass, sensor size and pitch too, so it does not isolate
      the track effect. I keep the geometry exactly as proposed and scale the controller
      to the higher gain: kp falls from 0.8 to 0.7 (about 12 percent, a little less
      than the 20 percent gain rise, to avoid overcorrecting into oscillation). kd
      stays at 0.15 because iteration 3 showed no sign of excess jitter (steering_oscillation
      0.12 to 0.17), and it is the damping term that the Builder''s integrator question
      asks about. ki stays at 0 because no steady offset has been observed. base_speed
      stays at 1.5 and line_loss stays last_direction, both unchanged from the best
      run. Expected result, not yet measured: max_error near 0.06 m and a score above
      69. The main risk is extra oscillation on the s-bend and slalom if the effective
      gain still rises more than kp falls.


      - [Open this output](iteration-4/entity1/versions/372326f237f54757b89168c04ed6f848/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/c76c743f9d064802900ed410c442b7fe/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-067231237e393f0b/payload.json)'
  - id: entityR1
    label: Next-race decision rules
    notes: 'Gives conditional changes for the next race: wheel_radius for speed, mass
      for oscillation, and sensor_size for slalom line loss. Each is tied to iteration
      0 to 3 evidence, where progress stayed at 0.12 to 0.23 and slalom line loss
      was 2.0 events.


      ### Feedback


      Written before this candidate has raced, so no result is stated for it. What
      I had to do in the controller: the 0.10 m track raises turn rate per unit PWM
      difference by about 20 percent, so I cut kp from 0.8 to 0.7 and kept kd at 0.15,
      ki at 0 and base_speed at 1.5. I kept kd because iteration 3 (80 mm row, kp
      0.8, kd 0.15) had steering_oscillation of 0.12 to 0.17, which did not show excess
      jitter, and no steady offset appeared in any run (RMS 0.019 to 0.033 m). The
      controller was not changed to fix the 80 mm row, which scored best in iteration
      3 (69.18). Decision rules for the next race: if max_error falls to 0.06 m or
      below on the oval and s-bend while progress stays at or above 0.23 on the oval,
      keep the 0.10 m track and 80 mm row and try the first requested change. If max_error
      stays above 0.06 m but steering_oscillation is at or below the iteration 3 level
      of about 0.12 to 0.17, the peak is not jitter, so the sensor or wheel changes
      below are the next step. If steering_oscillation rises above about 0.17 on the
      s-bend or slalom, the narrower track has too much gain, so the next step is
      a controller kp change (for example 0.6), not another geometry change. Progress
      is the bigger problem: iterations 0 to 3 reached only 0.12 to 0.23 of the course,
      so the robot is far too slow or leaves the track early, and the speed levers
      should be considered if max_error is fixed.


      ### Requested changes


      - If the 0.10 m track with the 80 mm row gives max_error at or below 0.06 m
      and progress above 0.23, try wheel_radius 0.035 m next, because progress in
      iterations 0 to 3 (0.12 to 0.23) is far below the full course needed to finish
      in 3 s, and a larger wheel gives more ground speed at the same PWM.

      - If steering_oscillation rises above the iteration 3 level (about 0.12 to 0.17)
      on the s-bend or slalom with the narrower track, try mass 0.7 kg with everything
      else unchanged, because a slightly heavier body may add yaw damping; this is
      a hypothesis, since iteration 1 (0.6 kg) lowered oval oscillation to 0.074 but
      also lowered progress.

      - If line_loss_events on the slalom stay at 2.0 (iterations 0 and 3) with max_error
      still above 0.06 m, try sensor_size 0.016 m at the same 80 mm row as a single
      test, because a larger footprint keeps readings above the 0.05 line-loss threshold
      for longer; iteration 1 changed sensor size with other variables, so its effect
      is not yet proven.


      - [Open this output](iteration-4/entityR1/versions/372326f237f54757b89168c04ed6f848/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/c76c743f9d064802900ed410c442b7fe/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-067231237e393f0b/payload.json)'
