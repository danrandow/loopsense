map:
  id: race-202-randow-maps-muted
  schema: v0.2
  scenario: Iteration 7
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 6.
dimensions:
  time_horizon: prepared
  iteration: '7'
overrides:
  entities:
  - id: entity0
    label: Isolate mass at 0.6 kg
    notes: 'Keeps the best 80 mm, 0.12 m track baseline (69.18) and changes only mass
      to 0.6 kg to test lower yaw inertia on the peak max_error. Track and lookahead
      are settled by the iteration 0 to 5 series, so mass is the next untested lever.


      ### Rationale


      Scores by iteration, all with the same 0.8 kg, 0.03 m wheel and 12 mm sensor
      baseline unless noted: 60 mm row at 0.12 m track gave 65.96; 40 mm row gave
      52.25; 80 mm row gave 69.18 (best). Narrowing the track to 0.10 m dropped the
      80 mm design to 53.14. Widening it to 0.14 m dropped it to 60.26. Wheel track
      therefore peaks near 0.12 m, and lookahead is monotone up to the 0.08 m contract
      limit. In every run, max_error sits at 0.060 to 0.065 m, just above the 0.06
      m off-track limit, while rms_error stays at 0.02 to 0.03 m. The failure is a
      transient peak on bends, not a steady offset. Body width cannot change the limit,
      so the remaining levers are mass, sensor pitch, sensor size and wheel radius.


      Iteration 1 changed mass, track, sensor size and pitch together and scored 53.33.
      Its 0.10 m track now explains most of that drop, so the mass effect is still
      unknown. Mass has only been tested in combination, so I will isolate it. Iteration
      6 keeps the best geometry (80 mm row, 0.12 m track, 12 mm sensors on a 12 mm
      pitch, 0.03 m wheels, 0.12 m body width) and changes one thing: mass from 0.8
      to 0.6 kg. Lower mass reduces yaw inertia (mass times the sum of length squared
      and width squared, over 12), so the robot should correct a bend peak faster
      without changing the turn-rate-per-track geometry that the track series showed
      to be sensitive.


      Expected result: max_error falls to about 0.060 m or below, oval and slalom
      progress rise, and the score exceeds 69.18. Risk: lower mass could increase
      slip or make the robot less stable at speed, which would show as higher steering_oscillation
      or lower progress on the oval. If the score falls, the optimum mass is at or
      above 0.8 kg, and the next test is wheel_radius.


      - [Open this output](iteration-6/entity0/versions/2a8f02a82e184a82931a4c5ade27d038/payload.json)

      - Based on: [entityR2A](iteration-6/entityR2A/versions/carried-8abf01a0211a74ac/payload.json)'
  - id: entity1
    label: Mass 0.6 kg on best base
    notes: 'Isolated mass test on the iteration 3 baseline (69.18) with the controller
      unchanged. Track 0.10 and 0.14 m both scored lower (53.1 and 60.3), so the track
      stays at 0.12 m.


      ### Rationale


      Iteration 3 (80 mm row, 0.12 m track, 0.8 kg, kp 0.8, kd 0.15) is the best run
      at 69.18. Iterations 4 and 5 show the track optimum is near 0.12 m: 0.10 m scored
      53.14 and 0.14 m scored 60.26, both with gains retuned. Max error sits at 0.060
      to 0.067 m on every track while RMS stays at 0.019 to 0.033 m, so the limit
      is breached by bend transients. This candidate changes only mass, 0.8 to 0.6
      kg, as the Builder''s isolated test, and keeps the iteration 3 controller unchanged
      (kp 0.8, kd 0.15, ki 0, base_speed 1.5, last_direction, weights [-2,-1,0,1,2])
      so the result is comparable with 69.18. The lighter robot has less yaw inertia,
      so kd is not retuned before the race. If the score falls or steering oscillation
      rises, the next step is a controller kd change, not a geometry change.


      - [Open this output](iteration-6/entity1/versions/1d4021da2d724f8385a07a756a78965d/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/2a8f02a82e184a82931a4c5ade27d038/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-8abf01a0211a74ac/payload.json)'
  - id: entityR1
    label: Mass test feedback
    notes: 'Feedback written before the race. It cites the track series (0.10 m and
      0.14 m both worse) and the bend-transient max_error pattern, and gives decision
      rules for mass, wheel radius and sensor size.


      ### Feedback


      Written before this candidate has raced, so no result is stated for it. What
      I had to do in the controller: nothing beyond keeping the iteration 3 gains
      (kp 0.8, kd 0.15, ki 0), because this test changes only mass and the controller
      must stay fixed for the comparison. Evidence: iteration 3 (80 mm row, 0.12 m,
      0.8 kg) scored 69.18, the best so far. Iteration 4 (0.10 m track, kp 0.7) scored
      53.14 with s-bend progress falling from 0.156 to 0.081. Iteration 5 (0.14 m
      track, kp 0.93) scored 60.26, so the track optimum is near 0.12 m and that track
      stays fixed. Max error stays at 0.060 to 0.067 m on every track while RMS stays
      at 0.019 to 0.033 m, so the peak is a bend transient. Decision rules for the
      next race: if the score rises above 69.18 with max_error falling, keep 0.6 kg
      and move to the first requested change. If the score falls while steering_oscillation
      rises above about 0.17, the lighter robot is under-damped, so return to 0.8
      kg or try mass 0.7 kg. If the score falls with oscillation unchanged, mass is
      not the limit, so return to 0.8 kg and test wheel_radius.


      ### Requested changes


      - If 0.6 kg beats 69.18 with max_error falling, try wheel_radius 0.035 m with
      everything else unchanged. Iterations 3 to 5 reached only 0.12 to 0.23 of the
      course, so a larger wheel should give more ground speed at the same PWM (hypothesis
      from the progress shortfall).

      - If steering_oscillation rises above about 0.17 at 0.6 kg, try mass 0.7 kg
      alone. Iteration 1 (0.6 kg) lowered oval oscillation to 0.074 but also lowered
      progress, so 0.7 kg is a milder version of the same trade-off.

      - If line_loss_events on the slalom stay at 2.0 (iterations 0, 3, 4 and 5),
      try sensor_size 0.016 m on the 80 mm row as a single test. Iteration 1 changed
      sensor size together with other variables, so its effect is unproven.


      - [Open this output](iteration-6/entityR1/versions/1d4021da2d724f8385a07a756a78965d/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/2a8f02a82e184a82931a4c5ade27d038/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-8abf01a0211a74ac/payload.json)'
