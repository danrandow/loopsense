map:
  id: race-202-randow-maps-muted
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Sensor row to 80 mm ahead
    notes: 'Single-variable test: the sensor row moves from 60 mm to the 80 mm maximum,
      with all else at the iteration 0 baseline. Iteration 2 showed that shortening
      lookahead to 40 mm lowered the score from 65.96 to 52.25, so the trend points
      to longer lookahead.


      ### Rationale


      Iteration 2 moved the sensor row from 60 mm to 40 mm ahead of the axle, with
      everything else as in iteration 0. The score fell from 65.96 to 52.25. Oval
      progress dropped from 0.20 to 0.11, s-bend progress from 0.16 to 0.16 with more
      line loss, and max_error stayed at 0.06 to 0.065 on every track. Shorter lookahead
      therefore made things worse, which contradicts the lag hypothesis I had for
      iteration 2. The cleanest reading is that the controller benefits from seeing
      the line further ahead, so less lookahead means less anticipation and more overshoot.
      Iteration 1 also reduced oval progress when mass, track, sensor size and pitch
      changed together, so I will not combine changes again. The next single-variable
      step along the observed trend is to move the sensor row to the maximum allowed
      forward position, 80 mm ahead of the axle, and hold every other value at the
      iteration 0 baseline. I expect max_error to fall below or near the 0.06 m off-track
      limit, progress to rise on the oval and slalom, and the score to beat 66. The
      risk is that extra lag at the 80 mm limit cancels the benefit, which would show
      as higher steering oscillation.


      - [Open this output](iteration-3/entity0/versions/5369f44667f54e9a96ec77be88144760/payload.json)

      - Based on: [entityR2A](iteration-3/entityR2A/versions/carried-7895e61015883b3a/payload.json)'
  - id: entity1
    label: Sensor row 40 mm test
    notes: 'Iteration 0 chassis and 12 mm sensors with the sensor row moved from y
      = 0.06 m to 0.04 m, and controller gains held at iteration 0 values, so the
      race isolates the lag hypothesis. Based on iteration 0 max_error of 0.062 to
      0.066 m and iteration 1''s confounded result.


      ### Rationale


      The Builder''s intent is a single-variable test. Iteration 0 (0.8 kg, 0.12 m
      track, 0.03 m wheels, 12 mm sensors at 12 mm pitch, sensors at y = 0.06 m) scored
      65.96, the best so far. Every run in iterations 0 and 1 ended off track, and
      max_error sat at 0.062 to 0.066 m, just above the 0.06 m limit, while RMS stayed
      at 0.019 to 0.032 m. Iteration 1 changed four things at once and scored 53.33,
      so the Builder''s lag hypothesis is worth isolating. Iteration 0 also shows
      high control_effort on the s-bend (1.45) and slalom (1.36), and steering oscillation
      of 0.11 to 0.16 on every track. Because this test is meant to isolate the sensor
      row, I keep the controller structure from iteration 0 (kp 0.8, kd 0.15, ki 0,
      base_speed 1.5, last_direction, weights [-2,-1,0,1,2]). Moving the sensors to
      y = 0.04 m shortens the lookahead, so the same kd may now damp less of the signal.
      I have no race evidence on this, so I do not change gains now. Any change in
      the next race can then be attributed to the geometry. Expected outcome, unverified:
      lower max_error if sensing lag is the cause, and a result that can be compared
      directly with iteration 0.


      - [Open this output](iteration-2/entity1/versions/8d9f7e8d1a3c452e856e48ac62ccec21/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/7bab510f94ef445899655a7ec379b5e5/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-9fd6bf9162555dae/payload.json)'
  - id: entityR1
    label: Lag test and next-step
    notes: 'Feedback gives decision rules for the next race and three requested changes
      (wheel_track, sensor_size, wheel_radius). Each is tied to iteration 0 control_effort
      and progress, and iteration 1 results, and states no outcome for this candidate.


      ### Feedback


      What I had to do in the controller: I kept the iteration 0 gains (kp 0.8, kd
      0.15, ki 0, base_speed 1.5) rather than the iteration 1 gains (kp 0.6, kd 0.10),
      because iteration 1 changed the gains alongside the geometry and so could not
      be used to tune this isolated test. The iteration 0 race showed that the controller
      produced steering oscillation of 0.11 to 0.16 on all tracks and control_effort
      of 1.45 on the s-bend, so the geometry must be tested with the same gains to
      see whether the sensing lag or the gain is the limit. Iteration 1 showed that
      the lighter robot (0.6 kg, 0.10 m track) cut oval steering oscillation from
      0.115 to 0.074 but also cut oval progress from 0.20 to 0.11, so I cannot yet
      say whether mass or track drives either result. Decision rules for the next
      race: if max_error falls below 0.06 m on the s-bend and oval, keep y = 0.04
      m and move on to sensor pitch as the next isolated test. If max_error stays
      between 0.062 and 0.066 m but progress rises, the lag hypothesis is only partly
      right, so the next step is to raise kd in steps of about 0.03 with this sensor
      row, because a closer row will have less lead to damp overshoot. If progress
      falls below 0.16 with max_error unchanged, sensing is not the limit and the
      robot is too slow, so the next step is wheel_radius, not steering.


      ### Requested changes


      - If max_error stays above 0.06 m on the s-bend and oval with y = 0.04 m, try
      wheel_track 0.14 m with all else unchanged, because iteration 0 control_effort
      on the s-bend was 1.45 and slalom was 1.36, which suggests the robot needs more
      turn authority than a 0.12 m track gives.

      - If the race finishes with progress at or above 0.16 but max_error still exceeds
      0.06 m, try sensor_size 0.008 m at the same y = 0.04 m, because iteration 1
      (16 mm sensors) did not clearly help and a smaller footprint may sharpen the
      centre-of-line signal on tight bends (a hypothesis from iteration 1 data, not
      a measured result).

      - If progress falls below the iteration 0 level of about 0.16 while max_error
      is unchanged, try wheel_radius 0.035 m, because iteration 0 progress of 0.12
      to 0.20 is too low to finish within 3 s and a larger wheel gives more ground
      speed at the same PWM.


      - [Open this output](iteration-2/entityR1/versions/8d9f7e8d1a3c452e856e48ac62ccec21/payload.json)

      - Based on: [entity0](iteration-2/entity0/versions/7bab510f94ef445899655a7ec379b5e5/payload.json),
      [entityR2B](iteration-2/entityR2B/versions/carried-9fd6bf9162555dae/payload.json)'
