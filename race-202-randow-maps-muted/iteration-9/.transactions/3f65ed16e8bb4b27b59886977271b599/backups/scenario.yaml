map:
  id: race-202-randow-maps-muted
  schema: v0.2
  scenario: Iteration 9
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 8.
dimensions:
  time_horizon: prepared
  iteration: '9'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Evidence across iterations 0 to 8 (all on the 0.8 kg-ish, 0.12 m track, 0.03
      m wheel baseline unless noted):


      - Every run ends off track with max_error at 0.060 to 0.066 m, just over the
      0.06 m limit, while rms_error stays at 0.02 to 0.03 m. The failure is a transient
      peak on bends, not a steady offset. Body width cannot change the limit (it is
      pinned at 0.06 m across the allowed range), so body width is not a lever.

      - Lookahead is monotone (40 mm 52.3, 60 mm 66.0, 80 mm 69.2) and now sits at
      the 0.08 m contract maximum.

      - Track peaks at 0.12 m (0.10 m gave 53.1, 0.14 m gave 60.3).

      - Mass peaks near 1.0 kg. The latest result, 1.2 kg, scored 60.14, down from
      73.33 at 1.0 kg. The 0.6 kg, 0.8 kg and 1.0 kg points were 55.4, 69.2 and 73.3,
      so the curve has turned over. The best mass is about 1.0 kg, and I will hold
      it there.


      With lookahead, track and mass now at or near their best values, the untested
      single variable with a plausible path to fixing the bend peak is wheel_radius.
      I will keep the best design (80 mm row, 12 mm sensors on a 12 mm pitch, 0.12
      m track, 1.0 kg, 0.18 m body length, 0.12 m body width) and change only wheel_radius
      from 0.030 to 0.035 m. A larger radius raises ground speed for a given PWM,
      which should lift progress and help the robot cover the course in time. It also
      changes the radius-to-track ratio from 0.25 to 0.29. The track series suggests
      the turn response is sensitive to that ratio, so this is a real risk: the bend
      peak could get worse, not better. I am taking a moderate step rather than a
      large one so the effect stays readable.


      Expected result: oval and slalom progress at or above the 1.0 kg values (oval
      0.227, slalom 0.126), max_error near 0.060 m, and a score above 73.33. If the
      score falls, the ratio sensitivity dominates and the optimum wheel radius is
      at or below 0.03 m.


      - [Open this output](iteration-9/entity0/versions/d8fdf677f9544b9d84088a2adc3dcffa/payload.json)

      - Based on: [entityR2A](iteration-9/entityR2A/versions/carried-ff13c0f3a30c34d8/payload.json)'
  - id: entity1
    label: 1.2 kg mass test
    notes: 'Single-variable mass step from the 1.0 kg best (73.33) to 1.2 kg, with
      controller gains held fixed for a clean comparison. Mass gains are shrinking
      (+14, then +4), so the optimum may lie just above 1.0 kg.


      ### Rationale


      The Builder''s proposal is a single-variable mass test on the best design so
      far (iteration 7, 1.0 kg, score 73.33). Mass has risen monotonically: 0.6 kg
      gave 55.45 (iteration 6), 0.8 kg gave 69.18 (iteration 3) and 1.0 kg gave 73.33
      (iteration 7). The gain per 0.2 kg is shrinking (+14, then +4), so 1.2 kg is
      a fair test of whether the optimum lies above 1.0 kg. Geometry follows the proposal
      exactly: 80 mm sensor row (the contract maximum, which was monotone best), 12
      mm sensors on a 12 mm pitch, 0.12 m track (0.10 and 0.14 m both scored worse),
      0.03 m wheels, 0.12 m body width, 0.18 m body length, and mass 1.2 kg. Controller:
      I keep the iteration 7 gains (kp 0.8, kd 0.15, ki 0, base_speed 1.5, last_direction,
      weights [-2,-1,0,1,2]). The heavier robot has about 20 percent more yaw inertia
      than at 1.0 kg, so kd could need to rise, but no race has tested that. Changing
      kd now would confound the mass test, so I hold it fixed and let the next race
      show whether the s-bend and slalom oscillation (0.177 and 0.168 at 1.0 kg) rise.
      Max error has stayed at 0.060 to 0.067 m in every run, so the limit is still
      breached by bend transients rather than a steady offset.


      - [Open this output](iteration-8/entity1/versions/3214567865b84f70a375d985dca0292e/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/08c008f19dd44f78825a73de8b050ce2/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-f743a9de8756c647/payload.json)'
  - id: entityR1
    label: 'Next: wheel_radius'
    notes: 'Feedback before racing: the mass trend (0.6, 0.8, 1.0 kg) is flattening,
      so the next lever is wheel_radius to address the progress shortfall. Sensor
      size 0.016 is kept as a line-loss fallback, and a kd change is flagged if oscillation
      rises.


      ### Feedback


      Written before this candidate has raced, so no result is stated for it. What
      I had to do in the controller: nothing beyond keeping the iteration 7 gains
      (kp 0.8, kd 0.15, ki 0, base_speed 1.5). The Builder''s test changes only mass,
      so I held the controller fixed to keep the result comparable with 73.33. Evidence:
      mass 0.6 kg gave 55.45, 0.8 kg gave 69.18 and 1.0 kg gave 73.33, all with the
      80 mm row and 0.12 m track, so the trend is up but flattening. Oval progress
      rose from 0.148 (0.6 kg) to 0.229 (0.8 kg) and 0.227 (1.0 kg), so progress has
      plateaued. Max error stayed at 0.060 to 0.067 m on every track in every run,
      so the peak is still a bend transient. Decision rules for the next race: if
      1.2 kg scores above 73.33 with max_error falling, the optimum is above 1.0 kg,
      so keep 1.2 kg and test wheel_radius next. If 1.2 kg scores below 73.33 while
      oval progress holds, 1.0 kg is near the local optimum, so return to 1.0 kg and
      test wheel_radius. If steering_oscillation rises above about 0.18 on the s-bend
      or slalom, the heavier robot is under-damped, so the next step is a kd change
      in the controller (for example 0.18), not a geometry change.


      ### Requested changes


      - Try wheel_radius 0.035 m with everything else at the best mass found (1.2
      kg if it beats 73.33, otherwise 1.0 kg). Iterations 3 to 7 reached only 0.12
      to 0.23 of the course, far short of the full run needed to finish in 3 s; a
      larger wheel gives more ground speed at the same PWM (hypothesis from the progress
      shortfall, not yet measured).

      - If the slalom still shows 2.0 line-loss events (iterations 0, 3, 4, 5, 6 and
      7) with max_error above 0.06 m, try sensor_size 0.016 m on the 80 mm row as
      a single test. A larger footprint keeps readings above the 0.05 line-loss threshold
      for longer. Iteration 1 changed sensor size together with other variables, so
      this effect is not yet proven.

      - If 1.2 kg raises s-bend steering_oscillation above about 0.18, keep the geometry
      and request a single kd change to 0.18 in the controller, since iteration 7
      showed the mass trend still rising but the bend response may now be under-damped.


      - [Open this output](iteration-8/entityR1/versions/3214567865b84f70a375d985dca0292e/payload.json)

      - Based on: [entity0](iteration-8/entity0/versions/08c008f19dd44f78825a73de8b050ce2/payload.json),
      [entityR2B](iteration-8/entityR2B/versions/carried-f743a9de8756c647/payload.json)'
