map:
  id: race-131-randow-maps
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: 16mm footprint test
    notes: 'Keeps the 20 mm pitch and changes only the sensor footprint from 12 mm
      to 16 mm, following the Integrator''s contingency rule because one line loss
      per run persisted. The evidence is that pitch changes (10, 15, 20 mm) and track
      narrowing have not moved max_error off the 0.06 m off-track floor, so this tests
      coverage at the outer sensors.


      ### Rationale


      Evidence so far: iterations 0, 1 and 2 all ended off_track in every one of 60
      trials per design. Max_error sits at about 0.06 to 0.066 m, which is the off-track
      floor, and progress is only 0.10 to 0.18. Line_loss_events is 1 to 2 per run,
      and steering_oscillation is low (0.07 to 0.16), so the robot drifts steadily
      off the line rather than oscillating. Sensor pitch has now been tested at 10,
      15 and 20 mm, and none of them changed max_error or line losses, so pitch is
      not the lever. Iteration 2 (20 mm pitch) scored 53.3054, slightly below iteration
      0''s 53.612, so the wider bar did not help. The off-track limit is max(0.06,
      0.0125 + body_width/4), which stays at 0.06 for any body_width in range, so
      it cannot be raised. The Integrator''s contingency rule says that if line losses
      stay at 1 or more with the 20 mm pitch, the 12 mm footprint is probably too
      small for the 25 mm tape at the outer sensors. That condition is met: every
      design so far has had 1 line loss per run. This iteration therefore changes
      only the footprint, from 12 mm to 16 mm, keeping the 20 mm pitch (x = -0.04
      to +0.04), y = 0.04, track 0.10 m, mass 0.7 kg and wheel radius 0.03 m. A larger
      footprint should keep more sensors partly on tape at a given offset, so the
      line should drop out less often. I expect line_loss_events to fall toward 0,
      but max_error is likely to stay near 0.06 m, because the drift is probably a
      lag or steering-authority limit. Next iteration, if line losses are gone and
      max_error is still near 0.06 m, I plan to move the sensor bar forward to y =
      0.06 m to add lead. The forward offset is also a plausible lag lever, since
      at 1.5 m/s a 0.04 m offset gives only about 27 ms of lead.


      - [Open this output](iteration-3/entity0/versions/d8ba7ef3c51b4fc687243b97c92effac/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-8e50eb2451607172/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-d7a4e6ae751689df/payload.json)'
  - id: entity1
    label: 16 mm footprint test
    notes: 'Changes only sensor_size from 12 mm to 16 mm on the iteration 2 design,
      keeping controller and pitch fixed. Evidence: iterations 0 to 2 all ended off_track
      with 1 to 2 line losses regardless of pitch, so footprint is the one untested
      coverage variable.


      ### Rationale


      Iteration 2 (entityR2B, score 53.3054) and iterations 0 and 1 all ended off_track
      in all 60 trials per design. Max_error sits at 0.060 to 0.066 m, the off-track
      floor, and line_loss_events is 1 to 2 per run. Steering_oscillation is low (0.07
      to 0.16), so the robot drifts steadily rather than jittering. Sensor pitch at
      10, 15 and 20 mm did not change max_error or line losses, and the 0.10 m track
      and kp 1.4 did not move max_error either. Coverage at the outer sensors is the
      one untested variable the Builder has identified, so this iteration changes
      only sensor_size, from 0.012 to 0.016 m, and keeps every other value from the
      iteration 2 design. I kept the controller identical to iteration 2 (kp 1.4,
      kd 0.15, ki 0.05, base_speed 1.6, last_direction, weights [-2,-1,0,1,2]). Changing
      gains as well would confound the footprint test. The 16 mm footprint covers
      more of the outer sensors'' area at a given offset, so line losses should fall
      if coverage is the cause. Expected: line_loss_events toward 0. Max_error may
      stay near 0.06 m, which would point to lag as the remaining limit.


      - [Open this output](iteration-3/entity1/versions/b4b512d5fd1f4f318e3406a7bfe6330a/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/d8ba7ef3c51b4fc687243b97c92effac/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-d7a4e6ae751689df/payload.json)'
  - id: entityR1
    label: Next-step feedback
    notes: 'Pre-race feedback: if line losses clear but max_error stays at 0.06 m,
      move the sensor bar forward to y = 0.06 m; if losses persist, stop widening
      pitch and test mass. Based on iterations 0 to 2, where pitch, track and gain
      changes left max_error unchanged.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Iterations
      0, 1 and 2 (entityR2B scores 53.612, 53.3955, 53.3054) all ended off_track in
      every trial, with max_error pinned at 0.060 to 0.066 m, 1 to 2 line-loss events
      per run, and steering_oscillation of 0.07 to 0.16. Sensor pitch from 10 to 20
      mm did not change max_error (oval 0.0608 to 0.0605), and the wider pitch scored
      slightly lower each time. Narrowing the track to 0.10 m (iteration 1) and raising
      kp to 1.4 (iteration 2) also did not move max_error, so steering gain is not
      the limit. The remaining untested coverage lever is footprint, which this candidate
      tests. Your next race decides the next step: if line_loss_events drop to 0 and
      max_error stays near 0.06 m, the limit is lag, so try moving the sensor bar
      forward. If line_loss_events still reach 1, the footprint is not the cause,
      and the next change should be to lag or mass rather than coverage.


      ### Requested changes


      - If line_loss_events reach 0 and max_error stays near 0.06 m with sensor_size
      0.016, move the sensor bar forward to y = 0.06 m, keeping x = -0.04 to +0.04.
      Evidence: iterations 0 to 2 show pitch and gain changes did not move max_error,
      and oscillation of 0.07 to 0.16 leaves room for earlier correction.

      - If line_loss_events still reach 1 per run with sensor_size 0.016, do not widen
      the pitch further. Keep sensor_size 0.016 and try mass 0.5 kg to reduce yaw
      inertia. Evidence: iterations 0 to 2 all had 1 to 2 line losses regardless of
      pitch, so coverage is not the limit; mass has only been varied with track width,
      which was confounded (iteration 0 to 1).

      - If max_error drops below 0.055 m but progress stays low, keep the 0.016 footprint
      and try wheel_radius 0.035 with wheel_track 0.10. Evidence: progress is only
      0.10 to 0.18 across iterations 0 to 2, so top speed may be the next limit once
      the line is held.


      - [Open this output](iteration-3/entityR1/versions/b4b512d5fd1f4f318e3406a7bfe6330a/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/d8ba7ef3c51b4fc687243b97c92effac/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-d7a4e6ae751689df/payload.json)'
