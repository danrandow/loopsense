map:
  id: race-131-randow-maps
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Mass 0.5 kg test
    notes: 'Keeps the 0.016 m footprint and 20 mm pitch from iteration 3, and changes
      only mass from 0.7 to 0.5 kg to cut yaw inertia. Iteration 3 still showed 1
      line loss per run and max_error at the 0.06 m floor, so the Integrator''s contingency
      rule points to mass.


      ### Rationale


      Evidence from iterations 0 to 3: all 240 trials ended off_track. max_error sits
      at the 0.060 to 0.067 m off-track floor, and progress is only 0.10 to 0.18.
      Line_loss_events stayed at 1 per run on every track after the footprint change
      to 0.016 m (iteration 3), so coverage at 0.016 m did not remove the line loss.
      Steering_oscillation is low (0.07 to 0.16), so the robot drifts steadily rather
      than oscillating. Sensor pitch (10, 15, 20 mm), track narrowing to 0.10 m, and
      footprint (0.012 to 0.016 m) have each failed to move max_error, so none of
      these is the binding lever. The Robot Integrator''s contingency rule, written
      for this candidate, says that if line losses persist at 1 per run with the 0.016
      m footprint, do not widen the pitch further, and try mass 0.5 kg to reduce yaw
      inertia. The yaw inertia formula (mass*(L²+W²)/12) gives a direct reduction
      of about 29 percent from 0.7 to 0.5 kg. I therefore keep the iteration 3 geometry
      (0.016 m footprint, 20 mm pitch at x = -0.04 to +0.04, y = 0.04, track 0.10
      m, wheel radius 0.03 m, body 0.18 x 0.12 m) and change only mass, from 0.7 to
      0.5 kg. Expected result: a smaller yaw inertia lets the robot turn back toward
      the line sooner, so line_loss_events should fall, ideally to 0, and max_error
      should drop below about 0.06 m. I expect progress to stay low, because top speed
      is not yet limited by the design. The off-track floor cannot be raised, since
      body_width does not lift it above 0.06 m in range.


      - [Open this output](iteration-4/entity0/versions/f8436012e8bb4f8f8f2825a756462ca5/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-354c905c3d9f66b7/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-f67abeb9d1f5250e/payload.json)'
  - id: entity1
    label: Mass 0.5 kg robot package
    notes: 'Iteration 3 design with mass cut from 0.7 to 0.5 kg and the controller
      held fixed, so the result isolates yaw inertia. The 1-line-loss-per-run and
      off-track-floor pattern across iterations 0 to 3 is the evidence.


      ### Rationale


      Iterations 0 to 3 all ended off_track in every trial. max_error sits at the
      0.060 to 0.067 m off-track floor, line_loss_events is 1 per run on the last
      three designs, steering_oscillation is low (0.07 to 0.16), and progress is 0.10
      to 0.18. Sensor pitch (10, 15, 20 mm), footprint (12 to 16 mm), track narrowing
      (0.12 to 0.10 m) and kp/kd (1.2/0.1 to 1.4/0.15) have each left max_error and
      line losses essentially unchanged. The untested lever is yaw inertia, so I deliver
      the Builder''s iteration 4 geometry exactly: the iteration 3 design with mass
      reduced from 0.7 to 0.5 kg (about 29 percent less yaw inertia). The controller
      is held at the iteration 3 values (kp 1.4, ki 0.05, kd 0.15, base_speed 1.6,
      last_direction, weights [-2,-1,0,1,2]) so the mass result is attributable to
      the geometry alone. I make no claim about this run''s outcome. Measurements
      include controller_errors and control_effort to catch any integration fault.


      - [Open this output](iteration-4/entity1/versions/6883b006dc92448da508b916c73503aa/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/f8436012e8bb4f8f8f2825a756462ca5/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-f67abeb9d1f5250e/payload.json)'
  - id: entityR1
    label: 'Feedback: mass then lag'
    notes: 'Requests three conditional next steps: forward offset y = 0.06 m if line
      losses clear, mass 0.4 kg if one loss remains, and wheel_radius 0.035 if progress
      is the limit. Each is tied to iterations 0 to 3, where pitch, footprint, track
      and gain changes left max_error pinned at 0.06 m.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Iterations
      0 to 3 (entityR2B scores 53.612, 53.3955, 53.3054, 53.2728) all ended off_track
      in all 240 trials. max_error stayed at 0.060 to 0.067 m, line_loss_events was
      1 to 2 per run, and steering_oscillation was 0.07 to 0.16. Pitch from 10 to
      20 mm, footprint from 12 to 16 mm, track from 0.12 to 0.10 m, and kp from 1.2
      to 1.4 each left max_error at the floor, so coverage and steering gain are not
      the binding levers. Only mass remains untested alone, which is why this candidate
      changes it. Read the next race as follows. If line_loss_events falls to 0 and
      max_error drops below about 0.06 m, the limit is lag, so move the sensor bar
      forward to y = 0.06 m. If one line loss per run remains with max_error still
      at the floor, yaw inertia is not enough, so try the minimum mass of 0.4 kg before
      any other change. If line losses clear but progress stays low, the limit is
      top speed, so try wheel_radius 0.035 with wheel_track 0.10.


      ### Requested changes


      - If line_loss_events is 0 and max_error is still near 0.06 m at mass 0.5 kg,
      move the sensor bar forward to y = 0.06 m with x = -0.04 to +0.04 and sensor_size
      0.016. Evidence: pitch, footprint and gain changes in iterations 0 to 3 did
      not move max_error, and steering_oscillation of 0.07 to 0.16 leaves room for
      earlier correction.

      - If line_loss_events is still 1 per run at mass 0.5 kg, try mass 0.4 kg, the
      minimum allowed, keeping the iteration 4 geometry. Evidence: line losses have
      persisted at 1 per run through every pitch, footprint and track change (iterations
      0 to 3), and mass has not yet been varied alone.

      - If line losses are cleared but progress stays between 0.10 and 0.20 with off_track
      endings, try wheel_radius 0.035 with wheel_track 0.10. Evidence: progress has
      been 0.10 to 0.18 across iterations 0 to 3, which points to a speed limit once
      the line is held. Do not narrow wheel_track below 0.10 m, because iteration
      1 showed no max_error gain from that change.


      - [Open this output](iteration-4/entityR1/versions/6883b006dc92448da508b916c73503aa/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/f8436012e8bb4f8f8f2825a756462ca5/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-f67abeb9d1f5250e/payload.json)'
