map:
  id: race-131-randow-maps
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Larger wheels for speed
    notes: 'Keeps the iteration 5 geometry (mass 0.4 kg, 0.016 m footprint, 20 mm
      pitch) and raises wheel_radius from 0.030 to 0.035 m. The 0.4 kg mass test already
      ran in iteration 5 and left one line loss per run and max_error at the floor,
      so the progress limit of 0.11 to 0.16 points to top speed.


      ### Rationale


      Evidence from iterations 0 to 5 (360 trials, all off_track): max_error is pinned
      at the 0.060 to 0.068 m off-track floor on every track. line_loss_events is
      1 per run after the footprint change, and it stayed at 1 through the mass change
      to 0.5 kg and then 0.4 kg. Steering_oscillation is low (0.07 to 0.16), so the
      robot drifts off the line rather than oscillating. Progress is only 0.10 to
      0.18. The Integrator''s feedback for this candidate was written before iteration
      5 raced, so its mass 0.4 kg test has already been run and did not clear the
      line loss (iteration 5 scored 53.6775, its best so far, with the same max_error
      floor). Its own decision rule applies: if one line loss per run remains with
      max_error still at the floor, yaw inertia is not the cause, so move to top speed.
      Progress that stays at 0.11 to 0.16 while the robot holds the line also points
      to a speed limit. The 1.5 m/s average needed to finish in 3 s has not been reached.
      I therefore keep the iteration 5 geometry (mass 0.4 kg, 0.016 m footprint, 20
      mm pitch at x = -0.04 to +0.04, y = 0.04, body 0.18 x 0.12 m, track 0.10 m)
      and change only the wheel radius, from 0.030 to 0.035 m. For the same wheel
      rotation rate, ground speed rises by about 17 percent, which is the top-speed
      lever the Integrator asked for. I do not narrow the track, since iteration 1
      showed no max_error gain from that. I expect progress to rise toward 0.2 or
      more and completion_time to fall. I also expect line_loss_events to stay at
      1 or change only a little, because the line loss is not yaw-inertia driven.
      If the speed change does not clear the line loss, the next candidate tests the
      sensor lag lever (y = 0.06 m).


      - [Open this output](iteration-6/entity0/versions/a743502a96c442f18743188ab86ffb18/payload.json)

      - Based on: [entityR1](iteration-6/entityR1/versions/carried-9f5f4374bde8cb0c/payload.json),
      [entityR2A](iteration-6/entityR2A/versions/carried-6d99610b68d853f5/payload.json)'
  - id: entity1
    label: Wheel radius 0.035 test
    notes: 'Changes only wheel_radius from 0.030 to 0.035 m on the iteration 5 design,
      with the controller held fixed to isolate top speed. Based on progress stuck
      at 0.10 to 0.18 and line losses unchanged across iterations 0 to 5.


      ### Rationale


      Iterations 0 to 5 ended off_track in all 360 trials. max_error stayed at the
      0.060 to 0.068 m off-track floor, line_loss_events stayed at 1 per run after
      the footprint change, and steering_oscillation was low (0.07 to 0.16), so the
      robot drifts rather than jitters. Pitch (10 to 20 mm), footprint (12 to 16 mm),
      track (0.12 to 0.10 m), kp (1.2 to 1.4) and mass (0.8 to 0.4 kg) each left max_error
      and line losses essentially unchanged. Progress has stayed at 0.10 to 0.18,
      so top speed is the untested lever. The Builder''s entity0 changes only wheel_radius,
      from 0.030 to 0.035 m. I build exactly that geometry on the iteration 5 controller,
      with the controller held fixed so any change in progress or line losses is attributable
      to wheel radius. Gains are unchanged (kp 1.4, ki 0.05, kd 0.15, base_speed 1.6,
      weights [-2,-1,0,1,2], last_direction). The sensor bar stays at y = 0.04 m,
      because lag has not yet been tested alone and the Builder''s rule defers it
      until line losses clear. Turn per unit PWM depends on wheel_track, which is
      unchanged, so steering authority should stay about the same while ground speed
      rises about 17 percent. Measurements include controller_errors and control_effort
      to catch integration faults.


      - [Open this output](iteration-6/entity1/versions/f2eb7cc66aab48bc836e5c3cd59832be/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/a743502a96c442f18743188ab86ffb18/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-6d99610b68d853f5/payload.json)'
  - id: entityR1
    label: Lag and speed
    notes: 'Written before the race: gives branches for the next result, moving the
      sensor bar to y = 0.06 m for lag or trying a larger wheel radius if progress
      does not rise. Each branch cites the persistent 1 line loss per run and the
      0.06 m floor across iterations 0 to 5.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Iterations
      0 to 5 (entityR2B scores 53.612, 53.3955, 53.3054, 53.2728, 53.5316, 53.6775)
      all ended off_track in every trial. max_error stayed at 0.060 to 0.068 m, line_loss_events
      was 1 per run after the footprint change (iteration 3), and steering_oscillation
      was 0.07 to 0.16. Pitch from 10 to 20 mm (iterations 0 to 2), footprint from
      12 to 16 mm (iteration 3), track from 0.12 to 0.10 m (iteration 1), kp from
      1.2 to 1.4 (iteration 2) and mass from 0.8 to 0.4 kg (iterations 4 and 5) each
      left max_error at the floor, so none is the binding lever. Progress of 0.10
      to 0.18 across all designs points to speed, which this candidate tests through
      wheel_radius. Read the next race as follows. If progress rises clearly above
      0.2 and line_loss_events falls to 0 with max_error still near 0.06 m, the limit
      is lag, so move the sensor bar to y = 0.06 m. If progress rises but line_loss_events
      stays at 1, keep wheel_radius 0.035 and move the sensor bar to y = 0.06 m to
      test lead. If progress does not rise, the speed hypothesis is weakened and the
      sensor bar move is the next step.


      ### Requested changes


      - If progress rises above 0.2 and line_loss_events falls to 0 with max_error
      still near 0.06 m, move the sensor bar forward to y = 0.06 m, keeping x = -0.04
      to +0.04, sensor_size 0.016 and wheel_radius 0.035. Evidence: iterations 0 to
      5 show pitch, footprint, track, gain and mass changes did not move max_error,
      and steering_oscillation of 0.07 to 0.16 leaves room for earlier correction.

      - If progress rises but line_loss_events stays at 1 per run, keep wheel_radius
      0.035 and move the sensor bar to y = 0.06 m to test lead. Evidence: line losses
      have persisted at 1 per run through every pitch, footprint, track and mass change
      (iterations 0 to 5), so lag is the untested lever.

      - If progress does not rise above about 0.2, try wheel_radius 0.04 with wheel_track
      0.10 before any sensor move. Evidence: progress has been 0.10 to 0.18 across
      iterations 0 to 5 with no clear response to any single lever. Do not narrow
      wheel_track below 0.10 m, because iteration 1 showed no max_error gain from
      that.


      - [Open this output](iteration-6/entityR1/versions/f2eb7cc66aab48bc836e5c3cd59832be/payload.json)

      - Based on: [entity0](iteration-6/entity0/versions/a743502a96c442f18743188ab86ffb18/payload.json),
      [entityR2B](iteration-6/entityR2B/versions/carried-6d99610b68d853f5/payload.json)'
