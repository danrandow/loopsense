overrides:
  entities:
  - id: entity0
    label: Revert to iter-9 platform
    notes: 'Final handover restores the best-raced geometry (iteration 9, score 363.7):
      ±0.04 m span, 16 mm footprint, y = 0.04 m, 0.10 m track, 0.4 kg. The wider ±0.06
      m span in iteration 10 cut the oval finish rate from 95 to 25 percent, so it
      is rejected.


      ### Rationale


      This is the final iteration, so the job is to hand the Integrator the geometry
      with the strongest race evidence. Iteration 9 (the best raced design, 363.7)
      ran on the 0.016 m footprint, 20 mm pitch at x = -0.04 to +0.04, y = 0.04 m,
      track 0.10 m, wheel radius 0.03 m and mass 0.4 kg. Its oval finished 19 of 20
      runs, and max_error on the oval fell to 0.037 m. Iteration 10 widened the span
      to x = ±0.06 m (30 mm pitch) and scored 209.7. The oval finish rate dropped
      to 25 percent and steering_oscillation rose to 0.32, while the s-bend line losses
      fell only from 1.0 to 0.1 and still ended off_track. So the wider span is a
      net loss on the tracks that matter most for the score. Every earlier geometry
      test (pitch, footprint, track, mass, wheel radius and lead) left max_error at
      the floor, so none of them offers a proven gain. I therefore revert the geometry
      to the iteration 9 platform. Its span of ±0.04 m is the only one with a measured
      oval finish rate near 95 percent. An untested intermediate span (for example
      ±0.05 m) would be a gamble on the final unseen track, so I do not propose it.
      Expected result: a score near the iteration 9 level on the development tracks,
      with the oval finishing reliably and the s-bend and slalom still limited by
      the single line loss per run.


      - [Open this output](iteration-11/entity0/versions/068b450f0a77400890d322fbd34b1b00/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-7b84eadd35eb7c6d/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-842cbbb2b39f970f/payload.json)'
  - id: entity1
    label: Iter 9 geometry +
    notes: 'Restores the iteration 9 platform (±0.04 m span, 16 mm footprint, 0.4
      kg) with the iteration 9 controller unchanged. Chosen because the ±0.06 m span
      cut the oval finish rate from 95 to 25 percent in iteration 10.


      ### Rationale


      The final handover asks for the iteration 9 geometry, and I accept it. Iteration
      9 is the best-measured platform (363.7). Its oval finished 19 of 20 runs with
      max_error 0.037 and 0.1 line-loss events, which is the evidence that matters
      most for the score. Iteration 10 showed the wider ±0.06 m span cut the oval
      finish rate from 95 to 25 percent and raised steering_oscillation from 0.27
      to 0.32, while the s-bend line losses fell only from 1.0 to 0.1. So I keep the
      16 mm footprint, the 20 mm pitch at x = -0.04 to +0.04 and y = 0.04 m, track
      0.10 m, wheel radius 0.03 m, mass 0.4 kg and body 0.18 x 0.12 m. I also keep
      the sensor weights [-2,-1,0,1,2] unchanged, since they match the signal scale
      the controller was tuned on. For the controller I carry over the iteration 9
      values exactly (base_speed 1.0, kp 2.5, ki 0.05, kd 0.4, last_direction). That
      is the only controller with race evidence, and it is what cleared the oval line
      loss. I considered an untested gain change for the s-bend and slalom, but with
      no iteration left to check it, it would be a gamble on the unseen final track.
      Expected result: a score near the iteration 9 level, with the oval finishing
      reliably and the s-bend and slalom still limited by about one line loss per
      run.


      - [Open this output](iteration-11/entity1/versions/d38e3fb635d249f287173dfed7c803b1/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/068b450f0a77400890d322fbd34b1b00/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-842cbbb2b39f970f/payload.json)'
  - id: entityR1
    label: Keep iter 9 geometry
    notes: 'Feedback asks the Builder to keep the iteration 9 span and track values,
      citing the iteration 9 vs 10 oval finish rates. No further iteration exists
      to act on it, so the feedback is for the record.


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Iteration
      9 (363.7) is the only design that moved the score. Its controller change (base_speed
      1.0, kp 2.5, kd 0.4) on the iteration 5 geometry cleared the oval line loss
      (0.1 per run, 19 of 20 finishes), while the s-bend and slalom still show one
      line loss per run with max_error at the 0.062 to 0.063 m floor. Iteration 10
      (iteration 9 controller with the span widened to ±0.06 m) cut the oval finish
      rate from 95 to 25 percent and raised steering_oscillation from 0.27 to 0.32,
      while s-bend line losses fell only from 1.0 to 0.1. The span is therefore not
      the lever for the score. This candidate keeps your iteration 9 geometry, which
      is the best-measured platform. The Integrator''s controller stays at the iteration
      9 values, so the race measures the geometry you proposed. Since this is the
      final iteration, there is no later race to act on, and the requested changes
      below are for the record only.


      ### Requested changes


      - Keep sensor_positions at x = -0.04 to +0.04 with 20 mm pitch and y = 0.04
      m. Evidence: iteration 9 (span ±0.04) finished 19 of 20 oval runs, while iteration
      10 (span ±0.06) finished 5 of 20 at the same controller.

      - Keep wheel_track at 0.10 m, wheel_radius at 0.03 m and mass at 0.4 kg. Evidence:
      these were the iteration 9 values, and no later geometry test (iterations 1,
      4, 5, 6) moved max_error or progress off the floor.

      - Do not widen the span beyond ±0.04 m or move y away from 0.04 m without new
      race evidence. Evidence: the ±0.06 m span (iteration 10) cut the oval finish
      rate and raised steering_oscillation, and lead changes (iteration 7, y = 0.06
      m) gave no line-loss gain.


      - [Open this output](iteration-11/entityR1/versions/d38e3fb635d249f287173dfed7c803b1/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/068b450f0a77400890d322fbd34b1b00/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-842cbbb2b39f970f/payload.json)'
