map:
  id: race-131-randow-maps
  schema: v0.2
  scenario: Iteration 6
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 5.
dimensions:
  time_horizon: prepared
  iteration: '6'
overrides:
  entities:
  - id: entity0
    label: Mass 0.4 kg, minimum test
    notes: 'Keeps the iteration 4 geometry and changes only mass from 0.5 to 0.4 kg,
      following the Integrator''s rule for a persistent single line loss with max_error
      at the floor. Iteration 4 (mass 0.5 kg) still gave one line loss per run and
      max_error 0.061 to 0.068 m across 240 trials, so yaw inertia is the last untested
      lever before lag or top speed.


      ### Rationale


      Race evidence from iteration 4 (mass 0.5 kg, 0.016 m footprint, 20 mm pitch
      at x = -0.04 to +0.04, y = 0.04, track 0.10 m, wheel radius 0.03 m) shows that
      the mass change did not clear the line loss. All 60 trials again ended off_track,
      with line_loss_events at 1.0 on every development track. max_error sits at the
      off-track floor (0.0613 oval, 0.0645 s-bend, 0.0677 slalom). Progress is 0.11
      to 0.16 and steering_oscillation is low (0.07 to 0.16), so the robot drifts
      off the line rather than oscillating. Score moved only from 53.2728 to 53.5316,
      which is within noise of earlier designs. Across iterations 0 to 4, sensor pitch
      (10 to 20 mm), footprint (0.012 to 0.016 m), track (0.12 to 0.10 m) and mass
      (0.8 to 0.5 kg) have all left the single line loss per run and the max_error
      floor unchanged. The Integrator''s rule for this case is: if one line loss per
      run remains with max_error still at the floor, yaw inertia is not enough, so
      try the minimum mass of 0.4 kg before any other change. I follow that rule.
      I change only mass, from 0.5 to 0.4 kg (the allowed minimum), and keep the iteration
      4 geometry. This keeps the test attributable. I do not move the sensor bar forward
      yet: the Integrator''s lag rule applies only when line_loss_events reaches 0,
      and that has not happened. Expected result: a further 20 percent cut in yaw
      inertia may reduce the line loss, but the effect is probably small, because
      mass has moved little on max_error so far. If line losses still persist, the
      next candidate will test lag (sensor bar at y = 0.06 m) or top speed (wheel_radius
      0.035 with wheel_track 0.10), depending on which evidence appears. The off-track
      floor cannot be raised: max(0.06, 0.0125 + body_width/4) stays at 0.06 m for
      every allowed body_width.


      - [Open this output](iteration-5/entity0/versions/27fc610cabdd4f768440310107d98a8e/payload.json)

      - Based on: [entityR1](iteration-5/entityR1/versions/carried-64e939410f999575/payload.json),
      [entityR2A](iteration-5/entityR2A/versions/carried-f619b7c5c1c913ba/payload.json)'
  - id: entity1
    label: Mass 0.4 kg test
    notes: 'Only mass changes from iteration 4 (0.5 to 0.4 kg), the minimum allowed,
      as the contingency rule requires after one line loss per run persisted. Controller
      is held fixed so the result is attributable to yaw inertia.


      ### Rationale


      Race evidence from iterations 0 to 4 shows every design ended off_track in all
      300 trials. max_error sits at the 0.06 m off-track floor, progress is 0.10 to
      0.18, and steering_oscillation is low (0.07 to 0.16), so the robot drifts rather
      than jitters. Iteration 4 (mass 0.5 kg) left one line loss per run and max_error
      at the floor, and the score moved only from 53.2728 to 53.5316, which is within
      noise. The Integrator''s contingency rule for this case is to try mass 0.4 kg,
      the allowed minimum, before any other change. I follow that rule. Only mass
      changes from the iteration 4 geometry (0.5 to 0.4 kg), which keeps the test
      attributable. The controller is held exactly at the iteration 4 values (base_speed
      1.6, kp 1.4, ki 0.05, kd 0.15, weights [-2,-1,0,1,2], last_direction), because
      changing gains would confound the mass result. Geometry matches the Builder''s
      entity0 exactly: 20 mm pitch at x = -0.04 to +0.04, y = 0.04, 16 mm footprints,
      0.10 m track, 0.03 m wheels, 0.18 x 0.12 m body. Expected: line_loss_events
      falls toward 0 and max_error drops below about 0.06 m. The effect is probably
      small, because mass has moved little on max_error so far. If line losses persist,
      the next test is lag (sensor bar at y = 0.06 m) or top speed (wheel_radius 0.035
      with wheel_track 0.10), chosen by which evidence appears. Controller_errors
      and control_effort are requested to catch any integration fault.


      - [Open this output](iteration-5/entity1/versions/f85b4320110a435eb3437574d3379147/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/27fc610cabdd4f768440310107d98a8e/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-f619b7c5c1c913ba/payload.json)'
  - id: entityR1
    label: Lag or speed next steps
    notes: 'Feedback on what to change after the 0.4 kg race, based on 300 off-track
      trials across iterations 0 to 4 where pitch, footprint, track, gains and mass
      left max_error pinned at 0.06 m. Gives branching rules for lag (y = 0.06 m)
      and top speed (wheel_radius 0.035).


      ### Feedback


      Written before this candidate has raced; no outcome is stated for it. Iterations
      0 to 4 (entityR2B scores 53.612, 53.3955, 53.3054, 53.2728, 53.5316) all ended
      off_track in every trial. max_error stayed at 0.060 to 0.067 m, line_loss_events
      was 1 to 2 per run, and steering_oscillation was 0.07 to 0.16. Pitch from 10
      to 20 mm (iterations 0 to 2), footprint from 12 to 16 mm (iteration 3), track
      from 0.12 to 0.10 m (iteration 1), kp from 1.2 to 1.4 (iteration 2) and mass
      from 0.8 to 0.5 kg (iteration 4) each left max_error at the floor, so none of
      these is the binding lever. Mass 0.4 kg is the last variable untested alone,
      which is why this candidate sets it. Read the next race as follows. If line_loss_events
      falls to 0 and max_error drops below about 0.06 m, the limit is lag, so move
      the sensor bar forward. If one line loss per run remains with max_error still
      at the floor, yaw inertia is not the cause, so move to top speed. If line losses
      clear but progress stays between 0.10 and 0.20 with off_track endings, the limit
      is speed.


      ### Requested changes


      - If line_loss_events is 0 and max_error is still near 0.06 m at mass 0.4 kg,
      move the sensor bar forward to y = 0.06 m, keeping x = -0.04 to +0.04 and sensor_size
      0.016. Evidence: iterations 0 to 4 show pitch, footprint, track, gain and mass
      changes did not move max_error, and steering_oscillation of 0.07 to 0.16 leaves
      room for earlier correction.

      - If line_loss_events is still 1 per run at mass 0.4 kg, keep mass 0.4 kg and
      try wheel_radius 0.035 with wheel_track 0.10. Evidence: progress has been 0.10
      to 0.18 across iterations 0 to 4, which points to a speed limit once the line
      is held.

      - Do not narrow wheel_track below 0.10 m or widen sensor pitch beyond 20 mm.
      Evidence: iteration 1 (track 0.10 m) gave no max_error gain, and iterations
      2 and 3 showed the 20 mm pitch and 16 mm footprint gave no gain over 15 mm.


      - [Open this output](iteration-5/entityR1/versions/f85b4320110a435eb3437574d3379147/payload.json)

      - Based on: [entity0](iteration-5/entity0/versions/27fc610cabdd4f768440310107d98a8e/payload.json),
      [entityR2B](iteration-5/entityR2B/versions/carried-f619b7c5c1c913ba/payload.json)'
