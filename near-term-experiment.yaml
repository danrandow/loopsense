map:
  id: loopsense-near-term-experiment
  schema: "v0.2"
  title: "Loopsense Agent Team — Near Term"
  scenario: "Iteration 1: First Evidence Threshold"
  inherits: base.yaml
  notes: |
    The artifact is built. The next iteration is about getting it in front of practitioners.

    **Three things need to happen, in this order:**

    1. **Delivery describes the artifact** — write a practitioner-readable product description.
       No one can use what they cannot understand. This is iteration 1's primary delivery job.

    2. **GTM listens** — find where practitioners are describing multi-agent
       frustrations. Map the language they use. Confirm the verification gap is felt, not
       just theorised.

    3. **GTM makes the offer** — when a minimum artifact exists and 5+
       practitioners have been identified, frame the verification gap problem and point to
       the topology as a proposed approach.

    **No code runner required. No X account required. No external funding.**

    **Timeline: 4–8 weeks.**

dimensions:
  time_horizon: "2026-Q4"
  iteration: "1"

overrides:
  actions:
    - id: action0
      notes: |
        **Iteration 1 PM action:**

        Synthesise return flows from previous iteration and update the bet:
        - Does the delivery agent's product description match the bet?
        - What has GTM found in the listening cycle?
        - Is the evidence threshold still the right one?

        **Starting question:** Do practitioners actually feel the verification gap,
        or is this a problem only we see?

    - id: action2
      notes: |
        **Delivery iteration 1 action:**

        Write the product description. The artifact (the map) is built. Make it pickupable.

        The description must answer:
        1. What is this? (one paragraph, no jargon)
        2. What problem does it solve? (verification gap, in practitioner language)
        3. What are the moving parts? (actors, actions, entities, skills, knowledge files)
        4. How do you run an iteration? (step by step)
        5. How do you know it worked?

        Read `knowledge/delivery-v0.md` before starting. Read entityR3A when Sales begins
        returning field requests.

    - id: action3
      notes: |
        **Listen first. Do not post yet.**

        Search:
        - X/Twitter: "my agents keep contradicting each other", knowledge work AI frustrations
        - GitHub issues on LangGraph, CrewAI, AutoGen: what are practitioners complaining about?
        - Hacker News: threads on knowledge work agent failures
        - Discord/Slack: agent builder communities

        Read `agents/gtm/knowledge/gtm-v0.md` and `knowledge/research/verification-gap.md` first.
        Map the language practitioners use for the problem. That language becomes the hook.

        **Post only when:**
        - Product description (entity2) exists
        - 5+ practitioners identified who've felt the problem
        - PM has updated bet from what Sales found

  entities:
    - id: entity0
      notes: |
        **The current bet:** The Randow Maps topology gives knowledge work orchestration engineers
        an inspectable, scenario-comparable coordination spec with a consideration mechanism
        that functions as a lightweight manufactured referee.

        Uniqueness: defined in YAML (not code), visual topology, semantic entity types,
        scenario-comparable runs. Not LangGraph (code-defined). Not CrewAI (no visual topology).

        Confidence: low-medium. Theory grounded in sourced research. No practitioner validation yet.

    - id: entity2
      label: Product Description
      notes: |
        A practitioner-readable description of the agent harness — clear enough to implement
        without ever having seen the project.

        Must answer all five questions in the delivery action notes. Delivery agent produces this.

        This is the minimum artifact for GTM to make the market offer.

    - id: entity3
      label: Market Offer
      notes: |
        When delivery has produced entity2 and Sales has found 5+ practitioners who feel
        the problem: frame the verification gap problem first, then point to the topology.

        **Hook:** *"I tried to build a knowledge work agent and here's what broke."*
        Then show the topology as what gave it structure.

        Use Dan's existing X account. 4 hours is the measurement window.
        Reply to existing threads — join a conversation that already exists.

    - id: entityR3
      label: Practitioner Signal
      notes: |
        **GTM iteration 1 output:**

        Where practitioners are, what language they use for multi-agent frustrations,
        whether the verification gap is felt in the wild.

        This either confirms the bet or redirects it. It feeds PM's updated aligned bet
        and Delivery's product description (what language to use, what to lead with).

    - id: entityPrv0
      notes: |
        **PM iteration 1 questions:**
        - Is the delivery description accurate to the bet?
        - What did Sales find — is the problem felt by practitioners?
        - Does the evidence threshold need updating?

    - id: entityPrv1
      notes: |
        **Exec iteration 1 check:**
        - Delivery produced entity2 — is it viable enough to hand to practitioners?
        - Business model still unlocked — deliberate.
        - Revisit if counter-evidence emerges (tool already solves the verification gap).
