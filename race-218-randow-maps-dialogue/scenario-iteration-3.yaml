map:
  id: race-218-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 3
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 2.
dimensions:
  time_horizon: prepared
  iteration: '3'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 2 is the best result so far (score 501.2, up from 166.4). The oval
      now finishes 20 of 20 runs. The s-bend finishes 6 of 20, and the slalom still
      finishes 0 of 20. Both failing tracks end off track. Line-loss events are 0.9
      on the s-bend and 1.0 on the slalom, well below the 2-per-run threshold, so
      the sensor spread of ±0.024 m is not failing and I am not widening it. Max error
      on the s-bend is now 0.0529 m, under the 0.06 m limit, so the s-bend is no longer
      clearly stuck at the limit. The slalom max error is 0.0628 m, above the limit,
      and its progress is only 0.10. Oval steering oscillation is 0.206, above the
      roughly 0.15 level the Integrator flagged. Integration feedback asked me to
      try a lower mass (about 0.6 kg) if oscillation stays high and s-bend and slalom
      still hit max_error near 0.06 m with progress below 0.25. That condition is
      met on the slalom (max_error 0.063, progress 0.10, oscillation high on the oval)
      but not on the s-bend, where progress is 0.85. I am taking the mass step because
      the slalom is the binding failure and the yaw-inertia reduction is the only
      geometry lever the Integrator named. I am changing only the mass, from 0.8 to
      0.6 kg. The sensors, body, track, wheels and sensor size stay as they were,
      so the effect of the mass change is isolated from the Integrator''s controller
      change as far as one race allows. Body width still sets the off-track limit
      at its 0.06 m floor, so I am not touching it. I expect slalom progress to rise
      above 0.2 and max error to fall toward or below 0.06 m, with oval oscillation
      dropping below about 0.15. I expect the s-bend to hold near its current completion
      rate. I am not sure of this, because the Integrator''s controller also changes
      in this iteration.


      - [Open this output](iteration-3/entity0/versions/2750d0152ef64ba1b2fbe7826fa287d8/payload.json)

      - Based on: [entityR1](iteration-3/entityR1/versions/carried-4a5b82e447c9544e/payload.json),
      [entityR2A](iteration-3/entityR2A/versions/carried-b3dd52f975dcd2ea/payload.json)'
  - id: entity1
    label: Mass 0.6kg, controller
    notes: 'Passes the Builder''s 0.6 kg geometry unchanged with the iteration-2 controller
      (base 1.3, kp 2.4, kd 0.5), which is the best race so far (501.2). Holding the
      controller isolates the mass effect, since the Builder''s hypotheses depend
      on it alone.


      ### Rationale


      The Builder''s proposal changes only the mass, from 0.8 to 0.6 kg, which lowers
      yaw inertia by about 25 percent. Iteration 2 (base_speed 1.3, kp 2.4, kd 0.5)
      is the best controller so far: the oval finishes 20 of 20, the s-bend finishes
      6 of 20, and the slalom finishes 0 of 20 with progress 0.10 and max_error 0.0628
      m. Line losses are 0.55 to 1.0 per run, so sensing is not the limit. Speed barely
      matters on the slalom: progress was 0.136 at base 1.6 and 0.10 at base 1.3,
      so I am not lowering speed further. The oval''s 0.206 steering oscillation is
      above the roughly 0.15 level the Integrator flagged, and the Builder expects
      the mass change to reduce it. To keep the race readable, I hold the controller
      at the iteration-2 values and change nothing except the geometry arriving from
      the Builder. This isolates the mass effect: any change in oscillation, slalom
      max_error or s-bend completion can then be attributed to mass. Expected, not
      measured: oval oscillation falls below about 0.15, and slalom max_error moves
      toward 0.06 m. The Builder''s geometry is passed through unchanged, so the complete
      robot matches the proposal exactly.


      - [Open this output](iteration-3/entity1/versions/8c5dffed13f04797aeb252e6044ab1aa/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/2750d0152ef64ba1b2fbe7826fa287d8/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-b3dd52f975dcd2ea/payload.json)'
  - id: entityR1
    label: Hold mass test, spread
    notes: 'Confirms the Builder''s mass-only test and sets triggers for widening
      the spread or reverting mass. The triggers rest on iteration 2: slalom progress
      0.10 with line losses 1.0, s-bend completion 6 of 20, and oval oscillation 0.206.


      ### Feedback


      Iteration 2 (held geometry, base 1.3, kp 2.4, kd 0.5) is the best race so far
      at 501.2. The oval completes 20 of 20, and the s-bend completes 6 of 20 with
      max_error 0.0529 m, under the limit. The slalom still fails: 0 of 20, progress
      0.10, max_error 0.063 m, and oscillation of 0.206 on the oval is above the roughly
      0.15 level. Line-loss events stay at 0.55 to 1.0 per run, so the ±0.024 m spread
      is not the limit. Lowering speed did not help the slalom (progress 0.136 at
      base 1.6 in iteration 1 versus 0.10 at 1.3 in iteration 2), so do not rely on
      speed alone. The mass reduction you propose is the right kind of lever for oscillation,
      and I am testing it with the controller held. Hold the iteration-2 geometry
      for the next race, changing only mass to 0.6 kg, as you propose. Your trigger
      rules are sound and I will hold you to them. If oval oscillation drops below
      about 0.15 and slalom max_error reaches or falls below 0.06 m, keep 0.6 kg.
      If slalom line losses rise above about 2 per run, widen the spread to ±0.032
      m. If s-bend completion falls below 0.3, revert toward 0.8 kg rather than adding
      more spread. Do not change the body, because body width cannot widen the off-track
      limit at its 0.06 m floor.


      ### Requested changes


      - Keep the mass at 0.6 kg with all other geometry as in iteration 2 (five sensors
      at y = 0.06 m, x = ±0.024 m, 12 mm footprint, 0.12 m track, 0.03 m wheels, 0.16
      by 0.14 m body), so the mass change is the only variable.

      - If slalom line_loss_events exceed about 2 per run and slalom progress stays
      below 0.2, widen the sensor spread to x = ±0.032 m with five sensors, keeping
      y = 0.06 m.

      - If s-bend completion falls below 0.3 at 0.6 kg, revert mass to 0.8 kg rather
      than changing the spread, because the s-bend was the track that completed most
      often under the 0.8 kg design.


      - [Open this output](iteration-3/entityR1/versions/8c5dffed13f04797aeb252e6044ab1aa/payload.json)

      - Based on: [entity0](iteration-3/entity0/versions/2750d0152ef64ba1b2fbe7826fa287d8/payload.json),
      [entityR2B](iteration-3/entityR2B/versions/carried-b3dd52f975dcd2ea/payload.json)'
