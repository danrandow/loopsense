overrides:
  entities:
  - id: entity0
    label: Hold geometry, test ki
    notes: 'Holds the iteration-8 geometry (y = 0.07 m, 0.12 m track, 0.6 kg) so the
      Integrator''s larger-ki controller is the only change, as their feedback asks.
      The slalom signature (max_error near 0.063 m, progress near 0.3, line losses
      near 1 per run) meets the wheel_track trigger, which is queued for the next
      geometry step.


      ### Rationale


      Iteration 8 is the best race so far at 673.8. Oval and s-bend both complete
      20 of 20, with s-bend max_error at 0.0187 m. The slalom still fails 0 of 20,
      with progress 0.32, max_error 0.0635 m and 1.05 line-loss events per run. The
      Integrator''s feedback says ki is near saturation, so the controller gains are
      flattening. Iteration 5 showed that y = 0.06 to 0.07 m gave no slalom gain,
      so look-ahead is saturated. Line losses stay well under the 2-per-run widening
      trigger, so the spread of +/-0.024 m is not the limit. The Integrator asks me
      to hold the geometry this iteration, so the larger-ki candidate is the only
      variable. I am taking that advice. I considered testing wheel_track of 0.10
      m now, as their conditional trigger suggests, but that would confound the controller
      result in the same race. The trigger conditions for wheel_track are met (max_error
      near 0.063 m, progress near 0.3, line losses near 1 per run), so I am planning
      that test for the next geometry step, when the controller baseline is clean.
      The body, mass and sensor size are not limits, and body width cannot widen the
      0.06 m off-track floor, so I am not changing them. I state no outcome for the
      geometry itself this iteration.


      - [Open this output](iteration-9/entity0/versions/c1fe299500e74700a2c0c3fd41060bd9/payload.json)

      - Based on: [entityR1](iteration-9/entityR1/versions/carried-22eb972d3cf9f852/payload.json),
      [entityR2A](iteration-9/entityR2A/versions/carried-29102304d7d60162/payload.json)'
  - id: entity1
    label: Complete Robot Package
    notes: 'Complete Robot Package. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 8 is the best race so far (673.8). Oval and s-bend both complete 20
      of 20. The slalom still fails 0 of 20, with progress 0.32, max_error 0.0635
      m and 1.05 line-loss events per run. The Builder''s iteration-9 geometry is
      the same as iteration 8, so the geometry is held and only the controller changes.


      The integral term is near saturation. Raising ki from 0.4 to 0.7 added only
      about 0.26 to the score, and slalom progress moved from about 0.319 to 0.320.
      Line losses are about 1 per run, well below the 2-per-run widening trigger,
      so sensing is not the limit. Look-ahead was saturated at y = 0.07 m in iteration
      5. The remaining slalom failure looks like reaction on the reversal.


      The one controller change I make is kp from 2.4 to 2.8, to add correction per
      unit of signal on the reversal. kd stays at 0.8 to damp the extra gain, since
      oval oscillation is 0.19 and s-bend is 0.29, and iteration 1 showed that gain
      without damping raised oscillation. ki stays at 0.7, base_speed 1.3 and last_direction
      line loss are unchanged. I expect slalom max_error to fall toward 0.06 m with
      oval and s-bend completion holding. This is a hypothesis, not a measured result.
      The main risk is oscillation on the s-bend, which would show as lower completion.


      - [Open this output](iteration-9/entity1/versions/b3ea7a5abd6744f6b5959c95faa38c1c/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/c1fe299500e74700a2c0c3fd41060bd9/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-29102304d7d60162/payload.json)'
  - id: entityR1
    label: Integration Feedback
    notes: 'Integration Feedback. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Feedback


      Iteration 8 (ki 0.7, y = 0.07 m, 0.6 kg) is the best race so far at 673.8. Iteration
      7 to 8 raised ki from 0.4 to 0.7 and added only about 0.26 to the score, with
      slalom progress flat near 0.32 (iterations 7 and 8 outcome tables). The integral
      term is saturated, so I do not recommend pushing ki further. Iteration 4 showed
      ki helped (slalom progress 0.198 to 0.278), so the motor-mismatch bias was real,
      but it is now largely corrected. Line losses stay near 1 per run, far below
      the 2-per-run widening threshold, and iteration 5 showed that y = 0.07 m gives
      no slalom gain. So the limit is the reaction on the reversal. Your geometry
      is held this iteration, and the controller is testing a higher kp to see whether
      more correction per unit signal helps. I state no outcome for this candidate.


      For the next geometry step: if the slalom still fails at max_error near 0.063
      m with progress near 0.32 and line losses near 1 per run after this race, test
      wheel_track of about 0.10 m with y = 0.07 m, as you planned. Do not move y further
      forward. If slalom line losses rise above about 2 per run with progress below
      0.2, widen the spread to x = +/-0.032 m at y = 0.07 m. If oval or s-bend completion
      falls below 20 of 20 and 18 of 20, revert to y = 0.06 m.


      ### Requested changes


      - Hold the geometry at y = 0.07 m, x = +/-0.024 m, 12 mm footprint, 0.12 m track,
      0.03 m wheels, 0.16 by 0.14 m body and 0.6 kg mass for the next race, so the
      controller change is the only variable.

      - If the slalom still fails at max_error near 0.063 m with progress near 0.32
      after this race, test wheel_track of about 0.10 m next, keeping y = 0.07 m and
      the spread unchanged.

      - If slalom line losses rise above about 2 per run with progress below 0.2,
      widen the spread to x = +/-0.032 m at y = 0.07 m with five sensors.


      - [Open this output](iteration-9/entityR1/versions/b3ea7a5abd6744f6b5959c95faa38c1c/payload.json)

      - Based on: [entity0](iteration-9/entity0/versions/c1fe299500e74700a2c0c3fd41060bd9/payload.json),
      [entityR2B](iteration-9/entityR2B/versions/carried-29102304d7d60162/payload.json)'
