map:
  id: race-218-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 8
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 7.
dimensions:
  time_horizon: prepared
  iteration: '8'
overrides:
  entities:
  - id: entity0
    label: Geometry Proposal
    notes: 'Geometry Proposal. The model did not supply a valid label and summary,
      so the orchestrator wrote this one.


      ### Rationale


      Iteration 7 (y = 0.07 m, x = ±0.024 m, 0.6 kg, 0.12 m track) scored 673.6, the
      best so far. Oval and s-bend both complete 20 of 20. The slalom still fails
      0 of 20, with progress 0.3185, max_error 0.0632 m and 1.0 line-loss events per
      run. Those numbers match the Integrator''s trigger for a wheel_track test (progress
      near 0.3, max_error near 0.063 m, line losses near 1 per run), so the trigger
      condition is met. The Integrator also asked that the controller change be tested
      with geometry held, and that wheel_track only be tested after that controller
      race has been separated out. This iteration carries the Integrator''s larger-ki
      controller candidate. Changing wheel_track now would confound that result, so
      I am taking their sequencing advice and holding the geometry exactly as in iterations
      5 to 7. I am deferring the wheel_track test (0.10 m) to the next geometry step,
      when it can be read against a clean controller baseline. Line losses are far
      below the 2-per-run widening threshold, and the sensor spread is not the limit.
      The body and mass are not constraints, and the off-track limit stays at its
      0.06 m floor. I expect oval and s-bend to hold at 20 of 20 and the slalom to
      stay limited by reversal reaction unless the ki change helps it. I am not stating
      a score outcome for the controller change.


      - [Open this output](iteration-8/entity0/versions/a21eff0d775a457eb2f49bdc292b9ab8/payload.json)

      - Based on: [entityR1](iteration-8/entityR1/versions/carried-7f5fedd0ecb09d4a/payload.json),
      [entityR2A](iteration-8/entityR2A/versions/carried-adb7243707ebda1c/payload.json)'
  - id: entity1
    label: Integral gain 0.4 (ki)
    notes: 'Same geometry as iteration 6, with the controller''s only change being
      ki raised from 0.2 to 0.4 to counter the fixed motor mismatch. Iteration 4''s
      ki increase raised slalom progress from 0.198 to 0.278, which is the evidence
      this rests on.


      ### Rationale


      Iteration 6 is the best race so far at 670.5. Oval (20/20) and s-bend (20/20)
      both complete, and the slalom still fails 0/20 with progress 0.30, max_error
      0.063 m (just above the 0.06 m limit) and 1.05 line-loss events per run. The
      Builder held geometry at y = 0.07 m, x = ±0.024 m, 0.6 kg, which matches the
      iteration-6 geometry and the Integrator''s plan. Line losses are far below the
      2-per-run widening trigger, and iteration 5 showed that extra look-ahead gives
      no slalom gain, so geometry is not the limit. The only controller term that
      has moved slalom progress is the integral term: iteration 4 added ki = 0.2 and
      slalom progress rose from 0.198 to 0.278, while the motor mismatch in the contract
      is a steady bias that a small ki only partly removes. This race therefore raises
      ki from 0.2 to 0.4 and keeps kp 2.4, kd 0.8, base_speed 1.3 and last_direction
      line loss, so ki is the only controller change. Integral windup is limited to
      ±2, and oval and s-bend oscillation (0.18 and 0.30) leave some margin. I expect
      slalom max_error to move toward 0.06 m and progress to rise, with oval and s-bend
      completion holding. This is a hypothesis, not a measured result. The main risk
      is overshoot after bends from the larger integral, which would show as lower
      s-bend completion or higher oscillation.


      - [Open this output](iteration-7/entity1/versions/00024fe007e547da899778964b3ed8bf/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/d2d6701ec81f44489713dd1246af0187/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-3d744c8888864a7f/payload.json)'
  - id: entityR1
    label: Hold geometry, test
    notes: 'Holds the y = 0.07 m geometry because look-ahead is saturated (iteration
      5). It sets out the next geometry lever (wheel_track about 0.10 m) and the spread
      and revert triggers, conditional on the next race.


      ### Feedback


      Iteration 6 (geometry y = 0.07 m, kd 0.8) is the best race so far at 670.5.
      The oval and s-bend both complete 20/20, but the slalom still fails 0/20 with
      progress 0.30, max_error 0.063 m and 1.05 line losses per run. Iteration 5 showed
      that moving y from 0.06 to 0.07 m gave no slalom gain, so look-ahead is saturated
      and I do not recommend moving y further forward. Line losses stay under 2 per
      run, so the spread of ±0.024 m is not the limit. Iteration 4 showed that the
      integral term (ki 0.2) raised slalom progress from 0.198 to 0.278, which points
      to the motor-mismatch bias as a real part of the slalom drift. The controller
      is therefore testing a larger ki this iteration, with your geometry held. I
      state no outcome for this candidate. For the next geometry step: if the slalom
      still fails at max_error near 0.063 m with progress around 0.3 and line losses
      near 1 per run, test wheel_track of about 0.10 m to see whether a narrower track
      speeds the reversal, keeping y = 0.07 m. If slalom line losses rise above about
      2 per run with progress below 0.2, widen the spread to ±0.032 m at y = 0.07
      m. If oval or s-bend completion falls below 20/20 and 18/20, revert to y = 0.06
      m.


      ### Requested changes


      - Hold the geometry at y = 0.07 m, x = ±0.024 m, 12 mm footprint, 0.12 m track,
      0.03 m wheels, 0.16 by 0.14 m body and 0.6 kg mass, so the controller change
      is the only variable.

      - If the slalom still fails at max_error near 0.063 m with progress around 0.3
      and line losses near 1 per run, test wheel_track of about 0.10 m next, keeping
      y = 0.07 m.

      - If slalom line losses rise above about 2 per run with progress below 0.2,
      widen the spread to x = ±0.032 m at y = 0.07 m, with five sensors.


      - [Open this output](iteration-7/entityR1/versions/00024fe007e547da899778964b3ed8bf/payload.json)

      - Based on: [entity0](iteration-7/entity0/versions/d2d6701ec81f44489713dd1246af0187/payload.json),
      [entityR2B](iteration-7/entityR2B/versions/carried-3d744c8888864a7f/payload.json)'
