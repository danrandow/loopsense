map:
  id: race-218-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: Hold geometry for final
    notes: 'Holds the iteration-10 geometry (y = 0.07 m, ±0.024 m spread, 0.6 kg)
      so the kd change is the only variable and the final design keeps oval and s-bend
      at 20/20. Wheel_track 0.10 m is deferred as untested because no later race can
      check it, and it rests on the slalom progress trend (0.33 to 0.55) and line-loss
      counts below 2 per run.


      ### Rationale


      Iteration 10 (y = 0.07 m, x = ±0.024 m, 0.6 kg, 0.12 m track) is the best race
      so far at 703.4, and the Integrator''s controller changes have moved the score
      up without changing geometry. Oval and s-bend both complete 20 of 20. The slalom
      still fails 0 of 20, with progress 0.545 and max_error 0.0629 m. That is the
      best slalom progress yet, and it is just above the 0.06 m off-track limit. Line
      losses on the slalom are 1.1 per run, far below the 2-per-run trigger for widening
      the spread. The evidence therefore still points to reversal reaction rather
      than sensing or look-ahead.


      I am holding the geometry this iteration, as the Integrator asked, so the kd
      1.0 controller change is the only variable. I considered the wheel_track 0.10
      m step their plan names for iteration 11. The evidence supports testing it:
      the slalom signature matches the trigger, and the trigger conditions are now
      met. But this is the final iteration, so no later race can read it against a
      clean baseline. A narrower track would change turn rate on the oval and s-bend,
      where completion is currently 20 of 20. An untested change there could cost
      the final unseen-track race, which is scored once, with no chance to check it.
      The safer choice for the final design is the geometry that completes both tracks
      reliably.


      I took the Integrator''s advice on the geometry. The Integrator''s point on
      look-ahead stands: y = 0.07 m is saturated, so I am not moving it. The spread
      stays at ±0.024 m, because line losses are below the widening trigger. Mass
      (0.6 kg), body and sensor size are unchanged, because none of their triggers
      fires and body width cannot widen the off-track floor. I expect oval and s-bend
      to hold at 20 of 20, and I expect the slalom to move only with the kd change.
      I state no score outcome for the controller.


      - [Open this output](iteration-11/entity0/versions/4711f74f3832411088bd47e101038fc4/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-5d9d64a20a54ea39/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-6bb7b20489419e6b/payload.json)'
  - id: entity1
    label: 'Final robot: iter-10'
    notes: 'Holds the iteration-10 geometry and controller unchanged (score 703.4,
      best so far), because this is the design carried to the unseen track and an
      untested change cannot be checked. Oval and s-bend both finish 20 of 20 in that
      race.


      ### Rationale


      This is the final iteration, so this package is the design carried into the
      unseen-track evaluation, and it must be the most reliable controller I have.
      Iteration 10 (kp 2.8, ki 0.7, kd 1.0, base_speed 1.3, last_direction) is the
      best race so far at 703.4. Oval and s-bend both complete 20 of 20. The slalom
      still fails 0 of 20, with progress 0.545 and max_error 0.0629 m, the best slalom
      progress yet. Iteration 9 to 10 changed only kd, from 0.8 to 1.0, and the score
      rose by 28.5. Earlier gains were flattening (ki 0.4 to 0.7 and kp 2.4 to 2.8
      each moved the slalom only a little), and the kd step is the one that produced
      the new slalom progress.


      The Builder''s geometry for this iteration is identical to iteration 10: five
      sensors at y = 0.07 m, x = ±0.024 m, 12 mm footprint, 0.12 m track, 0.03 m wheels,
      0.16 by 0.14 m body, 0.6 kg. I checked the Builder''s intent against the evidence.
      Holding the geometry is the right call for a final, unrepeatable race. The wheel_track
      0.10 m step is untested and would change turn rate on the oval and s-bend, where
      completion is currently 20 of 20. Line losses stay near 1 per run, far below
      the 2-per-run spread trigger, so no spread change is justified.


      I therefore keep the iteration-10 controller exactly, rather than adding an
      untested gain change. Any change now would be unverifiable before the unseen-track
      race, and the proven controller is the safest choice. I expect oval and s-bend
      to hold at 20 of 20 and the slalom to show progress similar to iteration 10.
      I state no measured outcome for this package.


      - [Open this output](iteration-11/entity1/versions/53d9d493f4ea42cea2878ed7d3972325/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/4711f74f3832411088bd47e101038fc4/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-6bb7b20489419e6b/payload.json)'
  - id: entityR1
    label: Hold geometry for final
    notes: 'Feedback written before the final race: it holds the geometry, cites the
      kd 0.8 to 1.0 slalom gain (progress 0.331 to 0.545) and the flattening of kp
      and ki, and records the untested wheel_track 0.10 m lever for reference only,
      since no later iteration follows.


      ### Feedback


      Written before this candidate races, and the candidate is the final design.
      Iteration 10 (kd 1.0 with your y = 0.07 m, x = ±0.024 m, 0.6 kg, 0.12 m track
      geometry) is the best race at 703.4. Oval and s-bend both complete 20 of 20.
      The slalom still fails 0 of 20, but its progress rose to 0.545 from 0.331 in
      iteration 9 (iteration 9 and 10 outcome tables), so the damping term was the
      lever that moved it. Iterations 5 and 8 to 9 show that look-ahead and the integral
      and proportional gains are now flattening, and line losses stay near 1 per run
      (iteration 10 table), far below the 2-per-run spread trigger. Your decision
      to hold the geometry this iteration is correct. A wheel_track change now would
      be untestable before the unseen-track race, and it would change turn rate on
      the oval and s-bend, where completion is 20 of 20. I state no outcome for the
      current candidate. Because no further iteration follows, the requested changes
      below are recorded for the record only: if a later race were possible, the first
      test should be wheel_track of about 0.10 m with y = 0.07 m and the spread unchanged,
      followed by a revert to y = 0.06 m if oval or s-bend completion fell below 20
      of 20 and 18 of 20.


      ### Requested changes


      - Hold the iteration-10 geometry unchanged for this final race (five sensors
      at y = 0.07 m, x = ±0.024 m, 12 mm footprint, 0.12 m track, 0.03 m wheels, 0.16
      by 0.14 m body, 0.6 kg), since it is the design carried to the unseen track.

      - If any further iteration were available, test wheel_track of about 0.10 m
      with y = 0.07 m and the spread unchanged, against the iteration-10 controller
      as a clean baseline.

      - If oval or s-bend completion fell below 20 of 20 and 18 of 20 in a later test,
      revert to y = 0.06 m rather than changing the spread or body.


      - [Open this output](iteration-11/entityR1/versions/53d9d493f4ea42cea2878ed7d3972325/payload.json)

      - Based on: [entity0](iteration-11/entity0/versions/4711f74f3832411088bd47e101038fc4/payload.json),
      [entityR2B](iteration-11/entityR2B/versions/carried-6bb7b20489419e6b/payload.json)'
