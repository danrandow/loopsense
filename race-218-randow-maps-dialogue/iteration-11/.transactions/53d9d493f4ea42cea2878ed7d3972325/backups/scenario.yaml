map:
  id: race-218-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 11
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 10.
dimensions:
  time_horizon: prepared
  iteration: '11'
overrides:
  entities:
  - id: entity0
    label: Hold geometry for final
    notes: 'Holds the iteration-10 geometry (y = 0.07 m, ±0.024 m spread, 0.6 kg)
      so the kd change is the only variable and the final design keeps oval and s-bend
      at 20/20. Wheel_track 0.10 m is deferred as untested because no later race can
      check it, and it rests on the slalom progress trend (0.33 to 0.55) and line-loss
      counts below 2 per run.


      ### Rationale


      Iteration 10 (y = 0.07 m, x = ±0.024 m, 0.6 kg, 0.12 m track) is the best race
      so far at 703.4, and the Integrator''s controller changes have moved the score
      up without changing geometry. Oval and s-bend both complete 20 of 20. The slalom
      still fails 0 of 20, with progress 0.545 and max_error 0.0629 m. That is the
      best slalom progress yet, and it is just above the 0.06 m off-track limit. Line
      losses on the slalom are 1.1 per run, far below the 2-per-run trigger for widening
      the spread. The evidence therefore still points to reversal reaction rather
      than sensing or look-ahead.


      I am holding the geometry this iteration, as the Integrator asked, so the kd
      1.0 controller change is the only variable. I considered the wheel_track 0.10
      m step their plan names for iteration 11. The evidence supports testing it:
      the slalom signature matches the trigger, and the trigger conditions are now
      met. But this is the final iteration, so no later race can read it against a
      clean baseline. A narrower track would change turn rate on the oval and s-bend,
      where completion is currently 20 of 20. An untested change there could cost
      the final unseen-track race, which is scored once, with no chance to check it.
      The safer choice for the final design is the geometry that completes both tracks
      reliably.


      I took the Integrator''s advice on the geometry. The Integrator''s point on
      look-ahead stands: y = 0.07 m is saturated, so I am not moving it. The spread
      stays at ±0.024 m, because line losses are below the widening trigger. Mass
      (0.6 kg), body and sensor size are unchanged, because none of their triggers
      fires and body width cannot widen the off-track floor. I expect oval and s-bend
      to hold at 20 of 20, and I expect the slalom to move only with the kd change.
      I state no score outcome for the controller.


      - [Open this output](iteration-11/entity0/versions/4711f74f3832411088bd47e101038fc4/payload.json)

      - Based on: [entityR1](iteration-11/entityR1/versions/carried-5d9d64a20a54ea39/payload.json),
      [entityR2A](iteration-11/entityR2A/versions/carried-6bb7b20489419e6b/payload.json)'
  - id: entity1
    label: 'Robot: kd 1.0 on iter 9'
    notes: 'Same geometry as the Builder''s held iteration 10 proposal, with the best
      iteration 9 controller and kd raised from 0.8 to 1.0 as the single change. Chosen
      because kp and ki gains have flattened near slalom progress 0.33 with max_error
      about 0.063 m.


      ### Rationale


      Iteration 9 (kp 2.8) is the best race so far at 674.9. Raising kp from 2.4 to
      2.8 moved slalom progress only from 0.3196 to 0.3309 and left max_error at 0.0634
      m, so kp is saturated. The Builder holds the iteration 9 geometry (five sensors
      at y = 0.07 m, x = ±0.024 m, 0.6 kg, 0.12 m track), which is what I integrate.
      The slalom still fails 0 of 20 with max_error just above 0.06 m and about 1.1
      line-loss events per run. Line losses are far below the 2-per-run spread trigger,
      and y = 0.07 m showed no further slalom gain in iteration 5, so the limit looks
      like reaction on the reversal. For this race I keep the iteration 9 gains and
      change one term: kd from 0.8 to 1.0. The aim is to damp overshoot on the reversal
      without raising kp, which earlier raised oscillation. Oval oscillation is 0.20
      and s-bend is 0.30, so there is some margin. The main risk is a slower reversal,
      which would lower slalom progress. This is a hypothesis, not a measured result.


      - [Open this output](iteration-10/entity1/versions/4d6340caafd447f199d56e88de56650f/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/b7611bf7382046c693075a13fd15a893/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-d932d51a38926659/payload.json)'
  - id: entityR1
    label: Hold geometry, test
    notes: 'Feedback asks the Builder to hold geometry for this controller-only race.
      It names wheel_track 0.10 m as the next lever if slalom max_error stays near
      0.063 m. Evidence is the saturation of ki and kp in iterations 7 to 9 and the
      flat y = 0.07 m result in iteration 5.


      ### Feedback


      Written before this candidate races. The evidence supports holding the geometry
      this iteration. Iteration 5 showed that y = 0.07 m gave no slalom gain over
      y = 0.06 m (slalom max_error stayed at 0.063 m, progress 0.260 to 0.278), so
      look-ahead is saturated. Iterations 7 to 9 showed the integral and proportional
      gains are flattening: ki 0.4 to 0.7 moved slalom progress only from about 0.319
      to 0.320 (iterations 7 and 8), and kp 2.4 to 2.8 moved it from 0.320 to 0.331
      with max_error unchanged at about 0.063 m (iterations 8 and 9). Line losses
      stay near 1 per run, far below the 2-per-run spread trigger. So the controller
      is near its limit, and the remaining failure looks like reversal reaction. I
      am testing a single controller change (kd up to 1.0) with your geometry held,
      which gives a clean baseline for the next step. I state no outcome for this
      candidate. For the next geometry step: if the slalom still fails at max_error
      near 0.063 m with progress near 0.33 after this race, test wheel_track of about
      0.10 m at y = 0.07 m with the spread unchanged, as you planned. Do not move
      y further forward. If slalom line losses rise above about 2 per run with progress
      below 0.2, widen the spread to x = ±0.032 m. If oval or s-bend completion falls
      below 20 of 20 and 18 of 20, revert to y = 0.06 m.


      ### Requested changes


      - Hold the geometry at y = 0.07 m, x = ±0.024 m, 12 mm footprint, 0.12 m track,
      0.03 m wheels, 0.16 by 0.14 m body and 0.6 kg mass for this race, so the controller
      change is the only variable.

      - If the slalom still fails at max_error near 0.063 m with progress near 0.33
      after this race, test wheel_track of about 0.10 m with y = 0.07 m and the spread
      unchanged in the next geometry step, since it is the remaining untested lever.

      - If slalom line losses rise above about 2 per run with progress below 0.2,
      widen the spread to x = ±0.032 m at y = 0.07 m with five sensors.


      - [Open this output](iteration-10/entityR1/versions/4d6340caafd447f199d56e88de56650f/payload.json)

      - Based on: [entity0](iteration-10/entity0/versions/b7611bf7382046c693075a13fd15a893/payload.json),
      [entityR2B](iteration-10/entityR2B/versions/carried-d932d51a38926659/payload.json)'
