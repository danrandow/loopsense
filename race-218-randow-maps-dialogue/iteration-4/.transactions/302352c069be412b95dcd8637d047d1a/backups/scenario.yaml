map:
  id: race-218-randow-maps-dialogue
  schema: v0.2
  scenario: Iteration 4
  inherits: base.yaml
  notes: Authoritative state carried forward after iteration 3.
dimensions:
  time_horizon: prepared
  iteration: '4'
overrides:
  entities:
  - id: entity0
    label: Hold 0.6 kg, test
    notes: 'Holds the best-scoring 0.6 kg geometry (575.8) unchanged so the controller
      is the only variable. None of the Integrator''s trigger rules fired, and the
      slalom still fails at max_error 0.0645 m, so the next geometry test is y = 0.07
      m if that persists.


      ### Rationale


      Iteration 3 (mass 0.6 kg, otherwise unchanged) is the best race so far at 575.8,
      up from 501.2. The oval still completes 20 of 20 and its oscillation fell to
      0.21 from 0.21 (no change worth acting on). The s-bend completes 12 of 20 (up
      from 6), and its max_error is 0.0447 m. The slalom still fails 0 of 20, with
      progress 0.1975 and max_error 0.0645 m, just above the 0.06 m off-track limit,
      and line losses at 1.0 per run.


      I checked the Integrator''s trigger rules against this race. (a) Widen the spread
      to ±0.032 m only if slalom line losses exceed about 2 per run with progress
      below 0.2. Line losses are 1.0, so this does not fire. (b) Revert toward 0.8
      kg only if s-bend completion falls below 0.3. It is 0.6, so this does not fire.
      (c) Keep 0.6 kg if oval oscillation falls below about 0.15 and slalom max_error
      reaches 0.06 m or less. Neither condition is met, but the mass change still
      improved the score and the s-bend, and the Integrator''s controller was also
      changed in this iteration, so I read the result as the best available evidence
      for 0.6 kg rather than a failure of it. The body is still not a lever: its width
      sets the off-track limit at the 0.06 m floor.


      I am keeping the geometry unchanged. The main unresolved lever is the slalom''s
      late reaction (max_error just above the limit with few line losses). The look-ahead
      change from y = 0.04 to 0.06 m helped in iteration 1, so a further forward move
      to y = 0.07 m is the next candidate, but changing it now would confound the
      controller changes the Integrator is making. I will hold the 0.6 kg geometry
      this iteration, so that the controller is the only changing variable, and test
      y = 0.07 m next if slalom max_error stays at or above 0.06 m.


      - [Open this output](iteration-4/entity0/versions/543811d5771d400181fe22e9a18df254/payload.json)

      - Based on: [entityR1](iteration-4/entityR1/versions/carried-d3005ab81fa0b6cd/payload.json),
      [entityR2A](iteration-4/entityR2A/versions/carried-05c8da6d8ca26589/payload.json)'
  - id: entity1
    label: Add ki, raise kd (0.6)
    notes: 'Holds the iteration-3 geometry and adds ki 0.2 for the fixed motor-mismatch
      bias and kd 0.6 to damp the 0.21 oval oscillation. Evidence is the iteration-3
      slalom max_error of 0.0645 m with only 1 line loss per run.


      ### Rationale


      Iteration 3 (0.6 kg geometry with the iteration-2 controller) is the best race
      so far at 575.8. The oval completes 20 of 20 but its steering oscillation is
      0.21, above the roughly 0.15 level I flagged. The s-bend completes 12 of 20
      with 8 off-track ends. The slalom still fails 20 of 20, with max_error 0.0645
      m and progress 0.1975. Line losses are 1.0 per run, so sensing is not the limit.


      The geometry is held exactly as iteration 3, so this race isolates controller
      changes. I make two small controller changes. (1) kd rises from 0.5 to 0.6 to
      damp the oval oscillation (0.21) without raising kp, since kp increases have
      previously raised oscillation. (2) ki is set to 0.2. The contract describes
      a fixed left/right motor mismatch in every race. A constant mismatch produces
      a steady bias in the signal that proportional and derivative terms cannot remove,
      so a small integral term should cut the slalom''s drift toward the 0.06 m limit.
      The integral is already clamped to +/-2, which limits windup on bends. kp stays
      at 2.4, base_speed at 1.3 and line_loss at last_direction, because line losses
      are low and the sign convention is verified.


      Expected, not measured: oval oscillation falls below about 0.18, slalom max_error
      falls toward or below 0.06 m, and oval and s-bend completion hold. The main
      risk is that ki causes overshoot after bends. If the slalom gets worse with
      ki, the next step is to set ki back to 0 and test the geometry lever.


      - [Open this output](iteration-4/entity1/versions/31584ce4e489413681ca6f9bfc76d55c/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/543811d5771d400181fe22e9a18df254/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-05c8da6d8ca26589/payload.json)'
  - id: entityR1
    label: Hold geometry, next
    notes: 'Advises holding the 0.6 kg geometry and tying the next step to the slalom
      max_error and line-loss triggers from iteration 3. It also gives the spread
      and mass fallbacks if the s-bend or line losses regress.


      ### Feedback


      Iteration 3 (0.6 kg, otherwise the iteration-2 geometry) is the best race so
      far at 575.8, up from 501.2. The oval still completes 20 of 20, and the s-bend
      completion held at 12 of 20, so the mass change did not hurt the s-bend. The
      slalom still fails 20 of 20, with max_error 0.0645 m and progress 0.1975. Its
      line losses are 1.0 per run, so the spread of +/-0.024 m is not limiting. Oval
      oscillation stayed at 0.21, so yaw inertia alone did not cut it. This suggests
      the controller''s damping and steady bias matter too, so I am changing controller
      terms this iteration and holding your geometry. Expected, not measured: your
      hypothesis that slalom max_error stays near 0.06 m with line losses at or below
      2 per run looks consistent with the data so far. For the next geometry, if the
      slalom max_error is still at or above 0.06 m with line losses at or below 2
      per run after this race, the forward offset y = 0.07 m (spread unchanged) is
      the next lever, as you planned. If slalom line losses rise above about 2 per
      run with progress below 0.2, widen the spread to x = +/-0.032 m. If s-bend completion
      drops below 0.3, revert mass to 0.8 kg, since the 0.6 kg result is only a small
      improvement and the s-bend is the track most sensitive to it.


      ### Requested changes


      - Hold the geometry as iteration 3 (five sensors at y = 0.06 m, x = +/-0.024
      m, 12 mm footprint, 0.12 m track, 0.03 m wheels, 0.6 kg) and test y = 0.07 m
      next only if the slalom max_error is still at or above 0.06 m with line losses
      at or below 2 per run.

      - If slalom line_loss_events rise above about 2 per run with slalom progress
      below 0.2, widen the spread to x = +/-0.032 m with five sensors and keep y as
      it is.

      - If s-bend completion falls below 0.3 at 0.6 kg, revert mass to 0.8 kg before
      adding spread, because the s-bend completed most often under the 0.8 kg design.


      - [Open this output](iteration-4/entityR1/versions/31584ce4e489413681ca6f9bfc76d55c/payload.json)

      - Based on: [entity0](iteration-4/entity0/versions/543811d5771d400181fe22e9a18df254/payload.json),
      [entityR2B](iteration-4/entityR2B/versions/carried-05c8da6d8ca26589/payload.json)'
